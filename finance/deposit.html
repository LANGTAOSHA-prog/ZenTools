<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title data-i18n="pageTitle">存款利息计算器 - ZenTools</title><meta name="description" content="ZenTools 免费存款利息计算器，计算定期存款和理财收益。"><link rel="stylesheet" href="../assets/css/style.css"><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1955887568822472" crossorigin="anonymous"></script><style>:root{--bg:#0f172a;--card:#111827;--border:#1f2937;--text:#f3f4f6;--muted:#94a3b8;--blue:#2563eb;--green:#10b981}*{margin:0;padding:0;box-sizing:border-box}body{background:var(--bg);color:var(--text);font-family:Arial,"Noto Sans SC",sans-serif;line-height:1.7}.container{max-width:900px;margin:auto;padding:40px 20px}a{color:#60a5fa}.top-bar{display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap;margin-bottom:20px}.lang-select{background:#111827;color:white;border:1px solid #334155;border-radius:10px;padding:10px 12px;font-size:13px}.card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:28px}h1{margin-bottom:15px}.desc{color:var(--muted);margin-bottom:25px}.ad-box{margin:25px 0;height:110px;border:2px dashed #334155;border-radius:18px;display:flex;align-items:center;justify-content:center;color:#64748b}input,select{width:100%;margin:10px 0;padding:14px;border-radius:12px;border:1px solid #334155;background:#0f172a;color:white;font-size:16px}button{background:var(--blue);color:white;border:none;padding:13px 18px;border-radius:12px;cursor:pointer;font-size:15px;font-weight:bold;margin:6px 6px 6px 0}.green{background:var(--green)}.result-box{background:rgba(16,185,129,0.08);border:1px solid var(--green);border-radius:14px;padding:20px;margin:15px 0;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}.result-item{text-align:center}.result-item .val{font-size:22px;font-weight:bold;color:var(--green)}.result-item .lbl{font-size:12px;color:var(--muted);margin-top:4px}.radios{display:flex;gap:15px;flex-wrap:wrap;margin:10px 0}.radios label{display:flex;align-items:center;gap:6px;cursor:pointer}.radios input{width:auto;margin:0}table{width:100%;border-collapse:collapse;margin:10px 0;font-size:14px}th,td{padding:8px 10px;text-align:right;border-bottom:1px solid var(--border)}th{color:var(--muted);font-weight:normal}td{color:var(--text)}footer{margin-top:50px;text-align:center;color:#94a3b8}@media(max-width:768px){button,.lang-select{width:100%}}</style></head><body><div class="container"><div class="top-bar"><a href="../index.html" data-i18n="back">← 返回首页</a><select id="langSelect" class="lang-select"><option value="zh">中文</option><option value="en">English</option><option value="ja">日本語</option><option value="vi">Tiếng Việt</option></select></div><div class="card"><h1 data-i18n="pageTitle">存款利息计算器</h1><p class="desc" data-i18n="pageDesc">计算定期存款和理财产品到期收益。</p><div class="ad-box" data-i18n="ad">广告位（Google AdSense）</div><input type="number" id="depAmount" placeholder="存款金额（元）" value="100000"><input type="number" id="depRate" placeholder="年利率（%）" value="2.5" step="0.05"><input type="number" id="depYears" placeholder="存款年限" value="3"><div class="radios"><label><input type="radio" name="method" value="simple" checked> <span data-i18n="simple">单利</span></label><label><input type="radio" name="method" value="compound"> <span data-i18n="compound">复利</span></label></div><button onclick="calcDeposit()" data-i18n="calc">开始计算</button><div id="result" style="display:none"><div class="result-box"><div class="result-item"><div class="val" id="interestVal">0</div><div class="lbl" data-i18n="interest">利息收益（元）</div></div><div class="result-item"><div class="val" id="totalVal">0</div><div class="lbl" data-i18n="total">本息合计（元）</div></div><div class="result-item"><div class="val" id="rateVal">0%</div><div class="lbl" data-i18n="annualRate">年化收益率</div></div></div><div id="yearTable" style="max-height:350px;overflow-y:auto"></div></div></div><footer>© 2026 ZenTools</footer></div><script>
const pageT={zh:{pageTitle:'存款利息计算器',pageDesc:'计算定期存款和理财产品到期收益。',ad:'广告位',back:'← 返回首页',calc:'开始计算',simple:'单利',compound:'复利',interest:'利息收益（元）',total:'本息合计（元）',annualRate:'年化收益率'},en:{pageTitle:'Deposit Interest Calculator',pageDesc:'Calculate fixed deposit and investment returns.',ad:'Ad Space',back:'← Back',calc:'Calculate',simple:'Simple Interest',compound:'Compound Interest',interest:'Interest',total:'Total Amount',annualRate:'Annual Return'},ja:{pageTitle:'預金利息計算機',pageDesc:'定期預金の利息を計算。',ad:'広告',back:'← 戻る',calc:'計算',simple:'単利',compound:'複利',interest:'利息',total:'合計金額',annualRate:'年利'},vi:{pageTitle:'Máy tính lãi suất',pageDesc:'Tính lãi suất tiền gửi.',ad:'QC',back:'← Quay lại',calc:'Tính',simple:'Lãi đơn',compound:'Lãi kép',interest:'Tiền lãi',total:'Tổng số',annualRate:'Lợi suất năm'}};
function applyLang(lang){const d=pageT[lang]||pageT.zh;document.documentElement.lang=lang==='zh'?'zh-CN':lang;document.title=d.pageTitle||document.title;document.querySelectorAll('[data-i18n]').forEach(function(el){const k=el.getAttribute('data-i18n');if(d[k])el.textContent=d[k];});localStorage.setItem('zentools_lang',lang);}
document.getElementById('langSelect').addEventListener('change',function(){applyLang(this.value);});const sl=localStorage.getItem('zentools_lang')||'zh';document.getElementById('langSelect').value=sl;applyLang(sl);
function calcDeposit(){const a=parseFloat(document.getElementById('depAmount').value)||0,r=(parseFloat(document.getElementById('depRate').value)||0)/100,y=parseFloat(document.getElementById('depYears').value)||0,method=document.querySelector('input[name="method"]:checked').value;if(!a||!y){alert('Please fill in all fields');return;}document.getElementById('result').style.display='block';let total,interest;if(method==='simple'){interest=a*r*y;total=a+interest;document.getElementById('rateVal').textContent=(r*100).toFixed(2)+'%';}else{total=a*Math.pow(1+r,y);interest=total-a;const effRate=(Math.pow(1+r,y)-1)*100;document.getElementById('rateVal').textContent=effRate.toFixed(2)+'%';}document.getElementById('interestVal').textContent=interest.toFixed(2);document.getElementById('totalVal').textContent=total.toFixed(2);let html='<table><tr><th>年份</th><th>年初本金</th><th>当年利息</th><th>年末本息</th></tr>';let bal=a;for(let i=1;i<=y;i++){const yrInt=method==='simple'?a*r:bal*r;const yrEnd=method==='simple'?a+yrInt*i:bal+yrInt;if(method==='compound')bal=yrEnd;html+='<tr><td>'+i+'</td><td>'+(method==='simple'?a.toFixed(2):(bal-yrInt).toFixed(2))+'</td><td>'+yrInt.toFixed(2)+'</td><td>'+yrEnd.toFixed(2)+'</td></tr>';}html+='</table>';document.getElementById('yearTable').innerHTML=html;}
</script></body></html>
