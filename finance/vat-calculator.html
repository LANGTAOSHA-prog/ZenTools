<script>

function calcVAT() {
  const amount = parseFloat(document.getElementById('vatAmount').value) || 0;
  const rate = parseFloat(document.getElementById('vatRate').value) / 100 || 0;
  const type = document.getElementById('vatType').value;
  let exclusive, inclusive, vat;
  if (type === 'exclude') {
    exclusive = amount;
    vat = amount * rate;
    inclusive = amount + vat;
  } else {
    inclusive = amount;
    vat = amount * rate / (1 + rate);
    exclusive = amount - vat;
  }
  const el = document.getElementById('vatResult');
  el.style.display = 'block';
  el.innerHTML =
    '<div class="row">' +
    '<div><div style="color:var(--zen-text-sub);font-size:12px;">不含税价</div><div class="highlight">' + exclusive.toFixed(2) + ' 元</div></div>' +
    '<div><div style="color:var(--zen-text-sub);font-size:12px;">增值税 (' + (rate * 100) + '%)</div><div class="highlight" style="color:#f59e0b;">' + vat.toFixed(2) + ' 元</div></div>' +
    '<div><div style="color:var(--zen-text-sub);font-size:12px;">含税价</div><div class="highlight">' + inclusive.toFixed(2) + ' 元</div></div>' +
    '</div>';
}
</script>

<script>
// 暗黑模式切换
(function() {
  var savedTheme = localStorage.getItem('zentools_theme');
  if (savedTheme === 'dark') document.documentElement.classList.add('dark');
  var btn = document.getElementById('themeToggle');
  if (btn) {
    btn.textContent = document.documentElement.classList.contains('dark') ? '☀️' : '🌙';
    btn.addEventListener('click', function() {
      document.documentElement.classList.toggle('dark');
      var isDark = document.documentElement.classList.contains('dark');
      this.textContent = isDark ? '☀️' : '🌙';
      localStorage.setItem('zentools_theme', isDark ? 'dark' : 'light');
    });
  }
})();

// 移动端侧滑
(function() {
  var overlay = document.getElementById('mobileOverlay');
  var hamBtn = document.getElementById('hamburgerBtn');
  var closeBtn = document.getElementById('mobileClose');
  if (!hamBtn || !overlay) return;
  function closeMenu() { overlay.classList.remove('open'); hamBtn.textContent = '☰'; document.body.style.overflow = ''; }
  hamBtn.addEventListener('click', function(e) {
    e.stopPropagation();
    if (overlay.classList.contains('open')) { closeMenu(); } else {
      overlay.classList.add('open'); hamBtn.textContent = '✕'; document.body.style.overflow = 'hidden';
    }
  });
  if (closeBtn) closeBtn.addEventListener('click', closeMenu);
  overlay.addEventListener('click', function(e) {
    var drawer = document.getElementById('mobileDrawer');
    if (drawer && !drawer.contains(e.target)) closeMenu();
  });
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape' && overlay.classList.contains('open')) closeMenu();
  });
})();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', function() {
    navigator.serviceWorker.register('/sw.js').catch(function() {});
  });
}
</script>
