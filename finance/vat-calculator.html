  <div class="page-header">
    <h1><span class="hl">增值税计算器</span></h1>
    <p>计算增值税（VAT），支持含税价与不含税价互相转换。</p>
  </div>
  <div class="tool-box">
    
  <div class="row">
    <div><label>金额 (元)</label><input type="number" id="vatAmount" value="10000" /></div>
    <div><label>增值税率 (%)</label>
      <select id="vatRate">
        <option value="13">13% - 一般货物</option>
        <option value="9">9% - 农产品/图书</option>
        <option value="6" selected>6% - 服务</option>
        <option value="3">3% - 小规模</option>
        <option value="0">0% - 免税</option>
      </select>
    </div>
  </div>
  <label>金额类型</label>
  <select id="vatType">
    <option value="exclude">不含税价 → 计算含税价</option>
    <option value="include">含税价 → 计算不含税价</option>
  </select>
  <div style="margin-top:16px;">
    <button class="btn" onclick="calcVAT()">计算</button>
  </div>
  <div class="result" id="vatResult" style="display:none;"></div>
  </div>
</div>
<script src="../assets/js/tool-ui.min.js"></script>
<script>

function calcVAT() {
  const amount = parseFloat(document.getElementById('vatAmount').value) || 0;
  const rate = parseFloat(document.getElementById('vatRate').value) / 100 || 0;
  const type = document.getElementById('vatType').value;
  let exclusive, inclusive, vat;
  if (type === 'exclude') {
    exclusive = amount;
    vat = amount * rate;
    inclusive = amount + vat;
  } else {
    inclusive = amount;
    vat = amount * rate / (1 + rate);
    exclusive = amount - vat;
  }
  const el = document.getElementById('vatResult');
  el.style.display = 'block';
  el.innerHTML =
    '<div class="row">' +
    '<div><div style="color:var(--muted);font-size:12px;">不含税价</div><div class="highlight">' + exclusive.toFixed(2) + ' 元</div></div>' +
    '<div><div style="color:var(--muted);font-size:12px;">增值税 (' + (rate * 100) + '%)</div><div class="highlight" style="color:#f59e0b;">' + vat.toFixed(2) + ' 元</div></div>' +
    '<div><div style="color:var(--muted);font-size:12px;">含税价</div><div class="highlight">' + inclusive.toFixed(2) + ' 元</div></div>' +
    '</div>';
}
</script>
