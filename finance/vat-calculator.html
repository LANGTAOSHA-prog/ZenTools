<script>

function calcVAT() {
  const amount = parseFloat(document.getElementById('vatAmount').value) || 0;
  const rate = parseFloat(document.getElementById('vatRate').value) / 100 || 0;
  const type = document.getElementById('vatType').value;
  let exclusive, inclusive, vat;
  if (type === 'exclude') {
    exclusive = amount;
    vat = amount * rate;
    inclusive = amount + vat;
  } else {
    inclusive = amount;
    vat = amount * rate / (1 + rate);
    exclusive = amount - vat;
  }
  const el = document.getElementById('vatResult');
  el.style.display = 'block';
  el.innerHTML =
    '<div class="row">' +
    '<div><div style="color:var(--muted);font-size:12px;">不含税价</div><div class="highlight">' + exclusive.toFixed(2) + ' 元</div></div>' +
    '<div><div style="color:var(--muted);font-size:12px;">增值税 (' + (rate * 100) + '%)</div><div class="highlight" style="color:#f59e0b;">' + vat.toFixed(2) + ' 元</div></div>' +
    '<div><div style="color:var(--muted);font-size:12px;">含税价</div><div class="highlight">' + inclusive.toFixed(2) + ' 元</div></div>' +
    '</div>';
}
</script>
