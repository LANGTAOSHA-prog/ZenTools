<script>

function calcCreditCard() {
  const balance = parseFloat(document.getElementById('ccBalance').value) || 0;
  const dailyRate = parseFloat(document.getElementById('ccDailyRate').value) / 100 || 0;
  const minPct = parseFloat(document.getElementById('ccMinPct').value) / 100 || 0.1;
  const months = parseInt(document.getElementById('ccMonths').value) || 12;
  const monthlyRate = dailyRate * 30;
  // Min payment scenario
  let remaining = balance;
  let totalMinInt = 0;
  let minMonths = 0;
  let maxIter = 200;
  while (remaining > 1 && minMonths < maxIter) {
    const minPay = Math.max(remaining * minPct, 100);
    const interest = remaining * monthlyRate;
    totalMinInt += interest;
    remaining = remaining + interest - minPay;
    minMonths++;
    if (remaining < 0) remaining = 0;
  }
  // Equal installment scenario
  let installmentMonthly = 0;
  let totalInstallInt = 0;
  if (monthlyRate > 0) {
    const factor = Math.pow(1 + monthlyRate, months);
    installmentMonthly = balance * monthlyRate * factor / (factor - 1);
    totalInstallInt = installmentMonthly * months - balance;
  } else {
    installmentMonthly = balance / months;
  }
  const el = document.getElementById('ccResult');
  el.style.display = 'block';
  el.innerHTML =
    '<div style="font-weight:700;margin-bottom:8px;">🔴 每月最低还款（' + (minPct * 100) + '%）</div>' +
    '<div>预计还清: ' + minMonths + ' 个月 (约 ' + (minMonths/12).toFixed(1) + ' 年)</div>' +
    '<div>总利息: <span style="color:#f43f5e;font-weight:700;">' + totalMinInt.toFixed(2) + ' 元</span></div>' +
    '<div style="margin:12px 0;border-top:1px solid var(--border);"></div>' +
    '<div style="font-weight:700;margin-bottom:8px;">🟢 分期还款（' + months + ' 期）</div>' +
    '<div>每月还款: <span class="highlight">' + installmentMonthly.toFixed(2) + ' 元</span></div>' +
    '<div>总利息: <span style="color:#10b981;font-weight:700;">' + totalInstallInt.toFixed(2) + ' 元</span></div>' +
    '<div style="margin-top:12px;padding-top:12px;border-top:1px solid var(--border);font-size:13px;color:var(--muted);">' +
    '💡 建议：尽早全额还款避免利息。分期比最低还款节省利息。' +
    '</div>';
}
</script>
