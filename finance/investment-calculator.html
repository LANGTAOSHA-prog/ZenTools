    <h1><span class="hl">理财计算器</span></h1>
    <p>计算复利投资的未来收益，支持每月定投和一次性投入。</p>
  </div>
  <div class="tool-box">
    
  <label>初始投入金额 (元)</label>
  <input type="number" id="initial" value="10000" min="0" />
  <div class="row">
    <div><label>每月定投 (元)</label><input type="number" id="monthly" value="1000" min="0" /></div>
    <div><label>年化收益率 (%)</label><input type="number" id="annualRate" value="8" step="0.1" /></div>
    <div><label>投资年限</label><input type="number" id="years" value="10" min="1" /></div>
  </div>
  <div style="margin-top:16px;">
    <button class="btn" onclick="calcInvestment()">计算收益</button>
  </div>
  <div class="result" id="invResult" style="display:none;"></div>
  </div>
</div>
<script src="../assets/js/tool-ui.min.js"></script>
<script>

function calcInvestment() {
  const initial = parseFloat(document.getElementById('initial').value) || 0;
  const monthly = parseFloat(document.getElementById('monthly').value) || 0;
  const rate = parseFloat(document.getElementById('annualRate').value) / 100 || 0;
  const years = parseInt(document.getElementById('years').value) || 1;
  const monthlyRate = rate / 12;
  const months = years * 12;
  // Initial compounding
  let futureInitial = initial * Math.pow(1 + monthlyRate, months);
  // Monthly investment compounding (ordinary annuity)
  let futureMonthly = 0;
  if (monthlyRate > 0) {
    futureMonthly = monthly * (Math.pow(1 + monthlyRate, months) - 1) / monthlyRate;
  } else {
    futureMonthly = monthly * months;
  }
  const total = futureInitial + futureMonthly;
  const totalInvested = initial + monthly * months;
  const earnings = total - totalInvested;
  const el = document.getElementById('invResult');
  el.style.display = 'block';
  el.innerHTML =
    '<div class="row">' +
    '<div><div style="color:var(--muted);font-size:12px;">投入本金</div><div class="highlight">' + totalInvested.toFixed(2) + ' 元</div></div>' +
    '<div><div style="color:var(--muted);font-size:12px;">总收益</div><div class="highlight" style="color:#10b981;">+' + earnings.toFixed(2) + ' 元</div></div>' +
    '<div><div style="color:var(--muted);font-size:12px;">最终金额</div><div class="highlight">' + total.toFixed(2) + ' 元</div></div>' +
    '</div>' +
    '<div style="margin-top:12px;padding-top:12px;border-top:1px solid var(--border);font-size:13px;color:var(--muted);">' +
    '年化收益率: ' + (rate * 100).toFixed(1) + '% | 投资期限: ' + years + ' 年 (' + months + ' 个月)<br/>' +
    '月收益率: ' + (monthlyRate * 100).toFixed(3) + '%' +
    '</div>';
}
</script>
