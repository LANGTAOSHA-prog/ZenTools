<script>

function calcInflation() {
  const amount = parseFloat(document.getElementById('infAmount').value) || 0;
  const rate = parseFloat(document.getElementById('infRate').value) / 100 || 0;
  const years = parseInt(document.getElementById('infYears').value) || 1;
  const futureValue = amount * Math.pow(1 + rate, years);
  const loss = futureValue - amount;
  const pctLoss = (1 - 1 / Math.pow(1 + rate, years)) * 100;
  const el = document.getElementById('infResult');
  el.style.display = 'block';
  el.innerHTML =
    '<div class="row">' +
    '<div><div style="color:var(--muted);font-size:12px;">' + years + ' 年后名义价值</div><div class="highlight">' + futureValue.toFixed(2) + ' 元</div></div>' +
    '<div><div style="color:var(--muted);font-size:12px;">实际购买力相当于</div><div class="highlight">' + amount.toFixed(2) + ' 元</div></div>' +
    '<div><div style="color:var(--muted);font-size:12px;">购买力损失</div><div class="highlight" style="color:#f43f5e;">-' + pctLoss.toFixed(1) + '%</div></div>' +
    '</div>' +
    '<div style="margin-top:12px;padding-top:12px;border-top:1px solid var(--border);font-size:13px;color:var(--muted);">' +
    '年通胀率 ' + (rate * 100).toFixed(1) + '% 下，' + years + ' 年后 ' + amount.toFixed(0) + ' 元的实际购买力仅相当于现在的 ' + (amount / futureValue * 100).toFixed(1) + '%' +
    '</div>';
}
</script>
