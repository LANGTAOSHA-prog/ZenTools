    <p>估算退休所需储蓄金额和每月需存金额，帮助规划养老。</p>

  <div class="tool-box">
    
  <div class="row">
    <div><label>当前年龄</label><input type="number" id="retAge" value="30" min="18" max="80" /></div>
    <div><label>计划退休年龄</label><input type="number" id="retTarget" value="60" min="30" max="90" /></div>
    <div><label>预期寿命</label><input type="number" id="retLifespan" value="85" min="60" max="120" /></div>
  </div>
  <div class="row">
    <div><label>退休后每月开销 (元)</label><input type="number" id="retMonthly" value="5000" /></div>
    <div><label>年化收益率 (%)</label><input type="number" id="retRate" value="5" step="0.1" /></div>
    <div><label>年通胀率 (%)</label><input type="number" id="retInfl" value="3" step="0.1" /></div>
  </div>
  <div style="margin-top:16px;">
    <button class="btn" onclick="calcRetirement()">计算</button>
  </div>
  <div class="result" id="retResult" style="display:none;"></div>
  </div>

<script src="../assets/js/tool-ui.min.js"></script>
<script>

function calcRetirement() {
  const age = parseInt(document.getElementById('retAge').value) || 30;
  const target = parseInt(document.getElementById('retTarget').value) || 60;
  const lifespan = parseInt(document.getElementById('retLifespan').value) || 85;
  const monthly = parseFloat(document.getElementById('retMonthly').value) || 5000;
  const rate = parseFloat(document.getElementById('retRate').value) / 100 || 0.05;
  const infl = parseFloat(document.getElementById('retInfl').value) / 100 || 0.03;
  const workingYears = target - age;
  const retirementYears = lifespan - target;
  if (workingYears <= 0 || retirementYears <= 0) {
    document.getElementById('retResult').style.display = 'block';
    document.getElementById('retResult').innerHTML = '<span style="color:#f43f5e;">请输入合理的年龄数值</span>';
    return;
  }
  const realRate = (1 + rate) / (1 + infl) - 1;
  const monthlyRealRate = realRate / 12;
  const retirementMonths = retirementYears * 12;
  // Total needed at retirement (present value of annuity at retirement)
  let totalNeeded = 0;
  if (monthlyRealRate > 0) {
    totalNeeded = monthly * (1 - Math.pow(1 + monthlyRealRate, -retirementMonths)) / monthlyRealRate;
  } else {
    totalNeeded = monthly * retirementMonths;
  }
  // Monthly savings needed during working years
  const workingMonths = workingYears * 12;
  let monthlySave = 0;
  if (monthlyRealRate > 0) {
    monthlySave = totalNeeded * monthlyRealRate / (Math.pow(1 + monthlyRealRate, workingMonths) - 1);
  } else {
    monthlySave = totalNeeded / workingMonths;
  }
  const el = document.getElementById('retResult');
  el.style.display = 'block';
  el.innerHTML =
    '<div class="row">' +
    '<div><div style="color:var(--muted);font-size:12px;">需储蓄总金额</div><div class="highlight">' + totalNeeded.toFixed(0) + ' 元</div></div>' +
    '<div><div style="color:var(--muted);font-size:12px;">每月需存</div><div class="highlight" style="color:#10b981;">' + monthlySave.toFixed(2) + ' 元</div></div>' +
    '<div><div style="color:var(--muted);font-size:12px;">储蓄年限</div><div class="highlight">' + workingYears + ' 年</div></div>' +
    '</div>' +
    '<div style="margin-top:12px;padding-top:12px;border-top:1px solid var(--border);font-size:13px;color:var(--muted);">' +
    '从 ' + age + ' 岁到 ' + target + ' 岁，每月存 <strong style="color:var(--text);">' + monthlySave.toFixed(0) + ' 元</strong>，' +
    '退休后 ' + retirementYears + ' 年间每月可支配 ' + monthly.toFixed(0) + ' 元（已考虑通胀）' +
    '</div>';
}
</script>
