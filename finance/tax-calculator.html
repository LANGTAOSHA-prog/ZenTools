<script>
function showTab(tab){
  document.getElementById('panelIncome').style.display=tab==='income'?'block':'none';
  document.getElementById('panelVat').style.display=tab==='vat'?'block':'none';
}
function calcTax(){
  var income=parseFloat(document.getElementById('txIncome').value)||0;
  var social=parseFloat(document.getElementById('txSocial').value)||0;
  var deduct=parseFloat(document.getElementById('txDeduct').value)||0;
  var taxable=income-5000-social-deduct;
  if(taxable<0)taxable=0;
  var tax=0;
  if(taxable<=3000)tax=taxable*0.03;
  else if(taxable<=12000)tax=taxable*0.1-210;
  else if(taxable<=25000)tax=taxable*0.2-1410;
  else if(taxable<=35000)tax=taxable*0.25-2660;
  else if(taxable<=55000)tax=taxable*0.3-4410;
  else if(taxable<=80000)tax=taxable*0.35-7160;
  else tax=taxable*0.45-15160;
  document.getElementById('txResult').innerHTML=
    '<div>应纳税所得额: <span class="highlight">'+taxable.toFixed(2)+'</span> 元</div>'+
    '<div style="border-top:1px solid var(--border);margin-top:8px;padding-top:8px;">应缴个税: <span class="highlight">'+tax.toFixed(2)+'</span> 元</div>'+
    '<div>税后收入: <span class="highlight">'+(income-social-tax).toFixed(2)+'</span> 元</div>'+
    '<div style="margin-top:8px;font-size:12px;color:var(--muted);">个税起征点: 5000元/月 | 累计预扣预缴</div>';
}
function calcVAT(){
  var amount=parseFloat(document.getElementById('vatAmount').value)||0;
  var rate=parseFloat(document.getElementById('vatRate').value)/100;
  var mode=document.getElementById('vatMode').value;
  var tax,excl;
  if(mode==='inclusive'){
    excl=amount/(1+rate);
    tax=amount-excl;
    document.getElementById('vatResult').innerHTML=
      '<div>含税价: <span class="highlight">'+amount.toFixed(2)+'</span> 元</div>'+
      '<div>税率: <span class="highlight">'+(rate*100)+'%</span></div>'+
      '<div style="border-top:1px solid var(--border);margin-top:8px;padding-top:8px;">不含税价: <span class="highlight">'+excl.toFixed(2)+'</span> 元</div>'+
      '<div>增值税额: <span class="highlight">'+tax.toFixed(2)+'</span> 元</div>';
  }else{
    tax=amount*rate;
    document.getElementById('vatResult').innerHTML=
      '<div>不含税价: <span class="highlight">'+amount.toFixed(2)+'</span> 元</div>'+
      '<div>税率: <span class="highlight">'+(rate*100)+'%</span></div>'+
      '<div style="border-top:1px solid var(--border);margin-top:8px;padding-top:8px;">增值税额: <span class="highlight">'+tax.toFixed(2)+'</span> 元</div>'+
      '<div>含税价: <span class="highlight">'+(amount+tax).toFixed(2)+'</span> 元</div>';
  }
}
showTab('income');
</script>
