<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title data-i18n="pageTitle">股票手续费计算器 - ZenTools</title><meta name="description" content="ZenTools 免费股票交易手续费计算器，计算印花税、佣金等费用。"><link rel="stylesheet" href="../assets/css/style.css"><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1955887568822472" crossorigin="anonymous"></script><style>:root{--bg:#0f172a;--card:#111827;--border:#1f2937;--text:#f3f4f6;--muted:#94a3b8;--blue:#2563eb;--green:#10b981;--red:#ef4444}*{margin:0;padding:0;box-sizing:border-box}body{background:var(--bg);color:var(--text);font-family:Arial,"Noto Sans SC",sans-serif;line-height:1.7}.container{max-width:900px;margin:auto;padding:40px 20px}a{color:#60a5fa}.top-bar{display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap;margin-bottom:20px}.lang-select{background:#111827;color:white;border:1px solid #334155;border-radius:10px;padding:10px 12px;font-size:13px}.card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:28px}h1{margin-bottom:15px}.desc{color:var(--muted);margin-bottom:25px}.ad-box{margin:25px 0;height:110px;border:2px dashed #334155;border-radius:18px;display:flex;align-items:center;justify-content:center;color:#64748b}input,select{width:100%;margin:10px 0;padding:14px;border-radius:12px;border:1px solid #334155;background:#0f172a;color:white;font-size:16px}button{background:var(--blue);color:white;border:none;padding:13px 18px;border-radius:12px;cursor:font-size:15px;font-weight:bold;margin:6px 6px 6px 0}.green{background:var(--green)}.result-box{background:rgba(16,185,129,0.08);border:1px solid var(--green);border-radius:14px;padding:20px;margin:15px 0;display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}.result-item{text-align:center}.result-item .val{font-size:20px;font-weight:bold;color:var(--green)}.result-item .lbl{font-size:12px;color:var(--muted);margin-top:4px}.result-item .red{color:var(--red)}.fee-table{width:100%;border-collapse:collapse;margin:15px 0;font-size:14px}.fee-table th,.fee-table td{padding:10px 12px;border-bottom:1px solid var(--border)}.fee-table th{color:var(--muted);font-weight:normal;text-align:left}.fee-table td{color:var(--text);text-align:right}.fee-table td:first-child{text-align:left}footer{margin-top:50px;text-align:center;color:#94a3b8}@media(max-width:768px){button,.lang-select{width:100%}}</style></head><body><div class="container"><div class="top-bar"><a href="../index.html" data-i18n="back">← 返回首页</a><select id="langSelect" class="lang-select"><option value="zh">中文</option><option value="en">English</option><option value="ja">日本語</option><option value="vi">Tiếng Việt</option></select></div><div class="card"><h1 data-i18n="pageTitle">股票手续费计算器</h1><p class="desc" data-i18n="pageDesc">计算 A 股买卖交易产生的印花税、佣金等费用。</p><div class="ad-box" data-i18n="ad">广告位（Google AdSense）</div><input type="number" id="stockPrice" placeholder="股票价格（元/股）" value="10"><input type="number" id="stockShares" placeholder="股票数量（股）" value="1000"><div class="radios" style="display:flex;gap:15px;flex-wrap:wrap;margin:10px 0"><label style="display:flex;align-items:center;gap:6px;cursor:pointer"><input type="radio" name="direction" value="buy" checked style="width:auto;margin:0"> <span data-i18n="buy">买入</span></label><label style="display:flex;align-items:center;gap:6px;cursor:pointer"><input type="radio" name="direction" value="sell" style="width:auto;margin:0"> <span data-i18n="sell">卖出</span></label><label style="display:flex;align-items:center;gap:6px;cursor:pointer"><input type="radio" name="direction" value="both" style="width:auto;margin:0"> <span data-i18n="both">买卖双向</span></label></div><button onclick="calcStock()" data-i18n="calc">开始计算</button><div id="result" style="display:none"><div class="result-box"><div class="result-item"><div class="val" id="totalFee">0</div><div class="lbl" data-i18n="totalFee">总手续费（元）</div></div><div class="result-item"><div class="val" id="actualCost">0</div><div class="lbl" data-i18n="actualCost">实际成本（元）</div></div><div class="result-item"><div class="val" id="costPerShare">0</div><div class="lbl" data-i18n="costPerShare">每股成本</div></div></div><table class="fee-table" id="feeDetail"></table></div></div><footer>© 2026 ZenTools</footer></div><script>
const pageT={zh:{pageTitle:'股票手续费计算器',pageDesc:'计算 A 股买卖交易产生的印花税、佣金等费用。',ad:'广告位',back:'← 返回首页',calc:'开始计算',buy:'买入',sell:'卖出',both:'买卖双向',totalFee:'总手续费（元）',actualCost:'实际成本（元）',costPerShare:'每股成本',stamp:'印花税',commission:'券商佣金',transfer:'过户费',total:'合计'},en:{pageTitle:'Stock Fee Calculator',pageDesc:'Calculate A-share stock transaction fees.',ad:'Ad Space',back:'← Back',calc:'Calculate',buy:'Buy',sell:'Sell',both:'Both',totalFee:'Total Fee',actualCost:'Total Cost',costPerShare:'Cost/Share',stamp:'Stamp Duty',commission:'Commission',transfer:'Transfer Fee',total:'Total'},ja:{pageTitle:'株式手数料計算機',pageDesc:'A株の取引手数料を計算。',ad:'広告',back:'← 戻る',calc:'計算',buy:'買い',sell:'売り',both:'両方',totalFee:'総手数料',actualCost:'実質コスト',costPerShare:'1株あたり',stamp:'印紙税',commission:'手数料',transfer:'振替料',total:'合計'},vi:{pageTitle:'Máy tính phí chứng khoán',pageDesc:'Tính phí giao dịch cổ phiếu A.',ad:'QC',back:'← Quay lại',calc:'Tính',buy:'Mua',sell:'Bán',both:'Cả hai',totalFee:'Tổng phí',actualCost:'Tổng chi phí',costPerShare:'Giá/cổ phiếu',stamp:'Thuế tem',commission:'Hoa hồng',transfer:'Phí chuyển',total:'Tổng'}};
function applyLang(lang){const d=pageT[lang]||pageT.zh;document.documentElement.lang=lang==='zh'?'zh-CN':lang;document.title=d.pageTitle||document.title;document.querySelectorAll('[data-i18n]').forEach(function(el){const k=el.getAttribute('data-i18n');if(d[k])el.textContent=d[k];});localStorage.setItem('zentools_lang',lang);}
document.getElementById('langSelect').addEventListener('change',function(){applyLang(this.value);});const sl=localStorage.getItem('zentools_lang')||'zh';document.getElementById('langSelect').value=sl;applyLang(sl);
function calcStock(){const p=parseFloat(document.getElementById('stockPrice').value)||0,q=parseInt(document.getElementById('stockShares').value)||0,dir=document.querySelector('input[name="direction"]:checked').value;if(!p||!q){alert('Please fill in all fields');return;}const amount=p*q;const commissionRate=0.00025;const minCommission=5;const stampRate=0.0005;const transferRate=0.00001;let totalFee=0,detail=[];const calcOne=function(label,rate,isStamp,isTransfer){let fee=amount*rate;if(isStamp&&dir==='buy')return null;if(!isStamp&&!isTransfer&&fee<minCommission)fee=minCommission;totalFee+=fee;return{label:label,amount:fee};};const addDetail=function(label,rate,isStamp,isTransfer){const r=calcOne(label,rate,isStamp,isTransfer);if(r)detail.push(r);};addDetail(pageT[sl].commission,commissionRate,false,false);addDetail(pageT[sl].stamp,stampRate,true,false);addDetail(pageT[sl].transfer,transferRate,false,true);if(dir==='both'){totalFee*=2;detail=detail.concat(detail.map(function(d){return{label:d.label+'('+pageT[sl].sell+')',amount:d.amount};}));detail.forEach(function(d,i){if(i<3)d.label=d.label+'('+pageT[sl].buy+')';});}const actual=amount+totalFee;const cps=actual/q;document.getElementById('result').style.display='block';document.getElementById('totalFee').textContent=totalFee.toFixed(2);document.getElementById('actualCost').textContent=actual.toFixed(2);document.getElementById('costPerShare').textContent=cps.toFixed(4);let html='<tr><th>费用项目</th><th>金额（元）</th></tr>';detail.forEach(function(d){html+='<tr><td>'+d.label+'</td><td>'+d.amount.toFixed(2)+'</td></tr>';});html+='<tr><td><strong>'+pageT[sl].total+'</strong></td><td><strong>'+totalFee.toFixed(2)+'</strong></td></tr>';document.getElementById('feeDetail').innerHTML=html;}
</script></body></html>
