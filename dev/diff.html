<script>
function getMsg(k){const l=localStorage.getItem('zentools_lang')||'zh';return((window.ZT_PAGE||{})[l]||window.ZT_PAGE.zh)[k]||k;}
function compareJSON(){const a=document.getElementById('jsonA').value.trim(),b=document.getElementById('jsonB').value.trim();if(!a||!b){showErr(getMsg('msgEmpty'));return;}try{const oa=JSON.parse(a),ob=JSON.parse(b);const d=getDiff(oa,ob);displayDiff(d);hideErr();}catch(e){showErr(getMsg('msgParseError')+e.message);}}
function getDiff(a,b,p=''){const c=[];const k=new Set([...Object.keys(a||{}),...Object.keys(b||{})]);for(let key of k){const np=p?p+'.'+key:key;const va=a?.[key],vb=b?.[key];if(!(key in a))c.push({path:np,type:'added',value:JSON.stringify(vb)});else if(!(key in b))c.push({path:np,type:'removed',value:JSON.stringify(va)});else if(typeof va==='object'&&va!==null&&typeof vb==='object'&&vb!==null)c.push(...getDiff(va,vb,np));else if(JSON.stringify(va)!==JSON.stringify(vb))c.push({path:np,type:'changed',old:JSON.stringify(va),new:JSON.stringify(vb)});}return c;}
function displayDiff(d){if(d.length===0){document.getElementById('diffResult').innerHTML='<span style="color:#4ade80;">'+getMsg('msgIdentical')+'</span>';return;}let html='<div style="margin-bottom:12px;font-weight:600;">'+getMsg('diffTitle')+'</div>';d.forEach(i=>{if(i.type==='added')html+=`<div class="diff-added">➕ ${getMsg('diffAdded')}: ${esc(i.path)} = ${esc(i.value)}</div>`;else if(i.type==='removed')html+=`<div class="diff-removed">➖ ${getMsg('diffRemoved')}: ${esc(i.path)} = ${esc(i.value)}</div>`;else html+=`<div class="diff-changed">🔄 ${getMsg('diffChanged')}: ${esc(i.path)}<br>&nbsp;&nbsp;A: ${esc(i.old)}<br>&nbsp;&nbsp;B: ${esc(i.new)}</div>`;});document.getElementById('diffResult').innerHTML=html;}
function clearAll(){document.getElementById('jsonA').value='';document.getElementById('jsonB').value='';document.getElementById('diffResult').innerHTML='<span style="color:var(--muted);">'+getMsg('waiting')+'</span>';hideErr();}
function swapJSON(){const a=document.getElementById('jsonA').value,b=document.getElementById('jsonB').value;document.getElementById('jsonA').value=b;document.getElementById('jsonB').value=a;}
function showErr(m){const e=document.getElementById('errorMsg');e.textContent=m;e.className='tool-msg error';}
function hideErr(){document.getElementById('errorMsg').className='tool-msg';}
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}
</script>
