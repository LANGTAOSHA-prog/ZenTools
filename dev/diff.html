<script>
  function compareJSON() {
    const aText = document.getElementById('jsonA').value.trim();
    const bText = document.getElementById('jsonB').value.trim();
    if (!aText || !bText) { showError('è¯·å¡«åä¸¤ä¸?JSON æ°æ®'); return; }
    try { const objA = JSON.parse(aText); const objB = JSON.parse(bText); const diff = getDiff(objA, objB); displayDiff(diff); hideError(); }
    catch(e) { showError('JSON è§£æéè¯¯: ' + e.message); }
  }
  function getDiff(a, b, path = '') {
    const changes = [];
    const allKeys = new Set([...Object.keys(a||{}), ...Object.keys(b||{})]);
    for (let key of allKeys) {
      const newPath = path ? `${path}.${key}` : key;
      const valA = a?.[key];
      const valB = b?.[key];
      if (!(key in a)) changes.push({ path: newPath, type: 'added', value: JSON.stringify(valB) });
      else if (!(key in b)) changes.push({ path: newPath, type: 'removed', value: JSON.stringify(valA) });
      else if (typeof valA === 'object' && valA !== null && typeof valB === 'object' && valB !== null) changes.push(...getDiff(valA, valB, newPath));
      else if (JSON.stringify(valA) !== JSON.stringify(valB)) changes.push({ path: newPath, type: 'changed', oldValue: JSON.stringify(valA), newValue: JSON.stringify(valB) });
    }
    return changes;
  }
  function displayDiff(diff) {
    if (diff.length === 0) { document.getElementById('diffResult').innerHTML = '<span style="color:#4ade80;">â?ä¸¤ä¸ª JSON å®å¨ä¸è´ï¼æ²¡æå·®å¼</span>'; return; }
    let html = '<div style="margin-bottom:12px;font-weight:600;">ð å·®å¼åè¡¨ï¼?/div>';
    diff.forEach(d => {
      if (d.type === 'added') html += `<div class="diff-added">â?æ°å¢: ${escapeHtml(d.path)} = ${escapeHtml(d.value)}</div>`;
      else if (d.type === 'removed') html += `<div class="diff-removed">â?å é¤: ${escapeHtml(d.path)} = ${escapeHtml(d.value)}</div>`;
      else html += `<div class="diff-removed" style="background:rgba(239,68,68,0.08);">ð ä¿®æ¹: ${escapeHtml(d.path)}<br>&nbsp;&nbsp;A: ${escapeHtml(d.oldValue)}<br>&nbsp;&nbsp;B: ${escapeHtml(d.newValue)}</div>`;
    });
    document.getElementById('diffResult').innerHTML = html;
  }
  function clearAll() { document.getElementById('jsonA').value = ''; document.getElementById('jsonB').value = ''; document.getElementById('diffResult').innerHTML = '<span style="color:var(--muted);">ç¹å»å¯¹æ¯æ¥ç JSON å·®å¼</span>'; hideError(); }
  function swapJSON() { const a = document.getElementById('jsonA').value; const b = document.getElementById('jsonB').value; document.getElementById('jsonA').value = b; document.getElementById('jsonB').value = a; }
  function showError(msg) { const el = document.getElementById('errorMsg'); el.textContent = msg; el.style.display = 'block'; }
  function hideError() { document.getElementById('errorMsg').style.display = 'none'; }
  function escapeHtml(str) { return str.replace(/[&<>]/g, function(m){if(m==='&')return '&amp;';if(m==='<')return '&lt;';if(m==='>')return '&gt;';return m;}); }
