<script>
let clickCnt=0,scrollCnt=0;
const area=document.getElementById('area'),coord=document.getElementById('coord'),detail=document.getElementById('detail');
area.addEventListener('mousemove',function(e){coord.textContent='X: '+e.offsetX+', Y: '+e.offsetY;document.getElementById('detail').textContent='button: '+e.buttons;});
area.addEventListener('click',function(e){clickCnt++;document.getElementById('clickCount').textContent=clickCnt;document.getElementById('lastBtn').textContent='button '+e.button;coord.textContent='X: '+e.offsetX+', Y: '+e.offsetY;});
area.addEventListener('wheel',function(e){e.preventDefault();scrollCnt++;document.getElementById('scrollCount').textContent=scrollCnt;detail.textContent='deltaY: '+(e.deltaY>0?'↓':'↑');},{passive:false});
</script>
