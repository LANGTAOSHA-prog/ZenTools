function testRegex(){const pattern=document.getElementById('regexInput').value;const text=document.getElementById('testInput').value;const gi=document.getElementById('flagGI').checked;const count=document.getElementById('matchCount');
if(!pattern||!text){document.getElementById('status').innerHTML=text;count.textContent='0';return;}
try{const flags=gi?'gi':'g';const regex=new RegExp(pattern,flags);let html='';let lastIdx=0;let matches=0;let m;
while((m=regex.exec(text))!==null){html+=escapeHtml(text.slice(lastIdx,m.index));html+=`<span class="highlight">${escapeHtml(m[0])}</span>`;lastIdx=regex.lastIndex;matches++;if(m.index===regex.lastIndex)regex.lastIndex++;}
html+=escapeHtml(text.slice(lastIdx));document.getElementById('status').innerHTML=html||escapeHtml(text);count.textContent=matches;
}catch(e){document.getElementById('status').innerHTML=escapeHtml(text);count.textContent='0';if(!gi)document.getElementById('status').innerHTML=`<span style="color:#f87171;">⚠️ ${e.message}</span>`;}
}
function escapeHtml(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}
testRegex();
</script>
