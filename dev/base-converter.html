    <h1><span class="hl">进制转换器</span></h1>
    <p>在二进制、八进制、十进制、十六进制之间互相转换。</p>
  </div>
  <div class="tool-box">
    
<div class="row">
  <div><label>二进制 (2)</label><input type="text" id="binInput" value="1010" oninput="fromBase('bin')" /></div>
  <div><label>八进制 (8)</label><input type="text" id="octInput" value="12" oninput="fromBase('oct')" /></div>
</div>
<div class="row">
  <div><label>十进制 (10)</label><input type="text" id="decInput" value="10" oninput="fromBase('dec')" /></div>
  <div><label>十六进制 (16)</label><input type="text" id="hexInput2" value="a" oninput="fromBase('hex')" /></div>
</div>
<div style="margin-top:8px;font-size:12px;color:var(--muted);">
  ASCII: <span id="asciiChar">
</span>
</div>
  </div>
</div>
<script src="../assets/js/tool-ui.min.js"></script>
<script>

function fromBase(src){
  var val;
  if(src==='bin')val=parseInt(document.getElementById('binInput').value,2);
  else if(src==='oct')val=parseInt(document.getElementById('octInput').value,8);
  else if(src==='dec')val=parseInt(document.getElementById('decInput').value,10);
  else val=parseInt(document.getElementById('hexInput2').value,16);
  if(isNaN(val))return;
  document.getElementById('binInput').value=val.toString(2);
  document.getElementById('octInput').value=val.toString(8);
  document.getElementById('decInput').value=val.toString(10);
  document.getElementById('hexInput2').value=val.toString(16);
  document.getElementById('asciiChar').textContent=val>=32&&val<=126?String.fromCharCode(val):'(不可见)';
}
</script>
