<script>

function fromBase(src){
  var val;
  if(src==='bin')val=parseInt(document.getElementById('binInput').value,2);
  else if(src==='oct')val=parseInt(document.getElementById('octInput').value,8);
  else if(src==='dec')val=parseInt(document.getElementById('decInput').value,10);
  else val=parseInt(document.getElementById('hexInput2').value,16);
  if(isNaN(val))return;
  document.getElementById('binInput').value=val.toString(2);
  document.getElementById('octInput').value=val.toString(8);
  document.getElementById('decInput').value=val.toString(10);
  document.getElementById('hexInput2').value=val.toString(16);
  document.getElementById('asciiChar').textContent=val>=32&&val<=126?String.fromCharCode(val):'(不可见)';
}
</script>
