<script>
function getMsg(k){const l=localStorage.getItem('zentools_lang')||'zh';return((window.ZT_PAGE||{})[l]||window.ZT_PAGE.zh)[k]||k;}
function isValidIP(ip){return/^(\d{1,3}\.){3}\d{1,3}$/.test(ip)&&ip.split('.').every(o=>o>=0&&o<=255);}
function lookupIP(){const ip=document.getElementById('ipInput').value.trim();if(ip&&!isValidIP(ip)){showMsg(getMsg('msgInvalid'),'error');return;}const target=ip||'myip';fetch('https://ipapi.co/'+target+'/json/').then(r=>r.json()).then(d=>{if(d.error){showMsg(d.reason||'查询失败','error');return;}const items=[{l:'IP地址',v:d.query},{l:'国家',v:d.country_name},{l:'城市',v:d.city},{l:'运营商',v:d.org||d.asn||'—'},{l:'时区',v:d.timezone||'—'},{l:'语言',v:d.languages||'—'}];let h='';items.forEach(i=>{h+='<div class="stat-card"><div class="label">'+i.l+'</div><div class="value">'+i.v+'</div></div>';});document.getElementById('statsGrid').innerHTML=h;document.getElementById('resultArea').style.display='block';showMsg('','');}).catch(()=>{showMsg('网络错误，请重试','error');});}
function myIP(){document.getElementById('ipInput').value='';lookupIP();}
function showMsg(m,t){const e=document.getElementById('errorMsg');e.textContent=m;e.className='tool-msg'+(t?' '+t:'');}
function clearAll(){document.getElementById('ipInput').value='';document.getElementById('resultArea').style.display='none';showMsg('','');}
</script>
