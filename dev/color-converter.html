<script>

function fromHEX() {
  var h=document.getElementById('hexInput').value.trim(); if(!h.startsWith('#')) return;
  var m=h.match(/^#([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i); if(!m) return;
  var r=parseInt(m[1],16),g=parseInt(m[2],16),b=parseInt(m[3],16);
  document.getElementById('rgbInput').value='rgb('+r+','+g+','+b+')';
  document.getElementById('hslInput').value='hsl('+rgb2hsl(r,g,b)+')';
  document.getElementById('colorPreview').style.background=h;
}
function fromRGB() {
  var v=document.getElementById('rgbInput').value.match(/(\d+)/g); if(!v||v.length<3) return;
  var r=+v[0],g=+v[1],b=+v[2];
  document.getElementById('hexInput').value='#'+pad(r)+pad(g)+pad(b);
  document.getElementById('hslInput').value='hsl('+rgb2hsl(r,g,b)+')';
  document.getElementById('colorPreview').style.background='rgb('+r+','+g+','+b+')';
}
function fromHSL() {
  var v=document.getElementById('hslInput').value.match(/[\d.]+/g); if(!v||v.length<3) return;
  var h=+v[0],s=+v[1]/100,l=+v[2]/100;
  var rgb=hsl2rgb(h,s,l);
  document.getElementById('hexInput').value='#'+pad(rgb[0])+pad(rgb[1])+pad(rgb[2]);
  document.getElementById('rgbInput').value='rgb('+rgb.join(',')+')';
  document.getElementById('colorPreview').style.background='hsl('+h+','+s*100+'%,'+l*100+'%)';
}
function pad(n){return n.toString(16).padStart(2,'0');}
function rgb2hsl(r,g,b){r/=255;g/=255;b/=255;var M=Math.max(r,g,b),m=Math.min(r,g,b),d=M-m,l=(M+m)/2;if(!d)return'0,0%,'+Math.round(l*100)+'%';var h=d===0?0:(M===r?((g-b)/d%6):(M===g?(b-r)/d+2:(r-g)/d+4))*60;h=h<0?h+360:h;return Math.round(h)+','+Math.round((d/(1-Math.abs(2*l-1)))*100)+'%,'+Math.round(l*100)+'%';}
function hsl2rgb(h,s,l){h/=360;var c=(1-Math.abs(2*l-1))*s,x=c*(1-Math.abs((h*6)%2-1)),m=l-c/2,[r,g,b]=[[c,x,0],[x,c,0],[0,c,x],[0,x,c],[x,0,c],[c,0,x]][Math.floor(h*6)%6]||[0,0,0];return[Math.round((r+m)*255),Math.round((g+m)*255),Math.round((b+m)*255)];}
</script>
