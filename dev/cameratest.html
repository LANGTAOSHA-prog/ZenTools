async function startCamera(){const el=document.getElementById('status');try{stream=await navigator.mediaDevices.getUserMedia({video:true,audio:false});document.getElementById('video').srcObject=stream;el.textContent=getMsg('ok');el.className='status-text active';}catch(e){el.textContent=getMsg('fail');el.className='status-text error';}}

function getMsg(k){const l=localStorage.getItem('zentools_lang')||'zh';return((window.ZT_PAGE||{})[l]||window.ZT_PAGE.zh)[k]||k;}
</script>
