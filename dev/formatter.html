<script>
function getMsg(k){const l=localStorage.getItem('zentools_lang')||'zh';const d=(window.ZT_PAGE||{})[l]||window.ZT_PAGE.zh;return d[k]||k;}
function showMsg(msg,type){const el=document.getElementById('message');el.textContent=msg;el.className='tool-msg '+type;el.style.display='block';}
function hideMsg(){document.getElementById('message').style.display='none';}
function process(transform){const input=document.getElementById('jsonInput').value.trim();if(!input){showMsg(getMsg('msgEmpty'),'error');return;}try{const obj=JSON.parse(input);document.getElementById('outputArea').innerHTML='<pre style="margin:0;font-family:Consolas,monospace;">'+escapeHtml(transform(obj))+'</pre>';hideMsg();}catch(e){showMsg(getMsg('msgParseError')+e.message,'error');}}
function formatJSON(){process((obj)=>JSON.stringify(obj,null,2));}
function minifyJSON(){process((obj)=>JSON.stringify(obj));}
function clearAll(){document.getElementById('jsonInput').value='';document.getElementById('outputArea').innerHTML='<span style="color:var(--muted);">'+getMsg('waiting')+'</span>';hideMsg();}
function copyOutput(){const out=document.getElementById('outputArea').innerText;if(out&&out!==getMsg('waiting')){navigator.clipboard.writeText(out);showMsg(getMsg('msgCopied'),'success');setTimeout(hideMsg,1500);}else showMsg(getMsg('msgNoContent'),'error');}
function escapeHtml(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}
</script>
