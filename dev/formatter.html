  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #071026;
      --surface: #0c1320;

    [data-theme="light"] {

      --border-bright: rgba(0,0,0,0.12);
      --text: #0d1117;

    }
    body { font-family: 'Inter', -apple-system, sans-serif; background: var(--bg); color: var(--text); transition: background .3s; }
    .container { max-width: 1280px; margin: 0 auto; padding: 80px 24px 40px; }

    button:hover { background: var(--accent); border-color: var(--accent); color: #fff; }
    textarea { width: 100%; height: 300px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; color: var(--text); font-family: 'Monaco', 'Menlo', monospace; font-size: 13px; resize: vertical; }
    .output-area { margin-top: 20px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; min-height: 200px; font-family: monospace; font-size: 13px; white-space: pre-wrap; overflow-x: auto; }

<div class="container">
  <a href="/dev/json-index.html" class="back-link">�?返回工具�?/a>

    <div class="sub">格式化、压缩、验�?JSON 数据</div>
  </div>
  <div class="toolbar">
    <button onclick="formatJSON()">�?格式�?/button>
    <button onclick="minifyJSON()">📦 压缩</button>
    <button onclick="clearAll()">🗑�?清空</button>
    <button onclick="copyOutput()">📋 复制结果</button>
  </div>
  <textarea id="inputJSON" placeholder='{"name": "����Сվ-ZenTools","version": "2.0"}'></textarea>
  <div id="outputArea" class="output-area"></div>
  <div id="message" class="error" style="display:none;"></div>
</div>
<div class="footer">© ����Сվ-ZenTools · 本地处理，数据不上传</div>
<script>
  function formatJSON() { process((obj) => JSON.stringify(obj, null, 2)); }
  function minifyJSON() { process((obj) => JSON.stringify(obj)); }
  function process(transform) {
    const input = document.getElementById('inputJSON').value.trim();
    if (!input) { showMsg('请输�?JSON 数据', 'error'); return; }
    try { const obj = JSON.parse(input); document.getElementById('outputArea').innerHTML = `<pre style="margin:0;font-family:monospace;">${escapeHtml(transform(obj))}</pre>`; hideMsg(); }
    catch(e) { showMsg('JSON 解析错误: ' + e.message, 'error'); }
  }
  function clearAll() { document.getElementById('inputJSON').value = ''; document.getElementById('outputArea').innerHTML = '<span style="color:var(--muted);">等待输入...</span>'; hideMsg(); }
  function copyOutput() { const out = document.getElementById('outputArea').innerText; if(out && out !== '等待输入...') { navigator.clipboard.writeText(out); showMsg('已复制到剪贴�?, 'success'); setTimeout(hideMsg, 1500); } else showMsg('无内容可复制', 'error'); }
  function showMsg(msg, type) { const el = document.getElementById('message'); el.textContent = msg; el.className = type === 'error' ? 'error' : 'success'; el.style.display = 'block'; }
  function hideMsg() { document.getElementById('message').style.display = 'none'; }
  function escapeHtml(str) { return str.replace(/[&<>]/g, function(m){if(m==='&')return '&amp;';if(m==='<')return '&lt;';if(m==='>')return '&gt;';return m;}); }
</script>
