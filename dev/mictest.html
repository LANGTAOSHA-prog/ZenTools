let audioCtx,analyser,micStream,raf;
async function startMic(){
 try{
  micStream=await navigator.mediaDevices.getUserMedia({audio:true});
  audioCtx=new (window.AudioContext||window.webkitAudioContext)();
  const source=audioCtx.createMediaStreamSource(micStream);
  analyser=audioCtx.createAnalyser(); analyser.fftSize=256; source.connect(analyser);
  const data=new Uint8Array(analyser.frequencyBinCount);
  function loop(){analyser.getByteFrequencyData(data);let avg=data.reduce((a,b)=>a+b,0)/data.length;let pct=Math.min(100,Math.round(avg));document.getElementById("level").textContent=pct;document.getElementById("bar").style.width=pct+"%";raf=requestAnimationFrame(loop);}
  loop(); document.getElementById("status").textContent="OK";
 }catch(e){document.getElementById("status").textContent=(translations[currentLang]||translations.zh).fail;}
}
function stopMic(){if(raf)cancelAnimationFrame(raf);if(micStream)micStream.getTracks().forEach(t=>t.stop());if(audioCtx)audioCtx.close();document.getElementById("level").textContent="0";document.getElementById("bar").style.width="0";}
