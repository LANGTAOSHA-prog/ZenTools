<script>

function tsToDate(){
  var v=document.getElementById('tsInput').value.trim();
  var ts=parseInt(v)||Math.floor(Date.now()/1000);
  var d=new Date(ts*1000);
  document.getElementById('tsInput').value=ts;
  document.getElementById('dateInput').value=d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate())+' '+pad2(d.getHours())+':'+pad2(d.getMinutes())+':'+pad2(d.getSeconds());
  showTS();
}
function dateToTs(){
  var v=document.getElementById('dateInput').value.trim();
  if(!v){document.getElementById('tsInput').value='';return;}
  var d=new Date(v);if(isNaN(d.getTime()))return;
  document.getElementById('tsInput').value=Math.floor(d.getTime()/1000);
  showTS();
}
function nowTS(){document.getElementById('tsInput').value=Math.floor(Date.now()/1000);tsToDate();}
function showTS(){var el=document.getElementById('tsResult');el.style.display='block';el.innerHTML='<span style="color:var(--muted);">▶ UTC: </span>'+new Date(parseInt(document.getElementById('tsInput').value)*1000).toUTCString();}
function pad2(n){return n.toString().padStart(2,'0');}
tsToDate();
</script>
