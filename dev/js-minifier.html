    <p>压缩或美化 JavaScript 代码，移除注释和多余空格。</p>
  </div>
  <div class="tool-box">
    
<label>输入 JavaScript 代码</label>
<textarea id="jsInput" rows="8" placeholder="粘贴 JavaScript 代码..."></textarea>
<div style="display:flex;gap:10px;margin-top:16px;flex-wrap:wrap;">
  <button class="btn" onclick="beautifyJS()">美化</button>
  <button class="btn btn2" onclick="minifyJS()">压缩</button>
  <button class="btn btn2" onclick="copyJS()">复制</button>
</div>
<div class="result" id="jsResult" style="display:none;"></div>
  </div>
</div>
<script src="../assets/js/tool-ui.js"></script>
<script>

function beautifyJS() {
  var v=document.getElementById('jsInput').value;if(!v)return;
  var r=v.replace(/\/\/[^\n]*\n/g,'\n').replace(/\/\*[\s\S]*?\*\//g,'');
  r=r.replace(/{/g,'{\n').replace(/}/g,'\n}\n').replace(/;/g,';\n').replace(/,/g,', ').replace(/\n{3,}/g,'\n\n');
  var lines=r.split('\n'),out='',ind=0;
  lines.forEach(function(l){l=l.trim();if(!l)return;if(l.startsWith('}'))ind=Math.max(0,ind-1);out+='  '.repeat(ind)+l+'\n';if(l.endsWith('{'))ind++;});
  showJS(out);
}
function minifyJS() {
  var v=document.getElementById('jsInput').value;if(!v)return;
  showJS(v.replace(/\/\/[^\n]*\n/g,'').replace(/\/\*[\s\S]*?\*\//g,'').replace(/\s+/g,' ').replace(/\s*([{}();,:])\s*/g,'$1').trim());
}
function showJS(t){var el=document.getElementById('jsResult');el.style.display='block';el.textContent=t||'(空)';}
function copyJS(){var el=document.getElementById('jsResult');if(el.textContent)navigator.clipboard.writeText(el.textContent);}
</script>
<button class="bookmark-float" onclick="prompt('复制链接收藏本站','https://zentools.xyz')">⭐ 收藏本站</button>
