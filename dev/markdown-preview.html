    <h1><span class="hl">Markdown 预览</span></h1>
    <p>实时预览 Markdown 文本渲染效果，支持标题、列表、代码块等语法。</p>
  </div>
  <div class="tool-box">
    
<label>输入 Markdown</label>
<textarea id="mdInput" rows="10" oninput="previewMD()" placeholder="# Markdown 预览

支持:
- **粗体** *斜体*
- 列表 1. 有序列表
- [链接](https://zentools.xyz)
- `代码`"># Markdown 预览

输入 Markdown 文本，右侧实时预览。</textarea>
<div style="display:flex;gap:10px;margin-top:16px;">
  <button class="btn" onclick="previewMD()">刷新预览</button>
  <button class="btn btn2" onclick="copyMD()">复制 HTML</button>
</div>
<div class="result" id="mdResult" style="display:none;"></div>
  </div>
</div>
<script src="../assets/js/tool-ui.min.js"></script>
<script>

function previewMD() {
  var t=document.getElementById('mdInput').value; if(!t) return;
  var h=t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  h=h.replace(/^### (.+)$/gm,'<h3>$1</h3>').replace(/^## (.+)$/gm,'<h2>$1</h2>').replace(/^# (.+)$/gm,'<h1>$1</h1>');
  h=h.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\*(.+?)\*/g,'<i>$1</i>').replace(/`(.+?)`/g,'<code>$1</code>');
  h=h.replace(/\[(.+?)\]\((.+?)\)/g,'<a href="$2" target="_blank">$1</a>');
  h=h.replace(/^\* (.+)$/gm,'<li>$1</li>').replace(/^\d+\. (.+)$/gm,'<li>$1</li>');
  h=h.replace(/(<li>.*<\/li>\n?)+/g,'<ul>$&<\/ul>');
  h=h.replace(/```([\s\S]*?)```/g,'<pre><code>$1<\/code><\/pre>');
  h=h.replace(/\n\n/g,'<p>');
  var el=document.getElementById('mdResult'); el.style.display='block';
  el.innerHTML='<div style="border-bottom:1px solid var(--border);padding-bottom:8px;margin-bottom:12px;color:var(--muted);font-size:12px;font-family:sans-serif;">预览</div><div style="line-height:1.8;">'+h+'</div>';
}
function copyMD() { var el=document.getElementById('mdResult'); if(el.innerHTML) navigator.clipboard.writeText(el.innerHTML).then(function(){ }); }
</script>
<button class="bookmark-float" onclick="prompt('复制链接收藏本站','https://zentools.xyz')">⭐ 收藏本站</button>
