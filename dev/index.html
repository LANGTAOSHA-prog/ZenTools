<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZenTools | 工具导航中心</title>

<style>
body{
    margin:0;
    font-family: Arial, "Microsoft YaHei";
    background:#0b1220;
    color:#e5e7eb;
}

header{
    text-align:center;
    padding:30px 20px;
    background:#111827;
}

header h1{
    margin:0;
    font-size:24px;
}

header p{
    margin-top:6px;
    color:#9ca3af;
}

.container{
    max-width:1200px;
    margin:auto;
    padding:20px;
}

/* 搜索 */
.search-box input{
    width:100%;
    padding:12px;
    border-radius:10px;
    border:none;
    margin-bottom:15px;
}

/* 分类 */
.category-bar{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-bottom:15px;
}

.category-btn{
    padding:6px 10px;
    border-radius:8px;
    background:#1f2937;
    cursor:pointer;
    font-size:12px;
    user-select:none;
}

.category-btn.active{
    background:#3b82f6;
}

/* 卡片 */
.grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
    gap:15px;
}

.card{
    background:#111827;
    border-radius:12px;
    padding:16px;
    text-decoration:none;
    color:#fff;
    transition:0.2s;
    border:1px solid #1f2937;
}

.card:hover{
    transform:translateY(-4px);
    border-color:#3b82f6;
}

.icon{
    font-size:22px;
}

.title{
    font-size:16px;
    margin:8px 0 6px;
}

.desc{
    font-size:13px;
    color:#9ca3af;
}

.tag{
    margin-top:10px;
    font-size:11px;
    color:#60a5fa;
}

.badge{
    display:inline-block;
    font-size:10px;
    padding:2px 6px;
    border-radius:6px;
    background:#ef4444;
    margin-left:6px;
}
</style>
</head>

<body>

<header>
    <h1>🧰 ZenTools</h1>
    <p>一站式在线工具集合中心</p>
</header>

<div class="container">

<div class="search-box">
    <input id="search" placeholder="搜索工具，例如 PDF / 图片 / AI / 时间...">
</div>

<div class="category-bar" id="categories"></div>

<div class="grid" id="toolGrid"></div>

</div>

<script>
const toolsData = [
  {name:'PDF 工具', slug:'pdf-tools', category:'PDF 工具', url:'pdf/index.html', description:'支持 PDF 转图片、图片转 PDF，浏览器本地处理，适合办公和学习。', icon:'📄', featured:true, keywords:'pdf pdf转图片 图片转pdf 办公'},
  {name:'图片压缩工具', slug:'image-compressor', category:'图片工具', url:'image/compress.html', description:'在线压缩图片体积，适合网站配图、公众号和社交平台上传。', icon:'🖼️', featured:true, keywords:'图片压缩 图片工具'},
  {name:'文字转语音', slug:'text-to-speech', category:'音频工具', url:'tools/text-to-speech.html', description:'输入文字即可朗读，适合配音草稿、学习和内容预览。', icon:'🔊', featured:true, keywords:'文字转语音 朗读 配音'},
  {name:'世界时间查询', slug:'worldtime', category:'生活工具', url:'tools/worldtime.html', description:'快速查看不同时区和城市时间，适合跨国沟通和旅行安排。', icon:'🌍', featured:true, keywords:'世界时间 时区'},
  {name:'汇率换算工具', slug:'currency-converter', category:'金融工具', url:'life/currency.html', description:'用于估算常见货币兑换金额，适合旅行、购物和日常参考。', icon:'💱', featured:false, keywords:'汇率 换算'},
  {name:'AI 工具导航', slug:'ai-tools-directory', category:'AI 工具', url:'tools/ai-tools-directory.html', description:'整理常用 AI 写作、绘图、视频、办公和效率工具入口。', icon:'🤖', featured:true, keywords:'AI 工具 AI导航'}
];

const categoriesData = ['全部','AI 工具','图片工具','PDF 工具','文本工具','视频工具','音频工具','开发工具','SEO 工具','办公工具','生活工具','金融工具','教育工具'];

let currentCategory = '全部';

/* 渲染分类 */
const catBox = document.getElementById('categories');
categoriesData.forEach(cat=>{
    const btn = document.createElement('div');
    btn.className = 'category-btn';
    btn.innerText = cat;
    if(cat==='全部') btn.classList.add('active');

    btn.onclick = ()=>{
        currentCategory = cat;
        document.querySelectorAll('.category-btn').forEach(b=>b.classList.remove('active'));
        btn.classList.add('active');
        render();
    };

    catBox.appendChild(btn);
});

/* 渲染工具 */
function render(){
    const grid = document.getElementById('toolGrid');
    const keyword = document.getElementById('search').value.toLowerCase();

    let list = toolsData.filter(t=>{
        const matchCategory = currentCategory==='全部' || t.category===currentCategory;
        const matchSearch =
            t.name.toLowerCase().includes(keyword) ||
            t.description.toLowerCase().includes(keyword) ||
            t.keywords.toLowerCase().includes(keyword);

        return matchCategory && matchSearch;
    });

    grid.innerHTML = '';

    list.forEach(t=>{
        grid.innerHTML += `
        <a class="card" href="${t.url}">
            <div class="icon">${t.icon}</div>
            <div class="title">${t.name}
                ${t.featured ? '<span class="badge">热门</span>' : ''}
            </div>
            <div class="desc">${t.description}</div>
            <div class="tag">${t.category}</div>
        </a>`;
    });
}

/* 搜索 */
document.getElementById('search').addEventListener('input', render);

/* 初始化 */
render();
</script>

</body>
</html>
