<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dev Tools | 开发者工具箱</title>

<style>
body{
    margin:0;
    font-family: "Microsoft YaHei", Arial, sans-serif;
    background:#0f172a;
    color:#e5e7eb;
}

header{
    text-align:center;
    padding:40px 20px;
    background:linear-gradient(135deg,#111827,#1f2937);
}

header h1{
    margin:0;
    font-size:26px;
}

header p{
    margin-top:8px;
    color:#9ca3af;
    font-size:14px;
}

.container{
    max-width:1100px;
    margin:30px auto;
    padding:0 20px;
}

.search-box{
    display:flex;
    justify-content:center;
    margin-bottom:25px;
}

.search-box input{
    width:100%;
    max-width:500px;
    padding:12px 15px;
    border-radius:10px;
    border:none;
    outline:none;
    font-size:14px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
    gap:15px;
}

.card{
    background:#111827;
    border:1px solid #1f2937;
    border-radius:12px;
    padding:18px;
    text-decoration:none;
    color:#e5e7eb;
    transition:0.2s;
}

.card:hover{
    transform:translateY(-4px);
    border-color:#3b82f6;
    box-shadow:0 10px 20px rgba(0,0,0,0.3);
}

.card h3{
    margin:0 0 8px;
    font-size:16px;
    color:#fff;
}

.card p{
    margin:0;
    font-size:13px;
    color:#9ca3af;
}

.tag{
    display:inline-block;
    margin-top:10px;
    font-size:11px;
    padding:3px 8px;
    border-radius:6px;
    background:#1f2937;
    color:#60a5fa;
}

footer{
    text-align:center;
    margin:40px 0;
    font-size:12px;
    color:#6b7280;
}
</style>
</head>

<body>

<header>
    <h1>🛠 Dev Tools</h1>
    <p>ZenTools 开发者工具集合中心</p>
</header>

<div class="container">

<!-- 搜索（预留功能） -->
<div class="search-box">
    <input type="text" placeholder="搜索工具，例如 JSON / Base64 / 时间戳...">
</div>

<div class="grid">

    <a class="card" href="/json/index.html">
        <h3>JSON 格式化</h3>
        <p>JSON 美化 / 压缩 / 校验工具</p>
        <div class="tag">JSON</div>
    </a>

    <a class="card" href="/base64/index.html">
        <h3>Base64 编解码</h3>
        <p>文本 / 图片 Base64 转换</p>
        <div class="tag">Encode</div>
    </a>

    <a class="card" href="/timestamp/index.html">
        <h3>时间戳转换</h3>
        <p>时间 ↔ 时间戳快速转换</p>
        <div class="tag">Time</div>
    </a>

    <a class="card" href="/uuid/index.html">
        <h3>UUID 生成器</h3>
        <p>快速生成唯一标识符</p>
        <div class="tag">ID</div>
    </a>

    <a class="card" href="/regex/index.html">
        <h3>正则表达式工具</h3>
        <p>在线测试与匹配调试</p>
        <div class="tag">Regex</div>
    </a>

    <a class="card" href="/color/index.html">
        <h3>颜色选择器</h3>
        <p>取色 / HEX / RGB 转换</p>
        <div class="tag">UI</div>
    </a>

</div>

</div>

<footer>
    ZenTools Dev Tools © 2026
</footer>

</body>
</html>
