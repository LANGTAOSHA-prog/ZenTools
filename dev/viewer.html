<script>
function getMsg(k){const l=localStorage.getItem('zentools_lang')||'zh';return((window.ZT_PAGE||{})[l]||window.ZT_PAGE.zh)[k]||k;}
function renderTree(){const input=document.getElementById('jsonInput').value.trim();if(!input){showErr(getMsg('msgEmpty'));return;}try{const obj=JSON.parse(input);document.getElementById('treeContainer').innerHTML=buildTree(obj);hideErr();attachToggleEvents();}catch(e){showErr(getMsg('msgParseError')+e.message);}}
function buildTree(data,key=null){const t=typeof data;if(data===null)return'<span class="tree-null">null</span>';if(t==='string')return'<span class="tree-string">"'+esc(data)+'"</span>';if(t==='number')return'<span class="tree-number">'+data+'</span>';if(t==='boolean')return'<span class="tree-bool">'+data+'</span>';if(Array.isArray(data)){if(data.length===0)return'<span class="tree-null">[]</span>';let c='';data.forEach((item,i)=>{c+='<div class="tree-node">'+buildTree(item,i)+(i!==data.length-1?',':'')+'</div>';});return'<span class="tree-toggle">▶</span><span class="tree-key">['+(key!==null?key:'')+']</span><div class="tree-children">'+c+'</div>';}
if(t==='object'){const keys=Object.keys(data);if(keys.length===0)return'<span class="tree-null">{}</span>';let c='';keys.forEach((k,i)=>{c+='<div class="tree-node"><span class="tree-toggle">▶</span><span class="tree-key">"'+esc(k)+'"</span>: '+buildTree(data[k],k)+(i!==keys.length-1?',':'')+'</div>';});return'<div class="tree-children">'+c+'</div>';}
return String(data);}
function attachToggleEvents(){document.querySelectorAll('.tree-toggle').forEach(t=>{t.onclick=function(e){e.stopPropagation();const p=this.parentElement;p.classList.toggle('collapsed');this.textContent=p.classList.contains('collapsed')?'▶':'▼';};});}
function expandAll(){document.querySelectorAll('.tree-toggle').forEach(t=>{const p=t.parentElement;if(p.classList.contains('collapsed')){p.classList.remove('collapsed');t.textContent='▼';}});}
function collapseAll(){document.querySelectorAll('.tree-toggle').forEach(t=>{const p=t.parentElement;if(!p.classList.contains('collapsed')){p.classList.add('collapsed');t.textContent='▶';}});}
function clearAll(){document.getElementById('jsonInput').value='';document.getElementById('treeContainer').innerHTML='<span style="color:var(--muted);">'+getMsg('waiting')+'</span>';hideErr();}
function showErr(m){const e=document.getElementById('errorMsg');e.textContent=m;e.className='tool-msg error';}
function hideErr(){document.getElementById('errorMsg').className='tool-msg';}
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}
</script>
