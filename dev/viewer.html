<script>
  function renderTree() {
    const input = document.getElementById('jsonInput').value.trim();
    if (!input) { showError('è¯·è¾å?JSON æ°æ®'); return; }
    try { const obj = JSON.parse(input); const html = buildTree(obj); document.getElementById('treeContainer').innerHTML = html; hideError(); attachToggleEvents(); }
    catch(e) { showError('JSON è§£æéè¯¯: ' + e.message); }
  }
  function buildTree(data, key = null, isLast = true) {
    let type = typeof data;
    if (data === null) return `<span class="tree-null">null</span>`;
    if (type === 'string') return `<span class="tree-string">"${escapeHtml(data)}"</span>`;
    if (type === 'number') return `<span class="tree-number">${data}</span>`;
    if (type === 'boolean') return `<span class="tree-boolean">${data}</span>`;
    if (Array.isArray(data)) {
      if (data.length === 0) return `<span class="tree-null">[]</span>`;
      let children = '';
      data.forEach((item, idx) => { children += `<div class="tree-node">${buildTree(item, idx, idx === data.length-1)}${idx !== data.length-1 ? ',' : ''}</div>`; });
      return `<span class="tree-toggle">â?/span><span class="tree-key">[${key !== null ? key : ''}]</span><div class="tree-children">${children}</div>`;
    }
    if (type === 'object') {
      const keys = Object.keys(data);
      if (keys.length === 0) return `<span class="tree-null">{}</span>`;
      let children = '';
      keys.forEach((k, idx) => { children += `<div class="tree-node"><span class="tree-toggle">â?/span><span class="tree-key">"${escapeHtml(k)}"</span>: ${buildTree(data[k], k, idx === keys.length-1)}${idx !== keys.length-1 ? ',' : ''}</div>`; });
      return `<div class="tree-children">${children}</div>`;
    }
    return String(data);
  }
  function attachToggleEvents() { document.querySelectorAll('.tree-toggle').forEach(toggle => { toggle.onclick = function(e) { e.stopPropagation(); const parent = this.parentElement; parent.classList.toggle('collapsed'); this.textContent = parent.classList.contains('collapsed') ? 'â? : 'â?; }; }); }
  function expandAll() { document.querySelectorAll('.tree-toggle').forEach(t => { const p = t.parentElement; if(p.classList.contains('collapsed')){ p.classList.remove('collapsed'); t.textContent='â?; } }); }
  function collapseAll() { document.querySelectorAll('.tree-toggle').forEach(t => { const p = t.parentElement; if(!p.classList.contains('collapsed')){ p.classList.add('collapsed'); t.textContent='â?; } }); }
  function clearAll() { document.getElementById('jsonInput').value = ''; document.getElementById('treeContainer').innerHTML = '<span style="color:var(--muted);">ç­å¾è¾å¥ JSON...</span>'; hideError(); }
  function showError(msg) { const el = document.getElementById('errorMsg'); el.textContent = msg; el.style.display = 'block'; }
  function hideError() { document.getElementById('errorMsg').style.display = 'none'; }
  function escapeHtml(str) { return str.replace(/[&<>]/g, function(m){if(m==='&')return '&amp;';if(m==='<')return '&lt;';if(m==='>')return '&gt;';return m;}); }
</script>
