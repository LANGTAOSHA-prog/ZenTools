.btn:hover { opacity:.85; }

  <div class="page-header">
    <h1><span class="hl">CSS 压缩美化</span></h1>
    <p>压缩或美化 CSS 代码，支持展开/压缩模式切换。</p>
  </div>
  <div class="tool-box">
    
<label>输入 CSS 代码</label>
<textarea id="cssInput" rows="8" placeholder="粘贴 CSS 代码..."></textarea>
<div style="display:flex;gap:10px;margin-top:16px;flex-wrap:wrap;">
  <button class="btn" onclick="beautify()">美化</button>
  <button class="btn btn2" onclick="minify()">压缩</button>
  <button class="btn btn2" onclick="copyResult()">复制</button>
  <button class="btn btn2" onclick="document.getElementById('cssInput').value='';document.getElementById('cssResult').style.display='none';">清除</button>
</div>
<div class="result" id="cssResult" style="display:none;"></div>
  </div>
</div>
<script src="../assets/js/tool-ui.min.js"></script>
<script>

function beautify() {
  var v = document.getElementById('cssInput').value; if (!v) return;
  var r = v.replace(/\s+/g,' ').replace(/\s*{\s*/g,' {\n  ').replace(/;\s*/g,';\n  ').replace(/;\n\s*}/g,';\n}').replace(/,\s*/g,', ').replace(/\n\s*\n/g,'\n').trim();
  show(r);
}
function minify() {
  var v = document.getElementById('cssInput').value; if (!v) return;
  show(v.replace(/\/\*[\s\S]*?\*\//g,'').replace(/\s+/g,' ').replace(/\s*{\s*/g,'{').replace(/;\s*/g,';').replace(/}\s*/g,'}').replace(/,\s*/g,',').trim());
}
function show(t) { var el=document.getElementById('cssResult'); el.style.display='block'; el.textContent=t||'(空)'; }
function copyResult() { var el=document.getElementById('cssResult'); if(el.textContent) navigator.clipboard.writeText(el.textContent).then(function(){el.textContent+='\n\n✅ 已复制';}); }
</script>
<button class="bookmark-float" onclick="prompt('复制链接收藏本站','https://zentools.xyz')">⭐ 收藏本站</button>
</body>
