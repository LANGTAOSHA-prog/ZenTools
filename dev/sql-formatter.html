    <h1><span class="hl">SQL 格式化</span></h1>
    <p>格式化 SQL 查询语句，支持关键字高亮和缩进。</p>
  </div>
  <div class="tool-box">
    
<label>输入 SQL 语句</label>
<textarea id="sqlInput" rows="8" placeholder="SELECT * FROM users WHERE id = 1"></textarea>
<div style="display:flex;gap:10px;margin-top:16px;flex-wrap:wrap;">
  <button class="btn" onclick="formatSQL()">格式化</button>
  <button class="btn btn2" onclick="minifySQL()">压缩</button>
  <button class="btn btn2" onclick="copySQL()">复制</button>
</div>
<div class="result" id="sqlResult" style="display:none;"></div>
  </div>
</div>
<script src="../assets/js/tool-ui.min.js"></script>
<script>

var K = 'SELECT|FROM|WHERE|AND|OR|NOT|IN|LIKE|BETWEEN|JOIN|LEFT|RIGHT|INNER|OUTER|ON|INSERT|INTO|VALUES|UPDATE|SET|DELETE|CREATE|TABLE|DROP|ALTER|INDEX|VIEW|GROUP|BY|ORDER|ASC|DESC|HAVING|LIMIT|OFFSET|UNION|ALL|DISTINCT|AS|CASE|WHEN|THEN|ELSE|END|NULL|IS|EXISTS|COUNT|SUM|AVG|MIN|MAX|CAST|COALESCE|IFNULL';
var KW = K.split('|');
function formatSQL() {
  var v = document.getElementById('sqlInput').value.trim(); if(!v) return;
  var r = v.replace(/\s+/g,' ').replace(/,\s*/g,', ');
  KW.forEach(function(w){ r = r.replace(new RegExp('\\b'+w+'\\b','gi'),'\n'+w+'\n'); });
  r = r.replace(/\n{2,}/g,'\n').replace(/\n,/g,',').replace(/,/g,', ');
  var lines = r.split('\n'), out='', indent=0;
  lines.forEach(function(l){
    l=l.trim(); if(!l) return;
    var u=l.toUpperCase();
    if(u===')') indent=Math.max(0,indent-1);
    out += '  '.repeat(indent) + l + '\n';
    if(u==='('||KW.some(function(w){return u.endsWith(w)&&w!=='AS'&&w!='ON'&&w!='IN'})||u.endsWith('SELECT')||u.endsWith('FROM')||u.endsWith('WHERE')||u.endsWith('HAVING')||u.endsWith('ORDER BY')||u.endsWith('GROUP BY')||u.includes('JOIN')) indent++;
  });
  showSQL(out);
}
function minifySQL() {
  var v=document.getElementById('sqlInput').value; if(!v) return;
  showSQL(v.replace(/\s+/g,' ').trim());
}
function showSQL(t) { var el=document.getElementById('sqlResult'); el.style.display='block'; el.textContent=t||'(空)'; }
function copySQL() { var el=document.getElementById('sqlResult'); if(el.textContent) navigator.clipboard.writeText(el.textContent).then(function(){el.textContent+='\n\n✅ 已复制';}); }
</script>
