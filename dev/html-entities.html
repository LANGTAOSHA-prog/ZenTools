    <h1><span class="hl">HTML 实体编解码</span></h1>
    <p>HTML 特殊字符编码与解码，防止 XSS 和转义处理。</p>
  </div>
  <div class="tool-box">
    
<label>输入文本</label>
<textarea id="heInput" rows="6" placeholder="输入要编码或解码的文本...">&lt;script&gt;alert('test')&lt;/script&gt;</textarea>
<div style="display:flex;gap:10px;margin-top:16px;flex-wrap:wrap;">
  <button class="btn" onclick="encodeHE()">编码</button>
  <button class="btn btn2" onclick="decodeHE()">解码</button>
  <button class="btn btn2" onclick="copyHE()">复制结果</button>
</div>
<div class="result" id="heResult" style="display:none;"></div>
  </div>
</div>
<script src="../assets/js/tool-ui.js"></script>
<script>

function encodeHE(){var v=document.getElementById('heInput').value;showHE(v.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'));}
function decodeHE(){var v=document.getElementById('heInput').value;showHE(v.replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&#39;/g,"'").replace(/&amp;/g,'&'));}
function showHE(t){var el=document.getElementById('heResult');el.style.display='block';el.textContent=t;}
function copyHE(){var el=document.getElementById('heResult');if(el.textContent)navigator.clipboard.writeText(el.textContent);}
</script>
<button class="bookmark-float" onclick="prompt('复制链接收藏本站','https://zentools.xyz')">⭐ 收藏本站</button>
