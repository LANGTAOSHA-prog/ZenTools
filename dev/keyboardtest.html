<script>
let keyHistory=[];
document.addEventListener('keydown',function(e){e.preventDefault();document.getElementById('key').textContent=e.key;document.getElementById('code').textContent=e.code+' / keyCode: '+e.keyCode;keyHistory.unshift('<span class="h-item">'+esc(e.key)+' ('+esc(e.code)+')</span>');keyHistory=keyHistory.slice(0,20);document.getElementById('history').innerHTML=keyHistory.join('');});
function clearHistory(){keyHistory=[];document.getElementById('history').innerHTML='';}
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}
</script>
