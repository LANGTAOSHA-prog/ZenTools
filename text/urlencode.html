<div class="blob blob-1"></div><div class="blob blob-2"></div>
<div class="z-wrap"><nav><div class="nav-inner"><a class="logo" href="/">ZenTools<span>2.0</span></a><div class="nav-links"><a href="/">首页</a><a href="/text/">文本工具</a><a href="/tools.html">全部工具</a><select id="langSelect" class="lang-select"><option value="zh">中文</option><option value="en">English</option><option value="ja">日本語</option><option value="vi">Tiếng Việt</option></select></div></div></nav>
<div class="page-header reveal"><div class="breadcrumb"><a href="/">首页</a><span class="breadcrumb-sep">/</span><a href="/text/">文本工具</a><span class="breadcrumb-sep">/</span><span class="cur" data-i18n="crumbCur">URL编码解码</span></div><span class="page-eyebrow" data-i18n="eyebrow">文本工具</span><h1><span class="grad" data-i18n="h1Grad">URL编码解码</span><br/><span data-i18n="h1Sub">编码或解码URL</span></h1><p data-i18n="pageDesc">对文本进行 URL 编码（百分号编码）或解码，方便处理网址参数。</p></div>
<div class="tool-box reveal"><textarea id="input" placeholder="在此输入文本..." data-i18n-placeholder="placeholder"></textarea><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;"><button class="btn-primary" onclick="encode()" data-i18n="encodeBtn">编码</button><button class="btn-primary" onclick="decode()" data-i18n="decodeBtn">解码</button><button class="btn-primary" onclick="copyResult()" data-i18n="copyBtn">复制</button><button class="btn-primary" style="background:var(--glass-b);color:var(--text);box-shadow:none;" onclick="clearText()" data-i18n="clearBtn">清空</button></div><div class="status" id="status"></div></div>
<script>
window.ZT_PAGE={zh:{crumbCur:'URL编码解码',eyebrow:'文本工具',h1Grad:'URL编码解码',h1Sub:'编码或解码URL',pageDesc:'对文本进行 URL 编码（百分号编码）或解码，方便处理网址参数。',placeholder:'在此输入文本...',encodeBtn:'编码',decodeBtn:'解码',copyBtn:'复制',clearBtn:'清空',statusEncoded:'✅ 编码完成',statusDecoded:'✅ 解码完成',statusCopied:'✅ 已复制'},
en:{crumbCur:'URL Encode/Decode',h1Grad:'URL Encode/Decode',h1Sub:'Encode or Decode URL',pageDesc:'URL-encode or decode text for handling web parameters.',placeholder:'Enter text here...',encodeBtn:'Encode',decodeBtn:'Decode',copyBtn:'Copy',clearBtn:'Clear',statusEncoded:'✅ Encoded',statusDecoded:'✅ Decoded',statusCopied:'✅ Copied!'},
ja:{crumbCur:'URLエンコード/デコード',h1Grad:'URLエンコード/デコード',pageDesc:'URLエンコード（パーセントエンコーディング）またはデコード。',placeholder:'テキストを入力...',encodeBtn:'エンコード',decodeBtn:'デコード',copyBtn:'コピー',clearBtn:'クリア',statusEncoded:'✅ エンコード完了',statusDecoded:'✅ デコード完了',statusCopied:'✅ コピーしました！'},
vi:{crumbCur:'Mã hóa/Giải mã URL',h1Grad:'Mã hóa/Giải mã URL',pageDesc:'Mã hóa hoặc giải mã URL cho tham số web.',encodeBtn:'Mã hóa',decodeBtn:'Giải mã',copyBtn:'Sao chép',clearBtn:'Xóa',statusEncoded:'✅ Đã mã hóa',statusDecoded:'✅ Đã giải mã',statusCopied:'✅ Đã sao chép!'}
};
</script><script src="../assets/js/tool-ui.js"></script><script>
function getDict(){const l=localStorage.getItem('zentools_lang')||'zh';return(window.ZT_PAGE||{})[l]||window.ZT_PAGE.zh;}
function st(id,v){document.getElementById(id).textContent=v;}
function encode(){const v=encodeURIComponent(document.getElementById('input').value);document.getElementById('input').value=v;st('status',getDict().statusEncoded);}
function decode(){try{const v=decodeURIComponent(document.getElementById('input').value);document.getElementById('input').value=v;st('status',getDict().statusDecoded);}catch{st('status','⚠️ 解码失败，输入不是有效的URL编码');}}
function copyResult(){navigator.clipboard.writeText(document.getElementById('input').value).then(()=>{st('status',getDict().statusCopied);});}
function clearText(){document.getElementById('input').value='';st('status','');}
</script></body></html>
