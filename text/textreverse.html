<script>
window.ZT_PAGE={zh:{crumbCur:'文本反转',eyebrow:'文本工具',h1Grad:'文本反转',h1Sub:'反转文字或行',pageDesc:'反转文本字符串的顺序，或反转行的上下顺序。',placeholder:'在此输入文本...',reverseText:'反转文字',reverseLines:'反转行序',copyBtn:'复制',statusDone:'✅ 反转完成！',statusCopied:'✅ 已复制'},

};
</script><script src="../assets/js/tool-ui.js"></script><script>
function getDict(){const l=localStorage.getItem('zentools_lang')||'zh';return(window.ZT_PAGE||{})[l]||window.ZT_PAGE.zh;}
const el=()=>document.getElementById('input');
function reverseText(){const s=el().value;el().value=s.split('').reverse().join('');doc();}
function reverseLines(){const s=el().value;el().value=s.split('\n').reverse().join('\n');doc();}
function copyResult(){navigator.clipboard.writeText(el().value).then(()=>{document.getElementById('status').textContent=getDict().statusCopied;});}
function doc(){document.getElementById('status').textContent=getDict().statusDone;}
</script></body></html>
