<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>字数统计工具 - ZenTools</title>

<meta name="description" content="ZenTools 免费在线字数统计工具，支持字符、单词、段落、行数统计。">

<style>

:root{
  --bg:#0f172a;
  --card:#111827;
  --border:#1f2937;
  --text:#f3f4f6;
  --muted:#94a3b8;
  --blue:#2563eb;
  --green:#10b981;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:var(--bg);
  color:var(--text);
  font-family:Arial,"Noto Sans SC","Noto Sans JP",sans-serif;
  line-height:1.7;
}

.container{
  max-width:1000px;
  margin:auto;
  padding:40px 20px;
}

.top-bar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  flex-wrap:wrap;
  margin-bottom:20px;
}

.lang-select{
  background:#111827;
  color:white;
  border:1px solid #334155;
  border-radius:10px;
  padding:10px 12px;
}

.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:20px;
  padding:28px;
}

h1{
  margin-bottom:15px;
}

.desc{
  color:var(--muted);
  margin-bottom:25px;
}

textarea{
  width:100%;
  min-height:260px;
  padding:16px;
  border-radius:14px;
  border:1px solid #334155;
  background:#0f172a;
  color:white;
  resize:vertical;
  font-size:16px;
  line-height:1.7;
}

.actions{
  margin-top:20px;
}

button{
  background:var(--blue);
  color:white;
  border:none;
  padding:14px 20px;
  border-radius:12px;
  cursor:pointer;
  font-size:16px;
  font-weight:bold;
}

button:hover{
  opacity:.9;
}

.stats{
  margin-top:30px;
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:18px;
}

.stat-box{
  background:#0b1220;
  border:1px solid #1e293b;
  border-radius:16px;
  padding:20px;
  text-align:center;
}

.stat-box h3{
  font-size:16px;
  color:var(--muted);
  margin-bottom:10px;
}

.stat-box p{
  font-size:28px;
  font-weight:900;
}

.ad-box{
  margin:25px 0;
  height:110px;
  border:2px dashed #334155;
  border-radius:18px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#64748b;
}

footer{
  margin-top:50px;
  text-align:center;
  color:#94a3b8;
}

a{
  color:#60a5fa;
  text-decoration:none;
}

@media(max-width:768px){

  .top-bar{
    flex-direction:column;
  }

  .lang-select{
    width:100%;
  }

}

</style>
</head>

<body>

<div class="container">

  <div class="top-bar">

    <a href="index.html">
      ← Home
    </a>

    <select id="languageSelect" class="lang-select">
      <option value="zh">中文</option>
      <option value="ja">日本語</option>
      <option value="en">English</option>
      <option value="vi">Tiếng Việt</option>
    </select>

  </div>

  <div class="card">

    <h1 id="title">
      字数统计工具
    </h1>

    <p class="desc" id="desc">
      免费在线统计字符、单词、段落和行数。
    </p>

    <div class="ad-box">
      Google AdSense
    </div>

    <textarea
      id="textInput"
      placeholder="请输入文本..."
    ></textarea>

    <div class="actions">
      <button id="clearBtn">
        清空文本
      </button>
    </div>

    <div class="stats">

      <div class="stat-box">
        <h3 id="charLabel">字符数</h3>
        <p id="charCount">0</p>
      </div>

      <div class="stat-box">
        <h3 id="wordLabel">单词数</h3>
        <p id="wordCount">0</p>
      </div>

      <div class="stat-box">
        <h3 id="lineLabel">行数</h3>
        <p id="lineCount">0</p>
      </div>

      <div class="stat-box">
        <h3 id="paragraphLabel">段落数</h3>
        <p id="paragraphCount">0</p>
      </div>

    </div>

  </div>

  <footer>
    © 2026 ZenTools
  </footer>

</div>

<script>

const translations = {

  zh:{
    title:"字数统计工具",
    desc:"免费在线统计字符、单词、段落和行数。",
    placeholder:"请输入文本...",
    clear:"清空文本",
    chars:"字符数",
    words:"单词数",
    lines:"行数",
    paragraphs:"段落数"
  },

  ja:{
    title:"文字数カウントツール",
    desc:"文字数、単語数、段落数、行数を無料で集計。",
    placeholder:"テキストを入力...",
    clear:"クリア",
    chars:"文字数",
    words:"単語数",
    lines:"行数",
    paragraphs:"段落数"
  },

  en:{
    title:"Word Counter",
    desc:"Free online character, word, paragraph, and line counter.",
    placeholder:"Enter text...",
    clear:"Clear Text",
    chars:"Characters",
    words:"Words",
    lines:"Lines",
    paragraphs:"Paragraphs"
  },

  vi:{
    title:"Công cụ đếm từ",
    desc:"Thống kê ký tự, từ, đoạn và số dòng miễn phí.",
    placeholder:"Nhập văn bản...",
    clear:"Xóa văn bản",
    chars:"Ký tự",
    words:"Từ",
    lines:"Dòng",
    paragraphs:"Đoạn"
  }

};

const textInput = document.getElementById("textInput");

function updateStats(){

  const text = textInput.value;

  const chars = text.length;

  const words = text.trim()
    ? text.trim().split(/\s+/).length
    : 0;

  const lines = text
    ? text.split(/\n/).length
    : 0;

  const paragraphs = text.trim()
    ? text.trim().split(/\n\s*\n/).length
    : 0;

  document.getElementById("charCount").textContent = chars;
  document.getElementById("wordCount").textContent = words;
  document.getElementById("lineCount").textContent = lines;
  document.getElementById("paragraphCount").textContent = paragraphs;

}

textInput.addEventListener("input", updateStats);

document.getElementById("clearBtn").addEventListener("click", ()=>{

  textInput.value = "";

  updateStats();

});

const languageSelect = document.getElementById("languageSelect");

function setLanguage(lang){

  const data = translations[lang] || translations.zh;

  document.documentElement.lang = lang;

  document.getElementById("title").textContent = data.title;

  document.getElementById("desc").textContent = data.desc;

  document.getElementById("textInput").placeholder = data.placeholder;

  document.getElementById("clearBtn").textContent = data.clear;

  document.getElementById("charLabel").textContent = data.chars;

  document.getElementById("wordLabel").textContent = data.words;

  document.getElementById("lineLabel").textContent = data.lines;

  document.getElementById("paragraphLabel").textContent = data.paragraphs;

  localStorage.setItem("siteLanguage", lang);

}

languageSelect.addEventListener("change", e=>{

  setLanguage(e.target.value);

});

const savedLang = localStorage.getItem("siteLanguage") || "zh";

languageSelect.value = savedLang;

setLanguage(savedLang);

updateStats();

<script>
const seoData = {
  title: "工具名称 - 免费在线工具 | ZenTools",
  description: "免费在线工具名称，支持手机与电脑，无需安装软件。",
  keywords: "工具名称,在线工具,免费工具,ZenTools",
  url: "https://www.zentools.xyz/tool.html",
  image: "https://www.zentools.xyz/logo.png"
};

function setMeta(name, content){
  let meta = document.querySelector(`meta[name="${name}"]`);
  if(!meta){
    meta = document.createElement("meta");
    meta.setAttribute("name", name);
    document.head.appendChild(meta);
  }
  meta.setAttribute("content", content);
}

function setProperty(property, content){
  let meta = document.querySelector(`meta[property="${property}"]`);
  if(!meta){
    meta = document.createElement("meta");
    meta.setAttribute("property", property);
    document.head.appendChild(meta);
  }
  meta.setAttribute("content", content);
}

function setCanonical(url){
  let link = document.querySelector('link[rel="canonical"]');
  if(!link){
    link = document.createElement("link");
    link.setAttribute("rel", "canonical");
    document.head.appendChild(link);
  }
  link.setAttribute("href", url);
}

function applySEO(){
  document.title = seoData.title;

  setMeta("description", seoData.description);
  setMeta("keywords", seoData.keywords);
  setMeta("author", "ZenTools");

  setCanonical(seoData.url);

  setProperty("og:title", seoData.title);
  setProperty("og:description", seoData.description);
  setProperty("og:type", "website");
  setProperty("og:url", seoData.url);
  setProperty("og:image", seoData.image);

  setMeta("twitter:card", "summary_large_image");
  setMeta("twitter:title", seoData.title);
  setMeta("twitter:description", seoData.description);
}

applySEO();
</script>

</body>
</html>
