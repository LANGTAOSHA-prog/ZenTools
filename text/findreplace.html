<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><title>查找替换 - 免费在线工具 | ZenTools</title><meta name="description" content="在文本中查找并替换指定内容，支持区分大小写。"/><link rel="canonical" href="https://langtaosha-prog.github.io/ZenTools/text/findreplace.html"/><link rel="stylesheet" href="../assets/css/tool-ui.css"/><style>textarea{width:100%;min-height:180px;padding:16px;border:1px solid var(--border);border-radius:12px;background:rgba(255,255,255,0.03);color:var(--text);font-size:14px;line-height:1.6;resize:vertical;outline:none;font-family:inherit}textarea:focus{border-color:var(--border-h)}.fr-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:12px}.fr-row input{flex:1;min-width:150px;padding:12px 14px;border:1px solid var(--border);border-radius:10px;background:rgba(255,255,255,0.03);color:var(--text);font-size:14px;outline:none}.fr-row input:focus{border-color:var(--border-h)}.fr-row label{color:var(--muted);font-size:13px;display:flex;align-items:center;gap:6px;cursor:pointer}</style></head><body>
<div class="blob blob-1"></div><div class="blob blob-2"></div>
<div class="z-wrap"><nav><div class="nav-inner"><a class="logo" href="/">ZenTools<span>2.0</span></a><div class="nav-links"><a href="/">首页</a><a href="/text/">文本工具</a><a href="/tools.html">全部工具</a><select id="langSelect" class="lang-select"><option value="zh">中文</option><option value="en">English</option><option value="ja">日本語</option><option value="vi">Tiếng Việt</option></select></div></div></nav>
<div class="page-header reveal"><div class="breadcrumb"><a href="/">首页</a><span class="breadcrumb-sep">/</span><a href="/text/">文本工具</a><span class="breadcrumb-sep">/</span><span class="cur" data-i18n="crumbCur">查找替换</span></div><span class="page-eyebrow" data-i18n="eyebrow">文本工具</span><h1><span class="grad" data-i18n="h1Grad">查找替换</span><br/><span data-i18n="h1Sub">查找并替换文本</span></h1><p data-i18n="pageDesc">在文本中快速查找并替换指定内容，支持区分大小写。</p></div>
<div class="tool-box reveal"><textarea id="input" placeholder="在此输入文本..." data-i18n-placeholder="placeholder"></textarea>
<div class="fr-row"><input type="text" id="findText" placeholder="查找..." data-i18n-placeholder="findPlace"/><input type="text" id="replaceText" placeholder="替换为..." data-i18n-placeholder="replacePlace"/></div>
<div class="fr-row"><label><input type="checkbox" id="caseSensitive"/><span data-i18n="caseLabel">区分大小写</span></label><button class="btn-primary" onclick="replaceAll()" data-i18n="replaceBtn">全部替换</button></div>
<div class="status" id="status"></div></div>
<script>
window.ZT_PAGE={zh:{crumbCur:'查找替换',eyebrow:'文本工具',h1Grad:'查找替换',h1Sub:'查找并替换文本',pageDesc:'在文本中快速查找并替换指定内容，支持区分大小写。',placeholder:'在此输入文本...',findPlace:'查找...',replacePlace:'替换为...',caseLabel:'区分大小写',replaceBtn:'全部替换',statusDone:'✅ 替换完成！共 {n} 处',statusCopied:'✅ 已复制',statusEmpty:''},
en:{crumbCur:'Find & Replace',h1Grad:'Find & Replace',pageDesc:'Quickly find and replace text, with case-sensitive option.',placeholder:'Enter text here...',findPlace:'Find...',replacePlace:'Replace with...',caseLabel:'Case sensitive',replaceBtn:'Replace All',statusDone:'✅ Done! {n} replacements',statusCopied:'✅ Copied!'},
ja:{crumbCur:'検索置換',h1Grad:'検索と置換',pageDesc:'テキストを検索して置換。大文字小文字の区別対応。',placeholder:'テキストを入力...',findPlace:'検索...',replacePlace:'置換...',caseLabel:'大文字小文字を区別',replaceBtn:'すべて置換',statusDone:'✅ 完了！{n} 箇所置換',statusCopied:'✅ コピーしました！'},
vi:{crumbCur:'Tìm và thay thế',h1Grad:'Tìm và thay thế',pageDesc:'Tìm và thay thế văn bản nhanh chóng.',placeholder:'Nhập văn bản...',findPlace:'Tìm...',replacePlace:'Thay bằng...',caseLabel:'Phân biệt hoa thường',replaceBtn:'Thay thế tất cả',statusDone:'✅ Hoàn tất! {n} thay thế',statusCopied:'✅ Đã sao chép!'}
};
</script><script src="../assets/js/tool-ui.js"></script><script>
function getDict(){const l=localStorage.getItem('zentools_lang')||'zh';return(window.ZT_PAGE||{})[l]||window.ZT_PAGE.zh;}
function replaceAll(){const el=document.getElementById('input');const find=document.getElementById('findText').value;const replace=document.getElementById('replaceText').value;const cs=document.getElementById('caseSensitive').checked;const dict=getDict();if(!find){return;}
let count=0;let result;if(cs){const regex=new RegExp(find.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'g');result=el.value.replace(regex,m=>{count++;return replace;});}else{const regex=new RegExp(find.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi');result=el.value.replace(regex,m=>{count++;return replace;});}
el.value=result;document.getElementById('status').textContent=dict.statusDone.replace('{n}',count);}
</script></body></html>
