function getDict(){const l=localStorage.getItem('zentools_lang')||'zh';return(window.ZT_PAGE||{})[l]||window.ZT_PAGE.zh;}
function LCS(a,b){const m=a.length,n=b.length;const dp=Array.from({length:m+1},()=>Array(n+1).fill(0));for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)dp[i][j]=a[i-1]===b[j-1]?dp[i-1][j-1]+1:Math.max(dp[i-1][j],dp[i][j-1]);return dp;}
function diff(a,b){const dp=LCS(a,b);let i=a.length,j=b.length;const result=[];while(i>0||j>0){if(i>0&&j>0&&a[i-1]===b[j-1]){result.unshift({type:'same',text:a[i-1]});i--;j--;}else if(j>0&&(i===0||dp[i][j-1]>=dp[i-1][j])){result.unshift({type:'add',text:b[j-1]});j--;}else{result.unshift({type:'remove',text:a[i-1]});i--;}}return result;}
function compare(){const a=document.getElementById('textA').value.split('\n');const b=document.getElementById('textB').value.split('\n');const result=document.getElementById('result');const output=document.getElementById('diffOutput');const dict=getDict();
const lines=diff(a,b);const hasDiff=lines.some(l=>l.type!=='same');
if(!hasDiff){document.getElementById('status').textContent=dict.statusIdentical;result.classList.remove('visible');return;}
document.getElementById('status').textContent=dict.statusDiff;
output.innerHTML=lines.map(l=>{if(l.type==='same')return `<span class="diff-same">${l.text||' '}</span>`;if(l.type==='add')return `<span class="diff-add">+ ${l.text}</span>`;return `<span class="diff-remove">- ${l.text}</span>`;}).join('\n');
result.classList.add('visible');}
</script>
