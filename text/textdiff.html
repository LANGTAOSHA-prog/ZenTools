<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><title>文本对比 - 免费在线工具 | ZenTools</title><meta name="description" content="对比两段文本的差异，高亮显示不同之处，免费在线使用。"/><link rel="canonical" href="https://langtaosha-prog.github.io/ZenTools/text/textdiff.html"/><link rel="stylesheet" href="../assets/css/tool-ui.css"/><style>.diff-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}@media(max-width:768px){.diff-grid{grid-template-columns:1fr}}.diff-panel{display:flex;flex-direction:column;gap:8px}.diff-panel label{font-size:12px;color:var(--muted);font-weight:600}.diff-panel textarea{width:100%;min-height:200px;padding:12px;border:1px solid var(--border);border-radius:10px;background:rgba(255,255,255,0.03);color:var(--text);font-size:13px;line-height:1.5;resize:vertical;outline:none;font-family:Consolas,monospace}.diff-panel textarea:focus{border-color:var(--border-h)}.diff-result{margin-top:20px;display:none}.diff-result.visible{display:block}.diff-result pre{background:rgba(255,255,255,0.02);border:1px solid var(--border);border-radius:10px;padding:16px;font-size:13px;line-height:1.6;white-space:pre-wrap;font-family:Consolas,monospace}.diff-add{background:rgba(16,185,129,0.15);color:#34d399}.diff-remove{background:rgba(239,68,68,0.15);color:#f87171}.diff-same{color:var(--text)}</style><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1955887568822472"

<div class="blob blob-1"></div><div class="blob blob-2"></div>
<div class="z-wrap"><nav><div class="nav-inner"><a class="logo" href="/">ZenTools<span>2.0</span></a><div class="nav-links"><a href="/">首页</a><a href="/text/">文本工具</a><a href="/tools.html">全部工具</a><select id="langSelect" class="lang-select"><option value="zh">中文</option><option value="en">English</option><option value="ja">日本語</option><option value="vi">Tiếng Việt</option></select></div></div></nav>
<div class="page-header reveal"><div class="breadcrumb"><a href="/">首页</a><span class="breadcrumb-sep">/</span><a href="/text/">文本工具</a><span class="breadcrumb-sep">/</span><span class="cur" data-i18n="crumbCur">文本对比</span></div><span class="page-eyebrow" data-i18n="eyebrow">文本工具</span><h1><span class="grad" data-i18n="h1Grad">文本对比</span><br/><span data-i18n="h1Sub">对比两段文本差异</span></h1><p data-i18n="pageDesc">并排对比两段文本内容，高亮显示新增和删除的行。</p></div>
<div class="tool-box reveal">
<div class="diff-grid"><div class="diff-panel"><label data-i18n="labelA">原始文本</label><textarea id="textA" placeholder="原始文本..." data-i18n-placeholder="placeholderA"></textarea></div><div class="diff-panel"><label data-i18n="labelB">修改后文本</label><textarea id="textB" placeholder="修改后文本..." data-i18n-placeholder="placeholderB"></textarea></div></div>
<div style="margin-top:16px;"><button class="btn-primary" onclick="compare()" data-i18n="compareBtn">开始对比</button></div>
<div class="diff-result" id="result"><h3 data-i18n="resultTitle" style="font-size:15px;font-weight:600;margin-bottom:8px;">对比结果</h3><pre id="diffOutput"></pre></div>
<div class="status" id="status"></div></div>
<script>
window.ZT_PAGE={zh:{crumbCur:'文本对比',eyebrow:'文本工具',h1Grad:'文本对比',h1Sub:'对比两段文本差异',pageDesc:'并排对比两段文本内容，高亮显示新增和删除的行。',labelA:'原始文本',labelB:'修改后文本',placeholderA:'原始文本...',placeholderB:'修改后文本...',compareBtn:'开始对比',resultTitle:'对比结果',statusIdentical:'✅ 两段文本完全相同',statusDiff:'差异如下：'},
en:{crumbCur:'Text Diff',h1Grad:'Text Diff',h1Sub:'Compare Two Texts',pageDesc:'Side-by-side comparison of two texts, highlighting additions and deletions.',labelA:'Original Text',labelB:'Modified Text',placeholderA:'Original text...',placeholderB:'Modified text...',compareBtn:'Compare',resultTitle:'Result',statusIdentical:'✅ Texts are identical',statusDiff:'Differences found:'},
ja:{crumbCur:'テキスト比較',h1Grad:'テキスト比較',h1Sub:'2つのテキストを比較',pageDesc:'2つのテキストを並べて比較し、追加・削除をハイライト。',labelA:'元のテキスト',labelB:'修正後テキスト',compareBtn:'比較',resultTitle:'比較結果',statusIdentical:'✅ テキストは同一です',statusDiff:'差異があります：'},
vi:{crumbCur:'So sánh văn bản',h1Grad:'So sánh văn bản',h1Sub:'So sánh hai văn bản',pageDesc:'So sánh hai văn bản, làm nổi bật thêm và xóa.',labelA:'Văn bản gốc',labelB:'Văn bản sửa đổi',compareBtn:'So sánh',resultTitle:'Kết quả',statusIdentical:'✅ Hai văn bản giống hệt nhau',statusDiff:'Sự khác biệt:'}
};
</script><script src="../assets/js/tool-ui.js"></script><script>
function getDict(){const l=localStorage.getItem('zentools_lang')||'zh';return(window.ZT_PAGE||{})[l]||window.ZT_PAGE.zh;}
function LCS(a,b){const m=a.length,n=b.length;const dp=Array.from({length:m+1},()=>Array(n+1).fill(0));for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)dp[i][j]=a[i-1]===b[j-1]?dp[i-1][j-1]+1:Math.max(dp[i-1][j],dp[i][j-1]);return dp;}
function diff(a,b){const dp=LCS(a,b);let i=a.length,j=b.length;const result=[];while(i>0||j>0){if(i>0&&j>0&&a[i-1]===b[j-1]){result.unshift({type:'same',text:a[i-1]});i--;j--;}else if(j>0&&(i===0||dp[i][j-1]>=dp[i-1][j])){result.unshift({type:'add',text:b[j-1]});j--;}else{result.unshift({type:'remove',text:a[i-1]});i--;}}return result;}
function compare(){const a=document.getElementById('textA').value.split('\n');const b=document.getElementById('textB').value.split('\n');const result=document.getElementById('result');const output=document.getElementById('diffOutput');const dict=getDict();
const lines=diff(a,b);const hasDiff=lines.some(l=>l.type!=='same');
if(!hasDiff){document.getElementById('status').textContent=dict.statusIdentical;result.classList.remove('visible');return;}
document.getElementById('status').textContent=dict.statusDiff;
output.innerHTML=lines.map(l=>{if(l.type==='same')return `<span class="diff-same">${l.text||' '}</span>`;if(l.type==='add')return `<span class="diff-add">+ ${l.text}</span>`;return `<span class="diff-remove">- ${l.text}</span>`;}).join('\n');
result.classList.add('visible');}
</script></body></html>
