<div class="tool-box reveal"><textarea id="input" placeholder="粘贴包含链接的文本..." data-i18n-placeholder="placeholder"></textarea><div style="margin-top:12px;"><button class="btn-primary" onclick="extract()" data-i18n="extractBtn">提取链接</button></div>

window.ZT_PAGE={zh:{crumbCur:'链接提取',eyebrow:'文本工具',h1Grad:'链接提取',h1Sub:'提取所有链接',pageDesc:'从文本中提取所有 URL 链接地址，支持 http/https 协议。',placeholder:'粘贴包含链接的文本...',extractBtn:'提取链接',copyBtn:'复制全部链接',statusFound:'✅ 找到 {n} 个链接',statusNone:'未找到链接',statusCopied:'✅ 已复制 {n} 个链接'},
en:{crumbCur:'Link Extractor',h1Grad:'Link Extractor',h1Sub:'Extract All Links',pageDesc:'Extract all URLs from text, supports http/https.',placeholder:'Paste text containing links...',extractBtn:'Extract Links',copyBtn:'Copy All Links',statusFound:'✅ Found {n} links',statusNone:'No links found',statusCopied:'✅ Copied {n} links'},
ja:{crumbCur:'リンク抽出',h1Grad:'リンク抽出',h1Sub:'すべてのリンクを抽出',pageDesc:'テキストからすべてのURLを抽出（http/https対応）。',placeholder:'リンクを含むテキストを貼り付け...',extractBtn:'抽出',copyBtn:'すべてコピー',statusFound:'✅ {n} 個のリンクを見つけました',statusNone:'リンクが見つかりません',statusCopied:'✅ {n} 個のリンクをコピーしました'},
vi:{crumbCur:'Trích xuất liên kết',h1Grad:'Trích xuất liên kết',h1Sub:'Trích xuất tất cả liên kết',pageDesc:'Trích xuất tất cả URL từ văn bản.',placeholder:'Dán văn bản chứa liên kết...',extractBtn:'Trích xuất',copyBtn:'Sao chép tất cả',statusFound:'✅ Tìm thấy {n} liên kết',statusNone:'Không tìm thấy liên kết',statusCopied:'✅ Đã sao chép {n} liên kết'}
};
</script><script src="../assets/js/tool-ui.js"></script><script>
function getDict(){const l=localStorage.getItem('zentools_lang')||'zh';return(window.ZT_PAGE||{})[l]||window.ZT_PAGE.zh;}
let foundLinks=[];
function extract(){const text=document.getElementById('input').value;const urlRegex=/https?:\/\/[^\s<>"''（）)]+/g;foundLinks=text.match(urlRegex)||[];const dict=getDict();const r=document.getElementById('result');const l=document.getElementById('linkList');if(!foundLinks.length){document.getElementById('status').textContent=dict.statusNone;r.classList.remove('visible');return;}
document.getElementById('status').textContent=dict.statusFound.replace('{n}',foundLinks.length);l.innerHTML=foundLinks.map((url,i)=>`<div class="link-item"><span class="idx">${i+1}.</span><a href="${url}" target="_blank">${url}</a></div>`).join('');r.classList.add('visible');}
function copyAll(){const dict=getDict();navigator.clipboard.writeText(foundLinks.join('\n')).then(()=>{document.getElementById('status').textContent=dict.statusCopied.replace('{n}',foundLinks.length);});}
</script></body></html>
