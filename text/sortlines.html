<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><title>文本排序 - 免费在线工具 | ZenTools</title><meta name="description" content="将文本行按字母顺序排序，支持升序、降序和随机打乱。"/><link rel="canonical" href="https://langtaosha-prog.github.io/ZenTools/text/sortlines.html"/><link rel="stylesheet" href="../assets/css/tool-ui.css"/><style>textarea{width:100%;min-height:200px;padding:16px;border:1px solid var(--border);border-radius:12px;background:rgba(255,255,255,0.03);color:var(--text);font-size:14px;line-height:1.6;resize:vertical;outline:none;font-family:Consolas,monospace}textarea:focus{border-color:var(--border-h)}</style><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1955887568822472"
     crossorigin="anonymous"></script>
</head><body>
<div class="blob blob-1"></div><div class="blob blob-2"></div>
<div class="z-wrap"><nav><div class="nav-inner"><a class="logo" href="/">ZenTools<span>2.0</span></a><div class="nav-links"><a href="/">首页</a><a href="/text/">文本工具</a><a href="/tools.html">全部工具</a><select id="langSelect" class="lang-select"><option value="zh">中文</option><option value="en">English</option><option value="ja">日本語</option><option value="vi">Tiếng Việt</option></select></div></div></nav>
<div class="page-header reveal"><div class="breadcrumb"><a href="/">首页</a><span class="breadcrumb-sep">/</span><a href="/text/">文本工具</a><span class="breadcrumb-sep">/</span><span class="cur" data-i18n="crumbCur">文本排序</span></div><span class="page-eyebrow" data-i18n="eyebrow">文本工具</span><h1><span class="grad" data-i18n="h1Grad">文本排序</span><br/><span data-i18n="h1Sub">排序文本行</span></h1><p data-i18n="pageDesc">将文本中的行按字母顺序升序、降序排列或随机打乱。</p></div>
<div class="tool-box reveal"><textarea id="input" placeholder="每行输入一条内容..." data-i18n-placeholder="placeholder"></textarea><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;"><button class="btn-primary" onclick="sortAZ()" data-i18n="sortAZ">A → Z</button><button class="btn-primary" onclick="sortZA()" data-i18n="sortZA">Z → A</button><button class="btn-primary" onclick="shuffle()" data-i18n="shuffle">随机打乱</button><button class="btn-primary" onclick="copyResult()" data-i18n="copyBtn">复制</button></div><div class="status" id="status"></div></div>
<script>
window.ZT_PAGE={zh:{crumbCur:'文本排序',eyebrow:'文本工具',h1Grad:'文本排序',h1Sub:'排序文本行',pageDesc:'将文本中的行按字母顺序升序、降序排列或随机打乱。',placeholder:'每行输入一条内容...',sortAZ:'A → Z',sortZA:'Z → A',shuffle:'随机打乱',copyBtn:'复制结果',statusDone:'✅ 排序完成！共 {n} 行',statusCopied:'✅ 已复制'},
en:{crumbCur:'Sort Lines',h1Grad:'Sort Lines',h1Sub:'Sort Text Lines',pageDesc:'Sort lines alphabetically A-Z, Z-A or shuffle randomly.',placeholder:'One item per line...',sortAZ:'A → Z',sortZA:'Z → A',shuffle:'Shuffle',copyBtn:'Copy',statusDone:'✅ Done! {n} lines',statusCopied:'✅ Copied!'},
ja:{crumbCur:'テキスト並び替え',h1Grad:'行並び替え',h1Sub:'テキスト行をソート',sortAZ:'昇順',sortZA:'降順',shuffle:'シャッフル',copyBtn:'コピー',statusDone:'✅ 完了！{n}行',statusCopied:'✅ コピーしました！'},
vi:{crumbCur:'Sắp xếp văn bản',h1Grad:'Sắp xếp dòng',pageDesc:'Sắp xếp các dòng theo thứ tự A-Z, Z-A hoặc ngẫu nhiên.',sortAZ:'A → Z',sortZA:'Z → A',shuffle:'Ngẫu nhiên',copyBtn:'Sao chép',statusDone:'✅ Hoàn tất! {n} dòng',statusCopied:'✅ Đã sao chép!'}
};
</script><script src="../assets/js/tool-ui.js"></script><script>
function getDict(){const l=localStorage.getItem('zentools_lang')||'zh';return(window.ZT_PAGE||{})[l]||window.ZT_PAGE.zh;}
const el=()=>document.getElementById('input');
function sortAZ(){const lines=el().value.split('\n').filter(l=>l.trim());lines.sort((a,b)=>a.localeCompare(b));el().value=lines.join('\n');done(lines.length);}
function sortZA(){const lines=el().value.split('\n').filter(l=>l.trim());lines.sort((a,b)=>b.localeCompare(a));el().value=lines.join('\n');done(lines.length);}
function shuffle(){const lines=el().value.split('\n').filter(l=>l.trim());for(let i=lines.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[lines[i],lines[j]]=[lines[j],lines[i]];}el().value=lines.join('\n');done(lines.length);}
function copyResult(){navigator.clipboard.writeText(el().value).then(()=>{document.getElementById('status').textContent=getDict().statusCopied;});}
function done(n){document.getElementById('status').textContent=getDict().statusDone.replace('{n}',n);}
</script></body></html>
