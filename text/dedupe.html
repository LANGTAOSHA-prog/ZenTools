<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><title>去重工具 - 免费在线工具 | ZenTools</title><meta name="description" content="去除文本中的重复行或重复内容，免费在线使用。"/><link rel="canonical" href="https://langtaosha-prog.github.io/ZenTools/text/dedupe.html"/><link rel="stylesheet" href="../assets/css/tool-ui.css"/><style>textarea{width:100%;min-height:200px;padding:16px;border:1px solid var(--border);border-radius:12px;background:rgba(255,255,255,0.03);color:var(--text);font-size:14px;line-height:1.6;resize:vertical;outline:none;font-family:Consolas,monospace}textarea:focus{border-color:var(--border-h)}</style></head><body>
<div class="blob blob-1"></div><div class="blob blob-2"></div>
<div class="z-wrap"><nav><div class="nav-inner"><a class="logo" href="/">ZenTools<span>2.0</span></a><div class="nav-links"><a href="/">首页</a><a href="/text/">文本工具</a><a href="/tools.html">全部工具</a><select id="langSelect" class="lang-select"><option value="zh">中文</option><option value="en">English</option><option value="ja">日本語</option><option value="vi">Tiếng Việt</option></select></div></div></nav>
<div class="page-header reveal"><div class="breadcrumb"><a href="/">首页</a><span class="breadcrumb-sep">/</span><a href="/text/">文本工具</a><span class="breadcrumb-sep">/</span><span class="cur" data-i18n="crumbCur">去重工具</span></div><span class="page-eyebrow" data-i18n="eyebrow">文本工具</span><h1><span class="grad" data-i18n="h1Grad">去重工具</span><br/><span data-i18n="h1Sub">去除重复内容</span></h1><p data-i18n="pageDesc">去除文本中的重复行，保留首次出现的唯一内容。</p></div>
<div class="tool-box reveal"><textarea id="input" placeholder="每行一条内容，粘贴重复的文本..." data-i18n-placeholder="placeholder"></textarea><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;"><button class="btn-primary" onclick="dedupe()" data-i18n="dedupeBtn">去重</button><button class="btn-primary" onclick="copyResult()" data-i18n="copyBtn">复制结果</button><button class="btn-primary" style="background:var(--glass-b);color:var(--text);box-shadow:none;" onclick="clearText()" data-i18n="clearBtn">清空</button></div>
<div class="status" id="status"></div></div>
<script>
window.ZT_PAGE={zh:{crumbCur:'去重工具',eyebrow:'文本工具',h1Grad:'去重工具',h1Sub:'去除重复内容',pageDesc:'去除文本中的重复行，保留首次出现的唯一内容。',placeholder:'每行一条内容，粘贴重复的文本...',dedupeBtn:'去重',copyBtn:'复制结果',clearBtn:'清空',statusDone:'✅ 去重完成！剩余 {n} 行（原 {m} 行）',statusCopied:'✅ 已复制',statusEmpty:''},
en:{crumbCur:'Deduplicate',eyebrow:'TEXT TOOLS',h1Grad:'Deduplicate',h1Sub:'Remove Duplicates',pageDesc:'Remove duplicate lines from text, keeping first occurrence.',placeholder:'Paste text with duplicates, one per line...',dedupeBtn:'Dedupe',copyBtn:'Copy',clearBtn:'Clear',statusDone:'✅ Done! {n} lines remain (from {m})',statusCopied:'✅ Copied!'},
ja:{crumbCur:'重複削除',h1Grad:'重複削除',h1Sub:'重複行を削除',pageDesc:'テキストの重複行を削除し、最初の出現を保持。',placeholder:'重複したテキストを貼り付け...',dedupeBtn:'重複削除',copyBtn:'コピー',clearBtn:'クリア',statusDone:'✅ 完了！{n}行（元{m}行）',statusCopied:'✅ コピーしました！'},
vi:{crumbCur:'Xóa trùng lặp',h1Grad:'Xóa trùng lặp',h1Sub:'Xóa nội dung trùng',pageDesc:'Xóa các dòng trùng lặp khỏi văn bản.',placeholder:'Dán văn bản có trùng lặp...',dedupeBtn:'Xóa trùng',copyBtn:'Sao chép',clearBtn:'Xóa',statusDone:'✅ Hoàn tất! {n} dòng (từ {m})',statusCopied:'✅ Đã sao chép!'}
};
</script><script src="../assets/js/tool-ui.js"></script><script>
function getDict(){const l=localStorage.getItem('zentools_lang')||'zh';return(window.ZT_PAGE||{})[l]||window.ZT_PAGE.zh;}
function dedupe(){const el=document.getElementById('input');const lines=el.value.split('\n');const seen=new Set();const result=[];for(const line of lines){if(!seen.has(line)){seen.add(line);result.push(line);}}const dict=getDict();el.value=result.join('\n');document.getElementById('status').textContent=dict.statusDone.replace('{n}',result.length).replace('{m}',lines.length);}
function copyResult(){const el=document.getElementById('input');navigator.clipboard.writeText(el.value).then(()=>{document.getElementById('status').textContent=getDict().statusCopied;});}
function clearText(){document.getElementById('input').value='';document.getElementById('status').textContent='';}
</script></body></html>
