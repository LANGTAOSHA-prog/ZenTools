<!-- ===== 返回顶部 ===== -->
<button class="back-top" id="backTop" onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:24px;right:24px;z-index:200;width:42px;height:42px;border-radius:12px;background:var(--surface);border:1px solid var(--border);color:var(--text);font-size:18px;cursor:pointer;opacity:0;pointer-events:none;transition:all .3s;">�?/button>

<script>
  // ===== 基础功能 =====
  document.getElementById('year').textContent = new Date().getFullYear();

  function initTheme() {
    const s = localStorage.getItem('zh_theme') || 'dark';
    document.documentElement.setAttribute('data-theme', s);
    document.getElementById('themeBtn').textContent = s === 'dark' ? '☀�? : '🌙';
  }
  function toggleTheme() {
    const c = document.documentElement.getAttribute('data-theme');
    const n = c === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', n);
    localStorage.setItem('zh_theme', n);
    document.getElementById('themeBtn').textContent = n === 'dark' ? '☀�? : '🌙';
  }
  initTheme();

  // 返回顶部
  const backTop = document.getElementById('backTop');
  window.addEventListener('scroll', () => {
    backTop.style.opacity = window.scrollY > 300 ? '1' : '0';
    backTop.style.pointerEvents = window.scrollY > 300 ? 'all' : 'none';
  });

  // ===== 最近使�?(localStorage) =====
  function loadRecent() {
    const list = JSON.parse(localStorage.getItem('����Сվ-ZenTools_recent') || '[]');
    const container = document.getElementById('recentList');
    const section = document.getElementById('recentSection');
    if (!list.length) { section.classList.remove('visible'); return; }
    section.classList.add('visible');
    container.innerHTML = list.map(url =>
      `<a href="${url}">${url.split('/').pop().replace('.html','')}</a>`
    ).join('');
  }
  function addRecent(url) {
    let list = JSON.parse(localStorage.getItem('����Сվ-ZenTools_recent') || '[]');
    list = list.filter(item => item !== url);
    list.unshift(url);
    if (list.length > 5) list = list.slice(0, 5);
    localStorage.setItem('����Сվ-ZenTools_recent', JSON.stringify(list));
    loadRecent();
  }
  loadRecent();

  // ===== 分类图标映射 =====
  const CATEGORY_ICONS = {
    'AI工具': '🤖',
    '图片工具': '🖼�?,
    'PDF工具': '📄',
    '文本工具': '📝',
    '视频工具': '🎬',
    '音频工具': '🔊',
    '开发工�?: '💻',
    'SEO工具': '🔍',
    '办公工具': '📎',
    '生活工具': '🌍',
    '金融工具': '💰',
    '教育工具': '📚'
  };

  // ===== �?JSON 加载工具数据 =====
  (function() {
    const grid = document.getElementById('toolsGrid');
    const hot = document.getElementById('hotScroll');
    const ribbon = document.getElementById('categoryRibbon');

    // 渲染分类快捷入口
    function renderCategories(categories) {
      if (!categories || !categories.length) return;
      let html = '';
      for (const cat of categories) {
        const icon = CATEGORY_ICONS[cat] || '🔧';
        // 根据分类名生成目录路�?
        let path = '';
        if (cat === 'AI工具') path = '/ai/index.html';
        else if (cat === '图片工具') path = '/image/index.html';
        else if (cat === 'PDF工具') path = '/pdf/index.html';
        else if (cat === '文本工具') path = '/text/index.html';
        else if (cat === '视频工具') path = '/video/index.html';
        else if (cat === '音频工具') path = '/audio/index.html';
        else if (cat === '开发工�?) path = '/dev/index.html';
        else if (cat === '生活工具') path = '/life/index.html';
        else path = '/categories.html#' + encodeURIComponent(cat);
        html += `<a href="${path}"><span class="cat-icon">${icon}</span> ${cat}</a>`;
      }
      ribbon.innerHTML = html;
    }

    function renderTools(tools) {
      if (!tools || !tools.length) {
        grid.innerHTML = `<div style="grid-column:1/-1;text-align:center;padding:30px;color:var(--muted);">暂无工具</div>`;
        return;
      }
      // 全部工具 (取前 8 �?
      const list = tools.filter(t => t.featured !== false).slice(0, 8);
      let html = '';
      for (const t of list) {
        const url = t.url && t.url !== '#' ? t.url : '#';
        const target = url !== '#' ? '_blank' : '';
        html += `
          <a class="tool-card" href="${url}" target="${target}" onclick="addRecent('${url}')">
            <span class="emoji">${t.icon || '🔧'}</span>
            <div class="name">${t.name}</div>
            <div class="desc">${t.description || ''}</div>
            <span class="tag">${t.category || '工具'}</span>
          </a>
        `;
      }
      grid.innerHTML = html;

      // 热门工具 (横向滚动)
      const hotTools = tools.filter(t => t.featured === true).slice(0, 8);
      let hotHtml = '';
      for (const t of hotTools) {
        const url = t.url && t.url !== '#' ? t.url : '#';
        const target = url !== '#' ? '_blank' : '';
        hotHtml += `
          <a class="hot-item" href="${url}" target="${target}" onclick="addRecent('${url}')">
            <span class="emoji">${t.icon || '🔧'}</span>
            <div class="name">${t.name}</div>
            <span class="tag">${t.category || ''}</span>
          </a>
        `;
      }
      hot.innerHTML = hotHtml || '<div style="text-align:center;padding:20px;color:var(--muted);width:100%;">暂无热门工具</div>';
    }

    fetch('/data/tools-data.json')
      .then(r => r.ok ? r.json() : Promise.reject('HTTP ' + r.status))
      .then(data => {
        if (data?.categories) renderCategories(data.categories);
        if (data?.tools) renderTools(data.tools);
        else renderTools(null);
      })
      .catch(() => {
        // 备用数据
        renderTools([
          { name: 'PDF 合并', url: '/pdf/merge.html', icon: '📄', category: 'PDF工具', featured: true },
          { name: '图片压缩', url: '/image/compress.html', icon: '📦', category: '图片工具', featured: true },
          { name: '文字转语�?, url: '#', icon: '🔊', category: '音频工具' }
        ]);
      });
  })();
</script>
