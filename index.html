<style>

:root{
  --bg:#0f172a;
  --card:#111827;
  --border:#1f2937;
  --text:#f3f4f6;
  --muted:#9ca3af;
  --blue:#2563eb;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:var(--bg);
  color:var(--text);
  font-family:Arial,sans-serif;
  line-height:1.7;
}

a{
  text-decoration:none;
  color:inherit;
}

header{
  padding:18px 20px;
  border-bottom:1px solid var(--border);
  position:sticky;
  top:0;
  background:#0f172af0;
  backdrop-filter:blur(10px);
  z-index:999;
}

.nav{
  max-width:1200px;
  margin:auto;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
}

.logo{
  font-size:24px;
  font-weight:900;
}

.menu{
  display:flex;
  gap:18px;
  align-items:center;
  flex-wrap:wrap;
}

.menu a{
  color:var(--muted);
}

.lang-select{
  background:#111827;
  color:white;
  border:1px solid var(--border);
  border-radius:8px;
  padding:8px 10px;
}

.hero{
  max-width:1200px;
  margin:auto;
  padding:80px 20px;
  text-align:center;
}

.hero h1{
  font-size:52px;
  margin-bottom:20px;
}

.hero p{
  color:var(--muted);
  font-size:20px;
  max-width:800px;
  margin:auto;
}

.hero-btn{
  margin-top:35px;
  display:inline-block;
  background:var(--blue);
  color:white;
  padding:16px 34px;
  border-radius:12px;
  font-weight:700;
}

.section{
  max-width:1200px;
  margin:auto;
  padding:60px 20px;
}

.section-title{
  font-size:36px;
  margin-bottom:30px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:20px;
}

.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:18px;
  padding:25px;
  transition:.3s;
}

.card:hover{
  transform:translateY(-5px);
  border-color:var(--blue);
}

.card h3{
  margin-bottom:12px;
}

.card p{
  color:var(--muted);
}

.ad-box{
  margin:50px auto;
  max-width:1200px;
  height:120px;
  border-radius:18px;
  border:2px dashed #334155;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#64748b;
}

footer{
  margin-top:60px;
  border-top:1px solid var(--border);
  padding:30px;
  text-align:center;
  color:var(--muted);
}

@media(max-width:768px){

  .nav{
    flex-direction:column;
  }

  .hero h1{
    font-size:36px;
  }

  .hero p{
    font-size:16px;

}

const languageSelect = document.getElementById("languageSelect");

function setLanguage(lang){

  const data = translations[lang] || translations.zh;

  document.documentElement.lang = lang;

  document.querySelectorAll("[data-i18n]").forEach(el=>{

    const key = el.getAttribute("data-i18n");

    if(data[key]){
      el.textContent = data[key];
    }

  });

  localStorage.setItem("siteLanguage", lang);

}

languageSelect.addEventListener("change", function(){

  setLanguage(this.value);

});

const savedLang = localStorage.getItem("siteLanguage") || "zh";

languageSelect.value = savedLang;

setLanguage(savedLang);
