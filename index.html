<!-- ===== 膷偶聰暮聸聻茅膭艣茅聝篓 ===== -->
<button class="back-top" id="backTop" onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:24px;right:24px;z-index:200;width:42px;height:42px;border-radius:12px;background:var(--surface);border:1px solid var(--border);color:var(--text);font-size:18px;cursor:pointer;opacity:0;pointer-events:none;transition:all .3s;">芒聠?/button>

<script>
  // ===== 暮聼艧莽膭聙暮聤聼膷聝藵 =====
  document.getElementById('year').textContent = new Date().getFullYear();

  function initTheme() {
    const s = localStorage.getItem('zh_theme') || 'dark';
    document.documentElement.setAttribute('data-theme', s);
    document.getElementById('themeBtn').textContent = s === 'dark' ? '芒聵聙膹赂? : '膽聼聦聶';
  }
  function toggleTheme() {
    const c = document.documentElement.getAttribute('data-theme');
    const n = c === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', n);
    localStorage.setItem('zh_theme', n);
    document.getElementById('themeBtn').textContent = n === 'dark' ? '芒聵聙膹赂? : '膽聼聦聶';
  }
  initTheme();

  // 膷偶聰暮聸聻茅膭艣茅聝篓
  const backTop = document.getElementById('backTop');
  window.addEventListener('scroll', () => {
    backTop.style.opacity = window.scrollY > 300 ? '1' : '0';
    backTop.style.pointerEvents = window.scrollY > 300 ? 'all' : 'none';
  });

  // ===== 膰聹聙膷偶聭盲藵偶莽聰?(localStorage) =====
  function loadRecent() {
    const list = JSON.parse(localStorage.getItem('藵颅艧牛膼膭艕啪-ZenTools_recent') || '[]');
    const container = document.getElementById('recentList');
    const section = document.getElementById('recentSection');
    if (!list.length) { section.classList.remove('visible'); return; }
    section.classList.add('visible');
    container.innerHTML = list.map(url =>
      `<a href="${url}">${url.split('/').pop().replace('.html','')}</a>`
    ).join('');
  }
  function addRecent(url) {
    let list = JSON.parse(localStorage.getItem('藵颅艧牛膼膭艕啪-ZenTools_recent') || '[]');
    list = list.filter(item => item !== url);
    list.unshift(url);
    if (list.length > 5) list = list.slice(0, 5);
    localStorage.setItem('藵颅艧牛膼膭艕啪-ZenTools_recent', JSON.stringify(list));
    loadRecent();
  }
  loadRecent();

  // ===== 暮聢聠莽膮钮暮聸啪膰聽聡膰聵聽暮掳聞 =====
  const CATEGORY_ICONS = {
    'AI暮藝慕暮聟藝': '膽聼陇聳',
    '暮聸啪莽聣聡暮藝慕暮聟藝': '膽聼聳藕膹赂?,
    'PDF暮藝慕暮聟藝': '膽聼聯聞',
    '膰聳聡膰聹殴暮藝慕暮聟藝': '膽聼聯聺',
    '膷搂聠茅藰聭暮藝慕暮聟藝': '膽聼聨殴',
    '茅聼艂茅藰聭暮藝慕暮聟藝': '膽聼聰聤',
    '暮藕聙暮聫聭暮藝慕暮聟?: '膽聼聮钮',
    'SEO暮藝慕暮聟藝': '膽聼聰聧',
    '暮聤聻暮聟殴暮藝慕暮聟藝': '膽聼聯聨',
    '莽聰聼膰麓钮暮藝慕暮聟藝': '膽聼聦聧',
    '茅聡聭膷聻聧暮藝慕暮聟藝': '膽聼聮掳',
    '膰聲聶膷聜藳暮藝慕暮聟藝': '膽聼聯職'
  };

  // ===== 盲钮?JSON 暮聤聽膷藵藵暮藝慕暮聟藝膰聲掳膰聧沤 =====
  (function() {
    const grid = document.getElementById('toolsGrid');
    const hot = document.getElementById('hotScroll');
    const ribbon = document.getElementById('categoryRibbon');

    // 膰赂藳膰聼聯暮聢聠莽膮钮暮偶扭膰聧藝暮聟慕暮聫艁
    function renderCategories(categories) {
      if (!categories || !categories.length) return;
      let html = '';
      for (const cat of categories) {
        const icon = CATEGORY_ICONS[cat] || '膽聼聰搂';
        // 膰聽拧膰聧沤暮聢聠莽膮钮暮聬聧莽聰聼膰聢聬莽聸沤暮藵聲膷藝呕暮啪?
        let path = '';
        if (cat === 'AI暮藝慕暮聟藝') path = '/ai/index.html';
        else if (cat === '暮聸啪莽聣聡暮藝慕暮聟藝') path = '/image/index.html';
        else if (cat === 'PDF暮藝慕暮聟藝') path = '/pdf/index.html';
        else if (cat === '膰聳聡膰聹殴暮藝慕暮聟藝') path = '/text/index.html';
        else if (cat === '膷搂聠茅藰聭暮藝慕暮聟藝') path = '/video/index.html';
        else if (cat === '茅聼艂茅藰聭暮藝慕暮聟藝') path = '/audio/index.html';
        else if (cat === '暮藕聙暮聫聭暮藝慕暮聟?) path = '/dev/index.html';
        else if (cat === '莽聰聼膰麓钮暮藝慕暮聟藝') path = '/life/index.html';
        else path = '/categories.html#' + encodeURIComponent(cat);
        html += `<a href="${path}"><span class="cat-icon">${icon}</span> ${cat}</a>`;
      }
      ribbon.innerHTML = html;
    }

    function renderTools(tools) {
      if (!tools || !tools.length) {
        grid.innerHTML = `<div style="grid-column:1/-1;text-align:center;padding:30px;color:var(--muted);">膰職聜膰聴聽暮藝慕暮聟藝</div>`;
        return;
      }
      // 暮聟篓茅聝篓暮藝慕暮聟藝 (暮聫聳暮聣聧 8 盲赂?
      const list = tools.filter(t => t.featured !== false).slice(0, 8);
      let html = '';
      for (const t of list) {
        const url = t.url && t.url !== '#' ? t.url : '#';
        const target = url !== '#' ? '_blank' : '';
        html += `
          <a class="tool-card" href="${url}" target="${target}" onclick="addRecent('${url}')">
            <span class="emoji">${t.icon || '膽聼聰搂'}</span>
            <div class="name">${t.name}</div>
            <div class="desc">${t.description || ''}</div>
            <span class="tag">${t.category || '暮藝慕暮聟藝'}</span>
          </a>
        `;
      }
      grid.innerHTML = html;

      // 莽聝颅茅聴篓暮藝慕暮聟藝 (膰篓艦暮聬聭膰钮職暮聤篓)
      const hotTools = tools.filter(t => t.featured === true).slice(0, 8);
      let hotHtml = '';
      for (const t of hotTools) {
        const url = t.url && t.url !== '#' ? t.url : '#';
        const target = url !== '#' ? '_blank' : '';
        hotHtml += `
          <a class="hot-item" href="${url}" target="${target}" onclick="addRecent('${url}')">
            <span class="emoji">${t.icon || '膽聼聰搂'}</span>
            <div class="name">${t.name}</div>
            <span class="tag">${t.category || ''}</span>
          </a>
        `;
      }
      hot.innerHTML = hotHtml || '<div style="text-align:center;padding:20px;color:var(--muted);width:100%;">膰職聜膰聴聽莽聝颅茅聴篓暮藝慕暮聟藝</div>';
    }

    fetch('/data/tools-data.json')
      .then(r => r.ok ? r.json() : Promise.reject('HTTP ' + r.status))
      .then(data => {
        if (data?.categories) renderCategories(data.categories);
        if (data?.tools) renderTools(data.tools);
        else renderTools(null);
      })
      .catch(() => {
        // 暮陇聡莽聰篓膰聲掳膰聧沤
        renderTools([
          { name: 'PDF 暮聬聢暮拧艣', url: '/pdf/merge.html', icon: '膽聼聯聞', category: 'PDF暮藝慕暮聟藝', featured: true },
          { name: '暮聸啪莽聣聡暮聨聥莽藕艩', url: '/image/compress.html', icon: '膽聼聯艢', category: '暮聸啪莽聣聡暮藝慕暮聟藝', featured: true },
          { name: '膰聳聡暮颅聴膷藵殴膷呕颅茅聼?, url: '#', icon: '膽聼聰聤', category: '茅聼艂茅藰聭暮藝慕暮聟藝' }
        ]);
      });
  })();
</script>
