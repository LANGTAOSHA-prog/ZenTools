<body>
<div class="container">

<input type="file" id="videoFile" accept="video/*"><input type="number" id="startTime" value="0" min="0" step="0.1" placeholder="开始秒数"><input type="number" id="duration" value="3" min="1" max="10" step="1" placeholder="时长秒数"><button onclick="convertToGIF()" data-i18n="run">开始处理</button>

<script>

const translations={
 zh:{pageTitle:"视频转 GIF - 免费在线工具 | ZenTools",back:"← 返回首页",title:"视频转 GIF",desc:"将视频片段转换为 GIF 动图。",ad:"广告位（Google AdSense）",run:"开始处理",download:"下载文件",empty:"请选择视频文件",working:"正在加载处理核心，请稍等...",done:"处理完成。",guideTitle:"使用说明",guideText:"1. 选择本地视频文件。\n2. 点击开始处理。\n3. 等待完成后下载文件。\n提示：大视频在手机上会比较慢。",privacyTitle:"隐私说明",privacyText:"视频在浏览器本地处理，正常情况下不会上传到服务器。"},
 ja:{pageTitle:"视频转 GIF - 無料オンラインツール | ZenTools",back:"← ホームに戻る",title:"视频转 GIF",desc:"将视频片段转换为 GIF 动图。",ad:"広告スペース",run:"処理開始",download:"ファイルをダウンロード",empty:"動画を選択してください",working:"処理コアを読み込み中...",done:"処理完了。",guideTitle:"使い方",guideText:"1. 動画ファイルを選択します。\n2. 処理開始をクリックします。\n3. 完了後ファイルを保存します。",privacyTitle:"プライバシーについて",privacyText:"動画はブラウザ内で処理されます。"},
 en:{pageTitle:"Video to GIF - Free Online Tool | ZenTools",back:"← Back to Home",title:"Video to GIF",desc:"将视频片段转换为 GIF 动图。",ad:"Ad Space",run:"Start Process",download:"Download File",empty:"Please select a video file",working:"Loading processing core, please wait...",done:"Processing completed.",guideTitle:"How to Use",guideText:"1. Select a local video file.\n2. Click Start Process.\n3. Download the file after processing.\nLarge videos may be slow on phones.",privacyTitle:"Privacy Notice",privacyText:"Video processing runs locally in your browser and normally does not upload to a server."},
 vi:{pageTitle:"视频转 GIF - Công cụ miễn phí | ZenTools",back:"← Quay lại trang chủ",title:"视频转 GIF",desc:"将视频片段转换为 GIF 动图。",ad:"Vị trí quảng cáo",run:"Bắt đầu",download:"Tải file",empty:"Vui lòng chọn video",working:"Đang tải lõi xử lý...",done:"Hoàn tất.",guideTitle:"Hướng dẫn",guideText:"1. Chọn video.\n2. Nhấn bắt đầu.\n3. Tải file sau khi xử lý.",privacyTitle:"Quyền riêng tư",privacyText:"Video được xử lý trong trình duyệt."}
};

const languageSelect=document.getElementById("languageSelect");
let currentLang="zh";
function setLanguage(lang){
 currentLang=lang;
 const data=translations[lang]||translations.zh;
 document.documentElement.lang=lang;
 document.title=data.pageTitle;
 document.querySelectorAll("[data-i18n]").forEach(el=>{const k=el.getAttribute("data-i18n");if(data[k])el.textContent=data[k];});
 document.querySelectorAll("[data-i18n-placeholder]").forEach(el=>{const k=el.getAttribute("data-i18n-placeholder");if(data[k])el.placeholder=data[k];});
 localStorage.setItem("siteLanguage",lang);
}
languageSelect.addEventListener("change",e=>setLanguage(e.target.value));
const savedLang=localStorage.getItem("siteLanguage")||"zh";
languageSelect.value=savedLang;
setLanguage(savedLang);

let ffmpegInstance=null;
async function getFFmpeg(){
  if(ffmpegInstance) return ffmpegInstance;
  if(!window.FFmpeg){ throw new Error("FFmpeg library not loaded"); }
  const { FFmpeg } = window.FFmpeg;
  const ffmpeg = new FFmpeg();
  ffmpeg.on("progress", ({progress})=>{
    const bar=document.getElementById("bar");
    if(bar) bar.style.width=Math.max(1,Math.min(100,Math.round(progress*100)))+"%";
  });
  ffmpeg.on("log", ({message})=>{
    const log=document.getElementById("log");
    if(log) log.textContent=message;
  });
  await ffmpeg.load({coreURL:"https://unpkg.com/@ffmpeg/core@0.12.6/dist/umd/ffmpeg-core.js"});
  ffmpegInstance=ffmpeg;
  return ffmpeg;
}
function blobDownload(name,type,data){
  const blob=new Blob([data.buffer],{type});
  const url=URL.createObjectURL(blob);
  const a=document.getElementById("downloadLink");
  a.href=url;
  a.download=name;
  a.style.display="inline-block";
}
async function writeInputFile(ffmpeg,file,name){
  const data=new Uint8Array(await file.arrayBuffer());
  await ffmpeg.writeFile(name,data);
}

async function convertToGIF(){
 const data=translations[currentLang]||translations.zh;
 const file=document.getElementById("videoFile").files[0];
 if(!file){alert(data.empty);return;}
 document.getElementById("log").textContent=data.working;
 document.getElementById("downloadLink").style.display="none";
 document.getElementById("bar").style.width="1%";
 try{
   const ffmpeg=await getFFmpeg();
   await writeInputFile(ffmpeg,file,"input.mp4");
   const args=["-ss",document.getElementById("startTime").value||"0","-t",document.getElementById("duration").value||"3","-i","input.mp4","-vf","fps=10,scale=480:-1:flags=lanczos","output"];
   await ffmpeg.exec(args);
   const out=await ffmpeg.readFile("output");
   blobDownload("zentools-video.gif","image/gif",out);
   document.getElementById("bar").style.width="100%";
   document.getElementById("log").textContent=data.done;
 }catch(e){
   document.getElementById("log").textContent=e.message;
 }
}

</script>
