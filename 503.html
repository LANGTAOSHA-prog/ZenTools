<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>维护中 · ZenTools</title>
<meta name="robots" content="noindex, nofollow">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
    color: #e2e8f0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
  }
  .box { max-width: 520px; width: 100%; }
  .logo {
    display: inline-flex; align-items: center; gap: 10px;
    font-size: 22px; font-weight: 700; color: #38bdf8; margin-bottom: 28px;
    letter-spacing: 0.5px;
  }
  .logo .dot {
    width: 14px; height: 14px; border-radius: 4px;
    background: linear-gradient(135deg, #38bdf8, #818cf8);
    display: inline-block;
  }
  .icon { font-size: 56px; margin-bottom: 18px; display: block; }
  h1 { font-size: 26px; font-weight: 700; color: #f8fafc; margin-bottom: 12px; }
  p { font-size: 15px; line-height: 1.8; color: #94a3b8; margin-bottom: 10px; }
  .status {
    display: inline-block; margin-top: 22px; padding: 8px 18px;
    background: rgba(56, 189, 248, 0.12); border: 1px solid rgba(56, 189, 248, 0.35);
    border-radius: 999px; color: #38bdf8; font-size: 13px;
  }
  .footer { margin-top: 40px; font-size: 12px; color: #64748b; }
</style>
</head>
<body>
  <div class="box">
    <div class="logo"><span class="dot"></span>ZenTools</div>
    <span class="icon">🛠️</span>
    <h1>网站维护中</h1>
    <p>我们正在进行系统升级与维护，<br>所有工具将暂时无法访问。</p>
    <p>请稍后刷新页面，感谢你的耐心等待！</p>
    <span class="status">⏳ 维护中 · 预计很快恢复</span>
    <div class="footer">© <span id="yr"></span> ZenTools · Free · Open Source · Private</div>
  </div>
  <script>document.getElementById('yr').textContent = new Date().getFullYear();</script>
</body>
</html>
