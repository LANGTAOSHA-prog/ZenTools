<script>
function tName(t, lang) {
  return t['name__' + lang] || t['name__en'] || t.name;
}
function tDesc(t, lang) {
  return t['description__' + lang] || t['description__en'] || t.description;
}
function tCatLocal(cat, lang, cats, catsEn, catsJa, catsVi) {
  if (lang === 'zh' || !cats) return cat;
  var map = { en: catsEn, ja: catsJa, vi: catsVi };
  var arr = map[lang];
  if (arr && cats) {
    var idx = cats.indexOf(cat);
    if (idx >= 0 && idx < arr.length) return arr[idx];
  }
  return cat;
}
function renderToolGrid(lang) {
  var cats = window.categoriesData || [];
  var catsEn = window.categoriesData__en || [];
  var catsJa = window.categoriesData__ja || [];
  var catsVi = window.categoriesData__vi || [];
  var container = document.getElementById('featuredTools');
  container.innerHTML = toolsData.map(function(tool) {
    var name = tName(tool, lang);
    var desc = tDesc(tool, lang);
    var cat = tCatLocal(tool.category, lang, cats, catsEn, catsJa, catsVi);
    return '<a class="tool-card" href="' + tool.url + '"><div class="icon">' + tool.icon + '</div><h3>' + name + '</h3><p>' + desc + '</p><span class="tag">' + cat + '</span></a>';
  }).join('');
}
function applyPageLang(lang) {
  var d = window.ZT_PAGE && window.ZT_PAGE[lang];
  if (!d) return;
  document.querySelector('[data-i18n="pageTitle"]').textContent = d.pageTitle;
  document.getElementById('metaDesc').content = d.metaDesc;
  document.querySelectorAll('[data-i18n]').forEach(function(el) {
    var key = el.getAttribute('data-i18n');
    if (d[key]) el.textContent = d[key];
  });
  document.querySelector('.search-input').placeholder = d.searchPlaceholder || searchPlaceholderDefault;
  renderToolGrid(lang);
}
var searchPlaceholderDefault;
document.addEventListener('DOMContentLoaded', function() {
  var input = document.querySelector('.search-input');
  searchPlaceholderDefault = input.placeholder;
  var lang = localStorage.getItem('zentools_lang') || 'en';
  applyPageLang(lang);
  // Lang select handler
  var sel = document.getElementById('langSelect');
  if (sel) {
    sel.value = lang;
    sel.addEventListener('change', function() {
      applyPageLang(this.value);
      localStorage.setItem('zentools_lang', this.value);
      window.dispatchEvent(new CustomEvent('zt-langchange', {detail: {lang: this.value}}));
    });
  }
  // Apply nav i18n after common-i18n processes
  setTimeout(function() {
    var d = window.ZT_PAGE && window.ZT_PAGE[lang];
    if (d) {
      document.querySelectorAll('[data-i18n]').forEach(function(el) {
        var key = el.getAttribute('data-i18n');
        if (d[key]) el.textContent = d[key];
      });
    }
  }, 50);
});
window.addEventListener('zt-langchange', function(e) {
  var lang = e.detail.lang;
  applyPageLang(lang);
});
</script>
