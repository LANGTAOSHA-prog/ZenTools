# ============================================================
#  ZenTools 静态站点 - GCP 国外节点 (us-central1)
#  由 setup-gcp.sh 复制到 /etc/nginx/sites-available/zentools
#  HTTPS 证书由 certbot --nginx 自动注入（本文件只负责 HTTP 与路由）
# ============================================================

server {
    listen 80;
    listen [::]:80;
    server_name zentools.xyz www.zentools.xyz;

    root /var/www/zentools;
    index index.html;

    # 隐藏 nginx 版本
    server_tokens off;

    # 安全：禁止访问 Git/VCS 元数据与敏感文件（防源码泄露）
    # setup-gcp.sh 是整仓 clone 到 webroot，必须屏蔽 .git
    location ~ /\.git          { deny all; }
    location ~ /\.monkeycode   { deny all; }
    location ~* \.(env|ini|sql|bak|key|pem)$ { deny all; }

    # Let's Encrypt HTTP-01 验证目录（certbot 需要）
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
    }

    # Gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain text/css application/json application/javascript
        application/xml image/svg+xml application/ld+json;

    # 静态资源长缓存（带 hash 或极少改动的资源）
    location ~* \.(?:css|js|png|jpg|jpeg|gif|svg|ico|webp|woff2?|ttf|eot|json)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 主路由：
    #   1) 精确文件($uri)
    #   2) 目录索引($uri/ -> index.html)
    #   3) 无扩展名尝试补 .html（兼容 /tutorials/foo 这类干净链接）
    #   4) 回退站点首页（目录型 URL 兜底）
    location / {
        try_files $uri $uri/ $uri.html /index.html;
    }

    # sitemap / robots 等根文件直接服务
    location = /robots.txt  { try_files /robots.txt =404; }
    location = /sitemap.xml { try_files /sitemap.xml =404; }

    # 自定义 404
    error_page 404 /404.html;
    location = /404.html {
        internal;
        try_files /404.html =404;
    }
}
