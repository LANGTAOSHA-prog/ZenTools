# =============================================
# ZenTools 自动部署 — GitHub Actions → 阿里云 ECS + 谷歌云 GCP
# =============================================
# 架构：push 到 main → GitHub 海外 runner 检出代码 → 同时 rsync 到 ECS(国内) 与 GCP(海外)
# 说明：
#   - 服务器均位于 GitHub 难以主动访问的环境，故统一采用「runner 推送」模式（rsync over SSH）
#   - runner 有稳定外网出口；两台服务器只需开放 22 端口接收
#   - 纯静态站，rsync 完成即实时生效；但 nginx 配置（如 HTML 缓存头）改动会由部署步自动 cp 到源站并 reload
#   - 自动 reload 采用「备份 + nginx -t 校验 + 失败回退」策略，配置异常时绝不中断部署
#   - GCP 同步取代原先「VM 内每 10 分钟 git reset --hard」的轮询方式（后者曾因 VM git 拉取失败而滞后）
# ---------------------------------------------
# 需要在仓库 Settings → Secrets and variables → Actions 配置：
#   ECS_HOST     阿里云 ECS 公网 IP（如 39.96.10.135）
#   ECS_USER     SSH 用户名（如 root）
#   ECS_PORT     SSH 端口（如 22）
#   ECS_SSH_KEY  专用部署私钥（无口令，含首尾 BEGIN/END 行的完整内容）
#   GCP_HOST     谷歌云 GCP 外部 IP（34.143.64.123）
#   GCP_USER     GCP VM 的 SSH 用户名
#   GCP_SSH_KEY  GCP 专用部署私钥（公钥需预先写入 GCP VM 的 ~/.ssh/authorized_keys）
#   注：GCP 步骤用 `if: secrets.GCP_SSH_KEY != ''` 守卫，未配置前自动跳过，不影响 ECS 部署
# ---------------------------------------------
# 更新日志自动同步：
#   - 每次 push 自动扫描 tools-data.json 的新工具（四语）写入 site-info.json
#   - 自动提取 commit 消息中以 `cl:` 开头的行作为更新条目
#   - 有变更则用 [skip ci] 自动提交回 main，避免触发死循环
#   - 随后 rsync 会把这个最新 site-info.json 一起部署到 ECS 与 GCP
# =============================================

name: 部署到阿里云 ECS 与谷歌云 GCP

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: rsync 同步到 ECS
    runs-on: ubuntu-latest
    # 把 GCP 密钥映射到 job 级 env，供后续 step 的 if 条件判断
    # （GitHub Actions 的 if: 不允许直接引用 secrets 上下文，只能引用 env）
    env:
      GCP_SSH_KEY: ${{ secrets.GCP_SSH_KEY }}
      GCP_HOST: ${{ secrets.GCP_HOST }}
      GCP_USER: ${{ secrets.GCP_USER }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 完整历史，供 _gen_sitemap.py 取每个文件的真实 git 提交日期作为 lastmod

      - name: 重新生成 sitemap（真实 lastmod）
        run: |
          python3 _gen_sitemap.py
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml sitemap.txt
          if git diff --cached --quiet; then
            echo "sitemap 无变化，跳过提交"
          else
            git commit -m "chore: 重新生成 sitemap（真实 lastmod）[skip ci]"
            git push
          fi

      - name: 自动更新更新日志（扫描新工具 + 提取 cl 标记）
        run: |
          python3 _sync_changelog.py --scan
          python3 _extract_cl.py
          python3 _sync_changelog.py --from-commits /tmp/cl_lines.txt

      - name: 提交更新日志（如有变更）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/site-info.json
          if git diff --cached --quiet; then
            echo "无 changelog 变更，跳过提交"
          else
            git commit -m "chore: 自动更新更新日志 [skip ci]"
            git push
          fi

      - name: rsync 推送到阿里云 ECS（国内节点）
        uses: easingthemes/ssh-deploy@v5.1.0
        with:
          SSH_PRIVATE_KEY: ${{ secrets.ECS_SSH_KEY }}
          REMOTE_HOST: ${{ secrets.ECS_HOST }}
          REMOTE_USER: ${{ secrets.ECS_USER }}
          REMOTE_PORT: ${{ secrets.ECS_PORT }}
          TARGET: /var/www/html
          # -rlptgoDz: 递归/软链/权限/时间/属主属组/设备/压缩；⚠️ 已禁用 --delete，避免 runner 不完整时清空源站
          ARGS: "-rlptgoDz"
          # 保护服务器上不该被删/覆盖的文件与目录
          EXCLUDE: "/.git/, /.github/, .monkeycode/, webhook.py, *.bak"
          # 同步后在服务器执行的校验
          SCRIPT_AFTER: |
            cd /var/www/html
            echo "==> 部署版本校验"
            test -f index.html && echo "OK index.html" || (echo "MISSING index.html" && exit 1)
            test -f sw.js && echo "OK sw.js (ZenTools)" || echo "WARN: sw.js missing (not ZenTools index.html)"
            echo "==> 部署完成: $(date '+%Y-%m-%d %H:%M:%S %Z')"
            # 同步 nginx 配置（仅当现有已是 zentools 文件时安全接管，否则跳过以免冲突）
            # 主源（国内），故采用「备份 + nginx -t 校验 + 失败回退」策略，绝不破坏性覆盖
            NG=/etc/nginx/sites-available/zentools
            SRC=/var/www/html/infra/deploy-ecs/nginx-zentools.conf
            if [ -f "$NG" ] && [ -f "$SRC" ]; then
              cp "$NG" /tmp/zentools.ecs.bak
              cp "$SRC" "$NG"
              if nginx -t >/dev/null 2>&1; then
                systemctl reload nginx && echo "OK ECS nginx reloaded (HTML 缓存头已生效)"
                rm -f /tmp/zentools.ecs.bak
              else
                cp /tmp/zentools.ecs.bak "$NG"
                echo "WARN ECS nginx -t 失败，已回退到旧配置"
              fi
            else
              echo "INFO ECS 现有 nginx 未使用 zentools 文件，跳过自动覆盖（请手动核对 ECS 配置）"
            fi

      - name: "[调试] GCP 连通性诊断（ssh，不回显私钥）"
        if: ${{ env.GCP_SSH_KEY != '' }}
        run: |
          set +e
          printf '%s\n' "$GCP_SSH_KEY" > /tmp/gcp_key
          chmod 600 /tmp/gcp_key
          echo "==> 尝试 SSH 到 ${GCP_USER}@${GCP_HOST}（超时15s，不打印私钥）"
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=15 -i /tmp/gcp_key \
            "${GCP_USER}@${GCP_HOST}" \
            "echo SSH_OK; echo USER=\$(id -un); ls -ld /var/www/zentools; echo PUBKEY_COUNT=\$(grep -c zentools_gcp ~/.ssh/authorized_keys 2>/dev/null || echo 0)" \
            && echo "==> 诊断: SSH 成功" || echo "==> 诊断: SSH 失败(见上方具体错误)"
          rm -f /tmp/gcp_key

      - name: rsync 推送到谷歌云 GCP（海外节点，push 即实时同步）
        if: ${{ env.GCP_SSH_KEY != '' }}
        uses: easingthemes/ssh-deploy@v5.1.0
        with:
          SSH_PRIVATE_KEY: ${{ secrets.GCP_SSH_KEY }}
          REMOTE_HOST: ${{ secrets.GCP_HOST }}
          REMOTE_USER: ${{ secrets.GCP_USER }}
          REMOTE_PORT: "22"
          TARGET: /var/www/zentools
          ARGS: "-rlptgoDz"
          # 不碰 GCP webroot 现有的 .git 仓库；不删除 .github/.monkeycode
          EXCLUDE: "/.git/, /.github/, .monkeycode/, *.bak"
          SCRIPT_AFTER: |
            cd /var/www/zentools
            echo "==> GCP 部署版本校验: $(date '+%Y-%m-%d %H:%M:%S %Z')"
            test -f index.html && echo "OK index.html" || (echo "MISSING index.html" && exit 1)
            test -f guides/geo-generative-engine-optimization.html && echo "OK GEO 指南页" || echo "WARN GEO 指南页缺失"
            # 关闭原先「VM 内每 10 分钟 git reset」的轮询定时器，避免它把 rsync 的新文件 revert 回旧提交
            systemctl disable --now zentools-sync.timer 2>/dev/null || true
            # 同步 nginx 配置（仓库驱动）并热重载，使 HTML 缓存头生效
            # sudo 不可用或 nginx -t 校验失败则回退，绝不中断部署
            NG=/etc/nginx/sites-available/zentools
            SRC=/var/www/zentools/infra/deploy-gcp/nginx-zentools.conf
            if [ -f "$NG" ] && [ -f "$SRC" ]; then
              cp "$NG" /tmp/zentools.gcp.bak 2>/dev/null || true
              sudo cp "$SRC" "$NG" 2>/dev/null || cp "$SRC" "$NG" 2>/dev/null || true
              if sudo nginx -t >/dev/null 2>&1 || nginx -t >/dev/null 2>&1; then
                if sudo systemctl reload nginx >/dev/null 2>&1 || systemctl reload nginx >/dev/null 2>&1; then
                  echo "OK GCP nginx reloaded (HTML 缓存头已生效)"
                else
                  echo "WARN GCP nginx reload 失败（可能无 sudo 权限），请手动 reload 或配置免密 sudo"
                fi
              else
                sudo cp /tmp/zentools.gcp.bak "$NG" 2>/dev/null || true
                echo "WARN GCP nginx -t 失败，已回退到旧配置"
              fi
            else
              echo "INFO GCP nginx 配置文件缺失，跳过自动同步"
            fi
