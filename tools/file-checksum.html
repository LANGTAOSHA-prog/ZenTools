async function computeSubtleHash(algorithm, buffer) {
  if (!window.crypto || !window.crypto.subtle) throw new Error('WebCrypto 不可用');
  const hashBuffer = await crypto.subtle.digest(algorithm, buffer);
  return Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2, '0')).join('');
}

async function handleFile(file) {
  if (!file) return;
  document.getElementById('fileInfo').textContent = '📄 ' + file.name + ' (' + (file.size / 1024).toFixed(1) + ' KB)';
  document.getElementById('hashResult').style.display = 'block';
  document.getElementById('md5Value').textContent = '计算中…';
  document.getElementById('sha1Value').textContent = '计算中…';
  document.getElementById('sha256Value').textContent = '计算中…';

  var arrayBuffer = await file.arrayBuffer();

  // MD5 — pure JS (WebCrypto does not support MD5)
  try {
    document.getElementById('md5Value').textContent = md5FromArrayBuffer(arrayBuffer);
  } catch (e) {
    document.getElementById('md5Value').textContent = 'MD5 计算失败: ' + e.message;
  }

  // SHA-1 — WebCrypto
  try {
    document.getElementById('sha1Value').textContent = await computeSubtleHash('SHA-1', arrayBuffer);
  } catch (e) {
    document.getElementById('sha1Value').textContent = 'SHA-1 计算失败: ' + e.message;
  }

  // SHA-256 — WebCrypto
  try {
    document.getElementById('sha256Value').textContent = await computeSubtleHash('SHA-256', arrayBuffer);
  } catch (e) {
    document.getElementById('sha256Value').textContent = 'SHA-256 计算失败: ' + e.message;
  }
}

function copyHash(algo) {
  var val = document.getElementById(algo + 'Value').textContent;
  if (!val || val.startsWith('计算') || val === '-') return;
  var t = document.createElement('textarea');
  t.value = val;
  document.body.appendChild(t);
  t.select();
  document.execCommand('copy');
  document.body.removeChild(t);
}

// 暗黑模式切换
(function() {
  var savedTheme = localStorage.getItem('zentools_theme');
  if (savedTheme === 'dark') document.documentElement.classList.add('dark');
  var btn = document.getElementById('themeToggle');
  if (btn) {
    btn.textContent = document.documentElement.classList.contains('dark') ? '☀️' : '🌙';
    btn.addEventListener('click', function() {
      document.documentElement.classList.toggle('dark');
      var isDark = document.documentElement.classList.contains('dark');
      this.textContent = isDark ? '☀️' : '🌙';
      localStorage.setItem('zentools_theme', isDark ? 'dark' : 'light');
    });
  }
})();

// 移动端侧滑
(function() {
  var overlay = document.getElementById('mobileOverlay');
  var hamBtn = document.getElementById('hamburgerBtn');
  var closeBtn = document.getElementById('mobileClose');
  if (!hamBtn || !overlay) return;
  function closeMenu() { overlay.classList.remove('open'); hamBtn.textContent = '☰'; document.body.style.overflow = ''; }
  hamBtn.addEventListener('click', function(e) {
    e.stopPropagation();
    if (overlay.classList.contains('open')) { closeMenu(); } else {
      overlay.classList.add('open'); hamBtn.textContent = '✕'; document.body.style.overflow = 'hidden';
    }
  });
  if (closeBtn) closeBtn.addEventListener('click', closeMenu);
  overlay.addEventListener('click', function(e) {
    var drawer = document.getElementById('mobileDrawer');
    if (drawer && !drawer.contains(e.target)) closeMenu();
  });
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape' && overlay.classList.contains('open')) closeMenu();
  });
})();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', function() {
    navigator.serviceWorker.register('/sw.js').catch(function() {});
  });
}
</script>
