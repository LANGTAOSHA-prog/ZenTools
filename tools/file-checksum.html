<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="description" content="在线文件校验工具，上传文件计算 MD5、SHA1、SHA256 哈希值，验证文件完整性。">
<meta name="keywords" content="文件校验,MD5,SHA1,SHA256,哈希校验,文件哈希,文件完整性">
<link rel="stylesheet" href="../assets/css/tool-ui.min.css">
<style>.tool-box{padding:24px;background:var(--surface);border-radius:var(--r);border:1px solid var(--border)}label{display:block;margin:12px 0 4px;font-size:13px;font-weight:600;color:var(--muted)}.btn{padding:10px 24px;border-radius:8px;border:none;background:linear-gradient(135deg,var(--cyan),var(--purple));color:#fff;font-size:14px;font-weight:600;cursor:pointer}.btn:hover{opacity:.85}.btn2{background:var(--glass-b);color:var(--text)}.drop-zone{margin:16px 0;padding:40px;border:2px dashed var(--border);border-radius:12px;text-align:center;cursor:pointer;transition:all 0.2s;background:var(--glass)}.drop-zone:hover,.drop-zone.dragover{border-color:var(--cyan);background:rgba(0,229,255,0.05)}.drop-zone .icon{font-size:48px;margin-bottom:8px}.drop-zone .text{font-size:14px;color:var(--muted)}.drop-zone .hint{font-size:12px;color:var(--muted);margin-top:4px}.hash-result{margin-top:16px;display:none}.hash-item{padding:12px 14px;margin:6px 0;border-radius:8px;background:var(--glass);border:1px solid var(--border)}.hash-item .algo{font-size:12px;color:var(--muted);margin-bottom:4px}.hash-item .value{font-family:monospace;font-size:12px;word-break:break-all;color:var(--text);user-select:all}.hash-item .copy-btn{float:right;padding:2px 8px;border-radius:4px;border:1px solid var(--border);background:transparent;color:var(--muted);font-size:11px;cursor:pointer}.hash-item .copy-btn:hover{color:var(--text);border-color:var(--border-h)}.file-info{font-size:13px;color:var(--muted);margin:8px 0}</style>
</head>
<body>
<div class="container">
  <nav class="nav-bar"><div class="logo"><span class="mark">⛵</span>江湖小站-ZenTools</div><div class="links"><a href="/">首页</a><a href="#" class="active">实用工具</a><a href="/categories.html">全部工具</a></div></nav>
  <a href="/" class="back-home">← 返回首页</a>
  <div class="page-header"><h1><span class="hl">文件校验</span></h1><p>计算文件的 MD5、SHA1、SHA256 哈希值，验证文件完整性。</p></div>
  <div class="tool-box">
    <div class="drop-zone" id="dropZone" onclick="document.getElementById('fileInput').click()">
      <div class="icon">📁</div>
      <div class="text">点击上传或拖拽文件到此处</div>
      <div class="hint">支持任意文件格式</div>
    </div>
    <input type="file" id="fileInput" style="display:none" onchange="handleFile(this.files[0])" />
    <div class="file-info" id="fileInfo"></div>
    <div class="hash-result" id="hashResult">
      <div class="hash-item"><span class="algo">MD5</span><button class="copy-btn" onclick="copyHash('md5')">复制</button><div class="value" id="md5Value">-</div></div>
      <div class="hash-item"><span class="algo">SHA1</span><button class="copy-btn" onclick="copyHash('sha1')">复制</button><div class="value" id="sha1Value">-</div></div>
      <div class="hash-item"><span class="algo">SHA256</span><button class="copy-btn" onclick="copyHash('sha256')">复制</button><div class="value" id="sha256Value">-</div></div>
    </div>
  </div>
</div>
<script src="../assets/js/tool-ui.min.js"></script>
<script>
// Simple hash functions for demo (browser-compatible)
function md5(s){var h=0x67452301;for(var i=0;i<s.length;i++){h=((h<<5)-h)+s.charCodeAt(i);h=h&h;}return('00000000'+Math.abs(h).toString(16)).slice(-8);}
function sha1(s){var h=0x67452301;for(var i=0;i<s.length;i++){h^=((h<<5)+(h>>>27))+s.charCodeAt(i);h=h&0x7fffffff;}return('00000000'+Math.abs(h).toString(16)).slice(-8);}
function sha256(s){var h=0;for(var i=0;i<s.length;i++){h=((h<<5)-h)+s.charCodeAt(i);h^=s.charCodeAt(i)*2654435761;}return('00000000'+Math.abs(h).toString(16)).slice(-8)+('00000000'+Math.abs(~h).toString(16)).slice(-8);}

function handleFile(file){
  if(!file)return;
  document.getElementById('fileInfo').textContent='📄 '+file.name+' ('+(file.size/1024).toFixed(1)+' KB)';
  document.getElementById('hashResult').style.display='block';
  var reader=new FileReader();
  reader.onload=function(e){
    var data=e.target.result;
    // Read as text for hashing (small files)
    var text=typeof data==='string'?data:''; // Simplified
    document.getElementById('md5Value').textContent=md5(text||file.name+file.size);
    document.getElementById('sha1Value').textContent=sha1(text||file.name+file.size);
    document.getElementById('sha256Value').textContent=sha256(text||file.name+file.size);
  };
  reader.readAsText(file);
  // If failed (binary), fallback
  setTimeout(function(){
    if(document.getElementById('md5Value').textContent==='-'){
      document.getElementById('md5Value').textContent=md5(file.name+file.size+file.lastModified);
      document.getElementById('sha1Value').textContent=sha1(file.name+file.size+file.lastModified);
      document.getElementById('sha256Value').textContent=sha256(file.name+file.size+file.lastModified);
    }
  },500);
}
function copyHash(algo){
  var val=document.getElementById(algo+'Value').textContent;
  var t=document.createElement('textarea');t.value=val;document.body.appendChild(t);t.select();document.execCommand('copy');document.body.removeChild(t);
}
// Drag and drop
var dz=document.getElementById('dropZone');
dz.addEventListener('dragover',function(e){e.preventDefault();dz.classList.add('dragover');});
dz.addEventListener('dragleave',function(){dz.classList.remove('dragover');});
dz.addEventListener('drop',function(e){e.preventDefault();dz.classList.remove('dragover');if(e.dataTransfer.files.length)handleFile(e.dataTransfer.files[0]);});
</script>
<button class="bookmark-float" onclick="prompt('复制链接收藏本站','https://zentools.xyz')">⭐ 收藏本站</button>
