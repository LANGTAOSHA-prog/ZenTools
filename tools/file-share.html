    <label data-i18n="lbl_文件名">文件名</label><input type="text" id="fsFilename" value="文档.docx" />
    <label data-i18n="lbl_文件大小">文件大小</label>
    <div style="display:flex;gap:10px;"><input type="number" id="fsSize" value="10" style="flex:1;" /><select id="fsUnit" style="width:100px;padding:10px;border-radius:8px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:14px;"><option value="KB">KB</option><option value="MB" selected>MB</option><option value="GB">GB</option></select></div>

    <label data-i18n="lbl_提取码_可选">提取码（可选）</label><input type="text" id="fsCode" placeholder="如: 1234" data-i18n-placeholder="ph_如_1234" />
    <label data-i18n="lbl_备注信息_可选">备注信息（可选）</label><textarea id="fsNote" rows="2" placeholder="添加备注说明..." data-i18n-placeholder="ph_添加备注说明"></textarea>
    <div style="margin-top:12px;display:flex;gap:10px;flex-wrap:wrap;">
      <button class="btn" onclick="genShare()" data-i18n="btn_生成分享信息">🔗 生成分享信息</button>
      <button class="btn btn2" onclick="copyShareText()" data-i18n="btn_复制分享文本">📋 复制分享文本</button>
    </div>
    <div class="result-box" id="fsResult">
      <div class="share-info" id="fsShareInfo"></div>
      <div class="qrcode-area"><canvas id="fsQrcode"></canvas></div>
    </div>
  </div>

<script src="../assets/js/tool-ui.min.js"></script>
<script>
function genShare(){
  var name=document.getElementById('fsFilename').value||'文件';
  var size=parseFloat(document.getElementById('fsSize').value)||0;
  var unit=document.getElementById('fsUnit').value;
  var url=document.getElementById('fsUrl').value;
  var code=document.getElementById('fsCode').value;
  var note=document.getElementById('fsNote').value;
  var sizeStr=size>0?size+' '+unit:'未知大小';
  var now=new Date().toLocaleString();
  var html='<div class="label" data-i18n="lbl_文件名">文件名</div><div class="value">'+name+'</div>'+
    '<div class="label" data-i18n="lbl_文件大小">文件大小</div><div class="value">'+sizeStr+'</div>'+
    '<div class="label" data-i18n="lbl_分享链接">分享链接</div><div class="value">'+(url||'未设置')+'</div>';
  if(code)html+='<div class="label">提取码</div><div class="value">'+code+'</div>';
  html+='<div class="label">生成时间</div><div class="value">'+now+'</div>';
  if(note)html+='<div class="label">备注</div><div class="value">'+note+'</div>';
  document.getElementById('fsShareInfo').innerHTML=html;
  document.getElementById('fsResult').style.display='block';
  // Generate simple QR-like display
  var canvas=document.getElementById('fsQrcode');
  canvas.width=0;canvas.height=0;
}
function copyShareText(){
  var info=document.getElementById('fsShareInfo');
  var texts=[];
  info.querySelectorAll('.label, .value').forEach(function(el,i){
    if(i%2===0)texts.push(el.textContent+': ');
    else texts.push(el.textContent+'\n');
  });
  var t=document.createElement('textarea');t.value=texts.join('');document.body.appendChild(t);t.select();document.execCommand('copy');document.body.removeChild(t);
  alert('分享信息已复制');
}
genShare();
</script>
