<script>
const CATEGORY_KEY = '开发工具';
function renderTools(tools) {
  const c = document.getElementById('toolsGrid'); if (!c) return;
  const f = tools.filter(t => t.category === CATEGORY_KEY);
  if (!f.length) { c.innerHTML = '<div class="empty-state" style="grid-column:1/-1;text-align:center;padding:50px 20px;color:var(--muted);">暂无工具，敬请期待</div>'; return; }

  for (const t of f) {
    const h = t.url || '#';
    html += '<a class="cat-card" href="' + h + '"><div class="icon">' + (t.icon || '🔧') + '</div><div class="name">' + t.name + '</div><div class="desc">' + (t.description || '') + '</div>' + (t.featured ? '<span class="badge">热门</span>' : '') + '</a>';
  }
  c.innerHTML = html;
}
function load() {
  fetch('/data/tools-data.json').then(r => r.ok ? r.json() : Promise.reject()).then(d => { if (d?.tools?.length) renderTools(d.tools); }).catch(() => {});
}
document.addEventListener('DOMContentLoaded', load);
</script>
