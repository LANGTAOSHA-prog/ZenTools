async function downloadTikTok(){

  const inputUrl = document.getElementById("url").value.trim();

  if(!inputUrl){

    alert("Please paste TikTok link");

    return;
  }

  document.getElementById("result").innerHTML = `
    <div class="loading">
      Parsing TikTok Video...
    </div>
  `;

  const apiUrl =
  "https://tiktok-downloader-download-tiktok-videos-without-watermark.p.rapidapi.com/rich_response/index?url="
  + encodeURIComponent(inputUrl);

  const options = {
    method: "GET",
    headers: {

      /*
      IMPORTANT:
      Replace with your NEW RapidAPI KEY
      */

      "x-rapidapi-key": "YOUR_NEW_RAPIDAPI_KEY",

      "x-rapidapi-host":
      "tiktok-downloader-download-tiktok-videos-without-watermark.p.rapidapi.com",

      "Content-Type": "application/json"
    }
  };

  try{

    const response = await fetch(apiUrl, options);

    const result = await response.json();

    console.log(result);

    const videoUrl = result.video?.[0];
    const cover = result.cover?.[0];
    const author = result.author?.[0];
    const desc = result.description?.[0];

    if(!videoUrl){

      document.getElementById("result").innerHTML = `
        <div class="error">
          Failed to parse video
        </div>
      `;

      return;
    }

    document.getElementById("result").innerHTML = `

      <div class="card">

        <img src="${cover}" class="cover">

        <div class="info">
          <strong>@${author}</strong>
          <br><br>
          ${desc || ""}
        </div>

        <video
          controls
          playsinline
          src="${videoUrl}">
        </video>

        <a
          class="download-btn"
          href="${videoUrl}"
          target="_blank"
        >
          <button>
            Download Without Watermark
          </button>
        </a>

      </div>

    `;

  }catch(error){

    console.error(error);

    document.getElementById("result").innerHTML = `
      <div class="error">
        Request Failed
      </div>
    `;

  }

}
