async function downloadTikTok(){

  const inputUrl = document.getElementById("url").value.trim();

  if(!inputUrl){

    alert("Please paste TikTok link");

    return;
  }

  document.getElementById("result").innerHTML = `
    <div class="loading">
      Parsing TikTok Video...
    </div>
  `;

  const apiUrl =
  "https://tiktok-downloader-download-tiktok-videos-without-watermark.p.rapidapi.com/rich_response/index?url="
  + encodeURIComponent(inputUrl);

  const options = {
    method: "GET",
    headers: {

      /*
      IMPORTANT:
      Replace with your NEW RapidAPI KEY
      */

      "x-rapidapi-key": "YOUR_NEW_RAPIDAPI_KEY",

      "x-rapidapi-host":
      "tiktok-downloader-download-tiktok-videos-without-watermark.p.rapidapi.com",

      "Content-Type": "application/json"
    }
  };

  try{

    const response = await fetch(apiUrl, options);

    const result = await response.json();

    console.log(result);

    const videoUrl = result.video?.[0];
    const cover = result.cover?.[0];
    const author = result.author?.[0];
    const desc = result.description?.[0];

    if(!videoUrl){

      document.getElementById("result").innerHTML = `
        <div class="error">
          Failed to parse video
        </div>
      `;

      return;
    }

    document.getElementById("result").innerHTML = `

          href="${videoUrl}"
          target="_blank"
        >
          <button>
            Download Without Watermark
          </button>

    `;

  }catch(error){

    console.error(error);

    document.getElementById("result").innerHTML = `

<script>
// 暗黑模式切换
(function() {
  var savedTheme = localStorage.getItem('zentools_theme');
  if (savedTheme === 'dark') document.documentElement.classList.add('dark');
  var btn = document.getElementById('themeToggle');
  if (btn) {
    btn.textContent = document.documentElement.classList.contains('dark') ? '☀️' : '🌙';
    btn.addEventListener('click', function() {
      document.documentElement.classList.toggle('dark');
      var isDark = document.documentElement.classList.contains('dark');
      this.textContent = isDark ? '☀️' : '🌙';
      localStorage.setItem('zentools_theme', isDark ? 'dark' : 'light');
    });
  }
})();

// 移动端侧滑
(function() {
  var overlay = document.getElementById('mobileOverlay');
  var hamBtn = document.getElementById('hamburgerBtn');
  var closeBtn = document.getElementById('mobileClose');
  if (!hamBtn || !overlay) return;
  function closeMenu() { overlay.classList.remove('open'); hamBtn.textContent = '☰'; document.body.style.overflow = ''; }
  hamBtn.addEventListener('click', function(e) {
    e.stopPropagation();
    if (overlay.classList.contains('open')) { closeMenu(); } else {
      overlay.classList.add('open'); hamBtn.textContent = '✕'; document.body.style.overflow = 'hidden';
    }
  });
  if (closeBtn) closeBtn.addEventListener('click', closeMenu);
  overlay.addEventListener('click', function(e) {
    var drawer = document.getElementById('mobileDrawer');
    if (drawer && !drawer.contains(e.target)) closeMenu();
  });
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape' && overlay.classList.contains('open')) closeMenu();
  });
})();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', function() {
    navigator.serviceWorker.register('/sw.js').catch(function() {});
  });
}
</script>
