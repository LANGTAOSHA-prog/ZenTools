<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>二维码生成器 - ZenTools</title>

<style>
:root{
  --bg:#0f172a;
  --card:#111827;
  --border:#1f2937;
  --text:#f3f4f6;
  --muted:#9ca3af;
  --blue:#2563eb;
  --green:#10b981;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:var(--bg);
  color:var(--text);
  font-family:Arial,"Noto Sans SC","Noto Sans JP",sans-serif;
  line-height:1.7;
}
.container{
  max-width:900px;
  margin:auto;
  padding:40px 20px;
}
a{
  color:#60a5fa;
  text-decoration:none;
}
.top-bar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  margin-bottom:20px;
  flex-wrap:wrap;
}
.lang-select{
  background:#0f172a;
  color:white;
  border:1px solid #334155;
  border-radius:10px;
  padding:10px 12px;
}
.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:20px;
  padding:28px;
}
h1{
  margin-bottom:15px;
}
.desc{
  color:var(--muted);
  margin-bottom:25px;
}
.ad-box{
  margin:25px 0;
  height:110px;
  border:2px dashed #334155;
  border-radius:18px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#64748b;
}
textarea{
  width:100%;
  min-height:120px;
  padding:16px;
  border-radius:14px;
  border:1px solid #334155;
  background:#0f172a;
  color:white;
  font-size:16px;
  resize:vertical;
  outline:none;
}
textarea:focus{
  border-color:var(--blue);
}
.controls{
  margin-top:20px;
  display:flex;
  gap:15px;
  flex-wrap:wrap;
}
button{
  background:var(--blue);
  color:white;
  border:none;
  padding:14px 20px;
  border-radius:12px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}
button:hover{
  transform:translateY(-2px);
}
.download-btn{
  display:none;
  background:var(--green);
  color:white;
  padding:14px 20px;
  border-radius:12px;
  font-weight:bold;
}
.qr-box{
  margin-top:30px;
  background:#ffffff;
  border-radius:18px;
  padding:25px;
  display:none;
  justify-content:center;
  align-items:center;
}
.info{
  margin-top:40px;
}
.info h2{
  margin-top:28px;
  margin-bottom:10px;
}
.info p{
  color:#cbd5e1;
  white-space:pre-line;
}
footer{
  margin-top:50px;
  text-align:center;
  color:#94a3b8;
}
@media(max-width:768px){
  .container{padding:25px 15px}
  button,.download-btn,.lang-select{width:100%;text-align:center}
}
</style>

<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1955887568822472"
     crossorigin="anonymous"></script>
</head>

<body>

<div class="container">

  <div class="top-bar">
    <a href="index.html" data-i18n="back">← 返回首页</a>

    <select id="languageSelect" class="lang-select">
      <option value="zh">中文</option>
      <option value="ja">日本語</option>
      <option value="en">English</option>
      <option value="vi">Tiếng Việt</option>
    </select>
  </div>

  <div class="card">

    <h1 data-i18n="title">二维码生成器</h1>

    <p class="desc" data-i18n="desc">
      输入网址、文字、联系方式或任意内容，快速生成二维码并下载图片。
    </p>

    <div class="ad-box" data-i18n="ad">广告位（Google AdSense）</div>

    <textarea id="qrText" placeholder="请输入网址或文字..."></textarea>

    <div class="controls">
      <button onclick="generateQR()" data-i18n="generate">生成二维码</button>
      <a id="downloadBtn" class="download-btn" download="zentools-qr.png" data-i18n="download">下载二维码</a>
    </div>

    <div class="qr-box" id="qrBox">
      <canvas id="qrCanvas"></canvas>
    </div>

    <div class="info">
      <h2 data-i18n="guideTitle">使用说明</h2>
      <p data-i18n="guideText">1. 输入网址、文字或联系方式。
2. 点击生成二维码。
3. 生成后可以下载二维码图片。</p>

      <h2 data-i18n="privacyTitle">隐私说明</h2>
      <p data-i18n="privacyText">二维码生成在浏览器本地完成，输入内容正常情况下不会上传到服务器。</p>
    </div>

  </div>

  <footer>© 2026 ZenTools. All Rights Reserved.</footer>

</div>

<script>
const languageSelect = document.getElementById("languageSelect");
let currentLang = "zh";

const translations = {
  zh:{
    pageTitle:"二维码生成器 - ZenTools",
    back:"← 返回首页",
    title:"二维码生成器",
    desc:"输入网址、文字、联系方式或任意内容，快速生成二维码并下载图片。",
    ad:"广告位（Google AdSense）",
    generate:"生成二维码",
    download:"下载二维码",
    placeholder:"请输入网址或文字...",
    alertEmpty:"请输入内容",
    guideTitle:"使用说明",
    guideText:"1. 输入网址、文字或联系方式。\n2. 点击生成二维码。\n3. 生成后可以下载二维码图片。",
    privacyTitle:"隐私说明",
    privacyText:"二维码生成在浏览器本地完成，输入内容正常情况下不会上传到服务器。"
  },
  ja:{
    pageTitle:"QRコード生成ツール - ZenTools",
    back:"← ホームに戻る",
    title:"QRコード生成ツール",
    desc:"URL、テキスト、連絡先などを入力して、QRコードをすばやく作成し、画像として保存できます。",
    ad:"広告スペース（Google AdSense）",
    generate:"QRコードを生成",
    download:"QRコードをダウンロード",
    placeholder:"URLまたはテキストを入力してください...",
    alertEmpty:"内容を入力してください",
    guideTitle:"使い方",
    guideText:"1. URL、テキスト、連絡先を入力します。\n2. QRコードを生成をクリックします。\n3. 生成後、画像をダウンロードできます。",
    privacyTitle:"プライバシーについて",
    privacyText:"QRコードの生成はブラウザ内で行われ、通常入力内容はサーバーへアップロードされません。"
  },
  en:{
    pageTitle:"QR Code Generator - ZenTools",
    back:"← Back to Home",
    title:"QR Code Generator",
    desc:"Enter a URL, text, contact information, or any content to quickly generate and download a QR code.",
    ad:"Ad Space（Google AdSense）",
    generate:"Generate QR Code",
    download:"Download QR Code",
    placeholder:"Enter a URL or text...",
    alertEmpty:"Please enter content",
    guideTitle:"How to Use",
    guideText:"1. Enter a URL, text, or contact information.\n2. Click Generate QR Code.\n3. Download the QR image after it is generated.",
    privacyTitle:"Privacy Notice",
    privacyText:"QR code generation is completed locally in your browser, and your input is normally not uploaded to a server."
  },
  vi:{
    pageTitle:"Trình tạo mã QR - ZenTools",
    back:"← Quay lại trang chủ",
    title:"Trình tạo mã QR",
    desc:"Nhập liên kết, văn bản, thông tin liên hệ hoặc nội dung bất kỳ để tạo và tải mã QR.",
    ad:"Vị trí quảng cáo（Google AdSense）",
    generate:"Tạo mã QR",
    download:"Tải mã QR",
    placeholder:"Nhập liên kết hoặc văn bản...",
    alertEmpty:"Vui lòng nhập nội dung",
    guideTitle:"Hướng dẫn sử dụng",
    guideText:"1. Nhập liên kết, văn bản hoặc thông tin liên hệ.\n2. Nhấn tạo mã QR.\n3. Tải ảnh mã QR sau khi tạo.",
    privacyTitle:"Thông tin quyền riêng tư",
    privacyText:"Mã QR được tạo trực tiếp trong trình duyệt và nội dung nhập thường không được tải lên máy chủ."
  }
};

function setLanguage(lang){
  currentLang = lang;
  const data = translations[lang] || translations.zh;

  document.documentElement.lang = lang;
  document.title = data.pageTitle;

  document.querySelectorAll("[data-i18n]").forEach(el=>{
    const key = el.getAttribute("data-i18n");
    if(data[key]) el.innerText = data[key];
  });

  document.getElementById("qrText").placeholder = data.placeholder;

  localStorage.setItem("siteLanguage", lang);
}

languageSelect.addEventListener("change", function(){
  setLanguage(this.value);
});

const savedLang = localStorage.getItem("siteLanguage") || "zh";
languageSelect.value = savedLang;
setLanguage(savedLang);

function generateQR(){
  const text = document.getElementById("qrText").value.trim();
  const canvas = document.getElementById("qrCanvas");
  const qrBox = document.getElementById("qrBox");
  const downloadBtn = document.getElementById("downloadBtn");

  if(!text){
    alert(translations[currentLang].alertEmpty);
    return;
  }

  QRCode.toCanvas(canvas, text, {
    width: 260,
    margin: 2,
    errorCorrectionLevel: "H"
  }, function(error){
    if(error){
      alert("QR Error");
      return;
    }

    qrBox.style.display = "flex";
    downloadBtn.style.display = "inline-block";
    downloadBtn.href = canvas.toDataURL("image/png");
  });
}
<script>
const seoData = {
  title: "工具名称 - 免费在线工具 | ZenTools",
  description: "免费在线工具名称，支持手机与电脑，无需安装软件。",
  keywords: "工具名称,在线工具,免费工具,ZenTools",
  url: "https://www.zentools.xyz/tool.html",
  image: "https://www.zentools.xyz/logo.png"
};

function setMeta(name, content){
  let meta = document.querySelector(`meta[name="${name}"]`);
  if(!meta){
    meta = document.createElement("meta");
    meta.setAttribute("name", name);
    document.head.appendChild(meta);
  }
  meta.setAttribute("content", content);
}

function setProperty(property, content){
  let meta = document.querySelector(`meta[property="${property}"]`);
  if(!meta){
    meta = document.createElement("meta");
    meta.setAttribute("property", property);
    document.head.appendChild(meta);
  }
  meta.setAttribute("content", content);
}

function setCanonical(url){
  let link = document.querySelector('link[rel="canonical"]');
  if(!link){
    link = document.createElement("link");
    link.setAttribute("rel", "canonical");
    document.head.appendChild(link);
  }
  link.setAttribute("href", url);
}

function applySEO(){
  document.title = seoData.title;

  setMeta("description", seoData.description);
  setMeta("keywords", seoData.keywords);
  setMeta("author", "ZenTools");

  setCanonical(seoData.url);

  setProperty("og:title", seoData.title);
  setProperty("og:description", seoData.description);
  setProperty("og:type", "website");
  setProperty("og:url", seoData.url);
  setProperty("og:image", seoData.image);

  setMeta("twitter:card", "summary_large_image");
  setMeta("twitter:title", seoData.title);
  setMeta("twitter:description", seoData.description);
}

applySEO();
</script>

</body>
</html>
