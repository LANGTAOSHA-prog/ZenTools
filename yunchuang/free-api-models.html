<script>
var translations = window.ZT_PAGE || {};
function setLanguage(lang) {
  var data = translations[lang] || translations.zh || {};
  document.documentElement.lang = lang;
  document.title = data.pageTitle || document.title;
  document.querySelectorAll("[data-i18n]").forEach(function(el) {
    var k = el.getAttribute("data-i18n");
    if (data[k]) {
      if (el.tagName === 'A' && el.getAttribute('href')) {
        el.childNodes.forEach(function(node) {
          if (node.nodeType === 3) { node.textContent = data[k]; }
        });
      } else {
        el.textContent = data[k];
      }
    }
  });
  localStorage.setItem("zentools_lang", lang);
}
var sel = document.getElementById("languageSelect");
if (sel) {
  sel.addEventListener("change", function() { setLanguage(this.value); });
  var saved = localStorage.getItem("zentools_lang") || "zh";
  sel.value = saved;
  setLanguage(saved);
}
</script>

      { name: "CogVideoX-5B", category: "video", provider: "THUDM", desc: "开源文生视频模型，生成 6 秒 720p 视频。", specs: "720p · 6s", limit: "完全免费", status: "beta" },
      { name: "Stable Video Diffusion", category: "video", provider: "Stability AI", desc: "文生视频扩散模型，支持 4 秒 576x1024 生成。", specs: "576x1024 · 4s", limit: "每日 10 次", status: "active" },
      { name: "Qwen-VL-72B", category: "multimodal", provider: "阿里云", desc: "视觉语言模型，支持图像理解与对话。", specs: "720p · 8K ctx", limit: "免费 500 次/月", status: "active" },
      { name: "LLaVA-NeXT", category: "multimodal", provider: "开源社区", desc: "开源多模态模型，支持图像、视频理解。", specs: "8B · 视频支持", limit: "完全免费", status: "active" },
      { name: "MiniCPM-V", category: "multimodal", provider: "面壁智能", desc: "端侧多模态模型，支持 OCR 和图表理解。", specs: "2.8B · 轻量", limit: "免费 · 非商用", status: "active" },
    ];

    let currentFilter = 'all';
    let models = [];
    let updateTimer = null;
    const grid = document.getElementById('cardGrid');
    const lastUpdatedEl = document.getElementById('lastUpdated');

    function addVariation(item) {
      const statuses = ['active', 'beta', 'active', 'active', 'beta'];
      const randomStatus = statuses[Math.floor(Math.random() * statuses.length)];
      const limitSuffix = Math.random() > 0.6 ? ` (当前负载 ${Math.floor(Math.random() * 30 + 60)}%)` : '';
      return { ...item, status: randomStatus, limit: item.limit + limitSuffix, _time: new Date().toLocaleTimeString('zh-CN', { hour12: false }) };
    }

    function fetchModels() {
      return new Promise((resolve) => {
        const delay = 200 + Math.random() * 400;
        setTimeout(() => { resolve(BASE_MODELS.map(addVariation)); }, delay);
      });
    }

    function updateCounts(data) {
      const map = {};
      data.forEach(s => { map[s.category] = (map[s.category] || 0) + 1; });
      document.getElementById('countAll').textContent = data.length;
      document.getElementById('countText').textContent = map.text || 0;
      document.getElementById('countImage').textContent = map.image || 0;
      document.getElementById('countEmbedding').textContent = map.embedding || 0;
      document.getElementById('countAudio').textContent = map.audio || 0;
      document.getElementById('countVideo').textContent = map.video || 0;
      document.getElementById('countMultimodal').textContent = map.multimodal || 0;
    }

    function renderCards(data, filter) {
      const filtered = filter === 'all' ? data : data.filter(s => s.category === filter);
      if (filtered.length === 0) {
        grid.innerHTML = '<div class="loading-placeholder" style="grid-column:1/-1;"><i class="fas fa-inbox" style="font-size:2rem; opacity:0.4;"></i><span>暂无该类型 API，稍后刷新</span></div>';
        return;
      }
      let html = '';
      filtered.forEach(s => {
        const tagClass = s.category;
        const statusIcon = s.status === 'active' ? '✅' : '🔶';
        const statusClass = s.status === 'active' ? 'active' : 'beta';
        html += `
          <div class="card">
            <span class="tag ${tagClass}">${s.category}</span>
            <h3><a href="#" onclick="return false;">${s.name}</a></h3>
            <div class="sub">
              <span class="provider"><i class="fas fa-building"></i> ${s.provider}</span>
              <span><i class="far fa-clock"></i> ${s._time || ''}</span>
            </div>
            <div class="desc">${s.desc}</div>
            <div class="specs"><span><span class="label">📌 规格</span> ${s.specs}</span></div>
            <div class="limit-box"><i class="fas fa-gauge-high"></i> ${s.limit}</div>
            <div class="meta">
              <span class="status"><span class="${statusClass}">${statusIcon} ${s.status === 'active' ? '稳定' : 'Beta'}</span></span>
              <span><i class="fas fa-hashtag"></i> 免费层</span>
            </div>
          </div>`;
      });
      grid.innerHTML = html;
    }

    async function refreshData(showLoading = true) {
      if (showLoading) {
        grid.innerHTML = '<div class="loading-placeholder"><div class="spinner"></div><span>正在加载免费 AI 模型 API 信息 ...</span></div>';
      }
      try {
        const fresh = await fetchModels();
        models = fresh;
        updateCounts(models);
        renderCards(models, currentFilter);
        const now = new Date();
        lastUpdatedEl.innerHTML = `<i class="far fa-clock"></i> 更新: ${now.toLocaleTimeString('zh-CN', { hour12: false })}`;
      } catch (err) {
        if (models.length > 0) { renderCards(models, currentFilter); }
        else { grid.innerHTML = '<div class="loading-placeholder" style="grid-column:1/-1;"><i class="fas fa-exclamation-triangle"></i> 获取失败，请稍后重试</div>'; }
      }
    }

    function setFilter(filter) {
      currentFilter = filter;
      document.querySelectorAll('.filter-btn').forEach(btn => { btn.classList.toggle('active', btn.dataset.filter === filter); });
      if (models.length) { renderCards(models, filter); }
      else { refreshData(true); }
    }

    function init() {
      document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.addEventListener('click', function() { setFilter(this.dataset.filter); });
      });
      document.getElementById('refreshBtn').addEventListener('click', function() {
        refreshData(true);
        const icon = this.querySelector('i');
        icon.classList.add('fa-spin');
        setTimeout(() => icon.classList.remove('fa-spin'), 700);
      });
      refreshData(true);
      if (updateTimer) clearInterval(updateTimer);
      updateTimer = setInterval(() => { refreshData(false); }, 50000);
    }

    window.addEventListener('beforeunload', function() { if (updateTimer) clearInterval(updateTimer); });
    init();
  })();
</script>
</body>
</html>
