<script>
    (function() {
        "use strict";

        // ---------- 配置免费 API 源 (可自由增删) ----------
        const SOURCES = [
            {
                name: 'Mistral 7B (Free)',
                url: 'https://openrouter.ai/api/v1/chat/completions',
                model: 'mistralai/mistral-7b-instruct:free',
                headers: { 'Content-Type': 'application/json' }
            },
            {
                name: 'Gemma 2 9B (Free)',
                url: 'https://openrouter.ai/api/v1/chat/completions',
                model: 'google/gemma-2-9b-it:free',
                headers: { 'Content-Type': 'application/json' }
            },
            {
                name: 'Phi-3 Mini (Free)',
                url: 'https://openrouter.ai/api/v1/chat/completions',
                model: 'microsoft/phi-3-mini-4k-instruct:free',
                headers: { 'Content-Type': 'application/json' }
            }
        ];

        // DOM 元素
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const statusText = document.getElementById('statusText');
        const statusDot = document.getElementById('statusDot');
        const responseBox = document.getElementById('responseBox');
        const modelBadge = document.getElementById('modelBadge');
        const clearBtn = document.getElementById('clearBtn');
        const retryBtn = document.getElementById('retryBtn');

        // 状态
        let isProcessing = false;
        let lastQuery = '';

        // ----- 辅助：更新状态显示 -----
        function setStatus(text, type = 'idle') {
            statusText.textContent = text;
            statusDot.className = 'dot';
            if (type === 'loading') statusDot.classList.add('loading');
            else if (type === 'success') statusDot.classList.add('success');
            else if (type === 'error') statusDot.classList.add('error');
        }

        // 显示模型列表
        function renderBadge() {
            const names = SOURCES.map(s => s.name);
            modelBadge.innerHTML = names.map(n => `<span>${n}</span>`).join(' ');
        }
        renderBadge();

        // ----- 核心请求函数 (轮询 + 故障切换) -----
        async function fetchWithFallback(prompt) {
            if (!prompt || prompt.trim() === '') {
                setStatus('请输入问题', 'error');
                return null;
            }

            if (isProcessing) return null;
            isProcessing = true;
            sendBtn.disabled = true;
            setStatus('正在尝试多个免费源...', 'loading');
            responseBox.innerHTML = '⏳ 请求中...';

            // 打乱顺序以均衡负载 (可选)
            const sources = [...SOURCES];
            // 为了更稳定，把 OpenRouter 放在前面 (因为成功率较高)
            sources.sort((a, b) => {
                if (a.url.includes('openrouter')) return -1;
                if (b.url.includes('openrouter')) return 1;
                return 0;
            });

            let lastError = null;
            for (let i = 0; i < sources.length; i++) {
                const src = sources[i];
                try {
                    setStatus(`尝试 ${src.name} ...`, 'loading');

                    // 构建请求体 (兼容 OpenAI 格式)
                    const payload = {
                        model: src.model,
                        messages: [{ role: 'user', content: prompt }],
                        max_tokens: 500,
                        temperature: 0.7,
                    };

                    // 有些代理可能需要额外 header，可扩展
                    const headers = { ...src.headers };
                    // 如果 URL 是 openrouter，可以添加 referer (可选)
                    if (src.url.includes('openrouter')) {
                        headers['HTTP-Referer'] = window.location.origin;
                        headers['X-Title'] = 'Free AI Aggregator';
                    }

                    const controller = new AbortController();
                    const timeoutId = setTimeout(() => controller.abort(), 15000); // 15s 超时

                    const resp = await fetch(src.url, {
                        method: 'POST',
                        headers: headers,
                        body: JSON.stringify(payload),
                        signal: controller.signal,
                    });

                    clearTimeout(timeoutId);

                    if (!resp.ok) {
                        const errText = await resp.text().catch(() => '');
                        throw new Error(`HTTP ${resp.status} ${errText.slice(0, 80)}`);
                    }

                    const data = await resp.json();
                    // 兼容不同返回结构
                    let content = null;
                    if (data && data.choices && data.choices.length > 0) {
                        content = data.choices[0].message?.content || data.choices[0].text || null;
                    } else if (data && data.content) {
                        content = data.content;
                    } else if (data && data.response) {
                        content = data.response;
                    }

                    if (content) {
                        // 成功！
                        setStatus(`✅ 成功 (${src.name})`, 'success');
                        responseBox.innerHTML = content;
                        lastQuery = prompt;
                        return content;
                    } else {
                        throw new Error('响应内容为空');
                    }

                } catch (err) {
                    lastError = err;
                    console.warn(`源 ${src.name} 失败:`, err.message);
                    // 继续尝试下一个
                    setStatus(`⚠️ ${src.name} 不可用，切换中...`, 'error');
                    // 延迟一点点避免请求过快
                    await new Promise(r => setTimeout(r, 300));
                }
            }

            // 所有源都失败
            setStatus('❌ 所有免费源暂时不可用，请稍后重试', 'error');
            responseBox.innerHTML = `😵 所有 API 源均请求失败。\n最后错误：${lastError?.message || '未知'}\n\n提示：可能是网络/跨域限制，或免费额度已用完。`;
            return null;
        }

        // ----- 发送逻辑 -----
        async function handleSend() {
            const prompt = userInput.value.trim();
            if (!prompt) {
                setStatus('请输入问题', 'error');
                responseBox.innerHTML = '✏️ 请在上面输入问题';
                return;
            }
            await fetchWithFallback(prompt);
            isProcessing = false;
            sendBtn.disabled = false;
        }

        // ----- 重试 (用上次的问题) -----
        async function handleRetry() {
            if (lastQuery) {
                userInput.value = lastQuery;
                await handleSend();
            } else {
                const current = userInput.value.trim();
                if (current) {
                    await handleSend();
                } else {
                    setStatus('没有可重试的问题', 'error');
                    responseBox.innerHTML = '📝 输入问题后重试';
                }
            }
        }

        // ----- 事件绑定 -----
        sendBtn.addEventListener('click', handleSend);
        retryBtn.addEventListener('click', handleRetry);
        clearBtn.addEventListener('click', function() {
            userInput.value = '';
            responseBox.innerHTML = '<span class="placeholder">🧹 已清空，输入新问题吧</span>';
            setStatus('已清空', 'idle');
            lastQuery = '';
        });

        // 回车发送
        userInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                handleSend();
            }
        });

        // 初始状态
        setStatus('就绪，输入问题发送', 'idle');
        
        // 语言切换功能
        function switchLanguage(lang) {
            localStorage.setItem('zt_lang', lang);
            location.reload();
        }
        
        // 默认自动发送一次示例问题 (可选)
        window.addEventListener('load', function() {
            // 延迟一下让页面完全渲染
            setTimeout(() => {
                handleSend();
            }, 400);
        });
    })();
</script>

(function(){var t=localStorage.getItem('zentools_theme');if(t==='dark')document.documentElement.classList.add('dark');
var b=document.getElementById('themeToggle');if(b){b.textContent=document.documentElement.classList.contains('dark')?'☀️':'🌙';
b.addEventListener('click',function(){document.documentElement.classList.toggle('dark');
var d=document.documentElement.classList.contains('dark');this.textContent=d?'☀️':'🌙';
localStorage.setItem('zentools_theme',d?'dark':'light');});}})();
(function(){var o=document.getElementById('mobileOverlay'),h=document.getElementById('hamburgerBtn'),c=document.getElementById('mobileClose');
function cl(){o.classList.remove('open');h.textContent='☰';document.body.style.overflow='';}
if(!h||!o)return;h.addEventListener('click',function(e){e.stopPropagation();
if(o.classList.contains('open'))cl();else{o.classList.add('open');h.textContent='✕';document.body.style.overflow='hidden';}});
if(c)c.addEventListener('click',cl);o.addEventListener('click',function(e){var d=document.getElementById('mobileDrawer');if(d&&!d.contains(e.target))cl();});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&o.classList.contains('open'))cl();});})();
</script>
