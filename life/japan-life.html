// ===== Render Categories =====
var activeCat = 'all';
var searchTerm = '';

function renderCategories() {
  var container = document.getElementById('categoryContainer');
  var empty = document.getElementById('emptyState');
  container.innerHTML = '';
  var hasResults = false;
  var lowerTerm = searchTerm.toLowerCase();

  JP_DATA.forEach(function(group) {
    // Filter by active category
    if (activeCat !== 'all' && group.cat !== activeCat) return;

    var filteredLinks = group.links;
    if (searchTerm) {
      filteredLinks = filteredLinks.filter(function(link) {
        return link.name.toLowerCase().indexOf(lowerTerm) !== -1 ||
               link.descZh.toLowerCase().indexOf(lowerTerm) !== -1 ||
               link.descEn.toLowerCase().indexOf(lowerTerm) !== -1;
      });
      if (filteredLinks.length === 0) return;
    }

    hasResults = true;

    // Category header
    var sec = document.createElement('div');
    sec.className = 'category-section';

    var header = document.createElement('div');
    header.className = 'category-header';
    var lang = document.getElementById('langSelect') ? document.getElementById('langSelect').value : 'zh';
    var titleKey = 'title' + lang.charAt(0).toUpperCase() + lang.slice(1);
    var t = group[titleKey] || group.titleZh;
    header.innerHTML = '<span class="cat-icon">'+group.icon+'</span><span class="cat-title">'+t+'</span><span class="cat-count">'+filteredLinks.length+' links</span>';
    sec.appendChild(header);

    var grid = document.createElement('div');
    grid.className = 'card-grid';

    filteredLinks.forEach(function(link) {
      var card = document.createElement('a');
      card.className = 'life-card';
      card.href = link.url;
      card.target = '_blank';
      card.rel = 'noopener noreferrer';
      card.className = 'life-card';
      card.innerHTML = '<div class="card-icon">'+group.icon+'</div>' +
                       '<div class="card-info"><div class="card-name">'+link.name+'</div><div class="card-desc">'+link.descZh+'</div></div>' +
                       '<span class="card-arrow">→</span>';
      grid.appendChild(card);
    });

    sec.appendChild(grid);
    container.appendChild(sec);
  });

  empty.classList.toggle('hidden', hasResults);
}

// ===== Category Tabs =====
document.querySelectorAll('.cat-tab').forEach(function(tab) {
  tab.addEventListener('click', function() {
    document.querySelectorAll('.cat-tab').forEach(function(t) { t.classList.remove('active'); });
    this.classList.add('active');
    activeCat = this.getAttribute('data-cat');
    renderCategories();
  });
});

// ===== Search =====
var searchInput = document.getElementById('searchInput');
var searchTimer;
searchInput.addEventListener('input', function() {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(function() {
    searchTerm = searchInput.value.trim();
    renderCategories();
    // Reset active tab to "all" when searching
    if (searchTerm) {
      document.querySelectorAll('.cat-tab').forEach(function(t) { t.classList.remove('active'); });
      document.querySelector('.cat-tab[data-cat="all"]').classList.add('active');
      activeCat = 'all';
    }
  }, 200);
});

  if (btn) {
    btn.textContent = document.documentElement.classList.contains('dark') ? '☀️' : '🌙';
    btn.addEventListener('click', function() {
      document.documentElement.classList.toggle('dark');
      var isDark = document.documentElement.classList.contains('dark');
      this.textContent = isDark ? '☀️' : '🌙';
      localStorage.setItem('zentools_theme', isDark ? 'dark' : 'light');
      renderCategories();
    });
  }
})();

// ===== Mobile Menu =====
(function() {
  var overlay = document.getElementById('mobileOverlay');
  var hamBtn = document.getElementById('hamburgerBtn');
  var closeBtn = document.getElementById('mobileClose');
  if (!hamBtn || !overlay) return;
  function closeMenu() { overlay.classList.remove('open'); hamBtn.textContent = '☰'; document.body.style.overflow = ''; }
  hamBtn.addEventListener('click', function(e) {
    e.stopPropagation();
    if (overlay.classList.contains('open')) { closeMenu(); } else {
      overlay.classList.add('open'); hamBtn.textContent = '✕'; document.body.style.overflow = 'hidden';
    }
  });
  if (closeBtn) closeBtn.addEventListener('click', closeMenu);
  overlay.addEventListener('click', function(e) {
    var drawer = document.getElementById('mobileDrawer');
    if (drawer && !drawer.contains(e.target)) closeMenu();
  });
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape' && overlay.classList.contains('open')) closeMenu();
  });
})();
