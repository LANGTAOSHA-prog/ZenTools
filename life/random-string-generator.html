<script>
function genRandStr(){
  var len=parseInt(document.getElementById('rsLen').value)||12;
  var cnt=parseInt(document.getElementById('rsCount').value)||5;
  var chars='';
  if(document.getElementById('rsUpper').checked)chars+='ABCDEFGHIJKLMNOPQRSTUVWXYZ';
  if(document.getElementById('rsLower').checked)chars+='abcdefghijklmnopqrstuvwxyz';
  if(document.getElementById('rsDigit').checked)chars+='0123456789';
  if(document.getElementById('rsSym').checked)chars+='!@#$%^&*()_+-=[]{}|;:,.<>?';
  if(!chars)chars='abcdefghijklmnopqrstuvwxyz';
  var html='';
  for(var i=0;i<cnt;i++){
    var s='';
    for(var j=0;j<len;j++)s+=chars[Math.floor(Math.random()*chars.length)];
    html+='<div class="str-item" onclick="copyStr(this)">'+s+'</div>';
  }
  document.getElementById('rsResult').innerHTML=html+'<div style="font-size:12px;color:var(--muted);margin-top:8px;">💡 点击字符串可复制</div>';
}
function copyStr(el){var t=document.createElement('textarea');t.value=el.textContent;document.body.appendChild(t);t.select();document.execCommand('copy');document.body.removeChild(t);el.innerHTML+='<span class="copied">✓ 已复制</span>';setTimeout(function(){el.innerHTML=el.textContent.replace('✓ 已复制','');},1500);}
function copyAllStr(){
  var texts=[];document.querySelectorAll('.str-item').forEach(function(el){texts.push(el.textContent.replace('✓ 已复制','').trim());});
  var t=document.createElement('textarea');t.value=texts.join('\n');document.body.appendChild(t);t.select();document.execCommand('copy');document.body.removeChild(t);
  alert('已复制 '+texts.length+' 个字符串');
}
genRandStr();
</script>
