<script>window.pageTranslations={"zh":{pageTitle: '随机字符串生成 - 生活工具 | ZenTools', metaDesc: '随机字符串生成器，支持自定义长度和字符类型（字母、数字、符号），适合密码生成和测试数据。', btn_生成: '生成', btn_复制全部: '📋 复制全部', btn_收藏本站: '⭐ 收藏本站', lbl_长度: '长度', lbl_生成数量: '生成数量', lbl_包含字符: '包含字符'},"en":{pageTitle: '随机字符串生成 - Free Online Tool | ZenTools', metaDesc: 'Free online tool. Process in browser.', btn_生成: '生成', btn_复制全部: '📋 复制全部', btn_收藏本站: '⭐ 收藏本站', lbl_长度: '长度', lbl_生成数量: '生成数量', lbl_包含字符: '包含字符'},"ja":{pageTitle: '随机字符串生成 - 無料オンラインツール | ZenTools', metaDesc: 'ブラウザで動作する無料ツール。', btn_生成: '生成', btn_复制全部: '📋 复制全部', btn_收藏本站: '⭐ 收藏本站', lbl_长度: '长度', lbl_生成数量: '生成数量', lbl_包含字符: '包含字符'},"vi":{pageTitle: '随机字符串生成 - Công cụ Trực tuyến | ZenTools', metaDesc: 'Công cụ trực tuyến miễn phí.', btn_生成: '生成', btn_复制全部: '📋 复制全部', btn_收藏本站: '⭐ 收藏本站', lbl_长度: '长度', lbl_生成数量: '生成数量', lbl_包含字符: '包含字符'}};</script>
</head>
<body>
<div class="container">
  <nav class="nav-bar">
<select id="langSelect" class="lang-select"><option value="zh">中文</option><option value="ja">日本語</option><option value="en">English</option><option value="vi">Tiếng Việt</option></select><div class="logo"><span class="mark">⛵</span>江湖小站-ZenTools</div><div class="links"><a href="/" data-i18n="navHome">首页</a><a href="#" class="active" data-i18n="nav 生活工具 Cat">生活工具</a><a href="/categories.html">全部工具</a></div></nav>
  <a href="/" class="back-home">← 返回首页</a>
  <div class="page-header"><h1><span class="hl">随机字符串生成</span></h1><p>生成随机字符串，可自定义长度和字符类型。</p></div>
  <div class="tool-box">
    <div class="row">
      <div><label data-i18n="lbl_长度">长度</label><input type="number" id="rsLen" value="12" min="1" max="256" /></div>
      <div><label data-i18n="lbl_生成数量">生成数量</label><select id="rsCount"><option value="1">1 个</option><option value="5" selected>5 个</option><option value="10">10 个</option></select></div>
    </div>
    <label style="margin-top:8px;" data-i18n="lbl_包含字符">包含字符</label>
    <div style="display:flex;gap:16px;flex-wrap:wrap;padding:8px 0;">
      <label style="display:inline-flex;align-items:center;gap:4px;font-size:13px;"><input type="checkbox" id="rsUpper" checked />大写 A-Z</label>
      <label style="display:inline-flex;align-items:center;gap:4px;font-size:13px;"><input type="checkbox" id="rsLower" checked />小写 a-z</label>
      <label style="display:inline-flex;align-items:center;gap:4px;font-size:13px;"><input type="checkbox" id="rsDigit" checked />数字 0-9</label>
      <label style="display:inline-flex;align-items:center;gap:4px;font-size:13px;"><input type="checkbox" id="rsSym" />符号 !@#$%</label>
    </div>
    <div style="margin-top:12px;"><button class="btn" onclick="genRandStr()" data-i18n="btn_生成">生成</button><button class="btn btn2" onclick="copyAllStr()" style="margin-left:8px;" data-i18n="btn_复制全部">📋 复制全部</button></div>
    <div class="result" id="rsResult"></div>
  </div>
</div>
<script src="../assets/js/tool-ui.min.js"></script>
<script>
function genRandStr(){
  var len=parseInt(document.getElementById('rsLen').value)||12;
  var cnt=parseInt(document.getElementById('rsCount').value)||5;
  var chars='';
  if(document.getElementById('rsUpper').checked)chars+='ABCDEFGHIJKLMNOPQRSTUVWXYZ';
  if(document.getElementById('rsLower').checked)chars+='abcdefghijklmnopqrstuvwxyz';
  if(document.getElementById('rsDigit').checked)chars+='0123456789';
  if(document.getElementById('rsSym').checked)chars+='!@#$%^&*()_+-=[]{}|;:,.<>?';
  if(!chars)chars='abcdefghijklmnopqrstuvwxyz';
  var html='';
  for(var i=0;i<cnt;i++){
    var s='';
    for(var j=0;j<len;j++)s+=chars[Math.floor(Math.random()*chars.length)];
    html+='<div class="str-item" onclick="copyStr(this)">'+s+'</div>';
  }
  document.getElementById('rsResult').innerHTML=html+'<div style="font-size:12px;color:var(--muted);margin-top:8px;">💡 点击字符串可复制</div>';
}
function copyStr(el){var t=document.createElement('textarea');t.value=el.textContent;document.body.appendChild(t);t.select();document.execCommand('copy');document.body.removeChild(t);el.innerHTML+='<span class="copied">✓ 已复制</span>';setTimeout(function(){el.innerHTML=el.textContent.replace('✓ 已复制','');},1500);}
function copyAllStr(){
  var texts=[];document.querySelectorAll('.str-item').forEach(function(el){texts.push(el.textContent.replace('✓ 已复制','').trim());});
  var t=document.createElement('textarea');t.value=texts.join('\n');document.body.appendChild(t);t.select();document.execCommand('copy');document.body.removeChild(t);
  alert('已复制 '+texts.length+' 个字符串');
}
genRandStr();
</script>
