<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>随机字符串生成 - 生活工具 | ZenTools</title>
<meta property="og:title" content="随机字符串生成 | ZenTools" />
<meta property="og:description" content="在线随机字符串生成器，支持自定义长度、字符类型，适合密码和测试数据生成。" />
<meta name="description" content="随机字符串生成器，支持自定义长度和字符类型（字母、数字、符号），适合密码生成和测试数据。">
<meta name="keywords" content="随机字符串,随机字符,字符串生成,随机密码,随机ID,随机数">
<link rel="stylesheet" href="../assets/css/tool-ui.min.css">
<style>.tool-box{padding:24px;background:var(--surface);border-radius:var(--r);border:1px solid var(--border)}label{display:block;margin:12px 0 4px;font-size:13px;font-weight:600;color:var(--muted)}input,select{width:100%;padding:10px 12px;border-radius:8px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:14px}input:focus,select:focus{outline:none;border-color:var(--cyan)}.btn{padding:10px 24px;border-radius:8px;border:none;background:linear-gradient(135deg,var(--cyan),var(--purple));color:#fff;font-size:14px;font-weight:600;cursor:pointer}.btn:hover{opacity:.85}.btn2{background:var(--glass-b);color:var(--text)}.result{margin-top:16px;padding:16px;border-radius:8px;background:var(--glass);border:1px solid var(--border)}.row{display:flex;gap:12px}.row>*{flex:1}.str-item{padding:10px 14px;margin:6px 0;background:rgba(59,130,246,0.08);border-radius:6px;font-family:monospace;font-size:13px;word-break:break-all;cursor:pointer;border:1px solid transparent}.str-item:hover{border-color:rgba(59,130,246,0.3)}.copied{color:var(--cyan);font-size:12px;margin-left:8px}</style>
</head>
<body>
<div class="container">
  <nav class="nav-bar"><div class="logo"><span class="mark">⛵</span>江湖小站-ZenTools</div><div class="links"><a href="/">首页</a><a href="#" class="active">生活工具</a><a href="/categories.html">全部工具</a></div></nav>
  <a href="/" class="back-home">← 返回首页</a>
  <div class="page-header"><h1><span class="hl">随机字符串生成</span></h1><p>生成随机字符串，可自定义长度和字符类型。</p></div>
  <div class="tool-box">
    <div class="row">
      <div><label>长度</label><input type="number" id="rsLen" value="12" min="1" max="256" /></div>
      <div><label>生成数量</label><select id="rsCount"><option value="1">1 个</option><option value="5" selected>5 个</option><option value="10">10 个</option></select></div>
    </div>
    <label style="margin-top:8px;">包含字符</label>
    <div style="display:flex;gap:16px;flex-wrap:wrap;padding:8px 0;">
      <label style="display:inline-flex;align-items:center;gap:4px;font-size:13px;"><input type="checkbox" id="rsUpper" checked />大写 A-Z</label>
      <label style="display:inline-flex;align-items:center;gap:4px;font-size:13px;"><input type="checkbox" id="rsLower" checked />小写 a-z</label>
      <label style="display:inline-flex;align-items:center;gap:4px;font-size:13px;"><input type="checkbox" id="rsDigit" checked />数字 0-9</label>
      <label style="display:inline-flex;align-items:center;gap:4px;font-size:13px;"><input type="checkbox" id="rsSym" />符号 !@#$%</label>
    </div>
    <div style="margin-top:12px;"><button class="btn" onclick="genRandStr()">生成</button><button class="btn btn2" onclick="copyAllStr()" style="margin-left:8px;">📋 复制全部</button></div>
    <div class="result" id="rsResult"></div>
  </div>
</div>
<script src="../assets/js/tool-ui.min.js"></script>
<script>
function genRandStr(){
  var len=parseInt(document.getElementById('rsLen').value)||12;
  var cnt=parseInt(document.getElementById('rsCount').value)||5;
  var chars='';
  if(document.getElementById('rsUpper').checked)chars+='ABCDEFGHIJKLMNOPQRSTUVWXYZ';
  if(document.getElementById('rsLower').checked)chars+='abcdefghijklmnopqrstuvwxyz';
  if(document.getElementById('rsDigit').checked)chars+='0123456789';
  if(document.getElementById('rsSym').checked)chars+='!@#$%^&*()_+-=[]{}|;:,.<>?';
  if(!chars)chars='abcdefghijklmnopqrstuvwxyz';
  var html='';
  for(var i=0;i<cnt;i++){
    var s='';
    for(var j=0;j<len;j++)s+=chars[Math.floor(Math.random()*chars.length)];
    html+='<div class="str-item" onclick="copyStr(this)">'+s+'</div>';
  }
  document.getElementById('rsResult').innerHTML=html+'<div style="font-size:12px;color:var(--muted);margin-top:8px;">💡 点击字符串可复制</div>';
}
function copyStr(el){var t=document.createElement('textarea');t.value=el.textContent;document.body.appendChild(t);t.select();document.execCommand('copy');document.body.removeChild(t);el.innerHTML+='<span class="copied">✓ 已复制</span>';setTimeout(function(){el.innerHTML=el.textContent.replace('✓ 已复制','');},1500);}
function copyAllStr(){
  var texts=[];document.querySelectorAll('.str-item').forEach(function(el){texts.push(el.textContent.replace('✓ 已复制','').trim());});
  var t=document.createElement('textarea');t.value=texts.join('\n');document.body.appendChild(t);t.select();document.execCommand('copy');document.body.removeChild(t);
  alert('已复制 '+texts.length+' 个字符串');
}
genRandStr();
</script>
<button class="bookmark-float" onclick="prompt('复制链接收藏本站','https://zentools.xyz')">⭐ 收藏本站</button>
</body>
</html>
