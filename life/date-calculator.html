function toggleDCMode(){var v=document.getElementById('dcMode').value;document.getElementById('dcDiff').style.display=v==='diff'?'':'none';document.getElementById('dcAdd').style.display=v==='add'?'':'none';}
function calcDateDiff(){var s=document.getElementById('dcStart').value,e=document.getElementById('dcEnd').value;if(!s||!e)return;var d=Math.round((new Date(e)-new Date(s))/86400000);showDC('★ 日期差: <span class=highlight>'+Math.abs(d)+' 天</span><br>'+(!d?'同一天':d>0?'结束日在开始日之后':'结束日在开始日之前'));}
function calcDateAdd(){var b=document.getElementById('dcBase').value,d=parseInt(document.getElementById('dcDays').value);if(!b||isNaN(d))return;var r=new Date(b);r.setDate(r.getDate()+d);showDC('★ '+b+' + '+d+' 天 = <span class=highlight>'+r.toISOString().slice(0,10)+'</span>');}
function showDC(t){var el=document.getElementById('dcResult');el.style.display='block';el.innerHTML=t;}
</script>
