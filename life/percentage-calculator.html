<script>
function n(v){v=parseFloat(v);return isNaN(v)?null:v;}
function r(id,v){document.getElementById(id).textContent=v===null?'—':v;}
function calc1(){const a=n(document.getElementById('a1').value),b=n(document.getElementById('b1').value);r('r1',b&&b!==0?(a/b*100).toFixed(2)+'%':'—');}

function calc3(){const a=n(document.getElementById('a3').value),b=n(document.getElementById('b3').value);r('r3',a&&a!==0?(b>a?'+'+'':(b-a)/a*100).toFixed(2)+'%':'—');}
function calc4(){const a=n(document.getElementById('a4').value),b=n(document.getElementById('b4').value);r('r4',a&&a!==0?(a>b?'-'+'':(a-b)/a*100).toFixed(2)+'%':'—');}
function calc5(){const p=n(document.getElementById('p5').value),d=n(document.getElementById('d5').value);r('r5',p!==null&&d!==null?(p*(100-d)/100).toFixed(2):'—');}
function calc6(){const c=n(document.getElementById('c6').value),d=n(document.getElementById('d6').value);r('r6',c!==null&&d!==null?(c/(100-d)*100).toFixed(2):'—');}
</script>
