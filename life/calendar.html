<script>
var calYear=2026,calMonth=6;
var weekDays=['日','一','二','三','四','五','六'];
var holidays={'1-1':'元旦','5-1':'劳动节','6-1':'儿童节','10-1':'国庆节','10-2':'国庆节','10-3':'国庆节','1-28':'除夕','1-29':'春节','1-30':'春节','1-31':'春节','4-5':'清明节','5-31':'端午节','8-15':'中秋节','12-25':'圣诞节'};
function calRender(){
  var grid=document.getElementById('calGrid');
  document.getElementById('calTitle').textContent=calYear+'年 '+calMonth+'月';
  var html='';
  for(var i=0;i<7;i++)html+='<div class="cal-weekday">'+weekDays[i]+'</div>';
  var first=new Date(calYear,calMonth-1,1).getDay();
  var days=new Date(calYear,calMonth,0).getDate();
  var prevDays=new Date(calYear,calMonth-1,0).getDate();
  var today=new Date();
  for(var i=0;i<first;i++){
    var d=prevDays-first+1+i;
    html+='<div class="cal-day other">'+d+'<span class="lunar"></span></div>';
  }
  for(var d=1;d<=days;d++){
    var cls='cal-day';
    if(calYear===today.getFullYear()&&calMonth===today.getMonth()+1&&d===today.getDate())cls+=' today';
    if((first+d-1)%7===0)cls+=' sunday';
    var key=calMonth+'-'+d;
    var h=holidays[key]||'';
    if(h)cls+=' holiday';
    html+='<div class="'+cls+'" onclick="calSelect('+d+')">'+d+'<span class="lunar">'+h+'</span></div>';
  }
  var totalCells=first+days;
  var remain=42-totalCells;
  for(var d=1;d<=remain;d++){
    html+='<div class="cal-day other">'+d+'<span class="lunar"></span></div>';
  }
  grid.innerHTML=html;
  document.getElementById('calInfo').textContent='📅 '+calYear+'年'+calMonth+'月 共 '+days+' 天';
}
function calChange(d){calMonth+=d;if(calMonth>12){calMonth=1;calYear++;}if(calMonth<1){calMonth=12;calYear--;}calRender();document.getElementById('calYearInput').value=calYear;document.getElementById('calMonthInput').value=calMonth;}
function calJump(){calYear=parseInt(document.getElementById('calYearInput').value)||2026;calMonth=parseInt(document.getElementById('calMonthInput').value)||1;calRender();}
function calToday(){var t=new Date();calYear=t.getFullYear();calMonth=t.getMonth()+1;calRender();document.getElementById('calYearInput').value=calYear;document.getElementById('calMonthInput').value=calMonth;}
function calSelect(d){document.getElementById('calInfo').textContent='📅 选中日期: '+calYear+'年'+calMonth+'月'+d+'日'+(holidays[calMonth+'-'+d]?' ('+holidays[calMonth+'-'+d]+')':'');}
calRender();
</script>
