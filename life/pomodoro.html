<script>
var pTime=1500,pTotal=1500,pRunning=false,pInterval=null,pPhase='work',pCount=0;
function pomodoroUpdate(){
  if(pTime<=0){
    if(pPhase==='work'){
      pPhase='break';pTime=parseInt(document.getElementById('pomodoroBreak').value)*60;pTotal=pTime;
      document.getElementById('pomodoroPhase').textContent='☕ 休息中';document.getElementById('pomodoroPhase').className='phase break';
      pCount++;document.getElementById('pomodoroStats').textContent='已完成 '+pCount+' 个番茄';
      playBeep();
    }else{
      pPhase='work';pTime=parseInt(document.getElementById('pomodoroWork').value)*60;pTotal=pTime;
      document.getElementById('pomodoroPhase').textContent='🍅 工作中';document.getElementById('pomodoroPhase').className='phase work';
      playBeep();
    }
  }
  var m=Math.floor(pTime/60),s=pTime%60;
  document.getElementById('pomodoroDisplay').textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
  pTime--;
}
function pomodoroStart(){
  if(pRunning)return;
  pRunning=true;
  pInterval=setInterval(pomodoroUpdate,1000);
  document.getElementById('pomodoroStartBtn').textContent='▶ 运行中';
  // Set initial values
  var w=parseInt(document.getElementById('pomodoroWork').value)*60;
  var b=parseInt(document.getElementById('pomodoroBreak').value)*60;
  if(pPhase==='work'&&pTime===w)pTotal=w;
}
function pomodoroPause(){pRunning=false;clearInterval(pInterval);document.getElementById('pomodoroStartBtn').textContent='▶ 继续';}
function pomodoroReset(){
  pRunning=false;clearInterval(pInterval);
  pPhase='work';pTime=parseInt(document.getElementById('pomodoroWork').value)*60;pTotal=pTime;
  document.getElementById('pomodoroDisplay').textContent=String(Math.floor(pTime/60)).padStart(2,'0')+':00';
  document.getElementById('pomodoroPhase').textContent='🍅 工作中';document.getElementById('pomodoroPhase').className='phase work';
  document.getElementById('pomodoroStartBtn').textContent='▶ 开始';
}
function playBeep(){try{var ctx=new(window.AudioContext||window.webkitAudioContext)();var o=ctx.createOscillator();o.type='sine';o.frequency.value=880;o.connect(ctx.destination);o.start();o.stop(ctx.currentTime+0.3);}catch(e){}}
pomodoroReset();
</script>
