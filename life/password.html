<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>密码生成器 - ZenTools</title>
<meta name="description" content="ZenTools 免费在线密码生成器，支持生成安全随机密码。">

<style>
:root{
  --bg:#0f172a;--card:#111827;--border:#1f2937;
  --text:#f3f4f6;--muted:#9ca3af;--blue:#2563eb;--green:#10b981;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:Arial,sans-serif;line-height:1.7}
.container{max-width:900px;margin:auto;padding:40px 20px}
a{color:#60a5fa;text-decoration:none}
.top-bar{display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap;margin-bottom:20px}
.lang-select{background:#0f172a;color:white;border:1px solid #334155;border-radius:10px;padding:10px 12px}
.card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:28px}
h1{margin-bottom:15px}
.desc{color:var(--muted);margin-bottom:25px}
.ad-box{margin:25px 0;height:110px;border:2px dashed #334155;border-radius:18px;display:flex;align-items:center;justify-content:center;color:#64748b}
.output{width:100%;padding:16px;border-radius:12px;border:1px solid #334155;background:#0f172a;color:white;font-size:18px;margin:15px 0}
input[type="number"]{width:100%;padding:14px;border-radius:12px;border:1px solid #334155;background:#0f172a;color:white;margin:15px 0}
.options{display:grid;gap:12px;margin:20px 0}
button{background:var(--blue);color:white;border:none;padding:14px 20px;border-radius:12px;cursor:pointer;font-size:16px;font-weight:bold;margin-right:10px;margin-top:10px}
.copy-btn{background:var(--green)}
.info{margin-top:35px}
.info h2{margin-top:25px}
.info p{color:#cbd5e1;white-space:pre-line}
footer{margin-top:50px;text-align:center;color:#94a3b8}
@media(max-width:768px){button,.lang-select{width:100%}}
</style>
</head>

<body>
<div class="container">

  <div class="top-bar">
    <a href="index.html" data-i18n="back">← 返回首页</a>
    <select id="languageSelect" class="lang-select">
      <option value="zh">中文</option>
      <option value="ja">日本語</option>
      <option value="en">English</option>
      <option value="vi">Tiếng Việt</option>
    </select>
  </div>

  <div class="card">
    <h1 data-i18n="title">密码生成器</h1>
    <p class="desc" data-i18n="desc">免费在线生成安全随机密码。</p>

    <div class="ad-box" data-i18n="ad">广告位（Google AdSense）</div>

    <input class="output" id="passwordOutput" readonly placeholder="Generated password">

    <input type="number" id="lengthInput" value="16" min="6" max="64">

    <div class="options">
      <label><input type="checkbox" id="uppercase" checked> <span data-i18n="uppercase">包含大写字母</span></label>
      <label><input type="checkbox" id="lowercase" checked> <span data-i18n="lowercase">包含小写字母</span></label>
      <label><input type="checkbox" id="numbers" checked> <span data-i18n="numbers">包含数字</span></label>
      <label><input type="checkbox" id="symbols" checked> <span data-i18n="symbols">包含符号</span></label>
    </div>

    <button onclick="generatePassword()" data-i18n="generate">生成密码</button>
    <button class="copy-btn" onclick="copyPassword()" data-i18n="copy">复制密码</button>

    <div class="info">
      <h2 data-i18n="guideTitle">使用说明</h2>
      <p data-i18n="guideText">1. 设置密码长度。
2. 选择字符类型。
3. 点击生成密码。
4. 点击复制密码。</p>

      <h2 data-i18n="privacyTitle">隐私说明</h2>
      <p data-i18n="privacyText">密码在浏览器本地生成，不会上传到服务器。</p>
    </div>
  </div>

  <footer>© 2026 ZenTools</footer>
</div>

<script>
const languageSelect = document.getElementById("languageSelect");
let currentLang = "zh";

const translations = {
  zh:{
    pageTitle:"密码生成器 - ZenTools",
    back:"← 返回首页",
    title:"密码生成器",
    desc:"免费在线生成安全随机密码。",
    ad:"广告位（Google AdSense）",
    uppercase:"包含大写字母",
    lowercase:"包含小写字母",
    numbers:"包含数字",
    symbols:"包含符号",
    generate:"生成密码",
    copy:"复制密码",
    copied:"已复制",
    alertEmpty:"请先生成密码",
    guideTitle:"使用说明",
    guideText:"1. 设置密码长度。\n2. 选择字符类型。\n3. 点击生成密码。\n4. 点击复制密码。",
    privacyTitle:"隐私说明",
    privacyText:"密码在浏览器本地生成，不会上传到服务器。"
  },
  ja:{
    pageTitle:"パスワード生成ツール - ZenTools",
    back:"← ホームに戻る",
    title:"パスワード生成ツール",
    desc:"安全なランダムパスワードを無料で生成できます。",
    ad:"広告スペース",
    uppercase:"大文字を含める",
    lowercase:"小文字を含める",
    numbers:"数字を含める",
    symbols:"記号を含める",
    generate:"パスワード生成",
    copy:"コピー",
    copied:"コピーしました",
    alertEmpty:"先にパスワードを生成してください",
    guideTitle:"使い方",
    guideText:"1. パスワードの長さを設定します。\n2. 文字タイプを選択します。\n3. 生成をクリックします。\n4. コピーします。",
    privacyTitle:"プライバシーについて",
    privacyText:"パスワードはブラウザ内で生成され、サーバーへ送信されません。"
  },
  en:{
    pageTitle:"Password Generator - ZenTools",
    back:"← Back to Home",
    title:"Password Generator",
    desc:"Generate secure random passwords online for free.",
    ad:"Ad Space",
    uppercase:"Include uppercase letters",
    lowercase:"Include lowercase letters",
    numbers:"Include numbers",
    symbols:"Include symbols",
    generate:"Generate Password",
    copy:"Copy Password",
    copied:"Copied",
    alertEmpty:"Please generate a password first",
    guideTitle:"How to Use",
    guideText:"1. Set password length.\n2. Choose character types.\n3. Click Generate Password.\n4. Copy the password.",
    privacyTitle:"Privacy Notice",
    privacyText:"Passwords are generated locally in your browser and are not uploaded to a server."
  },
  vi:{
    pageTitle:"Trình tạo mật khẩu - ZenTools",
    back:"← Quay lại trang chủ",
    title:"Trình tạo mật khẩu",
    desc:"Tạo mật khẩu ngẫu nhiên an toàn miễn phí.",
    ad:"Vị trí quảng cáo",
    uppercase:"Bao gồm chữ hoa",
    lowercase:"Bao gồm chữ thường",
    numbers:"Bao gồm số",
    symbols:"Bao gồm ký tự đặc biệt",
    generate:"Tạo mật khẩu",
    copy:"Sao chép mật khẩu",
    copied:"Đã sao chép",
    alertEmpty:"Vui lòng tạo mật khẩu trước",
    guideTitle:"Hướng dẫn sử dụng",
    guideText:"1. Đặt độ dài mật khẩu.\n2. Chọn loại ký tự.\n3. Nhấn tạo mật khẩu.\n4. Sao chép mật khẩu.",
    privacyTitle:"Thông tin quyền riêng tư",
    privacyText:"Mật khẩu được tạo trực tiếp trong trình duyệt và không tải lên máy chủ."
  }
};

function setLanguage(lang){
  currentLang = lang;
  const data = translations[lang] || translations.zh;
  document.documentElement.lang = lang;
  document.title = data.pageTitle;
  document.querySelectorAll("[data-i18n]").forEach(el=>{
    const key = el.getAttribute("data-i18n");
    if(data[key]) el.textContent = data[key];
  });
  localStorage.setItem("siteLanguage", lang);
}

languageSelect.addEventListener("change", e=>setLanguage(e.target.value));
const savedLang = localStorage.getItem("siteLanguage") || "zh";
languageSelect.value = savedLang;
setLanguage(savedLang);

function generatePassword(){
  const length = parseInt(document.getElementById("lengthInput").value) || 16;
  let chars = "";
  if(document.getElementById("uppercase").checked) chars += "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
  if(document.getElementById("lowercase").checked) chars += "abcdefghijklmnopqrstuvwxyz";
  if(document.getElementById("numbers").checked) chars += "0123456789";
  if(document.getElementById("symbols").checked) chars += "!@#$%^&*()_+-=[]{}|;:,.<>?";

  if(!chars) chars = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";

  let password = "";
  for(let i=0;i<length;i++){
    password += chars.charAt(Math.floor(Math.random()*chars.length));
  }

  document.getElementById("passwordOutput").value = password;
}

function copyPassword(){
  const output = document.getElementById("passwordOutput");
  if(!output.value){
    alert(translations[currentLang].alertEmpty);
    return;
  }
  output.select();
  document.execCommand("copy");
  alert(translations[currentLang].copied);
}
</script>
<script>
const seoData = {
  title: "工具名称 - 免费在线工具 | ZenTools",
  description: "免费在线工具名称，支持手机与电脑，无需安装软件。",
  keywords: "工具名称,在线工具,免费工具,ZenTools",
  url: "https://www.zentools.xyz/tool.html",
  image: "https://www.zentools.xyz/logo.png"
};

function setMeta(name, content){
  let meta = document.querySelector(`meta[name="${name}"]`);
  if(!meta){
    meta = document.createElement("meta");
    meta.setAttribute("name", name);
    document.head.appendChild(meta);
  }
  meta.setAttribute("content", content);
}

function setProperty(property, content){
  let meta = document.querySelector(`meta[property="${property}"]`);
  if(!meta){
    meta = document.createElement("meta");
    meta.setAttribute("property", property);
    document.head.appendChild(meta);
  }
  meta.setAttribute("content", content);
}

function setCanonical(url){
  let link = document.querySelector('link[rel="canonical"]');
  if(!link){
    link = document.createElement("link");
    link.setAttribute("rel", "canonical");
    document.head.appendChild(link);
  }
  link.setAttribute("href", url);
}

function applySEO(){
  document.title = seoData.title;

  setMeta("description", seoData.description);
  setMeta("keywords", seoData.keywords);
  setMeta("author", "ZenTools");

  setCanonical(seoData.url);

  setProperty("og:title", seoData.title);
  setProperty("og:description", seoData.description);
  setProperty("og:type", "website");
  setProperty("og:url", seoData.url);
  setProperty("og:image", seoData.image);

  setMeta("twitter:card", "summary_large_image");
  setMeta("twitter:title", seoData.title);
  setMeta("twitter:description", seoData.description);
}

applySEO();
</script>

</body>
</html>
