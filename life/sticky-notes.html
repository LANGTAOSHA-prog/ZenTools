  <div class="page-header"><h1><span class="hl">在线便签</span></h1><p>创建多彩便签笔记，支持自定义颜色，数据保存在本地。</p></div>
  <div class="tool-box">
    <div class="sticky-toolbar">
      <div class="color-picker" id="snColorPicker">
        <div class="color-dot active" style="background:#fef08a;" data-color="#fef08a"></div>
        <div class="color-dot" style="background:#bbf7d0;" data-color="#bbf7d0"></div>
        <div class="color-dot" style="background:#bfdbfe;" data-color="#bfdbfe"></div>
        <div class="color-dot" style="background:#fecaca;" data-color="#fecaca"></div>
        <div class="color-dot" style="background:#e9d5ff;" data-color="#e9d5ff"></div>
        <div class="color-dot" style="background:#fed7aa;" data-color="#fed7aa"></div>
      </div>
      <button class="btn" onclick="addSticky()" data-i18n="btn_新建便签">📝 新建便签</button>
      <button class="btn btn2" onclick="clearAllStickies()" data-i18n="btn_全部清除">🗑️ 全部清除</button>
    </div>
    <div class="stickies-grid" id="stickiesGrid"></div>
  </div>

<script src="../assets/js/tool-ui.min.js"></script>
<script>
var stickies=JSON.parse(localStorage.getItem('zt_stickies')||'[]');
var snColor='#fef08a';
document.querySelectorAll('.color-dot').forEach(function(el){
  el.addEventListener('click',function(){document.querySelectorAll('.color-dot').forEach(function(d){d.classList.remove('active');});this.classList.add('active');snColor=this.dataset.color;});
});
function saveStickies(){localStorage.setItem('zt_stickies',JSON.stringify(stickies));renderStickies();}
function addSticky(){
  stickies.unshift({id:Date.now(),text:'',color:snColor,time:new Date().toLocaleString()});
  saveStickies();
  setTimeout(function(){var first=document.querySelector('.sticky-card textarea');if(first)first.focus();},100);
}
function updateSticky(id,text){
  for(var i=0;i<stickies.length;i++){if(stickies[i].id===id){stickies[i].text=text;break;}}
  localStorage.setItem('zt_stickies',JSON.stringify(stickies));
}
function delSticky(id){stickies=stickies.filter(function(s){return s.id!==id;});saveStickies();}
function clearAllStickies(){if(confirm('确定要删除所有便签吗？')){stickies=[];saveStickies();}}
function renderStickies(){
  var grid=document.getElementById('stickiesGrid');
  if(stickies.length===0){grid.innerHTML='<div style="grid-column:1/-1;text-align:center;padding:40px;color:var(--muted);font-size:14px;">📋 暂无便签，点击「新建便签」开始记录</div>';return;}
  grid.innerHTML=stickies.map(function(s){
    return '<div class="sticky-card" style="background:'+s.color+';">'+
      '<button class="sticky-del" onclick="delSticky('+s.id+')">✕</button>'+
      '<textarea placeholder="在此输入便签内容..." data-i18n-placeholder="ph_在此输入便签内容" oninput="updateSticky('+s.id+',this.value)">'+s.text+'</textarea>'+
      '<div class="sticky-time">'+s.time+'</div></div>';
  }).join('');
}
renderStickies();
</script>
