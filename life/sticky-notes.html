<script>
var stickies=JSON.parse(localStorage.getItem('zt_stickies')||'[]');
var snColor='#fef08a';
document.querySelectorAll('.color-dot').forEach(function(el){
  el.addEventListener('click',function(){document.querySelectorAll('.color-dot').forEach(function(d){d.classList.remove('active');});this.classList.add('active');snColor=this.dataset.color;});
});
function saveStickies(){localStorage.setItem('zt_stickies',JSON.stringify(stickies));renderStickies();}
function addSticky(){
  stickies.unshift({id:Date.now(),text:'',color:snColor,time:new Date().toLocaleString()});
  saveStickies();
  setTimeout(function(){var first=document.querySelector('.sticky-card textarea');if(first)first.focus();},100);
}
function updateSticky(id,text){
  for(var i=0;i<stickies.length;i++){if(stickies[i].id===id){stickies[i].text=text;break;}}
  localStorage.setItem('zt_stickies',JSON.stringify(stickies));
}
function delSticky(id){stickies=stickies.filter(function(s){return s.id!==id;});saveStickies();}
function clearAllStickies(){if(confirm('确定要删除所有便签吗？')){stickies=[];saveStickies();}}
function renderStickies(){
  var grid=document.getElementById('stickiesGrid');
  if(stickies.length===0){grid.innerHTML='<div style="grid-column:1/-1;text-align:center;padding:40px;color:var(--zen-text-sub);font-size:14px;">📋 暂无便签，点击「新建便签」开始记录</div>';return;}
  grid.innerHTML=stickies.map(function(s){
    return '<div class="sticky-card" style="background:'+s.color+';">'+
      '<button class="sticky-del" onclick="delSticky('+s.id+')">✕</button>'+
      '<textarea placeholder="在此输入便签内容..." data-i18n-placeholder="ph_在此输入便签内容" oninput="updateSticky('+s.id+',this.value)">'+s.text+'</textarea>'+
      '<div class="sticky-time">'+s.time+'</div></div>';
  }).join('');
}
renderStickies();
</script>

<script>
// 暗黑模式切换
(function() {
  var savedTheme = localStorage.getItem('zentools_theme');
  if (savedTheme === 'dark') document.documentElement.classList.add('dark');
  var btn = document.getElementById('themeToggle');
  if (btn) {
    btn.textContent = document.documentElement.classList.contains('dark') ? '☀️' : '🌙';
    btn.addEventListener('click', function() {
      document.documentElement.classList.toggle('dark');
      var isDark = document.documentElement.classList.contains('dark');
      this.textContent = isDark ? '☀️' : '🌙';
      localStorage.setItem('zentools_theme', isDark ? 'dark' : 'light');
    });
  }
})();

// 移动端侧滑
(function() {
  var overlay = document.getElementById('mobileOverlay');
  var hamBtn = document.getElementById('hamburgerBtn');
  var closeBtn = document.getElementById('mobileClose');
  if (!hamBtn || !overlay) return;
  function closeMenu() { overlay.classList.remove('open'); hamBtn.textContent = '☰'; document.body.style.overflow = ''; }
  hamBtn.addEventListener('click', function(e) {
    e.stopPropagation();
    if (overlay.classList.contains('open')) { closeMenu(); } else {
      overlay.classList.add('open'); hamBtn.textContent = '✕'; document.body.style.overflow = 'hidden';
    }
  });
  if (closeBtn) closeBtn.addEventListener('click', closeMenu);
  overlay.addEventListener('click', function(e) {
    var drawer = document.getElementById('mobileDrawer');
    if (drawer && !drawer.contains(e.target)) closeMenu();
  });
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape' && overlay.classList.contains('open')) closeMenu();
  });
})();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', function() {
    navigator.serviceWorker.register('/sw.js').catch(function() {});
  });
}
</script>
