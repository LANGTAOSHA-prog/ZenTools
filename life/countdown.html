    <h1><span class="hl">倒计时器</span></h1>
    <p>设置目标日期，实时显示倒计时天数、小时、分钟和秒。</p>
  </div>
  <div class="tool-box">
    <div class="row">
  <div><label data-i18n="lbl_目标日期">目标日期</label><input type="date" id="cdDate" /></div>
  <div><label data-i18n="lbl_目标时间">目标时间</label><input type="time" id="cdTime" value="00:00" /></div>
</div>
<label data-i18n="lbl_事件名称_可选">事件名称（可选）</label>
<input type="text" id="cdName" placeholder="例如：生日、项目截止日" data-i18n-placeholder="ph_例如_生日_项目" />
<div style="display:flex;gap:10px;margin-top:16px;">
  <button class="btn" onclick="startCD()" data-i18n="btn_开始倒计时">开始倒计时</button>
  <button class="btn btn2" onclick="localStorage.removeItem('zt_countdown');document.getElementById('cdResult').style.display='none';" data-i18n="btn_清除">清除</button>
</div>
<div class="result" id="cdResult" style="display:none;">
  <div style="display:flex;gap:16px;justify-content:center;text-align:center;flex-wrap:wrap;">
    <div><div class="highlight" id="cdDays">0</div><div style="font-size:12px;color:var(--muted);">天</div></div>
    <div><div class="highlight" id="cdHours">0</div><div style="font-size:12px;color:var(--muted);">时</div></div>
    <div><div class="highlight" id="cdMins">0</div><div style="font-size:12px;color:var(--muted);">分</div></div>
    <div><div class="highlight" id="cdSecs">0</div><div style="font-size:12px;color:var(--muted);">秒</div></div>
  </div>
  <div style="text-align:center;margin-top:8px;" id="cdLabel"></div>
</div>
  </div>
</div>
<script src="../assets/js/tool-ui.min.js"></script>
<script>
var _cdInterval;
function startCD(){
  var date=document.getElementById('cdDate').value, time=document.getElementById('cdTime').value||'00:00';
  if(!date){alert('请选择日期');return;}
  var target=new Date(date+'T'+time+':00').getTime();
  _cdInterval&&clearInterval(_cdInterval);
  _cdInterval=setInterval(function(){
    var now=Date.now(), diff=target-now;
    if(diff<=0){document.getElementById('cdDays').textContent='0';document.getElementById('cdHours').textContent='0';document.getElementById('cdMins').textContent='0';document.getElementById('cdSecs').textContent='0';document.getElementById('cdResult').style.display='block';document.getElementById('cdLabel').textContent='✅ 时间已到！';clearInterval(_cdInterval);return;}
    var d=Math.floor(diff/86400000),h=Math.floor((diff%86400000)/3600000),m=Math.floor((diff%3600000)/60000),s=Math.floor((diff%60000)/1000);
    document.getElementById('cdDays').textContent=d;document.getElementById('cdHours').textContent=h;document.getElementById('cdMins').textContent=m;document.getElementById('cdSecs').textContent=s;
  },1000);
  var n=document.getElementById('cdName').value;document.getElementById('cdLabel').textContent=n?'⏰ '+n:'';
  document.getElementById('cdResult').style.display='block';
}
</script>
