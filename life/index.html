<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>生活工具 | ZenTools</title>
    <link rel="stylesheet" href="../assets/css/style.css" />
    <link rel="stylesheet" href="../assets/css/tool-ui.css" />
</head>
<body>
    <h1>生活工具</h1>
    <div id="tool-list" class="tool-list"></div>

    <script>
        // Fetch the merged tools.json and filter for life tools.
        fetch('../data/tools.json')
            .then(r => r.json())
            .then(data => {
                const list = document.getElementById('tool-list');
                data
                    .filter(t => t.type === 'life')
                    .forEach(t => {
                        const a = document.createElement('a');
                        // Build href that works for both file:// and http://
                        let href = t.url.replace(/^\./, ''); // strip leading dot
                        if (location.protocol !== 'file:') {
                            // On a web server use root‑relative path
                            href = '/' + href;
                        }
                        a.href = href;
                        a.textContent = t.name;
                        a.className = 'tool-link';
                        list.appendChild(a);
                        list.appendChild(document.createElement('br'));
                    });
            })
            .catch(e => console.error('加载工具列表失败', e));
    </script>
</body>
</html>
