<style>
.tool-box { padding:24px; background:var(--surface); border-radius:var(--r); border:1px solid var(--border); }
label { display:block; margin:12px 0 4px; font-size:13px; font-weight:600; color:var(--muted); }
textarea, input { width:100%; padding:10px 12px; border-radius:8px; border:1px solid var(--border); background:var(--bg); color:var(--text); font-size:14px; font-family:inherit; }
input:focus, textarea:focus { outline:none; border-color:var(--cyan); }
.btn { padding:10px 24px; border-radius:8px; border:none; background:linear-gradient(135deg,var(--cyan),var(--purple)); color:#fff; font-size:14px; font-weight:600; cursor:pointer; }
.btn:hover { opacity:.85; }
.btn2 { background:var(--glass-b); color:var(--text); }
.result { margin-top:16px; padding:16px; border-radius:8px; background:var(--glass); border:1px solid var(--border); white-space:pre-wrap; font-size:14px; line-height:1.8; }
.row { display:flex; gap:12px; flex-wrap:wrap; }
.row > * { flex:1; min-width:140px; }

</style>

<div class="container">
  <nav class="nav-bar">
    <div class="logo"><span class="mark">⛵</span>江湖小站-ZenTools</div>

  <div class="page-header">
    <h1><span class="hl">抽奖转盘</span></h1>
    <p>随机抽奖工具，输入选项，随机抽取一个结果。</p>
  </div>
  <div class="tool-box">
    <label>选项（每行一个）</label>
<textarea id="lwOptions" rows="6">吃饭
看电影
逛街
读书
运动
睡觉</textarea>
<div style="display:flex;gap:10px;margin-top:16px;align-items:center;flex-wrap:wrap;">
  <button class="btn" onclick="pickOne()">➜ 抽一个</button>
  <button class="btn btn2" onclick="pickMulti()">➜ 抽多个</button>
  <span><label style="display:inline;margin:0;">个数 </label><input type="number" id="lwCount" value="2" min="1" style="width:60px;" /></span>
</div>
<div class="result" id="lwResult" style="display:none;">
  <div style="text-align:center;">
    <div style="font-size:48px;margin-bottom:8px;" id="lwIcon">✨</div>
    <div id="lwText" style="font-size:22px;font-weight:700;color:var(--cyan);"></div>
  </div>
</div>
  </div>
</div>
<script src="../assets/js/tool-ui.js"></script>
<script>
function getOptions(){return document.getElementById('lwOptions').value.split('\n').filter(Boolean);}
function pickOne(){
  var opts=getOptions();if(!opts.length)return;
  var pick=opts[Math.floor(Math.random()*opts.length)];
  showLW('✨','\u2605 '+pick);
}
function pickMulti(){
  var opts=getOptions(),n=parseInt(document.getElementById('lwCount').value)||2;
  if(!opts.length)return;if(n>opts.length)n=opts.length;
  var shuffled=[...opts].sort(function(){return Math.random()-0.5;});
  showLW('✨','\u2605 '+shuffled.slice(0,n).join('  |  '));
}
function showLW(icon,text){document.getElementById('lwResult').style.display='block';document.getElementById('lwIcon').textContent=icon;document.getElementById('lwText').textContent=text;}
</script>
<button class="bookmark-float" onclick="prompt('复制链接收藏本站','https://zentools.xyz')">⭐ 收藏本站</button>
</body>
