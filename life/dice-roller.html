  <div class="tool-box" style="text-align:center;">
    <div class="dice-info">🎲 点击按钮掷骰子</div>
    <div class="dice-face" id="diceFace">⚀</div>
    <div style="font-size:32px;font-weight:900;color:var(--cyan);" id="diceValue">1</div>
    <div style="margin-top:16px;display:flex;gap:10px;justify-content:center;">
      <button class="btn" onclick="rollDice()" data-i18n="btn_掷骰子">🎲 掷骰子</button>
      <button class="btn btn2" onclick="clearDiceHistory()" data-i18n="btn_清除记录">清除记录</button>

<script src="../assets/js/tool-ui.min.js"></script>
<script>
var diceFaces=['⚀','⚁','⚂','⚃','⚄','⚅'];
var diceHistory=[];
function rollDice(){
  var el=document.getElementById('diceFace');
  el.classList.add('rolling');
  setTimeout(function(){
    var v=Math.floor(Math.random()*6)+1;
    el.textContent=diceFaces[v-1];
    el.classList.remove('rolling');
    document.getElementById('diceValue').textContent=v;
    diceHistory.unshift(v);
    if(diceHistory.length>30)diceHistory.pop();
    renderHistory();
  },300);
}
function renderHistory(){
  document.getElementById('diceHistory').innerHTML=diceHistory.map(function(v){return '<span>'+v+'</span>';}).join('');
}
function clearDiceHistory(){diceHistory=[];renderHistory();}
rollDice();
</script>
