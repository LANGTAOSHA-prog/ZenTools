<script>
var holidaysBase=[
  {name:'元旦',icon:'🎉',month:1,day:1,days:1},

  {name:'劳动节',icon:'⚒️',month:5,day:1,days:5},

  {name:'儿童节',icon:'🎈',month:6,day:1,days:1},
  {name:'建党节',icon:'🚩',month:7,day:1,days:1},
  {name:'建军节',icon:'🎖️',month:8,day:1,days:1},
  {name:'七夕节',icon:'💕',month:8,day:29,days:1,note:'农历七月初七'},
  {name:'中元节',icon:'🕯️',month:9,day:5,days:1,note:'农历七月十五'},
  {name:'中秋节',icon:'🌙',month:10,day:6,days:3,note:'农历八月十五'},
  {name:'国庆节',icon:'🇨🇳',month:10,day:1,days:7},
  {name:'重阳节',icon:'🌺',month:10,day:29,days:1,note:'农历九月初九'},
  {name:'下元节',icon:'🏮',month:11,day:15,days:1,note:'农历十月十五'},
  {name:'圣诞节',icon:'🎄',month:12,day:25,days:1}
];
function initYearSelect(){
  var sel=document.getElementById('hYear');
  var y=new Date().getFullYear();
  for(var i=y-2;i<=y+3;i++){
    var opt=document.createElement('option');
    opt.value=i;opt.textContent=i+'年';
    if(i===y)opt.selected=true;
    sel.appendChild(opt);
  }
}
function getWeekDay(year,month,day){
  var days=['日','一','二','三','四','五','六'];
  return '周'+days[new Date(year,month-1,day).getDay()];
}
function loadHolidays(){
  var year=parseInt(document.getElementById('hYear').value);
  var list=document.getElementById('holidayList');
  list.innerHTML='';
  holidaysBase.forEach(function(h){
    var d=new Date(year,h.month-1,h.day);
    var wd=getWeekDay(year,h.month,h.day);
    var div=document.createElement('div');div.className='holiday-card';
    var daysText=h.days>1?'放假 '+h.days+' 天':'放假 1 天';
    div.innerHTML='<div class="holiday-icon">'+h.icon+'</div><div class="holiday-info"><div class="holiday-name">'+h.name+'</div><div class="holiday-date">'+year+'年'+h.month+'月'+h.day+'日 '+wd+(h.note?' · '+h.note:'')+'</div></div><div class="holiday-days">'+daysText+'</div>';
    list.appendChild(div);
  });
}
initYearSelect();loadHolidays();
</script>
