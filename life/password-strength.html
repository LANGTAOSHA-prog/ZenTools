<div style="margin-top:12px;height:8px;border-radius:4px;background:var(--glass);overflow:hidden;">

</div>
<div class="result" id="psResult">

</div>
  </div>

<script src="../assets/js/tool-ui.min.js"></script>
<script>
function checkPS(){
  var p=document.getElementById('psInput').value,l=p.length;
  document.getElementById('psLen').textContent=l;
  var score=0,chars=[];
  if(/[a-z]/.test(p)){score+=10;chars.push('小写');}
  if(/[A-Z]/.test(p)){score+=15;chars.push('大写');}
  if(/\d/.test(p)){score+=15;chars.push('数字');}
  if(/[^a-zA-Z0-9]/.test(p)){score+=20;chars.push('特殊字符');}
  score+=Math.min(l*5,40);
  if(l<6)score=Math.min(score,20);
  var bar=document.getElementById('psBar'),clr='#f43f5e',txt='弱',lvl=0;
  if(score>=80){clr='#10b981';txt='很强';lvl=4;}
  else if(score>=60){clr='#22c55e';txt='强';lvl=3;}
  else if(score>=40){clr='#f59e0b';txt='中等';lvl=2;}
  else if(score>=20){clr='#f97316';txt='弱';lvl=1;}
  bar.style.width=Math.min(score,100)+'%';bar.style.background=clr;
  document.getElementById('psChars').textContent=chars.join(', ')||'无';
  var tips='';
  if(l<6)tips+='⚠️ 密码太短，建议至少 8 位\n';
  if(l<8)tips+='⚠️ 建议增加密码长度到 8 位以上\n';
  if(chars.length<3)tips+='⚠️ 建议混合大小写、数字和特殊字符\n';
  if(!tips)tips='✅ 密码强度良好';
  document.getElementById('psTips').textContent=tips;
}
</script>
