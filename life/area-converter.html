<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>面积转换 - 生活工具 | ZenTools</title>
<meta property="og:title" content="面积转换 | ZenTools" />
<meta property="og:description" content="在线面积单位转换，支持平方米、平方公里、公顷、亩、平方英尺等。" />
<meta name="description" content="在线面积单位转换器，支持平方米、平方公里、公顷、亩、平方英尺、平方英寸、英亩等互相转换。">
<meta name="keywords" content="面积转换,面积单位,平方米换算,公顷换算,亩换算,平方英尺">
<link rel="stylesheet" href="../assets/css/tool-ui.min.css">
<style>
.tool-box { padding:24px; background:var(--surface); border-radius:var(--r); border:1px solid var(--border); }
label { display:block; margin:12px 0 4px; font-size:13px; font-weight:600; color:var(--muted); }
input, select { width:100%; padding:10px 12px; border-radius:8px; border:1px solid var(--border); background:var(--bg); color:var(--text); font-size:14px; }
input:focus, select:focus { outline:none; border-color:var(--cyan); }
.btn { padding:10px 24px; border-radius:8px; border:none; background:linear-gradient(135deg,var(--cyan),var(--purple)); color:#fff; font-size:14px; font-weight:600; cursor:pointer; }
.btn:hover { opacity:.85; }
.btn2 { background:var(--glass-b); color:var(--text); }
.result { margin-top:16px; padding:16px; border-radius:8px; background:var(--glass); border:1px solid var(--border); text-align:center; font-size:18px; }
.row { display:flex; gap:12px; }
.row > * { flex:1; }
</style>
</head>
<body>
<div class="container">
  <nav class="nav-bar">
    <div class="logo"><span class="mark">⛵</span>江湖小站-ZenTools</div>
    <div class="links"><a href="/">首页</a><a href="#" class="active">生活工具</a><a href="/categories.html">全部工具</a></div>
  </nav>
  <a href="/" class="back-home">← 返回首页</a>
  <div class="page-header">
    <h1><span class="hl">面积转换</span></h1>
    <p>在线面积单位转换，平方米、平方公里、公顷、亩、平方英尺等互相转换。</p>
  </div>
  <div class="tool-box">
    <label>数值</label>
    <input type="number" id="areaValue" value="1" step="any" oninput="convertArea()" />
    <div class="row">
      <div><label>从</label><select id="areaFrom" onchange="convertArea()"><option value="sqm">平方米 (m²)</option><option value="sqkm">平方公里 (km²)</option><option value="ha">公顷 (ha)</option><option value="mu" selected>亩</option><option value="sqft">平方英尺 (ft²)</option><option value="sqin">平方英寸 (in²)</option><option value="acre">英亩 (acre)</option><option value="sqyd">平方码 (yd²)</option></select></div>
      <div><label>到</label><select id="areaTo" onchange="convertArea()"><option value="sqm" selected>平方米 (m²)</option><option value="sqkm">平方公里 (km²)</option><option value="ha">公顷 (ha)</option><option value="mu">亩</option><option value="sqft">平方英尺 (ft²)</option><option value="sqin">平方英寸 (in²)</option><option value="acre">英亩 (acre)</option><option value="sqyd">平方码 (yd²)</option></select></div>
    </div>
    <div style="margin-top:16px;display:flex;gap:10px;">
      <button class="btn" onclick="convertArea()">转换</button>
      <button class="btn btn2" onclick="swapArea()">⇄ 互换</button>
    </div>
    <div class="result" id="areaResult">1 亩 = 666.666667 平方米</div>
  </div>
</div>
<script src="../assets/js/tool-ui.min.js"></script>
<script>
var areaUnits={sqm:1,sqkm:1000000,ha:10000,mu:666.66666667,sqft:0.092903,sqin:0.00064516,acre:4046.8564224,sqyd:0.83612736};
function convertArea(){
  var v=parseFloat(document.getElementById('areaValue').value)||0;
  var f=document.getElementById('areaFrom').value,t=document.getElementById('areaTo').value;
  var r=v*areaUnits[f]/areaUnits[t];
  document.getElementById('areaResult').textContent=v+' '+f+' = '+r.toFixed(6)+' '+t;
}
function swapArea(){
  var f=document.getElementById('areaFrom'),t=document.getElementById('areaTo');
  var tmp=f.value;f.value=t.value;t.value=tmp;
  convertArea();
}
convertArea();
</script>
<button class="bookmark-float" onclick="prompt('复制链接收藏本站','https://zentools.xyz')">⭐ 收藏本站</button>
</body>
</html>
