<script>
var areaUnits={sqm:1,sqkm:1000000,ha:10000,mu:666.66666667,sqft:0.092903,sqin:0.00064516,acre:4046.8564224,sqyd:0.83612736};
function convertArea(){
  var v=parseFloat(document.getElementById('areaValue').value)||0;
  var f=document.getElementById('areaFrom').value,t=document.getElementById('areaTo').value;
  var r=v*areaUnits[f]/areaUnits[t];
  document.getElementById('areaResult').textContent=v+' '+f+' = '+r.toFixed(6)+' '+t;
}
function swapArea(){
  var f=document.getElementById('areaFrom'),t=document.getElementById('areaTo');
  var tmp=f.value;f.value=t.value;t.value=tmp;
  convertArea();
}
convertArea();
</script>
