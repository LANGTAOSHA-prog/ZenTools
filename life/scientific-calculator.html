<script>
var scExpr='',scResult=null;
function scDisplay(){document.getElementById('calcDisplay').value=scExpr||'0';}
function scInput(v){scExpr+=v;scDisplay();}
function scClear(){scExpr='';scResult=null;scDisplay();}
function scBack(){scExpr=scExpr.slice(0,-1);scDisplay();}
function scCalc(fn){
  var d=document.getElementById('calcDisplay');
  var v=parseFloat(d.value)||0;
  var r=0;
  switch(fn){
    case 'sin':r=Math.sin(v*Math.PI/180);break;
    case 'cos':r=Math.cos(v*Math.PI/180);break;
    case 'tan':r=Math.tan(v*Math.PI/180);break;
    case 'log':r=Math.log10(v);break;
    case 'ln':r=Math.log(v);break;
    case 'sqrt':r=Math.sqrt(v);break;
    case 'sq':r=v*v;break;
    case 'cube':r=v*v*v;break;
    case 'inv':r=v!==0?1/v:0;break;
    case 'fact':r=1;for(var i=2;i<=v;i++)r*=i;break;
    case 'pi':r=Math.PI;break;
    case 'e':r=Math.E;break;
    case 'pow':scExpr+='**';scDisplay();return;
  }
  scExpr=String(Math.round(r*1e10)/1e10);
  scDisplay();
}
function scEqual(){
  try{scExpr=String(Math.round(eval(scExpr.replace('×','*').replace('÷','/').replace('−','-'))*1e10)/1e10);}catch(e){scExpr='Error';}
  scDisplay();
}
</script>
