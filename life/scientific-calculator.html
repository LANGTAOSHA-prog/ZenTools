  <div class="tool-box">
    <input type="text" class="display" id="calcDisplay" readonly value="0" />
    <div class="btns">
      <button class="fn" onclick="scCalc('sin')" data-i18n="btn_sin">sin</button><button class="fn" onclick="scCalc('cos')" data-i18n="btn_cos">cos</button><button class="fn" onclick="scCalc('tan')" data-i18n="btn_tan">tan</button><button class="fn" onclick="scCalc('log')" data-i18n="btn_log">log</button><button class="fn" onclick="scCalc('ln')" data-i18n="btn_ln">ln</button>
      <button class="fn" onclick="scCalc('sqrt')">√</button><button class="fn" onclick="scCalc('sq')" data-i18n="btn_x²">x²</button><button class="fn" onclick="scCalc('cube')" data-i18n="btn_x³">x³</button><button class="fn" onclick="scCalc('inv')" data-i18n="btn_1_x">1/x</button><button class="fn" onclick="scCalc('fact')" data-i18n="btn_n">n!</button>

      <button onclick="scInput('4')">4</button><button onclick="scInput('5')">5</button><button onclick="scInput('6')">6</button><button class="op" onclick="scInput('*')">×</button><button class="fn" onclick="scCalc('e')">e</button>
      <button onclick="scInput('1')">1</button><button onclick="scInput('2')">2</button><button onclick="scInput('3')">3</button><button class="op" onclick="scInput('-')">−</button><button class="fn" onclick="scCalc('pow')" data-i18n="btn_xʸ">xʸ</button>
      <button onclick="scInput('0')">0</button><button onclick="scInput('00')" data-i18n="btn_00">00</button><button onclick="scInput('.')">.</button><button class="op" onclick="scInput('+')">+</button><button class="eq" onclick="scEqual()">=</button>
    </div>
  </div>

<script src="../assets/js/tool-ui.min.js"></script>
<script>
var scExpr='',scResult=null;
function scDisplay(){document.getElementById('calcDisplay').value=scExpr||'0';}
function scInput(v){scExpr+=v;scDisplay();}
function scClear(){scExpr='';scResult=null;scDisplay();}
function scBack(){scExpr=scExpr.slice(0,-1);scDisplay();}
function scCalc(fn){
  var d=document.getElementById('calcDisplay');
  var v=parseFloat(d.value)||0;
  var r=0;
  switch(fn){
    case 'sin':r=Math.sin(v*Math.PI/180);break;
    case 'cos':r=Math.cos(v*Math.PI/180);break;
    case 'tan':r=Math.tan(v*Math.PI/180);break;
    case 'log':r=Math.log10(v);break;
    case 'ln':r=Math.log(v);break;
    case 'sqrt':r=Math.sqrt(v);break;
    case 'sq':r=v*v;break;
    case 'cube':r=v*v*v;break;
    case 'inv':r=v!==0?1/v:0;break;
    case 'fact':r=1;for(var i=2;i<=v;i++)r*=i;break;
    case 'pi':r=Math.PI;break;
    case 'e':r=Math.E;break;
    case 'pow':scExpr+='**';scDisplay();return;
  }
  scExpr=String(Math.round(r*1e10)/1e10);
  scDisplay();
}
function scEqual(){
  try{scExpr=String(Math.round(eval(scExpr.replace('×','*').replace('÷','/').replace('−','-'))*1e10)/1e10);}catch(e){scExpr='Error';}
  scDisplay();
}
</script>
