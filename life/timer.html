<script>
var _tm=0,_tId=null,_tr=false;
function startTimer(){if(!_tr){_tr=true;var s=Date.now()-_tm;_tId=setInterval(function(){_tm=Date.now()-s;var m=Math.floor(_tm/60000),sec=(_tm%60000)/1000;document.getElementById('timerDisplay').textContent=String(m).padStart(2,'0')+':'+sec.toFixed(1).padStart(4,'0');},100);document.getElementById('timerStartBtn').textContent='▶ 运行中';}}
function pauseTimer(){_tr=false;_tId&&clearInterval(_tId);document.getElementById('timerStartBtn').textContent='▶ 继续';}
function resetTimer(){_tr=false;_tId&&clearInterval(_tId);_tm=0;document.getElementById('timerDisplay').textContent='00:00.0';document.getElementById('timerStartBtn').textContent='▶ 开始';}
</script>
