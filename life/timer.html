    <h1><span class="hl">计时器</span></h1>
    <p>在线计时器，支持开始、暂停、重置操作。</p>
  </div>
  <div class="tool-box">
    <div style="text-align:center;padding:20px;">
  <div style="font-size:64px;font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:2px;color:var(--cyan);" id="timerDisplay">00:00.0</div>
  <div style="margin-top:20px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap;">
    <button class="btn" id="timerStartBtn" onclick="startTimer()">▶ 开始</button>
    <button class="btn btn2" onclick="pauseTimer()">⏸️ 暂停</button>
    <button class="btn btn2" onclick="resetTimer()">↺ 重置</button>
  </div>
</div>
  </div>
</div>
<script src="../assets/js/tool-ui.js"></script>
<script>
var _tm=0,_tId=null,_tr=false;
function startTimer(){if(!_tr){_tr=true;var s=Date.now()-_tm;_tId=setInterval(function(){_tm=Date.now()-s;var m=Math.floor(_tm/60000),sec=(_tm%60000)/1000;document.getElementById('timerDisplay').textContent=String(m).padStart(2,'0')+':'+sec.toFixed(1).padStart(4,'0');},100);document.getElementById('timerStartBtn').textContent='▶ 运行中';}}
function pauseTimer(){_tr=false;_tId&&clearInterval(_tId);document.getElementById('timerStartBtn').textContent='▶ 继续';}
function resetTimer(){_tr=false;_tId&&clearInterval(_tId);_tm=0;document.getElementById('timerDisplay').textContent='00:00.0';document.getElementById('timerStartBtn').textContent='▶ 开始';}
</script>
<button class="bookmark-float" onclick="prompt('复制链接收藏本站','https://zentools.xyz')">⭐ 收藏本站</button>
