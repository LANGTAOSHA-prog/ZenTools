<script>
function toBase(v,f){if(f==='c')return v;if(f==='f')return(v-32)*5/9;if(f==='k')return v-273.15;}
function fromBase(v,t){if(t==='c')return v;if(t==='f')return v*9/5+32;if(t==='k')return v+273.15;}
function convertT(){var v=parseFloat(document.getElementById('tValue').value)||0,f=document.getElementById('tFrom').value,t=document.getElementById('tTo').value;var base=toBase(v,f);var r=fromBase(base,t);document.getElementById('tResult').textContent=v+' °'+f.toUpperCase()+' = '+r.toFixed(2)+' °'+t.toUpperCase();}
function swapT(){var f=document.getElementById('tFrom'),t=document.getElementById('tTo');var tmp=f.value;f.value=t.value;t.value=tmp;convertT();}
convertT();
</script>
