function getZodiac(month,day){
  for(var i=0;i<zodiacs.length;i++){
    var s=zodiacs[i].start.split('-'),e=zodiacs[i].end.split('-');
    var sm=parseInt(s[0]),sd=parseInt(s[1]),em=parseInt(e[0]),ed=parseInt(e[1]);
    if(sm<em){
      if((month===sm&&day>=sd)||(month>sm&&month<em)||(month===em&&day<=ed))return zodiacs[i];
    }else{
      if((month===sm&&day>=sd)||month>sm||month<em||(month===em&&day<=ed))return zodiacs[i];
    }
  }
  return zodiacs[0];
}
function queryZodiac(){
  var val=document.getElementById('zodiacDate').value;
  if(!val){alert('请选择出生日期');return;}
  var parts=val.split('-');
  var year=parseInt(parts[0]),month=parseInt(parts[1]),day=parseInt(parts[2]);
  var z=getZodiac(month,day);
  document.getElementById('zodiacIcon').textContent=z.icon;
  document.getElementById('zodiacName').textContent=z.name;
  document.getElementById('zodiacDateRange').textContent=z.start+' 至 '+z.end;
  document.getElementById('zodiacInfo').textContent=z.info;
  document.getElementById('zodiacResult').style.display='block';
}

<script>
// 暗黑模式切换
(function() {
  var savedTheme = localStorage.getItem('zentools_theme');
  if (savedTheme === 'dark') document.documentElement.classList.add('dark');
  var btn = document.getElementById('themeToggle');
  if (btn) {
    btn.textContent = document.documentElement.classList.contains('dark') ? '☀️' : '🌙';
    btn.addEventListener('click', function() {
      document.documentElement.classList.toggle('dark');
      var isDark = document.documentElement.classList.contains('dark');
      this.textContent = isDark ? '☀️' : '🌙';
      localStorage.setItem('zentools_theme', isDark ? 'dark' : 'light');
    });
  }
})();

// 移动端侧滑
(function() {
  var overlay = document.getElementById('mobileOverlay');
  var hamBtn = document.getElementById('hamburgerBtn');
  var closeBtn = document.getElementById('mobileClose');
  if (!hamBtn || !overlay) return;
  function closeMenu() { overlay.classList.remove('open'); hamBtn.textContent = '☰'; document.body.style.overflow = ''; }
  hamBtn.addEventListener('click', function(e) {
    e.stopPropagation();
    if (overlay.classList.contains('open')) { closeMenu(); } else {
      overlay.classList.add('open'); hamBtn.textContent = '✕'; document.body.style.overflow = 'hidden';
    }
  });
  if (closeBtn) closeBtn.addEventListener('click', closeMenu);
  overlay.addEventListener('click', function(e) {
    var drawer = document.getElementById('mobileDrawer');
    if (drawer && !drawer.contains(e.target)) closeMenu();
  });
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape' && overlay.classList.contains('open')) closeMenu();
  });
})();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', function() {
    navigator.serviceWorker.register('/sw.js').catch(function() {});
  });
}
</script>
