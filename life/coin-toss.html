<script>
var heads=0,tails=0,total=0;
function tossCoin(){
  var el=document.getElementById('coinFace');
  el.classList.add('flipping');
  setTimeout(function(){
    var isHeads=Math.random()>0.5;
    if(isHeads){heads++;el.textContent='👑';document.getElementById('coinResult').textContent='正面';}else{tails++;el.textContent='🌙';document.getElementById('coinResult').textContent='反面';}
    total++;
    document.getElementById('headsCount').textContent=heads;
    document.getElementById('tailsCount').textContent=tails;
    document.getElementById('totalCount').textContent=total;
    el.classList.remove('flipping');
  },600);
}
function resetCoin(){heads=0;tails=0;total=0;document.getElementById('headsCount').textContent='0';document.getElementById('tailsCount').textContent='0';document.getElementById('totalCount').textContent='0';document.getElementById('coinResult').textContent='正面';document.getElementById('coinFace').textContent='👑';}
</script>
