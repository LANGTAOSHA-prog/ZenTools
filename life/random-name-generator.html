var zhMale='伟强磊军勇杰涛明建华志国平斌鹏飞旭文辉海峰林宇浩阳俊凯鑫晨昊哲博超坤龙威毅勇琪彬良胜涛峰俊成武宁远安民宏政奇力诚达荣亮振清刚峰贤德福贵友广才文元宝利茂盛发和顺泰安'.split('');
var zhFemale='芳娟秀英华娜丽珍萍红莲艳玲琴桂玉霞雪梅静慧雅琳颖春洁莹蕾敏佳倩婷琳茜颖璐珊淑琦婉然瑶悦馨蕊怡璇艺桐诺汐瑶珂玫'.split('');
var enFirst='JamesJohnRobertMichaelWilliamDavidRichardJosephThomasCharlesChristopherDanielMatthewAnthonyMarkDonaldStevenPaulAndrewJoshuaKennethKevinBrianGeorgeEdwardRonaldTimothyJasonJeffreyRyanJacobGaryNicholasEricJonathanStephenLarryJustinScottBrandonBenjaminSamuelRaymondGregoryFrankAlexanderPatrickJackDennisJerryTylerAaronJoseNathanHenryDouglasAdamPeter'.split(' ');
var enLast='SmithJohnsonWilliamsBrownJonesGarciaMillerDavisRodriguezMartinezHernandezLopezGonzalezWilsonAndersonThomasTaylorMooreJacksonMartinLeePerezThompsonWhiteHarrisSanchezClarkRamirezLewisRobinsonWalkerYoungAllenKingWrightScottTorresNguyenHillFloresGreenAdamsNelsonBakerHallRiveraCampbellMitchellCarterRoberts'.split(' ');
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}
function genNames(){
  var type=document.getElementById('nameType').value;
  var gender=document.getElementById('nameGender').value;
  var count=parseInt(document.getElementById('nameCount').value)||10;
  var names=[];
  for(var i=0;i<count;i++){
    if(type==='zh'){
      var surname=pick(zhSurnames);
      var given;
      if(gender==='all')given=Math.random()>0.5?pick(zhMale):pick(zhFemale);
      else if(gender==='male')given=pick(zhMale);
      else given=pick(zhFemale);
      var g2=Math.random()>0.3?pick(gender==='female'?zhFemale:zhMale):'';
      names.push(surname+given+g2);
    }else{
      var first=pick(enFirst);
      var last=pick(enLast);
      names.push(first+' '+last);
    }
  }
  document.getElementById('nameResult').innerHTML=names.map(function(n){return '<span class="name-item">'+n+'</span>';}).join('');
}
genNames();
</script>
