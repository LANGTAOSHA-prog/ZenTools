  <div class="page-header">
    <h1><span class="hl">渐变色生成器</span></h1>
    <p>在线生成 CSS 渐变色，挑选颜色和角度，实时预览。</p>
  </div>
  <div class="tool-box">
    <div class="row">
  <div><label>颜色 1</label><input type="color" id="ggColor1" value="#00e5ff" onchange="updateGG()" /></div>
  <div><label>颜色 2</label><input type="color" id="ggColor2" value="#a855f7" onchange="updateGG()" /></div>
  <div><label>角度 (deg)</label><input type="number" id="ggAngle" value="135" min="0" max="360" onchange="updateGG()" /></div>
</div>
<div id="ggPreview" style="width:100%;height:120px;border-radius:12px;margin-top:12px;border:1px solid var(--border);background:linear-gradient(135deg,#00e5ff,#a855f7);"></div>
<div style="display:flex;gap:10px;margin-top:12px;flex-wrap:wrap;">
  <button class="btn" onclick="copyGradient()">复制 CSS</button>
  <button class="btn btn2" onclick="randomGG()">随机</button>
</div>
<div class="result" id="ggResult"></div>
  </div>
</div>
<script src="../assets/js/tool-ui.js"></script>
<script>
function updateGG(){
  var c1=document.getElementById('ggColor1').value,c2=document.getElementById('ggColor2').value,a=document.getElementById('ggAngle').value||135;
  document.getElementById('ggPreview').style.background='linear-gradient('+a+'deg,'+c1+','+c2+')';
  var css='background: linear-gradient('+a+'deg, '+c1+', '+c2+');';
  document.getElementById('ggResult').textContent=css;
}
function copyGradient(){navigator.clipboard.writeText(document.getElementById('ggResult').textContent).then(function(){document.getElementById('ggResult').textContent+='\n\n✅ 已复制';});}
function randomGG(){
  var r=function(){return '#'+Math.floor(Math.random()*16777215).toString(16).padStart(6,'0');};
  document.getElementById('ggColor1').value=r();document.getElementById('ggColor2').value=r();
  document.getElementById('ggAngle').value=Math.floor(Math.random()*360);
  updateGG();
}
updateGG();
</script>
<button class="bookmark-float" onclick="prompt('复制链接收藏本站','https://zentools.xyz')">⭐ 收藏本站</button>
