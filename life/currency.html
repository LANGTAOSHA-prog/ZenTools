<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>汇率换算 - ZenTools</title>
<meta name="description" content="ZenTools 免费在线汇率换算工具。">
<style>
:root{--bg:#0f172a;--card:#111827;--border:#1f2937;--text:#f3f4f6;--muted:#94a3b8;--blue:#2563eb;--green:#10b981;--red:#ef4444}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:Arial,"Noto Sans SC","Noto Sans JP",sans-serif;line-height:1.7}
.container{max-width:1000px;margin:auto;padding:40px 20px}
a{color:#60a5fa;text-decoration:none}
.top-bar{display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap;margin-bottom:20px}
.lang-select{background:#111827;color:white;border:1px solid #334155;border-radius:10px;padding:10px 12px}
.card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:28px}
h1{margin-bottom:15px}.desc{color:var(--muted);margin-bottom:25px}
.ad-box{margin:25px 0;height:110px;border:2px dashed #334155;border-radius:18px;display:flex;align-items:center;justify-content:center;color:#64748b}
input,select,textarea{width:100%;margin:10px 0;padding:14px;border-radius:12px;border:1px solid #334155;background:#0f172a;color:white;font-size:16px}
textarea{min-height:180px;resize:vertical}
button{background:var(--blue);color:white;border:none;padding:13px 18px;border-radius:12px;cursor:pointer;font-size:15px;font-weight:bold;margin:6px 6px 6px 0}
.copy-btn,.download-btn{background:var(--green)}
.clear-btn{background:var(--red)}
.result,.info{margin-top:28px}.info h2{margin-top:25px}.info p,.result{color:#cbd5e1;white-space:pre-line}
.preview img{max-width:100%;border-radius:14px;border:1px solid #334155;margin-top:15px}
.download-link{display:inline-block;margin-top:15px;background:var(--green);color:white;padding:12px 18px;border-radius:12px}
footer{margin-top:50px;text-align:center;color:#94a3b8}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:15px}
.box{background:#0b1220;border:1px solid #334155;border-radius:16px;padding:18px}
@media(max-width:768px){button,.lang-select{width:100%}}
</style>
</head>
<body>
<div class="container">
  <div class="top-bar">
    <a href="index.html" data-i18n="back">← 返回首页</a>
    <select id="languageSelect" class="lang-select">
      <option value="zh">中文</option>
      <option value="ja">日本語</option>
      <option value="en">English</option>
      <option value="vi">Tiếng Việt</option>
    </select>
  </div>
  <div class="card">
    
<h1 data-i18n="title">汇率换算</h1><p class="desc" data-i18n="desc">常用货币快速换算。</p>
<div class="ad-box" data-i18n="ad">广告位（Google AdSense）</div>
<input type="number" id="amount" value="100">
<select id="from"><option>USD</option><option>JPY</option><option>CNY</option><option>EUR</option><option>GBP</option><option>KRW</option><option>VND</option></select>
<select id="to"><option>JPY</option><option>USD</option><option>CNY</option><option>EUR</option><option>GBP</option><option>KRW</option><option>VND</option></select>
<button onclick="convert()" data-i18n="convert">换算</button>
<div class="result" id="result"></div>
<div class="info"><h2 data-i18n="noteTitle">说明</h2><p data-i18n="noteText">此工具为前端静态参考汇率，实际交易请以银行或官方实时汇率为准。</p></div>

  </div>
  <footer>© 2026 ZenTools</footer>
</div>
<script>
const translations={
 zh:{pageTitle:"汇率换算 - ZenTools",back:"← 返回首页",title:"汇率换算",desc:"常用货币快速换算。",ad:"广告位（Google AdSense）",convert:"换算",noteTitle:"说明",noteText:"此工具为前端静态参考汇率，实际交易请以银行或官方实时汇率为准。"},
 ja:{pageTitle:"為替換算 - ZenTools",back:"← ホームに戻る",title:"為替換算",desc:"主要通貨を簡単に換算。",ad:"広告スペース",convert:"換算",noteTitle:"説明",noteText:"このツールは静的な参考レートです。実際の取引は銀行または公式レートをご確認ください。"},
 en:{pageTitle:"Currency Converter - ZenTools",back:"← Back to Home",title:"Currency Converter",desc:"Quickly convert common currencies.",ad:"Ad Space",convert:"Convert",noteTitle:"Notice",noteText:"This tool uses static reference rates. For real transactions, check bank or official live rates."},
 vi:{pageTitle:"Chuyển đổi tiền tệ - ZenTools",back:"← Quay lại trang chủ",title:"Chuyển đổi tiền tệ",desc:"Chuyển đổi nhanh các loại tiền phổ biến.",ad:"Vị trí quảng cáo",convert:"Chuyển đổi",noteTitle:"Lưu ý",noteText:"Công cụ dùng tỷ giá tham khảo tĩnh. Giao dịch thực tế hãy kiểm tra tỷ giá ngân hàng hoặc chính thức."}
};

const languageSelect=document.getElementById("languageSelect");
let currentLang="zh";
function applyI18n(data){
 document.documentElement.lang=currentLang; document.title=data.pageTitle||document.title;
 document.querySelectorAll("[data-i18n]").forEach(el=>{const k=el.getAttribute("data-i18n"); if(data[k]) el.textContent=data[k];});
 document.querySelectorAll("[data-i18n-placeholder]").forEach(el=>{const k=el.getAttribute("data-i18n-placeholder"); if(data[k]) el.placeholder=data[k];});
 localStorage.setItem("siteLanguage",currentLang);
}
function setLanguage(lang){currentLang=lang; applyI18n(translations[lang]||translations.zh);}
languageSelect.addEventListener("change",e=>setLanguage(e.target.value));
const savedLang=localStorage.getItem("siteLanguage")||"zh"; languageSelect.value=savedLang;

setLanguage(savedLang);
const usdRates={USD:1,JPY:155,CNY:7.25,EUR:0.92,GBP:0.79,KRW:1360,VND:25400};
function convert(){
 const amount=parseFloat(document.getElementById("amount").value)||0;
 const from=document.getElementById("from").value,to=document.getElementById("to").value;
 const usd=amount/usdRates[from]; const res=usd*usdRates[to];
 document.getElementById("result").textContent=amount+" "+from+" ≈ "+res.toFixed(2)+" "+to;
}
convert();
<script>
const seoData = {
  title: "工具名称 - 免费在线工具 | ZenTools",
  description: "免费在线工具名称，支持手机与电脑，无需安装软件。",
  keywords: "工具名称,在线工具,免费工具,ZenTools",
  url: "https://www.zentools.xyz/tool.html",
  image: "https://www.zentools.xyz/logo.png"
};

function setMeta(name, content){
  let meta = document.querySelector(`meta[name="${name}"]`);
  if(!meta){
    meta = document.createElement("meta");
    meta.setAttribute("name", name);
    document.head.appendChild(meta);
  }
  meta.setAttribute("content", content);
}

function setProperty(property, content){
  let meta = document.querySelector(`meta[property="${property}"]`);
  if(!meta){
    meta = document.createElement("meta");
    meta.setAttribute("property", property);
    document.head.appendChild(meta);
  }
  meta.setAttribute("content", content);
}

function setCanonical(url){
  let link = document.querySelector('link[rel="canonical"]');
  if(!link){
    link = document.createElement("link");
    link.setAttribute("rel", "canonical");
    document.head.appendChild(link);
  }
  link.setAttribute("href", url);
}

function applySEO(){
  document.title = seoData.title;

  setMeta("description", seoData.description);
  setMeta("keywords", seoData.keywords);
  setMeta("author", "ZenTools");

  setCanonical(seoData.url);

  setProperty("og:title", seoData.title);
  setProperty("og:description", seoData.description);
  setProperty("og:type", "website");
  setProperty("og:url", seoData.url);
  setProperty("og:image", seoData.image);

  setMeta("twitter:card", "summary_large_image");
  setMeta("twitter:title", seoData.title);
  setMeta("twitter:description", seoData.description);
}

applySEO();
</script>
</body>
</html>
