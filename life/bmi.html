function setLanguage(lang){
  currentLang = lang;
  const data = translations[lang] || translations.zh;
  document.documentElement.lang = lang;
  document.title = data.pageTitle;

  document.querySelectorAll("[data-i18n]").forEach(el=>{
    const key = el.getAttribute("data-i18n");
    if(data[key]) el.textContent = data[key];
  });

  document.getElementById("heightInput").placeholder = data.heightPlaceholder;
  document.getElementById("weightInput").placeholder = data.weightPlaceholder;

  localStorage.setItem("zentools_lang", lang);
}

languageSelect.addEventListener("change", e=>setLanguage(e.target.value));
const savedLang = localStorage.getItem("zentools_lang") || "zh";
languageSelect.value = savedLang;
setLanguage(savedLang);

function calculateBMI(){
  const h = parseFloat(document.getElementById("heightInput").value);
  const w = parseFloat(document.getElementById("weightInput").value);
  const data = translations[currentLang] || translations.zh;

  if(!h || !w || h <= 0 || w <= 0){
    alert(data.empty);
    return;
  }

  const m = h / 100;
  const bmi = w / (m * m);
  const value = bmi.toFixed(1);

  let status = data.normal;
  if(bmi < 18.5) status = data.under;
  else if(bmi < 25) status = data.normal;
  else if(bmi < 30) status = data.over;
  else status = data.obese;

  document.getElementById("resultBox").style.display = "block";
  document.getElementById("bmiValue").textContent = data.bmiText + " " + value;
  document.getElementById("bmiStatus").textContent = status;
}

function setMeta(name, content){
  let meta = document.querySelector(`meta[name="${name}"]`);
  if(!meta){
    meta = document.createElement("meta");
    meta.setAttribute("name", name);
    document.head.appendChild(meta);
  }
  meta.setAttribute("content", content);
}

function setProperty(property, content){
  let meta = document.querySelector(`meta[property="${property}"]`);
  if(!meta){
    meta = document.createElement("meta");
    meta.setAttribute("property", property);
    document.head.appendChild(meta);
  }
  meta.setAttribute("content", content);
}

function setCanonical(url){
  let link = document.querySelector('link[rel="canonical"]');
  if(!link){
    link = document.createElement("link");
    link.setAttribute("rel", "canonical");
    document.head.appendChild(link);
  }
  link.setAttribute("href", url);
}

function applySEO(){
  document.title = seoData.title;
