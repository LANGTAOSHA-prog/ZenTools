<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>体积转换 - 生活工具 | ZenTools</title>
<meta property="og:title" content="体积转换 | ZenTools" />
<meta property="og:description" content="在线体积容量单位转换，支持升、毫升、立方米、加仑、品脱等。" />
<meta name="description" content="在线体积容量单位转换器，支持升、毫升、立方米、立方厘米、加仑、品脱、夸脱、立方英尺等互相转换。">
<meta name="keywords" content="体积转换,容量转换,升换算,毫升换算,加仑换算,品脱,体积单位">
<link rel="stylesheet" href="../assets/css/tool-ui.min.css">
<style>
.tool-box { padding:24px; background:var(--surface); border-radius:var(--r); border:1px solid var(--border); }
label { display:block; margin:12px 0 4px; font-size:13px; font-weight:600; color:var(--muted); }
input, select { width:100%; padding:10px 12px; border-radius:8px; border:1px solid var(--border); background:var(--bg); color:var(--text); font-size:14px; }
input:focus, select:focus { outline:none; border-color:var(--cyan); }
.btn { padding:10px 24px; border-radius:8px; border:none; background:linear-gradient(135deg,var(--cyan),var(--purple)); color:#fff; font-size:14px; font-weight:600; cursor:pointer; }
.btn:hover { opacity:.85; }
.btn2 { background:var(--glass-b); color:var(--text); }
.result { margin-top:16px; padding:16px; border-radius:8px; background:var(--glass); border:1px solid var(--border); text-align:center; font-size:18px; }
.row { display:flex; gap:12px; }
.row > * { flex:1; }
</style>
</head>
<body>
<div class="container">
  <nav class="nav-bar">
    <div class="logo"><span class="mark">⛵</span>江湖小站-ZenTools</div>
    <div class="links"><a href="/">首页</a><a href="#" class="active">生活工具</a><a href="/categories.html">全部工具</a></div>
  </nav>
  <a href="/" class="back-home">← 返回首页</a>
  <div class="page-header">
    <h1><span class="hl">体积转换</span></h1>
    <p>在线体积容量单位转换，升、毫升、立方米、加仑、品脱等互相转换。</p>
  </div>
  <div class="tool-box">
    <label>数值</label>
    <input type="number" id="volValue" value="1" step="any" oninput="convertVol()" />
    <div class="row">
      <div><label>从</label><select id="volFrom" onchange="convertVol()"><option value="l" selected>升 (L)</option><option value="ml">毫升 (mL)</option><option value="m3">立方米 (m³)</option><option value="cm3">立方厘米 (cm³)</option><option value="gal">加仑 (gal)</option><option value="qt">夸脱 (qt)</option><option value="pt">品脱 (pt)</option><option value="cup">杯 (cup)</option><option value="floz">液体盎司 (fl oz)</option><option value="cuft">立方英尺 (ft³)</option></select></div>
      <div><label>到</label><select id="volTo" onchange="convertVol()"><option value="l">升 (L)</option><option value="ml" selected>毫升 (mL)</option><option value="m3">立方米 (m³)</option><option value="cm3">立方厘米 (cm³)</option><option value="gal">加仑 (gal)</option><option value="qt">夸脱 (qt)</option><option value="pt">品脱 (pt)</option><option value="cup">杯 (cup)</option><option value="floz">液体盎司 (fl oz)</option><option value="cuft">立方英尺 (ft³)</option></select></div>
    </div>
    <div style="margin-top:16px;display:flex;gap:10px;">
      <button class="btn" onclick="convertVol()">转换</button>
      <button class="btn btn2" onclick="swapVol()">⇄ 互换</button>
    </div>
    <div class="result" id="volResult">1 升 = 1000 毫升</div>
  </div>
</div>
<script src="../assets/js/tool-ui.min.js"></script>
<script>
var volUnits={l:1,ml:0.001,m3:1000,cm3:0.001,gal:3.78541,qt:0.946353,pt:0.473176,cup:0.236588,floz:0.0295735,cuft:28.3168};
function convertVol(){
  var v=parseFloat(document.getElementById('volValue').value)||0;
  var f=document.getElementById('volFrom').value,t=document.getElementById('volTo').value;
  var r=v*volUnits[f]/volUnits[t];
  document.getElementById('volResult').textContent=v+' '+f+' = '+r.toFixed(6)+' '+t;
}
function swapVol(){
  var f=document.getElementById('volFrom'),t=document.getElementById('volTo');
  var tmp=f.value;f.value=t.value;t.value=tmp;
  convertVol();
}
convertVol();
</script>
<button class="bookmark-float" onclick="prompt('复制链接收藏本站','https://zentools.xyz')">⭐ 收藏本站</button>
</body>
</html>
