  <div class="page-header">
    <h1><span class="hl">秒表</span></h1>
    <p>在线秒表，支持开始、暂停、计次和重置，精确到百分之一秒。</p>
  </div>
  <div class="tool-box">
    <div class="display" id="swDisplay">00:00.00</div>
    <div class="controls">
      <button class="btn" id="swStartBtn" onclick="swStart()" data-i18n="btn_开始">▶ 开始</button>
      <button class="btn btn2" onclick="swLap()" data-i18n="btn_计次">⏱️ 计次</button>
      <button class="btn btn2" onclick="swPause()" data-i18n="btn_暂停">⏸️ 暂停</button>
      <button class="btn btn-danger" onclick="swReset()" data-i18n="btn_重置">↺ 重置</button>
    </div>
    <div class="lap-list" id="swLapList"></div>
  </div>
</div>
<script src="../assets/js/tool-ui.min.js"></script>
<script>
var swTime=0,swInterval=null,swRunning=false,swLapCount=0;
function swFormat(t){
  var m=Math.floor(t/60000),s=Math.floor((t%60000)/1000),ms=Math.floor((t%1000)/10);
  return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')+'.'+String(ms).padStart(2,'0');
}
function swUpdate(){
  swTime+=10;
  document.getElementById('swDisplay').textContent=swFormat(swTime);
}
function swStart(){
  if(swRunning) return;
  swRunning=true;
  swInterval=setInterval(swUpdate,10);
  document.getElementById('swStartBtn').textContent='▶ 运行中';
}
function swPause(){
  swRunning=false;
  clearInterval(swInterval);
  document.getElementById('swStartBtn').textContent='▶ 继续';
}
function swLap(){
  if(!swRunning) return;
  swLapCount++;
  var list=document.getElementById('swLapList');
  var div=document.createElement('div');div.className='lap-item';
  div.innerHTML='<span class="lap-num">计次 '+(swLapCount)+'</span><span class="lap-time">'+swFormat(swTime)+'</span>';
  list.appendChild(div);
  list.scrollTop=list.scrollHeight;
}
function swReset(){
  swRunning=false;clearInterval(swInterval);swTime=0;swLapCount=0;
  document.getElementById('swDisplay').textContent='00:00.00';
  document.getElementById('swStartBtn').textContent='▶ 开始';
  document.getElementById('swLapList').innerHTML='';
}
</script>
