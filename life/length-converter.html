<script>window.pageTranslations={"zh":{pageTitle: '长度转换 - 生活工具 | ZenTools', metaDesc: '在线长度单位转换器，支持米、厘米、毫米、公里、英寸、英尺、码、英里等常见单位互相转换。', btn_转换: '转换', btn_互换: '⇄ 互换', btn_收藏本站: '⭐ 收藏本站', lbl_数值: '数值'},"en":{pageTitle: '长度转换 - Free Online Tool | ZenTools', metaDesc: 'Free online tool. Process in browser.', btn_转换: '转换', btn_互换: '⇄ 互换', btn_收藏本站: '⭐ 收藏本站', lbl_数值: '数值'},"ja":{pageTitle: '长度转换 - 無料オンラインツール | ZenTools', metaDesc: 'ブラウザで動作する無料ツール。', btn_转换: '转换', btn_互换: '⇄ 互换', btn_收藏本站: '⭐ 收藏本站', lbl_数值: '数值'},"vi":{pageTitle: '长度转换 - Công cụ Trực tuyến | ZenTools', metaDesc: 'Công cụ trực tuyến miễn phí.', btn_转换: '转换', btn_互换: '⇄ 互换', btn_收藏本站: '⭐ 收藏本站', lbl_数值: '数值'}};</script>

<body>
<div class="container">
  <nav class="nav-bar">
<select id="langSelect" class="lang-select"><option value="zh">中文</option><option value="ja">日本語</option><option value="en">English</option><option value="vi">Tiếng Việt</option></select>

  <div class="page-header">
    <h1><span class="hl">长度转换</span></h1>
    <p>在线长度单位转换，米、厘米、毫米、公里、英寸、英尺、码、英里互相转换。</p>
  </div>
  <div class="tool-box">
    <label data-i18n="lbl_数值">数值</label>
    <input type="number" id="lenValue" value="1" step="any" oninput="convertLength()" />
    <div class="row">
      <div><label>从</label><select id="lenFrom" onchange="convertLength()"><option value="m">米 (m)</option><option value="km">公里 (km)</option><option value="cm" selected>厘米 (cm)</option><option value="mm">毫米 (mm)</option><option value="inch">英寸 (in)</option><option value="ft">英尺 (ft)</option><option value="yd">码 (yd)</option><option value="mile">英里 (mi)</option></select></div>
      <div><label>到</label><select id="lenTo" onchange="convertLength()"><option value="m">米 (m)</option><option value="km">公里 (km)</option><option value="cm">厘米 (cm)</option><option value="mm">毫米 (mm)</option><option value="inch" selected>英寸 (in)</option><option value="ft">英尺 (ft)</option><option value="yd">码 (yd)</option><option value="mile">英里 (mi)</option></select></div>
    </div>
    <div style="margin-top:16px;display:flex;gap:10px;">
      <button class="btn" onclick="convertLength()" data-i18n="btn_转换">转换</button>
      <button class="btn btn2" onclick="swapLen()" data-i18n="btn_互换">⇄ 互换</button>
    </div>
    <div class="result" id="lenResult">1 厘米 = 0.393701 英寸</div>
  </div>
</div>
<script src="../assets/js/tool-ui.min.js"></script>
<script>
var lenUnits={m:1,km:1000,cm:0.01,mm:0.001,inch:0.0254,ft:0.3048,yd:0.9144,mile:1609.344};
function convertLength(){
  var v=parseFloat(document.getElementById('lenValue').value)||0;
  var f=document.getElementById('lenFrom').value,t=document.getElementById('lenTo').value;
  var r=v*lenUnits[f]/lenUnits[t];
  document.getElementById('lenResult').textContent=v+' '+f+' = '+r.toFixed(6)+' '+t;
}
function swapLen(){
  var f=document.getElementById('lenFrom'),t=document.getElementById('lenTo');
  var tmp=f.value;f.value=t.value;t.value=tmp;
  convertLength();
}
convertLength();
</script>
