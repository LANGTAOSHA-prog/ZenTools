<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>在线文字转语音工具</title>
<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Arial, "Microsoft YaHei", sans-serif;
  background: #f3f4f6;
  color: #222;
  font-size: 18px;
}

.container {
  max-width: 780px;
  margin: 0 auto;
  padding: 30px 16px;
}

h1 {
  text-align: center;
  font-size: 32px;
  margin-bottom: 24px;
  color: #1f2937;
}

textarea {
  width: 100%;
  height: 280px;
  padding: 18px;
  font-size: 20px;
  line-height: 1.8;
  border: 1px solid #d1d5db;
  border-radius: 16px;
  resize: vertical;
  outline: none;
  background: #ffffff;
}

textarea:focus {
  border-color: #22c55e;
  box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.18);
}

.controls {
  margin-top: 18px;
  display: flex;
  gap: 12px;
  justify-content: center;
  flex-wrap: wrap;
}

button {
  border: none;
  border-radius: 999px;
  padding: 13px 30px;
  font-size: 18px;
  cursor: pointer;
  color: white;
  background: #22c55e;
}

button:hover {
  background: #16a34a;
}

button:active {
  transform: scale(0.98);
}

.panel {
  margin-top: 24px;
  background: #ffffff;
  border-radius: 16px;
  padding: 20px;
  border: 1px solid #e5e7eb;
}

.panel label {
  display: block;
  margin-bottom: 10px;
  color: #374151;
  font-size: 18px;
}

input[type="range"],
select {
  width: 100%;
  font-size: 18px;
}

select {
  padding: 12px;
  border-radius: 12px;
  border: 1px solid #d1d5db;
  background: #fff;
  margin-bottom: 18px;
}

.ad-box {
  margin-top: 32px;
  height: 90px;
  border-radius: 14px;
  background: #e9eef5;
  border: 1px dashed #cbd5e1;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #94a3b8;
  font-size: 16px;
}
</style>
</head>

<body>

<div class="container">
  <h1>在线文字转语音工具</h1>

  <textarea id="textInput" placeholder="请输入要朗读的文字..."></textarea>

  <div class="controls">
    <button onclick="startSpeak()">开始朗读</button>
    <button onclick="pauseSpeak()">暂停</button>
  </div>

  <div class="panel">
    <label>选择声音性别：</label>
    <select id="genderSelect">
      <option value="female">女声</option>
      <option value="male">男声</option>
      <option value="default">默认声音</option>
    </select>

    <label>
      语速调节：<span id="speedValue">1.0</span>x
    </label>
    <input id="speedRange" type="range" min="0.5" max="2" step="0.1" value="1">
  </div>

  <div class="ad-box">
    横条广告位预留
  </div>
</div>

<script>
const textInput = document.getElementById("textInput");
const speedRange = document.getElementById("speedRange");
const speedValue = document.getElementById("speedValue");
const genderSelect = document.getElementById("genderSelect");

let voices = [];

function loadVoices() {
  voices = speechSynthesis.getVoices();
}

speechSynthesis.onvoiceschanged = loadVoices;
loadVoices();

speedRange.addEventListener("input", function () {
  speedValue.textContent = speedRange.value;
});

function chooseVoice(gender) {
  if (!voices.length) {
    voices = speechSynthesis.getVoices();
  }

  const chineseVoices = voices.filter(v => 
    v.lang.includes("zh") || v.lang.includes("CN")
  );

  if (gender === "female") {
    return chineseVoices.find(v =>
      /female|woman|xiaoxiao|xiaoyi|huihui|hanhan|mei/i.test(v.name)
    ) || chineseVoices[0] || null;
  }

  if (gender === "male") {
    return chineseVoices.find(v =>
      /male|man|yunxi|yunjian|kangkang|zhiyu/i.test(v.name)
    ) || chineseVoices[1] || chineseVoices[0] || null;
  }

  return chineseVoices[0] || null;
}

function startSpeak() {
  const text = textInput.value.trim();

  if (!text) {
    alert("请先输入要朗读的文字");
    return;
  }

  if (speechSynthesis.paused) {
    speechSynthesis.resume();
    return;
  }

  speechSynthesis.cancel();

  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = "zh-CN";
  utterance.rate = Number(speedRange.value);
  utterance.pitch = 1;
  utterance.volume = 1;

  const selectedVoice = chooseVoice(genderSelect.value);
  if (selectedVoice) {
    utterance.voice = selectedVoice;
  }

  speechSynthesis.speak(utterance);
}

function pauseSpeak() {
  if (speechSynthesis.speaking && !speechSynthesis.paused) {
    speechSynthesis.pause();
  }
}
</script>

</body>
</html>
