<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JSON美化 - 本地处理</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f6f8fa; padding: 20px; min-height: 100vh; display: flex; justify-content: center; align-items: center; }
        .container { max-width: 1200px; width: 100%; background: white; border-radius: 20px; padding: 32px; box-shadow: 0 8px 30px rgba(0,0,0,0.08); }
        .header h1 { font-size: 28px; margin-bottom: 6px; }
        .header .sub { color: #555; font-size: 15px; margin-bottom: 4px; }
        .header .badge { display: inline-block; background: #e6f7e6; color: #1a7f3a; padding: 4px 14px; border-radius: 20px; font-size: 13px; margin-right: 8px; }
        .header .badge-red { background: #ffe6e6; color: #b33; }
        .row { display: flex; gap: 24px; margin-top: 20px; flex-wrap: wrap; }
        .left { flex: 2; min-width: 260px; }
        .right { flex: 1; min-width: 180px; background: #f9fafb; padding: 18px 20px; border-radius: 14px; }
        textarea { width: 100%; height: 320px; padding: 16px; font-family: 'Courier New', monospace; font-size: 14px; border: 1.5px solid #d0d7de; border-radius: 12px; resize: vertical; transition: 0.2s; background: #fafbfc; }
        textarea:focus { border-color: #2563eb; outline: none; background: white; box-shadow: 0 0 0 4px rgba(37,99,235,0.1); }
        .opt-group { display: flex; flex-direction: column; gap: 12px; margin: 10px 0 18px; }
        .opt-group label { display: flex; align-items: center; gap: 8px; font-size: 14px; cursor: pointer; }
        .btn-primary { background: #2563eb; color: white; border: none; padding: 14px 0; width: 100%; border-radius: 40px; font-size: 16px; font-weight: 600; cursor: pointer; transition: 0.2s; box-shadow: 0 4px 12px rgba(37,99,235,0.25); }
        .btn-primary:hover { background: #1d4ed8; transform: translateY(-1px); }
        .btn-primary:active { transform: scale(0.97); }
        .footer-tip { margin-top: 16px; font-size: 13px; color: #6b7280; background: #f3f4f6; padding: 10px 16px; border-radius: 10px; }
        .output-box { margin-top: 20px; background: #1e1e2e; color: #cdd6f4; padding: 16px; border-radius: 12px; font-family: 'Courier New', monospace; font-size: 13px; white-space: pre-wrap; word-break: break-all; max-height: 280px; overflow: auto; display: none; }
        .output-box.show { display: block; }
        .error-msg { color: #dc2626; background: #fee2e2; padding: 10px 16px; border-radius: 10px; margin-top: 12px; display: none; font-size: 14px; }
        .error-msg.show { display: block; }
        @media (max-width: 640px) { .container { padding: 16px; } .header h1 { font-size: 22px; } .row { flex-direction: column; } textarea { height: 200px; } }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>📋 粘贴即美化 · 错误自动标红</h1>
        <div class="sub">
            <span class="badge">✅ 纯本地计算</span>
            <span class="badge-red">❌ 不上传服务器</span>
        </div>
    </div>
    <div class="row">
        <div class="left">
            <textarea id="inputArea" placeholder="在此粘贴你的 JSON 数据..."></textarea>
            <div id="errorBox" class="error-msg"></div>
            <div id="outputArea" class="output-box"></div>
        </div>
        <div class="right">
            <div class="opt-group">
                <label><input type="checkbox" id="indentCheck" checked /> 自动缩进 (2空格)</label>
                <label><input type="checkbox" id="sortCheck" /> 排序 Key</label>
            </div>
            <button class="btn-primary" id="formatBtn">✨ 一键美化并复制</button>
            <div style="margin-top:14px; font-size:13px; color:#6b7280; text-align:center;">
                <span id="charCount">0</span> 字符 · 支持 5MB
            </div>
        </div>
    </div>
    <div class="footer-tip">🛡️ 隐私承诺：数据仅在浏览器内存中处理，绝不存储或传输到任何服务器。</div>
</div>
<script>
(function() {
    const input = document.getElementById('inputArea');
    const output = document.getElementById('outputArea');
    const errorBox = document.getElementById('errorBox');
    const formatBtn = document.getElementById('formatBtn');
    const indentCheck = document.getElementById('indentCheck');
    const sortCheck = document.getElementById('sortCheck');
    const charCount = document.getElementById('charCount');
    input.addEventListener('input', function() { charCount.textContent = this.value.length; });
    function sortKeys(obj) {
        if (Array.isArray(obj)) return obj.map(function(item) { return sortKeys(item); });
        else if (obj !== null && typeof obj === 'object') { var sorted = {}; Object.keys(obj).sort().forEach(function(key) { sorted[key] = sortKeys(obj[key]); }); return sorted; }
        return obj;
    }
    function formatJSON() {
        var raw = input.value.trim();
        if (!raw) { errorBox.textContent = '⚠️ 请输入或粘贴 JSON 数据'; errorBox.classList.add('show'); output.classList.remove('show'); return; }
        try {
            var parsed = JSON.parse(raw);
            if (sortCheck.checked) parsed = sortKeys(parsed);
            var pretty = JSON.stringify(parsed, null, indentCheck.checked ? 2 : 0);
            output.textContent = pretty; output.classList.add('show'); errorBox.classList.remove('show');
            if (navigator.clipboard) {
                navigator.clipboard.writeText(pretty).then(function() {
                    formatBtn.textContent = '✅ 已复制！';
                    setTimeout(function() { formatBtn.textContent = '✨ 一键美化并复制'; }, 1800);
                }).catch(function() {
                    formatBtn.textContent = '📋 复制失败，请手动选中';
                    setTimeout(function() { formatBtn.textContent = '✨ 一键美化并复制'; }, 2500);
                });
            }
        } catch (e) {
            errorBox.textContent = '❌ ' + e.message; errorBox.classList.add('show'); output.classList.remove('show');
        }
    }
    formatBtn.addEventListener('click', formatJSON);
    input.addEventListener('keydown', function(e) { if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); formatJSON(); } });
    charCount.textContent = '0';
})();
</script>
</body>
</html>
