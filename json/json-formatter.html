    const charCount = document.getElementById('charCount');
    input.addEventListener('input', function() { charCount.textContent = this.value.length; });
    function sortKeys(obj) {
        if (Array.isArray(obj)) return obj.map(function(item) { return sortKeys(item); });
        else if (obj !== null && typeof obj === 'object') { var sorted = {}; Object.keys(obj).sort().forEach(function(key) { sorted[key] = sortKeys(obj[key]); }); return sorted; }
        return obj;
    }
    function formatJSON() {
        var raw = input.value.trim();
        if (!raw) { errorBox.textContent = '请粘贴 JSON 数据'; errorBox.classList.add('show'); output.classList.remove('show'); return; }
        try {
            var parsed = JSON.parse(raw);
            if (sortCheck.checked) parsed = sortKeys(parsed);
            var pretty = JSON.stringify(parsed, null, indentCheck.checked ? 2 : 0);
            output.textContent = pretty; output.classList.add('show'); errorBox.classList.remove('show');
            if (navigator.clipboard) {
                navigator.clipboard.writeText(pretty).then(function() {
                    formatBtn.textContent = '✅ 已复制！';
                    setTimeout(function() { formatBtn.textContent = '✨ 一键美化并复制'; }, 1800);
                }).catch(function() {
                    formatBtn.textContent = '复制失败，请手动选中';
                    setTimeout(function() { formatBtn.textContent = '✨ 一键美化并复制'; }, 2500);
                });
            }
        } catch (e) {
            errorBox.textContent = '❌ ' + e.message; errorBox.classList.add('show'); output.classList.remove('show');
        }
    }
    formatBtn.addEventListener('click', formatJSON);
    input.addEventListener('keydown', function(e) { if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); formatJSON(); } });
    charCount.textContent = '0';
})();
</script>

}

// 暗黑模式切换
(function() {
  var savedTheme = localStorage.getItem('zentools_theme');
  if (savedTheme === 'dark') document.documentElement.classList.add('dark');
  var btn = document.getElementById('themeToggle');
  if (btn) {
    btn.textContent = document.documentElement.classList.contains('dark') ? '☀️' : '🌙';
    btn.addEventListener('click', function() {
      document.documentElement.classList.toggle('dark');
      var isDark = document.documentElement.classList.contains('dark');
      this.textContent = isDark ? '☀️' : '🌙';
      localStorage.setItem('zentools_theme', isDark ? 'dark' : 'light');
    });
  }
})();

// 移动端侧滑
(function() {
  var overlay = document.getElementById('mobileOverlay');
  var hamBtn = document.getElementById('hamburgerBtn');
  var closeBtn = document.getElementById('mobileClose');
  if (!hamBtn || !overlay) return;
  function closeMenu() { overlay.classList.remove('open'); hamBtn.textContent = '☰'; document.body.style.overflow = ''; }
  hamBtn.addEventListener('click', function(e) {
    e.stopPropagation();
    if (overlay.classList.contains('open')) { closeMenu(); } else {
      overlay.classList.add('open'); hamBtn.textContent = '✕'; document.body.style.overflow = 'hidden';
    }
  });
  if (closeBtn) closeBtn.addEventListener('click', closeMenu);
  overlay.addEventListener('click', function(e) {
    var drawer = document.getElementById('mobileDrawer');
    if (drawer && !drawer.contains(e.target)) closeMenu();
  });
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape' && overlay.classList.contains('open')) closeMenu();
  });
})();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', function() {
    navigator.serviceWorker.register('/sw.js').catch(function() {});
  });
}
</script>
