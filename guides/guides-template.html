<script>
(function(){var t=localStorage.getItem('zentools_theme');if(t==='dark')document.documentElement.classList.add('dark');
var b=document.getElementById('themeToggle');if(b){b.textContent=document.documentElement.classList.contains('dark')?'☀️':'🌙';
b.addEventListener('click',function(){document.documentElement.classList.toggle('dark');
var d=document.documentElement.classList.contains('dark');this.textContent=d?'☀️':'🌙';
localStorage.setItem('zentools_theme',d?'dark':'light');});}})();
(function(){var o=document.getElementById('mobileOverlay'),h=document.getElementById('hamburgerBtn'),c=document.getElementById('mobileClose');
function cl(){o.classList.remove('open');h.textContent='☰';document.body.style.overflow='';}
if(!h||!o)return;h.addEventListener('click',function(e){e.stopPropagation();
if(o.classList.contains('open'))cl();else{o.classList.add('open');h.textContent='✕';document.body.style.overflow='hidden';}});
if(c)c.addEventListener('click',cl);o.addEventListener('click',function(e){var d=document.getElementById('mobileDrawer');if(d&&!d.contains(e.target))cl();});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&o.classList.contains('open'))cl();});})();
if('serviceWorker'in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('/sw.js').catch(function(){});});}
</script>
