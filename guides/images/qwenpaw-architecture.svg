<!-- QwenPaw Deployment Architecture -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 850">
  <!-- Background -->
  <rect width="1200" height="850" fill="#f8fafc"/>
  
  <!-- Title -->
  <text x="600" y="40" text-anchor="middle" font-size="24" font-weight="bold" fill="#1e293b">QwenPaw Personal AI Assistant Architecture</text>
  
  <!-- Main Container -->
  <rect x="50" y="70" width="1100" height="740" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="70" y="95" font-size="16" font-weight="bold" fill="#64748b">Complete Local AI Development Environment</text>
  
  <!-- User Layer -->
  <g id="user-layer">
    <rect x="150" y="130" width="200" height="80" rx="8" fill="#8b5cf6" opacity="0.9"/>
    <text x="250" y="160" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">Developer (Me!)</text>
    <text x="250" y="180" text-anchor="middle" font-size="12" fill="#ede9fe">Writing Code · Debugging</text>
  </g>
  
  <!-- IDE Layer -->
  <g id="ide-layer">
    <rect x="450" y="130" width="200" height="80" rx="8" fill="#a855f7" opacity="0.9"/>
    <text x="550" y="160" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">VS Code / JetBrains</text>
    <text x="550" y="180" text-anchor="middle" font-size="12" fill="#ede9fe">My Coding Environment</text>
  </g>
  
  <!-- QwenPaw Extension -->
  <g id="extension">
    <rect x="750" y="130" width="200" height="80" rx="8" fill="#c084fc" opacity="0.9"/>
    <text x="850" y="160" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">QwenPaw Plugin</text>
    <text x="850" y="180" text-anchor="middle" font-size="12" fill="#ede9fe">IDE Integration</text>
  </g>
  
  <!-- Core Engine -->
  <rect x="150" y="250" width="600" height="450" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
  <text x="170" y="275" font-size="14" font-weight="bold" fill="#475569">QwenPaw Core Engine (Local Processing)</text>
  
  <!-- Model Loader -->
  <g id="model-loader">
    <rect x="170" y="310" width="170" height="70" rx="8" fill="#6366f1" opacity="0.8"/>
    <text x="255" y="340" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">Model Loader</text>
    <text x="255" y="360" text-anchor="middle" font-size="11" fill="#e0e7ff">Qwen-7B/14B/30B</text>
  </g>
  
  <!-- Inference Engine -->
  <g id="inference">
    <ellipse cx="450" y="345" rx="80" ry="50" fill="#ec4899" opacity="0.8"/>
    <text x="450" y="350" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">Inference Engine</text>
    <text x="450" y="373" text-anchor="middle" font-size="10" fill="#fce7f3">CUDA/Metal/CPU</text>
  </g>
  
  <!-- Context Manager -->
  <g id="context">
    <rect x="630" y="310" width="170" height="70" rx="8" fill="#f59e0b" opacity="0.8"/>
    <text x="715" y="340" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">Context Manager</text>
    <text x="715" y="360" text-anchor="middle" font-size="11" fill="#fef3c7">Project Awareness</text>
  </g>
  
  <!-- Completion Service -->
  <g id="completion">
    <rect x="170" y="400" width="170" height="70" rx="8" fill="#14b8a6" opacity="0.8"/>
    <text x="255" y="430" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">Completion Service</text>
    <text x="255" y="450" text-anchor="middle" font-size="11" fill="#ccfbf1">Real-time Suggestions</text>
  </g>
  
  <!-- Explanation Service -->
  <g id="explanation">
    <rect x="360" y="400" width="170" height="70" rx="8" fill="#10b981" opacity="0.8"/>
    <text x="445" y="430" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">Explanation Service</text>
    <text x="445" y="450" text-anchor="middle" font-size="11" fill="#ccfbf1">Natural Language</text>
  </g>
  
  <!-- Test Generator -->
  <g id="test-gen">
    <rect x="550" y="400" width="170" height="70" rx="8" fill="#ef4444" opacity="0.8"/>
    <text x="635" y="430" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">Test Generator</text>
    <text x="635" y="450" text-anchor="middle" font-size="11" fill="#fee2e2">Unit Tests</text>
  </g>
  
  <!-- Debug Assistant -->
  <g id="debug">
    <rect x="170" y="500" width="170" height="70" rx="8" fill="#f97316" opacity="0.8"/>
    <text x="255" y="530" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">Debug Assistant</text>
    <text x="255" y="550" text-anchor="middle" font-size="11" fill="#fed7aa">Error Analysis</text>
  </g>
  
  <!-- Refactor Suggester -->
  <g id="refactor">
    <rect x="360" y="500" width="170" height="70" rx="8" fill="#8b5cf6" opacity="0.8"/>
    <text x="445" y="530" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">Refactor Suggester</text>
    <text x="445" y="550" text-anchor="middle" font-size="11" fill="#ede9fe">Best Practices</text>
  </g>
  
  <!-- Security Scanner -->
  <g id="security">
    <rect x="550" y="500" width="170" height="70" rx="8" fill="#6366f1" opacity="0.8"/>
    <text x="635" y="530" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">Security Scanner</text>
    <text x="635" y="550" text-anchor="middle" font-size="11" fill="#e0e7ff">Vulnerability Check</text>
  </g>
  
  <!-- Storage Layer -->
  <g id="storage">
    <ellipse cx="450" y="620" rx="100" ry="50" fill="#64748b" opacity="0.7"/>
    <text x="450" y="625" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">Local Storage</text>
    <text x="450" y="648" text-anchor="middle" font-size="11" fill="#e2e8f0">Models · Cache · Settings</text>
  </g>
  
  <!-- Data Flow Arrows -->
  <!-- User to IDE -->
  <line x1="250" y1="210" x2="450" y2="210" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- IDE to Extension -->
  <line x1="650" y1="210" x2="750" y2="210" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- Extension to Core -->
  <line x1="850" y1="210" x2="450" y2="250" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- Model Loader to Inference -->
  <line x1="340" y1="380" x2="450" y2="310" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- Inference to Services -->
  <line x1="450" y1="395" x2="255" y2="400" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="450" y1="395" x2="445" y2="400" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="450" y1="395" x2="635" y2="400" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- All Services to Storage -->
  <line x1="255" y1="570" x2="450" y2="620" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="445" y1="570" x2="450" y2="620" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="635" y1="570" x2="450" y2="620" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- Response Flow -->
  <line x1="450" y1="620" x2="450" y2="250" stroke="#10b981" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrow-green)"/>
  
  <!-- Arrow Marker -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L10,3 L0,6 L2,3 Z" fill="#64748b"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L10,3 L0,6 L2,3 Z" fill="#10b981"/>
    </marker>
  </defs>
  
  <!-- Key Features Badge -->
  <g id="features" transform="translate(50, 740)">
    <rect x="0" y="0" width="300" height="100" rx="8" fill="#fdf4ff" stroke="#d946ef" stroke-width="2"/>
    <text x="150" y="25" text-anchor="middle" font-size="14" font-weight="bold" fill="#be185d">Key Features</text>
    
    <rect x="20" y="35" width="130" height="35" rx="4" fill="#ffffff" stroke="#d946ef" stroke-width="1"/>
    <text x="85" y="52" text-anchor="middle" font-size="11" font-weight="bold" fill="#be185d">🆓 Free Forever</text>
    <text x="85" y="67" text-anchor="middle" font-size="9" fill="#64748b">No token limits</text>
    
    <rect x="160" y="35" width="130" height="35" rx="4" fill="#ffffff" stroke="#d946ef" stroke-width="1"/>
    <text x="225" y="52" text-anchor="middle" font-size="11" font-weight="bold" fill="#be185d">🔒 Privacy First</text>
    <text x="225" y="67" text-anchor="middle" font-size="9" fill="#64748b">100% local</text>
    
    <rect x="20" y="80" width="130" height="35" rx="4" fill="#ffffff" stroke="#d946ef" stroke-width="1"/>
    <text x="85" y="97" text-anchor="middle" font-size="11" font-weight="bold" fill="#be185d">⚡ Fast Response</text>
    
    <rect x="160" y="80" width="130" height="35" rx="4" fill="#ffffff" stroke="#d946ef" stroke-width="1"/>
    <text x="225" y="97" text-anchor="middle" font-size="11" font-weight="bold" fill="#be185d">💻 Multi-Language</text>
  </g>
  
  <!-- My Story Box -->
  <g id="story" transform="translate(400, 740)">
    <rect x="0" y="0" width="450" height="100" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <text x="225" y="25" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d4ed8">My Journey with QwenPaw</text>
    
    <rect x="20" y="35" width="190" height="35" rx="4" fill="#ffffff" stroke="#3b82f6" stroke-width="1"/>
    <text x="115" y="52" text-anchor="middle" font-size="10" font-weight="bold" fill="#1d4ed8">Year 1: Skeptical</text>
    
    <rect x="220" y="35" width="190" height="35" rx="4" fill="#ffffff" stroke="#3b82f6" stroke-width="1"/>
    <text x="315" y="52" text-anchor="middle" font-size="10" font-weight="bold" fill="#1d4ed8">Year 2: Tried It</text>
    
    <rect x="20" y="80" width="190" height="35" rx="4" fill="#ffffff" stroke="#3b82f6" stroke-width="1"/>
    <text x="115" y="97" text-anchor="middle" font-size="10" font-weight="bold" fill="#1d4ed8">Year 3: Love It!</text>
    
    <rect x="220" y="80" width="190" height="35" rx="4" fill="#ffffff" stroke="#3b82f6" stroke-width="1"/>
    <text x="315" y="97" text-anchor="middle" font-size="10" font-weight="bold" fill="#1d4ed8">Today: Recommend</text>
  </g>
</svg>
