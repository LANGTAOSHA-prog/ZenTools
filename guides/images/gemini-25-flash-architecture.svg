<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4285f4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#34a853;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#fbbc04;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ea4335;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- 背景 -->
  <rect width="800" height="600" fill="#f8f9fa"/>
  
  <!-- 标题 -->
  <text x="400" y="40" text-anchor="middle" font-size="24" font-weight="bold" fill="#333">
    Gemini 2.5 Flash 免费使用架构流程
  </text>
  
  <!-- 用户层 -->
  <g transform="translate(300, 80)">
    <rect x="0" y="0" width="200" height="60" rx="10" fill="url(#grad1)" filter="url(#shadow)"/>
    <text x="100" y="35" text-anchor="middle" fill="white" font-size="16" font-weight="bold">👤 开发者/用户</text>
  </g>
  
  <!-- API Studio 层 -->
  <g transform="translate(200, 180)">
    <rect x="0" y="0" width="400" height="80" rx="10" fill="white" stroke="#4285f4" stroke-width="2" filter="url(#shadow)"/>
    <text x="200" y="30" text-anchor="middle" fill="#4285f4" font-size="18" font-weight="bold">🌐 Google AI Studio</text>
    <text x="200" y="55" text-anchor="middle" fill="#666" font-size="12">免费 API Key 获取平台</text>
  </g>
  
  <!-- API 调用层 -->
  <g transform="translate(250, 290)">
    <rect x="0" y="0" width="300" height="80" rx="10" fill="white" stroke="#34a853" stroke-width="2" filter="url(#shadow)"/>
    <text x="150" y="35" text-anchor="middle" fill="#34a853" font-size="16" font-weight="bold">🔑 API 调用</text>
    <text x="150" y="55" text-anchor="middle" fill="#666" font-size="11">gemini-2.5-flash 模型</text>
  </g>
  
  <!-- 处理层 -->
  <g transform="translate(275, 400)">
    <rect x="0" y="0" width="250" height="80" rx="10" fill="url(#grad2)" filter="url(#shadow)"/>
    <text x="125" y="35" text-anchor="middle" fill="white" font-size="16" font-weight="bold">⚡ 模型推理引擎</text>
    <text x="125" y="55" text-anchor="middle" fill="white" font-size="11">Google TPU/GPU集群</text>
  </g>
  
  <!-- 结果输出层 -->
  <g transform="translate(300, 510)">
    <rect x="0" y="0" width="200" height="60" rx="10" fill="#e8f5e9" stroke="#4caf50" stroke-width="2"/>
    <text x="100" y="35" text-anchor="middle" fill="#2e7d32" font-size="14" font-weight="bold">✅ 响应结果</text>
  </g>
  
  <!-- 连接线 -->
  <line x1="400" y1="140" x2="400" y2="180" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="400" y1="260" x2="400" y2="290" stroke="#666" stroke-width="2"/>
  <line x1="400" y1="370" x2="400" y2="400" stroke="#666" stroke-width="2"/>
  <line x1="400" y1="480" x2="400" y2="510" stroke="#666" stroke-width="2"/>
  
  <!-- 标注框 -->
  <g transform="translate(50, 180)">
    <rect x="0" y="0" width="140" height="320" fill="none" stroke="#999" stroke-dasharray="5,5" rx="5"/>
    <text x="70" y="-10" text-anchor="middle" fill="#666" font-size="12">免费额度层 (60 次/天)</text>
  </g>
  
  <!-- 图例 -->
  <g transform="translate(50, 520)">
    <rect x="0" y="0" width="180" height="60" fill="white" stroke="#ccc" rx="5"/>
    <text x="90" y="18" text-anchor="middle" fill="#333" font-size="11" font-weight="bold">图例</text>
    <circle cx="30" cy="35" r="5" fill="#4285f4"/>
    <text x="45" y="39" font-size="10">官方平台</text>
    <circle cx="90" cy="35" r="5" fill="#34a853"/>
    <text x="105" y="39" font-size="10">API 接口</text>
    <circle cx="150" cy="35" r="5" fill="#ea4335"/>
    <text x="165" y="39" font-size="10">核心引擎</text>
  </g>
</svg>
