<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f093fb;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#f5576c;stop-opacity:1"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="#f8f9fa"/>

  <text x="400" y="40" text-anchor="middle" font-size="24" font-weight="bold" fill="#333">
    Nex-N2-Pro 架构与使用流程
  </text>

  <g transform="translate(300, 75)">
    <rect x="0" y="0" width="200" height="50" rx="10" fill="url(#grad1)" filter="url(#shadow)"/>
    <text x="100" y="30" text-anchor="middle" fill="white" font-size="15" font-weight="bold">👤 开发者/用户</text>
  </g>

  <g transform="translate(200, 155)">
    <rect x="0" y="0" width="400" height="65" rx="10" fill="white" stroke="#667eea" stroke-width="2" filter="url(#shadow)"/>
    <text x="200" y="25" text-anchor="middle" fill="#667eea" font-size="16" font-weight="bold">🔌 SiliconFlow API / OpenClaw 平台</text>
    <text x="200" y="48" text-anchor="middle" fill="#666" font-size="11">标准 OpenAI 兼容接口 · 即开即用 · 送 2000 万 token</text>
  </g>

  <g transform="translate(225, 250)">
    <rect x="0" y="0" width="350" height="70" rx="10" fill="white" stroke="#f093fb" stroke-width="2" filter="url(#shadow)"/>
    <text x="175" y="25" text-anchor="middle" fill="#f093fb" font-size="15" font-weight="bold">⚡ Nex-N2-Pro 核心模型</text>
    <text x="175" y="45" text-anchor="middle" fill="#666" font-size="11">基于 Qwen3.5-397B-A17B MoE 架构</text>
    <text x="175" y="60" text-anchor="middle" fill="#666" font-size="10">397B 总参数 / 17B 激活参数</text>
  </g>

  <g transform="translate(100, 355)">
    <rect x="0" y="0" width="200" height="80" rx="10" fill="#e8f5e9" stroke="#4caf50" stroke-width="1.5"/>
    <text x="100" y="28" text-anchor="middle" fill="#2e7d32" font-size="13" font-weight="bold">🖥️ 编程能力</text>
    <text x="100" y="48" text-anchor="middle" fill="#555" font-size="11">SWE-Bench 80.8%</text>
    <text x="100" y="63" text-anchor="middle" fill="#555" font-size="11">HumanEval 91.2%</text>
  </g>

  <g transform="translate(350, 355)">
    <rect x="0" y="0" width="200" height="80" rx="10" fill="#fff3e0" stroke="#ff9800" stroke-width="1.5"/>
    <text x="100" y="28" text-anchor="middle" fill="#e65100" font-size="13" font-weight="bold">🤖 Agent 能力</text>
    <text x="100" y="48" text-anchor="middle" fill="#555" font-size="11">状态追踪 · 自我纠错</text>
    <text x="100" y="63" text-anchor="middle" fill="#555" font-size="11">任务完成率 85%</text>
  </g>

  <g transform="translate(225, 465)">
    <rect x="0" y="0" width="350" height="65" rx="10" fill="url(#grad2)" filter="url(#shadow)"/>
    <text x="175" y="25" text-anchor="middle" fill="white" font-size="14" font-weight="bold">🎯 Adaptive Thinking 机制</text>
    <text x="175" y="48" text-anchor="middle" fill="white" font-size="11">自动判断任务难度 · 动态调控推理强度 · 节省 20% token</text>
  </g>

  <g transform="translate(300, 555)">
    <rect x="0" y="0" width="200" height="40" rx="10" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
    <text x="100" y="25" text-anchor="middle" fill="#155724" font-size="13" font-weight="bold">✅ 应用场景落地</text>
  </g>

  <line x1="400" y1="125" x2="400" y2="155" stroke="#666" stroke-width="2"/>
  <line x1="400" y1="220" x2="400" y2="250" stroke="#666" stroke-width="2"/>
  <line x1="200" y1="320" x2="180" y2="355" stroke="#666" stroke-width="2"/>
  <line x1="400" y1="320" x2="450" y2="355" stroke="#666" stroke-width="2"/>
  <line x1="200" y1="435" x2="400" y2="465" stroke="#666" stroke-width="2"/>
  <line x1="450" y1="435" x2="400" y2="465" stroke="#666" stroke-width="2"/>
  <line x1="400" y1="530" x2="400" y2="555" stroke="#666" stroke-width="2"/>

  <g transform="translate(50, 520)">
    <rect x="0" y="0" width="180" height="60" fill="white" stroke="#ccc" rx="5"/>
    <text x="90" y="18" text-anchor="middle" fill="#333" font-size="11" font-weight="bold">图例</text>
    <circle cx="30" cy="35" r="5" fill="#667eea"/>
    <text x="45" y="39" font-size="10">API 层</text>
    <circle cx="90" cy="35" r="5" fill="#f093fb"/>
    <text x="105" y="39" font-size="10">模型核心</text>
    <circle cx="150" cy="35" r="5" fill="#4caf50"/>
    <text x="165" y="39" font-size="10">能力层</text>
  </g>
</svg>