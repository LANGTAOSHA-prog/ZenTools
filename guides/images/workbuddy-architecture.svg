<!-- Workbuddy Architecture Diagram -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900">
  <!-- Background -->
  <rect width="1200" height="900" fill="#f8fafc"/>
  
  <!-- Title -->
  <text x="600" y="40" text-anchor="middle" font-size="24" font-weight="bold" fill="#1e293b">Workbuddy AI Coding Assistant Architecture</text>
  
  <!-- Main Container -->
  <rect x="50" y="70" width="1100" height="800" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="70" y="95" font-size="16" font-weight="bold" fill="#64748b">Complete AI Programming Platform</text>
  
  <!-- IDE Layer -->
  <g id="ide-layer">
    <rect x="150" y="130" width="200" height="80" rx="8" fill="#0ea5e9" opacity="0.9"/>
    <text x="250" y="160" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">VS Code / JetBrains</text>
    <text x="250" y="180" text-anchor="middle" font-size="12" fill="#e0f2fe">Vim · Emacs · Others</text>
  </g>
  
  <!-- CLI Tool -->
  <g id="cli-layer">
    <rect x="450" y="130" width="200" height="80" rx="8" fill="#06b6d4" opacity="0.9"/>
    <text x="550" y="160" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">CLI Tool</text>
    <text x="550" y="180" text-anchor="middle" font-size="12" fill="#ccfbf1">pip install workbuddy-cli</text>
  </g>
  
  <!-- API Gateway -->
  <g id="api-gateway">
    <rect x="750" y="130" width="200" height="80" rx="8" fill="#14b8a6" opacity="0.9"/>
    <text x="850" y="160" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">Local API Server</text>
    <text x="850" y="180" text-anchor="middle" font-size="12" fill="#ccfbf1">Port 3000 · RESTful</text>
  </g>
  
  <!-- Core Engine -->
  <rect x="150" y="250" width="600" height="550" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
  <text x="170" y="275" font-size="14" font-weight="bold" fill="#475569">Workbuddy Core Engine (Local Processing)</text>
  
  <!-- Language Parser -->
  <g id="parser">
    <rect x="170" y="310" width="170" height="70" rx="8" fill="#6366f1" opacity="0.8"/>
    <text x="255" y="340" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">Language Parser</text>
    <text x="255" y="360" text-anchor="middle" font-size="11" fill="#e0e7ff">AST · Syntax Tree</text>
  </g>
  
  <!-- Context Analyzer -->
  <g id="context">
    <rect x="360" y="310" width="170" height="70" rx="8" fill="#8b5cf6" opacity="0.8"/>
    <text x="445" y="340" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">Context Analyzer</text>
    <text x="445" y="360" text-anchor="middle" font-size="11" fill="#ede9fe">Project Structure</text>
  </g>
  
  <!-- Model Inference -->
  <g id="inference">
    <ellipse cx="450" y="410" rx="80" ry="50" fill="#ec4899" opacity="0.8"/>
    <text x="450" y="415" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">Code Generation Model</text>
    <text x="450" y="438" text-anchor="middle" font-size="10" fill="#fce7f3">7B/13B Parameter</text>
  </g>
  
  <!-- Completion Engine -->
  <g id="completion">
    <rect x="170" y="480" width="170" height="70" rx="8" fill="#f59e0b" opacity="0.8"/>
    <text x="255" y="510" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">Completion Engine</text>
    <text x="255" y="530" text-anchor="middle" font-size="11" fill="#fef3c7">Line · Function · Class</text>
  </g>
  
  <!-- Explanation Engine -->
  <g id="explanation">
    <rect x="360" y="480" width="170" height="70" rx="8" fill="#14b8a6" opacity="0.8"/>
    <text x="445" y="510" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">Explanation Engine</text>
    <text x="445" y="530" text-anchor="middle" font-size="11" fill="#ccfbf1">Natural Language</text>
  </g>
  
  <!-- Test Generator -->
  <g id="test-gen">
    <rect x="550" y="480" width="170" height="70" rx="8" fill="#10b981" opacity="0.8"/>
    <text x="635" y="510" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">Test Generator</text>
    <text x="635" y="530" text-anchor="middle" font-size="11" fill="#ccfbf1">Unit · Integration</text>
  </g>
  
  <!-- Debug Assistant -->
  <g id="debug">
    <rect x="170" y="580" width="170" height="70" rx="8" fill="#ef4444" opacity="0.8"/>
    <text x="255" y="610" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">Debug Assistant</text>
    <text x="255" y="630" text-anchor="middle" font-size="11" fill="#fee2e2">Error Analysis</text>
  </g>
  
  <!-- Refactor Suggester -->
  <g id="refactor">
    <rect x="360" y="580" width="170" height="70" rx="8" fill="#f97316" opacity="0.8"/>
    <text x="445" y="610" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">Refactor Suggester</text>
    <text x="445" y="630" text-anchor="middle" font-size="11" fill="#fed7aa">Best Practices</text>
  </g>
  
  <!-- Security Scanner -->
  <g id="security">
    <rect x="550" y="580" width="170" height="70" rx="8" fill="#6366f1" opacity="0.8"/>
    <text x="635" y="610" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">Security Scanner</text>
    <text x="635" y="630" text-anchor="middle" font-size="11" fill="#e0e7ff">Vulnerability Check</text>
  </g>
  
  <!-- Plugin System -->
  <g id="plugins">
    <rect x="170" y="680" width="170" height="70" rx="8" fill="#8b5cf6" opacity="0.8"/>
    <text x="255" y="710" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">Plugin System</text>
    <text x="255" y="730" text-anchor="middle" font-size="11" fill="#ede9fe">Extensions · Scripts</text>
  </g>
  
  <!-- Storage -->
  <g id="storage">
    <ellipse cx="450" y="780" rx="100" ry="50" fill="#64748b" opacity="0.7"/>
    <text x="450" y="785" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">Local Cache & Settings</text>
    <text x="450" y="808" text-anchor="middle" font-size="11" fill="#e2e8f0">Models · History · Config</text>
  </g>
  
  <!-- Data Flow Arrows -->
  <!-- IDE to Core -->
  <line x1="250" y1="210" x2="255" y2="310" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- CLI to Core -->
  <line x1="550" y1="210" x2="450" y2="310" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- API to Core -->
  <line x1="850" y1="210" x2="635" y2="310" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- Parser to Context -->
  <line x1="340" y1="380" x2="445" y2="310" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- Context to Model -->
  <line x1="445" y1="380" x2="450" y2="410" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- Model to Completion -->
  <line x1="450" y1="460" x2="255" y2="480" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- Model to Explanation -->
  <line x1="450" y1="460" x2="445" y2="480" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- Model to Test Gen -->
  <line x1="450" y1="460" x2="635" y2="480" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- Completion to IDE -->
  <line x1="255" y1="550" x2="250" y2="210" stroke="#10b981" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrow-green)"/>
  
  <!-- All to Storage -->
  <line x1="255" y1="750" x2="450" y2="780" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="445" y1="750" x2="450" y2="780" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="635" y1="750" x2="450" y2="780" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- Arrow Marker -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L10,3 L0,6 L2,3 Z" fill="#64748b"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L10,3 L0,6 L2,3 Z" fill="#10b981"/>
    </marker>
  </defs>
  
  <!-- Features Badge -->
  <g id="features" transform="translate(50, 740)">
    <rect x="0" y="0" width="300" height="140" rx="8" fill="#eff6ff" stroke="#0ea5e9" stroke-width="2"/>
    <text x="150" y="25" text-anchor="middle" font-size="14" font-weight="bold" fill="#0369a1">Key Features</text>
    
    <rect x="20" y="35" width="130" height="40" rx="4" fill="#ffffff" stroke="#0ea5e9" stroke-width="1"/>
    <text x="85" y="55" text-anchor="middle" font-size="11" font-weight="bold" fill="#0369a1">🆓 Free Unlimited</text>
    <text x="85" y="70" text-anchor="middle" font-size="9" fill="#64748b">No token limits</text>
    
    <rect x="160" y="35" width="130" height="40" rx="4" fill="#ffffff" stroke="#0ea5e9" stroke-width="1"/>
    <text x="225" y="55" text-anchor="middle" font-size="11" font-weight="bold" fill="#0369a1">⚡ Fast Response</text>
    <text x="225" y="70" text-anchor="middle" font-size="9" fill="#64748b">45ms latency</text>
    
    <rect x="20" y="90" width="130" height="40" rx="4" fill="#ffffff" stroke="#0ea5e9" stroke-width="1"/>
    <text x="85" y="110" text-anchor="middle" font-size="11" font-weight="bold" fill="#0369a1">💻 Multi-IDE</text>
    <text x="85" y="125" text-anchor="middle" font-size="9" fill="#64748b">VS Code · JetBrains</text>
    
    <rect x="160" y="90" width="130" height="40" rx="4" fill="#ffffff" stroke="#0ea5e9" stroke-width="1"/>
    <text x="225" y="110" text-anchor="middle" font-size="11" font-weight="bold" fill="#0369a1">🔒 Privacy First</text>
    <text x="225" y="125" text-anchor="middle" font-size="9" fill="#64748b">Local processing</text>
  </g>
  
  <!-- Supported Languages -->
  <g id="languages" transform="translate(400, 740)">
    <rect x="0" y="0" width="450" height="140" rx="8" fill="#f0fdf4" stroke="#10b981" stroke-width="2"/>
    <text x="225" y="25" text-anchor="middle" font-size="14" font-weight="bold" fill="#15803d">50+ Languages Supported</text>
    
    <rect x="20" y="35" width="100" height="35" rx="4" fill="#ffffff" stroke="#10b981" stroke-width="1"/>
    <text x="70" y="52" text-anchor="middle" font-size="10" font-weight="bold" fill="#15803d">Python</text>
    
    <rect x="130" y="35" width="100" height="35" rx="4" fill="#ffffff" stroke="#10b981" stroke-width="1"/>
    <text x="180" y="52" text-anchor="middle" font-size="10" font-weight="bold" fill="#15803d">JavaScript</text>
    
    <rect x="240" y="35" width="100" height="35" rx="4" fill="#ffffff" stroke="#10b981" stroke-width="1"/>
    <text x="290" y="52" text-anchor="middle" font-size="10" font-weight="bold" fill="#15803d">TypeScript</text>
    
    <rect x="350" y="35" width="100" height="35" rx="4" fill="#ffffff" stroke="#10b981" stroke-width="1"/>
    <text x="400" y="52" text-anchor="middle" font-size="10" font-weight="bold" fill="#15803d">Go</text>
    
    <rect x="20" y="85" width="100" height="35" rx="4" fill="#ffffff" stroke="#10b981" stroke-width="1"/>
    <text x="70" y="102" text-anchor="middle" font-size="10" font-weight="bold" fill="#15803d">Rust</text>
    
    <rect x="130" y="85" width="100" height="35" rx="4" fill="#ffffff" stroke="#10b981" stroke-width="1"/>
    <text x="180" y="102" text-anchor="middle" font-size="10" font-weight="bold" fill="#15803d">Java</text>
    
    <rect x="240" y="85" width="100" height="35" rx="4" fill="#ffffff" stroke="#10b981" stroke-width="1"/>
    <text x="290" y="102" text-anchor="middle" font-size="10" font-weight="bold" fill="#15803d">C++</text>
    
    <rect x="350" y="85" width="100" height="35" rx="4" fill="#ffffff" stroke="#10b981" stroke-width="1"/>
    <text x="400" y="102" text-anchor="middle" font-size="10" font-weight="bold" fill="#15803d">PHP</text>
  </g>
</svg>
