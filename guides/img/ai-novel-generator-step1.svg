<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="'Inter',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b18"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="680" height="400" fill="url(#bg)" rx="14"/>
  <text x="30" y="42" fill="#f0f4ff" font-size="20" font-weight="700">📖 AI 小说生成</text>
  <text x="30" y="66" fill="#6b7a9f" font-size="13">用AI创作故事，支持多种题材和风格。</text>
  <rect x="30" y="85" width="620" height="290" fill="rgba(14,22,41,0.8)" rx="14" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <!-- 工具界面 -->
  <rect x="50" y="100" width="250" height="260" fill="rgba(20,31,55,0.9)" rx="10" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <text x="70" y="125" fill="#f0f4ff" font-size="14" font-weight="600">输入区域</text>
  <rect x="70" y="140" width="210" height="120" fill="rgba(59,130,246,0.08)" rx="8" stroke="rgba(59,130,246,0.15)" stroke-width="1"/>
  <text x="90" y="170" fill="#94a3b8" font-size="12">在此输入内容...</text>
  <rect x="70" y="280" width="210" height="40" fill="url(#accent)" rx="8"/>
  <text x="175" y="305" fill="#fff" font-size="13" text-anchor="middle" font-weight="600">开始处理</text>
  <rect x="330" y="100" width="300" height="260" fill="rgba(20,31,55,0.9)" rx="10" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <text x="350" y="125" fill="#f0f4ff" font-size="14" font-weight="600">结果预览</text>
  <rect x="350" y="140" width="260" height="200" fill="rgba(34,197,94,0.08)" rx="8" stroke="rgba(34,197,94,0.15)" stroke-width="1"/>
  <text x="480" y="250" fill="#22c55e" font-size="12" text-anchor="middle">处理完成 ✓</text>
</svg>