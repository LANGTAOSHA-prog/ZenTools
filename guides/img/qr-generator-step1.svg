<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 440" font-family="'Inter',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b18"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="g3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <linearGradient id="g4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="g5" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="g6" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
  </defs>
  <rect width="680" height="440" fill="url(#bg)" rx="14"/>

  <text x="30" y="42" fill="#f0f4ff" font-size="20" font-weight="700">🔗 二维码生成器</text>
  <text x="30" y="66" fill="#6b7a9f" font-size="13">输入链接或文本，选择颜色主题，一键生成专属精美二维码。</text>

  <rect x="30" y="85" width="620" height="335" fill="rgba(14,22,41,0.8)" rx="14" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

  <text x="50" y="118" fill="#f0f4ff" font-size="15" font-weight="700">配置二维码</text>
  <text x="50" y="138" fill="#6b7a9f" font-size="12">输入链接、选择样式，右侧实时预览效果。</text>

  <!-- Input field -->
  <text x="50" y="168" fill="#94a3b8" font-size="12">🔗 链接 / 文本内容</text>
  <rect x="50" y="178" width="430" height="36" fill="#0a0e1a" rx="8" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="65" y="202" fill="#4a5a7a" font-size="13">https://zentools.xyz</text>

  <!-- Color swatches -->
  <text x="50" y="238" fill="#94a3b8" font-size="12">🌈 颜色主题</text>
  <circle cx="64" cy="266" r="16" fill="url(#g1)"/>
  <circle cx="104" cy="266" r="16" fill="url(#g2)"/>
  <circle cx="144" cy="266" r="16" fill="url(#g3)"/>
  <circle cx="184" cy="266" r="16" fill="url(#g4)"/>
  <circle cx="224" cy="266" r="16" fill="url(#g5)"/>
  <circle cx="264" cy="266" r="16" fill="url(#g6)"/>
  <rect x="48" y="250" width="36" height="36" fill="none" rx="999" stroke="#3b82f6" stroke-width="2.5"/>

  <!-- Rounded corner slider -->
  <text x="50" y="310" fill="#94a3b8" font-size="12">🔄 圆角大小</text>
  <rect x="50" y="320" width="300" height="6" fill="#1e293b" rx="999"/>
  <rect x="50" y="320" width="140" height="6" fill="url(#accent)" rx="999"/>
  <circle cx="190" cy="323" r="8" fill="#f0f4ff" stroke="url(#accent)" stroke-width="2"/>
  <text x="365" y="327" fill="#f0f4ff" font-size="13" font-weight="600">40%</text>

  <!-- Logo upload -->
  <text x="50" y="370" fill="#94a3b8" font-size="12">🖼️ 嵌入 Logo（可选）</text>
  <rect x="50" y="380" width="180" height="28" fill="rgba(20,31,55,0.9)" rx="8" stroke="rgba(255,255,255,0.06)" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="140" y="399" fill="#4a5a7a" font-size="11" text-anchor="middle">点击上传 Logo 图片</text>

  <!-- QR preview placeholder (right side) -->
  <rect x="500" y="115" width="138" height="138" fill="#0a0e1a" rx="10" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <rect x="520" y="135" width="98" height="98" fill="none" rx="4" stroke="#4a5a7a" stroke-width="1.5"/>
  <text x="569" y="180" fill="#4a5a7a" font-size="40" text-anchor="middle">▣</text>
  <text x="569" y="206" fill="#4a5a7a" font-size="10" text-anchor="middle">预览二维码</text>

  <rect x="510" y="265" width="118" height="28" fill="rgba(37,99,235,0.15)" rx="8"/>
  <text x="569" y="284" fill="#60a5fa" font-size="11" font-weight="600" text-anchor="middle">自动预览中</text>

  <!-- Generate button (disabled) -->
  <rect x="50" y="420" width="580" height="0" fill="none"/>
</svg>
