<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="'Inter',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b18"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="680" height="400" fill="url(#bg)" rx="14"/>

  <!-- Title -->
  <text x="30" y="42" fill="#f0f4ff" font-size="20" font-weight="700">⚡ PDF 扁平化</text>
  <text x="30" y="66" fill="#6b7a9f" font-size="13">合并图层与标注，将 PDF 展平为不可编辑的静态文档，保护内容完整性。</text>

  <!-- Tool box -->
  <rect x="30" y="85" width="620" height="290" fill="rgba(14,22,41,0.8)" rx="14" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

  <!-- Upload zone -->
  <rect x="50" y="100" width="580" height="100" rx="12" fill="rgba(20,31,55,0.85)" stroke="rgba(59,130,246,0.4)" stroke-width="2" stroke-dasharray="6,4"/>

  <text x="340" y="140" fill="#6b7a9f" font-size="32" text-anchor="middle">📄</text>
  <text x="340" y="170" fill="#8899bb" font-size="13" text-anchor="middle">点击上传或拖拽 PDF 文件到此处</text>
  <text x="340" y="188" fill="#4a5a7a" font-size="11" text-anchor="middle">支持 .pdf 格式 · 文件处理在浏览器本地完成</text>

  <!-- Options section -->
  <text x="50" y="225" fill="#f0f4ff" font-size="14" font-weight="600">扁平化选项</text>

  <!-- Checkbox 1: 合并图层 -->
  <rect x="50" y="240" width="18" height="18" rx="4" fill="rgba(59,130,246,0.25)" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="52" y="252" fill="#3b82f6" font-size="12">✓</text>
  <text x="78" y="254" fill="#f0f4ff" font-size="13">合并所有图层</text>
  <text x="200" y="254" fill="#6b7a9f" font-size="11">将透明图层和内容合并为一个整体</text>

  <!-- Checkbox 2: 展平标注 -->
  <rect x="50" y="268" width="18" height="18" rx="4" fill="rgba(59,130,246,0.25)" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="52" y="280" fill="#3b82f6" font-size="12">✓</text>
  <text x="78" y="282" fill="#f0f4ff" font-size="13">展平标注与批注</text>
  <text x="200" y="282" fill="#6b7a9f" font-size="11">将高亮、下划线、注释转化为静态内容</text>

  <!-- Checkbox 3: 移除表单 -->
  <rect x="50" y="296" width="18" height="18" rx="4" fill="rgba(30,41,59,0.5)" stroke="#4a5a7a" stroke-width="1.5"/>
  <text x="78" y="310" fill="#f0f4ff" font-size="13">移除表单字段</text>
  <text x="200" y="310" fill="#6b7a9f" font-size="11">清除可填写表单，保留填写后的内容</text>

  <!-- Execute button -->
  <rect x="140" y="330" width="400" height="38" fill="url(#accent)" rx="999"/>
  <text x="340" y="354" fill="#fff" font-size="14" font-weight="700" text-anchor="middle">⚡ 执行扁平化</text>
</svg>