<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="'Inter',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
<defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0f172a"/><stop offset="100%" stop-color="#070b18"/></linearGradient><linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#3b82f6"/><stop offset="100%" stop-color="#8b5cf6"/></linearGradient></defs>
<rect width="680" height="400" fill="url(#bg)" rx="14"/>
<text x="30" y="42" fill="#f0f4ff" font-size="20" font-weight="700">💴 金额大写转换</text>
<text x="30" y="66" fill="#6b7a9f" font-size="13">将数字金额转换为中文大写金额，适用于支票、合同等正式文书。</text>
<rect x="30" y="85" width="620" height="290" fill="rgba(14,22,41,0.8)" rx="14" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
<text x="50" y="120" fill="#f0f4ff" font-size="15" font-weight="700">输入金额</text>
<rect x="50" y="132" width="580" height="45" fill="#0a0e1a" rx="8" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
<text x="65" y="160" fill="#f0f4ff" font-size="18" font-weight="600">1234567.89</text>
<text x="50" y="202" fill="#f0f4ff" font-size="15" font-weight="700">大写金额</text>
<rect x="50" y="215" width="580" height="55" fill="#0f1a35" rx="10" stroke="rgba(0,229,255,0.15)" stroke-width="1"/>
<text x="340" y="245" fill="#00e5ff" font-size="18" font-weight="800" text-anchor="middle">壹佰贰拾叁万肆仟伍佰陆拾柒元捌角玖分</text>
<text x="340" y="265" fill="#6b7a9f" font-size="11" text-anchor="middle">支持人民币、支票格式，含元角分、整</text>
</svg>