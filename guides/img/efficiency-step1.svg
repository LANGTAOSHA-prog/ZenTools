<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="'Inter',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
<defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0f172a"/><stop offset="100%" stop-color="#070b18"/></linearGradient></defs>
<rect width="680" height="400" fill="url(#bg)" rx="14"/>
<text x="30" y="42" fill="#f0f4ff" font-size="20" font-weight="700">⚡ 效率计算器</text><text x="30" y="66" fill="#6b7a9f" font-size="13">计算工作效率、时间利用率和投入产出比。</text>
<rect x="30" y="85" width="620" height="290" fill="rgba(14,22,41,0.8)" rx="14" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
<text x="60" y="120" fill="#6b7a9f" font-size="13">计划工作时长(小时)</text>
<rect x="60" y="130" width="260" height="40" fill="rgba(255,255,255,0.06)" rx="8" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
<text x="74" y="155" fill="#00e5ff" font-size="16" font-weight="600">8</text>
<text x="60" y="200" fill="#6b7a9f" font-size="13">实际完成时长(小时)</text>
<rect x="60" y="210" width="260" height="40" fill="rgba(255,255,255,0.06)" rx="8" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
<text x="74" y="235" fill="#00e5ff" font-size="16" font-weight="600">6</text>
<rect x="340" y="115" width="290" height="55" fill="rgba(0,229,255,0.08)" rx="10" stroke="rgba(0,229,255,0.2)" stroke-width="1"/>
<text x="360" y="138" fill="#6b7a9f" font-size="13">效率评分</text>
<text x="360" y="160" fill="#00e5ff" font-size="22" font-weight="900">133%</text>
<rect x="340" y="185" width="290" height="55" fill="rgba(0,229,255,0.08)" rx="10" stroke="rgba(0,229,255,0.2)" stroke-width="1"/>
<text x="360" y="208" fill="#6b7a9f" font-size="13">投入产出比</text>
<text x="360" y="230" fill="#f0f4ff" font-size="22" font-weight="900">1.33</text>
<rect x="60" y="275" width="560" height="40" fill="url(#bg)" rx="8" stroke="rgba(0,229,255,0.3)" stroke-width="2"/>
<text x="340" y="300" fill="#00e5ff" font-size="14" font-weight="600" text-anchor="middle">⚡ 计算效率</text>
</svg>