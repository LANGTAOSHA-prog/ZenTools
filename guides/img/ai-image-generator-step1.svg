<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="'Inter',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b18"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="680" height="400" fill="url(#bg)" rx="14"/>
  <text x="30" y="42" fill="#f0f4ff" font-size="20" font-weight="700">🎨 AI 图片生成</text>
  <text x="30" y="66" fill="#6b7a9f" font-size="13">使用AI根据文字描述生成创意图片，支持多种风格和尺寸选择。</text>
  
  <!-- Main interface -->
  <rect x="30" y="85" width="620" height="290" fill="rgba(14,22,41,0.8)" rx="14" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  
  <!-- Prompt input area -->
  <rect x="50" y="100" width="580" height="80" fill="rgba(20,31,55,0.9)" rx="10" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <text x="70" y="125" fill="#f0f4ff" font-size="13" font-weight="600">输入图片描述</text>
  <text x="70" y="145" fill="#94a3b8" font-size="12">未来城市夜景，霓虹灯闪烁，高楼大厦，赛博朋克风格，8K画质</text>
  
  <!-- Style options -->
  <rect x="50" y="190" width="180" height="40" fill="rgba(59,130,246,0.08)" rx="8" stroke="rgba(59,130,246,0.15)" stroke-width="1"/>
  <text x="140" y="215" fill="#3b82f6" font-size="12" text-anchor="middle">🎨 写实风格</text>
  
  <rect x="240" y="190" width="180" height="40" fill="rgba(255,255,255,0.08)" rx="8" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
  <text x="330" y="215" fill="#f0f4ff" font-size="12" text-anchor="middle">✏️ 插画风格</text>
  
  <rect x="430" y="190" width="180" height="40" fill="rgba(255,255,255,0.08)" rx="8" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
  <text x="520" y="215" fill="#f0f4ff" font-size="12" text-anchor="middle">🎭 动漫风格</text>
  
  <!-- Generated image preview -->
  <rect x="50" y="240" width="250" height="130" fill="rgba(20,31,55,0.9)" rx="10" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <text x="175" y="305" fill="#4a5a7a" font-size="12" text-anchor="middle">生成图片预览</text>
  
  <!-- Size options -->
  <rect x="320" y="240" width="120" height="40" fill="rgba(255,255,255,0.08)" rx="8" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
  <text x="380" y="265" fill="#f0f4ff" font-size="12" text-anchor="middle">1:1 正方形</text>
  
  <rect x="450" y="240" width="120" height="40" fill="rgba(255,255,255,0.08)" rx="8" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
  <text x="510" y="265" fill="#f0f4ff" font-size="12" text-anchor="middle">16:9 横版</text>
  
  <!-- Generate button -->
  <rect x="320" y="290" width="250" height="45" fill="url(#accent)" rx="10"/>
  <text x="445" y="318" fill="#fff" font-size="14" text-anchor="middle" font-weight="700">生成图片</text>
  
  <!-- Quality indicator -->
  <text x="320" y="350" fill="#6b7a9f" font-size="11">画质：高（约30秒生成）</text>
</svg>