<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="'Inter',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b18"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="680" height="400" fill="url(#bg)" rx="14"/>

  <text x="30" y="42" fill="#f0f4ff" font-size="20" font-weight="700">文本对比</text>
  <text x="30" y="66" fill="#6b7a9f" font-size="13">并排对比两段文本内容，高亮显示新增和删除的行。</text>
  <rect x="30" y="85" width="620" height="295" fill="rgba(14,22,41,0.8)" rx="14" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="50" y="115" fill="#f0f4ff" font-size="14" font-weight="700">对比结果</text>
  <rect x="50" y="128" width="600" height="195" rx="10" fill="#0a0e1a" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="65" y="152" fill="#8899bb" font-size="12" font-family="Consolas,monospace">  Hello World</text>
  <text x="65" y="174" fill="#f87171" font-size="12" font-family="Consolas,monospace">- This is a test file.</text>
  <text x="65" y="196" fill="#f87171" font-size="12" font-family="Consolas,monospace">- Line three content.</text>
  <text x="65" y="218" fill="#34d399" font-size="12" font-family="Consolas,monospace">+ This is a modified file.</text>
  <text x="65" y="240" fill="#34d399" font-size="12" font-family="Consolas,monospace">+ New line added here.</text>
  <text x="65" y="262" fill="#8899bb" font-size="12" font-family="Consolas,monospace">  Line four unchanged.</text>
  <rect x="50" y="335" width="600" height="32" fill="rgba(16,185,129,0.1)" rx="8" stroke="rgba(16,185,129,0.3)" stroke-width="1"/>
  <text x="350" y="356" fill="#34d399" font-size="13" text-anchor="middle">差异如下：</text>

</svg>