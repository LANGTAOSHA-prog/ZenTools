      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b18"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
  </defs>
  <rect width="680" height="400" fill="url(#bg)" rx="14"/>
  <text x="30" y="42" fill="#f0f4ff" font-size="20" font-weight="700">🎯 图片去背景 - 结果</text>
  <text x="30" y="66" fill="#6b7a9f" font-size="13">去背景完成，可预览效果并下载透明 PNG 图片。</text>
  <rect x="30" y="85" width="620" height="290" fill="rgba(14,22,41,0.8)" rx="14" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="50" y="118" fill="#f0f4ff" font-size="15" font-weight="700">去背景结果</text>
  <rect x="50" y="132" width="270" height="170" rx="10" fill="rgba(20,31,55,0.85)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="185" y="155" fill="#6b7a9f" font-size="12" text-anchor="middle">🖼️ 原始图片</text>
  <rect x="70" y="165" width="230" height="120" rx="6" fill="#0f172a" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <circle cx="185" cy="215" r="30" fill="rgba(59,130,246,0.3)"/>
  <circle cx="185" cy="215" r="15" fill="rgba(59,130,246,0.6)"/>
  <rect x="170" y="245" width="30" height="25" rx="3" fill="rgba(59,130,246,0.3)"/>
  <rect x="340" y="132" width="290" height="170" rx="10" fill="rgba(20,31,55,0.85)" stroke="#00e5ff" stroke-width="1"/>
  <text x="485" y="155" fill="#00e5ff" font-size="12" text-anchor="middle">✅ 去背景后（透明 PNG）</text>
  <rect x="360" y="165" width="250" height="120" rx="6" fill="url(#bg)" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <circle cx="485" cy="215" r="30" fill="rgba(59,130,246,0.3)"/>
  <circle cx="485" cy="215" r="15" fill="rgba(59,130,246,0.6)"/>
  <rect x="470" y="245" width="30" height="25" rx="3" fill="rgba(59,130,246,0.3)"/>
  <line x1="360" y1="165" x2="610" y2="285" stroke="rgba(255,255,255,0.15)" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="360" y1="285" x2="610" y2="165" stroke="rgba(255,255,255,0.15)" stroke-width="1" stroke-dasharray="4,3"/>
  <rect x="200" y="318" width="280" height="40" rx="999" fill="url(#accent)"/>
  <text x="340" y="343" fill="#fff" font-size="15" font-weight="700" text-anchor="middle">⬇ 下载透明 PNG</text>
