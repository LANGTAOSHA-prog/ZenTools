<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="'Inter',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b18"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>
  <rect width="680" height="400" fill="url(#bg)" rx="14"/>

  <text x="30" y="42" fill="#f0f4ff" font-size="20" font-weight="700">字数统计</text>
  <text x="30" y="66" fill="#6b7a9f" font-size="13">实时统计字符数、单词数、行数和段落数，输入即统计。</text>
  <rect x="30" y="85" width="620" height="295" fill="rgba(14,22,41,0.8)" rx="14" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <rect x="50" y="105" width="580" height="100" rx="10" fill="#0a0e1a" stroke="rgba(59,130,246,0.3)" stroke-width="1"/>
  <text x="65" y="130" fill="#8899bb" font-size="13">Today is a beautiful day.</text>
  <text x="65" y="153" fill="#8899bb" font-size="13">The sun is shining brightly</text>
  <text x="65" y="176" fill="#8899bb" font-size="13">and birds are singing in the garden.</text>
  <rect x="50" y="220" width="580" height="12" rx="6" fill="#1e293b"/>
  <text x="340" y="232" fill="#4a5a7a" font-size="10" text-anchor="middle">实时统计中...</text>
  <rect x="50" y="245" width="130" height="65" rx="10" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="115" y="272" fill="url(#cyan)" font-size="24" font-weight="900" text-anchor="middle">91</text>
  <text x="115" y="293" fill="#6b7a9f" font-size="11" text-anchor="middle">字符数</text>
  <rect x="195" y="245" width="130" height="65" rx="10" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="260" y="272" fill="url(#cyan)" font-size="24" font-weight="900" text-anchor="middle">19</text>
  <text x="260" y="293" fill="#6b7a9f" font-size="11" text-anchor="middle">单词数</text>
  <rect x="340" y="245" width="130" height="65" rx="10" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="405" y="272" fill="url(#cyan)" font-size="24" font-weight="900" text-anchor="middle">3</text>
  <text x="405" y="293" fill="#6b7a9f" font-size="11" text-anchor="middle">行数</text>
  <rect x="485" y="245" width="145" height="65" rx="10" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="557" y="272" fill="url(#cyan)" font-size="24" font-weight="900" text-anchor="middle">1</text>
  <text x="557" y="293" fill="#6b7a9f" font-size="11" text-anchor="middle">段落数</text>

</svg>