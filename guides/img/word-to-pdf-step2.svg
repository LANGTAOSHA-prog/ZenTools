<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="'Inter',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b18"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>
  <rect width="680" height="400" fill="url(#bg)" rx="14"/>

  <!-- Title -->
  <text x="30" y="42" fill="#f0f4ff" font-size="20" font-weight="700">📝 Word 转 PDF</text>
  <text x="30" y="66" fill="#6b7a9f" font-size="13">文档转换完成，可下载 PDF 文件。</text>

  <!-- Tool box -->
  <rect x="30" y="85" width="620" height="290" fill="rgba(14,22,41,0.8)" rx="14" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

  <!-- Completion status indicator -->
  <rect x="50" y="100" width="580" height="50" fill="rgba(16,185,129,0.08)" rx="10" stroke="rgba(16,185,129,0.25)" stroke-width="1"/>
  <text x="340" y="122" fill="#10b981" font-size="24" text-anchor="middle">✅</text>
  <text x="340" y="142" fill="#10b981" font-size="14" font-weight="600" text-anchor="middle">转换完成！PDF 已准备就绪</text>

  <!-- Section header -->
  <text x="50" y="178" fill="#f0f4ff" font-size="15" font-weight="700">转换结果</text>
  <text x="50" y="198" fill="#6b7a9f" font-size="12">以下是文档的转换摘要信息。</text>

  <!-- Result info cards -->
  <rect x="50" y="215" width="180" height="60" fill="rgba(20,31,55,0.85)" rx="10" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <text x="140" y="240" fill="#f0f4ff" font-size="13" font-weight="600" text-anchor="middle">原文件</text>
  <text x="140" y="262" fill="#8899bb" font-size="11" text-anchor="middle">项目方案.docx (2.4 MB)</text>

  <rect x="250" y="215" width="180" height="60" fill="rgba(20,31,55,0.85)" rx="10" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <text x="340" y="240" fill="#f0f4ff" font-size="13" font-weight="600" text-anchor="middle">目标文件</text>
  <text x="340" y="262" fill="#8899bb" font-size="11" text-anchor="middle">项目方案.pdf (1.8 MB)</text>

  <rect x="450" y="215" width="180" height="60" fill="rgba(20,31,55,0.85)" rx="10" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <text x="540" y="240" fill="#f0f4ff" font-size="13" font-weight="600" text-anchor="middle">页数</text>
  <text x="540" y="262" fill="#8899bb" font-size="11" text-anchor="middle">12 页</text>

  <!-- Conversion details -->
  <rect x="50" y="285" width="580" height="36" fill="rgba(255,255,255,0.02)" rx="8" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
  <text x="65" y="308" fill="#6b7a9f" font-size="12">排版：完全保留</text>
  <text x="240" y="308" fill="#6b7a9f" font-size="12">图片：12 张已保留</text>
  <text x="420" y="308" fill="#6b7a9f" font-size="12">超链接：8 个已保留</text>

  <!-- Download button -->
  <rect x="170" y="335" width="340" height="38" fill="url(#greenGrad)" rx="999"/>
  <text x="340" y="359" fill="#fff" font-size="15" font-weight="700" text-anchor="middle">⬇️ 下载 PDF</text>
</svg>