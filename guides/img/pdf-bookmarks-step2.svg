<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="'Inter',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b18"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="pageGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f7fa"/>
    </linearGradient>
  </defs>
  <rect width="680" height="400" fill="url(#bg)" rx="14"/>

  <!-- Title -->
  <text x="30" y="42" fill="#f0f4ff" font-size="20" font-weight="700">🔖 PDF 书签</text>
  <text x="30" y="66" fill="#6b7a9f" font-size="13">书签已生成，点击书签即可跳转到对应页面。</text>

  <!-- Tool box -->
  <rect x="30" y="85" width="620" height="290" fill="rgba(14,22,41,0.8)" rx="14" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

  <!-- PDF viewer header -->
  <rect x="30" y="85" width="620" height="36" fill="rgba(20,31,55,0.6)" rx="14"/>
  <rect x="30" y="106" width="620" height="15" fill="rgba(20,31,55,0.6)"/>
  <text x="60" y="109" fill="#8899bb" font-size="12">research-paper.pdf</text>

  <!-- Left sidebar - Bookmarks panel -->
  <rect x="40" y="128" width="200" height="237" rx="8" fill="rgba(20,31,55,0.5)" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>

  <rect x="40" y="128" width="200" height="30" fill="rgba(255,255,255,0.03)" rx="8"/>
  <text x="55" y="149" fill="#f0f4ff" font-size="12" font-weight="600">📑 书签</text>
  <text x="215" y="149" fill="#4a5a7a" font-size="10">5项</text>

  <!-- Bookmark items in sidebar -->
  <rect x="48" y="164" width="184" height="24" fill="rgba(0,229,255,0.1)" rx="5"/>
  <text x="56" y="181" fill="#00e5ff" font-size="11" font-weight="600">第一章 引言</text>
  <text x="220" y="181" fill="#3b82f6" font-size="9">p.1</text>

  <rect x="48" y="192" width="184" height="22" fill="rgba(255,255,255,0.02)" rx="5"/>
  <text x="68" y="208" fill="#d1d5e0" font-size="10">1.1 研究背景</text>
  <text x="220" y="208" fill="#4a5a7a" font-size="9">p.3</text>

  <rect x="48" y="218" width="184" height="22" fill="rgba(255,255,255,0.02)" rx="5"/>
  <text x="68" y="234" fill="#d1d5e0" font-size="10">1.2 相关工作</text>
  <text x="220" y="234" fill="#4a5a7a" font-size="9">p.7</text>

  <rect x="48" y="244" width="184" height="24" fill="rgba(255,255,255,0.02)" rx="5"/>
  <text x="56" y="261" fill="#d1d5e0" font-size="11" font-weight="600">第二章 方法</text>
  <text x="220" y="261" fill="#4a5a7a" font-size="9">p.15</text>

  <rect x="48" y="272" width="184" height="22" fill="rgba(255,255,255,0.02)" rx="5"/>
  <text x="68" y="288" fill="#d1d5e0" font-size="10">2.1 数据采集</text>
  <text x="220" y="288" fill="#4a5a7a" font-size="9">p.16</text>

  <!-- PDF page area -->
  <rect x="250" y="128" width="390" height="237" rx="6" fill="rgba(240,243,248,0.06)"/>

  <!-- PDF page mockup -->
  <rect x="270" y="136" width="350" height="220" rx="4" fill="url(#pageGrad)"/>

  <!-- Page header -->
  <rect x="290" y="152" width="120" height="5" rx="2.5" fill="#d0d5dd"/>
  <rect x="290" y="163" width="200" height="3" rx="1.5" fill="#e4e7ec"/>
  <rect x="290" y="171" width="170" height="3" rx="1.5" fill="#e4e7ec"/>

  <!-- Section heading -->
  <rect x="290" y="190" width="200" height="5" rx="2.5" fill="#1a1a2e"/>
  <rect x="290" y="200" width="310" height="3" rx="1.5" fill="#e4e7ec"/>
  <rect x="290" y="209" width="280" height="3" rx="1.5" fill="#e4e7ec"/>
  <rect x="290" y="218" width="300" height="3" rx="1.5" fill="#e4e7ec"/>

  <!-- Paragraph 1 -->
  <rect x="290" y="238" width="310" height="3" rx="1.5" fill="#e4e7ec"/>
  <rect x="290" y="247" width="290" height="3" rx="1.5" fill="#e4e7ec"/>
  <rect x="290" y="256" width="300" height="3" rx="1.5" fill="#e4e7ec"/>
  <rect x="290" y="265" width="270" height="3" rx="1.5" fill="#e4e7ec"/>

  <!-- Paragraph 2 -->
  <rect x="290" y="283" width="250" height="3" rx="1.5" fill="#e4e7ec"/>
  <rect x="290" y="292" width="280" height="3" rx="1.5" fill="#e4e7ec"/>
  <rect x="290" y="301" width="200" height="3" rx="1.5" fill="#e4e7ec"/>

  <!-- Highlighted bookmarked content -->
  <rect x="475" y="195" width="125" height="14" rx="2" fill="rgba(0,229,255,0.15)"/>

  <!-- Active page indicator -->
  <rect x="250" y="355" width="390" height="20" fill="rgba(20,31,55,0.6)"/>
  <text x="445" y="369" fill="#6b7a9f" font-size="10" text-anchor="middle">第 16 页 / 42 · 当前: 2.1 数据采集</text>

  <!-- Jump arrow -->
  <path d="M96 295 L96 315 L110 315" fill="none" stroke="#00e5ff" stroke-width="1.5" opacity="0.6"/>
  <polyline points="106,312 112,316 106,320" fill="none" stroke="#00e5ff" stroke-width="1.5" opacity="0.6"/>
</svg>