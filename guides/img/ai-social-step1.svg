<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="'Inter',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b18"/>
    </linearGradient>
    <linearGradient id="socialGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="680" height="400" fill="url(#bg)" rx="14"/>
  <text x="30" y="42" fill="#f0f4ff" font-size="20" font-weight="700">📱 AI 社交媒体生成器</text>
  <text x="30" y="66" fill="#6b7a9f" font-size="13">使用 AI 生成微博、小红书、Twitter 等社交平台的文案和内容。</text>
  <rect x="30" y="85" width="620" height="290" fill="rgba(14,22,41,0.8)" rx="14" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  
  <!-- 平台选择 -->
  <rect x="50" y="100" width="120" height="40" rx="8" fill="rgba(236,72,153,0.15)" stroke="rgba(236,72,153,0.3)" stroke-width="1"/>
  <text x="110" y="125" fill="#ec4899" font-size="12" text-anchor="middle">微博</text>
  
  <rect x="180" y="100" width="120" height="40" rx="8" fill="rgba(20,31,55,0.9)" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <text x="240" y="125" fill="#94a3b8" font-size="12" text-anchor="middle">小红书</text>
  
  <rect x="310" y="100" width="120" height="40" rx="8" fill="rgba(20,31,55,0.9)" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <text x="370" y="125" fill="#94a3b8" font-size="12" text-anchor="middle">Twitter</text>
  
  <!-- 输入区域 -->
  <rect x="50" y="155" width="580" height="60" rx="10" fill="rgba(20,31,55,0.9)" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <text x="70" y="180" fill="#f0f4ff" font-size="13">请输入主题：分享一个提升工作效率的小技巧</text>
  <text x="70" y="200" fill="#4a5a7a" font-size="10">风格：轻松幽默 | 语气：亲切自然</text>
  
  <!-- 生成结果 -->
  <rect x="50" y="230" width="580" height="150" rx="10" fill="rgba(236,72,153,0.08)" stroke="rgba(236,72,153,0.15)" stroke-width="1"/>
  <text x="70" y="255" fill="#ec4899" font-size="12">生成的微博文案：</text>
  
  <text x="70" y="280" fill="#f0f4ff" font-size="12">🔥 分享一个超实用的效率技巧！</text>
  <text x="70" y="305" fill="#94a3b8" font-size="11">每天用 AI 工具处理重复性工作，能节省 2-3 小时！我最近在用 ZenTools 的 AI 写作助手，写周报只要 5 分钟，老板都夸我效率高了 😂</text>
  <text x="70" y="330" fill="#94a3b8" font-size="11">#效率提升 #AI工具 #职场技巧 #ZenTools</text>
  
  <!-- 标签建议 -->
  <rect x="70" y="350" width="200" height="25" rx="6" fill="rgba(139,92,246,0.15)"/>
  <text x="170" y="367" fill="#8b5cf6" font-size="10" text-anchor="middle">推荐标签：#AI #效率 #职场</text>
</svg>