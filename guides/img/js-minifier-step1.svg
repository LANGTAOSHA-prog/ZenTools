<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="'Inter',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b18"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="680" height="400" fill="url(#bg)" rx="14"/>

  <!-- Title -->
  <text x="30" y="42" fill="#f0f4ff" font-size="20" font-weight="700">⚡ JS 压缩</text>
  <text x="30" y="66" fill="#6b7a9f" font-size="13">压缩 JavaScript 代码，减小文件体积，提升网页加载速度。</text>

  <!-- Tool box -->
  <rect x="30" y="85" width="620" height="290" fill="rgba(14,22,41,0.8)" rx="14" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

  <!-- Input panel -->
  <text x="50" y="118" fill="#f0f4ff" font-size="15" font-weight="700">原始代码</text>
  <rect x="50" y="130" width="290" height="200" rx="10" fill="#0a0e1a" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  
  <text x="65" y="155" fill="#c084fc" font-size="12">function</text>
  <text x="115" y="155" fill="#f0f4ff" font-size="12"> greet(name)</text>
  <text x="65" y="175" fill="#f0f4ff" font-size="12">{</text>
  <text x="80" y="195" fill="#34d399" font-size="12">// 问候用户</text>
  <text x="80" y="215" fill="#60a5fa" font-size="12">  const</text>
  <text x="120" y="215" fill="#f0f4ff" font-size="12"> msg = </text>
  <text x="160" y="215" fill="#fbbf24" font-size="12">'Hello '</text>
  <text x="210" y="215" fill="#f0f4ff" font-size="12">+</text>
  <text x="220" y="215" fill="#f0f4ff" font-size="12"> name;</text>
  <text x="80" y="235" fill="#60a5fa" font-size="12">  console</text>
  <text x="140" y="235" fill="#f0f4ff" font-size="12">.</text>
  <text x="148" y="235" fill="#60a5fa" font-size="12">log</text>
  <text x="175" y="235" fill="#f0f4ff" font-size="12">(msg);</text>
  <text x="80" y="255" fill="#60a5fa" font-size="12">  return</text>
  <text x="130" y="255" fill="#f0f4ff" font-size="12"> msg;</text>
  <text x="65" y="275" fill="#f0f4ff" font-size="12">}</text>

  <!-- Arrow -->
  <text x="360" y="230" fill="#3b82f6" font-size="28" text-anchor="middle">→</text>
  <text x="360" y="200" fill="#3b82f6" font-size="10" text-anchor="middle">压缩</text>

  <!-- Output panel -->
  <text x="390" y="118" fill="#f0f4ff" font-size="15" font-weight="700">压缩结果</text>
  <rect x="390" y="130" width="260" height="200" rx="10" fill="#0a0e1a" stroke="rgba(34,197,94,0.3)" stroke-width="1"/>
  
  <text x="405" y="155" fill="#fbbf24" font-size="11">function</text>
  <text x="450" y="155" fill="#f0f4ff" font-size="11">g(n){</text>
  <text x="405" y="175" fill="#34d399" font-size="11">const</text>
  <text x="445" y="175" fill="#f0f4ff" font-size="11">m</text>
  <text x="455" y="175" fill="#f0f4ff" font-size="11">=</text>
  <text x="465" y="175" fill="#fbbf24" font-size="11">"Hello "</text>
  <text x="520" y="175" fill="#f0f4ff" font-size="11">+n;</text>
  <text x="405" y="195" fill="#60a5fa" font-size="11">console</text>
  <text x="455" y="195" fill="#f0f4ff" font-size="11">.</text>
  <text x="460" y="195" fill="#60a5fa" font-size="11">log</text>
  <text x="488" y="195" fill="#f0f4ff" font-size="11">(m);</text>
  <text x="405" y="215" fill="#60a5fa" font-size="11">return</text>
  <text x="450" y="215" fill="#f0f4ff" font-size="11">m;</text>
  <text x="405" y="235" fill="#f0f4ff" font-size="11">}</text>

  <!-- Stats bar -->
  <rect x="50" y="340" width="290" height="28" rx="7" fill="rgba(20,31,55,0.8)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="70" y="359" fill="#6b7a9f" font-size="12">原始: 248 字节</text>
  
  <rect x="390" y="340" width="260" height="28" rx="7" fill="rgba(20,31,55,0.8)" stroke="rgba(34,197,94,0.3)" stroke-width="1"/>
  <text x="410" y="359" fill="#22c55e" font-size="12">压缩: 86 字节 (-65%)</text>

  <!-- Compress button -->
  <rect x="300" y="340" width="70" height="28" fill="url(#accent)" rx="7"/>
  <text x="335" y="359" fill="#fff" font-size="12" font-weight="600" text-anchor="middle">压缩</text>
</svg>
