<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b18"/>
    </linearGradient>
  </defs>
  <rect width="680" height="400" fill="url(#bg)" rx="12"/>
  <text x="340" y="52" text-anchor="middle" fill="#e2e8f0" font-family="system-ui,sans-serif" font-size="22" font-weight="700">屏幕检测</text>
  <text x="340" y="74" text-anchor="middle" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="12">Screen Check</text>
  <!-- Browser chrome -->
  <rect x="40" y="95" width="600" height="280" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <circle cx="62" cy="113" r="5" fill="#ef4444"/>
  <circle cx="80" cy="113" r="5" fill="#eab308"/>
  <circle cx="98" cy="113" r="5" fill="#22c55e"/>
  <rect x="120" y="106" width="280" height="14" rx="7" fill="#0f172a"/>
  <!-- Color test grid -->
  <rect x="70" y="130" width="240" height="230" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="190" y="150" text-anchor="middle" fill="#e2e8f0" font-family="system-ui,sans-serif" font-size="10" font-weight="600">纯色测试</text>
  <!-- Color swatches -->
  <rect x="80" y="158" width="55" height="35" rx="3" fill="#ffffff"/>
  <rect x="140" y="158" width="55" height="35" rx="3" fill="#000000"/>
  <rect x="200" y="158" width="55" height="35" rx="3" fill="#ff0000"/>
  <rect x="260" y="158" width="40" height="35" rx="3" fill="#00ff00"/>
  <rect x="80" y="200" width="55" height="35" rx="3" fill="#0000ff"/>
  <rect x="140" y="200" width="55" height="35" rx="3" fill="#ffff00"/>
  <rect x="200" y="200" width="55" height="35" rx="3" fill="#ff00ff"/>
  <rect x="260" y="200" width="40" height="35" rx="3" fill="#00ffff"/>
  <rect x="80" y="242" width="55" height="35" rx="3" fill="#ff6b6b"/>
  <rect x="140" y="242" width="55" height="35" rx="3" fill="#51cf66"/>
  <rect x="200" y="242" width="55" height="35" rx="3" fill="#339af0"/>
  <rect x="260" y="242" width="40" height="35" rx="3" fill="#ffd43b"/>
  <rect x="80" y="284" width="55" height="35" rx="3" fill="#845ef7"/>
  <rect x="140" y="284" width="55" height="35" rx="3" fill="#f06595"/>
  <rect x="200" y="284" width="55" height="35" rx="3" fill="#20c997"/>
  <rect x="260" y="284" width="40" height="35" rx="3" fill="#ffa94d"/>
  <!-- Dead pixel test -->
  <rect x="330" y="130" width="310" height="115" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="485" y="150" text-anchor="middle" fill="#e2e8f0" font-family="system-ui,sans-serif" font-size="10" font-weight="600">坏点检测</text>
  <rect x="340" y="158" width="148" height="78" rx="4" fill="#ffffff"/>
  <rect x="498" y="158" width="132" height="78" rx="4" fill="#000000"/>
  <text x="414" y="200" text-anchor="middle" fill="#666" font-family="system-ui,sans-serif" font-size="9">白色区域</text>
  <text x="564" y="200" text-anchor="middle" fill="#999" font-family="system-ui,sans-serif" font-size="9">黑色区域</text>
  <!-- Gradient test -->
  <rect x="330" y="255" width="310" height="60" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="485" y="273" text-anchor="middle" fill="#e2e8f0" font-family="system-ui,sans-serif" font-size="10" font-weight="600">渐变测试</text>
  <defs>
    <linearGradient id="grad1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#000"/>
      <stop offset="100%" stop-color="#fff"/>
    </linearGradient>
    <linearGradient id="grad2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f00"/>
      <stop offset="50%" stop-color="#0f0"/>
      <stop offset="100%" stop-color="#00f"/>
    </linearGradient>
  </defs>
  <rect x="340" y="282" width="290" height="18" rx="3" fill="url(#grad1)"/>
  <rect x="340" y="304" width="290" height="18" rx="3" fill="url(#grad2)"/>
  <!-- Info panel -->
  <rect x="330" y="328" width="310" height="30" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="345" y="347" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="10">分辨率: 1920x1080</text>
  <text x="500" y="347" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="10">刷新率: 60Hz</text>
  <text x="600" y="347" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="10">色域: sRGB</text>
  <!-- Control buttons -->
  <rect x="340" y="365" width="80" height="24" rx="6" fill="#06b6d4" opacity="0.8"/>
  <text x="380" y="381" text-anchor="middle" fill="#fff" font-family="system-ui,sans-serif" font-size="9" font-weight="600">全屏模式</text>
  <rect x="435" y="365" width="80" height="24" rx="6" fill="#334155"/>
  <text x="475" y="381" text-anchor="middle" fill="#e2e8f0" font-family="system-ui,sans-serif" font-size="9" font-weight="600">测试网格</text>
  <rect x="530" y="365" width="80" height="24" rx="6" fill="#334155"/>
  <text x="570" y="381" text-anchor="middle" fill="#e2e8f0" font-family="system-ui,sans-serif" font-size="9" font-weight="600">截图保存</text>
</svg>
