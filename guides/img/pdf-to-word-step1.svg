<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="'Inter',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b18"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="680" height="400" fill="url(#bg)" rx="14"/>

  <text x="30" y="42" fill="#f0f4ff" font-size="20" font-weight="700">📝 PDF 转 Word</text>
  <text x="30" y="66" fill="#6b7a9f" font-size="13">从 PDF 中提取文字内容，保存为可编辑的 TXT 文件。</text>

  <rect x="30" y="85" width="620" height="290" fill="rgba(14,22,41,0.8)" rx="14" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

  <text x="50" y="118" fill="#f0f4ff" font-size="15" font-weight="700">选择 PDF 文件</text>
  <text x="50" y="138" fill="#6b7a9f" font-size="12">选择一个 PDF 文件，自动提取其中的文字内容。</text>

  <!-- File input area -->
  <rect x="50" y="155" width="580" height="80" rx="12" fill="rgba(20,31,55,0.85)" stroke="rgba(59,130,246,0.4)" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="340" y="188" fill="#6b7a9f" font-size="30" text-anchor="middle">📄</text>
  <text x="340" y="218" fill="#8899bb" font-size="13" text-anchor="middle">点击选择 PDF 文件</text>

  <!-- Buttons -->
  <rect x="50" y="252" width="200" height="34" rx="8" fill="rgba(10,14,26,0.8)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="150" y="274" fill="#f0f4ff" font-size="12" text-anchor="middle">📂 选择文件</text>

  <rect x="270" y="252" width="200" height="34" rx="8" fill="url(#accent)"/>
  <text x="370" y="274" fill="#fff" font-size="13" font-weight="600" text-anchor="middle">提取文字</text>

  <!-- Result area preview -->
  <rect x="50" y="300" width="580" height="60" rx="10" fill="rgba(10,14,26,0.6)" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <text x="65" y="325" fill="#4a5a7a" font-size="12">提取的文字将显示在这里...</text>
</svg>
