<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="'Inter',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b18"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="680" height="400" fill="url(#bg)" rx="14"/>

  <!-- Title -->
  <text x="30" y="42" fill="#f0f4ff" font-size="20" font-weight="700">🗑️ PDF 删除页面</text>
  <text x="30" y="66" fill="#6b7a9f" font-size="13">从 PDF 文件中删除不需要的页面，保留你想要的内容。</text>

  <!-- Tool box -->
  <rect x="30" y="85" width="620" height="290" fill="rgba(14,22,41,0.8)" rx="14" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

  <text x="50" y="118" fill="#f0f4ff" font-size="15" font-weight="700">选择要删除的页面</text>
  <text x="50" y="138" fill="#6b7a9f" font-size="12">点击页面上的 ✕ 图标或输入页面范围来标记要删除的页面。</text>

  <!-- Page thumbnails row -->
  <!-- Page 1 (normal) -->
  <rect x="50" y="158" width="140" height="110" rx="8" fill="rgba(20,31,55,0.9)" stroke="rgba(59,130,246,0.3)" stroke-width="2"/>
  <rect x="70" y="178" width="100" height="70" rx="4" fill="rgba(30,45,75,0.6)"/>
  <text x="120" y="216" fill="#4a5a7a" font-size="28" text-anchor="middle">1</text>
  <text x="120" y="252" fill="#8899bb" font-size="11" text-anchor="middle">第 1 页</text>

  <!-- Page 2 (marked for deletion - with red overlay and X) -->
  <rect x="220" y="158" width="140" height="110" rx="8" fill="rgba(20,31,55,0.9)" stroke="rgba(239,68,68,0.6)" stroke-width="2"/>
  <rect x="220" y="158" width="140" height="110" rx="8" fill="rgba(239,68,68,0.08)"/>
  <rect x="70" y="178" width="100" height="70" rx="4" fill="rgba(30,45,75,0.6)"/>
  <text x="290" y="216" fill="#4a5a7a" font-size="28" text-anchor="middle">2</text>
  <text x="290" y="252" fill="#ef4444" font-size="11" text-anchor="middle">第 2 页</text>
  <!-- Red delete marker circle + X -->
  <circle cx="345" cy="173" r="12" fill="#ef4444"/>
  <text x="345" y="178" fill="#fff" font-size="16" font-weight="700" text-anchor="middle">✕</text>
  <!-- Strike-through line on page -->
  <line x1="235" y1="255" x2="345" y2="170" stroke="#ef4444" stroke-width="1.5" opacity="0.5"/>

  <!-- Page 3 (normal) -->
  <rect x="390" y="158" width="140" height="110" rx="8" fill="rgba(20,31,55,0.9)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <rect x="410" y="178" width="100" height="70" rx="4" fill="rgba(30,45,75,0.6)"/>
  <text x="460" y="216" fill="#4a5a7a" font-size="28" text-anchor="middle">3</text>
  <text x="460" y="252" fill="#8899bb" font-size="11" text-anchor="middle">第 3 页</text>

  <!-- Page range input area -->
  <rect x="50" y="282" width="420" height="34" fill="#0a0e1a" rx="8" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="65" y="304" fill="#4a5a7a" font-size="12">输入页面范围，例如：1,3,5-8</text>
  <rect x="380" y="282" width="90" height="34" fill="url(#blue)" rx="8"/>
  <text x="425" y="304" fill="#fff" font-size="12" font-weight="600" text-anchor="middle">标记</text>

  <!-- Delete button (active) -->
  <rect x="50" y="325" width="580" height="36" fill="url(#accent)" rx="999"/>
  <text x="340" y="347" fill="#fff" font-size="14" font-weight="700" text-anchor="middle">删除选中页面（1 页）</text>
</svg>