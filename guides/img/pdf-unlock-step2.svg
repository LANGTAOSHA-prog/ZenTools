<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" font-family="'Inter',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b18"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="success" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
  </defs>
  <rect width="680" height="420" fill="url(#bg)" rx="14"/>

  <!-- Title -->
  <text x="30" y="42" fill="#f0f4ff" font-size="20" font-weight="700">🔓 PDF 解锁</text>
  <text x="30" y="66" fill="#6b7a9f" font-size="13">移除 PDF 文件密码保护，快速解锁加密文档。</text>

  <!-- Tool box -->
  <rect x="30" y="85" width="620" height="310" fill="rgba(14,22,41,0.8)" rx="14" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

  <!-- Success indicator -->
  <rect x="50" y="105" width="580" height="44" fill="rgba(34,197,94,0.08)" rx="10" stroke="rgba(34,197,94,0.25)" stroke-width="1"/>
  <text x="70" y="133" fill="#22c55e" font-size="14" font-weight="600">✓ 密码验证成功，文档已解锁！</text>

  <!-- File info -->
  <text x="50" y="178" fill="#f0f4ff" font-size="15" font-weight="700">已解锁文件</text>

  <!-- File card -->
  <rect x="50" y="192" width="580" height="56" fill="rgba(255,255,255,0.03)" rx="10" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

  <!-- Unlocked PDF icon -->
  <text x="72" y="228" fill="#22c55e" font-size="22">🔓</text>

  <text x="102" y="220" fill="#f0f4ff" font-size="13" font-weight="600">年度财务报告_加密版.pdf</text>
  <text x="102" y="240" fill="#6b7a9f" font-size="11">3.2 MB · 已解锁 · 可编辑</text>

  <!-- Status badge -->
  <rect x="470" y="202" width="70" height="24" fill="rgba(34,197,94,0.15)" rx="999"/>
  <text x="505" y="218" fill="#22c55e" font-size="11" font-weight="600" text-anchor="middle">已解锁</text>

  <!-- Remove button -->
  <text x="570" y="224" fill="#4a5a7a" font-size="16" text-anchor="end">✕</text>

  <!-- Download button -->
  <rect x="50" y="268" width="240" height="44" fill="url(#success)" rx="999"/>
  <text x="170" y="296" fill="#fff" font-size="14" font-weight="700" text-anchor="middle">⬇ 下载解锁后文件</text>

  <!-- Unlock another button -->
  <rect x="310" y="268" width="180" height="44" fill="rgba(20,31,55,0.9)" rx="999" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="400" y="296" fill="#94a3b8" font-size="13" font-weight="600" text-anchor="middle">+ 解锁另一个</text>

  <!-- Security note -->
  <text x="50" y="338" fill="#4a5a7a" font-size="11">所有操作在浏览器本地完成，密码和解锁后的文件不会上传到服务器。</text>
</svg>