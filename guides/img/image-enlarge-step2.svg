<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" font-family="'Inter',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b18"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="680" height="380" fill="url(#bg)" rx="14"/>
  <text x="30" y="42" fill="#f0f4ff" font-size="20" font-weight="700">🔍 图片放大</text>
  <text x="30" y="66" fill="#6b7a9f" font-size="13">对比原图和放大效果。</text>
  <rect x="30" y="85" width="620" height="275" fill="rgba(14,22,41,0.8)" rx="14" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="50" y="118" fill="#f0f4ff" font-size="15" font-weight="700">放大结果</text>
  <!-- Before / After comparison -->
  <rect x="50" y="135" width="280" height="200" rx="12" fill="rgba(20,31,55,0.5)" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <text x="65" y="160" fill="#6b7a9f" font-size="11">原图 (1920x1280)</text>
  <rect x="65" y="170" width="110" height="75" rx="6" fill="#3b82f6" opacity="0.3"/>
  <rect x="80" y="185" width="20" height="12" rx="2" fill="#f59e0b" opacity="0.5"/>
  <rect x="115" y="180" width="15" height="15" rx="2" fill="#10b981" opacity="0.5"/>
  <rect x="205" y="170" width="110" height="75" rx="6" fill="#8b5cf6" opacity="0.3"/>
  <rect x="220" y="185" width="35" height="20" rx="2" fill="#f59e0b" opacity="0.5"/>
  <rect x="265" y="180" width="25" height="25" rx="2" fill="#10b981" opacity="0.5"/>
  <text x="65" y="270" fill="#6b7a9f" font-size="11">放大 2x (3840x2560)</text>
  <text x="190" y="310" fill="#10b981" font-size="22" text-anchor="middle">✓</text>
  <text x="190" y="322" fill="#8899bb" font-size="11" text-anchor="middle">放大完成</text>
  <!-- Result info -->
  <rect x="350" y="135" width="280" height="200" rx="12" fill="rgba(20,31,55,0.85)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="490" y="160" fill="#f0f4ff" font-size="13" font-weight="600" text-anchor="middle">放大结果</text>
  <line x1="365" y1="172" x2="615" y2="172" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="365" y="195" fill="#6b7a9f" font-size="11">放大倍数</text>
  <text x="365" y="215" fill="#f0f4ff" font-size="13">2x</text>
  <text x="365" y="240" fill="#6b7a9f" font-size="11">原图尺寸</text>
  <text x="365" y="260" fill="#f0f4ff" font-size="13">1920 × 1280</text>
  <text x="365" y="285" fill="#6b7a9f" font-size="11">新尺寸</text>
  <text x="365" y="305" fill="#f0f4ff" font-size="13">3840 × 2560</text>
  <rect x="365" y="315" width="250" height="30" rx="8" fill="url(#accent)"/>
  <text x="490" y="335" fill="#fff" font-size="12" font-weight="600" text-anchor="middle">下载放大图片</text>
</svg>