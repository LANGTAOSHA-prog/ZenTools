<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="'Inter',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b18"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>
  <rect width="680" height="400" fill="url(#bg)" rx="14"/>

  <!-- Title -->
  <text x="30" y="42" fill="#f0f4ff" font-size="20" font-weight="700">💧 PDF 移除水印</text>
  <text x="30" y="66" fill="#6b7a9f" font-size="13">移除 PDF 文档中的水印、背景文字或图片，还原清晰阅读体验。</text>

  <!-- Tool box -->
  <rect x="30" y="85" width="620" height="290" fill="rgba(14,22,41,0.8)" rx="14" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

  <text x="50" y="118" fill="#f0f4ff" font-size="15" font-weight="700">PDF 预览与去水印</text>
  <text x="50" y="138" fill="#6b7a9f" font-size="12">选择需要去除水印的区域，一键清除。</text>

  <!-- PDF preview area -->
  <rect x="50" y="155" width="300" height="180" rx="8" fill="#0f192e" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

  <!-- PDF page content -->
  <text x="70" y="190" fill="#8899bb" font-size="11">项目名称：ZenTools 在线工具箱</text>
  <text x="70" y="208" fill="#6b7a9f" font-size="9">本文档概述了 ZenTools 在线工具箱的功能</text>
  <text x="70" y="222" fill="#6b7a9f" font-size="9">架构和核心模块。涵盖图片处理、PDF</text>
  <text x="70" y="236" fill="#6b7a9f" font-size="9">工具、AI 助手等 200+ 在线工具的使用</text>
  <text x="70" y="250" fill="#6b7a9f" font-size="9">方法和最佳实践。所有工具在浏览器中</text>
  <text x="70" y="264" fill="#6b7a9f" font-size="9">本地运行，确保数据安全。</text>

  <!-- Watermark overlay text (rotated, semi-transparent) -->
  <text x="200" y="260" fill="rgba(255,80,80,0.25)" font-size="32" font-weight="900" text-anchor="middle" transform="rotate(-25,200,260)">Sample</text>
  <text x="200" y="300" fill="rgba(255,80,80,0.18)" font-size="28" font-weight="900" text-anchor="middle" transform="rotate(-25,200,300)">水印</text>

  <!-- Reference rectangle highlighting watermark -->
  <rect x="145" y="233" width="110" height="80" fill="none" stroke="rgba(255,80,80,0.4)" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="148" y="230" fill="rgba(255,80,80,0.6)" font-size="8">水印区域</text>

  <!-- Right panel: area selection controls -->
  <rect x="370" y="155" width="260" height="180" rx="8" fill="#0a0e1a" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>

  <text x="388" y="180" fill="#f0f4ff" font-size="13" font-weight="600">去水印设置</text>

  <!-- Manual selection mode -->
  <rect x="385" y="192" width="230" height="36" rx="6" fill="#0f172a" stroke="rgba(6,182,212,0.5)" stroke-width="1"/>
  <circle cx="398" cy="210" r="4" fill="#06b6d4"/>
  <text x="410" y="214" fill="#e2e8f0" font-size="12">手动框选水印区域</text>

  <!-- Position inputs -->
  <text x="388" y="248" fill="#6b7a9f" font-size="11">区域位置 (x, y, w, h):</text>
  <rect x="385" y="256" width="50" height="26" rx="4" fill="#0a0e1a" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="410" y="273" fill="#8899bb" font-size="11" text-anchor="middle">110</text>
  <rect x="442" y="256" width="50" height="26" rx="4" fill="#0a0e1a" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="467" y="273" fill="#8899bb" font-size="11" text-anchor="middle">78</text>
  <rect x="499" y="256" width="50" height="26" rx="4" fill="#0a0e1a" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="524" y="273" fill="#8899bb" font-size="11" text-anchor="middle">110</text>
  <rect x="556" y="256" width="50" height="26" rx="4" fill="#0a0e1a" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="581" y="273" fill="#8899bb" font-size="11" text-anchor="middle">80</text>

  <!-- Remove watermark button -->
  <rect x="385" y="295" width="230" height="36" rx="999" fill="url(#accent)"/>
  <text x="500" y="317" fill="#fff" font-size="14" font-weight="600" text-anchor="middle">移除水印</text>
</svg>
