<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="'Inter',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b18"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
  </defs>
  <rect width="680" height="400" fill="url(#bg)" rx="14"/>

  <text x="30" y="42" fill="#f0f4ff" font-size="20" font-weight="700">文本去重</text>
  <text x="30" y="66" fill="#6b7a9f" font-size="13">检测并删除文本中的重复行，支持完全匹配和模糊匹配模式。</text>

  <rect x="30" y="85" width="620" height="290" fill="rgba(14,22,41,0.8)" rx="14" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

  <rect x="50" y="100" width="280" height="200" rx="10" fill="#0a0e1a" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="65" y="128" fill="#4a5a7a" font-size="11">输入 (4行)</text>
  <text x="65" y="152" fill="#f0f4ff" font-size="12">apple</text>
  <text x="65" y="174" fill="#ef4444" font-size="12">apple</text>
  <text x="65" y="196" fill="#f0f4ff" font-size="12">banana</text>
  <text x="65" y="218" fill="#ef4444" font-size="12">banana</text>
  <text x="65" y="240" fill="#f0f4ff" font-size="12">cherry</text>
  <text x="65" y="262" fill="#ef4444" font-size="12">cherry</text>

  <rect x="340" y="155" width="26" height="36" rx="6" fill="url(#accent)"/>
  <text x="353" y="178" fill="#fff" font-size="14" font-weight="700" text-anchor="middle">→</text>

  <rect x="380" y="100" width="260" height="200" rx="10" fill="#0a0e1a" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="395" y="128" fill="#4a5a7a" font-size="11">输出 (3行, 3已去重)</text>
  <text x="395" y="152" fill="#22c55e" font-size="12">apple</text>
  <text x="395" y="174" fill="#22c55e" font-size="12">banana</text>
  <text x="395" y="196" fill="#22c55e" font-size="12">cherry</text>

  <rect x="50" y="315" width="200" height="34" rx="8" fill="url(#accent)"/>
  <text x="150" y="337" fill="#fff" font-size="14" font-weight="600" text-anchor="middle">开始去重</text>
</svg>
