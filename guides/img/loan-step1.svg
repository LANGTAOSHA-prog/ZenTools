<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="'Inter',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b18"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="680" height="400" fill="url(#bg)" rx="14"/>
  <text x="30" y="42" fill="#f0f4ff" font-size="20" font-weight="700">🏦 贷款计算器</text>
  <text x="30" y="66" fill="#6b7a9f" font-size="13">计算贷款月供和利息，支持等额本息和等额本金两种还款方式。</text>
  <rect x="30" y="85" width="620" height="290" fill="rgba(14,22,41,0.8)" rx="14" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="50" y="118" fill="#f0f4ff" font-size="15" font-weight="700">🏦 贷款计算器</text>
  <!-- input fields -->
  <rect x="50" y="135" width="270" height="34" fill="#0a0e1a" rx="8" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="65" y="157" fill="#6b7a9f" font-size="12">贷款金额</text>
  <text x="240" y="157" fill="#f0f4ff" font-size="12" text-anchor="end">1,000,000 元</text>
  <rect x="340" y="135" width="140" height="34" fill="#0a0e1a" rx="8" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="355" y="157" fill="#6b7a9f" font-size="12">年利率</text>
  <text x="445" y="157" fill="#f0f4ff" font-size="12" text-anchor="end">3.85%</text>
  <rect x="50" y="180" width="270" height="34" fill="#0a0e1a" rx="8" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="65" y="202" fill="#6b7a9f" font-size="12">贷款期限</text>
  <text x="240" y="202" fill="#f0f4ff" font-size="12" text-anchor="end">30 年</text>
  <rect x="340" y="180" width="140" height="34" fill="#0a0e1a" rx="8" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="355" y="202" fill="#6b7a9f" font-size="12">还款方式</text>
  <text x="445" y="202" fill="#f0f4ff" font-size="12" text-anchor="end">等额本息 ▼</text>
  <!-- result area -->
  <rect x="50" y="228" width="580" height="80" fill="rgba(0,229,255,0.04)" rx="10" stroke="rgba(0,229,255,0.15)" stroke-width="1"/>
  <text x="340" y="252" fill="#6b7a9f" font-size="11" text-anchor="middle">计算结果</text>
  <text x="180" y="280" fill="#6b7a9f" font-size="13">每月还款</text>
  <text x="180" y="300" fill="#00e5ff" font-size="24" font-weight="700" text-anchor="middle">4,685 元</text>
  <line x1="330" y1="240" x2="330" y2="296" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="430" y="272" fill="#6b7a9f" font-size="11">总利息</text>
  <text x="430" y="292" fill="#94a3b8" font-size="13">686,613 元</text>
  <text x="530" y="272" fill="#6b7a9f" font-size="11">还款总额</text>
  <text x="530" y="292" fill="#94a3b8" font-size="13">1,686,613 元</text>
  <!-- calculate button -->
  <rect x="250" y="325" width="180" height="36" fill="url(#accent)" rx="999"/>
  <text x="340" y="348" fill="#fff" font-size="14" font-weight="700" text-anchor="middle">🧮 计算</text>
</svg>
