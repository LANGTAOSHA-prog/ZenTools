<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="'Inter',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b18"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>
  <rect width="680" height="400" fill="url(#bg)" rx="14"/>

  <text x="30" y="42" fill="#f0f4ff" font-size="20" font-weight="700">域名年龄检测</text>
  <text x="30" y="66" fill="#6b7a9f" font-size="13">查询域名的注册时间、到期时间，评估域名历史权重</text>

  <rect x="30" y="85" width="620" height="290" fill="rgba(14,22,41,0.8)" rx="14" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

  <text x="50" y="118" fill="#f0f4ff" font-size="15" font-weight="700">输入域名</text>
  <text x="50" y="138" fill="#6b7a9f" font-size="12">输入要查询的域名，获取注册信息和域名年龄</text>

  <rect x="50" y="155" width="580" height="38" fill="#0a0e1a" rx="8" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="65" y="179" fill="#4a5a7a" font-size="13">example.com</text>

  <rect x="50" y="210" width="580" height="155" rx="10" fill="rgba(20,31,55,0.85)" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>

  <text x="70" y="236" fill="#06b6d4" font-size="13" font-weight="600">域名信息</text>

  <text x="82" y="262" fill="#6b7a9f" font-size="11">域名</text>
  <text x="250" y="262" fill="#f0f4ff" font-size="12" font-weight="600">example.com</text>

  <text x="82" y="288" fill="#6b7a9f" font-size="11">注册时间</text>
  <text x="250" y="288" fill="#22c55e" font-size="12" font-weight="600">2015-03-12 (10年)</text>

  <text x="82" y="314" fill="#6b7a9f" font-size="11">到期时间</text>
  <text x="250" y="314" fill="#f0f4ff" font-size="12" font-weight="600">2027-03-12</text>

  <text x="82" y="340" fill="#6b7a9f" font-size="11">注册商</text>
  <text x="250" y="340" fill="#f0f4ff" font-size="12" font-weight="600">Namecheap, Inc.</text>

  <rect x="50" y="335" width="580" height="36" fill="url(#accent)" rx="999"/>
  <text x="340" y="357" fill="#fff" font-size="14" font-weight="600" text-anchor="middle">开始检测</text>
</svg>