<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="'Inter',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b18"/>
    </linearGradient>
    <linearGradient id="resumeHeader" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
  </defs>
  <rect width="680" height="400" fill="url(#bg)" rx="14"/>
  <text x="30" y="42" fill="#f0f4ff" font-size="20" font-weight="700">📄 AI 简历生成器</text>
  <text x="30" y="66" fill="#6b7a9f" font-size="13">使用 AI 生成专业简历和求职信，优化简历内容和格式。</text>
  <rect x="30" y="85" width="620" height="290" fill="rgba(14,22,41,0.8)" rx="14" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  
  <!-- 简历头部 -->
  <rect x="50" y="100" width="580" height="80" rx="10" fill="url(#resumeHeader)" opacity="0.2"/>
  <text x="70" y="130" fill="#f0f4ff" font-size="16" font-weight="600">张三</text>
  <text x="70" y="150" fill="#e2e8f0" font-size="12">高级前端工程师 | 5年经验</text>
  <text x="70" y="170" fill="#94a3b8" font-size="11">zhangsan@email.com | 138-0000-0000</text>
  
  <!-- 简历内容 -->
  <rect x="50" y="195" width="580" height="180" rx="10" fill="rgba(20,31,55,0.9)" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  
  <text x="70" y="220" fill="#8b5cf6" font-size="13" font-weight="600">工作经历</text>
  <text x="70" y="240" fill="#f0f4ff" font-size="12">某科技有限公司 - 前端工程师</text>
  <text x="70" y="260" fill="#94a3b8" font-size="11">• 负责公司核心产品的前端开发，使用 React + TypeScript</text>
  <text x="70" y="280" fill="#94a3b8" font-size="11">• 优化页面性能，首屏加载时间减少 40%</text>
  <text x="70" y="300" fill="#94a3b8" font-size="11">• 带领 3 人小组完成微前端架构迁移</text>
  
  <text x="70" y="330" fill="#8b5cf6" font-size="13" font-weight="600">技能特长</text>
  <text x="70" y="350" fill="#f0f4ff" font-size="12">React, Vue, TypeScript, Node.js, CSS3, 响应式设计</text>
  <text x="70" y="370" fill="#94a3b8" font-size="11">Git, Webpack, Vite, Docker, CI/CD</text>
