<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="'Inter',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b18"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
  </defs>
  <rect width="680" height="400" fill="url(#bg)" rx="14"/>
  <text x="30" y="42" fill="#f0f4ff" font-size="20" font-weight="700">🏦 贷款计算器 - 明细结果</text>
  <text x="30" y="66" fill="#6b7a9f" font-size="13">通过还款明细表查看每月还款金额和利息变化趋势。</text>
  <rect x="30" y="85" width="620" height="290" fill="rgba(14,22,41,0.8)" rx="14" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="50" y="118" fill="#f0f4ff" font-size="15" font-weight="700">还款明细</text>
  <!-- Summary -->
  <rect x="50" y="132" width="580" height="60" rx="10" fill="rgba(0,229,255,0.04)" stroke="rgba(0,229,255,0.12)" stroke-width="1"/>
  <text x="150" y="155" fill="#6b7a9f" font-size="11">每月还款</text>
  <text x="150" y="178" fill="#00e5ff" font-size="20" font-weight="700" text-anchor="middle">4,685 元</text>
  <line x1="270" y1="140" x2="270" y2="185" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="360" y="155" fill="#6b7a9f" font-size="11">总利息</text>
  <text x="360" y="178" fill="#f43f5e" font-size="16" font-weight="700" text-anchor="middle">686,613 元</text>
  <line x1="460" y1="140" x2="460" y2="185" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="540" y="155" fill="#6b7a9f" font-size="11">还款总额</text>
  <text x="540" y="178" fill="#94a3b8" font-size="16" font-weight="700" text-anchor="middle">1,686,613 元</text>
  <!-- Amortization table header -->
  <rect x="50" y="204" width="580" height="28" rx="6" fill="rgba(10,14,26,0.8)" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <text x="100" y="223" fill="#6b7a9f" font-size="11">期数</text>
  <text x="200" y="223" fill="#6b7a9f" font-size="11">月供</text>
  <text x="320" y="223" fill="#6b7a9f" font-size="11">本金</text>
  <text x="430" y="223" fill="#6b7a9f" font-size="11">利息</text>
  <text x="550" y="223" fill="#6b7a9f" font-size="11">剩余本金</text>
  <!-- Rows -->
  <rect x="50" y="237" width="580" height="24" rx="0" fill="rgba(255,255,255,0.01)"/>
  <text x="100" y="255" fill="#f0f4ff" font-size="11">1</text>
  <text x="200" y="255" fill="#f0f4ff" font-size="11">4,685</text>
  <text x="320" y="255" fill="#f0f4ff" font-size="11">1,478</text>
  <text x="430" y="255" fill="#f43f5e" font-size="11">3,207</text>
  <text x="550" y="255" fill="#94a3b8" font-size="11">998,522</text>
  <rect x="50" y="263" width="580" height="24" rx="0" fill="rgba(255,255,255,0.02)"/>
  <text x="100" y="281" fill="#f0f4ff" font-size="11">2</text>
  <text x="200" y="281" fill="#f0f4ff" font-size="11">4,685</text>
  <text x="320" y="281" fill="#f0f4ff" font-size="11">1,487</text>
  <text x="430" y="281" fill="#f43f5e" font-size="11">3,198</text>
  <text x="550" y="281" fill="#94a3b8" font-size="11">997,035</text>
  <rect x="50" y="289" width="580" height="24" rx="0" fill="rgba(255,255,255,0.01)"/>
  <text x="100" y="307" fill="#f0f4ff" font-size="11">3</text>
  <text x="200" y="307" fill="#f0f4ff" font-size="11">4,685</text>
  <text x="320" y="307" fill="#f0f4ff" font-size="11">1,496</text>
  <text x="430" y="307" fill="#f43f5e" font-size="11">3,189</text>
  <text x="550" y="307" fill="#94a3b8" font-size="11">995,539</text>
  <text x="50" y="330" fill="#4a5a7a" font-size="10">显示第 1-3 期，共 360 期（30 年）</text>
  <!-- Download button -->
  <rect x="420" y="318" width="170" height="28" rx="6" fill="rgba(0,229,255,0.1)" stroke="rgba(0,229,255,0.2)" stroke-width="1"/>
  <text x="505" y="337" fill="#00e5ff" font-size="12" font-weight="600" text-anchor="middle">📥 导出明细表</text>
</svg>
