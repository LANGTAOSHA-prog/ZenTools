<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" font-family="'Inter',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b18"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>
  <rect width="680" height="380" fill="url(#bg)" rx="14"/>
  <text x="30" y="42" fill="#f0f4ff" font-size="20" font-weight="700">🤖 AI 写作</text>
  <text x="30" y="66" fill="#6b7a9f" font-size="13">输入主题即可快速生成文章大纲和正文草稿，提高写作效率。</text>
  <rect x="30" y="85" width="620" height="270" fill="rgba(14,22,41,0.8)" rx="14" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

  <!-- Complete status -->
  <circle cx="340" cy="128" r="24" fill="rgba(16,185,129,0.15)" stroke="rgba(16,185,129,0.3)" stroke-width="2"/>
  <text x="340" y="136" fill="#10b981" font-size="26" text-anchor="middle">✓</text>
  <text x="340" y="175" fill="#f0f4ff" font-size="16" font-weight="700" text-anchor="middle">✅ 写作完成</text>
  <text x="340" y="195" fill="#6b7a9f" font-size="13" text-anchor="middle">已生成完整文章草稿，共 860 字</text>

  <!-- Result preview card -->
  <rect x="50" y="215" width="420" height="60" fill="rgba(20,31,55,0.6)" rx="8" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <text x="65" y="238" fill="#6b7a9f" font-size="11" font-weight="600">新手健身入门指南（面向办公室白领）</text>
  <text x="65" y="258" fill="#4a5a7a" font-size="11">长期久坐、缺乏运动是现代白领普遍面临的问题……</text>

  <!-- Action buttons -->
  <rect x="490" y="218" width="100" height="26" fill="rgba(20,31,55,0.8)" rx="6" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="540" y="236" fill="#94a3b8" font-size="11" text-anchor="middle">📋 复制</text>

  <rect x="490" y="252" width="100" height="26" fill="rgba(20,31,55,0.8)" rx="6" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="540" y="270" fill="#94a3b8" font-size="11" text-anchor="middle">📥 下载</text>

  <!-- Regenerate button -->
  <rect x="220" y="295" width="240" height="38" fill="url(#accent)" rx="999"/>
  <text x="340" y="319" fill="#fff" font-size="13" font-weight="700" text-anchor="middle">🔄 重新生成</text>
</svg>
