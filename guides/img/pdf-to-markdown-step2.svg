<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="'Inter',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b18"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>
  <rect width="680" height="400" fill="url(#bg)" rx="14"/>

  <!-- Title -->
  <text x="30" y="42" fill="#f0f4ff" font-size="20" font-weight="700">📝 PDF 转 Markdown</text>
  <text x="30" y="66" fill="#6b7a9f" font-size="13">预览并下载转换后的 Markdown 内容。</text>

  <!-- Tool box -->
  <rect x="30" y="85" width="620" height="290" fill="rgba(14,22,41,0.8)" rx="14" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

  <!-- Toolbar with tabs -->
  <rect x="50" y="105" width="580" height="36" rx="8" fill="rgba(20,31,55,0.85)" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <rect x="50" y="105" width="100" height="36" rx="8" fill="rgba(59,130,246,0.15)"/>
  <text x="100" y="128" fill="#3b82f6" font-size="13" font-weight="600" text-anchor="middle">Markdown</text>
  <text x="190" y="128" fill="#6b7a9f" font-size="13" text-anchor="middle">源码</text>
  <text x="270" y="128" fill="#6b7a9f" font-size="13" text-anchor="middle">预览</text>

  <!-- Success indicator -->
  <rect x="340" y="108" width="60" height="18" rx="9" fill="rgba(16,185,129,0.15)" stroke="rgba(16,185,129,0.3)" stroke-width="1"/>
  <text x="370" y="120" fill="#10b981" font-size="10" text-anchor="middle">转换完成</text>

  <!-- Download button -->
  <rect x="430" y="108" width="90" height="30" rx="6" fill="url(#green)"/>
  <text x="475" y="128" fill="#fff" font-size="12" font-weight="600" text-anchor="middle">下载 .md ⬇</text>

  <!-- Copy button -->
  <rect x="530" y="108" width="90" height="30" rx="6" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <text x="575" y="128" fill="#e2e8f0" font-size="12" text-anchor="middle">复制源码</text>

  <!-- Markdown preview panel -->
  <rect x="50" y="155" width="580" height="200" rx="10" fill="#0a0e1a" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>

  <!-- Line numbers -->
  <line x1="70" y1="155" x2="70" y2="355" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
  <text x="62" y="175" fill="#2a3a5a" font-size="10" text-anchor="end">1</text>
  <text x="62" y="191" fill="#2a3a5a" font-size="10" text-anchor="end">2</text>
  <text x="62" y="207" fill="#2a3a5a" font-size="10" text-anchor="end">3</text>
  <text x="62" y="223" fill="#2a3a5a" font-size="10" text-anchor="end">4</text>
  <text x="62" y="239" fill="#2a3a5a" font-size="10" text-anchor="end">5</text>
  <text x="62" y="255" fill="#2a3a5a" font-size="10" text-anchor="end">6</text>
  <text x="62" y="271" fill="#2a3a5a" font-size="10" text-anchor="end">7</text>
  <text x="62" y="287" fill="#2a3a5a" font-size="10" text-anchor="end">8</text>
  <text x="62" y="303" fill="#2a3a5a" font-size="10" text-anchor="end">9</text>
  <text x="62" y="319" fill="#2a3a5a" font-size="10" text-anchor="end">10</text>
  <text x="62" y="335" fill="#2a3a5a" font-size="10" text-anchor="end">11</text>
  <text x="62" y="351" fill="#2a3a5a" font-size="10" text-anchor="end">12</text>

  <!-- Markdown source code content -->
  <text x="85" y="175" fill="#e879f9" font-size="12" font-weight="700"># 项目需求文档</text>
  <text x="85" y="195" fill="#6b7a9f" font-size="10">日期：2026-06-22</text>
  <text x="85" y="215" fill="#e2e8f0" font-size="12">---</text>
  <text x="85" y="235" fill="#f59e0b" font-size="12" font-weight="600">## 功能概述</text>
  <text x="85" y="255" fill="#8899bb" font-size="11">本系统提供 PDF 文件转换功能，支持将</text>
  <text x="85" y="270" fill="#8899bb" font-size="11">文档内容导出为 Markdown 格式。</text>
  <text x="85" y="290" fill="#f59e0b" font-size="12" font-weight="600">## 核心特性</text>
  <text x="85" y="308" fill="#10b981" font-size="11">- 自动保留标题层级结构</text>
  <text x="85" y="324" fill="#10b981" font-size="11">- 智能识别列表和表格</text>
  <text x="85" y="340" fill="#10b981" font-size="11">- 代码块语法保留高亮</text>

  <!-- Status bar -->
  <rect x="50" y="358" width="580" height="16" rx="0 0 10 10" fill="rgba(20,31,55,0.5)"/>
  <rect x="50" y="366" width="580" height="8" rx="0 0 10 10" fill="rgba(20,31,55,0.5)"/>
  <text x="65" y="371" fill="#4a5a7a" font-size="9">文件：需求文档.pdf → 需求文档.md</text>
  <text x="520" y="371" fill="#4a5a7a" font-size="9">UTF-8 · 12 行</text>
</svg>
