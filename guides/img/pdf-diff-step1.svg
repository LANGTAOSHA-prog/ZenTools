<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="'Inter',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b18"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>
  <rect width="680" height="400" fill="url(#bg)" rx="14"/>

  <!-- Title -->
  <text x="30" y="42" fill="#f0f4ff" font-size="20" font-weight="700">📊 PDF 对比</text>
  <text x="30" y="66" fill="#6b7a9f" font-size="13">上传两个 PDF 文件，快速找出文本和内容差异，差异部分高亮显示。</text>

  <!-- Tool box -->
  <rect x="30" y="85" width="620" height="290" fill="rgba(14,22,41,0.8)" rx="14" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

  <!-- Left-Right split panels header -->
  <rect x="50" y="100" width="280" height="32" fill="#1e293b" rx="8"/>
  <text x="190" y="121" fill="#f0f4ff" font-size="13" font-weight="600" text-anchor="middle">原 PDF (v1.0)</text>

  <rect x="350" y="100" width="280" height="32" fill="#1e293b" rx="8"/>
  <text x="490" y="121" fill="#f0f4ff" font-size="13" font-weight="600" text-anchor="middle">新 PDF (v2.0)</text>

  <!-- Left panel content -->
  <rect x="50" y="140" width="280" height="150" fill="rgba(20,31,55,0.85)" rx="8" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>

  <!-- Left panel text lines -->
  <rect x="65" y="155" width="120" height="8" fill="#3b82f6" rx="4"/>
  <rect x="65" y="172" width="200" height="8" fill="#4a5a7a" rx="4"/>
  <rect x="65" y="189" width="180" height="8" fill="#4a5a7a" rx="4"/>
  <rect x="65" y="206" width="160" height="8" fill="#4a5a7a" rx="4"/>
  <rect x="65" y="223" width="220" height="8" fill="#4a5a7a" rx="4"/>
  <rect x="65" y="240" width="140" height="8" fill="#4a5a7a" rx="4"/>
  <rect x="65" y="257" width="190" height="8" fill="#4a5a7a" rx="4"/>
  <rect x="65" y="274" width="110" height="8" fill="#4a5a7a" rx="4"/>

  <!-- Right panel content -->
  <rect x="350" y="140" width="280" height="150" fill="rgba(20,31,55,0.85)" rx="8" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>

  <!-- Right panel text lines with diff highlights -->
  <rect x="365" y="155" width="120" height="8" fill="#3b82f6" rx="4"/>
  <rect x="365" y="172" width="200" height="8" fill="#4a5a7a" rx="4"/>
  <rect x="365" y="189" width="180" height="8" fill="rgba(239,68,68,0.6)" rx="4"/>
  <rect x="365" y="206" width="160" height="8" fill="#4a5a7a" rx="4"/>
  <rect x="365" y="223" width="220" height="8" fill="#4a5a7a" rx="4"/>
  <rect x="365" y="240" width="140" height="8" fill="rgba(34,197,94,0.6)" rx="4"/>
  <rect x="365" y="257" width="190" height="8" fill="#4a5a7a" rx="4"/>
  <rect x="365" y="274" width="110" height="8" fill="#4a5a7a" rx="4"/>

  <!-- Diff labels on right panel -->
  <rect x="545" y="186" width="70" height="14" fill="rgba(239,68,68,0.25)" rx="3" stroke="rgba(239,68,68,0.5)" stroke-width="0.5"/>
  <text x="580" y="197" fill="#ef4444" font-size="9" text-anchor="middle">已修改</text>

  <rect x="545" y="237" width="70" height="14" fill="rgba(34,197,94,0.25)" rx="3" stroke="rgba(34,197,94,0.5)" stroke-width="0.5"/>
  <text x="580" y="248" fill="#22c55e" font-size="9" text-anchor="middle">已新增</text>

  <!-- Sync scroll slider -->
  <rect x="50" y="302" width="580" height="6" fill="#1e293b" rx="3"/>
  <rect x="50" y="302" width="250" height="6" fill="url(#accent)" rx="3"/>

  <rect x="170" y="298" width="14" height="14" fill="#f0f4ff" rx="7"/>

  <!-- Modes bar -->
  <rect x="50" y="320" width="580" height="34" fill="rgba(20,31,55,0.8)" rx="8" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>

  <!-- Mode pills -->
  <rect x="60" y="327" width="60" height="20" fill="url(#accent)" rx="10"/>
  <text x="90" y="341" fill="#fff" font-size="10" font-weight="600" text-anchor="middle">文本</text>

  <rect x="128" y="327" width="60" height="20" fill="#1e293b" rx="10" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="158" y="341" fill="#6b7a9f" font-size="10" font-weight="600" text-anchor="middle">视觉</text>

  <rect x="196" y="327" width="60" height="20" fill="#1e293b" rx="10" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="226" y="341" fill="#6b7a9f" font-size="10" font-weight="600" text-anchor="middle">全部</text>

  <!-- Compare button -->
  <rect x="510" y="324" width="110" height="26" fill="url(#accent)" rx="6"/>
  <text x="565" y="342" fill="#fff" font-size="12" font-weight="600" text-anchor="middle">开始对比</text>

  <!-- Stats bar -->
  <rect x="50" y="362" width="580" height="10" rx="0"/>
  <text x="70" y="370" fill="#6b7a9f" font-size="10">差异统计：</text>
  <rect x="140" y="365" width="8" height="8" fill="#22c55e" rx="2"/>
  <text x="152" y="373" fill="#22c55e" font-size="10">新增 3 处</text>
  <rect x="230" y="365" width="8" height="8" fill="#ef4444" rx="2"/>
  <text x="242" y="373" fill="#ef4444" font-size="10">删除 1 处</text>
  <rect x="320" y="365" width="8" height="8" fill="#f59e0b" rx="2"/>
  <text x="332" y="373" fill="#f59e0b" font-size="10">修改 2 处</text>
</svg>
