<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" font-family="'Inter',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b18"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="680" height="380" fill="url(#bg)" rx="14"/>
  <text x="30" y="42" fill="#f0f4ff" font-size="20" font-weight="700">🎨 图片滤镜</text>
  <text x="30" y="66" fill="#6b7a9f" font-size="13">为图片添加多种滤镜效果，一键改变照片风格。</text>
  <rect x="30" y="85" width="620" height="275" fill="rgba(14,22,41,0.8)" rx="14" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="50" y="118" fill="#f0f4ff" font-size="15" font-weight="700">滤镜选择</text>
  <rect x="50" y="135" width="280" height="200" rx="12" fill="rgba(20,31,55,0.85)" stroke="rgba(59,130,246,0.4)" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="190" y="195" fill="#6b7a9f" font-size="32" text-anchor="middle">🎨</text>
  <text x="190" y="225" fill="#8899bb" font-size="13" text-anchor="middle">点击上传要加滤镜的图片</text>
  <text x="190" y="245" fill="#4a5a7a" font-size="11" text-anchor="middle">JPG、PNG、WebP</text>
  <rect x="110" y="268" width="160" height="34" fill="url(#accent)" rx="8"/>
  <text x="190" y="290" fill="#fff" font-size="12" font-weight="600" text-anchor="middle">选择文件</text>
  <rect x="350" y="135" width="280" height="200" rx="12" fill="rgba(20,31,55,0.85)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="490" y="160" fill="#f0f4ff" font-size="13" font-weight="600" text-anchor="middle">滤镜效果</text>
  <rect x="365" y="175" width="75" height="55" rx="6" fill="#1e293b" stroke="rgba(59,130,246,0.3)" stroke-width="1"/>
  <text x="402" y="195" fill="#f0f4ff" font-size="10" text-anchor="middle">◉ 原图</text>
  <rect x="385" y="205" width="35" height="15" rx="3" fill="#3b82f6" opacity="0.4"/>
  <rect x="450" y="175" width="75" height="55" rx="6" fill="#1e293b"/>
  <text x="487" y="195" fill="#8899bb" font-size="10" text-anchor="middle">灰度</text>
  <rect x="470" y="205" width="35" height="15" rx="3" fill="#666" opacity="0.6"/>
  <rect x="535" y="175" width="75" height="55" rx="6" fill="#1e293b"/>
  <text x="572" y="195" fill="#8899bb" font-size="10" text-anchor="middle">暖色</text>
  <rect x="555" y="205" width="35" height="15" rx="3" fill="#f59e0b" opacity="0.5"/>
  <rect x="365" y="240" width="75" height="55" rx="6" fill="#1e293b"/>
  <text x="402" y="260" fill="#8899bb" font-size="10" text-anchor="middle">冷色</text>
  <rect x="385" y="270" width="35" height="15" rx="3" fill="#3b82f6" opacity="0.6"/>
  <rect x="450" y="240" width="75" height="55" rx="6" fill="#1e293b"/>
  <text x="487" y="260" fill="#8899bb" font-size="10" text-anchor="middle">复古</text>
  <rect x="470" y="270" width="35" height="15" rx="3" fill="#8b5cf6" opacity="0.5"/>
  <rect x="535" y="240" width="75" height="55" rx="6" fill="#1e293b"/>
  <text x="572" y="260" fill="#8899bb" font-size="10" text-anchor="middle">胶片</text>
  <rect x="555" y="270" width="35" height="15" rx="3" fill="#10b981" opacity="0.5"/>
</svg>