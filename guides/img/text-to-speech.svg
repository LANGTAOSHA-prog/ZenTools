<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" font-family="'Inter',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b18"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="680" height="380" fill="url(#bg)" rx="14"/>
  <text x="30" y="42" fill="#f0f4ff" font-size="20" font-weight="700">🔊 文字转语音</text>
  <text x="30" y="66" fill="#6b7a9f" font-size="13">输入文字内容，选择语音和语速，即可生成朗读音频并下载。</text>
  <rect x="30" y="85" width="620" height="270" fill="rgba(14,22,41,0.8)" rx="14" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="50" y="118" fill="#f0f4ff" font-size="15" font-weight="700">🔊 文字转语音</text>
  <!-- text input area -->
  <rect x="50" y="132" width="580" height="60" fill="#0a0e1a" rx="8" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="65" y="155" fill="#94a3b8" font-size="13">欢迎使用 ZenTools！这是一个免费的在线工具箱。</text>
  <text x="65" y="175" fill="#94a3b8" font-size="13">提供 PDF 处理、图片编辑、AI 辅助等 200+ 款工具。</text>
  <!-- voice select chips -->
  <rect x="50" y="204" height="30" width="120" rx="6" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="110" y="224" fill="#3b82f6" font-size="12" text-anchor="middle">🇨🇳 中文 (普通话)</text>
  <rect x="180" y="204" height="30" width="110" rx="6" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="235" y="224" fill="#6b7a9f" font-size="12" text-anchor="middle">🇺🇸 English (US)</text>
  <rect x="300" y="204" height="30" width="90" rx="6" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="345" y="224" fill="#6b7a9f" font-size="12" text-anchor="middle">🇯🇵 日本語</text>
  <!-- speed -->
  <text x="50" y="260" fill="#6b7a9f" font-size="12">语速：</text>
  <text x="88" y="256" fill="#6b7a9f" font-size="11">慢</text>
  <rect x="108" y="252" width="160" height="6" fill="rgba(255,255,255,0.08)" rx="6"/>
  <circle cx="175" cy="255" r="7" fill="#fff" stroke="#3b82f6" stroke-width="2"/>
  <text x="278" y="256" fill="#6b7a9f" font-size="11">快</text>
  <text x="310" y="258" fill="#f0f4ff" font-size="11">1.0x</text>
  <!-- action buttons -->
  <rect x="130" y="280" width="160" height="38" fill="url(#accent)" rx="999"/>
  <text x="210" y="304" fill="#fff" font-size="14" font-weight="700" text-anchor="middle">🔊 朗读</text>
  <rect x="310" y="280" width="180" height="38" fill="rgba(20,31,55,0.9)" rx="999" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="400" y="304" fill="#6b7a9f" font-size="14" font-weight="600" text-anchor="middle">📥 下载 MP3</text>
</svg>
