<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="'Inter',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b18"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>
  <rect width="680" height="400" fill="url(#bg)" rx="14"/>

  <text x="30" y="42" fill="#f0f4ff" font-size="20" font-weight="700">外链检测</text>
  <text x="30" y="66" fill="#6b7a9f" font-size="13">检测和分析网站的外链情况，评估外链质量和数量</text>

  <rect x="30" y="85" width="620" height="290" fill="rgba(14,22,41,0.8)" rx="14" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

  <text x="50" y="118" fill="#f0f4ff" font-size="15" font-weight="700">输入网址</text>
  <text x="50" y="138" fill="#6b7a9f" font-size="12">输入目标网站URL，分析其外链概况</text>

  <rect x="50" y="155" width="580" height="38" fill="#0a0e1a" rx="8" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="65" y="179" fill="#4a5a7a" font-size="13">https://example.com</text>

  <rect x="50" y="210" width="580" height="155" rx="10" fill="rgba(20,31,55,0.85)" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>

  <text x="70" y="236" fill="#06b6d4" font-size="13" font-weight="600">外链分析结果</text>

  <rect x="70" y="252" width="170" height="56" rx="8" fill="rgba(6,182,212,0.08)" stroke="rgba(6,182,212,0.2)" stroke-width="1"/>
  <text x="155" y="275" fill="#06b6d4" font-size="24" font-weight="700" text-anchor="middle">1,247</text>
  <text x="155" y="296" fill="#6b7a9f" font-size="11" text-anchor="middle">总外链数</text>

  <rect x="255" y="252" width="170" height="56" rx="8" fill="rgba(34,197,94,0.08)" stroke="rgba(34,197,94,0.2)" stroke-width="1"/>
  <text x="340" y="275" fill="#22c55e" font-size="24" font-weight="700" text-anchor="middle">89</text>
  <text x="340" y="296" fill="#6b7a9f" font-size="11" text-anchor="middle">引用域名</text>

  <rect x="440" y="252" width="170" height="56" rx="8" fill="rgba(245,158,11,0.08)" stroke="rgba(245,158,11,0.2)" stroke-width="1"/>
  <text x="525" y="275" fill="#f59e0b" font-size="24" font-weight="700" text-anchor="middle">DA 45</text>
  <text x="525" y="296" fill="#6b7a9f" font-size="11" text-anchor="middle">域名权重</text>

  <rect x="50" y="335" width="580" height="36" fill="url(#accent)" rx="999"/>
  <text x="340" y="357" fill="#fff" font-size="14" font-weight="600" text-anchor="middle">开始检测</text>
</svg>