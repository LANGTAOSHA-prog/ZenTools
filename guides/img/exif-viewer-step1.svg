<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" font-family="'Inter',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b18"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="680" height="380" fill="url(#bg)" rx="14"/>
  <text x="30" y="42" fill="#f0f4ff" font-size="20" font-weight="700">📷 EXIF 查看</text>
  <text x="30" y="66" fill="#6b7a9f" font-size="13">查看图片的 EXIF 元数据信息，包括相机、GPS 和时间等。</text>
  <rect x="30" y="85" width="620" height="275" fill="rgba(14,22,41,0.8)" rx="14" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="50" y="118" fill="#f0f4ff" font-size="15" font-weight="700">EXIF 数据</text>
  <!-- Upload zone -->
  <rect x="50" y="135" width="280" height="200" rx="12" fill="rgba(20,31,55,0.85)" stroke="rgba(59,130,246,0.4)" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="190" y="195" fill="#6b7a9f" font-size="32" text-anchor="middle">📷</text>
  <text x="190" y="225" fill="#8899bb" font-size="13" text-anchor="middle">点击上传要查看 EXIF 的图片</text>
  <text x="190" y="245" fill="#4a5a7a" font-size="11" text-anchor="middle">JPG、PNG、WebP、TIFF</text>
  <rect x="110" y="268" width="160" height="34" fill="url(#accent)" rx="8"/>
  <text x="190" y="290" fill="#fff" font-size="12" font-weight="600" text-anchor="middle">选择文件</text>
  <!-- EXIF info panel -->
  <rect x="350" y="135" width="280" height="200" rx="12" fill="rgba(20,31,55,0.85)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="490" y="160" fill="#f0f4ff" font-size="13" font-weight="600" text-anchor="middle">EXIF 信息示例</text>
  <line x1="365" y1="172" x2="615" y2="172" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="365" y="192" fill="#f59e0b" font-size="10" font-family="monospace">▶ 相机</text>
  <text x="400" y="192" fill="#f0f4ff" font-size="10" font-family="monospace"> Canon EOS R5</text>
  <text x="365" y="208" fill="#f59e0b" font-size="10" font-family="monospace">▶ 镜头</text>
  <text x="400" y="208" fill="#f0f4ff" font-size="10" font-family="monospace"> RF 24-70mm f/2.8</text>
  <text x="365" y="224" fill="#f59e0b" font-size="10" font-family="monospace">▶ 光圈</text>
  <text x="400" y="224" fill="#f0f4ff" font-size="10" font-family="monospace"> f/2.8</text>
  <text x="365" y="240" fill="#f59e0b" font-size="10" font-family="monospace">▶ 快门</text>
  <text x="400" y="240" fill="#f0f4ff" font-size="10" font-family="monospace"> 1/125s</text>
  <text x="365" y="256" fill="#f59e0b" font-size="10" font-family="monospace">▶ ISO</text>
  <text x="400" y="256" fill="#f0f4ff" font-size="10" font-family="monospace"> 400</text>
  <text x="365" y="272" fill="#f59e0b" font-size="10" font-family="monospace">▶ 焦距</text>
  <text x="400" y="272" fill="#f0f4ff" font-size="10" font-family="monospace"> 50mm</text>
  <text x="365" y="288" fill="#f59e0b" font-size="10" font-family="monospace">▶ 拍摄日期</text>
  <text x="400" y="288" fill="#f0f4ff" font-size="10" font-family="monospace"> 2026:06:21 14:30</text>
  <text x="365" y="304" fill="#f59e0b" font-size="10" font-family="monospace">▶ GPS</text>
  <text x="400" y="304" fill="#f0f4ff" font-size="10" font-family="monospace"> 39.9042°N, 116.4074°E</text>
  <text x="365" y="320" fill="#6b7a9f" font-size="10" font-family="monospace">共发现 28 项 EXIF 数据</text>
</svg>