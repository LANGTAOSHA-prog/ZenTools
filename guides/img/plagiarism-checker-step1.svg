<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="'Inter',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b18"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="warn" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
  </defs>
  <rect width="680" height="400" fill="url(#bg)" rx="14"/>

  <text x="30" y="42" fill="#f0f4ff" font-size="20" font-weight="700">抄袭检测器</text>
  <text x="30" y="66" fill="#6b7a9f" font-size="13">粘贴文本，检测与网上内容的重复率。</text>
  <rect x="30" y="85" width="620" height="295" fill="rgba(14,22,41,0.8)" rx="14" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <rect x="50" y="105" width="580" height="115" rx="10" fill="#0a0e1a" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="65" y="130" fill="#4a5a7a" font-size="13">在此粘贴需要检测的文本...</text>
  <rect x="50" y="235" width="180" height="38" fill="url(#accent)" rx="10"/>
  <text x="140" y="259" fill="#fff" font-size="13" font-weight="700" text-anchor="middle">开始检测</text>
  <rect x="245" y="235" width="100" height="38" stroke="rgba(255,255,255,0.08)" stroke-width="1" rx="10" fill="rgba(255,255,255,0.03)"/>
  <text x="295" y="259" fill="#8899bb" font-size="13" font-weight="600" text-anchor="middle">清空</text>
  <rect x="50" y="290" width="580" height="55" rx="10" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  <text x="340" y="315" fill="#4a5a7a" font-size="36" text-anchor="middle">--</text>
  <text x="340" y="335" fill="#4a5a7a" font-size="12" text-anchor="middle">抄袭率</text>

</svg>