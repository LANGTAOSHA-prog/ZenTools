<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="'Inter',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
<defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0f172a"/><stop offset="100%" stop-color="#070b18"/></linearGradient><linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#3b82f6"/><stop offset="100%" stop-color="#8b5cf6"/></linearGradient></defs>
<rect width="680" height="400" fill="url(#bg)" rx="14"/>
<text x="30" y="42" fill="#f0f4ff" font-size="20" font-weight="700">🏖️ 退休计算器</text><text x="30" y="66" fill="#6b7a9f" font-size="13">计算退休所需储蓄，制定养老金和退休储蓄规划。</text>
<rect x="30" y="85" width="620" height="290" fill="rgba(14,22,41,0.8)" rx="14" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
<rect x="50" y="100" width="140" height="36" fill="url(#accent)" rx="8"/><text x="120" y="123" fill="#fff" font-size="13" font-weight="600" text-anchor="middle">退休规划</text>
<rect x="200" y="100" width="120" height="36" fill="rgba(255,255,255,0.06)" rx="8"/><text x="260" y="123" fill="#6b7a9f" font-size="13" text-anchor="middle">养老金测算</text>
<text x="50" y="158" fill="#f0f4ff" font-size="14" font-weight="700">当前年龄: 30 岁</text>
<text x="50" y="183" fill="#f0f4ff" font-size="14" font-weight="700">目标退休年龄: 60 岁</text>
<text x="50" y="208" fill="#f0f4ff" font-size="14" font-weight="700">每月生活费: 8,000 元</text>
<text x="50" y="233" fill="#f0f4ff" font-size="14" font-weight="700">当前储蓄: 200,000 元</text>
<text x="50" y="258" fill="#f0f4ff" font-size="14" font-weight="700">预期年化收益: 5%</text>
<rect x="50" y="278" width="580" height="80" fill="#0f1a35" rx="10" stroke="rgba(0,229,255,0.15)" stroke-width="1"/>
<text x="70" y="303" fill="#6b7a9f" font-size="13">退休所需总金额: <tspan fill="#00e5ff" font-weight="700">2,880,000</tspan> 元</text>
<text x="70" y="330" fill="#6b7a9f" font-size="13">每月需储蓄: <tspan fill="#34d399" font-weight="700">1,847</tspan> 元</text>
</svg>
