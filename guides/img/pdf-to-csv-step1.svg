<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="'Inter',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b18"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
  </defs>
  <rect width="680" height="400" fill="url(#bg)" rx="14"/>

  <!-- Title -->
  <text x="30" y="42" fill="#f0f4ff" font-size="20" font-weight="700">📊 PDF 转 CSV</text>
  <text x="30" y="66" fill="#6b7a9f" font-size="13">将 PDF 表格、报表、数据列表转换为 CSV 结构化数据，一键导出。</text>

  <!-- Tool box -->
  <rect x="30" y="85" width="620" height="290" fill="rgba(14,22,41,0.8)" rx="14" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

  <!-- Section: Upload -->
  <text x="50" y="118" fill="#f0f4ff" font-size="14" font-weight="700">上传 PDF 文件</text>
  <rect x="50" y="128" width="270" height="80" rx="10" fill="rgba(20,31,55,0.85)" stroke="rgba(59,130,246,0.4)" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="185" y="164" fill="#6b7a9f" font-size="28" text-anchor="middle">📄</text>
  <text x="185" y="190" fill="#8899bb" font-size="11" text-anchor="middle">点击或拖拽 PDF 到此处</text>

  <!-- Section: Delimiter -->
  <text x="50" y="228" fill="#f0f4ff" font-size="14" font-weight="700">分隔符选择</text>
  <rect x="50" y="238" width="270" height="34" fill="#0a0e1a" rx="8" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <rect x="50" y="238" width="68" height="34" fill="url(#accent)" rx="8"/>
  <text x="84" y="260" fill="#fff" font-size="12" font-weight="600" text-anchor="middle">逗号</text>
  <text x="141" y="260" fill="#6b7a9f" font-size="12" font-weight="500" text-anchor="middle">制表符</text>
  <text x="230" y="260" fill="#6b7a9f" font-size="12" font-weight="500" text-anchor="middle">分号</text>

  <!-- Convert button -->
  <rect x="50" y="285" width="270" height="36" fill="url(#greenGrad)" rx="999"/>
  <text x="185" y="308" fill="#fff" font-size="14" font-weight="700" text-anchor="middle">开始转换</text>

  <!-- CSV preview panel -->
  <rect x="340" y="108" width="290" height="250" fill="rgba(20,31,55,0.5)" rx="10" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <rect x="340" y="108" width="290" height="24" rx="10" fill="rgba(255,255,255,0.03)"/>
  <text x="485" y="124" fill="#6b7a9f" font-size="10" text-anchor="middle">CSV 预览</text>

  <!-- CSV table header -->
  <rect x="355" y="140" width="260" height="22" fill="rgba(59,130,246,0.15)" rx="4"/>
  <text x="367" y="155" fill="#8899bb" font-size="10" font-weight="600">姓名</text>
  <text x="427" y="155" fill="#8899bb" font-size="10" font-weight="600">部门</text>
  <text x="490" y="155" fill="#8899bb" font-size="10" font-weight="600">职位</text>
  <text x="550" y="155" fill="#8899bb" font-size="10" font-weight="600">薪资</text>

  <!-- CSV rows -->
  <text x="367" y="177" fill="#4a5a7a" font-size="10">张三</text>
  <text x="427" y="177" fill="#4a5a7a" font-size="10">技术部</text>
  <text x="490" y="177" fill="#4a5a7a" font-size="10">高级工程师</text>
  <text x="550" y="177" fill="#4a5a7a" font-size="10">25000</text>
  <line x1="355" y1="183" x2="615" y2="183" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>

  <text x="367" y="198" fill="#4a5a7a" font-size="10">李四</text>
  <text x="427" y="198" fill="#4a5a7a" font-size="10">市场部</text>
  <text x="490" y="198" fill="#4a5a7a" font-size="10">运营总监</text>
  <text x="550" y="198" fill="#4a5a7a" font-size="10">30000</text>
  <line x1="355" y1="204" x2="615" y2="204" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>

  <text x="367" y="219" fill="#4a5a7a" font-size="10">王五</text>
  <text x="427" y="219" fill="#4a5a7a" font-size="10">人事部</text>
  <text x="490" y="219" fill="#4a5a7a" font-size="10">HR 经理</text>
  <text x="550" y="219" fill="#4a5a7a" font-size="10">20000</text>
  <line x1="355" y1="225" x2="615" y2="225" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>

  <text x="367" y="240" fill="#4a5a7a" font-size="10">赵六</text>
  <text x="427" y="240" fill="#4a5a7a" font-size="10">财务部</text>
  <text x="490" y="240" fill="#4a5a7a" font-size="10">会计主管</text>
  <text x="550" y="240" fill="#4a5a7a" font-size="10">22000</text>

  <!-- Download button in preview -->
  <rect x="355" y="320" width="260" height="28" fill="url(#accent)" rx="6"/>
  <text x="485" y="339" fill="#fff" font-size="12" font-weight="600" text-anchor="middle">下载 CSV</text>
</svg>
