<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="'Inter',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
<defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0f172a"/><stop offset="100%" stop-color="#070b18"/></linearGradient></defs>
<rect width="680" height="400" fill="url(#bg)" rx="14"/>
<text x="30" y="42" fill="#f0f4ff" font-size="20" font-weight="700">🎲 随机数生成器</text><text x="30" y="66" fill="#6b7a9f" font-size="13">生成指定范围内的随机数、随机列表和随机排序。</text>
<rect x="30" y="85" width="620" height="290" fill="rgba(14,22,41,0.8)" rx="14" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
<text x="50" y="120" fill="#f0f4ff" font-size="14">最小值</text>
<rect x="50" y="130" width="270" height="42" fill="#0a0e1a" rx="8" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
<text x="70" y="156" fill="#f0f4ff" font-size="18" font-weight="600">1</text>
<text x="350" y="120" fill="#f0f4ff" font-size="14">最大值</text>
<rect x="350" y="130" width="270" height="42" fill="#0a0e1a" rx="8" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
<text x="370" y="156" fill="#f0f4ff" font-size="18" font-weight="600">100</text>
<rect x="50" y="200" width="570" height="42" fill="#0a0e1a" rx="8" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
<text x="65" y="225" fill="#8899bb" font-size="14">生成数量: 5</text>
<rect x="200" y="265" width="280" height="44" fill="url(#bg)" rx="10" stroke="rgba(59,130,246,0.4)" stroke-width="1.5"/>
<text x="340" y="293" fill="#60a5fa" font-size="16" font-weight="700" text-anchor="middle">🎲 生成随机数</text>
<text x="50" y="340" fill="#00e5ff" font-size="13" font-weight="600">结果: 42, 17, 89, 3, 55</text>
<text x="540" y="340" fill="#6b7a9f" font-size="11">📋 复制</text>
</svg>
