<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b18"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="680" height="400" fill="url(#bg)" rx="12"/>
  <text x="340" y="48" text-anchor="middle" fill="url(#accent)" font-size="20" font-weight="700" font-family="system-ui,sans-serif">Base Converter</text>
  <text x="340" y="68" text-anchor="middle" fill="#64748b" font-size="11" font-family="system-ui,sans-serif">进制转换器 - Base Converter</text>
  <!-- Input card -->
  <rect x="40" y="90" width="260" height="280" rx="12" fill="url(#card)" stroke="#334155" stroke-width="1"/>
  <text x="60" y="118" fill="#94a3b8" font-size="12" font-weight="600" font-family="system-ui,sans-serif">输入数值</text>
  <rect x="60" y="130" width="220" height="42" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="74" y="157" fill="#e2e8f0" font-size="18" font-family="monospace">255</text>
  <text x="270" y="157" fill="#64748b" font-size="14" font-family="system-ui,sans-serif">⌄</text>
  <text x="60" y="198" fill="#94a3b8" font-size="11" font-family="system-ui,sans-serif">进制选择</text>
  <rect x="60" y="206" width="105" height="30" rx="6" fill="#06b6d4" opacity="0.2" stroke="#06b6d4" stroke-width="1"/>
  <text x="112" y="226" fill="#06b6d4" font-size="12" font-weight="600" font-family="system-ui,sans-serif" text-anchor="middle">十进制</text>
  <rect x="170" y="206" width="110" height="30" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="225" y="226" fill="#94a3b8" font-size="12" font-family="system-ui,sans-serif" text-anchor="middle">十六进制</text>
  <rect x="60" y="244" width="105" height="30" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="112" y="264" fill="#94a3b8" font-size="12" font-family="system-ui,sans-serif" text-anchor="middle">二进制</text>
  <rect x="170" y="244" width="110" height="30" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="225" y="264" fill="#94a3b8" font-size="12" font-family="system-ui,sans-serif" text-anchor="middle">八进制</text>
  <!-- Output card -->
  <rect x="330" y="90" width="310" height="280" rx="12" fill="url(#card)" stroke="#334155" stroke-width="1"/>
  <text x="350" y="118" fill="#94a3b8" font-size="12" font-weight="600" font-family="system-ui,sans-serif">转换结果</text>
  <rect x="350" y="130" width="270" height="36" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="364" y="153" fill="#06b6d4" font-size="13" font-weight="600" font-family="system-ui,sans-serif">HEX:</text>
  <text x="410" y="153" fill="#e2e8f0" font-size="13" font-family="monospace">FF</text>
  <rect x="350" y="174" width="270" height="36" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="364" y="197" fill="#8b5cf6" font-size="13" font-weight="600" font-family="system-ui,sans-serif">BIN:</text>
  <text x="410" y="197" fill="#e2e8f0" font-size="13" font-family="monospace">11111111</text>
  <rect x="350" y="218" width="270" height="36" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="364" y="241" fill="#10b981" font-size="13" font-weight="600" font-family="system-ui,sans-serif">OCT:</text>
  <text x="410" y="241" fill="#e2e8f0" font-size="13" font-family="monospace">377</text>
  <rect x="350" y="262" width="270" height="36" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="364" y="285" fill="#f59e0b" font-size="13" font-weight="600" font-family="system-ui,sans-serif">DEC:</text>
  <text x="410" y="285" fill="#e2e8f0" font-size="13" font-family="monospace">255</text>
  <rect x="350" y="310" width="270" height="40" rx="8" fill="url(#accent)" opacity="0.15" stroke="url(#accent)" stroke-width="1"/>
  <text x="485" y="335" fill="#06b6d4" font-size="13" font-weight="700" font-family="system-ui,sans-serif" text-anchor="middle">双向即时转换</text>
</svg>