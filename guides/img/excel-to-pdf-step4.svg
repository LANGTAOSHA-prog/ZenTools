<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" font-family="'Inter',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b18"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>
  <rect width="680" height="380" fill="url(#bg)" rx="14"/>

  <!-- Title -->
  <text x="30" y="42" fill="#f0f4ff" font-size="20" font-weight="700">📊 Excel 转 PDF</text>
  <text x="30" y="66" fill="#6b7a9f" font-size="13">编辑表格数据，点击生成 PDF，一键导出整洁文档。</text>

  <!-- Tool box -->
  <rect x="30" y="85" width="620" height="270" fill="rgba(14,22,41,0.8)" rx="14" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

  <!-- Large success checkmark -->
  <circle cx="340" cy="130" r="30" fill="rgba(16,185,129,0.12)" stroke="rgba(16,185,129,0.25)" stroke-width="2"/>
  <text x="340" y="140" fill="#10b981" font-size="28" text-anchor="middle">✓</text>

  <text x="340" y="186" fill="#f0f4ff" font-size="16" font-weight="700" text-anchor="middle">📥 已保存到本地</text>
  <text x="340" y="210" fill="#6b7a9f" font-size="13" text-anchor="middle">文件「表格数据.pdf」已下载到默认下载目录</text>

  <!-- Open file suggestion -->
  <rect x="80" y="228" width="520" height="40" fill="rgba(255,255,255,0.02)" rx="8" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <text x="340" y="250" fill="#94a3b8" font-size="12" text-anchor="middle">📂 可在文件管理器中找到并打开 PDF 文件</text>

  <!-- Back to edit button -->
  <rect x="170" y="282" width="150" height="38" fill="rgba(59,130,246,0.2)" rx="999" stroke="rgba(59,130,246,0.3)" stroke-width="1"/>
  <text x="245" y="306" fill="#60a5fa" font-size="13" font-weight="600" text-anchor="middle">← 继续编辑</text>

  <!-- New conversion button -->
  <rect x="340" y="282" width="150" height="38" fill="url(#green)" rx="999"/>
  <text x="415" y="306" fill="#fff" font-size="13" font-weight="600" text-anchor="middle">新建表格</text>
</svg>
