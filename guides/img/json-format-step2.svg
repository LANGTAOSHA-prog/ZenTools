<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" font-family="'Inter',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b18"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="680" height="420" fill="url(#bg)" rx="14"/>
  <text x="30" y="42" fill="#f0f4ff" font-size="20" font-weight="700">💻 JSON 格式化</text>
  <text x="30" y="66" fill="#6b7a9f" font-size="13">快速格式化、压缩和验证 JSON 数据，支持语法高亮和错误提示。</text>
  <rect x="30" y="85" width="620" height="310" fill="rgba(14,22,41,0.8)" rx="14" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="50" y="118" fill="#f0f4ff" font-size="15" font-weight="700">JSON 数据处理</text>

  <!-- Input area (smaller) -->
  <rect x="50" y="135" width="280" height="130" fill="#0a0e1a" rx="8" stroke="rgba(59,130,246,0.2)" stroke-width="1"/>
  <text x="65" y="158" fill="#4a5a7a" font-size="10" font-family="'JetBrains Mono',monospace">{"users":[{"id":1,"name":"张三"</text>
  <text x="65" y="174" fill="#4a5a7a" font-size="10" font-family="'JetBrains Mono',monospace">,"email":"zhang@example.com"</text>
  <text x="65" y="190" fill="#4a5a7a" font-size="10" font-family="'JetBrains Mono',monospace">,"age":28,"city":"北京"},</text>
  <text x="65" y="206" fill="#4a5a7a" font-size="10" font-family="'JetBrains Mono',monospace">{"id":2,"name":"李四","email"</text>
  <text x="65" y="222" fill="#4a5a7a" font-size="10" font-family="'JetBrains Mono',monospace">:"li@example.com","age":35,</text>
  <text x="65" y="238" fill="#4a5a7a" font-size="10" font-family="'JetBrains Mono',monospace">"city":"上海"}]}</text>

  <!-- Arrow -->
  <text x="345" y="200" fill="#3b82f6" font-size="24">→</text>
  <text x="345" y="215" fill="#4a5a7a" font-size="10">格式化</text>

  <!-- Result area (formatted) -->
  <rect x="370" y="135" width="260" height="180" fill="#0a0e1a" rx="8" stroke="#10b981" stroke-width="1"/>
  <text x="385" y="158" fill="#22c55e" font-size="10" font-family="'JetBrains Mono',monospace">{</text>
  <text x="385" y="174" fill="#94a3b8" font-size="10" font-family="'JetBrains Mono',monospace">  "users": [</text>
  <text x="385" y="190" fill="#94a3b8" font-size="10" font-family="'JetBrains Mono',monospace">    {</text>
  <text x="395" y="206" fill="#e879f9" font-size="10" font-family="'JetBrains Mono',monospace">      "id": <tspan fill="#facc15">1</tspan>,</text>
  <text x="395" y="222" fill="#e879f9" font-size="10" font-family="'JetBrains Mono',monospace">      "name": <tspan fill="#22c55e">"张三"</tspan>,</text>
  <text x="395" y="238" fill="#e879f9" font-size="10" font-family="'JetBrains Mono',monospace">      "email": <tspan fill="#22c55e">"zhang@example.com"</tspan>,</text>
  <text x="395" y="254" fill="#e879f9" font-size="10" font-family="'JetBrains Mono',monospace">      "age": <tspan fill="#facc15">28</tspan>,</text>
  <text x="395" y="270" fill="#e879f9" font-size="10" font-family="'JetBrains Mono',monospace">      "city": <tspan fill="#22c55e">"北京"</tspan></text>
  <text x="385" y="286" fill="#94a3b8" font-size="10" font-family="'JetBrains Mono',monospace">    },</text>
  <text x="385" y="302" fill="#4a5a7a" font-size="10" font-family="'JetBrains Mono',monospace">    ...</text>

  <!-- Action buttons -->
  <rect x="50" y="280" width="120" height="34" fill="url(#accent)" rx="8"/>
  <text x="110" y="302" fill="#fff" font-size="12" font-weight="600" text-anchor="middle">格式化</text>

  <rect x="180" y="280" width="100" height="34" fill="rgba(20,31,55,0.9)" rx="8" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="230" y="302" fill="#94a3b8" font-size="12" font-weight="600" text-anchor="middle">压缩</text>

  <rect x="290" y="280" width="100" height="34" fill="rgba(20,31,55,0.9)" rx="8" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="340" y="302" fill="#94a3b8" font-size="12" font-weight="600" text-anchor="middle">校验</text>

  <!-- Status bar -->
  <rect x="50" y="325" width="280" height="24" fill="rgba(16,185,129,0.1)" rx="6"/>
  <text x="65" y="341" fill="#10b981" font-size="11">✅ JSON 格式正确 · 共 2 条记录</text>

  <!-- Copy button -->
  <rect x="410" y="328" width="120" height="34" fill="rgba(20,31,55,0.9)" rx="8" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="470" y="350" fill="#94a3b8" font-size="12" font-weight="600" text-anchor="middle">📋 复制结果</text>
</svg>
