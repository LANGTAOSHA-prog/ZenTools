<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="'Inter',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b18"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
  </defs>
  <rect width="680" height="400" fill="url(#bg)" rx="14"/>

  <text x="30" y="42" fill="#f0f4ff" font-size="20" font-weight="700">🖼️ PDF 转图片 - 结果</text>
  <text x="30" y="66" fill="#6b7a9f" font-size="13">共 4 页已转换为图片，可单独下载或打包下载所有图片。</text>

  <rect x="30" y="85" width="620" height="290" fill="rgba(14,22,41,0.8)" rx="14" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

  <text x="50" y="118" fill="#f0f4ff" font-size="15" font-weight="700">转换结果</text>

  <!-- Preview grid -->
  <rect x="50" y="132" width="130" height="100" rx="8" fill="rgba(20,31,55,0.85)" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  <rect x="62" y="144" width="106" height="72" rx="4" fill="#0f172a" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="115" y="175" fill="#6b7a9f" font-size="10" text-anchor="middle">📄 第1页.png</text>
  <text x="115" y="222" fill="#4a5a7a" font-size="10" text-anchor="middle">⬇ 下载</text>

  <rect x="192" y="132" width="130" height="100" rx="8" fill="rgba(20,31,55,0.85)" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  <rect x="204" y="144" width="106" height="72" rx="4" fill="#0f172a" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="257" y="175" fill="#6b7a9f" font-size="10" text-anchor="middle">📄 第2页.png</text>
  <text x="257" y="222" fill="#4a5a7a" font-size="10" text-anchor="middle">⬇ 下载</text>

  <rect x="334" y="132" width="130" height="100" rx="8" fill="rgba(20,31,55,0.85)" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  <rect x="346" y="144" width="106" height="72" rx="4" fill="#0f172a" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="399" y="175" fill="#6b7a9f" font-size="10" text-anchor="middle">📄 第3页.png</text>
  <text x="399" y="222" fill="#4a5a7a" font-size="10" text-anchor="middle">⬇ 下载</text>

  <rect x="476" y="132" width="130" height="100" rx="8" fill="rgba(20,31,55,0.85)" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  <rect x="488" y="144" width="106" height="72" rx="4" fill="#0f172a" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="541" y="175" fill="#6b7a9f" font-size="10" text-anchor="middle">📄 第4页.png</text>
  <text x="541" y="222" fill="#4a5a7a" font-size="10" text-anchor="middle">⬇ 下载</text>

  <!-- Download all button -->
  <rect x="200" y="255" width="280" height="46" rx="999" fill="url(#accent)"/>
  <text x="340" y="283" fill="#fff" font-size="15" font-weight="700" text-anchor="middle">📥 打包下载所有图片 (ZIP)</text>

  <text x="340" y="325" fill="#4a5a7a" font-size="11" text-anchor="middle">每页 PDF 将生成为独立的 PNG/JPG 图片文件</text>

  <!-- Arrow -->
  <text x="640" y="172" fill="#3b82f6" font-size="20">👆</text>
</svg>
