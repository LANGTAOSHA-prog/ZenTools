<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" font-family="'Inter',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b18"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="680" height="380" fill="url(#bg)" rx="14"/>
  <text x="30" y="42" fill="#f0f4ff" font-size="20" font-weight="700">📁 ICO 生成</text>
  <text x="30" y="66" fill="#6b7a9f" font-size="13">将图片转换为 Windows ICO 图标格式，支持多种尺寸。</text>
  <rect x="30" y="85" width="620" height="275" fill="rgba(14,22,41,0.8)" rx="14" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="50" y="118" fill="#f0f4ff" font-size="15" font-weight="700">ICO 设置</text>
  <!-- Upload zone -->
  <rect x="50" y="135" width="280" height="200" rx="12" fill="rgba(20,31,55,0.85)" stroke="rgba(59,130,246,0.4)" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="190" y="195" fill="#6b7a9f" font-size="32" text-anchor="middle">📁</text>
  <text x="190" y="225" fill="#8899bb" font-size="13" text-anchor="middle">点击上传要转 ICO 的图片</text>
  <text x="190" y="245" fill="#4a5a7a" font-size="11" text-anchor="middle">支持 PNG、JPG、WebP</text>
  <rect x="110" y="268" width="160" height="34" fill="url(#accent)" rx="8"/>
  <text x="190" y="290" fill="#fff" font-size="12" font-weight="600" text-anchor="middle">选择文件</text>
  <!-- ICO settings -->
  <rect x="350" y="135" width="280" height="200" rx="12" fill="rgba(20,31,55,0.85)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="490" y="160" fill="#f0f4ff" font-size="13" font-weight="600" text-anchor="middle">ICO 设置</text>
  <text x="365" y="188" fill="#6b7a9f" font-size="11">输出尺寸</text>
  <rect x="365" y="198" width="120" height="34" rx="8" fill="#1e293b" stroke="rgba(59,130,246,0.3)" stroke-width="1"/>
  <text x="425" y="220" fill="#f0f4ff" font-size="12" text-anchor="middle">◉ 32x32</text>
  <rect x="495" y="198" width="120" height="34" rx="8" fill="rgba(20,31,55,0.5)"/>
  <text x="555" y="220" fill="#8899bb" font-size="12" text-anchor="middle">○ 64x64</text>
  <rect x="365" y="240" width="250" height="34" rx="8" fill="rgba(20,31,55,0.5)"/>
  <text x="490" y="262" fill="#8899bb" font-size="12" text-anchor="middle">○ 多尺寸 (16/32/48/64)</text>
  <text x="365" y="290" fill="#6b7a9f" font-size="11">预览</text>
  <rect x="365" y="300" width="32" height="32" rx="4" fill="#f59e0b"/>
  <rect x="400" y="298" width="32" height="32" rx="4" fill="#3b82f6"/>
  <rect x="365" y="315" width="250" height="30" rx="8" fill="url(#accent)"/>
  <text x="490" y="335" fill="#fff" font-size="12" font-weight="600" text-anchor="middle">生成 ICO</text>
</svg>