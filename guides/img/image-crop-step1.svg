<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="'Inter',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b18"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="680" height="400" fill="url(#bg)" rx="14"/>
  <text x="30" y="42" fill="#f0f4ff" font-size="20" font-weight="700">图片裁剪</text>
  <text x="30" y="66" fill="#6b7a9f" font-size="13">自由裁切或固定比例裁剪</text>
  <rect x="30" y="85" width="620" height="295" fill="rgba(14,22,41,0.8)" rx="14" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="50" y="118" fill="#f0f4ff" font-size="15" font-weight="700">裁剪区域</text>
  <rect x="50" y="135" width="580" height="225" rx="12" fill="rgba(20,31,55,0.85)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <!-- Image placeholder -->
  <rect x="65" y="150" width="550" height="195" rx="8" fill="#1e293b"/>
  <rect x="80" y="165" width="70" height="50" rx="4" fill="#3b82f6" opacity="0.3"/>
  <rect x="160" y="170" width="50" height="40" rx="4" fill="#f59e0b" opacity="0.3"/>
  <rect x="220" y="160" width="60" height="55" rx="4" fill="#10b981" opacity="0.3"/>
  <rect x="290" y="168" width="80" height="48" rx="4" fill="#8b5cf6" opacity="0.3"/>
  <rect x="380" y="158" width="55" height="60" rx="4" fill="#ef4444" opacity="0.3"/>
  <rect x="445" y="172" width="70" height="45" rx="4" fill="#06b6d4" opacity="0.3"/>
  <rect x="525" y="165" width="60" height="52" rx="4" fill="#ec4899" opacity="0.3"/>
  <!-- Crop overlay with selection -->
  <rect x="65" y="150" width="550" height="195" fill="rgba(0,0,0,0.55)" rx="8"/>
  <rect x="170" y="170" width="340" height="155" fill="none" stroke="#3b82f6" stroke-width="2"/>
  <rect x="170" y="170" width="340" height="155" fill="rgba(59,130,246,0.08)"/>
  <!-- Crop handles -->
  <rect x="164" y="164" width="12" height="12" rx="2" fill="#3b82f6"/>
  <rect x="504" y="164" width="12" height="12" rx="2" fill="#3b82f6"/>
  <rect x="164" y="319" width="12" height="12" rx="2" fill="#3b82f6"/>
  <rect x="504" y="319" width="12" height="12" rx="2" fill="#3b82f6"/>
  <!-- Grid lines -->
  <line x1="283" y1="170" x2="283" y2="325" stroke="rgba(255,255,255,0.2)" stroke-width="0.5" stroke-dasharray="4,4"/>
  <line x1="340" y1="170" x2="340" y2="325" stroke="rgba(255,255,255,0.2)" stroke-width="0.5" stroke-dasharray="4,4"/>
  <line x1="170" y1="222" x2="510" y2="222" stroke="rgba(255,255,255,0.2)" stroke-width="0.5" stroke-dasharray="4,4"/>
  <line x1="170" y1="274" x2="510" y2="274" stroke="rgba(255,255,255,0.2)" stroke-width="0.5" stroke-dasharray="4,4"/>
  <!-- Ratio selector -->
  <text x="170" y="162" fill="#3b82f6" font-size="10" font-weight="600">16:9</text>
  <!-- Aspect ratio buttons -->
  <text x="65" y="365" fill="#6b7a9f" font-size="11">比例：</text>
  <rect x="100" y="352" width="42" height="22" rx="6" fill="url(#accent)"/>
  <text x="121" y="367" fill="#fff" font-size="10" font-weight="600" text-anchor="middle">1:1</text>
  <rect x="148" y="352" width="42" height="22" rx="6" fill="rgba(255,255,255,0.06)"/>
  <text x="169" y="367" fill="#8899bb" font-size="10" font-weight="600" text-anchor="middle">4:3</text>
  <rect x="196" y="352" width="42" height="22" rx="6" fill="rgba(255,255,255,0.06)"/>
  <text x="217" y="367" fill="#8899bb" font-size="10" font-weight="600" text-anchor="middle">16:9</text>
  <rect x="244" y="352" width="50" height="22" rx="6" fill="rgba(255,255,255,0.06)"/>
  <text x="269" y="367" fill="#8899bb" font-size="10" font-weight="600" text-anchor="middle">自定义</text>
</svg>
