<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#070b18;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="680" height="400" fill="url(#bgGrad)"/>
  <text x="340" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#ffffff">图片压缩工具</text>
  <rect x="50" y="80" width="580" height="280" rx="12" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <rect x="70" y="100" width="540" height="40" rx="6" fill="#334155"/>
  <text x="340" y="126" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#e2e8f0">上传需要压缩的图片</text>
  <g transform="translate(150, 160)">
    <rect x="0" y="0" width="100" height="70" rx="6" fill="#64748b"/>
    <text x="50" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#ffffff">JPG</text>
    <text x="50" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#94a3b8">2.5 MB</text>
  </g>
  <g transform="translate(280, 160)">
    <rect x="0" y="0" width="100" height="70" rx="6" fill="#64748b"/>
    <text x="50" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#ffffff">PNG</text>
    <text x="50" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#94a3b8">4.8 MB</text>
  </g>
  <g transform="translate(410, 160)">
    <rect x="0" y="0" width="100" height="70" rx="6" fill="#64748b"/>
    <text x="50" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#ffffff">WebP</text>
    <text x="50" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#94a3b8">支持现代格式</text>
  </g>
  <rect x="100" y="260" width="180" height="50" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
  <text x="190" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#10b981">质量：85%</text>
  <rect x="300" y="260" width="180" height="50" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
  <text x="390" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#10b981">格式：自动</text>
  <rect x="500" y="260" width="100" height="50" rx="8" fill="#10b981"/>
  <text x="550" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#ffffff">压缩</text>
  <text x="340" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#94a3b8">压缩后体积减小 60%，画质几乎无损失</text>
</svg>
