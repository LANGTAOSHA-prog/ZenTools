<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="'Inter',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b18"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="680" height="400" fill="url(#bg)" rx="14"/>
  <text x="30" y="42" fill="#f0f4ff" font-size="20" font-weight="700">JPG 转 PNG</text>
  <text x="30" y="66" fill="#6b7a9f" font-size="13">一键转换，无损保存</text>
  <rect x="30" y="85" width="620" height="295" fill="rgba(14,22,41,0.8)" rx="14" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <!-- Upload area -->
  <text x="50" y="118" fill="#f0f4ff" font-size="15" font-weight="700">上传 JPG 图片</text>
  <rect x="50" y="135" width="580" height="100" rx="12" fill="rgba(20,31,55,0.85)" stroke="rgba(59,130,246,0.4)" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="340" y="175" fill="#6b7a9f" font-size="28" text-anchor="middle">📁</text>
  <text x="340" y="205" fill="#8899bb" font-size="13" text-anchor="middle">拖拽 JPG 图片到此处，或点击选择文件</text>
  <!-- Conversion flow -->
  <text x="50" y="265" fill="#f0f4ff" font-size="15" font-weight="700">转换流程</text>
  <rect x="50" y="280" width="160" height="70" rx="12" fill="rgba(20,31,55,0.85)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="130" y="310" fill="#f0f4ff" font-size="11" font-weight="600" text-anchor="middle">JPG 图片</text>
  <text x="130" y="330" fill="#8899bb" font-size="10" text-anchor="middle">photo.jpg</text>
  <!-- Arrow -->
  <text x="225" y="318" fill="#3b82f6" font-size="20" text-anchor="middle">→</text>
  <!-- Processing -->
  <rect x="240" y="280" width="160" height="70" rx="12" fill="rgba(20,31,55,0.85)" stroke="rgba(59,130,246,0.4)" stroke-width="2"/>
  <text x="320" y="310" fill="#f0f4ff" font-size="11" font-weight="600" text-anchor="middle">格式转换中</text>
  <text x="320" y="330" fill="#8899bb" font-size="10" text-anchor="middle">正在处理...</text>
  <!-- Arrow -->
  <text x="415" y="318" fill="#3b82f6" font-size="20" text-anchor="middle">→</text>
  <!-- Result -->
  <rect x="430" y="280" width="160" height="70" rx="12" fill="rgba(20,31,55,0.85)" stroke="rgba(16,185,129,0.4)" stroke-width="2"/>
  <text x="510" y="310" fill="#f0f4ff" font-size="11" font-weight="600" text-anchor="middle">PNG 图片</text>
  <text x="510" y="330" fill="#8899bb" font-size="10" text-anchor="middle">photo.png</text>
  <!-- Download button -->
  <rect x="500" y="288" width="110" height="24" rx="6" fill="#10b981"/>
  <text x="555" y="304" fill="#fff" font-size="10" font-weight="600" text-anchor="middle">下载 PNG</text>
</svg>
