<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="'Inter',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b18"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="680" height="400" fill="url(#bg)" rx="14"/>

  <!-- Title -->
  <text x="30" y="42" fill="#f0f4ff" font-size="20" font-weight="700">🖼️ PDF 提取图片</text>
  <text x="30" y="66" fill="#6b7a9f" font-size="13">从 PDF 文件中提取所有图片，支持批量导出，保存原始分辨率和质量。</text>

  <!-- Tool box -->
  <rect x="30" y="85" width="620" height="290" fill="rgba(14,22,41,0.8)" rx="14" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

  <text x="50" y="118" fill="#f0f4ff" font-size="15" font-weight="700">上传 PDF 文件</text>
  <text x="50" y="138" fill="#6b7a9f" font-size="12">选择 PDF 文件，工具会自动检测并列出所有嵌入的图片。</text>

  <!-- Upload zone -->
  <rect x="50" y="155" width="580" height="88" rx="12" fill="rgba(20,31,55,0.85)" stroke="rgba(59,130,246,0.4)" stroke-width="2" stroke-dasharray="6,4"/>
  
  <text x="340" y="190" fill="#6b7a9f" font-size="30" text-anchor="middle">📄</text>
  <text x="340" y="218" fill="#8899bb" font-size="13" text-anchor="middle">点击上传或拖拽 PDF 文件到此处</text>
  <text x="340" y="235" fill="#4a5a7a" font-size="11" text-anchor="middle">支持 .pdf 格式 · 最大 100MB</text>

  <!-- File name bar -->
  <rect x="50" y="258" width="400" height="34" fill="#0a0e1a" rx="8" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <rect x="56" y="262" width="20" height="26" rx="4" fill="rgba(239,68,68,0.3)"/>
  <text x="66" y="280" fill="#ef4444" font-size="11" text-anchor="middle" font-weight="700">PDF</text>
  <text x="84" y="280" fill="#c0d0f0" font-size="12">设计文档_2026.pdf</text>
  <text x="380" y="280" fill="#4a5a7a" font-size="11">2.4 MB</text>

  <!-- Image preview thumbnails -->
  <rect x="50" y="300" width="46" height="46" rx="6" fill="#1a2640" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="73" y="328" fill="#5a7aaa" font-size="18" text-anchor="middle">🖼</text>

  <rect x="104" y="300" width="46" height="46" rx="6" fill="#1a2640" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="127" y="328" fill="#5a7aaa" font-size="18" text-anchor="middle">🖼</text>

  <rect x="158" y="300" width="46" height="46" rx="6" fill="#1a2640" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="181" y="328" fill="#5a7aaa" font-size="18" text-anchor="middle">🖼</text>

  <rect x="212" y="300" width="46" height="46" rx="6" fill="#1a2640" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="235" y="328" fill="#5a7aaa" font-size="18" text-anchor="middle">🖼</text>

  <text x="272" y="328" fill="#4a5a7a" font-size="12">+3 张图片</text>

  <!-- Extract button -->
  <rect x="380" y="302" width="250" height="38" fill="url(#accent)" rx="999"/>
  <text x="505" y="327" fill="#fff" font-size="14" font-weight="600" text-anchor="middle">提取所有图片</text>
</svg>