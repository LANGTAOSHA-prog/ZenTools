<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#070b18;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="680" height="400" fill="url(#bgGrad4)"/>
  
  <!-- Header -->
  <text x="340" y="50" text-anchor="middle" font-family="'Noto Sans JP', Arial, sans-serif" font-size="24" font-weight="bold" fill="#ffffff">日本个税计算器</text>
  <text x="340" y="75" text-anchor="middle" font-family="'Noto Sans JP', Arial, sans-serif" font-size="14" fill="#94a3b8">所得税計算ツール</text>
  
  <!-- Tool Interface -->
  <rect x="50" y="100" width="580" height="240" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  
  <!-- Input Fields -->
  <text x="80" y="140" font-family="'Noto Sans JP', Arial, sans-serif" font-size="14" fill="#cbd5e1">所得金額 (円)</text>
  <rect x="220" y="130" width="150" height="36" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1"/>
  <text x="295" y="154" text-anchor="middle" font-family="'Noto Sans JP', Arial, sans-serif" font-size="16" fill="#ffffff">4000000</text>
  
  <text x="80" y="185" font-family="'Noto Sans JP', Arial, sans-serif" font-size="14" fill="#cbd5e1">控除額 (円)</text>
  <rect x="220" y="175" width="150" height="36" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1"/>
  <text x="295" y="199" text-anchor="middle" font-family="'Noto Sans JP', Arial, sans-serif" font-size="16" fill="#ffffff">480000</text>
  
  <text x="80" y="230" font-family="'Noto Sans JP', Arial, sans-serif" font-size="14" fill="#cbd5e1">住民税率 (%)</text>
  <rect x="220" y="220" width="150" height="36" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1"/>
  <text x="295" y="244" text-anchor="middle" font-family="'Noto Sans JP', Arial, sans-serif" font-size="16" fill="#ffffff">10.0</text>
  
  <!-- Result Box -->
  <rect x="400" y="130" width="180" height="80" rx="8" fill="#8b5cf6" opacity="0.2" stroke="#8b5cf6" stroke-width="2"/>
  <text x="490" y="155" text-anchor="middle" font-family="'Noto Sans JP', Arial, sans-serif" font-size="12" fill="#94a3b8">年間税金合計</text>
  <text x="490" y="185" text-anchor="middle" font-family="'Noto Sans JP', Arial, sans-serif" font-size="24" font-weight="bold" fill="#ffffff">263,000 円</text>
  
  <!-- Footer Info -->
  <text x="340" y="365" text-anchor="middle" font-family="'Noto Sans JP', Arial, sans-serif" font-size="12" fill="#64748b">ZenTools - 日本生活工具教程</text>
</svg>
