<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="'Inter',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b18"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="680" height="400" fill="url(#bg)" rx="14"/>
  <text x="30" y="42" fill="#f0f4ff" font-size="20" font-weight="700">🎯 去除水印</text>
  <text x="30" y="66" fill="#6b7a9f" font-size="13">智能去除图片中的水印、logo 和不需要的文字，恢复原始画面。</text>
  <rect x="30" y="85" width="620" height="290" fill="rgba(14,22,41,0.8)" rx="14" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="50" y="118" fill="#f0f4ff" font-size="15" font-weight="700">上传图片</text>
  <rect x="50" y="132" width="280" height="120" rx="12" fill="rgba(20,31,55,0.85)" stroke="rgba(59,130,246,0.4)" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="190" y="182" fill="#6b7a9f" font-size="32" text-anchor="middle">🖼️</text>
  <text x="190" y="210" fill="#8899bb" font-size="12" text-anchor="middle">点击上传图片</text>
  <rect x="50" y="265" width="280" height="34" rx="8" fill="url(#accent)"/>
  <text x="190" y="287" fill="#fff" font-size="13" font-weight="600" text-anchor="middle">选择文件</text>
  <rect x="350" y="132" width="280" height="120" rx="12" fill="rgba(20,31,55,0.6)" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <text x="490" y="182" fill="#4a5a7a" font-size="32" text-anchor="middle">✨</text>
  <text x="490" y="210" fill="#4a5a7a" font-size="12" text-anchor="middle">处理结果预览</text>
  <rect x="350" y="265" width="280" height="34" rx="8" fill="#1e293b" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="490" y="287" fill="#4a5a7a" font-size="12" font-weight="600" text-anchor="middle">等待处理...</text>
  <text x="50" y="325" fill="#6b7a9f" font-size="12">涂抹区域</text>
  <rect x="50" y="335" width="580" height="30" rx="8" fill="rgba(20,31,55,0.6)" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <rect x="50" y="335" width="200" height="30" rx="8" fill="rgba(239,68,68,0.3)" stroke="rgba(239,68,68,0.6)" stroke-width="1"/>
  <text x="150" y="354" fill="#ef4444" font-size="11" text-anchor="middle">涂抹水印区域</text>
  <rect x="260" y="335" width="120" height="30" rx="8" fill="url(#accent)"/>
  <text x="320" y="354" fill="#fff" font-size="11" font-weight="600" text-anchor="middle">智能去除</text>
</svg>
