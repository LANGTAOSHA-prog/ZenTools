<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="'Inter',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b18"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="680" height="400" fill="url(#bg)" rx="14"/>
  <text x="30" y="42" fill="#f0f4ff" font-size="20" font-weight="700">📦 图片压缩</text>
  <text x="30" y="66" fill="#6b7a9f" font-size="13">在线压缩 JPG、PNG、WebP 图片，在尽量保持画质的前提下大幅减小文件体积。</text>
  <rect x="30" y="85" width="620" height="295" fill="rgba(14,22,41,0.8)" rx="14" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="50" y="118" fill="#f0f4ff" font-size="15" font-weight="700">压缩图片</text>

  <!-- Image preview -->
  <rect x="50" y="132" width="260" height="150" fill="rgba(20,31,55,0.6)" rx="10" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="180" y="195" fill="#3b82f6" font-size="40" text-anchor="middle">🖼️</text>
  <text x="180" y="218" fill="#6b7a9f" font-size="10" text-anchor="middle">桌面截图_2026.png</text>

  <!-- Controls panel -->
  <rect x="330" y="132" width="300" height="150" fill="rgba(20,31,55,0.6)" rx="10" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="350" y="155" fill="#94a3b8" font-size="12" font-weight="600">压缩质量</text>
  <!-- Quality slider bar -->
  <rect x="350" y="168" width="160" height="6" fill="rgba(255,255,255,0.08)" rx="6"/>
  <rect x="350" y="168" width="120" height="6" fill="url(#accent)" rx="6"/>
  <circle cx="470" cy="171" r="8" fill="#fff" stroke="#3b82f6" stroke-width="2"/>
  <text x="530" y="174" fill="#f0f4ff" font-size="13" font-weight="600">75%</text>

  <!-- Quality guide -->
  <text x="350" y="200" fill="#4a5a7a" font-size="11">高清 90%</text>
  <text x="430" y="200" fill="#6b7a9f" font-size="11">推荐 75%</text>
  <text x="520" y="200" fill="#4a5a7a" font-size="11">强力 55%</text>

  <!-- File size info -->
  <rect x="350" y="218" width="260" height="30" fill="rgba(255,255,255,0.03)" rx="6"/>
  <text x="360" y="238" fill="#6b7a9f" font-size="12">原图大小：</text><text x="430" y="238" fill="#f87171" font-size="12">3.2 MB</text>
  <text x="500" y="238" fill="#6b7a9f" font-size="12">压缩后：</text><text x="560" y="238" fill="#22c55e" font-size="12">486 KB</text>

  <!-- Compress button -->
  <rect x="350" y="260" width="180" height="36" fill="url(#accent)" rx="999"/>
  <text x="440" y="284" fill="#fff" font-size="13" font-weight="700" text-anchor="middle">开始压缩</text>

  <!-- Size comparison bar -->
  <rect x="50" y="295" width="580" height="60" fill="rgba(255,255,255,0.02)" rx="8" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <text x="70" y="318" fill="#6b7a9f" font-size="12">压缩前</text>
  <rect x="130" y="308" width="200" height="14" fill="#f87171" rx="7" opacity="0.5"/>
  <text x="340" y="318" fill="#6b7a9f" font-size="11">3.2 MB</text>
  
  <text x="70" y="343" fill="#6b7a9f" font-size="12">压缩后</text>
  <rect x="130" y="333" width="50" height="14" fill="#22c55e" rx="7" opacity="0.7"/>
  <text x="190" y="343" fill="#22c55e" font-size="11">486 KB</text>
  <text x="280" y="343" fill="#22c55e" font-size="11" font-weight="600">↓ 85%</text>
</svg>
