<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="'Inter',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b18"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="680" height="400" fill="url(#bg)" rx="14"/>
  <text x="30" y="42" fill="#f0f4ff" font-size="20" font-weight="700">🇯🇵 AI 日语作文</text>
  <text x="30" y="66" fill="#6b7a9f" font-size="13">使用AI生成日语文章、小论文和作文，支持多种题材和语法校对。</text>
  
  <!-- Main interface -->
  <rect x="30" y="85" width="620" height="290" fill="rgba(14,22,41,0.8)" rx="14" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  
  <!-- Topic selection -->
  <rect x="50" y="100" width="140" height="35" fill="rgba(59,130,246,0.08)" rx="8" stroke="rgba(59,130,246,0.15)" stroke-width="1"/>
  <text x="120" y="122" fill="#3b82f6" font-size="11" text-anchor="middle">📝 议论文</text>
  
  <rect x="200" y="100" width="140" height="35" fill="rgba(255,255,255,0.08)" rx="8" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
  <text x="270" y="122" fill="#f0f4ff" font-size="11" text-anchor="middle">📖 故事文</text>
  
  <rect x="350" y="100" width="140" height="35" fill="rgba(255,255,255,0.08)" rx="8" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
  <text x="420" y="122" fill="#f0f4ff" font-size="11" text-anchor="middle">🎓 小论文</text>
  
  <rect x="500" y="100" width="140" height="35" fill="rgba(255,255,255,0.08)" rx="8" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
  <text x="570" y="122" fill="#f0f4ff" font-size="11" text-anchor="middle">💬 感想文</text>
  
  <!-- Essay content -->
  <rect x="50" y="145" width="580" height="180" fill="rgba(20,31,55,0.9)" rx="10" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <text x="70" y="170" fill="#f0f4ff" font-size="14" font-weight="600">私の好きな季節</text>
  
  <text x="70" y="200" fill="#94a3b8" font-size="12">私の好きな季節は春です。春になると、桜が咲き、世界がピンク色に染まります。暖かい日差しが降り注ぎ、新しい生命が芽吹く季節です。</text>
  <text x="70" y="220" fill="#94a3b8" font-size="12">春には多くの行事があります。お花見、卒業式、新しい学校生活の始まりなど、様々なイベントが楽しみです。</text>
  <text x="70" y="240" fill="#94a3b8" font-size="12">また、春は希望の季節でもあります。新しい目標を立て、一歩一歩進んでいくことができます。</text>
  
  <!-- Grammar check -->
  <rect x="50" y="335" width="200" height="35" fill="rgba(34,197,94,0.08)" rx="8"/>
  <text x="150" y="357" fill="#22c55e" font-size="12" text-anchor="middle">✅ 文法チェック済み</text>
  
  <!-- Word count -->
  <text x="260" y="357" fill="#6b7a9f" font-size="11">文字数：280文字</text>
  
  <!-- Action buttons -->
  <rect x="350" y="335" width="120" height="35" fill="url(#accent)" rx="8"/>
  <text x="410" y="357" fill="#fff" font-size="12" text-anchor="middle">生成作文</text>
  
  <rect x="480" y="335" width="120" height="35" fill="rgba(255,255,255,0.08)" rx="8" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
  <text x="540" y="357" fill="#f0f4ff" font-size="12" text-anchor="middle">校对修正</text>
  
  <!-- Level indicator -->
  <text x="50" y="385" fill="#6b7a9f" font-size="10">難易度：N3級 · 推奨読者：中級者</text>
</svg>