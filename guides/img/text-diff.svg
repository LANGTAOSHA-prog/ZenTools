<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" font-family="'Inter',-apple-system,'PingFang SC','Microsoft YaHei',monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b18"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="680" height="380" fill="url(#bg)" rx="14"/>
  <text x="30" y="42" fill="#f0f4ff" font-size="20" font-weight="700">📋 文本对比 (Diff)</text>
  <text x="30" y="66" fill="#6b7a9f" font-size="13">对比两段文本的差异，新增、删除和修改内容会以不同颜色高亮显示。</text>
  <rect x="30" y="85" width="620" height="270" fill="rgba(14,22,41,0.8)" rx="14" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="50" y="118" fill="#f0f4ff" font-size="15" font-weight="700">📋 文本对比</text>
  <!-- left panel -->
  <rect x="50" y="132" width="270" height="120" fill="#0a0e1a" rx="8" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <rect x="50" y="132" width="270" height="26" rx="8" fill="rgba(255,255,255,0.02)"/>
  <text x="185" y="150" fill="#6b7a9f" font-size="11" text-anchor="middle">原始文本</text>
  <text x="62" y="176" fill="#6b7a9f" font-size="12">今天天气很好</text>
  <text x="62" y="196" fill="#6b7a9f" font-size="12">适合出去散步</text>
  <!-- right panel -->
  <rect x="340" y="132" width="290" height="120" fill="#0a0e1a" rx="8" stroke="#10b981" stroke-width="1"/>
  <rect x="340" y="132" width="290" height="26" rx="8" fill="rgba(16,185,129,0.08)"/>
  <text x="485" y="150" fill="#10b981" font-size="11" text-anchor="middle">新文本</text>
  <text x="352" y="176" fill="#6b7a9f" font-size="12">今天天气<tspan fill="#22c55e">非常</tspan>好</text>
  <text x="352" y="196" fill="#6b7a9f" font-size="12">适合出去<tspan fill="#f43f5e">跑步</tspan></text>
  <!-- diff legend -->
  <rect x="50" y="262" width="580" height="34" fill="rgba(255,255,255,0.02)" rx="6" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <rect x="62" y="270" width="12" height="12" rx="3" fill="#22c55e" opacity="0.5"/>
  <text x="80" y="280" fill="#22c55e" font-size="11">新增：非常</text>
  <rect x="190" y="270" width="12" height="12" rx="3" fill="#f43f5e" opacity="0.5"/>
  <text x="208" y="280" fill="#f43f5e" font-size="11">删除：散步</text>
  <rect x="320" y="270" width="12" height="12" rx="3" fill="#fbbf24" opacity="0.7"/>
  <text x="338" y="280" fill="#fbbf24" font-size="11">修改：散步 → 跑步</text>
  <!-- compare button -->
  <rect x="440" y="308" width="140" height="34" fill="url(#accent)" rx="8"/>
  <text x="510" y="330" fill="#fff" font-size="13" font-weight="600" text-anchor="middle">📋 对比</text>
</svg>
