<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="'Inter',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b18"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
  </defs>
  <rect width="680" height="400" fill="url(#bg)" rx="14"/>

  <!-- Title -->
  <text x="30" y="42" fill="#f0f4ff" font-size="20" font-weight="700">✂️ PDF 裁剪</text>
  <text x="30" y="66" fill="#6b7a9f" font-size="13">裁剪 PDF 页面四周空白边距，一键调整所有页面。</text>

  <!-- Tool box -->
  <rect x="30" y="85" width="620" height="290" fill="rgba(14,22,41,0.8)" rx="14" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

  <text x="50" y="118" fill="#f0f4ff" font-size="15" font-weight="700">裁剪设置</text>
  <text x="50" y="138" fill="#6b7a9f" font-size="12">拖动裁剪框或输入边距值调整裁剪区域。</text>

  <!-- PDF Preview Panel -->
  <rect x="50" y="155" width="320" height="200" rx="10" fill="#0a0e1a" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

  <!-- PDF Page mock -->
  <rect x="85" y="170" width="250" height="170" rx="3" fill="#1a1f2e" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>

  <!-- Text lines on page -->
  <text x="100" y="200" fill="#4a5a7a" font-size="9" font-family="monospace">Lorem ipsum dolor sit amet</text>
  <text x="100" y="215" fill="#3a4a6a" font-size="9" font-family="monospace">consectetur adipiscing elit.</text>
  <text x="100" y="230" fill="#3a4a6a" font-size="9" font-family="monospace">Sed do eiusmod tempor.</text>
  <text x="100" y="245" fill="#4a5a7a" font-size="9" font-family="monospace">Incididunt ut labore et.</text>
  <text x="100" y="260" fill="#3a4a6a" font-size="9" font-family="monospace">Dolore magna aliqua.</text>
  <text x="100" y="275" fill="#4a5a7a" font-size="9" font-family="monospace">Ut enim ad minim veniam.</text>
  <text x="100" y="290" fill="#3a4a6a" font-size="9" font-family="monospace">Quis nostrud exercitation.</text>
  <text x="100" y="305" fill="#4a5a7a" font-size="9" font-family="monospace">Ullamco laboris nisi ut.</text>
  <text x="100" y="320" fill="#3a4a6a" font-size="9" font-family="monospace">Aliquip ex ea commodo.</text>

  <!-- Crop box (dashed) with drag handles -->
  <rect x="115" y="185" width="185" height="130" rx="0" fill="rgba(0,229,255,0.06)" stroke="#00e5ff" stroke-width="1.5" stroke-dasharray="5,3"/>

  <!-- Crop handles (corners) -->
  <rect x="115" y="185" width="8" height="8" rx="2" fill="#00e5ff"/>
  <rect x="292" y="185" width="8" height="8" rx="2" fill="#00e5ff"/>
  <rect x="115" y="307" width="8" height="8" rx="2" fill="#00e5ff"/>
  <rect x="292" y="307" width="8" height="8" rx="2" fill="#00e5ff"/>

  <!-- Drag hint arrows -->
  <text x="207" y="310" fill="rgba(0,229,255,0.5)" font-size="10" text-anchor="middle">↕</text>
  <text x="300" y="250" fill="rgba(0,229,255,0.5)" font-size="10" text-anchor="middle">↔</text>

  <!-- Panel divider -->
  <line x1="385" y1="155" x2="385" y2="355" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

  <!-- Margin input area -->
  <text x="405" y="172" fill="#f0f4ff" font-size="13" font-weight="600">边距设置</text>
  <text x="405" y="190" fill="#6b7a9f" font-size="11">（毫米）</text>

  <!-- Top margin -->
  <text x="405" y="215" fill="#6b7a9f" font-size="12">上</text>
  <rect x="445" y="200" width="100" height="28" rx="6" fill="#0a0e1a" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <text x="495" y="219" fill="#f0f4ff" font-size="13" text-anchor="middle">10</text>
  <rect x="555" y="202" width="24" height="24" rx="5" fill="rgba(0,229,255,0.1)"/>
  <text x="567" y="218" fill="#00e5ff" font-size="16" text-anchor="middle">▲</text>
  <rect x="585" y="202" width="24" height="24" rx="5" fill="rgba(0,229,255,0.1)"/>
  <text x="597" y="218" fill="#00e5ff" font-size="16" text-anchor="middle">▼</text>

  <!-- Bottom margin -->
  <text x="405" y="253" fill="#6b7a9f" font-size="12">下</text>
  <rect x="445" y="238" width="100" height="28" rx="6" fill="#0a0e1a" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <text x="495" y="257" fill="#f0f4ff" font-size="13" text-anchor="middle">10</text>
  <rect x="555" y="240" width="24" height="24" rx="5" fill="rgba(0,229,255,0.1)"/>
  <text x="567" y="256" fill="#00e5ff" font-size="16" text-anchor="middle">▲</text>
  <rect x="585" y="240" width="24" height="24" rx="5" fill="rgba(0,229,255,0.1)"/>
  <text x="597" y="256" fill="#00e5ff" font-size="16" text-anchor="middle">▼</text>

  <!-- Left margin -->
  <text x="405" y="291" fill="#6b7a9f" font-size="12">左</text>
  <rect x="445" y="276" width="100" height="28" rx="6" fill="#0a0e1a" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <text x="495" y="295" fill="#f0f4ff" font-size="13" text-anchor="middle">8</text>
  <rect x="555" y="278" width="24" height="24" rx="5" fill="rgba(0,229,255,0.1)"/>
  <text x="567" y="294" fill="#00e5ff" font-size="16" text-anchor="middle">▲</text>
  <rect x="585" y="278" width="24" height="24" rx="5" fill="rgba(0,229,255,0.1)"/>
  <text x="597" y="294" fill="#00e5ff" font-size="16" text-anchor="middle">▼</text>

  <!-- Right margin -->
  <text x="405" y="329" fill="#6b7a9f" font-size="12">右</text>
  <rect x="445" y="314" width="100" height="28" rx="6" fill="#0a0e1a" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <text x="495" y="333" fill="#f0f4ff" font-size="13" text-anchor="middle">8</text>
  <rect x="555" y="316" width="24" height="24" rx="5" fill="rgba(0,229,255,0.1)"/>
  <text x="567" y="332" fill="#00e5ff" font-size="16" text-anchor="middle">▲</text>
  <rect x="585" y="316" width="24" height="24" rx="5" fill="rgba(0,229,255,0.1)"/>
  <text x="597" y="332" fill="#00e5ff" font-size="16" text-anchor="middle">▼</text>

  <!-- Apply to all checkbox -->
  <rect x="445" y="350" width="16" height="16" rx="3" fill="rgba(0,229,255,0.2)" stroke="#00e5ff" stroke-width="1.5"/>
  <text x="465" y="363" fill="#8899bb" font-size="11">应用到所有页面</text>

  <!-- Crop button -->
  <rect x="50" y="365" width="320" height="30" rx="999" fill="url(#accent)"/>
  <text x="210" y="385" fill="#fff" font-size="13" font-weight="600" text-anchor="middle">✂️ 开始裁剪</text>
</svg>