<svg width="680" height="400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#070b18;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="680" height="400" fill="url(#bgGrad)"/>
  
  <!-- Header -->
  <text x="340" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#ffffff">Cursor AI</text>
  <text x="340" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#94a3b8">AI Code Editor</text>
  
  <!-- Interface Mockup -->
  <rect x="50" y="100" width="580" height="240" rx="12" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  
  <!-- Code Area -->
  <rect x="80" y="120" width="350" height="180" rx="6" fill="#0f172a" stroke="#475569"/>
  <text x="95" y="145" font-family="monospace" font-size="12" fill="#94a3b8">// JavaScript function</text>
  <text x="95" y="165" font-family="monospace" font-size="12" fill="#c084fc">function</text>
  <text x="145" y="165" font-family="monospace" font-size="12" fill="#ffffff"> greet(name)</text>
  <text x="95" y="185" font-family="monospace" font-size="12" fill="#ffffff">{</text>
  <text x="115" y="205" font-family="monospace" font-size="12" fill="#a5b4fc">return</text>
  <text x="165" y="205" font-family="monospace" font-size="12" fill="#fcd34d">`Hello,</text>
  <text x="95" y="225" font-family="monospace" font-size="12" fill="#a78bfa">${name}!</text>
  <text x="95" y="245" font-family="monospace" font-size="12" fill="#ffffff">}</text>
  
  <!-- AI Panel -->
  <rect x="450" y="120" width="190" height="180" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="545" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#22d3ee">✨ Cursor AI</text>
  
  <!-- AI Suggestions -->
  <rect x="465" y="160" width="160" height="35" rx="4" fill="#0ea5e9" opacity="0.2"/>
  <text x="475" y="175" font-family="Arial, sans-serif" font-size="10" fill="#7dd3fc">Suggestion:</text>
  <text x="475" y="188" font-family="Arial, sans-serif" font-size="9" fill="#bae6fd">Add JSDoc comments</text>
  
  <rect x="465" y="200" width="160" height="35" rx="4" fill="#8b5cf6" opacity="0.2"/>
  <text x="475" y="215" font-family="Arial, sans-serif" font-size="10" fill="#c4b5fd">Debug mode:</text>
  <text x="475" y="228" font-family="Arial, sans-serif" font-size="9" fill="#ddd6fe">No errors found</text>
  
  <!-- Status Bar -->
  <rect x="80" y="315" width="560" height="25" rx="4" fill="#0f172a" stroke="#334155"/>
  <text x="95" y="330" font-family="Arial, sans-serif" font-size="10" fill="#10b981">● Ready</text>
  <text x="520" y="330" text-anchor="end" font-family="Arial, sans-serif" font-size="10" fill="#94a3b8">Type @ to invoke AI</text>
  
  <!-- Badge -->
  <rect x="500" y="110" width="100" height="24" rx="12" fill="#8b5cf6"/>
  <text x="550" y="126" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#ffffff">AI Powered</text>
</svg>
