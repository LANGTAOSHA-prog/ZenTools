<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b18"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
  </defs>
  <rect width="680" height="400" fill="url(#bg)" rx="12"/>
  <text x="340" y="48" text-anchor="middle" fill="url(#accent)" font-size="20" font-weight="700" font-family="system-ui,sans-serif">HTML Entities</text>
  <text x="340" y="68" text-anchor="middle" fill="#64748b" font-size="11" font-family="system-ui,sans-serif">HTML实体编解码 - HTML Entities</text>
  <!-- Encode panel -->
  <rect x="40" y="90" width="270" height="280" rx="12" fill="url(#card)" stroke="#334155" stroke-width="1"/>
  <text x="60" y="118" fill="#94a3b8" font-size="12" font-weight="600" font-family="system-ui,sans-serif">原文输入</text>
  <rect x="60" y="128" width="230" height="80" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="74" y="152" fill="#e2e8f0" font-size="13" font-family="monospace">&lt;div&gt;Hello "World"&lt;/div&gt;</text>
  <text x="74" y="176" fill="#64748b" font-size="12" font-family="monospace">&amp;nbsp; &amp;copy; &amp;trade</text>
  <text x="74" y="200" fill="#64748b" font-size="12" font-family="monospace">&lt;&gt;&amp;"'</text>
  <!-- Buttons -->
  <rect x="60" y="220" width="105" height="30" rx="6" fill="#f59e0b" opacity="0.2" stroke="#f59e0b" stroke-width="1"/>
  <text x="112" y="240" fill="#f59e0b" font-size="11" font-weight="600" font-family="system-ui,sans-serif" text-anchor="middle">编码 Encode</text>
  <rect x="175" y="220" width="115" height="30" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="232" y="240" fill="#94a3b8" font-size="11" font-weight="600" font-family="system-ui,sans-serif" text-anchor="middle">解码 Decode</text>
  <text x="60" y="270" fill="#94a3b8" font-size="11" font-family="system-ui,sans-serif">快速符号</text>
  <rect x="60" y="278" width="36" height="22" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="78" y="294" fill="#e2e8f0" font-size="11" font-family="monospace" text-anchor="middle">&lt;&gt;</text>
  <rect x="100" y="278" width="36" height="22" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="118" y="294" fill="#e2e8f0" font-size="11" font-family="monospace" text-anchor="middle">&amp;</text>
  <rect x="140" y="278" width="36" height="22" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="158" y="294" fill="#e2e8f0" font-size="11" font-family="monospace" text-anchor="middle">"</text>
  <rect x="180" y="278" width="36" height="22" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="198" y="294" fill="#e2e8f0" font-size="11" font-family="monospace" text-anchor="middle">'</text>
  <rect x="220" y="278" width="36" height="22" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="238" y="294" fill="#e2e8f0" font-size="11" font-family="monospace" text-anchor="middle">&euro;</text>
  <rect x="260" y="278" width="36" height="22" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="278" y="294" fill="#e2e8f0" font-size="11" font-family="monospace" text-anchor="middle">&copy;</text>
  <!-- Arrow -->
  <text x="330" y="240" text-anchor="middle" fill="#475569" font-size="24" font-family="system-ui,sans-serif">⇄</text>
  <!-- Output panel -->
  <rect x="370" y="90" width="270" height="280" rx="12" fill="url(#card)" stroke="#334155" stroke-width="1"/>
  <text x="390" y="118" fill="#94a3b8" font-size="12" font-weight="600" font-family="system-ui,sans-serif">转换结果</text>
  <rect x="390" y="128" width="230" height="80" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="404" y="152" fill="#06b6d4" font-size="12" font-family="monospace">&amp;lt;div&amp;gt;Hello</text>
  <text x="404" y="172" fill="#06b6d4" font-size="12" font-family="monospace">&quot;World&quot;&amp;lt;/div&amp;gt;</text>
  <text x="404" y="192" fill="#06b6d4" font-size="12" font-family="monospace">&amp;amp;nbsp; &amp;amp;copy;</text>
  <text x="404" y="212" fill="#06b6d4" font-size="12" font-family="monospace">&amp;amp;trade &amp;lt;&amp;gt;</text>
  <text x="404" y="232" fill="#06b6d4" font-size="12" font-family="monospace">&amp;amp;&quot;&amp;apos;</text>
  <!-- Copy button -->
  <rect x="390" y="260" width="230" height="30" rx="6" fill="url(#accent)" opacity="0.15" stroke="url(#accent)" stroke-width="1"/>
  <text x="505" y="280" fill="#f59e0b" font-size="11" font-weight="600" font-family="system-ui,sans-serif" text-anchor="middle">复制结果 Copy</text>
</svg>