<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="'Inter',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b18"/>
    </linearGradient>
    <linearGradient id="regexPattern" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>
  <rect width="680" height="400" fill="url(#bg)" rx="14"/>
  <text x="30" y="42" fill="#f0f4ff" font-size="20" font-weight="700">🔍 AI 正则生成器</text>
  <text x="30" y="66" fill="#6b7a9f" font-size="13">使用 AI 根据需求描述生成正则表达式，支持测试和解释正则语法。</text>
  <rect x="30" y="85" width="620" height="290" fill="rgba(14,22,41,0.8)" rx="14" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  
  <!-- 输入区域 -->
  <rect x="50" y="100" width="580" height="60" rx="10" fill="rgba(20,31,55,0.9)" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <text x="70" y="125" fill="#f0f4ff" font-size="13">请输入需求描述：匹配中国手机号码</text>
  <text x="70" y="148" fill="#4a5a7a" font-size="10">AI 正在生成正则表达式...</text>
  
  <!-- 生成结果 -->
  <rect x="50" y="175" width="580" height="80" rx="10" fill="rgba(16,185,129,0.08)" stroke="rgba(16,185,129,0.15)" stroke-width="1"/>
  <text x="70" y="200" fill="#10b981" font-size="12">生成的正则表达式：</text>
  <text x="70" y="225" fill="#f0f4ff" font-size="14" font-weight="600">^1[3-9]\d{9}$</text>
  <text x="70" y="245" fill="#94a3b8" font-size="11">匹配中国大陆 11 位手机号码，以 1 开头，第二位为 3-9</text>
  
  <!-- 测试区域 -->
  <rect x="50" y="270" width="280" height="100" rx="10" fill="rgba(20,31,55,0.9)" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <text x="70" y="295" fill="#f0f4ff" font-size="12">测试用例</text>
  <text x="70" y="315" fill="#10b981" font-size="11">✅ 13812345678</text>
  <text x="70" y="335" fill="#ef4444" font-size="11">❌ 12345678901</text>
  <text x="70" y="355" fill="#10b981" font-size="11">✅ 19912345678</text>
  
  <!-- 语法解释 -->
  <rect x="350" y="270" width="280" height="100" rx="10" fill="rgba(59,130,246,0.08)" stroke="rgba(59,130,246,0.15)" stroke-width="1"/>
  <text x="370" y="295" fill="#f0f4ff" font-size="12">语法解释</text>
  <text x="370" y="315" fill="#94a3b8" font-size="11">^ - 匹配字符串开头</text>
  <text x="370" y="335" fill="#94a3b8" font-size="11">[3-9] - 匹配 3 到 9 之间的数字</text>
  <text x="370" y="355" fill="#94a3b8" font-size="11">\d{9} - 匹配 9 个数字</text>
</svg>