<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="'Inter',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b18"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
  </defs>
  <rect width="680" height="400" fill="url(#bg)" rx="14"/>

  <!-- Title -->
  <text x="30" y="42" fill="#f0f4ff" font-size="20" font-weight="700">📐 PDF 调整大小 - 预览</text>
  <text x="30" y="66" fill="#6b7a9f" font-size="13">预览调整后的效果，确认后下载文件。</text>

  <!-- Tool box -->
  <rect x="30" y="85" width="620" height="290" fill="rgba(14,22,41,0.8)" rx="14" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

  <text x="50" y="118" fill="#f0f4ff" font-size="15" font-weight="700">调整预览</text>

  <!-- Before/After comparison -->
  <rect x="50" y="135" width="580" height="80" rx="12" fill="rgba(10,14,26,0.6)" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>

  <!-- Before -->
  <rect x="75" y="147" width="140" height="55" rx="8" fill="rgba(239,68,68,0.1)" stroke="rgba(239,68,68,0.2)" stroke-width="1"/>
  <text x="145" y="168" fill="#ef4444" font-size="11" text-anchor="middle">调整前</text>
  <text x="145" y="190" fill="#f0f4ff" font-size="16" font-weight="700" text-anchor="middle">A4 纵向</text>

  <!-- Arrow -->
  <text x="265" y="182" fill="#6b7a9f" font-size="20">→</text>

  <!-- After -->
  <rect x="290" y="147" width="140" height="55" rx="8" fill="rgba(0,229,255,0.1)" stroke="rgba(0,229,255,0.2)" stroke-width="1"/>
  <text x="360" y="168" fill="#00e5ff" font-size="11" text-anchor="middle">调整后</text>
  <text x="360" y="190" fill="#f0f4ff" font-size="16" font-weight="700" text-anchor="middle">Letter 横向</text>

  <!-- Page count -->
  <rect x="460" y="147" width="140" height="55" rx="8" fill="rgba(168,85,247,0.1)" stroke="rgba(168,85,247,0.2)" stroke-width="1"/>
  <text x="530" y="168" fill="#a855f7" font-size="11" text-anchor="middle">页数</text>
  <text x="530" y="190" fill="#f0f4ff" font-size="16" font-weight="700" text-anchor="middle">8 页</text>

  <!-- Page preview -->
  <rect x="50" y="230" width="320" height="60" rx="8" fill="#0a0e1a" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="65" y="255" fill="#f0f4ff" font-size="12" font-weight="600">第 1 页 预览</text>
  <!-- Mini page icons -->
  <rect x="65" y="268" width="40" height="14" rx="2" fill="rgba(0,229,255,0.2)" stroke="#00e5ff" stroke-width="0.8"/>
  <text x="85" y="278" fill="#00e5ff" font-size="7" text-anchor="middle">1</text>
  <rect x="112" y="268" width="40" height="14" rx="2" fill="#1a1f2e" stroke="rgba(255,255,255,0.1)" stroke-width="0.8"/>
  <text x="132" y="278" fill="#6b7a9f" font-size="7" text-anchor="middle">2</text>
  <rect x="159" y="268" width="40" height="14" rx="2" fill="#1a1f2e" stroke="rgba(255,255,255,0.1)" stroke-width="0.8"/>
  <text x="179" y="278" fill="#6b7a9f" font-size="7" text-anchor="middle">3</text>
  <rect x="206" y="268" width="40" height="14" rx="2" fill="#1a1f2e" stroke="rgba(255,255,255,0.1)" stroke-width="0.8"/>
  <text x="226" y="278" fill="#6b7a9f" font-size="7" text-anchor="middle">4</text>
  <text x="260" y="277" fill="#4a5a7a" font-size="9">...</text>

  <!-- Right: setting summary -->
  <line x1="385" y1="230" x2="385" y2="355" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

  <text x="405" y="255" fill="#f0f4ff" font-size="13" font-weight="600">设置摘要</text>

  <text x="405" y="278" fill="#6b7a9f" font-size="11">纸张大小</text>
  <text x="510" y="278" fill="#f0f4ff" font-size="11">Letter (216 × 279mm)</text>

  <text x="405" y="298" fill="#6b7a9f" font-size="11">方向</text>
  <text x="510" y="298" fill="#f0f4ff" font-size="11">横向</text>

  <text x="405" y="318" fill="#6b7a9f" font-size="11">边距</text>
  <text x="510" y="318" fill="#f0f4ff" font-size="11">标准（各 15mm）</text>

  <text x="405" y="338" fill="#6b7a9f" font-size="11">应用范围</text>
  <text x="510" y="338" fill="#f0f4ff" font-size="11">所有页面</text>

  <!-- Download button -->
  <rect x="50" y="305" width="320" height="34" rx="999" fill="url(#accent)"/>
  <text x="210" y="327" fill="#fff" font-size="14" font-weight="600" text-anchor="middle">⬇ 下载调整后的 PDF</text>

  <text x="210" y="355" fill="#4a5a7a" font-size="11" text-anchor="middle">所有处理在浏览器本地完成，文件不会上传到服务器</text>
</svg>