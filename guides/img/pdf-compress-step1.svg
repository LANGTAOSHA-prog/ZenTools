<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="'Inter',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b18"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="680" height="400" fill="url(#bg)" rx="14"/>

  <text x="30" y="42" fill="#f0f4ff" font-size="20" font-weight="700">🗜️ PDF 压缩</text>
  <text x="30" y="66" fill="#6b7a9f" font-size="13">压缩 PDF 文件大小，便于存储、分享和邮件附件。</text>

  <rect x="30" y="85" width="620" height="290" fill="rgba(14,22,41,0.8)" rx="14" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

  <text x="50" y="118" fill="#f0f4ff" font-size="15" font-weight="700">上传 PDF</text>
  <text x="50" y="138" fill="#6b7a9f" font-size="12">选择要压缩的 PDF 文件，所有处理在浏览器本地完成。</text>

  <!-- Upload zone -->
  <rect x="50" y="155" width="580" height="90" rx="12" fill="rgba(20,31,55,0.85)" stroke="rgba(59,130,246,0.4)" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="340" y="190" fill="#6b7a9f" font-size="32" text-anchor="middle">📦</text>
  <text x="340" y="220" fill="#8899bb" font-size="13" text-anchor="middle">点击上传或拖拽 PDF 文件到此处</text>

  <!-- Quality slider -->
  <rect x="50" y="262" width="580" height="50" rx="10" fill="rgba(10,14,26,0.6)" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  <text x="65" y="285" fill="#6b7a9f" font-size="13">压缩级别：</text>
  <rect x="150" y="275" width="280" height="6" rx="3" fill="#1e293b"/>
  <rect x="150" y="275" width="160" height="6" rx="3" fill="#00e5ff"/>
  <circle cx="310" cy="278" r="10" fill="#3b82f6" stroke="#f0f4ff" stroke-width="2"/>
  <text x="500" y="285" fill="#f0f4ff" font-size="13" font-weight="600">推荐</text>

  <rect x="50" y="325" width="580" height="36" rx="999" fill="url(#accent)"/>
  <text x="340" y="347" fill="#fff" font-size="14" font-weight="600" text-anchor="middle">开始压缩</text>
</svg>
