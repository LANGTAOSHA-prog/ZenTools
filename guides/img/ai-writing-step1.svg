<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" font-family="'Inter',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b18"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="680" height="420" fill="url(#bg)" rx="14"/>
  <text x="30" y="42" fill="#f0f4ff" font-size="20" font-weight="700">🤖 AI 写作</text>
  <text x="30" y="66" fill="#6b7a9f" font-size="13">输入主题即可快速生成文章大纲和正文草稿，提高写作效率。</text>
  <rect x="30" y="85" width="620" height="310" fill="rgba(14,22,41,0.8)" rx="14" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="50" y="118" fill="#f0f4ff" font-size="15" font-weight="700">写作设置</text>

  <!-- Topic input -->
  <rect x="50" y="135" width="580" height="42" fill="#0a0e1a" rx="8" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="65" y="160" fill="#4a5a7a" font-size="13">写一篇 800 字的公众号文章，主题是新手如何开始健身，面向办公室白领</text>

  <!-- Type select -->
  <rect x="50" y="188" width="180" height="34" fill="#0a0e1a" rx="8" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="140" y="210" fill="#f0f4ff" font-size="12" text-anchor="middle">文章 ▼</text>

  <rect x="245" y="188" width="140" height="34" fill="#0a0e1a" rx="8" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="315" y="210" fill="#f0f4ff" font-size="12" text-anchor="middle">正式 ▼</text>

  <!-- Generate button -->
  <rect x="400" y="188" width="140" height="34" fill="url(#accent)" rx="8"/>
  <text x="470" y="210" fill="#fff" font-size="13" font-weight="600" text-anchor="middle">开始生成</text>

  <!-- Result area -->
  <rect x="50" y="238" width="580" height="140" fill="rgba(20,31,55,0.6)" rx="10" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <rect x="50" y="238" width="580" height="28" rx="10" fill="rgba(255,255,255,0.03)"/>
  <text x="340" y="256" fill="#6b7a9f" font-size="11" text-anchor="middle">📝 生成结果</text>

  <text x="65" y="288" fill="#6b7a9f" font-size="12" font-weight="600">新手健身入门指南（面向办公室白领）</text>
  <text x="65" y="308" fill="#4a5a7a" font-size="11">一、为什么白领需要健身？</text>
  <text x="65" y="326" fill="#4a5a7a" font-size="11">长期久坐、缺乏运动是现代白领普遍面临的问题……</text>
  <text x="65" y="344" fill="#4a5a7a" font-size="11">二、新手健身的四个基本原则</text>
  <text x="65" y="362" fill="#4a5a7a" font-size="11">1. 循序渐进：从低强度开始，逐步增加训练量……</text>
</svg>
