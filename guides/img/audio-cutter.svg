<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" font-family="'Inter',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b18"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="680" height="380" fill="url(#bg)" rx="14"/>
  <text x="30" y="42" fill="#f0f4ff" font-size="20" font-weight="700">✂️ 音频裁剪</text>
  <text x="30" y="66" fill="#6b7a9f" font-size="13">上传音频文件，拖动滑块选择要保留的片段，一键裁剪下载。</text>
  <rect x="30" y="85" width="620" height="270" fill="rgba(14,22,41,0.8)" rx="14" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="50" y="118" fill="#f0f4ff" font-size="15" font-weight="700">✂️ 音频裁剪</text>
  <!-- waveform -->
  <rect x="50" y="132" width="580" height="70" fill="rgba(20,31,55,0.6)" rx="8" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <text x="60" y="155" fill="#3b82f6" font-size="18">▶️</text>
  <!-- waveform bars -->
  <g fill="rgba(59,130,246,0.3)">
    <rect x="90" y="152" w="4" h="16" rx="2"/>
    <rect x="98" y="144" w="4" h="32" rx="2"/>
    <rect x="106" y="148" w="4" h="24" rx="2"/>
    <rect x="114" y="140" w="4" h="40" rx="2"/>
    <rect x="122" y="146" w="4" h="28" rx="2"/>
    <rect x="130" y="150" w="4" h="20" rx="2"/>
    <rect x="138" y="138" w="4" h="44" rx="2"/>
    <rect x="146" y="142" w="4" h="36" rx="2"/>
    <rect x="154" y="148" w="4" h="24" rx="2"/>
    <rect x="162" y="152" w="4" h="16" rx="2"/>
  </g>
  <!-- selection overlay -->
  <rect x="130" y="132" height="70" fill="rgba(0,229,255,0.15)" stroke="#00e5ff" stroke-width="2"/>
  <rect x="130" y="132" height="70" width="280" fill="none" stroke="#00e5ff" stroke-width="2" rx="0"/>
  <text x="270" y="170" fill="#00e5ff" font-size="11" text-anchor="middle">选区 (0:05 — 0:32)</text>
  <!-- timeline labels -->
  <text x="60" y="218" fill="#4a5a7a" font-size="10">起点：00:05</text>
  <text x="320" y="218" fill="#4a5a7a" font-size="10">终点：00:32</text>
  <text x="550" y="218" fill="#4a5a7a" font-size="10">总长：00:45</text>
  <!-- file info -->
  <rect x="50" y="232" width="460" height="34" fill="rgba(255,255,255,0.02)" rx="6" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <text x="70" y="254" fill="#f0f4ff" font-size="12">🎵 会议录音_20260621.mp3</text>
  <text x="460" y="254" fill="#6b7a9f" font-size="11" text-anchor="end">4.2 MB</text>
  <!-- crop button -->
  <rect x="530" y="232" width="100" height="34" fill="url(#accent)" rx="8"/>
  <text x="580" y="254" fill="#fff" font-size="13" font-weight="600" text-anchor="middle">✂️ 裁剪</text>
  <!-- steps -->
  <rect x="50" y="280" width="580" height="55" fill="rgba(255,255,255,0.02)" rx="8" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <text x="340" y="302" fill="#4a5a7a" font-size="11" text-anchor="middle">① 上传音频 → ② 拖动滑块选择选区 → ③ 点击裁剪下载</text>
  <text x="340" y="322" fill="#4a5a7a" font-size="10" text-anchor="middle">支持 MP3、WAV、OGG、M4A 等格式</text>
</svg>
