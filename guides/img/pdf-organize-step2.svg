<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" font-family="'Inter',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b18"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>
  <rect width="680" height="380" fill="url(#bg)" rx="14"/>

  <!-- Title -->
  <text x="30" y="42" fill="#f0f4ff" font-size="20" font-weight="700">📑 PDF 整理</text>
  <text x="30" y="66" fill="#6b7a9f" font-size="13">重新排序、旋转和删除 PDF 页面，自定义页面顺序。</text>

  <!-- Tool box -->
  <rect x="30" y="85" width="620" height="270" fill="rgba(14,22,41,0.8)" rx="14" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

  <!-- Success animation -->
  <circle cx="340" cy="138" r="30" fill="rgba(16,185,129,0.15)" stroke="rgba(16,185,129,0.3)" stroke-width="2"/>
  <text x="340" y="148" fill="#10b981" font-size="30" text-anchor="middle">✓</text>

  <text x="340" y="190" fill="#f0f4ff" font-size="16" font-weight="700" text-anchor="middle">✅ 整理完成！</text>
  <text x="340" y="214" fill="#6b7a9f" font-size="13" text-anchor="middle">页面顺序、旋转和删除操作已应用</text>

  <!-- Summary -->
  <rect x="80" y="230" width="520" height="40" fill="rgba(255,255,255,0.02)" rx="8" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <text x="340" y="246" fill="#94a3b8" font-size="12" text-anchor="middle">📄 新顺序：第 3, 1, 2, 4 页 · 共 4 页 · 移除 2 页</text>

  <!-- Download button -->
  <rect x="170" y="285" width="340" height="44" fill="url(#green)" rx="12"/>
  <text x="340" y="313" fill="#fff" font-size="15" font-weight="700" text-anchor="middle">📥 下载整理后的 PDF</text>
</svg>
