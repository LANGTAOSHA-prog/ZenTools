<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="'Inter',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b18"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
  </defs>
  <rect width="680" height="400" fill="url(#bg)" rx="14"/>

  <text x="30" y="42" fill="#f0f4ff" font-size="20" font-weight="700">🔍 关键词密度分析</text>
  <text x="30" y="66" fill="#6b7a9f" font-size="13">分析文章关键词分布，计算密度百分比，优化SEO内容。</text>

  <rect x="30" y="85" width="620" height="290" fill="rgba(14,22,41,0.8)" rx="14" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

  <text x="50" y="118" fill="#f0f4ff" font-size="15" font-weight="700">粘贴文章内容</text>
  <text x="50" y="138" fill="#6b7a9f" font-size="12">粘贴需要分析的文章或网页文本，工具会统计关键词密度。</text>

  <rect x="50" y="155" width="580" height="80" rx="10" fill="rgba(20,31,55,0.85)" stroke="rgba(34,211,238,0.3)" stroke-width="1"/>
  <text x="70" y="180" fill="#6b7a9f" font-size="13">在搜索引擎优化中，关键词密度是衡量页面中特定关键词</text>
  <text x="70" y="198" fill="#6b7a9f" font-size="13">出现频率的重要指标。合理的关键词密度有助于提升网站在</text>
  <text x="70" y="216" fill="#6b7a9f" font-size="13">搜索引擎中的排名，同时避免被认定为关键词堆砌...</text>

  <rect x="50" y="250" width="160" height="36" fill="url(#accent)" rx="8"/>
  <text x="130" y="273" fill="#fff" font-size="13" font-weight="600" text-anchor="middle">开始分析</text>

  <rect x="50" y="300" width="580" height="70" rx="10" fill="rgba(20,31,55,0.6)" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <text x="70" y="322" fill="#6b7a9f" font-size="12">分析结果</text>
  <text x="70" y="344" fill="#4a5a7a" font-size="12">总词数: 128 | 不同词数: 67 | 停用词: 28</text>
  <text x="70" y="362" fill="#4a5a7a" font-size="12">关键词"搜索"出现 8 次，密度 6.3%...</text>
</svg>
