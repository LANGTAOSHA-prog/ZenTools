<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="'Inter',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b18"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="680" height="400" fill="url(#bg)" rx="14"/>
  <text x="30" y="42" fill="#f0f4ff" font-size="20" font-weight="700">🎤 AI 面试助手</text>
  <text x="30" y="66" fill="#6b7a9f" font-size="13">使用AI进行模拟面试、生成面试问题和答案，帮助准备各类面试。</text>
  
  <!-- Main interface -->
  <rect x="30" y="85" width="620" height="290" fill="rgba(14,22,41,0.8)" rx="14" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  
  <!-- Interview type selection -->
  <rect x="50" y="100" width="180" height="40" fill="rgba(59,130,246,0.08)" rx="8" stroke="rgba(59,130,246,0.15)" stroke-width="1"/>
  <text x="140" y="125" fill="#3b82f6" font-size="12" text-anchor="middle">💼 技术面试</text>
  
  <rect x="240" y="100" width="180" height="40" fill="rgba(255,255,255,0.08)" rx="8" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
  <text x="330" y="125" fill="#f0f4ff" font-size="12" text-anchor="middle">👔 行为面试</text>
  
  <rect x="430" y="100" width="180" height="40" fill="rgba(255,255,255,0.08)" rx="8" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
  <text x="520" y="125" fill="#f0f4ff" font-size="12" text-anchor="middle">🎯 压力面试</text>
  
  <!-- Question area -->
  <rect x="50" y="150" width="580" height="80" fill="rgba(20,31,55,0.9)" rx="10" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <text x="70" y="175" fill="#f0f4ff" font-size="13" font-weight="600">面试官问题：</text>
  <text x="70" y="200" fill="#94a3b8" font-size="12">请介绍一下你过去项目中最复杂的技术挑战，以及你是如何解决的？</text>
  
  <!-- Answer area -->
  <rect x="50" y="240" width="580" height="100" fill="rgba(20,31,55,0.9)" rx="10" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <text x="70" y="265" fill="#f0f4ff" font-size="13" font-weight="600">AI 建议回答框架：</text>
  <text x="70" y="290" fill="#94a3b8" font-size="12">1. STAR法则：情境(Situation) → 任务(Task) → 行动(Action) → 结果(Result)</text>
  <text x="70" y="310" fill="#94a3b8" font-size="12">2. 技术细节：问题背景、技术选型、实现过程、优化方案</text>
  
  <!-- Tips panel -->
  <rect x="50" y="350" width="280" height="30" fill="rgba(34,197,94,0.08)" rx="8"/>
  <text x="190" y="370" fill="#22c55e" font-size="11" text-anchor="middle">💡 提示：保持自信，语速适中，眼神交流</text>
  
  <!-- Action buttons -->
  <rect x="350" y="350" width="120" height="30" fill="url(#accent)" rx="8"/>
  <text x="410" y="370" fill="#fff" font-size="12" text-anchor="middle">开始模拟</text>
  
  <rect x="480" y="350" width="120" height="30" fill="rgba(255,255,255,0.08)" rx="8" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
  <text x="540" y="370" fill="#f0f4ff" font-size="12" text-anchor="middle">切换问题</text>
</svg>