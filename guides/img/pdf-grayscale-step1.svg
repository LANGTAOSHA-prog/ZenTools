<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="'Inter',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b18"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="680" height="400" fill="url(#bg)" rx="14"/>

  <!-- Title -->
  <text x="30" y="42" fill="#f0f4ff" font-size="20" font-weight="700">⚫ PDF 灰度</text>
  <text x="30" y="66" fill="#6b7a9f" font-size="13">将彩色 PDF 文档转换为灰度版本，减小文件体积，适合打印和存档。</text>

  <!-- Tool box -->
  <rect x="30" y="85" width="620" height="290" fill="rgba(14,22,41,0.8)" rx="14" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

  <!-- Upload zone -->
  <rect x="50" y="100" width="580" height="80" rx="12" fill="rgba(20,31,55,0.85)" stroke="rgba(59,130,246,0.4)" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="340" y="132" fill="#6b7a9f" font-size="28" text-anchor="middle">📄</text>
  <text x="340" y="160" fill="#8899bb" font-size="12" text-anchor="middle">点击上传或拖拽 PDF 文件到此处</text>

  <!-- Preview section -->
  <text x="50" y="208" fill="#f0f4ff" font-size="14" font-weight="600">预览对比</text>

  <!-- Color preview (left) -->
  <rect x="50" y="220" width="270" height="100" rx="8" fill="rgba(10,14,26,0.6)" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  <text x="185" y="242" fill="#6b7a9f" font-size="11" text-anchor="middle">🖌️ 彩色原稿</text>
  <!-- Fake color page -->
  <rect x="100" y="252" width="36" height="50" rx="2" fill="#e74c3c"/>
  <rect x="140" y="252" width="36" height="50" rx="2" fill="#2ecc71"/>
  <rect x="180" y="252" width="36" height="50" rx="2" fill="#3498db"/>
  <rect x="220" y="252" width="36" height="50" rx="2" fill="#f39c12"/>

  <!-- Arrow -->
  <text x="340" y="270" fill="#4a5a7a" font-size="22" text-anchor="middle">→</text>

  <!-- Grayscale preview (right) -->
  <rect x="360" y="220" width="270" height="100" rx="8" fill="rgba(10,14,26,0.6)" stroke="rgba(0,229,255,0.3)" stroke-width="1"/>
  <text x="495" y="242" fill="#00e5ff" font-size="11" text-anchor="middle">⚫ 灰度预览</text>
  <!-- Fake grayscale page -->
  <rect x="410" y="252" width="36" height="50" rx="2" fill="#555555"/>
  <rect x="450" y="252" width="36" height="50" rx="2" fill="#777777"/>
  <rect x="490" y="252" width="36" height="50" rx="2" fill="#666666"/>
  <rect x="530" y="252" width="36" height="50" rx="2" fill="#888888"/>

  <!-- Execute button -->
  <rect x="140" y="330" width="400" height="38" fill="url(#accent)" rx="999"/>
  <text x="340" y="354" fill="#fff" font-size="14" font-weight="700" text-anchor="middle">⚫ 转换为灰度</text>
</svg>