<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="'Inter',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b18"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="680" height="400" fill="url(#bg)" rx="14"/>
  <text x="30" y="42" fill="#f0f4ff" font-size="20" font-weight="700">🤖 AI 文案写作</text>
  <text x="30" y="66" fill="#6b7a9f" font-size="13">使用AI生成产品描述、品牌故事、营销文案等多种商业写作内容。</text>
  <rect x="30" y="85" width="620" height="290" fill="rgba(14,22,41,0.8)" rx="14" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="50" y="118" fill="#f0f4ff" font-size="15" font-weight="700">文案写作设置</text>

  <!-- Topic input -->
  <rect x="50" y="135" width="580" height="42" fill="#0a0e1a" rx="8" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="65" y="160" fill="#4a5a7a" font-size="13">输入主题或产品名称，例如：有机护肤品品牌</text>

  <!-- Type select -->
  <rect x="50" y="188" width="180" height="34" fill="#0a0e1a" rx="8" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="140" y="210" fill="#f0f4ff" font-size="12" text-anchor="middle">产品描述 ▼</text>

  <rect x="245" y="188" width="140" height="34" fill="#0a0e1a" rx="8" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="315" y="210" fill="#f0f4ff" font-size="12" text-anchor="middle">优雅 ▼</text>

  <!-- Generate button -->
  <rect x="400" y="188" width="140" height="34" fill="url(#accent)" rx="8"/>
  <text x="470" y="210" fill="#fff" font-size="13" font-weight="600" text-anchor="middle">生成文案</text>

  <!-- Result area -->
  <rect x="50" y="238" width="580" height="130" fill="rgba(20,31,55,0.6)" rx="10" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <rect x="50" y="238" width="580" height="28" rx="10" fill="rgba(255,255,255,0.03)"/>
  <text x="340" y="256" fill="#6b7a9f" font-size="11" text-anchor="middle">📝 生成结果</text>

  <text x="65" y="288" fill="#6b7a9f" font-size="12" font-weight="600">有机护肤品品牌 - 产品描述</text>
  <text x="65" y="308" fill="#4a5a7a" font-size="11">源自天然，呵护肌肤。我们的有机护肤品采用100%天然成分，</text>
  <text x="65" y="326" fill="#4a5a7a" font-size="11">不含任何化学添加剂，让您的肌肤享受最纯净的呵护。</text>
  <text x="65" y="344" fill="#4a5a7a" font-size="11">每一款产品都经过严格测试，确保安全有效。</text>
</svg>