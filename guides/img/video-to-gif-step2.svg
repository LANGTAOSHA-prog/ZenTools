<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" font-family="'Inter',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b18"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="680" height="420" fill="url(#bg)" rx="14"/>
  <text x="30" y="42" fill="#f0f4ff" font-size="20" font-weight="700">🎬 视频转 GIF</text>
  <text x="30" y="66" fill="#6b7a9f" font-size="13">将视频片段转换为 GIF 动图，自定义尺寸和帧率。</text>
  <rect x="30" y="85" width="620" height="310" fill="rgba(14,22,41,0.8)" rx="14" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="50" y="118" fill="#f0f4ff" font-size="15" font-weight="700">GIF 设置</text>

  <!-- File info -->
  <rect x="50" y="132" width="580" height="34" fill="rgba(255,255,255,0.03)" rx="8" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <text x="70" y="155" fill="#f0f4ff" font-size="13">▶ 演示视频.mp4</text>
  <text x="540" y="155" fill="#6b7a9f" font-size="11" text-anchor="end">00:12 / 00:45</text>

  <!-- Timeline slider -->
  <rect x="50" y="178" width="580" height="40" fill="rgba(20,31,55,0.5)" rx="8" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <text x="70" y="200" fill="#6b7a9f" font-size="11">起始</text>
  <rect x="100" y="192" width="420" height="6" fill="rgba(255,255,255,0.08)" rx="6"/>
  <rect x="100" y="192" width="280" height="6" fill="url(#accent)" rx="6"/>
  <circle cx="320" cy="195" r="8" fill="#fff" stroke="#3b82f6" stroke-width="2"/>
  <circle cx="460" cy="195" r="8" fill="#fff" stroke="#8b5cf6" stroke-width="2"/>
  <text x="530" y="200" fill="#6b7a9f" font-size="11">结束</text>
  <text x="340" y="215" fill="#4a5a7a" font-size="10" text-anchor="middle">⇄ 拖动滑块选择片段范围（已选 0:05 ~ 0:17）</text>

  <!-- Parameter settings -->
  <rect x="50" y="228" width="580" height="80" fill="rgba(20,31,55,0.5)" rx="8" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <!-- Size -->
  <text x="70" y="252" fill="#94a3b8" font-size="12">尺寸：</text>
  <rect x="120" y="240" width="100" height="26" fill="#0a0e1a" rx="6" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="170" y="258" fill="#f0f4ff" font-size="12" text-anchor="middle">480px</text>
  <text x="230" y="252" fill="#4a5a7a" font-size="11">聊天分享 · 性价比高</text>
  <!-- FPS -->
  <text x="70" y="282" fill="#94a3b8" font-size="12">帧率：</text>
  <rect x="120" y="270" width="100" height="26" fill="#0a0e1a" rx="6" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="170" y="288" fill="#f0f4ff" font-size="12" text-anchor="middle">10 FPS</text>
  <text x="230" y="282" fill="#4a5a7a" font-size="11">流畅 · 文件大小适中</text>

  <!-- Generate button -->
  <rect x="220" y="320" width="260" height="40" fill="url(#accent)" rx="999"/>
  <text x="350" y="345" fill="#fff" font-size="14" font-weight="700" text-anchor="middle">🎞️ 生成 GIF</text>
</svg>
