<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="'Inter',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b18"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="680" height="400" fill="url(#bg)" rx="14"/>

  <text x="30" y="42" fill="#f0f4ff" font-size="20" font-weight="700">📸 图片转 PDF</text>
  <text x="30" y="66" fill="#6b7a9f" font-size="13">将多张图片按顺序合成为一个 PDF 文件，支持 JPG、PNG 格式。</text>

  <rect x="30" y="85" width="620" height="290" fill="rgba(14,22,41,0.8)" rx="14" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

  <text x="50" y="118" fill="#f0f4ff" font-size="15" font-weight="700">上传图片</text>
  <text x="50" y="138" fill="#6b7a9f" font-size="12">选择多张图片，按顺序合成 PDF 文件。支持 JPG、PNG、WebP 格式。</text>

  <!-- Upload zone -->
  <rect x="50" y="155" width="580" height="110" rx="12" fill="rgba(20,31,55,0.85)" stroke="rgba(59,130,246,0.4)" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="340" y="192" fill="#6b7a9f" font-size="32" text-anchor="middle">🖼️</text>
  <text x="340" y="222" fill="#8899bb" font-size="13" text-anchor="middle">点击上传或拖拽图片到此处</text>
  <text x="340" y="242" fill="#4a5a7a" font-size="11" text-anchor="middle">支持 JPG、PNG、WebP · 可一次选择多张图片</text>

  <!-- File list preview -->
  <rect x="50" y="278" width="480" height="34" rx="8" fill="rgba(10,14,26,0.6)" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  <text x="65" y="300" fill="#6b7a9f" font-size="12">已选择 3 张图片</text>

  <!-- Create button -->
  <rect x="545" y="278" width="90" height="34" rx="8" fill="url(#accent)"/>
  <text x="590" y="300" fill="#fff" font-size="12" font-weight="600" text-anchor="middle">生成 PDF</text>

  <text x="340" y="340" fill="#4a5a7a" font-size="11" text-anchor="middle">图片按上传顺序排列，每张图片为 PDF 中的一页</text>
</svg>
