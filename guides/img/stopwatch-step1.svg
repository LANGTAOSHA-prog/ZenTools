<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="'Inter',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0f172a"/><stop offset="100%" stop-color="#070b18"/></linearGradient><linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#3b82f6"/><stop offset="100%" stop-color="#8b5cf6"/></linearGradient></defs>
  <rect width="680" height="400" fill="url(#bg)" rx="14"/>
  <text x="30" y="42" fill="#f0f4ff" font-size="20" font-weight="700">⏱️ 秒表</text>
  <text x="30" y="66" fill="#6b7a9f" font-size="13">点击开始计时，支持计次（Lap）记录多个时间点，精确到百分之一秒。</text>
  <rect x="30" y="85" width="620" height="290" fill="rgba(14,22,41,0.8)" rx="14" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <!-- Time display -->
  <rect x="140" y="110" width="400" height="70" fill="#0a0e1a" rx="12" stroke="rgba(0,229,255,0.2)" stroke-width="2"/>
  <text x="340" y="158" fill="#00e5ff" font-size="36" font-weight="900" text-anchor="middle" font-family="monospace">00:23.45</text>
  <!-- Controls -->
  <rect x="140" y="195" width="90" height="42" fill="url(#accent)" rx="21"/>
  <text x="185" y="220" fill="#fff" font-size="14" font-weight="600" text-anchor="middle">▶ 开始</text>
  <rect x="245" y="195" width="90" height="42" fill="rgba(255,255,255,0.08)" rx="21"/>
  <text x="290" y="220" fill="#f0f4ff" font-size="14" font-weight="600" text-anchor="middle">⏱️ 计次</text>
  <rect x="350" y="195" width="90" height="42" fill="rgba(255,255,255,0.08)" rx="21"/>
  <text x="395" y="220" fill="#f0f4ff" font-size="14" font-weight="600" text-anchor="middle">⏸️ 暂停</text>
  <rect x="455" y="195" width="90" height="42" fill="#ef4444" rx="21"/>
  <text x="500" y="220" fill="#fff" font-size="14" font-weight="600" text-anchor="middle">↺ 重置</text>
  <!-- Lap list -->
  <rect x="140" y="255" width="400" height="100" fill="#0a0e1a" rx="8" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <text x="160" y="280" fill="#6b7a9f" font-size="12">计次 1</text><text x="450" y="280" fill="#f0f4ff" font-size="12" font-family="monospace" text-anchor="end">00:05.12</text>
  <line x1="140" y1="290" x2="540" y2="290" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <text x="160" y="308" fill="#6b7a9f" font-size="12">计次 2</text><text x="450" y="308" fill="#f0f4ff" font-size="12" font-family="monospace" text-anchor="end">00:10.88</text>
  <line x1="140" y1="318" x2="540" y2="318" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <text x="160" y="336" fill="#6b7a9f" font-size="12">计次 3</text><text x="450" y="336" fill="#f0f4ff" font-size="12" font-family="monospace" text-anchor="end">00:23.45</text>
  <text x="340" y="365" fill="#f59e0b" font-size="11" text-anchor="middle">💡 点击「计次」记录当前时间，继续计时不影响</text>
</svg>
