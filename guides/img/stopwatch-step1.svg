<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="'Inter',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
<defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0f172a"/><stop offset="100%" stop-color="#070b18"/></linearGradient></defs>
<rect width="680" height="400" fill="url(#bg)" rx="14"/>
<text x="30" y="42" fill="#f0f4ff" font-size="20" font-weight="700">⏱️ 秒表计时器</text><text x="30" y="66" fill="#6b7a9f" font-size="13">在线秒表计时器，支持分段计时和记录用时。</text>
<rect x="30" y="85" width="620" height="290" fill="rgba(14,22,41,0.8)" rx="14" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
<text x="340" y="150" fill="#00e5ff" font-size="72" font-weight="900" text-anchor="middle" font-family="monospace">01:23.45</text>
<rect x="180" y="190" width="110" height="42" fill="url(#bg)" rx="8" stroke="rgba(0,229,255,0.3)" stroke-width="2"/>
<text x="235" y="216" fill="#00e5ff" font-size="14" font-weight="700" text-anchor="middle">▶ 开始</text>
<rect x="300" y="190" width="110" height="42" fill="rgba(255,255,255,0.06)" rx="8"/>
<text x="355" y="216" fill="#f0f4ff" font-size="14" font-weight="600" text-anchor="middle">🏁 分段</text>
<rect x="420" y="190" width="110" height="42" fill="rgba(255,255,255,0.06)" rx="8"/>
<text x="475" y="216" fill="#f0f4ff" font-size="14" font-weight="600" text-anchor="middle">↺ 重置</text>
<text x="50" y="270" fill="#aabbcc" font-size="13" font-weight="600">分段记录</text>
<rect x="50" y="285" width="570" height="75" fill="#0a0e1a" rx="8" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
<text x="80" y="312" fill="#6b7a9f" font-size="12">#1  00:25.12</text>
<text x="80" y="332" fill="#6b7a9f" font-size="12">#2  00:32.08</text>
<text x="340" y="312" fill="#6b7a9f" font-size="12">#3  00:18.56</text>
<text x="340" y="332" fill="#6b7a9f" font-size="12">#4  00:07.69</text>
</svg>
