<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="'Inter',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b18"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
  </defs>
  <rect width="680" height="400" fill="url(#bg)" rx="14"/>

  <!-- Title -->
  <text x="30" y="42" fill="#f0f4ff" font-size="20" font-weight="700">🔧 PDF 修复</text>
  <text x="30" y="66" fill="#6b7a9f" font-size="13">修复损坏的 PDF 文件，恢复可读内容，提取未损坏的数据。</text>

  <!-- Tool box -->
  <rect x="30" y="85" width="620" height="290" fill="rgba(14,22,41,0.8)" rx="14" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

  <text x="50" y="118" fill="#f0f4ff" font-size="15" font-weight="700">修复 PDF 文件</text>
  <text x="50" y="138" fill="#6b7a9f" font-size="12">上传损坏的 PDF 文件，工具将尝试修复并恢复内容。</text>

  <!-- Upload zone -->
  <rect x="50" y="155" width="580" height="90" rx="12" fill="rgba(20,31,55,0.85)" stroke="rgba(59,130,246,0.4)" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="340" y="190" fill="#6b7a9f" font-size="32" text-anchor="middle">📂</text>
  <text x="340" y="220" fill="#8899bb" font-size="13" text-anchor="middle">点击上传或拖拽损坏的 PDF 文件到此处</text>

  <!-- Progress bar section -->
  <rect x="50" y="258" width="580" height="44" rx="10" fill="rgba(10,14,26,0.6)" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  <text x="65" y="278" fill="#6b7a9f" font-size="12">修复进度：</text>
  <rect x="130" y="270" width="360" height="8" rx="4" fill="#1e293b"/>
  <rect x="130" y="270" width="240" height="8" rx="4" fill="url(#accent)"/>
  <text x="510" y="278" fill="#22c55e" font-size="12" font-weight="600">66%</text>

  <!-- Repair button -->
  <rect x="50" y="312" width="160" height="36" rx="999" fill="url(#accent)"/>
  <text x="130" y="335" fill="#fff" font-size="13" font-weight="600" text-anchor="middle">开始修复</text>

  <!-- Log area -->
  <rect x="230" y="312" width="400" height="50" rx="8" fill="rgba(10,14,26,0.5)" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <text x="245" y="332" fill="#22c55e" font-size="11" font-family="monospace">✓ 正在解析文件结构...</text>
  <text x="245" y="350" fill="#fbbf24" font-size="11" font-family="monospace">⟳ 修复交叉引用表...</text>
</svg>
