<svg width="680" height="400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#070b18;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="680" height="400" fill="url(#bgGrad)"/>
  
  <!-- Header -->
  <text x="340" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#ffffff">Durable AI</text>
  <text x="340" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#94a3b8">AI Website Builder</text>
  
  <!-- Interface Mockup -->
  <rect x="50" y="100" width="580" height="240" rx="12" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  
  <!-- Business Info Form -->
  <rect x="80" y="120" width="280" height="180" rx="6" fill="#0f172a" stroke="#475569"/>
  <text x="95" y="145" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#ffffff">Business Details</text>
  
  <text x="95" y="170" font-family="Arial, sans-serif" font-size="10" fill="#94a3b8">Business Name:</text>
  <rect x="95" y="182" width="250" height="25" rx="4" fill="#1e293b" stroke="#475569"/>
  <text x="105" y="199" font-family="Arial, sans-serif" font-size="10" fill="#cbd5e1">Acme Corporation</text>
  
  <text x="95" y="220" font-family="Arial, sans-serif" font-size="10" fill="#94a3b8">Industry:</text>
  <rect x="95" y="232" width="250" height="25" rx="4" fill="#1e293b" stroke="#475569"/>
  <text x="105" y="249" font-family="Arial, sans-serif" font-size="10" fill="#cbd5e1">Technology / Consulting</text>
  
  <text x="95" y="270" font-family="Arial, sans-serif" font-size="10" fill="#94a3b8">Description:</text>
  <rect x="95" y="282" width="250" height="35" rx="4" fill="#1e293b" stroke="#475569"/>
  <text x="105" y="297" font-family="Arial, sans-serif" font-size="9" fill="#cbd5e1">We provide professional consulting</text>
  <text x="105" y="310" font-family="Arial, sans-serif" font-size="9" fill="#cbd5e1">services for businesses worldwide.</text>
  
  <!-- Generate Button -->
  <rect x="380" y="180" width="220" height="50" rx="8" fill="#8b5cf6"/>
  <text x="490" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">Generate Website</text>
  <text x="490" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#c4b5fd">in 30 seconds ✨</text>
  
  <!-- Preview Area -->
  <rect x="380" y="120" width="220" height="45" rx="6" fill="#0ea5e9" opacity="0.2" stroke="#0ea5e9"/>
  <text x="490" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#7dd3fc">Preview Loading...</text>
  
  <!-- Badge -->
  <rect x="500" y="110" width="100" height="24" rx="12" fill="#f59e0b"/>
  <text x="550" y="126" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#ffffff">Fast Build</text>
</svg>
