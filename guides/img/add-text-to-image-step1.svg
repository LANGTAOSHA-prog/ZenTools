<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" font-family="'Inter',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b18"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="680" height="380" fill="url(#bg)" rx="14"/>
  <text x="30" y="42" fill="#f0f4ff" font-size="20" font-weight="700">📝 图片添加文字</text>
  <text x="30" y="66" fill="#6b7a9f" font-size="13">在图片上添加自定义文字，支持字体、颜色和位置调节。</text>
  <rect x="30" y="85" width="620" height="275" fill="rgba(14,22,41,0.8)" rx="14" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="50" y="118" fill="#f0f4ff" font-size="15" font-weight="700">文字设置</text>
  <!-- Upload zone -->
  <rect x="50" y="135" width="280" height="200" rx="12" fill="rgba(20,31,55,0.85)" stroke="rgba(59,130,246,0.4)" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="190" y="195" fill="#6b7a9f" font-size="32" text-anchor="middle">📝</text>
  <text x="190" y="225" fill="#8899bb" font-size="13" text-anchor="middle">点击上传要加文字的图片</text>
  <text x="190" y="245" fill="#4a5a7a" font-size="11" text-anchor="middle">支持 JPG、PNG、WebP</text>
  <rect x="110" y="268" width="160" height="34" fill="url(#accent)" rx="8"/>
  <text x="190" y="290" fill="#fff" font-size="12" font-weight="600" text-anchor="middle">选择文件</text>
  <!-- Text controls -->
  <rect x="350" y="135" width="280" height="200" rx="12" fill="rgba(20,31,55,0.85)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="490" y="160" fill="#f0f4ff" font-size="13" font-weight="600" text-anchor="middle">文字设置</text>
  <rect x="365" y="172" width="250" height="34" rx="8" fill="#0a0e1a" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="375" y="194" fill="#8899bb" font-size="12">输入要添加的文字...</text>
  <text x="365" y="220" fill="#6b7a9f" font-size="11">字体大小</text>
  <text x="615" y="220" fill="#f0f4ff" font-size="11" text-anchor="end">24px</text>
  <rect x="365" y="228" width="250" height="6" rx="3" fill="#1e293b"/>
  <circle cx="490" cy="231" r="8" fill="#3b82f6" stroke="#fff" stroke-width="2"/>
  <text x="365" y="255" fill="#6b7a9f" font-size="11">文字颜色</text>
  <rect x="365" y="263" width="30" height="24" rx="6" fill="#ffffff" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <rect x="405" y="263" width="30" height="24" rx="6" fill="#ef4444"/>
  <rect x="445" y="263" width="30" height="24" rx="6" fill="#3b82f6"/>
  <rect x="485" y="263" width="30" height="24" rx="6" fill="#10b981"/>
  <rect x="365" y="295" width="250" height="34" rx="8" fill="url(#accent)"/>
  <text x="490" y="317" fill="#fff" font-size="12" font-weight="600" text-anchor="middle">添加文字</text>
</svg>