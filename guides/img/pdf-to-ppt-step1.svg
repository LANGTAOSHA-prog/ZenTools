<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="'Inter',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b18"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>
  <rect width="680" height="400" fill="url(#bg)" rx="14"/>

  <!-- Title -->
  <text x="30" y="42" fill="#f0f4ff" font-size="20" font-weight="700">📽️ PDF 转 PPT</text>
  <text x="30" y="66" fill="#6b7a9f" font-size="13">将 PDF 文件转换为可编辑的 PowerPoint 演示文稿，保留布局和内容。</text>

  <!-- Tool box -->
  <rect x="30" y="85" width="620" height="290" fill="rgba(14,22,41,0.8)" rx="14" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

  <!-- Left panel: Upload area & options -->
  <text x="50" y="118" fill="#f0f4ff" font-size="15" font-weight="700">上传 PDF 文件</text>
  <text x="50" y="138" fill="#6b7a9f" font-size="12">选择 PDF 文件并设置转换选项，一键转为 PPT。</text>

  <!-- Upload zone -->
  <rect x="50" y="155" width="280" height="100" rx="12" fill="rgba(20,31,55,0.85)" stroke="rgba(59,130,246,0.4)" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="190" y="192" fill="#6b7a9f" font-size="28" text-anchor="middle">📄</text>
  <text x="190" y="220" fill="#8899bb" font-size="12" text-anchor="middle">点击上传或拖拽 PDF</text>
  <text x="190" y="240" fill="#4a5a7a" font-size="10" text-anchor="middle">支持 .pdf 格式</text>

  <!-- Slide preview thumbnails (right panel) -->
  <rect x="350" y="155" width="280" height="100" rx="10" fill="rgba(10,14,26,0.7)" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <text x="365" y="178" fill="#4a5a7a" font-size="11">幻灯片预览</text>

  <!-- Thumbnail 1 -->
  <rect x="365" y="188" width="50" height="38" rx="4" fill="rgba(20,31,55,0.9)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <text x="390" y="205" fill="#6b7a9f" font-size="8" text-anchor="middle">●</text>
  <text x="390" y="216" fill="#4a5a7a" font-size="7" text-anchor="middle">Page 1</text>

  <!-- Thumbnail 2 -->
  <rect x="425" y="188" width="50" height="38" rx="4" fill="rgba(20,31,55,0.9)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <rect x="430" y="194" width="40" height="6" rx="1" fill="rgba(245,158,11,0.3)"/>
  <rect x="430" y="204" width="30" height="3" rx="1" fill="rgba(255,255,255,0.07)"/>
  <rect x="430" y="210" width="35" height="3" rx="1" fill="rgba(255,255,255,0.05)"/>
  <rect x="430" y="216" width="25" height="3" rx="1" fill="rgba(255,255,255,0.05)"/>
  <text x="490" y="216" fill="#4a5a7a" font-size="7" text-anchor="middle">Page 2</text>

  <!-- Thumbnail 3 -->
  <rect x="485" y="188" width="50" height="38" rx="4" fill="rgba(20,31,55,0.9)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <rect x="490" y="194" width="40" height="6" rx="1" fill="rgba(16,185,129,0.3)"/>
  <rect x="490" y="204" width="30" height="3" rx="1" fill="rgba(255,255,255,0.07)"/>
  <rect x="490" y="210" width="35" height="3" rx="1" fill="rgba(255,255,255,0.05)"/>
  <text x="550" y="216" fill="#4a5a7a" font-size="7" text-anchor="middle">Page 3</text>

  <!-- More pages indicator -->
  <rect x="545" y="188" width="20" height="38" rx="4" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="555" y="210" fill="#4a5a7a" font-size="9" text-anchor="middle">+5</text>

  <!-- Conversion options -->
  <text x="50" y="280" fill="#8899bb" font-size="12">转换选项</text>

  <!-- 保留布局 -->
  <rect x="50" y="291" width="14" height="14" rx="3" fill="rgba(16,185,129,0.2)" stroke="#10b981" stroke-width="1.5"/>
  <text x="70" y="303" fill="#94a3b8" font-size="11">保留布局</text>

  <!-- 保留图片 -->
  <rect x="160" y="291" width="14" height="14" rx="3" fill="rgba(16,185,129,0.2)" stroke="#10b981" stroke-width="1.5"/>
  <text x="180" y="303" fill="#94a3b8" font-size="11">保留图片</text>

  <!-- 保留文字 -->
  <rect x="270" y="291" width="14" height="14" rx="3" fill="rgba(16,185,129,0.2)" stroke="#10b981" stroke-width="1.5"/>
  <text x="290" y="303" fill="#94a3b8" font-size="11">保留文字</text>

  <!-- Start convert button -->
  <rect x="50" y="325" width="580" height="36" fill="url(#accent)" rx="10"/>
  <text x="340" y="348" fill="#fff" font-size="14" font-weight="700" text-anchor="middle">📥 开始转换</text>
</svg>
