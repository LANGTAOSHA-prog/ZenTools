<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="'Inter',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b18"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="680" height="400" fill="url(#bg)" rx="14"/>
  <text x="30" y="42" fill="#f0f4ff" font-size="20" font-weight="700">🤖 AI 代码修复</text>
  <text x="30" y="66" fill="#6b7a9f" font-size="13">使用AI分析并修复代码中的bug和错误。</text>
  <rect x="30" y="85" width="620" height="290" fill="rgba(14,22,41,0.8)" rx="14" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="50" y="118" fill="#f0f4ff" font-size="15" font-weight="700">代码修复设置</text>

  <!-- Code input -->
  <rect x="50" y="135" width="580" height="120" fill="#0a0e1a" rx="8" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="65" y="160" fill="#4a5a7a" font-size="12">粘贴有错误的代码：</text>
  <text x="65" y="180" fill="#3b82f6" font-size="11">function divide(a, b) {</text>
  <text x="65" y="195" fill="#3b82f6" font-size="11">  return a / b;</text>
  <text x="65" y="210" fill="#3b82f6" font-size="11">}</text>

  <!-- Error description -->
  <rect x="50" y="265" width="580" height="34" fill="#0a0e1a" rx="8" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="65" y="287" fill="#4a5a7a" font-size="12">描述错误：当b为0时会报错</text>

  <!-- Generate button -->
  <rect x="50" y="310" width="140" height="34" fill="url(#accent)" rx="8"/>
  <text x="120" y="332" fill="#fff" font-size="13" font-weight="600" text-anchor="middle">修复代码</text>

  <!-- Result area -->
  <rect x="200" y="310" width="430" height="60" fill="rgba(20,31,55,0.6)" rx="10" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <text x="215" y="335" fill="#6b7a9f" font-size="12" font-weight="600">修复后的代码：</text>
  <text x="215" y="355" fill="#3b82f6" font-size="11">function divide(a, b) { if (b === 0) throw new Error('除数不能为0'); return a / b; }</text>
</svg>