<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="'Inter',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b18"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="greenAccent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
  </defs>
  <rect width="680" height="400" fill="url(#bg)" rx="14"/>

  <!-- Title -->
  <text x="30" y="42" fill="#f0f4ff" font-size="20" font-weight="700">✏️ PDF 标注</text>
  <text x="30" y="66" fill="#6b7a9f" font-size="13">标注完成，可以预览所有标注效果并下载文件。</text>

  <!-- Tool box -->
  <rect x="30" y="85" width="620" height="290" fill="rgba(14,22,41,0.8)" rx="14" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

  <!-- Top toolbar -->
  <rect x="30" y="85" width="620" height="40" fill="rgba(20,31,55,0.9)" rx="14" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <rect x="30" y="115" width="620" height="10" fill="rgba(20,31,55,0.9)"/>

  <!-- Toolbar icons -->
  <rect x="48" y="95" width="32" height="24" fill="rgba(250,204,21,0.15)" rx="4"/>
  <text x="64" y="112" fill="#aab" font-size="12" text-anchor="middle">A</text>

  <rect x="90" y="95" width="32" height="24" fill="rgba(59,130,246,0.15)" rx="4"/>
  <text x="106" y="112" fill="#aab" font-size="12" text-anchor="middle">U</text>

  <rect x="132" y="95" width="32" height="24" fill="rgba(239,68,68,0.15)" rx="4"/>
  <text x="148" y="112" fill="#aab" font-size="12" text-anchor="middle">S</text>

  <rect x="174" y="95" width="32" height="24" fill="rgba(16,185,129,0.15)" rx="4"/>
  <text x="190" y="112" fill="#aab" font-size="14" text-anchor="middle">□</text>

  <rect x="216" y="95" width="32" height="24" fill="rgba(168,85,247,0.15)" rx="4"/>
  <text x="232" y="112" fill="#aab" font-size="12" text-anchor="middle">T</text>

  <rect x="258" y="95" width="32" height="24" fill="rgba(236,72,153,0.15)" rx="4"/>
  <text x="274" y="112" fill="#aab" font-size="12" text-anchor="middle">✎</text>

  <line x1="306" y1="96" x2="306" y2="116" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

  <!-- Download button (active) -->
  <rect x="530" y="92" width="108" height="28" fill="url(#accent)" rx="999"/>
  <text x="584" y="111" fill="#fff" font-size="12" font-weight="600" text-anchor="middle">下载标注 PDF</text>

  <!-- Left: PDF preview with annotations -->
  <rect x="48" y="135" width="400" height="220" fill="rgba(248,250,252,0.95)" rx="8"/>

  <text x="70" y="162" fill="#0f172a" font-size="13" font-weight="700">项目计划书 - 2026年Q3</text>

  <rect x="70" y="175" width="200" height="3" fill="#e2e8f0" rx="2"/>
  <rect x="70" y="183" width="360" height="3" fill="#e2e8f0" rx="2"/>
  <rect x="70" y="191" width="340" height="3" fill="#e2e8f0" rx="2"/>

  <text x="70" y="212" fill="#334155" font-size="11" font-weight="600">1. 项目概述</text>
  <rect x="70" y="222" width="360" height="3" fill="#e2e8f0" rx="2"/>
  <rect x="70" y="230" width="340" height="3" fill="#e2e8f0" rx="2"/>
  <rect x="70" y="238" width="300" height="3" fill="#e2e8f0" rx="2"/>

  <!-- Multiple highlights -->
  <rect x="70" y="248" width="140" height="4" fill="rgba(250,204,21,0.55)" rx="2"/>
  <rect x="218" y="248" width="80" height="4" fill="rgba(250,204,21,0.55)" rx="2"/>
  <rect x="70" y="256" width="360" height="3" fill="#e2e8f0" rx="2"/>
  <rect x="70" y="264" width="200" height="3" fill="#e2e8f0" rx="2"/>

  <!-- Strikethrough -->
  <rect x="70" y="272" width="120" height="3" fill="#e2e8f0" rx="2"/>
  <line x1="70" y1="284" x2="190" y2="284" stroke="#f87171" stroke-width="1.5"/>
  <rect x="200" y="272" width="160" height="3" fill="#e2e8f0" rx="2"/>

  <!-- Underlined text -->
  <rect x="70" y="294" width="230" height="3" fill="#e2e8f0" rx="2"/>
  <line x1="70" y1="296" x2="300" y2="296" stroke="#60a5fa" stroke-width="2"/>

  <!-- Comment annotation -->
  <rect x="340" y="196" width="88" height="62" fill="#fef3c7" rx="6" stroke="#f59e0b" stroke-width="1"/>
  <text x="347" y="212" fill="#b45309" font-size="9" font-weight="600">审批意见</text>
  <text x="347" y="226" fill="#92400e" font-size="9">此预算方案</text>
  <text x="347" y="239" fill="#92400e" font-size="9">需财务总监</text>
  <text x="347" y="252" fill="#92400e" font-size="9">签字确认</text>

  <!-- Text box annotation -->
  <rect x="70" y="308" width="340" height="3" fill="#e2e8f0" rx="2"/>
  <rect x="70" y="316" width="280" height="3" fill="#e2e8f0" rx="2"/>
  <rect x="70" y="324" width="320" height="3" fill="#e2e8f0" rx="2"/>

  <!-- Freehand drawing annotation -->
  <path d="M 285 290 Q 290 285 295 288 Q 300 292 305 286 Q 310 280 315 284 Q 320 288 325 282" fill="none" stroke="#f472b6" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M 330 300 Q 335 294 340 298 Q 345 302 350 296" fill="none" stroke="#f472b6" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Right panel: annotation list -->
  <rect x="460" y="135" width="178" height="220" fill="rgba(20,31,55,0.6)" rx="8" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>

  <text x="474" y="158" fill="#94a3b8" font-size="10" font-weight="600">标注列表</text>

  <!-- Annotation items -->
  <rect x="468" y="168" width="162" height="28" fill="rgba(250,204,21,0.1)" rx="6"/>
  <rect x="474" y="174" width="14" height="14" fill="#facc15" rx="2"/>
  <text x="494" y="186" fill="#94a3b8" font-size="10">高亮 × 2</text>

  <rect x="468" y="200" width="162" height="28" fill="rgba(239,68,68,0.1)" rx="6"/>
  <line x1="476" y1="213" x2="486" y2="214" stroke="#f87171" stroke-width="1.5"/>
  <text x="494" y="218" fill="#94a3b8" font-size="10">删除线 × 1</text>

  <rect x="468" y="232" width="162" height="28" fill="rgba(59,130,246,0.1)" rx="6"/>
  <rect x="474" y="238" width="14" height="2" fill="#60a5fa" rx="1"/>
  <text x="494" y="250" fill="#94a3b8" font-size="10">下划线 × 1</text>

  <rect x="468" y="264" width="162" height="28" fill="rgba(16,185,129,0.1)" rx="6"/>
  <rect x="474" y="268" width="14" height="12" fill="none" stroke="#34d399" stroke-width="1.5" rx="2"/>
  <text x="494" y="282" fill="#94a3b8" font-size="10">注释框 × 1</text>

  <rect x="468" y="296" width="162" height="28" fill="rgba(236,72,153,0.1)" rx="6"/>
  <text x="476" y="314" fill="#f472b6" font-size="12">✎</text>
  <text x="494" y="314" fill="#94a3b8" font-size="10">自由绘图 × 1</text>

  <text x="494" y="340" fill="#4a5a7a" font-size="10">共 6 个标注</text>
</svg>