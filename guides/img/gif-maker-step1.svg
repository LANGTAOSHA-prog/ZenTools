<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="'Inter',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b18"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="680" height="400" fill="url(#bg)" rx="14"/>
  <text x="30" y="42" fill="#f0f4ff" font-size="20" font-weight="700">GIF 动图制作</text>
  <text x="30" y="66" fill="#6b7a9f" font-size="13">将多张图片合成为动画</text>
  <rect x="30" y="85" width="620" height="295" fill="rgba(14,22,41,0.8)" rx="14" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="50" y="118" fill="#f0f4ff" font-size="15" font-weight="700">帧列表</text>
  <!-- Frame thumbnails -->
  <rect x="50" y="135" width="100" height="100" rx="10" fill="rgba(20,31,55,0.85)" stroke="rgba(59,130,246,0.4)" stroke-width="2"/>
  <text x="100" y="175" fill="#f0f4ff" font-size="18" text-anchor="middle">🌞</text>
  <text x="100" y="205" fill="#8899bb" font-size="10" text-anchor="middle">帧 1</text>
  <rect x="160" y="135" width="100" height="100" rx="10" fill="rgba(20,31,55,0.85)" stroke="rgba(59,130,246,0.4)" stroke-width="2"/>
  <text x="210" y="175" fill="#f0f4ff" font-size="18" text-anchor="middle">🌤️</text>
  <text x="210" y="205" fill="#8899bb" font-size="10" text-anchor="middle">帧 2</text>
  <rect x="270" y="135" width="100" height="100" rx="10" fill="rgba(20,31,55,0.85)" stroke="rgba(59,130,246,0.4)" stroke-width="2"/>
  <text x="320" y="175" fill="#f0f4ff" font-size="18" text-anchor="middle">🌥️</text>
  <text x="320" y="205" fill="#8899bb" font-size="10" text-anchor="middle">帧 3</text>
  <rect x="380" y="135" width="100" height="100" rx="10" fill="rgba(20,31,55,0.85)" stroke="rgba(59,130,246,0.4)" stroke-width="2"/>
  <text x="430" y="175" fill="#f0f4ff" font-size="18" text-anchor="middle">🌧️</text>
  <text x="430" y="205" fill="#8899bb" font-size="10" text-anchor="middle">帧 4</text>
  <!-- Arrow between frames -->
  <text x="152" y="185" fill="#6b7a9f" font-size="14">→</text>
  <text x="262" y="185" fill="#6b7a9f" font-size="14">→</text>
  <text x="372" y="185" fill="#6b7a9f" font-size="14">→</text>
  <!-- Add frame button -->
  <rect x="490" y="135" width="100" height="100" rx="10" fill="rgba(20,31,55,0.5)" stroke="rgba(255,255,255,0.1)" stroke-width="1" stroke-dasharray="6,4"/>
  <text x="540" y="185" fill="#6b7a9f" font-size="28" text-anchor="middle">+</text>
  <text x="540" y="210" fill="#6b7a9f" font-size="10" text-anchor="middle">添加帧</text>
  <!-- Settings panel -->
  <text x="50" y="260" fill="#f0f4ff" font-size="13" font-weight="600">设置</text>
  <rect x="50" y="272" width="280" height="95" rx="10" fill="rgba(20,31,55,0.85)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="65" y="295" fill="#6b7a9f" font-size="11">帧间隔时间</text>
  <rect x="65" y="305" width="120" height="26" rx="6" fill="#0f172a" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <text x="125" y="322" fill="#f0f4ff" font-size="12" font-weight="600" text-anchor="middle">200 ms</text>
  <text x="65" y="350" fill="#6b7a9f" font-size="11">循环次数</text>
  <rect x="65" y="358" width="120" height="26" rx="6" fill="#0f172a" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <text x="125" y="375" fill="#f0f4ff" font-size="12" font-weight="600" text-anchor="middle">无限循环</text>
  <!-- Preview + Generate -->
  <rect x="350" y="272" width="280" height="95" rx="10" fill="rgba(20,31,55,0.85)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="490" y="295" fill="#8899bb" font-size="11" text-anchor="middle">预览</text>
  <rect x="365" y="305" width="250" height="40" rx="8" fill="#1e293b"/>
  <text x="490" y="330" fill="#f0f4ff" font-size="12" text-anchor="middle">播放中...</text>
  <rect x="365" y="355" width="250" height="30" rx="8" fill="url(#accent)"/>
  <text x="490" y="374" fill="#fff" font-size="12" font-weight="600" text-anchor="middle">生成 GIF</text>
</svg>
