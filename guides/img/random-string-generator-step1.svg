<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="'Inter',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
<defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0f172a"/><stop offset="100%" stop-color="#070b18"/></linearGradient></defs>
<rect width="680" height="400" fill="url(#bg)" rx="14"/>
<text x="30" y="42" fill="#f0f4ff" font-size="20" font-weight="700">🔤 随机字符串生成</text><text x="30" y="66" fill="#6b7a9f" font-size="13">自定义长度和字符类型，生成随机字符串，点击即可复制。</text>
<rect x="30" y="85" width="620" height="290" fill="rgba(14,22,41,0.8)" rx="14" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
<text x="50" y="120" fill="#f0f4ff" font-size="15" font-weight="700">设置</text>
<text x="50" y="145" fill="#6b7a9f" font-size="13">长度: 12</text><text x="180" y="145" fill="#6b7a9f" font-size="13">生成: 5 个</text>
<text x="50" y="170" fill="#6b7a9f" font-size="13">☑ 大写 A-Z  ☑ 小写 a-z  ☑ 数字 0-9  ☐ 符号</text>
<rect x="50" y="190" width="580" height="170" fill="#0a0e1a" rx="10" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
<rect x="65" y="205" width="550" height="28" fill="rgba(59,130,246,0.06)" rx="6" stroke="rgba(59,130,246,0.15)" stroke-width="1"/>
<text x="80" y="224" fill="#f0f4ff" font-size="12" font-family="monospace">aB3xK9mP2qR5</text>
<rect x="65" y="240" width="550" height="28" fill="rgba(59,130,246,0.06)" rx="6" stroke="rgba(59,130,246,0.15)" stroke-width="1"/>
<text x="80" y="259" fill="#f0f4ff" font-size="12" font-family="monospace">wX7tLz4vN1cF</text>
<rect x="65" y="275" width="550" height="28" fill="rgba(59,130,246,0.06)" rx="6" stroke="rgba(59,130,246,0.15)" stroke-width="1"/>
<text x="80" y="294" fill="#f0f4ff" font-size="12" font-family="monospace">Q6rH3uG8dE0y</text>
<rect x="65" y="310" width="550" height="28" fill="rgba(59,130,246,0.06)" rx="6" stroke="rgba(59,130,246,0.15)" stroke-width="1"/>
<text x="80" y="329" fill="#f0f4ff" font-size="12" font-family="monospace">sJ5pM2kL9wXb</text>
<text x="340" y="365" fill="#10b981" font-size="11" text-anchor="middle">💡 点击字符串可复制到剪贴板</text>
</svg>
