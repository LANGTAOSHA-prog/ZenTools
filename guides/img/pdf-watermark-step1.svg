<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="'Inter',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b18"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="680" height="400" fill="url(#bg)" rx="14"/>

  <text x="30" y="42" fill="#f0f4ff" font-size="20" font-weight="700">💧 PDF 水印</text>
  <text x="30" y="66" fill="#6b7a9f" font-size="13">为 PDF 文件添加文字或图片水印，支持自定义位置、透明度和旋转角度。</text>

  <rect x="30" y="85" width="620" height="290" fill="rgba(14,22,41,0.8)" rx="14" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

  <text x="50" y="118" fill="#f0f4ff" font-size="15" font-weight="700">添加水印</text>
  <text x="50" y="138" fill="#6b7a9f" font-size="12">上传 PDF 文件并设置水印参数，为文档添加保护标识。</text>

  <!-- Upload zone -->
  <rect x="50" y="155" width="580" height="65" rx="12" fill="rgba(20,31,55,0.85)" stroke="rgba(59,130,246,0.4)" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="340" y="182" fill="#6b7a9f" font-size="22" text-anchor="middle">📄</text>
  <text x="340" y="207" fill="#8899bb" font-size="13" text-anchor="middle">点击或拖拽上传 PDF 文件</text>

  <!-- Watermark text input -->
  <text x="50" y="248" fill="#8899bb" font-size="12">水印文字：</text>
  <rect x="135" y="234" width="200" height="28" rx="6" fill="#0a0e1a" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="145" y="253" fill="#4a5a7a" font-size="11">机密文件 · 请勿外传</text>

  <!-- Transparency slider -->
  <text x="375" y="248" fill="#8899bb" font-size="12">透明度：</text>
  <rect x="445" y="238" width="120" height="4" rx="2" fill="#1e293b"/>
  <rect x="445" y="238" width="60" height="4" rx="2" fill="url(#accent)"/>
  <circle cx="505" cy="240" r="7" fill="#3b82f6" stroke="#0f172a" stroke-width="2"/>
  <text x="575" y="248" fill="#6b7a9f" font-size="11">50%</text>

  <!-- Position selection -->
  <text x="50" y="282" fill="#8899bb" font-size="12">位置：</text>
  <rect x="100" y="268" width="70" height="26" rx="6" fill="#1e293b" stroke="#3b82f6" stroke-width="1"/>
  <text x="135" y="286" fill="#8899bb" font-size="11" text-anchor="middle">平铺</text>
  <rect x="178" y="268" width="70" height="26" rx="6" fill="rgba(10,14,26,0.6)" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  <text x="213" y="286" fill="#4a5a7a" font-size="11" text-anchor="middle">居中</text>
  <rect x="256" y="268" width="70" height="26" rx="6" fill="rgba(10,14,26,0.6)" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  <text x="291" y="286" fill="#4a5a7a" font-size="11" text-anchor="middle">左上</text>
  <rect x="334" y="268" width="70" height="26" rx="6" fill="rgba(10,14,26,0.6)" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  <text x="369" y="286" fill="#4a5a7a" font-size="11" text-anchor="middle">右下</text>

  <!-- Color picker + Rotation -->
  <text x="50" y="316" fill="#8899bb" font-size="12">颜色：</text>
  <rect x="100" y="302" width="30" height="26" rx="6" fill="rgba(10,14,26,0.6)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <rect x="105" y="307" width="20" height="16" rx="3" fill="#f87171"/>

  <text x="155" y="316" fill="#8899bb" font-size="12">旋转角度：</text>
  <rect x="230" y="302" width="160" height="4" rx="2" fill="#1e293b"/>
  <rect x="230" y="302" width="40" height="4" rx="2" fill="url(#accent)"/>
  <circle cx="270" cy="304" r="7" fill="#3b82f6" stroke="#0f172a" stroke-width="2"/>
  <text x="400" y="316" fill="#6b7a9f" font-size="11">0°</text>

  <!-- Page range -->
  <text x="430" y="316" fill="#8899bb" font-size="12">页面：</text>
  <rect x="475" y="302" width="60" height="26" rx="6" fill="rgba(10,14,26,0.6)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="495" y="319" fill="#4a5a7a" font-size="11" text-anchor="middle">全部</text>

  <!-- Action buttons -->
  <rect x="50" y="340" width="140" height="32" rx="8" fill="url(#accent)"/>
  <text x="120" y="361" fill="#fff" font-size="13" font-weight="600" text-anchor="middle">添加水印</text>

  <rect x="210" y="340" width="140" height="32" rx="8" fill="#1e293b" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <text x="280" y="361" fill="#6b7a9f" font-size="13" font-weight="500" text-anchor="middle">重置</text>

  <text x="340" y="370" fill="#f59e0b" font-size="10" text-anchor="middle">所有处理在浏览器本地完成，文件不会上传到服务器</text>
</svg>
