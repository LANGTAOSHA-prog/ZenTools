<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="'Inter',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b18"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="680" height="400" fill="url(#bg)" rx="14"/>
  <text x="30" y="42" fill="#f0f4ff" font-size="20" font-weight="700">🗜️ 音频压缩</text>
  <text x="30" y="66" fill="#6b7a9f" font-size="13">上传音频文件，在保持音质的同时显著减小文件大小。</text>
  <rect x="30" y="85" width="620" height="290" fill="rgba(14,22,41,0.8)" rx="14" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="50" y="118" fill="#f0f4ff" font-size="15" font-weight="700">设置压缩参数</text>
  <rect x="50" y="132" width="280" height="100" rx="10" fill="rgba(10,14,26,0.6)" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  <text x="65" y="155" fill="#f0f4ff" font-size="12" font-weight="600">输出格式</text>
  <rect x="65" y="165" width="60" height="24" rx="6" fill="rgba(59,130,246,0.3)" stroke="rgba(59,130,246,0.6)" stroke-width="1"/>
  <text x="95" y="182" fill="#fff" font-size="11" font-weight="600" text-anchor="middle">MP3</text>
  <rect x="130" y="165" width="60" height="24" rx="6" fill="rgba(255,255,255,0.03)"/>
  <text x="160" y="182" fill="#6b7a9f" font-size="11" font-weight="600" text-anchor="middle">WAV</text>
  <rect x="195" y="165" width="60" height="24" rx="6" fill="rgba(255,255,255,0.03)"/>
  <text x="225" y="182" fill="#6b7a9f" font-size="11" font-weight="600" text-anchor="middle">OGG</text>
  <rect x="260" y="165" width="60" height="24" rx="6" fill="rgba(255,255,255,0.03)"/>
  <text x="290" y="182" fill="#6b7a9f" font-size="11" font-weight="600" text-anchor="middle">AAC</text>
  <text x="65" y="208" fill="#f0f4ff" font-size="12" font-weight="600">比特率</text>
  <rect x="65" y="218" width="250" height="8" rx="4" fill="rgba(255,255,255,0.05)"/>
  <rect x="65" y="218" width="160" height="8" rx="4" fill="#3b82f6"/>
  <text x="65" y="242" fill="#6b7a9f" font-size="11">128kbps</text>
  <text x="280" y="242" fill="#4a5a7a" font-size="10" text-anchor="end">64kbps — 320kbps</text>
  <rect x="345" y="132" width="285" height="100" rx="10" fill="rgba(10,14,26,0.6)" stroke="rgba(0,229,255,0.2)" stroke-width="1"/>
  <text x="360" y="155" fill="#00e5ff" font-size="12" font-weight="600">压缩预览</text>
  <text x="360" y="178" fill="#8899bb" font-size="11">原始大小：24.5 MB</text>
  <text x="360" y="198" fill="#00e5ff" font-size="11">压缩后：约 6.2 MB</text>
  <text x="360" y="218" fill="#00e5ff" font-size="11">减少：75%</text>
  <text x="360" y="238" fill="#6b7a9f" font-size="11">预计耗时：3 秒</text>
  <rect x="50" y="245" width="580" height="110" rx="10" fill="rgba(10,14,26,0.6)" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  <text x="65" y="270" fill="#f0f4ff" font-size="12" font-weight="600">对比效果</text>
  <text x="65" y="295" fill="#8899bb" font-size="11">原始波形：</text>
  <g fill="rgba(139,92,246,0.3)">
    <rect x="140" y="282" width="2" height="16" rx="1"/>
    <rect x="146" y="278" width="2" height="24" rx="1"/>
    <rect x="152" y="280" width="2" height="20" rx="1"/>
    <rect x="158" y="276" width="2" height="28" rx="1"/>
    <rect x="164" y="284" width="2" height="12" rx="1"/>
    <rect x="170" y="278" width="2" height="24" rx="1"/>
    <rect x="176" y="274" width="2" height="32" rx="1"/>
    <rect x="182" y="280" width="2" height="20" rx="1"/>
    <rect x="188" y="282" width="2" height="16" rx="1"/>
    <rect x="194" y="276" width="2" height="28" rx="1"/>
  </g>
  <text x="65" y="325" fill="#8899bb" font-size="11">压缩后：</text>
  <g fill="rgba(0,229,255,0.4)">
    <rect x="140" y="312" width="2" height="12" rx="1"/>
    <rect x="146" y="308" width="2" height="20" rx="1"/>
    <rect x="152" y="310" width="2" height="16" rx="1"/>
    <rect x="158" y="306" width="2" height="24" rx="1"/>
    <rect x="164" y="314" width="2" height="8" rx="1"/>
    <rect x="170" y="308" width="2" height="20" rx="1"/>
    <rect x="176" y="304" width="2" height="28" rx="1"/>
    <rect x="182" y="310" width="2" height="16" rx="1"/>
    <rect x="188" y="312" width="2" height="12" rx="1"/>
    <rect x="194" y="306" width="2" height="24" rx="1"/>
  </g>
</svg>
