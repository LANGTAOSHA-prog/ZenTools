<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="'Inter',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b18"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
  </defs>
  <rect width="680" height="400" fill="url(#bg)" rx="14"/>

  <!-- Title -->
  <text x="30" y="42" fill="#f0f4ff" font-size="20" font-weight="700">📊 PDF 转 Excel</text>
  <text x="30" y="66" fill="#6b7a9f" font-size="13">转换成功！查看和下载生成的 Excel 文件。</text>

  <!-- Tool box -->
  <rect x="30" y="85" width="620" height="290" fill="rgba(14,22,41,0.8)" rx="14" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

  <!-- Success banner -->
  <rect x="50" y="105" width="580" height="36" fill="rgba(34,197,94,0.1)" rx="8" stroke="rgba(34,197,94,0.3)" stroke-width="1"/>
  <text x="78" y="128" fill="#22c55e" font-size="13" font-weight="700">✅ 转换完成！已成功提取 5 页中的表格数据</text>

  <!-- Full-width Excel preview -->
  <rect x="50" y="155" width="580" height="170" fill="rgba(20,31,55,0.5)" rx="10" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>

  <!-- Preview toolbar -->
  <rect x="50" y="155" width="580" height="30" rx="10" fill="rgba(255,255,255,0.03)"/>
  <text x="340" y="175" fill="#6b7a9f" font-size="12" text-anchor="middle">Excel 预览 · 工作表: Sheet1</text>

  <!-- Table header -->
  <rect x="65" y="192" width="550" height="24" fill="rgba(34,197,94,0.12)" rx="4"/>
  <text x="80" y="209" fill="#4ade80" font-size="11" font-weight="600">序号</text>
  <line x1="130" y1="192" x2="130" y2="216" stroke="rgba(34,197,94,0.15)" stroke-width="1"/>
  <text x="165" y="209" fill="#4ade80" font-size="11" font-weight="600">客户名称</text>
  <line x1="260" y1="192" x2="260" y2="216" stroke="rgba(34,197,94,0.15)" stroke-width="1"/>
  <text x="295" y="209" fill="#4ade80" font-size="11" font-weight="600">合同编号</text>
  <line x1="390" y1="192" x2="390" y2="216" stroke="rgba(34,197,94,0.15)" stroke-width="1"/>
  <text x="425" y="209" fill="#4ade80" font-size="11" font-weight="600">金额</text>
  <line x1="480" y1="192" x2="480" y2="216" stroke="rgba(34,197,94,0.15)" stroke-width="1"/>
  <text x="515" y="209" fill="#4ade80" font-size="11" font-weight="600">日期</text>

  <!-- Row 1 -->
  <rect x="65" y="218" width="550" height="22" fill="rgba(255,255,255,0.015)" rx="0"/>
  <text x="80" y="234" fill="#c8d0dc" font-size="11">1</text>
  <text x="165" y="234" fill="#c8d0dc" font-size="11">北京科技有限公司</text>
  <text x="295" y="234" fill="#c8d0dc" font-size="11">CT-2025-001</text>
  <text x="425" y="234" fill="#c8d0dc" font-size="11">¥128,000</text>
  <text x="515" y="234" fill="#c8d0dc" font-size="11">2025-03-15</text>
  <line x1="65" y1="240" x2="615" y2="240" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>

  <!-- Row 2 -->
  <rect x="65" y="241" width="550" height="22" fill="rgba(255,255,255,0.01)" rx="0"/>
  <text x="80" y="257" fill="#c8d0dc" font-size="11">2</text>
  <text x="165" y="257" fill="#c8d0dc" font-size="11">上海贸易有限公司</text>
  <text x="295" y="257" fill="#c8d0dc" font-size="11">CT-2025-002</text>
  <text x="425" y="257" fill="#c8d0dc" font-size="11">¥256,500</text>
  <text x="515" y="257" fill="#c8d0dc" font-size="11">2025-03-20</text>
  <line x1="65" y1="263" x2="615" y2="263" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>

  <!-- Row 3 -->
  <rect x="65" y="264" width="550" height="22" fill="rgba(255,255,255,0.015)" rx="0"/>
  <text x="80" y="280" fill="#c8d0dc" font-size="11">3</text>
  <text x="165" y="280" fill="#c8d0dc" font-size="11">深圳创新科技</text>
  <text x="295" y="280" fill="#c8d0dc" font-size="11">CT-2025-003</text>
  <text x="425" y="280" fill="#c8d0dc" font-size="11">¥89,200</text>
  <text x="515" y="280" fill="#c8d0dc" font-size="11">2025-04-01</text>
  <line x1="65" y1="286" x2="615" y2="286" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>

  <!-- Row 4 -->
  <rect x="65" y="287" width="550" height="22" fill="rgba(255,255,255,0.01)" rx="0"/>
  <text x="80" y="303" fill="#c8d0dc" font-size="11">4</text>
  <text x="165" y="303" fill="#c8d0dc" font-size="11">广州数据服务</text>
  <text x="295" y="303" fill="#c8d0dc" font-size="11">CT-2025-004</text>
  <text x="425" y="303" fill="#c8d0dc" font-size="11">¥45,800</text>
  <text x="515" y="303" fill="#c8d0dc" font-size="11">2025-04-10</text>

  <!-- Bottom bar -->
  <rect x="50" y="325" width="580" height="36" fill="rgba(255,255,255,0.02)" rx="8" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
  <text x="70" y="348" fill="#4a5a7a" font-size="11">📊 共 4 行数据 · 已识别 5 个表格字段</text>

  <!-- Download button -->
  <rect x="370" y="332" width="120" height="24" fill="url(#accent)" rx="6"/>
  <text x="430" y="349" fill="#fff" font-size="12" font-weight="600" text-anchor="middle">下载 .xlsx</text>

  <rect x="500" y="332" width="110" height="24" fill="rgba(255,255,255,0.06)" rx="6"/>
  <text x="555" y="349" fill="#8899bb" font-size="12" font-weight="500" text-anchor="middle">下载 .xls</text>
</svg>