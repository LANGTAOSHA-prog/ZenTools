<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#070b18"/>
    </linearGradient>
  </defs>
  <rect width="680" height="400" fill="url(#bgGrad)"/>
  <text x="340" y="50" text-anchor="middle" font-size="24" font-weight="bold" fill="#ffffff">Phind AI</text>
  <text x="340" y="80" text-anchor="middle" font-size="14" fill="#94a3b8">AI 编程助手和代码解答</text>
  <rect x="50" y="110" width="580" height="240" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <rect x="70" y="130" width="540" height="40" rx="4" fill="#334155"/>
  <text x="90" y="155" font-size="13" fill="#e2e8f0">💻 代码解答 | 🐛 Bug 调试 | 📖 代码解释 | 🔧 最佳实践</text>
  <rect x="90" y="190" width="500" height="140" rx="6" fill="#0d1117" font-family="monospace"/>
  <text x="110" y="210" font-size="10" fill="#8b949e">// Python 实现快速排序算法</text>
  <text x="110" y="230" font-size="10" fill="#c9d1d9">def quick_sort(arr):</text>
  <text x="110" y="250" font-size="10" fill="#c9d1d9">&nbsp;&nbsp;if len(arr) &lt;= 1:</text>
  <text x="110" y="270" font-size="10" fill="#c9d1d9>&nbsp;&nbsp;&nbsp;&nbsp;return arr</text>
  <text x="110" y="290" font-size="10" fill="#c9d1d9">&nbsp;&nbsp;pivot = arr[len(arr) // 2]</text>
  <text x="110" y="310" font-size="10" fill="#c9d1d9">&nbsp;&nbsp;left = [x for x in arr if x &lt; pivot]</text>
  <text x="110" y="330" font-size="10" fill="#c9d1d9">&nbsp;&nbsp;middle = [x for x in arr if x == pivot]</text>
  <text x="110" y="350" font-size="10" fill="#c9d1d9">&nbsp;&nbsp;right = [x for x in arr if x &gt; pivot]</text>
  <text x="110" y="370" font-size="10" fill="#c9d1d9">&nbsp;&nbsp;return quick_sort(left) + middle + quick_sort(right)</text>
  <polygon points="110,205 125,215 110,225" fill="#58a6ff"/>
  <rect x="70" y="345" width="200" height="36" rx="6" fill="#58a6ff"/>
  <text x="170" y="367" text-anchor="middle" font-size="13" fill="#ffffff">提问代码问题</text>
  <rect x="290" y="345" width="140" height="36" rx="6" fill="#334155"/>
  <text x="360" y="367" text-anchor="middle" font-size="13" fill="#94a3b8">代码库</text>
  <rect x="450" y="345" width="180" height="36" rx="6" fill="#334155"/>
  <text x="540" y="367" text-anchor="middle" font-size="13" fill="#94a3b8">集成 IDE</text>
</svg>
