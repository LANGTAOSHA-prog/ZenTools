<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b18"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>
  <rect width="680" height="400" fill="url(#bg)" rx="12"/>
  <text x="340" y="48" text-anchor="middle" fill="url(#accent)" font-size="20" font-weight="700" font-family="system-ui,sans-serif">Hash Generator</text>
  <text x="340" y="68" text-anchor="middle" fill="#64748b" font-size="11" font-family="system-ui,sans-serif">哈希生成器 - Hash Generator</text>
  <!-- Input area -->
  <rect x="40" y="90" width="300" height="280" rx="12" fill="url(#card)" stroke="#334155" stroke-width="1"/>
  <text x="60" y="118" fill="#94a3b8" font-size="12" font-weight="600" font-family="system-ui,sans-serif">输入文本</text>
  <rect x="60" y="128" width="260" height="100" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="74" y="152" fill="#e2e8f0" font-size="13" font-family="monospace">Hello, World!</text>
  <text x="74" y="176" fill="#64748b" font-size="12" font-family="monospace">输入任意文本或粘贴文件</text>
  <text x="74" y="200" fill="#64748b" font-size="12" font-family="monospace">内容即可生成哈希值</text>
  <!-- Algorithm selector -->
  <text x="60" y="250" fill="#94a3b8" font-size="11" font-family="system-ui,sans-serif">算法选择</text>
  <rect x="60" y="258" width="75" height="26" rx="5" fill="#10b981" opacity="0.2" stroke="#10b981" stroke-width="1"/>
  <text x="97" y="275" fill="#10b981" font-size="10" font-weight="600" font-family="system-ui,sans-serif" text-anchor="middle">MD5</text>
  <rect x="142" y="258" width="75" height="26" rx="5" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="179" y="275" fill="#94a3b8" font-size="10" font-family="system-ui,sans-serif" text-anchor="middle">SHA-1</text>
  <rect x="224" y="258" width="75" height="26" rx="5" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="261" y="275" fill="#94a3b8" font-size="10" font-family="system-ui,sans-serif" text-anchor="middle">SHA-256</text>
  <rect x="60" y="292" width="75" height="26" rx="5" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="97" y="309" fill="#94a3b8" font-size="10" font-family="system-ui,sans-serif" text-anchor="middle">SHA-512</text>
  <rect x="142" y="292" width="157" height="26" rx="5" fill="url(#accent)" opacity="0.15" stroke="url(#accent)" stroke-width="1"/>
  <text x="220" y="309" fill="#06b6d4" font-size="10" font-weight="600" font-family="system-ui,sans-serif" text-anchor="middle">全部一键生成</text>
  <!-- Output area -->
  <rect x="360" y="90" width="280" height="280" rx="12" fill="url(#card)" stroke="#334155" stroke-width="1"/>
  <text x="380" y="118" fill="#94a3b8" font-size="12" font-weight="600" font-family="system-ui,sans-serif">哈希结果</text>
  <text x="380" y="142" fill="#64748b" font-size="10" font-weight="600" font-family="system-ui,sans-serif">MD5</text>
  <rect x="380" y="148" width="240" height="26" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="392" y="165" fill="#e2e8f0" font-size="10" font-family="monospace">65a8e27d8747ef...3b5d3ff7c2</text>
  <text x="380" y="194" fill="#64748b" font-size="10" font-weight="600" font-family="system-ui,sans-serif">SHA-256</text>
  <rect x="380" y="200" width="240" height="26" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="392" y="217" fill="#e2e8f0" font-size="10" font-family="monospace">40bd001563085fc3...7e4892b5d1</text>
  <text x="380" y="248" fill="#64748b" font-size="10" font-weight="600" font-family="system-ui,sans-serif">SHA-512</text>
  <rect x="380" y="254" width="240" height="26" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="392" y="271" fill="#e2e8f0" font-size="10" font-family="monospace">356a192b7913b04c...a1f0dd0d67</text>
  <rect x="380" y="290" width="115" height="26" rx="6" fill="#10b981" opacity="0.2" stroke="#10b981" stroke-width="1"/>
  <text x="437" y="307" fill="#10b981" font-size="10" font-weight="600" font-family="system-ui,sans-serif" text-anchor="middle">复制全部</text>
  <rect x="505" y="290" width="115" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="562" y="307" fill="#94a3b8" font-size="10" font-weight="600" font-family="system-ui,sans-serif" text-anchor="middle">清空重置</text>
</svg>