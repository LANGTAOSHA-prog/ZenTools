<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="'Inter',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b18"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="680" height="400" fill="url(#bg)" rx="14"/>

  <!-- Title -->
  <text x="30" y="42" fill="#f0f4ff" font-size="20" font-weight="700">🔀 代码对比</text>
  <text x="30" y="66" fill="#6b7a9f" font-size="13">对比两段代码的差异，支持行级和字符级对比，高亮显示增删内容。</text>

  <!-- Tool box -->
  <rect x="30" y="85" width="620" height="290" fill="rgba(14,22,41,0.8)" rx="14" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

  <!-- Left: Original -->
  <text x="50" y="115" fill="#f0f4ff" font-size="14" font-weight="700">原始版本</text>
  <rect x="50" y="125" width="280" height="200" rx="10" fill="#0a0e1a" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  
  <text x="65" y="150" fill="#4a5a7a" font-size="11">1 </text>
  <text x="75" y="150" fill="#f0f4ff" font-size="12">const name = "Alice";</text>
  <text x="65" y="170" fill="#4a5a7a" font-size="11">2 </text>
  <text x="75" y="170" fill="#f0f4ff" font-size="12">const age = 25;</text>
  <text x="65" y="190" fill="#4a5a7a" font-size="11">3 </text>
  <text x="75" y="190" fill="#f0f4ff" font-size="12">const city = "Beijing";</text>
  <text x="65" y="210" fill="#4a5a7a" font-size="11">4 </text>
  <text x="75" y="210" fill="#f0f4ff" font-size="12">const role = "admin";</text>
  <text x="65" y="230" fill="#4a5a7a" font-size="11">5 </text>
  <text x="75" y="230" fill="#f0f4ff" font-size="12">const active = true;</text>

  <!-- Center: Diff arrow -->
  <rect x="330" y="170" width="30" height="50" rx="6" fill="url(#accent)"/>
  <text x="345" y="200" fill="#fff" font-size="16" font-weight="700" text-anchor="middle">→</text>

  <!-- Right: Modified -->
  <text x="390" y="115" fill="#f0f4ff" font-size="14" font-weight="700">修改版本</text>
  <rect x="370" y="125" width="280" height="200" rx="10" fill="#0a0e1a" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  
  <text x="385" y="150" fill="#4a5a7a" font-size="11">1 </text>
  <text x="395" y="150" fill="#f0f4ff" font-size="12">const name = "Alice";</text>
  <text x="385" y="170" fill="#4a5a7a" font-size="11">2 </text>
  <text x="395" y="170" fill="#f0f4ff" font-size="12">const age = 30;</text>
  <text x="385" y="190" fill="#4a5a7a" font-size="11">3 </text>
  <text x="395" y="190" fill="#22c55e" font-size="12">const city = "Shanghai";</text>
  <text x="385" y="210" fill="#4a5a7a" font-size="11">4 </text>
  <text x="395" y="210" fill="#22c55e" font-size="12">const role = "user";</text>
  <text x="385" y="230" fill="#4a5a7a" font-size="11">5 </text>
  <text x="395" y="230" fill="#f0f4ff" font-size="12">const active = true;</text>

  <!-- Diff summary bar -->
  <rect x="50" y="335" width="600" height="30" rx="8" fill="rgba(20,31,55,0.8)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="70" y="354" fill="#22c55e" font-size="12">+ 2 行已修改</text>
  <text x="200" y="354" fill="#ef4444" font-size="12">- 0 行已删除</text>
  <text x="330" y="354" fill="#3b82f6" font-size="12">+ 0 行已添加</text>
  <text x="460" y="354" fill="#6b7a9f" font-size="12">对比模式：行级</text>

  <!-- Compare button -->
  <rect x="250" y="335" width="100" height="30" fill="url(#accent)" rx="8"/>
  <text x="300" y="355" fill="#fff" font-size="13" font-weight="600" text-anchor="middle">开始对比</text>
</svg>
