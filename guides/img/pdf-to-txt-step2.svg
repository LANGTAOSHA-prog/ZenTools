<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="'Inter',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b18"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
  </defs>
  <rect width="680" height="400" fill="url(#bg)" rx="14"/>

  <text x="30" y="42" fill="#f0f4ff" font-size="20" font-weight="700">📄 PDF 转 TXT - 结果</text>
  <text x="30" y="66" fill="#6b7a9f" font-size="13">文字提取完成，可预览纯文本内容并下载为 TXT 文件。</text>

  <rect x="30" y="85" width="620" height="290" fill="rgba(14,22,41,0.8)" rx="14" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

  <text x="50" y="118" fill="#f0f4ff" font-size="15" font-weight="700">纯文本预览</text>
  <text x="50" y="138" fill="#00e5ff" font-size="12">✅ 提取完成！共 3 页 · UTF-8</text>

  <!-- Text preview area -->
  <rect x="50" y="152" width="580" height="145" rx="10" fill="rgba(10,14,26,0.6)" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <text x="65" y="175" fill="#8899bb" font-size="11">第 1 页</text>
  <text x="65" y="194" fill="#f0f4ff" font-size="12">ZenTools 是一款免费在线工具箱，</text>
  <text x="65" y="212" fill="#f0f4ff" font-size="12">提供 PDF 处理、图片编辑、格式转换、</text>
  <text x="65" y="230" fill="#f0f4ff" font-size="12">AI 写作等多种实用工具。</text>
  <text x="65" y="248" fill="#f0f4ff" font-size="12">所有工具在浏览器本地运行，</text>
  <text x="65" y="266" fill="#f0f4ff" font-size="12">文件不会上传到服务器。</text>

  <!-- Encoding selection (after extraction) -->
  <text x="50" y="318" fill="#6b7a9f" font-size="12">编码：</text>
  <rect x="100" y="306" width="120" height="26" rx="6" fill="#0a0e1a" stroke="rgba(0,229,255,0.3)" stroke-width="1"/>
  <text x="125" y="323" fill="#00e5ff" font-size="12" font-weight="600">UTF-8 ✓</text>

  <!-- Download button -->
  <rect x="240" y="306" width="200" height="40" rx="999" fill="url(#accent)"/>
  <text x="340" y="332" fill="#fff" font-size="14" font-weight="700" text-anchor="middle">📥 下载 TXT 文件</text>

  <!-- Copy button -->
  <rect x="455" y="306" width="120" height="40" rx="999" fill="rgba(10,14,26,0.6)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="515" y="332" fill="#f0f4ff" font-size="13" font-weight="600" text-anchor="middle">📋 复制文本</text>
</svg>
