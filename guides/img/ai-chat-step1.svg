<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="'Inter',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b18"/>
    </linearGradient>
    <linearGradient id="userMsg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="680" height="400" fill="url(#bg)" rx="14"/>
  <text x="30" y="42" fill="#f0f4ff" font-size="20" font-weight="700">💬 AI 聊天</text>
  <text x="30" y="66" fill="#6b7a9f" font-size="13">与 AI 智能对话，支持多轮问答、知识查询和创意讨论。</text>
  <rect x="30" y="85" width="620" height="290" fill="rgba(14,22,41,0.8)" rx="14" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <!-- Chat messages -->
  <rect x="50" y="100" width="400" height="60" rx="10" fill="rgba(20,31,55,0.9)" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <text x="70" y="125" fill="#f0f4ff" font-size="13">你好！请介绍一下 ZenTools 有哪些功能？</text>
  <text x="70" y="148" fill="#4a5a7a" font-size="10">用户 · 刚刚</text>
  <rect x="180" y="172" width="430" height="80" rx="10" fill="rgba(59,130,246,0.08)" stroke="rgba(59,130,246,0.15)" stroke-width="1"/>
  <text x="200" y="197" fill="#f0f4ff" font-size="13">ZenTools 是一款免费的在线工具箱，提供以下功能：</text>
  <text x="200" y="218" fill="#94a3b8" font-size="12">• 📄 PDF 处理（合并、拆分、压缩、转换）</text>
  <text x="200" y="238" fill="#94a3b8" font-size="12">• 🖼️ 图片编辑（格式转换、压缩、去背景）</text>
  <rect x="50" y="265" width="350" height="50" rx="10" fill="rgba(20,31,55,0.9)" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <text x="70" y="290" fill="#f0f4ff" font-size="13">那 PDF 加密功能怎么使用？</text>
  <text x="70" y="308" fill="#4a5a7a" font-size="10">用户 · 刚刚</text>
  <!-- Typing indicator -->
  <rect x="180" y="325" width="100" height="36" rx="10" fill="rgba(59,130,246,0.08)" stroke="rgba(59,130,246,0.15)" stroke-width="1"/>
  <text x="230" y="348" fill="#3b82f6" font-size="12" text-anchor="middle">AI 正在输入...</text>
</svg>
