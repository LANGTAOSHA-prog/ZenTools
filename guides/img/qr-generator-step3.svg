  <rect x="30" y="85" width="620" height="275" fill="rgba(14,22,41,0.8)" rx="14" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

  <!-- Success -->
  <circle cx="340" cy="130" r="28" fill="rgba(16,185,129,0.12)" stroke="rgba(16,185,129,0.3)" stroke-width="2"/>
  <text x="340" y="140" fill="#10b981" font-size="28" text-anchor="middle">✓</text>

  <text x="340" y="180" fill="#f0f4ff" font-size="16" font-weight="700" text-anchor="middle">二维码生成成功</text>
  <text x="340" y="202" fill="#6b7a9f" font-size="13" text-anchor="middle">链接已编码为精美二维码，可直接下载使用</text>

  <!-- QR thumbnail -->
  <rect x="160" y="218" width="56" height="56" fill="white" rx="6"/>
  <rect x="168" y="226" width="8" height="8" fill="url(#g1)" rx="1"/>
  <rect x="178" y="226" width="8" height="8" fill="url(#g1)" rx="1"/>
  <rect x="188" y="226" width="8" height="8" fill="url(#g1)" rx="1"/>
  <rect x="198" y="226" width="8" height="8" fill="url(#g1)" rx="1"/>
  <rect x="168" y="236" width="8" height="8" fill="url(#g1)" rx="1"/>
  <rect x="198" y="236" width="8" height="8" fill="url(#g1)" rx="1"/>
  <rect x="168" y="246" width="8" height="8" fill="url(#g1)" rx="1"/>
  <rect x="178" y="246" width="8" height="8" fill="url(#g1)" rx="1"/>
  <rect x="188" y="246" width="8" height="8" fill="url(#g1)" rx="1"/>
  <rect x="198" y="246" width="8" height="8" fill="url(#g1)" rx="1"/>
  <rect x="168" y="256" width="8" height="8" fill="url(#g1)" rx="1"/>
  <rect x="188" y="256" width="8" height="8" fill="url(#g1)" rx="1"/>
  <rect x="198" y="256" width="8" height="8" fill="url(#g1)" rx="1"/>

  <!-- Summary info -->
  <text x="240" y="238" fill="#94a3b8" font-size="12">内容: https://zentools.xyz</text>
  <text x="240" y="256" fill="#94a3b8" font-size="12">格式: PNG · 尺寸: 1024×1024 · 含 Logo</text>
  <text x="240" y="274" fill="#4a5a7a" font-size="11">可在网站、海报、名片等场景使用</text>

  <!-- Download buttons -->
  <rect x="120" y="292" width="200" height="42" fill="url(#green)" rx="999"/>
  <text x="220" y="319" fill="#fff" font-size="14" font-weight="700" text-anchor="middle">📥 再次下载 PNG</text>

  <rect x="340" y="292" width="200" height="42" fill="rgba(20,31,55,0.9)" rx="999" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="440" y="319" fill="#94a3b8" font-size="13" font-weight="600" text-anchor="middle">🔄 生成新的二维码</text>

