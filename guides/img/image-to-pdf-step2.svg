<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="'Inter',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b18"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
  </defs>
  <rect width="680" height="400" fill="url(#bg)" rx="14"/>

  <text x="30" y="42" fill="#f0f4ff" font-size="20" font-weight="700">📸 图片转 PDF - 结果</text>
  <text x="30" y="66" fill="#6b7a9f" font-size="13">PDF 生成完成，可调整页面顺序后下载。</text>

  <rect x="30" y="85" width="620" height="290" fill="rgba(14,22,41,0.8)" rx="14" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

  <text x="50" y="118" fill="#f0f4ff" font-size="15" font-weight="700">预览 PDF（共 3 页）</text>

  <!-- Page previews -->
  <rect x="50" y="135" width="140" height="100" rx="8" fill="rgba(20,31,55,0.85)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <rect x="65" y="150" width="110" height="70" rx="4" fill="#0f172a" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="120" y="177" fill="#6b7a9f" font-size="10" text-anchor="middle">🏔️ 照片-1.jpg</text>
  <text x="120" y="222" fill="#4a5a7a" font-size="10" text-anchor="middle">第 1 页</text>

  <rect x="200" y="135" width="140" height="100" rx="8" fill="rgba(20,31,55,0.85)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <rect x="215" y="150" width="110" height="70" rx="4" fill="#0f172a" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="270" y="177" fill="#6b7a9f" font-size="10" text-anchor="middle">🏖️ 照片-2.jpg</text>
  <text x="270" y="222" fill="#4a5a7a" font-size="10" text-anchor="middle">第 2 页</text>

  <rect x="350" y="135" width="140" height="100" rx="8" fill="rgba(20,31,55,0.85)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <rect x="365" y="150" width="110" height="70" rx="4" fill="#0f172a" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="420" y="177" fill="#6b7a9f" font-size="10" text-anchor="middle">🌆 照片-3.jpg</text>
  <text x="420" y="222" fill="#4a5a7a" font-size="10" text-anchor="middle">第 3 页</text>

  <!-- Download button -->
  <rect x="200" y="255" width="280" height="46" rx="999" fill="url(#accent)"/>
  <text x="340" y="283" fill="#fff" font-size="15" font-weight="700" text-anchor="middle">⬇ 下载 PDF</text>

  <text x="340" y="320" fill="#4a5a7a" font-size="11" text-anchor="middle">图片将按顺序合并为一个 PDF 文件</text>
  <text x="340" y="338" fill="#4a5a7a" font-size="11" text-anchor="middle">每张图片占 PDF 中的一页，支持 A4 纸张大小</text>

  <!-- Arrow -->
  <text x="635" y="180" fill="#3b82f6" font-size="20">👆</text>
</svg>
