<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="'Inter',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0f172a"/><stop offset="100%" stop-color="#070b18"/></linearGradient><linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#3b82f6"/><stop offset="100%" stop-color="#06b6d4"/></linearGradient></defs>
  <rect width="680" height="400" fill="url(#bg)" rx="14"/>
  <text x="30" y="42" fill="#f0f4ff" font-size="20" font-weight="700">📅 日期计算器</text>
  <text x="30" y="66" fill="#6b7a9f" font-size="13">计算两个日期间的天数差、工作天数、加减天数</text>
  <rect x="30" y="85" width="620" height="290" fill="rgba(14,22,41,0.8)" rx="14" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="50" y="118" fill="#f0f4ff" font-size="14" font-weight="600">开始日期</text>
  <rect x="50" y="128" width="260" height="42" fill="#0a0e1a" rx="8" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="65" y="154" fill="#f0f4ff" font-size="16">2026-01-01</text>
  <text x="330" y="118" fill="#f0f4ff" font-size="14" font-weight="600">结束日期</text>
  <rect x="330" y="128" width="260" height="42" fill="#0a0e1a" rx="8" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="345" y="154" fill="#f0f4ff" font-size="16">2026-06-28</text>
  <rect x="50" y="198" width="580" height="155" fill="#0f1a35" rx="10" stroke="rgba(59,130,246,0.15)" stroke-width="1"/>
  <text x="160" y="235" fill="#6b7a9f" font-size="13" text-anchor="middle">总天数</text>
  <text x="160" y="265" fill="#00e5ff" font-size="28" font-weight="800" text-anchor="middle">178 天</text>
  <text x="340" y="235" fill="#6b7a9f" font-size="13" text-anchor="middle">工作日</text>
  <text x="340" y="265" fill="#10b981" font-size="28" font-weight="800" text-anchor="middle">126 天</text>
  <text x="520" y="235" fill="#6b7a9f" font-size="13" text-anchor="middle">周末</text>
  <text x="520" y="265" fill="#ef4444" font-size="28" font-weight="800" text-anchor="middle">52 天</text>
  <text x="340" y="315" fill="#6b7a9f" font-size="12" text-anchor="middle">相差 5 个月 27 天 · 25 周零 3 天</text>
</svg>