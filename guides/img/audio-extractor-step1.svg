<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="'Inter',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b18"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="680" height="400" fill="url(#bg)" rx="14"/>
  <text x="30" y="42" fill="#f0f4ff" font-size="20" font-weight="700">🎙️ 音频提取</text>
  <text x="30" y="66" fill="#6b7a9f" font-size="13">从视频文件中提取音频轨道，支持多种视频格式。</text>
  <rect x="30" y="85" width="620" height="290" fill="rgba(14,22,41,0.8)" rx="14" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="50" y="118" fill="#f0f4ff" font-size="15" font-weight="700">提取视频音频</text>
  <rect x="50" y="132" width="580" height="70" rx="12" fill="rgba(20,31,55,0.85)" stroke="rgba(59,130,246,0.4)" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="340" y="162" fill="#6b7a9f" font-size="26" text-anchor="middle">🎬</text>
  <text x="340" y="188" fill="#8899bb" font-size="13" text-anchor="middle">点击上传或拖拽视频文件到此处</text>
  <rect x="50" y="215" width="580" height="60" rx="10" fill="rgba(10,14,26,0.6)" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  <rect x="65" y="228" width="480" height="34" rx="6" fill="rgba(20,31,55,0.8)" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <text x="80" y="250" fill="#f0f4ff" font-size="12">🎬 vacation_trip.mp4</text>
  <text x="420" y="250" fill="#6b7a9f" font-size="11">128 MB</text>
  <text x="520" y="250" fill="#00e5ff" font-size="11" font-weight="600">已选择</text>
  <rect x="50" y="285" width="280" height="65" rx="10" fill="rgba(10,14,26,0.6)" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  <text x="65" y="310" fill="#f0f4ff" font-size="12" font-weight="600">输出格式</text>
  <rect x="65" y="320" width="60" height="22" rx="4" fill="rgba(59,130,246,0.3)" stroke="rgba(59,130,246,0.6)" stroke-width="1"/>
  <text x="95" y="335" fill="#fff" font-size="10" font-weight="600" text-anchor="middle">MP3</text>
  <rect x="130" y="320" width="60" height="22" rx="4" fill="rgba(255,255,255,0.03)"/>
  <text x="160" y="335" fill="#6b7a9f" font-size="10" font-weight="600" text-anchor="middle">WAV</text>
  <rect x="195" y="320" width="60" height="22" rx="4" fill="rgba(255,255,255,0.03)"/>
  <text x="225" y="335" fill="#6b7a9f" font-size="10" font-weight="600" text-anchor="middle">AAC</text>
  <rect x="340" y="285" width="290" height="65" rx="10" fill="rgba(10,14,26,0.6)" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  <text x="355" y="310" fill="#f0f4ff" font-size="12" font-weight="600">比特率设置</text>
  <text x="355" y="335" fill="#6b7a9f" font-size="11">128kbps</text>
  <rect x="440" y="325" width="120" height="10" rx="5" fill="rgba(59,130,246,0.3)"/>
  <rect x="440" y="325" width="80" height="10" rx="5" fill="#3b82f6"/>
  <rect x="50" y="355" width="580" height="38" fill="url(#accent)" rx="8"/>
  <text x="340" y="379" fill="#fff" font-size="14" font-weight="600" text-anchor="middle">🎙️ 提取音频</text>
</svg>
