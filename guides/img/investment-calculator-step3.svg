<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="'Inter',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b18"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="680" height="400" fill="url(#bg)" rx="14"/>

  <text x="30" y="42" fill="#f0f4ff" font-size="20" font-weight="700">📈 投资计算器</text>
  <text x="30" y="66" fill="#6b7a9f" font-size="13">步骤 3：高级参数与风险评估</text>

  <rect x="30" y="85" width="620" height="290" fill="rgba(14,22,41,0.8)" rx="14" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

  <text x="50" y="118" fill="#f0f4ff" font-size="15" font-weight="700">IRR 与风险评估</text>
  <text x="50" y="138" fill="#6b7a9f" font-size="12">输入各期现金流，自动计算内部收益率 IRR 并评估投资风险等级。</text>

  <rect x="50" y="155" width="580" height="70" fill="#0a0e1a" rx="8" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="65" y="178" fill="#8899bb" font-size="12">现金流 (每行一期，用逗号分隔)</text>
  <text x="65" y="198" fill="#f0f4ff" font-size="13">-100000, 20000, 22000, 24000, 26000, 30000, 32000, 35000, 38000, 42000, 48000</text>
  <text x="65" y="216" fill="#4a5a7a" font-size="11">首期为负表示初始投资支出，后续为正表示各期收益流入。</text>

  <text x="50" y="248" fill="#f0f4ff" font-size="14" font-weight="700">风险等级评估</text>
  <rect x="50" y="260" width="172" height="32" fill="rgba(16,185,129,0.12)" rx="8" stroke="rgba(16,185,129,0.3)" stroke-width="1"/>
  <text x="136" y="280" fill="#10b981" font-size="13" font-weight="600" text-anchor="middle">低风险</text>
  <rect x="232" y="260" width="172" height="32" fill="rgba(59,130,246,0.1)" rx="8" stroke="rgba(59,130,246,0.25)" stroke-width="1"/>
  <text x="318" y="280" fill="#3b82f6" font-size="13" font-weight="600" text-anchor="middle">中风险</text>
  <rect x="414" y="260" width="172" height="32" fill="rgba(239,68,68,0.08)" rx="8" stroke="rgba(239,68,68,0.2)" stroke-width="1"/>
  <text x="500" y="280" fill="#ef4444" font-size="13" text-anchor="middle">高风险</text>

  <rect x="50" y="307" width="580" height="50" fill="#0f1a35" rx="10" stroke="rgba(0,229,255,0.1)" stroke-width="1"/>
  <text x="70" y="330" fill="#6b7a9f" font-size="13">IRR 计算结果: <tspan fill="#00e5ff" font-weight="700">16.4%</tspan></text>
  <text x="70" y="350" fill="#4a5a7a" font-size="12">项目 IRR 大于折现率，净现值为正，建议投资。</text>
</svg>
