<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="'Inter',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b18"/>
    </linearGradient>
    <linearGradient id="userMsg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="680" height="400" fill="url(#bg)" rx="14"/>
  <text x="30" y="42" fill="#f0f4ff" font-size="20" font-weight="700">✨ AI 润色</text>
  <text x="30" y="66" fill="#6b7a9f" font-size="13">优化文本的语法、用词和表达方式，提升文章的可读性和专业性。</text>
  <rect x="30" y="85" width="620" height="290" fill="rgba(14,22,41,0.8)" rx="14" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <!-- Input panel -->
  <rect x="50" y="100" width="280" height="180" rx="10" fill="rgba(20,31,55,0.9)" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <text x="70" y="125" fill="#f0f4ff" font-size="14" font-weight="600">原始文本</text>
  <rect x="70" y="140" width="240" height="100" rx="8" fill="rgba(14,22,41,0.6)" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <text x="80" y="165" fill="#94a3b8" font-size="11">这个产品非常好用，我非常喜欢。</text>
  <text x="80" y="185" fill="#94a3b8" font-size="11">它的功能很强大，界面也很友好。</text>
  <text x="80" y="205" fill="#94a3b8" font-size="11">推荐给大家使用。</text>
  <rect x="70" y="255" width="100" height="32" rx="8" fill="url(#userMsg)" opacity="0.8"/>
  <text x="120" y="276" fill="#fff" font-size="12" text-anchor="middle">开始润色</text>
  <!-- Output panel -->
  <rect x="350" y="100" width="280" height="180" rx="10" fill="rgba(20,31,55,0.9)" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <text x="370" y="125" fill="#f0f4ff" font-size="14" font-weight="600">润色结果</text>
  <rect x="370" y="140" width="240" height="100" rx="8" fill="rgba(14,22,41,0.6)" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <text x="380" y="165" fill="#22c55e" font-size="11">这款产品体验卓越，我对其爱不释手。</text>
  <text x="380" y="185" fill="#22c55e" font-size="11">功能丰富且强大，界面设计直观友好。</text>
  <text x="380" y="205" fill="#22c55e" font-size="11">强烈推荐给广大用户。</text>
  <rect x="370" y="255" width="100" height="32" rx="8" fill="rgba(34,197,94,0.2)" stroke="rgba(34,197,94,0.3)" stroke-width="1"/>
  <text x="420" y="276" fill="#22c55e" font-size="12" text-anchor="middle">复制结果</text>
  <!-- Features -->
  <text x="50" y="310" fill="#6b7a9f" font-size="11">支持：语法优化 · 用词润色 · 表达提升 · 专业性增强</text>
  <text x="350" y="310" fill="#6b7a9f" font-size="11">保持原意 · 提升质量 · 多种风格</text>
  <!-- Bottom info -->
  <text x="50" y="340" fill="#4a5a7a" font-size="10">所有处理在浏览器本地完成，文件不会上传到服务器</text>
</svg>