<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="'Inter',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b18"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="680" height="400" fill="url(#bg)" rx="14"/>
  <text x="30" y="42" fill="#f0f4ff" font-size="20" font-weight="700">MP3 格式转换</text>
  <text x="30" y="66" fill="#6b7a9f" font-size="13">支持 MP3、WAV、FLAC、AAC、OGG 等常见音频格式互转。</text>
  <rect x="30" y="85" width="620" height="290" fill="rgba(14,22,41,0.8)" rx="14" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="50" y="118" fill="#f0f4ff" font-size="15" font-weight="700">选择要转换的音频文件</text>
  <rect x="50" y="132" width="580" height="70" rx="12" fill="rgba(20,31,55,0.85)" stroke="rgba(59,130,246,0.4)" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="340" y="162" fill="#6b7a9f" font-size="26" text-anchor="middle">🎵</text>
  <text x="340" y="188" fill="#8899bb" font-size="13" text-anchor="middle">点击上传或拖拽音频文件到此处</text>
  <rect x="50" y="215" width="580" height="40" rx="8" fill="rgba(20,31,55,0.8)"/>
  <text x="65" y="240" fill="#8899bb" font-size="13">目标格式：</text>
  <rect x="140" y="224" width="60" height="22" rx="4" fill="rgba(59,130,246,0.2)" stroke="rgba(59,130,246,0.5)" stroke-width="1"/>
  <text x="170" y="239" fill="#60a5fa" font-size="12" text-anchor="middle">MP3</text>
  <text x="210" y="240" fill="#4a5a7a" font-size="12">WAV FLAC AAC OGG</text>
  <rect x="50" y="265" width="580" height="40" rx="8" fill="rgba(20,31,55,0.8)"/>
  <text x="65" y="290" fill="#8899bb" font-size="13">音质：</text>
  <rect x="110" y="274" width="70" height="22" rx="4" fill="rgba(59,130,246,0.2)" stroke="rgba(59,130,246,0.5)" stroke-width="1"/>
  <text x="145" y="289" fill="#60a5fa" font-size="12" text-anchor="middle">高音质</text>
  <text x="195" y="290" fill="#4a5a7a" font-size="12">标准 低音质</text>
  <rect x="50" y="315" width="580" height="40" rx="8" fill="url(#accent)"/>
  <text x="340" y="340" fill="#fff" font-size="14" text-anchor="middle" font-weight="600">开始转换</text>
</svg>
