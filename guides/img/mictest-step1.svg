<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b18"/>
    </linearGradient>
    <linearGradient id="waveGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>
  <rect width="680" height="400" fill="url(#bg)" rx="12"/>
  <text x="340" y="52" text-anchor="middle" fill="#e2e8f0" font-family="system-ui,sans-serif" font-size="22" font-weight="700">麦克风测试</text>
  <text x="340" y="74" text-anchor="middle" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="12">Microphone Test</text>
  <!-- Browser chrome -->
  <rect x="40" y="95" width="600" height="280" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <circle cx="62" cy="113" r="5" fill="#ef4444"/>
  <circle cx="80" cy="113" r="5" fill="#eab308"/>
  <circle cx="98" cy="113" r="5" fill="#22c55e"/>
  <rect x="120" y="106" width="280" height="14" rx="7" fill="#0f172a"/>
  <!-- Mic icon area -->
  <rect x="70" y="135" width="200" height="200" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <!-- Microphone graphic -->
  <ellipse cx="170" cy="195" rx="18" ry="28" fill="none" stroke="#06b6d4" stroke-width="2.5"/>
  <rect x="164" y="220" width="12" height="30" rx="6" fill="#06b6d4" opacity="0.8"/>
  <line x1="152" y1="245" x2="188" y2="245" stroke="#06b6d4" stroke-width="2.5" stroke-linecap="round"/>
  <text x="170" y="280" text-anchor="middle" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="10">麦克风图标</text>
  <!-- Audio level meters -->
  <rect x="290" y="135" width="350" height="200" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="310" y="158" fill="#e2e8f0" font-family="system-ui,sans-serif" font-size="11" font-weight="600">音频电平</text>
  <!-- Level bars -->
  <g transform="translate(310, 170)">
    <rect x="0" y="0" width="300" height="12" rx="3" fill="#0f172a"/>
    <rect x="0" y="0" width="180" height="12" rx="3" fill="#22c55e"/>
    <rect x="180" y="0" width="45" height="12" rx="3" fill="#eab308"/>
    <text x="310" y="10" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="9">-12 dB</text>
  </g>
  <g transform="translate(310, 192)">
    <rect x="0" y="0" width="300" height="12" rx="3" fill="#0f172a"/>
    <rect x="0" y="0" width="220" height="12" rx="3" fill="#22c55e"/>
    <rect x="220" y="0" width="30" height="12" rx="3" fill="#eab308"/>
    <text x="310" y="10" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="9">-8 dB</text>
  </g>
  <g transform="translate(310, 214)">
    <rect x="0" y="0" width="300" height="12" rx="3" fill="#0f172a"/>
    <rect x="0" y="0" width="150" height="12" rx="3" fill="#22c55e"/>
    <text x="310" y="10" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="9">-18 dB</text>
  </g>
  <g transform="translate(310, 236)">
    <rect x="0" y="0" width="300" height="12" rx="3" fill="#0f172a"/>
    <rect x="0" y="0" width="200" height="12" rx="3" fill="#22c55e"/>
    <rect x="200" y="0" width="20" height="12" rx="3" fill="#eab308"/>
    <text x="310" y="10" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="9">-10 dB</text>
  </g>
  <!-- Waveform visualization -->
  <rect x="310" y="260" width="300" height="60" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <path d="M310 290 Q320 270 330 290 Q340 310 350 290 Q360 265 370 290 Q380 315 390 290 Q400 275 410 290 Q420 305 430 290 Q440 260 450 290 Q460 320 470 290 Q480 270 490 290 Q500 310 510 290 Q520 265 530 290 Q540 315 550 290 Q560 275 570 290 Q580 305 590 290 Q600 260 610 290 Q620 315 630 290 Q640 275 650 290 L660 290" fill="none" stroke="url(#waveGrad)" stroke-width="2"/>
  <!-- Device info panel -->
  <rect x="70" y="345" width="200" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="85" y="363" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="10">设备: 内置麦克风</text>
  <rect x="285" y="345" width="120" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="300" y="363" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="10">采样: 44100 Hz</text>
  <rect x="420" y="345" width="100" height="28" rx="6" fill="#22c55e" opacity="0.3"/>
  <text x="470" y="363" text-anchor="middle" fill="#22c55e" font-family="system-ui,sans-serif" font-size="10" font-weight="600">录音中</text>
  <rect x="535" y="345" width="105" height="28" rx="6" fill="#334155"/>
  <text x="587" y="363" text-anchor="middle" fill="#e2e8f0" font-family="system-ui,sans-serif" font-size="10" font-weight="600">停止录音</text>
</svg>
