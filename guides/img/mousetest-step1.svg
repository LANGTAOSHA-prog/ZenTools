<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b18"/>
    </linearGradient>
    <linearGradient id="mouseGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="680" height="400" fill="url(#bg)" rx="12"/>
  <text x="340" y="52" text-anchor="middle" fill="#e2e8f0" font-family="system-ui,sans-serif" font-size="22" font-weight="700">鼠标测试</text>
  <text x="340" y="74" text-anchor="middle" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="12">Mouse Test</text>
  <!-- Browser chrome -->
  <rect x="40" y="95" width="600" height="280" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <circle cx="62" cy="113" r="5" fill="#ef4444"/>
  <circle cx="80" cy="113" r="5" fill="#eab308"/>
  <circle cx="98" cy="113" r="5" fill="#22c55e"/>
  <rect x="120" y="106" width="280" height="14" rx="7" fill="#0f172a"/>
  <!-- Mouse graphic -->
  <rect x="170" y="130" width="140" height="200" rx="70" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <!-- Left click zone -->
  <path d="M170 200 Q170 130 240 130 Q310 130 310 200 L310 170 Q310 130 240 130 Q170 130 170 170 Z" fill="#06b6d4" opacity="0.3"/>
  <text x="205" y="175" fill="#06b6d4" font-family="system-ui,sans-serif" font-size="9" font-weight="600">左键</text>
  <!-- Right click zone -->
  <path d="M310 200 Q310 130 240 130 Q240 130 240 170 L240 170 Q240 130 310 130 Q310 130 310 200 Z" fill="#8b5cf6" opacity="0.3"/>
  <text x="260" y="175" fill="#8b5cf6" font-family="system-ui,sans-serif" font-size="9" font-weight="600">右键</text>
  <!-- Scroll wheel -->
  <rect x="230" y="185" width="20" height="35" rx="10" fill="#334155" stroke="#475569" stroke-width="1"/>
  <text x="240" y="210" text-anchor="middle" fill="#e2e8f0" font-family="system-ui,sans-serif" font-size="8" font-weight="600">滚轮</text>
  <!-- Side buttons -->
  <rect x="165" y="195" width="8" height="20" rx="3" fill="#334155" stroke="#475569" stroke-width="0.5"/>
  <text x="150" y="208" text-anchor="middle" fill="#e2e8f0" font-family="system-ui,sans-serif" font-size="7">侧键1</text>
  <rect x="165" y="220" width="8" height="20" rx="3" fill="#334155" stroke="#475569" stroke-width="0.5"/>
  <text x="150" y="233" text-anchor="middle" fill="#e2e8f0" font-family="system-ui,sans-serif" font-size="7">侧键2</text>
  <!-- Click counter -->
  <rect x="340" y="130" width="300" height="80" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="360" y="152" fill="#e2e8f0" font-family="system-ui,sans-serif" font-size="11" font-weight="600">点击统计</text>
  <text x="360" y="175" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="10">左键: <tspan fill="#22c55e" font-weight="600">12 次</tspan></text>
  <text x="360" y="195" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="10">右键: <tspan fill="#94a3b8" font-weight="600">3 次</tspan></text>
  <!-- Movement tracker -->
  <rect x="340" y="225" width="300" height="80" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="360" y="247" fill="#e2e8f0" font-family="system-ui,sans-serif" font-size="11" font-weight="600">移动追踪</text>
  <text x="360" y="270" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="10">X: <tspan fill="#06b6d4" font-weight="600">+142</tspan>  Y: <tspan fill="#8b5cf6" font-weight="600">-87</tspan></text>
  <text x="360" y="290" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="10">DPI: 1600</text>
  <!-- Double-click test area -->
  <rect x="340" y="315" width="300" height="45" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="360" y="332" fill="#e2e8f0" font-family="system-ui,sans-serif" font-size="10" font-weight="600">双击测试: 点击此处验证</text>
  <text x="360" y="348" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="10">双击区域</text>
  <!-- Status bar -->
  <rect x="70" y="345" width="240" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="90" y="363" fill="#22c55e" font-family="system-ui,sans-serif" font-size="10" font-weight="600">连接正常</text>
  <rect x="325" y="345" width="100" height="28" rx="6" fill="#334155"/>
  <text x="375" y="363" text-anchor="middle" fill="#e2e8f0" font-family="system-ui,sans-serif" font-size="10" font-weight="600">重置统计</text>
  <rect x="440" y="345" width="100" height="28" rx="6" fill="#334155"/>
  <text x="490" y="363" text-anchor="middle" fill="#e2e8f0" font-family="system-ui,sans-serif" font-size="10" font-weight="600">切换按钮</text>
  <rect x="555" y="345" width="100" height="28" rx="6" fill="#334155"/>
  <text x="605" y="363" text-anchor="middle" fill="#e2e8f0" font-family="system-ui,sans-serif" font-size="10" font-weight="600">隐藏光标</text>
</svg>
