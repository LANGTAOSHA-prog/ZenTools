<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" font-family="'Inter',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b18"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="680" height="380" fill="url(#bg)" rx="14"/>
  <text x="30" y="42" fill="#f0f4ff" font-size="20" font-weight="700">👁️ PDF OCR 文字识别</text>
  <text x="30" y="66" fill="#6b7a9f" font-size="13">从扫描件和图片型 PDF 中提取文字，支持中英文识别，浏览器本地处理。</text>
  <rect x="30" y="85" width="620" height="270" fill="rgba(14,22,41,0.8)" rx="14" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="50" y="118" fill="#f0f4ff" font-size="15" font-weight="700">OCR 文字识别</text>

  <!-- Upload zone -->
  <rect x="50" y="135" width="580" height="90" rx="12" fill="rgba(20,31,55,0.85)" stroke="rgba(59,130,246,0.4)" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="340" y="172" fill="#6b7a9f" font-size="32" text-anchor="middle">📄</text>
  <text x="340" y="200" fill="#8899bb" font-size="13" text-anchor="middle">点击或拖拽上传 PDF 或图片文件</text>
  <text x="340" y="218" fill="#4a5a7a" font-size="11" text-anchor="middle">支持 PDF、JPG、PNG 格式</text>

  <!-- Language select -->
  <rect x="50" y="240" width="160" height="34" fill="#0a0e1a" rx="8" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="130" y="262" fill="#f0f4ff" font-size="12" text-anchor="middle">中文 ▼</text>

  <rect x="225" y="240" width="160" height="34" fill="#0a0e1a" rx="8" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="305" y="262" fill="#f0f4ff" font-size="12" text-anchor="middle">中文 + 英文 ▼</text>

  <!-- Start button -->
  <rect x="420" y="240" width="140" height="34" fill="url(#accent)" rx="8"/>
  <text x="490" y="262" fill="#fff" font-size="13" font-weight="600" text-anchor="middle">开始识别</text>

  <!-- Arrow -->
  <text x="645" y="185" fill="#3b82f6" font-size="22">👆</text>
</svg>
