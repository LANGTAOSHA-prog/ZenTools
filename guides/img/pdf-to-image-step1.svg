<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="'Inter',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b18"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="680" height="400" fill="url(#bg)" rx="14"/>

  <text x="30" y="42" fill="#f0f4ff" font-size="20" font-weight="700">🖼️ PDF 转图片</text>
  <text x="30" y="66" fill="#6b7a9f" font-size="13">将 PDF 文件的每一页转换为 PNG 或 JPG 图片，方便单独使用。</text>

  <rect x="30" y="85" width="620" height="290" fill="rgba(14,22,41,0.8)" rx="14" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

  <text x="50" y="118" fill="#f0f4ff" font-size="15" font-weight="700">上传 PDF</text>
  <text x="50" y="138" fill="#6b7a9f" font-size="12">选择 PDF 文件并选择输出图片格式，逐页转换为图片。</text>

  <!-- Upload zone -->
  <rect x="50" y="155" width="580" height="90" rx="12" fill="rgba(20,31,55,0.85)" stroke="rgba(59,130,246,0.4)" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="340" y="190" fill="#6b7a9f" font-size="32" text-anchor="middle">📄</text>
  <text x="340" y="220" fill="#8899bb" font-size="13" text-anchor="middle">点击或拖拽上传 PDF 文件</text>

  <!-- Format select -->
  <rect x="50" y="262" width="580" height="40" rx="10" fill="rgba(10,14,26,0.6)" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  <text x="65" y="286" fill="#6b7a9f" font-size="13">输出格式：</text>
  <rect x="150" y="268" width="80" height="30" rx="6" fill="rgba(0,229,255,0.12)" stroke="rgba(0,229,255,0.2)" stroke-width="1"/>
  <text x="190" y="287" fill="#00e5ff" font-size="12" font-weight="600" text-anchor="middle">PNG</text>
  <rect x="240" y="268" width="80" height="30" rx="6" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="280" y="287" fill="#8899bb" font-size="12" text-anchor="middle">JPG</text>

  <!-- Start button -->
  <rect x="380" y="268" width="140" height="30" rx="6" fill="url(#accent)"/>
  <text x="450" y="287" fill="#fff" font-size="13" font-weight="600" text-anchor="middle">开始转换</text>

  <text x="340" y="335" fill="#4a5a7a" font-size="11" text-anchor="middle">所有处理在浏览器本地完成，文件不会上传</text>
</svg>
