<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="'Inter',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b18"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>
  <rect width="680" height="400" fill="url(#bg)" rx="14"/>

  <!-- Title -->
  <text x="30" y="42" fill="#f0f4ff" font-size="20" font-weight="700">&#x1F310; PDF 转 HTML</text>
  <text x="30" y="66" fill="#6b7a9f" font-size="13">将 PDF 文档转换为干净的 HTML 代码，保留结构与样式。</text>

  <!-- Tool box -->
  <rect x="30" y="85" width="620" height="290" fill="rgba(14,22,41,0.8)" rx="14" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

  <text x="50" y="118" fill="#f0f4ff" font-size="15" font-weight="700">选择 PDF 文件</text>
  <text x="50" y="138" fill="#6b7a9f" font-size="12">上传 PDF 文件，自动提取内容并生成 HTML 代码。</text>

  <!-- Upload zone -->
  <rect x="50" y="155" width="280" height="100" rx="12" fill="rgba(20,31,55,0.85)" stroke="rgba(59,130,246,0.4)" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="190" y="190" fill="#6b7a9f" font-size="28" text-anchor="middle">&#x1F4C4;</text>
  <text x="190" y="218" fill="#8899bb" font-size="12" text-anchor="middle">点击上传或拖拽 PDF</text>
  <text x="190" y="238" fill="#4a5a7a" font-size="10" text-anchor="middle">支持 .pdf 格式</text>

  <!-- HTML preview area (right side) -->
  <rect x="350" y="155" width="280" height="130" rx="10" fill="rgba(10,14,26,0.7)" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <text x="365" y="178" fill="#4a5a7a" font-size="11">HTML 代码预览</text>
  <rect x="365" y="188" width="250" height="84" rx="6" fill="rgba(0,0,0,0.3)"/>
  <text x="375" y="206" fill="#6b7a9f" font-family="monospace" font-size="10">&lt;!-- 转换后的 HTML --&gt;</text>
  <text x="375" y="222" fill="#6b7a9f" font-family="monospace" font-size="10">&lt;div class="content"&gt;</text>
  <text x="375" y="238" fill="#4a5a7a" font-family="monospace" font-size="10">  &lt;h1&gt;Document Title&lt;/h1&gt;</text>
  <text x="375" y="254" fill="#4a5a7a" font-family="monospace" font-size="10">  &lt;p&gt;Converted text...&lt;/p&gt;</text>

  <!-- Conversion options -->
  <text x="50" y="280" fill="#8899bb" font-size="12">转换选项</text>
  <rect x="50" y="291" width="14" height="14" rx="3" fill="rgba(16,185,129,0.2)" stroke="#10b981" stroke-width="1.5"/>
  <text x="70" y="303" fill="#94a3b8" font-size="11">保留图片</text>
  <rect x="140" y="291" width="14" height="14" rx="3" fill="rgba(16,185,129,0.2)" stroke="#10b981" stroke-width="1.5"/>
  <text x="160" y="303" fill="#94a3b8" font-size="11">保留样式</text>
  <rect x="230" y="291" width="14" height="14" rx="3" fill="rgba(16,185,129,0.2)" stroke="#10b981" stroke-width="1.5"/>
  <text x="250" y="303" fill="#94a3b8" font-size="11">保留链接</text>

  <!-- Download button -->
  <rect x="50" y="325" width="580" height="36" fill="url(#green)" rx="10"/>
  <text x="340" y="348" fill="#fff" font-size="14" font-weight="700" text-anchor="middle">&#x1F4E5; 开始转换</text>
</svg>