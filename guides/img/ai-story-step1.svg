<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="'Inter',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b18"/>
    </linearGradient>
    <linearGradient id="storyGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
  </defs>
  <rect width="680" height="400" fill="url(#bg)" rx="14"/>
  <text x="30" y="42" fill="#f0f4ff" font-size="20" font-weight="700">📖 AI 故事生成器</text>
  <text x="30" y="66" fill="#6b7a9f" font-size="13">使用 AI 生成短篇故事、情节大纲和角色设定，支持多种题材风格。</text>
  <rect x="30" y="85" width="620" height="290" fill="rgba(14,22,41,0.8)" rx="14" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  
  <!-- 题材选择 -->
  <rect x="50" y="100" width="100" height="40" rx="8" fill="rgba(249,115,22,0.15)" stroke="rgba(249,115,22,0.3)" stroke-width="1"/>
  <text x="100" y="125" fill="#f97316" font-size="11" text-anchor="middle">科幻</text>
  
  <rect x="160" y="100" width="100" height="40" rx="8" fill="rgba(20,31,55,0.9)" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <text x="210" y="125" fill="#94a3b8" font-size="11" text-anchor="middle">奇幻</text>
  
  <rect x="270" y="100" width="100" height="40" rx="8" fill="rgba(20,31,55,0.9)" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <text x="320" y="125" fill="#94a3b8" font-size="11" text-anchor="middle">悬疑</text>
  
  <rect x="380" y="100" width="100" height="40" rx="8" fill="rgba(20,31,55,0.9)" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <text x="430" y="125" fill="#94a3b8" font-size="11" text-anchor="middle">爱情</text>
  
  <!-- 输入区域 -->
  <rect x="50" y="155" width="580" height="60" rx="10" fill="rgba(20,31,55,0.9)" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <text x="70" y="180" fill="#f0f4ff" font-size="13">请输入故事主题：一个穿越时空的程序员</text>
  <text x="70" y="200" fill="#4a5a7a" font-size="10">风格：轻松幽默 | 字数：800 字</text>
  
  <!-- 生成结果 -->
  <rect x="50" y="230" width="580" height="150" rx="10" fill="rgba(249,115,22,0.08)" stroke="rgba(249,115,22,0.15)" stroke-width="1"/>
  <text x="70" y="255" fill="#f97316" font-size="12">生成的故事大纲：</text>
  
  <text x="70" y="280" fill="#f0f4ff" font-size="13" font-weight="600">《代码穿越者》</text>
  <text x="70" y="305" fill="#94a3b8" font-size="11">主角：李明，一个普通的程序员，在调试代码时意外穿越到古代...</text>
  
  <text x="70" y="330" fill="#f0f4ff" font-size="12" font-weight="600">第一章：穿越</text>
  <text x="70" y="355" fill="#94a3b8" font-size="11">当李明再次睁开眼睛，发现自己站在一个陌生的街道上，周围的人都穿着古装...</text>
  
  <text x="70" y="380" fill="#f0f4ff" font-size="12" font-weight="600">第二章：生存</text>
  <text x="70" y="400" fill="#94a3b8" font-size="11">在这个没有电脑的时代，李明决定用自己学到的编程思维来解决问题...</text>
</svg>