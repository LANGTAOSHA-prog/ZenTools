<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="'Inter',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b18"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>
  <rect width="680" height="400" fill="url(#bg)" rx="14"/>

  <!-- Title -->
  <text x="30" y="42" fill="#f0f4ff" font-size="20" font-weight="700">🔖 PDF 书签</text>
  <text x="30" y="66" fill="#6b7a9f" font-size="13">为 PDF 添加、编辑和管理书签，快速跳转到关键章节和页面。</text>

  <!-- Tool box -->
  <rect x="30" y="85" width="620" height="290" fill="rgba(14,22,41,0.8)" rx="14" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

  <!-- Left panel - Bookmark tree -->
  <text x="50" y="118" fill="#f0f4ff" font-size="15" font-weight="700">📑 书签列表</text>

  <!-- Tree item 1 - Chapter 1 (level 0) -->
  <rect x="50" y="130" width="275" height="32" fill="rgba(255,255,255,0.04)" rx="6"/>
  <text x="60" y="151" fill="#00e5ff" font-size="11">▶</text>
  <text x="78" y="151" fill="#f0f4ff" font-size="12" font-weight="600">第一章 引言</text>
  <text x="290" y="151" fill="#4a5a7a" font-size="10">p.1</text>

  <!-- Tree item 2 - Section 1.1 (level 1) -->
  <rect x="50" y="166" width="275" height="28" fill="rgba(255,255,255,0.02)" rx="6"/>
  <text x="74" y="186" fill="#8899bb" font-size="11">▶</text>
  <text x="92" y="186" fill="#d1d5e0" font-size="12">1.1 研究背景</text>
  <text x="290" y="186" fill="#4a5a7a" font-size="10">p.3</text>

  <!-- Tree item 3 - Section 1.2 (level 1) -->
  <rect x="50" y="198" width="275" height="28" fill="rgba(255,255,255,0.02)" rx="6"/>
  <text x="74" y="218" fill="#8899bb" font-size="11">▶</text>
  <text x="92" y="218" fill="#d1d5e0" font-size="12">1.2 相关工作</text>
  <text x="290" y="218" fill="#4a5a7a" font-size="10">p.7</text>

  <!-- Tree item 4 - Chapter 2 (level 0) -->
  <rect x="50" y="232" width="275" height="32" fill="rgba(255,255,255,0.04)" rx="6"/>
  <text x="60" y="253" fill="#00e5ff" font-size="11">▶</text>
  <text x="78" y="253" fill="#f0f4ff" font-size="12" font-weight="600">第二章 方法</text>
  <text x="290" y="253" fill="#4a5a7a" font-size="10">p.15</text>

  <!-- Tree item 5 - Section 2.1 (level 1, selected) -->
  <rect x="50" y="266" width="275" height="28" fill="rgba(0,229,255,0.08)" rx="6" stroke="#00e5ff" stroke-width="1"/>
  <text x="74" y="286" fill="#00e5ff" font-size="11">▶</text>
  <text x="92" y="286" fill="#00e5ff" font-size="12">2.1 数据采集</text>
  <text x="290" y="286" fill="#4a5a7a" font-size="10">p.16</text>

  <!-- Right panel - Bookmark editor -->
  <rect x="340" y="105" width="295" height="255" fill="rgba(20,31,55,0.5)" rx="10" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>

  <text x="358" y="130" fill="#f0f4ff" font-size="13" font-weight="700">编辑书签</text>

  <!-- Bookmark name input -->
  <text x="358" y="156" fill="#8899bb" font-size="11">书签名称</text>
  <rect x="358" y="164" width="260" height="34" fill="#0a0e1a" rx="8" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="372" y="186" fill="#d1d5e0" font-size="12">2.1 数据采集</text>

  <!-- Page number input -->
  <text x="358" y="216" fill="#8899bb" font-size="11">目标页码</text>
  <rect x="358" y="224" width="120" height="34" fill="#0a0e1a" rx="8" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="372" y="246" fill="#d1d5e0" font-size="12">16</text>

  <!-- Add child bookmark checkbox -->
  <rect x="358" y="270" width="16" height="16" rx="3" fill="rgba(0,229,255,0.15)" stroke="#00e5ff" stroke-width="1"/>
  <text x="383" y="283" fill="#d1d5e0" font-size="11">添加为子书签</text>

  <!-- Action buttons row -->
  <rect x="358" y="300" width="80" height="32" fill="rgba(0,229,255,0.12)" rx="8" stroke="#00e5ff" stroke-width="1"/>
  <text x="398" y="321" fill="#00e5ff" font-size="12" font-weight="600" text-anchor="middle">保存</text>

  <rect x="446" y="300" width="80" height="32" fill="rgba(255,255,255,0.06)" rx="8"/>
  <text x="486" y="321" fill="#ef4444" font-size="12" font-weight="600" text-anchor="middle">删除</text>

  <rect x="534" y="300" width="84" height="32" fill="rgba(255,255,255,0.06)" rx="8"/>
  <text x="576" y="321" fill="#8899bb" font-size="12" font-weight="600" text-anchor="middle">取消</text>

  <!-- Add new bookmark button (toolbar) -->
  <rect x="50" y="308" width="275" height="36" fill="rgba(0,229,255,0.08)" rx="999" stroke="#00e5ff" stroke-width="0.8"/>
  <text x="188" y="331" fill="#00e5ff" font-size="12" font-weight="600" text-anchor="middle">+ 添加书签</text>

  <!-- Export button -->
  <rect x="50" y="350" width="275" height="22" rx="999" fill="rgba(255,255,255,0.04)"/>
  <text x="188" y="365" fill="#6b7a9f" font-size="10" text-anchor="middle">📥 导出书签 · 展开全部 · 收起全部</text>
</svg>