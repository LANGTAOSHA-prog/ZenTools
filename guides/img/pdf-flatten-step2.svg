<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="'Inter',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b18"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="680" height="400" fill="url(#bg)" rx="14"/>

  <!-- Title -->
  <text x="30" y="42" fill="#f0f4ff" font-size="20" font-weight="700">⚡ PDF 扁平化</text>
  <text x="30" y="66" fill="#6b7a9f" font-size="13">合并图层与标注，将 PDF 展平为不可编辑的静态文档，保护内容完整性。</text>

  <!-- Tool box -->
  <rect x="30" y="85" width="620" height="290" fill="rgba(14,22,41,0.8)" rx="14" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

  <!-- Success status bar -->
  <rect x="50" y="100" width="580" height="44" rx="10" fill="rgba(16,185,129,0.12)" stroke="rgba(16,185,129,0.3)" stroke-width="1"/>
  <text x="74" y="126" fill="#34d399" font-size="14">✓ 扁平化完成</text>
  <text x="340" y="126" fill="#6b7a9f" font-size="12" text-anchor="end">文件大小：1.8 MB → 1.4 MB</text>

  <!-- File info -->
  <rect x="50" y="158" width="580" height="50" fill="rgba(255,255,255,0.03)" rx="8" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <text x="70" y="188" fill="#f87171" font-size="22">📄</text>
  <text x="100" y="188" fill="#f0f4ff" font-size="14" font-weight="600">项目报告_2026_展平版.pdf</text>
  <text x="590" y="188" fill="#6b7a9f" font-size="12" text-anchor="end">1.4 MB</text>

  <!-- Applied options summary -->
  <text x="50" y="233" fill="#f0f4ff" font-size="14" font-weight="600">已应用的扁平化操作</text>

  <!-- Option summary items -->
  <rect x="50" y="248" width="180" height="28" rx="6" fill="rgba(16,185,129,0.1)" stroke="rgba(16,185,129,0.2)" stroke-width="1"/>
  <text x="68" y="267" fill="#34d399" font-size="12">✓ 合并所有图层</text>

  <rect x="245" y="248" width="190" height="28" rx="6" fill="rgba(16,185,129,0.1)" stroke="rgba(16,185,129,0.2)" stroke-width="1"/>
  <text x="263" y="267" fill="#34d399" font-size="12">✓ 展平标注与批注</text>

  <rect x="50" y="286" width="180" height="28" rx="6" fill="rgba(30,41,59,0.5)" stroke="#4a5a7a" stroke-width="1"/>
  <text x="68" y="305" fill="#6b7a9f" font-size="12">▢ 移除表单字段</text>

  <!-- Download button -->
  <rect x="140" y="330" width="400" height="38" fill="url(#accent)" rx="999"/>
  <text x="340" y="354" fill="#fff" font-size="14" font-weight="700" text-anchor="middle">⬇ 下载展平后的 PDF</text>
</svg>