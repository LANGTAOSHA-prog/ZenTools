<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="'Inter',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b18"/>
    </linearGradient>
    <linearGradient id="userMsg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="680" height="400" fill="url(#bg)" rx="14"/>
  <text x="30" y="42" fill="#f0f4ff" font-size="20" font-weight="700">🎯 AI 提示词生成</text>
  <text x="30" y="66" fill="#6b7a9f" font-size="13">生成高质量的提示词模板，优化AI工具的输出效果。</text>
  <rect x="30" y="85" width="620" height="290" fill="rgba(14,22,41,0.8)" rx="14" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <!-- Task type selector -->
  <rect x="50" y="100" width="200" height="40" rx="8" fill="rgba(20,31,55,0.9)" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <text x="70" y="125" fill="#94a3b8" font-size="12">任务类型：文本生成</text>
  <rect x="270" y="100" width="200" height="40" rx="8" fill="rgba(20,31,55,0.9)" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <text x="290" y="125" fill="#94a3b8" font-size="12">输出格式：段落</text>
  <!-- Input area -->
  <rect x="50" y="150" width="300" height="120" rx="10" fill="rgba(20,31,55,0.9)" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <text x="70" y="175" fill="#f0f4ff" font-size="14" font-weight="600">任务描述</text>
  <rect x="70" y="190" width="260" height="60" rx="8" fill="rgba(14,22,41,0.6)" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <text x="80" y="215" fill="#94a3b8" font-size="11">请帮我写一个关于人工智能发展历史的</text>
  <text x="80" y="235" fill="#94a3b8" font-size="11">详细介绍，要求专业且易懂。</text>
  <rect x="70" y="260" width="100" height="32" rx="8" fill="url(#userMsg)" opacity="0.8"/>
  <text x="120" y="281" fill="#fff" font-size="12" text-anchor="middle">生成提示词</text>
  <!-- Output area -->
  <rect x="370" y="150" width="280" height="120" rx="10" fill="rgba(20,31,55,0.9)" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <text x="390" y="175" fill="#f0f4ff" font-size="14" font-weight="600">生成结果</text>
  <rect x="390" y="190" width="240" height="60" rx="8" fill="rgba(14,22,41,0.6)" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <text x="400" y="215" fill="#22c55e" font-size="11">请撰写一篇关于人工智能发展历史的</text>
  <text x="400" y="235" fill="#22c55e" font-size="11">专业详细介绍，涵盖从图灵测试到</text>
  <text x="400" y="255" fill="#22c55e" font-size="11">深度学习时代的重大里程碑。</text>
  <rect x="390" y="260" width="100" height="32" rx="8" fill="rgba(34,197,94,0.2)" stroke="rgba(34,197,94,0.3)" stroke-width="1"/>
  <text x="440" y="281" fill="#22c55e" font-size="12" text-anchor="middle">复制提示词</text>
  <!-- Features -->
  <text x="50" y="310" fill="#6b7a9f" font-size="11">支持：文本生成 · 图像生成 · 代码生成 · 数据分析</text>
  <text x="350" y="310" fill="#6b7a9f" font-size="11">优化输出 · 提升效果 · 多种模板</text>
  <!-- Bottom info -->
  <text x="50" y="340" fill="#4a5a7a" font-size="10">所有处理在浏览器本地完成，文件不会上传到服务器</text>
</svg>