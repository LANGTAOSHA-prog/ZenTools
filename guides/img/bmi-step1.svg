<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="'Inter',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0f172a"/><stop offset="100%" stop-color="#070b18"/></linearGradient><linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#10b981"/><stop offset="100%" stop-color="#06b6d4"/></linearGradient></defs>
  <rect width="680" height="400" fill="url(#bg)" rx="14"/>
  <text x="30" y="42" fill="#f0f4ff" font-size="20" font-weight="700">⚖️ BMI 计算器</text>
  <text x="30" y="66" fill="#6b7a9f" font-size="13">身体质量指数计算，评估体重状况和健康风险</text>
  <rect x="30" y="85" width="620" height="290" fill="rgba(14,22,41,0.8)" rx="14" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="50" y="118" fill="#f0f4ff" font-size="14" font-weight="600">身高 (cm)</text>
  <rect x="50" y="128" width="270" height="42" fill="#0a0e1a" rx="8" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="65" y="154" fill="#f0f4ff" font-size="16">175</text>
  <text x="340" y="118" fill="#f0f4ff" font-size="14" font-weight="600">体重 (kg)</text>
  <rect x="340" y="128" width="270" height="42" fill="#0a0e1a" rx="8" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="355" y="154" fill="#f0f4ff" font-size="16">70</text>
  <rect x="50" y="195" width="580" height="155" fill="#0f1a35" rx="10" stroke="rgba(16,185,129,0.15)" stroke-width="1"/>
  <text x="340" y="228" fill="#00e5ff" font-size="26" font-weight="800" text-anchor="middle">BMI = 22.9</text>
  <rect x="140" y="245" width="400" height="18" fill="#0a0e1a" rx="9"/>
  <rect x="140" y="245" width="220" height="18" fill="url(#accent)" rx="9" opacity="0.7"/>
  <text x="340" y="290" fill="#10b981" font-size="14" font-weight="600" text-anchor="middle">正常范围 (18.5 - 24.9)</text>
  <text x="340" y="315" fill="#6b7a9f" font-size="12" text-anchor="middle">偏瘦 &lt; 18.5 | 正常 18.5-24.9 | 超重 25-29.9 | 肥胖 ≥ 30</text>
</svg>