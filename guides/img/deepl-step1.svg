<svg width="680" height="400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#070b18;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="680" height="400" fill="url(#bgGrad)"/>
  
  <!-- Header -->
  <text x="340" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#ffffff">DeepL</text>
  <text x="340" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#94a3b8">Professional Translation</text>
  
  <!-- Interface Mockup -->
  <rect x="50" y="100" width="580" height="240" rx="12" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  
  <!-- Source Text Area -->
  <rect x="80" y="120" width="240" height="180" rx="6" fill="#0f172a" stroke="#475569"/>
  <text x="95" y="140" font-family="Arial, sans-serif" font-size="11" fill="#94a3b8">Source Language:</text>
  <rect x="95" y="152" width="210" height="28" rx="4" fill="#1e293b" stroke="#475569"/>
  <text x="200" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#cbd5e1">English ▼</text>
  
  <text x="95" y="200" font-family="Arial, sans-serif" font-size="11" fill="#cbd5e1">Hello! Welcome to ZenTools.</text>
  <text x="95" y="220" font-family="Arial, sans-serif" font-size="11" fill="#cbd5e1">We provide free online tools</text>
  <text x="95" y="240" font-family="Arial, sans-serif" font-size="11" fill="#cbd5e1">for everyday tasks.</text>
  
  <!-- Translate Button -->
  <rect x="340" y="200" width="40" height="40" rx="6" fill="#8b5cf6"/>
  <text x="360" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#ffffff">⇄</text>
  
  <!-- Target Text Area -->
  <rect x="400" y="120" width="240" height="180" rx="6" fill="#0f172a" stroke="#475569"/>
  <text x="415" y="140" font-family="Arial, sans-serif" font-size="11" fill="#94a3b8">Translated Language:</text>
  <rect x="415" y="152" width="210" height="28" rx="4" fill="#1e293b" stroke="#475569"/>
  <text x="520" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#cbd5e1">日本語 ▼</text>
  
  <text x="415" y="200" font-family="Arial, sans-serif" font-size="11" fill="#cbd5e1">こんにちは！ZenTools へ</text>
  <text x="415" y="220" font-family="Arial, sans-serif" font-size="11" fill="#cbd5e1">ようこそ。毎日使うための</text>
  <text x="415" y="240" font-family="Arial, sans-serif" font-size="11" fill="#cbd5e1">無料オンラインツールを</text>
  <text x="415" y="260" font-family="Arial, sans-serif" font-size="11" fill="#cbd5e1">提供しています。</text>
  
  <!-- AI Badge -->
  <rect x="500" y="110" width="100" height="24" rx="12" fill="#10b981"/>
  <text x="550" y="126" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#ffffff">AI Powered</text>
  
  <!-- Quality Indicator -->
  <rect x="415" y="275" width="150" height="20" rx="4" fill="#0ea5e9" opacity="0.3"/>
  <text x="490" y="288" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#7dd3fc">High quality</text>
</svg>
