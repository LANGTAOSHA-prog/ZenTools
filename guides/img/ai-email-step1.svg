<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="'Inter',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b18"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="680" height="400" fill="url(#bg)" rx="14"/>
  <text x="30" y="42" fill="#f0f4ff" font-size="20" font-weight="700">✉️ AI 邮件撰写</text>
  <text x="30" y="66" fill="#6b7a9f" font-size="13">使用AI生成专业商务邮件、回复邮件和邮件模板，支持多种语气和格式。</text>
  
  <!-- Main interface -->
  <rect x="30" y="85" width="620" height="290" fill="rgba(14,22,41,0.8)" rx="14" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  
  <!-- Email composition area -->
  <rect x="50" y="100" width="580" height="180" fill="rgba(20,31,55,0.9)" rx="10" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  
  <!-- Email header -->
  <text x="70" y="125" fill="#f0f4ff" font-size="13" font-weight="600">主题：项目进度汇报 - Q2季度总结</text>
  <text x="70" y="145" fill="#4a5a7a" font-size="12">收件人：manager@company.com</text>
  
  <!-- Email body with AI suggestions -->
  <text x="70" y="175" fill="#f0f4ff" font-size="13">尊敬的经理：</text>
  <text x="70" y="195" fill="#94a3b8" font-size="12">您好！关于Q2季度项目进度，现将主要成果汇报如下：</text>
  <text x="70" y="215" fill="#94a3b8" font-size="12">1. 完成了核心功能模块的开发，进度达到95%</text>
  <text x="70" y="235" fill="#94a3b8" font-size="12">2. 测试用例通过率为98%，质量符合预期</text>
  <text x="70" y="255" fill="#94a3b8" font-size="12">3. 预计可按时完成交付，无重大风险</text>
  
  <!-- AI suggestion panel -->
  <rect x="50" y="290" width="280" height="70" fill="rgba(59,130,246,0.08)" rx="10" stroke="rgba(59,130,246,0.15)" stroke-width="1"/>
  <text x="70" y="315" fill="#3b82f6" font-size="12" font-weight="600">🤖 AI 语气建议</text>
  <text x="70" y="335" fill="#94a3b8" font-size="11">正式商务 · 礼貌专业 · 结构清晰</text>
  
  <!-- Action buttons -->
  <rect x="350" y="290" width="120" height="35" fill="url(#accent)" rx="8"/>
  <text x="410" y="312" fill="#fff" font-size="13" text-anchor="middle" font-weight="600">生成邮件</text>
  
  <rect x="480" y="290" width="120" height="35" fill="rgba(255,255,255,0.08)" rx="8" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
  <text x="540" y="312" fill="#f0f4ff" font-size="13" text-anchor="middle">复制内容</text>
</svg>