<svg width="680" height="400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#070b18;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="680" height="400" fill="url(#bgGrad)"/>
  
  <!-- Header -->
  <text x="340" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#ffffff">ElevenLabs</text>
  <text x="340" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#94a3b8">AI Voice Generator</text>
  
  <!-- Interface Mockup -->
  <rect x="50" y="100" width="580" height="240" rx="12" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  
  <!-- Voice Selection Panel -->
  <rect x="80" y="120" width="200" height="180" rx="6" fill="#0f172a" stroke="#475569"/>
  <text x="180" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#22d3ee">Voice Library</text>
  
  <!-- Voice Cards -->
  <rect x="95" y="155" width="170" height="40" rx="4" fill="#1e293b" stroke="#475569"/>
  <circle cx="110" cy="175" r="12" fill="#8b5cf6"/>
  <text x="135" y="172" font-family="Arial, sans-serif" font-size="10" fill="#cbd5e1">Adam - US Male</text>
  
  <rect x="95" y="200" width="170" height="40" rx="4" fill="#0ea5e9" opacity="0.3" stroke="#0ea5e9"/>
  <circle cx="110" cy="220" r="12" fill="#22d3ee"/>
  <text x="135" y="217" font-family="Arial, sans-serif" font-size="10" fill="#bae6fd">Rachel - US Female ✓</text>
  
  <rect x="95" y="245" width="170" height="40" rx="4" fill="#1e293b" stroke="#475569"/>
  <circle cx="110" cy="265" r="12" fill="#10b981"/>
  <text x="135" y="262" font-family="Arial, sans-serif" font-size="10" fill="#cbd5e1">Antoni - UK Male</text>
  
  <!-- Text Input Area -->
  <rect x="300" y="120" width="260" height="180" rx="6" fill="#0f172a" stroke="#475569"/>
  <text x="430" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#22d3ee">Text to Speech</text>
  
  <rect x="315" y="155" width="230" height="120" rx="4" fill="#1e293b" stroke="#475569"/>
  <text x="325" y="175" font-family="monospace" font-size="9" fill="#cbd5e1">Hello! Welcome to ElevenLabs.</text>
  <text x="325" y="192" font-family="monospace" font-size="9" fill="#cbd5e1">This is a demonstration of AI</text>
  <text x="325" y="209" font-family="monospace" font-size="9" fill="#cbd5e1">voice synthesis technology.</text>
  <text x="325" y="226" font-family="monospace" font-size="9" fill="#cbd5e1">Experience realistic speech.</text>
  
  <!-- Generate Button -->
  <rect x="315" y="285" width="230" height="35" rx="6" fill="#10b981"/>
  <text x="430" y="307" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#ffffff">Generate Audio</text>
  
  <!-- Waveform Preview -->
  <rect x="520" y="120" width="100" height="180" rx="6" fill="#0f172a" stroke="#475569"/>
  <text x="570" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#22d3ee">Audio Preview</text>
  
  <!-- Waveform Bars -->
  <rect x="530" y="155" width="4" height="30" fill="#ec4899"/>
  <rect x="540" y="150" width="4" height="40" fill="#ec4899"/>
  <rect x="550" y="145" width="4" height="50" fill="#ec4899"/>
  <rect x="560" y="150" width="4" height="40" fill="#ec4899"/>
  <rect x="570" y="155" width="4" height="30" fill="#ec4899"/>
  <rect x="530" y="195" width="4" height="25" fill="#8b5cf6"/>
  <rect x="540" y="190" width="4" height="35" fill="#8b5cf6"/>
  <rect x="550" y="185" width="4" height="45" fill="#8b5cf6"/>
  <rect x="560" y="190" width="4" height="35" fill="#8b5cf6"/>
  <rect x="570" y="195" width="4" height="25" fill="#8b5cf6"/>
  
  <!-- Play Button -->
  <circle cx="570" y="240" r="15" fill="#22d3ee"/>
  <polygon points="564,236 564,244 574,240" fill="#ffffff"/>
  
  <!-- Badge -->
  <rect x="500" y="110" width="100" height="24" rx="12" fill="#ec4899"/>
  <text x="550" y="126" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#ffffff">Realistic AI</text>
</svg>
