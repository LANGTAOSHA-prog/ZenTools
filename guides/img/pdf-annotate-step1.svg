<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="'Inter',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b18"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="yellowAccent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <linearGradient id="greenAccent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
  </defs>
  <rect width="680" height="400" fill="url(#bg)" rx="14"/>

  <!-- Title -->
  <text x="30" y="42" fill="#f0f4ff" font-size="20" font-weight="700">✏️ PDF 标注</text>
  <text x="30" y="66" fill="#6b7a9f" font-size="13">给 PDF 文件添加高亮、下划线、注释框等标注，轻松标记重点内容。</text>

  <!-- Tool box -->
  <rect x="30" y="85" width="620" height="290" fill="rgba(14,22,41,0.8)" rx="14" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

  <!-- Top toolbar bar -->
  <rect x="30" y="85" width="620" height="40" fill="rgba(20,31,55,0.9)" rx="14" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <rect x="30" y="115" width="620" height="10" fill="rgba(20,31,55,0.9)"/>

  <!-- Toolbar icons -->
  <rect x="48" y="95" width="32" height="24" fill="rgba(250,204,21,0.2)" rx="4"/>
  <text x="64" y="112" fill="#facc15" font-size="12" text-anchor="middle">A</text>

  <rect x="90" y="95" width="32" height="24" fill="rgba(59,130,246,0.15)" rx="4"/>
  <text x="106" y="112" fill="#60a5fa" font-size="12" text-anchor="middle">U</text>

  <rect x="132" y="95" width="32" height="24" fill="rgba(239,68,68,0.15)" rx="4"/>
  <text x="148" y="112" fill="#f87171" font-size="12" text-anchor="middle">S</text>

  <rect x="174" y="95" width="32" height="24" fill="rgba(16,185,129,0.15)" rx="4"/>
  <text x="190" y="112" fill="#34d399" font-size="14" text-anchor="middle">□</text>

  <rect x="216" y="95" width="32" height="24" fill="rgba(168,85,247,0.15)" rx="4"/>
  <text x="232" y="112" fill="#c084fc" font-size="12" text-anchor="middle">T</text>

  <rect x="258" y="95" width="32" height="24" fill="rgba(236,72,153,0.15)" rx="4"/>
  <text x="274" y="112" fill="#f472b6" font-size="12" text-anchor="middle">✎</text>

  <!-- Separator -->
  <line x1="306" y1="96" x2="306" y2="116" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

  <rect x="318" y="95" width="42" height="24" fill="rgba(255,255,255,0.05)" rx="6"/>
  <text x="339" y="112" fill="#94a3b8" font-size="11" text-anchor="middle">撤销</text>

  <rect x="370" y="95" width="42" height="24" fill="rgba(255,255,255,0.05)" rx="6"/>
  <text x="391" y="112" fill="#94a3b8" font-size="11" text-anchor="middle">重做</text>

  <!-- Download button -->
  <rect x="530" y="92" width="108" height="28" fill="url(#accent)" rx="999"/>
  <text x="584" y="111" fill="#fff" font-size="12" font-weight="600" text-anchor="middle">下载标注 PDF</text>

  <!-- Left panel: PDF preview -->
  <rect x="48" y="135" width="400" height="220" fill="#f8fafc" rx="8"/>
  <rect x="48" y="135" width="400" height="220" fill="rgba(248,250,252,0.95)" rx="8"/>

  <!-- PDF content mockup -->
  <text x="70" y="162" fill="#0f172a" font-size="13" font-weight="700">项目计划书 - 2026年Q3</text>

  <rect x="70" y="175" width="200" height="3" fill="#e2e8f0" rx="2"/>
  <rect x="70" y="183" width="360" height="3" fill="#e2e8f0" rx="2"/>
  <rect x="70" y="191" width="340" height="3" fill="#e2e8f0" rx="2"/>

  <text x="70" y="212" fill="#334155" font-size="11" font-weight="600">1. 项目概述</text>
  <rect x="70" y="222" width="360" height="3" fill="#e2e8f0" rx="2"/>
  <rect x="70" y="230" width="340" height="3" fill="#e2e8f0" rx="2"/>
  <rect x="70" y="238" width="300" height="3" fill="#e2e8f0" rx="2"/>

  <!-- Highlighted text -->
  <rect x="70" y="248" width="190" height="4" fill="rgba(250,204,21,0.5)" rx="2"/>
  <rect x="70" y="274" width="360" height="3" fill="#e2e8f0" rx="2"/>
  <rect x="70" y="282" width="350" height="3" fill="#e2e8f0" rx="2"/>

  <!-- Underlined text -->
  <rect x="70" y="292" width="160" height="3" fill="#e2e8f0" rx="2"/>
  <line x1="70" y1="295" x2="230" y2="295" stroke="#60a5fa" stroke-width="2"/>

  <text x="70" y="314" fill="#334155" font-size="11" font-weight="600">2. 预算分配</text>
  <rect x="70" y="324" width="360" height="3" fill="#e2e8f0" rx="2"/>

  <!-- Comment/annotation box -->
  <rect x="350" y="208" width="80" height="56" fill="#fef3c7" rx="6" stroke="#f59e0b" stroke-width="1"/>
  <text x="355" y="224" fill="#b45309" font-size="9" font-weight="600">备注</text>
  <text x="355" y="238" fill="#92400e" font-size="9">截止日期需要</text>
  <text x="355" y="251" fill="#92400e" font-size="9">确认</text>

  <text x="70" y="345" fill="#334155" font-size="11" font-weight="600">3. 里程碑时间线</text>
  <rect x="70" y="354" width="360" height="3" fill="#e2e8f0" rx="2"/>
  <rect x="70" y="362" width="280" height="3" fill="#e2e8f0" rx="2"/>

  <!-- Right panel: tool settings -->
  <rect x="460" y="135" width="178" height="220" fill="rgba(20,31,55,0.6)" rx="8" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>

  <text x="474" y="158" fill="#94a3b8" font-size="10" font-weight="600">标注工具</text>

  <!-- Tool list -->
  <!-- Highlight -->
  <rect x="468" y="168" width="162" height="28" fill="rgba(250,204,21,0.12)" rx="6" stroke="rgba(250,204,21,0.3)" stroke-width="1"/>
  <rect x="474" y="174" width="14" height="14" fill="#facc15" rx="2"/>
  <text x="494" y="186" fill="#facc15" font-size="11">高亮</text>

  <!-- Underline -->
  <rect x="468" y="200" width="162" height="28" fill="rgba(59,130,246,0.08)" rx="6"/>
  <rect x="474" y="206" width="14" height="2" fill="#60a5fa" rx="1"/>
  <text x="494" y="218" fill="#94a3b8" font-size="11">下划线</text>

  <!-- Strikethrough -->
  <rect x="468" y="232" width="162" height="28" fill="rgba(239,68,68,0.08)" rx="6"/>
  <line x1="476" y1="245" x2="486" y2="246" stroke="#f87171" stroke-width="2"/>
  <text x="494" y="250" fill="#94a3b8" font-size="11">删除线</text>

  <!-- Comment box -->
  <rect x="468" y="264" width="162" height="28" fill="rgba(16,185,129,0.08)" rx="6"/>
  <rect x="474" y="268" width="14" height="12" fill="none" stroke="#34d399" stroke-width="1.5" rx="2"/>
  <text x="494" y="282" fill="#94a3b8" font-size="11">注释框</text>

  <!-- Free draw -->
  <rect x="468" y="296" width="162" height="28" fill="rgba(168,85,247,0.08)" rx="6"/>
  <text x="474" y="314" fill="#c084fc" font-size="12">✎</text>
  <text x="494" y="314" fill="#94a3b8" font-size="11">自由绘图</text>

  <!-- Color picker mock -->
  <text x="474" y="338" fill="#4a5a7a" font-size="9">颜色</text>
  <circle cx="486" cy="342" r="6" fill="#facc15"/>
  <circle cx="502" cy="342" r="6" fill="#60a5fa"/>
  <circle cx="518" cy="342" r="6" fill="#f87171"/>
  <circle cx="534" cy="342" r="6" fill="#34d399"/>
  <circle cx="550" cy="342" r="6" fill="#c084fc"/>
  <circle cx="566" cy="342" r="6" fill="#f472b6"/>
</svg>