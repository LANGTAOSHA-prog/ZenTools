<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="'Inter',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b18"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="680" height="400" fill="url(#bg)" rx="14"/>
  <text x="30" y="42" fill="#f0f4ff" font-size="20" font-weight="700">🖼️ AI 图片提示词</text>
  <text x="30" y="66" fill="#6b7a9f" font-size="13">使用AI生成高质量的图片生成提示词，优化Midjourney、DALL-E等工具的输出效果。</text>
  
  <!-- Main interface -->
  <rect x="30" y="85" width="620" height="290" fill="rgba(14,22,41,0.8)" rx="14" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  
  <!-- Input area -->
  <rect x="50" y="100" width="580" height="80" fill="rgba(20,31,55,0.9)" rx="10" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <text x="70" y="125" fill="#f0f4ff" font-size="13" font-weight="600">描述你想要生成的图片</text>
  <text x="70" y="145" fill="#94a3b8" font-size="12">一只可爱的猫咪在阳光下的窗台上睡觉</text>
  
  <!-- Generated prompt -->
  <rect x="50" y="190" width="580" height="100" fill="rgba(59,130,246,0.08)" rx="10" stroke="rgba(59,130,246,0.15)" stroke-width="1"/>
  <text x="70" y="215" fill="#3b82f6" font-size="13" font-weight="600">🤖 优化后的提示词</text>
  <text x="70" y="240" fill="#f0f4ff" font-size="12">A cute fluffy cat sleeping on a sunlit windowsill, warm afternoon light, soft focus background, cozy atmosphere, photorealistic, 4K, detailed fur texture</text>
  <text x="70" y="265" fill="#94a3b8" font-size="11">提示词已优化：添加了光线、氛围、画质等关键参数</text>
  
  <!-- Style tags -->
  <rect x="50" y="300" width="80" height="30" fill="rgba(59,130,246,0.2)" rx="15"/>
  <text x="90" y="320" fill="#3b82f6" font-size="11" text-anchor="middle">写实</text>
  
  <rect x="140" y="300" width="80" height="30" fill="rgba(139,92,246,0.2)" rx="15"/>
  <text x="180" y="320" fill="#8b5cf6" font-size="11" text-anchor="middle">温暖</text>
  
  <rect x="230" y="300" width="80" height="30" fill="rgba(34,197,94,0.2)" rx="15"/>
  <text x="270" y="320" fill="#22c55e" font-size="11" text-anchor="middle">舒适</text>
  
  <rect x="320" y="300" width="80" height="30" fill="rgba(249,115,22,0.2)" rx="15"/>
  <text x="360" y="320" fill="#f97316" font-size="11" text-anchor="middle">4K画质</text>
  
  <!-- Action buttons -->
  <rect x="450" y="300" width="80" height="30" fill="url(#accent)" rx="15"/>
  <text x="490" y="320" fill="#fff" font-size="11" text-anchor="middle">复制提示词</text>
  
  <rect x="540" y="300" width="80" height="30" fill="rgba(255,255,255,0.08)" rx="15" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
  <text x="580" y="320" fill="#f0f4ff" font-size="11" text-anchor="middle">重新生成</text>
</svg>