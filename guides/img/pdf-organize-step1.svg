<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="'Inter',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b18"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="680" height="400" fill="url(#bg)" rx="14"/>

  <!-- Title -->
  <text x="30" y="42" fill="#f0f4ff" font-size="20" font-weight="700">📑 PDF 整理</text>
  <text x="30" y="66" fill="#6b7a9f" font-size="13">重新排序、旋转和删除 PDF 页面，自定义页面顺序。</text>

  <!-- Tool box -->
  <rect x="30" y="85" width="620" height="290" fill="rgba(14,22,41,0.8)" rx="14" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

  <!-- Page list header bar -->
  <rect x="50" y="100" width="580" height="36" fill="rgba(255,255,255,0.03)" rx="8"/>
  <text x="65" y="123" fill="#8899bb" font-size="13" font-weight="600">页面列表</text>
  <text x="520" y="123" fill="#4a5a7a" font-size="11">共 6 页</text>

  <!-- Page item 1 -->
  <rect x="55" y="145" width="560" height="36" fill="rgba(255,255,255,0.04)" rx="8"/>
  <text x="72" y="168" fill="#6b7a9f" font-size="11">⠿</text>
  <!-- Thumbnail placeholder -->
  <rect x="90" y="151" width="22" height="24" fill="rgba(59,130,246,0.2)" rx="3"/>
  <text x="101" y="167" fill="#3b82f6" font-size="8" text-anchor="middle">1</text>
  <text x="120" y="168" fill="#d1d5e0" font-size="13">第 1 页</text>
  <!-- Action buttons -->
  <rect x="510" y="151" width="26" height="24" fill="rgba(255,255,255,0.06)" rx="5"/>
  <text x="523" y="168" fill="#f59e0b" font-size="12" text-anchor="middle">↻</text>
  <rect x="543" y="151" width="26" height="24" fill="rgba(255,255,255,0.06)" rx="5"/>
  <text x="556" y="168" fill="#ef4444" font-size="12" text-anchor="middle">✕</text>
  <rect x="576" y="151" width="26" height="24" fill="rgba(255,255,255,0.06)" rx="5"/>
  <text x="589" y="168" fill="#6b7a9f" font-size="12" text-anchor="middle">☰</text>

  <!-- Page item 2 -->
  <rect x="55" y="187" width="560" height="36" fill="rgba(255,255,255,0.02)" rx="8"/>
  <text x="72" y="210" fill="#6b7a9f" font-size="11">⠿</text>
  <rect x="90" y="193" width="22" height="24" fill="rgba(16,185,129,0.2)" rx="3"/>
  <text x="101" y="209" fill="#10b981" font-size="8" text-anchor="middle">2</text>
  <text x="120" y="210" fill="#d1d5e0" font-size="13">第 2 页</text>
  <rect x="510" y="193" width="26" height="24" fill="rgba(255,255,255,0.06)" rx="5"/>
  <text x="523" y="210" fill="#f59e0b" font-size="12" text-anchor="middle">↻</text>
  <rect x="543" y="193" width="26" height="24" fill="rgba(255,255,255,0.06)" rx="5"/>
  <text x="556" y="210" fill="#ef4444" font-size="12" text-anchor="middle">✕</text>
  <rect x="576" y="193" width="26" height="24" fill="rgba(255,255,255,0.06)" rx="5"/>
  <text x="589" y="210" fill="#6b7a9f" font-size="12" text-anchor="middle">☰</text>

  <!-- Page item 3 -->
  <rect x="55" y="229" width="560" height="36" fill="rgba(255,255,255,0.04)" rx="8"/>
  <text x="72" y="252" fill="#6b7a9f" font-size="11">⠿</text>
  <rect x="90" y="235" width="22" height="24" fill="rgba(139,92,246,0.2)" rx="3"/>
  <text x="101" y="251" fill="#8b5cf6" font-size="8" text-anchor="middle">3</text>
  <text x="120" y="252" fill="#d1d5e0" font-size="13">第 3 页</text>
  <rect x="510" y="235" width="26" height="24" fill="rgba(255,255,255,0.06)" rx="5"/>
  <text x="523" y="252" fill="#f59e0b" font-size="12" text-anchor="middle">↻</text>
  <rect x="543" y="235" width="26" height="24" fill="rgba(255,255,255,0.06)" rx="5"/>
  <text x="556" y="252" fill="#ef4444" font-size="12" text-anchor="middle">✕</text>
  <rect x="576" y="235" width="26" height="24" fill="rgba(255,255,255,0.06)" rx="5"/>
  <text x="589" y="252" fill="#6b7a9f" font-size="12" text-anchor="middle">☰</text>

  <!-- Sort options -->
  <rect x="55" y="275" width="360" height="34" fill="#0a0e1a" rx="8" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="68" y="296" fill="#4a5a7a" font-size="12">排序：按当前顺序</text>
  <polygon points="400,290 406,284 412,290" fill="#4a5a7a"/>

  <!-- Action buttons -->
  <rect x="55" y="318" width="140" height="34" fill="rgba(255,255,255,0.06)" rx="8"/>
  <text x="125" y="339" fill="#d1d5e0" font-size="12" font-weight="600" text-anchor="middle">↕ 顺序反转</text>

  <rect x="205" y="318" width="140" height="34" fill="rgba(255,255,255,0.06)" rx="8"/>
  <text x="275" y="339" fill="#ef4444" font-size="12" font-weight="600" text-anchor="middle">✖ 删除选中</text>

  <rect x="430" y="312" width="200" height="44" fill="url(#accent)" rx="12"/>
  <text x="530" y="340" fill="#fff" font-size="14" font-weight="700" text-anchor="middle">▶ 开始整理</text>
</svg>
