<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="'Inter',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
<defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0f172a"/><stop offset="100%" stop-color="#070b18"/></linearGradient><linearGradient id="demo" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#3b82f6"/><stop offset="100%" stop-color="#8b5cf6"/></linearGradient></defs>
<rect width="680" height="400" fill="url(#bg)" rx="14"/>
<text x="30" y="42" fill="#f0f4ff" font-size="20" font-weight="700">🌈 渐变色生成器</text><text x="30" y="66" fill="#6b7a9f" font-size="13">可视化生成 CSS 渐变色，支持线性渐变和径向渐变。</text>
<rect x="30" y="85" width="620" height="290" fill="rgba(14,22,41,0.8)" rx="14" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
<rect x="60" y="105" width="560" height="80" fill="url(#demo)" rx="12"/>
<text x="340" y="150" fill="#fff" font-size="14" text-anchor="middle" opacity="0.7">linear-gradient(135deg, #3b82f6, #8b5cf6)</text>
<text x="60" y="215" fill="#6b7a9f" font-size="13">起始颜色</text>
<rect x="60" y="225" width="48" height="34" fill="#3b82f6" rx="6"/>
<text x="120" y="248" fill="#f0f4ff" font-size="14">#3B82F6</text>
<text x="60" y="270" fill="#6b7a9f" font-size="13">结束颜色</text>
<rect x="60" y="280" width="48" height="34" fill="#8b5cf6" rx="6"/>
<text x="120" y="303" fill="#f0f4ff" font-size="14">#8B5CF6</text>
<rect x="230" y="225" width="176" height="38" fill="rgba(255,255,255,0.06)" rx="8" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
<text x="246" y="249" fill="#00e5ff" font-size="14" font-weight="600">线性渐变 ▼</text>
<rect x="420" y="225" width="200" height="38" fill="url(#bg)" rx="8" stroke="rgba(0,229,255,0.3)" stroke-width="2"/>
<text x="520" y="249" fill="#00e5ff" font-size="14" font-weight="600" text-anchor="middle">📋 复制 CSS</text>
<text x="60" y="340" fill="#6b7a9f" font-size="12">预览:</text>
<rect x="110" y="330" width="24" height="24" fill="linear-gradient(#3b82f6,#8b5cf6)" rx="4"/>
</svg>