<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="'Inter',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b18"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="680" height="400" fill="url(#bg)" rx="14"/>

  <!-- Title -->
  <text x="30" y="42" fill="#f0f4ff" font-size="20" font-weight="700">🌐 IP 查询</text>
  <text x="30" y="66" fill="#6b7a9f" font-size="13">查询任意 IP 地址的地理位置、ISP 信息和网络类型。</text>

  <!-- Tool box -->
  <rect x="30" y="85" width="620" height="290" fill="rgba(14,22,41,0.8)" rx="14" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

  <text x="50" y="118" fill="#f0f4ff" font-size="15" font-weight="700">输入 IP 地址</text>
  <text x="50" y="138" fill="#6b7a9f" font-size="12">输入 IPv4 或 IPv6 地址，查询其归属地和详细信息。</text>

  <!-- Input area -->
  <rect x="50" y="155" width="400" height="40" rx="8" fill="#0a0e1a" stroke="rgba(59,130,246,0.4)" stroke-width="1"/>
  <text x="65" y="180" fill="#8899bb" font-size="14">8.8.8.8</text>

  <!-- Search button -->
  <rect x="460" y="155" width="120" height="40" fill="url(#accent)" rx="8"/>
  <text x="520" y="180" fill="#fff" font-size="14" font-weight="600" text-anchor="middle">查询</text>

  <!-- Results panel -->
  <rect x="50" y="210" width="580" height="145" rx="10" fill="rgba(20,31,55,0.6)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  
  <text x="70" y="238" fill="#6b7a9f" font-size="11" font-weight="600">IP 地址</text>
  <text x="70" y="256" fill="#f0f4ff" font-size="14" font-weight="600">8.8.8.8</text>
  
  <text x="220" y="238" fill="#6b7a9f" font-size="11" font-weight="600">国家/地区</text>
  <text x="220" y="256" fill="#f0f4ff" font-size="14">美国</text>
  
  <text x="370" y="238" fill="#6b7a9f" font-size="11" font-weight="600">城市</text>
  <text x="370" y="256" fill="#f0f4ff" font-size="14">Mountain View</text>
  
  <text x="520" y="238" fill="#6b7a9f" font-size="11" font-weight="600">ISP</text>
  <text x="520" y="256" fill="#f0f4ff" font-size="14">Google LLC</text>

  <text x="70" y="282" fill="#6b7a9f" font-size="11" font-weight="600">ASN</text>
  <text x="70" y="300" fill="#3b82f6" font-size="13">AS15169</text>
  
  <text x="220" y="282" fill="#6b7a9f" font-size="11" font-weight="600">网络类型</text>
  <text x="220" y="300" fill="#22c55e" font-size="13">企业</text>
  
  <text x="370" y="282" fill="#6b7a9f" font-size="11" font-weight="600">纬度</text>
  <text x="370" y="300" fill="#f0f4ff" font-size="13">37.4056</text>
  
  <text x="520" y="282" fill="#6b7a9f" font-size="11" font-weight="600">经度</text>
  <text x="520" y="300" fill="#f0f4ff" font-size="13">-122.0775</text>

  <!-- Map placeholder -->
  <rect x="50" y="315" width="580" height="45" rx="8" fill="rgba(15,23,42,0.8)" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <text x="340" y="342" fill="#4a5a7a" font-size="12" text-anchor="middle">🗺️ 地理位置地图加载中...</text>
</svg>
