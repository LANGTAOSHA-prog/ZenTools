<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="'Inter',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b18"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>
  <rect width="680" height="400" fill="url(#bg)" rx="14"/>

  <!-- Title -->
  <text x="30" y="42" fill="#f0f4ff" font-size="20" font-weight="700">📽️ PPT 转 PDF</text>
  <text x="30" y="66" fill="#6b7a9f" font-size="13">已完成转换，点击下载按钮保存 PDF 文件。</text>

  <!-- Tool box -->
  <rect x="30" y="85" width="620" height="290" fill="rgba(14,22,41,0.8)" rx="14" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

  <!-- Left panel: Upload area replaced with file info -->
  <text x="50" y="118" fill="#f0f4ff" font-size="15" font-weight="700">上传 PPT 文件</text>

  <!-- File info card -->
  <rect x="50" y="130" width="270" height="50" rx="10" fill="rgba(16,185,129,0.06)" stroke="rgba(16,185,129,0.25)" stroke-width="1"/>
  <text x="65" y="153" fill="#10b981" font-size="14">📽️</text>
  <text x="88" y="153" fill="#f0f4ff" font-size="13" font-weight="600">产品方案.pptx</text>
  <text x="88" y="168" fill="#4a5a7a" font-size="10">3.2 MB · 11 张幻灯片</text>
  <rect x="270" y="138" width="36" height="20" rx="6" fill="rgba(16,185,129,0.15)"/>
  <text x="288" y="152" fill="#10b981" font-size="10" font-weight="700" text-anchor="middle">已上传</text>

  <!-- Slide preview thumbnails (right panel) with PDF badge -->
  <rect x="340" y="118" width="290" height="62" rx="10" fill="rgba(10,14,26,0.7)" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <text x="355" y="141" fill="#4a5a7a" font-size="11">转换完成</text>
  <rect x="470" y="130" width="60" height="22" rx="6" fill="rgba(239,68,68,0.15)"/>
  <text x="500" y="145" fill="#ef4444" font-size="11" font-weight="700" text-anchor="middle">PDF ✓</text>

  <!-- Conversion progress / result info -->
  <rect x="340" y="190" width="290" height="65" rx="10" fill="rgba(10,14,26,0.7)" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <text x="355" y="213" fill="#94a3b8" font-size="12">转换状态</text>

  <!-- Progress bar -->
  <rect x="355" y="225" width="200" height="8" rx="4" fill="rgba(255,255,255,0.06)"/>
  <rect x="355" y="225" width="200" height="8" rx="4" fill="url(#green)"/>
  <text x="565" y="232" fill="#10b981" font-size="11" font-weight="700">100%</text>

  <text x="355" y="248" fill="#10b981" font-size="12" font-weight="600">✅ 转换完成 · 共 11 页</text>

  <!-- Conversion options (still visible) -->
  <text x="50" y="206" fill="#8899bb" font-size="12">转换选项</text>

  <rect x="50" y="217" width="14" height="14" rx="3" fill="rgba(168,85,247,0.2)" stroke="#a855f7" stroke-width="1.5"/>
  <text x="70" y="229" fill="#94a3b8" font-size="11">保留动画</text>

  <rect x="160" y="217" width="14" height="14" rx="3" fill="rgba(168,85,247,0.2)" stroke="#a855f7" stroke-width="1.5"/>
  <text x="180" y="229" fill="#94a3b8" font-size="11">保留备注</text>

  <rect x="270" y="217" width="14" height="14" rx="3" fill="rgba(20,31,55,0.85)" stroke="#4a5a7a" stroke-width="1.5"/>
  <text x="290" y="229" fill="#94a3b8" font-size="11">每页一张</text>

  <!-- Download button -->
  <rect x="50" y="260" width="270" height="44" fill="url(#accent)" rx="999"/>
  <text x="185" y="287" fill="#fff" font-size="15" font-weight="700" text-anchor="middle">📥 下载 PDF 文件</text>

  <!-- Success info on bottom -->
  <rect x="50" y="318" width="580" height="42" rx="10" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <text x="65" y="340" fill="#6b7a9f" font-size="11">文件大小: 2.1 MB · 页面: 11 · 原始 PPT: 产品方案.pptx</text>
  <text x="65" y="354" fill="#4a5a7a" font-size="10">所有处理在浏览器本地完成，文件未上传到服务器</text>

  <!-- Blue info dot -->
  <circle cx="545" cy="339" r="4" fill="#3b82f6"/>
  <text x="553" y="343" fill="#60a5fa" font-size="11">本地处理</text>
</svg>