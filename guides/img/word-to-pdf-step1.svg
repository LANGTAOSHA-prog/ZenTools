<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="'Inter',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b18"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="purplePink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
  </defs>
  <rect width="680" height="400" fill="url(#bg)" rx="14"/>

  <!-- Title -->
  <text x="30" y="42" fill="#f0f4ff" font-size="20" font-weight="700">📝 Word 转 PDF</text>
  <text x="30" y="66" fill="#6b7a9f" font-size="13">将 Word 文档转换为 PDF 格式，保留原始排版、图片和超链接。</text>

  <!-- Tool box -->
  <rect x="30" y="85" width="620" height="290" fill="rgba(14,22,41,0.8)" rx="14" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

  <!-- Section header -->
  <text x="50" y="118" fill="#f0f4ff" font-size="15" font-weight="700">上传 Word 文件</text>
  <text x="50" y="138" fill="#6b7a9f" font-size="12">支持 .doc 和 .docx 格式，最大 50MB。</text>

  <!-- Upload zone -->
  <rect x="50" y="152" width="290" height="95" rx="12" fill="rgba(20,31,55,0.85)" stroke="rgba(59,130,246,0.4)" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="195" y="186" fill="#6b7a9f" font-size="28" text-anchor="middle">📂</text>
  <text x="195" y="212" fill="#8899bb" font-size="12" text-anchor="middle">点击上传或拖拽文件</text>
  <text x="195" y="230" fill="#4a5a7a" font-size="11" text-anchor="middle">支持的格式：.doc .docx</text>

  <!-- Document info card (showing after upload) -->
  <rect x="360" y="152" width="270" height="95" fill="rgba(20,31,55,0.85)" rx="12" stroke="rgba(59,130,246,0.2)" stroke-width="1"/>
  <text x="380" y="174" fill="#60a5fa" font-size="13" font-weight="700">📋 文档信息</text>
  <text x="380" y="197" fill="#8899bb" font-size="12">文件名：项目方案.docx</text>
  <text x="380" y="216" fill="#8899bb" font-size="12">页数：12 页</text>
  <text x="380" y="235" fill="#8899bb" font-size="12">大小：2.4 MB</text>

  <!-- Conversion options -->
  <text x="50" y="278" fill="#f0f4ff" font-size="14" font-weight="600">转换选项</text>

  <!-- Checkbox 1: Keep formatting -->
  <rect x="50" y="290" width="16" height="16" fill="rgba(59,130,246,0.2)" rx="3" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="52" y="302" fill="#3b82f6" font-size="11" font-weight="700">✓</text>
  <text x="74" y="303" fill="#c8d4e8" font-size="13">保留格式（推荐）</text>

  <!-- Checkbox 2: Keep images -->
  <rect x="240" y="290" width="16" height="16" fill="rgba(59,130,246,0.2)" rx="3" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="242" y="302" fill="#3b82f6" font-size="11" font-weight="700">✓</text>
  <text x="264" y="303" fill="#c8d4e8" font-size="13">保留图片</text>

  <!-- Checkbox 3: Keep hyperlinks -->
  <rect x="430" y="290" width="16" height="16" fill="rgba(59,130,246,0.2)" rx="3" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="432" y="302" fill="#3b82f6" font-size="11" font-weight="700">✓</text>
  <text x="454" y="303" fill="#c8d4e8" font-size="13">保留超链接</text>

  <!-- Convert button (active) -->
  <rect x="170" y="325" width="340" height="38" fill="url(#accent)" rx="999"/>
  <text x="340" y="349" fill="#fff" font-size="15" font-weight="700" text-anchor="middle">🔄 开始转换</text>
</svg>