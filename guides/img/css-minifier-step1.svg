<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="'Inter',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b18"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>
  <rect width="680" height="400" fill="url(#bg)" rx="14"/>
  <text x="30" y="42" fill="#f0f4ff" font-size="20" font-weight="700">CSS 压缩工具</text>
  <text x="30" y="66" fill="#6b7a9f" font-size="13">移除空格和注释，压缩 CSS 代码，减小文件体积。</text>
  <rect x="30" y="85" width="620" height="290" fill="rgba(14,22,41,0.8)" rx="14" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="50" y="118" fill="#f0f4ff" font-size="15" font-weight="700">CSS 压缩处理</text>
  <rect x="50" y="135" width="280" height="140" fill="#0a0e1a" rx="8" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="65" y="158" fill="#4a5a7a" font-size="10" font-weight="600">输入（原始 CSS）</text>
  <text x="65" y="180" fill="#94a3b8" font-size="10" font-family="'JetBrains Mono',monospace">.header {</text>
  <text x="65" y="196" fill="#94a3b8" font-size="10" font-family="'JetBrains Mono',monospace">  padding: 20px;</text>
  <text x="65" y="212" fill="#94a3b8" font-size="10" font-family="'JetBrains Mono',monospace">  background:</text>
  <text x="65" y="228" fill="#94a3b8" font-size="10" font-family="'JetBrains Mono',monospace">    #fff;</text>
  <text x="65" y="244" fill="#94a3b8" font-size="10" font-family="'JetBrains Mono',monospace">}</text>
  <rect x="350" y="135" width="280" height="140" fill="#0a0e1a" rx="8" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="365" y="158" fill="#4a5a7a" font-size="10" font-weight="600">输出（压缩后）</text>
  <text x="365" y="180" fill="#22c55e" font-size="10" font-family="'JetBrains Mono',monospace">.header{padding:20px;</text>
  <text x="365" y="196" fill="#22c55e" font-size="10" font-family="'JetBrains Mono',monospace">background:#fff}</text>
  <text x="365" y="220" fill="#4a5a7a" font-size="10">原文 180 字节 - 压缩后 42 字节</text>
  <text x="365" y="238" fill="#22c55e" font-size="10" font-weight="600">节省 76%</text>
  <rect x="240" y="185" width="60" height="40" fill="url(#accent)" rx="8"/>
  <text x="270" y="209" fill="#fff" font-size="14" text-anchor="middle">&#10148;</text>
  <rect x="50" y="288" width="580" height="36" fill="url(#accent)" rx="8"/>
  <text x="340" y="311" fill="#fff" font-size="13" font-weight="600" text-anchor="middle">压缩 CSS 代码</text>
</svg>
