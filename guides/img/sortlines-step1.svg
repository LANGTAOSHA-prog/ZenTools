<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="'Inter',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b18"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>
  <rect width="680" height="400" fill="url(#bg)" rx="14"/>

  <text x="30" y="42" fill="#f0f4ff" font-size="20" font-weight="700">行排序</text>
  <text x="30" y="66" fill="#6b7a9f" font-size="13">对文本行按字母顺序、数字顺序或自定义规则排序。</text>

  <rect x="30" y="85" width="620" height="290" fill="rgba(14,22,41,0.8)" rx="14" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

  <rect x="50" y="100" width="265" height="200" rx="10" fill="#0a0e1a" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="65" y="128" fill="#4a5a7a" font-size="11">排序前</text>
  <text x="65" y="152" fill="#f0f4ff" font-size="12">zebra</text>
  <text x="65" y="174" fill="#f0f4ff" font-size="12">apple</text>
  <text x="65" y="196" fill="#f0f4ff" font-size="12">grape</text>
  <text x="65" y="218" fill="#f0f4ff" font-size="12">cherry</text>
  <text x="65" y="240" fill="#f0f4ff" font-size="12">banana</text>
  <text x="65" y="262" fill="#f0f4ff" font-size="12">date</text>

  <rect x="325" y="170" width="30" height="50" rx="6" fill="url(#accent)"/>
  <text x="340" y="200" fill="#fff" font-size="16" font-weight="700" text-anchor="middle">↓</text>

  <rect x="365" y="100" width="265" height="200" rx="10" fill="#0a0e1a" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="380" y="128" fill="#4a5a7a" font-size="11">排序后 (字母升序)</text>
  <text x="380" y="152" fill="#22c55e" font-size="12">apple</text>
  <text x="380" y="174" fill="#22c55e" font-size="12">banana</text>
  <text x="380" y="196" fill="#22c55e" font-size="12">cherry</text>
  <text x="380" y="218" fill="#22c55e" font-size="12">date</text>
  <text x="380" y="240" fill="#22c55e" font-size="12">grape</text>
  <text x="380" y="262" fill="#22c55e" font-size="12">zebra</text>

  <rect x="50" y="315" width="100" height="34" rx="8" fill="url(#accent)"/>
  <text x="100" y="337" fill="#fff" font-size="14" font-weight="600" text-anchor="middle">升序排序</text>

  <rect x="160" y="315" width="100" height="34" rx="8" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="210" y="337" fill="#f0f4ff" font-size="14" font-weight="600" text-anchor="middle">降序排序</text>
</svg>
