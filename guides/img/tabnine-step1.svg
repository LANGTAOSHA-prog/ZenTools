<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400">
  <defs>
    <linearGradient id="bgGrad8" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#070b18;stop-opacity:1"/>
    </linearGradient>
  </defs>
  <rect width="680" height="400" fill="url(#bgGrad8)"/>
  <text x="340" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#ffffff">Tabnine</text>
  <text x="340" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#00e5ff">AI 代码补全插件工具</text>
  <rect x="40" y="110" width="600" height="240" rx="8" fill="#1a2336" stroke="#2d3b55" stroke-width="1"/>
  <rect x="60" y="140" width="560" height="60" rx="4" fill="#1a1a1a"/>
  <text x="70" y="160" font-family="monospace" font-size="11" fill="#6a9955"># Python function to calculate factorial</text>
  <text x="70" y="180" font-family="monospace" font-size="11" fill="#dcdcaa">def factorial(n):</text>
  <polygon points="450,155 465,160 450,165" fill="#00e5ff"/>
  <text x="475" y="162" font-family="Arial" font-size="10" fill="#00e5ff">AI</text>
  <rect x="60" y="210" width="540" height="70" rx="4" fill="#1a1a1a"/>
  <text x="70" y="230" font-family="monospace" font-size="11" fill="#dcdcaa">    if n <= 1:</text>
  <text x="70" y="250" font-family="monospace" font-size="11" fill="#dcdcaa">        return n</text>
  <text x="70" y="270" font-family="monospace" font-size="11" fill="#dcdcaa">    else:</text>
  <text x="70" y="290" font-family="monospace" font-size="11" fill="#b5cea8">        return n * factorial(n-1)</text>
  <rect x="480" y="215" width="110" height="30" rx="4" fill="#00e5ff"/>
  <text x="535" y="235" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="#0f172a">智能补全</text>
  <rect x="480" y="255" width="110" height="30" rx="4" fill="#252f45"/>
  <text x="535" y="275" text-anchor="middle" font-family="Arial" font-size="11" fill="#ffffff">多语言支持</text>
</svg>
