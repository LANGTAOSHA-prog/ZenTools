<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="'Inter',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b18"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>
  <rect width="680" height="400" fill="url(#bg)" rx="14"/>

  <text x="30" y="42" fill="#f0f4ff" font-size="20" font-weight="700">空行移除</text>
  <text x="30" y="66" fill="#6b7a9f" font-size="13">清理文本中的多余空行和空格，统一文本排版格式。</text>

  <rect x="30" y="85" width="620" height="290" fill="rgba(14,22,41,0.8)" rx="14" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

  <rect x="50" y="100" width="580" height="180" rx="10" fill="#0a0e1a" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="65" y="125" fill="#4a5a7a" font-size="11">1</text>
  <text x="80" y="125" fill="#f0f4ff" font-size="12">空行移除是将文本中无内容的行删除，</text>
  <text x="80" y="145" fill="#4a5a7a" font-size="11"></text>
  <text x="80" y="165" fill="#f0f4ff" font-size="12">仅保留有效内容行，使文档排版整洁。</text>
  <text x="80" y="185" fill="#4a5a7a" font-size="11"></text>
  <text x="80" y="205" fill="#f0f4ff" font-size="12">同时支持移除行首尾多余空格。</text>
  <text x="80" y="225" fill="#4a5a7a" font-size="11"></text>
  <text x="80" y="245" fill="#f0f4ff" font-size="12">常用于清理网页抓取或导出的文本。</text>

  <rect x="50" y="295" width="160" height="36" rx="8" fill="url(#accent)"/>
  <text x="130" y="318" fill="#fff" font-size="14" font-weight="600" text-anchor="middle">开始清理</text>
</svg>
