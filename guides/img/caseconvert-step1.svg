<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="'Inter',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b18"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
  </defs>
  <rect width="680" height="400" fill="url(#bg)" rx="14"/>

  <text x="30" y="42" fill="#f0f4ff" font-size="20" font-weight="700">Aa 大小写转换</text>
  <text x="30" y="66" fill="#6b7a9f" font-size="13">将英文文本转换为大写、小写、首字母大写、驼峰命名等格式。</text>

  <rect x="30" y="85" width="620" height="290" fill="rgba(14,22,41,0.8)" rx="14" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

  <rect x="50" y="100" width="580" height="120" rx="10" fill="#0a0e1a" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="65" y="128" fill="#f0f4ff" font-size="13">hello world from zentools</text>
  <text x="65" y="155" fill="#10b981" font-size="12">HELLO WORLD FROM ZENTOOLS</text>
  <text x="65" y="178" fill="#f59e0b" font-size="12">hello world from zentools</text>
  <text x="65" y="200" fill="#06b6d4" font-size="12">Hello World From Zentools</text>

  <rect x="50" y="235" width="140" height="32" rx="6" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="120" y="256" fill="#f0f4ff" font-size="12" font-weight="600" text-anchor="middle">全大写 UPPER</text>

  <rect x="200" y="235" width="140" height="32" rx="6" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="270" y="256" fill="#f0f4ff" font-size="12" font-weight="600" text-anchor="middle">全小写 lower</text>

  <rect x="350" y="235" width="140" height="32" rx="6" fill="url(#accent)"/>
  <text x="420" y="256" fill="#fff" font-size="12" font-weight="600" text-anchor="middle">首字母大写</text>

  <rect x="50" y="280" width="140" height="32" rx="6" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="120" y="301" fill="#f0f4ff" font-size="12" font-weight="600" text-anchor="middle">camelCase</text>

  <rect x="200" y="280" width="140" height="32" rx="6" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="270" y="301" fill="#f0f4ff" font-size="12" font-weight="600" text-anchor="middle">snake_case</text>
</svg>
