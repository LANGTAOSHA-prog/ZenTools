<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#070b18;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="680" height="400" fill="url(#bgGrad)"/>
  <text x="340" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#ffffff">Framer AI</text>
  <rect x="50" y="80" width="580" height="280" rx="12" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <rect x="70" y="100" width="540" height="40" rx="6" fill="#334155"/>
  <text x="340" y="126" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#e2e8f0">输入网站描述</text>
  <rect x="100" y="160" width="480" height="80" rx="8" fill="#1e293b" stroke="#64748b" stroke-width="1"/>
  <text x="340" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#94a3b8">创建一个现代风格的科技公司官网，包含首页、产品页、联系表单...</text>
  <text x="340" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#94a3b8">使用深色主题和渐变色彩</text>
  <rect x="240" y="260" width="200" height="50" rx="8" fill="#ec4899"/>
