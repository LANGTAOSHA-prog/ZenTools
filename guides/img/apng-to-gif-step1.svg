<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" font-family="'Inter',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b18"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="680" height="380" fill="url(#bg)" rx="14"/>
  <text x="30" y="42" fill="#f0f4ff" font-size="20" font-weight="700">🔄 APNG 转 GIF</text>
  <text x="30" y="66" fill="#6b7a9f" font-size="13">将 APNG 动画格式转换为 GIF 动图，支持帧率调节和循环次数设置。</text>
  <rect x="30" y="85" width="620" height="270" fill="rgba(14,22,41,0.8)" rx="14" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="50" y="118" fill="#f0f4ff" font-size="15" font-weight="700">上传 APNG 文件</text>
  <!-- Upload zone -->
  <rect x="50" y="135" width="580" height="110" rx="12" fill="rgba(20,31,55,0.85)" stroke="rgba(59,130,246,0.4)" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="340" y="175" fill="#6b7a9f" font-size="36" text-anchor="middle">🖼️</text>
  <text x="340" y="210" fill="#8899bb" font-size="13" text-anchor="middle">点击或拖拽上传 APNG 文件</text>
  <text x="340" y="230" fill="#4a5a7a" font-size="11" text-anchor="middle">支持 APNG 格式动画文件</text>
  <!-- Select button -->
  <rect x="430" y="258" width="130" height="34" fill="url(#accent)" rx="8"/>
  <text x="495" y="280" fill="#fff" font-size="12" font-weight="600" text-anchor="middle">选择文件</text>
  <text x="60" y="280" fill="#6b7a9f" font-size="11">未选择文件</text>
  <!-- Convert button disabled -->
  <rect x="50" y="305" width="580" height="36" fill="#1e293b" rx="999" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <text x="340" y="328" fill="#4a5a7a" font-size="14" font-weight="600" text-anchor="middle">转换为 GIF</text>
  <!-- Arrow -->
  <text x="645" y="195" fill="#3b82f6" font-size="22">👆</text>
</svg>