<svg width="680" height="400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#070b18;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="680" height="400" fill="url(#grad1)" rx="12"/>
  
  <!-- Title -->
  <text x="340" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#00e5ff">图片转GIF工具</text>
  
  <!-- Virtual interface -->
  <rect x="40" y="100" width="600" height="250" fill="rgba(255,255,255,0.05)" rx="8" stroke="rgba(0,229,255,0.3)" stroke-width="1"/>
  
  <!-- Upload area -->
  <rect x="60" y="130" width="200" height="120" fill="rgba(0,229,255,0.1)" rx="6" stroke="rgba(0,229,255,0.5)" stroke-width="1" stroke-dasharray="5,5"/>
  <text x="160" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#00e5ff">点击上传图片</text>
  <text x="160" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#94a3b8">支持 JPG, PNG, WEBP</text>
  
  <!-- Preview area -->
  <rect x="280" y="130" width="340" height="120" fill="rgba(255,255,255,0.03)" rx="6" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <text x="450" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#94a3b8">预览区域</text>
  
  <!-- Settings panel -->
  <rect x="60" y="270" width="560" height="70" fill="rgba(255,255,255,0.03)" rx="6" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <text x="80" y="295" font-family="Arial, sans-serif" font-size="12" fill="#94a3b8">帧间隔:</text>
  <rect x="140" y="285" width="80" height="20" fill="rgba(0,229,255,0.2)" rx="4"/>
  <text x="180" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#00e5ff">200ms</text>
  
  <text x="240" y="295" font-family="Arial, sans-serif" font-size="12" fill="#94a3b8">循环次数:</text>
  <rect x="300" y="285" width="80" height="20" fill="rgba(0,229,255,0.2)" rx="4"/>
  <text x="340" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#00e5ff">无限</text>
  
  <text x="400" y="295" font-family="Arial, sans-serif" font-size="12" fill="#94a3b8">尺寸:</text>
  <rect x="440" y="285" width="80" height="20" fill="rgba(0,229,255,0.2)" rx="4"/>
  <text x="480" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#00e5ff">自动</text>
  
  <!-- Convert button -->
  <rect x="540" y="285" width="80" height="30" fill="#00e5ff" rx="4"/>
  <text x="580" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#0f172a">转换</text>
  
  <!-- Footer text -->
  <text x="340" y="380" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#64748b">所有处理在浏览器本地完成，文件不会上传到服务器</text>
</svg>