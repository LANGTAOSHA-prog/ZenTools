<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b18"/>
    </linearGradient>
    <linearGradient id="camGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="680" height="400" fill="url(#bg)" rx="12"/>
  <text x="340" y="52" text-anchor="middle" fill="#e2e8f0" font-family="system-ui,sans-serif" font-size="22" font-weight="700">摄像头测试</text>
  <text x="340" y="74" text-anchor="middle" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="12">Camera Test</text>
  <!-- Browser chrome -->
  <rect x="40" y="95" width="600" height="280" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <circle cx="62" cy="113" r="5" fill="#ef4444"/>
  <circle cx="80" cy="113" r="5" fill="#eab308"/>
  <circle cx="98" cy="113" r="5" fill="#22c55e"/>
  <rect x="120" y="106" width="300" height="14" rx="7" fill="#0f172a"/>
  <!-- Camera preview area -->
  <rect x="70" y="135" width="300" height="200" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <rect x="85" y="150" width="270" height="170" rx="4" fill="#1e293b"/>
  <!-- Camera icon in preview -->
  <rect x="190" y="195" width="60" height="45" rx="6" fill="url(#camGrad)" opacity="0.8"/>
  <circle cx="220" cy="217" r="12" fill="#0f172a" stroke="#e2e8f0" stroke-width="2"/>
  <circle cx="220" cy="217" r="5" fill="#06b6d4"/>
  <rect x="210" y="190" width="20" height="8" rx="2" fill="#8b5cf6"/>
  <!-- Status indicators -->
  <rect x="400" y="135" width="220" height="200" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <rect x="415" y="150" width="120" height="20" rx="4" fill="#22c55e" opacity="0.3"/>
  <text x="425" y="164" fill="#22c55e" font-family="system-ui,sans-serif" font-size="10" font-weight="600">摄像头已连接</text>
  <rect x="415" y="180" width="190" height="24" rx="4" fill="#334155"/>
  <text x="425" y="196" fill="#e2e8f0" font-family="system-ui,sans-serif" font-size="10">分辨率: 1920x1080</text>
  <rect x="415" y="214" width="190" height="24" rx="4" fill="#334155"/>
  <text x="425" y="230" fill="#e2e8f0" font-family="system-ui,sans-serif" font-size="10">帧率: 30 FPS</text>
  <rect x="415" y="248" width="190" height="24" rx="4" fill="#334155"/>
  <text x="425" y="264" fill="#e2e8f0" font-family="system-ui,sans-serif" font-size="10">麦克风: 已检测到</text>
  <!-- Buttons row -->
  <rect x="70" y="345" width="100" height="26" rx="6" fill="#06b6d4" opacity="0.8"/>
  <text x="120" y="362" text-anchor="middle" fill="#fff" font-family="system-ui,sans-serif" font-size="10" font-weight="600">拍照</text>
  <rect x="185" y="345" width="100" height="26" rx="6" fill="#ef4444" opacity="0.8"/>
  <text x="235" y="362" text-anchor="middle" fill="#fff" font-family="system-ui,sans-serif" font-size="10" font-weight="600">录像</text>
  <rect x="300" y="345" width="100" height="26" rx="6" fill="#334155"/>
  <text x="350" y="362" text-anchor="middle" fill="#e2e8f0" font-family="system-ui,sans-serif" font-size="10" font-weight="600">切换摄像头</text>
  <rect x="415" y="345" width="120" height="26" rx="6" fill="#8b5cf6" opacity="0.8"/>
  <text x="475" y="362" text-anchor="middle" fill="#fff" font-family="system-ui,sans-serif" font-size="10" font-weight="600">刷新检测</text>
</svg>
