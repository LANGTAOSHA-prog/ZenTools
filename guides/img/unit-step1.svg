<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="'Inter',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
<defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0f172a"/><stop offset="100%" stop-color="#070b18"/></linearGradient><linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#8b5cf6"/><stop offset="100%" stop-color="#06b6d4"/></linearGradient></defs>
<rect width="680" height="400" fill="url(#bg)" rx="14"/>
<text x="30" y="42" fill="#f0f4ff" font-size="20" font-weight="700">📐 单位换算</text><text x="30" y="66" fill="#6b7a9f" font-size="13">综合单位换算，涵盖长度、重量、面积、体积、速度等。</text>
<rect x="30" y="85" width="620" height="290" fill="rgba(14,22,41,0.8)" rx="14" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
<text x="50" y="120" fill="#f0f4ff" font-size="14">单位类别</text>
<rect x="50" y="132" width="140" height="36" fill="#0a0e1a" rx="8" stroke="rgba(139,92,246,0.3)" stroke-width="1"/>
<text x="120" y="155" fill="#a78bfa" font-size="13" font-weight="600" text-anchor="middle">📏 长度</text>
<rect x="200" y="132" width="140" height="36" fill="rgba(255,255,255,0.03)" rx="8" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
<text x="270" y="155" fill="#6b7a9f" font-size="13" text-anchor="middle">⚖️ 重量</text>
<rect x="350" y="132" width="140" height="36" fill="rgba(255,255,255,0.03)" rx="8" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
<text x="420" y="155" fill="#6b7a9f" font-size="13" text-anchor="middle">📐 面积</text>
<rect x="500" y="132" width="130" height="36" fill="rgba(255,255,255,0.03)" rx="8" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
<text x="565" y="155" fill="#6b7a9f" font-size="13" text-anchor="middle">🚀 速度</text>
<text x="50" y="210" fill="#f0f4ff" font-size="14">输入数值</text>
<rect x="50" y="220" width="270" height="42" fill="#0a0e1a" rx="8" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
<text x="70" y="246" fill="#f0f4ff" font-size="18" font-weight="600">1</text>
<text x="350" y="210" fill="#f0f4ff" font-size="14">从</text>
<rect x="350" y="220" width="270" height="42" fill="#0a0e1a" rx="8" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
<text x="370" y="246" fill="#8899bb" font-size="14">米 (m) ▼</text>
<rect x="50" y="290" width="570" height="56" fill="#0f1a35" rx="10" stroke="rgba(139,92,246,0.15)" stroke-width="1"/>
<text x="335" y="318" fill="#a78bfa" font-size="20" font-weight="800" text-anchor="middle">1 米 = 100 厘米 = 3.28 英尺</text>
<text x="335" y="338" fill="#6b7a9f" font-size="11" text-anchor="middle">涵盖长度、重量、面积、体积、速度、温度等 10+ 类别</text>
</svg>
