<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="'Inter',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b18"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>
  <rect width="680" height="400" fill="url(#bg)" rx="14"/>

  <text x="30" y="42" fill="#f0f4ff" font-size="20" font-weight="700">查找替换</text>
  <text x="30" y="66" fill="#6b7a9f" font-size="13">在文本中批量查找和替换内容，支持正则表达式匹配。</text>

  <rect x="30" y="85" width="620" height="290" fill="rgba(14,22,41,0.8)" rx="14" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

  <rect x="50" y="100" width="220" height="34" rx="8" fill="#0a0e1a" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="65" y="122" fill="#4a5a7a" font-size="12">查找内容</text>

  <rect x="280" y="100" width="220" height="34" rx="8" fill="#0a0e1a" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="295" y="122" fill="#4a5a7a" font-size="12">替换为</text>

  <rect x="50" y="150" width="580" height="120" rx="10" fill="#0a0e1a" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="65" y="175" fill="#f0f4ff" font-size="12">旧版本号：v1.2.3</text>
  <text x="65" y="198" fill="#f0f4ff" font-size="12">文件版本：v1.2.3</text>
  <text x="65" y="221" fill="#f0f4ff" font-size="12">API版本：v1.2.3</text>
  <text x="65" y="244" fill="#f0f4ff" font-size="12">最低版本：v1.2.3</text>

  <rect x="50" y="290" width="110" height="34" rx="8" fill="url(#accent)"/>
  <text x="105" y="312" fill="#fff" font-size="14" font-weight="600" text-anchor="middle">全部替换</text>

  <rect x="175" y="290" width="80" height="34" rx="8" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="215" y="312" fill="#f0f4ff" font-size="13" text-anchor="middle">区分大小写</text>

  <rect x="265" y="290" width="80" height="34" rx="8" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="305" y="312" fill="#f0f4ff" font-size="13" text-anchor="middle">正则匹配</text>
</svg>
