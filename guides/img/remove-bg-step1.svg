<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="'Inter',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b18"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="680" height="400" fill="url(#bg)" rx="14"/>
  <text x="30" y="42" fill="#f0f4ff" font-size="20" font-weight="700">🎯 图片去背景</text>
  <text x="30" y="66" fill="#6b7a9f" font-size="13">一键去除图片背景，自动识别主体并生成透明 PNG 图片。</text>
  <rect x="30" y="85" width="620" height="290" fill="rgba(14,22,41,0.8)" rx="14" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="50" y="118" fill="#f0f4ff" font-size="15" font-weight="700">上传图片</text>
  <rect x="50" y="132" width="580" height="90" rx="12" fill="rgba(20,31,55,0.85)" stroke="rgba(59,130,246,0.4)" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="340" y="167" fill="#6b7a9f" font-size="32" text-anchor="middle">🖼️</text>
  <text x="340" y="198" fill="#8899bb" font-size="13" text-anchor="middle">点击或拖拽上传图片</text>
  <rect x="50" y="238" width="140" height="34" rx="8" fill="url(#accent)"/>
  <text x="120" y="260" fill="#fff" font-size="13" font-weight="600" text-anchor="middle">🎯 去背景</text>
  <text x="340" y="260" fill="#4a5a7a" font-size="12" text-anchor="middle">支持 JPG、PNG、WebP 格式</text>
  <rect x="50" y="290" width="580" height="70" rx="10" fill="rgba(10,14,26,0.6)" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <text x="65" y="315" fill="#00e5ff" font-size="13" font-weight="600">💡 提示</text>
  <text x="65" y="338" fill="#6b7a9f" font-size="12">选择主体清晰、背景与主体颜色差异较大的图片，去背景效果更好。</text>
</svg>
