<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="'Inter',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b18"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="680" height="400" fill="url(#bg)" rx="14"/>
  <text x="30" y="42" fill="#f0f4ff" font-size="20" font-weight="700">🔊 文字转语音 - 结果</text>
  <text x="30" y="66" fill="#6b7a9f" font-size="13">语音生成完成，可在线试听并下载为 MP3 格式。</text>
  <rect x="30" y="85" width="620" height="290" fill="rgba(14,22,41,0.8)" rx="14" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="50" y="118" fill="#f0f4ff" font-size="15" font-weight="700">生成结果</text>
  <!-- Player -->
  <rect x="50" y="132" width="580" height="60" rx="10" fill="rgba(10,14,26,0.6)" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <circle cx="90" cy="162" r="18" fill="rgba(0,229,255,0.15)" stroke="#00e5ff" stroke-width="2"/>
  <text x="90" y="168" fill="#00e5ff" font-size="16" text-anchor="middle">▶</text>
  <text x="125" y="156" fill="#f0f4ff" font-size="13">已生成语音</text>
  <text x="125" y="176" fill="#6b7a9f" font-size="11">中文女声 · 标准语速</text>
  <!-- Progress bar -->
  <rect x="320" y="158" width="280" height="6" rx="3" fill="#1e293b"/>
  <rect x="320" y="158" width="120" height="6" rx="3" fill="#00e5ff"/>
  <circle cx="440" cy="161" r="8" fill="#3b82f6" stroke="#f0f4ff" stroke-width="2"/>
  <text x="520" y="180" fill="#4a5a7a" font-size="11">0:12 / 0:45</text>
  <!-- Text content preview -->
  <rect x="50" y="205" width="580" height="65" rx="8" fill="rgba(10,14,26,0.4)" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <text x="65" y="228" fill="#4a5a7a" font-size="11">已合成文字内容：</text>
  <text x="65" y="246" fill="#8899bb" font-size="12">欢迎使用 ZenTools 文字转语音工具。本工具支持中文、英文</text>
  <text x="65" y="262" fill="#8899bb" font-size="12">等多种语言，你可以在线试听效果并下载为 MP3 音频文件。</text>
  <!-- Stats -->
  <rect x="50" y="282" width="170" height="46" rx="8" fill="rgba(0,229,255,0.04)" stroke="rgba(0,229,255,0.12)" stroke-width="1"/>
  <text x="135" y="300" fill="#6b7a9f" font-size="10" text-anchor="middle">时长</text>
  <text x="135" y="318" fill="#00e5ff" font-size="15" font-weight="700" text-anchor="middle">00:45</text>
  <rect x="240" y="282" width="170" height="46" rx="8" fill="rgba(168,85,247,0.04)" stroke="rgba(168,85,247,0.12)" stroke-width="1"/>
  <text x="325" y="300" fill="#6b7a9f" font-size="10" text-anchor="middle">文件大小</text>
  <text x="325" y="318" fill="#a855f7" font-size="15" font-weight="700" text-anchor="middle">2.1 MB</text>
  <rect x="430" y="282" width="170" height="46" rx="8" fill="rgba(34,197,94,0.04)" stroke="rgba(34,197,94,0.12)" stroke-width="1"/>
  <text x="515" y="300" fill="#6b7a9f" font-size="10" text-anchor="middle">格式</text>
  <text x="515" y="318" fill="#22c55e" font-size="15" font-weight="700" text-anchor="middle">MP3</text>
  <!-- Download button -->
  <rect x="200" y="342" width="280" height="36" rx="999" fill="url(#accent)"/>
  <text x="340" y="365" fill="#fff" font-size="14" font-weight="700" text-anchor="middle">⬇ 下载 MP3</text>
</svg>
