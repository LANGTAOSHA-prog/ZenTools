<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="'Inter',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b18"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="success" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>
  <rect width="680" height="400" fill="url(#bg)" rx="14"/>

  <text x="30" y="42" fill="#f0f4ff" font-size="20" font-weight="700">🔒 PDF 保护 — 完成</text>
  <text x="30" y="66" fill="#6b7a9f" font-size="13">文件已成功保护，下载受保护的 PDF 文件。</text>

  <rect x="30" y="85" width="620" height="290" fill="rgba(14,22,41,0.8)" rx="14" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

  <!-- Success icon -->
  <circle cx="340" cy="150" r="36" fill="rgba(16,185,129,0.15)"/>
  <text x="340" y="161" fill="#10b981" font-size="36" text-anchor="middle">✅</text>

  <!-- Success message -->
  <text x="340" y="202" fill="#f0f4ff" font-size="16" font-weight="700" text-anchor="middle">保护成功！</text>
  <text x="340" y="224" fill="#6b7a9f" font-size="13" text-anchor="middle">您的 PDF 文件已添加密码保护</text>

  <!-- File info -->
  <rect x="100" y="242" width="480" height="40" rx="10" fill="rgba(20,31,55,0.6)" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  <text x="120" y="268" fill="#8899bb" font-size="13">📄 report_protected.pdf</text>
  <text x="450" y="268" fill="#4a5a7a" font-size="11">🔒 已保护 · 2.4 MB</text>

  <!-- Security details -->
  <text x="100" y="300" fill="#4a5a7a" font-size="11">✓ 打开密码已设置</text>
  <text x="280" y="300" fill="#4a5a7a" font-size="11">✓ 权限密码已设置</text>
  <text x="460" y="300" fill="#4a5a7a" font-size="11">✓ 编辑权限已限制</text>

  <!-- Download button -->
  <rect x="220" y="320" width="200" height="40" rx="10" fill="url(#success)"/>
  <text x="320" y="346" fill="#fff" font-size="15" font-weight="700" text-anchor="middle">📥 下载文件</text>
</svg>
