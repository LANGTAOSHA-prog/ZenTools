<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="'Inter',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b18"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="680" height="400" fill="url(#bg)" rx="14"/>

  <text x="30" y="42" fill="#f0f4ff" font-size="20" font-weight="700">📈 投资计算器</text>
  <text x="30" y="66" fill="#6b7a9f" font-size="13">步骤 4：查看完整投资回报分析</text>

  <rect x="30" y="85" width="620" height="290" fill="rgba(14,22,41,0.8)" rx="14" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

  <text x="50" y="118" fill="#f0f4ff" font-size="15" font-weight="700">投资回报分析结果</text>

  <rect x="50" y="132" width="165" height="60" fill="#0f1a35" rx="10" stroke="rgba(0,229,255,0.1)" stroke-width="1"/>
  <text x="132" y="158" fill="#6b7a9f" font-size="11" text-anchor="middle">投入本金</text>
  <text x="132" y="182" fill="#f0f4ff" font-size="16" font-weight="700" text-anchor="middle">340,000 元</text>

  <rect x="225" y="132" width="165" height="60" fill="#0f1a35" rx="10" stroke="rgba(16,185,129,0.15)" stroke-width="1"/>
  <text x="307" y="158" fill="#6b7a9f" font-size="11" text-anchor="middle">总收益</text>
  <text x="307" y="182" fill="#10b981" font-size="16" font-weight="700" text-anchor="middle">+249,322 元</text>

  <rect x="400" y="132" width="165" height="60" fill="#0f1a35" rx="10" stroke="rgba(0,229,255,0.15)" stroke-width="1"/>
  <text x="482" y="158" fill="#6b7a9f" font-size="11" text-anchor="middle">最终金额</text>
  <text x="482" y="182" fill="#00e5ff" font-size="16" font-weight="700" text-anchor="middle">589,322 元</text>

  <text x="50" y="218" fill="#f0f4ff" font-size="14" font-weight="700">详细指标</text>
  <rect x="50" y="230" width="275" height="36" fill="#0a0e1a" rx="8" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  <text x="65" y="252" fill="#6b7a9f" font-size="12">年化收益率 (CAGR): <tspan fill="#00e5ff" font-weight="700">11.37</tspan>%</text>

  <rect x="340" y="230" width="275" height="36" fill="#0a0e1a" rx="8" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  <text x="355" y="252" fill="#6b7a9f" font-size="12">回报倍数: <tspan fill="#00e5ff" font-weight="700">1.73x</tspan></text>

  <rect x="50" y="276" width="275" height="36" fill="#0a0e1a" rx="8" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  <text x="65" y="298" fill="#6b7a9f" font-size="12">内部收益率 (IRR): <tspan fill="#00e5ff" font-weight="700">12.05</tspan>%</text>

  <rect x="340" y="276" width="275" height="36" fill="#0a0e1a" rx="8" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  <text x="355" y="298" fill="#6b7a9f" font-size="12">风险评级: <tspan fill="#10b981" font-weight="700">中等</tspan></text>

  <rect x="50" y="327" width="580" height="32" fill="rgba(0,229,255,0.06)" rx="8" stroke="rgba(0,229,255,0.08)" stroke-width="1"/>
  <text x="340" y="348" fill="#6b7a9f" font-size="12" text-anchor="middle">通过年化收益率、IRR和风险评估三个维度综合评估投资价值</text>
</svg>
