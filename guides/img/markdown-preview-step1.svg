<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="'Inter',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b18"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="680" height="400" fill="url(#bg)" rx="14"/>

  <!-- Title -->
  <text x="30" y="42" fill="#f0f4ff" font-size="20" font-weight="700">📝 Markdown 预览</text>
  <text x="30" y="66" fill="#6b7a9f" font-size="13">实时将 Markdown 源码渲染为美观的 HTML 预览。</text>

  <!-- Tool box -->
  <rect x="30" y="85" width="620" height="290" fill="rgba(14,22,41,0.8)" rx="14" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

  <!-- Split pane divider -->
  <line x1="340" y1="105" x2="340" y2="365" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

  <!-- Left: Editor -->
  <text x="50" y="118" fill="#f0f4ff" font-size="15" font-weight="700">Markdown 源码</text>
  <rect x="50" y="128" width="280" height="225" rx="10" fill="#0a0e1a" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  
  <text x="65" y="152" fill="#f0f4ff" font-size="13" font-weight="700"># 标题</text>
  <text x="65" y="175" fill="#8899bb" font-size="12">这是一段正文内容。</text>
  <text x="65" y="195" fill="#22c55e" font-size="12">- 列表项 1</text>
  <text x="65" y="215" fill="#22c55e" font-size="12">- 列表项 2</text>
  <text x="65" y="240" fill="#60a5fa" font-size="12">`行内代码`</text>
  <text x="65" y="262" fill="#c084fc" font-size="12">[链接](https://example.com)</text>
  <text x="65" y="287" fill="#6b7a9f" font-size="11">```</text>
  <text x="65" y="305" fill="#fbbf24" font-size="11">代码块内容</text>
  <text x="65" y="323" fill="#6b7a9f" font-size="11">```</text>

  <!-- Right: Preview -->
  <text x="370" y="118" fill="#f0f4ff" font-size="15" font-weight="700">实时预览</text>
  <rect x="350" y="128" width="280" height="225" rx="10" fill="#0d1321" stroke="rgba(34,197,94,0.3)" stroke-width="1"/>
  
  <text x="370" y="155" fill="#f0f4ff" font-size="16" font-weight="800">标题</text>
  <text x="370" y="178" fill="#c0c8e0" font-size="12">这是一段正文内容。</text>
  <text x="370" y="200" fill="#c0c8e0" font-size="12">• 列表项 1</text>
  <text x="370" y="218" fill="#c0c8e0" font-size="12">• 列表项 2</text>
  <rect x="370" y="235" width="70" height="20" rx="4" fill="rgba(59,130,246,0.15)"/>
  <text x="378" y="250" fill="#60a5fa" font-size="11">行内代码</text>
  <text x="370" y="275" fill="#3b82f6" font-size="12">链接</text>
  <rect x="370" y="290" width="240" height="40" rx="6" fill="rgba(15,23,42,0.8)" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <text x="380" y="314" fill="#fbbf24" font-size="11">代码块内容</text>
</svg>
