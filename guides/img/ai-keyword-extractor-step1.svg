<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="'Inter',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b18"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="680" height="400" fill="url(#bg)" rx="14"/>
  <text x="30" y="42" fill="#f0f4ff" font-size="20" font-weight="700">🔍 AI 关键词提取</text>
  <text x="30" y="66" fill="#6b7a9f" font-size="13">使用AI从文本中提取核心关键词和短语，支持SEO优化和内容分析。</text>
  
  <!-- Main interface -->
  <rect x="30" y="85" width="620" height="290" fill="rgba(14,22,41,0.8)" rx="14" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  
  <!-- Input text area -->
  <rect x="50" y="100" width="580" height="120" fill="rgba(20,31,55,0.9)" rx="10" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <text x="70" y="125" fill="#f0f4ff" font-size="13" font-weight="600">输入需要分析的文本</text>
  <text x="70" y="150" fill="#94a3b8" font-size="12">人工智能（AI）正在改变我们的生活方式。从智能手机的语音助手到自动驾驶汽车，AI技术已经深入到各个领域。机器学习、深度学习和自然语言处理是AI的三大核心技术，它们正在推动科技创新和社会进步。</text>
  
  <!-- Extracted keywords -->
  <rect x="50" y="230" width="580" height="140" fill="rgba(59,130,246,0.08)" rx="10" stroke="rgba(59,130,246,0.15)" stroke-width="1"/>
  <text x="70" y="255" fill="#3b82f6" font-size="13" font-weight="600">🤖 提取的关键词</text>
  
  <!-- Keyword tags -->
  <rect x="70" y="270" width="100" height="25" fill="rgba(59,130,246,0.2)" rx="12"/>
  <text x="120" y="287" fill="#3b82f6" font-size="11" text-anchor="middle">人工智能</text>
  
  <rect x="180" y="270" width="80" height="25" fill="rgba(139,92,246,0.2)" rx="12"/>
  <text x="220" y="287" fill="#8b5cf6" font-size="11" text-anchor="middle">AI技术</text>
  
  <rect x="270" y="270" width="100" height="25" fill="rgba(34,197,94,0.2)" rx="12"/>
  <text x="320" y="287" fill="#22c55e" font-size="11" text-anchor="middle">机器学习</text>
  
  <rect x="380" y="270" width="100" height="25" fill="rgba(249,115,22,0.2)" rx="12"/>
  <text x="430" y="287" fill="#f97316" font-size="11" text-anchor="middle">深度学习</text>
  
  <rect x="490" y="270" width="120" height="25" fill="rgba(236,72,153,0.2)" rx="12"/>
  <text x="550" y="287" fill="#ec4899" font-size="11" text-anchor="middle">自然语言处理</text>
  
  <!-- Keyword frequency -->
  <text x="70" y="315" fill="#94a3b8" font-size="11">关键词频率：人工智能(3次) · AI(2次) · 技术(2次)</text>
  
  <!-- SEO score -->
  <rect x="70" y="330" width="120" height="25" fill="rgba(34,197,94,0.2)" rx="12"/>
  <text x="130" y="347" fill="#22c55e" font-size="11" text-anchor="middle">SEO评分：85/100</text>
  
  <!-- Action buttons -->
  <rect x="200" y="330" width="120" height="25" fill="url(#accent)" rx="12"/>
  <text x="260" y="347" fill="#fff" font-size="11" text-anchor="middle">复制关键词</text>
  
  <rect x="330" y="330" width="120" height="25" fill="rgba(255,255,255,0.08)" rx="12" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
  <text x="390" y="347" fill="#f0f4ff" font-size="11" text-anchor="middle">导出报告</text>
  
  <rect x="460" y="330" width="120" height="25" fill="rgba(255,255,255,0.08)" rx="12" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
  <text x="520" y="347" fill="#f0f4ff" font-size="11" text-anchor="middle">重新分析</text>
</svg>