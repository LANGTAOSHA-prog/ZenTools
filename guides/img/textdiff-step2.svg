<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="'Inter',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b18"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="680" height="400" fill="url(#bg)" rx="14"/>

  <text x="30" y="42" fill="#f0f4ff" font-size="20" font-weight="700">文本对比</text>
  <text x="30" y="66" fill="#6b7a9f" font-size="13">并排对比两段文本内容，高亮显示新增和删除的行。</text>
  <rect x="30" y="85" width="620" height="295" fill="rgba(14,22,41,0.8)" rx="14" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="50" y="118" fill="#f0f4ff" font-size="14" font-weight="700">原始文本</text>
  <rect x="50" y="130" width="280" height="180" rx="8" fill="#0a0e1a" stroke="rgba(59,130,246,0.3)" stroke-width="1"/>
  <text x="65" y="155" fill="#8899bb" font-size="12">Hello World</text>
  <text x="65" y="178" fill="#8899bb" font-size="12">This is a test file.</text>
  <text x="65" y="201" fill="#8899bb" font-size="12">Line three content.</text>
  <text x="65" y="224" fill="#8899bb" font-size="12">Line four unchanged.</text>
  <text x="370" y="118" fill="#f0f4ff" font-size="14" font-weight="700">修改后文本</text>
  <rect x="370" y="130" width="280" height="180" rx="8" fill="#0a0e1a" stroke="rgba(59,130,246,0.3)" stroke-width="1"/>
  <text x="385" y="155" fill="#8899bb" font-size="12">Hello World</text>
  <text x="385" y="178" fill="#8899bb" font-size="12">This is a modified file.</text>
  <text x="385" y="201" fill="#8899bb" font-size="12">New line added here.</text>
  <text x="385" y="224" fill="#8899bb" font-size="12">Line four unchanged.</text>
  <rect x="50" y="325" width="600" height="40" fill="url(#accent)" rx="999"/>
  <text x="350" y="350" fill="#fff" font-size="14" font-weight="600" text-anchor="middle">开始对比</text>

</svg>