<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" font-family="'Inter',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b18"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="680" height="380" fill="url(#bg)" rx="14"/>
  <text x="30" y="42" fill="#f0f4ff" font-size="20" font-weight="700">📁 图片去重</text>
  <text x="30" y="66" fill="#6b7a9f" font-size="13">查找并清理重复图片，节省存储空间。</text>
  <rect x="30" y="85" width="620" height="275" fill="rgba(14,22,41,0.8)" rx="14" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="50" y="118" fill="#f0f4ff" font-size="15" font-weight="700">去重设置</text>
  <!-- Upload zone -->
  <rect x="50" y="135" width="580" height="100" rx="12" fill="rgba(20,31,55,0.85)" stroke="rgba(59,130,246,0.4)" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="340" y="175" fill="#6b7a9f" font-size="32" text-anchor="middle">📁</text>
  <text x="340" y="205" fill="#8899bb" font-size="13" text-anchor="middle">点击上传文件夹或拖拽图片到此处</text>
  <text x="340" y="225" fill="#4a5a7a" font-size="11" text-anchor="middle">支持 JPG、PNG、WebP、GIF</text>
  <rect x="220" y="245" width="240" height="34" fill="url(#accent)" rx="8"/>
  <text x="340" y="267" fill="#fff" font-size="12" font-weight="600" text-anchor="middle">选择文件夹或图片文件</text>
  <!-- Results -->
  <rect x="50" y="290" width="580" height="40" rx="8" fill="rgba(20,31,55,0.5)" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <text x="60" y="316" fill="#6b7a9f" font-size="12">已加载 48 张图片</text>
  <text x="340" y="316" fill="#f59e0b" font-size="12" text-anchor="middle">⚠ 发现 12 组重复图片</text>
  <text x="600" y="316" fill="#10b981" font-size="12" text-anchor="end">预估节省 23.4 MB</text>
</svg>