<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="'Inter',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b18"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>
  <rect width="680" height="400" fill="url(#bg)" rx="14"/>

  <!-- Title -->
  <text x="30" y="42" fill="#f0f4ff" font-size="20" font-weight="700">📊 Excel 转 PDF</text>
  <text x="30" y="66" fill="#6b7a9f" font-size="13">编辑表格数据，点击生成 PDF，一键导出整洁文档。</text>

  <!-- Tool box -->
  <rect x="30" y="85" width="620" height="290" fill="rgba(14,22,41,0.8)" rx="14" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

  <!-- Success circle -->
  <circle cx="340" cy="140" r="34" fill="rgba(16,185,129,0.12)" stroke="rgba(16,185,129,0.3)" stroke-width="2"/>
  <text x="340" y="152" fill="#10b981" font-size="36" text-anchor="middle">✓</text>

  <text x="340" y="202" fill="#f0f4ff" font-size="17" font-weight="700" text-anchor="middle">✅ PDF 生成完成！</text>
  <text x="340" y="226" fill="#6b7a9f" font-size="13" text-anchor="middle">已成功将表格数据转换为 PDF 文档</text>

  <!-- Summary card -->
  <rect x="80" y="244" width="520" height="44" fill="rgba(255,255,255,0.02)" rx="10" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <text x="340" y="264" fill="#94a3b8" font-size="12" text-anchor="middle">3 行 × 3 列 · 共 1 页 · PDF 大小约 12 KB</text>
  <text x="340" y="280" fill="#4a5a7a" font-size="11" text-anchor="middle">🕒 生成耗时 0.8 秒</text>

  <!-- Download button -->
  <rect x="140" y="300" width="400" height="48" fill="url(#green)" rx="12"/>
  <text x="340" y="330" fill="#fff" font-size="16" font-weight="700" text-anchor="middle">📥 下载 PDF</text>
</svg>
