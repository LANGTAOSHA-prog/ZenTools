<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b18"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="680" height="400" fill="url(#bg)" rx="12"/>
  <text x="340" y="48" text-anchor="middle" fill="url(#accent)" font-size="20" font-weight="700" font-family="system-ui,sans-serif">Color Converter</text>
  <text x="340" y="68" text-anchor="middle" fill="#64748b" font-size="11" font-family="system-ui,sans-serif">颜色转换器 - Color Converter</text>
  <!-- Preview circle -->
  <circle cx="140" cy="170" r="60" fill="#3b82f6" stroke="#60a5fa" stroke-width="2"/>
  <text x="140" y="250" text-anchor="middle" fill="#e2e8f0" font-size="13" font-family="monospace">#3B82F6</text>
  <!-- Input panel -->
  <rect x="230" y="90" width="200" height="280" rx="12" fill="url(#card)" stroke="#334155" stroke-width="1"/>
  <text x="250" y="118" fill="#94a3b8" font-size="12" font-weight="600" font-family="system-ui,sans-serif">输入颜色值</text>
  <rect x="250" y="130" width="160" height="34" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="264" y="152" fill="#64748b" font-size="12" font-family="system-ui,sans-serif">HEX</text>
  <text x="290" y="152" fill="#e2e8f0" font-size="14" font-family="monospace">#3B82F6</text>
  <rect x="250" y="174" width="160" height="34" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="264" y="196" fill="#64748b" font-size="12" font-family="system-ui,sans-serif">RGB</text>
  <text x="290" y="196" fill="#e2e8f0" font-size="13" font-family="monospace">59,130,246</text>
  <rect x="250" y="218" width="160" height="34" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="264" y="240" fill="#64748b" font-size="12" font-family="system-ui,sans-serif">HSL</text>
  <text x="290" y="240" fill="#e2e8f0" font-size="13" font-family="monospace">217,87%,60%</text>
  <rect x="250" y="262" width="160" height="34" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="264" y="284" fill="#64748b" font-size="12" font-family="system-ui,sans-serif">HSV</text>
  <text x="290" y="284" fill="#e2e8f0" font-size="13" font-family="monospace">217,76%,96%</text>
  <!-- Sliders -->
  <text x="250" y="320" fill="#94a3b8" font-size="11" font-family="system-ui,sans-serif">色相滑块</text>
  <rect x="250" y="328" width="160" height="10" rx="5" fill="#334155"/>
  <rect x="250" y="328" width="120" height="10" rx="5" fill="url(#accent)"/>
  <circle cx="370" cy="333" r="7" fill="#fff" stroke="#8b5cf6" stroke-width="2"/>
  <text x="460" y="90" fill="#64748b" font-size="10" font-family="system-ui,sans-serif">⇄</text>
  <!-- Output panel -->
  <rect x="450" y="90" width="190" height="280" rx="12" fill="url(#card)" stroke="#334155" stroke-width="1"/>
  <text x="470" y="118" fill="#94a3b8" font-size="12" font-weight="600" font-family="system-ui,sans-serif">格式面板</text>
  <rect x="470" y="130" width="150" height="28" rx="6" fill="#3b82f6" opacity="0.3"/>
  <text x="545" y="149" fill="#fff" font-size="11" font-weight="600" font-family="system-ui,sans-serif" text-anchor="middle">预览色块</text>
  <rect x="470" y="168" width="150" height="28" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="484" y="187" fill="#06b6d4" font-size="11" font-family="monospace">rgb(59,130,246)</text>
  <rect x="470" y="204" width="150" height="28" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="484" y="223" fill="#8b5cf6" font-size="11" font-family="monospace">hsl(217,87%,60%)</text>
  <rect x="470" y="240" width="150" height="28" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="484" y="259" fill="#ec4899" font-size="11" font-family="monospace">hsv(217,76%,96%)</text>
  <rect x="470" y="276" width="150" height="28" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="484" y="295" fill="#10b981" font-size="11" font-family="monospace">CSS: #3B82F6</text>
  <rect x="470" y="312" width="150" height="28" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="484" y="331" fill="#f59e0b" font-size="11" font-family="monospace">SCSS: #3B82F6</text>
</svg>