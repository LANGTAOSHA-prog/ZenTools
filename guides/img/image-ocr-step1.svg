<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="'Inter',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b18"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="680" height="400" fill="url(#bg)" rx="14"/>
  <text x="30" y="42" fill="#f0f4ff" font-size="20" font-weight="700">图片OCR文字识别</text>
  <text x="30" y="66" fill="#6b7a9f" font-size="13">上传图片，自动提取文字内容</text>
  <rect x="30" y="85" width="620" height="295" fill="rgba(14,22,41,0.8)" rx="14" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <!-- Left: image upload area -->
  <text x="50" y="118" fill="#f0f4ff" font-size="15" font-weight="700">上传图片</text>
  <rect x="50" y="135" width="280" height="225" rx="12" fill="rgba(20,31,55,0.85)" stroke="rgba(59,130,246,0.4)" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="190" y="210" fill="#6b7a9f" font-size="32" text-anchor="middle">📷</text>
  <text x="190" y="240" fill="#8899bb" font-size="12" text-anchor="middle">拖拽或点击上传图片</text>
  <text x="190" y="260" fill="#4a5a7a" font-size="10" text-anchor="middle">JPG、PNG、GIF、WebP</text>
  <!-- Right: OCR result -->
  <text x="350" y="118" fill="#f0f4ff" font-size="15" font-weight="700">识别结果</text>
  <rect x="350" y="135" width="280" height="225" rx="12" fill="rgba(20,31,55,0.85)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <!-- Simulated extracted text -->
  <rect x="365" y="155" width="20" height="10" rx="2" fill="#3b82f6" opacity="0.6"/>
  <rect x="390" y="155" width="120" height="10" rx="2" fill="#4a5a7a" opacity="0.4"/>
  <rect x="365" y="175" width="15" height="10" rx="2" fill="#3b82f6" opacity="0.6"/>
  <rect x="385" y="175" width="180" height="10" rx="2" fill="#4a5a7a" opacity="0.4"/>
  <rect x="365" y="195" width="25" height="10" rx="2" fill="#3b82f6" opacity="0.6"/>
  <rect x="395" y="195" width="140" height="10" rx="2" fill="#4a5a7a" opacity="0.4"/>
  <rect x="365" y="215" width="18" height="10" rx="2" fill="#3b82f6" opacity="0.6"/>
  <rect x="388" y="215" width="160" height="10" rx="2" fill="#4a5a7a" opacity="0.4"/>
  <rect x="365" y="235" width="22" height="10" rx="2" fill="#3b82f6" opacity="0.6"/>
  <rect x="392" y="235" width="100" height="10" rx="2" fill="#4a5a7a" opacity="0.4"/>
  <rect x="365" y="255" width="16" height="10" rx="2" fill="#3b82f6" opacity="0.6"/>
  <rect x="386" y="255" width="190" height="10" rx="2" fill="#4a5a7a" opacity="0.4"/>
  <rect x="365" y="275" width="20" height="10" rx="2" fill="#3b82f6" opacity="0.6"/>
  <rect x="389" y="275" width="130" height="10" rx="2" fill="#4a5a7a" opacity="0.4"/>
  <!-- Action buttons -->
  <rect x="365" y="300" width="125" height="30" rx="8" fill="url(#accent)"/>
  <text x="427" y="319" fill="#fff" font-size="11" font-weight="600" text-anchor="middle">复制文字</text>
  <rect x="500" y="300" width="125" height="30" rx="8" fill="#10b981"/>
  <text x="562" y="319" fill="#fff" font-size="11" font-weight="600" text-anchor="middle">下载 TXT</text>
</svg>
