<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="'Inter',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b18"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="680" height="400" fill="url(#bg)" rx="14"/>
  <text x="30" y="42" fill="#f0f4ff" font-size="20" font-weight="700">AI 智能裁剪</text>
  <text x="30" y="66" fill="#6b7a9f" font-size="13">AI 智能识别图片主体，自动按社交媒体各平台推荐尺寸裁剪图片。</text>
  <rect x="30" y="85" width="620" height="290" fill="rgba(14,22,41,0.8)" rx="14" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="50" y="118" fill="#f0f4ff" font-size="15" font-weight="700">AI 智能裁剪</text>
  <rect x="50" y="132" width="580" height="80" rx="12" fill="rgba(20,31,55,0.85)" stroke="rgba(59,130,246,0.4)" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="340" y="165" fill="#6b7a9f" font-size="28" text-anchor="middle">📂</text>
  <text x="340" y="195" fill="#8899bb" font-size="13" text-anchor="middle">点击上传或拖拽图片到此处</text>
  <rect x="50" y="228" width="580" height="44" rx="10" fill="rgba(10,14,26,0.6)" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  <text x="65" y="254" fill="#6b7a9f" font-size="13">选择平台：</text>
  <rect x="160" y="236" width="90" height="30" rx="6" fill="rgba(0,229,255,0.1)" stroke="rgba(0,229,255,0.2)" stroke-width="1"/>
  <text x="205" y="256" fill="#00e5ff" font-size="12" font-weight="600" text-anchor="middle">Instagram</text>
  <rect x="260" y="236" width="90" height="30" rx="6" fill="#0a0e1a" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="305" y="256" fill="#f0f4ff" font-size="12" text-anchor="middle">微信</text>
  <rect x="360" y="236" width="90" height="30" rx="6" fill="#0a0e1a" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="405" y="256" fill="#f0f4ff" font-size="12" text-anchor="middle">微博</text>
  <rect x="460" y="236" width="90" height="30" rx="6" fill="#0a0e1a" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="505" y="256" fill="#f0f4ff" font-size="12" text-anchor="middle">小红书</text>
  <rect x="50" y="288" width="580" height="38" rx="999" fill="url(#accent)"/>
  <text x="340" y="312" fill="#fff" font-size="14" font-weight="600" text-anchor="middle">AI 智能裁剪</text>
  <text x="340" y="345" fill="#4a5a7a" font-size="11" text-anchor="middle">所有处理在浏览器本地完成，文件不会上传</text>
