<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="'Inter',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b18"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="680" height="400" fill="url(#bg)" rx="14"/>
  <text x="30" y="42" fill="#f0f4ff" font-size="20" font-weight="700">🔗 音频合并</text>
  <text x="30" y="66" fill="#6b7a9f" font-size="13">将多个音频文件按顺序合并为一个文件，支持拖拽排序。</text>
  <rect x="30" y="85" width="620" height="290" fill="rgba(14,22,41,0.8)" rx="14" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="50" y="118" fill="#f0f4ff" font-size="15" font-weight="700">上传音频文件</text>
  <rect x="50" y="132" width="580" height="70" rx="12" fill="rgba(20,31,55,0.85)" stroke="rgba(59,130,246,0.4)" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="340" y="162" fill="#6b7a9f" font-size="26" text-anchor="middle">🎵</text>
  <text x="340" y="188" fill="#8899bb" font-size="13" text-anchor="middle">点击上传或拖拽音频文件到此处</text>
  <rect x="50" y="215" width="580" height="110" rx="10" fill="rgba(10,14,26,0.6)" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  <rect x="65" y="224" width="550" height="36" rx="6" fill="rgba(20,31,55,0.8)" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <text x="80" y="247" fill="#6b7a9f" font-size="12">⠿ 介绍1.mp3</text>
  <text x="560" y="247" fill="#4a5a7a" font-size="11">0:45</text>
  <rect x="65" y="265" width="550" height="36" rx="6" fill="rgba(20,31,55,0.8)" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <text x="80" y="288" fill="#6b7a9f" font-size="12">⠿ 介绍2.mp3</text>
  <text x="560" y="288" fill="#4a5a7a" font-size="11">1:20</text>
  <rect x="65" y="306" width="550" height="36" rx="6" fill="rgba(20,31,55,0.8)" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <text x="80" y="329" fill="#6b7a9f" font-size="12">⠿ 介绍3.mp3</text>
  <text x="560" y="329" fill="#4a5a7a" font-size="11">0:38</text>
