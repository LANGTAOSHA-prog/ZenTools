  <rect x="50" y="265" width="350" height="50" rx="10" fill="rgba(20,31,55,0.9)" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <text x="70" y="290" fill="#f0f4ff" font-size="13">选择最佳标题</text>
