<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" font-family="'Inter',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b18"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="680" height="380" fill="url(#bg)" rx="14"/>
  <text x="30" y="42" fill="#f0f4ff" font-size="20" font-weight="700">🏥 图片锐化</text>
  <text x="30" y="66" fill="#6b7a9f" font-size="13">增强图片边缘清晰度，让模糊的图片变得更加清晰。</text>
  <rect x="30" y="85" width="620" height="275" fill="rgba(14,22,41,0.8)" rx="14" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="50" y="118" fill="#f0f4ff" font-size="15" font-weight="700">锐化设置</text>
  <rect x="50" y="135" width="280" height="200" rx="12" fill="rgba(20,31,55,0.85)" stroke="rgba(59,130,246,0.4)" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="190" y="195" fill="#6b7a9f" font-size="32" text-anchor="middle">🏥</text>
  <text x="190" y="225" fill="#8899bb" font-size="13" text-anchor="middle">点击上传要锐化的图片</text>
  <text x="190" y="245" fill="#4a5a7a" font-size="11" text-anchor="middle">JPG、PNG、WebP</text>
  <rect x="110" y="268" width="160" height="34" fill="url(#accent)" rx="8"/>
  <text x="190" y="290" fill="#fff" font-size="12" font-weight="600" text-anchor="middle">选择文件</text>
  <rect x="350" y="135" width="280" height="200" rx="12" fill="rgba(20,31,55,0.85)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="490" y="160" fill="#f0f4ff" font-size="13" font-weight="600" text-anchor="middle">锐化参数</text>
  <text x="365" y="188" fill="#6b7a9f" font-size="11">锐化强度</text>
  <text x="615" y="188" fill="#f0f4ff" font-size="11" text-anchor="end">60%</text>
  <rect x="365" y="198" width="250" height="6" rx="3" fill="#1e293b"/>
  <circle cx="520" cy="201" r="8" fill="#3b82f6" stroke="#fff" stroke-width="2"/>
  <text x="365" y="222" fill="#6b7a9f" font-size="11">预览对比</text>
  <rect x="365" y="232" width="120" height="80" rx="6" fill="rgba(59,130,246,0.2)"/>
  <text x="425" y="255" fill="#6b7a9f" font-size="10" text-anchor="middle">模糊</text>
  <rect x="495" y="232" width="120" height="80" rx="6" fill="#3b82f6" opacity="0.35"/>
  <text x="555" y="255" fill="#f0f4ff" font-size="10" text-anchor="middle">锐化</text>
  <rect x="365" y="325" width="250" height="30" rx="8" fill="url(#accent)"/>
  <text x="490" y="345" fill="#fff" font-size="12" font-weight="600" text-anchor="middle">应用锐化</text>
</svg>