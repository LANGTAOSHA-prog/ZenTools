<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="'Inter',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b18"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="680" height="400" fill="url(#bg)" rx="14"/>
  <text x="30" y="42" fill="#f0f4ff" font-size="20" font-weight="700">💬 AI 聊天 - 完整对话</text>
  <text x="30" y="66" fill="#6b7a9f" font-size="13">多轮对话完成，AI 回答可以复制、重新生成或继续追问。</text>
  <rect x="30" y="85" width="620" height="290" fill="rgba(14,22,41,0.8)" rx="14" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="50" y="112" fill="#f0f4ff" font-size="15" font-weight="700">对话历史</text>
  <rect x="50" y="122" width="400" height="40" rx="8" fill="rgba(20,31,55,0.9)" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <text x="68" y="147" fill="#f0f4ff" font-size="12">用户：PDF 加密功能怎么使用？</text>
  <rect x="50" y="168" width="560" height="70" rx="8" fill="rgba(59,130,246,0.06)" stroke="rgba(59,130,246,0.12)" stroke-width="1"/>
  <text x="68" y="190" fill="#94a3b8" font-size="12">AI：使用 PDF 加密功能很简单：</text>
  <text x="68" y="210" fill="#94a3b8" font-size="12">1. 打开 PDF 加密工具 2. 上传你的 PDF 文件 3. 设置打开密码</text>
  <text x="68" y="228" fill="#94a3b8" font-size="12">4. 点击"加密 PDF"按钮 5. 下载加密后的文件</text>
  <rect x="50" y="248" width="420" height="40" rx="8" fill="rgba(20,31,55,0.9)" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <text x="68" y="273" fill="#f0f4ff" font-size="12">用户：密码忘记怎么办？</text>
  <rect x="50" y="294" width="560" height="40" rx="8" fill="rgba(59,130,246,0.06)" stroke="rgba(59,130,246,0.12)" stroke-width="1"/>
  <text x="68" y="316" fill="#94a3b8" font-size="12">AI：很抱歉，PDF 加密密码无法恢复。建议将密码记录在安全的地方，</text>
  <text x="68" y="334" fill="#94a3b8" font-size="12">或使用密码管理器保存。</text>
  <text x="340" y="362" fill="#4a5a7a" font-size="11" text-anchor="middle">输入框输入问题，按回车发送</text>
</svg>
