<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="'Inter',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b18"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="680" height="400" fill="url(#bg)" rx="14"/>

  <!-- Title -->
  <text x="30" y="42" fill="#f0f4ff" font-size="20" font-weight="700">🔢 PDF 排序</text>
  <text x="30" y="66" fill="#6b7a9f" font-size="13">按页名、大小或自定义拖拽顺序重新排列 PDF 页面。</text>

  <!-- Tool box -->
  <rect x="30" y="85" width="620" height="290" fill="rgba(14,22,41,0.8)" rx="14" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

  <!-- Sort mode selection bar -->
  <rect x="50" y="100" width="580" height="36" fill="rgba(255,255,255,0.03)" rx="8"/>
  <text x="65" y="123" fill="#8899bb" font-size="13" font-weight="600">排序方式</text>

  <!-- Sort mode chips -->
  <rect x="170" y="105" width="100" height="26" fill="rgba(59,130,246,0.2)" rx="6" stroke="rgba(59,130,246,0.5)" stroke-width="1"/>
  <text x="220" y="122" fill="#3b82f6" font-size="12" font-weight="600" text-anchor="middle">按页名</text>

  <rect x="280" y="105" width="100" height="26" fill="rgba(255,255,255,0.04)" rx="6"/>
  <text x="330" y="122" fill="#6b7a9f" font-size="12" text-anchor="middle">按大小</text>

  <rect x="390" y="105" width="100" height="26" fill="rgba(255,255,255,0.04)" rx="6"/>
  <text x="440" y="122" fill="#6b7a9f" font-size="12" text-anchor="middle">自定义拖拽</text>

  <!-- Page list header -->
  <rect x="50" y="148" width="580" height="28" fill="rgba(255,255,255,0.02)" rx="6"/>
  <text x="65" y="166" fill="#4a5a7a" font-size="11">序号</text>
  <text x="115" y="166" fill="#4a5a7a" font-size="11">页面名称</text>
  <text x="440" y="166" fill="#4a5a7a" font-size="11">大小</text>
  <text x="500" y="166" fill="#4a5a7a" font-size="11">操作</text>

  <!-- Page item 1 - being dragged (highlighted) -->
  <rect x="55" y="185" width="560" height="36" fill="rgba(59,130,246,0.08)" rx="8" stroke="rgba(59,130,246,0.5)" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="72" y="208" fill="#3b82f6" font-size="12" font-weight="700">1</text>
  <rect x="90" y="191" width="20" height="24" fill="rgba(59,130,246,0.3)" rx="3"/>
  <text x="100" y="207" fill="#3b82f6" font-size="8" text-anchor="middle">A</text>
  <text x="120" y="208" fill="#f0f4ff" font-size="13">报告封面.pdf</text>
  <text x="440" y="208" fill="#6b7a9f" font-size="12">124 KB</text>
  <rect x="495" y="191" width="26" height="24" fill="rgba(255,255,255,0.06)" rx="5"/>
  <text x="508" y="208" fill="#f59e0b" font-size="12" text-anchor="middle">↕</text>
  <rect x="528" y="191" width="26" height="24" fill="rgba(255,255,255,0.06)" rx="5"/>
  <text x="541" y="208" fill="#ef4444" font-size="12" text-anchor="middle">✕</text>
  <rect x="561" y="191" width="26" height="24" fill="rgba(255,255,255,0.06)" rx="5"/>
  <text x="574" y="208" fill="#6b7a9f" font-size="12" text-anchor="middle">☰</text>

  <!-- Drag handle indicator -->
  <text x="593" y="208" fill="#3b82f6" font-size="10" text-anchor="middle">⬡</text>

  <!-- Page item 2 -->
  <rect x="55" y="227" width="560" height="36" fill="rgba(255,255,255,0.04)" rx="8"/>
  <text x="72" y="250" fill="#6b7a9f" font-size="12" font-weight="600">2</text>
  <rect x="90" y="233" width="20" height="24" fill="rgba(16,185,129,0.2)" rx="3"/>
  <text x="100" y="249" fill="#10b981" font-size="8" text-anchor="middle">B</text>
  <text x="120" y="250" fill="#d1d5e0" font-size="13">正文第一章.pdf</text>
  <text x="440" y="250" fill="#6b7a9f" font-size="12">2.3 MB</text>
  <rect x="495" y="233" width="26" height="24" fill="rgba(255,255,255,0.06)" rx="5"/>
  <text x="508" y="250" fill="#f59e0b" font-size="12" text-anchor="middle">↕</text>
  <rect x="528" y="233" width="26" height="24" fill="rgba(255,255,255,0.06)" rx="5"/>
  <text x="541" y="250" fill="#ef4444" font-size="12" text-anchor="middle">✕</text>
  <rect x="561" y="233" width="26" height="24" fill="rgba(255,255,255,0.06)" rx="5"/>
  <text x="574" y="250" fill="#6b7a9f" font-size="12" text-anchor="middle">☰</text>

  <!-- Page item 3 -->
  <rect x="55" y="269" width="560" height="36" fill="rgba(255,255,255,0.02)" rx="8"/>
  <text x="72" y="292" fill="#6b7a9f" font-size="12" font-weight="600">3</text>
  <rect x="90" y="275" width="20" height="24" fill="rgba(139,92,246,0.2)" rx="3"/>
  <text x="100" y="291" fill="#8b5cf6" font-size="8" text-anchor="middle">C</text>
  <text x="120" y="292" fill="#d1d5e0" font-size="13">正文第二章.pdf</text>
  <text x="440" y="292" fill="#6b7a9f" font-size="12">1.8 MB</text>
  <rect x="495" y="275" width="26" height="24" fill="rgba(255,255,255,0.06)" rx="5"/>
  <text x="508" y="292" fill="#f59e0b" font-size="12" text-anchor="middle">↕</text>
  <rect x="528" y="275" width="26" height="24" fill="rgba(255,255,255,0.06)" rx="5"/>
  <text x="541" y="292" fill="#ef4444" font-size="12" text-anchor="middle">✕</text>
  <rect x="561" y="275" width="26" height="24" fill="rgba(255,255,255,0.06)" rx="5"/>
  <text x="574" y="292" fill="#6b7a9f" font-size="12" text-anchor="middle">☰</text>

  <!-- Page item 4 -->
  <rect x="55" y="311" width="560" height="36" fill="rgba(255,255,255,0.04)" rx="8"/>
  <text x="72" y="334" fill="#6b7a9f" font-size="12" font-weight="600">4</text>
  <rect x="90" y="317" width="20" height="24" fill="rgba(244,63,87,0.2)" rx="3"/>
  <text x="100" y="333" fill="#f43f5e" font-size="8" text-anchor="middle">D</text>
  <text x="120" y="334" fill="#d1d5e0" font-size="13">附录参考资料.pdf</text>
  <text x="440" y="334" fill="#6b7a9f" font-size="12">856 KB</text>
  <rect x="495" y="317" width="26" height="24" fill="rgba(255,255,255,0.06)" rx="5"/>
  <text x="508" y="334" fill="#f59e0b" font-size="12" text-anchor="middle">↕</text>
  <rect x="528" y="317" width="26" height="24" fill="rgba(255,255,255,0.06)" rx="5"/>
  <text x="541" y="334" fill="#ef4444" font-size="12" text-anchor="middle">✕</text>
  <rect x="561" y="317" width="26" height="24" fill="rgba(255,255,255,0.06)" rx="5"/>
  <text x="574" y="334" fill="#6b7a9f" font-size="12" text-anchor="middle">☰</text>

  <!-- Sort & apply button bar -->
  <rect x="55" y="358" width="360" height="34" fill="#0a0e1a" rx="8" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="68" y="379" fill="#4a5a7a" font-size="12">排序：自定义（拖拽调整）</text>
  <polygon points="400,373 406,367 412,373" fill="#4a5a7a"/>

  <rect x="430" y="352" width="200" height="44" fill="url(#accent)" rx="12"/>
  <text x="530" y="380" fill="#fff" font-size="14" font-weight="700" text-anchor="middle">▶ 执行排序</text>
</svg>