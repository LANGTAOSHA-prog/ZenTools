<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="'Inter',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b18"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
  </defs>
  <rect width="680" height="400" fill="url(#bg)" rx="14"/>

  <!-- Title -->
  <text x="30" y="42" fill="#f0f4ff" font-size="20" font-weight="700">📊 PDF 转 Excel</text>
  <text x="30" y="66" fill="#6b7a9f" font-size="13">将 PDF 文件中的表格数据转换为 Excel 格式，保留样式和公式。</text>

  <!-- Tool box -->
  <rect x="30" y="85" width="620" height="290" fill="rgba(14,22,41,0.8)" rx="14" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

  <!-- Left panel: Upload + Options -->
  <rect x="50" y="108" width="270" height="250" fill="rgba(20,31,55,0.5)" rx="10" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>

  <!-- Upload area -->
  <text x="65" y="132" fill="#f0f4ff" font-size="13" font-weight="700">上传 PDF 文件</text>
  <rect x="55" y="142" width="260" height="80" rx="10" fill="rgba(20,31,55,0.85)" stroke="rgba(59,130,246,0.4)" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="185" y="177" fill="#6b7a9f" font-size="26" text-anchor="middle">📄</text>
  <text x="185" y="200" fill="#8899bb" font-size="11" text-anchor="middle">点击或拖拽 PDF 到此处</text>
  <text x="185" y="214" fill="#4a5a7a" font-size="10" text-anchor="middle">支持含表格的 PDF 文件</text>

  <!-- Worksheet name -->
  <text x="65" y="240" fill="#f0f4ff" font-size="13" font-weight="700">工作表名称</text>
  <rect x="55" y="248" width="260" height="34" fill="#0a0e1a" rx="8" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="70" y="270" fill="#6b7a9f" font-size="12">Sheet1</text>

  <!-- Format options -->
  <text x="65" y="300" fill="#f0f4ff" font-size="13" font-weight="700">输出格式</text>
  <rect x="55" y="308" width="260" height="34" fill="#0a0e1a" rx="8" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <rect x="55" y="308" width="130" height="34" fill="url(#accent)" rx="8"/>
  <text x="120" y="330" fill="#fff" font-size="12" font-weight="600" text-anchor="middle">.xlsx</text>
  <text x="215" y="330" fill="#6b7a9f" font-size="12" font-weight="500" text-anchor="middle">.xls</text>

  <!-- Right panel: Excel preview -->
  <rect x="340" y="108" width="290" height="250" fill="rgba(20,31,55,0.5)" rx="10" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <rect x="340" y="108" width="290" height="24" rx="10" fill="rgba(255,255,255,0.03)"/>
  <text x="485" y="124" fill="#6b7a9f" font-size="10" text-anchor="middle">Excel 预览</text>

  <!-- Excel table header -->
  <rect x="355" y="140" width="260" height="22" fill="rgba(34,197,94,0.12)" rx="4"/>
  <text x="367" y="155" fill="#4ade80" font-size="10" font-weight="600">姓名</text>
  <text x="427" y="155" fill="#4ade80" font-size="10" font-weight="600">部门</text>
  <text x="490" y="155" fill="#4ade80" font-size="10" font-weight="600">职位</text>
  <text x="550" y="155" fill="#4ade80" font-size="10" font-weight="600">薪资</text>

  <!-- Excel rows -->
  <rect x="355" y="164" width="260" height="20" fill="rgba(255,255,255,0.015)" rx="0"/>
  <text x="367" y="178" fill="#c8d0dc" font-size="10">张三</text>
  <text x="427" y="178" fill="#c8d0dc" font-size="10">技术部</text>
  <text x="490" y="178" fill="#c8d0dc" font-size="10">高级工程师</text>
  <text x="550" y="178" fill="#c8d0dc" font-size="10">25000</text>
  <line x1="355" y1="184" x2="615" y2="184" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>

  <rect x="355" y="185" width="260" height="20" fill="rgba(255,255,255,0.01)" rx="0"/>
  <text x="367" y="199" fill="#c8d0dc" font-size="10">李四</text>
  <text x="427" y="199" fill="#c8d0dc" font-size="10">市场部</text>
  <text x="490" y="199" fill="#c8d0dc" font-size="10">运营总监</text>
  <text x="550" y="199" fill="#c8d0dc" font-size="10">30000</text>
  <line x1="355" y1="205" x2="615" y2="205" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>

  <rect x="355" y="206" width="260" height="20" fill="rgba(255,255,255,0.015)" rx="0"/>
  <text x="367" y="220" fill="#c8d0dc" font-size="10">王五</text>
  <text x="427" y="220" fill="#c8d0dc" font-size="10">人事部</text>
  <text x="490" y="220" fill="#c8d0dc" font-size="10">HR 经理</text>
  <text x="550" y="220" fill="#c8d0dc" font-size="10">20000</text>
  <line x1="355" y1="226" x2="615" y2="226" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>

  <rect x="355" y="227" width="260" height="20" fill="rgba(255,255,255,0.01)" rx="0"/>
  <text x="367" y="241" fill="#c8d0dc" font-size="10">赵六</text>
  <text x="427" y="241" fill="#c8d0dc" font-size="10">财务部</text>
  <text x="490" y="241" fill="#c8d0dc" font-size="10">会计主管</text>
  <text x="550" y="241" fill="#c8d0dc" font-size="10">22000</text>

  <!-- Excel bottom bar -->
  <rect x="355" y="250" width="260" height="22" fill="rgba(255,255,255,0.02)" rx="4" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
  <text x="367" y="264" fill="#4a5a7a" font-size="9">📊 工作表: Sheet1 · 8 行 4 列</text>
  <rect x="540" y="251" width="62" height="20" fill="rgba(34,197,94,0.1)" rx="4"/>
  <text x="571" y="265" fill="#22c55e" font-size="9" font-weight="600" text-anchor="middle">数据就绪</text>

  <!-- Download button -->
  <rect x="355" y="280" width="260" height="30" fill="url(#greenGrad)" rx="8"/>
  <text x="485" y="300" fill="#fff" font-size="13" font-weight="700" text-anchor="middle">下载 Excel 文件</text>

  <!-- File info bar bottom left -->
  <rect x="55" y="350" width="260" height="26" fill="rgba(255,255,255,0.02)" rx="6" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
  <text x="70" y="367" fill="#4a5a7a" font-size="10">报告_2025.pdf · 2.3 MB · 5 页</text>
  <rect x="230" y="351" width="72" height="24" fill="rgba(59,130,246,0.1)" rx="6"/>
  <text x="266" y="367" fill="#60a5fa" font-size="10" font-weight="600" text-anchor="middle">已上传</text>
</svg>