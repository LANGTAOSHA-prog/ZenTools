<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="'Inter',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b18"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="toolbarBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a2645"/>
      <stop offset="100%" stop-color="#131d38"/>
    </linearGradient>
    <linearGradient id="pageGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f7fa"/>
    </linearGradient>
  </defs>
  <rect width="680" height="400" fill="url(#bg)" rx="14"/>

  <!-- Title -->
  <text x="30" y="42" fill="#f0f4ff" font-size="20" font-weight="700"> PDF 编辑</text>
  <text x="30" y="66" fill="#6b7a9f" font-size="13">添加文字、绘制图形、涂鸦标注，在线编辑 PDF 文档内容。</text>

  <!-- Editor frame -->
  <rect x="30" y="85" width="620" height="290" fill="rgba(14,22,41,0.8)" rx="14" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

  <!-- Editor header bar -->
  <rect x="30" y="85" width="620" height="42" fill="rgba(20,31,55,0.6)" rx="14" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <rect x="30" y="112" width="620" height="15" fill="rgba(20,31,55,0.6)"/>

  <!-- File name -->
  <text x="60" y="111" fill="#8899bb" font-size="12">document.pdf</text>

  <!-- Right header actions -->
  <rect x="530" y="96" width="50" height="22" rx="6" fill="rgba(59,130,246,0.15)" stroke="rgba(59,130,246,0.3)" stroke-width="1"/>
  <text x="555" y="111" fill="#60a5fa" font-size="11" text-anchor="middle">保存</text>
  <rect x="588" y="96" width="50" height="22" rx="6" fill="rgba(59,130,246,0.15)" stroke="rgba(59,130,246,0.3)" stroke-width="1"/>
  <text x="613" y="111" fill="#60a5fa" font-size="11" text-anchor="middle">下载</text>

  <!-- Left toolbar -->
  <rect x="40" y="130" width="52" height="235" rx="10" fill="url(#toolbarBg)" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>

  <!-- Tool: Text (active) -->
  <rect x="48" y="140" width="36" height="36" rx="8" fill="rgba(0,229,255,0.15)" stroke="#00e5ff" stroke-width="1.2"/>
  <text x="66" y="164" fill="#00e5ff" font-size="16" text-anchor="middle">T</text>

  <!-- Tool: Brush -->
  <rect x="48" y="182" width="36" height="36" rx="8" fill="rgba(255,255,255,0.05)"/>
  <text x="66" y="208" fill="#8899bb" font-size="18" text-anchor="middle">🖊</text>

  <!-- Tool: Shape -->
  <rect x="48" y="224" width="36" height="36" rx="8" fill="rgba(255,255,255,0.05)"/>
  <rect x="56" y="232" width="20" height="20" rx="3" fill="none" stroke="#8899bb" stroke-width="1.5"/>
  <circle cx="66" cy="242" r="3" fill="#8899bb"/>

  <!-- Tool: Image -->
  <rect x="48" y="266" width="36" height="36" rx="8" fill="rgba(255,255,255,0.05)"/>
  <text x="66" y="290" fill="#8899bb" font-size="16" text-anchor="middle">🖼</text>

  <!-- Tool: Eraser -->
  <rect x="48" y="308" width="36" height="36" rx="8" fill="rgba(255,255,255,0.05)"/>
  <text x="66" y="332" fill="#8899bb" font-size="16" text-anchor="middle">🧹</text>

  <!-- Property bar -->
  <rect x="100" y="130" width="540" height="34" rx="8" fill="rgba(20,31,55,0.8)" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>

  <!-- Font selector -->
  <rect x="108" y="137" width="80" height="20" rx="4" fill="rgba(255,255,255,0.06)"/>
  <text x="117" y="151" fill="#8899bb" font-size="10">字体: 微软雅黑</text>

  <!-- Size selector -->
  <rect x="195" y="137" width="50" height="20" rx="4" fill="rgba(255,255,255,0.06)"/>
  <text x="204" y="151" fill="#8899bb" font-size="10">大小: 16</text>

  <!-- Color picker -->
  <rect x="252" y="137" width="60" height="20" rx="4" fill="rgba(255,255,255,0.06)"/>
  <circle cx="260" cy="147" r="5" fill="#00e5ff"/>
  <text x="272" y="151" fill="#8899bb" font-size="10">颜色</text>

  <!-- Bold / Italic / Underline -->
  <rect x="320" y="137" width="26" height="20" rx="4" fill="rgba(255,255,255,0.04)"/>
  <text x="333" y="151" fill="#6b7a9f" font-size="11" font-weight="700" text-anchor="middle">B</text>
  <rect x="350" y="137" width="26" height="20" rx="4" fill="rgba(255,255,255,0.04)"/>
  <text x="363" y="151" fill="#6b7a9f" font-size="11" font-style="italic" text-anchor="middle">I</text>
  <rect x="380" y="137" width="26" height="20" rx="4" fill="rgba(255,255,255,0.04)"/>
  <text x="393" y="151" fill="#6b7a9f" font-size="11" text-decoration="underline" text-anchor="middle">U</text>

  <!-- Stroke width -->
  <rect x="414" y="137" width="40" height="20" rx="4" fill="rgba(255,255,255,0.06)"/>
  <text x="418" y="151" fill="#8899bb" font-size="10">2px</text>

  <!-- Fill / Stroke toggle -->
  <rect x="462" y="137" width="56" height="20" rx="10" fill="rgba(0,229,255,0.12)" stroke="#00e5ff" stroke-width="0.8"/>
  <text x="490" y="151" fill="#00e5ff" font-size="10" text-anchor="middle">填充</text>

  <!-- PDF page area -->
  <rect x="100" y="172" width="540" height="193" rx="6" fill="rgba(240,243,248,0.06)"/>

  <!-- PDF page mockup (centered) -->
  <rect x="168" y="180" width="404" height="176" rx="4" fill="url(#pageGrad)"/>

  <!-- Page content - title simulated text -->
  <rect x="190" y="200" width="140" height="6" rx="3" fill="#d0d5dd"/>
  <rect x="190" y="214" width="360" height="4" rx="2" fill="#e4e7ec"/>
  <rect x="190" y="224" width="300" height="4" rx="2" fill="#e4e7ec"/>
  <rect x="190" y="234" width="340" height="4" rx="2" fill="#e4e7ec"/>

  <!-- Simulated paragraph 1 -->
  <rect x="190" y="254" width="360" height="4" rx="2" fill="#e4e7ec"/>
  <rect x="190" y="264" width="330" height="4" rx="2" fill="#e4e7ec"/>
  <rect x="190" y="274" width="350" height="4" rx="2" fill="#e4e7ec"/>

  <!-- Simulated paragraph 2 -->
  <rect x="190" y="290" width="280" height="4" rx="2" fill="#e4e7ec"/>
  <rect x="190" y="300" width="310" height="4" rx="2" fill="#e4e7ec"/>
  <rect x="190" y="310" width="200" height="4" rx="2" fill="#e4e7ec"/>

  <!-- Annotations on the page -->
  <!-- Highlight annotation (yellow marker) -->
  <rect x="278" y="246" width="100" height="14" rx="2" fill="rgba(255,213,0,0.35)"/>

  <!-- Freehand drawing (squiggle) -->
  <path d="M190 270 Q220 265 240 272 Q260 279 280 270 Q300 261 320 270" fill="none" stroke="#ef4444" stroke-width="2" stroke-linecap="round"/>

  <!-- Rectangle shape annotation -->
  <rect x="380" y="206" width="80" height="40" rx="3" fill="rgba(59,130,246,0.08)" stroke="#3b82f6" stroke-width="1.2" stroke-dasharray="3,2"/>

  <!-- Text annotation "备注" on the page -->
  <rect x="468" y="294" width="80" height="22" rx="4" fill="#00e5ff" opacity="0.15"/>
  <text x="508" y="309" fill="#00e5ff" font-size="11" text-anchor="middle">重要备注</text>

  <!-- Arrow annotation -->
  <line x1="468" y1="304" x2="380" y2="226" stroke="#00e5ff" stroke-width="1" stroke-dasharray="3,2" opacity="0.5"/>
  <polyline points="375,230 383,226 380,234" fill="#00e5ff" opacity="0.5"/>

  <!-- Image placeholder on page -->
  <rect x="460" y="196" width="50" height="36" rx="3" fill="rgba(59,130,246,0.08)" stroke="rgba(59,130,246,0.3)" stroke-width="1"/>
  <text x="485" y="218" fill="#3b82f6" font-size="14" text-anchor="middle">📷</text>

  <!-- Bottom toolbar -->
  <rect x="100" y="373" width="540" height="1" fill="rgba(255,255,255,0.04)"/>

  <!-- Page indicator -->
  <rect x="320" y="355" width="60" height="18" rx="9" fill="rgba(20,31,55,0.8)"/>
  <text x="350" y="367" fill="#6b7a9f" font-size="10" text-anchor="middle">第 1 页 / 5</text>
</svg>