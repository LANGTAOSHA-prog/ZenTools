<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="'Inter',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b18"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="purplePink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
  </defs>
  <rect width="680" height="400" fill="url(#bg)" rx="14"/>

  <!-- Title -->
  <text x="30" y="42" fill="#f0f4ff" font-size="20" font-weight="700">📝 Markdown 转 PDF</text>
  <text x="30" y="66" fill="#6b7a9f" font-size="13">将 Markdown 文本渲染为 PDF 文档，支持标题、列表、代码等格式。</text>

  <!-- Tool box -->
  <rect x="30" y="85" width="620" height="290" fill="rgba(14,22,41,0.8)" rx="14" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

  <!-- Left panel: Editor -->
  <rect x="45" y="105" width="280" height="210" fill="#0a0e1a" rx="10" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="60" y="128" fill="#f0f4ff" font-size="13" font-weight="600">Markdown 编辑器</text>

  <!-- Editor content with monospace feel -->
  <text x="60" y="152" fill="#a855f7" font-size="13" font-weight="700" font-family="Consolas,monospace"># 项目文档</text>
  <text x="60" y="172" fill="#6b7a9f" font-size="11" font-family="Consolas,monospace"></text>
  <text x="60" y="190" fill="#f0f4ff" font-size="12" font-family="Consolas,monospace">## 功能介绍</text>
  <text x="60" y="208" fill="#94a3b8" font-size="11" font-family="Consolas,monospace">该工具支持**Markdown**格式转换，</text>
  <text x="60" y="224" fill="#94a3b8" font-size="11" font-family="Consolas,monospace">可以快速生成 <text fill="#22c55e" font-size="11" font-family="Consolas,monospace">PDF</text> 文档。</text>
  <text x="60" y="244" fill="#6b7a9f" font-size="11" font-family="Consolas,monospace"></text>
  <text x="60" y="260" fill="#f0f4ff" font-size="12" font-family="Consolas,monospace">- 支持标题层级</text>
  <text x="60" y="276" fill="#f0f4ff" font-size="12" font-family="Consolas,monospace">- 支持列表和引用</text>
  <text x="60" y="292" fill="#f0f4ff" font-size="12" font-family="Consolas,monospace">- 支持代码高亮</text>

  <!-- Right panel: PDF Preview -->
  <rect x="345" y="105" width="290" height="210" fill="#0f1a2e" rx="10" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <rect x="345" y="105" width="290" height="26" fill="rgba(255,255,255,0.03)" rx="10"/>
  <rect x="345" y="117" width="290" height="14" fill="rgba(255,255,255,0.03)"/>
  <circle cx="358" cy="118" r="4" fill="#ef4444"/>
  <circle cx="370" cy="118" r="4" fill="#eab308"/>
  <circle cx="382" cy="118" r="4" fill="#22c55e"/>
  <text x="430" y="122" fill="#4a5a7a" font-size="10" text-anchor="middle">PDF 预览</text>

  <!-- PDF rendered content -->
  <text x="362" y="148" fill="#a855f7" font-size="15" font-weight="700">项目文档</text>
  <text x="362" y="172" fill="#f0f4ff" font-size="13" font-weight="700">功能介绍</text>
  <text x="362" y="192" fill="#94a3b8" font-size="11">该工具支持 Markdown 格式转换，</text>
  <text x="362" y="208" fill="#94a3b8" font-size="11">可以快速生成 PDF 文档。</text>
  <line x1="362" y1="219" x2="620" y2="219" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <circle cx="368" cy="234" r="2.5" fill="#f0f4ff"/>
  <text x="376" y="238" fill="#f0f4ff" font-size="11">支持标题层级</text>
  <circle cx="368" cy="252" r="2.5" fill="#f0f4ff"/>
  <text x="376" y="256" fill="#f0f4ff" font-size="11">支持列表和引用</text>
  <circle cx="368" cy="270" r="2.5" fill="#f0f4ff"/>
  <text x="376" y="274" fill="#f0f4ff" font-size="11">支持代码高亮</text>

  <!-- Page number mock -->
  <text x="490" y="302" fill="#4a5a7a" font-size="10" text-anchor="middle">— 1 / 1 —</text>

  <!-- Generate button -->
  <rect x="45" y="327" width="590" height="36" fill="url(#purplePink)" rx="999"/>
  <text x="340" y="349" fill="#fff" font-size="14" font-weight="700" text-anchor="middle">⚡ 生成 PDF</text>
</svg>