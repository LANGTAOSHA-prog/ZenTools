<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" font-family="'Inter',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b18"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="680" height="420" fill="url(#bg)" rx="14"/>
  <text x="30" y="42" fill="#f0f4ff" font-size="20" font-weight="700">👁️ PDF OCR 文字识别</text>
  <text x="30" y="66" fill="#6b7a9f" font-size="13">从扫描件和图片型 PDF 中提取文字，支持中英文识别。</text>
  <rect x="30" y="85" width="620" height="310" fill="rgba(14,22,41,0.8)" rx="14" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

  <!-- Success icon -->
  <circle cx="340" cy="122" r="20" fill="rgba(16,185,129,0.15)" stroke="rgba(16,185,129,0.3)" stroke-width="2"/>
  <text x="340" y="129" fill="#10b981" font-size="22" text-anchor="middle">✓</text>
  <text x="340" y="160" fill="#f0f4ff" font-size="15" font-weight="700" text-anchor="middle">✅ 文字识别完成</text>
  <text x="340" y="180" fill="#6b7a9f" font-size="12" text-anchor="middle">共识别 3 页 · 提取文字 2,580 字 · 准确率约 96%</text>

  <!-- Side by side: original vs result -->
  <rect x="50" y="195" width="270" height="130" fill="#0a0e1a" rx="8" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <rect x="50" y="195" width="270" height="24" rx="8" fill="rgba(255,255,255,0.02)"/>
  <text x="185" y="212" fill="#6b7a9f" font-size="10" text-anchor="middle">📄 原始扫描件</text>
  <text x="65" y="242" fill="#4a5a7a" font-size="10">本合同由甲乙双方在平等</text>
  <text x="65" y="258" fill="#4a5a7a" font-size="10">自愿的基础上，经协商一致</text>
  <text x="65" y="274" fill="#4a5a7a" font-size="10">共同签订。合同有效期自</text>
  <text x="65" y="290" fill="#4a5a7a" font-size="10">2026年1月1日起至2026年</text>
  <text x="65" y="306" fill="#4a5a7a" font-size="10">12月31日止……</text>

  <rect x="340" y="195" width="290" height="130" fill="#0a0e1a" rx="8" stroke="#10b981" stroke-width="1"/>
  <rect x="340" y="195" width="290" height="24" rx="8" fill="rgba(16,185,129,0.08)"/>
  <text x="485" y="212" fill="#10b981" font-size="10" text-anchor="middle">📝 识别结果（可编辑文本）</text>
  <text x="355" y="242" fill="#22c55e" font-size="10">本合同由甲乙双方在平等</text>
  <text x="355" y="258" fill="#22c55e" font-size="10">自愿的基础上，经协商一致</text>
  <text x="355" y="274" fill="#22c55e" font-size="10">共同签订。合同有效期自</text>
  <text x="355" y="290" fill="#22c55e" font-size="10">2026年1月1日起至2026年</text>
  <text x="355" y="306" fill="#22c55e" font-size="10">12月31日止……</text>

  <!-- Action buttons -->
  <rect x="140" y="340" width="140" height="36" fill="rgba(20,31,55,0.9)" rx="8" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="210" y="363" fill="#94a3b8" font-size="13" font-weight="600" text-anchor="middle">📋 复制文字</text>

  <rect x="300" y="340" width="140" height="36" fill="rgba(20,31,55,0.9)" rx="8" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="370" y="363" fill="#94a3b8" font-size="13" font-weight="600" text-anchor="middle">📥 下载文本</text>

  <rect x="460" y="340" width="100" height="36" fill="url(#accent)" rx="8"/>
  <text x="510" y="363" fill="#fff" font-size="13" font-weight="600" text-anchor="middle">重新识别</text>
</svg>
