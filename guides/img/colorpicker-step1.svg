<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" font-family="'Inter',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/><stop offset="100%" stop-color="#070b18"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/><stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="680" height="380" fill="url(#bg)" rx="14"/>
  <text x="30" y="42" fill="#f0f4ff" font-size="20" font-weight="700">🎨 取色器</text>
  <text x="30" y="66" fill="#6b7a9f" font-size="13">从图片中取色，获取精确的颜色值。</text>
  <rect x="30" y="85" width="620" height="275" fill="rgba(14,22,41,0.8)" rx="14" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="50" y="118" fill="#f0f4ff" font-size="15" font-weight="700">取色器</text>
  <rect x="50" y="135" width="580" height="200" rx="12" fill="rgba(20,31,55,0.85)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="340" y="160" fill="#f0f4ff" font-size="13" font-weight="600" text-anchor="middle">取色器</text>
  <line x1="65" y1="172" x2="615" y2="172" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <!-- Color palette -->
  <text x="65" y="195" fill="#6b7a9f" font-size="11">当前取色</text>
  <rect x="140" y="180" width="80" height="30" rx="8" fill="#3b82f6"/>
  <text x="250" y="195" fill="#f0f4ff" font-size="12" font-family="monospace">#3B82F6</text>
  <text x="370" y="195" fill="#f0f4ff" font-size="12" font-family="monospace">rgb(59,130,246)</text>
  <text x="65" y="225" fill="#6b7a9f" font-size="11">色相</text>
  <rect x="140" y="218" width="460" height="16" rx="6" fill="url(#accent)"/>
  <circle cx="240" cy="226" r="8" fill="none" stroke="#fff" stroke-width="2"/>
  <!-- Color history -->
  <text x="65" y="255" fill="#6b7a9f" font-size="11">取色历史</text>
  <rect x="140" y="243" width="28" height="28" rx="6" fill="#ef4444"/>
  <rect x="175" y="243" width="28" height="28" rx="6" fill="#10b981"/>
  <rect x="210" y="243" width="28" height="28" rx="6" fill="#8b5cf6"/>
  <rect x="245" y="243" width="28" height="28" rx="6" fill="#f59e0b"/>
  <rect x="280" y="243" width="28" height="28" rx="6" fill="#ec4899"/>
  <rect x="315" y="243" width="28" height="28" rx="6" fill="#06b6d4"/>
  <text x="65" y="290" fill="#6b7a9f" font-size="11">预设色板</text>
  <rect x="140" y="278" width="36" height="20" rx="4" fill="#1e293b"/>
  <rect x="182" y="278" width="36" height="20" rx="4" fill="#374151"/>
  <rect x="224" y="278" width="36" height="20" rx="4" fill="#e5e7eb"/>
  <rect x="266" y="278" width="36" height="20" rx="4" fill="#f59e0b"/>
  <rect x="308" y="278" width="36" height="20" rx="4" fill="#10b981"/>
  <rect x="140" y="303" width="36" height="20" rx="4" fill="#3b82f6"/>
  <rect x="182" y="303" width="36" height="20" rx="4" fill="#8b5cf6"/>
  <rect x="224" y="303" width="36" height="20" rx="4" fill="#ef4444"/>
  <rect x="266" y="303" width="36" height="20" rx="4" fill="#ec4899"/>
  <rect x="308" y="303" width="36" height="20" rx="4" fill="#06b6d4"/>
  <rect x="520" y="275" width="100" height="34" rx="8" fill="url(#accent)"/>
  <text x="570" y="297" fill="#fff" font-size="11" font-weight="600" text-anchor="middle">复制颜色</text>
</svg>