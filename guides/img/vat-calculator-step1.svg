<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="'Inter',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
<defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0f172a"/><stop offset="100%" stop-color="#070b18"/></linearGradient><linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#3b82f6"/><stop offset="100%" stop-color="#8b5cf6"/></linearGradient></defs>
<rect width="680" height="400" fill="url(#bg)" rx="14"/>
<text x="30" y="42" fill="#f0f4ff" font-size="20" font-weight="700">🧾 增值税计算器</text><text x="30" y="66" fill="#6b7a9f" font-size="13">含税价与不含税价转换，快速计算增值税税额。</text>
<rect x="30" y="85" width="620" height="290" fill="rgba(14,22,41,0.8)" rx="14" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
<rect x="50" y="100" width="140" height="36" fill="url(#accent)" rx="8"/><text x="120" y="123" fill="#fff" font-size="13" font-weight="600" text-anchor="middle">增值税计算</text>
<rect x="200" y="100" width="120" height="36" fill="rgba(255,255,255,0.06)" rx="8"/><text x="260" y="123" fill="#6b7a9f" font-size="13" text-anchor="middle">税率查询</text>
<text x="50" y="158" fill="#f0f4ff" font-size="14" font-weight="700">含税金额: 113,000 元</text>
<text x="50" y="183" fill="#f0f4ff" font-size="14" font-weight="700">税率: 13%</text>
<text x="50" y="208" fill="#f0f4ff" font-size="14" font-weight="700">计算方向: 含税转不含税</text>
<rect x="50" y="228" width="580" height="110" fill="#0f1a35" rx="10" stroke="rgba(0,229,255,0.15)" stroke-width="1"/>
<text x="70" y="253" fill="#6b7a9f" font-size="13">不含税金额: <tspan fill="#00e5ff" font-weight="700">100,000</tspan> 元</text>
<text x="70" y="280" fill="#6b7a9f" font-size="13">增值税额: <tspan fill="#fbbf24" font-weight="700">13,000</tspan> 元</text>
<text x="70" y="307" fill="#6b7a9f" font-size="13">换算公式: 不含税价 = 含税价 / (1 + 税率)</text>
<text x="70" y="332" fill="#6b7a9f" font-size="11">适用税率: 13% 标准税率 | 9% 低税率 | 6% 服务业</text>
</svg>
