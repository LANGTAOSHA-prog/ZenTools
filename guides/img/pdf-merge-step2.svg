<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" font-family="'Inter',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b18"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="680" height="420" fill="url(#bg)" rx="14"/>

  <!-- Title -->
  <text x="30" y="42" fill="#f0f4ff" font-size="20" font-weight="700">📄 PDF 合并</text>
  <text x="30" y="66" fill="#6b7a9f" font-size="13">将多个 PDF 文件合并成一个，整理资料、合同、学习笔记，一步到位。</text>

  <!-- Tool box -->
  <rect x="30" y="85" width="620" height="310" fill="rgba(14,22,41,0.8)" rx="14" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

  <text x="50" y="118" fill="#f0f4ff" font-size="15" font-weight="700">选择 PDF 文件</text>
  <text x="50" y="138" fill="#4a5a7a" font-size="12">已选择 3 个 PDF 文件，点击「开始合并」</text>

  <!-- File list -->
  <!-- File 1 -->
  <rect x="50" y="152" width="580" height="40" fill="rgba(255,255,255,0.03)" rx="8" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <text x="70" y="178" fill="#f87171" font-size="18">📄</text>
  <text x="96" y="178" fill="#f0f4ff" font-size="13">项目报告_2026_v3.pdf</text>
  <text x="540" y="178" fill="#6b7a9f" font-size="11" text-anchor="end">2.4 MB</text>
  <text x="570" y="178" fill="#4a5a7a" font-size="14" text-anchor="end">✕</text>

  <!-- File 2 -->
  <rect x="50" y="198" width="580" height="40" fill="rgba(255,255,255,0.03)" rx="8" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <text x="70" y="224" fill="#f87171" font-size="18">📄</text>
  <text x="96" y="224" fill="#f0f4ff" font-size="13">附录_A_数据表格.pdf</text>
  <text x="540" y="224" fill="#6b7a9f" font-size="11" text-anchor="end">856 KB</text>
  <text x="570" y="224" fill="#4a5a7a" font-size="14" text-anchor="end">✕</text>

  <!-- File 3 -->
  <rect x="50" y="244" width="580" height="40" fill="rgba(255,255,255,0.03)" rx="8" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <text x="70" y="270" fill="#f87171" font-size="18">📄</text>
  <text x="96" y="270" fill="#f0f4ff" font-size="13">会议纪要_2026Q2.pdf</text>
  <text x="540" y="270" fill="#6b7a9f" font-size="11" text-anchor="end">1.2 MB</text>
  <text x="570" y="270" fill="#4a5a7a" font-size="14" text-anchor="end">✕</text>

  <!-- Drag hint area -->
  <rect x="50" y="290" width="580" height="26" fill="none"/>
  <text x="340" y="308" fill="#4a5a7a" font-size="11" text-anchor="middle">↕ 拖拽调整文件顺序 · 点击 ✕ 移除文件</text>

  <!-- Merge button (active) -->
  <rect x="50" y="325" width="240" height="40" fill="url(#accent)" rx="999"/>
  <text x="170" y="350" fill="#fff" font-size="14" font-weight="700" text-anchor="middle">开始合并</text>

  <!-- Add more files button -->
  <rect x="310" y="325" width="160" height="40" fill="rgba(20,31,55,0.9)" rx="999" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="390" y="350" fill="#94a3b8" font-size="13" font-weight="600" text-anchor="middle">+ 添加更多</text>
</svg>
