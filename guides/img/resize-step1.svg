<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="'Inter',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b18"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="680" height="400" fill="url(#bg)" rx="14"/>
  <text x="30" y="42" fill="#f0f4ff" font-size="20" font-weight="700">📐 图片缩放</text>
  <text x="30" y="66" fill="#6b7a9f" font-size="13">按比例或自定义像素尺寸缩放图片，支持锁定宽高比、指定宽高、百分比缩放。</text>
  <rect x="30" y="85" width="620" height="290" fill="rgba(14,22,41,0.8)" rx="14" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="50" y="118" fill="#f0f4ff" font-size="15" font-weight="700">上传图片</text>
  <rect x="50" y="132" width="580" height="100" rx="12" fill="rgba(20,31,55,0.85)" stroke="rgba(59,130,246,0.4)" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="340" y="172" fill="#6b7a9f" font-size="32" text-anchor="middle">🖼️</text>
  <text x="340" y="200" fill="#8899bb" font-size="13" text-anchor="middle">点击上传或拖拽图片到此处</text>
  <text x="340" y="220" fill="#4a5a7a" font-size="11" text-anchor="middle">支持 JPG、PNG、WebP、BMP 等格式</text>
  <text x="50" y="260" fill="#6b7a9f" font-size="12">宽度 (px)</text>
  <rect x="50" y="270" width="140" height="34" rx="8" fill="#0a0e1a" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="120" y="291" fill="#f0f4ff" font-size="13" text-anchor="middle">1920</text>
  <text x="210" y="272" fill="#4a5a7a" font-size="16">✕</text>
  <text x="230" y="260" fill="#6b7a9f" font-size="12">高度 (px)</text>
  <rect x="230" y="270" width="140" height="34" rx="8" fill="#0a0e1a" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="300" y="291" fill="#f0f4ff" font-size="13" text-anchor="middle">1080</text>
  <rect x="390" y="270" width="100" height="34" rx="8" fill="rgba(59,130,246,0.15)" stroke="rgba(59,130,246,0.4)" stroke-width="1"/>
  <text x="440" y="291" fill="#3b82f6" font-size="12" text-anchor="middle" font-weight="600">🔗 锁定</text>
  <rect x="50" y="320" width="580" height="34" rx="8" fill="url(#accent)"/>
  <text x="340" y="341" fill="#fff" font-size="13" font-weight="600" text-anchor="middle">应用缩放</text>
</svg>
