<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="'Inter',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b18"/>
    </linearGradient>
    <linearGradient id="greenAccent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
  </defs>
  <rect width="680" height="400" fill="url(#bg)" rx="14"/>

  <!-- Title -->
  <text x="30" y="42" fill="#f0f4ff" font-size="20" font-weight="700">🔢 PDF 移除页码</text>
  <text x="30" y="66" fill="#6b7a9f" font-size="13">页码已成功移除，预览确认效果后即可下载。</text>

  <!-- Tool box -->
  <rect x="30" y="85" width="620" height="290" fill="rgba(14,22,41,0.8)" rx="14" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

  <text x="50" y="118" fill="#f0f4ff" font-size="15" font-weight="700">已处理：产品手册_2026_v3.pdf</text>
  <text x="610" y="118" fill="#22c55e" font-size="11" text-anchor="end">已完成</text>

  <!-- PDF Preview area - cleaned, no page numbers -->
  <rect x="50" y="132" width="210" height="160" fill="#0e1629" rx="8" stroke="rgba(34,197,94,0.3)" stroke-width="1.5"/>
  <rect x="60" y="142" width="190" height="140" fill="#1a2340" rx="4"/>
  <line x1="75" y1="160" x2="235" y2="160" stroke="#2a3a5a" stroke-width="2.5"/>
  <line x1="75" y1="172" x2="225" y2="172" stroke="#2a3a5a" stroke-width="2.5"/>
  <line x1="75" y1="184" x2="230" y2="184" stroke="#2a3a5a" stroke-width="2.5"/>
  <rect x="75" y="196" width="160" height="30" fill="#152030" rx="3"/>
  <line x1="85" y1="208" x2="130" y2="208" stroke="#2a3a5a" stroke-width="2"/>
  <line x1="145" y1="208" x2="200" y2="208" stroke="#2a3a5a" stroke-width="2"/>
  <line x1="75" y1="236" x2="220" y2="236" stroke="#2a3a5a" stroke-width="2.5"/>
  <line x1="75" y1="248" x2="215" y2="248" stroke="#2a3a5a" stroke-width="2.5"/>
  <line x1="75" y1="260" x2="225" y2="260" stroke="#2a3a5a" stroke-width="2.5"/>
  <!-- No page number at bottom - crossed out to show removal -->
  <!-- Animated-style removal indicator -->
  <text x="155" y="278" fill="#4a5a7a" font-size="11" text-anchor="middle" text-decoration="line-through">— 12 —</text>
  <text x="155" y="278" fill="#22c55e" font-size="12" text-anchor="middle">✓</text>

  <!-- Page 2 mini -->
  <rect x="272" y="132" width="80" height="100" fill="#0e1629" rx="6" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <rect x="278" y="138" width="68" height="88" fill="#1a2340" rx="3"/>
  <line x1="286" y1="152" x2="338" y2="152" stroke="#2a3a5a" stroke-width="2"/>
  <line x1="286" y1="162" x2="332" y2="162" stroke="#2a3a5a" stroke-width="2"/>
  <line x1="286" y1="172" x2="336" y2="172" stroke="#2a3a5a" stroke-width="2"/>
  <line x1="286" y1="182" x2="326" y2="182" stroke="#2a3a5a" stroke-width="2"/>
  <text x="312" y="224" fill="#4a5a7a" font-size="9" text-anchor="middle" text-decoration="line-through">— 13 —</text>
  <text x="312" y="224" fill="#22c55e" font-size="10" text-anchor="middle">✓</text>

  <!-- Page 3 mini -->
  <rect x="358" y="132" width="80" height="100" fill="#0e1629" rx="6" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <rect x="364" y="138" width="68" height="88" fill="#1a2340" rx="3"/>
  <line x1="372" y1="152" x2="424" y2="152" stroke="#2a3a5a" stroke-width="2"/>
  <line x1="372" y1="162" x2="418" y2="162" stroke="#2a3a5a" stroke-width="2"/>
  <line x1="372" y1="172" x2="422" y2="172" stroke="#2a3a5a" stroke-width="2"/>
  <line x1="372" y1="182" x2="412" y2="182" stroke="#2a3a5a" stroke-width="2"/>
  <text x="398" y="224" fill="#4a5a7a" font-size="9" text-anchor="middle" text-decoration="line-through">— 14 —</text>
  <text x="398" y="224" fill="#22c55e" font-size="10" text-anchor="middle">✓</text>

  <!-- Page navigation -->
  <rect x="444" y="132" width="80" height="100" fill="#0e1629" rx="6" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="484" y="172" fill="#4a5a7a" font-size="16" text-anchor="middle">...</text>
  <text x="484" y="188" fill="#4a5a7a" font-size="9" text-anchor="middle">+21 页</text>

  <!-- Navigation arrows -->
  <rect x="530" y="170" width="28" height="28" rx="6" fill="#0e1629" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <polygon points="541,184 549,178 549,190" fill="#4a5a7a"/>
  <rect x="564" y="170" width="28" height="28" rx="6" fill="#0e1629" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <polygon points="575,178 583,184 575,190" fill="#6b7a9f"/>
  <text x="556" y="212" fill="#6b7a9f" font-size="10" text-anchor="middle">1/24</text>

  <!-- Status bar -->
  <rect x="50" y="304" width="580" height="1" fill="rgba(255,255,255,0.06)"/>

  <!-- Success message -->
  <rect x="60" y="318" width="560" height="36" rx="8" fill="rgba(34,197,94,0.08)" stroke="rgba(34,197,94,0.2)" stroke-width="1"/>
  <text x="80" y="341" fill="#22c55e" font-size="12" font-weight="600">✓ 已从全部 24 页中移除页码</text>

  <!-- Download button -->
  <rect x="460" y="315" width="170" height="34" rx="999" fill="url(#greenAccent)"/>
  <text x="545" y="337" fill="#fff" font-size="13" font-weight="700" text-anchor="middle">下载文件</text>
</svg>