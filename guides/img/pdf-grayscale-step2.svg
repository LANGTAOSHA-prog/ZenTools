<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="'Inter',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b18"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="success" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
  </defs>
  <rect width="680" height="400" fill="url(#bg)" rx="14"/>

  <text x="30" y="42" fill="#f0f4ff" font-size="20" font-weight="700">⚫ PDF 灰度</text>

  <rect x="30" y="85" width="620" height="290" fill="rgba(14,22,41,0.8)" rx="14" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

  <!-- Success indicator -->
  <rect x="50" y="100" width="580" height="50" rx="10" fill="rgba(34,197,94,0.1)" stroke="rgba(34,197,94,0.3)" stroke-width="1"/>
  <text x="70" y="130" fill="#22c55e" font-size="14" font-weight="600">✓ 转换完成！3 个页面已转换为灰度</text>

  <!-- Result preview -->
  <text x="50" y="175" fill="#f0f4ff" font-size="14" font-weight="600">转换结果</text>

  <!-- File info -->
  <rect x="50" y="190" width="580" height="70" rx="10" fill="rgba(10,14,26,0.6)" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  <text x="70" y="216" fill="#f0f4ff" font-size="13" font-weight="600">document.pdf</text>
  <text x="70" y="238" fill="#6b7a9f" font-size="12">原始大小：2.4 MB → 灰度后：1.1 MB（缩减 54%）</text>
  <text x="520" y="238" fill="#22c55e" font-size="12" font-weight="600">✓ 已完成</text>

  <!-- File list: 3 pages shown as grayscale -->
  <rect x="50" y="275" width="180" height="40" rx="6" fill="rgba(30,41,59,0.6)" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <text x="140" y="290" fill="#8899bb" font-size="11" text-anchor="middle">📄 第 1 页</text>
  <text x="140" y="305" fill="#5a6a8a" font-size="10" text-anchor="middle">220 KB · 灰度</text>

  <rect x="250" y="275" width="180" height="40" rx="6" fill="rgba(30,41,59,0.6)" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <text x="340" y="290" fill="#8899bb" font-size="11" text-anchor="middle">📄 第 2 页</text>
  <text x="340" y="305" fill="#5a6a8a" font-size="10" text-anchor="middle">380 KB · 灰度</text>

  <rect x="450" y="275" width="180" height="40" rx="6" fill="rgba(30,41,59,0.6)" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <text x="540" y="290" fill="#8899bb" font-size="11" text-anchor="middle">📄 第 3 页</text>
  <text x="540" y="305" fill="#5a6a8a" font-size="10" text-anchor="middle">500 KB · 灰度</text>

  <!-- Download button -->
  <rect x="140" y="330" width="400" height="38" fill="url(#accent)" rx="999"/>
  <text x="340" y="354" fill="#fff" font-size="14" font-weight="700" text-anchor="middle">⬇ 下载灰度 PDF</text>
</svg>