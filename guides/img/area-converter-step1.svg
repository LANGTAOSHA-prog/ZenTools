<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="'Inter',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0f172a"/><stop offset="100%" stop-color="#070b18"/></linearGradient><linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#3b82f6"/><stop offset="100%" stop-color="#8b5cf6"/></linearGradient></defs>
  <rect width="680" height="400" fill="url(#bg)" rx="14"/>
  <text x="30" y="42" fill="#f0f4ff" font-size="20" font-weight="700">🔲 面积转换</text>
  <text x="30" y="66" fill="#6b7a9f" font-size="13">在线面积单位转换，支持平方米、公顷、亩、平方英尺等多种单位。</text>
  <rect x="30" y="85" width="620" height="290" fill="rgba(14,22,41,0.8)" rx="14" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="50" y="120" fill="#f0f4ff" font-size="15" font-weight="700">输入数值</text>
  <rect x="50" y="132" width="580" height="40" fill="#0a0e1a" rx="8" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="65" y="157" fill="#f0f4ff" font-size="18" font-weight="600">1</text>
  <text x="50" y="198" fill="#f0f4ff" font-size="15" font-weight="700">选择单位</text>
  <rect x="50" y="210" width="270" height="42" fill="#0a0e1a" rx="8" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="65" y="235" fill="#8899bb" font-size="14">亩 ▼</text>
  <text x="60" y="265" fill="#6b7a9f" font-size="13">从</text><text x="310" y="265" fill="#6b7a9f" font-size="13">到</text>
  <rect x="310" y="210" width="270" height="42" fill="#0a0e1a" rx="8" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="325" y="235" fill="#8899bb" font-size="14">平方米 (m²) ▼</text>
  <rect x="50" y="285" width="580" height="60" fill="#0f1a35" rx="10" stroke="rgba(0,229,255,0.15)" stroke-width="1"/>
  <text x="340" y="315" fill="#00e5ff" font-size="20" font-weight="800" text-anchor="middle">1 亩 = 666.666667 平方米</text>
  <text x="340" y="335" fill="#6b7a9f" font-size="11" text-anchor="middle">支持平方米、平方公里、公顷、亩、平方英尺、英亩等</text>
</svg>
