<svg width="680" height="400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#070b18;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="680" height="400" fill="url(#bgGrad)"/>
  
  <!-- Header -->
  <text x="340" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#ffffff">Descript</text>
  <text x="340" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#94a3b8">AI Audio & Video Editor</text>
  
  <!-- Interface Mockup -->
  <rect x="50" y="100" width="580" height="240" rx="12" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  
  <!-- Timeline Area -->
  <rect x="80" y="120" width="520" height="80" rx="6" fill="#0f172a" stroke="#475569"/>
  <line x1="100" y1="140" x2="560" y2="140" stroke="#334155" stroke-width="1"/>
  <rect x="120" y="130" width="80" height="20" fill="#ec4899" opacity="0.7"/>
  <rect x="210" y="130" width="100" height="20" fill="#8b5cf6" opacity="0.7"/>
  <rect x="320" y="130" width="120" height="20" fill="#10b981" opacity="0.7"/>
  <rect x="450" y="130" width="90" height="20" fill="#f59e0b" opacity="0.7"/>
  <text x="100" y="158" font-family="Arial, sans-serif" font-size="9" fill="#94a3b8">0:00</text>
  <text x="320" y="158" font-family="Arial, sans-serif" font-size="9" fill="#94a3b8">0:15</text>
  <text x="540" y="158" font-family="Arial, sans-serif" font-size="9" fill="#94a3b8">0:30</text>
  
  <!-- Transcript Panel -->
  <rect x="80" y="215" width="520" height="115" rx="6" fill="#1e293b" stroke="#475569"/>
  <text x="95" y="235" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#22d3ee">Transcript</text>
  
  <!-- Transcript Lines -->
  <text x="95" y="255" font-family="monospace" font-size="10" fill="#cbd5e1">[0:02] Welcome to our video tutorial.</text>
  <text x="95" y="272" font-family="monospace" font-size="10" fill="#cbd5e1">[0:08] Today we'll learn about editing.</text>
  <text x="95" y="289" font-family="monospace" font-size="10" fill="#cbd5e1">[0:15] This is a filler word example uh.</text>
  <text x="95" y="306" font-family="monospace" font-size="10" fill="#cbd5e1">[0:22] Let's remove those unnecessary parts.</text>
  
  <!-- AI Remove Badge -->
  <rect x="420" y="270" width="80" height="18" rx="4" fill="#ef4444"/>
  <text x="460" y="282" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#ffffff">Auto-remove</text>
  
  <!-- Play Controls -->
  <rect x="80" y="340" width="520" height="35" rx="6" fill="#0f172a" stroke="#334155"/>
  <circle cx="100" cy="357" r="12" fill="#22d3ee"/>
  <polygon points="104,353 104,361 112,357" fill="#ffffff"/>
  <text x="130" y="360" font-family="Arial, sans-serif" font-size="10" fill="#cbd5e1">0:00 / 0:35</text>
  
  <!-- Export Button -->
  <rect x="420" y="342" width="120" height="30" rx="6" fill="#10b981"/>
  <text x="480" y="362" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#ffffff">Export Video</text>
</svg>
