<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 440" font-family="'Inter',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b18"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="purplePink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
  </defs>
  <rect width="680" height="440" fill="url(#bg)" rx="14"/>

  <!-- Title -->
  <text x="30" y="42" fill="#f0f4ff" font-size="20" font-weight="700">📊 Excel 转 PDF</text>
  <text x="30" y="66" fill="#6b7a9f" font-size="13">将 Excel 表格转换为 PDF 格式，自定义编辑表格数据，一键导出。</text>

  <!-- Tool box -->
  <rect x="30" y="85" width="620" height="330" fill="rgba(14,22,41,0.8)" rx="14" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

  <!-- Section header -->
  <text x="50" y="118" fill="#f0f4ff" font-size="15" font-weight="700">编辑表格数据</text>
  <text x="50" y="138" fill="#6b7a9f" font-size="12">双击单元格编辑内容，点击生成 PDF 导出。</text>

  <!-- Action buttons row -->
  <rect x="50" y="152" width="110" height="32" fill="rgba(59,130,246,0.2)" rx="8" stroke="rgba(59,130,246,0.4)" stroke-width="1"/>
  <text x="105" y="173" fill="#60a5fa" font-size="13" font-weight="600" text-anchor="middle">+ 添加行</text>

  <rect x="170" y="152" width="110" height="32" fill="rgba(59,130,246,0.2)" rx="8" stroke="rgba(59,130,246,0.4)" stroke-width="1"/>
  <text x="225" y="173" fill="#60a5fa" font-size="13" font-weight="600" text-anchor="middle">+ 添加列</text>

  <rect x="290" y="152" width="130" height="32" fill="url(#purplePink)" rx="8"/>
  <text x="355" y="173" fill="#fff" font-size="13" font-weight="700" text-anchor="middle">生成 PDF</text>

  <!-- Table header row -->
  <rect x="50" y="196" width="580" height="32" fill="rgba(59,130,246,0.08)" rx="6" stroke="rgba(59,130,246,0.15)" stroke-width="1"/>
  <text x="78" y="216" fill="#60a5fa" font-size="12" font-weight="700">名称</text>
  <line x1="240" y1="196" x2="240" y2="228" stroke="rgba(59,130,246,0.15)" stroke-width="1"/>
  <text x="270" y="216" fill="#60a5fa" font-size="12" font-weight="700">数量</text>
  <line x1="430" y1="196" x2="430" y2="228" stroke="rgba(59,130,246,0.15)" stroke-width="1"/>
  <text x="460" y="216" fill="#60a5fa" font-size="12" font-weight="700">单价</text>

  <!-- Table row 1 -->
  <rect x="50" y="230" width="580" height="34" fill="rgba(255,255,255,0.02)" rx="0" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <text x="78" y="251" fill="#f0f4ff" font-size="12">商品A</text>
  <line x1="240" y1="230" x2="240" y2="264" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <text x="270" y="251" fill="#f0f4ff" font-size="12">10</text>
  <line x1="430" y1="230" x2="430" y2="264" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <text x="460" y="251" fill="#f0f4ff" font-size="12">¥99.00</text>

  <!-- Table row 2 -->
  <rect x="50" y="266" width="580" height="34" fill="rgba(255,255,255,0.02)" rx="0" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <text x="78" y="287" fill="#f0f4ff" font-size="12">商品B</text>
  <line x1="240" y1="266" x2="240" y2="300" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <text x="270" y="287" fill="#f0f4ff" font-size="12">5</text>
  <line x1="430" y1="266" x2="430" y2="300" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <text x="460" y="287" fill="#f0f4ff" font-size="12">¥199.00</text>

  <!-- Table row 3 -->
  <rect x="50" y="302" width="580" height="34" fill="rgba(255,255,255,0.02)" rx="0" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <text x="78" y="323" fill="#f0f4ff" font-size="12">商品C</text>
  <line x1="240" y1="302" x2="240" y2="336" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <text x="270" y="323" fill="#f0f4ff" font-size="12">20</text>
  <line x1="430" y1="302" x2="430" y2="336" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <text x="460" y="323" fill="#f0f4ff" font-size="12">¥49.50</text>

  <!-- Bottom bar with info -->
  <rect x="50" y="340" width="580" height="30" fill="rgba(255,255,255,0.02)" rx="6" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
  <text x="65" y="359" fill="#4a5a7a" font-size="11">3 行 3 列 · 双击编辑单元格</text>
  <rect x="460" y="342" width="70" height="26" fill="rgba(16,185,129,0.12)" rx="6"/>
  <text x="495" y="359" fill="#10b981" font-size="11" font-weight="600" text-anchor="middle">数据就绪</text>

  <!-- Generate button active -->
  <rect x="170" y="380" width="340" height="36" fill="url(#purplePink)" rx="999"/>
  <text x="340" y="403" fill="#fff" font-size="14" font-weight="700" text-anchor="middle">📄 生成 PDF</text>
</svg>
