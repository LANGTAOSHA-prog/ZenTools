<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="'Inter',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b18"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="680" height="400" fill="url(#bg)" rx="14"/>

  <text x="30" y="42" fill="#f0f4ff" font-size="20" font-weight="700">📄 PDF 转 TXT</text>
  <text x="30" y="66" fill="#6b7a9f" font-size="13">从 PDF 中提取纯文本内容，保存为 TXT 文件。</text>

  <rect x="30" y="85" width="620" height="290" fill="rgba(14,22,41,0.8)" rx="14" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

  <text x="50" y="118" fill="#f0f4ff" font-size="15" font-weight="700">选择 PDF 文件</text>
  <text x="50" y="138" fill="#6b7a9f" font-size="12">选择一个 PDF 文件，自动提取其中的文字内容。</text>

  <!-- Upload zone -->
  <rect x="50" y="155" width="580" height="90" rx="12" fill="rgba(20,31,55,0.85)" stroke="rgba(59,130,246,0.4)" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="340" y="194" fill="#6b7a9f" font-size="30" text-anchor="middle">📂</text>
  <text x="340" y="224" fill="#8899bb" font-size="13" text-anchor="middle">点击上传或拖拽 PDF 文件到此处</text>

  <!-- Encoding selection -->
  <text x="50" y="270" fill="#6b7a9f" font-size="12">编码格式：</text>
  <rect x="130" y="257" width="120" height="26" rx="6" fill="#0a0e1a" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="155" y="274" fill="#f0f4ff" font-size="12">UTF-8 ▼</text>
  <rect x="260" y="257" width="80" height="26" rx="6" fill="#0a0e1a" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="280" y="274" fill="#4a5a7a" font-size="12">GBK</text>
  <rect x="350" y="257" width="90" height="26" rx="6" fill="#0a0e1a" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="375" y="274" fill="#4a5a7a" font-size="12">Shift-JIS</text>

  <!-- Extract button -->
  <rect x="50" y="298" width="200" height="34" rx="8" fill="url(#accent)"/>
  <text x="150" y="319" fill="#fff" font-size="13" font-weight="600" text-anchor="middle">提取文字</text>

  <!-- File info -->
  <rect x="270" y="298" width="360" height="34" rx="8" fill="rgba(10,14,26,0.6)" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <text x="285" y="319" fill="#4a5a7a" font-size="12">拖拽或选择 PDF 文件开始提取...</text>

  <!-- Download button (disabled) -->
  <rect x="50" y="345" width="580" height="26" rx="999" fill="#1e293b" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <text x="340" y="362" fill="#4a5a7a" font-size="12" font-weight="600" text-anchor="middle">📥 下载 TXT</text>
</svg>
