<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="'Inter',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b18"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="result" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
  </defs>
  <rect width="680" height="400" fill="url(#bg)" rx="14"/>

  <!-- Title -->
  <text x="30" y="42" fill="#f0f4ff" font-size="20" font-weight="700">🌐 HTML 转 PDF</text>
  <text x="30" y="66" fill="#6b7a9f" font-size="13">将 HTML 代码转换为 PDF 文件，支持自定义页面样式和布局。</text>

  <!-- Tool box -->
  <rect x="30" y="85" width="620" height="290" fill="rgba(14,22,41,0.8)" rx="14" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

  <text x="50" y="118" fill="#f0f4ff" font-size="15" font-weight="700">HTML 代码</text>
  <text x="50" y="138" fill="#6b7a9f" font-size="12">输入 HTML 代码，点击转换生成 PDF 文件。</text>

  <!-- HTML Code Editor Area -->
  <rect x="50" y="152" width="290" height="160" rx="10" fill="#0a0e1a" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <rect x="50" y="152" width="290" height="28" rx="10" fill="rgba(20,31,55,0.9)"/>
  <rect x="50" y="170" width="290" height="10" fill="rgba(20,31,55,0.9)"/>
  <circle cx="65" cy="166" r="4" fill="#f87171"/>
  <circle cx="79" cy="166" r="4" fill="#fbbf24"/>
  <circle cx="93" cy="166" r="4" fill="#34d399"/>
  <text x="190" y="170" fill="#4a5a7a" font-size="9" text-anchor="middle">index.html</text>

  <!-- HTML code lines -->
  <text x="62" y="195" fill="#c084fc" font-size="10" font-family="'JetBrains Mono','Fira Code','Consolas',monospace">&lt;!DOCTYPE html&gt;</text>
  <text x="62" y="211" fill="#60a5fa" font-size="10" font-family="'JetBrains Mono','Fira Code','Consolas',monospace">&lt;html lang="zh"&gt;</text>
  <text x="72" y="227" fill="#60a5fa" font-size="10" font-family="'JetBrains Mono','Fira Code','Consolas',monospace">&lt;head&gt;</text>
  <text x="82" y="243" fill="#34d399" font-size="10" font-family="'JetBrains Mono','Fira Code','Consolas',monospace">&lt;title&gt;我的文档&lt;/title&gt;</text>
  <text x="72" y="259" fill="#60a5fa" font-size="10" font-family="'JetBrains Mono','Fira Code','Consolas',monospace">&lt;/head&gt;</text>
  <text x="72" y="275" fill="#60a5fa" font-size="10" font-family="'JetBrains Mono','Fira Code','Consolas',monospace">&lt;body&gt;</text>
  <text x="82" y="291" fill="#fbbf24" font-size="10" font-family="'JetBrains Mono','Fira Code','Consolas',monospace">&lt;h1&gt;欢迎使用&lt;/h1&gt;</text>

  <!-- Convert Button -->
  <rect x="50" y="322" width="140" height="36" rx="999" fill="url(#accent)"/>
  <text x="120" y="345" fill="#fff" font-size="13" font-weight="700" text-anchor="middle">🔄 转换为 PDF</text>

  <!-- PDF Preview area -->
  <rect x="355" y="152" width="275" height="202" rx="10" fill="#0a0e1a" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

  <!-- PDF page mockup -->
  <rect x="370" y="162" width="245" height="130" rx="6" fill="#0f172a" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="492" y="182" fill="#4a5a7a" font-size="9" text-anchor="middle">PDF 预览</text>

  <!-- Mock PDF content -->
  <rect x="385" y="195" width="215" height="6" rx="3" fill="rgba(255,255,255,0.15)"/>
  <rect x="385" y="208" width="160" height="6" rx="3" fill="rgba(255,255,255,0.10)"/>
  <rect x="385" y="221" width="180" height="6" rx="3" fill="rgba(255,255,255,0.10)"/>
  <rect x="385" y="240" width="100" height="6" rx="3" fill="rgba(255,255,255,0.12)"/>
  <rect x="385" y="253" width="200" height="6" rx="3" fill="rgba(255,255,255,0.10)"/>
  <rect x="385" y="266" width="140" height="6" rx="3" fill="rgba(255,255,255,0.10)"/>

  <!-- Page number -->
  <text x="492" y="258" fill="#4a5a7a" font-size="9" text-anchor="middle">页面尺寸 A4 · 纵向</text>

  <!-- Download button (disabled state) -->
  <rect x="370" y="305" width="245" height="36" rx="999" fill="#1e293b" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <text x="492" y="328" fill="#4a5a7a" font-size="12" font-weight="600" text-anchor="middle">⬇ 下载 PDF</text>

  <!-- Options row -->
  <rect x="208" y="322" width="130" height="36" rx="8" fill="rgba(10,14,26,0.6)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="273" y="345" fill="#94a3b8" font-size="11" text-anchor="middle">A4 ▼</text>
</svg>
