<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="'Inter',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b18"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
  </defs>
  <rect width="680" height="400" fill="url(#bg)" rx="14"/>

  <!-- Title -->
  <text x="30" y="42" fill="#f0f4ff" font-size="20" font-weight="700">📐 PDF 调整大小</text>
  <text x="30" y="66" fill="#6b7a9f" font-size="13">调整 PDF 页面尺寸，选择纸张大小、方向和边距。</text>

  <!-- Tool box -->
  <rect x="30" y="85" width="620" height="290" fill="rgba(14,22,41,0.8)" rx="14" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

  <!-- Left: upload area -->
  <text x="50" y="118" fill="#f0f4ff" font-size="15" font-weight="700">上传 PDF</text>
  <rect x="50" y="130" width="280" height="140" rx="12" fill="#0a0e1a" stroke="rgba(0,229,255,0.25)" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="190" y="182" fill="#00e5ff" font-size="28" text-anchor="middle">⬆</text>
  <text x="190" y="210" fill="#6b7a9f" font-size="13" text-anchor="middle">点击上传或拖拽 PDF 文件</text>
  <text x="190" y="230" fill="#4a5a7a" font-size="11" text-anchor="middle">支持最大 100MB</text>

  <!-- Panel divider -->
  <line x1="345" y1="85" x2="345" y2="375" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

  <!-- Right: settings panel -->
  <text x="365" y="118" fill="#f0f4ff" font-size="15" font-weight="700">页面设置</text>

  <!-- Paper size dropdown -->
  <text x="365" y="148" fill="#6b7a9f" font-size="12">纸张大小</text>
  <rect x="365" y="155" width="265" height="32" rx="6" fill="#0a0e1a" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <text x="380" y="176" fill="#f0f4ff" font-size="13">A4 (210 × 297 mm)</text>
  <text x="612" y="176" fill="#6b7a9f" font-size="10">▼</text>

  <!-- Orientation -->
  <text x="365" y="205" fill="#6b7a9f" font-size="12">方向</text>
  <rect x="365" y="212" width="125" height="30" rx="6" fill="rgba(0,229,255,0.12)" stroke="#00e5ff" stroke-width="1"/>
  <text x="427" y="232" fill="#00e5ff" font-size="12" text-anchor="middle">📄 纵向</text>
  <rect x="498" y="212" width="132" height="30" rx="6" fill="#0a0e1a" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="564" y="232" fill="#6b7a9f" font-size="12" text-anchor="middle">📄 横向</text>

  <!-- Margin preset -->
  <text x="365" y="263" fill="#6b7a9f" font-size="12">边距预设</text>
  <rect x="365" y="270" width="80" height="28" rx="6" fill="rgba(0,229,255,0.1)" stroke="#00e5ff" stroke-width="1"/>
  <text x="405" y="289" fill="#00e5ff" font-size="12" text-anchor="middle">标准</text>
  <rect x="453" y="270" width="80" height="28" rx="6" fill="#0a0e1a" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="493" y="289" fill="#6b7a9f" font-size="12" text-anchor="middle">窄边</text>
  <rect x="541" y="270" width="89" height="28" rx="6" fill="#0a0e1a" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="585" y="289" fill="#6b7a9f" font-size="12" text-anchor="middle">自定义</text>

  <!-- Apply to all checkbox -->
  <rect x="365" y="315" width="16" height="16" rx="3" fill="rgba(0,229,255,0.2)" stroke="#00e5ff" stroke-width="1.5"/>
  <text x="388" y="328" fill="#8899bb" font-size="12">应用到所有页面</text>

  <!-- Resize button -->
  <rect x="50" y="290" width="280" height="34" rx="999" fill="url(#accent)"/>
  <text x="190" y="312" fill="#fff" font-size="14" font-weight="600" text-anchor="middle">📐 开始调整大小</text>

  <!-- Bottom hint -->
  <text x="190" y="348" fill="#4a5a7a" font-size="10" text-anchor="middle">所有操作在浏览器本地完成，文件不会上传</text>
</svg>
