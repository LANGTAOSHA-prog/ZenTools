<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="'Inter',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b18"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>
  <rect width="680" height="400" fill="url(#bg)" rx="14"/>

  <text x="30" y="42" fill="#f0f4ff" font-size="20" font-weight="700">标题提取</text>
  <text x="30" y="66" fill="#6b7a9f" font-size="13">提取和分析网页的H1-H6标题结构，检查标题层次合理性</text>

  <rect x="30" y="85" width="620" height="290" fill="rgba(14,22,41,0.8)" rx="14" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

  <text x="50" y="118" fill="#f0f4ff" font-size="15" font-weight="700">输入网址</text>
  <text x="50" y="138" fill="#6b7a9f" font-size="12">输入目标网页URL，提取和展示标题层级结构</text>

  <rect x="50" y="155" width="580" height="38" fill="#0a0e1a" rx="8" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="65" y="179" fill="#4a5a7a" font-size="13">https://example.com/blog/seo-guide</text>

  <rect x="50" y="210" width="580" height="155" rx="10" fill="rgba(20,31,55,0.85)" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>

  <text x="70" y="236" fill="#06b6d4" font-size="13" font-weight="600">标题层级结构</text>

  <text x="82" y="262" fill="#f0f4ff" font-size="13" font-weight="700">H1 — SEO优化完全指南</text>
  <rect x="276" y="254" width="12" height="12" rx="2" fill="rgba(34,197,94,0.2)"/>
  <text x="291" y="264" fill="#22c55e" font-size="10">1个</text>

  <text x="98" y="288" fill="#e2e8f0" font-size="12">H2 — 关键词研究基础</text>
  <rect x="260" y="280" width="12" height="12" rx="2" fill="rgba(59,130,246,0.15)"/>
  <text x="275" y="290" fill="#3b82f6" font-size="10">5个</text>

  <text x="114" y="310" fill="#94a3b8" font-size="11">H3 — 长尾关键词策略</text>
  <rect x="276" y="302" width="12" height="12" rx="2" fill="rgba(59,130,246,0.1)"/>
  <text x="291" y="312" fill="#64748b" font-size="10">12个</text>

  <text x="98" y="336" fill="#e2e8f0" font-size="12">H2 — 站内SEO优化技巧</text>
  <rect x="260" y="328" width="12" height="12" rx="2" fill="rgba(59,130,246,0.15)"/>
  <text x="275" y="338" fill="#3b82f6" font-size="10">4个</text>

  <rect x="50" y="335" width="580" height="36" fill="url(#accent)" rx="999"/>
  <text x="340" y="357" fill="#fff" font-size="14" font-weight="600" text-anchor="middle">开始提取</text>
</svg>