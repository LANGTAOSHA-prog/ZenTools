<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="'Inter',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b18"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>
  <rect width="680" height="400" fill="url(#bg)" rx="14"/>
  <text x="30" y="42" fill="#f0f4ff" font-size="20" font-weight="700">时间戳转换器</text>
  <text x="30" y="66" fill="#6b7a9f" font-size="13">Unix 时间戳与 ISO 日期、本地时间之间互相转换。</text>
  <rect x="30" y="85" width="620" height="290" fill="rgba(14,22,41,0.8)" rx="14" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="50" y="118" fill="#f0f4ff" font-size="15" font-weight="700">时间戳互转</text>
  <rect x="50" y="135" width="580" height="42" fill="#0a0e1a" rx="8" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="65" y="161" fill="#4a5a7a" font-size="10" font-weight="600">Unix 时间戳:</text>
  <text x="65" y="161" fill="#22c55e" font-size="13" font-family="'JetBrains Mono',monospace">1750646400</text>
  <rect x="50" y="187" width="580" height="42" fill="#0a0e1a" rx="8" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="65" y="213" fill="#4a5a7a" font-size="10" font-weight="600">ISO 8601:</text>
  <text x="65" y="213" fill="#3b82f6" font-size="13" font-family="'JetBrains Mono',monospace">2025-06-23T00:00:00.000Z</text>
  <rect x="50" y="239" width="580" height="42" fill="#0a0e1a" rx="8" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="65" y="265" fill="#4a5a7a" font-size="10" font-weight="600">本地时间:</text>
  <text x="65" y="265" fill="#f59e0b" font-size="13" font-family="'JetBrains Mono',monospace">2025年6月23日 周一 08:00:00 (UTC+8)</text>
  <rect x="50" y="291" width="580" height="42" fill="#0a0e1a" rx="8" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="65" y="317" fill="#4a5a7a" font-size="10" font-weight="600">人类可读:</text>
  <text x="65" y="317" fill="#a78bfa" font-size="13" font-family="'JetBrains Mono',monospace">3 个月前</text>
  <rect x="50" y="343" width="580" height="24" fill="url(#accent)" rx="6" opacity="0.15"/>
  <text x="340" y="359" fill="#10b981" font-size="10" text-anchor="middle">双向实时转换，支持毫秒/秒切换</text>
</svg>
