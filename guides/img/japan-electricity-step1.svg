<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="'Inter',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
<defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0f172a"/><stop offset="100%" stop-color="#070b18"/></linearGradient><linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#3b82f6"/><stop offset="100%" stop-color="#8b5cf6"/></linearGradient></defs>
<rect width="680" height="400" fill="url(#bg)" rx="14"/>
<text x="30" y="42" fill="#f0f4ff" font-size="20" font-weight="700">⚡ 日本电费计算</text>
<text x="30" y="66" fill="#6b7a9f" font-size="13">根据日本电力公司费率计算月度电费，支持东京/关西/中部等地域。</text>
<rect x="30" y="85" width="620" height="290" fill="rgba(14,22,41,0.8)" rx="14" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
<text x="50" y="118" fill="#f0f4ff" font-size="14" font-weight="700">地域选择</text>
<rect x="50" y="128" width="280" height="36" fill="#0a0e1a" rx="6" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
<text x="65" y="151" fill="#8899bb" font-size="13">东京电力 ▼</text>
<text x="350" y="118" fill="#f0f4ff" font-size="14" font-weight="700">月度用电量</text>
<rect x="350" y="128" width="280" height="36" fill="#0a0e1a" rx="6" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
<text x="365" y="151" fill="#f0f4ff" font-size="15" font-weight="600">300 kWh</text>
<text x="50" y="188" fill="#f0f4ff" font-size="14" font-weight="700">契约电流</text>
<rect x="50" y="198" width="280" height="36" fill="#0a0e1a" rx="6" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
<text x="65" y="221" fill="#8899bb" font-size="13">30A ▼</text>
<rect x="50" y="255" width="580" height="80" fill="#0f1a35" rx="10" stroke="rgba(0,229,255,0.15)" stroke-width="1"/>
<text x="340" y="285" fill="#00e5ff" font-size="20" font-weight="800" text-anchor="middle">预估电费：¥8,250</text>
<text x="340" y="308" fill="#8899bb" font-size="12" text-anchor="middle">基本料金 + 电力量料金 + 燃料费调整额</text>
<text x="340" y="325" fill="#6b7a9f" font-size="11" text-anchor="middle">东京/关西/中部/九州/东北/北海道 各地域电力公司费率模拟</text>
</svg>