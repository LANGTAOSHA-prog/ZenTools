<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="'Inter',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b18"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
  </defs>
  <rect width="680" height="400" fill="url(#bg)" rx="14"/>
  <text x="30" y="42" fill="#f0f4ff" font-size="20" font-weight="700">正则表达式测试器</text>
  <text x="30" y="66" fill="#6b7a9f" font-size="13">实时测试正则表达式，高亮匹配结果，支持多种正则引擎。</text>
  <rect x="30" y="85" width="620" height="290" fill="rgba(14,22,41,0.8)" rx="14" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="50" y="118" fill="#f0f4ff" font-size="15" font-weight="700">正则表达式匹配</text>
  <rect x="50" y="135" width="580" height="30" fill="#0a0e1a" rx="8" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="65" y="155" fill="#f59e0b" font-size="11" font-family="'JetBrains Mono',monospace">正则: (\w+)@(\w+)\.(\w+)</text>
  <text x="380" y="155" fill="#6b7a9f" font-size="10"> flags: gi</text>
  <rect x="50" y="175" width="580" height="60" fill="#0a0e1a" rx="8" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="65" y="198" fill="#94a3b8" font-size="11" font-family="'JetBrains Mono',monospace">联系 admin@example.com 或 support@test.org</text>
  <rect x="50" y="200" width="180" height="28" fill="rgba(239,68,68,0.25)" rx="4"/>
  <rect x="290" y="200" width="160" height="28" fill="rgba(239,68,68,0.25)" rx="4"/>
  <rect x="50" y="245" width="580" height="60" fill="#0a0e1a" rx="8" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="65" y="268" fill="#4a5a7a" font-size="10" font-weight="600">匹配结果:</text>
  <text x="65" y="290" fill="#ef4444" font-size="10" font-family="'JetBrains Mono',monospace">[0] admin@example.com groups: [admin] [example] [com]</text>
  <text x="65" y="308" fill="#ef4444" font-size="10" font-family="'JetBrains Mono',monospace">[1] support@test.org groups: [support] [test] [org]</text>
  <rect x="50" y="315" width="580" height="38" fill="rgba(255,255,255,0.02)" rx="8"/>
  <text x="340" y="338" fill="#6b7a9f" font-size="11" text-anchor="middle">实时高亮匹配结果，显示分组捕获</text>
</svg>
