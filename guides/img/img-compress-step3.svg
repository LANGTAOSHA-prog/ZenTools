<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" font-family="'Inter',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b18"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>
  <rect width="680" height="380" fill="url(#bg)" rx="14"/>
  <text x="30" y="42" fill="#f0f4ff" font-size="20" font-weight="700">📦 图片压缩</text>
  <text x="30" y="66" fill="#6b7a9f" font-size="13">在线压缩 JPG、PNG、WebP 图片，在尽量保持画质的前提下大幅减小文件体积。</text>
  <rect x="30" y="85" width="620" height="270" fill="rgba(14,22,41,0.8)" rx="14" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

  <!-- Success icon -->
  <circle cx="340" cy="128" r="24" fill="rgba(16,185,129,0.15)" stroke="rgba(16,185,129,0.3)" stroke-width="2"/>
  <text x="340" y="136" fill="#10b981" font-size="26" text-anchor="middle">✓</text>

  <text x="340" y="175" fill="#f0f4ff" font-size="16" font-weight="700" text-anchor="middle">✅ 压缩完成</text>
  <text x="340" y="198" fill="#6b7a9f" font-size="13" text-anchor="middle">原图 3.2 MB → 压缩后 486 KB（节省 85%）</text>

  <!-- Preview area -->
  <rect x="80" y="218" width="220" height="50" fill="rgba(20,31,55,0.6)" rx="8" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="190" y="240" fill="#6b7a9f" font-size="10" text-anchor="middle">🖼️ 压缩前预览 (3.2 MB)</text>
  <rect x="80" y="238" width="220" height="4" fill="rgba(255,255,255,0.04)" rx="2"/>
  <rect x="80" y="238" width="220" height="4" fill="#f87171" rx="2" opacity="0.4"/>

  <rect x="320" y="218" width="220" height="50" fill="rgba(20,31,55,0.6)" rx="8" stroke="#10b981" stroke-width="1"/>
  <text x="430" y="240" fill="#6b7a9f" font-size="10" text-anchor="middle">🖼️ 压缩后预览 (486 KB)</text>
  <rect x="320" y="238" width="220" height="4" fill="rgba(255,255,255,0.04)" rx="2"/>
  <rect x="320" y="238" width="55" height="4" fill="#22c55e" rx="2" opacity="0.7"/>

  <!-- Download button -->
  <rect x="170" y="285" width="340" height="44" fill="url(#green)" rx="12"/>
  <text x="340" y="313" fill="#fff" font-size="15" font-weight="700" text-anchor="middle">📥 下载压缩后的图片</text>
</svg>
