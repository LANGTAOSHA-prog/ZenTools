<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="'Inter',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b18"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="680" height="400" fill="url(#bg)" rx="14"/>

  <!-- Title -->
  <text x="30" y="42" fill="#f0f4ff" font-size="20" font-weight="700">📋 PDF 元数据</text>
  <text x="30" y="66" fill="#6b7a9f" font-size="13">查看和编辑 PDF 文件的标题、作者、主题、关键词等元数据信息。</text>

  <!-- Tool box -->
  <rect x="30" y="85" width="620" height="290" fill="rgba(14,22,41,0.8)" rx="14" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

  <!-- Left: Form -->
  <text x="50" y="118" fill="#f0f4ff" font-size="15" font-weight="700">元数据编辑</text>

  <!-- Title field -->
  <text x="50" y="146" fill="#6b7a9f" font-size="11">标题</text>
  <rect x="50" y="152" width="260" height="30" fill="#0a0e1a" rx="6" stroke="rgba(59,130,246,0.5)" stroke-width="1.5"/>
  <text x="60" y="172" fill="#c0cced" font-size="12">项目需求文档 v3</text>

  <!-- Author field -->
  <text x="50" y="198" fill="#6b7a9f" font-size="11">作者</text>
  <rect x="50" y="204" width="260" height="30" fill="#0a0e1a" rx="6" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="60" y="224" fill="#c0cced" font-size="12">张明</text>

  <!-- Subject field -->
  <text x="50" y="250" fill="#6b7a9f" font-size="11">主题</text>
  <rect x="50" y="256" width="260" height="30" fill="#0a0e1a" rx="6" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="60" y="276" fill="#c0cced" font-size="12">2026 年 Q2 产品规划</text>

  <!-- Keywords field -->
  <text x="50" y="302" fill="#6b7a9f" font-size="11">关键词</text>
  <rect x="50" y="308" width="260" height="30" fill="#0a0e1a" rx="6" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="60" y="328" fill="#c0cced" font-size="12">需求文档, 产品规划, Q2, 2026</text>

  <!-- Right: Current metadata panel -->
  <rect x="330" y="118" width="300" height="180" fill="rgba(20,31,55,0.7)" rx="10" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <text x="350" y="142" fill="#f0f4ff" font-size="13" font-weight="600">当前元数据</text>

  <text x="350" y="168" fill="#6b7a9f" font-size="11">标题</text>
  <text x="350" y="184" fill="#c0cced" font-size="12">项目需求文档 v3</text>

  <text x="350" y="210" fill="#6b7a9f" font-size="11">作者</text>
  <text x="350" y="226" fill="#c0cced" font-size="12">张明</text>

  <text x="350" y="252" fill="#6b7a9f" font-size="11">创建时间</text>
  <text x="350" y="268" fill="#c0cced" font-size="12">2026-06-20 14:30</text>

  <text x="350" y="294" fill="#6b7a9f" font-size="11">页数 / 大小</text>
  <text x="350" y="310" fill="#c0cced" font-size="12">42 页 / 3.2 MB</text>

  <!-- Save button -->
  <rect x="330" y="312" width="300" height="36" fill="url(#accent)" rx="999"/>
  <text x="480" y="335" fill="#fff" font-size="14" font-weight="600" text-anchor="middle">保存元数据</text>

  <!-- Divider -->
  <line x1="320" y1="118" x2="320" y2="310" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
</svg>
