<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="'Inter',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b18"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
  </defs>
  <rect width="680" height="400" fill="url(#bg)" rx="14"/>

  <!-- Title -->
  <text x="30" y="42" fill="#f0f4ff" font-size="20" font-weight="700">🔄 PDF 旋转</text>
  <text x="30" y="66" fill="#6b7a9f" font-size="13">旋转 PDF 页面方向，支持顺时针、逆时针和 180° 旋转。</text>

  <!-- Tool box -->
  <rect x="30" y="85" width="620" height="290" fill="rgba(14,22,41,0.8)" rx="14" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

  <!-- Left: Page list header -->
  <rect x="50" y="100" width="300" height="36" fill="rgba(255,255,255,0.03)" rx="8"/>
  <text x="65" y="123" fill="#f0f4ff" font-size="13" font-weight="600">📄 页面预览</text>
  <text x="270" y="123" fill="#4a5a7a" font-size="11">拖拽调整顺序</text>

  <!-- Page item 1 -->
  <rect x="55" y="145" width="290" height="52" fill="rgba(255,255,255,0.04)" rx="8"/>
  <!-- Page thumbnail - rotated 90deg indicator -->
  <rect x="68" y="155" width="36" height="34" fill="rgba(59,130,246,0.15)" rx="4"/>
  <text x="86" y="180" fill="#3b82f6" font-size="11" text-anchor="middle" font-weight="600">↻</text>
  <text x="112" y="170" fill="#d1d5e0" font-size="13">第 1 页</text>
  <text x="112" y="186" fill="#6b7a9f" font-size="11">当前：横向</text>
  <!-- Rotate buttons -->
  <rect x="230" y="153" width="26" height="22" fill="rgba(0,229,255,0.12)" rx="5"/>
  <text x="243" y="169" fill="#00e5ff" font-size="11" text-anchor="middle">↺</text>
  <rect x="261" y="153" width="26" height="22" fill="rgba(0,229,255,0.12)" rx="5"/>
  <text x="274" y="169" fill="#00e5ff" font-size="11" text-anchor="middle">↻</text>
  <rect x="292" y="153" width="36" height="22" fill="rgba(0,229,255,0.08)" rx="5"/>
  <text x="310" y="169" fill="#6b7a9f" font-size="10" text-anchor="middle">180°</text>

  <!-- Page item 2 -->
  <rect x="55" y="203" width="290" height="52" fill="rgba(255,255,255,0.02)" rx="8"/>
  <rect x="68" y="213" width="36" height="34" fill="rgba(16,185,129,0.15)" rx="4"/>
  <text x="86" y="238" fill="#10b981" font-size="11" text-anchor="middle" font-weight="600">1</text>
  <text x="112" y="228" fill="#d1d5e0" font-size="13">第 2 页</text>
  <text x="112" y="244" fill="#6b7a9f" font-size="11">当前：纵向</text>
  <rect x="230" y="211" width="26" height="22" fill="rgba(0,229,255,0.12)" rx="5"/>
  <text x="243" y="227" fill="#00e5ff" font-size="11" text-anchor="middle">↺</text>
  <rect x="261" y="211" width="26" height="22" fill="rgba(0,229,255,0.12)" rx="5"/>
  <text x="274" y="227" fill="#00e5ff" font-size="11" text-anchor="middle">↻</text>
  <rect x="292" y="211" width="36" height="22" fill="rgba(0,229,255,0.08)" rx="5"/>
  <text x="310" y="227" fill="#6b7a9f" font-size="10" text-anchor="middle">180°</text>

  <!-- Page item 3 -->
  <rect x="55" y="261" width="290" height="52" fill="rgba(255,255,255,0.04)" rx="8"/>
  <rect x="68" y="271" width="36" height="34" fill="rgba(139,92,246,0.15)" rx="4"/>
  <text x="86" y="296" fill="#8b5cf6" font-size="11" text-anchor="middle" font-weight="600">3</text>
  <text x="112" y="286" fill="#d1d5e0" font-size="13">第 3 页</text>
  <text x="112" y="302" fill="#6b7a9f" font-size="11">当前：纵向</text>
  <rect x="230" y="269" width="26" height="22" fill="rgba(0,229,255,0.12)" rx="5"/>
  <text x="243" y="285" fill="#00e5ff" font-size="11" text-anchor="middle">↺</text>
  <rect x="261" y="269" width="26" height="22" fill="rgba(0,229,255,0.12)" rx="5"/>
  <text x="274" y="285" fill="#00e5ff" font-size="11" text-anchor="middle">↻</text>
  <rect x="292" y="269" width="36" height="22" fill="rgba(0,229,255,0.08)" rx="5"/>
  <text x="310" y="285" fill="#6b7a9f" font-size="10" text-anchor="middle">180°</text>

  <!-- Panel divider -->
  <line x1="365" y1="100" x2="365" y2="355" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

  <!-- Right: Rotation settings -->
  <text x="385" y="123" fill="#f0f4ff" font-size="15" font-weight="700">旋转设置</text>
  <text x="385" y="143" fill="#6b7a9f" font-size="12">选择旋转角度或输入自定义值。</text>

  <!-- Quick angle buttons -->
  <text x="385" y="170" fill="#8899bb" font-size="12" font-weight="600">快速角度</text>

  <rect x="385" y="180" width="72" height="36" fill="rgba(0,229,255,0.1)" rx="8" stroke="rgba(0,229,255,0.3)" stroke-width="1"/>
  <text x="421" y="202" fill="#00e5ff" font-size="13" font-weight="600" text-anchor="middle">90° ↷</text>

  <rect x="465" y="180" width="72" height="36" fill="rgba(255,255,255,0.04)" rx="8"/>
  <text x="501" y="202" fill="#d1d5e0" font-size="13" font-weight="600" text-anchor="middle">90° ↶</text>

  <rect x="545" y="180" width="72" height="36" fill="rgba(255,255,255,0.04)" rx="8"/>
  <text x="581" y="202" fill="#d1d5e0" font-size="13" font-weight="600" text-anchor="middle">180°</text>

  <!-- Custom angle input -->
  <text x="385" y="240" fill="#8899bb" font-size="12" font-weight="600">自定义角度</text>
  <rect x="385" y="250" width="200" height="34" rx="8" fill="#0a0e1a" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <text x="485" y="271" fill="#6b7a9f" font-size="12" text-anchor="middle">输入角度（0-360）</text>

  <!-- Apply scope -->
  <rect x="385" y="294" width="18" height="18" rx="4" fill="rgba(0,229,255,0.2)" stroke="#00e5ff" stroke-width="1.5"/>
  <text x="410" y="308" fill="#8899bb" font-size="12">应用到所有页面</text>

  <rect x="385" y="320" width="18" height="18" rx="4" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
  <text x="410" y="334" fill="#6b7a9f" font-size="12">仅选中页面</text>

  <!-- Apply button -->
  <rect x="385" y="352" width="245" height="40" rx="999" fill="url(#accent)"/>
  <text x="507" y="377" fill="#fff" font-size="14" font-weight="700" text-anchor="middle">🔄 应用旋转</text>
</svg>
