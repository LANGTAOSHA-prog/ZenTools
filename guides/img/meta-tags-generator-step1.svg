<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="'Inter',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b18"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
  </defs>
  <rect width="680" height="400" fill="url(#bg)" rx="14"/>

  <text x="30" y="42" fill="#f0f4ff" font-size="20" font-weight="700">🏷 Meta 标签生成器</text>
  <text x="30" y="66" fill="#6b7a9f" font-size="13">自动生成SEO所需的title、description和Open Graph标签。</text>

  <rect x="30" y="85" width="620" height="290" fill="rgba(14,22,41,0.8)" rx="14" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

  <text x="50" y="118" fill="#f0f4ff" font-size="15" font-weight="700">填写页面信息</text>
  <text x="50" y="138" fill="#6b7a9f" font-size="12">输入页面标题、描述和关键词，生成完整的Meta标签代码。</text>

  <rect x="50" y="152" width="270" height="36" fill="rgba(20,31,55,0.85)" rx="8" stroke="rgba(139,92,246,0.3)" stroke-width="1"/>
  <text x="65" y="175" fill="#8899bb" font-size="13">页面标题 (50-60字符)</text>
  <rect x="335" y="152" width="270" height="36" fill="rgba(20,31,55,0.85)" rx="8" stroke="rgba(139,92,246,0.2)" stroke-width="1"/>
  <text x="350" y="175" fill="#6b7a9f" font-size="13">关键词 (逗号分隔)</text>

  <rect x="50" y="200" width="555" height="65" fill="rgba(20,31,55,0.85)" rx="8" stroke="rgba(139,92,246,0.2)" stroke-width="1"/>
  <text x="66" y="223" fill="#8899bb" font-size="13">描述 (150-160字符)</text>

  <rect x="50" y="278" width="150" height="36" fill="url(#accent)" rx="8"/>
  <text x="125" y="301" fill="#fff" font-size="13" font-weight="600" text-anchor="middle">生成Meta标签</text>

  <rect x="50" y="328" width="580" height="42" rx="8" fill="rgba(20,31,55,0.6)" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <text x="65" y="348" fill="#22d3ee" font-size="11">&lt;title&gt;关键词密度分析 - 免费在线工具 | ZenTools&lt;/title&gt;</text>
  <text x="65" y="364" fill="#4a5a7a" font-size="10">&lt;meta name="description" content="分析文本中关键词的出现频率和密度" /&gt;</text>
</svg>
