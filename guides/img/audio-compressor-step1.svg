<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="'Inter',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b18"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="680" height="400" fill="url(#bg)" rx="14"/>
  <text x="30" y="42" fill="#f0f4ff" font-size="20" font-weight="700">🗜️ 音频压缩</text>
  <text x="30" y="66" fill="#6b7a9f" font-size="13">压缩音频文件体积，在保持音质的同时显著减小文件大小。</text>
  <rect x="30" y="85" width="620" height="290" fill="rgba(14,22,41,0.8)" rx="14" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="50" y="118" fill="#f0f4ff" font-size="15" font-weight="700">压缩音频文件</text>
  <rect x="50" y="132" width="580" height="70" rx="12" fill="rgba(20,31,55,0.85)" stroke="rgba(59,130,246,0.4)" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="340" y="162" fill="#6b7a9f" font-size="26" text-anchor="middle">🎵</text>
  <text x="340" y="188" fill="#8899bb" font-size="13" text-anchor="middle">点击上传或拖拽音频文件到此处</text>
  <rect x="50" y="215" width="270" height="100" rx="10" fill="rgba(10,14,26,0.6)" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  <text x="65" y="240" fill="#f0f4ff" font-size="12" font-weight="600">原始文件</text>
  <text x="65" y="262" fill="#8899bb" font-size="11">🎵 会议录音.mp3</text>
  <text x="65" y="282" fill="#6b7a9f" font-size="11">大小：24.5 MB</text>
  <text x="65" y="300" fill="#6b7a9f" font-size="11">时长：05:32</text>
  <rect x="340" y="215" width="290" height="100" rx="10" fill="rgba(10,14,26,0.6)" stroke="rgba(0,229,255,0.2)" stroke-width="1"/>
  <text x="355" y="240" fill="#00e5ff" font-size="12" font-weight="600">压缩后</text>
  <text x="355" y="262" fill="#8899bb" font-size="11">🎵 会议录音_compressed.mp3</text>
  <text x="355" y="282" fill="#00e5ff" font-size="11">大小：6.2 MB (减少 75%)</text>
  <text x="355" y="300" fill="#6b7a9f" font-size="11">时长：05:32</text>
  <rect x="50" y="325" width="580" height="38" fill="url(#accent)" rx="8"/>
  <text x="340" y="349" fill="#fff" font-size="14" font-weight="600" text-anchor="middle">🗜️ 开始压缩</text>
</svg>
