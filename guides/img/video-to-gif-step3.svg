<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" font-family="'Inter',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b18"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>
  <rect width="680" height="380" fill="url(#bg)" rx="14"/>
  <text x="30" y="42" fill="#f0f4ff" font-size="20" font-weight="700">🎬 视频转 GIF</text>
  <text x="30" y="66" fill="#6b7a9f" font-size="13">将视频片段转换为 GIF 动图，自定义尺寸和帧率。</text>
  <rect x="30" y="85" width="620" height="270" fill="rgba(14,22,41,0.8)" rx="14" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

  <!-- Success -->
  <circle cx="340" cy="128" r="24" fill="rgba(16,185,129,0.15)" stroke="rgba(16,185,129,0.3)" stroke-width="2"/>
  <text x="340" y="136" fill="#10b981" font-size="26" text-anchor="middle">✓</text>
  <text x="340" y="175" fill="#f0f4ff" font-size="16" font-weight="700" text-anchor="middle">✅ GIF 生成完成</text>
  <text x="340" y="195" fill="#6b7a9f" font-size="13" text-anchor="middle">480px × 270px · 10 FPS · 共 120 帧</text>

  <!-- GIF preview -->
  <rect x="130" y="212" width="180" height="70" fill="rgba(20,31,55,0.6)" rx="8" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="220" y="240" fill="#6b7a9f" font-size="24" text-anchor="middle">🎞️</text>
  <text x="220" y="265" fill="#4a5a7a" font-size="10" text-anchor="middle">GIF 预览</text>

  <!-- Info -->
  <rect x="330" y="212" width="220" height="50" fill="rgba(20,31,55,0.6)" rx="8" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="350" y="234" fill="#6b7a9f" font-size="11">文件大小：</text>
  <text x="420" y="234" fill="#f0f4ff" font-size="11">1.8 MB</text>
  <text x="350" y="252" fill="#6b7a9f" font-size="11">时长：</text>
  <text x="398" y="252" fill="#f0f4ff" font-size="11">12 秒</text>

  <!-- Download button -->
  <rect x="170" y="285" width="340" height="44" fill="url(#green)" rx="12"/>
  <text x="340" y="313" fill="#fff" font-size="15" font-weight="700" text-anchor="middle">📥 下载 GIF 动图</text>
</svg>
