    <rect x="114" y="200" width="4" height="32" rx="2"/>
    <rect x="122" y="206" width="4" height="20" rx="2"/>
    <rect x="130" y="198" width="4" height="36" rx="2"/>
    <rect x="138" y="202" width="4" height="28" rx="2"/>
    <rect x="146" y="208" width="4" height="16" rx="2"/>
