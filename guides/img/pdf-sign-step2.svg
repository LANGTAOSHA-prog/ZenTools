<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="'Inter',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b18"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="greenAccent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
  </defs>
  <rect width="680" height="400" fill="url(#bg)" rx="14"/>

  <!-- Title -->
  <text x="30" y="42" fill="#f0f4ff" font-size="20" font-weight="700">✍️ PDF 签名</text>
  <text x="30" y="66" fill="#6b7a9f" font-size="13">签名已完成，所有签名已嵌入 PDF 文档中。</text>

  <!-- Tool box -->
  <rect x="30" y="85" width="620" height="290" fill="rgba(14,22,41,0.8)" rx="14" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

  <!-- Success banner -->
  <rect x="48" y="98" width="584" height="36" fill="rgba(16,185,129,0.1)" rx="8" stroke="rgba(16,185,129,0.3)" stroke-width="1"/>
  <text x="340" y="121" fill="#34d399" font-size="13" font-weight="600" text-anchor="middle">签名已成功应用到 PDF 文档</text>

  <!-- PDF preview -->
  <rect x="48" y="145" width="400" height="210" fill="#f8fafc" rx="8"/>

  <text x="68" y="172" fill="#0f172a" font-size="13" font-weight="700">销售合同 - 2026年度（已签）</text>

  <rect x="68" y="185" width="200" height="3" fill="#e2e8f0" rx="2"/>
  <rect x="68" y="193" width="360" height="3" fill="#e2e8f0" rx="2"/>

  <text x="68" y="215" fill="#334155" font-size="11" font-weight="600">甲方：北京科技有限公司</text>
  <rect x="68" y="225" width="360" height="3" fill="#e2e8f0" rx="2"/>

  <text x="68" y="248" fill="#334155" font-size="11" font-weight="600">乙方：上海贸易有限公司</text>
  <rect x="68" y="258" width="360" height="3" fill="#e2e8f0" rx="2"/>

  <text x="68" y="278" fill="#334155" font-size="11">合同金额：¥ 500,000.00</text>
  <rect x="68" y="288" width="360" height="3" fill="#e2e8f0" rx="2"/>

  <!-- Signature 1 -->
  <text x="68" y="312" fill="#334155" font-size="10">甲方签章：</text>
  <path d="M130,298 Q140,285 150,302 Q160,318 170,292 Q175,282 180,300" fill="none" stroke="#1e40af" stroke-width="2" stroke-linecap="round"/>
  <text x="140" y="325" fill="#1e40af" font-size="9" font-style="italic">李明</text>
  <text x="185" y="312" fill="#6b7280" font-size="9">2026-06-22</text>

  <!-- Signature 2 -->
  <text x="68" y="342" fill="#334155" font-size="10">乙方签章：</text>
  <path d="M130,328 Q140,315 150,332 Q160,348 170,322" fill="none" stroke="#dc2626" stroke-width="2" stroke-linecap="round"/>
  <text x="140" y="355" fill="#dc2626" font-size="9" font-style="italic">王芳</text>
  <text x="185" y="342" fill="#6b7280" font-size="9">2026-06-22</text>

  <!-- Right panel: success info -->
  <rect x="460" y="145" width="178" height="210" fill="rgba(20,31,55,0.6)" rx="8" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>

  <text x="474" y="168" fill="#34d399" font-size="12" font-weight="600">签名完成</text>

  <text x="474" y="190" fill="#94a3b8" font-size="10">已添加签名：</text>
  <text x="474" y="208" fill="#e2e8f0" font-size="11">• 李明（甲方）</text>
  <text x="474" y="224" fill="#e2e8f0" font-size="11">• 王芳（乙方）</text>

  <text x="474" y="248" fill="#4a5a7a" font-size="10">签名方式：</text>
  <text x="474" y="264" fill="#e2e8f0" font-size="11">手写绘制</text>

  <text x="474" y="288" fill="#4a5a7a" font-size="10">签名位置：</text>
  <text x="474" y="304" fill="#e2e8f0" font-size="11">页面底部</text>

  <!-- Download button -->
  <rect x="468" y="320" width="162" height="30" fill="url(#greenAccent)" rx="8"/>
  <text x="549" y="339" fill="#fff" font-size="12" font-weight="600" text-anchor="middle">下载已签 PDF</text>
</svg>
