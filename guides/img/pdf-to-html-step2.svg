<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="'Inter',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b18"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>
  <rect width="680" height="400" fill="url(#bg)" rx="14"/>

  <!-- Title -->
  <text x="30" y="42" fill="#f0f4ff" font-size="20" font-weight="700">&#x1F310; PDF 转 HTML</text>
  <text x="30" y="66" fill="#6b7a9f" font-size="13">将 PDF 文档转换为干净的 HTML 代码，保留结构与样式。</text>

  <!-- Tool box -->
  <rect x="30" y="85" width="620" height="290" fill="rgba(14,22,41,0.8)" rx="14" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

  <!-- Uploaded file info -->
  <rect x="50" y="100" width="580" height="44" rx="10" fill="rgba(16,185,129,0.08)" stroke="rgba(16,185,129,0.3)" stroke-width="1"/>
  <text x="70" y="127" fill="#10b981" font-size="14">&#x2713; document.pdf</text>
  <text x="420" y="127" fill="#6b7a9f" font-size="12">3 页 · 2.1 MB</text>

  <!-- HTML preview area -->
  <text x="50" y="173" fill="#f0f4ff" font-size="14" font-weight="600">HTML 转换结果预览</text>
  <text x="50" y="193" fill="#6b7a9f" font-size="11">生成的 HTML 代码已准备好，检查后即可下载。</text>

  <rect x="50" y="205" width="380" height="155" rx="10" fill="rgba(10,14,26,0.85)" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <text x="65" y="225" fill="#e879f9" font-family="monospace" font-size="10">&lt;!DOCTYPE html&gt;</text>
  <text x="65" y="240" fill="#e879f9" font-family="monospace" font-size="10">&lt;html lang="zh-CN"&gt;</text>
  <text x="65" y="255" fill="#60a5fa" font-family="monospace" font-size="10">&lt;head&gt;&lt;meta charset="UTF-8"&gt;</text>
  <text x="65" y="270" fill="#34d399" font-family="monospace" font-size="10">&lt;title&gt;Document Title&lt;/title&gt;</text>
  <text x="65" y="285" fill="#60a5fa" font-family="monospace" font-size="10">&lt;style&gt;body{font-family:...</text>
  <text x="65" y="300" fill="#fbbf24" font-family="monospace" font-size="10">&lt;h1&gt;报告标题&lt;/h1&gt;</text>
  <text x="65" y="315" fill="#94a3b8" font-family="monospace" font-size="10">&lt;p&gt;这是一段转换后的文字内容...&lt;/p&gt;</text>
  <text x="65" y="330" fill="#e879f9" font-family="monospace" font-size="10">&lt;img src="data:image/png;base64,..."&gt;</text>
  <text x="65" y="345" fill="#94a3b8" font-family="monospace" font-size="10">  ...</text>

  <!-- Side info panel -->
  <rect x="450" y="205" width="180" height="100" rx="10" fill="rgba(20,31,55,0.6)" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <text x="540" y="228" fill="#f0f4ff" font-size="13" font-weight="600" text-anchor="middle">转换统计</text>
  <text x="465" y="250" fill="#6b7a9f" font-size="11">总行数</text>
  <text x="610" y="250" fill="#f0f4ff" font-size="12" text-anchor="end">186 行</text>
  <text x="465" y="270" fill="#6b7a9f" font-size="11">图片数量</text>
  <text x="610" y="270" fill="#f0f4ff" font-size="12" text-anchor="end">4 张</text>
  <text x="465" y="290" fill="#6b7a9f" font-size="11">链接数量</text>
  <text x="610" y="290" fill="#f0f4ff" font-size="12" text-anchor="end">2 个</text>

  <!-- Download button -->
  <rect x="450" y="320" width="180" height="40" rx="12" fill="url(#green)"/>
  <text x="540" y="346" fill="#fff" font-size="14" font-weight="700" text-anchor="middle">&#x1F4E5; 下载 HTML</text>
</svg>