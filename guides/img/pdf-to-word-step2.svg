  <rect x="50" y="152" width="580" height="140" rx="10" fill="rgba(10,14,26,0.6)" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <text x="65" y="175" fill="#8899bb" font-size="11">--- 第 1 页 ---</text>
