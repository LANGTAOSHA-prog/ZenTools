<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="'Inter',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b18"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
  </defs>
  <rect width="680" height="400" fill="url(#bg)" rx="14"/>

  <text x="30" y="42" fill="#f0f4ff" font-size="20" font-weight="700">📊 关键词研究</text>
  <text x="30" y="66" fill="#6b7a9f" font-size="13">研究关键词搜索量、竞争程度、CPC和SEO难度数据。</text>

  <rect x="30" y="85" width="620" height="290" fill="rgba(14,22,41,0.8)" rx="14" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

  <text x="50" y="118" fill="#f0f4ff" font-size="15" font-weight="700">搜索关键词</text>
  <text x="50" y="138" fill="#6b7a9f" font-size="12">输入目标关键词，查看搜索量、竞争度和CPC等详细数据。</text>

  <rect x="50" y="152" width="400" height="36" fill="rgba(20,31,55,0.85)" rx="8" stroke="rgba(245,158,11,0.3)" stroke-width="1"/>
  <text x="65" y="175" fill="#8899bb" font-size="13">content marketing</text>
  <rect x="460" y="152" width="120" height="36" fill="url(#accent)" rx="8"/>
  <text x="520" y="175" fill="#fff" font-size="13" font-weight="600" text-anchor="middle">搜索</text>

  <rect x="50" y="205" width="580" height="90" rx="10" fill="rgba(20,31,55,0.6)" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <text x="70" y="228" fill="#f0f4ff" font-size="14" font-weight="700">content marketing</text>
  <rect x="70" y="238" width="80" height="6" fill="rgba(245,158,11,0.3)" rx="3"/>
  <rect x="70" y="238" width="40" height="6" fill="#f59e0b" rx="3"/>
  <text x="160" y="245" fill="#6b7a9f" font-size="11">难度: 中等</text>
  <text x="70" y="265" fill="#6b7a9f" font-size="12">月搜索量: 33,100 | 竞争度: 0.42 | CPC: $12.50</text>
  <text x="70" y="283" fill="#4a5a7a" font-size="11">趋势: ↗ 上升 15% | 搜索意图: 信息型、商业型</text>

  <rect x="50" y="310" width="140" height="32" fill="rgba(34,211,238,0.1)" rx="6" stroke="rgba(34,211,238,0.2)" stroke-width="1"/>
  <text x="120" y="331" fill="#22d3ee" font-size="12" text-anchor="middle">内容营销</text>
  <rect x="200" y="310" width="110" height="32" fill="rgba(139,92,246,0.1)" rx="6" stroke="rgba(139,92,246,0.2)" stroke-width="1"/>
  <text x="255" y="331" fill="#8b5cf6" font-size="12" text-anchor="middle">SEO内容</text>
  <rect x="320" y="310" width="90" height="32" fill="rgba(16,185,129,0.1)" rx="6" stroke="rgba(16,185,129,0.2)" stroke-width="1"/>
  <text x="365" y="331" fill="#10b981" font-size="12" text-anchor="middle">营销策略</text>
  <text x="430" y="331" fill="#4a5a7a" font-size="11">+5 个建议</text>
</svg>
