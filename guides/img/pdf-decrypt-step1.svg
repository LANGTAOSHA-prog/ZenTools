<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="'Inter',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b18"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
  </defs>
  <rect width="680" height="400" fill="url(#bg)" rx="14"/>

  <text x="30" y="42" fill="#f0f4ff" font-size="20" font-weight="700">🔓 PDF 解密</text>
  <text x="30" y="66" fill="#6b7a9f" font-size="13">去除 PDF 文件的密码保护，方便编辑和打印。</text>

  <rect x="30" y="85" width="620" height="290" fill="rgba(14,22,41,0.8)" rx="14" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

  <text x="50" y="118" fill="#f0f4ff" font-size="15" font-weight="700">输入密码解密</text>
  <text x="50" y="138" fill="#6b7a9f" font-size="12">上传加密的 PDF 文件，输入正确密码即可解密。</text>

  <!-- Upload zone -->
  <rect x="50" y="155" width="580" height="80" rx="12" fill="rgba(20,31,55,0.85)" stroke="rgba(59,130,246,0.4)" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="340" y="188" fill="#6b7a9f" font-size="28" text-anchor="middle">🔐</text>
  <text x="340" y="218" fill="#8899bb" font-size="13" text-anchor="middle">点击或拖拽上传加密的 PDF 文件</text>

  <!-- Password input -->
  <rect x="50" y="250" width="580" height="44" rx="10" fill="rgba(10,14,26,0.6)" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  <text x="65" y="276" fill="#6b7a9f" font-size="13">输入密码：</text>
  <rect x="150" y="258" width="200" height="30" rx="6" fill="#0a0e1a" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="160" y="277" fill="#4a5a7a" font-size="11">••••••••</text>

  <!-- Decrypt button -->
  <rect x="380" y="258" width="140" height="30" rx="8" fill="url(#accent)"/>
  <text x="450" y="278" fill="#fff" font-size="13" font-weight="600" text-anchor="middle">解密 PDF</text>

  <text x="340" y="330" fill="#4a5a7a" font-size="11" text-anchor="middle">解密后 PDF 将不再需要密码，可自由查看和编辑</text>
  <text x="340" y="348" fill="#4a5a7a" font-size="11" text-anchor="middle">所有处理在浏览器本地完成，密码不会离开你的电脑</text>
</svg>
