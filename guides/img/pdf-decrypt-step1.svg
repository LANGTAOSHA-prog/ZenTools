<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="'Inter',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b18"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="680" height="400" fill="url(#bg)" rx="14"/>

  <!-- Title -->
  <text x="30" y="42" fill="#f0f4ff" font-size="20" font-weight="700">🔓 PDF 解密</text>
  <text x="30" y="66" fill="#6b7a9f" font-size="13">移除受保护 PDF 文件的密码，方便编辑、打印和分发文档。</text>

  <!-- Tool box -->
  <rect x="30" y="85" width="620" height="290" fill="rgba(14,22,41,0.8)" rx="14" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

  <text x="50" y="118" fill="#f0f4ff" font-size="15" font-weight="700">选择加密 PDF 文件</text>
  <text x="50" y="138" fill="#6b7a9f" font-size="12">选择一个受密码保护的 PDF 文件，输入正确的密码后移除保护。</text>

  <!-- Upload zone -->
  <rect x="50" y="155" width="580" height="90" rx="12" fill="rgba(20,31,55,0.85)" stroke="rgba(59,130,246,0.4)" stroke-width="2" stroke-dasharray="6,4"/>
  
  <text x="340" y="190" fill="#6b7a9f" font-size="30" text-anchor="middle">🔐</text>
  <text x="340" y="218" fill="#8899bb" font-size="13" text-anchor="middle">点击上传或拖拽加密 PDF 文件到此处</text>
  <text x="340" y="236" fill="#4a5a7a" font-size="11" text-anchor="middle">支持 .pdf 格式 · 文件不上传服务器</text>

  <!-- File info bar -->
  <rect x="50" y="258" width="430" height="34" fill="#0a0e1a" rx="8" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="65" y="280" fill="#4a5a7a" font-size="12">已选择：document_encrypted.pdf (2.3 MB)</text>
  <rect x="490" y="258" width="140" height="34" fill="url(#accent)" rx="8"/>
  <text x="560" y="280" fill="#fff" font-size="12" font-weight="600" text-anchor="middle">更换文件</text>

  <!-- Password input -->
  <rect x="50" y="303" width="430" height="36" fill="#0a0e1a" rx="8" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="65" y="326" fill="#6b7a9f" font-size="13">请输入PDF密码</text>
  <!-- Show password hint dots -->
  <circle cx="440" cy="321" r="2" fill="#4a5a7a"/>
  <circle cx="448" cy="321" r="2" fill="#4a5a7a"/>
  <circle cx="456" cy="321" r="2" fill="#4a5a7a"/>

  <!-- Decrypt button (enabled) -->
  <rect x="490" y="303" width="140" height="36" fill="url(#accent)" rx="8"/>
  <text x="560" y="326" fill="#fff" font-size="14" font-weight="600" text-anchor="middle">开始解密</text>

  <!-- Status hint -->
  <text x="340" y="367" fill="#f59e0b" font-size="12" text-anchor="middle">⚠ 请确保您拥有该文件的访问权限</text>
</svg>