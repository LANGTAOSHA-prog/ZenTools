<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="'Inter',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b18"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
  </defs>
  <rect width="680" height="400" fill="url(#bg)" rx="14"/>
  <text x="30" y="42" fill="#f0f4ff" font-size="20" font-weight="700">🔄 格式转换 - 结果</text>
  <text x="30" y="66" fill="#6b7a9f" font-size="13">转换完成，可预览效果并下载转换后的图片。</text>
  <rect x="30" y="85" width="620" height="290" fill="rgba(14,22,41,0.8)" rx="14" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="50" y="118" fill="#f0f4ff" font-size="15" font-weight="700">转换结果</text>
  <rect x="50" y="132" width="270" height="130" rx="10" fill="rgba(20,31,55,0.85)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="185" y="155" fill="#6b7a9f" font-size="12" text-anchor="middle">原始文件</text>
  <rect x="70" y="165" width="230" height="82" rx="6" fill="#0f172a" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <circle cx="185" cy="200" r="20" fill="rgba(59,130,246,0.2)"/>
  <text x="185" y="206" fill="#6b7a9f" font-size="10" text-anchor="middle">photo.png</text>
  <text x="185" y="260" fill="#4a5a7a" font-size="11" text-anchor="middle">2.4 MB</text>
  <rect x="340" y="132" width="290" height="130" rx="10" fill="rgba(20,31,55,0.85)" stroke="#00e5ff" stroke-width="1"/>
  <text x="485" y="155" fill="#00e5ff" font-size="12" text-anchor="middle">转换后</text>
  <rect x="360" y="165" width="250" height="82" rx="6" fill="#0f172a" stroke="rgba(0,229,255,0.15)" stroke-width="1"/>
  <circle cx="485" cy="200" r="20" fill="rgba(0,229,255,0.2)"/>
  <text x="485" y="206" fill="#00e5ff" font-size="10" text-anchor="middle">photo.webp</text>
  <text x="485" y="260" fill="#22c55e" font-size="11" text-anchor="middle">1.1 MB (-54%)</text>
  <rect x="200" y="280" width="280" height="40" rx="999" fill="url(#accent)"/>
  <text x="340" y="305" fill="#fff" font-size="15" font-weight="700" text-anchor="middle">⬇ 下载转换后的图片</text>
  <text x="340" y="340" fill="#4a5a7a" font-size="11" text-anchor="middle">支持 JPG ↔ PNG ↔ WebP 互转</text>
</svg>
