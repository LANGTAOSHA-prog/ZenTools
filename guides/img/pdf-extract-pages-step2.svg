<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="'Inter',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b18"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="success" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
  </defs>
  <rect width="680" height="400" fill="url(#bg)" rx="14"/>

  <!-- Title -->
  <text x="30" y="42" fill="#f0f4ff" font-size="20" font-weight="700">📄 PDF 提取页面</text>
  <text x="30" y="66" fill="#6b7a9f" font-size="13">提取结果预览，确认后可下载独立的 PDF 文件。</text>

  <!-- Tool box -->
  <rect x="30" y="85" width="620" height="290" fill="rgba(14,22,41,0.8)" rx="14" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

  <!-- Success banner -->
  <rect x="50" y="105" width="580" height="34" fill="rgba(34,197,94,0.12)" rx="8" stroke="rgba(34,197,94,0.25)" stroke-width="1"/>
  <text x="60" y="126" fill="#4ade80" font-size="13">&#10003; 已成功提取 2 页，生成 1 个独立 PDF 文件</text>

  <!-- Extracted file info -->
  <rect x="50" y="152" width="580" height="60" fill="#0e1629" rx="10" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <rect x="65" y="165" width="34" height="34" fill="#2a3a5c" rx="6"/>
  <text x="82" y="187" fill="#fff" font-size="14" font-weight="700" text-anchor="middle">PDF</text>
  <text x="110" y="178" fill="#d0d8f0" font-size="13" font-weight="600">项目报告_2026_提取页.pdf</text>
  <text x="110" y="196" fill="#6b7a9f" font-size="11">2 页 · 约 1.2 MB</text>
  <rect x="510" y="165" width="106" height="32" fill="url(#success)" rx="8"/>
  <text x="563" y="186" fill="#fff" font-size="13" font-weight="600" text-anchor="middle">下载文件</text>

  <!-- Extracted page preview -->
  <text x="50" y="240" fill="#f0f4ff" font-size="13" font-weight="600">提取内容预览</text>

  <!-- Preview of extracted page 1 -->
  <rect x="50" y="255" width="62" height="85" fill="#1e293b" rx="6" stroke="rgba(59,130,246,0.5)" stroke-width="1.5"/>
  <rect x="55" y="268" width="52" height="67" fill="#2a3a5c" rx="3"/>
  <line x1="60" y1="280" x2="102" y2="280" stroke="#5a7aac" stroke-width="2.5" opacity="0.5"/>
  <line x1="60" y1="290" x2="95" y2="290" stroke="#5a7aac" stroke-width="2" opacity="0.4"/>
  <line x1="60" y1="298" x2="98" y2="298" stroke="#5a7aac" stroke-width="2" opacity="0.3"/>
  <text x="81" y="350" fill="#f0f4ff" font-size="10" text-anchor="middle">第 1 页</text>

  <!-- Preview of extracted page 2 -->
  <rect x="124" y="255" width="62" height="85" fill="#1e293b" rx="6" stroke="rgba(59,130,246,0.5)" stroke-width="1.5"/>
  <rect x="129" y="268" width="52" height="67" fill="#2a3a5c" rx="3"/>
  <line x1="134" y1="280" x2="176" y2="280" stroke="#5a7aac" stroke-width="2.5" opacity="0.5"/>
  <line x1="134" y1="290" x2="169" y2="290" stroke="#5a7aac" stroke-width="2" opacity="0.4"/>
  <line x1="134" y1="298" x2="172" y2="298" stroke="#5a7aac" stroke-width="2" opacity="0.3"/>
  <text x="155" y="350" fill="#f0f4ff" font-size="10" text-anchor="middle">第 2 页</text>

  <!-- Download success note -->
  <rect x="50" y="370" width="580" height="1" fill="rgba(255,255,255,0.06)"/>

  <!-- Back to extract button -->
  <rect x="50" y="380" width="130" height="30" fill="rgba(255,255,255,0.06)" rx="999" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="115" y="400" fill="#8899bb" font-size="12" text-anchor="middle">&#8592; 返回提取</text>

  <!-- View all pages link -->
  <rect x="470" y="380" width="160" height="30" fill="rgba(59,130,246,0.15)" rx="999" stroke="rgba(59,130,246,0.3)" stroke-width="1"/>
  <text x="550" y="400" fill="#60a5fa" font-size="12" text-anchor="middle">提取更多页面 &#8594;</text>
</svg>