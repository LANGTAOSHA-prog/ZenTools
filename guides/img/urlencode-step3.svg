<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="'Inter',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b18"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="680" height="400" fill="url(#bg)" rx="14"/>

  <text x="30" y="42" fill="#f0f4ff" font-size="20" font-weight="700">URL编码解码</text>
  <text x="30" y="66" fill="#6b7a9f" font-size="13">对文本进行 URL 编码或解码，方便处理网址参数。</text>
  <rect x="30" y="85" width="620" height="295" fill="rgba(14,22,41,0.8)" rx="14" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <rect x="50" y="105" width="580" height="120" rx="10" fill="#0a0e1a" stroke="rgba(16,185,129,0.4)" stroke-width="1"/>
  <text x="65" y="130" fill="#34d399" font-size="12">https://example.com/search?q=%E6%90%9C%E7%B4%A2%E5%85%B3%E9%94%AE%E8%AF%8D</text>
  <text x="65" y="155" fill="#34d399" font-size="12">Hello%20World%20%26%20%E4%BD%A0%E5%A5%BD</text>
  <rect x="50" y="245" width="100" height="38" fill="url(#accent)" stroke="rgba(16,185,129,0.4)" stroke-width="2" rx="10"/>
  <text x="100" y="270" fill="#fff" font-size="13" font-weight="600" text-anchor="middle">编码</text>
  <rect x="165" y="245" width="100" height="38" stroke="rgba(255,255,255,0.08)" stroke-width="1" rx="10" fill="rgba(255,255,255,0.03)"/>
  <text x="215" y="270" fill="#8899bb" font-size="13" font-weight="600" text-anchor="middle">解码</text>
  <rect x="280" y="245" width="100" height="38" stroke="rgba(255,255,255,0.08)" stroke-width="1" rx="10" fill="rgba(255,255,255,0.03)"/>
  <text x="330" y="270" fill="#8899bb" font-size="13" font-weight="600" text-anchor="middle">复制</text>
  <rect x="395" y="245" width="100" height="38" stroke="rgba(255,255,255,0.08)" stroke-width="1" rx="10" fill="rgba(255,255,255,0.03)"/>
  <text x="445" y="270" fill="#8899bb" font-size="13" font-weight="600" text-anchor="middle">清空</text>
  <rect x="50" y="305" width="580" height="28" rx="8" fill="rgba(16,185,129,0.1)"/>
  <text x="340" y="324" fill="#34d399" font-size="12" text-anchor="middle">编码完成</text>

</svg>