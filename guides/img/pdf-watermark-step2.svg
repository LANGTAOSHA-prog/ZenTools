<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="'Inter',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b18"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="680" height="400" fill="url(#bg)" rx="14"/>

  <text x="30" y="42" fill="#f0f4ff" font-size="20" font-weight="700">💧 PDF 水印</text>
  <text x="30" y="66" fill="#6b7a9f" font-size="13">预览并下载添加了水印的 PDF 文件。</text>

  <rect x="30" y="85" width="620" height="290" fill="rgba(14,22,41,0.8)" rx="14" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

  <text x="50" y="118" fill="#f0f4ff" font-size="15" font-weight="700">预览效果</text>
  <text x="50" y="138" fill="#6b7a9f" font-size="12">水印已成功添加到 PDF 文档中，查看效果后下载。</text>

  <!-- PDF preview area -->
  <rect x="50" y="155" width="400" height="210" rx="10" fill="#f8f9fc" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

  <!-- Simulated PDF content -->
  <text x="70" y="185" fill="#1e293b" font-size="9" font-weight="700">项目实施方案报告</text>
  <line x1="70" y1="192" x2="350" y2="192" stroke="#e2e8f0" stroke-width="1"/>

  <text x="70" y="208" fill="#475569" font-size="8">一、项目概述</text>
  <text x="70" y="222" fill="#64748b" font-size="7">本项目旨在通过系统化实施方案，推进企业</text>
  <text x="70" y="234" fill="#64748b" font-size="7">数字化转型。涵盖需求分析、方案设计、</text>
  <text x="70" y="246" fill="#64748b" font-size="7">系统开发与上线部署等关键阶段。</text>

  <text x="70" y="264" fill="#475569" font-size="8">二、实施计划</text>
  <text x="70" y="278" fill="#64748b" font-size="7">1. 第一阶段：需求调研与确认（2周）</text>
  <text x="70" y="290" fill="#64748b" font-size="7">2. 第二阶段：系统设计与评审（3周）</text>
  <text x="70" y="302" fill="#64748b" font-size="7">3. 第三阶段：开发与单元测试（4周）</text>

  <text x="70" y="320" fill="#475569" font-size="8">三、质量保障</text>
  <text x="70" y="334" fill="#64748b" font-size="7">建立全过程质量监控机制，确保交付成果</text>
  <text x="70" y="346" fill="#64748b" font-size="7">符合预期标准，并通过多轮测试验证。</text>

  <!-- Watermark tiles overlay -->
  <g opacity="0.2" fill="#ef4444" font-size="28" font-weight="900" transform="rotate(-30, 250, 260)">
    <text x="60" y="180">机密文件</text>
    <text x="60" y="230">机密文件</text>
    <text x="60" y="280">机密文件</text>
    <text x="60" y="330">机密文件</text>
  </g>

  <!-- Right panel: settings summary -->
  <rect x="465" y="155" width="170" height="210" rx="10" fill="rgba(10,14,26,0.5)" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>

  <text x="480" y="178" fill="#f0f4ff" font-size="13" font-weight="700">水印参数</text>

  <text x="480" y="200" fill="#6b7a9f" font-size="11">文字</text>
  <text x="480" y="216" fill="#8899bb" font-size="11" font-weight="600">机密文件</text>

  <text x="480" y="240" fill="#6b7a9f" font-size="11">透明度</text>
  <text x="480" y="256" fill="#8899bb" font-size="11" font-weight="600">30%</text>

  <text x="480" y="276" fill="#6b7a9f" font-size="11">位置</text>
  <text x="480" y="292" fill="#8899bb" font-size="11" font-weight="600">平铺</text>

  <text x="480" y="312" fill="#6b7a9f" font-size="11">颜色</text>
  <rect x="480" y="319" width="14" height="14" rx="3" fill="#ef4444"/>

  <text x="504" y="332" fill="#6b7a9f" font-size="11">角度</text>
  <text x="540" y="332" fill="#8899bb" font-size="11" font-weight="600">-30°</text>

  <!-- Download button -->
  <rect x="465" y="345" width="170" height="34" rx="8" fill="url(#accent)"/>
  <text x="550" y="367" fill="#fff" font-size="13" font-weight="600" text-anchor="middle">⬇ 下载文件</text>
</svg>
