<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="'Inter',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b18"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="680" height="400" fill="url(#bg)" rx="14"/>

  <text x="30" y="42" fill="#f0f4ff" font-size="20" font-weight="700">📈 投资计算器</text>
  <text x="30" y="66" fill="#6b7a9f" font-size="13">步骤 2：输入投资参数</text>

  <rect x="30" y="85" width="620" height="290" fill="rgba(14,22,41,0.8)" rx="14" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

  <text x="50" y="118" fill="#f0f4ff" font-size="15" font-weight="700">输入参数</text>
  <text x="50" y="138" fill="#6b7a9f" font-size="12">填写初始投资金额、预期收益率和投资期限。</text>

  <rect x="50" y="155" width="270" height="36" fill="#0a0e1a" rx="8" stroke="rgba(59,130,246,0.4)" stroke-width="1.5"/>
  <text x="65" y="178" fill="#8899bb" font-size="13">初始投资: <tspan fill="#f0f4ff">100,000</tspan></text>

  <rect x="340" y="155" width="270" height="36" fill="#0a0e1a" rx="8" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="355" y="178" fill="#8899bb" font-size="13">预期收益率 (%): <tspan fill="#f0f4ff">8</tspan></text>

  <rect x="50" y="203" width="270" height="36" fill="#0a0e1a" rx="8" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="65" y="226" fill="#8899bb" font-size="13">投资期限 (年): <tspan fill="#f0f4ff">10</tspan></text>

  <rect x="340" y="203" width="270" height="36" fill="#0a0e1a" rx="8" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="355" y="226" fill="#8899bb" font-size="13">每月定投 (元): <tspan fill="#f0f4ff">2,000</tspan></text>

  <rect x="50" y="257" width="580" height="48" fill="#0f1a35" rx="10" stroke="rgba(0,229,255,0.12)" stroke-width="1"/>
  <text x="70" y="276" fill="#6b7a9f" font-size="12">投资期限越长，复利效应越显著。10年期每月定投2000元，年化8%可带来可观的复利收益。</text>
  <text x="70" y="294" fill="#4a5a7a" font-size="11">建议根据自身风险承受能力和财务目标合理设定参数。</text>

  <rect x="50" y="320" width="580" height="36" fill="url(#accent)" rx="999"/>
  <text x="340" y="342" fill="#fff" font-size="14" font-weight="600" text-anchor="middle">计算收益</text>
</svg>
