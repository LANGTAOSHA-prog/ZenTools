<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="'Inter',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b18"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="680" height="400" fill="url(#bg)" rx="14"/>

  <!-- Title -->
  <text x="30" y="42" fill="#f0f4ff" font-size="20" font-weight="700">✂️ PDF 拆分</text>
  <text x="30" y="66" fill="#6b7a9f" font-size="13">将 PDF 文件按页面范围拆分，提取指定页面或分成多个独立文件。</text>

  <!-- Tool box -->
  <rect x="30" y="85" width="620" height="290" fill="rgba(14,22,41,0.8)" rx="14" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

  <text x="50" y="118" fill="#f0f4ff" font-size="15" font-weight="700">拆分页面</text>
  <text x="50" y="138" fill="#6b7a9f" font-size="12">选择 PDF 文件，指定要提取的页面范围。</text>

  <!-- Upload zone -->
  <rect x="50" y="155" width="580" height="100" rx="12" fill="rgba(20,31,55,0.85)" stroke="rgba(59,130,246,0.4)" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="340" y="195" fill="#6b7a9f" font-size="36" text-anchor="middle">📄</text>
  <text x="340" y="225" fill="#8899bb" font-size="13" text-anchor="middle">点击或拖拽上传 PDF 文件</text>
  <text x="340" y="245" fill="#4a5a7a" font-size="11" text-anchor="middle">支持 .pdf 文件</text>

  <!-- Page range input -->
  <rect x="50" y="272" width="580" height="44" rx="10" fill="rgba(10,14,26,0.6)" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  <text x="65" y="298" fill="#6b7a9f" font-size="13">页面范围：</text>
  <rect x="140" y="278" width="100" height="32" rx="8" fill="#0a0e1a" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <text x="190" y="298" fill="#4a5a7a" font-size="12" text-anchor="middle">1-5</text>
  <text x="250" y="298" fill="#4a5a7a" font-size="12">（如 1-5 或 1,3,5）</text>

  <!-- Split button -->
  <rect x="380" y="278" width="140" height="32" fill="url(#accent)" rx="8"/>
  <text x="450" y="298" fill="#fff" font-size="13" font-weight="600" text-anchor="middle">开始拆分</text>

  <!-- Arrow -->
  <text x="640" y="185" fill="#3b82f6" font-size="22">👆</text>
</svg>
