<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="'Inter',-apple-system,'PingFang SC','Microsoft YaHei',monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b18"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="680" height="400" fill="url(#bg)" rx="14"/>
  <text x="30" y="42" fill="#f0f4ff" font-size="20" font-weight="700">📋 文本对比 - 结果</text>
  <text x="30" y="66" fill="#6b7a9f" font-size="13">对比完成，新增、删除和修改内容已用不同颜色高亮标注。</text>
  <rect x="30" y="85" width="620" height="290" fill="rgba(14,22,41,0.8)" rx="14" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="50" y="118" fill="#f0f4ff" font-size="15" font-weight="700">📋 对比结果</text>
  <!-- Stats -->
  <rect x="60" y="130" width="80" height="26" rx="6" fill="rgba(34,197,94,0.12)" stroke="rgba(34,197,94,0.2)" stroke-width="1"/>
  <text x="100" y="147" fill="#22c55e" font-size="11" text-anchor="middle">+1 新增</text>
  <rect x="150" y="130" width="80" height="26" rx="6" fill="rgba(244,63,94,0.12)" stroke="rgba(244,63,94,0.2)" stroke-width="1"/>
  <text x="190" y="147" fill="#f43f5e" font-size="11" text-anchor="middle">-1 删除</text>
  <rect x="240" y="130" width="80" height="26" rx="6" fill="rgba(251,191,36,0.12)" stroke="rgba(251,191,36,0.2)" stroke-width="1"/>
  <text x="280" y="147" fill="#fbbf24" font-size="11" text-anchor="middle">~1 修改</text>
  <!-- Left panel -->
  <rect x="50" y="168" width="270" height="140" fill="#0a0e1a" rx="8" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <rect x="50" y="168" width="270" height="26" rx="8" fill="rgba(239,68,68,0.08)"/>
  <text x="185" y="186" fill="#f43f5e" font-size="11" text-anchor="middle">原始文本</text>
  <text x="62" y="212" fill="#6b7a9f" font-size="12">今天天气很好</text>
  <text x="62" y="232" fill="#6b7a9f" font-size="12">适合出去<tspan fill="#f43f5e" text-decoration="line-through">散步</tspan></text>
  <text x="62" y="255" fill="#4a5a7a" font-size="10">共 12 个字符</text>
  <!-- Right panel -->
  <rect x="340" y="168" width="290" height="140" fill="#0a0e1a" rx="8" stroke="#10b981" stroke-width="1"/>
  <rect x="340" y="168" width="290" height="26" rx="8" fill="rgba(16,185,129,0.08)"/>
  <text x="485" y="186" fill="#10b981" font-size="11" text-anchor="middle">新文本</text>
  <text x="352" y="212" fill="#6b7a9f" font-size="12">今天天气<tspan fill="#22c55e">非常</tspan>好</text>
  <text x="352" y="232" fill="#6b7a9f" font-size="12">适合出去<tspan fill="#22c55e">跑步</tspan></text>
  <text x="352" y="255" fill="#4a5a7a" font-size="10">共 15 个字符 (+3)</text>
  <!-- Copy result -->
  <rect x="200" y="325" width="280" height="36" rx="999" fill="url(#accent)"/>
  <text x="340" y="348" fill="#fff" font-size="14" font-weight="700" text-anchor="middle">📋 复制对比结果</text>
</svg>
