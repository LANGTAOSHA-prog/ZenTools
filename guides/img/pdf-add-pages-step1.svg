<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="'Inter',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b18"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="greenAccent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
  </defs>
  <rect width="680" height="400" fill="url(#bg)" rx="14"/>

  <!-- Title -->
  <text x="30" y="42" fill="#f0f4ff" font-size="20" font-weight="700">📄 PDF 添加页面</text>
  <text x="30" y="66" fill="#6b7a9f" font-size="13">为 PDF 文档插入新的空白页面，自由调整插入位置。</text>

  <!-- Tool box -->
  <rect x="30" y="85" width="620" height="290" fill="rgba(14,22,41,0.8)" rx="14" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

  <text x="50" y="118" fill="#f0f4ff" font-size="15" font-weight="700">已上传：项目方案_v2.pdf</text>
  <text x="340" y="118" fill="#6b7a9f" font-size="11" text-anchor="end">12 页 · 3.6 MB</text>

  <!-- Page thumbnails list -->
  <!-- Page 1 -->
  <rect x="50" y="132" width="56" height="72" fill="#0e1629" rx="4" stroke="rgba(59,130,246,0.5)" stroke-width="1.5"/>
  <rect x="54" y="136" width="48" height="64" fill="#1a2340" rx="2"/>
  <line x1="60" y1="154" x2="96" y2="154" stroke="#2a3a5a" stroke-width="2"/>
  <line x1="60" y1="164" x2="92" y2="164" stroke="#2a3a5a" stroke-width="2"/>
  <line x1="60" y1="174" x2="88" y2="174" stroke="#2a3a5a" stroke-width="2"/>
  <text x="78" y="216" fill="#6b7a9f" font-size="9" text-anchor="middle">1</text>

  <!-- Page 2 -->
  <rect x="112" y="132" width="56" height="72" fill="#0e1629" rx="4" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <rect x="116" y="136" width="48" height="64" fill="#1a2340" rx="2"/>
  <line x1="122" y1="154" x2="158" y2="154" stroke="#2a3a5a" stroke-width="2"/>
  <line x1="122" y1="164" x2="154" y2="164" stroke="#2a3a5a" stroke-width="2"/>
  <line x1="122" y1="174" x2="150" y2="174" stroke="#2a3a5a" stroke-width="2"/>
  <text x="140" y="216" fill="#6b7a9f" font-size="9" text-anchor="middle">2</text>

  <!-- Page 3 -->
  <rect x="174" y="132" width="56" height="72" fill="#0e1629" rx="4" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <rect x="178" y="136" width="48" height="64" fill="#1a2340" rx="2"/>
  <line x1="184" y1="154" x2="220" y2="154" stroke="#2a3a5a" stroke-width="2"/>
  <line x1="184" y1="164" x2="216" y2="164" stroke="#2a3a5a" stroke-width="2"/>
  <line x1="184" y1="174" x2="212" y2="174" stroke="#2a3a5a" stroke-width="2"/>
  <text x="202" y="216" fill="#6b7a9f" font-size="9" text-anchor="middle">3</text>

  <!-- Page 4 -->
  <rect x="236" y="132" width="56" height="72" fill="#0e1629" rx="4" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <rect x="240" y="136" width="48" height="64" fill="#1a2340" rx="2"/>
  <line x1="246" y1="154" x2="282" y2="154" stroke="#2a3a5a" stroke-width="2"/>
  <line x1="246" y1="164" x2="278" y2="164" stroke="#2a3a5a" stroke-width="2"/>
  <line x1="246" y1="174" x2="274" y2="174" stroke="#2a3a5a" stroke-width="2"/>
  <text x="264" y="216" fill="#6b7a9f" font-size="9" text-anchor="middle">4</text>

  <!-- Page 5 -->
  <rect x="298" y="132" width="56" height="72" fill="#0e1629" rx="4" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <rect x="302" y="136" width="48" height="64" fill="#1a2340" rx="2"/>
  <line x1="308" y1="154" x2="344" y2="154" stroke="#2a3a5a" stroke-width="2"/>
  <line x1="308" y1="164" x2="340" y2="164" stroke="#2a3a5a" stroke-width="2"/>
  <line x1="308" y1="174" x2="336" y2="174" stroke="#2a3a5a" stroke-width="2"/>
  <text x="326" y="216" fill="#6b7a9f" font-size="9" text-anchor="middle">5</text>

  <!-- Page 6 -->
  <rect x="360" y="132" width="56" height="72" fill="#0e1629" rx="4" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <rect x="364" y="136" width="48" height="64" fill="#1a2340" rx="2"/>
  <line x1="370" y1="154" x2="406" y2="154" stroke="#2a3a5a" stroke-width="2"/>
  <line x1="370" y1="164" x2="402" y2="164" stroke="#2a3a5a" stroke-width="2"/>
  <line x1="370" y1="174" x2="398" y2="174" stroke="#2a3a5a" stroke-width="2"/>
  <text x="388" y="216" fill="#6b7a9f" font-size="9" text-anchor="middle">6</text>

  <!-- More pages indicator -->
  <text x="438" y="172" fill="#4a5a7a" font-size="16" text-anchor="middle">...</text>
  <text x="438" y="190" fill="#4a5a7a" font-size="9" text-anchor="middle">+6 页</text>

  <!-- Insertion controls section -->
  <rect x="50" y="230" width="580" height="1" fill="rgba(255,255,255,0.06)"/>

  <!-- Insert position label -->
  <text x="50" y="260" fill="#f0f4ff" font-size="13" font-weight="600">插入位置</text>

  <!-- Position selector -->
  <rect x="50" y="272" width="180" height="34" fill="#0a0e1a" rx="8" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="66" y="294" fill="#8899bb" font-size="12">在第 3 页之后</text>
  <text x="214" y="294" fill="#4a5a7a" font-size="10">▼</text>

  <!-- Page size selector -->
  <text x="260" y="260" fill="#f0f4ff" font-size="13" font-weight="600">页面尺寸</text>
  <rect x="260" y="272" width="140" height="34" fill="#0a0e1a" rx="8" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="276" y="294" fill="#8899bb" font-size="12">A4 (210×297mm)</text>
  <text x="384" y="294" fill="#4a5a7a" font-size="10">▼</text>

  <!-- Number of pages -->
  <text x="430" y="260" fill="#f0f4ff" font-size="13" font-weight="600">添加页数</text>
  <rect x="430" y="272" width="56" height="34" fill="#0a0e1a" rx="8" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="458" y="294" fill="#f0f4ff" font-size="12" text-anchor="middle">1</text>

  <!-- Add blank page button -->
  <rect x="50" y="318" width="220" height="40" fill="url(#accent)" rx="999"/>
  <text x="160" y="343" fill="#fff" font-size="14" font-weight="700" text-anchor="middle">+ 添加空白页</text>

  <!-- Download button (disabled) -->
  <rect x="290" y="318" width="180" height="40" fill="#1e293b" rx="999" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <text x="380" y="343" fill="#4a5a7a" font-size="14" font-weight="600" text-anchor="middle">下载 PDF</text>

  <!-- Reset -->
  <text x="490" y="343" fill="#4a5a7a" font-size="12" text-anchor="middle">↻ 重置</text>
</svg>