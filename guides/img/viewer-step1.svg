<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="'Inter',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b18"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="680" height="400" fill="url(#bg)" rx="14"/>
  <text x="30" y="42" fill="#f0f4ff" font-size="20" font-weight="700">代码查看器</text>
  <text x="30" y="66" fill="#6b7a9f" font-size="13">在线预览 JSON、XML、CSV、日志等文件，支持树形展开。</text>
  <rect x="30" y="85" width="620" height="290" fill="rgba(14,22,41,0.8)" rx="14" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="50" y="118" fill="#f0f4ff" font-size="15" font-weight="700">文件预览</text>
  <rect x="50" y="135" width="580" height="220" fill="#0a0e1a" rx="8" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <rect x="50" y="135" width="580" height="28" fill="rgba(255,255,255,0.03)" rx="8"/>
  <text x="65" y="153" fill="#4a5a7a" font-size="10" font-weight="600">data.json</text>
  <text x="65" y="185" fill="#a78bfa" font-size="11" font-family="'JetBrains Mono',monospace">&#9662; users</text>
  <text x="90" y="205" fill="#3b82f6" font-size="10" font-family="'JetBrains Mono',monospace">0: { ... }</text>
  <text x="90" y="223" fill="#3b82f6" font-size="10" font-family="'JetBrains Mono',monospace">1: { ... }</text>
  <text x="90" y="241" fill="#3b82f6" font-size="10" font-family="'JetBrains Mono',monospace">2: { ... }</text>
  <text x="65" y="265" fill="#a78bfa" font-size="11" font-family="'JetBrains Mono',monospace">&#9662; meta</text>
  <text x="90" y="283" fill="#22c55e" font-size="10" font-family="'JetBrains Mono',monospace">total: 3</text>
  <text x="90" y="301" fill="#22c55e" font-size="10" font-family="'JetBrains Mono',monospace">page: 1</text>
  <rect x="50" y="315" width="580" height="40" fill="rgba(255,255,255,0.02)" rx="8"/>
  <rect x="65" y="328" width="80" height="16" fill="url(#accent)" rx="4"/>
  <text x="105" y="340" fill="#fff" font-size="9" text-anchor="middle">JSON</text>
  <rect x="155" y="328" width="70" height="16" fill="rgba(255,255,255,0.08)" rx="4"/>
  <text x="190" y="340" fill="#94a3b8" font-size="9" text-anchor="middle">XML</text>
  <rect x="235" y="328" width="70" height="16" fill="rgba(255,255,255,0.08)" rx="4"/>
  <text x="270" y="340" fill="#94a3b8" font-size="9" text-anchor="middle">CSV</text>
  <rect x="315" y="328" width="70" height="16" fill="rgba(255,255,255,0.08)" rx="4"/>
  <text x="350" y="340" fill="#94a3b8" font-size="9" text-anchor="middle">LOG</text>
</svg>
