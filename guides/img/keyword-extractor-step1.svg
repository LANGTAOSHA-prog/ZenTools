<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="'Inter',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b18"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>
  <rect width="680" height="400" fill="url(#bg)" rx="14"/>

  <text x="30" y="42" fill="#f0f4ff" font-size="20" font-weight="700">🔑 关键词提取</text>
  <text x="30" y="66" fill="#6b7a9f" font-size="13">从文章内容中自动提取核心关键词和短语，支持中英文分析。</text>

  <rect x="30" y="85" width="620" height="290" fill="rgba(14,22,41,0.8)" rx="14" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

  <text x="50" y="118" fill="#f0f4ff" font-size="15" font-weight="700">输入文本内容</text>
  <text x="50" y="138" fill="#6b7a9f" font-size="12">输入文章、产品描述或任何文本，自动提取核心关键词。</text>

  <rect x="50" y="155" width="580" height="85" rx="10" fill="rgba(20,31,55,0.85)" stroke="rgba(16,185,129,0.3)" stroke-width="1"/>
  <text x="70" y="180" fill="#8899bb" font-size="13">人工智能正在改变数字营销的格局。从自动化广告投放</text>
  <text x="70" y="198" fill="#8899bb" font-size="13">到个性化内容推荐，AI技术帮助营销人员更精准地触达</text>
  <text x="70" y="216" fill="#8899bb" font-size="13">目标受众。关键词提取是SEO优化的基础步骤之一...</text>

  <rect x="50" y="255" width="160" height="36" fill="url(#accent)" rx="8"/>
  <text x="130" y="278" fill="#fff" font-size="13" font-weight="600" text-anchor="middle">提取关键词</text>

  <rect x="50" y="305" width="580" height="65" rx="10" fill="rgba(20,31,55,0.6)" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <rect x="65" y="318" width="80" height="28" fill="rgba(16,185,129,0.2)" rx="6"/>
  <text x="105" y="337" fill="#10b981" font-size="11" text-anchor="middle">人工智能</text>
  <rect x="155" y="318" width="70" height="28" fill="rgba(16,185,129,0.2)" rx="6"/>
  <text x="190" y="337" fill="#10b981" font-size="11" text-anchor="middle">数字营销</text>
  <rect x="235" y="318" width="80" height="28" fill="rgba(99,102,241,0.2)" rx="6"/>
  <text x="275" y="337" fill="#6366f1" font-size="11" text-anchor="middle">内容推荐</text>
  <rect x="325" y="318" width="50" height="28" fill="rgba(99,102,241,0.2)" rx="6"/>
  <text x="350" y="337" fill="#6366f1" font-size="11" text-anchor="middle">SEO</text>
  <rect x="385" y="318" width="60" height="28" fill="rgba(99,102,241,0.15)" rx="6"/>
  <text x="415" y="337" fill="#6366f1" font-size="11" text-anchor="middle">优化</text>
  <text x="496" y="337" fill="#4a5a7a" font-size="11">+ 8 个关键词</text>
</svg>
