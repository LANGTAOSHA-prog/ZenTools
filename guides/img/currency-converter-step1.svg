<svg width="680" height="400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#070b18;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="680" height="400" fill="url(#bgGrad)"/>
  
  <!-- Header -->
  <text x="340" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#ffffff">货币转换器</text>
  <text x="340" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#94a3b8">Currency Converter</text>
  
  <!-- Interface Mockup -->
  <rect x="50" y="100" width="580" height="240" rx="12" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  
  <!-- From Amount -->
  <text x="80" y="145" font-family="Arial, sans-serif" font-size="14" fill="#cbd5e1">From Amount</text>
  <rect x="80" y="160" width="200" height="40" rx="6" fill="#0f172a" stroke="#475569"/>
  <text x="180" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#ffffff">1 USD</text>
  
  <!-- To Currency -->
  <text x="80" y="240" font-family="Arial, sans-serif" font-size="14" fill="#cbd5e1">To Currency</text>
  <rect x="80" y="255" width="200" height="40" rx="6" fill="#0f172a" stroke="#475569"/>
  <text x="180" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#ffffff">JPY ▼</text>
  
  <!-- Exchange Rate Card -->
  <rect x="320" y="160" width="240" height="100" rx="8" fill="#0ea5e9" opacity="0.2" stroke="#0ea5e9"/>
  <text x="440" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#7dd3fc">Current Rate</text>
  <text x="440" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#ffffff">148.52</text>
  <text x="440" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#7dd3fc">USD = JPY</text>
  
  <!-- Real-time Badge -->
  <rect x="500" y="110" width="110" height="24" rx="12" fill="#10b981"/>
  <text x="555" y="126" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#ffffff">实时汇率</text>
  
  <!-- Result Box -->
  <rect x="80" y="285" width="480" height="45" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="100" y="312" font-family="Arial, sans-serif" font-size="14" fill="#94a3b8">Result:</text>
  <text x="440" y="312" text-anchor="end" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#10b981">148.52 JPY</text>
  
  <!-- Update Time -->
  <text x="80" y="355" font-family="Arial, sans-serif" font-size="11" fill="#64748b">Last updated: Just now</text>
</svg>
