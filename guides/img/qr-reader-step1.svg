<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" font-family="'Inter',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b18"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="680" height="380" fill="url(#bg)" rx="14"/>
  <text x="30" y="42" fill="#f0f4ff" font-size="20" font-weight="700">📱 二维码识别</text>
  <text x="30" y="66" fill="#6b7a9f" font-size="13">识别图片中的二维码，提取 URL、文本或联系方式。</text>
  <rect x="30" y="85" width="620" height="275" fill="rgba(14,22,41,0.8)" rx="14" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="50" y="118" fill="#f0f4ff" font-size="15" font-weight="700">识别结果</text>
  <!-- Upload zone -->
  <rect x="50" y="135" width="280" height="200" rx="12" fill="rgba(20,31,55,0.85)" stroke="rgba(59,130,246,0.4)" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="190" y="195" fill="#6b7a9f" font-size="32" text-anchor="middle">📱</text>
  <text x="190" y="225" fill="#8899bb" font-size="13" text-anchor="middle">点击上传含二维码的图片</text>
  <text x="190" y="245" fill="#4a5a7a" font-size="11" text-anchor="middle">支持 JPG、PNG、截图等</text>
  <rect x="110" y="268" width="160" height="34" fill="url(#accent)" rx="8"/>
  <text x="190" y="290" fill="#fff" font-size="12" font-weight="600" text-anchor="middle">选择文件</text>
  <!-- QR result -->
  <rect x="350" y="135" width="280" height="200" rx="12" fill="rgba(20,31,55,0.85)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="490" y="160" fill="#f0f4ff" font-size="13" font-weight="600" text-anchor="middle">识别结果</text>
  <line x1="365" y1="172" x2="615" y2="172" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <rect x="365" y="182" width="250" height="100" rx="8" fill="#0a0e1a" stroke="rgba(59,130,246,0.3)" stroke-width="1"/>
  <text x="375" y="205" fill="#10b981" font-size="13" font-weight="600">✓ 识别成功</text>
  <text x="375" y="230" fill="#f0f4ff" font-size="12">https://zentools.xyz/</text>
  <text x="375" y="250" fill="#8899bb" font-size="11">🔗 类型: URL</text>
  <text x="375" y="268" fill="#8899bb" font-size="11">📅 时间: 2026-06-21</text>
  <rect x="365" y="295" width="250" height="30" rx="8" fill="url(#accent)"/>
  <text x="490" y="315" fill="#fff" font-size="11" font-weight="600" text-anchor="middle">📋 复制识别结果</text>
</svg>