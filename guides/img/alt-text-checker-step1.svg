<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="'Inter',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b18"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>
  <rect width="680" height="400" fill="url(#bg)" rx="14"/>

  <text x="30" y="42" fill="#f0f4ff" font-size="20" font-weight="700">Alt文本检测</text>
  <text x="30" y="66" fill="#6b7a9f" font-size="13">检测网页中图片的alt属性，确保所有图片都有替代文本以提升SEO</text>

  <rect x="30" y="85" width="620" height="290" fill="rgba(14,22,41,0.8)" rx="14" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

  <text x="50" y="118" fill="#f0f4ff" font-size="15" font-weight="700">输入网址</text>
  <text x="50" y="138" fill="#6b7a9f" font-size="12">输入网页URL，检测所有图片的alt属性状态</text>

  <rect x="50" y="155" width="580" height="38" fill="#0a0e1a" rx="8" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="65" y="179" fill="#4a5a7a" font-size="13">https://example.com</text>

  <rect x="50" y="210" width="580" height="155" rx="10" fill="rgba(20,31,55,0.85)" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>

  <text x="70" y="236" fill="#06b6d4" font-size="13" font-weight="600">检测结果</text>

  <rect x="70" y="250" width="540" height="24" rx="4" fill="rgba(34,197,94,0.1)"/>
  <text x="82" y="267" fill="#22c55e" font-size="12">logo.png — 已设置 alt="ZenTools 品牌标志"</text>
  <circle cx="78" cy="262" r="3" fill="#22c55e"/>

  <rect x="70" y="280" width="540" height="24" rx="4" fill="rgba(34,197,94,0.1)"/>
  <text x="82" y="297" fill="#22c55e" font-size="12">banner.jpg — 已设置 alt="SEO优化指南横幅"</text>
  <circle cx="78" cy="292" r="3" fill="#22c55e"/>

  <rect x="70" y="310" width="540" height="24" rx="4" fill="rgba(239,68,68,0.1)"/>
  <text x="82" y="327" fill="#ef4444" font-size="12">icon-arrow.svg — 缺少 alt 属性</text>
  <circle cx="78" cy="322" r="3" fill="#ef4444"/>

  <rect x="50" y="335" width="580" height="36" fill="url(#accent)" rx="999"/>
  <text x="340" y="357" fill="#fff" font-size="14" font-weight="600" text-anchor="middle">开始检测</text>
</svg>