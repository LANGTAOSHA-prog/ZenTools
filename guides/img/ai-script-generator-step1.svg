<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="'Inter',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b18"/>
    </linearGradient>
    <linearGradient id="scriptBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
  </defs>
  <rect width="680" height="400" fill="url(#bg)" rx="14"/>
  <text x="30" y="42" fill="#f0f4ff" font-size="20" font-weight="700">🎬 AI 脚本生成器</text>
  <text x="30" y="66" fill="#6b7a9f" font-size="13">使用 AI 生成短视频脚本、播客脚本和演讲稿。</text>
  <rect x="30" y="85" width="620" height="290" fill="rgba(14,22,41,0.8)" rx="14" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  
  <!-- 脚本类型选择 -->
  <rect x="50" y="100" width="180" height="40" rx="8" fill="rgba(245,158,11,0.15)" stroke="rgba(245,158,11,0.3)" stroke-width="1"/>
  <text x="140" y="125" fill="#f59e0b" font-size="12" text-anchor="middle">📱 短视频脚本</text>
  
  <rect x="240" y="100" width="180" height="40" rx="8" fill="rgba(20,31,55,0.9)" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <text x="330" y="125" fill="#94a3b8" font-size="12" text-anchor="middle">🎙️ 播客脚本</text>
  
  <rect x="430" y="100" width="180" height="40" rx="8" fill="rgba(20,31,55,0.9)" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <text x="520" y="125" fill="#94a3b8" font-size="12" text-anchor="middle">🎤 演讲稿</text>
  
  <!-- 输入区域 -->
  <rect x="50" y="155" width="580" height="60" rx="10" fill="rgba(20,31,55,0.9)" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <text x="70" y="180" fill="#f0f4ff" font-size="13">请输入脚本主题：如何用 AI 提升工作效率</text>
  <text x="70" y="200" fill="#4a5a7a" font-size="10">时长：2 分钟 | 风格：轻松活泼</text>
  
  <!-- 生成结果 -->
  <rect x="50" y="230" width="580" height="150" rx="10" fill="rgba(245,158,11,0.08)" stroke="rgba(245,158,11,0.15)" stroke-width="1"/>
  <text x="70" y="255" fill="#f59e0b" font-size="12">生成的脚本内容：</text>
  
  <text x="70" y="280" fill="#f0f4ff" font-size="12" font-weight="600">【开场白】</text>
  <text x="70" y="300" fill="#94a3b8" font-size="11">大家好！今天我们来聊聊如何用 AI 工具提升工作效率...</text>
  
  <text x="70" y="325" fill="#f0f4ff" font-size="12" font-weight="600">【正文内容】</text>
  <text x="70" y="345" fill="#94a3b8" font-size="11">第一个技巧：使用 AI 写作助手快速生成文案...</text>
  
  <text x="70" y="370" fill="#f0f4ff" font-size="12" font-weight="600">【结尾】</text>
  <text x="70" y="390" fill="#94a3b8" font-size="11">感谢观看，记得点赞订阅哦！</text>
</svg>