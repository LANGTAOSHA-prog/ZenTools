<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="'Inter',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b18"/>
    </linearGradient>
    <linearGradient id="seoGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>
  <rect width="680" height="400" fill="url(#bg)" rx="14"/>
  <text x="30" y="42" fill="#f0f4ff" font-size="20" font-weight="700">📝 AI SEO 文章生成器</text>
  <text x="30" y="66" fill="#6b7a9f" font-size="13">使用 AI 生成搜索引擎优化的文章，包含关键词布局和元描述优化。</text>
  <rect x="30" y="85" width="620" height="290" fill="rgba(14,22,41,0.8)" rx="14" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  
  <!-- SEO 分析面板 -->
  <rect x="50" y="100" width="200" height="120" rx="10" fill="rgba(6,182,212,0.08)" stroke="rgba(6,182,212,0.15)" stroke-width="1"/>
  <text x="70" y="125" fill="#06b6d4" font-size="12" font-weight="600">SEO 评分</text>
  <text x="150" y="125" fill="#10b981" font-size="18" font-weight="700">85/100</text>
  <text x="70" y="150" fill="#94a3b8" font-size="11">• 关键词密度：2.3%</text>
  <text x="70" y="170" fill="#94a3b8" font-size="11">• 标题优化：✅</text>
  <text x="70" y="190" fill="#94a3b8" font-size="11">• 元描述：✅</text>
  
  <!-- 关键词建议 -->
  <rect x="270" y="100" width="200" height="120" rx="10" fill="rgba(20,31,55,0.9)" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <text x="290" y="125" fill="#f0f4ff" font-size="12" font-weight="600">关键词建议</text>
  <text x="290" y="145" fill="#06b6d4" font-size="11">• AI 写作工具</text>
  <text x="290" y="165" fill="#06b6d4" font-size="11">• 内容生成</text>
  <text x="290" y="185" fill="#06b6d4" font-size="11">• SEO 优化</text>
  
  <!-- 文章预览 -->
  <rect x="490" y="100" width="160" height="120" rx="10" fill="rgba(20,31,55,0.9)" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <text x="510" y="125" fill="#f0f4ff" font-size="12" font-weight="600">文章预览</text>
  <text x="510" y="145" fill="#94a3b8" font-size="11">标题：10 款最佳 AI 写作工具</text>
  <text x="510" y="165" fill="#94a3b8" font-size="11">字数：1,200 字</text>
  <text x="510" y="185" fill="#94a3b8" font-size="11">阅读时间：5 分钟</text>
  
  <!-- 生成的文章内容 -->
  <rect x="50" y="235" width="580" height="140" rx="10" fill="rgba(20,31,55,0.9)" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <text x="70" y="260" fill="#f0f4ff" font-size="13" font-weight="600">10 款最佳 AI 写作工具推荐（2026 年更新）</text>
  <text x="70" y="285" fill="#94a3b8" font-size="11">在内容创作领域，AI 写作工具已经成为提升效率的利器。本文将为您推荐 10 款最受欢迎的 AI 写作助手...</text>
  <text x="70" y="310" fill="#94a3b8" font-size="11">1. ZenTools AI 写作助手 - 免费在线工具</text>
  <text x="70" y="335" fill="#94a3b8" font-size="11">2. Jasper AI - 专业营销文案生成</text>
  <text x="70" y="360" fill="#94a3b8" font-size="11">3. Copy.ai - 社交媒体内容创作</text>
</svg>