<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="'Inter',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
<defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0f172a"/><stop offset="100%" stop-color="#070b18"/></linearGradient></defs>
<rect width="680" height="400" fill="url(#bg)" rx="14"/>
<text x="30" y="42" fill="#f0f4ff" font-size="20" font-weight="700">🍅 番茄钟</text><text x="30" y="66" fill="#6b7a9f" font-size="13">25分钟专注工作，5分钟休息，提高工作效率。</text>
<rect x="30" y="85" width="620" height="290" fill="rgba(14,22,41,0.8)" rx="14" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
<rect x="240" y="100" width="100" height="28" fill="rgba(59,130,246,0.15)" rx="14"/><text x="290" y="119" fill="#60a5fa" font-size="12" font-weight="600" text-anchor="middle">🍅 工作中</text>
<text x="340" y="180" fill="#00e5ff" font-size="64" font-weight="900" text-anchor="middle" font-family="monospace">18:32</text>
<rect x="200" y="210" width="100" height="38" fill="url(#bg)" rx="8" stroke="rgba(0,229,255,0.3)" stroke-width="2"/><text x="250" y="234" fill="#00e5ff" font-size="13" font-weight="600" text-anchor="middle">▶ 开始</text>
<rect x="310" y="210" width="90" height="38" fill="rgba(255,255,255,0.06)" rx="8"/><text x="355" y="234" fill="#f0f4ff" font-size="13" font-weight="600" text-anchor="middle">⏸️ 暂停</text>
<rect x="410" y="210" width="90" height="38" fill="rgba(255,255,255,0.06)" rx="8"/><text x="455" y="234" fill="#f0f4ff" font-size="13" font-weight="600" text-anchor="middle">↺ 重置</text>
<text x="50" y="280" fill="#6b7a9f" font-size="12">工作: 25 分 | 休息: 5 分</text>
<text x="340" y="310" fill="#6b7a9f" font-size="12" text-anchor="middle">已完成 3 个番茄 🍅🍅🍅</text>
<text x="340" y="365" fill="#f59e0b" font-size="11" text-anchor="middle">💡 时间到会自动切换工作/休息模式并有提示音</text>
