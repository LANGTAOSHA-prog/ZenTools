<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="'Inter',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b18"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="680" height="400" fill="url(#bg)" rx="14"/>
  <text x="30" y="42" fill="#f0f4ff" font-size="20" font-weight="700">🔊 音频增强</text>
  <text x="30" y="66" fill="#6b7a9f" font-size="13">增强音频音质，去除背景噪音，提升清晰度和响度。</text>
  <rect x="30" y="85" width="620" height="290" fill="rgba(14,22,41,0.8)" rx="14" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="50" y="118" fill="#f0f4ff" font-size="15" font-weight="700">设置增强参数</text>
  <rect x="50" y="132" width="280" height="120" rx="10" fill="rgba(10,14,26,0.6)" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  <text x="65" y="155" fill="#f0f4ff" font-size="12" font-weight="600">降噪强度</text>
  <rect x="65" y="165" width="250" height="8" rx="4" fill="rgba(255,255,255,0.05)"/>
  <rect x="65" y="165" width="175" height="8" rx="4" fill="#3b82f6"/>
  <text x="65" y="188" fill="#6b7a9f" font-size="11">中等（70%）</text>
  <text x="280" y="188" fill="#4a5a7a" font-size="10" text-anchor="end">弱 — 强</text>
  <text x="65" y="215" fill="#f0f4ff" font-size="12" font-weight="600">响度增强</text>
  <rect x="65" y="225" width="250" height="8" rx="4" fill="rgba(255,255,255,0.05)"/>
  <rect x="65" y="225" width="200" height="8" rx="4" fill="#8b5cf6"/>
  <text x="65" y="248" fill="#6b7a9f" font-size="11">较强（80%）</text>
  <rect x="345" y="132" width="285" height="120" rx="10" fill="rgba(10,14,26,0.6)" stroke="rgba(0,229,255,0.2)" stroke-width="1"/>
  <text x="360" y="155" fill="#00e5ff" font-size="12" font-weight="600">增强效果预览</text>
  <text x="360" y="178" fill="#8899bb" font-size="11">原始响度：-28 dB</text>
  <text x="360" y="198" fill="#00e5ff" font-size="11">增强后：-16 dB</text>
  <text x="360" y="218" fill="#8899bb" font-size="11">噪音抑制：70%</text>
  <text x="360" y="238" fill="#8899bb" font-size="11">清晰度提升：明显</text>
  <rect x="50" y="260" width="580" height="95" rx="10" fill="rgba(10,14,26,0.6)" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  <text x="65" y="285" fill="#f0f4ff" font-size="12" font-weight="600">波形对比</text>
  <text x="65" y="305" fill="#8899bb" font-size="11">原始波形（含噪音）：</text>
  <g fill="rgba(139,92,246,0.3)">
    <rect x="230" y="292" width="2" height="10" rx="1"/>
    <rect x="235" y="288" width="2" height="18" rx="1"/>
    <rect x="240" y="294" width="2" height="6" rx="1"/>
    <rect x="245" y="286" width="2" height="22" rx="1"/>
    <rect x="250" y="296" width="2" height="4" rx="1"/>
    <rect x="255" y="290" width="2" height="16" rx="1"/>
    <rect x="260" y="284" width="2" height="28" rx="1"/>
    <rect x="265" y="292" width="2" height="10" rx="1"/>
    <rect x="270" y="288" width="2" height="18" rx="1"/>
    <rect x="275" y="294" width="2" height="6" rx="1"/>
    <rect x="280" y="286" width="2" height="22" rx="1"/>
    <rect x="285" y="296" width="2" height="4" rx="1"/>
    <rect x="290" y="290" width="2" height="16" rx="1"/>
    <rect x="295" y="292" width="2" height="10" rx="1"/>
    <rect x="300" y="284" width="2" height="28" rx="1"/>
    <rect x="305" y="294" width="2" height="6" rx="1"/>
  </g>
  <text x="65" y="330" fill="#8899bb" font-size="11">增强后波形（降噪+响度提升）：</text>
  <g fill="rgba(0,229,255,0.4)">
    <rect x="430" y="317" width="2" height="14" rx="1"/>
    <rect x="435" y="311" width="2" height="26" rx="1"/>
    <rect x="440" y="315" width="2" height="18" rx="1"/>
    <rect x="445" y="309" width="2" height="34" rx="1"/>
    <rect x="450" y="320" width="2" height="8" rx="1"/>
    <rect x="455" y="313" width="2" height="22" rx="1"/>
    <rect x="460" y="307" width="2" height="38" rx="1"/>
    <rect x="465" y="317" width="2" height="14" rx="1"/>
    <rect x="470" y="311" width="2" height="26" rx="1"/>
    <rect x="475" y="320" width="2" height="8" rx="1"/>
    <rect x="480" y="309" width="2" height="34" rx="1"/>
    <rect x="485" y="320" width="2" height="8" rx="1"/>
    <rect x="490" y="313" width="2" height="22" rx="1"/>
    <rect x="495" y="317" width="2" height="14" rx="1"/>
    <rect x="500" y="307" width="2" height="38" rx="1"/>
    <rect x="505" y="315" width="2" height="18" rx="1"/>
  </g>
</svg>
