<svg width="680" height="400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#070b18;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="680" height="400" fill="url(#bgGrad)"/>
  
  <!-- Header -->
  <text x="340" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#ffffff">File Checksum</text>
  <text x="340" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#94a3b8">MD5 / SHA Hash Calculator</text>
  
  <!-- Interface Mockup -->
  <rect x="50" y="100" width="580" height="240" rx="12" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  
  <!-- File Upload Area -->
  <rect x="80" y="120" width="520" height="60" rx="6" fill="#0f172a" stroke="#475569" stroke-dasharray="4,4"/>
  <text x="340" y="148" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#94a3b8">Drag & Drop file here or click to browse</text>
  <circle cx="340" cy="175" r="18" fill="#8b5cf6"/>
  <text x="340" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#ffffff">+</text>
  
  <!-- Hash Algorithm Selection -->
  <text x="80" y="210" font-family="Arial, sans-serif" font-size="11" fill="#cbd5e1">Hash Algorithm:</text>
  <rect x="80" y="225" width="180" height="30" rx="4" fill="#1e293b" stroke="#475569"/>
  <text x="170" y="244" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#cbd5e1">SHA-256 ▼</text>
  
  <!-- Hash Results Panel -->
  <rect x="280" y="210" width="320" height="85" rx="6" fill="#0f172a" stroke="#475569"/>
  <text x="440" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#22d3ee">Hash Result</text>
  
  <!-- SHA-256 Value -->
  <rect x="295" y="240" width="290" height="35" rx="4" fill="#1e293b" stroke="#475569"/>
  <text x="305" y="262" font-family="monospace" font-size="9" fill="#10b981">e3b0c44298fc1c149af9</text>
  <text x="585" y="262" text-anchor="end" font-family="monospace" font-size="9" fill="#10b981">...f47ac42b</text>
  
  <!-- MD5 Value -->
  <rect x="295" y="280" width="290" height="35" rx="4" fill="#1e293b" stroke="#475569"/>
  <text x="305" y="302" font-family="monospace" font-size="9" fill="#8b5cf6">d41d8cd98f00b204e980</text>
  <text x="585" y="302" text-anchor="end" font-family="monospace" font-size="9" fill="#8b5cf6">00000000</text>
  
  <!-- Copy Buttons -->
  <rect x="595" y="242" width="45" height="16" rx="3" fill="#22d3ee"/>
  <text x="617" y="253" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#ffffff">Copy</text>
  <rect x="595" y="282" width="45" height="16" rx="3" fill="#22d3ee"/>
  <text x="617" y="293" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#ffffff">Copy</text>
  
  <!-- Status Badge -->
  <rect x="500" y="110" width="100" height="24" rx="12" fill="#10b981"/>
  <text x="550" y="126" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#ffffff">Secure Hash</text>
</svg>
