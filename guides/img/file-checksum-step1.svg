<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="'Inter',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
<defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0f172a"/><stop offset="100%" stop-color="#070b18"/></linearGradient></defs>
<rect width="680" height="400" fill="url(#bg)" rx="14"/>
<text x="30" y="42" fill="#f0f4ff" font-size="20" font-weight="700">🔐 文件校验</text><text x="30" y="66" fill="#6b7a9f" font-size="13">上传文件计算 MD5、SHA1、SHA256 哈希值，验证完整性。</text>
<rect x="30" y="85" width="620" height="290" fill="rgba(14,22,41,0.8)" rx="14" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
<rect x="50" y="100" width="580" height="80" fill="#0a0e1a" rx="10" stroke="rgba(59,130,246,0.3)" stroke-width="2" stroke-dasharray="6,4"/>
<text x="340" y="140" fill="#6b7a9f" font-size="14" text-anchor="middle">📁 点击上传或拖拽文件到此处</text>
<text x="340" y="165" fill="#4a5a7a" font-size="11" text-anchor="middle">支持任意文件格式</text>
<text x="50" y="205" fill="#10b981" font-size="13">📄 文件: setup.exe (12.5 MB)</text>
<rect x="50" y="220" width="580" height="36" fill="#0f1a35" rx="8" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
<text x="70" y="244" fill="#6b7a9f" font-size="12">MD5</text><text x="300" y="244" fill="#f0f4ff" font-size="12" font-family="monospace">a1b2c3d4e5f6...</text>
<rect x="50" y="260" width="580" height="36" fill="#0f1a35" rx="8" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
<text x="70" y="284" fill="#6b7a9f" font-size="12">SHA1</text><text x="300" y="284" fill="#f0f4ff" font-size="12" font-family="monospace">f6e5d4c3b2a1...</text>
<rect x="50" y="300" width="580" height="36" fill="#0f1a35" rx="8" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
<text x="70" y="324" fill="#6b7a9f" font-size="12">SHA256</text><text x="300" y="324" fill="#f0f4ff" font-size="12" font-family="monospace">9a8b7c6d5e4f...</text>
<text x="340" y="365" fill="#f59e0b" font-size="11" text-anchor="middle">💡 拖拽文件到虚线区域自动计算哈希值</text>
</svg>
