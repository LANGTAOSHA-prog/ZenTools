<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="'Inter',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
<defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0f172a"/><stop offset="100%" stop-color="#070b18"/></linearGradient><linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#3b82f6"/><stop offset="100%" stop-color="#8b5cf6"/></linearGradient></defs>
<rect width="680" height="400" fill="url(#bg)" rx="14"/>
<text x="30" y="42" fill="#f0f4ff" font-size="20" font-weight="700">🌡️ 温度转换</text><text x="30" y="66" fill="#6b7a9f" font-size="13">摄氏度、华氏度、开尔文互相转换，实时计算。</text>
<rect x="30" y="85" width="620" height="290" fill="rgba(14,22,41,0.8)" rx="14" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
<text x="50" y="120" fill="#f0f4ff" font-size="15" font-weight="700">输入数值</text>
<rect x="50" y="132" width="580" height="40" fill="#0a0e1a" rx="8" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
<text x="65" y="157" fill="#f0f4ff" font-size="18" font-weight="600">25</text>
<rect x="50" y="200" width="270" height="42" fill="#0a0e1a" rx="8" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
<text x="65" y="225" fill="#8899bb" font-size="14">摄氏度 (°C) ▼</text>
<rect x="310" y="200" width="270" height="42" fill="#0a0e1a" rx="8" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
<text x="325" y="225" fill="#8899bb" font-size="14">华氏度 (°F) ▼</text>
<rect x="50" y="275" width="580" height="60" fill="#0f1a35" rx="10" stroke="rgba(0,229,255,0.15)" stroke-width="1"/>
<text x="340" y="305" fill="#00e5ff" font-size="20" font-weight="800" text-anchor="middle">25 °C = 77.00 °F</text>
<text x="340" y="325" fill="#6b7a9f" font-size="11" text-anchor="middle">支持摄氏度 (°C)、华氏度 (°F)、开尔文 (K)</text>
</svg>
