<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="'Inter',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b18"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="680" height="400" fill="url(#bg)" rx="14"/>
  <text x="30" y="42" fill="#f0f4ff" font-size="20" font-weight="700">音频分割器</text>
  <text x="30" y="66" fill="#6b7a9f" font-size="13">将长音频按时间段或音节智能分割成多个小段。</text>
  <rect x="30" y="85" width="620" height="290" fill="rgba(14,22,41,0.8)" rx="14" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="50" y="118" fill="#f0f4ff" font-size="15" font-weight="700">原始音频波形</text>
  <rect x="50" y="130" width="580" height="100" rx="8" fill="rgba(10,14,26,0.6)"/>
  <path d="M50 180 Q70 155 90 180 Q110 205 130 180 Q150 150 170 180 Q190 210 210 180 Q230 150 250 180 Q270 205 290 180 Q310 155 330 180 Q350 205 370 180 Q390 150 410 180 Q430 210 450 180 Q470 155 490 180 Q510 205 530 180 Q550 150 570 180 Q590 205 610 180 Q630 160 630 180" stroke="#60a5fa" stroke-width="1.5" fill="none"/>
  <line x1="210" y1="130" x2="210" y2="230" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4,3"/>
  <line x1="400" y1="130" x2="400" y2="230" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4,3"/>
  <text x="125" y="148" fill="#f59e0b" font-size="10">段落 1</text>
  <text x="295" y="148" fill="#f59e0b" font-size="10">段落 2</text>
  <text x="500" y="148" fill="#f59e0b" font-size="10">段落 3</text>
  <rect x="50" y="240" width="580" height="50" rx="8" fill="rgba(20,31,55,0.8)"/>
  <text x="65" y="260" fill="#8899bb" font-size="12">分割方式：</text>
  <rect x="140" y="250" width="70" height="18" rx="4" fill="rgba(59,130,246,0.2)" stroke="rgba(59,130,246,0.5)" stroke-width="1"/>
  <text x="175" y="263" fill="#60a5fa" font-size="11" text-anchor="middle">按时间段</text>
  <text x="220" y="263" fill="#4a5a7a" font-size="11">按音量 按静音</text>
  <text x="65" y="282" fill="#8899bb" font-size="12">起始：00:00  结束：03:24  分段数：3</text>
  <rect x="50" y="298" width="580" height="40" rx="8" fill="url(#accent)"/>
  <text x="340" y="323" fill="#fff" font-size="14" text-anchor="middle" font-weight="600">智能分割</text>
</svg>
