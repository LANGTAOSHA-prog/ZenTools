<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" font-family="'Inter',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b18"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="680" height="380" fill="url(#bg)" rx="14"/>
  <text x="30" y="42" fill="#f0f4ff" font-size="20" font-weight="700">🎨 图片转像素画</text>
  <text x="30" y="66" fill="#6b7a9f" font-size="13">对比原图和像素画效果。</text>
  <rect x="30" y="85" width="620" height="275" fill="rgba(14,22,41,0.8)" rx="14" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="50" y="118" fill="#f0f4ff" font-size="15" font-weight="700">像素画结果</text>
  <!-- Before / After comparison -->
  <rect x="50" y="135" width="280" height="200" rx="12" fill="rgba(20,31,55,0.5)" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <text x="190" y="160" fill="#6b7a9f" font-size="11" text-anchor="middle">原图</text>
  <rect x="70" y="170" width="110" height="85" rx="6" fill="#3b82f6" opacity="0.3"/>
  <rect x="80" y="180" width="25" height="15" rx="2" fill="#f59e0b" opacity="0.5"/>
  <rect x="115" y="178" width="20" height="18" rx="2" fill="#10b981" opacity="0.5"/>
  <rect x="140" y="185" width="30" height="10" rx="2" fill="#8b5cf6" opacity="0.5"/>
  <text x="190" y="275" fill="#6b7a9f" font-size="11" text-anchor="middle">像素画效果 (8px)</text>
  <!-- Pixel art grid -->
  <rect x="70" y="285" width="8" height="8" fill="#3b82f6"/>
  <rect x="78" y="285" width="8" height="8" fill="#5a9bf6"/>
  <rect x="86" y="285" width="8" height="8" fill="#f59e0b"/>
  <rect x="94" y="285" width="8" height="8" fill="#f59e0b"/>
  <rect x="102" y="285" width="8" height="8" fill="#10b981"/>
  <rect x="110" y="285" width="8" height="8" fill="#10b981"/>
  <rect x="70" y="293" width="8" height="8" fill="#2563eb"/>
  <rect x="78" y="293" width="8" height="8" fill="#3b82f6"/>
  <rect x="86" y="293" width="8" height="8" fill="#f59e0b"/>
  <rect x="94" y="293" width="8" height="8" fill="#8b5cf6"/>
  <rect x="102" y="293" width="8" height="8" fill="#10b981"/>
  <rect x="110" y="293" width="8" height="8" fill="#34d399"/>
  <rect x="70" y="301" width="8" height="8" fill="#4a7ed9"/>
  <rect x="78" y="301" width="8" height="8" fill="#6ba3f6"/>
  <rect x="86" y="301" width="8" height="8" fill="#fbbf24"/>
  <rect x="94" y="301" width="8" height="8" fill="#a78bfa"/>
  <rect x="102" y="301" width="8" height="8" fill="#34d399"/>
  <rect x="110" y="301" width="8" height="8" fill="#6ee7b7"/>
  <!-- Info -->
  <rect x="350" y="135" width="280" height="200" rx="12" fill="rgba(20,31,55,0.85)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="490" y="160" fill="#f0f4ff" font-size="13" font-weight="600" text-anchor="middle">像素画信息</text>
  <line x1="365" y1="172" x2="615" y2="172" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="365" y="195" fill="#6b7a9f" font-size="11">网格大小</text>
  <text x="365" y="215" fill="#f0f4ff" font-size="13">8 x 8 px</text>
  <text x="365" y="240" fill="#6b7a9f" font-size="11">输出尺寸</text>
  <text x="365" y="260" fill="#f0f4ff" font-size="13">240 x 160 px</text>
  <text x="365" y="285" fill="#6b7a9f" font-size="11">调色板</text>
  <text x="365" y="305" fill="#f0f4ff" font-size="13">8-bit 标准 (256 色)</text>
  <rect x="365" y="315" width="250" height="30" rx="8" fill="url(#accent)"/>
  <text x="490" y="335" fill="#fff" font-size="12" font-weight="600" text-anchor="middle">下载像素画</text>
</svg>