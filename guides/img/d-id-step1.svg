<svg width="680" height="400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#070b18;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="680" height="400" fill="url(#bgGrad)"/>
  
  <!-- Header -->
  <text x="340" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#ffffff">D-ID</text>
  <text x="340" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#94a3b8">AI Digital Human</text>
  
  <!-- Interface Mockup -->
  <rect x="50" y="100" width="580" height="240" rx="12" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  
  <!-- Video Preview Area -->
  <rect x="80" y="120" width="280" height="180" rx="6" fill="#0f172a" stroke="#475569"/>
  <circle cx="220" cy="180" r="50" fill="#6366f1" opacity="0.8"/>
  <ellipse cx="220" cy="195" rx="35" ry="45" fill="#fbbf24"/>
  <circle cx="208" cy="180" r="8" fill="#1f2937"/>
  <circle cx="232" cy="180" r="8" fill="#1f2937"/>
  <path d="M 205 205 Q 220 215 235 205" stroke="#1f2937" stroke-width="3" fill="none"/>
  <text x="220" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#94a3b8">Digital Avatar</text>
  
  <!-- Text Input Panel -->
  <rect x="380" y="120" width="240" height="180" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="500" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#22d3ee">Script Editor</text>
  
  <!-- Script Lines -->
  <rect x="395" y="155" width="210" height="25" rx="3" fill="#0f172a"/>
  <text x="405" y="172" font-family="monospace" font-size="10" fill="#cbd5e1">Hello! Welcome to our</text>
  
  <rect x="395" y="185" width="210" height="25" rx="3" fill="#0f172a"/>
  <text x="405" y="202" font-family="monospace" font-size="10" fill="#cbd5e1">company presentation.</text>
  
  <rect x="395" y="215" width="210" height="25" rx="3" fill="#0f172a"/>
  <text x="405" y="232" font-family="monospace" font-size="10" fill="#cbd5e1">Learn more about us.</text>
  
  <!-- Voice Selection -->
  <text x="395" y="260" font-family="Arial, sans-serif" font-size="11" fill="#94a3b8">Voice:</text>
  <rect x="395" y="275" width="150" height="25" rx="3" fill="#0f172a" stroke="#475569"/>
  <text x="470" y="292" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#cbd5e1">English - Female</text>
  
  <!-- Generate Button -->
  <rect x="395" y="310" width="150" height="35" rx="6" fill="#10b981"/>
  <text x="470" y="332" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#ffffff">Generate Video</text>
  
  <!-- Status Badge -->
  <rect x="500" y="110" width="100" height="24" rx="12" fill="#ec4899"/>
  <text x="550" y="126" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#ffffff">Real-time</text>
</svg>
