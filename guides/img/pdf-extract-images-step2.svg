<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="'Inter',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b18"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="680" height="400" fill="url(#bg)" rx="14"/>

  <!-- Title -->
  <text x="30" y="42" fill="#f0f4ff" font-size="20" font-weight="700">🖼️ PDF 提取图片 — 提取结果</text>
  <text x="30" y="66" fill="#6b7a9f" font-size="13">提取完成，共找到 7 张图片，可单独下载或一键打包。</text>

  <!-- Tool box -->
  <rect x="30" y="85" width="620" height="290" fill="rgba(14,22,41,0.8)" rx="14" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

  <!-- Header -->
  <text x="50" y="118" fill="#f0f4ff" font-size="15" font-weight="700">已提取的图片</text>
  <text x="380" y="118" fill="#8899bb" font-size="12">共 7 张 · 全部选中</text>

  <!-- Progress bar -->
  <rect x="50" y="130" width="580" height="6" rx="3" fill="#1a2640"/>
  <rect x="50" y="130" width="580" height="6" rx="3" fill="url(#accent)"/>
  <text x="530" y="125" fill="#00e5ff" font-size="11" font-weight="600">100%</text>

  <!-- Thumbnail grid -->
  <rect x="50" y="150" width="62" height="62" rx="8" fill="#1a2640" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="81" y="178" fill="#6b7a9f" font-size="14" text-anchor="middle">🖼</text>
  <text x="81" y="200" fill="#4a5a7a" font-size="10" text-anchor="middle">img_01.png</text>
  <rect x="115" y="150" width="62" height="62" rx="8" fill="#1a2640" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="146" y="178" fill="#6b7a9f" font-size="14" text-anchor="middle">🖼</text>
  <text x="146" y="200" fill="#4a5a7a" font-size="10" text-anchor="middle">img_02.png</text>
  <rect x="180" y="150" width="62" height="62" rx="8" fill="#1a2640" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="211" y="178" fill="#6b7a9f" font-size="14" text-anchor="middle">🖼</text>
  <text x="211" y="200" fill="#4a5a7a" font-size="10" text-anchor="middle">img_03.png</text>
  <rect x="245" y="150" width="62" height="62" rx="8" fill="#1a2640" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="276" y="178" fill="#6b7a9f" font-size="14" text-anchor="middle">🖼</text>
  <text x="276" y="200" fill="#4a5a7a" font-size="10" text-anchor="middle">img_04.png</text>
  <rect x="310" y="150" width="62" height="62" rx="8" fill="#1a2640" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="341" y="178" fill="#6b7a9f" font-size="14" text-anchor="middle">🖼</text>
  <text x="341" y="200" fill="#4a5a7a" font-size="10" text-anchor="middle">img_05.png</text>
  <rect x="375" y="150" width="62" height="62" rx="8" fill="#1a2640" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="406" y="178" fill="#6b7a9f" font-size="14" text-anchor="middle">🖼</text>
  <text x="406" y="200" fill="#4a5a7a" font-size="10" text-anchor="middle">img_06.png</text>
  <rect x="440" y="150" width="62" height="62" rx="8" fill="rgba(59,130,246,0.12)" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="471" y="178" fill="#6b7a9f" font-size="14" text-anchor="middle">🖼</text>
  <text x="471" y="200" fill="#4a5a7a" font-size="10" text-anchor="middle">img_07.png</text>

  <!-- Download buttons row -->
  <rect x="50" y="230" width="160" height="36" fill="rgba(255,255,255,0.06)" rx="8" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="130" y="253" fill="#c0d0f0" font-size="13" font-weight="600" text-anchor="middle">⬇ 下载全部 (.zip)</text>

  <rect x="220" y="230" width="100" height="36" fill="rgba(255,255,255,0.06)" rx="8" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="270" y="253" fill="#c0d0f0" font-size="13" font-weight="600" text-anchor="middle">选择格式</text>

  <rect x="330" y="230" width="120" height="36" fill="rgba(255,255,255,0.06)" rx="8" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="390" y="253" fill="#c0d0f0" font-size="13" font-weight="600" text-anchor="middle">🔍 放大预览</text>

  <!-- Format selector dropdown -->
  <rect x="220" y="274" width="100" height="60" rx="6" fill="#0f1a30" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <rect x="228" y="280" width="84" height="22" rx="4" fill="rgba(59,130,246,0.15)"/>
  <text x="270" y="295" fill="#3b82f6" font-size="12" text-anchor="middle">PNG</text>
  <rect x="228" y="306" width="84" height="22" rx="4" fill="transparent"/>
  <text x="270" y="321" fill="#6b7a9f" font-size="12" text-anchor="middle">JPG</text>

  <!-- Preview large -->
  <rect x="50" y="280" width="150" height="90" rx="8" fill="#1a2640" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="125" y="315" fill="#6b7a9f" font-size="22" text-anchor="middle">🖼</text>
  <text x="125" y="340" fill="#4a5a7a" font-size="11" text-anchor="middle">img_01.png · 1200×800</text>
  <text x="125" y="355" fill="#4a5a7a" font-size="11" text-anchor="middle">1.2 MB</text>
</svg>