<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" font-family="'Inter',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b18"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>
  <rect width="680" height="380" fill="url(#bg)" rx="14"/>

  <!-- Title -->
  <text x="30" y="42" fill="#f0f4ff" font-size="20" font-weight="700">📄 PDF 合并</text>
  <text x="30" y="66" fill="#6b7a9f" font-size="13">将多个 PDF 文件合并成一个，整理资料、合同、学习笔记，一步到位。</text>

  <!-- Tool box -->
  <rect x="30" y="85" width="620" height="270" fill="rgba(14,22,41,0.8)" rx="14" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

  <!-- Success animation -->
  <circle cx="340" cy="138" r="30" fill="rgba(16,185,129,0.15)" stroke="rgba(16,185,129,0.3)" stroke-width="2"/>
  <text x="340" y="148" fill="#10b981" font-size="30" text-anchor="middle">✓</text>

  <text x="340" y="190" fill="#f0f4ff" font-size="16" font-weight="700" text-anchor="middle">✅ 合并完成！</text>
  <text x="340" y="214" fill="#6b7a9f" font-size="13" text-anchor="middle">共 3 个文件已合并为一个 PDF</text>

  <!-- Summary -->
  <rect x="80" y="230" width="520" height="40" fill="rgba(255,255,255,0.02)" rx="8" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <text x="340" y="246" fill="#94a3b8" font-size="12" text-anchor="middle">📄 合并后总大小：4.4 MB · 共 36 页</text>

  <!-- Download button -->
  <rect x="170" y="285" width="340" height="44" fill="url(#green)" rx="12"/>
  <text x="340" y="313" fill="#fff" font-size="15" font-weight="700" text-anchor="middle">📥 下载合并后的 PDF</text>
</svg>
