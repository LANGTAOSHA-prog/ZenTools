<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="'Inter',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b18"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>
  <rect width="680" height="400" fill="url(#bg)" rx="14"/>

  <!-- Title -->
  <text x="30" y="42" fill="#f0f4ff" font-size="20" font-weight="700">📝 PDF 转 Markdown</text>
  <text x="30" y="66" fill="#6b7a9f" font-size="13">将 PDF 文件内容转换为 Markdown 格式，保留标题、列表和代码块结构。</text>

  <!-- Tool box -->
  <rect x="30" y="85" width="620" height="290" fill="rgba(14,22,41,0.8)" rx="14" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

  <!-- Left panel: PDF upload -->
  <rect x="50" y="105" width="280" height="250" rx="10" fill="rgba(20,31,55,0.85)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

  <text x="190" y="132" fill="#f0f4ff" font-size="13" font-weight="600" text-anchor="middle">PDF 源文件</text>

  <!-- Upload zone in left panel -->
  <rect x="65" y="148" width="250" height="110" rx="10" fill="rgba(20,31,55,0.9)" stroke="rgba(59,130,246,0.35)" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="190" y="188" fill="#6b7a9f" font-size="28" text-anchor="middle">📄</text>
  <text x="190" y="215" fill="#8899bb" font-size="12" text-anchor="middle">上传 PDF 文件</text>
  <text x="190" y="233" fill="#4a5a7a" font-size="10" text-anchor="middle">点击或拖拽到此处</text>

  <!-- File info -->
  <rect x="65" y="270" width="250" height="28" rx="6" fill="#0a0e1a" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <text x="78" y="289" fill="#4a5a7a" font-size="11">未选择文件</text>

  <!-- Convert button -->
  <rect x="65" y="308" width="250" height="32" fill="url(#accent)" rx="8"/>
  <text x="190" y="329" fill="#fff" font-size="13" font-weight="600" text-anchor="middle">开始转换</text>

  <!-- Arrow between panels -->
  <text x="365" y="240" fill="#4a5a7a" font-size="22" text-anchor="middle">→</text>

  <!-- Right panel: Markdown preview -->
  <rect x="385" y="105" width="245" height="250" rx="10" fill="rgba(20,31,55,0.85)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

  <!-- Preview header -->
  <rect x="385" y="105" width="245" height="32" rx="10" fill="rgba(59,130,246,0.12)"/>
  <rect x="385" y="125" width="245" height="12" fill="rgba(59,130,246,0.12)"/>
  <text x="507" y="126" fill="#3b82f6" font-size="12" font-weight="600" text-anchor="middle">Markdown 预览</text>

  <!-- Preview content -->
  <text x="400" y="158" fill="#e2e8f0" font-size="14" font-weight="700"># 项目需求文档</text>
  <text x="400" y="178" fill="#6b7a9f" font-size="11">日期：2026-06-22</text>
  <text x="400" y="198" fill="#e2e8f0" font-size="13" font-weight="600">## 功能概述</text>
  <text x="400" y="214" fill="#8899bb" font-size="11">本系统提供PDF转换功能，支持</text>
  <text x="400" y="228" fill="#8899bb" font-size="11">将文档导出为Markdown格式。</text>
  <text x="400" y="248" fill="#e2e8f0" font-size="13" font-weight="600">## 核心特性</text>
  <text x="412" y="266" fill="#10b981" font-size="11">- 保留标题层级结构</text>
  <text x="412" y="282" fill="#10b981" font-size="11">- 自动识别列表和表格</text>
  <text x="412" y="298" fill="#10b981" font-size="11">- 代码块语法高亮</text>

  <!-- Format options bar -->
  <rect x="385" y="318" width="245" height="22" rx="5" fill="rgba(20,31,55,0.5)" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <text x="398" y="334" fill="#6b7a9f" font-size="10">格式化</text>
  <rect x="430" y="320" width="42" height="18" rx="4" fill="rgba(59,130,246,0.2)"/>
  <text x="451" y="333" fill="#3b82f6" font-size="9" text-anchor="middle">深色</text>
  <rect x="476" y="320" width="42" height="18" rx="4" fill="rgba(255,255,255,0.05)"/>
  <text x="497" y="333" fill="#6b7a9f" font-size="9" text-anchor="middle">浅色</text>
  <text x="545" y="333" fill="#10b981" font-size="11" font-weight="600">下载 ⬇</text>
</svg>
