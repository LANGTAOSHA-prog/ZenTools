<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="'Inter',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b18"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
  </defs>
  <rect width="680" height="400" fill="url(#bg)" rx="14"/>
  <text x="30" y="42" fill="#f0f4ff" font-size="20" font-weight="700">🎬 视频压缩 - 结果</text>
  <text x="30" y="66" fill="#6b7a9f" font-size="13">压缩完成，查看压缩效果并下载。</text>
  <rect x="30" y="85" width="620" height="290" fill="rgba(14,22,41,0.8)" rx="14" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="50" y="118" fill="#f0f4ff" font-size="15" font-weight="700">压缩结果</text>
  <rect x="50" y="132" width="580" height="80" rx="10" fill="rgba(10,14,26,0.6)" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  <rect x="70" y="142" width="150" height="58" rx="8" fill="rgba(239,68,68,0.1)" stroke="rgba(239,68,68,0.2)" stroke-width="1"/>
  <text x="145" y="165" fill="#ef4444" font-size="11" text-anchor="middle">压缩前</text>
  <text x="145" y="188" fill="#f0f4ff" font-size="18" font-weight="700" text-anchor="middle">156 MB</text>
  <text x="260" y="178" fill="#6b7a9f" font-size="22">→</text>
  <rect x="290" y="142" width="150" height="58" rx="8" fill="rgba(0,229,255,0.1)" stroke="rgba(0,229,255,0.2)" stroke-width="1"/>
  <text x="365" y="165" fill="#00e5ff" font-size="11" text-anchor="middle">压缩后</text>
  <text x="365" y="188" fill="#f0f4ff" font-size="18" font-weight="700" text-anchor="middle">58 MB</text>
  <rect x="470" y="142" width="140" height="58" rx="8" fill="rgba(168,85,247,0.1)" stroke="rgba(168,85,247,0.2)" stroke-width="1"/>
  <text x="540" y="165" fill="#a855f7" font-size="11" text-anchor="middle">减小</text>
  <text x="540" y="188" fill="#f0f4ff" font-size="18" font-weight="700" text-anchor="middle">63%</text>
  <rect x="120" y="235" width="180" height="50" rx="8" fill="rgba(0,229,255,0.04)" stroke="rgba(0,229,255,0.12)" stroke-width="1"/>
  <text x="210" y="255" fill="#6b7a9f" font-size="10" text-anchor="middle">分辨率</text>
  <text x="210" y="275" fill="#00e5ff" font-size="14" font-weight="700" text-anchor="middle">1920×1080</text>
  <rect x="320" y="235" width="180" height="50" rx="8" fill="rgba(168,85,247,0.04)" stroke="rgba(168,85,247,0.12)" stroke-width="1"/>
  <text x="410" y="255" fill="#6b7a9f" font-size="10" text-anchor="middle">时长</text>
  <text x="410" y="275" fill="#a855f7" font-size="14" font-weight="700" text-anchor="middle">03:25</text>
  <rect x="200" y="300" width="280" height="40" rx="999" fill="url(#accent)"/>
  <text x="340" y="325" fill="#fff" font-size="15" font-weight="700" text-anchor="middle">⬇ 下载压缩后的视频</text>
</svg>
