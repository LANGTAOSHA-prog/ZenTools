<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="'Inter',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b18"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="680" height="400" fill="url(#bg)" rx="14"/>
  <text x="30" y="42" fill="#f0f4ff" font-size="20" font-weight="700">💻 JSON 格式化</text>
  <text x="30" y="66" fill="#6b7a9f" font-size="13">快速格式化、压缩和验证 JSON 数据，支持语法高亮和错误提示。</text>
  <rect x="30" y="85" width="620" height="290" fill="rgba(14,22,41,0.8)" rx="14" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="50" y="118" fill="#f0f4ff" font-size="15" font-weight="700">JSON 数据处理</text>

  <!-- Input area -->
  <rect x="50" y="135" width="580" height="100" fill="#0a0e1a" rx="8" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="65" y="160" fill="#4a5a7a" font-size="11" font-family="'JetBrains Mono',monospace">{"users":[{"id":1,"name":"张三","email":"zhang@example.com"</text>
  <text x="65" y="178" fill="#4a5a7a" font-size="11" font-family="'JetBrains Mono',monospace">,"age":28,"city":"北京"},{"id":2,"name":"李四","email"</text>
  <text x="65" y="196" fill="#4a5a7a" font-size="11" font-family="'JetBrains Mono',monospace">:"li@example.com","age":35,"city":"上海"}]</text>
  <text x="65" y="218" fill="#4a5a7a" font-size="10" font-family="'JetBrains Mono',monospace">{"status":"ok","total":2}</text>

  <!-- Action buttons -->
  <rect x="50" y="248" width="120" height="34" fill="url(#accent)" rx="8"/>
  <text x="110" y="270" fill="#fff" font-size="12" font-weight="600" text-anchor="middle">格式化</text>

  <rect x="180" y="248" width="100" height="34" fill="rgba(20,31,55,0.9)" rx="8" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="230" y="270" fill="#94a3b8" font-size="12" font-weight="600" text-anchor="middle">压缩</text>

  <rect x="290" y="248" width="100" height="34" fill="rgba(20,31,55,0.9)" rx="8" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="340" y="270" fill="#94a3b8" font-size="12" font-weight="600" text-anchor="middle">校验</text>

  <!-- Result area -->
  <rect x="50" y="295" width="580" height="65" fill="rgba(20,31,55,0.5)" rx="8" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <rect x="50" y="295" width="580" height="22" rx="8" fill="rgba(255,255,255,0.02)"/>
  <text x="340" y="310" fill="#6b7a9f" font-size="10" text-anchor="middle">📋 结果会显示在这里</text>
  <text x="340" y="340" fill="#4a5a7a" font-size="11" text-anchor="middle">将 JSON 粘贴到输入框中，然后选择操作</text>
</svg>
