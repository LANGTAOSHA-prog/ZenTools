<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="'Inter',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b18"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="680" height="400" fill="url(#bg)" rx="14"/>
  <text x="30" y="42" fill="#f0f4ff" font-size="20" font-weight="700">音频编辑器</text>
  <text x="30" y="66" fill="#6b7a9f" font-size="13">在线剪辑、合并、淡入淡出、音量调节等基础编辑功能。</text>
  <rect x="30" y="85" width="620" height="290" fill="rgba(14,22,41,0.8)" rx="14" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="50" y="118" fill="#f0f4ff" font-size="15" font-weight="700">波形编辑区</text>
  <rect x="50" y="130" width="580" height="120" rx="8" fill="rgba(10,14,26,0.6)"/>
  <path d="M50 190 Q80 160 110 190 Q140 220 170 190 Q200 150 230 190 Q260 230 290 190 Q320 150 350 190 Q380 220 410 190 Q440 160 470 190 Q500 220 530 190 Q560 160 590 190 Q620 210 630 190" stroke="#60a5fa" stroke-width="2" fill="none"/>
  <path d="M50 190 Q80 160 110 190 Q140 220 170 190 Q200 150 230 190 Q260 230 290 190 Q320 150 350 190 Q380 220 410 190 Q440 160 470 190 Q500 220 530 190 Q560 160 590 190 Q620 210 630 190" fill="rgba(59,130,246,0.1)"/>
  <line x1="300" y1="130" x2="300" y2="250" stroke="#ef4444" stroke-width="2" stroke-dasharray="4,3"/>
  <line x1="450" y1="130" x2="450" y2="250" stroke="#ef4444" stroke-width="2" stroke-dasharray="4,3"/>
  <rect x="300" y="130" width="150" height="120" fill="rgba(59,130,246,0.08)"/>
  <text x="340" y="148" fill="#60a5fa" font-size="10">选中区域</text>
  <rect x="50" y="260" width="580" height="28" rx="6" fill="rgba(20,31,55,0.8)"/>
  <text x="65" y="279" fill="#8899bb" font-size="12">播放  ⏪ 1s  ◀◀  暂停  ▶▶  1s ⏩  静音  淡入  淡出  音量</text>
  <rect x="50" y="298" width="120" height="30" rx="6" fill="rgba(239,68,68,0.2)" stroke="rgba(239,68,68,0.4)" stroke-width="1"/>
  <text x="110" y="318" fill="#ef4444" font-size="12" text-anchor="middle">裁剪选中</text>
  <rect x="180" y="298" width="120" height="30" rx="6" fill="rgba(59,130,246,0.2)" stroke="rgba(59,130,246,0.4)" stroke-width="1"/>
  <text x="240" y="318" fill="#60a5fa" font-size="12" text-anchor="middle">复制</text>
  <rect x="310" y="298" width="120" height="30" rx="6" fill="rgba(34,197,94,0.2)" stroke="rgba(34,197,94,0.4)" stroke-width="1"/>
  <text x="370" y="318" fill="#22c55e" font-size="12" text-anchor="middle">撤销</text>
  <rect x="440" y="298" width="190" height="30" rx="6" fill="url(#accent)"/>
  <text x="535" y="318" fill="#fff" font-size="12" text-anchor="middle" font-weight="600">导出音频</text>
