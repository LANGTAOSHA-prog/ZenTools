<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="'Inter',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
<defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0f172a"/><stop offset="100%" stop-color="#070b18"/></linearGradient></defs>
<rect width="680" height="400" fill="url(#bg)" rx="14"/>
<text x="30" y="42" fill="#f0f4ff" font-size="20" font-weight="700">🔐 密码生成器</text><text x="30" y="66" fill="#6b7a9f" font-size="13">生成复杂安全的随机密码，支持自定义长度和字符类型。</text>
<rect x="30" y="85" width="620" height="290" fill="rgba(14,22,41,0.8)" rx="14" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
<rect x="60" y="105" width="560" height="48" fill="rgba(0,229,255,0.06)" rx="8" stroke="rgba(0,229,255,0.2)" stroke-width="1"/>
<text x="80" y="135" fill="#00e5ff" font-size="18" font-weight="700" font-family="monospace">xK9#mP2!vL7@qR4*wN8</text>
<text x="60" y="178" fill="#6b7a9f" font-size="13">密码长度</text>
<rect x="60" y="188" width="560" height="8" fill="rgba(255,255,255,0.06)" rx="4"/>
<rect x="60" y="188" width="392" height="8" fill="#00e5ff" rx="4"/>
<text x="60" y="215" fill="#6b7a9f" font-size="12">16 位</text>
<text x="60" y="245" fill="#6b7a9f" font-size="13">字符类型</text>
<rect x="60" y="255" width="120" height="30" fill="rgba(0,229,255,0.1)" rx="6" stroke="rgba(0,229,255,0.3)" stroke-width="1"/>
<text x="120" y="275" fill="#00e5ff" font-size="12" font-weight="600" text-anchor="middle">✓ 大写字母</text>
<rect x="190" y="255" width="120" height="30" fill="rgba(0,229,255,0.1)" rx="6" stroke="rgba(0,229,255,0.3)" stroke-width="1"/>
<text x="250" y="275" fill="#00e5ff" font-size="12" font-weight="600" text-anchor="middle">✓ 小写字母</text>
<rect x="320" y="255" width="100" height="30" fill="rgba(0,229,255,0.1)" rx="6" stroke="rgba(0,229,255,0.3)" stroke-width="1"/>
<text x="370" y="275" fill="#00e5ff" font-size="12" font-weight="600" text-anchor="middle">✓ 数字</text>
<rect x="430" y="255" width="100" height="30" fill="rgba(0,229,255,0.1)" rx="6" stroke="rgba(0,229,255,0.3)" stroke-width="1"/>
<text x="480" y="275" fill="#00e5ff" font-size="12" font-weight="600" text-anchor="middle">✓ 符号</text>
<rect x="200" y="310" width="280" height="42" fill="url(#bg)" rx="8" stroke="rgba(0,229,255,0.3)" stroke-width="2"/>
<text x="340" y="335" fill="#00e5ff" font-size="14" font-weight="600" text-anchor="middle">🔄 生成密码</text>
</svg>