<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b18"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>
  <rect width="680" height="400" fill="url(#bg)" rx="12"/>
  <text x="340" y="48" text-anchor="middle" fill="url(#accent)" font-size="20" font-weight="700" font-family="system-ui,sans-serif">JSON Index</text>
  <text x="340" y="68" text-anchor="middle" fill="#64748b" font-size="11" font-family="system-ui,sans-serif">JSON索引器 - JSON Index</text>
  <!-- Tree panel -->
  <rect x="40" y="90" width="380" height="280" rx="12" fill="url(#card)" stroke="#334155" stroke-width="1"/>
  <text x="60" y="118" fill="#94a3b8" font-size="12" font-weight="600" font-family="system-ui,sans-serif">JSON 树形结构</text>
  <!-- Tree nodes -->
  <text x="60" y="148" fill="#94a3b8" font-size="12" font-family="monospace">[&#9662;]</text>
  <text x="84" y="148" fill="#e2e8f0" font-size="12" font-family="monospace">array (3)</text>
  <text x="60" y="170" fill="#64748b" font-size="11" font-family="monospace">&nbsp;&nbsp;[&#9662;] 0: object</text>
  <text x="100" y="190" fill="#64748b" font-size="11" font-family="monospace">&nbsp;&nbsp;&nbsp;&nbsp;"name": "Alice"</text>
  <text x="100" y="208" fill="#64748b" font-size="11" font-family="monospace">&nbsp;&nbsp;&nbsp;&nbsp;"age": 30</text>
  <text x="100" y="226" fill="#64748b" font-size="11" font-family="monospace">&nbsp;&nbsp;&nbsp;&nbsp;"role": "admin"</text>
  <text x="60" y="248" fill="#64748b" font-size="11" font-family="monospace">&nbsp;&nbsp;[&#9656;] 1: object</text>
  <text x="60" y="268" fill="#64748b" font-size="11" font-family="monospace">&nbsp;&nbsp;[&#9656;] 2: object</text>
  <!-- Highlighted path -->
  <rect x="60" y="160" width="340" height="76" rx="6" fill="#06b6d4" opacity="0.08" stroke="#06b6d4" stroke-width="1" stroke-dasharray="4"/>
  <text x="60" y="270" fill="#06b6d4" font-size="11" font-weight="600" font-family="monospace">路径: [0].name = "Alice"</text>
  <!-- Query panel -->
  <rect x="440" y="90" width="200" height="280" rx="12" fill="url(#card)" stroke="#334155" stroke-width="1"/>
  <text x="460" y="118" fill="#94a3b8" font-size="12" font-weight="600" font-family="system-ui,sans-serif">路径查询</text>
  <rect x="460" y="130" width="160" height="34" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="474" y="152" fill="#64748b" font-size="11" font-family="monospace">$</text>
  <text x="486" y="152" fill="#e2e8f0" font-size="13" font-family="monospace">[0].name</text>
  <rect x="460" y="174" width="160" height="30" rx="6" fill="#06b6d4" opacity="0.2" stroke="#06b6d4" stroke-width="1"/>
  <text x="540" y="193" fill="#06b6d4" font-size="11" font-weight="600" font-family="system-ui,sans-serif" text-anchor="middle">查询 Query</text>
  <text x="460" y="224" fill="#94a3b8" font-size="11" font-weight="600" font-family="system-ui,sans-serif">查询结果</text>
  <rect x="460" y="232" width="160" height="30" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="474" y="251" fill="#10b981" font-size="13" font-family="monospace">"Alice"</text>
  <text x="460" y="280" fill="#94a3b8" font-size="11" font-weight="600" font-family="system-ui,sans-serif">统计信息</text>
  <rect x="460" y="288" width="160" height="22" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="474" y="303" fill="#94a3b8" font-size="10" font-family="monospace">keys: 12 | depth: 3</text>
  <rect x="460" y="316" width="160" height="22" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="474" y="331" fill="#94a3b8" font-size="10" font-family="monospace">size: 1.2 KB</text>
  <rect x="460" y="344" width="75" height="22" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="497" y="359" fill="#94a3b8" font-size="10" font-family="monospace" text-anchor="middle">复制路径</text>
  <rect x="545" y="344" width="75" height="22" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="582" y="359" fill="#94a3b8" font-size="10" font-family="monospace" text-anchor="middle">展开全部</text>
</svg>