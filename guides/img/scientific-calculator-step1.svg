<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="'Inter',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
<defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0f172a"/><stop offset="100%" stop-color="#070b18"/></linearGradient><linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#3b82f6"/><stop offset="100%" stop-color="#8b5cf6"/></linearGradient></defs>
<rect width="680" height="400" fill="url(#bg)" rx="14"/>
<text x="30" y="42" fill="#f0f4ff" font-size="20" font-weight="700">🔢 科学计算器</text><text x="30" y="66" fill="#6b7a9f" font-size="13">支持三角函数、对数、指数、幂运算等高级数学计算。</text>
<rect x="30" y="85" width="620" height="290" fill="rgba(14,22,41,0.8)" rx="14" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
<rect x="50" y="100" width="580" height="40" fill="#0a0e1a" rx="8" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
<text x="600" y="126" fill="#f0f4ff" font-size="20" font-weight="700" text-anchor="end">sin(30) = 0.5</text>
<rect x="50" y="155" width="110" height="36" fill="rgba(139,92,246,0.15)" rx="6"/><text x="105" y="177" fill="#a78bfa" font-size="12" text-anchor="middle">sin</text>
<rect x="168" y="155" width="110" height="36" fill="rgba(139,92,246,0.15)" rx="6"/><text x="223" y="177" fill="#a78bfa" font-size="12" text-anchor="middle">cos</text>
<rect x="286" y="155" width="110" height="36" fill="rgba(139,92,246,0.15)" rx="6"/><text x="341" y="177" fill="#a78bfa" font-size="12" text-anchor="middle">tan</text>
<rect x="404" y="155" width="110" height="36" fill="rgba(139,92,246,0.15)" rx="6"/><text x="459" y="177" fill="#a78bfa" font-size="12" text-anchor="middle">log</text>
<rect x="522" y="155" width="108" height="36" fill="rgba(139,92,246,0.15)" rx="6"/><text x="576" y="177" fill="#a78bfa" font-size="12" text-anchor="middle">√</text>
<text x="340" y="220" fill="#6b7a9f" font-size="12" text-anchor="middle">7  8  9  ÷  π</text>
<text x="340" y="245" fill="#6b7a9f" font-size="12" text-anchor="middle">4  5  6  ×  e</text>
<text x="340" y="270" fill="#6b7a9f" font-size="12" text-anchor="middle">1  2  3  −  xʸ</text>
<text x="340" y="295" fill="#6b7a9f" font-size="12" text-anchor="middle">0  00  .  +  =</text>
<text x="340" y="365" fill="#f59e0b" font-size="11" text-anchor="middle">💡 点击函数按钮自动计算，支持括号运算</text>
