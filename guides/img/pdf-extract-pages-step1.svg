<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="'Inter',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b18"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="680" height="400" fill="url(#bg)" rx="14"/>

  <!-- Title -->
  <text x="30" y="42" fill="#f0f4ff" font-size="20" font-weight="700">📄 PDF 提取页面</text>
  <text x="30" y="66" fill="#6b7a9f" font-size="13">从 PDF 中选择特定页面，提取为独立的 PDF 文件，方便分发和管理。</text>

  <!-- Tool box -->
  <rect x="30" y="85" width="620" height="290" fill="rgba(14,22,41,0.8)" rx="14" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

  <!-- Uploaded file indicator -->
  <rect x="50" y="105" width="580" height="32" fill="#0e1629" rx="8" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <rect x="55" y="110" width="20" height="22" fill="#3b82f6" rx="4"/>
  <text x="62" y="125" fill="#fff" font-size="10" font-weight="700" text-anchor="middle">PDF</text>
  <text x="82" y="125" fill="#d0d8f0" font-size="13">项目报告_2026.pdf</text>
  <text x="590" y="125" fill="#6b7a9f" font-size="12">共 24 页</text>

  <!-- Thumbnail label and range input -->
  <text x="50" y="160" fill="#f0f4ff" font-size="14" font-weight="600">选择要提取的页面</text>

  <!-- Page thumbnails grid -->
  <!-- Page 1 (checked) -->
  <rect x="50" y="175" width="72" height="100" fill="#1e293b" rx="6" stroke="rgba(59,130,246,0.6)" stroke-width="2"/>
  <rect x="55" y="190" width="62" height="80" fill="#2a3a5c" rx="3"/>
  <rect x="60" y="195" width="52" height="70" fill="#3a4a6c" rx="2"/>
  <line x1="65" y1="210" x2="107" y2="210" stroke="#5a7aac" stroke-width="3" opacity="0.5"/>
  <line x1="65" y1="222" x2="100" y2="222" stroke="#5a7aac" stroke-width="2" opacity="0.4"/>
  <line x1="65" y1="232" x2="103" y2="232" stroke="#5a7aac" stroke-width="2" opacity="0.3"/>
  <line x1="65" y1="242" x2="95" y2="242" stroke="#5a7aac" stroke-width="2" opacity="0.3"/>
  <rect x="55" y="180" width="14" height="14" fill="#3b82f6" rx="3"/>
  <text x="62" y="191" fill="#fff" font-size="10" font-weight="700" text-anchor="middle">&#10003;</text>
  <text x="86" y="190" fill="#f0f4ff" font-size="11" text-anchor="middle">第 1 页</text>

  <!-- Page 2 (checked) -->
  <rect x="132" y="175" width="72" height="100" fill="#1e293b" rx="6" stroke="rgba(59,130,246,0.6)" stroke-width="2"/>
  <rect x="137" y="190" width="62" height="80" fill="#2a3a5c" rx="3"/>
  <rect x="142" y="195" width="52" height="70" fill="#3a4a6c" rx="2"/>
  <line x1="147" y1="210" x2="189" y2="210" stroke="#5a7aac" stroke-width="3" opacity="0.5"/>
  <line x1="147" y1="222" x2="182" y2="222" stroke="#5a7aac" stroke-width="2" opacity="0.4"/>
  <line x1="147" y1="232" x2="185" y2="232" stroke="#5a7aac" stroke-width="2" opacity="0.3"/>
  <rect x="137" y="180" width="14" height="14" fill="#3b82f6" rx="3"/>
  <text x="144" y="191" fill="#fff" font-size="10" font-weight="700" text-anchor="middle">&#10003;</text>
  <text x="168" y="190" fill="#f0f4ff" font-size="11" text-anchor="middle">第 2 页</text>

  <!-- Page 3 (unchecked) -->
  <rect x="214" y="175" width="72" height="100" fill="#1e293b" rx="6" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <rect x="219" y="190" width="62" height="80" fill="#2a3a5c" rx="3"/>
  <rect x="224" y="195" width="52" height="70" fill="#3a4a6c" rx="2"/>
  <line x1="229" y1="210" x2="271" y2="210" stroke="#5a7aac" stroke-width="3" opacity="0.5"/>
  <line x1="229" y1="222" x2="264" y2="222" stroke="#5a7aac" stroke-width="2" opacity="0.4"/>
  <line x1="229" y1="232" x2="267" y2="232" stroke="#5a7aac" stroke-width="2" opacity="0.3"/>
  <rect x="219" y="180" width="14" height="14" fill="rgba(255,255,255,0.06)" rx="3" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
  <text x="250" y="190" fill="#f0f4ff" font-size="11" text-anchor="middle">第 3 页</text>

  <!-- Page 4 (unchecked) -->
  <rect x="296" y="175" width="72" height="100" fill="#1e293b" rx="6" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <rect x="301" y="190" width="62" height="80" fill="#2a3a5c" rx="3"/>
  <rect x="306" y="195" width="52" height="70" fill="#3a4a6c" rx="2"/>
  <line x1="311" y1="210" x2="353" y2="210" stroke="#5a7aac" stroke-width="3" opacity="0.5"/>
  <line x1="311" y1="222" x2="346" y2="222" stroke="#5a7aac" stroke-width="2" opacity="0.4"/>
  <rect x="301" y="180" width="14" height="14" fill="rgba(255,255,255,0.06)" rx="3" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
  <text x="332" y="190" fill="#f0f4ff" font-size="11" text-anchor="middle">第 4 页</text>

  <!-- Page 5 (unchecked) -->
  <rect x="378" y="175" width="72" height="100" fill="#1e293b" rx="6" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <rect x="383" y="190" width="62" height="80" fill="#2a3a5c" rx="3"/>
  <rect x="388" y="195" width="52" height="70" fill="#3a4a6c" rx="2"/>
  <line x1="393" y1="210" x2="435" y2="210" stroke="#5a7aac" stroke-width="3" opacity="0.5"/>
  <rect x="383" y="180" width="14" height="14" fill="rgba(255,255,255,0.06)" rx="3" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
  <text x="414" y="190" fill="#f0f4ff" font-size="11" text-anchor="middle">第 5 页</text>

  <!-- Page 6 (unchecked) -->
  <rect x="460" y="175" width="72" height="100" fill="#1e293b" rx="6" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <rect x="465" y="190" width="62" height="80" fill="#2a3a5c" rx="3"/>
  <rect x="470" y="195" width="52" height="70" fill="#3a4a6c" rx="2"/>
  <line x1="475" y1="210" x2="517" y2="210" stroke="#5a7aac" stroke-width="3" opacity="0.5"/>
  <text x="496" y="190" fill="#f0f4ff" font-size="11" text-anchor="middle">第 6 页</text>

  <!-- Scroll hint arrow -->
  <text x="552" y="240" fill="#4a5a7a" font-size="16">&#8250;</text>

  <!-- Or use range input -->
  <rect x="50" y="290" width="580" height="1" fill="rgba(255,255,255,0.06)"/>

  <text x="50" y="312" fill="#6b7a9f" font-size="12">或输入页码范围：</text>
  <rect x="150" y="298" width="100" height="28" fill="#0a0e1a" rx="6" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="158" y="316" fill="#6b7a9f" font-size="11">1-2</text>
  <rect x="258" y="298" width="100" height="28" fill="#0a0e1a" rx="6" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="266" y="316" fill="#4a5a7a" font-size="11">如 1-5,7,9-12</text>

  <!-- Extract button -->
  <rect x="400" y="295" width="230" height="34" fill="url(#accent)" rx="999"/>
  <text x="515" y="317" fill="#fff" font-size="13" font-weight="600" text-anchor="middle">提取为独立 PDF</text>

  <!-- Selection count -->
  <rect x="400" y="338" width="230" height="28" fill="transparent" rx="6"/>
  <text x="515" y="357" fill="#6b7a9f" font-size="11" text-anchor="middle">已选择 2 页 · 约提取 1 个文件</text>
</svg>