<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="'Inter',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b18"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="680" height="400" fill="url(#bg)" rx="14"/>

  <!-- Title -->
  <text x="30" y="42" fill="#f0f4ff" font-size="20" font-weight="700">📄 PDF 合并</text>
  <text x="30" y="66" fill="#6b7a9f" font-size="13">将多个 PDF 文件合并成一个，整理资料、合同、学习笔记，一步到位。</text>

  <!-- Tool box -->
  <rect x="30" y="85" width="620" height="290" fill="rgba(14,22,41,0.8)" rx="14" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

  <text x="50" y="118" fill="#f0f4ff" font-size="15" font-weight="700">选择 PDF 文件</text>
  <text x="50" y="138" fill="#6b7a9f" font-size="12">选择多个 PDF 文件，按顺序合并成一个文档。</text>

  <!-- Upload zone -->
  <rect x="50" y="155" width="580" height="120" rx="12" fill="rgba(20,31,55,0.85)" stroke="rgba(59,130,246,0.4)" stroke-width="2" stroke-dasharray="6,4"/>
  
  <text x="340" y="200" fill="#6b7a9f" font-size="36" text-anchor="middle">📂</text>
  <text x="340" y="232" fill="#8899bb" font-size="13" text-anchor="middle">点击上传或拖拽 PDF 文件到此处</text>
  <text x="340" y="252" fill="#4a5a7a" font-size="11" text-anchor="middle">支持 .pdf 格式 · 可一次选择多个文件</text>

  <!-- File input bar (fake) -->
  <rect x="50" y="290" width="400" height="34" fill="#0a0e1a" rx="8" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="65" y="312" fill="#4a5a7a" font-size="12">未选择文件</text>
  <rect x="380" y="290" width="120" height="34" fill="url(#accent)" rx="8"/>
  <text x="440" y="312" fill="#fff" font-size="12" font-weight="600" text-anchor="middle">选择文件</text>

  <!-- Merge button (disabled) -->
  <rect x="50" y="335" width="580" height="36" fill="#1e293b" rx="999" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <text x="340" y="357" fill="#4a5a7a" font-size="14" font-weight="600" text-anchor="middle">开始合并</text>
</svg>
