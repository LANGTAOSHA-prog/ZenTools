<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="'Inter',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b18"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>
  <rect width="680" height="400" fill="url(#bg)" rx="14"/>

  <!-- Title -->
  <text x="30" y="42" fill="#f0f4ff" font-size="20" font-weight="700">💧 PDF 移除水印 — 处理完成</text>
  <text x="30" y="66" fill="#6b7a9f" font-size="13">水印已成功移除，下载无水印的 PDF 文件。</text>

  <!-- Tool box -->
  <rect x="30" y="85" width="620" height="290" fill="rgba(14,22,41,0.8)" rx="14" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

  <!-- Success banner -->
  <rect x="50" y="100" width="580" height="42" rx="8" fill="rgba(6,182,212,0.12)" stroke="rgba(6,182,212,0.3)" stroke-width="1"/>
  <text x="70" y="126" fill="#06b6d4" font-size="13" font-weight="600">✓ 水印已成功移除！文件准备就绪，可点击下方按钮下载。</text>

  <!-- Before / After comparison -->
  <!-- Before -->
  <rect x="50" y="155" width="290" height="130" rx="8" fill="#0f192e" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="195" y="175" fill="#6b7a9f" font-size="11" font-weight="600" text-anchor="middle">处理前</text>

  <text x="68" y="196" fill="#8899bb" font-size="10">项目名称：ZenTools 在线工具箱</text>
  <text x="68" y="210" fill="#6b7a9f" font-size="8">本文档概述了 ZenTools 的功能架构和</text>
  <text x="68" y="224" fill="#6b7a9f" font-size="8">核心模块。涵盖图片处理、PDF 工具、</text>
  <text x="68" y="238" fill="#6b7a9f" font-size="8">AI 助手等 200+ 在线工具。</text>

  <!-- Watermark still visible -->
  <text x="195" y="240" fill="rgba(255,80,80,0.35)" font-size="26" font-weight="900" text-anchor="middle" transform="rotate(-25,195,240)">Sample</text>
  <text x="195" y="268" fill="rgba(255,80,80,0.25)" font-size="22" font-weight="900" text-anchor="middle" transform="rotate(-25,195,268)">水印</text>

  <!-- Arrow between -->
  <text x="352" y="220" fill="#4a5a7a" font-size="22" text-anchor="middle">→</text>

  <!-- After -->
  <rect x="370" y="155" width="260" height="130" rx="8" fill="#0a1a15" stroke="rgba(6,182,212,0.2)" stroke-width="1"/>
  <text x="500" y="175" fill="#06b6d4" font-size="11" font-weight="600" text-anchor="middle">处理后</text>

  <text x="388" y="196" fill="#8899bb" font-size="10">项目名称：ZenTools 在线工具箱</text>
  <text x="388" y="210" fill="#6b7a9f" font-size="8">本文档概述了 ZenTools 的功能架构和</text>
  <text x="388" y="224" fill="#6b7a9f" font-size="8">核心模块。涵盖图片处理、PDF 工具、</text>
  <text x="388" y="238" fill="#6b7a9f" font-size="8">AI 助手等 200+ 在线工具。</text>

  <!-- No watermark overlay badge -->
  <rect x="460" y="250" width="100" height="20" rx="10" fill="rgba(6,182,212,0.15)" stroke="rgba(6,182,212,0.3)" stroke-width="1"/>
  <text x="510" y="263" fill="#06b6d4" font-size="9" text-anchor="middle">无水印 ✓</text>

  <!-- Download button -->
  <rect x="50" y="300" width="290" height="36" rx="999" fill="url(#accent)"/>
  <text x="195" y="322" fill="#fff" font-size="14" font-weight="600" text-anchor="middle">📥 下载无水印 PDF</text>

  <!-- Reset / new task button -->
  <rect x="370" y="300" width="260" height="36" rx="999" fill="#1e293b" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="500" y="322" fill="#8899bb" font-size="14" font-weight="600" text-anchor="middle">开始新的任务</text>
</svg>
