<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="'Inter',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b18"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="success" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
  </defs>
  <rect width="680" height="400" fill="url(#bg)" rx="14"/>

  <!-- Title -->
  <text x="30" y="42" fill="#f0f4ff" font-size="20" font-weight="700">📋 PDF 元数据</text>
  <text x="30" y="66" fill="#6b7a9f" font-size="13">元数据编辑完成，查看更新结果并保存文件。</text>

  <!-- Tool box -->
  <rect x="30" y="85" width="620" height="290" fill="rgba(14,22,41,0.8)" rx="14" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

  <!-- Success banner -->
  <rect x="50" y="100" width="580" height="40" fill="rgba(34,197,94,0.1)" rx="8" stroke="rgba(34,197,94,0.25)" stroke-width="1"/>
  <text x="72" y="125" fill="#22c55e" font-size="13" font-weight="600">✓ 元数据已成功更新到 PDF 文件</text>

  <!-- Updated metadata preview -->
  <text x="50" y="170" fill="#f0f4ff" font-size="15" font-weight="700">更新后的元数据</text>

  <!-- Metadata card -->
  <rect x="50" y="185" width="580" height="140" fill="rgba(20,31,55,0.7)" rx="10" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>

  <!-- Left column -->
  <text x="70" y="212" fill="#6b7a9f" font-size="11">标题</text>
  <rect x="70" y="218" width="240" height="26" fill="#0a0e1a" rx="6" stroke="rgba(34,197,94,0.3)" stroke-width="1"/>
  <text x="82" y="236" fill="#c0cced" font-size="12">项目需求文档 v3</text>

  <text x="70" y="268" fill="#6b7a9f" font-size="11">作者</text>
  <rect x="70" y="274" width="240" height="26" fill="#0a0e1a" rx="6" stroke="rgba(34,197,94,0.3)" stroke-width="1"/>
  <text x="82" y="292" fill="#c0cced" font-size="12">张明</text>

  <!-- Right column -->
  <text x="370" y="212" fill="#6b7a9f" font-size="11">主题</text>
  <rect x="370" y="218" width="240" height="26" fill="#0a0e1a" rx="6" stroke="rgba(34,197,94,0.3)" stroke-width="1"/>
  <text x="382" y="236" fill="#c0cced" font-size="12">2026 年 Q2 产品规划</text>

  <text x="370" y="268" fill="#6b7a9f" font-size="11">关键词</text>
  <rect x="370" y="274" width="240" height="26" fill="#0a0e1a" rx="6" stroke="rgba(34,197,94,0.3)" stroke-width="1"/>
  <text x="382" y="292" fill="#c0cced" font-size="12">需求文档, 产品规划, Q2, 2026</text>

  <!-- Download button -->
  <rect x="50" y="340" width="580" height="36" fill="url(#success)" rx="999"/>
  <text x="340" y="363" fill="#fff" font-size="14" font-weight="600" text-anchor="middle">下载更新后的 PDF</text>
</svg>
