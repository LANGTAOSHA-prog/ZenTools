<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" font-family="'Inter',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/><stop offset="100%" stop-color="#070b18"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/><stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="680" height="380" fill="url(#bg)" rx="14"/>
  <text x="30" y="42" fill="#f0f4ff" font-size="20" font-weight="700">🔍 图片对比</text>
  <text x="30" y="66" fill="#6b7a9f" font-size="13">使用滑块对比原图和处理后的效果差异。</text>
  <rect x="30" y="85" width="620" height="275" fill="rgba(14,22,41,0.8)" rx="14" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="50" y="118" fill="#f0f4ff" font-size="15" font-weight="700">图片对比</text>
  <rect x="50" y="135" width="580" height="200" rx="12" fill="rgba(20,31,55,0.85)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="340" y="160" fill="#f0f4ff" font-size="13" font-weight="600" text-anchor="middle">图片对比</text>
  <line x1="65" y1="172" x2="615" y2="172" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="160" y="195" fill="#6b7a9f" font-size="12" text-anchor="middle">原图</text>
  <text x="500" y="195" fill="#6b7a9f" font-size="12" text-anchor="middle">处理后</text>
  <rect x="65" y="205" width="130" height="85" rx="6" fill="rgba(59,130,246,0.3)"/>
  <rect x="75" y="215" width="25" height="15" rx="2" fill="#f59e0b" opacity="0.6"/>
  <rect x="110" y="210" width="15" height="18" rx="2" fill="#10b981" opacity="0.6"/>
  <rect x="135" y="220" width="35" height="8" rx="2" fill="#8b5cf6" opacity="0.5"/>
  <rect x="405" y="205" width="130" height="85" rx="6" fill="rgba(59,130,246,0.5)"/>
  <rect x="415" y="215" width="30" height="20" rx="2" fill="#f59e0b" opacity="0.8"/>
  <rect x="455" y="210" width="18" height="22" rx="2" fill="#10b981" opacity="0.8"/>
  <rect x="485" y="220" width="40" height="10" rx="2" fill="#8b5cf6" opacity="0.7"/>
  <!-- Slider handle -->
  <line x1="340" y1="205" x2="340" y2="290" stroke="#3b82f6" stroke-width="2"/>
  <circle cx="340" cy="248" r="14" fill="#3b82f6" stroke="#fff" stroke-width="2"/>
  <text x="340" y="253" fill="#fff" font-size="10" text-anchor="middle">◀▶</text>
  <text x="65" y="310" fill="#6b7a9f" font-size="12">拖拽滑块对比处理前后效果</text>
  <rect x="470" y="298" width="140" height="30" rx="8" fill="url(#accent)"/>
  <text x="540" y="318" fill="#fff" font-size="11" font-weight="600" text-anchor="middle">上传新图片</text>
</svg>