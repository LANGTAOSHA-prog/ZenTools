<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="'Inter',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
<defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0f172a"/><stop offset="100%" stop-color="#070b18"/></linearGradient></defs>
<rect width="680" height="400" fill="url(#bg)" rx="14"/>
<text x="30" y="42" fill="#f0f4ff" font-size="20" font-weight="700">📝 随机姓名生成</text><text x="30" y="66" fill="#6b7a9f" font-size="13">选择类型和数量，一键生成中文或英文随机姓名。</text>
<rect x="30" y="85" width="620" height="290" fill="rgba(14,22,41,0.8)" rx="14" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
<text x="50" y="120" fill="#f0f4ff" font-size="15" font-weight="700">选择设置</text>
<rect x="50" y="135" width="160" height="36" fill="#0a0e1a" rx="8" stroke="rgba(255,255,255,0.06)" stroke-width="1"/><text x="100" y="158" fill="#8899bb" font-size="13">中文姓名 ▼</text>
<rect x="225" y="135" width="120" height="36" fill="#0a0e1a" rx="8" stroke="rgba(255,255,255,0.06)" stroke-width="1"/><text x="270" y="158" fill="#8899bb" font-size="13">不限性别 ▼</text>
<rect x="360" y="135" width="100" height="36" fill="url(#bg)" rx="8" stroke="rgba(255,255,255,0.06)" stroke-width="1"/><text x="380" y="158" fill="#8899bb" font-size="13">10 个 ▼</text>
<rect x="480" y="135" width="120" height="36" fill="url(#bg)" rx="8" stroke="rgba(0,229,255,0.3)" stroke-width="2"/><text x="540" y="158" fill="#00e5ff" font-size="13" font-weight="600" text-anchor="middle">生成</text>
<rect x="50" y="190" width="580" height="170" fill="#0a0e1a" rx="10" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
<text x="70" y="220" fill="#6b7a9f" font-size="13">生成的姓名：</text>
<rect x="70" y="235" width="120" height="30" fill="rgba(59,130,246,0.1)" rx="6"/><text x="130" y="255" fill="#f0f4ff" font-size="13" font-weight="600" text-anchor="middle">张伟</text>
<rect x="200" y="235" width="120" height="30" fill="rgba(59,130,246,0.1)" rx="6"/><text x="260" y="255" fill="#f0f4ff" font-size="13" font-weight="600" text-anchor="middle">李婷</text>
<rect x="330" y="235" width="120" height="30" fill="rgba(59,130,246,0.1)" rx="6"/><text x="390" y="255" fill="#f0f4ff" font-size="13" font-weight="600" text-anchor="middle">王浩宇</text>
<rect x="70" y="275" width="120" height="30" fill="rgba(59,130,246,0.1)" rx="6"/><text x="130" y="295" fill="#f0f4ff" font-size="13" font-weight="600" text-anchor="middle">刘丽华</text>
<rect x="200" y="275" width="120" height="30" fill="rgba(59,130,246,0.1)" rx="6"/><text x="260" y="295" fill="#f0f4ff" font-size="13" font-weight="600" text-anchor="middle">陈思远</text>
<text x="340" y="345" fill="#6b7a9f" font-size="11" text-anchor="middle">... 共10个姓名</text>
</svg>
