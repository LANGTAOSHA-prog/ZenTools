<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="'Inter',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b18"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="greenAccent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
  </defs>
  <rect width="680" height="400" fill="url(#bg)" rx="14"/>

  <!-- Title -->
  <text x="30" y="42" fill="#f0f4ff" font-size="20" font-weight="700">✍️ PDF 签名</text>
  <text x="30" y="66" fill="#6b7a9f" font-size="13">在 PDF 文件中添加手写签名、文字签名或上传签名图片，快速完成合同签署。</text>

  <!-- Tool box -->
  <rect x="30" y="85" width="620" height="290" fill="rgba(14,22,41,0.8)" rx="14" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

  <!-- Top toolbar -->
  <rect x="30" y="85" width="620" height="40" fill="rgba(20,31,55,0.9)" rx="14" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <rect x="30" y="115" width="620" height="10" fill="rgba(20,31,55,0.9)"/>

  <!-- Toolbar buttons -->
  <text x="50" y="111" fill="#94a3b8" font-size="11">PDF 签名工具</text>

  <!-- Download button -->
  <rect x="530" y="92" width="108" height="28" fill="url(#greenAccent)" rx="999"/>
  <text x="584" y="111" fill="#fff" font-size="12" font-weight="600" text-anchor="middle">应用签名</text>

  <!-- Left panel: PDF preview -->
  <rect x="48" y="135" width="400" height="220" fill="#f8fafc" rx="8"/>

  <!-- PDF content mockup -->
  <text x="68" y="162" fill="#0f172a" font-size="13" font-weight="700">销售合同 - 2026年度</text>

  <rect x="68" y="175" width="200" height="3" fill="#e2e8f0" rx="2"/>
  <rect x="68" y="183" width="360" height="3" fill="#e2e8f0" rx="2"/>
  <rect x="68" y="191" width="340" height="3" fill="#e2e8f0" rx="2"/>

  <text x="68" y="212" fill="#334155" font-size="11" font-weight="600">甲方：北京科技有限公司</text>
  <rect x="68" y="222" width="360" height="3" fill="#e2e8f0" rx="2"/>
  <rect x="68" y="230" width="340" height="3" fill="#e2e8f0" rx="2"/>
  <rect x="68" y="238" width="300" height="3" fill="#e2e8f0" rx="2"/>

  <text x="68" y="258" fill="#334155" font-size="11" font-weight="600">乙方：上海贸易有限公司</text>
  <rect x="68" y="268" width="360" height="3" fill="#e2e8f0" rx="2"/>
  <rect x="68" y="276" width="350" height="3" fill="#e2e8f0" rx="2"/>

  <text x="68" y="296" fill="#334155" font-size="11">合同金额：¥ 500,000.00</text>

  <rect x="68" y="306" width="360" height="3" fill="#e2e8f0" rx="2"/>
  <rect x="68" y="314" width="280" height="3" fill="#e2e8f0" rx="2"/>

  <!-- Signature area indicator -->
  <rect x="68" y="324" width="160" height="24" fill="rgba(16,185,129,0.15)" rx="4" stroke="rgba(16,185,129,0.5)" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="148" y="340" fill="#10b981" font-size="11" text-anchor="middle">签名区域</text>

  <!-- Placed signature mock -->
  <path d="M260,320 Q270,310 280,325 Q290,340 300,315 Q305,305 310,320" fill="none" stroke="#1e40af" stroke-width="2.5" stroke-linecap="round"/>
  <text x="268" y="348" fill="#1e40af" font-size="9" font-style="italic">张三</text>

  <!-- Right panel: signature panel -->
  <rect x="460" y="135" width="178" height="220" fill="rgba(20,31,55,0.6)" rx="8" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>

  <text x="474" y="158" fill="#94a3b8" font-size="10" font-weight="600">签名设置</text>

  <!-- Tab: Draw / Text / Upload -->
  <!-- Draw tab (active) -->
  <rect x="468" y="168" width="54" height="26" fill="rgba(59,130,246,0.2)" rx="6" stroke="rgba(59,130,246,0.4)" stroke-width="1"/>
  <text x="495" y="184" fill="#60a5fa" font-size="11" text-anchor="middle">绘制</text>

  <rect x="524" y="168" width="54" height="26" fill="rgba(255,255,255,0.04)" rx="6"/>
  <text x="551" y="184" fill="#5a6a8a" font-size="11" text-anchor="middle">文本</text>

  <rect x="580" y="168" width="54" height="26" fill="rgba(255,255,255,0.04)" rx="6"/>
  <text x="607" y="184" fill="#5a6a8a" font-size="11" text-anchor="middle">图片</text>

  <!-- Drawing pad -->
  <rect x="468" y="202" width="162" height="56" fill="#0a0e1a" rx="6" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <path d="M480,230 Q490,215 500,235 Q510,255 520,225 Q525,215 530,230 Q535,240 540,225" fill="none" stroke="#60a5fa" stroke-width="2" stroke-linecap="round"/>
  <path d="M545,218 Q550,210 555,230 Q560,250 565,220" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>

  <!-- Color options -->
  <text x="474" y="274" fill="#4a5a7a" font-size="9">颜色</text>
  <circle cx="486" cy="280" r="6" fill="#1e40af"/>
  <circle cx="502" cy="280" r="6" fill="#000000"/>
  <circle cx="518" cy="280" r="6" fill="#dc2626"/>
  <circle cx="534" cy="280" r="6" fill="#2563eb"/>

  <!-- Stroke width -->
  <text x="474" y="300" fill="#4a5a7a" font-size="9">粗细</text>
  <line x1="486" y1="298" x2="510" y2="298" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="520" y1="298" x2="550" y2="298" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
  <line x1="560" y1="298" x2="590" y2="298" stroke="#94a3b8" stroke-width="5" stroke-linecap="round"/>

  <!-- Signature position select -->
  <rect x="468" y="310" width="162" height="24" fill="rgba(255,255,255,0.04)" rx="6"/>
  <text x="478" y="326" fill="#5a6a8a" font-size="10">签名位置：</text>
  <text x="542" y="326" fill="#f0f4ff" font-size="10">页面底部</text>
  <text x="618" y="326" fill="#4a5a7a" font-size="8">▼</text>

  <!-- Apply button at right panel bottom -->
  <rect x="468" y="340" width="162" height="30" fill="url(#accent)" rx="8"/>
  <text x="549" y="359" fill="#fff" font-size="12" font-weight="600" text-anchor="middle">应用签名</text>
</svg>
