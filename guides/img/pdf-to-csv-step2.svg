<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="'Inter',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b18"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
  </defs>
  <rect width="680" height="400" fill="url(#bg)" rx="14"/>

  <!-- Title -->
  <text x="30" y="42" fill="#f0f4ff" font-size="20" font-weight="700">📊 PDF 转 CSV</text>
  <text x="30" y="66" fill="#6b7a9f" font-size="13">预览转换后的 CSV 数据，确认无误后一键下载。</text>

  <!-- Tool box -->
  <rect x="30" y="85" width="620" height="290" fill="rgba(14,22,41,0.8)" rx="14" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

  <!-- Success indicator -->
  <rect x="50" y="100" width="580" height="36" fill="rgba(34,197,94,0.1)" rx="8" stroke="rgba(34,197,94,0.3)" stroke-width="1"/>
  <text x="75" y="123" fill="#22c55e" font-size="13" font-weight="600">✓ 转换完成！已识别 4 列 x 12 行数据</text>

  <!-- CSV preview table -->
  <rect x="50" y="148" width="580" height="180" fill="rgba(20,31,55,0.5)" rx="10" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <rect x="50" y="148" width="580" height="28" rx="10" fill="rgba(255,255,255,0.03)"/>
  <text x="340" y="166" fill="#6b7a9f" font-size="11" font-weight="600" text-anchor="middle">CSV 数据预览（前 8 行）</text>

  <!-- Table header row -->
  <rect x="50" y="180" width="580" height="24" fill="rgba(59,130,246,0.12)"/>
  <text x="70" y="196" fill="#8899bb" font-size="11" font-weight="600">姓名</text>
  <line x1="190" y1="180" x2="190" y2="204" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="210" y="196" fill="#8899bb" font-size="11" font-weight="600">部门</text>
  <line x1="320" y1="180" x2="320" y2="204" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="340" y="196" fill="#8899bb" font-size="11" font-weight="600">职位</text>
  <line x1="440" y1="180" x2="440" y2="204" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="460" y="196" fill="#8899bb" font-size="11" font-weight="600">薪资</text>

  <!-- Table rows -->
  <text x="70" y="219" fill="#c8d2e6" font-size="11">张三</text>
  <text x="210" y="219" fill="#c8d2e6" font-size="11">技术部</text>
  <text x="340" y="219" fill="#c8d2e6" font-size="11">高级工程师</text>
  <text x="460" y="219" fill="#c8d2e6" font-size="11">25000</text>
  <line x1="50" y1="225" x2="630" y2="225" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>

  <text x="70" y="239" fill="#c8d2e6" font-size="11">李四</text>
  <text x="210" y="239" fill="#c8d2e6" font-size="11">市场部</text>
  <text x="340" y="239" fill="#c8d2e6" font-size="11">运营总监</text>
  <text x="460" y="239" fill="#c8d2e6" font-size="11">30000</text>
  <line x1="50" y1="245" x2="630" y2="245" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>

  <text x="70" y="259" fill="#c8d2e6" font-size="11">王五</text>
  <text x="210" y="259" fill="#c8d2e6" font-size="11">人事部</text>
  <text x="340" y="259" fill="#c8d2e6" font-size="11">HR 经理</text>
  <text x="460" y="259" fill="#c8d2e6" font-size="11">20000</text>
  <line x1="50" y1="265" x2="630" y2="265" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>

  <text x="70" y="279" fill="#c8d2e6" font-size="11">赵六</text>
  <text x="210" y="279" fill="#c8d2e6" font-size="11">财务部</text>
  <text x="340" y="279" fill="#c8d2e6" font-size="11">会计主管</text>
  <text x="460" y="279" fill="#c8d2e6" font-size="11">22000</text>
  <line x1="50" y1="285" x2="630" y2="285" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>

  <text x="70" y="299" fill="#c8d2e6" font-size="11">孙七</text>
  <text x="210" y="299" fill="#c8d2e6" font-size="11">产品部</text>
  <text x="340" y="299" fill="#c8d2e6" font-size="11">产品经理</text>
  <text x="460" y="299" fill="#c8d2e6" font-size="11">23000</text>

  <!-- More data hint -->
  <text x="340" y="320" fill="#4a5a7a" font-size="10" text-anchor="middle">... 还有 4 行数据（共 12 行）</text>

  <!-- Download button -->
  <rect x="50" y="338" width="180" height="34" fill="url(#greenGrad)" rx="999"/>
  <text x="140" y="360" fill="#fff" font-size="13" font-weight="700" text-anchor="middle">下载 CSV</text>

  <!-- Copy button -->
  <rect x="245" y="338" width="120" height="34" fill="rgba(20,31,55,0.9)" rx="999" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="305" y="360" fill="#94a3b8" font-size="12" font-weight="600" text-anchor="middle">复制数据</text>

  <!-- Delimiter indicator -->
  <rect x="380" y="338" width="250" height="34" fill="rgba(20,31,55,0.6)" rx="8" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <text x="395" y="360" fill="#6b7a9f" font-size="11">分隔符：逗号</text>
  <text x="520" y="360" fill="#6b7a9f" font-size="11">编码：UTF-8</text>
</svg>
