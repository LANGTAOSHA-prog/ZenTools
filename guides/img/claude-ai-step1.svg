<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#070b18"/>
    </linearGradient>
  </defs>
  <rect width="680" height="400" fill="url(#bgGrad)"/>
  <text x="340" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#ffffff">Claude AI</text>
  <text x="340" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#94a3b8">Advanced Conversational AI Assistant</text>
  <rect x="40" y="110" width="600" height="260" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <rect x="50" y="125" width="140" height="35" rx="4" fill="#d97706"/>
  <text x="120" y="148" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">New Chat</text>
  <rect x="210" y="125" width="120" height="35" rx="4" fill="#334155"/>
  <text x="270" y="148" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#cbd5e1">History</text>
  <rect x="350" y="125" width="120" height="35" rx="4" fill="#334155"/>
  <text x="410" y="148" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#cbd5e1">Settings</text>
  <rect x="490" y="125" width="120" height="35" rx="4" fill="#334155"/>
  <text x="550" y="148" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#cbd5e1">Export</text>
  <rect x="60" y="175" width="560" height="150" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <rect x="70" y="185" width="540" height="130" rx="2" fill="#1e293b"/>
  <text x="90" y="210" font-family="Arial, sans-serif" font-size="11" fill="#34d399">You:</text>
  <text x="110" y="210" font-family="Arial, sans-serif" font-size="11" fill="#cbd5e1">Write a Python function to sort an array</text>
  <text x="90" y="240" font-family="Arial, sans-serif" font-size="11" fill="#fbbf24">Claude:</text>
  <text x="110" y="240" font-family="Arial, sans-serif" font-size="11" fill="#94a3b8">Here's an efficient sorting implementation using quicksort...</text>
  <text x="90" y="270" font-family="monospace" font-size="10" fill="#cbd5e1">def quicksort(arr):</text>
  <text x="90" y="290" font-family="monospace" font-size="10" fill="#cbd5e1">    if len(arr) &lt;= 1: return arr</text>
  <text x="90" y="310" font-family="monospace" font-size="10" fill="#cbd5e1">    pivot = arr[len(arr)//2]</text>
  <rect x="60" y="340" width="560" height="25" rx="4" fill="#1e293b"/>
  <text x="80" y="357" font-family="Arial, sans-serif" font-size="11" fill="#94a3b8">Type your message...</text>
</svg>
