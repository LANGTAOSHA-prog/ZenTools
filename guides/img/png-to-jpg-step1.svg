<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="'Inter',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b18"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="680" height="400" fill="url(#bg)" rx="14"/>
  <text x="30" y="42" fill="#f0f4ff" font-size="20" font-weight="700">🔄 PNG 转 JPG</text>
  <text x="30" y="66" fill="#6b7a9f" font-size="13">将 PNG 格式图片转换为 JPG 格式，支持白色背景填充透明区域，减小文件体积。</text>
  <rect x="30" y="85" width="620" height="290" fill="rgba(14,22,41,0.8)" rx="14" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="50" y="118" fill="#f0f4ff" font-size="15" font-weight="700">上传图片</text>
  <text x="50" y="138" fill="#6b7a9f" font-size="12">选择 PNG 格式图片，将其转换为 JPG 格式。</text>
  <rect x="50" y="155" width="580" height="120" rx="12" fill="rgba(20,31,55,0.85)" stroke="rgba(59,130,246,0.4)" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="340" y="200" fill="#6b7a9f" font-size="36" text-anchor="middle">🖼️</text>
  <text x="340" y="232" fill="#8899bb" font-size="13" text-anchor="middle">点击上传或拖拽 PNG 图片到此处</text>
  <text x="340" y="252" fill="#4a5a7a" font-size="11" text-anchor="middle">支持 .png 格式</text>
  <text x="50" y="305" fill="#6b7a9f" font-size="12">透明区域填充</text>
  <rect x="50" y="315" width="250" height="34" rx="8" fill="#0a0e1a" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <rect x="60" y="322" width="20" height="20" rx="4" fill="#ffffff" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <text x="88" y="337" fill="#8899bb" font-size="12">白色背景</text>
  <rect x="50" y="335" width="250" height="34" rx="8" fill="url(#accent)"/>
  <text x="175" y="356" fill="#fff" font-size="13" font-weight="600" text-anchor="middle">转换为 JPG</text>
  <rect x="330" y="335" width="300" height="34" rx="8" fill="#1e293b" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="480" y="356" fill="#4a5a7a" font-size="12" text-anchor="middle">等待上传...</text>
</svg>
