<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 440" font-family="'Inter',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b18"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="warn" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
  </defs>
  <rect width="680" height="440" fill="url(#bg)" rx="14"/>

  <!-- Title -->
  <text x="30" y="42" fill="#f0f4ff" font-size="20" font-weight="700">🔓 PDF 解锁</text>
  <text x="30" y="66" fill="#6b7a9f" font-size="13">移除 PDF 文件密码保护，快速解锁加密文档。</text>

  <!-- Tool box -->
  <rect x="30" y="85" width="620" height="330" fill="rgba(14,22,41,0.8)" rx="14" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

  <text x="50" y="118" fill="#f0f4ff" font-size="15" font-weight="700">上传加密的 PDF 文件</text>
  <text x="50" y="138" fill="#6b7a9f" font-size="12">选择一个受密码保护的 PDF 文档进行解锁。</text>

  <!-- Upload zone -->
  <rect x="50" y="155" width="580" height="110" rx="12" fill="rgba(20,31,55,0.85)" stroke="rgba(245,158,11,0.4)" stroke-width="2" stroke-dasharray="6,4"/>

  <!-- Locked PDF icon -->
  <text x="340" y="198" fill="#f59e0b" font-size="34" text-anchor="middle">🔒</text>
  <text x="340" y="228" fill="#8899bb" font-size="13" text-anchor="middle">点击上传或拖拽加密 PDF 到此处</text>
  <text x="340" y="248" fill="#4a5a7a" font-size="11" text-anchor="middle">支持 .pdf 格式 · 需输入密码解开</text>

  <!-- Password section -->
  <rect x="50" y="280" width="580" height="1" fill="rgba(255,255,255,0.06)"/>

  <text x="50" y="310" fill="#f0f4ff" font-size="14" font-weight="600">输入文档密码</text>

  <!-- Password input -->
  <rect x="50" y="325" width="420" height="40" fill="#0a0e1a" rx="8" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="65" y="350" fill="#6b7a9f" font-size="13">••••••••</text>
  <text x="430" y="350" fill="#4a5a7a" font-size="12">👁</text>

  <!-- Unlock button -->
  <rect x="490" y="325" width="140" height="40" fill="url(#accent)" rx="999"/>
  <text x="560" y="350" fill="#fff" font-size="14" font-weight="700" text-anchor="middle">解锁 PDF</text>

  <!-- Hint -->
  <text x="50" y="388" fill="#4a5a7a" font-size="11">提示：如果忘记密码，请先联系文档作者找回密码。</text>
</svg>