<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="'Inter',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b18"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="680" height="400" fill="url(#bg)" rx="14"/>

  <text x="30" y="42" fill="#f0f4ff" font-size="20" font-weight="700">🔒 PDF 保护</text>
  <text x="30" y="66" fill="#6b7a9f" font-size="13">为 PDF 文件添加密码保护，设置打开密码和权限密码。</text>

  <rect x="30" y="85" width="620" height="290" fill="rgba(14,22,41,0.8)" rx="14" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

  <text x="50" y="118" fill="#f0f4ff" font-size="15" font-weight="700">设置保护</text>
  <text x="50" y="138" fill="#6b7a9f" font-size="12">上传 PDF 文件并设置保护密码，限制文件的打开和操作权限。</text>

  <!-- Upload zone -->
  <rect x="50" y="155" width="580" height="72" rx="12" fill="rgba(20,31,55,0.85)" stroke="rgba(59,130,246,0.4)" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="340" y="186" fill="#6b7a9f" font-size="24" text-anchor="middle">📄</text>
  <text x="340" y="212" fill="#8899bb" font-size="13" text-anchor="middle">点击或拖拽上传 PDF 文件</text>

  <!-- Permission section -->
  <text x="50" y="248" fill="#f0f4ff" font-size="14" font-weight="600">权限设置</text>

  <!-- Permission checkboxes -->
  <rect x="50" y="258" width="170" height="28" rx="6" fill="rgba(10,14,26,0.6)" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  <rect x="58" y="266" width="12" height="12" rx="3" fill="rgba(59,130,246,0.5)" stroke="#3b82f6" stroke-width="1"/>
  <text x="78" y="276" fill="#8899bb" font-size="12">允许打印</text>

  <rect x="230" y="258" width="170" height="28" rx="6" fill="rgba(10,14,26,0.6)" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  <rect x="238" y="266" width="12" height="12" rx="3" fill="rgba(59,130,246,0.5)" stroke="#3b82f6" stroke-width="1"/>
  <text x="258" y="276" fill="#8899bb" font-size="12">允许复制</text>

  <rect x="410" y="258" width="200" height="28" rx="6" fill="rgba(10,14,26,0.6)" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  <rect x="418" y="266" width="12" height="12" rx="3" fill="#3b82f6" stroke="#3b82f6" stroke-width="1"/>
  <text x="438" y="276" fill="#8899bb" font-size="12">允许编辑</text>

  <!-- Password inputs -->
  <text x="50" y="306" fill="#f0f4ff" font-size="14" font-weight="600">打开密码</text>
  <rect x="50" y="314" width="270" height="30" rx="6" fill="#0a0e1a" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="65" y="334" fill="#4a5a7a" font-size="11">••••••••</text>

  <text x="340" y="306" fill="#f0f4ff" font-size="14" font-weight="600">权限密码</text>
  <rect x="340" y="314" width="290" height="30" rx="6" fill="#0a0e1a" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="355" y="334" fill="#4a5a7a" font-size="11">••••••••</text>

  <!-- Protect button -->
  <rect x="230" y="352" width="160" height="34" rx="8" fill="url(#accent)"/>
  <text x="310" y="374" fill="#fff" font-size="14" font-weight="600" text-anchor="middle">开始保护</text>
</svg>
