<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="'Inter',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b18"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="progress" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>
  <rect width="680" height="400" fill="url(#bg)" rx="14"/>

  <!-- Title -->
  <text x="30" y="42" fill="#f0f4ff" font-size="20" font-weight="700">📦 PDF 批量处理</text>
  <text x="30" y="66" fill="#6b7a9f" font-size="13">处理进度实时展示，完成后可分别下载每个文件。</text>

  <!-- Tool box -->
  <rect x="30" y="85" width="620" height="290" fill="rgba(14,22,41,0.8)" rx="14" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

  <!-- Toolbar row -->
  <rect x="50" y="100" width="580" height="40" rx="8" fill="rgba(20,31,55,0.85)" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  
  <rect x="65" y="110" width="160" height="22" rx="6" fill="#0f172a" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="78" y="125" fill="#8899bb" font-size="11">批量操作：</text>
  <text x="155" y="125" fill="#f0f4ff" font-size="11" font-weight="600">压缩 PDF</text>
  <text x="205" y="122" fill="#6b7a9f" font-size="8">▼</text>

  <!-- Cancel button -->
  <rect x="460" y="107" width="110" height="28" rx="6" fill="rgba(239,68,68,0.2)" stroke="rgba(239,68,68,0.4)" stroke-width="1"/>
  <text x="515" y="126" fill="#ef4444" font-size="12" font-weight="600" text-anchor="middle">处理中...</text>

  <!-- Header row -->
  <rect x="50" y="150" width="580" height="32" rx="6" fill="rgba(20,31,55,0.5)"/>
  <text x="72" y="170" fill="#6b7a9f" font-size="11" font-weight="600">文件名</text>
  <text x="280" y="170" fill="#6b7a9f" font-size="11" font-weight="600" text-anchor="middle">页数</text>
  <text x="370" y="170" fill="#6b7a9f" font-size="11" font-weight="600" text-anchor="middle">大小</text>
  <text x="500" y="170" fill="#6b7a9f" font-size="11" font-weight="600" text-anchor="middle">状态</text>

  <!-- File 1 - done -->
  <rect x="92" y="188" width="18" height="18" rx="3" fill="rgba(34,197,94,0.15)"/>
  <text x="101" y="201" fill="#22c55e" font-size="10" text-anchor="middle">PDF</text>
  <text x="118" y="201" fill="#f0f4ff" font-size="12">报告_2026.pdf</text>
  <text x="280" y="201" fill="#8899bb" font-size="11" text-anchor="middle">24</text>
  <text x="370" y="201" fill="#8899bb" font-size="11" text-anchor="middle">1.8 MB</text>
  <rect x="470" y="190" width="70" height="18" rx="4" fill="rgba(34,197,94,0.15)"/>
  <text x="505" y="203" fill="#22c55e" font-size="10" text-anchor="middle">已完成 ✓</text>

  <!-- File 2 - done -->
  <rect x="92" y="214" width="18" height="18" rx="3" fill="rgba(34,197,94,0.15)"/>
  <text x="101" y="227" fill="#22c55e" font-size="10" text-anchor="middle">PDF</text>
  <text x="118" y="227" fill="#f0f4ff" font-size="12">合同_附件.pdf</text>
  <text x="280" y="227" fill="#8899bb" font-size="11" text-anchor="middle">8</text>
  <text x="370" y="227" fill="#8899bb" font-size="11" text-anchor="middle">624 KB</text>
  <rect x="470" y="216" width="70" height="18" rx="4" fill="rgba(34,197,94,0.15)"/>
  <text x="505" y="229" fill="#22c55e" font-size="10" text-anchor="middle">已完成 ✓</text>

  <!-- File 3 - in progress -->
  <rect x="92" y="240" width="18" height="18" rx="3" fill="rgba(59,130,246,0.15)"/>
  <text x="101" y="253" fill="#3b82f6" font-size="10" text-anchor="middle">PDF</text>
  <text x="118" y="253" fill="#f0f4ff" font-size="12">发票_汇总.pdf</text>
  <text x="280" y="253" fill="#8899bb" font-size="11" text-anchor="middle">3</text>
  <text x="370" y="253" fill="#8899bb" font-size="11" text-anchor="middle">486 KB</text>
  <rect x="460" y="242" width="90" height="18" rx="4" fill="rgba(59,130,246,0.15)"/>
  <text x="505" y="255" fill="#3b82f6" font-size="10" text-anchor="middle">处理中...</text>

  <!-- File 4 - pending -->
  <rect x="92" y="266" width="18" height="18" rx="3" fill="rgba(239,68,68,0.15)"/>
  <text x="101" y="279" fill="#ef4444" font-size="10" text-anchor="middle">PDF</text>
  <text x="118" y="279" fill="#f0f4ff" font-size="12">会议_纪要.pdf</text>
  <text x="280" y="279" fill="#8899bb" font-size="11" text-anchor="middle">12</text>
  <text x="370" y="279" fill="#8899bb" font-size="11" text-anchor="middle">2.5 MB</text>
  <rect x="465" y="268" width="80" height="18" rx="4" fill="rgba(100,116,139,0.15)"/>
  <text x="505" y="281" fill="#64748b" font-size="10" text-anchor="middle">等待中</text>

  <!-- Footer bar -->
  <rect x="50" y="296" width="580" height="1" fill="rgba(255,255,255,0.04)"/>
  <text x="65" y="316" fill="#6b7a9f" font-size="11">已处理 <tspan fill="#22c55e" font-weight="600">2</tspan> / <tspan fill="#f0f4ff" font-weight="600">4</tspan> 个文件</text>

  <!-- Progress bar (50%) -->
  <rect x="50" y="335" width="580" height="6" rx="3" fill="#0f172a"/>
  <rect x="50" y="335" width="290" height="6" rx="3" fill="url(#progress)"/>
  <text x="340" y="360" fill="#00e5ff" font-size="11" text-anchor="middle" font-weight="600">50% 已完成</text>
</svg>