<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="'Inter',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b18"/>
    </linearGradient>
    <linearGradient id="purplePink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="blueCyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>
  <rect width="680" height="400" fill="url(#bg)" rx="14"/>

  <!-- Title -->
  <text x="30" y="42" fill="#f0f4ff" font-size="20" font-weight="700">📄 TXT 转 PDF</text>
  <text x="30" y="66" fill="#6b7a9f" font-size="13">将纯文本文档转换为 PDF 格式，支持自定义字体、字号和页面布局。</text>

  <!-- Tool box -->
  <rect x="30" y="85" width="620" height="290" fill="rgba(14,22,41,0.8)" rx="14" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

  <!-- Left panel: Text Editor -->
  <rect x="45" y="105" width="280" height="210" fill="#0a0e1a" rx="10" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="60" y="128" fill="#f0f4ff" font-size="13" font-weight="600">文本编辑器</text>

  <!-- Monospace text content -->
  <text x="60" y="152" fill="#6b7a9f" font-size="11" font-family="Consolas,monospace">项目需求说明</text>
  <text x="60" y="168" fill="#6b7a9f" font-size="11" font-family="Consolas,monospace">==============</text>
  <text x="60" y="186" fill="#6b7a9f" font-size="11" font-family="Consolas,monospace"></text>
  <text x="60" y="202" fill="#94a3b8" font-size="11" font-family="Consolas,monospace">1. 开发一个在线文本编辑器，</text>
  <text x="60" y="218" fill="#94a3b8" font-size="11" font-family="Consolas,monospace">   支持实时保存和自动恢复。</text>
  <text x="60" y="234" fill="#94a3b8" font-size="11" font-family="Consolas,monospace">2. 用户可自定义编辑区背景</text>
  <text x="60" y="250" fill="#94a3b8" font-size="11" font-family="Consolas,monospace">   颜色和字体大小。</text>
  <text x="60" y="266" fill="#94a3b8" font-size="11" font-family="Consolas,monospace">3. 支持导出为 PDF 格式。</text>
  <text x="60" y="282" fill="#94a3b8" font-size="11" font-family="Consolas,monospace">4. 支持多标签页编辑。</text>
  <text x="60" y="298" fill="#94a3b8" font-size="11" font-family="Consolas,monospace">5. 编辑器支持自动换行和</text>
  <text x="60" y="314" fill="#94a3b8" font-size="11" font-family="Consolas,monospace">   行号显示功能。</text>

  <!-- Right panel: PDF Preview -->
  <rect x="345" y="105" width="290" height="210" fill="#0f1a2e" rx="10" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <rect x="345" y="105" width="290" height="26" fill="rgba(255,255,255,0.03)" rx="10"/>
  <rect x="345" y="117" width="290" height="14" fill="rgba(255,255,255,0.03)"/>
  <circle cx="358" cy="118" r="4" fill="#ef4444"/>
  <circle cx="370" cy="118" r="4" fill="#eab308"/>
  <circle cx="382" cy="118" r="4" fill="#22c55e"/>
  <text x="450" y="122" fill="#4a5a7a" font-size="10" text-anchor="middle">PDF 预览</text>

  <!-- PDF rendered content -->
  <text x="362" y="148" fill="#f0f4ff" font-size="14" font-weight="700">项目需求说明</text>
  <line x1="362" y1="154" x2="620" y2="154" stroke="#6b7a9f" stroke-width="1" opacity="0.5"/>
  <text x="362" y="172" fill="#94a3b8" font-size="11">1. 开发一个在线文本编辑器，</text>
  <text x="362" y="188" fill="#94a3b8" font-size="11">   支持实时保存和自动恢复。</text>
  <text x="362" y="204" fill="#94a3b8" font-size="11">2. 用户可自定义编辑区背景</text>
  <text x="362" y="220" fill="#94a3b8" font-size="11">   颜色和字体大小。</text>
  <text x="362" y="236" fill="#94a3b8" font-size="11">3. 支持导出为 PDF 格式。</text>
  <text x="362" y="252" fill="#94a3b8" font-size="11">4. 支持多标签页编辑。</text>
  <text x="362" y="268" fill="#94a3b8" font-size="11">5. 编辑器支持自动换行和</text>
  <text x="362" y="284" fill="#94a3b8" font-size="11">   行号显示功能。</text>

  <!-- Page number -->
  <text x="490" y="302" fill="#4a5a7a" font-size="10" text-anchor="middle">— 1 / 1 —</text>

  <!-- Settings row -->
  <rect x="45" y="325" width="590" height="36" fill="rgba(10,14,26,0.9)" rx="8" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>

  <!-- Font selector -->
  <rect x="55" y="330" width="90" height="26" fill="rgba(255,255,255,0.06)" rx="6"/>
  <text x="100" y="347" fill="#94a3b8" font-size="11" text-anchor="middle">字体: 思源黑体</text>

  <!-- Font size -->
  <rect x="152" y="330" width="70" height="26" fill="rgba(255,255,255,0.06)" rx="6"/>
  <text x="187" y="347" fill="#94a3b8" font-size="11" text-anchor="middle">字号: 12pt</text>

  <!-- Line spacing -->
  <rect x="229" y="330" width="70" height="26" fill="rgba(255,255,255,0.06)" rx="6"/>
  <text x="264" y="347" fill="#94a3b8" font-size="11" text-anchor="middle">行距: 1.5</text>

  <!-- Page size -->
  <rect x="306" y="330" width="80" height="26" fill="rgba(255,255,255,0.06)" rx="6"/>
  <text x="346" y="347" fill="#94a3b8" font-size="11" text-anchor="middle">页面: A4</text>

  <!-- Convert button -->
  <rect x="410" y="328" width="210" height="30" fill="url(#purplePink)" rx="999"/>
  <text x="515" y="348" fill="#fff" font-size="13" font-weight="700" text-anchor="middle">📄 转换为 PDF</text>
</svg>