<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#070b18"/>
    </linearGradient>
  </defs>
  <rect width="680" height="400" fill="url(#bgGrad)"/>
  <text x="340" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#ffffff">Codeium</text>
  <text x="340" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#94a3b8">AI Code Completion &amp; IDE Plugin</text>
  <rect x="40" y="110" width="600" height="260" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <rect x="50" y="125" width="120" height="35" rx="4" fill="#0ea5e9"/>
  <text x="110" y="148" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">Complete</text>
  <rect x="190" y="125" width="120" height="35" rx="4" fill="#334155"/>
  <text x="250" y="148" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#cbd5e1">Explain</text>
  <rect x="330" y="125" width="120" height="35" rx="4" fill="#334155"/>
  <text x="390" y="148" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#cbd5e1">Optimize</text>
  <rect x="470" y="125" width="120" height="35" rx="4" fill="#334155"/>
  <text x="530" y="148" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#cbd5e1">Chat</text>
  <rect x="60" y="175" width="560" height="150" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <rect x="70" y="185" width="540" height="130" rx="2" fill="#1e293b"/>
  <text x="80" y="205" font-family="monospace" font-size="10" fill="#94a3b8">def calculate_fibonacci(n):</text>
  <text x="80" y="225" font-family="monospace" font-size="10" fill="#94a3b8">    # Codeium suggests next lines</text>
  <text x="80" y="245" font-family="monospace" font-size="10" fill="#34d399">    if n &lt;= 0: return []</text>
  <text x="80" y="265" font-family="monospace" font-size="10" fill="#34d399">    elif n == 1: return [0]</text>
  <text x="80" y="285" font-family="monospace" font-size="10" fill="#34d399">    fib = [0, 1]</text>
  <text x="80" y="305" font-family="monospace" font-size="10" fill="#34d399">    for i in range(2, n):</text>
  <text x="80" y="325" font-family="monospace" font-size="10" fill="#34d399">        fib.append(fib[i-1] + fib[i-2])</text>
  <text x="80" y="345" font-family="monospace" font-size="10" fill="#34d399">    return fib</text>
  <rect x="60" y="340" width="560" height="25" rx="4" fill="#1e293b"/>
  <text x="80" y="357" font-family="Arial, sans-serif" font-size="11" fill="#94a3b8">// Start typing to get AI suggestions...</text>
</svg>
