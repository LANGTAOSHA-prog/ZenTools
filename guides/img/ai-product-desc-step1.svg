<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="'Inter',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b18"/>
    </linearGradient>
    <linearGradient id="userMsg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="680" height="400" fill="url(#bg)" rx="14"/>
  <text x="30" y="42" fill="#f0f4ff" font-size="20" font-weight="700">🏷️ AI 产品描述</text>
  <text x="30" y="66" fill="#6b7a9f" font-size="13">生成电商产品描述、商品文案和卖点提炼，提升转化率。</text>
  <rect x="30" y="85" width="620" height="290" fill="rgba(14,22,41,0.8)" rx="14" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <!-- Product info -->
  <rect x="50" y="100" width="300" height="40" rx="8" fill="rgba(20,31,55,0.9)" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <text x="70" y="125" fill="#94a3b8" font-size="12">产品名称：智能手表 Pro</text>
  <rect x="370" y="100" width="280" height="40" rx="8" fill="rgba(20,31,55,0.9)" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <text x="390" y="125" fill="#94a3b8" font-size="12">产品类别：电子产品</text>
  <!-- Input area -->
  <rect x="50" y="150" width="300" height="120" rx="10" fill="rgba(20,31,55,0.9)" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <text x="70" y="175" fill="#f0f4ff" font-size="14" font-weight="600">产品特点</text>
  <rect x="70" y="190" width="260" height="60" rx="8" fill="rgba(14,22,41,0.6)" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <text x="80" y="215" fill="#94a3b8" font-size="11">• 高清AMOLED屏幕</text>
  <text x="80" y="235" fill="#94a3b8" font-size="11">• 心率血氧监测</text>
  <text x="80" y="255" fill="#94a3b8" font-size="11">• 7天超长续航</text>
  <rect x="70" y="260" width="100" height="32" rx="8" fill="url(#userMsg)" opacity="0.8"/>
  <text x="120" y="281" fill="#fff" font-size="12" text-anchor="middle">生成描述</text>
  <!-- Output area -->
  <rect x="370" y="150" width="280" height="120" rx="10" fill="rgba(20,31,55,0.9)" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <text x="390" y="175" fill="#f0f4ff" font-size="14" font-weight="600">生成结果</text>
  <rect x="390" y="190" width="240" height="60" rx="8" fill="rgba(14,22,41,0.6)" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <text x="400" y="215" fill="#22c55e" font-size="11">智能手表 Pro - 您的健康伴侣</text>
  <text x="400" y="235" fill="#22c55e" font-size="11">搭载高清AMOLED屏幕，精准监测心率血氧，</text>
  <text x="400" y="255" fill="#22c55e" font-size="11">7天超长续航，让健康触手可及。</text>
  <rect x="390" y="260" width="100" height="32" rx="8" fill="rgba(34,197,94,0.2)" stroke="rgba(34,197,94,0.3)" stroke-width="1"/>
  <text x="440" y="281" fill="#22c55e" font-size="12" text-anchor="middle">复制描述</text>
  <!-- Features -->
  <text x="50" y="310" fill="#6b7a9f" font-size="11">支持：电商描述 · 商品文案 · 卖点提炼 · 营销文案</text>
  <text x="350" y="310" fill="#6b7a9f" font-size="11">提升转化 · 吸引客户 · 多种风格</text>
  <!-- Bottom info -->
  <text x="50" y="340" fill="#4a5a7a" font-size="10">所有处理在浏览器本地完成，文件不会上传到服务器</text>
</svg>