<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="'Inter',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b18"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="680" height="400" fill="url(#bg)" rx="14"/>
  <text x="30" y="42" fill="#f0f4ff" font-size="20" font-weight="700">🎙️ 音频提取</text>
  <text x="30" y="66" fill="#6b7a9f" font-size="13">从视频文件中提取音频轨道，支持多种视频格式。</text>
  <rect x="30" y="85" width="620" height="290" fill="rgba(14,22,41,0.8)" rx="14" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="50" y="118" fill="#f0f4ff" font-size="15" font-weight="700">设置提取参数</text>
  <rect x="50" y="132" width="580" height="100" rx="10" fill="rgba(10,14,26,0.6)" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  <text x="65" y="158" fill="#f0f4ff" font-size="12" font-weight="600">输出格式</text>
  <rect x="65" y="168" width="60" height="24" rx="6" fill="rgba(59,130,246,0.3)" stroke="rgba(59,130,246,0.6)" stroke-width="1"/>
  <text x="95" y="185" fill="#fff" font-size="11" font-weight="600" text-anchor="middle">MP3</text>
  <rect x="130" y="168" width="60" height="24" rx="6" fill="rgba(255,255,255,0.03)"/>
  <text x="160" y="185" fill="#6b7a9f" font-size="11" font-weight="600" text-anchor="middle">WAV</text>
  <rect x="195" y="168" width="60" height="24" rx="6" fill="rgba(255,255,255,0.03)"/>
  <text x="225" y="185" fill="#6b7a9f" font-size="11" font-weight="600" text-anchor="middle">AAC</text>
  <rect x="260" y="168" width="60" height="24" rx="6" fill="rgba(255,255,255,0.03)"/>
  <text x="290" y="185" fill="#6b7a9f" font-size="11" font-weight="600" text-anchor="middle">FLAC</text>
  <text x="65" y="210" fill="#f0f4ff" font-size="12" font-weight="600">比特率</text>
  <rect x="65" y="220" width="250" height="8" rx="4" fill="rgba(255,255,255,0.05)"/>
  <rect x="65" y="220" width="187" height="8" rx="4" fill="#3b82f6"/>
  <text x="65" y="242" fill="#6b7a9f" font-size="11">192kbps</text>
  <text x="280" y="242" fill="#4a5a7a" font-size="10" text-anchor="end">64kbps — 320kbps</text>
  <rect x="345" y="132" width="285" height="100" rx="10" fill="rgba(10,14,26,0.6)" stroke="rgba(0,229,255,0.2)" stroke-width="1"/>
  <text x="360" y="158" fill="#00e5ff" font-size="12" font-weight="600">提取预览</text>
  <text x="360" y="180" fill="#8899bb" font-size="11">视频时长：03:45</text>
  <text x="360" y="200" fill="#8899bb" font-size="11">音频轨道：立体声</text>
  <text x="360" y="220" fill="#8899bb" font-size="11">采样率：44100 Hz</text>
  <text x="360" y="240" fill="#00e5ff" font-size="11">预估输出大小：约 5.2 MB</text>
  <rect x="50" y="245" width="580" height="105" rx="10" fill="rgba(10,14,26,0.6)" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  <text x="65" y="270" fill="#f0f4ff" font-size="12" font-weight="600">音频轨道选择</text>
  <rect x="65" y="280" width="550" height="26" rx="4" fill="rgba(20,31,55,0.8)" stroke="rgba(59,130,246,0.3)" stroke-width="1"/>
  <text x="80" y="297" fill="#f0f4ff" font-size="11">轨道 1：立体声（English）✓</text>
  <rect x="260" y="280" width="550" height="26" rx="4" fill="rgba(20,31,55,0.6)"/>
  <text x="275" y="297" fill="#6b7a9f" font-size="11">轨道 2：立体声（中文）</text>
  <rect x="65" y="314" width="550" height="26" rx="4" fill="rgba(20,31,55,0.6)"/>
  <text x="80" y="331" fill="#6b7a9f" font-size="11">轨道 3：单声道（音效）</text>
</svg>
