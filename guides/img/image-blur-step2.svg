<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" font-family="'Inter',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b18"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="680" height="380" fill="url(#bg)" rx="14"/>
  <text x="30" y="42" fill="#f0f4ff" font-size="20" font-weight="700">🌁 图片模糊</text>
  <text x="30" y="66" fill="#6b7a9f" font-size="13">对比原图和模糊处理效果。</text>
  <rect x="30" y="85" width="620" height="275" fill="rgba(14,22,41,0.8)" rx="14" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="50" y="118" fill="#f0f4ff" font-size="15" font-weight="700">模糊结果</text>
  <!-- Before / After comparison -->
  <rect x="50" y="135" width="280" height="200" rx="12" fill="rgba(20,31,55,0.5)" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <text x="190" y="160" fill="#6b7a9f" font-size="11" text-anchor="middle">处理前</text>
  <rect x="70" y="170" width="100" height="85" rx="6" fill="#3b82f6" opacity="0.4"/>
  <rect x="80" y="180" width="20" height="12" rx="3" fill="#10b981" opacity="0.8"/>
  <rect x="110" y="175" width="15" height="15" rx="3" fill="#f59e0b" opacity="0.8"/>
  <rect x="130" y="185" width="25" height="8" rx="2" fill="#8b5cf6" opacity="0.6"/>
  <text x="190" y="275" fill="#6b7a9f" font-size="11" text-anchor="middle">处理后（模糊半径=12）</text>
  <rect x="70" y="285" width="100" height="40" rx="6" fill="rgba(59,130,246,0.3)"/>
  <rect x="80" y="290" width="80" height="25" rx="6" fill="rgba(59,130,246,0.15)"/>
  <!-- Result panel -->
  <rect x="350" y="135" width="280" height="200" rx="12" fill="rgba(20,31,55,0.85)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="490" y="160" fill="#f0f4ff" font-size="13" font-weight="600" text-anchor="middle">模糊结果</text>
  <line x1="365" y1="172" x2="615" y2="172" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="365" y="195" fill="#6b7a9f" font-size="11">模糊类型</text>
  <text x="365" y="215" fill="#f0f4ff" font-size="13">高斯模糊</text>
  <text x="365" y="240" fill="#6b7a9f" font-size="11">模糊半径</text>
  <text x="365" y="260" fill="#f0f4ff" font-size="13">12 像素</text>
  <text x="365" y="285" fill="#6b7a9f" font-size="11">输出尺寸</text>
  <text x="365" y="305" fill="#f0f4ff" font-size="13">1920 × 1280 px</text>
  <rect x="365" y="315" width="250" height="30" rx="8" fill="url(#accent)"/>
  <text x="490" y="335" fill="#fff" font-size="12" font-weight="600" text-anchor="middle">下载模糊图片</text>
</svg>