<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="'Inter',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
<defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0f172a"/><stop offset="100%" stop-color="#070b18"/></linearGradient><linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#3b82f6"/><stop offset="100%" stop-color="#8b5cf6"/></linearGradient></defs>
<rect width="680" height="400" fill="url(#bg)" rx="14"/>
<text x="30" y="42" fill="#f0f4ff" font-size="20" font-weight="700">📊 利率计算器</text>
<text x="30" y="66" fill="#6b7a9f" font-size="13">计算名义利率、实际利率、APR和EAR，比较不同金融产品收益。</text>
<rect x="30" y="85" width="620" height="290" fill="rgba(14,22,41,0.8)" rx="14" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
<text x="50" y="118" fill="#f0f4ff" font-size="15" font-weight="700">输入参数</text>
<rect x="50" y="130" width="270" height="36" fill="#0a0e1a" rx="8" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
<text x="65" y="153" fill="#8899bb" font-size="13">名义利率: 6%</text>
<rect x="340" y="130" width="270" height="36" fill="#0a0e1a" rx="8" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
<text x="355" y="153" fill="#8899bb" font-size="13">通胀率: 2.5%</text>
<rect x="50" y="178" width="270" height="36" fill="#0a0e1a" rx="8" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
<text x="65" y="201" fill="#8899bb" font-size="13">复利频率: 季度</text>
<rect x="340" y="178" width="270" height="36" fill="#0a0e1a" rx="8" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
<text x="355" y="201" fill="#8899bb" font-size="13">计算类型: 实际利率</text>
<rect x="50" y="235" width="580" height="110" fill="#0f1a35" rx="10" stroke="rgba(0,229,255,0.15)" stroke-width="1"/>
<text x="70" y="260" fill="#6b7a9f" font-size="13">名义利率: <tspan fill="#f0f4ff" font-weight="700">6.00%</tspan>  通胀率: <tspan fill="#f0f4ff" font-weight="700">2.50%</tspan></text>
<text x="70" y="282" fill="#6b7a9f" font-size="13">实际利率: <tspan fill="#00e5ff" font-weight="700">3.41%</tspan></text>
<text x="70" y="310" fill="#6b7a9f" font-size="13">APR: <tspan fill="#00e5ff" font-weight="700">6.09%</tspan>  EAR: <tspan fill="#00e5ff" font-weight="700">6.14%</tspan></text>
<text x="70" y="332" fill="#6b7a9f" font-size="13">复利频率: <tspan fill="#f0f4ff" font-weight="700">每季度一次</tspan></text>
</svg>
