<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="'Inter',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b18"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
  </defs>
  <rect width="680" height="400" fill="url(#bg)" rx="14"/>

  <text x="30" y="42" fill="#f0f4ff" font-size="20" font-weight="700">🗜️ PDF 压缩 - 结果</text>
  <text x="30" y="66" fill="#6b7a9f" font-size="13">压缩完成，查看压缩效果并下载。</text>

  <rect x="30" y="85" width="620" height="290" fill="rgba(14,22,41,0.8)" rx="14" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

  <text x="50" y="118" fill="#f0f4ff" font-size="15" font-weight="700">压缩结果</text>

  <!-- Stats -->
  <rect x="50" y="135" width="580" height="80" rx="12" fill="rgba(10,14,26,0.6)" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>

  <!-- Before -->
  <rect x="75" y="147" width="140" height="55" rx="8" fill="rgba(239,68,68,0.1)" stroke="rgba(239,68,68,0.2)" stroke-width="1"/>
  <text x="145" y="168" fill="#ef4444" font-size="11" text-anchor="middle">压缩前</text>
  <text x="145" y="190" fill="#f0f4ff" font-size="18" font-weight="700" text-anchor="middle">12.5 MB</text>

  <!-- Arrow -->
  <text x="265" y="182" fill="#6b7a9f" font-size="20">→</text>

  <!-- After -->
  <rect x="290" y="147" width="140" height="55" rx="8" fill="rgba(0,229,255,0.1)" stroke="rgba(0,229,255,0.2)" stroke-width="1"/>
  <text x="360" y="168" fill="#00e5ff" font-size="11" text-anchor="middle">压缩后</text>
  <text x="360" y="190" fill="#f0f4ff" font-size="18" font-weight="700" text-anchor="middle">4.2 MB</text>

  <!-- Reduction -->
  <rect x="460" y="147" width="140" height="55" rx="8" fill="rgba(168,85,247,0.1)" stroke="rgba(168,85,247,0.2)" stroke-width="1"/>
  <text x="530" y="168" fill="#a855f7" font-size="11" text-anchor="middle">减小</text>
  <text x="530" y="190" fill="#f0f4ff" font-size="18" font-weight="700" text-anchor="middle">66%</text>

  <!-- Download button -->
  <rect x="200" y="235" width="280" height="46" rx="999" fill="url(#accent)"/>
  <text x="340" y="263" fill="#fff" font-size="15" font-weight="700" text-anchor="middle">⬇ 下载压缩后的 PDF</text>

  <text x="340" y="310" fill="#4a5a7a" font-size="12" text-anchor="middle">处理完成后文件自动保存在浏览器本地，不会上传任何服务器</text>
</svg>
