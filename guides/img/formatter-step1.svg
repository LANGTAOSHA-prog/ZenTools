<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="'Inter',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b18"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
  </defs>
  <rect width="680" height="400" fill="url(#bg)" rx="14"/>
  <text x="30" y="42" fill="#f0f4ff" font-size="20" font-weight="700">代码格式化工具</text>
  <text x="30" y="66" fill="#6b7a9f" font-size="13">格式化 JSON、XML、HTML、SQL 等代码，支持多种缩进和排版选项。</text>
  <rect x="30" y="85" width="620" height="290" fill="rgba(14,22,41,0.8)" rx="14" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="50" y="118" fill="#f0f4ff" font-size="15" font-weight="700">代码格式化</text>
  <rect x="50" y="135" width="580" height="80" fill="#0a0e1a" rx="8" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="65" y="158" fill="#4a5a7a" font-size="10" font-weight="600">输入（紧凑代码）</text>
  <text x="65" y="180" fill="#94a3b8" font-size="10" font-family="'JetBrains Mono',monospace">{&quot;name&quot;:&quot;test&quot;&quot;version&quot;:&quot;1.0&quot;&quot;data&quot;:[{&quot;a&quot;:1,&quot;b&quot;:2}]}</text>
  <rect x="50" y="225" width="580" height="80" fill="#0a0e1a" rx="8" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="65" y="248" fill="#4a5a7a" font-size="10" font-weight="600">输出（格式化后）</text>
  <text x="65" y="270" fill="#22c55e" font-size="10" font-family="'JetBrains Mono',monospace">{</text>
  <text x="65" y="286" fill="#22c55e" font-size="10" font-family="'JetBrains Mono',monospace">  &quot;name&quot;: &quot;test&quot;,</text>
  <text x="65" y="302" fill="#22c55e" font-size="10" font-family="'JetBrains Mono',monospace">  &quot;version&quot;: &quot;1.0&quot;,</text>
  <rect x="50" y="315" width="580" height="28" fill="rgba(255,255,255,0.02)" rx="6"/>
  <text x="140" y="333" fill="#94a3b8" font-size="10" font-family="'JetBrains Mono',monospace">&quot;data&quot;: [{ &quot;a&quot;: 1, &quot;b&quot;: 2 }] }</text>
  <rect x="250" y="175" width="60" height="40" fill="url(#accent)" rx="8"/>
  <text x="280" y="199" fill="#fff" font-size="14" text-anchor-middle">&#10148;</text>
  <rect x="340" y="175" width="120" height="40" fill="rgba(20,31,55,0.9)" rx="8" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <text x="400" y="199" fill="#94a3b8" font-size="11" text-anchor="middle">JSON / XML / SQL</text>
</svg>
