<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="'Inter',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b18"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="purple2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
  </defs>
  <rect width="680" height="400" fill="url(#bg)" rx="14"/>

  <!-- Title -->
  <text x="30" y="42" fill="#f0f4ff" font-size="20" font-weight="700">📽️ PPT 转 PDF</text>
  <text x="30" y="66" fill="#6b7a9f" font-size="13">将 PowerPoint 演示文稿转换为 PDF 格式，支持 .ppt 和 .pptx 格式。</text>

  <!-- Tool box -->
  <rect x="30" y="85" width="620" height="290" fill="rgba(14,22,41,0.8)" rx="14" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

  <!-- Left panel: Upload area & options -->
  <text x="50" y="118" fill="#f0f4ff" font-size="15" font-weight="700">上传 PPT 文件</text>
  <text x="50" y="138" fill="#6b7a9f" font-size="12">选择 PowerPoint 文件，一键转换为 PDF。</text>

  <!-- Upload zone -->
  <rect x="50" y="155" width="270" height="100" rx="12" fill="rgba(20,31,55,0.85)" stroke="rgba(168,85,247,0.4)" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="185" y="192" fill="#6b7a9f" font-size="28" text-anchor="middle">📽️</text>
  <text x="185" y="220" fill="#8899bb" font-size="12" text-anchor="middle">点击上传或拖拽 PPT</text>
  <text x="185" y="240" fill="#4a5a7a" font-size="10" text-anchor="middle">支持 .ppt · .pptx 格式</text>

  <!-- Slide preview thumbnails (right panel) -->
  <rect x="340" y="155" width="290" height="100" rx="10" fill="rgba(10,14,26,0.7)" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <text x="355" y="178" fill="#4a5a7a" font-size="11">幻灯片预览</text>

  <!-- Thumbnail 1 -->
  <rect x="355" y="188" width="55" height="42" rx="4" fill="rgba(20,31,55,0.9)" stroke="rgba(168,85,247,0.3)" stroke-width="1"/>
  <rect x="362" y="196" width="40" height="4" rx="1" fill="rgba(168,85,247,0.3)"/>
  <rect x="362" y="204" width="35" height="3" rx="1" fill="rgba(255,255,255,0.07)"/>
  <rect x="362" y="210" width="38" height="3" rx="1" fill="rgba(255,255,255,0.05)"/>
  <rect x="362" y="216" width="30" height="3" rx="1" fill="rgba(255,255,255,0.05)"/>
  <text x="382" y="240" fill="#4a5a7a" font-size="7" text-anchor="middle">Slide 1</text>

  <!-- Thumbnail 2 -->
  <rect x="420" y="188" width="55" height="42" rx="4" fill="rgba(20,31,55,0.9)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <rect x="427" y="196" width="40" height="4" rx="1" fill="rgba(236,72,153,0.3)"/>
  <rect x="427" y="204" width="35" height="3" rx="1" fill="rgba(255,255,255,0.07)"/>
  <rect x="427" y="210" width="38" height="3" rx="1" fill="rgba(255,255,255,0.05)"/>
  <rect x="427" y="216" width="20" height="3" rx="1" fill="rgba(255,255,255,0.05)"/>
  <text x="447" y="240" fill="#4a5a7a" font-size="7" text-anchor="middle">Slide 2</text>

  <!-- Thumbnail 3 -->
  <rect x="485" y="188" width="55" height="42" rx="4" fill="rgba(20,31,55,0.9)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <rect x="492" y="196" width="40" height="4" rx="1" fill="rgba(139,92,246,0.3)"/>
  <rect x="492" y="204" width="25" height="3" rx="1" fill="rgba(255,255,255,0.07)"/>
  <rect x="492" y="210" width="30" height="3" rx="1" fill="rgba(255,255,255,0.05)"/>
  <text x="512" y="240" fill="#4a5a7a" font-size="7" text-anchor="middle">Slide 3</text>

  <!-- More pages indicator -->
  <rect x="550" y="188" width="20" height="42" rx="4" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="560" y="212" fill="#4a5a7a" font-size="9" text-anchor="middle">+8</text>

  <!-- Conversion options -->
  <text x="50" y="280" fill="#8899bb" font-size="12">转换选项</text>

  <!-- 保留动画 -->
  <rect x="50" y="291" width="14" height="14" rx="3" fill="rgba(168,85,247,0.2)" stroke="#a855f7" stroke-width="1.5"/>
  <text x="70" y="303" fill="#94a3b8" font-size="11">保留动画</text>

  <!-- 保留备注 -->
  <rect x="160" y="291" width="14" height="14" rx="3" fill="rgba(168,85,247,0.2)" stroke="#a855f7" stroke-width="1.5"/>
  <text x="180" y="303" fill="#94a3b8" font-size="11">保留备注</text>

  <!-- 每页一张 -->
  <rect x="270" y="291" width="14" height="14" rx="3" fill="rgba(20,31,55,0.85)" stroke="#4a5a7a" stroke-width="1.5"/>
  <text x="290" y="303" fill="#94a3b8" font-size="11">每页一张</text>

  <!-- Start convert button -->
  <rect x="50" y="325" width="580" height="36" fill="url(#accent)" rx="10"/>
  <text x="340" y="348" fill="#fff" font-size="14" font-weight="700" text-anchor="middle">📄 开始转换</text>
</svg>