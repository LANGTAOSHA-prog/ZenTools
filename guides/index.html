function renderGuides(lang) {
  let html = '';
  
  guidesData.forEach(function(guide) {
    const t = guide[lang] || guide.zh;
    html += '<div class="guide-card">';
    html += '<div class="guide-icon">' + guide.icon + '</div>';
    html += '<h2 class="guide-title">' + t.title + '</h2>';
    html += '<p class="guide-desc">' + t.desc + '</p>';
    html += '<div class="guide-meta">';
    html += '<span>📖 ' + t.words + '</span>';
    html += '<span>⏱️ ' + t.time + '</span>';
    html += '</div>';
    html += '<a href="' + t.file + '" class="guide-link">' + t.link + '</a>';
    html += '</div>';
  });
  
  document.getElementById('guidesGrid').innerHTML = html;
}

// Initial render
const savedLang = localStorage.getItem('zentools_lang') || navigator.language.slice(0, 2) || 'zh';
renderGuides(savedLang);

window.addEventListener('zt-langchange', function(e) {
