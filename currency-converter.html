<body>

<header>
    <h1 id="title">汇率换算工具</h1>
    <p id="subtitle">免费在线货币汇率换算，支持人民币、美元、日元、欧元等常用货币</p>

<div class="container">

                <label id="fromLabel">从</label>
                <select id="fromCurrency" onchange="convertCurrency()"></select>
            </div>

            <div class="input-group">
                <label id="toLabel">换算为</label>
                <select id="toCurrency" onchange="convertCurrency()"></select>
            </div>
        </div>

        <button class="swap-btn" onclick="swapCurrency()" id="swapBtn">交换货币</button>

        <div class="result">
            <div id="resultText">换算结果</div>
            <div class="big" id="result">正在获取汇率...</div>
            <div class="rate-info" id="rateInfo"></div>
        </div>

        <div class="status" id="statusText">汇率数据加载中...</div>

    </div>

    <div class="ad-box">
        工具下方广告位 / Google AdSense
    </div>

        <p id="infoText">
            本工具可以帮助你快速进行不同货币之间的换算。适合旅行、跨境购物、外汇参考、国际转账估算等场景。
            汇率会随市场变化而波动，最终金额请以银行、支付平台或换汇机构实际汇率为准。
        </p>

</div>

<footer>

<script>
const currencies = {
    "USD": "USD - 美元 / US Dollar",
    "CNY": "CNY - 人民币 / Chinese Yuan",
    "JPY": "JPY - 日元 / Japanese Yen",
    "EUR": "EUR - 欧元 / Euro",
    "GBP": "GBP - 英镑 / British Pound",
    "KRW": "KRW - 韩元 / Korean Won",
    "HKD": "HKD - 港币 / Hong Kong Dollar",
    "TWD": "TWD - 新台币 / Taiwan Dollar",
    "AUD": "AUD - 澳元 / Australian Dollar",
    "CAD": "CAD - 加元 / Canadian Dollar",
    "SGD": "SGD - 新加坡元 / Singapore Dollar",
    "THB": "THB - 泰铢 / Thai Baht",
    "VND": "VND - 越南盾 / Vietnamese Dong",
    "PHP": "PHP - 菲律宾比索 / Philippine Peso",
    "MYR": "MYR - 马来西亚林吉特 / Malaysian Ringgit",
    "IDR": "IDR - 印尼盾 / Indonesian Rupiah",
    "INR": "INR - 印度卢比 / Indian Rupee",
    "CHF": "CHF - 瑞士法郎 / Swiss Franc",
    "NZD": "NZD - 新西兰元 / New Zealand Dollar",
    "SEK": "SEK - 瑞典克朗 / Swedish Krona"
};

let rates = {};
let lastUpdate = "";

const fromCurrency = document.getElementById("fromCurrency");
const toCurrency = document.getElementById("toCurrency");

function initCurrencyOptions() {
    for (let code in currencies) {
        const option1 = document.createElement("option");
        option1.value = code;
        option1.textContent = currencies[code];
        fromCurrency.appendChild(option1);

        const option2 = document.createElement("option");
        option2.value = code;
        option2.textContent = currencies[code];
        toCurrency.appendChild(option2);
    }

    fromCurrency.value = "USD";
    toCurrency.value = "CNY";
}

async function fetchRates() {
    const statusText = document.getElementById("statusText");
    const result = document.getElementById("result");

    try {
        const response = await fetch("https://open.er-api.com/v6/latest/USD");
        const data = await response.json();

        if (data && data.result === "success") {
            rates = data.rates;
            lastUpdate = data.time_last_update_utc || "";
            statusText.textContent = "汇率数据已更新";
            convertCurrency();
        } else {
            throw new Error("Rate API error");
        }
    } catch (error) {
        result.textContent = "无法获取实时汇率";
        statusText.textContent = "汇率接口暂时无法连接，请稍后再试。";
    }
}

function convertCurrency() {
    const amount = parseFloat(document.getElementById("amount").value);
    const from = fromCurrency.value;
    const to = toCurrency.value;
    const result = document.getElementById("result");
    const rateInfo = document.getElementById("rateInfo");

    if (!rates || Object.keys(rates).length === 0) {
        result.textContent = "正在获取汇率...";
        return;
    }

    if (isNaN(amount) || amount < 0) {
        result.textContent = "请输入正确金额";
        rateInfo.textContent = "";
        return;
    }

    const usdAmount = amount / rates[from];
    const converted = usdAmount * rates[to];

    const directRate = rates[to] / rates[from];

    result.textContent = `${amount.toLocaleString()} ${from} = ${converted.toLocaleString(undefined, {
        maximumFractionDigits: 4
    })} ${to}`;

    rateInfo.textContent = `1 ${from} ≈ ${directRate.toFixed(6)} ${to}`;
}

function swapCurrency() {
    const from = fromCurrency.value;
    fromCurrency.value = toCurrency.value;
    toCurrency.value = from;
    convertCurrency();
}

const translations = {
    zh: {
        title: "汇率换算工具",
        subtitle: "免费在线货币汇率换算，支持人民币、美元、日元、欧元等常用货币",
        amountLabel: "金额",
        fromLabel: "从",
        toLabel: "换算为",
        swapBtn: "交换货币",
        resultText: "换算结果",
        statusText: "汇率数据已更新",
        infoTitle: "汇率换算工具说明",
        infoText: "本工具可以帮助你快速进行不同货币之间的换算。适合旅行、跨境购物、外汇参考、国际转账估算等场景。汇率会随市场变化而波动，最终金额请以银行、支付平台或换汇机构实际汇率为准。"
    },
    en: {
        title: "Currency Converter",
        subtitle: "Free online currency converter for USD, CNY, JPY, EUR and more",
        amountLabel: "Amount",
        fromLabel: "From",
        toLabel: "To",
        swapBtn: "Swap Currency",
        resultText: "Result",
        statusText: "Exchange rates updated",
        infoTitle: "About This Currency Converter",
        infoText: "This tool helps you quickly convert between different currencies. It is useful for travel, online shopping, foreign exchange reference and international payment estimation. Exchange rates may change at any time. Please refer to your bank or payment provider for the final rate."
    },
    ja: {
        title: "為替レート換算ツール",
        subtitle: "米ドル、人民元、日本円、ユーロなどを無料で換算できます",
        amountLabel: "金額",
        fromLabel: "換算元",
        toLabel: "換算先",
        swapBtn: "通貨を交換",
        resultText: "換算結果",
        statusText: "為替レートを更新しました",
        infoTitle: "為替換算ツールについて",
        infoText: "このツールでは、さまざまな通貨を簡単に換算できます。旅行、海外ショッピング、送金の目安などに利用できます。為替レートは常に変動するため、最終的な金額は銀行や決済サービスのレートをご確認ください。"
    },
    vi: {
        title: "Công Cụ Chuyển Đổi Tiền Tệ",
        subtitle: "Chuyển đổi miễn phí USD, CNY, JPY, EUR và nhiều loại tiền khác",
        amountLabel: "Số tiền",
        fromLabel: "Từ",
        toLabel: "Sang",
        swapBtn: "Đổi loại tiền",
        resultText: "Kết quả",
        statusText: "Tỷ giá đã được cập nhật",
        infoTitle: "Giới thiệu công cụ đổi tiền",
        infoText: "Công cụ này giúp bạn chuyển đổi nhanh giữa các loại tiền tệ khác nhau. Phù hợp cho du lịch, mua sắm quốc tế, tham khảo tỷ giá và ước tính chuyển tiền. Tỷ giá có thể thay đổi theo thị trường, vui lòng kiểm tra tỷ giá cuối cùng tại ngân hàng hoặc nền tảng thanh toán."
    }
};

function changeLanguage() {
    const lang = document.getElementById("language").value;
    const t = translations[lang];

    document.documentElement.lang = lang;

    document.getElementById("title").textContent = t.title;
    document.getElementById("subtitle").textContent = t.subtitle;
    document.getElementById("amountLabel").textContent = t.amountLabel;
    document.getElementById("fromLabel").textContent = t.fromLabel;
    document.getElementById("toLabel").textContent = t.toLabel;
    document.getElementById("swapBtn").textContent = t.swapBtn;
    document.getElementById("resultText").textContent = t.resultText;
    document.getElementById("infoTitle").textContent = t.infoTitle;
    document.getElementById("infoText").textContent = t.infoText;

    if (rates && Object.keys(rates).length > 0) {
        document.getElementById("statusText").textContent = t.statusText;
    }
}

initCurrencyOptions();
fetchRates();
</script>

</body>
</html>
