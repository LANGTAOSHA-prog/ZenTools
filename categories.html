<script>
function tCatLocal(cat, lang, cats, catsEn, catsJa, catsVi) {
  if (lang === 'zh' || !cats) return cat;
  var map = { en: catsEn, ja: catsJa, vi: catsVi };
  var arr = map[lang];
  if (arr && cats) {
    var idx = cats.indexOf(cat);
    if (idx >= 0 && idx < arr.length) return arr[idx];
  }
  return cat;
}
function renderCategories(lang) {
  var cats = window.categoriesData || [];
  var catsEn = window.categoriesData__en || [];
  var catsJa = window.categoriesData__ja || [];
  var catsVi = window.categoriesData__vi || [];
  var tools = window.toolsData || [];
  var catSlug = { 'AI工具':'ai', '图片工具':'image', 'PDF工具':'pdf', '开发工具':'dev', '生活工具':'life', '音频工具':'audio', '视频工具':'video', '文本工具':'text', 'SEO工具':'seo', '金融工具':'finance', '设计工具':'design', '办公工具':'', '教育工具':'' };
  var grouped = {};
  tools.forEach(function(t) {
    var cat = t.category || '其他';
    if (!grouped[cat]) grouped[cat] = [];
    grouped[cat].push(t);
  });
  var grid = document.getElementById('categoryGrid');
  grid.innerHTML = cats.map(function(cat) {
    var count = (grouped[cat] || []).length;
    var catName = tCatLocal(cat, lang, cats, catsEn, catsJa, catsVi);
    var slug = catSlug[cat];
    var href = slug ? '/' + slug + '/' : 'javascript:void(0)';
    return '<a class="tool-card" href="' + href + '"><h3>' + catName + '</h3><p>' + count + ' 个工具</p></a>';
  }).join('');
}
function applyPageLang(lang) {
  var d = window.ZT_PAGE && window.ZT_PAGE[lang];
  if (!d) return;
  document.title = d.pageTitle || document.title;
  document.getElementById('metaDesc').content = d.metaDesc || '';
  document.querySelectorAll('[data-i18n]').forEach(function(el) {
    var key = el.getAttribute('data-i18n');
    if (d[key]) el.textContent = d[key];
  });
  renderCategories(lang);
}
document.addEventListener('DOMContentLoaded', function() {
  var lang = localStorage.getItem('zentools_lang') || 'zh';
  applyPageLang(lang);
});
window.addEventListener('zt-langchange', function(e) {
  applyPageLang(e.detail.lang);
});
</script>
