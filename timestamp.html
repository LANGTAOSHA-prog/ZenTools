<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>时间戳转换 - ZenTools</title>
<meta name="description" content="ZenTools 免费在线时间戳转换工具，支持 Unix 时间戳与日期时间互转。">

<style>
:root{--bg:#0f172a;--card:#111827;--border:#1f2937;--text:#f3f4f6;--muted:#94a3b8;--blue:#2563eb;--green:#10b981;--red:#ef4444}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:Arial,"Noto Sans SC","Noto Sans JP",sans-serif;line-height:1.7}
.container{max-width:1000px;margin:auto;padding:40px 20px}
a{color:#60a5fa;text-decoration:none}
.top-bar{display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap;margin-bottom:20px}
.lang-select{background:#111827;color:white;border:1px solid #334155;border-radius:10px;padding:10px 12px}
.card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:28px}
h1{margin-bottom:15px}
.desc{color:var(--muted);margin-bottom:25px}
.ad-box{margin:25px 0;height:110px;border:2px dashed #334155;border-radius:18px;display:flex;align-items:center;justify-content:center;color:#64748b}
.tool-box{background:#0b1220;border:1px solid #334155;border-radius:16px;padding:20px;margin-top:22px}
input{width:100%;margin:12px 0;padding:14px;border-radius:12px;border:1px solid #334155;background:#0f172a;color:white;font-size:16px}
button{background:var(--blue);color:white;border:none;padding:13px 18px;border-radius:12px;cursor:pointer;font-size:15px;font-weight:bold;margin:6px 6px 6px 0}
.copy-btn{background:var(--green)}
.clear-btn{background:var(--red)}
.result{margin-top:15px;color:#cbd5e1;white-space:pre-line}
.info{margin-top:35px}
.info h2{margin-top:25px}
.info p{color:#cbd5e1;white-space:pre-line}
footer{margin-top:50px;text-align:center;color:#94a3b8}
@media(max-width:768px){button,.lang-select{width:100%}}
</style>
</head>

<body>
<div class="container">

  <div class="top-bar">
    <a href="index.html" data-i18n="back">← 返回首页</a>
    <select id="languageSelect" class="lang-select">
      <option value="zh">中文</option>
      <option value="ja">日本語</option>
      <option value="en">English</option>
      <option value="vi">Tiếng Việt</option>
    </select>
  </div>

  <div class="card">
    <h1 data-i18n="title">时间戳转换</h1>
    <p class="desc" data-i18n="desc">Unix 时间戳与日期时间互相转换。</p>

    <div class="ad-box" data-i18n="ad">广告位（Google AdSense）</div>

    <div class="tool-box">
      <h2 data-i18n="nowTitle">当前时间戳</h2>
      <input id="nowOutput" readonly>
      <button onclick="updateNow()" data-i18n="refresh">刷新</button>
      <button class="copy-btn" onclick="copyValue('nowOutput')" data-i18n="copy">复制</button>
    </div>

    <div class="tool-box">
      <h2 data-i18n="toDateTitle">时间戳转日期</h2>
      <input id="timestampInput" data-i18n-placeholder="timestampPlaceholder" placeholder="输入时间戳，例如 1710000000">
      <button onclick="timestampToDate()" data-i18n="convert">转换</button>
      <button class="clear-btn" onclick="clearBox('timestampInput','dateResult')" data-i18n="clear">清空</button>
      <div class="result" id="dateResult"></div>
    </div>

    <div class="tool-box">
      <h2 data-i18n="toTimestampTitle">日期转时间戳</h2>
      <input id="dateInput" type="datetime-local">
      <button onclick="dateToTimestamp()" data-i18n="convert">转换</button>
      <button class="clear-btn" onclick="clearBox('dateInput','timestampResult')" data-i18n="clear">清空</button>
      <div class="result" id="timestampResult"></div>
    </div>

    <div class="info">
      <h2 data-i18n="guideTitle">使用说明</h2>
      <p data-i18n="guideText">1. 当前时间戳会自动显示。
2. 输入 Unix 时间戳可转换为本地日期时间。
3. 选择日期时间可转换为 Unix 时间戳。
4. 支持秒级和毫秒级时间戳。</p>

      <h2 data-i18n="privacyTitle">隐私说明</h2>
      <p data-i18n="privacyText">所有转换都在浏览器本地完成，不会上传到服务器。</p>
    </div>
  </div>

  <footer>© 2026 ZenTools</footer>
</div>

<script>
const languageSelect=document.getElementById("languageSelect");
let currentLang="zh";

const translations={
  zh:{
    pageTitle:"时间戳转换 - ZenTools",
    back:"← 返回首页",title:"时间戳转换",desc:"Unix 时间戳与日期时间互相转换。",
    ad:"广告位（Google AdSense）",nowTitle:"当前时间戳",refresh:"刷新",copy:"复制",
    toDateTitle:"时间戳转日期",toTimestampTitle:"日期转时间戳",
    timestampPlaceholder:"输入时间戳，例如 1710000000",
    convert:"转换",clear:"清空",empty:"请输入内容",copied:"已复制",
    localTime:"本地时间：",utcTime:"UTC时间：",seconds:"秒级时间戳：",milliseconds:"毫秒级时间戳：",
    invalid:"输入无效",
    guideTitle:"使用说明",
    guideText:"1. 当前时间戳会自动显示。\n2. 输入 Unix 时间戳可转换为本地日期时间。\n3. 选择日期时间可转换为 Unix 时间戳。\n4. 支持秒级和毫秒级时间戳。",
    privacyTitle:"隐私说明",privacyText:"所有转换都在浏览器本地完成，不会上传到服务器。"
  },
  ja:{
    pageTitle:"タイムスタンプ変換 - ZenTools",
    back:"← ホームに戻る",title:"タイムスタンプ変換",desc:"Unix タイムスタンプと日時を相互変換します。",
    ad:"広告スペース",nowTitle:"現在のタイムスタンプ",refresh:"更新",copy:"コピー",
    toDateTitle:"タイムスタンプを日時へ",toTimestampTitle:"日時をタイムスタンプへ",
    timestampPlaceholder:"タイムスタンプを入力 例：1710000000",
    convert:"変換",clear:"クリア",empty:"内容を入力してください",copied:"コピーしました",
    localTime:"ローカル時間：",utcTime:"UTC時間：",seconds:"秒タイムスタンプ：",milliseconds:"ミリ秒タイムスタンプ：",
    invalid:"入力が無効です",
    guideTitle:"使い方",
    guideText:"1. 現在のタイムスタンプが表示されます。\n2. Unix タイムスタンプを入力して日時に変換できます。\n3. 日時を選択してタイムスタンプに変換できます。\n4. 秒とミリ秒に対応しています。",
    privacyTitle:"プライバシーについて",privacyText:"すべての変換はブラウザ内で行われ、サーバーへ送信されません。"
  },
  en:{
    pageTitle:"Timestamp Converter - ZenTools",
    back:"← Back to Home",title:"Timestamp Converter",desc:"Convert Unix timestamps and date/time values.",
    ad:"Ad Space",nowTitle:"Current Timestamp",refresh:"Refresh",copy:"Copy",
    toDateTitle:"Timestamp to Date",toTimestampTitle:"Date to Timestamp",
    timestampPlaceholder:"Enter timestamp, e.g. 1710000000",
    convert:"Convert",clear:"Clear",empty:"Please enter content",copied:"Copied",
    localTime:"Local time: ",utcTime:"UTC time: ",seconds:"Seconds timestamp: ",milliseconds:"Milliseconds timestamp: ",
    invalid:"Invalid input",
    guideTitle:"How to Use",
    guideText:"1. The current timestamp is displayed automatically.\n2. Enter a Unix timestamp to convert it to local date/time.\n3. Select date/time to convert it to a Unix timestamp.\n4. Supports seconds and milliseconds timestamps.",
    privacyTitle:"Privacy Notice",privacyText:"All conversions are done locally in your browser and are not uploaded to a server."
  },
  vi:{
    pageTitle:"Chuyển đổi timestamp - ZenTools",
    back:"← Quay lại trang chủ",title:"Chuyển đổi timestamp",desc:"Chuyển đổi Unix timestamp và ngày giờ.",
    ad:"Vị trí quảng cáo",nowTitle:"Timestamp hiện tại",refresh:"Làm mới",copy:"Sao chép",
    toDateTitle:"Timestamp sang ngày giờ",toTimestampTitle:"Ngày giờ sang timestamp",
    timestampPlaceholder:"Nhập timestamp, ví dụ 1710000000",
    convert:"Chuyển đổi",clear:"Xóa",empty:"Vui lòng nhập nội dung",copied:"Đã sao chép",
    localTime:"Giờ địa phương: ",utcTime:"Giờ UTC: ",seconds:"Timestamp giây: ",milliseconds:"Timestamp mili giây: ",
    invalid:"Dữ liệu không hợp lệ",
    guideTitle:"Hướng dẫn sử dụng",
    guideText:"1. Timestamp hiện tại sẽ tự động hiển thị.\n2. Nhập Unix timestamp để chuyển sang ngày giờ.\n3. Chọn ngày giờ để chuyển sang Unix timestamp.\n4. Hỗ trợ timestamp giây và mili giây.",
    privacyTitle:"Thông tin quyền riêng tư",privacyText:"Tất cả chuyển đổi được xử lý trong trình duyệt và không tải lên máy chủ."
  }
};

function setLanguage(lang){
  currentLang=lang;
  const data=translations[lang]||translations.zh;
  document.documentElement.lang=lang;
  document.title=data.pageTitle;

  document.querySelectorAll("[data-i18n]").forEach(el=>{
    const key=el.getAttribute("data-i18n");
    if(data[key]) el.textContent=data[key];
  });

  document.querySelectorAll("[data-i18n-placeholder]").forEach(el=>{
    const key=el.getAttribute("data-i18n-placeholder");
    if(data[key]) el.placeholder=data[key];
  });

  localStorage.setItem("siteLanguage",lang);
  updateNow();
}

languageSelect.addEventListener("change",e=>setLanguage(e.target.value));
const savedLang=localStorage.getItem("siteLanguage")||"zh";
languageSelect.value=savedLang;
setLanguage(savedLang);

function updateNow(){
  const now=Date.now();
  document.getElementById("nowOutput").value=Math.floor(now/1000)+" / "+now;
}

function timestampToDate(){
  const data=translations[currentLang]||translations.zh;
  let value=document.getElementById("timestampInput").value.trim();

  if(!value){
    alert(data.empty);
    return;
  }

  if(!/^\d+$/.test(value)){
    document.getElementById("dateResult").textContent=data.invalid;
    return;
  }

  let num=parseInt(value,10);

  if(value.length<=10){
    num=num*1000;
  }

  const d=new Date(num);

  if(isNaN(d.getTime())){
    document.getElementById("dateResult").textContent=data.invalid;
    return;
  }

  document.getElementById("dateResult").textContent=
    data.localTime+d.toLocaleString()+"\n"+
    data.utcTime+d.toUTCString();
}

function dateToTimestamp(){
  const data=translations[currentLang]||translations.zh;
  const value=document.getElementById("dateInput").value;

  if(!value){
    alert(data.empty);
    return;
  }

  const d=new Date(value);
  const ms=d.getTime();
  const sec=Math.floor(ms/1000);

  document.getElementById("timestampResult").textContent=
    data.seconds+sec+"\n"+
    data.milliseconds+ms;
}

function copyValue(id){
  const input=document.getElementById(id);
  input.select();
  document.execCommand("copy");
  alert((translations[currentLang]||translations.zh).copied);
}

function clearBox(inputId,resultId){
  document.getElementById(inputId).value="";
  document.getElementById(resultId).textContent="";
}

setInterval(updateNow,1000);
</script>

</body>
</html>
