<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><link rel="manifest" href="/manifest.json" />
<title>AI 问答 - 江湖小站-ZenTools</title>
<meta name="description" content="AI 智能问答助手，支持知识问答、推理分析、创意讨论" />
<style>*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}:root{--bg:#070b18;--surface:rgba(14,22,41,0.8);--surface2:rgba(20,31,55,0.9);--border:rgba(255,255,255,0.06);--text:#f0f4ff;--muted:#8899bb;--accent:#3b82f6;--accent2:#8b5cf6;--radius:14px;--radius-pill:999px}[data-theme="light"]{--bg:#f2f5f9;--surface:rgba(255,255,255,0.85);--surface2:rgba(240,244,254,0.9);--border:rgba(0,0,0,0.06);--text:#0b111e;--muted:#4a5a7a}
body{font-family:'Inter',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column}
.header{background:var(--surface);border-bottom:1px solid var(--border);padding:16px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;backdrop-filter:blur(10px)}.header .logo{font-weight:800;font-size:18px;display:flex;align-items:center;gap:10px}.header .logo .mark{width:32px;height:32px;border-radius:8px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-size:16px}.header .actions{display:flex;gap:8px}
.main{flex:1;display:flex;flex-direction:column;max-width:900px;width:100%;margin:0 auto}
.qa-container{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:16px}.qa-message{display:flex;gap:12px;animation:fadeIn .3s ease}@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.qa-message.user{flex-direction:row-reverse}.qa-avatar{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}.qa-message.user .qa-avatar{background:linear-gradient(135deg,var(--accent),var(--accent2))}.qa-message.assistant .qa-avatar{background:var(--surface2);border:1px solid var(--border)}
.qa-content{max-width:75%;padding:14px 18px;border-radius:var(--radius);line-height:1.7;font-size:14px}.qa-message.user .qa-content{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-radius:var(--radius) var(--radius) 0 var(--radius)}.qa-message.assistant .qa-content{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius) var(--radius) var(--radius) 0}
.qa-content p{margin-bottom:8px}.qa-content p:last-child{margin-bottom:0}.qa-content pre{background:rgba(0,0,0,0.3);padding:12px;border-radius:8px;overflow-x:auto;margin:8px 0;font-size:13px}.qa-content code{background:rgba(0,0,0,0.2);padding:2px 6px;border-radius:4px;font-size:.9em}
.typing-indicator{display:flex;gap:4px;padding:4px}.typing-indicator span{width:8px;height:8px;background:var(--muted);border-radius:50%;animation:bounce 1.4s infinite}.typing-indicator span:nth-child(2){animation-delay:0.2s}.typing-indicator span:nth-child(3){animation-delay:0.4s}@keyframes bounce{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-8px)}}
.input-area{background:var(--surface);border-top:1px solid var(--border);padding:16px 24px;display:flex;gap:12px;align-items:flex-end}.input-wrapper{flex:1;position:relative}.input-wrapper textarea{width:100%;min-height:50px;max-height:150px;padding:12px 16px;border-radius:var(--radius);border:1px solid var(--border);background:var(--surface2);color:var(--text);font-size:15px;font-family:inherit;resize:none;transition:border-color .3s}.input-wrapper textarea:focus{outline:none;border-color:var(--accent)}.input-wrapper textarea::placeholder{color:var(--muted)}
.btn{padding:10px 20px;border-radius:var(--radius-pill);border:none;cursor:pointer;font-weight:600;font-size:14px;transition:all .3s;display:flex;align-items:center;gap:6px}.btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}.btn-primary:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 4px 12px rgba(59,130,246,0.4)}.btn-primary:disabled{opacity:0.5;cursor:not-allowed}.btn-secondary{background:var(--surface2);color:var(--text);border:1px solid var(--border)}.btn-secondary:hover{border-color:var(--accent)}.btn-sm{padding:6px 14px;font-size:12px}
.footer{text-align:center;padding:20px;font-size:12px;color:var(--muted)}.bookmark-float{position:fixed;bottom:24px;right:24px;z-index:999;display:flex;align-items:center;gap:8px;background:linear-gradient(135deg,#2563eb,#7c3aed);color:#fff;border:none;padding:14px 22px;border-radius:50px;font-size:15px;font-weight:600;cursor:pointer;box-shadow:0 6px 24px rgba(37,99,235,0.35);transition:transform 0.2s,box-shadow 0.2s;text-decoration:none}.bookmark-float:hover{transform:translateY(-3px);box-shadow:0 10px 32px rgba(37,99,235,0.45)}.bookmark-float:active{transform:scale(0.96)}</style>
</head>
<body>
<div class="header">
  <a href="/" class="logo" style="text-decoration:none;color:inherit"><span class="mark">💬</span> AI 问答</a>
  <div class="actions"><button class="btn btn-secondary btn-sm" onclick="toggleSettings()">⚙️ 设置</button><a href="/ai/" class="btn btn-secondary btn-sm">← 返回</a></div>
</div>
<div class="main">
  <div id="qaContainer" class="qa-container">
    <div style="text-align:center;padding:40px 20px;color:var(--muted)"><div style="font-size:48px;margin-bottom:16px">💬</div><h2 style="font-size:18px;color:var(--text);margin-bottom:8px">AI 问答助手</h2><p>问我任何问题，我会尽力解答</p></div>
  </div>
  <div class="input-area">
    <div class="input-wrapper">
      <textarea id="qaInput" placeholder="输入你的问题..." onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();askQuestion()}"></textarea>
    </div>
    <button class="btn btn-primary" id="askBtn" onclick="askQuestion()">发送</button>
  </div>
</div>
<div class="modal-overlay" id="settingsModal" style="display:none">
  <div class="modal">
    <h3>⚙️ API 设置</h3>
    <div style="margin:16px 0"><label style="display:block;margin-bottom:6px;font-size:13px;color:var(--muted)">API Endpoint</label><input type="text" id="apiEndpoint" value="https://api.openai.com/v1/chat/completions" style="width:100%"></div>
    <div style="margin:16px 0"><label style="display:block;margin-bottom:6px;font-size:13px;color:var(--muted)">API Key</label><input type="password" id="apiKey" placeholder="sk-..." style="width:100%"></div>
    <div style="margin:16px 0"><label style="display:block;margin-bottom:6px;font-size:13px;color:var(--muted)">模型</label><select id="modelSelect" style="width:100%"><option value="gpt-3.5-turbo">GPT-3.5 Turbo</option><option value="gpt-4">GPT-4</option><option value="gpt-4-turbo">GPT-4 Turbo</option><option value="deepseek-chat">DeepSeek Chat</option></select></div>
    <div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn btn-secondary" onclick="toggleSettings()">取消</button><button class="btn btn-primary" onclick="saveSettings()">保存</button></div>
  </div>
</div>
<div class="footer">© 2026 <a href="/" style="color:var(--accent);">江湖小站-ZenTools</a></div>
<button class="bookmark-float" onclick="prompt('复制链接收藏本站','https://zentools.xyz')">⭐ 收藏本站</button>
<style>.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.7);display:flex;align-items:center;justify-content:center;z-index:1000;backdrop-filter:blur(5px)}.modal{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:28px;max-width:440px;width:90%}.modal h3{font-size:18px;margin-bottom:8px}</style>
<script>const SK='zentools_ai_settings';const history=[];
function ls(){try{const s=localStorage.getItem(SK);if(s){const a=JSON.parse(s);document.getElementById('apiEndpoint').value=a.endpoint||'https://api.openai.com/v1/chat/completions';document.getElementById('apiKey').value=a.apiKey||'';document.getElementById('modelSelect').value=a.model||'gpt-3.5-turbo'}}catch(e){}}
function ss(){localStorage.setItem(SK,JSON.stringify({endpoint:document.getElementById('apiEndpoint').value,apiKey:document.getElementById('apiKey').value,model:document.getElementById('modelSelect').value}));ts()}
function ts(){const m=document.getElementById('settingsModal');m.style.display=m.style.display==='none'?'flex':'none';if(m.style.display==='flex')ls()}
function gs(){try{const s=localStorage.getItem(SK);return s?JSON.parse(s):{endpoint:'https://api.openai.com/v1/chat/completions',apiKey:'',model:'gpt-3.5-turbo'}}catch(e){return{endpoint:'https://api.openai.com/v1/chat/completions',apiKey:'',model:'gpt-3.5-turbo'}}}
function addMsg(role,content){const c=document.getElementById('qaContainer');const d=document.createElement('div');d.className='qa-message '+role;d.innerHTML='<div class="qa-avatar">'+(role==='user'?'👤':'🤖')+'</div><div class="qa-content">'+esc(content)+'</div>';c.appendChild(d);c.scrollTop=c.scrollHeight;history.push({role,content})}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>')}
function askQuestion(){const input=document.getElementById('qaInput');const q=input.value.trim();if(!q)return;const s=gs();if(!s.apiKey){ts();return};addMsg('user',q);input.value='';const btn=document.getElementById('askBtn');btn.disabled=true;const c=document.getElementById('qaContainer');const d=document.createElement('div');d.className='qa-message assistant';d.innerHTML='<div class="qa-avatar">🤖</div><div class="qa-content"><div class="typing-indicator"><span></span><span></span><span></span></div></div>';c.appendChild(d);c.scrollTop=c.scrollHeight;const msgs=history.slice(-6).map(m=>({role:m.role,content:m.content}));fetch(s.endpoint,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+s.apiKey},body:JSON.stringify({model:s.model,messages:msgs,max_tokens:1024})}).then(r=>r.ok?r.json():Promise.reject('HTTP '+r.status)).then(data=>{d.querySelector('.qa-content').innerHTML=esc(data.choices[0].message.content);history.push({role:'assistant',content:data.choices[0].message.content})}).catch(e=>{d.querySelector('.qa-content').innerHTML='<span style="color:var(--error)">请求失败：'+e+'</span>'}).finally(()=>{btn.disabled=false;c.scrollTop=c.scrollHeight});}
</script>
</body>
</html>
