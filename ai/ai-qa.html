/* 问答容器样式 */
.qa-container{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:16px;max-height:500px}
.qa-message{display:flex;gap:12px;animation:fadeIn .3s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.qa-message.user{flex-direction:row-reverse}
.qa-avatar{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.qa-message.user .qa-avatar{background:linear-gradient(135deg,var(--zen-primary),var(--zen-secondary))}
.qa-message.assistant .qa-avatar{background:var(--glass-b);border:1px solid var(--zen-border)}
.qa-content{max-width:75%;padding:14px 18px;border-radius:12px;line-height:1.7;font-size:14px}
.qa-message.user .qa-content{background:linear-gradient(135deg,var(--zen-primary),var(--zen-secondary));color:#fff;border-radius:12px 12px 0 12px}
.qa-message.assistant .qa-content{background:var(--zen-bg-card);border:1px solid var(--zen-border);border-radius:12px 12px 12px 0}
.qa-content p{margin-bottom:8px}.qa-content p:last-child{margin-bottom:0}
.qa-content pre{background:rgba(0,0,0,0.3);padding:12px;border-radius:8px;overflow-x:auto;margin:8px 0;font-size:13px}
.qa-content code{background:rgba(0,0,0,0.2);padding:2px 6px;border-radius:4px;font-size:.9em}
.typing-indicator{display:flex;gap:4px;padding:4px}
.typing-indicator span{width:8px;height:8px;background:var(--zen-text-sub);border-radius:50%;animation:bounce 1.4s infinite}
.typing-indicator span:nth-child(2){animation-delay:0.2s}
.typing-indicator span:nth-child(3){animation-delay:0.4s}
@keyframes bounce{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-8px)}}
.input-area{background:var(--glass-b);border:1px solid var(--zen-border);padding:16px;display:flex;gap:12px;align-items:flex-end;border-radius:12px;margin-top:16px}
.input-wrapper{flex:1;position:relative}
.input-wrapper textarea{width:100%;min-height:50px;max-height:150px;padding:12px 16px;border-radius:8px;border:1px solid var(--zen-border);background:var(--zen-bg-base);color:var(--zen-text-main);font-size:15px;font-family:inherit;resize:none;transition:border-color .3s}
.input-wrapper textarea:focus{outline:none;border-color:var(--zen-primary)}
.input-wrapper textarea::placeholder{color:var(--zen-text-sub)}
.btn{padding:10px 20px;border-radius:8px;border:none;cursor:pointer;font-weight:600;font-size:14px;transition:all .3s;display:flex;align-items:center;gap:6px}
.btn-primary{background:linear-gradient(135deg,var(--zen-primary),var(--zen-secondary));color:#fff}
.btn-primary:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 4px 12px rgba(6,182,212,0.4)}
.btn-primary:disabled{opacity:0.5;cursor:not-allowed}
.btn-secondary{background:var(--glass-b);color:var(--zen-text-main);border:1px solid var(--zen-border)}
.btn-secondary:hover{border-color:var(--zen-primary)}
.btn-sm{padding:6px 14px;font-size:12px}
.qa-toolbox{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.7);display:flex;align-items:center;justify-content:center;z-index:1000;backdrop-filter:blur(5px)}
.modal{background:var(--glass-b);border:1px solid var(--zen-border);border-radius:14px;padding:28px;max-width:440px;width:90%}
.modal h3{font-size:18px;margin-bottom:8px}
.modal input,.modal select{width:100%;padding:10px 12px;border-radius:8px;border:1px solid var(--zen-border);background:var(--zen-bg-base);color:var(--zen-text-main);font-size:14px;margin:8px 0}
.modal input:focus,.modal select:focus{outline:none;border-color:var(--zen-primary)}
.placeholder-text{text-align:center;padding:40px 20px;color:var(--zen-text-sub)}
.placeholder-text .icon{font-size:48px;margin-bottom:16px}
.placeholder-text h2{font-size:18px;color:var(--zen-text-main);margin-bottom:8px}

    .tool-box { max-width: 900px; margin: 0 auto 48px; background: var(--zen-bg-card); border: 1px solid var(--zen-border); border-radius: 16px; padding: 36px; }
    .tool-box h2 { font-size: 24px; font-weight: 700; margin-bottom: 12px; }

    .file-input-row { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
    .file-input-row input[type="file"] { flex: 1; min-width: 280px; padding: 14px 18px; border: 1px dashed var(--zen-border); border-radius: 12px; background: var(--zen-bg-base); color: var(--zen-text-sub); font-size: 14px; cursor: pointer; }
    .file-input-row input[type="file"]::file-selector-button { border: none; background: rgba(0,102,255,0.08); color: var(--zen-primary); padding: 8px 16px; border-radius: 8px; margin-right: 12px; cursor: pointer; transition: background 0.2s; }
    .btn-primary { display: inline-flex; align-items: center; justify-content: center; padding: 14px 32px; border-radius: 12px; border: none; background: var(--zen-gradient); color: #fff; font-size: 16px; font-weight: 700; cursor: pointer; transition: opacity 0.2s, transform 0.2s; }
    .btn-primary:hover { opacity: 0.9; transform: translateY(-2px); }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    .status { margin-top: 16px; color: var(--zen-text-sub); font-size: 14px; min-height: 22px; }
    .section { max-width: 1200px; margin: 0 auto; padding: 40px 24px; }
    .section-head { text-align: center; margin-bottom: 36px; }
    .section-head h2 { font-size: 26px; font-weight: 700; }
    .info-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
    .info-card { background: var(--zen-bg-card); border: 1px solid var(--zen-border); border-radius: 16px; padding: 24px; }
    .info-card h4 { font-size: 16px; font-weight: 700; margin-bottom: 10px; color: var(--zen-primary); }
    .info-card p { font-size: 14px; color: var(--zen-text-sub); line-height: 1.65; }
    .cat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; }
    .cat-card { background: var(--zen-bg-card); border: 1px solid var(--zen-border); border-radius: 16px; padding: 20px; text-align: center; text-decoration: none; color: var(--zen-text-main); display: block; transition: border-color 0.2s, transform 0.2s; }
    .cat-card:hover { border-color: var(--zen-primary); transform: translateY(-4px); }
    .cat-card .name { font-size: 14px; font-weight: 600; margin-bottom: 4px; color: var(--zen-text-main); }
    .cat-card .desc { font-size: 12px; color: var(--zen-text-sub); }
    .lang-select { background: transparent; border: 1px solid var(--zen-border); border-radius: 8px; padding: 6px 10px; color: var(--zen-text-sub); font-size: 13px; cursor: pointer; }

<script>
const SK='zentools_ai_settings';
const history=[];
function ls(){try{const s=localStorage.getItem(SK);if(s){const a=JSON.parse(s);document.getElementById('apiEndpoint').value=a.endpoint||'https://api.openai.com/v1/chat/completions';document.getElementById('apiKey').value=a.apiKey||'';document.getElementById('modelSelect').value=a.model||'gpt-3.5-turbo';}}catch(e){}}
function ss(){localStorage.setItem(SK,JSON.stringify({endpoint:document.getElementById('apiEndpoint').value,apiKey:document.getElementById('apiKey').value,model:document.getElementById('modelSelect').value}));ts();}
function ts(){const m=document.getElementById('settingsModal');m.style.display=m.style.display==='none'?'flex':'none';if(m.style.display==='flex')ls();}
function gs(){try{const s=localStorage.getItem(SK);return s?JSON.parse(s):{endpoint:'https://api.openai.com/v1/chat/completions',apiKey:'',model:'gpt-3.5-turbo'};}}catch(e){return{endpoint:'https://api.openai.com/v1/chat/completions',apiKey:'',model:'gpt-3.5-turbo';}}
function addMsg(role,content){const c=document.getElementById('qaContainer');const d=document.createElement('div');d.className='qa-message '+role;d.innerHTML='<div class="qa-avatar">'+(role==='user'?'👤':'🤖')+'</div><div class="qa-content">'+esc(content)+'</div>';c.appendChild(d);c.scrollTop=c.scrollHeight;history.push({role,content});}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');}
function askQuestion(){
  const input=document.getElementById('qaInput');
  const q=input.value.trim();
  if(!q)return;
  const s=gs();
  if(!s.apiKey){ts();return;}
  addMsg('user',q);
  input.value='';
  const btn=document.getElementById('askBtn');
  btn.disabled=true;
  const c=document.getElementById('qaContainer');
  const d=document.createElement('div');
  d.className='qa-message assistant';
  d.innerHTML='<div class="qa-avatar">🤖</div><div class="qa-content"><div class="typing-indicator"><span></span><span></span><span></span></div></div>';
  c.appendChild(d);c.scrollTop=c.scrollHeight;
  const msgs=history.slice(-6).map(m=>({role:m.role,content:m.content}));
  fetch(s.endpoint,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+s.apiKey},body:JSON.stringify({model:s.model,messages:msgs,max_tokens:1024})})
  .then(r=>r.ok?r.json():Promise.reject('HTTP '+r.status))
  .then(data=>{d.querySelector('.qa-content').innerHTML=esc(data.choices[0].message.content);history.push({role:'assistant',content:data.choices[0].message.content});})
  .catch(e=>{d.querySelector('.qa-content').innerHTML='<span style="color:var(--zen-danger)">'+getDict().error_msg+': '+e+'</span>';})
  .finally(()=>{btn.disabled=false;c.scrollTop=c.scrollHeight;});
}
function getDict(){const l=localStorage.getItem('zentools_lang')||'zh';return(window.ZT_PAGE||{})[l]||window.ZT_PAGE.zh;}
</script>

(function(){var s=document.createElement('script');s.src='/data/tools-data.json';s.type='application/json';s.id='toolsDataLoader';document.head.appendChild(s);
var x=new XMLHttpRequest();x.open('GET','/data/tools-data.json?'+Date.now());x.onload=function(){try{var d=JSON.parse(x.responseText);var cat=d.categories||[];var path=window.location.pathname.replace(/\/+$/,'');var curr=d.tools.find(function(t){return t.url===path||t.url===path+'.html';});if(!curr)return;var same=d.tools.filter(function(t){return t.category===curr.category&&t.url!==curr.url;}).slice(0,6);if(same.length===0)return;var lang=localStorage.getItem('zentools_lang')||'zh';var tn=function(t,l){if(l==='zh')return t.name;return t['name__'+l]||t['name__en']||t.name;};var catName=curr.category;cat.forEach(function(c,i){if(c===curr.category){var maps={en:d.categories__en,ja:d.categories__ja,vi:d.categories__vi};if(maps[lang]&&maps[lang][i])catName=maps[lang][i];}});var html='<div style="max-width:1000px;margin:30px auto;padding:0 20px"><h3 style="color:#6b7a9f;font-size:14px;font-weight:700;margin-bottom:14px;letter-spacing:0.5px">📌 相关'+(catName||'')+'工具</h3><div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px">';same.forEach(function(t){var name=tn(t,lang);var icon=t.icon||'🔧';html+='<a href="'+t.url+'" style="display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:12px;border:1px solid var(--zen-border);background:var(--zen-bg-card);color: var(--zen-text-main);text-decoration:none;font-size:13px;font-weight:500;transition:background 0.2s" onmouseover="this.style.background=\'rgba(255,255,255,0.08)\'" onmouseout="this.style.background=\'rgba(255,255,255,0.03)\'"><span style="font-size:16px">'+icon+'</span><span>'+name+'</span></a>';});html+='</div></div>';var footer=document.querySelector('footer');if(footer)footer.insertAdjacentHTML('beforebegin',html);else document.body.insertAdjacentHTML('beforeend',html);}catch(e){}};x.send();})();
</script>

<script>
// 暗黑模式切换
(function() {
  var savedTheme = localStorage.getItem('zentools_theme');
  if (savedTheme === 'dark') document.documentElement.classList.add('dark');
  var btn = document.getElementById('themeToggle');
  if (btn) {
    btn.textContent = document.documentElement.classList.contains('dark') ? '☀️' : '🌙';
    btn.addEventListener('click', function() {
      document.documentElement.classList.toggle('dark');
      var isDark = document.documentElement.classList.contains('dark');
      this.textContent = isDark ? '☀️' : '🌙';
      localStorage.setItem('zentools_theme', isDark ? 'dark' : 'light');
    });
  }
})();

// 移动端侧滑
(function() {
  var overlay = document.getElementById('mobileOverlay');
  var hamBtn = document.getElementById('hamburgerBtn');
  var closeBtn = document.getElementById('mobileClose');
  if (!hamBtn || !overlay) return;
  function closeMenu() { overlay.classList.remove('open'); hamBtn.textContent = '☰'; document.body.style.overflow = ''; }
  hamBtn.addEventListener('click', function(e) {
    e.stopPropagation();
    if (overlay.classList.contains('open')) { closeMenu(); } else {
      overlay.classList.add('open'); hamBtn.textContent = '✕'; document.body.style.overflow = 'hidden';
    }
  });
  if (closeBtn) closeBtn.addEventListener('click', closeMenu);
  overlay.addEventListener('click', function(e) {
    var drawer = document.getElementById('mobileDrawer');
    if (drawer && !drawer.contains(e.target)) closeMenu();
  });
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape' && overlay.classList.contains('open')) closeMenu();
  });
})();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', function() {
    navigator.serviceWorker.register('/sw.js').catch(function() {});
  });
}
</script>
