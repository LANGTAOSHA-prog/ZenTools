function toggleSettings(){const m=document.getElementById('settingsModal');m.style.display=m.style.display==='none'?'flex':'none';if(m.style.display==='flex')loadSettings()}
function loadSettings(){try{const s=localStorage.getItem(SK);if(s){const a=JSON.parse(s);document.getElementById('apiEndpoint').value=a.endpoint||'';document.getElementById('apiKey').value=a.apiKey||'';document.getElementById('modelSelect').value=a.model||'gpt-4o'}}catch(e){}}
function saveSettings(){const s={endpoint:document.getElementById('apiEndpoint').value,apiKey:document.getElementById('apiKey').value,model:document.getElementById('modelSelect').value};localStorage.setItem(SK,JSON.stringify(s));toggleSettings()}

async function fixCode(){const code=document.getElementById('code').value.trim();if(!code){alert('请粘贴需要修复的代码');return}const result=document.getElementById('result');const btn=document.getElementById('fixBtn');const s=getSettings();if(!s.apiKey){toggleSettings();return}btn.disabled=true;btn.querySelector('span[data-i18n]').textContent='⏳ 诊断中...';result.classList.add('empty');result.innerHTML='<p>正在分析代码并修复...</p>';try{const response=await fetch(s.endpoint,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+s.apiKey},body:JSON.stringify({model:s.model,messages:[{role:'system',content:'你是一个专业的代码修复助手。请分析提供的代码，找出所有错误和问题，然后提供修复后的完整代码。请用以下格式输出：\n\n## 问题分析\n[列出发现的所有问题]\n\n## 修复后的代码\n```[语言]\n[修复后的代码]\n```'],temperature:0.3,max_tokens:4096})});if(!response.ok)throw new Error('API请求失败');const data=await response.json();let content=data.choices[0].message.content;content=content.replace(/```[a-z]*\n?/g,'').replace(/```$/,'');result.classList.remove('empty');result.innerHTML='<div class="result-header"><span class="tag">✅ 已修复</span></div><pre><code>'+esc(content)+'</code></pre>'}catch(e){result.classList.add('empty');result.innerHTML='<p style="color:var(--error)">修复失败：'+esc(e.message)+'</p>'}btn.disabled=false;btn.querySelector('span[data-i18n]').textContent='🔧 诊断并修复'}
function clearAll(){document.getElementById('code').value='';document.getElementById('result').classList.add('empty');document.getElementById('result').innerHTML='<p data-i18n="placeholderResult">修复后的代码将显示在这里</p>'}
function copyResult(){const t=document.getElementById('result').innerText;if(t.includes('修复后的代码将显示')){alert('没有可复制的内容');return}navigator.clipboard.writeText(t).then(()=>alert('已复制')).catch(()=>alert('复制失败'))}
loadSettings();
</script>
