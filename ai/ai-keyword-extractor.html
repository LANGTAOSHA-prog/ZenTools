<script>
const SK='zentools_ai_settings';
function toggleSettings(){const m=document.getElementById('settingsModal');m.style.display=m.style.display==='none'?'flex':'none';if(m.style.display==='flex')loadSettings()}
function loadSettings(){try{const s=localStorage.getItem(SK);if(s){const a=JSON.parse(s);document.getElementById('apiEndpoint').value=a.endpoint||'';document.getElementById('apiKey').value=a.apiKey||'';document.getElementById('modelSelect').value=a.model||'gpt-4o'}}catch(e){}}
function saveSettings(){const s={endpoint:document.getElementById('apiEndpoint').value,apiKey:document.getElementById('apiKey').value,model:document.getElementById('modelSelect').value};localStorage.setItem(SK,JSON.stringify(s));toggleSettings()}
function getSettings(){try{const s=localStorage.getItem(SK);return s?JSON.parse(s):{endpoint:'https://api.openai.com/v1/chat/completions',apiKey:'',model:'gpt-4o'}}catch(e){return{endpoint:'https://api.openai.com/v1/chat/completions',apiKey:'',model:'gpt-4o'}}}
function esc(t){return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\x22/g,'&#34;')}
async function extract(){const text=document.getElementById('text').value.trim();const count=document.getElementById('count').value;const output=document.getElementById('output');const btn=document.getElementById('extractBtn');if(!text){alert('请输入文本内容');return}const s=getSettings();if(!s.apiKey){toggleSettings();return}btn.disabled=true;output.classList.add('empty');output.innerHTML='<p>正在提取关键词...</p>';try{const response=await fetch(s.endpoint,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+s.apiKey},body:JSON.stringify({model:s.model,messages:[{role:'system',content:'你是一个专业的关键词提取助手。'},{role:'user',content:'请从以下文本中提取 '+count+' 个最重要的关键词。只输出关键词，用逗号分隔。不要添加任何解释。\n\n文本：\n'+text}],temperature:0.3,max_tokens:512})});if(!response.ok)throw new Error('API请求失败');const data=await response.json();const keywords=data.choices[0].message.content.split(',').map(k=>k.trim()).filter(k=>k);output.classList.remove('empty');output.innerHTML='<div class="keywords-list">'+keywords.map(k=>'<span class="keyword-tag" onclick="navigator.clipboard.writeText(\''+esc(k).replace(/'/g,\'\\\\\')+'\')">'+esc(k)+'</span>').join('')+'</div>';output.keywords=keywords}catch(e){output.classList.add('empty');output.keywords=null;output.innerHTML='<p style="color:var(--error);text-align:center;padding:40px">提取失败：'+esc(e.message)+'</p>'}btn.disabled=false}
function clearAll(){document.getElementById('text').value='';document.getElementById('output').classList.add('empty');document.getElementById('output').keywords=null;document.getElementById('output').innerHTML='<p data-i18n="emptyResult">关键词将显示在这里</p>'}
function copyKeywords(){const o=document.getElementById('output');const k=o.keywords;if(!k||k.length===0){alert('没有可复制的关键词');return}navigator.clipboard.writeText(k.join(', ')).then(()=>alert('已复制')).catch(()=>alert('复制失败'))}
loadSettings();
</script>
