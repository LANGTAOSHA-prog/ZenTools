<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><link rel="manifest" href="/manifest.json" />
<title>AI 关键词提取 - 江湖小站-ZenTools</title>
<meta name="description" content="AI 智能提取文本关键词和标签，支持多语言和自定义数量" />
<style>*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}:root{--bg:#070b18;--surface:rgba(14,22,41,0.8);--surface2:rgba(20,31,55,0.9);--border:rgba(255,255,255,0.06);--text:#f0f4ff;--muted:#8899bb;--accent:#3b82f6;--accent2:#8b5cf6;--radius:14px;--radius-pill:999px;--success:#22c55e}[data-theme="light"]{--bg:#f2f5f9;--surface:rgba(255,255,255,0.85);--surface2:rgba(240,244,254,0.9);--border:rgba(0,0,0,0.06);--text:#0b111e;--muted:#4a5a7a}body{font-family:'Inter',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column}
.header{background:var(--surface);border-bottom:1px solid var(--border);padding:16px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;backdrop-filter:blur(10px)}.header .logo{font-weight:800;font-size:18px;display:flex;align-items:center;gap:10px}.header .logo .mark{width:32px;height:32px;border-radius:8px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-size:16px}.header .actions{display:flex;gap:8px}
.main{flex:1;max-width:900px;width:100%;margin:0 auto;padding:24px}.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:24px;margin-bottom:20px}.card h2{font-size:16px;margin-bottom:16px;display:flex;align-items:center;gap:8px}
textarea{width:100%;min-height:200px;padding:14px;border-radius:var(--radius);border:1px solid var(--border);background:var(--surface2);color:var(--text);font-size:14px;font-family:inherit;resize:vertical;transition:border-color .3s;line-height:1.6;margin-bottom:12px}textarea:focus{outline:none;border-color:var(--accent)}.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
select{padding:10px 14px;border-radius:var(--radius);border:1px solid var(--border);background:var(--surface2);color:var(--text);font-size:14px;transition:border-color .3s;min-width:120px}select:focus{outline:none;border-color:var(--accent)}
.btn{padding:10px 22px;border-radius:var(--radius-pill);border:none;cursor:pointer;font-weight:600;font-size:14px;transition:all .3s;display:inline-flex;align-items:center;gap:6px}.btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}.btn-primary:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 4px 12px rgba(59,130,246,0.4)}.btn-primary:disabled{opacity:0.5;cursor:not-allowed}.btn-secondary{background:var(--surface2);color:var(--text);border:1px solid var(--border)}.btn-secondary:hover{border-color:var(--accent)}.btn-sm{padding:6px 14px;font-size:12px}
.result-box{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-top:16px;display:none}.result-box.show{display:block}
.keyword-tag{display:inline-block;padding:6px 14px;margin:4px;border-radius:var(--radius-pill);font-size:13px;font-weight:500;transition:all .3s}.keyword-tag.key-0{background:linear-gradient(135deg,#3b82f6,#8b5cf6);color:#fff}.keyword-tag.key-1{background:rgba(59,130,246,0.2);color:#60a5fa}.keyword-tag.key-2{background:rgba(139,92,246,0.2);color:#a78bfa}.keyword-tag.key-3{background:rgba(34,197,94,0.2);color:#4ade80}.keyword-tag.key-4{background:rgba(234,179,8,0.2);color:#fbbf24}
.keywords-wrap{display:flex;flex-wrap:wrap;gap:4px;padding:12px 0}.loading{display:none;align-items:center;gap:8px;color:var(--muted);font-size:14px;padding:12px 0}.loading.show{display:flex}.loading .spinner{width:18px;height:18px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.stat-row{display:flex;gap:24px;margin:12px 0;flex-wrap:wrap}.stat-item{text-align:center}.stat-value{font-size:24px;font-weight:700;color:var(--accent)}.stat-label{font-size:12px;color:var(--muted)}
.footer{text-align:center;padding:20px;font-size:12px;color:var(--muted)}
.bookmark-float{position:fixed;bottom:24px;right:24px;z-index:999;display:flex;align-items:center;gap:8px;background:linear-gradient(135deg,#2563eb,#7c3aed);color:#fff;border:none;padding:14px 22px;border-radius:50px;font-size:15px;font-weight:600;cursor:pointer;box-shadow:0 6px 24px rgba(37,99,235,0.35);transition:transform 0.2s,box-shadow 0.2s;text-decoration:none}.bookmark-float:hover{transform:translateY(-3px);box-shadow:0 10px 32px rgba(37,99,235,0.45)}.bookmark-float:active{transform:scale(0.96)}</style>
</head>
<body>
<div class="header">
  <a href="/" class="logo" style="text-decoration:none;color:inherit"><span class="mark">🏷️</span> AI 关键词提取</a>
  <div class="actions"><button class="btn btn-secondary btn-sm" onclick="toggleSettings()">⚙️ 设置</button><a href="/ai/" class="btn btn-secondary btn-sm">← 返回</a></div>
</div>
<div class="main">
  <div class="card">
    <h2>📝 输入文本</h2>
    <div class="toolbar">
      <select id="extractType"><option value="keyword">提取关键词</option><option value="tag">生成标签</option><option value="entity">提取命名实体</option><option value="summary">提取摘要句</option></select>
      <select id="keywordCount"><option value="5">5 个</option><option value="10" selected>10 个</option><option value="15">15 个</option><option value="20">20 个</option></select>
    </div>
    <textarea id="textInput" placeholder="在此粘贴需要提取关键词的文本内容...&#10;&#10;支持文章、新闻、博客、评论等各类文本"></textarea>
    <div style="display:flex;gap:8px">
      <button class="btn btn-primary" id="extractBtn" onclick="extractKeywords()">🔍 提取</button>
      <button class="btn btn-secondary" onclick="clearAll()">清空</button>
    </div>
  </div>

  <div class="loading" id="loading"><div class="spinner"></div> AI 正在分析文本...</div>

  <div class="result-box" id="resultBox">
    <div class="stat-row">
      <div class="stat-item"><div class="stat-value" id="charCount">0</div><div class="stat-label">总字数</div></div>
      <div class="stat-item"><div class="stat-value" id="wordCount">0</div><div class="stat-label">总词数</div></div>
      <div class="stat-item"><div class="stat-value" id="extractedCount">0</div><div class="stat-label">提取结果</div></div>
    </div>
    <h2 style="font-size:15px;margin:8px 0">🏷️ 提取结果</h2>
    <div id="keywordsDisplay" class="keywords-wrap"></div>
    <div style="margin-top:12px"><button class="btn btn-secondary btn-sm" onclick="copyKeywords()">📋 复制结果</button></div>
  </div>
</div>

<div class="modal-overlay" id="settingsModal" style="display:none">
  <div class="modal">
    <h3>⚙️ API 设置</h3>
    <div style="margin:16px 0"><label style="display:block;margin-bottom:6px;font-size:13px;color:var(--muted)">API Endpoint</label><input type="text" id="apiEndpoint" value="https://api.openai.com/v1/chat/completions" style="width:100%"></div>
    <div style="margin:16px 0"><label style="display:block;margin-bottom:6px;font-size:13px;color:var(--muted)">API Key</label><input type="password" id="apiKey" placeholder="sk-..." style="width:100%"></div>
    <div style="margin:16px 0"><label style="display:block;margin-bottom:6px;font-size:13px;color:var(--muted)">模型</label><select id="modelSelect" style="width:100%"><option value="gpt-3.5-turbo">GPT-3.5 Turbo</option><option value="gpt-4">GPT-4</option><option value="gpt-4-turbo">GPT-4 Turbo</option><option value="deepseek-chat">DeepSeek Chat</option></select></div>
    <div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn btn-secondary" onclick="toggleSettings()">取消</button><button class="btn btn-primary" onclick="saveSettings()">保存</button></div>
  </div>
</div>
<div class="footer">© 2026 <a href="/" style="color:var(--accent);">江湖小站-ZenTools</a></div>
<button class="bookmark-float" onclick="prompt('复制链接收藏本站','https://zentools.xyz')">⭐ 收藏本站</button>
<style>.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.7);display:flex;align-items:center;justify-content:center;z-index:1000;backdrop-filter:blur(5px)}.modal{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:28px;max-width:440px;width:90%}.modal h3{font-size:18px;margin-bottom:8px}</style>

<script>
const SK='zentools_ai_settings';
function ls(){try{const s=localStorage.getItem(SK);if(s){const a=JSON.parse(s);document.getElementById('apiEndpoint').value=a.endpoint||'https://api.openai.com/v1/chat/completions';document.getElementById('apiKey').value=a.apiKey||'';document.getElementById('modelSelect').value=a.model||'gpt-3.5-turbo'}}catch(e){}}
function ss(){localStorage.setItem(SK,JSON.stringify({endpoint:document.getElementById('apiEndpoint').value,apiKey:document.getElementById('apiKey').value,model:document.getElementById('modelSelect').value}));ts()}
function ts(){const m=document.getElementById('settingsModal');m.style.display=m.style.display==='none'?'flex':'none';if(m.style.display==='flex')ls()}
function gs(){try{const s=localStorage.getItem(SK);return s?JSON.parse(s):{endpoint:'https://api.openai.com/v1/chat/completions',apiKey:'',model:'gpt-3.5-turbo'}}catch(e){return{endpoint:'https://api.openai.com/v1/chat/completions',apiKey:'',model:'gpt-3.5-turbo'}}}
let lastResultText='';

function clearAll(){document.getElementById('textInput').value='';document.getElementById('resultBox').classList.remove('show')}

function extractKeywords(){
  const txt=document.getElementById('textInput').value.trim();
  if(!txt){alert('请输入文本');return}
  const s=gs();if(!s.apiKey){ts();return}
  const type=document.getElementById('extractType').value;
  const count=document.getElementById('keywordCount').value;
  const btn=document.getElementById('extractBtn');
  const l=document.getElementById('loading');const r=document.getElementById('resultBox');
  btn.disabled=true;l.classList.add('show');r.classList.remove('show');
  document.getElementById('charCount').textContent=txt.length;
  document.getElementById('wordCount').textContent=txt.split(/[\s,，。、；;：:！!？?]+/).filter(Boolean).length;

  const prompts={keyword:'提取关键词（最重要的词）',tag:'生成标签（适合分类和搜索）',entity:'提取命名实体（人名、地名、组织机构等）',summary:'提取摘要句（最能概括本文的句子）'};
  const p='你是一个文本分析专家。请从以下文本中'+prompts[type]+'，返回前'+count+'项（如果不足'+count+'项则返回实际数量）。\n\n要求：\n- 每个结果一行\n- 如果有置信度或相关性，在括号中标明\n- 不加序号和其他解释\n\n文本：\n'+txt;

  fetch(s.endpoint,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+s.apiKey},body:JSON.stringify({model:s.model,messages:[{role:'user',content:p}],max_tokens:800})})
  .then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.json()})
  .then(d=>{
    const content=d.choices[0].message.content;
    lastResultText=content;
    const lines=content.split('\n').filter(l=>l.trim());
    document.getElementById('extractedCount').textContent=lines.length;
    const wrap=document.getElementById('keywordsDisplay');
    wrap.innerHTML=lines.map((line,i)=>'<span class="keyword-tag key-'+(i%5)+'">'+escapeHtml(line.replace(/^\d+[.、)\s]*/,'').trim())+'</span>').join('');
    r.classList.add('show');
  })
  .catch(e=>{
    document.getElementById('keywordsDisplay').innerHTML='<span style="color:var(--error)">请求失败：'+e.message+'</span>';
    r.classList.add('show');
  })
  .finally(()=>{btn.disabled=false;l.classList.remove('show')});
}

function copyKeywords(){if(lastResultText)navigator.clipboard.writeText(lastResultText).then(()=>alert('已复制'))}
function escapeHtml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
ls();
</script>
</body>
</html>
