<script>
const SK='zentools_ai_settings';
function toggleSettings(){const m=document.getElementById('settingsModal');m.style.display=m.style.display==='none'?'flex':'none';if(m.style.display==='flex')loadSettings()}
function loadSettings(){try{const s=localStorage.getItem(SK);if(s){const a=JSON.parse(s);document.getElementById('apiEndpoint').value=a.endpoint||'';document.getElementById('apiKey').value=a.apiKey||'';document.getElementById('modelSelect').value=a.model||'gpt-4o'}}catch(e){}}
function saveSettings(){const s={endpoint:document.getElementById('apiEndpoint').value,apiKey:document.getElementById('apiKey').value,model:document.getElementById('modelSelect').value};localStorage.setItem(SK,JSON.stringify(s));toggleSettings()}
function getSettings(){try{const s=localStorage.getItem(SK);return s?JSON.parse(s):{endpoint:'https://api.openai.com/v1/chat/completions',apiKey:'',model:'gpt-4o'}}catch(e){return{endpoint:'https://api.openai.com/v1/chat/completions',apiKey:'',model:'gpt-4o'}}}
function esc(t){return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\x22/g,'&#34;')}
async function polish(){const text=document.getElementById('text').value.trim();const type=document.getElementById('type').value;const output=document.getElementById('output');const btn=document.getElementById('polishBtn');if(!text){alert('请输入英文内容');return}const s=getSettings();if(!s.apiKey){toggleSettings();return}btn.disabled=true;output.classList.add('empty');output.innerHTML='<p>正在润色...</p>';try{const response=await fetch(s.endpoint,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+s.apiKey},body:JSON.stringify({model:s.model,messages:[{role:'system',content:'You are a professional English editing assistant. Polish the following English text. Fix grammar errors, improve word choice, and optimize sentence structure. The text is for '+type+'. Only output the polished text, no explanations.'},{role:'user',content:text}],temperature:0.3,max_tokens:2048})});if(!response.ok)throw new Error('API请求失败');const data=await response.json();const result=data.choices[0].message.content;output.classList.remove('empty');output.innerHTML='<div style="white-space:pre-wrap">'+esc(result)+'</div>'}catch(e){output.classList.add('empty');output.innerHTML='<p style="color:var(--error);text-align:center;padding:40px">润色失败：'+esc(e.message)+'</p>'}btn.disabled=false}
function clearAll(){document.getElementById('text').value='';document.getElementById('output').classList.add('empty');document.getElementById('output').innerHTML='<p data-i18n="emptyResult">润色结果将显示在这里</p>'}

loadSettings();
</script>
