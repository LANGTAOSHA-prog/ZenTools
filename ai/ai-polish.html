    [data-theme="light"] { --bg: #f2f5f9; --surface: rgba(255,255,255,0.85); --surface2: rgba(240,244,254,0.9); --border: rgba(0,0,0,0.06); --text: #0b111e; --muted: #4a5a7a; }

    .main { flex: 1; display: flex; flex-direction: column; max-width: 1200px; width: 100%; margin: 0 auto; padding: 20px; gap: 20px; }

    @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }
    
    .panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; display: flex; flex-direction: column; }
    .panel-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }

    .form-group textarea { min-height: 250px; resize: vertical; }
    .form-group textarea:focus { outline: none; border-color: var(--accent); }
    
    .btn { padding: 10px 20px; border-radius: var(--radius-pill); border: none; cursor: pointer; font-weight: 600; font-size: 14px; transition: all .3s; display: inline-flex; align-items: center; gap: 6px; }
    .btn-primary { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff; }
    .btn-primary:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(59,130,246,0.4); }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-secondary { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
    
    .output-content { flex: 1; background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; overflow-y: auto; font-size: 15px; line-height: 1.8; }
    
    .changes { margin-top: 20px; padding-top: 20px; border-top: 1px solid var(--border); }
    .changes h4 { font-size: 14px; color: var(--muted); margin-bottom: 12px; }
    .change-item { padding: 8px 12px; background: var(--bg); border-radius: 8px; margin-bottom: 8px; font-size: 13px; }
    .change-item .original { color: var(--error); text-decoration: line-through; }
    .change-item .new { color: var(--success); font-weight: 600; }
    
    .typing { display: flex; gap: 4px; padding: 20px; justify-content: center; }
    .typing span { width: 8px; height: 8px; background: var(--muted); border-radius: 50%; animation: bounce 1.4s infinite; }
    .typing span:nth-child(2) { animation-delay: 0.2s; }
    .typing span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce { 0%, 60%, 100% { transform: translateY(0); } 30% { transform: translateY(-8px); } }
    
    .bookmark-float{position:fixed;bottom:24px;right:24px;z-index:999;display:flex;align-items:center;gap:8px;background:linear-gradient(135deg,#2563eb,#7c3aed);color:#fff;border:none;padding:14px 22px;border-radius:50px;font-size:15px;font-weight:600;cursor:pointer;box-shadow:0 6px 24px rgba(37,99,235,0.35);transition:transform 0.2s,box-shadow 0.2s;text-decoration:none}.bookmark-float:hover{transform:translateY(-3px);box-shadow:0 10px 32px rgba(37,99,235,0.45)}.bookmark-float:active{transform:scale(0.96)}
    
    @media (max-width: 640px) {
      .header { padding: 12px 16px; }

    }
  .lang-select{background:rgba(255,255,255,0.08);color:#fff;border:1px solid var(--border,rgba(255,255,255,0.12));border-radius:8px;padding:8px 10px;font-size:13px;cursor:pointer}.lang-select:focus{outline:none;border-color:var(--accent,#3b82f6)}
</style>

</head>
<body>

<header class="header">
  <div class="logo"><span class="mark">⛵</span><span>AI 润色</span></div>
  <div style="display: flex; gap: 8px;">
    <a href="/ai/ai-chat.html" class="btn btn-secondary" style="padding: 8px 16px;">AI 聊天</a>
    <a href="/" class="btn btn-secondary" style="padding: 8px 16px;">返回首页</a>
  </div>
<select id="langSelect" class="lang-select"><option value="zh">中文</option><option value="ja">日本語</option><option value="en">English</option><option value="vi">Tiếng Việt</option></select>
</header>

<main class="main">
  <div class="grid">
    <div class="panel">
      <div class="panel-header">
        <h2 data-i18n="heading_原文输入">📝 原文输入</h2>
      </div>
      <div class="form-group">
        <label data-i18n="label_润色类型">润色类型</label>
        <select id="polishType">
          <option value="grammar">语法修正 - 修正语法错误和表达不当</option>
          <option value="polish">润色优化 - 提升文采和表达流畅度</option>
          <option value="concise">精简表达 - 去除冗余，简洁表达</option>
          <option value="expand">丰富表达 - 增加细节，丰富内容</option>
          <option value="formal">正式化 - 转为正式/商务风格</option>
          <option value="all">全面润色 - 语法 + 文采 + 风格优化</option>
        </select>
      </div>
      <div class="form-group">
        <label data-i18n="label_原文">原文</label>
        <textarea id="inputText" placeholder="输入需要润色的文本..." data-i18n-placeholder="ph_输入需要润色的文"></textarea>
      </div>
      <div style="display: flex; gap: 10px;">
        <button class="btn btn-primary" id="polishBtn" onclick="polishText()">
          <span>✨</span><span>开始润色</span>
        </button>
        <button class="btn btn-secondary" onclick="clearAll()" data-i18n="清空">清空</button>
        <button class="btn btn-secondary" onclick="pasteFromClipboard()" data-i18n="粘贴">粘贴</button>
      </div>
    </div>
    
    <div class="panel">
      <div class="panel-header">
        <h2 data-i18n="heading_润色结果">🎨 润色结果</h2>
        <div style="display: flex; gap: 6px;">
          <button class="btn btn-icon btn-secondary" onclick="copyResult()" title="复制">📋</button>
          <button class="btn btn-icon btn-secondary" onclick="swapText()" title="交换">🔄</button>
        </div>
      </div>
      <div class="output-content" id="output">
        <p style="color: var(--muted); text-align: center; padding: 40px 20px;">润色结果将显示在这里</p>
      </div>
      <div class="changes" id="changesBox" style="display: none;">
        <h4 data-i18n="heading_主要修改">📊 主要修改</h4>
        <div id="changesList"></div>
      </div>
    </div>
  </div>
</main>

<footer style="text-align: center; padding: 20px; font-size: 12px; color: var(--muted); border-top: 1px solid var(--border);">
  © 2026 <a href="/" style="color: var(--accent);">江湖小站-ZenTools</a> · 所有处理均在本地完成
</footer>

<button class="bookmark-float" onclick="prompt('复制链接收藏本站','https://zentools.xyz')" data-i18n="收藏本站">⭐ 收藏本站</button>

<script>
let settings = { apiKey: '' };

async function polishText() {
  const input = document.getElementById('inputText');
  const output = document.getElementById('output');
  const type = document.getElementById('polishType').value;
  const text = input.value.trim();
  
  if (!text) { alert('请输入需要润色的文本'); return; }
  if (!settings.apiKey) {
    const key = prompt('请输入 API Key（仅保存在本地浏览器）:');
    if (!key) return;
    settings.apiKey = key;
  }
  
  const btn = document.getElementById('polishBtn');
  btn.disabled = true;
  output.innerHTML = '<div class="typing"><span></span><span></span><span></span></div><p style="text-align:center;color:var(--muted);">正在润色...</p>';
  document.getElementById('changesBox').style.display = 'none';
  
  const typePrompts = {
    grammar: '请修正以下文本的语法错误和表达不当之处，保持原意不变：',
    polish: '请润色以下文本，提升文采和表达流畅度，使其更优美：',
    concise: '请精简以下文本，去除冗余表达，用简洁的语言传达相同意思：',
    expand: '请丰富以下文本的表达，增加适当的细节和修饰，使其更生动：',
    formal: '请将以下文本改写为正式/商务风格，适合正式场合使用：',
    all: '请全面润色以下文本：修正语法错误、提升文采、优化表达、使其更流畅优美。请直接输出润色后的文本，并在最后用"---修改说明---"分隔，列出主要修改点。'
  };
  
  try {
    const response = await fetchChat(typePrompts[type] + '\n\n' + text);
    
    // Check if there are change explanations
    const parts = response.split('---修改说明---');
    if (parts.length > 1) {
      const polished = parts[0].trim();
      const changes = parts[1].trim();
      output.innerHTML = formatText(polished);
      showChanges(changes);
    } else {
      output.innerHTML = formatText(response);
    }
  } catch (error) {
    output.innerHTML = '<p style="color:var(--error);text-align:center;padding:40px;">润色失败：' + error.message + '</p>';
  }
  
  btn.disabled = false;
}

async function fetchChat(prompt) {
  const url = 'https://api.openai.com/v1/chat/completions';
  const response = await fetch(url, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': 'Bearer ' + settings.apiKey
    },
    body: JSON.stringify({
      model: 'gpt-4o',
      messages: [
        { role: 'system', content: '你是一个专业的文本润色助手，擅长修正语法错误、提升文采、优化表达。' },
        { role: 'user', content: prompt }
      ],
      temperature: 0.5,
      max_tokens: 4096
    })
  });
  
  if (!response.ok) {
    const err = await response.json().catch(() => ({}));
    throw new Error(err.error?.message || '请求失败');
  }
  
  const data = await response.json();
  return data.choices[0].message.content;
}

function formatText(text) {
  return text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
}

function showChanges(changes) {
  const box = document.getElementById('changesBox');
  const list = document.getElementById('changesList');
  
  let html = '';
  const lines = changes.split('\n').filter(l => l.trim());
  lines.forEach(line => {
    // Try to detect original -> new format
    const match = line.match(/["""]([^""]+)["""]\s*→\s*["""]([^""]+)["""]/);
    if (match) {
      html += `<div class="change-item"><span class="original">${match[1]}</span> → <span class="new">${match[2]}</span></div>`;
    } else {
      html += `<div class="change-item">${line}</div>`;
    }
  });
  
  list.innerHTML = html;
  box.style.display = 'block';
}

function clearAll() {
  document.getElementById('inputText').value = '';
  document.getElementById('output').innerHTML = '<p style="color:var(--muted);text-align:center;padding:40px 20px;">润色结果将显示在这里</p>';
  document.getElementById('changesBox').style.display = 'none';
}

async function pasteFromClipboard() {
  try {
    const text = await navigator.clipboard.readText();
    document.getElementById('inputText').value = text;
  } catch (e) { alert('无法读取剪贴板，请手动粘贴'); }
}

function copyResult() {
  const text = document.getElementById('output').innerText;
  if (text.includes('润色结果将显示') || text.includes('正在润色')) {
    alert('没有可复制的内容');
    return;
  }
  navigator.clipboard.writeText(text).then(() => alert('已复制')).catch(() => alert('复制失败'));
}

function swapText() {
  const input = document.getElementById('inputText');
  const output = document.getElementById('output');
  const temp = input.value;
  input.value = output.innerText;
  output.innerHTML = formatText(temp);
}
</script>

<script>(function(){var t=window.pageTranslations||{};function a(l){var d=t[l]||t.zh||{};document.documentElement.lang=l;var ti=document.querySelector('title[data-i18n]');if(ti){var pk=ti.getAttribute('data-i18n');if(d[pk])document.title=d[pk];}document.querySelectorAll('[data-i18n]').forEach(function(e){var k=e.getAttribute('data-i18n');if(d[k]&&k!=='pageTitle')e.textContent=d[k];});document.querySelectorAll('[data-i18n-placeholder]').forEach(function(e){var k=e.getAttribute('data-i18n-placeholder');if(d[k])e.placeholder=d[k];});var mc=document.querySelector('meta[name="description"]');if(mc&&d.metaDesc)mc.content=d.metaDesc;}var s=document.getElementById('langSelect');if(s){s.addEventListener('change',function(){a(this.value);localStorage.setItem('zentools_lang',this.value);});var sv=localStorage.getItem('zentools_lang')||'zh';s.value=sv;a(sv);})();</script>
</body>
