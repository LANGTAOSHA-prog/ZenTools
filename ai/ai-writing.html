<script>
// ============ State ============
let settings = {
  provider: 'openai',
  apiKey: '',
  baseUrl: '',
  model: 'gpt-4o'
};

// ============ Init ============
function init() {
  loadSettings();
}

function loadSettings() {
  const saved = localStorage.getItem('ai-writing-settings');
  if (saved) {
    settings = { ...settings, ...JSON.parse(saved) };
  }
}

function saveSettings() {
  localStorage.setItem('ai-writing-settings', JSON.stringify(settings));
}

// ============ Generate ============
async function generateContent() {
  const generateBtn = document.getElementById('generateBtn');
  const output = document.getElementById('outputContent');
  
  const type = document.getElementById('writeType').value;
  const topic = document.getElementById('topic').value.trim();
  const style = document.getElementById('style').value;
  const language = document.getElementById('language').value;
  const length = document.getElementById('length').value;
  const requirements = document.getElementById('requirements').value.trim();
  
  if (!topic) {
    alert('请输入主题/标题');
    return;
  }
  
  if (!settings.apiKey) {
    const key = prompt('请输入 API Key（仅保存在本地浏览器）:');
    if (!key) return;
    settings.apiKey = key;
    saveSettings();
  }
  
  generateBtn.disabled = true;
  output.innerHTML = `
    <div class="typing-indicator">
      <span></span><span></span><span></span>
      <span></span><span></span>
    </div>
    <p style="text-align: center; color: var(--muted);">正在生成${language === '中文' ? '中文' : language === '英文' ? '英文' : language}内容...</p>
  `;
  
  try {
    const prompt = buildPrompt(type, topic, style, language, length, requirements);
    const response = await fetchChatResponse(prompt);
    output.innerHTML = formatContent(response);
  } catch (error) {
    output.innerHTML = `
      <p style="color: var(--error); text-align: center; padding: 40px;">
        生成失败：${error.message}<br>
        <small>请检查 API Key 和网络连接</small>
      </p>
    `;
  }
  
  generateBtn.disabled = false;
}

function buildPrompt(type, topic, style, language, length, requirements) {
  const typeMap = {
    article: '文章',
    essay: '短文',
    story: '故事',
    poem: '诗歌',
    email: '邮件',
    report: '报告',
    outline: '大纲'
  };
  
  const styleMap = {
    professional: '专业严谨',
    casual: '轻松随意',
    creative: '富有创意',
    humorous: '幽默风趣',
    academic: '学术正式'
  };
  
  const lengthMap = {
    short: '300-500字',
    medium: '800-1500字',
    long: '2000字以上'
  };
  
  let prompt = `请用${language}写一篇${typeMap[type]}，`;
  prompt += `主题为"${topic}"。\n\n`;
  prompt += `风格要求：${styleMap[style]}。\n`;
  prompt += `长度要求：${lengthMap[length]}。\n`;
  if (requirements) {
    prompt += `其他要求：${requirements}\n`;
  }
  prompt += `\n请直接输出内容，不要添加额外的说明文字。`;
  
  return prompt;
}

async function fetchChatResponse(prompt) {
  const { provider, apiKey, baseUrl, model } = settings;
  
  const messages = [
    { role: 'system', content: '你是一个专业的写作助手，擅长各种类型的文章写作。请用简洁、准确、优美的语言回答用户问题。' },
    { role: 'user', content: prompt }
  ];
  
  let url, headers, body;
  
  if (provider === 'anthropic') {
    url = baseUrl || 'https://api.anthropic.com/v1/messages';
    headers = {
      'Content-Type': 'application/json',
      'x-api-key': apiKey,
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true'
    };
    body = {
      model: model || 'claude-3-5-sonnet-20241022',
      max_tokens: 8192,
      messages: [{ role: 'user', content: prompt }],
      system: '你是一个专业的写作助手。'
    };
  } else {
    url = (baseUrl || 'https://api.openai.com/v1') + '/chat/completions';
    headers = {
      'Content-Type': 'application/json',
      'Authorization': `Bearer ${apiKey}`
    };
    body = {
      model: model || 'gpt-4o',
      messages: messages,
      stream: false,
      temperature: 0.7,
      max_tokens: 8192
    };
  }
  
  const response = await fetch(url, {
    method: 'POST',
    headers: headers,
    body: JSON.stringify(body)
  });
  
  if (!response.ok) {
    const error = await response.json().catch(() => ({}));
    throw new Error(error.error?.message || `HTTP ${response.status}: ${response.statusText}`);
  }
  
  const data = await response.json();
  
  if (provider === 'anthropic') {
    return data.content[0].text;
  } else {
    return data.choices[0].message.content;
  }
}

function formatContent(text) {
  if (!text) return '';
  
  let html = text
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');
  
  // Headers
  html = html.replace(/^### (.*$)/gm, '<h3>$1</h3>');
  html = html.replace(/^## (.*$)/gm, '<h2>$1</h2>');
  html = html.replace(/^# (.*$)/gm, '<h1>$1</h1>');
  
  // Code blocks
  html = html.replace(/```(\w+)?\n([\s\S]*?)```/g, (m, lang, code) => {
    return `<pre><code class="language-${lang||''}">${code.trim()}</code></pre>`;
  });
  
  // Inline code
  html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
  
  // Bold
  html = html.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  
  // Italic
  html = html.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  
  // Lists
  html = html.replace(/^\- (.*$)/gm, '<li>$1</li>');
  html = html.replace(/^\* (.*$)/gm, '<li>$1</li>');
  html = html.replace(/^\d+\. (.*$)/gm, '<li>$1</li>');
  
  // Blockquote
  html = html.replace(/^> (.*$)/gm, '<blockquote>$1</blockquote>');
  
  // Line breaks
  html = html.replace(/\n\n/g, '</p><p>');
  html = html.replace(/\n/g, '<br>');
  
  // Wrap in paragraphs
  if (!html.startsWith('<h') && !html.startsWith('<p') && !html.startsWith('<pre') && !html.startsWith('<blockquote')) {
    html = '<p>' + html;
  }
  if (!html.endsWith('</p>') && !html.endsWith('</pre>') && !html.endsWith('</blockquote>')) {
    html = html + '</p>';
  }
  
  return html;
}

// ============ Toolbar ============
function insertHeading(level) {
  const output = document.getElementById('outputContent');
  const text = `H${level} 标题\n`;
  output.innerHTML += `<h${level}>${text}</h${level}>`;
}

function insertList() {
  const output = document.getElementById('outputContent');
  output.innerHTML += '<ul><li>列表项 1</li><li>列表项 2</li><li>列表项 3</li></ul>';
}

function insertQuote() {
  const output = document.getElementById('outputContent');
  output.innerHTML += '<blockquote>引用内容</blockquote>';
}

function insertCode() {
  const output = document.getElementById('outputContent');
  output.innerHTML += '<pre><code>// 代码示例\nconsole.log("Hello, World!");</code></pre>';
}

// ============ Actions ============
function clearAll() {
  document.getElementById('topic').value = '';
  document.getElementById('requirements').value = '';
  document.getElementById('outputContent').innerHTML = `
    <p style="color: var(--muted); text-align: center; padding: 40px 20px;">
      填写左侧设置，点击"生成内容"，AI 将为您创作文章
    </p>
  `;
}

async function copyContent() {
  const output = document.getElementById('outputContent');
  const text = output.innerText;
  
  if (!text || text.includes('正在生成') || text.includes('填写左侧')) {
    alert('没有可复制的内容');
    return;
  }
  
  try {
    await navigator.clipboard.writeText(text);
    alert('内容已复制到剪贴板');
  } catch (e) {
    alert('复制失败，请手动复制');
  }
}

function downloadContent() {
  const output = document.getElementById('outputContent');
  const text = output.innerText;
  
  if (!text || text.includes('正在生成') || text.includes('填写左侧')) {
    alert('没有可下载的内容');
    return;
  }
  
  const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `AI写作-${new Date().toISOString().slice(0,10)}.txt`;
  a.click();
  URL.revokeObjectURL(url);
}
