function genCW(){

  if(!p){alert('请输入产品名称');return;}
  var prompt='请为以下产品写一段营销文案：\n\n产品：'+p;
  if(a)prompt+='\n目标客户：'+a;
  if(s)prompt+='\n核心卖点：'+s;
  prompt+='\n文案风格：'+st+'\n语言：中文\n\n请给出 3 个不同版本。';

}
