<script>
function genSA(){
  var kw=document.getElementById('saKeyword').value.trim(),rd=document.getElementById('saReader').value.trim(),ex=document.getElementById('saExtra').value.trim();
  if(!kw){alert('请输入关键词');return;}
  var prompt='请为关键词“'+kw+'”写一篇 SEO 优化的博客文章大纲。';
  if(rd)prompt+='\n目标读者：'+rd;
  prompt+='\n\n要求：\n1. 包含 H1-H3 标题结构\n2. 自然插入相关 LSI 关键词\n3. 每个部分简述内容要点\n4. 建议文章长度 1500-2000 字';
  if(ex)prompt+='\n需包含：'+ex;
  document.getElementById('saResult').style.display='block';document.getElementById('saResult').textContent=prompt;
}
