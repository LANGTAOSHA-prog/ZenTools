<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-i18n="pageTitle">AI 改写 - 江湖小站-ZenTools</title>
  <meta name="description" content="AI 智能改写文本，支持同义改写、扩写、缩写、风格转换" />
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    :root { --bg: #070b18; --surface: rgba(14,22,41,0.8); --surface2: rgba(20,31,55,0.9); --border: rgba(255,255,255,0.06); --text: #f0f4ff; --muted: #8899bb; --accent: #3b82f6; --accent2: #8b5cf6; --accent-glow: rgba(59,130,246,0.2); --radius: 14px; --radius-pill: 999px; --success: #22c55e; --error: #ef4444; }
    [data-theme="light"] { --bg: #f2f5f9; --surface: rgba(255,255,255,0.85); --surface2: rgba(240,244,254,0.9); --border: rgba(0,0,0,0.06); --text: #0b111e; --muted: #4a5a7a; }
    body { font-family: 'Inter', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }
    
    .header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 16px 24px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; backdrop-filter: blur(10px); }
    .header .logo { font-weight: 800; font-size: 18px; display: flex; align-items: center; gap: 10px; }
    .header .logo .mark { width: 32px; height: 32px; border-radius: 8px; background: linear-gradient(135deg, var(--accent), var(--accent2)); display: flex; align-items: center; justify-content: center; font-size: 16px; }
    
    .main { flex: 1; display: flex; flex-direction: column; max-width: 1200px; width: 100%; margin: 0 auto; padding: 20px; gap: 20px; }
    
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; flex: 1; min-height: 0; }
    @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }
    
    .panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; display: flex; flex-direction: column; }
    .panel-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
    .panel-header h2 { font-size: 18px; display: flex; align-items: center; gap: 8px; }
    
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; margin-bottom: 6px; font-size: 14px; color: var(--muted); }
    .form-group select, .form-group textarea { width: 100%; padding: 10px 14px; border-radius: var(--radius); border: 1px solid var(--border); background: var(--surface2); color: var(--text); font-size: 14px; font-family: inherit; }
    .form-group select:focus, .form-group textarea:focus { outline: none; border-color: var(--accent); }
    .form-group textarea { min-height: 200px; resize: vertical; }
    
    .btn { padding: 10px 20px; border-radius: var(--radius-pill); border: none; cursor: pointer; font-weight: 600; font-size: 14px; transition: all .3s; display: inline-flex; align-items: center; gap: 6px; }
    .btn-primary { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff; }
    .btn-primary:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(59,130,246,0.4); }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-secondary { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
    .btn-secondary:hover { border-color: var(--accent); }
    
    .output-content { flex: 1; background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; overflow-y: auto; font-size: 15px; line-height: 1.8; }
    
    .toolbar { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
    
    .typing-indicator { display: flex; gap: 4px; padding: 20px; justify-content: center; }
    .typing-indicator span { width: 8px; height: 8px; background: var(--muted); border-radius: 50%; animation: bounce 1.4s infinite; }
    .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
    .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce { 0%, 60%, 100% { transform: translateY(0); } 30% { transform: translateY(-8px); } }
    
    .bookmark-float{position:fixed;bottom:24px;right:24px;z-index:999;display:flex;align-items:center;gap:8px;background:linear-gradient(135deg,#2563eb,#7c3aed);color:#fff;border:none;padding:14px 22px;border-radius:50px;font-size:15px;font-weight:600;cursor:pointer;box-shadow:0 6px 24px rgba(37,99,235,0.35);transition:transform 0.2s,box-shadow 0.2s;text-decoration:none}.bookmark-float:hover{transform:translateY(-3px);box-shadow:0 10px 32px rgba(37,99,235,0.45)}.bookmark-float:active{transform:scale(0.96)}
    
    @media (max-width: 640px) {
      .header { padding: 12px 16px; }
      .main { padding: 12px; }
      .panel { padding: 16px; }
    }
  .lang-select{background:rgba(255,255,255,0.08);color:#fff;border:1px solid var(--border,rgba(255,255,255,0.12));border-radius:8px;padding:8px 10px;font-size:13px;cursor:pointer}.lang-select:focus{outline:none;border-color:var(--accent,#3b82f6)}
</style>
<script>var pageTranslations={"zh":{pageTitle: 'AI 改写 - 江湖小站-ZenTools', metaDesc: 'AI 智能改写文本，支持同义改写、扩写、缩写、风格转换', heading_原文输入: '📝 原文输入', heading_改写结果: '🔄 改写结果', 清空: '清空', 粘贴: '粘贴', 1_首先: '1. 首先', 2_其次: '2. 其次', 3_最后: '3. 最后', 结论: '结论', 分隔线: '分隔线', 收藏本站: '⭐ 收藏本站', label_改写模式: '改写模式', label_原文: '原文', ph_在此输入需要改写: '在此输入需要改写的文本...'},"en":{pageTitle: 'AI 改写 - Free Online Tool | ZenTools', metaDesc: 'Free online tool. Process locally in your browser.', heading_原文输入: '📝 Original Text', heading_改写结果: '🔄 Rewritten', _首先: '1. First', _其次: '2. Second', _最后: '3. Last', label_改写模式: 'Rewrite Mode', label_原文: 'Source Text', ph_在此输入需要改写: 'Enter text to rewrite...'},"ja":{pageTitle: 'AI 改写 - 無料オンラインツール | ZenTools', metaDesc: 'ブラウザで動作する無料オンラインツール。', heading_原文输入: '📝 原文输入', heading_改写结果: '🔄 改写结果', 清空: '清空', 粘贴: '粘贴', 1_首先: '1. 首先', 2_其次: '2. 其次', 3_最后: '3. 最后', 结论: '结论', 分隔线: '分隔线', 收藏本站: '⭐ 收藏本站', label_改写模式: '改写模式', label_原文: '原文', ph_在此输入需要改写: '在此输入需要改写的文本...'},"vi":{pageTitle: 'AI 改写 - Công cụ Trực tuyến Miễn phí | ZenTools', metaDesc: 'Công cụ trực tuyến miễn phí. Xử lý trong trình duyệt.', heading_原文输入: '📝 原文输入', heading_改写结果: '🔄 改写结果', 清空: '清空', 粘贴: '粘贴', 1_首先: '1. 首先', 2_其次: '2. 其次', 3_最后: '3. 最后', 结论: '结论', 分隔线: '分隔线', 收藏本站: '⭐ 收藏本站', label_改写模式: '改写模式', label_原文: '原文', ph_在此输入需要改写: '在此输入需要改写的文本...'};</script>
</head>
<body>

<header class="header">
  <div class="logo">
    <span class="mark">⛵</span>
    <span>AI 改写</span>
  </div>
  <div style="display: flex; gap: 8px;">
    <a href="/ai/ai-chat.html" class="btn btn-secondary" style="padding: 8px 16px;">AI 聊天</a>
    <a href="/" class="btn btn-secondary" style="padding: 8px 16px;">返回首页</a>
  </div>
<select id="langSelect" class="lang-select"><option value="zh">中文</option><option value="ja">日本語</option><option value="en">English</option><option value="vi">Tiếng Việt</option></select>
</header>

<main class="main">
  <div class="grid">
    <div class="panel">
      <div class="panel-header">
        <h2 data-i18n="heading_原文输入">📝 原文输入</h2>
      </div>
      <div class="form-group">
        <label data-i18n="label_改写模式">改写模式</label>
        <select id="rewriteMode">
          <option value="paraphrase">同义改写 - 保持原意，换种说法</option>
          <option value="expand">扩写 - 丰富内容，增加细节</option>
          <option value="summarize">缩写 - 精简内容，保留核心</option>
          <option value="formal">正式化 - 转为正式/商务风格</option>
          <option value="casual">口语化 - 转为轻松/口语风格</option>
          <option value="simplify">简化 - 降低阅读难度</option>
        </select>
      </div>
      <div class="form-group">
        <label data-i18n="label_原文">原文</label>
        <textarea id="inputText" placeholder="在此输入需要改写的文本..." data-i18n-placeholder="ph_在此输入需要改写"></textarea>
      </div>
      <div style="display: flex; gap: 10px;">
        <button class="btn btn-primary" id="rewriteBtn" onclick="rewriteText()">
          <span>✨</span>
          <span>开始改写</span>
        </button>
        <button class="btn btn-secondary" onclick="clearAll()" data-i18n="清空">清空</button>
        <button class="btn btn-secondary" onclick="pasteFromClipboard()" data-i18n="粘贴">粘贴</button>
      </div>
    </div>
    
    <div class="panel">
      <div class="panel-header">
        <h2 data-i18n="heading_改写结果">🔄 改写结果</h2>
        <div style="display: flex; gap: 6px;">
          <button class="btn btn-icon btn-secondary" onclick="copyResult()" title="复制">📋</button>
          <button class="btn btn-icon btn-secondary" onclick="swapText()" title="交换">🔄</button>
        </div>
      </div>
      <div class="output-content" id="outputContent">
        <p style="color: var(--muted); text-align: center; padding: 40px 20px;">
          改写结果将显示在这里
        </p>
      </div>
      <div class="toolbar">
        <button class="btn btn-secondary" onclick="insertText('首先，')" data-i18n="1_首先">1. 首先</button>
        <button class="btn btn-secondary" onclick="insertText('其次，')" data-i18n="2_其次">2. 其次</button>
        <button class="btn btn-secondary" onclick="insertText('最后，')" data-i18n="3_最后">3. 最后</button>
        <button class="btn btn-secondary" onclick="insertText('因此，')" data-i18n="结论">结论</button>
        <button class="btn btn-secondary" onclick="insertText('\n\n---\n\n')" data-i18n="分隔线">分隔线</button>
      </div>
    </div>
  </div>
</main>

<footer style="text-align: center; padding: 20px; font-size: 12px; color: var(--muted); border-top: 1px solid var(--border);">
  © 2026 <a href="/" style="color: var(--accent);">江湖小站-ZenTools</a> · 所有处理均在本地完成
</footer>

<button class="bookmark-float" onclick="prompt('复制链接收藏本站','https://zentools.xyz')" data-i18n="收藏本站">⭐ 收藏本站</button>

<script>
let settings = { apiKey: '' };

async function rewriteText() {
  const input = document.getElementById('inputText');
  const output = document.getElementById('outputContent');
  const mode = document.getElementById('rewriteMode').value;
  const text = input.value.trim();
  
  if (!text) { alert('请输入需要改写的文本'); return; }
  if (!settings.apiKey) {
    const key = prompt('请输入 API Key（仅保存在本地浏览器）:');
    if (!key) return;
    settings.apiKey = key;
  }
  
  const btn = document.getElementById('rewriteBtn');
  btn.disabled = true;
  output.innerHTML = '<div class="typing-indicator"><span></span><span></span><span></span></div><p style="text-align:center;color:var(--muted);">正在改写...</p>';
  
  const modePrompts = {
    paraphrase: '请改写以下文本，保持原意但换种说法表达。不要添加额外内容，直接输出改写结果：',
    expand: '请扩写以下文本，增加细节和例子，使其更丰富完整：',
    summarize: '请缩写以下文本，保留核心意思，精简表达：',
    formal: '请将以下文本改写为正式/商务风格：',
    casual: '请将以下文本改写为轻松/口语化风格：',
    simplify: '请简化以下文本，降低阅读难度，让普通人也能轻松理解：'
  };
  
  try {
    const response = await fetchChat(modePrompts[mode] + '\n\n' + text);
    output.innerHTML = formatText(response);
  } catch (error) {
    output.innerHTML = '<p style="color:var(--error);text-align:center;padding:40px;">改写失败：' + error.message + '</p>';
  }
  
  btn.disabled = false;
}

async function fetchChat(prompt) {
  const url = 'https://api.openai.com/v1/chat/completions';
  const response = await fetch(url, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': 'Bearer ' + settings.apiKey
    },
    body: JSON.stringify({
      model: 'gpt-4o',
      messages: [
        { role: 'system', content: '你是一个专业的文本改写助手。' },
        { role: 'user', content: prompt }
      ],
      temperature: 0.7,
      max_tokens: 4096
    })
  });
  
  if (!response.ok) {
    const err = await response.json().catch(() => ({}));
    throw new Error(err.error?.message || '请求失败');
  }
  
  const data = await response.json();
  return data.choices[0].message.content;
}

function formatText(text) {
  return text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
}

function clearAll() {
  document.getElementById('inputText').value = '';
  document.getElementById('outputContent').innerHTML = '<p style="color:var(--muted);text-align:center;padding:40px 20px;">改写结果将显示在这里</p>';
}

async function pasteFromClipboard() {
  try {
    const text = await navigator.clipboard.readText();
    document.getElementById('inputText').value = text;
  } catch (e) {
    alert('无法读取剪贴板，请手动粘贴');
  }
}

function copyResult() {
  const text = document.getElementById('outputContent').innerText;
  navigator.clipboard.writeText(text).then(() => alert('已复制')).catch(() => alert('复制失败'));
}

function swapText() {
  const input = document.getElementById('inputText');
  const output = document.getElementById('outputContent');
  const temp = input.value;
  input.value = output.innerText;
  output.innerHTML = formatText(temp);
}

function insertText(text) {
  const output = document.getElementById('outputContent');
  output.innerHTML += text;
}
</script>

<script>(function(){var t=window.pageTranslations||{};function a(l){var d=t[l]||t.zh||{};document.documentElement.lang=l;var ti=document.querySelector('title[data-i18n]');if(ti){var pk=ti.getAttribute('data-i18n');if(d[pk])document.title=d[pk];}document.querySelectorAll('[data-i18n]').forEach(function(e){var k=e.getAttribute('data-i18n');if(d[k]&&k!=='pageTitle')e.textContent=d[k];});document.querySelectorAll('[data-i18n-placeholder]').forEach(function(e){var k=e.getAttribute('data-i18n-placeholder');if(d[k])e.placeholder=d[k];});var mc=document.querySelector('meta[name="description"]');if(mc&&d.metaDesc)mc.content=d.metaDesc;}var s=document.getElementById('langSelect');if(s){s.addEventListener('change',function(){a(this.value);localStorage.setItem('zentools_lang',this.value);});var sv=localStorage.getItem('zentools_lang')||'zh';s.value=sv;a(sv);})();</script>
</body>
</html>
