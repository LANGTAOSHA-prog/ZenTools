<script>
const SK='zentools_ai_settings';
function toggleSettings(){const m=document.getElementById('settingsModal');m.style.display=m.style.display==='none'?'flex':'none';if(m.style.display==='flex')loadSettings()}
function loadSettings(){try{const s=localStorage.getItem(SK);if(s){const a=JSON.parse(s);document.getElementById('apiEndpoint').value=a.endpoint||'';document.getElementById('apiKey').value=a.apiKey||'';document.getElementById('modelSelect').value=a.model||'gpt-4o'}}catch(e){}}
function saveSettings(){const s={endpoint:document.getElementById('apiEndpoint').value,apiKey:document.getElementById('apiKey').value,model:document.getElementById('modelSelect').value};localStorage.setItem(SK,JSON.stringify(s));toggleSettings()}
function getSettings(){try{const s=localStorage.getItem(SK);return s?JSON.parse(s):{endpoint:'https://api.openai.com/v1/chat/completions',apiKey:'',model:'gpt-4o'}}catch(e){return{endpoint:'https://api.openai.com/v1/chat/completions',apiKey:'',model:'gpt-4o'}}}
function esc(t){return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\x22/g,'&#34;')}
async function replace(){const text=document.getElementById('text').value.trim();const level=document.getElementById('level').value;const output=document.getElementById('output');const btn=document.getElementById('replaceBtn');if(!text){alert('请输入文本内容');return}const s=getSettings();if(!s.apiKey){toggleSettings();return}const levelMap={light:'轻微改写（替换部分词汇）',medium:'中等改写（替换较多词汇和句式）',heavy:'大幅改写（完全重新组织表达）'};btn.disabled=true;output.classList.add('empty');output.innerHTML='<p>正在替换...</p>';try{const response=await fetch(s.endpoint,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+s.apiKey},body:JSON.stringify({model:s.model,messages:[{role:'system',content:'你是一个专业的文本改写助手。请对以下文本进行 '+levelMap[level]+'。保持原意不变，只改变表达方式。只输出改写后的文本，不要添加任何解释。'},{role:'user',content:text}],temperature:0.5,max_tokens:2048})});if(!response.ok)throw new Error('API请求失败');const data=await response.json();const result=data.choices[0].message.content;output.classList.remove('empty');output.innerHTML='<div class="result-title" style="margin-bottom:12px;color:var(--cyan);font-size:14px">✅ '+levelMap[level]+'</div><div style="white-space:pre-wrap">'+esc(result)+'</div>'}catch(e){output.classList.add('empty');output.innerHTML='<p style="color:var(--error);text-align:center;padding:40px">替换失败：'+esc(e.message)+'</p>'}btn.disabled=false}
function clearAll(){document.getElementById('text').value='';document.getElementById('output').classList.add('empty');document.getElementById('output').innerHTML='<p data-i18n="emptyResult">替换结果将显示在这里</p>'}
function copyResult(){const t=document.getElementById('output').innerText;if(t.includes('替换结果将显示')){alert('没有可复制的内容');return}navigator.clipboard.writeText(t).then(()=>alert('已复制')).catch(()=>alert('复制失败'))}
loadSettings();
</script>
