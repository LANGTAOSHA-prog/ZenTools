<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><link rel="manifest" href="/manifest.json" />
<title>AI 知识库 - 江湖小站-ZenTools</title>
<meta name="description" content="AI 智能知识库问答系统，基于上传的文档内容进行问答" />
<style>*{margin:0;padding:0;box-sizing:border-box}:root{--bg:#070b18;--surface:rgba(14,22,41,0.8);--surface2:rgba(20,31,55,0.9);--border:rgba(255,255,255,0.06);--text:#f0f4ff;--muted:#8899bb;--accent:#3b82f6;--accent2:#8b5cf6;--radius:14px;--radius-pill:999px;--success:#22c55e}[data-theme="light"]{--bg:#f2f5f9;--surface:rgba(255,255,255,0.85);--surface2:rgba(240,244,254,0.9);--border:rgba(0,0,0,0.06);--text:#0b111e;--muted:#4a5a7a}
body{font-family:'Inter','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column}
.header{background:var(--surface);border-bottom:1px solid var(--border);padding:16px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;backdrop-filter:blur(10px)}.header .logo{font-weight:800;font-size:18px;display:flex;align-items:center;gap:10px}.header .logo .mark{width:32px;height:32px;border-radius:8px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-size:16px}.header .actions{display:flex;gap:8px}
.main{flex:1;max-width:960px;width:100%;margin:0 auto;padding:24px;display:grid;grid-template-columns:1fr 1fr;gap:20px}@media(max-width:768px){.main{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;display:flex;flex-direction:column}.panel h2{font-size:15px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
textarea{width:100%;flex:1;min-height:200px;padding:14px;border-radius:var(--radius);border:1px solid var(--border);background:var(--surface2);color:var(--text);font-size:14px;resize:vertical;line-height:1.6;margin-bottom:12px}textarea:focus{outline:none;border-color:var(--accent)}input{width:100%;padding:12px 16px;border-radius:var(--radius);border:1px solid var(--border);background:var(--surface2);color:var(--text);font-size:14px}input:focus{outline:none;border-color:var(--accent)}
.btn{padding:10px 22px;border-radius:var(--radius-pill);border:none;cursor:pointer;font-weight:600;font-size:14px;transition:all .3s;display:inline-flex;align-items:center;gap:6px}.btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}.btn-primary:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 4px 12px rgba(59,130,246,0.4)}.btn-primary:disabled{opacity:0.5;cursor:not-allowed}.btn-secondary{background:var(--surface2);color:var(--text);border:1px solid var(--border)}.btn-secondary:hover{border-color:var(--accent)}.btn-sm{padding:6px 14px;font-size:12px}.btn-success{background:var(--success);color:#fff}
.chat-area{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:12px;margin-bottom:12px;min-height:300px;padding:4px}.msg{display:flex;gap:10px;animation:fadeIn .3s}@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.msg.user{flex-direction:row-reverse}.msg-avatar{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}.msg.user .msg-avatar{background:linear-gradient(135deg,var(--accent),var(--accent2))}.msg.ai .msg-avatar{background:var(--surface2);border:1px solid var(--border)}
.msg-content{max-width:80%;padding:10px 14px;border-radius:12px;font-size:13px;line-height:1.6}.msg.user .msg-content{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-radius:12px 12px 0 12px}.msg.ai .msg-content{background:var(--surface2);border:1px solid var(--border);border-radius:12px 12px 12px 0}
.kb-status{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);margin-bottom:8px}.kb-status .dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}.kb-status .dot.active{background:var(--success)}.kb-status .dot.empty{background:var(--muted)}
.input-row{display:flex;gap:8px}.input-row input{flex:1}.loading{display:none;align-items:center;gap:8px;color:var(--muted);font-size:13px}.loading.show{display:flex}.loading .spinner{width:14px;height:14px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.footer{text-align:center;padding:20px;font-size:12px;color:var(--muted)}
.bookmark-float{position:fixed;bottom:24px;right:24px;z-index:999;display:flex;align-items:center;gap:8px;background:linear-gradient(135deg,#2563eb,#7c3aed);color:#fff;border:none;padding:14px 22px;border-radius:50px;font-size:15px;font-weight:600;cursor:pointer;box-shadow:0 6px 24px rgba(37,99,235,0.35);transition:transform 0.2s,box-shadow 0.2s;text-decoration:none}.bookmark-float:hover{transform:translateY(-3px);box-shadow:0 10px 32px rgba(37,99,235,0.45)}.bookmark-float:active{transform:scale(0.96)}</style>
</head>
<body>
<div class="header"><a href="/" class="logo" style="text-decoration:none;color:inherit"><span class="mark">📚</span> AI 知识库</a><div class="actions"><button class="btn btn-secondary btn-sm" onclick="toggleSettings()">⚙️ 设置</button><a href="/ai/" class="btn btn-secondary btn-sm">← 返回</a></div></div>
<div class="main">
  <div class="panel">
    <h2>📄 知识库文档</h2>
    <div class="kb-status" id="kbStatus"><span class="dot empty"></span> <span id="kbLabel">暂无文档，请粘贴或输入知识内容</span></div>
    <textarea id="kbContent" placeholder="在此粘贴你的知识库文档内容...&#10;&#10;支持粘贴：&#10;• 产品文档 / 技术手册&#10;• 公司制度 / SOP&#10;• 学习笔记 / 课程资料&#10;• FAQ / 帮助文档"></textarea>
    <button class="btn btn-primary btn-sm" onclick="saveKnowledge()">💾 保存到知识库</button>
  </div>
  <div class="panel">
    <h2>💬 知识问答</h2>
    <div class="chat-area" id="chatArea">
      <div style="text-align:center;padding:20px;color:var(--muted);font-size:13px">保存知识库文档后，在此提问</div>
    </div>
    <div class="loading" id="loading"><div class="spinner"></div> AI 正在检索知识...</div>
    <div class="input-row">
      <input type="text" id="questionInput" placeholder="基于知识库提问..." onkeydown="if(event.key==='Enter')askKB()" />
      <button class="btn btn-primary btn-sm" onclick="askKB()">提问</button>
    </div>
  </div>
</div>
<div class="modal-overlay" id="settingsModal" style="display:none">
  <div class="modal"><h3>⚙️ API 设置</h3><div style="margin:16px 0"><label style="display:block;margin-bottom:6px;font-size:13px;color:var(--muted)">API Endpoint</label><input type="text" id="apiEndpoint" value="https://api.openai.com/v1/chat/completions" style="width:100%"></div><div style="margin:16px 0"><label style="display:block;margin-bottom:6px;font-size:13px;color:var(--muted)">API Key</label><input type="password" id="apiKey" placeholder="sk-..." style="width:100%"></div><div style="margin:16px 0"><label style="display:block;margin-bottom:6px;font-size:13px;color:var(--muted)">模型</label><select id="modelSelect" style="width:100%"><option value="gpt-3.5-turbo">GPT-3.5 Turbo</option><option value="gpt-4">GPT-4</option><option value="gpt-4-turbo">GPT-4 Turbo</option><option value="deepseek-chat">DeepSeek Chat</option></select></div><div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn btn-secondary" onclick="toggleSettings()">取消</button><button class="btn btn-primary" onclick="saveSettings()">保存</button></div></div>
</div>
<div class="footer">© 2026 <a href="/" style="color:var(--accent);">江湖小站-ZenTools</a></div>
<button class="bookmark-float" onclick="prompt('复制链接收藏本站','https://zentools.xyz')">⭐ 收藏本站</button>
<style>.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.7);display:flex;align-items:center;justify-content:center;z-index:1000;backdrop-filter:blur(5px)}.modal{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:28px;max-width:440px;width:90%}.modal h3{font-size:18px;margin-bottom:8px}</style>
<script>const SK='zentools_ai_settings';const KB_KEY='zentools_knowledge_base';let kbContent='';
function ls(){try{const s=localStorage.getItem(SK);if(s){const a=JSON.parse(s);document.getElementById('apiEndpoint').value=a.endpoint||'https://api.openai.com/v1/chat/completions';document.getElementById('apiKey').value=a.apiKey||'';document.getElementById('modelSelect').value=a.model||'gpt-3.5-turbo'}}catch(e){}}
function ss(){localStorage.setItem(SK,JSON.stringify({endpoint:document.getElementById('apiEndpoint').value,apiKey:document.getElementById('apiKey').value,model:document.getElementById('modelSelect').value}));ts()}
function ts(){const m=document.getElementById('settingsModal');m.style.display=m.style.display==='none'?'flex':'none';if(m.style.display==='flex')ls()}
function gs(){try{const s=localStorage.getItem(SK);return s?JSON.parse(s):{endpoint:'https://api.openai.com/v1/chat/completions',apiKey:'',model:'gpt-3.5-turbo'}}catch(e){return{endpoint:'https://api.openai.com/v1/chat/completions',apiKey:'',model:'gpt-3.5-turbo'}}}
function loadKB(){try{kbContent=localStorage.getItem(KB_KEY)||'';const dot=document.querySelector('#kbStatus .dot');const label=document.getElementById('kbLabel');if(kbContent){dot.className='dot active';label.textContent='知识库已加载 ('+kbContent.length+' 字)';document.getElementById('kbContent').value=kbContent}else{dot.className='dot empty';label.textContent='暂无文档，请粘贴或输入知识内容'}}catch(e){}}
function saveKnowledge(){const c=document.getElementById('kbContent').value.trim();if(!c){alert('请输入文档内容');return}
kbContent=c;localStorage.setItem(KB_KEY,c);const dot=document.querySelector('#kbStatus .dot');dot.className='dot active';document.getElementById('kbLabel').textContent='知识库已保存 ('+c.length+' 字)'
const chatArea=document.getElementById('chatArea');if(chatArea.querySelector('.msg')===null)chatArea.innerHTML='<div style="text-align:center;padding:20px;color:var(--muted);font-size:13px">知识库已就绪，可以开始提问了！</div>'}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>')}
function addMsg(role,content){const chatArea=document.getElementById('chatArea');const placeholder=chatArea.querySelector('div[style*="text-align"]');if(placeholder)placeholder.remove();const d=document.createElement('div');d.className='msg '+role;d.innerHTML='<div class="msg-avatar">'+(role==='user'?'👤':'🤖')+'</div><div class="msg-content">'+esc(content)+'</div>';chatArea.appendChild(d);chatArea.scrollTop=chatArea.scrollHeight}
function askKB(){const q=document.getElementById('questionInput').value.trim();if(!q)return;if(!kbContent){alert('请先保存知识库文档');return}const s=gs();if(!s.apiKey){ts();return}
addMsg('user',q);document.getElementById('questionInput').value='';const l=document.getElementById('loading');l.classList.add('show')
const p='你是一个基于知识库的问答助手。请根据以下文档内容回答用户的问题。\n\n知识库文档：\n'+kbContent+'\n\n用户问题：'+q+'\n\n请基于知识库内容回答，如果文档中没有相关信息，请如实说明。'
fetch(s.endpoint,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+s.apiKey},body:JSON.stringify({model:s.model,messages:[{role:'user',content:p}],max_tokens:1024})})
.then(r=>r.ok?r.json():Promise.reject('HTTP '+r.status)).then(d=>{addMsg('ai',d.choices[0].message.content)})
.catch(e=>{addMsg('ai','请求失败：'+e)}).finally(()=>{l.classList.remove('show')})}
loadKB();ls();</script>
</body>
</html>
