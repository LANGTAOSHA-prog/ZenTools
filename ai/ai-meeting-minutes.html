<style>*{margin:0;padding:0;box-sizing:border-box}:root{--bg:#070b18;--surface:rgba(14,22,41,0.8);--surface2:rgba(20,31,55,0.9);--border:rgba(255,255,255,0.06);--text:#f0f4ff;--muted:#8899bb;--accent:#3b82f6;--accent2:#8b5cf6;--radius:14px;--radius-pill:999px}[data-theme="light"]{--bg:#f2f5f9;--surface:rgba(255,255,255,0.85);--surface2:rgba(240,244,254,0.9);--border:rgba(0,0,0,0.06);--text:#0b111e;--muted:#4a5a7a}
body{font-family:'Inter','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column}
.header{background:var(--surface);border-bottom:1px solid var(--border);padding:16px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;backdrop-filter:blur(10px)}.header .logo{font-weight:800;font-size:18px;display:flex;align-items:center;gap:10px}.header .logo .mark{width:32px;height:32px;border-radius:8px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-size:16px}.header .actions{display:flex;gap:8px}

textarea{width:100%;min-height:200px;padding:14px;border-radius:var(--radius);border:1px solid var(--border);background:var(--surface2);color:var(--text);font-size:14px;resize:vertical;line-height:1.6;margin-bottom:12px}textarea:focus{outline:none;border-color:var(--accent)}input{width:100%;padding:12px 16px;border-radius:var(--radius);border:1px solid var(--border);background:var(--surface2);color:var(--text);font-size:14px;margin-bottom:12px}input:focus{outline:none;border-color:var(--accent)}select{padding:10px 14px;border-radius:var(--radius);border:1px solid var(--border);background:var(--surface2);color:var(--text);font-size:14px}select:focus{outline:none;border-color:var(--accent)}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.btn{padding:10px 22px;border-radius:var(--radius-pill);border:none;cursor:pointer;font-weight:600;font-size:14px;transition:all .3s;display:inline-flex;align-items:center;gap:6px}.btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}.btn-primary:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 4px 12px rgba(59,130,246,0.4)}.btn-primary:disabled{opacity:0.5;cursor:not-allowed}.btn-secondary{background:var(--surface2);color:var(--text);border:1px solid var(--border)}.btn-secondary:hover{border-color:var(--accent)}.btn-sm{padding:6px 14px;font-size:12px}
.result-box{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-top:16px;display:none}.result-box.show{display:block}.result-content{font-size:14px;line-height:1.9;white-space:pre-wrap;background:rgba(0,0,0,0.2);padding:16px;border-radius:8px;margin-top:10px;max-height:600px;overflow-y:auto}
.loading{display:none;align-items:center;gap:8px;color:var(--muted);font-size:14px;padding:12px 0}.loading.show{display:flex}.loading .spinner{width:18px;height:18px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}
.footer{text-align:center;padding:20px;font-size:12px;color:var(--muted)}.bookmark-float{position:fixed;bottom:24px;right:24px;z-index:999;display:flex;align-items:center;gap:8px;background:linear-gradient(135deg,#2563eb,#7c3aed);color:#fff;border:none;padding:14px 22px;border-radius:50px;font-size:15px;font-weight:600;cursor:pointer;box-shadow:0 6px 24px rgba(37,99,235,0.35);transition:transform 0.2s,box-shadow 0.2s;text-decoration:none}.bookmark-float:hover{transform:translateY(-3px);box-shadow:0 10px 32px rgba(37,99,235,0.45)}.bookmark-float:active{transform:scale(0.96)}
.lang-select{background:rgba(255,255,255,0.08);color:#fff;border:1px solid var(--border,rgba(255,255,255,0.12));border-radius:8px;padding:8px 10px;font-size:13px;cursor:pointer}.lang-select:focus{outline:none;border-color:var(--accent,#3b82f6)}
</style>
<script>var pageTranslations={zh: {pageTitle: 'AI 会议纪要 - 江湖小站-ZenTools', metaDesc: 'AI 智能将会议录音或文字整理为结构化会议纪要', _📝_会议信息: '📝 会议信息', _📄_会议纪要: '📄 会议纪要', _⚙️_API_设置: '⚙️ API 设置', btn: '⭐ 收藏本站', api_endpoint: 'API Endpoint', api_key: 'API Key', : '模型', placeholder_: '粘贴会议记录/讨论内容...\n\n支持粘贴：\n• 会议录音转写的文字\n• 会议讨论记录\n• 聊天/邮件讨论内容', placeholder_sk: 'sk-...'}, en: {pageTitle: 'AI 会议纪要 - Free Online Tool | ZenTools', metaDesc: 'Free online tool. Process locally in your browser.', _会议信息: '📝 会议信息', _会议纪要: '📄 会议纪要', _API_设置: '⚙️ API Settings', btn: '⭐ 收藏本站', api_endpoint: 'API Endpoint', api_key: 'API Key', placeholder_: '粘贴会议记录/讨论内容...\\n\\n支持粘贴：\\n• 会议录音转写的文字\\n• 会议讨论记录\\n• 聊天/邮件讨论内容', placeholder_sk: 'sk-...'}, ja: {pageTitle: 'AI 会议纪要 - 無料オンラインツール | ZenTools', metaDesc: 'ブラウザで動作する無料オンラインツール。', _📝_会议信息: '📝 会议信息', _📄_会议纪要: '📄 会议纪要', _⚙️_API_设置: '⚙️ API 设置', btn: '⭐ 收藏本站', api_endpoint: 'API Endpoint', api_key: 'API Key', : '模型', placeholder_: '粘贴会议记录/讨论内容...\n\n支持粘贴：\n• 会议录音转写的文字\n• 会议讨论记录\n• 聊天/邮件讨论内容', placeholder_sk: 'sk-...'}, vi: {pageTitle: 'AI 会议纪要 - Công cụ Trực tuyến Miễn phí | ZenTools', metaDesc: 'Công cụ trực tuyến miễn phí.', _📝_会议信息: '📝 会议信息', _📄_会议纪要: '📄 会议纪要', _⚙️_API_设置: '⚙️ API 设置', btn: '⭐ 收藏本站', api_endpoint: 'API Endpoint', api_key: 'API Key', : '模型', placeholder_: '粘贴会议记录/讨论内容...\n\n支持粘贴：\n• 会议录音转写的文字\n• 会议讨论记录\n• 聊天/邮件讨论内容', placeholder_sk: 'sk-...'};</script>
</head>
<body>
<div class="header"><a href="/" class="logo" style="text-decoration:none;color:inherit"><span class="mark">📋</span> AI 会议纪要</a><div class="actions"><button class="btn btn-secondary btn-sm" onclick="toggleSettings()" data-i18n="btn">⚙️ 设置</button><a href="/ai/" class="btn btn-secondary btn-sm">← 返回</a></div><select id="langSelect" class="lang-select"><option value="zh">中文</option><option value="ja">日本語</option><option value="en">English</option><option value="vi">Tiếng Việt</option></select>
</div>
<div class="main">
  <h1 class="zt-seo-title" style="font-size:20px;font-weight:700;color:var(--text);margin:16px 0 12px;line-height:1.3">AI 会议纪要</h1>

  <div class="card">
    <h2 data-i18n="_📝_会议信息">📝 会议信息</h2>
    <input type="text" id="meetingTitle" placeholder="会议主题 / 标题" data-i18n-placeholder="placeholder_" />
    <div class="toolbar">
      <input type="text" id="meetingParticipants" placeholder="参会人员（逗号分隔）" data-i18n-placeholder="placeholder_" style="flex:2" />
      <select id="meetingFormat"><option value="detailed">详细纪要</option><option value="concise">简洁纪要</option><option value="action">行动项纪要</option></select>
    </div>
    <textarea id="meetingInput" placeholder="粘贴会议记录/讨论内容...&#10;&#10;支持粘贴：&#10;• 会议录音转写的文字&#10;• 会议讨论记录&#10;• 聊天/邮件讨论内容" rows="8"></textarea>
    <button class="btn btn-primary" onclick="generateMinutes()" data-i18n="btn">📋 生成会议纪要</button>
  </div>
  <div class="loading" id="loading"><div class="spinner"></div> AI 正在整理会议纪要...</div>
  <div class="result-box" id="resultBox"><h2 data-i18n="_📄_会议纪要">📄 会议纪要</h2><div id="minutesResult" class="result-content"></div><div style="margin-top:12px"><button class="btn btn-secondary btn-sm" onclick="copyMinutes()" data-i18n="btn">📋 复制</button><button class="btn btn-secondary btn-sm" onclick="downloadMinutes()" data-i18n="btn">⬇️ 下载</button></div></div>
</div>
<div class="modal-overlay" id="settingsModal" style="display:none">
  <div class="modal"><h3 data-i18n="_⚙️_API_设置">⚙️ API 设置</h3><div style="margin:16px 0"><label style="display:block;margin-bottom:6px;font-size:13px;color:var(--muted)" data-i18n="api_endpoint">API Endpoint</label><input type="text" id="apiEndpoint" value="https://api.openai.com/v1/chat/completions" style="width:100%"></div><div style="margin:16px 0"><label style="display:block;margin-bottom:6px;font-size:13px;color:var(--muted)" data-i18n="api_key">API Key</label><input type="password" id="apiKey" placeholder="sk-..." data-i18n-placeholder="placeholder_sk" style="width:100%"></div><div style="margin:16px 0"><label style="display:block;margin-bottom:6px;font-size:13px;color:var(--muted)" data-i18n="">模型</label><select id="modelSelect" style="width:100%"><option value="gpt-3.5-turbo">GPT-3.5 Turbo</option><option value="gpt-4">GPT-4</option><option value="gpt-4-turbo">GPT-4 Turbo</option><option value="deepseek-chat">DeepSeek Chat</option></select></div><div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn btn-secondary" onclick="toggleSettings()" data-i18n="btn">取消</button><button class="btn btn-primary" onclick="saveSettings()" data-i18n="btn">保存</button></div></div>
</div>
<div class="footer">© 2026 <a href="/" style="color:var(--accent);">江湖小站-ZenTools</a></div>
<button class="bookmark-float" onclick="prompt('复制链接收藏本站','https://zentools.xyz')" data-i18n="btn">⭐ 收藏本站</button>
<style>.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.7);display:flex;align-items:center;justify-content:center;z-index:1000;backdrop-filter:blur(5px)}.modal{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:28px;max-width:440px;width:90%}.modal h3{font-size:18px;margin-bottom:8px}</style>
<script>const SK='zentools_ai_settings';
function ls(){try{const s=localStorage.getItem(SK);if(s){const a=JSON.parse(s);document.getElementById('apiEndpoint').value=a.endpoint||'https://api.openai.com/v1/chat/completions';document.getElementById('apiKey').value=a.apiKey||'';document.getElementById('modelSelect').value=a.model||'gpt-3.5-turbo'}catch(e){}
function ss(){localStorage.setItem(SK,JSON.stringify({endpoint:document.getElementById('apiEndpoint').value,apiKey:document.getElementById('apiKey').value,model:document.getElementById('modelSelect').value}));ts()}
function ts(){const m=document.getElementById('settingsModal');m.style.display=m.style.display==='none'?'flex':'none';if(m.style.display==='flex')ls()}
function gs(){try{const s=localStorage.getItem(SK);return s?JSON.parse(s):{endpoint:'https://api.openai.com/v1/chat/completions',apiKey:'',model:'gpt-3.5-turbo'}catch(e){return{endpoint:'https://api.openai.com/v1/chat/completions',apiKey:'',model:'gpt-3.5-turbo'}}
let lastResult='';
function generateMinutes(){const content=document.getElementById('meetingInput').value.trim();if(!content){alert('请输入会议内容');return}const s=gs();if(!s.apiKey){ts();return}
const title=document.getElementById('meetingTitle').value.trim()||'未命名会议';const participants=document.getElementById('meetingParticipants').value.trim();const fmt=document.getElementById('meetingFormat');
const fmtLabels={detailed:'详细会议纪要（含讨论要点、意见分歧、决策）',concise:'简洁会议纪要（只包含关键结论和action）',action:'行动项纪要（主要关注待办事项和负责人）'};
const btn=event.target;const l=document.getElementById('loading');const r=document.getElementById('resultBox');btn.disabled=true;l.classList.add('show');r.classList.remove('show')
const p='请整理以下会议内容为'+fmtLabels[fmt.value]+'。\n\n会议主题：'+title+(participants?'\n参会人员：'+participants:'')+'\n\n会议记录：\n'+content+'\n\n请用结构化格式输出。'
fetch(s.endpoint,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+s.apiKey},body:JSON.stringify({model:s.model,messages:[{role:'user',content:p}],max_tokens:2048})})
.then(r=>r.ok?r.json():Promise.reject('HTTP '+r.status)).then(d=>{lastResult=d.choices[0].message.content;document.getElementById('minutesResult').textContent=lastResult;r.classList.add('show')})
.catch(e=>{document.getElementById('minutesResult').textContent='请求失败：'+e;r.classList.add('show')}).finally(()=>{btn.disabled=false;l.classList.remove('show')})}
function copyMinutes(){if(lastResult)navigator.clipboard.writeText(lastResult).then(()=>alert('已复制'))}
function downloadMinutes(){if(!lastResult)return;const blob=new Blob([lastResult],{type:'text/plain;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='会议纪要_'+(document.getElementById('meetingTitle').value.trim()||'未命名')+'.txt';a.click()}
ls();</script>

<script>
(function(){var t=window.pageTranslations||{};function apply(l){var d=t[l]||t.zh||{};document.documentElement.lang=l;var ti=document.querySelector('title[data-i18n]');if(ti){var pk=ti.getAttribute('data-i18n');if(d[pk])document.title=d[pk];}document.querySelectorAll('[data-i18n]').forEach(function(e){var k=e.getAttribute('data-i18n');if(d[k]&&k!=='pageTitle')e.textContent=d[k];});document.querySelectorAll('[data-i18n-placeholder]').forEach(function(e){var k=e.getAttribute('data-i18n-placeholder');if(d[k])e.placeholder=d[k];});var mc=document.querySelector('meta[name="description"]');if(mc&&d.metaDesc)mc.content=d.metaDesc;}var s=document.getElementById('langSelect');if(s){s.addEventListener('change',function(){apply(this.value);localStorage.setItem('zentools_lang',this.value);});var sv=localStorage.getItem('zentools_lang')||'zh';s.value=sv;apply(sv);})();
</script>
</body>
</html>
