<style>*{margin:0;padding:0;box-sizing:border-box}:root{--bg:#070b18;--surface:rgba(14,22,41,0.8);--surface2:rgba(20,31,55,0.9);--border:rgba(255,255,255,0.06);--text:#f0f4ff;--muted:#8899bb;--accent:#3b82f6;--accent2:#8b5cf6;--radius:14px;--radius-pill:999px}[data-theme="light"]{--bg:#f2f5f9;--surface:rgba(255,255,255,0.85);--surface2:rgba(240,244,254,0.9);--border:rgba(0,0,0,0.06);--text:#0b111e;--muted:#4a5a7a}

select{padding:10px 14px;border-radius:var(--radius);border:1px solid var(--border);background:var(--surface2);color:var(--text);font-size:14px}select:focus{outline:none;border-color:var(--accent)}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.btn{padding:10px 22px;border-radius:var(--radius-pill);border:none;cursor:pointer;font-weight:600;font-size:14px;transition:all .3s;display:inline-flex;align-items:center;gap:6px}.btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}.btn-primary:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 4px 12px rgba(59,130,246,0.4)}.btn-primary:disabled{opacity:0.5;cursor:not-allowed}.btn-secondary{background:var(--surface2);color:var(--text);border:1px solid var(--border)}.btn-secondary:hover{border-color:var(--accent)}.btn-sm{padding:6px 14px;font-size:12px}
.result-box{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-top:16px;display:none}.result-box.show{display:block}
#imageDisplay{display:flex;flex-wrap:wrap;gap:16px;justify-content:center;margin-top:12px}#imageDisplay img{max-width:100%;border-radius:8px;border:1px solid var(--border)}
.loading{display:none;align-items:center;gap:8px;color:var(--muted);font-size:14px;padding:12px 0}.loading.show{display:flex}.loading .spinner{width:18px;height:18px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}
.footer{text-align:center;padding:20px;font-size:12px;color:var(--muted)}.bookmark-float{position:fixed;bottom:24px;right:24px;z-index:999;display:flex;align-items:center;gap:8px;background:linear-gradient(135deg,#2563eb,#7c3aed);color:#fff;border:none;padding:14px 22px;border-radius:50px;font-size:15px;font-weight:600;cursor:pointer;box-shadow:0 6px 24px rgba(37,99,235,0.35);transition:transform 0.2s,box-shadow 0.2s;text-decoration:none}.bookmark-float:hover{transform:translateY(-3px);box-shadow:0 10px 32px rgba(37,99,235,0.45)}.bookmark-float:active{transform:scale(0.96)}
.lang-select{background:rgba(255,255,255,0.08);color:#fff;border:1px solid var(--border,rgba(255,255,255,0.12));border-radius:8px;padding:8px 10px;font-size:13px;cursor:pointer}.lang-select:focus{outline:none;border-color:var(--accent,#3b82f6)}
</style>

<body>
<div class="header"><a href="/" class="logo" style="text-decoration:none;color:inherit"><span class="mark">🎨</span> AI 图片生成</a><div class="actions"><button class="btn btn-secondary btn-sm" onclick="toggleSettings()" data-i18n="btn">⚙️ 设置</button><a href="/ai/" class="btn btn-secondary btn-sm">← 返回</a></div><select id="langSelect" class="lang-select"><option value="zh">中文</option><option value="ja">日本語</option><option value="en">English</option><option value="vi">Tiếng Việt</option></select>
</div>
<div class="main">
  <h1 class="zt-seo-title" style="font-size:20px;font-weight:700;color:var(--text);margin:16px 0 12px;line-height:1.3">AI 图片生成</h1>

  <div class="card">
    <h2 data-i18n="_🎯_描述你想要的图片">🎯 描述你想要的图片</h2>
    <textarea id="promptInput" placeholder="用文字描述你想生成的图片，例如：&#10;一只可爱的橘猫坐在窗台上，阳光洒在它的身上，暖色调，写实风格" rows="4"></textarea>
    <div class="toolbar">
      <select id="imgStyle"><option value="realistic">写实风格</option><option value="anime">动漫风格</option><option value="oil">油画风格</option><option value="watercolor">水彩风格</option><option value="sketch">素描风格</option><option value="pixel">像素风格</option><option value="3d">3D渲染</option></select>
      <select id="imgSize"><option value="1024x1024">方形 1024x1024</option><option value="1024x1792">竖屏 1024x1792</option><option value="1792x1024">横屏 1792x1024</option></select>
      <select id="imgCount"><option value="1">1 张</option><option value="2">2 张</option><option value="3">3 张</option><option value="4">4 张</option></select>
    </div>
    <button class="btn btn-primary" onclick="generateImage()" data-i18n="btn">🎨 生成图片</button>
  </div>
  <div class="loading" id="loading"><div class="spinner"></div> AI 正在生成图片，请稍候...</div>
  <div class="result-box" id="resultBox"><h2 data-i18n="_🖼️_生成结果">🖼️ 生成结果</h2><div id="imageDisplay"></div><div id="imageInfo" style="text-align:center;margin-top:12px;color:var(--muted);font-size:13px"></div></div>
</div>
<div class="modal-overlay" id="settingsModal" style="display:none">
  <div class="modal"><h3 data-i18n="_⚙️_API_设置">⚙️ API 设置</h3><div style="margin:16px 0"><label style="display:block;margin-bottom:6px;font-size:13px;color:var(--muted)" data-i18n="api_endpoint">API Endpoint</label><input type="text" id="apiEndpoint" value="https://api.openai.com/v1/images/generations" style="width:100%"></div><div style="margin:16px 0"><label style="display:block;margin-bottom:6px;font-size:13px;color:var(--muted)" data-i18n="api_key">API Key</label><input type="password" id="apiKey" placeholder="sk-..." data-i18n-placeholder="placeholder_sk" style="width:100%"></div><div style="margin:16px 0"><label style="display:block;margin-bottom:6px;font-size:13px;color:var(--muted)" data-i18n="api">模型/API类型</label><select id="modelSelect" style="width:100%"><option value="openai">OpenAI DALL-E</option><option value="custom">自定义 API</option></select></div><div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn btn-secondary" onclick="toggleSettings()" data-i18n="btn">取消</button><button class="btn btn-primary" onclick="saveSettings()" data-i18n="btn">保存</button></div></div>
</div>

<button class="bookmark-float" onclick="prompt('复制链接收藏本站','https://zentools.xyz')" data-i18n="btn">⭐ 收藏本站</button>
<style>.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.7);display:flex;align-items:center;justify-content:center;z-index:1000;backdrop-filter:blur(5px)}.modal{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:28px;max-width:440px;width:90%}.modal h3{font-size:18px;margin-bottom:8px}</style>
<script>const SK='zentools_ai_settings';
function ls(){try{const s=localStorage.getItem(SK);if(s){const a=JSON.parse(s);document.getElementById('apiEndpoint').value=a.endpoint||'https://api.openai.com/v1/images/generations';document.getElementById('apiKey').value=a.apiKey||'';document.getElementById('modelSelect').value=a.model||'openai'}catch(e){}
function ss(){localStorage.setItem(SK,JSON.stringify({endpoint:document.getElementById('apiEndpoint').value,apiKey:document.getElementById('apiKey').value,model:document.getElementById('modelSelect').value}));ts()}
function ts(){const m=document.getElementById('settingsModal');m.style.display=m.style.display==='none'?'flex':'none';if(m.style.display==='flex')ls()}
function gs(){try{const s=localStorage.getItem(SK);return s?JSON.parse(s):{endpoint:'https://api.openai.com/v1/images/generations',apiKey:'',model:'openai'}catch(e){return{endpoint:'https://api.openai.com/v1/images/generations',apiKey:'',model:'openai'}}
function generateImage(){const p=document.getElementById('promptInput').value.trim();if(!p){alert('请输入图片描述');return}const s=gs();if(!s.apiKey){ts();return}
const st=document.getElementById('imgStyle');const sz=document.getElementById('imgSize');const ct=document.getElementById('imgCount');
const styleMap={realistic:'写实风格',anime:'动漫风格',oil:'油画风格',watercolor:'水彩风格',sketch:'素描风格',pixel:'像素风格',_3d:'3D渲染风格'};
const fullPrompt='('+styleMap[st.value]+') '+p;const n=parseInt(ct.value);const btn=event.target;const l=document.getElementById('loading');const r=document.getElementById('resultBox');
btn.disabled=true;l.classList.add('show');r.classList.remove('show');
if(s.model==='openai'||s.endpoint.includes('openai')){fetch(s.endpoint,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+s.apiKey},body:JSON.stringify({model:'dall-e-3',prompt:fullPrompt,n:n,size:sz.value})})
.then(r=>r.ok?r.json():Promise.reject('HTTP '+r.status)).then(d=>{const images=d.data.map(i=>i.url||i.b64_json);const display=document.getElementById('imageDisplay');display.innerHTML='';
images.forEach((url,i)=>{const img=document.createElement('img');img.src=url;img.alt='生成图片'+(i+1);img.style.maxHeight='400px';display.appendChild(img)});r.classList.add('show')})
.catch(e=>{document.getElementById('imageDisplay').innerHTML='<p style="color:var(--error)" data-i18n="e_messag">请求失败：'+e.message+'</p>';r.classList.add('show')})
.finally(()=>{btn.disabled=false;l.classList.remove('show')})}else{fetch(s.endpoint,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+s.apiKey},body:JSON.stringify({prompt:fullPrompt,n:n})})
.then(r=>r.ok?r.json():Promise.reject('HTTP '+r.status)).then(d=>{const display=document.getElementById('imageDisplay');display.innerHTML='<p style="color:var(--muted)" data-i18n="api_json">自定义API返回：'+JSON.stringify(d)+'</p>';r.classList.add('show')}).catch(e=>{document.getElementById('imageDisplay').innerHTML='<p style="color:var(--error)">请求失败：'+e.message+'</p>';r.classList.add('show')}).finally(()=>{btn.disabled=false;l.classList.remove('show')})}
ls();</script>

<script>
(function(){var t=window.pageTranslations||{};function apply(l){var d=t[l]||t.zh||{};document.documentElement.lang=l;var ti=document.querySelector('title[data-i18n]');if(ti){var pk=ti.getAttribute('data-i18n');if(d[pk])document.title=d[pk];}document.querySelectorAll('[data-i18n]').forEach(function(e){var k=e.getAttribute('data-i18n');if(d[k]&&k!=='pageTitle')e.textContent=d[k];});document.querySelectorAll('[data-i18n-placeholder]').forEach(function(e){var k=e.getAttribute('data-i18n-placeholder');if(d[k])e.placeholder=d[k];});var mc=document.querySelector('meta[name="description"]');if(mc&&d.metaDesc)mc.content=d.metaDesc;}var s=document.getElementById('langSelect');if(s){s.addEventListener('change',function(){apply(this.value);localStorage.setItem('zentools_lang',this.value);});var sv=localStorage.getItem('zentools_lang')||'zh';s.value=sv;apply(sv);})();
</script>
</body>
