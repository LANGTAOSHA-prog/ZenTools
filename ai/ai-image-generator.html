<script>
const SK='zentools_ai_image_settings';
let currentImageUrl='';
function toggleSettings(){const m=document.getElementById('settingsModal');m.style.display=m.style.display==='none'?'flex':'none';if(m.style.display==='flex')loadSettings()}
function loadSettings(){try{const s=localStorage.getItem(SK);if(s){const a=JSON.parse(s);document.getElementById('apiEndpoint').value=a.endpoint||'';document.getElementById('apiKey').value=a.apiKey||'';document.getElementById('modelSelect').value=a.model||'dall-e-3'}}catch(e){}}
function saveSettings(){const s={endpoint:document.getElementById('apiEndpoint').value,apiKey:document.getElementById('apiKey').value,model:document.getElementById('modelSelect').value};localStorage.setItem(SK,JSON.stringify(s));toggleSettings()}
function getSettings(){try{const s=localStorage.getItem(SK);return s?JSON.parse(s):{endpoint:'https://api.openai.com/v1/images/generations',apiKey:'',model:'dall-e-3'}}catch(e){return{endpoint:'https://api.openai.com/v1/images/generations',apiKey:'',model:'dall-e-3'}}}
async function generate(){const prompt=document.getElementById('prompt').value.trim();const style=document.getElementById('style').value;const size=document.getElementById('size').value;const output=document.getElementById('output');const btn=document.getElementById('genBtn');if(!prompt){alert('请输入图片描述');return}const s=getSettings();if(!s.apiKey){toggleSettings();return}const finalPrompt=style?prompt+', '+style:prompt;btn.disabled=true;output.classList.add('empty');output.innerHTML='<div class="loading"><div class="spinner"></div><p>正在生成图片...</p></div>';try{const response=await fetch(s.endpoint,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+s.apiKey},body:JSON.stringify({model:s.model,prompt:finalPrompt,size,size,quality:'hd',n:1})});if(!response.ok)throw new Error('API请求失败');const data=await response.json();currentImageUrl=data.data[0].url;output.classList.remove('empty');output.innerHTML='<img src="'+currentImageUrl+'" alt="生成的图片" onclick="window.open(this.src,\''_blank\'">';document.getElementById('dlBtn').style.display='inline-flex'}catch(e){output.classList.add('empty');output.innerHTML='<p style="color:var(--error);text-align:center;padding:40px">生成失败：'+esc(e.message)+'</p>'}btn.disabled=false}
function esc(t){return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\x22/g,'&#34;')}
function clearAll(){document.getElementById('prompt').value='';document.getElementById('output').classList.add('empty');document.getElementById('output').innerHTML='<p data-i18n="emptyPrompt">描述你想要的图片...</p>';document.getElementById('dlBtn').style.display='none';currentImageUrl=''}
async function downloadImage(){if(!currentImageUrl)return;try{const r=await fetch(currentImageUrl);const b=await r.blob();const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download='ai-image.png';a.click();URL.revokeObjectURL(u)}catch(e){window.open(currentImageUrl,'_blank')}}
loadSettings();
</script>
