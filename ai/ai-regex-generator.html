<script>
const SK='zentools_ai_settings';
let currentRegex='';
function toggleSettings(){const m=document.getElementById('settingsModal');m.style.display=m.style.display==='none'?'flex':'none';if(m.style.display==='flex')loadSettings()}
function loadSettings(){try{const s=localStorage.getItem(SK);if(s){const a=JSON.parse(s);document.getElementById('apiEndpoint').value=a.endpoint||'';document.getElementById('apiKey').value=a.apiKey||'';document.getElementById('modelSelect').value=a.model||'gpt-4o'}}catch(e){}}
function saveSettings(){const s={endpoint:document.getElementById('apiEndpoint').value,apiKey:document.getElementById('apiKey').value,model:document.getElementById('modelSelect').value};localStorage.setItem(SK,JSON.stringify(s));toggleSettings()}
function getSettings(){try{const s=localStorage.getItem(SK);return s?JSON.parse(s):{endpoint:'https://api.openai.com/v1/chat/completions',apiKey:'',model:'gpt-4o'}}catch(e){return{endpoint:'https://api.openai.com/v1/chat/completions',apiKey:'',model:'gpt-4o'}}}
function esc(t){return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\x22/g,'&#34;')}
async function generate(){const prompt=document.getElementById('prompt').value.trim();const btn=document.getElementById('genBtn');if(!prompt){alert('请描述你的正则表达式需求');return}const s=getSettings();if(!s.apiKey){toggleSettings();return}btn.disabled=true;btn.querySelector('span[data-i18n]').textContent='⏳ 生成中...';try{const response=await fetch(s.endpoint,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+s.apiKey},body:JSON.stringify({model:s.model,messages:[{role:'system',content:'You are a regex expert. Generate a JavaScript-compatible regular expression for the user request. Output format:\n\nRegex: [the regex]\nExplanation:\n- [explain each part]'},{role:'user',content:prompt}],temperature:0.3,max_tokens:512})});if(!response.ok)throw new Error('API请求失败');const data=await response.json();const content=data.choices[0].message.content;const lines=content.split('\n');let regex='';let explanation='';lines.forEach(function(line){if(line.match(/^Regex:/i)){regex=line.replace(/^Regex:\s*/i,'').trim()}else if(line.match(/^- /)){explanation+=esc(line)+'<br>'}});if(!regex){regex=content}currentRegex=regex;document.getElementById('regexDisplay').textContent='/'+regex+'/';document.getElementById('explanation').innerHTML=explanation||esc(content);document.getElementById('resultPanel').style.display='block';document.getElementById('testInput').value='';document.getElementById('testResult').style.display='none'}catch(e){alert('生成失败：'+e.message)}btn.disabled=false;btn.querySelector('span[data-i18n]').textContent='🔍 生成正则'}
function testRegex(){const input=document.getElementById('testInput').value;const result=document.getElementById('testResult');if(!currentRegex||!input){result.style.display='none';return}try{const re=new RegExp(currentRegex);const matches=input.match(re);if(matches){result.className='test-result match';result.textContent='✅ 匹配成功：'+matches[0];}else{result.className='test-result no-match';result.textContent='❌ 不匹配';}result.style.display='block'}catch(e){result.className='test-result no-match';result.textContent='❌ 正则表达式无效';result.style.display='block'}}
function copyRegex(){if(!currentRegex){alert('没有可复制的正则表达式');return}navigator.clipboard.writeText(currentRegex).then(()=>alert('已复制')).catch(()=>alert('复制失败'))}
function clearAll(){document.getElementById('prompt').value='';document.getElementById('resultPanel').style.display='none';currentRegex=''}
loadSettings();
