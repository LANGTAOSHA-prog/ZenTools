<body>
<div class="header">
  <a href="/" class="logo" style="text-decoration:none;color:inherit"><span class="mark">🔤</span> AI 正则生成</a>

<style>
  .modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.7);display:flex;align-items:center;justify-content:center;z-index:1000;backdrop-filter:blur(5px)}

<script>
const STORAGE_KEY = 'zentools_ai_settings';
let currentRegex = '';

function loadSettings() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      const s = JSON.parse(saved);
      document.getElementById('apiEndpoint').value = s.endpoint || 'https://api.openai.com/v1/chat/completions';
      document.getElementById('apiKey').value = s.apiKey || '';
      document.getElementById('modelSelect').value = s.model || 'gpt-3.5-turbo';
    }
  } catch(e) {}
}
function saveSettings() {
  const settings = { endpoint: document.getElementById('apiEndpoint').value, apiKey: document.getElementById('apiKey').value, model: document.getElementById('modelSelect').value };
  localStorage.setItem(STORAGE_KEY, JSON.stringify(settings));
  toggleSettings();
}
function toggleSettings() {
  const modal = document.getElementById('settingsModal');
  modal.style.display = modal.style.display === 'none' ? 'flex' : 'none';
  if (modal.style.display === 'flex') loadSettings();
}
function getSettings() {
  try { const s = localStorage.getItem(STORAGE_KEY); return s ? JSON.parse(s) : { endpoint: 'https://api.openai.com/v1/chat/completions', apiKey: '', model: 'gpt-3.5-turbo' }; } catch(e) { return { endpoint: 'https://api.openai.com/v1/chat/completions', apiKey: '', model: 'gpt-3.5-turbo' }; }
}

const exampleMap = {
  '匹配电子邮箱': '匹配电子邮箱地址，支持常见的邮箱格式如 user@example.com',
  '匹配手机号': '匹配中国大陆手机号，11位数字，以1开头',
  '匹配URL链接': '匹配 http/https 协议的 URL 链接',
  '匹配IP地址': '匹配 IPv4 地址，格式如 192.168.1.1',
  '只允许中文': '只匹配中文字符，不包括标点符号',
  '匹配日期 YYYY-MM-DD': '匹配日期格式 YYYY-MM-DD，验证有效日期',
  '匹配所有数字': '匹配所有数字字符，包括整数和小数',
  '密码强度验证': '密码强度验证：至少8位，包含大小写字母、数字和特殊字符'
};

function useExample(el) {
  const text = el.textContent;
  document.getElementById('descInput').value = exampleMap[text] || text;
}

function generateRegex() {
  const desc = document.getElementById('descInput').value.trim();
  if (!desc) { alert('请描述你需要的正则表达式'); return; }

  const settings = getSettings();
  if (!settings.apiKey) { toggleSettings(); return; }

  const btn = document.getElementById('generateBtn');
  const loading = document.getElementById('loading');
  const resultBox = document.getElementById('resultBox');

  btn.disabled = true;
  loading.classList.add('show');
  resultBox.classList.remove('show');

  const prompt = '你是一个正则表达式专家。请根据以下需求生成正则表达式。\n\n需求：' + desc + '\n\n请按以下格式回复（不要多余内容）：\n正则：<正则表达式>\n说明：<简短解释这个正则的含义>\n示例：<匹配示例>';

  fetch(settings.endpoint, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + settings.apiKey },
    body: JSON.stringify({ model: settings.model, messages: [{ role: 'user', content: prompt }], max_tokens: 500 })
  })
  .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
  .then(data => {
    const content = data.choices[0].message.content;
    const regexMatch = content.match(/正则[：:]\s*(\S+)/);
    if (regexMatch) currentRegex = regexMatch[1];
    else currentRegex = content;

    document.getElementById('regexDisplay').textContent = currentRegex;
    document.getElementById('explanation').textContent = content;
    resultBox.classList.add('show');
    document.getElementById('testInput').value = '';
    document.getElementById('testResult').innerHTML = '';
    document.getElementById('matchInfo').textContent = '';
  })
  .catch(err => {
    document.getElementById('regexDisplay').textContent = '请求失败：' + err.message;
    resultBox.classList.add('show');
  })
  .finally(() => { btn.disabled = false; loading.classList.remove('show'); });
}

function testRegex() {
  const testText = document.getElementById('testInput').value;
  if (!testText || !currentRegex) {
    document.getElementById('testResult').innerHTML = testText || '';
    document.getElementById('matchInfo').textContent = '';
    return;
  }
  try {
    const regex = new RegExp(currentRegex, 'g');
    let matches = [];
    let match;
    while ((match = regex.exec(testText)) !== null) {
      matches.push({ index: match.index, length: match[0].length, text: match[0] });
      if (match.index === regex.lastIndex) regex.lastIndex++;
    }
    const matchCount = matches.length;
    let html = '';
    let lastIdx = 0;
    for (const m of matches) {
      if (m.index > lastIdx) html += '<span class="nomatch">' + escapeHtml(testText.slice(lastIdx, m.index)) + '</span>';
      html += '<span class="match">' + escapeHtml(m.text) + '</span>';
      lastIdx = m.index + m.length;
    }
    if (lastIdx < testText.length) html += '<span class="nomatch">' + escapeHtml(testText.slice(lastIdx)) + '</span>';
    document.getElementById('testResult').innerHTML = html;
    document.getElementById('matchInfo').innerHTML = '找到 <span class="match-count">' + matchCount + '</span> 个匹配';
  } catch(e) {
    document.getElementById('testResult').innerHTML = '<span style="color:var(--error)">正则错误：' + e.message + '</span>';
    document.getElementById('matchInfo').textContent = '';
  }
}

function copyRegex() {
  if (currentRegex) { navigator.clipboard.writeText(currentRegex).then(() => alert('已复制')); }
}

function escapeHtml(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

loadSettings();
</script>
<script>(function(){var t=window.pageTranslations||{};function a(l){var d=t[l]||t.zh||{};document.documentElement.lang=l;var ti=document.querySelector('title[data-i18n]');if(ti){var pk=ti.getAttribute('data-i18n');if(d[pk])document.title=d[pk];}document.querySelectorAll('[data-i18n]').forEach(function(e){var k=e.getAttribute('data-i18n');if(d[k]&&k!=='pageTitle')e.textContent=d[k];});document.querySelectorAll('[data-i18n-placeholder]').forEach(function(e){var k=e.getAttribute('data-i18n-placeholder');if(d[k])e.placeholder=d[k];});var mc=document.querySelector('meta[name="description"]');if(mc&&d.metaDesc)mc.content=d.metaDesc;}var s=document.getElementById('langSelect');if(s){s.addEventListener('change',function(){a(this.value);localStorage.setItem('zentools_lang',this.value);});var sv=localStorage.getItem('zentools_lang')||'zh';s.value=sv;a(sv);})();</script>
