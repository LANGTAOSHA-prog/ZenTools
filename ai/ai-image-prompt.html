<script>
const SK='zentools_ai_settings';
let imageDataUrl='';
function toggleSettings(){const m=document.getElementById('settingsModal');m.style.display=m.style.display==='none'?'flex':'none';if(m.style.display==='flex')loadSettings()}
function loadSettings(){try{const s=localStorage.getItem(SK);if(s){const a=JSON.parse(s);document.getElementById('apiEndpoint').value=a.endpoint||'';document.getElementById('apiKey').value=a.apiKey||'';document.getElementById('modelSelect').value=a.model||'gpt-4o'}}catch(e){}}

function esc(t){return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\x22/g,'&#34;')}
function handleFileUpload(e){const f=e.target.files[0];if(!f)return;if(f.size>10*1024*1024){alert('图片不能超过10MB');return}const reader=new FileReader();reader.onload=function(ev){imageDataUrl=ev.target.result;document.getElementById('previewImg').src=imageDataUrl;document.getElementById('previewImg').style.display='block';document.getElementById('uploadArea').style.display='none';document.getElementById('imageUrl').value=''};reader.readAsDataURL(f)}
const uploadArea=document.getElementById('uploadArea');
uploadArea.addEventListener('dragover',function(e){e.preventDefault();this.classList.add('dragover')});
uploadArea.addEventListener('dragleave',function(){this.classList.remove('dragover')});
uploadArea.addEventListener('drop',function(e){e.preventDefault();this.classList.remove('dragover');const f=e.dataTransfer.files[0];if(f&&f.type.startsWith('image/')){const event={target:{files:[f]}};handleFileUpload(event)}});
async function analyzeImage(){const s=getSettings();if(!s.apiKey){toggleSettings();return}let src=imageDataUrl||document.getElementById('imageUrl').value.trim();if(!src){alert('请先上传图片或输入图片URL');return}const output=document.getElementById('output');const btn=document.getElementById('analyzeBtn');btn.disabled=true;output.classList.add('empty');output.innerHTML='<p>正在分析图片...</p>';try{const messages=[{role:'user',content:[{type:'text',text:'请详细描述这张图片的内容，包括主体、背景、颜色、风格、构图、光线等。如果适合用作AI绘画的提示词，请直接输出英文prompt。用中文描述图片内容即可。'},{type:'image_url',image_url:{url:src}}]}];const response=await fetch(s.endpoint,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+s.apiKey},body:JSON.stringify({model:s.model,messages,temperature:0.5,max_tokens:1024})});if(!response.ok)throw new Error('API请求失败');const data=await response.json();const text=data.choices[0].message.content;output.classList.remove('empty');output.innerHTML='<div style="display:flex;gap:8px;margin-bottom:12px"><span class="tag">📝 图片描述</span></div><div style="white-space:pre-wrap">'+esc(text)+'</div>'}catch(e){output.classList.add('empty');output.innerHTML='<p style="color:var(--error);text-align:center;padding:40px">分析失败：'+esc(e.message)+'</p>'}btn.disabled=false}
function clearAll(){imageDataUrl='';document.getElementById('fileInput').value='';document.getElementById('previewImg').style.display='none';document.getElementById('uploadArea').style.display='block';document.getElementById('imageUrl').value='';document.getElementById('output').classList.add('empty');document.getElementById('output').innerHTML='<p data-i18n="placeholder">生成的图片描述将显示在这里</p>'}
function copyResult(){const t=document.getElementById('output').innerText;if(t.includes('生成的图片描述将显示')){alert('没有可复制的内容');return}navigator.clipboard.writeText(t).then(()=>alert('已复制')).catch(()=>alert('复制失败'))}
loadSettings();
</script>
