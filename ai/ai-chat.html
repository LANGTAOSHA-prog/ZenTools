<script>
const SK='zentools_ai_settings';
const messages=[{role:'system',content:'You are a helpful assistant.'}];
function toggleSettings(){const m=document.getElementById('settingsModal');m.style.display=m.style.display==='none'?'flex':'none';if(m.style.display==='flex')loadSettings()}
function loadSettings(){try{const s=localStorage.getItem(SK);if(s){const a=JSON.parse(s);document.getElementById('apiEndpoint').value=a.endpoint||'';document.getElementById('apiKey').value=a.apiKey||'';document.getElementById('modelSelect').value=a.model||'gpt-4o'}}catch(e){}}
function saveSettings(){const s={endpoint:document.getElementById('apiEndpoint').value,apiKey:document.getElementById('apiKey').value,model:document.getElementById('modelSelect').value};localStorage.setItem(SK,JSON.stringify(s));toggleSettings()}
function getSettings(){try{const s=localStorage.getItem(SK);return s?JSON.parse(s):{endpoint:'https://api.openai.com/v1/chat/completions',apiKey:'',model:'gpt-4o'}}catch(e){return{endpoint:'https://api.openai.com/v1/chat/completions',apiKey:'',model:'gpt-4o'}}}
function appendMessage(role,content){const c=document.getElementById('messages');const es=c.querySelector('.empty-state');if(es)es.remove();const div=document.createElement('div');div.className='message '+(role==='user'?'user':'bot');div.innerHTML='<div class="avatar">'+(role==='user'?'👤':'🤖')+'</div><div class="bubble">'+esc(content)+'</div>';c.appendChild(div);c.scrollTop=c.scrollHeight}
function esc(t){return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\x22/g,'&#34;')}
async function sendMessage(){const inp=document.getElementById('userInput');const msg=inp.value.trim();if(!msg)return;inp.value='';appendMessage('user',msg);messages.push({role:'user',content:msg});const s=getSettings();if(!s.apiKey){toggleSettings();return}const loader=document.createElement('div');loader.className='message bot';loader.innerHTML='<div class="avatar">🤖</div><div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>';document.getElementById('messages').appendChild(loader);document.getElementById('messages').scrollTop=document.getElementById('messages').scrollHeight;try{const response=await fetch(s.endpoint,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+s.apiKey},body:JSON.stringify({model:s.model,messages})});if(!response.ok)throw new Error('API error');const data=await response.json();const reply=data.choices[0].message.content;messages.push({role:'assistant',content:reply});loader.remove();appendMessage('assistant',reply)}catch(e){loader.remove();appendMessage('assistant','抱歉，出现错误：'+e.message)}}
loadSettings();
</script>
