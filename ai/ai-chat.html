    :root { --bg: #070b18; --surface: rgba(14,22,41,0.8); --surface2: rgba(20,31,55,0.9); --border: rgba(255,255,255,0.06); --text: #f0f4ff; --muted: #8899bb; --accent: #3b82f6; --accent2: #8b5cf6; --accent-glow: rgba(59,130,246,0.2); --radius: 14px; --radius-pill: 999px; --success: #22c55e; --error: #ef4444; }
    [data-theme="light"] { --bg: #f2f5f9; --surface: rgba(255,255,255,0.85); --surface2: rgba(240,244,254,0.9); --border: rgba(0,0,0,0.06); --text: #0b111e; --muted: #4a5a7a; }
    body { font-family: 'Inter', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }
    
    .header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 16px 24px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; backdrop-filter: blur(10px); }
    .header .logo { font-weight: 800; font-size: 18px; display: flex; align-items: center; gap: 10px; }
    .header .logo .mark { width: 32px; height: 32px; border-radius: 8px; background: linear-gradient(135deg, var(--accent), var(--accent2)); display: flex; align-items: center; justify-content: center; font-size: 16px; }
    .header .actions { display: flex; gap: 8px; align-items: center; }
    
    .main { flex: 1; display: flex; flex-direction: column; max-width: 900px; width: 100%; margin: 0 auto; }
    .chat-container { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 16px; scroll-behavior: smooth; }
    
    .message { display: flex; gap: 12px; animation: fadeIn 0.3s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .message.user { flex-direction: row-reverse; }
    .message-avatar { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; }
    .message.user .message-avatar { background: linear-gradient(135deg, var(--accent), var(--accent2)); }
    .message.assistant .message-avatar { background: var(--surface2); border: 1px solid var(--border); }
    
    .message-content { max-width: 70%; padding: 14px 18px; border-radius: var(--radius); line-height: 1.6; }
    .message.user .message-content { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff; border-radius: var(--radius) var(--radius) 0 var(--radius); }

    .message-content pre code { background: none; padding: 0; }
    
    .typing-indicator { display: flex; gap: 4px; padding: 4px; }
    .typing-indicator span { width: 8px; height: 8px; background: var(--muted); border-radius: 50%; animation: bounce 1.4s infinite; }
    .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
    .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce { 0%, 60%, 100% { transform: translateY(0); } 30% { transform: translateY(-8px); } }
    
    .input-area { background: var(--surface); border-top: 1px solid var(--border); padding: 16px 24px; display: flex; gap: 12px; align-items: flex-end; }
    .input-wrapper { flex: 1; position: relative; }
    .input-wrapper textarea { width: 100%; min-height: 50px; max-height: 200px; padding: 12px 48px 12px 16px; border-radius: var(--radius); border: 1px solid var(--border); background: var(--surface2); color: var(--text); font-size: 15px; font-family: inherit; resize: none; transition: border-color .3s; }
    .input-wrapper textarea:focus { outline: none; border-color: var(--accent); }

    .btn { padding: 10px 20px; border-radius: var(--radius-pill); border: none; cursor: pointer; font-weight: 600; font-size: 14px; transition: all .3s; display: flex; align-items: center; gap: 6px; }

    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-secondary { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }

<script>
// ============ State ============
let messages = [];
let isGenerating = false;
let settings = {
  provider: 'openai',
  apiKey: '',
  baseUrl: '',
  model: 'gpt-4o'
};

// ============ Init ============
function init() {
  loadSettings();
  loadChat();
  if (messages.length > 0) {
    showChat();
    renderMessages();
  }
}

// ============ Settings ============
function loadSettings() {
  const saved = localStorage.getItem('ai-chat-settings');
  if (saved) {
    settings = { ...settings, ...JSON.parse(saved) };
    document.getElementById('apiProvider').value = settings.provider;
    document.getElementById('apiKey').value = settings.apiKey;
    document.getElementById('baseUrl').value = settings.baseUrl;
    document.getElementById('modelName').value = settings.model;
    updateProviderFields();
  }
}

function saveSettings() {
  settings.provider = document.getElementById('apiProvider').value;
  settings.apiKey = document.getElementById('apiKey').value.trim();
  settings.baseUrl = document.getElementById('baseUrl').value.trim();
  settings.model = document.getElementById('modelName').value.trim() || getDefaultModel();
  
  if (!settings.apiKey) {
    alert('请输入 API Key');
    return;
  }
  
  localStorage.setItem('ai-chat-settings', JSON.stringify(settings));
  closeSettings();
  alert('设置已保存！');
}

function updateProviderFields() {
  const provider = document.getElementById('apiProvider').value;
  const baseUrlGroup = document.getElementById('baseUrlGroup');
  const modelInput = document.getElementById('modelName');
  
  const defaults = {
    openai: { baseUrl: 'https://api.openai.com/v1', model: 'gpt-4o' },
    anthropic: { baseUrl: 'https://api.anthropic.com/v1', model: 'claude-3-5-sonnet-20241022' },
    deepseek: { baseUrl: 'https://api.deepseek.com/v1', model: 'deepseek-chat' },
    custom: { baseUrl: '', model: '' }
  };
  
  const d = defaults[provider] || defaults.openai;
  
  if (provider === 'custom') {
    baseUrlGroup.style.display = 'block';
    modelInput.placeholder = '模型名称';
  } else {
    baseUrlGroup.style.display = 'none';
    document.getElementById('baseUrl').value = d.baseUrl;
    if (!settings.model) modelInput.placeholder = d.model;
  }
}

function getDefaultModel() {
  const provider = document.getElementById('apiProvider').value;
  const defaults = {
    openai: 'gpt-4o',
    anthropic: 'claude-3-5-sonnet-20241022',
    deepseek: 'deepseek-chat',
    custom: 'gpt-4o'
  };
  return defaults[provider] || 'gpt-4o';
}

function openSettings() {
  document.getElementById('settingsModal').classList.add('active');
}

function closeSettings() {
  document.getElementById('settingsModal').classList.remove('active');
}

// ============ Chat ============
function showChat() {
  document.getElementById('welcomeScreen').style.display = 'none';
  document.getElementById('chatContainer').style.display = 'flex';
  document.getElementById('inputArea').style.display = 'flex';
}

function hideChat() {
  document.getElementById('welcomeScreen').style.display = 'flex';
  document.getElementById('chatContainer').style.display = 'none';
  document.getElementById('inputArea').style.display = 'none';
}

function renderMessages() {
  const container = document.getElementById('chatContainer');
  container.innerHTML = '';
  
  messages.forEach(msg => {
    const div = document.createElement('div');
    div.className = `message ${msg.role}`;
    div.innerHTML = `
      <div class="message-avatar">${msg.role === 'user' ? '👤' : '🤖'}</div>
      <div class="message-content">${formatMessage(msg.content)}</div>
    `;
    container.appendChild(div);
  });
  
  container.scrollTop = container.scrollHeight;
}

function formatMessage(text) {
  if (!text) return '';
  // Escape HTML
  let html = text
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');
  
  // Code blocks
  html = html.replace(/```(\w+)?\n([\s\S]*?)```/g, (m, lang, code) => {
    return `<pre><code class="language-${lang||''}">${code.trim()}</code></pre>`;
  });
  
  // Inline code
  html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
  
  // Bold
  html = html.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  
  // Line breaks
  html = html.replace(/\n/g, '<br>');
  
  return html;
}

function handleKeyDown(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
  
  const target = e.target;
  target.style.height = 'auto';
  target.style.height = Math.min(target.scrollHeight, 200) + 'px';
  document.getElementById('charCount').textContent = target.value.length;
}

function useSuggestion(text) {
  document.getElementById('userInput').value = text;
  document.getElementById('charCount').textContent = text.length;
  sendMessage();
}

function clearChat() {
  if (confirm('确定要清空所有对话记录吗？')) {
    messages = [];
    localStorage.removeItem('ai-chat-history');
    hideChat();
    renderMessages();
  }
}

function loadChat() {
  const saved = localStorage.getItem('ai-chat-history');
  if (saved) {
    try {
      messages = JSON.parse(saved);
    } catch (e) {
      messages = [];
    }
  }
}

function saveChat() {
  localStorage.setItem('ai-chat-history', JSON.stringify(messages));
}

// ============ Send Message ============
async function sendMessage() {
  const input = document.getElementById('userInput');
  const text = input.value.trim();
  
  if (!text || isGenerating) return;
  
  if (!settings.apiKey) {
    openSettings();
    return;
  }
  
  // Show chat UI
  showChat();
  
  // Add user message
  messages.push({ role: 'user', content: text });
  saveChat();
  renderMessages();
  
  // Clear input
  input.value = '';
  input.style.height = 'auto';
  document.getElementById('charCount').textContent = '0';
  
  // Set generating state
  isGenerating = true;
  document.getElementById('sendBtn').disabled = true;
  
  // Add placeholder for assistant
  const container = document.getElementById('chatContainer');
  const assistantDiv = document.createElement('div');
  assistantDiv.className = 'message assistant';
  assistantDiv.innerHTML = `
    <div class="message-avatar">🤖</div>
    <div class="message-content">
      <div class="typing-indicator">
        <span></span><span></span><span></span>
      </div>
    </div>
  `;
  container.appendChild(assistantDiv);
  container.scrollTop = container.scrollHeight;
  
  try {
    const response = await fetchChatResponse(messages);
    
    // Remove typing indicator
    assistantDiv.remove();
    
    // Add assistant message
    messages.push({ role: 'assistant', content: response });
    saveChat();
    renderMessages();
  } catch (error) {
    // Remove typing indicator
    assistantDiv.remove();
    
    // Show error
    const errorDiv = document.createElement('div');
    errorDiv.className = 'message assistant';
    errorDiv.innerHTML = `
      <div class="message-avatar">⚠️</div>
      <div class="message-content" style="color: var(--error);">
        请求失败：${error.message}<br>
        <small>请检查 API Key 和网络连接</small>
      </div>
    `;
    container.appendChild(errorDiv);
    container.scrollTop = container.scrollHeight;
  }
  
  isGenerating = false;
  document.getElementById('sendBtn').disabled = false;
  input.focus();
}

async function fetchChatResponse(history) {
  const { provider, apiKey, baseUrl, model } = settings;
  
  // Prepare messages (system prompt)
  const messages = [
    { role: 'system', content: '你是一个有用、无害的 AI 助手。请用简洁、准确的语言回答用户问题。支持中文、英文、日文、越南语等多种语言。' },
    ...history.map(m => ({ role: m.role, content: m.content }))
  ];
  
  let url, headers, body;
  
  if (provider === 'anthropic') {
    // Anthropic API
    url = baseUrl || 'https://api.anthropic.com/v1/messages';
    headers = {
      'Content-Type': 'application/json',
      'x-api-key': apiKey,
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true'
    };
    body = {
      model: model || 'claude-3-5-sonnet-20241022',
      max_tokens: 4096,
      messages: history.filter(m => m.role !== 'system'),
      system: '你是一个有用、无害的 AI 助手。'
    };
  } else {
    // OpenAI compatible API
    url = (baseUrl || 'https://api.openai.com/v1') + '/chat/completions';
    headers = {
      'Content-Type': 'application/json',
      'Authorization': `Bearer ${apiKey}`
    };
    body = {
      model: model || 'gpt-4o',
      messages: messages,
      stream: false,
      temperature: 0.7,
      max_tokens: 4096
    };
  }
  
  const response = await fetch(url, {
    method: 'POST',
    headers: headers,
    body: JSON.stringify(body)
  });
  
  if (!response.ok) {
    const error = await response.json().catch(() => ({}));
    throw new Error(error.error?.message || `HTTP ${response.status}: ${response.statusText}`);
  }
  
  const data = await response.json();
  
  if (provider === 'anthropic') {
    return data.content[0].text;
  } else {
    return data.choices[0].message.content;
  }
}
