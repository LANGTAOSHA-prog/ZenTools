async function generateCode(){const p=document.getElementById('prompt').value.trim();const lang=document.getElementById('language').value;const output=document.getElementById('output');const btn=document.getElementById('genBtn');if(!p){alert('请输入需求描述');return}const s=getSettings();if(!s.apiKey){toggleSettings();return}btn.disabled=true;output.innerHTML='<div class="typing"><span></span><span></span><span></span></div><p style="text-align:center;color:var(--muted)">正在生成代码...</p>';try{const response=await fetch(s.endpoint,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+s.apiKey},body:JSON.stringify({model:s.model,messages:[{role:'system',content:'你是一个专业的编程助手，擅长多种编程语言的代码生成。请提供清晰、完整、可运行的代码，并包含必要的注释。'},{role:'user',content:'请用 '+lang+' 编写以下代码：\n\n'+p+'\n\n请直接输出代码，不要添加额外的说明文字。'}],temperature:0.5,max_tokens:8192})});if(!response.ok){const err=await response.json().catch(()=>({}));throw new Error(err.error?.message||'请求失败')}const data=await response.json();output.innerHTML='<pre><code>'+esc(data.choices[0].message.content)+'</code></pre>'}catch(e){output.innerHTML='<p style="color:var(--error);text-align:center;padding:40px">生成失败：'+esc(e.message)+'</p>'}btn.disabled=false}
function esc(t){return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\x22/g,'&#34;')}
function clearAll(){document.getElementById('prompt').value='';document.getElementById('output').innerHTML='<p style="color:var(--muted);text-align:center;padding:40px 20px" data-i18n="placeholderCode">生成的代码将显示在这里</p>'}
function copyCode(){const t=document.getElementById('output').innerText;if(t.includes('生成的代码将显示')){alert('没有可复制的内容');return}navigator.clipboard.writeText(t).then(()=>alert('已复制')).catch(()=>alert('复制失败'))}
function downloadCode(){const t=document.getElementById('output').innerText;if(t.includes('生成的代码将显示')){alert('没有可下载的内容');return}const ext=langExt[document.getElementById('language').value]||'txt';const blob=new Blob([t],{type:'text/plain;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='code.'+ext;a.click();URL.revokeObjectURL(url)}
loadSettings();
</script>
