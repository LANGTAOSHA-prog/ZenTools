<script>
const SK='zentools_ai_settings';
let imageDataUrl='';
function toggleSettings(){const m=document.getElementById('settingsModal');m.style.display=m.style.display==='none'?'flex':'none';if(m.style.display==='flex')loadSettings()}
function loadSettings(){try{const s=localStorage.getItem(SK);if(s){const a=JSON.parse(s);document.getElementById('apiEndpoint').value=a.endpoint||'';document.getElementById('apiKey').value=a.apiKey||'';document.getElementById('modelSelect').value=a.model||'gpt-4o'}}catch(e){}}
function saveSettings(){const s={endpoint:document.getElementById('apiEndpoint').value,apiKey:document.getElementById('apiKey').value,model:document.getElementById('modelSelect').value};localStorage.setItem(SK,JSON.stringify(s));toggleSettings()}
function getSettings(){try{const s=localStorage.getItem(SK);return s?JSON.parse(s):{endpoint:'https://api.openai.com/v1/chat/completions',apiKey:'',model:'gpt-4o'}}catch(e){return{endpoint:'https://api.openai.com/v1/chat/completions',apiKey:'',model:'gpt-4o'}}}
function esc(t){return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\x22/g,'&#34;')}
function handleFileUpload(e){const f=e.target.files[0];if(!f)return;if(f.size>10*1024*1024){alert('图片不能超过10MB');return}const reader=new FileReader();reader.onload=function(ev){imageDataUrl=ev.target.result;document.getElementById('previewImg').src=imageDataUrl;document.getElementById('previewImg').style.display='block';document.getElementById('uploadArea').style.display='none';document.getElementById('imageUrl').value=''};reader.readAsDataURL(f)}
const uploadArea=document.getElementById('uploadArea');
uploadArea.addEventListener('dragover',function(e){e.preventDefault();this.classList.add('dragover')});
uploadArea.addEventListener('dragleave',function(){this.classList.remove('dragover')});
uploadArea.addEventListener('drop',function(e){e.preventDefault();this.classList.remove('dragover');const f=e.dataTransfer.files[0];if(f&&f.type.startsWith('image/')){handleFileUpload({target:{files:[f]}})}});
async function ocrImage(){const s=getSettings();if(!s.apiKey){toggleSettings();return}let src=imageDataUrl||document.getElementById('imageUrl').value.trim();if(!src){alert('请先上传图片或输入图片URL');return}const output=document.getElementById('output');const btn=document.getElementById('ocrBtn');btn.disabled=true;output.classList.add('empty');output.innerHTML='<p>正在识别文字...</p>';try{const response=await fetch(s.endpoint,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+s.apiKey},body:JSON.stringify({model:s.model,messages:[{role:'user',content:[{type:'text',text:'请识别这张图片中的所有文字内容，并原样输出。不要添加任何解释或格式。'},{type:'image_url',image_url:{url:src}}]}],max_tokens:4096})});if(!response.ok)throw new Error('API请求失败');const data=await response.json();const text=data.choices[0].message.content;output.classList.remove('empty');output.innerHTML=esc(text)}catch(e){output.classList.add('empty');output.innerHTML='<p style="color:var(--error);text-align:center;padding:40px">识别失败：'+esc(e.message)+'</p>'}btn.disabled=false}
function clearAll(){imageDataUrl='';document.getElementById('fileInput').value='';document.getElementById('previewImg').style.display='none';document.getElementById('uploadArea').style.display='block';document.getElementById('imageUrl').value='';document.getElementById('output').classList.add('empty');document.getElementById('output').innerHTML='<p data-i18n="placeholder">识别的文字将显示在这里</p>'}
function copyResult(){const t=document.getElementById('output').innerText;if(t.includes('识别的文字将显示')){alert('没有可复制的内容');return}navigator.clipboard.writeText(t).then(()=>alert('已复制')).catch(()=>alert('复制失败'))}
loadSettings();
</script>
