const languageSelect=document.getElementById("languageSelect");
let currentLang="zh";
function setLanguage(lang){
 currentLang=lang;
 const data=translations[lang]||translations.zh;
 document.documentElement.lang=lang; document.title=data.pageTitle;
 document.querySelectorAll("[data-i18n]").forEach(el=>{const k=el.getAttribute("data-i18n"); if(data[k]) el.textContent=data[k];});
 document.querySelectorAll("[data-i18n-placeholder]").forEach(el=>{const k=el.getAttribute("data-i18n-placeholder"); if(data[k]) el.placeholder=data[k];});
 localStorage.setItem("siteLanguage",lang);
}
languageSelect.addEventListener("change",e=>setLanguage(e.target.value));
const savedLang=localStorage.getItem("siteLanguage")||"zh"; languageSelect.value=savedLang; setLanguage(savedLang);
function val(id){return (document.getElementById(id)?.value || '').trim();}
function setOut(t){document.getElementById('outputText').value=t;}
function copyResult(){const el=document.getElementById('outputText');el.select();document.execCommand('copy');alert((translations[currentLang]||translations.zh).copied);}
function clearTool(){document.querySelectorAll('input,textarea').forEach(el=>{if(el.id!=='outputText')el.value='';});document.getElementById('outputText').value='';}
function sentences(text){return text.replace(/\n+/g,' ').split(/(?<=[。！？.!?])\s*/).map(s=>s.trim()).filter(Boolean);}

function runTool(){const d=translations[currentLang]||translations.zh;const name=val('name'),role=val('role'),skills=val('skills'),exp=val('exp');if(!name&&!role&&!skills){alert(d.empty);return;}setOut(`Resume\n\nName: ${name}\nTarget Role: ${role}\n\nProfile:\nA motivated candidate with practical skills and experience related to ${role}.\n\nSkills:\n${skills}\n\nExperience:\n${exp}\n\nStrengths:\n- Fast learner\n- Responsible attitude\n- Good communication\n- Practical problem-solving ability`);}
