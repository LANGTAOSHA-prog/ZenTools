<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI 翻译 - 江湖小站-ZenTools</title>
  <meta name="description" content="AI 智能翻译，支持多语言互译，准确流畅" />
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    :root { --bg: #070b18; --surface: rgba(14,22,41,0.8); --surface2: rgba(20,31,55,0.9); --border: rgba(255,255,255,0.06); --text: #f0f4ff; --muted: #8899bb; --accent: #3b82f6; --accent2: #8b5cf6; --radius: 14px; --radius-pill: 999px; --error: #ef4444; }
    [data-theme="light"] { --bg: #f2f5f9; --surface: rgba(255,255,255,0.85); --surface2: rgba(240,244,254,0.9); --border: rgba(0,0,0,0.06); --text: #0b111e; --muted: #4a5a7a; }
    body { font-family: 'Inter', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }
    
    .header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 16px 24px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
    .header .logo { font-weight: 800; font-size: 18px; display: flex; align-items: center; gap: 10px; }
    .header .logo .mark { width: 32px; height: 32px; border-radius: 8px; background: linear-gradient(135deg, var(--accent), var(--accent2)); display: flex; align-items: center; justify-content: center; font-size: 16px; }
    
    .main { flex: 1; display: flex; flex-direction: column; max-width: 1200px; width: 100%; margin: 0 auto; padding: 20px; gap: 20px; }
    
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; flex: 1; min-height: 0; }
    @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }
    
    .panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; display: flex; flex-direction: column; }
    .panel-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
    .panel-header h2 { font-size: 18px; display: flex; align-items: center; gap: 8px; }
    
    .lang-bar { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
    .lang-bar select { padding: 8px 14px; border-radius: var(--radius); border: 1px solid var(--border); background: var(--surface2); color: var(--text); font-size: 14px; min-width: 140px; }
    .lang-bar .swap { cursor: pointer; padding: 8px; border-radius: 50%; background: var(--surface2); border: 1px solid var(--border); transition: all .3s; }
    .lang-bar .swap:hover { background: var(--accent); border-color: var(--accent); color: #fff; }
    
    .form-group { flex: 1; display: flex; flex-direction: column; min-height: 0; }
    .form-group label { margin-bottom: 8px; font-size: 14px; color: var(--muted); }
    .form-group textarea { flex: 1; padding: 16px; border-radius: var(--radius); border: 1px solid var(--border); background: var(--surface2); color: var(--text); font-size: 15px; font-family: inherit; resize: none; line-height: 1.6; }
    .form-group textarea:focus { outline: none; border-color: var(--accent); }
    .form-group textarea::placeholder { color: var(--muted); }
    
    .char-count { text-align: right; font-size: 12px; color: var(--muted); margin-top: 6px; }
    
    .btn { padding: 10px 20px; border-radius: var(--radius-pill); border: none; cursor: pointer; font-weight: 600; font-size: 14px; transition: all .3s; display: inline-flex; align-items: center; gap: 6px; }
    .btn-primary { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff; }
    .btn-primary:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(59,130,246,0.4); }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-secondary { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
    .btn-icon { padding: 10px 14px; border-radius: 50%; }
    
    .output-content { flex: 1; background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; overflow-y: auto; font-size: 15px; line-height: 1.8; }
    
    .typing { display: flex; gap: 4px; padding: 20px; justify-content: center; }
    .typing span { width: 8px; height: 8px; background: var(--muted); border-radius: 50%; animation: bounce 1.4s infinite; }
    .typing span:nth-child(2) { animation-delay: 0.2s; }
    .typing span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce { 0%, 60%, 100% { transform: translateY(0); } 30% { transform: translateY(-8px); } }
    
    .bookmark-float{position:fixed;bottom:24px;right:24px;z-index:999;display:flex;align-items:center;gap:8px;background:linear-gradient(135deg,#2563eb,#7c3aed);color:#fff;border:none;padding:14px 22px;border-radius:50px;font-size:15px;font-weight:600;cursor:pointer;box-shadow:0 6px 24px rgba(37,99,235,0.35);transition:transform 0.2s,box-shadow 0.2s;text-decoration:none}.bookmark-float:hover{transform:translateY(-3px);box-shadow:0 10px 32px rgba(37,99,235,0.45)}.bookmark-float:active{transform:scale(0.96)}
    
    @media (max-width: 640px) {
      .header { padding: 12px 16px; }
      .main { padding: 12px; }
      .panel { padding: 16px; }
      .lang-bar { justify-content: center; }
    }
  </style>
</head>
<body>

<header class="header">
  <div class="logo"><span class="mark">⛵</span><span>AI 翻译</span></div>
  <div style="display: flex; gap: 8px;">
    <a href="/ai/ai-chat.html" class="btn btn-secondary" style="padding: 8px 16px;">AI 聊天</a>
    <a href="/" class="btn btn-secondary" style="padding: 8px 16px;">返回首页</a>
  </div>
</header>

<main class="main">
  <div class="grid">
    <div class="panel">
      <div class="panel-header">
        <h2>📝 原文</h2>
      </div>
      <div class="lang-bar">
        <label>源语言</label>
        <select id="sourceLang">
          <option value="auto">自动检测</option>
          <option value="zh">中文</option>
          <option value="en">英文</option>
          <option value="ja">日文</option>
          <option value="ko">韩文</option>
          <option value="fr">法文</option>
          <option value="de">德文</option>
          <option value="es">西班牙文</option>
          <option value="ru">俄文</option>
          <option value="pt">葡萄牙文</option>
          <option value="it">意大利文</option>
          <option value="vi">越南语</option>
        </select>
      </div>
      <div class="form-group">
        <textarea id="inputText" placeholder="输入需要翻译的文本..." oninput="updateCharCount()"></textarea>
        <div class="char-count"><span id="charCount">0</span> 字符</div>
      </div>
      <div style="display: flex; gap: 10px; margin-top: 12px;">
        <button class="btn btn-secondary btn-icon" onclick="clearAll()" title="清空">🗑️</button>
        <button class="btn btn-secondary btn-icon" onclick="pasteFromClipboard()" title="粘贴">📋</button>
        <button class="btn btn-secondary btn-icon" onclick="swapLang()" title="交换语言">🔄</button>
      </div>
    </div>
    
    <div class="panel">
      <div class="panel-header">
        <h2>🌐 翻译结果</h2>
        <div style="display: flex; gap: 6px;">
          <button class="btn btn-icon btn-secondary" onclick="copyResult()" title="复制">📋</button>
          <button class="btn btn-icon btn-secondary" onclick="speakResult()" title="朗读">🔊</button>
        </div>
      </div>
      <div class="lang-bar">
        <label>目标语言</label>
        <select id="targetLang">
          <option value="zh">中文</option>
          <option value="en" selected>英文</option>
          <option value="ja">日文</option>
          <option value="ko">韩文</option>
          <option value="fr">法文</option>
          <option value="de">德文</option>
          <option value="es">西班牙文</option>
          <option value="ru">俄文</option>
          <option value="pt">葡萄牙文</option>
          <option value="it">意大利文</option>
          <option value="vi">越南语</option>
        </select>
      </div>
      <div class="output-content" id="output">
        <p style="color: var(--muted); text-align: center; padding: 40px 20px;">翻译结果将显示在这里</p>
      </div>
    </div>
  </div>
</main>

<footer style="text-align: center; padding: 20px; font-size: 12px; color: var(--muted); border-top: 1px solid var(--border);">
  © 2026 <a href="/" style="color: var(--accent);">江湖小站-ZenTools</a> · 所有翻译均在本地处理
</footer>

<button class="bookmark-float" onclick="prompt('复制链接收藏本站','https://zentools.xyz')">⭐ 收藏本站</button>

<script>
let settings = { apiKey: '' };
let debounceTimer = null;

function updateCharCount() {
  const text = document.getElementById('inputText').value;
  document.getElementById('charCount').textContent = text.length;
  
  // Auto-translate with debounce
  clearTimeout(debounceTimer);
  if (text.length > 0) {
    debounceTimer = setTimeout(translate, 1000);
  }
}

async function translate() {
  const input = document.getElementById('inputText');
  const output = document.getElementById('output');
  const sourceLang = document.getElementById('sourceLang').value;
  const targetLang = document.getElementById('targetLang').value;
  const text = input.value.trim();
  
  if (!text) {
    output.innerHTML = '<p style="color:var(--muted);text-align:center;padding:40px 20px;">翻译结果将显示在这里</p>';
    return;
  }
  
  if (!settings.apiKey) {
    const key = prompt('请输入 API Key（仅保存在本地浏览器）:');
    if (!key) return;
    settings.apiKey = key;
  }
  
  output.innerHTML = '<div class="typing"><span></span><span></span><span></span></div><p style="text-align:center;color:var(--muted);">正在翻译...</p>';
  
  const langNames = {
    zh: '中文', en: '英文', ja: '日文', ko: '韩文', fr: '法文',
    de: '德文', es: '西班牙文', ru: '俄文', pt: '葡萄牙文', it: '意大利文', vi: '越南语'
  };
  
  const sourceName = sourceLang === 'auto' ? '自动检测' : langNames[sourceLang];
  const targetName = langNames[targetLang];
  
  try {
    const prompt = `请将以下文本从${sourceName}翻译成${targetName}。只输出翻译结果，不要添加任何解释或额外文字。\n\n原文：\n${text}`;
    const response = await fetchChat(prompt);
    output.innerHTML = formatText(response);
  } catch (error) {
    output.innerHTML = '<p style="color:var(--error);text-align:center;padding:40px;">翻译失败：' + error.message + '</p>';
  }
}

async function fetchChat(prompt) {
  const url = 'https://api.openai.com/v1/chat/completions';
  const response = await fetch(url, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': 'Bearer ' + settings.apiKey
    },
    body: JSON.stringify({
      model: 'gpt-4o',
      messages: [
        { role: 'system', content: '你是一个专业的翻译助手，擅长多种语言的互译。翻译要准确、流畅、自然。' },
        { role: 'user', content: prompt }
      ],
      temperature: 0.3,
      max_tokens: 8192
    })
  });
  
  if (!response.ok) {
    const err = await response.json().catch(() => ({}));
    throw new Error(err.error?.message || '请求失败');
  }
  
  const data = await response.json();
  return data.choices[0].message.content;
}

function formatText(text) {
  return text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
}

function clearAll() {
  document.getElementById('inputText').value = '';
  document.getElementById('output').innerHTML = '<p style="color:var(--muted);text-align:center;padding:40px 20px;">翻译结果将显示在这里</p>';
  document.getElementById('charCount').textContent = '0';
}

async function pasteFromClipboard() {
  try {
    const text = await navigator.clipboard.readText();
    document.getElementById('inputText').value = text;
    updateCharCount();
    translate();
  } catch (e) { alert('无法读取剪贴板，请手动粘贴'); }
}

function swapLang() {
  const source = document.getElementById('sourceLang');
  const target = document.getElementById('targetLang');
  const temp = source.value;
  source.value = target.value;
  target.value = temp;
  if (document.getElementById('inputText').value.trim()) {
    translate();
  }
}

function copyResult() {
  const text = document.getElementById('output').innerText;
  if (text.includes('翻译结果将显示') || text.includes('正在翻译')) {
    alert('没有可复制的内容');
    return;
  }
  navigator.clipboard.writeText(text).then(() => alert('已复制')).catch(() => alert('复制失败'));
}

function speakResult() {
  const text = document.getElementById('output').innerText;
  if (text.includes('翻译结果将显示') || text.includes('正在翻译')) {
    alert('没有可朗读的内容');
    return;
  }
  const lang = document.getElementById('targetLang').value;
  const voices = speechSynthesis.getVoices();
  let voice = null;
  
  const langMap = { zh: 'zh-CN', en: 'en-US', ja: 'ja-JP', ko: 'ko-KR', fr: 'fr-FR', de: 'de-DE', es: 'es-ES', ru: 'ru-RU', pt: 'pt-BR', it: 'it-IT', vi: 'vi-VN' };
  const target = langMap[lang] || lang;
  
  voice = voices.find(v => v.lang.startsWith(target)) || voices.find(v => v.lang.startsWith(lang.substring(0,2)));
  
  const utterance = new SpeechSynthesisUtterance(text);
  if (voice) utterance.voice = voice;
  utterance.lang = target;
  speechSynthesis.speak(utterance);
}

// Load voices
if ('speechSynthesis' in window) {
  speechSynthesis.onvoiceschanged = () => {
    window.speechVoices = speechSynthesis.getVoices();
  };
}
</script>

</body>
</html>
