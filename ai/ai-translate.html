<script>
const SK='zentools_ai_settings';
function swapLangs(){const a=document.getElementById('srcLang'),b=document.getElementById('tgtLang');const t=a.value;a.value=b.value;b.value=t}
function toggleSettings(){const m=document.getElementById('settingsModal');m.style.display=m.style.display==='none'?'flex':'none';if(m.style.display==='flex')loadSettings()}
function loadSettings(){try{const s=localStorage.getItem(SK);if(s){const a=JSON.parse(s);document.getElementById('apiEndpoint').value=a.endpoint||'';document.getElementById('apiKey').value=a.apiKey||'';document.getElementById('modelSelect').value=a.model||'gpt-4o'}}catch(e){}}
function saveSettings(){const s={endpoint:document.getElementById('apiEndpoint').value,apiKey:document.getElementById('apiKey').value,model:document.getElementById('modelSelect').value};localStorage.setItem(SK,JSON.stringify(s));toggleSettings()}
function getSettings(){try{const s=localStorage.getItem(SK);return s?JSON.parse(s):{endpoint:'https://api.openai.com/v1/chat/completions',apiKey:'',model:'gpt-4o'}}catch(e){return{endpoint:'https://api.openai.com/v1/chat/completions',apiKey:'',model:'gpt-4o'}}}
function esc(t){return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\x22/g,'&#34;')}
const langNames={zh:'中文',en:'English',ja:'日本語',ko:'한국어',fr:'Français',de:'Deutsch',es:'Español',ru:'Русский',ar:'العربية',vi:'Tiếng Việt'};
async function translate(){const text=document.getElementById('text').value.trim();const src=document.getElementById('srcLang').value;const tgt=document.getElementById('tgtLang').value;const output=document.getElementById('output');const btn=document.getElementById('transBtn');if(!text){alert('请输入要翻译的文本');return}if(src===tgt){alert('源语言和目标语言不能相同');return}const s=getSettings();if(!s.apiKey){toggleSettings();return}btn.disabled=true;output.classList.add('empty');output.innerHTML='<p>正在翻译...</p>';try{const response=await fetch(s.endpoint,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+s.apiKey},body:JSON.stringify({model:s.model,messages:[{role:'system',content:'You are a professional translator. Translate from '+langNames[src]+' to '+langNames[tgt]+'. Preserve the original meaning, style and formatting. Output only the translated text, no explanations.'},{role:'user',content:text}],temperature:0.3,max_tokens:2048})});if(!response.ok)throw new Error('API请求失败');const data=await response.json();const result=data.choices[0].message.content;output.classList.remove('empty');output.innerHTML=esc(result)}catch(e){output.classList.add('empty');output.innerHTML='<p style="color:var(--error);text-align:center;padding:40px">翻译失败：'+esc(e.message)+'</p>'}btn.disabled=false}
function clearAll(){document.getElementById('text').value='';document.getElementById('output').classList.add('empty');document.getElementById('output').innerHTML='<p data-i18n="emptyResult">翻译结果将显示在这里</p>'}
function copyResult(){const t=document.getElementById('output').innerText;if(t.includes('翻译结果将显示')){alert('没有可复制的内容');return}navigator.clipboard.writeText(t).then(()=>alert('已复制')).catch(()=>alert('复制失败'))}
loadSettings();
</script>
