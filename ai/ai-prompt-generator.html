<link rel="stylesheet" href="../assets/css/tool-ui.css">
<style>
.tool-box { padding:24px; background:var(--surface); border-radius:var(--r); border:1px solid var(--border); }
label { display:block; margin:12px 0 4px; font-size:13px; font-weight:600; color:var(--muted); }
textarea, input { width:100%; padding:10px 12px; border-radius:8px; border:1px solid var(--border); background:var(--bg); color:var(--text); font-size:14px; font-family:inherit; }
textarea:focus, input:focus { outline:none; border-color:var(--cyan); }
.btn { padding:10px 24px; border-radius:8px; border:none; background:linear-gradient(135deg,var(--cyan),var(--purple)); color:#fff; font-size:14px; font-weight:600; cursor:pointer; }
.btn:hover { opacity:.85; }
.btn2 { background:var(--glass-b); color:var(--text); }
.result { margin-top:16px; padding:16px; border-radius:8px; background:var(--glass); border:1px solid var(--border); white-space:pre-wrap; font-size:13px; line-height:1.7; }
.row { display:flex; gap:12px; flex-wrap:wrap; }
.row > * { flex:1; min-width:140px; }
.hint { font-size:12px; color:var(--muted); margin-top:4px; }
</style>
</head>
<body>
<div class="container">
  <nav class="nav-bar">
    <div class="logo"><span class="mark">⛵</span>江湖小站-ZenTools</div>
    <div class="links"><a href="/">首页</a><a href="#" class="active">AI工具</a><a href="/plugins-preview.html">全部工具</a></div>
  </nav>
  <a href="/" class="back-home">← 返回首页</a>
  <div class="page-header">
    <h1><span class="hl">AI 提示词生成</span></h1>
    <p>生成高质量 AI 提示词（Prompt），提升与 ChatGPT 等 AI 的对话效果。</p>
  </div>
  <div class="tool-box">
    <label>任务描述</label>
<textarea id="pgTask" rows="3" placeholder="例如：写一篇关于环保的博客文章"></textarea>
<label>风格/语气</label>
<select id="pgStyle" style="padding:10px;border-radius:8px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:14px;">
  <option value="专业">专业</option>
  <option value="友好">友好</option>
  <option value="简洁">简洁</option>
  <option value="详细">详细</option>
  <option value="幽默">幽默</option>
</select>
<label>输出语言</label>
<select id="pgLang" style="padding:10px;border-radius:8px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:14px;">
  <option value="中文">中文</option>
  <option value="English">English</option>
  <option value="日本語">日本語</option>
</select>
<label>额外要求（可选）</label>
<textarea id="pgExtra" rows="2" placeholder="例如：列出要点、给出例子"></textarea>
<div style="display:flex;gap:10px;margin-top:16px;">
  <button class="btn" onclick="genPrompt()">生成提示词</button>
  <button class="btn btn2" onclick="copyPrompt()">复制</button>
</div>
<div class="result" id="pgResult" style="display:none;"></div>
<div class="hint">▶ 将生成的提示词复制到 ChatGPT、Claude 等 AI 工具中使用</div>
  </div>
</div>
<script src="../assets/js/tool-ui.js"></script>
<script>
function genPrompt(){
  var task=document.getElementById('pgTask').value.trim(),style=document.getElementById('pgStyle').value,lang=document.getElementById('pgLang').value,extra=document.getElementById('pgExtra').value.trim();
  if(!task){alert('请输入任务描述');return;}
  var p='请以'+(lang==='English'?'English':lang)+'回答。\n\n'+'任务：'+task+'\n风格：'+style;
  if(extra)p+='\n额外要求：'+extra;
  p+='\n\n请确保回答质量高、有结构、直接有用。';
  var el=document.getElementById('pgResult');el.style.display='block';el.textContent=p;
}
function copyPrompt(){navigator.clipboard.writeText(document.getElementById('pgResult').textContent);}
</script>
<button class="bookmark-float" onclick="prompt('复制链接收藏本站','https://zentools.xyz')">⭐ 收藏本站</button>
</body>
</html>
