    <p>生成高质量 AI 提示词（Prompt），提升与 ChatGPT 等 AI 的对话效果。</p>
  </div>
  <div class="tool-box">
    <label data-i18n="label_任务描述">任务描述</label>
<textarea id="pgTask" rows="3" placeholder="例如：写一篇关于环保的博客文章" data-i18n-placeholder="ph_例如_写一篇关于"></textarea>
<label data-i18n="label_风格_语气">风格/语气</label>
<select id="pgStyle" style="padding:10px;border-radius:8px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:14px;">
  <option value="专业">专业</option>
  <option value="友好">友好</option>
  <option value="简洁">简洁</option>
  <option value="详细">详细</option>
  <option value="幽默">幽默</option>
</select>
<label data-i18n="label_输出语言">输出语言</label>
<select id="pgLang" style="padding:10px;border-radius:8px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:14px;">
  <option value="中文">中文</option>
  <option value="English">English</option>
  <option value="日本語">日本語</option>
</select>
<label data-i18n="label_额外要求_可选">额外要求（可选）</label>
<textarea id="pgExtra" rows="2" placeholder="例如：列出要点、给出例子" data-i18n-placeholder="ph_例如_列出要点"></textarea>
<div style="display:flex;gap:10px;margin-top:16px;">
  <button class="btn" onclick="genPrompt()" data-i18n="生成提示词">生成提示词</button>
  <button class="btn btn2" onclick="copyPrompt()" data-i18n="复制">复制</button>
</div>
<div class="result" id="pgResult" style="display:none;"></div>
<div class="hint">▶ 将生成的提示词复制到 ChatGPT、Claude 等 AI 工具中使用</div>
  </div>
</div>
<script src="../assets/js/tool-ui.min.js"></script>
<script>
function genPrompt(){
  var task=document.getElementById('pgTask').value.trim(),style=document.getElementById('pgStyle').value,lang=document.getElementById('pgLang').value,extra=document.getElementById('pgExtra').value.trim();
  if(!task){alert('请输入任务描述');return;}
  var p='请以'+(lang==='English'?'English':lang)+'回答。\n\n'+'任务：'+task+'\n风格：'+style;
  if(extra)p+='\n额外要求：'+extra;
  p+='\n\n请确保回答质量高、有结构、直接有用。';
  var el=document.getElementById('pgResult');el.style.display='block';el.textContent=p;
}
function copyPrompt(){navigator.clipboard.writeText(document.getElementById('pgResult').textContent);}
</script>
