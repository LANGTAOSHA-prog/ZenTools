<script>
function genST(){
  var th=document.getElementById('stTheme').value.trim(),ch=document.getElementById('stChar').value.trim(),se=document.getElementById('stSetting').value.trim(),le=document.getElementById('stLength').value;
  if(!th){alert('请输入主题');return;}
  var prompt='请创作一篇'+le+'故事。\n主题：'+th;
  if(ch)prompt+='\n主角：'+ch;
  if(se)prompt+='\n场景：'+se;
  prompt+='\n\n要求：故事完整、有起承转合、语言生动、用中文写作。';
  document.getElementById('stResult').style.display='block';document.getElementById('stResult').textContent=prompt;
}
