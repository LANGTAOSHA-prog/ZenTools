<script>
const SK='zentools_ai_settings';
function toggleSettings(){const m=document.getElementById('settingsModal');m.style.display=m.style.display==='none'?'flex':'none';if(m.style.display==='flex')loadSettings()}
function loadSettings(){try{const s=localStorage.getItem(SK);if(s){const a=JSON.parse(s);document.getElementById('apiEndpoint').value=a.endpoint||'';document.getElementById('apiKey').value=a.apiKey||'';document.getElementById('modelSelect').value=a.model||'gpt-4o'}}catch(e){}}
function saveSettings(){const s={endpoint:document.getElementById('apiEndpoint').value,apiKey:document.getElementById('apiKey').value,model:document.getElementById('modelSelect').value};localStorage.setItem(SK,JSON.stringify(s));toggleSettings()}
function getSettings(){try{const s=localStorage.getItem(SK);return s?JSON.parse(s):{endpoint:'https://api.openai.com/v1/chat/completions',apiKey:'',model:'gpt-4o'}}catch(e){return{endpoint:'https://api.openai.com/v1/chat/completions',apiKey:'',model:'gpt-4o'}}}
function esc(t){return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\x22/g,'&#34;')}
async function generate(){const input=document.getElementById('input').value.trim();const type=document.getElementById('copyType').value;const style=document.getElementById('style').value;const output=document.getElementById('output');const btn=document.getElementById('genBtn');if(!input){alert('请输入你的产品、服务或主题描述');return}const s=getSettings();if(!s.apiKey){toggleSettings();return}btn.disabled=true;output.classList.add('empty');output.innerHTML='<div class="typing"><span></span><span></span><span></span></div><p style="text-align:center;color:var(--muted)">正在生成文案...</p>';try{const response=await fetch(s.endpoint,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+s.apiKey},body:JSON.stringify({model:s.model,messages:[{role:'system',content:'你是一个专业的文案创作专家，擅长各种类型的文案写作。'},{role:'user',content:'请为以下主题创作 '+type+'，要求风格：'+style+'。\n\n主题描述：\n'+input+'\n\n请输出高质量的文案，确保语言生动、有感染力。'}],temperature:0.8,max_tokens:2048})});if(!response.ok)throw new Error('API请求失败');const data=await response.json();const text=data.choices[0].message.content;output.classList.remove('empty');output.innerHTML='<div class="result-title"><h3>📌 '+type+' · '+style+'</h3></div><div style="white-space:pre-wrap">'+esc(text)+'</div>'}catch(e){output.classList.add('empty');output.innerHTML='<p style="color:var(--error);text-align:center;padding:40px">生成失败：'+esc(e.message)+'</p>'}btn.disabled=false}
function clearAll(){document.getElementById('input').value='';document.getElementById('output').classList.add('empty');document.getElementById('output').innerHTML='<p data-i18n="placeholder">生成的文案将显示在这里</p>'}
function copyResult(){const t=document.getElementById('output').innerText;if(t.includes('生成的文案将显示')){alert('没有可复制的内容');return}navigator.clipboard.writeText(t).then(()=>alert('已复制')).catch(()=>alert('复制失败'))}
loadSettings();
</script>
