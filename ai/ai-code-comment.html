<script>
function genCC(){
  var lang=document.getElementById('ccLang').value,code=document.getElementById('ccCode').value.trim(),style=document.getElementById('ccStyle').value;
  if(!code){alert('请粘贴代码');return;}
  var prompt='请为以下 '+lang+' 代码添加'+style+'注释：\n\n```'+lang+'\n'+code+'\n```\n\n要求：用中文注释，解释代码逻辑和函数用途。';
  document.getElementById('ccResult').style.display='block';document.getElementById('ccResult').textContent=prompt;}
</script>
