<style>.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.7);display:flex;align-items:center;justify-content:center;z-index:1000;backdrop-filter:blur(5px)}.modal{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:28px;max-width:440px;width:90%}.modal h3{font-size:18px;margin-bottom:8px}</style>
<script>const SK='zentools_ai_settings';
function ls(){try{const s=localStorage.getItem(SK);if(s){const a=JSON.parse(s);document.getElementById('apiEndpoint').value=a.endpoint||'https://api.openai.com/v1/chat/completions';document.getElementById('apiKey').value=a.apiKey||'';document.getElementById('modelSelect').value=a.model||'gpt-3.5-turbo'}catch(e){}
function ss(){localStorage.setItem(SK,JSON.stringify({endpoint:document.getElementById('apiEndpoint').value,apiKey:document.getElementById('apiKey').value,model:document.getElementById('modelSelect').value}));ts()}
function ts(){const m=document.getElementById('settingsModal');m.style.display=m.style.display==='none'?'flex':'none';if(m.style.display==='flex')ls()}
function gs(){try{const s=localStorage.getItem(SK);return s?JSON.parse(s):{endpoint:'https://api.openai.com/v1/chat/completions',apiKey:'',model:'gpt-3.5-turbo'}catch(e){return{endpoint:'https://api.openai.com/v1/chat/completions',apiKey:'',model:'gpt-3.5-turbo'}}
let lastResult='';
function generateScript(){const t=document.getElementById('scriptTopic').value.trim();if(!t){alert('请输入脚本主题');return}const s=gs();if(!s.apiKey){ts();return}
const st=document.getElementById('scriptType');const sd=document.getElementById('scriptDuration');const sto=document.getElementById('scriptTone');
const typeLabels={video:'视频脚本',speech:'演讲稿',live:'直播脚本',podcast:'播客脚本',tutorial:'教程脚本',commercial:'广告脚本'};
const durLabels={1min:'1分钟',3min:'3分钟',5min:'5分钟',10min:'10分钟'};const toneLabels={formal:'正式专业',casual:'轻松自然',passionate:'激情澎湃',humorous:'幽默风趣'};
const extra=document.getElementById('scriptInput').value.trim();const btn=event.target;const l=document.getElementById('loading');const r=document.getElementById('resultBox');btn.disabled=true;l.classList.add('show');r.classList.remove('show')
const p='你是一个专业脚本创作专家。请生成一个'+typeLabels[st.value]+'。\n\n主题：'+t+'\n时长：'+durLabels[sd.value]+'\n风格：'+toneLabels[sto.value]+(extra?'\n补充要求：'+extra:'')+'\n\n请输出完整脚本，包含场景说明、台词、时间标注等。'
fetch(s.endpoint,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+s.apiKey},body:JSON.stringify({model:s.model,messages:[{role:'user',content:p}],max_tokens:2048})})
.then(r=>r.ok?r.json():Promise.reject('HTTP '+r.status)).then(d=>{lastResult=d.choices[0].message.content;document.getElementById('scriptResult').textContent=lastResult;r.classList.add('show')})
.catch(e=>{document.getElementById('scriptResult').textContent='请求失败：'+e;r.classList.add('show')}).finally(()=>{btn.disabled=false;l.classList.remove('show')})}
function copyScript(){if(lastResult)navigator.clipboard.writeText(lastResult).then(()=>alert('已复制'))}
ls();</script>
<script>(function(){var t=window.pageTranslations||{};function a(l){var d=t[l]||t.zh||{};document.documentElement.lang=l;var ti=document.querySelector('title[data-i18n]');if(ti){var pk=ti.getAttribute('data-i18n');if(d[pk])document.title=d[pk];}document.querySelectorAll('[data-i18n]').forEach(function(e){var k=e.getAttribute('data-i18n');if(d[k]&&k!=='pageTitle')e.textContent=d[k];});document.querySelectorAll('[data-i18n-placeholder]').forEach(function(e){var k=e.getAttribute('data-i18n-placeholder');if(d[k])e.placeholder=d[k];});var mc=document.querySelector('meta[name="description"]');if(mc&&d.metaDesc)mc.content=d.metaDesc;}var s=document.getElementById('langSelect');if(s){s.addEventListener('change',function(){a(this.value);localStorage.setItem('zentools_lang',this.value);});var sv=localStorage.getItem('zentools_lang')||'zh';s.value=sv;a(sv);})();</script>
