<style>
/* Tab 导航 */
.my-tabs { display:flex; gap:4px; max-width:1200px; margin:0 auto 24px; padding:0 20px; border-bottom:1px solid var(--border); flex-wrap:wrap; }
.my-tab { padding:12px 20px; border:none; background:none; color:var(--muted); font-size:15px; font-weight:600; cursor:pointer; border-bottom:2px solid transparent; transition:color 0.2s,border-color 0.2s; }
.my-tab.active { color:var(--cyan); border-bottom-color:var(--cyan); }
.my-tab:hover:not(.active) { color:var(--text); }

.my-content { max-width:1200px; margin:0 auto; padding:0 20px 60px; }
.my-panel { display:none; }
.my-panel.active { display:block; animation:fadeIn 0.3s ease; }
@keyframes fadeIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }

/* 分组按钮 */
.my-group-bar { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px; }
.my-group-btn { padding:6px 16px; border-radius:20px; border:1px solid var(--border); background:var(--glass); color:var(--muted); font-size:13px; cursor:pointer; transition:all 0.2s; }
.my-group-btn.active { background:rgba(0,229,255,0.1); border-color:var(--cyan); color:var(--cyan); }

/* 操作栏 */
.my-actions { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:20px; }
.my-action-btn { padding:8px 16px; border-radius:8px; border:1px solid var(--border); background:var(--glass); color:var(--text); font-size:13px; cursor:pointer; transition:background 0.2s; }
.my-action-btn.danger { border-color:rgba(244,63,94,0.3); color:var(--pink); }
.my-action-btn:hover { background:rgba(255,255,255,0.06); }

/* 列表项 */
.my-list { display:flex; flex-direction:column; gap:8px; }
.my-item { display:flex; align-items:center; gap:14px; padding:14px 18px; border-radius:12px; background:var(--glass); border:1px solid var(--border); transition:transform 0.15s,border-color 0.15s; text-decoration:none; color:var(--text); }
.my-item:hover { transform:translateY(-2px); border-color:var(--cyan); }
.my-item .mi-icon { font-size:24px; flex-shrink:0; }
.my-item .mi-info { flex:1; min-width:0; }
.my-item .mi-name { font-size:14px; font-weight:600; color:var(--text); }
.my-item .mi-meta { font-size:12px; color:var(--muted); margin-top:2px; }
.my-item .mi-group-tag { font-size:11px; padding:2px 10px; border-radius:12px; background:rgba(168,85,247,0.1); color:var(--purple); white-space:nowrap; }
.my-item .mi-actions { display:flex; gap:6px; flex-shrink:0; }
.my-item .mi-btn { width:30px; height:30px; border-radius:8px; border:1px solid var(--border); background:var(--glass); color:var(--muted); font-size:13px; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:color 0.15s,border-color 0.15s; }
.my-item .mi-btn:hover { color:var(--pink); border-color:var(--pink); }

.my-empty { text-align:center; padding:50px 24px; color:var(--muted); font-size:15px; display:none; }

/* 历史日期分组 */
.my-date-group { margin-bottom:24px; }
.my-date-label { font-size:12px; font-weight:700; color:var(--muted); letter-spacing:0.05em; padding-bottom:8px; border-bottom:1px solid var(--border); margin-bottom:12px; }

/* 订阅分类卡片 */
.my-subs-info { color:var(--muted); font-size:14px; line-height:1.7; margin-bottom:20px; padding:16px 20px; background:var(--glass); border-radius:12px; border:1px solid var(--border); }
.my-subs-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:12px; margin-bottom:30px; }
.my-subs-card { position:relative; padding:20px; border-radius:14px; background:var(--glass); border:1px solid var(--border); text-align:center; cursor:pointer; transition:border-color 0.2s,background 0.2s; }
.my-subs-card:hover { border-color:var(--cyan); }
.my-subs-card.subscribed { border-color:var(--cyan); background:rgba(0,229,255,0.06); }
.my-subs-card .msc-icon { font-size:28px; margin-bottom:8px; }
.my-subs-card .msc-name { font-size:14px; font-weight:600; color:var(--text); }
.my-subs-card .msc-count { font-size:12px; color:var(--muted); margin-top:4px; }
.my-subs-card .msc-check { position:absolute; top:8px; right:10px; font-size:16px; color:var(--cyan); font-weight:700; }

.my-new-badge { display:inline-flex; padding:1px 8px; border-radius:10px; background:rgba(0,229,255,0.12); color:var(--cyan); font-size:10px; font-weight:700; margin-left:6px; }

/* 热门排行 */
.my-hot-tabs { display:flex; gap:8px; margin-bottom:20px; }
.my-hot-tab { padding:8px 20px; border-radius:20px; border:1px solid var(--border); background:none; color:var(--muted); font-size:13px; cursor:pointer; transition:all 0.2s; }
.my-hot-tab.active { background:var(--cyan); color:var(--bg); border-color:var(--cyan); font-weight:600; }
.hot-rank { font-size:20px; font-weight:800; min-width:28px; text-align:center; flex-shrink:0; }
.hot-rank.r1,.hot-rank.r2,.hot-rank.r3 { background:linear-gradient(135deg,#f59e0b,#fbbf24); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
.hot-rank.r4to10 { color:var(--muted); }

/* 弹窗 */
.my-modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.6); display:flex; align-items:center; justify-content:center; z-index:9999; }
.my-modal { background:var(--glass); backdrop-filter:blur(20px); border:1px solid var(--border); border-radius:16px; padding:28px; max-width:400px; width:90%; }
.my-modal h3 { margin:0 0 16px; color:var(--text); font-size:18px; }
.my-modal-list { display:flex; flex-direction:column; gap:8px; margin-bottom:16px; }
.my-modal-item { padding:10px 16px; border-radius:8px; border:1px solid var(--border); background:var(--glass); color:var(--text); font-size:14px; cursor:pointer; text-align:left; }
.my-modal-item:hover { border-color:var(--cyan); color:var(--cyan); }
.my-modal-add { display:flex; gap:8px; margin-bottom:12px; }
.my-modal-add input { flex:1; padding:8px 12px; border-radius:8px; border:1px solid var(--border); background:var(--glass); color:var(--text); font-size:14px; }
.my-modal-add button { padding:8px 16px; border-radius:8px; border:none; background:var(--cyan); color:var(--bg); font-size:13px; font-weight:600; cursor:pointer; }
.my-modal-close { width:100%; padding:10px; border-radius:8px; border:1px solid var(--border); background:none; color:var(--muted); font-size:14px; cursor:pointer; }

@media(max-width:768px) {
  .my-tabs { gap:4px; }
  .my-tab { padding:10px 14px; font-size:13px; }
  .my-subs-grid { grid-template-columns:repeat(3,1fr); }
  .my-item .mi-group-tag { display:none; }
}
@media(max-width:480px) {
  .my-subs-grid { grid-template-columns:repeat(2,1fr); }
}
