      .then(function(res) { return res.json(); })
      .then(function(data) {
        allTools = data.tools || [];
        callback(allTools);
      })
      .catch(function() {
        // 降级：尝试从 tools-data.js 加载
        if (typeof toolsData !== 'undefined') {
          allTools = toolsData;
          callback(allTools);
        }
      });
  }

  // 获取职业组的工具列表
  function getToolsForGroup(groupTags) {
    return allTools.filter(function(t) {
      if (!t.ai || !t.ai.audience) return false;
      var tags = t.ai.audience.split('、');
      return tags.some(function(tag) {
        return groupTags.indexOf(tag.trim()) !== -1;
      });
    });
  }

  // 获取工具名称（按语言）
  function getToolName(t, lang) {
    if (lang === 'en') return t.name__en || t.name;
    if (lang === 'ja') return t.name__ja || t.name;
    if (lang === 'vi') return t.name__vi || t.name;
    return t.name;
  }

  // 获取职业组名称
  function getGroupName(g, lang) {
    var d = g[lang] || g.zh;
    return d.name;
  }

  // 获取职业组描述
  function getGroupDesc(g, lang) {
    var d = g[lang] || g.zh;
    return d.desc;
  }

  // 获取分类标签翻译
  function getCategoryLabel(cat, lang) {
    var map = {
      'PDF工具': { en: 'PDF', ja: 'PDF', vi: 'PDF' },
      '图片工具': { en: 'Image', ja: '画像', vi: 'Ảnh' },
      'AI工具': { en: 'AI', ja: 'AI', vi: 'AI' },
      '视频工具': { en: 'Video', ja: '動画', vi: 'Video' },
      '音频工具': { en: 'Audio', ja: '音声', vi: 'Âm thanh' },
      '文本工具': { en: 'Text', ja: 'テキスト', vi: 'Văn bản' },
      '开发工具': { en: 'Dev', ja: '開発', vi: 'Dev' },
      '生活工具': { en: 'Life', ja: '生活', vi: 'Đời sống' },
      '金融工具': { en: 'Finance', ja: '金融', vi: 'Tài chính' },
      'SEO工具': { en: 'SEO', ja: 'SEO', vi: 'SEO' },
      '设计工具': { en: 'Design', ja: 'デザイン', vi: 'Thiết kế' },
      '办公工具': { en: 'Office', ja: 'オフィス', vi: 'Văn phòng' },
      '教育工具': { en: 'Edu', ja: '教育', vi: 'Giáo dục' }
    };
    if (lang === 'zh') return cat;
    return (map[cat] && map[cat][lang]) || cat;
  }

  // 渲染职业卡片网格
  function renderProfGrid(lang) {
    var grid = document.getElementById('profGrid');
    if (!grid) return;
    var html = '';
    profGroups.forEach(function(g) {
      var toolCount = getToolsForGroup(g.tags).length;
      var name = getGroupName(g, lang);
      var desc = getGroupDesc(g, lang);
      var countLabel = (window.ZT_PAGE[lang] || window.ZT_PAGE.zh).toolCountLabel || '个工具';
      html += '<a href="#toolsSection" class="prof-card" data-group="' + g.id + '">';
      html += '<span class="pc-icon">' + g.icon + '</span>';
      html += '<span class="pc-title">' + name + '</span>';
      html += '<span class="pc-count">' + toolCount + ' ' + countLabel + '</span>';
      html += '<span class="pc-desc">' + desc + '</span>';
      html += '<span class="pc-cta">' + (lang === 'zh' ? '查看工具 →' : lang === 'en' ? 'View Tools →' : lang === 'ja' ? 'ツールを見る →' : 'Xem công cụ →') + '</span>';
      html += '</a>';
    });
    grid.innerHTML = html;

    // 绑定点击事件
    var cards = grid.querySelectorAll('.prof-card');
    cards.forEach(function(card) {
      card.addEventListener('click', function(e) {
        e.preventDefault();
        var groupId = this.getAttribute('data-group');
        showToolsForGroup(groupId, lang);
        // 滚动到工具区域
        var toolsSection = document.getElementById('toolsSection');
        if (toolsSection) {
          toolsSection.style.display = 'block';
          toolsSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
        // 高亮当前卡片
        cards.forEach(function(c) { c.classList.remove('active'); });
        this.classList.add('active');
      });
    });
  }

  // 渲染工具列表
  function showToolsForGroup(groupId, lang) {
    currentGroupId = groupId;
    var group = profGroups.find(function(g) { return g.id === groupId; });
    if (!group) return;

    var tools = getToolsForGroup(group.tags);
    var name = getGroupName(group, lang);
    var desc = getGroupDesc(group, lang);
    var countLabel = (window.ZT_PAGE[lang] || window.ZT_PAGE.zh).toolCountLabel || '个工具';

    document.getElementById('toolsEyebrow').textContent = group.icon + ' ' + name;
    document.getElementById('toolsTitle').textContent = name + '（' + tools.length + ' ' + countLabel + '）';
    document.getElementById('toolsDesc').textContent = desc;

    var grid = document.getElementById('toolsGrid');
    var html = '';
    tools.forEach(function(t) {
      var tName = getToolName(t, lang);
      var tCat = getCategoryLabel(t.category || '', lang);
      var tUrl = t.url || ('/' + (t.slug || '') + '.html');
      var tIcon = t.icon || '🔧';
      html += '<a href="' + tUrl + '" class="tool-link">';
      html += '<span class="tl-icon">' + tIcon + '</span>';
      html += '<span class="tl-name">' + tName + '</span>';
      html += '<span class="tl-cat">' + tCat + '</span>';
      html += '</a>';
    });
    grid.innerHTML = html;
  }

  // 初始化
  loadTools(function() {
    renderProfGrid(currentLang);
  });

  // 语言切换
  window.addEventListener('zt-langchange', function(e) {
    currentLang = e.detail.lang;
    renderProfGrid(currentLang);
    if (currentGroupId) {
      showToolsForGroup(currentGroupId, currentLang);
    }
  });
})();
</script>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function() {
    navigator.serviceWorker.register('/sw.js').catch(function() {});
  });
}
</script>
