        var cls = "card" + (opts.featured ? " featured" : "") + (opts.hub ? " hub-card" : "");
        var html = '<article class="' + cls + '"><a class="card-main" href="' + item.url + '" target="_blank" rel="noopener">';
        if (item.tag) html += '<span class="tag">' + item.tag + "</span>";
        html += '<p class="jp">' + item.jp + '</p><p class="cn">' + item.cn + "</p>";
        if (typeof item.n === "number") {
          html += '<div class="num-row"><span class="num">' + fmt(item.n) + '</span><span class="num-unit">' + (item.unit || "问") + "</span></div>";
          if (item.numNote) html += '<p class="num-note">' + item.numNote + "</p>";
        }
        if (item.note) html += '<p class="num-note">' + item.note + "</p>";
        if (item.desc) html += '<p class="desc">' + item.desc + "</p>";
        html += '<div class="foot"><span class="go">进入站点 <span class="arrow">→</span></span></div></a>';
        if (item.alt) html += '<div class="alt-links">国内直连：<a href="' + item.alt.url + '" target="_blank" rel="noopener">' + item.alt.label + "</a></div>";
        html += "</article>";
        return html;
      }

      function matches(item, extra) {
        if (state.cat !== "all" && item.cat !== state.cat && extra !== state.cat) return false;
        if (!state.q) return true;
        var hay = (item.jp + " " + item.cn + " " + (item.slug || "") + " " + (item.kw || "") + " " + (item.note || "")).toLowerCase();
        return hay.indexOf(state.q) !== -1;
      }

      function render() {
        var total = 0;
        var html = "";

        // 总站与枢纽（归入“全部分野”与搜索；分类筛选时仅在 all 显示，或按关键词）
        var hubItems = HUBS.filter(function (h) { return matches(h, state.cat === "all" ? "all" : "__none__") || (state.cat === "all" && matches(h, "all")); });
        if (state.cat === "all") {
          hubItems = HUBS.filter(function (h) { return matches(h, "all"); });
          if (hubItems.length) {
            total += hubItems.length;
            html += '<section class="block"><div class="block-head"><h2>总站与枢纽</h2><span class="jp-sub">ポータル</span></div>' +
              '<div class="grid">' + hubItems.map(function (h) { return cardHTML(h, { hub: true }); }).join("") + "</div></section>";
          }
        }

        // 分野拆分站
        var splits = SPLITS.filter(function (s) {
          return matches({ jp: s.jp, cn: s.cn, slug: s.slug, note: s.note, kw: s.slug, cat: s.cat });
        });
        if (splits.length) {
          total += splits.length;
          html += '<section class="block"><div class="block-head"><h2>分野拆分站</h2><span class="jp-sub">分野別サイト</span></div>' +
            '<p class="block-note">16 站统一规则：邮箱注册 / 登录、进度云同步、每库免费 5 题 + VIP 码解锁全库；模考随机抽题默认 30 问 / 45 分钟 / 75% 合格（物流倉庫为 40 分钟 / 60%）。各站账号独立。</p>' +
            '<div class="grid">' + splits.map(function (s) {
              return cardHTML({ jp: s.jp, cn: s.cn, n: s.n, note: s.note, url: SPLIT_BASE + s.slug + SPLIT_TAIL });
            }).join("") + "</div></section>";
        }

        // 建设专区
        var builds = BUILD.filter(function (b) { return matches(b, "build"); });
        if (builds.length) {
          total += builds.length;
          html += '<section class="block"><div class="block-head"><h2>建设专区</h2><span class="jp-sub">建設分野</span></div>' +
            '<p class="block-note">建设2号主站、三个1号分野分站与 GINO 建设1号题库；分站首次使用须先在主站门户选定分野（每账号仅可调整一次）。</p>' +
            '<div class="grid">' + builds.map(function (b) { return cardHTML(b, { featured: b.featured }); }).join("") + "</div></section>";
        }

        main.innerHTML = html;
        emptyState.style.display = total ? "none" : "block";
        countLabel.textContent = total ? ("显示 " + total + " 个站点") : "";
      }

      // 分类 chips
      var chipsBox = document.getElementById("chips");
      CATS.forEach(function (c) {
        var b = document.createElement("button");
        b.type = "button";
        b.className = "chip";
        b.textContent = c.label;
        b.setAttribute("aria-pressed", c.id === "all" ? "true" : "false");
        b.addEventListener("click", function () {
          state.cat = c.id;
          var all = chipsBox.querySelectorAll(".chip");
          for (var i = 0; i < all.length; i++) all[i].setAttribute("aria-pressed", "false");
          b.setAttribute("aria-pressed", "true");
          render();
        });
        chipsBox.appendChild(b);
      });

      // 搜索
      var searchInput = document.getElementById("search");
      var clearBtn = document.getElementById("clearSearch");
      searchInput.addEventListener("input", function () {
        state.q = searchInput.value.trim().toLowerCase();
        clearBtn.style.display = state.q ? "flex" : "none";
        render();
      });
      clearBtn.addEventListener("click", function () {
        searchInput.value = "";
        state.q = "";
        clearBtn.style.display = "none";
        render();
        searchInput.focus();
      });

      // 复制微信号
      var copyBtn = document.getElementById("copyWx");
      copyBtn.addEventListener("click", function () {
        var done = function () {
          copyBtn.textContent = "已复制 ✓";
          setTimeout(function () { copyBtn.textContent = "复制微信号"; }, 1800);
        };
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText("171472961").then(done, function () { fallback(); });
        } else { fallback(); }
        function fallback() {
          var ta = document.createElement("textarea");
          ta.value = "171472961";
          ta.style.position = "fixed"; ta.style.opacity = "0";
          document.body.appendChild(ta);
          ta.select();
          try { document.execCommand("copy"); done(); } catch (e) { copyBtn.textContent = "171472961"; }
          document.body.removeChild(ta);
        }
      });

      render();
    </script>
  </body>
</html>
