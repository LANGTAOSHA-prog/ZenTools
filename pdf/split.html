function setLanguage(lang){

  currentLang = lang;

  const data = translations[lang] || translations.zh;

  document.documentElement.lang = lang;

  document.title = data.pageTitle;

  document.querySelectorAll("[data-i18n]").forEach(el=>{

    const key = el.getAttribute("data-i18n");

    if(data[key]){
      el.textContent = data[key];
    }

  });

  localStorage.setItem("siteLanguage", lang);

}

languageSelect.addEventListener("change", function(){

});

async function splitPDF(){

  const file = document.getElementById("pdfInput").files[0];

  const pagesText = document.getElementById("pageInput").value.trim();

  if(!file){

    alert(translations[currentLang].alertNoFile);

    return;

  }

  if(!pagesText){

    alert(translations[currentLang].alertNoPages);

    return;

  }

  const pageNumbers = pagesText
    .split(",")
    .map(p=>parseInt(p.trim()) - 1)
    .filter(p=>!isNaN(p));

  const bytes = await file.arrayBuffer();

  const pdfDoc = await PDFLib.PDFDocument.load(bytes);

  const newPdf = await PDFLib.PDFDocument.create();

  const copiedPages = await newPdf.copyPages(pdfDoc, pageNumbers);

  copiedPages.forEach(page=>newPdf.addPage(page));

  const pdfBytes = await newPdf.save();

  const blob = new Blob([pdfBytes], {type:"application/pdf"});

  const url = URL.createObjectURL(blob);

  const downloadBtn = document.getElementById("downloadBtn");

  downloadBtn.href = url;

  downloadBtn.style.display = "inline-block";

}

function setMeta(name, content){
  let meta = document.querySelector(`meta[name="${name}"]`);
  if(!meta){
    meta = document.createElement("meta");
    meta.setAttribute("name", name);
    document.head.appendChild(meta);
  }
  meta.setAttribute("content", content);
}

function setProperty(property, content){
  let meta = document.querySelector(`meta[property="${property}"]`);
  if(!meta){
    meta = document.createElement("meta");
    meta.setAttribute("property", property);
    document.head.appendChild(meta);
  }
  meta.setAttribute("content", content);
}

function setCanonical(url){
  let link = document.querySelector('link[rel="canonical"]');
  if(!link){
    link = document.createElement("link");
    link.setAttribute("rel", "canonical");
    document.head.appendChild(link);
  }
  link.setAttribute("href", url);
}
