    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        let pdfDoc = null;
        let pdfLibDoc = null;
        let currentPage = 1;
        let totalPages = 0;
        let currentTool = 'select';
        let isDrawing = false;
        let annotations = [];
        let currentPageAnnotations = [];
        let history = [];
        let historyIndex = -1;

        const uploadZone = document.getElementById('uploadZone');
        const fileInput = document.getElementById('fileInput');
        const annotationToolbar = document.getElementById('annotationToolbar');
        const canvasWrapper = document.getElementById('canvasWrapper');
        const pdfCanvas = document.getElementById('pdfCanvas');
        const annotationCanvas = document.getElementById('annotationCanvas');
        const pdfCtx = pdfCanvas.getContext('2d');
        const annCtx = annotationCanvas.getContext('2d');

        document.querySelectorAll('[data-tool]').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('[data-tool]').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentTool = btn.dataset.tool;
            });
        });

        uploadZone.addEventListener('click', () => fileInput.click());
        uploadZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadZone.classList.add('drag-over');
        });
        uploadZone.addEventListener('dragleave', () => {
            uploadZone.classList.remove('drag-over');
        });
        uploadZone.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadZone.classList.remove('drag-over');
            const file = e.dataTransfer.files[0];
            if (file && file.type === 'application/pdf') {
                loadPdf(file);
            }
        });
        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) loadPdf(file);
        });

        async function loadPdf(file) {
            const arrayBuffer = await file.arrayBuffer();
            pdfDoc = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
            pdfLibDoc = await PDFLib.PDFDocument.load(arrayBuffer);
            totalPages = pdfDoc.numPages;
            currentPage = 1;
            annotations = {};
            renderPage(currentPage);
            annotationToolbar.style.display = 'flex';
            canvasWrapper.style.display = 'block';
        }

        async function renderPage(num) {
            const page = await pdfDoc.getPage(num);
            const viewport = page.getViewport({ scale: 1.5 });
            pdfCanvas.width = viewport.width;
            pdfCanvas.height = viewport.height;
            annotationCanvas.width = viewport.width;
            annotationCanvas.height = viewport.height;

            await page.render({ canvasContext: pdfCtx, viewport: viewport }).promise;
            renderAnnotations();

            document.getElementById('pageInfo').textContent = `第 ${num} / ${totalPages} 页`;
        }

        function renderAnnotations() {
            annCtx.clearRect(0, 0, annotationCanvas.width, annotationCanvas.height);
            const pageAnns = annotations[currentPage] || [];
            
            for (const ann of pageAnns) {
                annCtx.globalAlpha = 0.5;
                
                switch (ann.type) {
                    case 'highlight':
                        annCtx.fillStyle = ann.color;
                        annCtx.fillRect(ann.x, ann.y, ann.width, ann.height);
                        break;
                    case 'underline':
                        annCtx.strokeStyle = ann.color;
                        annCtx.lineWidth = 2;
                        annCtx.beginPath();
                        annCtx.moveTo(ann.x, ann.y + ann.height);
                        annCtx.lineTo(ann.x + ann.width, ann.y + ann.height);
                        annCtx.stroke();
                        break;
                    case 'strike':
                        annCtx.strokeStyle = ann.color;
                        annCtx.lineWidth = 2;
                        annCtx.beginPath();
                        annCtx.moveTo(ann.x, ann.y + ann.height / 2);
                        annCtx.lineTo(ann.x + ann.width, ann.y + ann.height / 2);
                        annCtx.stroke();
                        break;
                    case 'freehand':
                        annCtx.strokeStyle = ann.color;
                        annCtx.lineWidth = 2;
                        annCtx.lineCap = 'round';
                        annCtx.beginPath();
                        if (ann.points.length > 0) {
                            annCtx.moveTo(ann.points[0].x, ann.points[0].y);
                            for (let i = 1; i < ann.points.length; i++) {
                                annCtx.lineTo(ann.points[i].x, ann.points[i].y);
                            }
                        }
                        annCtx.stroke();
                        break;
                }
            }
            annCtx.globalAlpha = 1;
        }

        function getMousePos(e) {
            const rect = annotationCanvas.getBoundingClientRect();
            return {
                x: e.clientX - rect.left,
                y: e.clientY - rect.top
            };
        }

        annotationCanvas.addEventListener('mousedown', (e) => {
            if (currentTool === 'select') return;
            isDrawing = true;
            const pos = getMousePos(e);
            
            if (currentTool === 'freehand') {
                currentPageAnnotations = [];
                annotations[currentPage] = currentPageAnnotations;
                history.push(JSON.parse(JSON.stringify(annotations)));
                historyIndex = history.length - 1;
                
                const ann = {
                    type: 'freehand',
                    color: document.getElementById('colorPicker').value,
                    points: [pos]
                };
                currentPageAnnotations.push(ann);
            } else {
                currentPageAnnotations = annotations[currentPage] || [];
                annotations[currentPage] = currentPageAnnotations;
            }
        });

        annotationCanvas.addEventListener('mousemove', (e) => {
            if (!isDrawing) return;
            const pos = getMousePos(e);

            if (currentTool === 'freehand') {
                const ann = currentPageAnnotations[currentPageAnnotations.length - 1];
                ann.points.push(pos);
                renderAnnotations();
            }
        });

        annotationCanvas.addEventListener('mouseup', () => {
            if (isDrawing) {
                isDrawing = false;
                history.push(JSON.parse(JSON.stringify(annotations)));
                historyIndex = history.length - 1;
            }
        });

        document.getElementById('colorPicker').addEventListener('input', (e) => {
            if (currentTool !== 'select' && currentPageAnnotations.length > 0) {
                const lastAnn = currentPageAnnotations[currentPageAnnotations.length - 1];
                if (lastAnn) lastAnn.color = e.target.value;
                renderAnnotations();
            }
        });

        document.getElementById('undoBtn').addEventListener('click', () => {
            if (historyIndex > 0) {
                historyIndex--;
                annotations = JSON.parse(JSON.stringify(history[historyIndex]));
                renderAnnotations();
            }
        });

        document.getElementById('redoBtn').addEventListener('click', () => {
            if (historyIndex < history.length - 1) {
                historyIndex++;
                annotations = JSON.parse(JSON.stringify(history[historyIndex]));
                renderAnnotations();
            }
        });

        document.getElementById('clearBtn').addEventListener('click', () => {
            if (confirm('确定要清除当前页面的所有注释吗？')) {
                annotations[currentPage] = [];
                renderAnnotations();
                history.push(JSON.parse(JSON.stringify(annotations)));
                historyIndex = history.length - 1;
            }
        });

        document.getElementById('prevPage').addEventListener('click', () => {
            if (currentPage > 1) {
                currentPage--;
                renderPage(currentPage);
            }
        });

        document.getElementById('nextPage').addEventListener('click', () => {
            if (currentPage < totalPages) {
                currentPage++;
                renderPage(currentPage);
            }
        });

        document.getElementById('downloadBtn').addEventListener('click', async () => {
            for (const [pageNum, pageAnns] of Object.entries(annotations)) {
                const pageIndex = parseInt(pageNum) - 1;
                const page = pdfLibDoc.getPages()[pageIndex];
                const { width, height } = page.getSize();
                const scale = pdfCanvas.width / width;

                for (const ann of pageAnns) {
                    const x = ann.x / scale;
                    const y = (height - (ann.y + (ann.height || 0))) / scale;
                    const w = (ann.width || 0) / scale;
                    const h = (ann.height || 0) / scale;

                    if (ann.type === 'highlight') {
                        page.addHighlightAnnotation({
                            rect: [x, y, x + w, y + h],
                            color: hexToRgb(ann.color),
                        });
                    } else if (ann.type === 'underline') {
                        page.addUnderlineAnnotation({
                            rect: [x, y, x + w, y + h],
                            color: hexToRgb(ann.color),
                        });
                    } else if (ann.type === 'strike') {
                        page.addStrikethroughAnnotation({
                            rect: [x, y, x + w, y + h],
                            color: hexToRgb(ann.color),
                        });
                    } else if (ann.type === 'freehand') {
                        const points = ann.points.map(p => ({
                            x: p.x / scale,
                            y: (height - p.y) / scale
                        }));
                        page.addInkAnnotation({
                            paths: [points],
                            color: hexToRgb(ann.color),
                        });
                    }
                }
            }

            const pdfBytes = await pdfLibDoc.save();
            const blob = new Blob([pdfBytes], { type: 'application/pdf' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'annotated.pdf';
            a.click();
            URL.revokeObjectURL(url);
        });

        function hexToRgb(hex) {
            const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
            return result ? PDFLib.rgb(
                parseInt(result[1], 16) / 255,
                parseInt(result[2], 16) / 255,
                parseInt(result[3], 16) / 255
            ) : PDFLib.rgb(1, 1, 0);
        }

        i18n.init({ defaultLang: 'zh', supportedLangs: ['zh', 'en', 'ja', 'vi'] });
    </script>
