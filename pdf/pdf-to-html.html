<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF 转 HTML - ZenTools 免费在线工具箱</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/tool-ui.css">
    <link rel="icon" href="../favicon.svg" type="image/svg+xml">
</head>
<body>
    <header class="site-header">
        <div class="container">
            <a href="../index.html" class="logo">
                <span class="logo-icon">⚡</span>
                <span class="logo-text">ZenTools</span>
            </a>
            <nav class="nav-menu">
                <a href="../index.html" data-i18n="nav_home">首页</a>
                <a href="../categories.html" data-i18n="nav_categories">分类</a>
                <a href="../about.html" data-i18n="nav_about">关于</a>
            </nav>
            <div class="lang-selector">
                <select id="langSelect">
                    <option value="zh">中文</option>
                    <option value="en">English</option>
                    <option value="ja">日本語</option>
                    <option value="vi">Tiếng Việt</option>
                </select>
            </div>
        </div>
    </header>

    <main class="tool-page">
        <div class="container">
            <div class="tool-header">
                <h1 data-i18n="title">PDF 转 HTML</h1>
                <p data-i18n="subtitle">将 PDF 文档转换为可编辑的 HTML 格式</p>
            </div>

            <div class="tool-ui">
                <div class="upload-zone" id="uploadZone">
                    <input type="file" id="fileInput" accept=".pdf" hidden>
                    <div class="upload-icon">📄</div>
                    <p data-i18n="drop_hint">拖拽 PDF 文件到此处，或点击上传</p>
                    <p class="upload-note" data-i18n="local_note">文件仅在浏览器本地处理，不会上传到服务器</p>
                </div>

                <div class="settings-panel" id="settingsPanel" style="display: none;">
                    <h3 data-i18n="settings_title">转换设置</h3>
                    <div class="form-group">
                        <label data-i18n="label_pages">转换页面</label>
                        <select id="pageRange">
                            <option value="all" data-i18n="opt_all">所有页面</option>
                            <option value="first" data-i18n="opt_first">仅第一页</option>
                            <option value="custom" data-i18n="opt_custom">自定义</option>
                        </select>
                    </div>
                    <div class="form-group" id="customPagesGroup" style="display: none;">
                        <label data-i18n="label_custom_pages">页面范围</label>
                        <input type="text" id="customPages" placeholder="例如: 1-5, 10, 15-20">
                    </div>
                    <div class="form-group checkbox">
                        <label>
                            <input type="checkbox" id="includeImagesCheck" checked>
                            <span data-i18n="opt_include_images">包含图片</span>
                        </label>
                    </div>
                    <div class="form-group checkbox">
                        <label>
                            <input type="checkbox" id="preserveLayoutCheck" checked>
                            <span data-i18n="opt_preserve_layout">保留原始布局</span>
                        </label>
                    </div>
                </div>

                <div class="action-area" id="actionArea" style="display: none;">
                    <button class="tool-btn btn-primary" id="convertBtn" data-i18n="btn_convert">开始转换</button>
                </div>

                <div class="result-area" id="resultArea" style="display: none;">
                    <div class="result-status" id="resultStatus"></div>
                    <div class="html-preview" id="htmlPreview" style="display: none;"></div>
                    <button class="tool-btn btn-primary" id="downloadBtn" data-i18n="btn_download">下载 HTML 文件</button>
                    <button class="tool-btn" id="copyBtn" data-i18n="btn_copy">复制 HTML 代码</button>
                </div>
            </div>
        </div>
    </main>

    <footer class="site-footer">
        <div class="container">
            <p data-i18n="footer_text">© 2026 ZenTools - 免费在线工具箱 · 所有文件在本地处理</p>
        </div>
    </footer>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="../assets/js/i18n.js"></script>
    <script src="../assets/js/anti-crash.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        const uploadZone = document.getElementById('uploadZone');
        const fileInput = document.getElementById('fileInput');
        const settingsPanel = document.getElementById('settingsPanel');
        const actionArea = document.getElementById('actionArea');
        const resultArea = document.getElementById('resultArea');
        const resultStatus = document.getElementById('resultStatus');
        const htmlPreview = document.getElementById('htmlPreview');
        const downloadBtn = document.getElementById('downloadBtn');
        const copyBtn = document.getElementById('copyBtn');
        const pageRange = document.getElementById('pageRange');
        const customPagesGroup = document.getElementById('customPagesGroup');
        const customPages = document.getElementById('customPages');

        let pdfDoc = null;
        let originalArrayBuffer = null;
        let generatedHtml = '';

        uploadZone.addEventListener('click', () => fileInput.click());
        uploadZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadZone.classList.add('drag-over');
        });
        uploadZone.addEventListener('dragleave', () => {
            uploadZone.classList.remove('drag-over');
        });
        uploadZone.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadZone.classList.remove('drag-over');
            const file = e.dataTransfer.files[0];
            if (file && file.type === 'application/pdf') {
                loadPdf(file);
            }
        });
        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) loadPdf(file);
        });

        pageRange.addEventListener('change', () => {
            customPagesGroup.style.display = pageRange.value === 'custom' ? 'block' : 'none';
        });

        async function loadPdf(file) {
            originalArrayBuffer = await file.arrayBuffer();
            pdfDoc = await pdfjsLib.getDocument({ data: originalArrayBuffer }).promise;
            settingsPanel.style.display = 'block';
            actionArea.style.display = 'block';
        }

        document.getElementById('convertBtn').addEventListener('click', async () => {
            resultArea.style.display = 'block';
            resultStatus.className = 'result-status loading';
            resultStatus.textContent = '正在转换...';
            htmlPreview.style.display = 'none';

            try {
                const pageRangeValue = pageRange.value;
                const includeImages = document.getElementById('includeImagesCheck').checked;
                const preserveLayout = document.getElementById('preserveLayoutCheck').checked;

                let pagesToConvert = [];
                if (pageRangeValue === 'all') {
                    pagesToConvert = Array.from({ length: pdfDoc.numPages }, (_, i) => i + 1);
                } else if (pageRangeValue === 'first') {
                    pagesToConvert = [1];
                } else {
                    pagesToConvert = parsePageRange(customPages.value, pdfDoc.numPages);
                }

                let html = `<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF 转 HTML</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            line-height: 1.6;
            color: #333;
        }
        .page {
            page-break-after: always;
            margin-bottom: 40px;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 8px;
        }
        .page-header {
            text-align: center;
            color: #666;
            font-size: 12px;
            margin-bottom: 10px;
        }
        img {
            max-width: 100%;
            height: auto;
            display: block;
            margin: 10px auto;
        }
        @media print {
            .page {
                border: none;
                page-break-after: always;
            }
        }
    </style>
</head>
<body>`;

                for (const pageNum of pagesToConvert) {
                    const page = await pdfDoc.getPage(pageNum);
                    const viewport = page.getViewport({ scale: 2 });

                    const canvas = document.createElement('canvas');
                    canvas.width = viewport.width;
                    canvas.height = viewport.height;
                    await page.render({ canvasContext: canvas.getContext('2d'), viewport: viewport }).promise;

                    html += `\n<div class="page">
    <div class="page-header">第 ${pageNum} 页</div>`;

                    if (includeImages) {
                        const imgUrl = canvas.toDataURL('image/png');
                        html += `\n    <img src="${imgUrl}" alt="第 ${pageNum} 页内容">`;
                    } else {
                        const textContent = await page.getTextContent();
                        const textItems = textContent.items.filter(item => item.str.trim());
                        
                        if (preserveLayout) {
                            for (const item of textItems) {
                                const transform = item.transform;
                                const x = transform[4];
                                const y = viewport.height - transform[5] - transform[3];
                                const fontSize = transform[3];
                                const text = item.str;
                                html += `\n    <div style="position: absolute; left: ${x}px; top: ${y}px; font-size: ${fontSize}px;">${escapeHtml(text)}</div>`;
                            }
                        } else {
                            for (const item of textItems) {
                                html += `\n    <p>${escapeHtml(item.str)}</p>`;
                            }
                        }
                    }

                    html += `\n</div>`;
                }

                html += `\n</body>
</html>`;

                generatedHtml = html;

                htmlPreview.innerHTML = generatedHtml;
                htmlPreview.style.display = 'block';

                resultStatus.className = 'result-status success';
                resultStatus.textContent = `✅ 转换完成！共处理 ${pagesToConvert.length} 页`;

                downloadBtn.onclick = () => {
                    const blob = new Blob([generatedHtml], { type: 'text/html' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = 'converted_' + (uploadZone.dataset.filename || 'document').replace('.pdf', '') + '.html';
                    a.click();
                    URL.revokeObjectURL(url);
                };

                copyBtn.onclick = () => {
                    navigator.clipboard.writeText(generatedHtml).then(() => {
                        copyBtn.textContent = '✓ 已复制';
                        setTimeout(() => copyBtn.textContent = '复制 HTML 代码', 2000);
                    });
                };

            } catch (error) {
                resultStatus.className = 'result-status error';
                resultStatus.textContent = `❌ 转换失败: ${error.message}`;
            }
        });

        function parsePageRange(rangeText, totalPages) {
            const pages = new Set();
            if (!rangeText) return [1];
            
            const parts = rangeText.split(',').map(s => s.trim()).filter(Boolean);
            
            for (const part of parts) {
                if (part.includes('-')) {
                    const [start, end] = part.split('-').map(Number);
                    for (let i = start; i <= end && i <= totalPages; i++) {
                        if (i >= 1) pages.add(i);
                    }
                } else {
                    const num = parseInt(part);
                    if (num >= 1 && num <= totalPages) pages.add(num);
                }
            }
            return Array.from(pages).sort((a, b) => a - b);
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        i18n.init({ defaultLang: 'zh', supportedLangs: ['zh', 'en', 'ja', 'vi'] });
    </script>
</body>
</html>
