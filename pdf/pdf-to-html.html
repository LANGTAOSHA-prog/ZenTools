        },
        en: {

          opt_include_images:'Include images', opt_preserve_layout:'Preserve layout',

          title:'PDF を HTML に変換', subtitle:'PDF ファイルを HTML ウェブ形式に変換',
          drop_hint:'PDF ファイルをここにドロップ、またはクリックしてアップロード',
          local_note:'ファイルはブラウザ内でローカル処理され、サーバーにアップロードされません',
          settings_title:'設定', label_pages:'ページ範囲',
          opt_all:'すべてのページ', opt_first:'最初のページのみ', opt_custom:'カスタム',
          label_custom_pages:'ページ番号（例: 1,3,5-7）',
          opt_include_images:'画像を含める', opt_preserve_layout:'レイアウトを保持',
          btn_convert:'変換開始', btn_download:'HTML をダウンロード',
          btn_copy:'HTML をコピー',
          footer_text:'© 2026 ZenTools - 無料オンラインツール · すべてのファイルはローカル処理'
        },
        vi: {
          nav_home:'Trang chủ', nav_categories:'Danh mục', nav_about:'Giới thiệu',
          title:'PDF sang HTML', subtitle:'Chuyển file PDF sang định dạng HTML',
          drop_hint:'Kéo thả file PDF vào đây, hoặc nhấp để tải lên',
          local_note:'File được xử lý cục bộ trong trình duyệt, không tải lên máy chủ',
          settings_title:'Cài đặt', label_pages:'Phạm vi trang',
          opt_all:'Tất cả trang', opt_first:'Chỉ trang đầu', opt_custom:'Tùy chỉnh',
          label_custom_pages:'Số trang (vd: 1,3,5-7)',
          opt_include_images:'Bao gồm ảnh', opt_preserve_layout:'Giữ bố cục',
          btn_convert:'Chuyển đổi', btn_download:'Tải HTML',

    <script src="../assets/js/tool-ui.min.js"></script>
    <script src="../assets/js/anti-crash.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        const uploadZone = document.getElementById('uploadZone');
        const fileInput = document.getElementById('fileInput');
        const settingsPanel = document.getElementById('settingsPanel');
        const actionArea = document.getElementById('actionArea');
        const resultArea = document.getElementById('resultArea');
        const resultStatus = document.getElementById('resultStatus');
        const htmlPreview = document.getElementById('htmlPreview');
        const downloadBtn = document.getElementById('downloadBtn');
        const copyBtn = document.getElementById('copyBtn');
        const pageRange = document.getElementById('pageRange');
        const customPagesGroup = document.getElementById('customPagesGroup');
        const customPages = document.getElementById('customPages');

        let pdfDoc = null;
        let originalArrayBuffer = null;
        let generatedHtml = '';

        uploadZone.addEventListener('click', () => fileInput.click());
        uploadZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadZone.classList.add('drag-over');
        });
        uploadZone.addEventListener('dragleave', () => {
            uploadZone.classList.remove('drag-over');
        });
        uploadZone.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadZone.classList.remove('drag-over');
            const file = e.dataTransfer.files[0];
            if (file && file.type === 'application/pdf') {
                loadPdf(file);
            }
        });
        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) loadPdf(file);
        });

        pageRange.addEventListener('change', () => {
            customPagesGroup.style.display = pageRange.value === 'custom' ? 'block' : 'none';
        });

        async function loadPdf(file) {
            originalArrayBuffer = await file.arrayBuffer();
            pdfDoc = await pdfjsLib.getDocument({ data: originalArrayBuffer }).promise;
            settingsPanel.style.display = 'block';
            actionArea.style.display = 'block';
        }

        document.getElementById('convertBtn').addEventListener('click', async () => {
            resultArea.style.display = 'block';
            resultStatus.className = 'result-status loading';
            resultStatus.textContent = '正在转换...';
            htmlPreview.style.display = 'none';

            try {
                const pageRangeValue = pageRange.value;
                const includeImages = document.getElementById('includeImagesCheck').checked;
                const preserveLayout = document.getElementById('preserveLayoutCheck').checked;

                let pagesToConvert = [];
                if (pageRangeValue === 'all') {
                    pagesToConvert = Array.from({ length: pdfDoc.numPages }, (_, i) => i + 1);
                } else if (pageRangeValue === 'first') {
                    pagesToConvert = [1];
                } else {
                    pagesToConvert = parsePageRange(customPages.value, pdfDoc.numPages);
                }

                let html = `<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF 转 HTML</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            line-height: 1.6;
            color: #333;
        }
        .page {
            page-break-after: always;
            margin-bottom: 40px;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 8px;
        }
        .page-header {
            text-align: center;
            color: #666;
            font-size: 12px;
            margin-bottom: 10px;
        }
        img {
            max-width: 100%;
            height: auto;
            display: block;
            margin: 10px auto;
        }
        @media print {
            .page {
                border: none;
                page-break-after: always;
            }
        }
    
.info-detail { margin-top: 32px; padding-top: 28px; border-top: 1px solid var(--border); }
.info-detail h3 { font-size: 16px; font-weight: 700; margin-bottom: 14px; color: var(--cyan); }
.info-detail ol, .info-detail ul { padding-left: 20px; }
.info-detail li { font-size: 14px; color: var(--muted); line-height: 1.8; margin-bottom: 4px; }
.info-detail p { font-size: 14px; color: var(--muted); line-height: 1.7; }
</style>
</head>
<body>`;

                for (const pageNum of pagesToConvert) {
                    const page = await pdfDoc.getPage(pageNum);
                    const viewport = page.getViewport({ scale: 2 });

                    const canvas = document.createElement('canvas');
                    canvas.width = viewport.width;
                    canvas.height = viewport.height;
                    await page.render({ canvasContext: canvas.getContext('2d'), viewport: viewport }).promise;

                    html += `\n<div class="page">
    <div class="page-header">第 ${pageNum} 页</div>`;

                    if (includeImages) {
                        const imgUrl = canvas.toDataURL('image/png');
                        html += `\n    <img src="${imgUrl}" alt="第 ${pageNum} 页内容">`;
                    } else {
                        const textContent = await page.getTextContent();
                        const textItems = textContent.items.filter(item => item.str.trim());
                        
                        if (preserveLayout) {
                            for (const item of textItems) {
                                const transform = item.transform;
                                const x = transform[4];
                                const y = viewport.height - transform[5] - transform[3];
                                const fontSize = transform[3];
                                const text = item.str;
                                html += `\n    <div style="position: absolute; left: ${x}px; top: ${y}px; font-size: ${fontSize}px;">${escapeHtml(text)}</div>`;
                            }
                        } else {
                            for (const item of textItems) {
                                html += `\n    <p>${escapeHtml(item.str)}</p>`;
                            }
                        }
                    }

                    html += `\n</div>`;
                }

                html += `\n</body>
</html>`;

                generatedHtml = html;

                htmlPreview.innerHTML = generatedHtml;
                htmlPreview.style.display = 'block';

                resultStatus.className = 'result-status success';
                resultStatus.textContent = `✅ 转换完成！共处理 ${pagesToConvert.length} 页`;

                downloadBtn.onclick = () => {
                    const blob = new Blob([generatedHtml], { type: 'text/html' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = 'converted_' + (uploadZone.dataset.filename || 'document').replace('.pdf', '') + '.html';
                    a.click();
                    URL.revokeObjectURL(url);
                };

                copyBtn.onclick = () => {
                    navigator.clipboard.writeText(generatedHtml).then(() => {
                        copyBtn.textContent = '✓ 已复制';
                        setTimeout(() => copyBtn.textContent = '复制 HTML 代码', 2000);
                    });
                };

            } catch (error) {
                resultStatus.className = 'result-status error';
                resultStatus.textContent = `❌ 转换失败: ${error.message}`;
            }
        });

        function parsePageRange(rangeText, totalPages) {
            const pages = new Set();
            if (!rangeText) return [1];
            
            const parts = rangeText.split(',').map(s => s.trim()).filter(Boolean);
            
            for (const part of parts) {
                if (part.includes('-')) {
                    const [start, end] = part.split('-').map(Number);
                    for (let i = start; i <= end && i <= totalPages; i++) {
                        if (i >= 1) pages.add(i);
                    }
                } else {
                    const num = parseInt(part);
                    if (num >= 1 && num <= totalPages) pages.add(num);
                }
            }
            return Array.from(pages).sort((a, b) => a - b);
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        i18n.init({ defaultLang: 'zh', supportedLangs: ['zh', 'en', 'ja', 'vi'] });
    </script>
</body>
