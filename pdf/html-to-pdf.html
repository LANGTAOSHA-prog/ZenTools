<script>
let pdfBytes=null;
async function htmlToPdf(){
  const html=document.getElementById("htmlContent").value.trim();
  const status=document.getElementById("status");const btn=document.getElementById("downloadBtn");
  if(!html){status.textContent="⚠️ 请输入 HTML 内容";return;}
  if(!window.jspdf){status.textContent="⚠️ 组件加载中…";return;}
  status.textContent="🔄 正在生成 PDF……";btn.style.display="none";
  try{
    const{jsPDF}=window.jspdf;const pdf=new jsPDF({orientation:'portrait',unit:'mm',format:'a4'});
    const margin=10;let y=margin;const pageW=190;
    // Render HTML as simple text (strip tags for text content)
    const tmp=document.createElement('div');tmp.innerHTML=html;
    const lines=tmp.textContent||tmp.innerText||'';
    const maxChars=Math.floor(pageW/3.5);const lineH=6;
    for(let i=0;i<lines.length;i+=maxChars){
      if(y>280){pdf.addPage();y=margin;}
      pdf.text(lines.substring(i,i+maxChars),margin,y);
      y+=lineH;
    }
    pdfBytes=pdf.output('arraybuffer');
    status.textContent="✅ PDF 已生成！";
    btn.style.display="block";downloadResult();
  }catch(err){console.error(err);status.textContent="❌ 生成失败";}
}
function downloadResult(){if(!pdfBytes)return;const blob=new Blob([pdfBytes],{type:"application/pdf"});const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download="ZenTools-HTML转PDF.pdf";a.click();URL.revokeObjectURL(url);}
</script>
