<script src="https://unpkg.com/pdf-lib/dist/pdf-lib.min.js"></script>
<script src="../assets/js/tool-ui.js"></script>
<script>
let wmBytes=null;
function getDict(){const l=localStorage.getItem('zentools_lang')||'zh';return(window.ZT_PAGE||{})[l]||window.ZT_PAGE.zh;}

async function addWatermark(){
  const file=document.getElementById("pdfInput").files[0];const text=document.getElementById("wmText").value.trim();
  const opacity=parseInt(document.getElementById("wmOpacity").value)/100;
  const size=parseInt(document.getElementById("wmSize").value);
  const status=document.getElementById("status");const btn=document.getElementById("wmBtn");
  const downloadBtn=document.getElementById("downloadBtn");const dict=getDict();
  
  if(!file){status.textContent=dict.alertNoFile;return;}
  if(!text){status.textContent=dict.alertNoText;return;}
  
  status.textContent=dict.statusWorking;btn.disabled=true;downloadBtn.style.display="none";
  try{
    const bytes=await file.arrayBuffer();const pdfDoc=await PDFLib.PDFDocument.load(bytes);
    const helvetica=await pdfDoc.embedFont(PDFLib.StandardFonts.Helvetica);
    const pages=pdfDoc.getPages();
    for(const page of pages){
      const{width,height}=page.getSize();
      page.drawText(text,{
        x:width/2,y:height/2,size:size,font:helvetica,
        color:PDFLib.rgb(0.5,0.5,0.5),opacity:opacity,
        rotate:PDFLib.degrees(-45),xCenter:true,yCenter:true,
      });
    }
    wmBytes=await pdfDoc.save();status.textContent=dict.statusComplete;
    downloadBtn.style.display="block";downloadResult();
  }catch(err){console.error(err);status.textContent=dict.statusError;}
  finally{btn.disabled=false;}
}
function downloadResult(){if(!wmBytes)return;const name=document.getElementById("pdfInput").files[0].name.replace('.pdf','')+'_水印.pdf';const blob=new Blob([wmBytes],{type:"application/pdf"});const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download=name;a.click();URL.revokeObjectURL(url);}
</script>
