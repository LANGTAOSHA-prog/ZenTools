<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
let csvText='';function getDict(){const l=localStorage.getItem('zentools_lang')||'zh';return(window.ZT_PAGE||{})[l]||window.ZT_PAGE.zh;}
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
function escCSV(s){const v=(s||'').trim();return v.includes(',')||v.includes('"')||v.includes('\n')?'"'+v.replace(/"/g,'""')+'"':v;}
async function extractCSV(){const file=document.getElementById('pdfInput').files[0];const status=document.getElementById('status');const progress=document.getElementById('progress');const area=document.getElementById('resultArea');const btn=document.getElementById('downloadBtn');const dict=getDict();
if(!file){status.textContent=dict.alertNoFile;return;}
status.textContent=dict.statusWorking;progress.textContent='';btn.style.display='none';area.value='';
try{const buffer=await file.arrayBuffer();const pdf=await pdfjsLib.getDocument({data:buffer}).promise;const total=pdf.numPages;const rows=[];
for(let i=1;i<=total;i++){const page=await pdf.getPage(i);const content=await page.getTextContent();const lines={};for(const item of content.items){const y=Math.round(item.transform[5]);if(!lines[y])lines[y]=[];lines[y].push(item.str);}
const sortedY=Object.keys(lines).sort((a,b)=>b-a);for(const y of sortedY){rows.push(lines[y].join(' '));}progress.textContent=`${i}/${total}`;}
csvText=rows.map(r=>escCSV(r)).join('\n');area.value=csvText;status.textContent=dict.statusComplete.replace('{n}',total);btn.style.display='inline-flex';
}catch(err){console.error(err);status.textContent=dict.statusError;}}
function downloadResult(){if(!csvText)return;const name=document.getElementById('pdfInput').files[0].name.replace('.pdf','')+'.csv';const blob=new Blob(['\uFEFF'+csvText],{type:'text/csv;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;a.click();URL.revokeObjectURL(url);}
</script>

</script>
