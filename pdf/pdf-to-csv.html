<div class="page-header reveal"><div class="breadcrumb"><a href="/">首页</a><span class="breadcrumb-sep">/</span><a href="/pdf/">PDF工具</a><span class="breadcrumb-sep">/</span><span class="cur" data-i18n="crumbCur">PDF 转 CSV</span></div><span class="page-eyebrow" data-i18n="eyebrow">PDF 工具</span><h1><span class="grad" data-i18n="h1Grad">PDF 转 CSV</span><br/><span data-i18n="h1Sub">提取表格数据</span></h1><p data-i18n="pageDesc">从 PDF 中提取文字内容并转换为 CSV 表格格式。</p></div>
<div class="tool-box reveal"><h2 data-i18n="toolTitle">选择 PDF 文件</h2><p class="note" data-i18n="toolNote">选择一个 PDF 文件，提取内容并导出为 CSV。</p>
<div class="file-input-row"><input type="file" id="pdfInput" accept=".pdf"/><button class="btn-primary" onclick="extractCSV()" data-i18n="extractBtn">提取为 CSV</button></div>
<div class="progress" id="progress"></div><div class="status" id="status"></div>
<textarea id="resultArea" placeholder="CSV 数据将显示在这里..." data-i18n-placeholder="resultPlace" readonly></textarea>
<div style="margin-top:12px;"><button class="download-btn" id="downloadBtn" onclick="downloadResult()" data-i18n="downloadBtn">📥 下载 CSV</button></div></div>
<script>
window.ZT_PAGE={zh:{crumbCur:'PDF 转 CSV',eyebrow:'PDF 工具',h1Grad:'PDF 转 CSV',h1Sub:'提取表格数据',pageDesc:'从 PDF 中提取文字内容并转换为 CSV 表格格式。',toolTitle:'选择 PDF 文件',toolNote:'选择一个 PDF 文件，提取内容并导出为 CSV。',extractBtn:'提取为 CSV',resultPlace:'CSV 数据将显示在这里...',downloadBtn:'📥 下载 CSV',statusWorking:'🔄 提取中…',statusComplete:'✅ 提取完成！共 {n} 页',statusError:'❌ 提取失败',alertNoFile:'⚠️ 请先选择 PDF 文件'},
en:{crumbCur:'PDF to CSV',h1Grad:'PDF to CSV',pageDesc:'Extract text from PDF and convert to CSV.',extractBtn:'Extract as CSV',downloadBtn:'📥 Download CSV',statusWorking:'🔄 Extracting…',statusComplete:'✅ Done! {n} pages',alertNoFile:'⚠️ Select a PDF'},
ja:{crumbCur:'PDFからCSV',h1Grad:'PDF→CSV',extractBtn:'CSVとして抽出',downloadBtn:'📥 CSVを保存',statusWorking:'🔄 抽出中…',statusComplete:'✅ 完了！{n}ページ'},
vi:{crumbCur:'PDF sang CSV',h1Grad:'PDF→CSV',extractBtn:'Trích xuất CSV',downloadBtn:'📥 Tải CSV',statusWorking:'🔄 Đang trích xuất…',statusComplete:'✅ Hoàn tất! {n} trang'}
};
</script><script src="../assets/js/tool-ui.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
let csvText='';function getDict(){const l=localStorage.getItem('zentools_lang')||'zh';return(window.ZT_PAGE||{})[l]||window.ZT_PAGE.zh;}
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
function escCSV(s){const v=(s||'').trim();return v.includes(',')||v.includes('"')||v.includes('\n')?'"'+v.replace(/"/g,'""')+'"':v;}
async function extractCSV(){const file=document.getElementById('pdfInput').files[0];const status=document.getElementById('status');const progress=document.getElementById('progress');const area=document.getElementById('resultArea');const btn=document.getElementById('downloadBtn');const dict=getDict();
if(!file){status.textContent=dict.alertNoFile;return;}
status.textContent=dict.statusWorking;progress.textContent='';btn.style.display='none';area.value='';
try{const buffer=await file.arrayBuffer();const pdf=await pdfjsLib.getDocument({data:buffer}).promise;const total=pdf.numPages;const rows=[];
for(let i=1;i<=total;i++){const page=await pdf.getPage(i);const content=await page.getTextContent();const lines={};for(const item of content.items){const y=Math.round(item.transform[5]);if(!lines[y])lines[y]=[];lines[y].push(item.str);}
const sortedY=Object.keys(lines).sort((a,b)=>b-a);for(const y of sortedY){rows.push(lines[y].join(' '));}progress.textContent=`${i}/${total}`;}
csvText=rows.map(r=>escCSV(r)).join('\n');area.value=csvText;status.textContent=dict.statusComplete.replace('{n}',total);btn.style.display='inline-flex';
}catch(err){console.error(err);status.textContent=dict.statusError;}}
function downloadResult(){if(!csvText)return;const name=document.getElementById('pdfInput').files[0].name.replace('.pdf','')+'.csv';const blob=new Blob(['\uFEFF'+csvText],{type:'text/csv;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;a.click();URL.revokeObjectURL(url);}
</script></body></html>
