    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        let pdfDoc = null;
        let pdfLibDoc = null;
        let currentPage = 1;
        let totalPages = 0;
        let canvas = document.getElementById('pdfCanvas');
        let ctx = canvas.getContext('2d');
        let isDrawing = false;
        let lastX = 0;
        let lastY = 0;
        let toolMode = 'select';
        let history = [];
        let historyIndex = -1;

        const uploadZone = document.getElementById('uploadZone');
        const fileInput = document.getElementById('fileInput');
        const toolbar = document.getElementById('toolbar');
        const canvasContainer = document.getElementById('canvasContainer');

        uploadZone.addEventListener('click', () => fileInput.click());
        uploadZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadZone.classList.add('drag-over');
        });
        uploadZone.addEventListener('dragleave', () => {
            uploadZone.classList.remove('drag-over');
        });
        uploadZone.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadZone.classList.remove('drag-over');
            const file = e.dataTransfer.files[0];
            if (file && file.type === 'application/pdf') {
                loadPdf(file);
            }
        });
        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) loadPdf(file);
        });

        async function loadPdf(file) {
            const arrayBuffer = await file.arrayBuffer();
            pdfDoc = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
            pdfLibDoc = await PDFLib.PDFDocument.load(arrayBuffer);
            totalPages = pdfDoc.numPages;
            currentPage = 1;
            renderPage(currentPage);
            toolbar.style.display = 'flex';
            canvasContainer.style.display = 'block';
        }

        async function renderPage(num) {
            const page = await pdfDoc.getPage(num);
            const viewport = page.getViewport({ scale: 1.5 });
            canvas.width = viewport.width;
            canvas.height = viewport.height;
            ctx.setTransform(1, 0, 0, 1, 0, 0);
            await page.render({ canvasContext: ctx, viewport: viewport }).promise;
            document.getElementById('pageInfo').textContent = `第 ${num} / ${totalPages} 页`;
        }

        canvas.addEventListener('mousedown', (e) => {
            if (toolMode === 'select') return;
            isDrawing = true;
            const rect = canvas.getBoundingClientRect();
            lastX = e.clientX - rect.left;
            lastY = e.clientY - rect.top;
        });

        canvas.addEventListener('mousemove', (e) => {
            if (!isDrawing || toolMode === 'select') return;
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            ctx.strokeStyle = toolMode === 'erase' ? '#ffffff' : '#ff0000';
            ctx.lineWidth = toolMode === 'erase' ? 20 : 3;
            ctx.beginPath();
            ctx.moveTo(lastX, lastY);
            ctx.lineTo(x, y);
            ctx.stroke();
            lastX = x;
            lastY = y;
        });

        canvas.addEventListener('mouseup', () => {
            isDrawing = false;
        });

        document.getElementById('addTextBtn').addEventListener('click', () => {
            const text = prompt('请输入要添加的文字：');
            if (text) {
                const x = prompt('X 坐标（默认 100）：') || 100;
                const y = prompt('Y 坐标（默认 700）：') || 700;
                const fontSize = prompt('字体大小（默认 12）：') || 12;
                pdfLibDoc.addPage([595.28, 841.89]).then(page => {
                    page.drawText(text, { x: parseFloat(x), y: parseFloat(y), size: parseFloat(fontSize) });
                });
            }
        });

        document.getElementById('addImageBtn').addEventListener('click', () => {
            const imgInput = document.createElement('input');
            imgInput.type = 'file';
            imgInput.accept = 'image/*';
            imgInput.onchange = async (e) => {
                const file = e.target.files[0];
                if (file) {
                    const arrayBuffer = await file.arrayBuffer();
                    let image;
                    if (file.type === 'image/jpeg') {
                        image = pdfLibDoc.embedJpg(arrayBuffer);
                    } else if (file.type === 'image/png') {
                        image = pdfLibDoc.embedPng(arrayBuffer);
                    }
                    if (image) {
                        const page = pdfLibDoc.addPage([595.28, 841.89]);
                        const { width, height } = await image;
                        page.drawImage(image, { x: 100, y: 600, width: 200, height: (height / width) * 200 });
                    }
                }
            };
            imgInput.click();
        });

        document.getElementById('drawBtn').addEventListener('click', () => {
            toolMode = toolMode === 'draw' ? 'select' : 'draw';
            document.getElementById('drawBtn').classList.toggle('active', toolMode === 'draw');
        });

        document.getElementById('eraseBtn').addEventListener('click', () => {
            toolMode = toolMode === 'erase' ? 'select' : 'erase';
            document.getElementById('eraseBtn').classList.toggle('active', toolMode === 'erase');
        });

        document.getElementById('undoBtn').addEventListener('click', () => {
            if (historyIndex >= 0) {
                historyIndex--;
            }
        });

        document.getElementById('redoBtn').addEventListener('click', () => {
            if (historyIndex < history.length - 1) {
                historyIndex++;
            }
        });

        document.getElementById('downloadBtn').addEventListener('click', async () => {
            const pdfBytes = await pdfLibDoc.save();
            const blob = new Blob([pdfBytes], { type: 'application/pdf' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'edited.pdf';
            a.click();
            URL.revokeObjectURL(url);
        });

        document.getElementById('prevPage').addEventListener('click', () => {
            if (currentPage > 1) {
                currentPage--;
                renderPage(currentPage);
            }
        });

        document.getElementById('nextPage').addEventListener('click', () => {
            if (currentPage < totalPages) {
                currentPage++;
                renderPage(currentPage);
            }
        });

    </script>
