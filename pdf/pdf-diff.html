<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF 对比 - ZenTools 免费在线工具箱</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/tool-ui.css">
    <link rel="icon" href="../favicon.svg" type="image/svg+xml">
</head>
<body>
    <header class="site-header">
        <div class="container">
            <a href="../index.html" class="logo">
                <span class="logo-icon">⚡</span>
                <span class="logo-text">ZenTools</span>
            </a>
            <nav class="nav-menu">
                <a href="../index.html" data-i18n="nav_home">首页</a>
                <a href="../categories.html" data-i18n="nav_categories">分类</a>
                <a href="../about.html" data-i18n="nav_about">关于</a>
            </nav>
            <div class="lang-selector">
                <select id="langSelect">
                    <option value="zh">中文</option>
                    <option value="en">English</option>
                    <option value="ja">日本語</option>
                    <option value="vi">Tiếng Việt</option>
                </select>
            </div>
        </div>
    </header>

    <main class="tool-page">
        <div class="container">
            <div class="tool-header">
                <h1 data-i18n="title">PDF 对比</h1>
                <p data-i18n="subtitle">对比两个 PDF 文件的差异，高亮显示不同之处</p>
            </div>

            <div class="tool-ui">
                <div class="two-upload">
                    <div class="upload-zone" id="uploadZone1">
                        <input type="file" id="fileInput1" accept=".pdf" hidden>
                        <div class="upload-icon">📄</div>
                        <p data-i18n="drop_hint_1">上传第一个 PDF（原文件）</p>
                        <p class="upload-note" id="fileName1"></p>
                    </div>

                    <div class="upload-zone" id="uploadZone2">
                        <input type="file" id="fileInput2" accept=".pdf" hidden>
                        <div class="upload-icon">📄</div>
                        <p data-i18n="drop_hint_2">上传第二个 PDF（新文件）</p>
                        <p class="upload-note" id="fileName2"></p>
                    </div>
                </div>

                <div class="compare-settings" id="compareSettings" style="display: none;">
                    <div class="form-group">
                        <label data-i18n="label_compare_mode">对比模式</label>
                        <select id="compareMode">
                            <option value="text" data-i18n="opt_text">文本对比</option>
                            <option value="visual" data-i18n="opt_visual">视觉对比</option>
                            <option value="both" data-i18n="opt_both">两者都对比</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label data-i18n="label_page">对比页面</label>
                        <select id="pageSelect">
                            <option value="all" data-i18n="opt_all">所有页面</option>
                        </select>
                    </div>
                    <button class="tool-btn btn-primary" id="compareBtn" data-i18n="btn_compare">开始对比</button>
                </div>

                <div class="result-area" id="resultArea" style="display: none;">
                    <div class="result-status" id="resultStatus"></div>
                    <div class="diff-output" id="diffOutput"></div>
                </div>
            </div>
        </div>
    </main>

    <footer class="site-footer">
        <div class="container">
            <p data-i18n="footer_text">© 2026 ZenTools - 免费在线工具箱 · 所有文件在本地处理</p>
        </div>
    </footer>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/diff/5.2.0/diff.min.js"></script>
    <script src="../assets/js/i18n.js"></script>
    <script src="../assets/js/anti-crash.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        const uploadZone1 = document.getElementById('uploadZone1');
        const uploadZone2 = document.getElementById('uploadZone2');
        const fileInput1 = document.getElementById('fileInput1');
        const fileInput2 = document.getElementById('fileInput2');
        const fileName1 = document.getElementById('fileName1');
        const fileName2 = document.getElementById('fileName2');
        const compareSettings = document.getElementById('compareSettings');
        const pageSelect = document.getElementById('pageSelect');
        const resultArea = document.getElementById('resultArea');
        const resultStatus = document.getElementById('resultStatus');
        const diffOutput = document.getElementById('diffOutput');

        let pdf1 = null;
        let pdf2 = null;
        let arrayBuffer1 = null;
        let arrayBuffer2 = null;

        function setupUpload(zone, fileInput, fileNameDisplay, fileNum) {
            zone.addEventListener('click', () => fileInput.click());
            zone.addEventListener('dragover', (e) => {
                e.preventDefault();
                zone.classList.add('drag-over');
            });
            zone.addEventListener('dragleave', () => {
                zone.classList.remove('drag-over');
            });
            zone.addEventListener('drop', (e) => {
                e.preventDefault();
                zone.classList.remove('drag-over');
                const file = e.dataTransfer.files[0];
                if (file && file.type === 'application/pdf') {
                    loadPdf(file, fileNum);
                }
            });
            fileInput.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (file) loadPdf(file, fileNum);
            });
        }

        setupUpload(uploadZone1, fileInput1, fileName1, 1);
        setupUpload(uploadZone2, fileInput2, fileName2, 2);

        async function loadPdf(file, num) {
            const arrayBuffer = await file.arrayBuffer();
            const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
            
            if (num === 1) {
                pdf1 = pdf;
                arrayBuffer1 = arrayBuffer;
                fileName1.textContent = `${file.name} (${pdf.numPages} 页)`;
            } else {
                pdf2 = pdf;
                arrayBuffer2 = arrayBuffer;
                fileName2.textContent = `${file.name} (${pdf.numPages} 页)`;
            }

            if (pdf1 && pdf2) {
                compareSettings.style.display = 'block';
                const minPages = Math.min(pdf1.numPages, pdf2.numPages);
                pageSelect.innerHTML = '<option value="all" data-i18n="opt_all">所有页面</option>';
                for (let i = 1; i <= minPages; i++) {
                    const option = document.createElement('option');
                    option.value = i;
                    option.textContent = `第 ${i} 页`;
                    pageSelect.appendChild(option);
                }
            }
        }

        document.getElementById('compareBtn').addEventListener('click', async () => {
            resultArea.style.display = 'block';
            resultStatus.className = 'result-status loading';
            resultStatus.textContent = '正在对比...';
            diffOutput.innerHTML = '';

            const mode = document.getElementById('compareMode').value;
            const pageNum = document.getElementById('pageSelect').value;

            try {
                if (mode === 'text' || mode === 'both') {
                    const textDiff = await compareText(pageNum);
                    if (textDiff) {
                        const section = document.createElement('div');
                        section.className = 'diff-section';
                        section.innerHTML = `<h3 data-i18n="text_diff">文本差异</h3>`;
                        section.appendChild(textDiff);
                        diffOutput.appendChild(section);
                    }
                }

                if (mode === 'visual' || mode === 'both') {
                    const visualDiff = await compareVisual(pageNum);
                    if (visualDiff) {
                        const section = document.createElement('div');
                        section.className = 'diff-section';
                        section.innerHTML = `<h3 data-i18n="visual_diff">视觉差异</h3>`;
                        section.appendChild(visualDiff);
                        diffOutput.appendChild(section);
                    }
                }

                resultStatus.className = 'result-status success';
                resultStatus.textContent = '✅ 对比完成';
            } catch (error) {
                resultStatus.className = 'result-status error';
                resultStatus.textContent = `❌ 对比失败: ${error.message}`;
            }
        });

        async function compareText(pageNum) {
            const pages = pageNum === 'all' 
                ? Array.from({ length: Math.min(pdf1.numPages, pdf2.numPages) }, (_, i) => i + 1)
                : [parseInt(pageNum)];

            const container = document.createElement('div');
            container.className = 'text-diff-container';

            for (const page of pages) {
                const [text1, text2] = await Promise.all([
                    getPageText(pdf1, page),
                    getPageText(pdf2, page)
                ]);

                const diff = Diff.diffLines(text1, text2);
                const diffElement = document.createElement('div');
                diffElement.className = 'diff-content';
                
                if (pageNum !== 'all') {
                    diffElement.innerHTML = `<h4>第 ${page} 页</h4>`;
                }

                diff.forEach(part => {
                    const span = document.createElement('span');
                    span.className = part.added ? 'diff-added' : part.removed ? 'diff-removed' : '';
                    span.textContent = part.value;
                    diffElement.appendChild(span);
                });

                container.appendChild(diffElement);
            }

            return container;
        }

        async function getPageText(pdf, pageNum) {
            const page = await pdf.getPage(pageNum);
            const textContent = await page.getTextContent();
            return textContent.items.map(item => item.str).join(' ');
        }

        async function compareVisual(pageNum) {
            const pages = pageNum === 'all' 
                ? Array.from({ length: Math.min(pdf1.numPages, pdf2.numPages) }, (_, i) => i + 1)
                : [parseInt(pageNum)];

            const container = document.createElement('div');
            container.className = 'visual-diff-container';

            for (const page of pages) {
                const [canvas1, canvas2] = await Promise.all([
                    renderPageToCanvas(pdf1, page),
                    renderPageToCanvas(pdf2, page)
                ]);

                const pageContainer = document.createElement('div');
                pageContainer.className = 'visual-diff-page';
                
                if (pageNum !== 'all') {
                    pageContainer.innerHTML = `<h4>第 ${page} 页</h4>`;
                }

                const sideBySide = document.createElement('div');
                sideBySide.className = 'side-by-side';
                sideBySide.appendChild(canvas1);
                sideBySide.appendChild(canvas2);
                pageContainer.appendChild(sideBySide);

                container.appendChild(pageContainer);
            }

            return container;
        }

        async function renderPageToCanvas(pdf, pageNum) {
            const page = await pdf.getPage(pageNum);
            const viewport = page.getViewport({ scale: 0.5 });
            const canvas = document.createElement('canvas');
            canvas.width = viewport.width;
            canvas.height = viewport.height;
            await page.render({ canvasContext: canvas.getContext('2d'), viewport: viewport }).promise;
            return canvas;
        }

        i18n.init({ defaultLang: 'zh', supportedLangs: ['zh', 'en', 'ja', 'vi'] });
    </script>
    <style>
        .two-upload {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }
        .compare-settings {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
        }
        .diff-section {
            margin-bottom: 30px;
        }
        .diff-section h3 {
            margin-bottom: 15px;
            color: var(--text-primary);
        }
        .diff-added {
            background: #d4edda;
            color: #155724;
        }
        .diff-removed {
            background: #f8d7da;
            color: #721c24;
            text-decoration: line-through;
        }
        .side-by-side {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .side-by-side canvas {
            border: 1px solid #ddd;
            border-radius: 8px;
            max-width: 100%;
        }
    </style>
</body>
</html>
