<link rel="stylesheet" href="../assets/css/tool-ui.css">
<style>
.tool-box { padding:24px; background:var(--surface); border-radius:var(--r); border:1px solid var(--border); }
label { display:block; margin:12px 0 4px; font-size:13px; font-weight:600; color:var(--muted); }
input, select { padding:10px 12px; border-radius:8px; border:1px solid var(--border); background:var(--bg); color:var(--text); font-size:14px; }
input:focus, select:focus { outline:none; border-color:var(--cyan); }
.btn { padding:10px 24px; border-radius:8px; border:none; background:linear-gradient(135deg,var(--cyan),var(--purple)); color:#fff; font-size:14px; font-weight:600; cursor:pointer; }
.btn:hover { opacity:.85; }
.btn2 { background:var(--glass-b); color:var(--text); }
.btn:disabled { opacity:.4; cursor:not-allowed; }
.result { margin-top:16px; padding:16px; border-radius:8px; background:var(--glass); border:1px solid var(--border); text-align:center; }
.progress { margin-top:12px; height:6px; border-radius:3px; background:var(--glass); overflow:hidden; }
.progress-bar { height:100%; width:0%; background:linear-gradient(90deg,var(--cyan),var(--purple)); border-radius:3px; transition:width .3s; }
.drop-zone {
  border:2px dashed var(--border); border-radius:12px; padding:40px 20px;
  text-align:center; cursor:pointer; transition:border-color .3s, background .3s;
  margin-bottom:16px;
}
.drop-zone:hover { border-color:var(--cyan); background:var(--glass); }
.drop-zone.dragover { border-color:var(--cyan); background:var(--glass-b); }
.drop-zone-icon { font-size:48px; margin-bottom:12px; }
.drop-zone-text { font-size:14px; color:var(--muted); }
.row { display:flex; gap:12px; flex-wrap:wrap; }
.row > * { flex:1; min-width:140px; }
</style>
</head>
<body>
<div class="container">
  <nav class="nav-bar">
    <div class="logo"><span class="mark">⛵</span>江湖小站-ZenTools</div>
    <div class="links"><a href="/">首页</a><a href="#" class="active">PDF 工具</a><a href="/plugins-preview.html">全部工具</a></div>
  </nav>
  <a href="/" class="back-home">← 返回首页</a>
  <div class="page-header">
    <h1><span class="hl">裁剪 PDF</span></h1>
    <p>裁剪 PDF 页面边距，去除多余空白区域。</p>
  </div>
  <div class="tool-box">
    <div class="drop-zone" id="dropZone">
      <div class="drop-zone-icon">🗑️</div>
      <div class="drop-zone-text">点击上传或拖拽 PDF 文件到此区域</div>
      <input type="file" id="fileInput" accept=".pdf" style="display:none" />
    </div>
    <div id="options" style="display:none;">
      <div class="row">
  <div><label>上 (px)</label><input type="number" id="cropTop" value="0" min="0" /></div>
  <div><label>下 (px)</label><input type="number" id="cropBottom" value="0" min="0" /></div>
</div>
<div class="row">
  <div><label>左 (px)</label><input type="number" id="cropLeft" value="0" min="0" /></div>
  <div><label>右 (px)</label><input type="number" id="cropRight" value="0" min="0" /></div>
</div>
      <button class="btn" id="goBtn" onclick="startProcess()">▶ 开始处理</button>
    </div>
    <div class="progress" id="progress" style="display:none;"><div class="progress-bar" id="progressBar"></div></div>
    <div class="result" id="result" style="display:none;"></div>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';</script>
<script src="../assets/js/tool-ui.js"></script>
<script>

var dropZone=document.getElementById('dropZone'),fileInput=document.getElementById('fileInput');
dropZone.onclick=function(){fileInput.click();};
dropZone.ondragover=function(e){e.preventDefault();dropZone.classList.add('dragover');};
dropZone.ondragleave=function(){dropZone.classList.remove('dragover');};
dropZone.ondrop=function(e){e.preventDefault();dropZone.classList.remove('dragover');if(e.dataTransfer.files.length)handleFile(e.dataTransfer.files[0]);};
fileInput.onchange=function(){if(this.files.length)handleFile(this.files[0]);};
var pdfFile=null,pdfDoc=null;
function handleFile(file){pdfFile=file;document.getElementById('options').style.display='block';dropZone.querySelector('.drop-zone-text').textContent='已选择: '+file.name;loadPDF(file);}
function loadPDF(file){
  var reader=new FileReader();
  reader.onload=function(e){
    var typedarray=new Uint8Array(e.target.result);
    pdfjsLib.getDocument(typedarray).promise.then(function(pdf){pdfDoc=pdf;document.getElementById('goBtn').disabled=false;}).catch(function(){alert('无法加载 PDF');});
  };
  reader.readAsArrayBuffer(file);
}
function updateProgress(pct){document.getElementById('progress').style.display='block';document.getElementById('progressBar').style.width=pct+'%';}

function startProcess(){
  if(!pdfDoc){alert('请先加载 PDF');return;}
  var t=parseInt(document.getElementById('cropTop').value)||0,
      b=parseInt(document.getElementById('cropBottom').value)||0,
      l=parseInt(document.getElementById('cropLeft').value)||0,
      r=parseInt(document.getElementById('cropRight').value)||0;
  var btn=document.getElementById('goBtn');btn.disabled=true;btn.textContent='处理中...';
  updateProgress(10);
  var canvas=document.createElement('canvas');
  var ctx=canvas.getContext('2d');
  var totalPages=pdfDoc.numPages,completed=0;
  function renderPage(num){
    pdfDoc.getPage(num).then(function(page){
      var vp=page.getViewport({scale:2});
      canvas.width=vp.width;canvas.height=vp.height;
      page.render({canvasContext:ctx,viewport:vp}).promise.then(function(){
        completed++;
        updateProgress(Math.round(completed/totalPages*80)+10);
        if(completed<totalPages)renderPage(completed+1);
        else{
          document.getElementById('result').style.display='block';
          document.getElementById('result').innerHTML='<div style="margin-bottom:12px;font-weight:700;">✅ 裁剪完成</div><div style="font-size:13px;color:var(--muted);">边距: 上'+t+' 下'+b+' 左'+l+' 右'+r+'px<br>共 '+totalPages+' 页<\/div>';
          updateProgress(100);
          btn.disabled=false;btn.textContent='▶ 开始处理';
        }
      });
    });
  }
  renderPage(1);
}

</script>
<button class="bookmark-float" onclick="prompt('复制链接收藏本站','https://zentools.xyz')">⭐ 收藏本站</button>
</body>
</html>
