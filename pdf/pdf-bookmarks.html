    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        const uploadZone = document.getElementById('uploadZone');
        const fileInput = document.getElementById('fileInput');
        const bookmarkEditor = document.getElementById('bookmarkEditor');
        const bookmarkTree = document.getElementById('bookmarkTree');
        const bookmarkForm = document.getElementById('bookmarkForm');
        const bookmarkTitle = document.getElementById('bookmarkTitle');
        const bookmarkPage = document.getElementById('bookmarkPage');
        const bookmarkLevel = document.getElementById('bookmarkLevel');
        const downloadBtn = document.getElementById('downloadBtn');

        let pdfDoc = null;
        let pdfLibDoc = null;
        let bookmarks = [];
        let selectedBookmarkIndex = -1;
        let editingBookmark = null;

        uploadZone.addEventListener('click', () => fileInput.click());
        uploadZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadZone.classList.add('drag-over');
        });
        uploadZone.addEventListener('dragleave', () => {
            uploadZone.classList.remove('drag-over');
        });
        uploadZone.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadZone.classList.remove('drag-over');
            const file = e.dataTransfer.files[0];
            if (file && file.type === 'application/pdf') {
                loadPdf(file);
            }
        });
        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) loadPdf(file);
        });

        async function loadPdf(file) {
            const arrayBuffer = await file.arrayBuffer();
            pdfDoc = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
            pdfLibDoc = await PDFLib.PDFDocument.load(arrayBuffer);
            
            bookmarks = await loadBookmarks(pdfDoc);
            renderBookmarkTree();
            
            bookmarkEditor.style.display = 'block';
        }

        async function loadBookmarks(pdf) {
            const outline = await pdf.getOutline();
            return outline || [];
        }

        function renderBookmarkTree() {
            bookmarkTree.innerHTML = '';
            
            if (bookmarks.length === 0) {
                bookmarkTree.innerHTML = '<div class="empty-state" data-i18n="no_bookmarks">暂无书签，点击上方"添加书签"开始</div>';
                return;
            }

            const fragment = document.createDocumentFragment();
            bookmarks.forEach((bookmark, index) => {
                const node = createBookmarkNode(bookmark, index);
                fragment.appendChild(node);
            });
            bookmarkTree.appendChild(fragment);
        }

        function createBookmarkNode(bookmark, index) {
            const div = document.createElement('div');
            div.className = 'bookmark-node';
            div.style.paddingLeft = `${(bookmark.level || 0) * 20}px`;
            div.dataset.index = index;

            const checkbox = document.createElement('input');
            checkbox.type = 'checkbox';
            checkbox.className = 'bookmark-checkbox';
            checkbox.addEventListener('change', () => {
                document.querySelectorAll('.bookmark-checkbox').forEach(c => c.checked = false);
                checkbox.checked = true;
                selectedBookmarkIndex = index;
            });

            const title = document.createElement('span');
            title.className = 'bookmark-title';
            title.textContent = bookmark.title || '未命名';
            title.addEventListener('click', () => {
                document.querySelectorAll('.bookmark-checkbox').forEach(c => c.checked = false);
                checkbox.checked = true;
                selectedBookmarkIndex = index;
            });

            const page = document.createElement('span');
            page.className = 'bookmark-page';
            page.textContent = `第 ${bookmark.dest ? (Array.isArray(bookmark.dest) ? bookmark.dest[0] + 1 : 1) : 1} 页`;

            div.appendChild(checkbox);
            div.appendChild(title);
            div.appendChild(page);

            return div;
        }

        document.getElementById('addBookmarkBtn').addEventListener('click', () => {
            editingBookmark = { title: '', page: 1, level: 0 };
            showBookmarkForm();
        });

        document.getElementById('addLevelBtn').addEventListener('click', () => {
            if (selectedBookmarkIndex >= 0 && selectedBookmarkIndex < bookmarks.length) {
                editingBookmark = { 
                    title: '', 
                    page: bookmarks[selectedBookmarkIndex].dest ? 1 : 1, 
                    level: (bookmarks[selectedBookmarkIndex].level || 0) + 1 
                };
                showBookmarkForm();
            } else {
                editingBookmark = { title: '', page: 1, level: 0 };
                showBookmarkForm();
            }
        });

        document.getElementById('removeBookmarkBtn').addEventListener('click', () => {
            if (selectedBookmarkIndex >= 0) {
                if (confirm('确定要删除选中的书签吗？')) {
                    bookmarks.splice(selectedBookmarkIndex, 1);
                    selectedBookmarkIndex = -1;
                    renderBookmarkTree();
                }
            } else {
                alert('请先选择一个书签');
            }
        });

        document.getElementById('moveUpBtn').addEventListener('click', () => {
            if (selectedBookmarkIndex > 0) {
                [bookmarks[selectedBookmarkIndex - 1], bookmarks[selectedBookmarkIndex]] = 
                    [bookmarks[selectedBookmarkIndex], bookmarks[selectedBookmarkIndex - 1]];
                selectedBookmarkIndex--;
                renderBookmarkTree();
            }
        });

        document.getElementById('moveDownBtn').addEventListener('click', () => {
            if (selectedBookmarkIndex >= 0 && selectedBookmarkIndex < bookmarks.length - 1) {
                [bookmarks[selectedBookmarkIndex], bookmarks[selectedBookmarkIndex + 1]] = 
                    [bookmarks[selectedBookmarkIndex + 1], bookmarks[selectedBookmarkIndex]];
                selectedBookmarkIndex++;
                renderBookmarkTree();
            }
        });

        function showBookmarkForm() {
            bookmarkTitle.value = editingBookmark.title;
            bookmarkPage.value = editingBookmark.page;
            bookmarkLevel.value = editingBookmark.level;
            bookmarkForm.style.display = 'block';
            bookmarkTitle.focus();
        }

        document.getElementById('cancelBookmarkBtn').addEventListener('click', () => {
            bookmarkForm.style.display = 'none';
            editingBookmark = null;
        });

        document.getElementById('saveBookmarkBtn').addEventListener('click', () => {
            const title = bookmarkTitle.value.trim();
            const page = parseInt(bookmarkPage.value) || 1;
            const level = parseInt(bookmarkLevel.value) || 0;

            if (!title) {
                alert('请输入书签标题');
                return;
            }

            const newBookmark = { title, dest: [page - 1], level };

            if (selectedBookmarkIndex >= 0 && editingBookmark === bookmarks[selectedBookmarkIndex]) {
                bookmarks[selectedBookmarkIndex] = newBookmark;
            } else {
                if (selectedBookmarkIndex >= 0) {
                    bookmarks.splice(selectedBookmarkIndex + 1, 0, newBookmark);
                } else {
                    bookmarks.push(newBookmark);
                }
            }

            bookmarkForm.style.display = 'none';
            editingBookmark = null;
            renderBookmarkTree();
        });

        downloadBtn.addEventListener('click', async () => {
            const outline = buildOutline(bookmarks);
            pdfLibDoc.setOutline(outline);

            const pdfBytes = await pdfLibDoc.save();
            const blob = new Blob([pdfBytes], { type: 'application/pdf' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'bookmarks_' + (uploadZone.dataset.filename || 'document.pdf');
            a.click();
            URL.revokeObjectURL(url);
        });

        function buildOutline(bookmarks) {
            const outline = [];
            const stack = [];

            for (const bookmark of bookmarks) {
                const entry = {
                    title: bookmark.title,
                    page: bookmark.dest ? bookmark.dest[0] : 0,
                    children: []
                };

                while (stack.length > 0 && stack[stack.length - 1].level >= (bookmark.level || 0)) {
                    stack.pop();
                }

                if (stack.length === 0) {
                    outline.push(entry);
                } else {
                    stack[stack.length - 1].children.push(entry);
                }

                stack.push({ ...entry, level: bookmark.level || 0 });
            }

            return outline;
        }

        i18n.init({ defaultLang: 'zh', supportedLangs: ['zh', 'en', 'ja', 'vi'] });
    </script>
