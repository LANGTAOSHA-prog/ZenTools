</script><script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script><script src="../assets/js/tool-ui.js"></script><script>
let pdfBytes=null;function getDict(){const l=localStorage.getItem('zentools_lang')||'zh';return(window.ZT_PAGE||{})[l]||window.ZT_PAGE.zh;}
async function generate(){const title=document.getElementById('docTitle').value.trim();const author=document.getElementById('docAuthor').value.trim();const content=document.getElementById('docContent').value.trim();const status=document.getElementById('status');const btn=document.getElementById('downloadBtn');const dict=getDict();if(!content){status.textContent=dict.alertNoContent;return;}
if(!window.jspdf){status.textContent='⚠️ 组件加载中…';return;}
status.textContent=dict.statusWorking;btn.style.display='none';
try{const{jsPDF}=window.jspdf;const pdf=new jsPDF({orientation:'portrait',unit:'mm',format:'a4'});const pageW=190;const margin=10;let y=margin;const lineH=6;const maxChars=Math.floor(pageW/3.3);
if(title){pdf.setFontSize(18);pdf.text(title,pageW/2,y,{align:'center'});y+=10;if(author){pdf.setFontSize(10);pdf.text(author,pageW/2,y,{align:'center'});y+=6;}pdf.setFontSize(11);y+=4;}
pdf.setFontSize(11);const lines=content.split('\n');for(const line of lines){if(y>280){pdf.addPage();y=margin;}
for(let i=0;i<line.length;i+=maxChars){if(y>280){pdf.addPage();y=margin;}
pdf.text(line.substring(i,i+maxChars),margin,y);y+=lineH;}}
pdfBytes=pdf.output('arraybuffer');status.textContent=dict.statusComplete;btn.style.display='block';downloadResult();
}catch(err){console.error(err);status.textContent=dict.statusError;}}
function downloadResult(){if(!pdfBytes)return;const title=document.getElementById('docTitle').value.trim()||'文档';const blob=new Blob([pdfBytes],{type:'application/pdf'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=title+'.pdf';a.click();URL.revokeObjectURL(url);}
