<script>
window.ZT_PAGE={zh:{crumbCur:'PDF 转 Markdown',eyebrow:'PDF 工具',h1Grad:'PDF 转 Markdown',h1Sub:'提取为 MD 格式',pageDesc:'从 PDF 文件中提取文字并转换为 Markdown 格式。',toolTitle:'选择 PDF 文件',toolNote:'选择一个 PDF 文件，提取并转换为 Markdown。',extractBtn:'提取为 Markdown',resultPlace:'Markdown 内容将显示在这里...',downloadBtn:'📥 下载 .md 文件',statusWorking:'🔄 提取中…',statusComplete:'✅ 提取完成！共 {n} 页',statusError:'❌ 提取失败',alertNoFile:'⚠️ 请先选择 PDF 文件'},
en:{crumbCur:'PDF to Markdown',h1Grad:'PDF to Markdown',pageDesc:'Extract text from PDF and convert to Markdown.',extractBtn:'Extract as Markdown',downloadBtn:'📥 Download .md',statusWorking:'🔄 Extracting…',statusComplete:'✅ Done! {n} pages',alertNoFile:'⚠️ Select a PDF'},
ja:{crumbCur:'PDFからMarkdown',h1Grad:'PDF→Markdown',extractBtn:'Markdownとして抽出',downloadBtn:'📥 .mdを保存',statusWorking:'🔄 抽出中…',statusComplete:'✅ 完了！{n}ページ'},
vi:{crumbCur:'PDF sang Markdown',h1Grad:'PDF→Markdown',extractBtn:'Trích xuất Markdown',downloadBtn:'📥 Tải .md',statusWorking:'🔄 Đang trích xuất…',statusComplete:'✅ Hoàn tất! {n} trang'}
};

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
let mdText='';function getDict(){const l=localStorage.getItem('zentools_lang')||'zh';return(window.ZT_PAGE||{})[l]||window.ZT_PAGE.zh;}
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
async function extractMD(){const file=document.getElementById('pdfInput').files[0];const status=document.getElementById('status');const progress=document.getElementById('progress');const area=document.getElementById('resultArea');const btn=document.getElementById('downloadBtn');const dict=getDict();
if(!file){status.textContent=dict.alertNoFile;return;}
status.textContent=dict.statusWorking;progress.textContent='';btn.style.display='none';area.value='';
try{const buffer=await file.arrayBuffer();const pdf=await pdfjsLib.getDocument({data:buffer}).promise;const total=pdf.numPages;let md='';
for(let i=1;i<=total;i++){const page=await pdf.getPage(i);const content=await page.getTextContent();const lines={};for(const item of content.items){const y=Math.round(item.transform[5]);if(!lines[y])lines[y]=[];lines[y].push(item.str);}
const sortedY=Object.keys(lines).sort((a,b)=>b-a);md+=`## Page ${i}\n\n`;for(const y of sortedY){const text=lines[y].join(' ').trim();if(text)md+=text+'\n\n';}progress.textContent=`${i}/${total}`;}
mdText=md;area.value=md;status.textContent=dict.statusComplete.replace('{n}',total);btn.style.display='inline-flex';
}catch(err){console.error(err);status.textContent=dict.statusError;}}
function downloadResult(){if(!mdText)return;const name=document.getElementById('pdfInput').files[0].name.replace('.pdf','')+'.md';const blob=new Blob([mdText],{type:'text/markdown;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;a.click();URL.revokeObjectURL(url);}
</script></body></html>
