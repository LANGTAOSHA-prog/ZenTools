<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PDF 合并工具 - ZenTools</title>

<meta name="description" content="ZenTools 免费在线 PDF 合并工具，支持多个 PDF 文件合并。">

<style>
:root{
  --bg:#0f172a;
  --card:#111827;
  --border:#1f2937;
  --text:#f3f4f6;
  --muted:#9ca3af;
  --blue:#2563eb;
  --green:#10b981;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:var(--bg);
  color:var(--text);
  font-family:Arial,"Noto Sans SC","Noto Sans JP",sans-serif;
  line-height:1.7;
}

.container{
  max-width:1000px;
  margin:auto;
  padding:40px 20px;
}

a{
  color:#60a5fa;
  text-decoration:none;
}

.top-bar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  flex-wrap:wrap;
  margin-bottom:20px;
}

.lang-select{
  background:#0f172a;
  color:white;
  border:1px solid #334155;
  border-radius:10px;
  padding:10px 12px;
}

.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:20px;
  padding:28px;
}

h1{
  margin-bottom:15px;
}

.desc{
  color:var(--muted);
  margin-bottom:25px;
}

.ad-box{
  margin:25px 0;
  height:110px;
  border:2px dashed #334155;
  border-radius:18px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#64748b;
}

input[type="file"]{
  width:100%;
  margin:20px 0;
}

button{
  background:var(--blue);
  color:white;
  border:none;
  padding:14px 20px;
  border-radius:12px;
  cursor:pointer;
  font-size:16px;
  font-weight:bold;
}

.download-btn{
  display:none;
  margin-top:20px;
  background:var(--green);
  color:white;
  padding:14px 20px;
  border-radius:12px;
  font-weight:bold;
}

.file-list{
  margin-top:20px;
  color:#cbd5e1;
}

.info{
  margin-top:40px;
}

.info h2{
  margin-top:30px;
  margin-bottom:10px;
}

.info p{
  color:#cbd5e1;
  white-space:pre-line;
}

footer{
  margin-top:50px;
  text-align:center;
  color:#94a3b8;
}

@media(max-width:768px){

  .container{
    padding:25px 15px;
  }

  button,
  .download-btn,
  .lang-select{
    width:100%;
    text-align:center;
  }

}
</style>

<script src="https://unpkg.com/pdf-lib/dist/pdf-lib.min.js"></script>
</head>

<body>

<div class="container">

  <div class="top-bar">

    <a href="index.html" data-i18n="back">
      ← 返回首页
    </a>

    <select id="languageSelect" class="lang-select">
      <option value="zh">中文</option>
      <option value="ja">日本語</option>
      <option value="en">English</option>
      <option value="vi">Tiếng Việt</option>
    </select>

  </div>

  <div class="card">

    <h1 data-i18n="title">
      PDF 合并工具
    </h1>

    <p class="desc" data-i18n="desc">
      免费在线 PDF 合并工具。支持多个 PDF 文件合并。
    </p>

    <div class="ad-box" data-i18n="ad">
      广告位（Google AdSense）
    </div>

    <input type="file" id="pdfInput" accept=".pdf" multiple>

    <button onclick="mergePDFs()" data-i18n="mergeBtn">
      开始合并
    </button>

    <div class="file-list" id="fileList"></div>

    <a id="downloadBtn" class="download-btn" download="merged.pdf" data-i18n="download">
      下载 PDF
    </a>

    <div class="info">

      <h2 data-i18n="guideTitle">使用说明</h2>

      <p data-i18n="guideText">
1. 选择多个 PDF 文件。
2. 点击开始合并。
3. 下载合并后的 PDF。
      </p>

      <h2 data-i18n="privacyTitle">隐私说明</h2>

      <p data-i18n="privacyText">
PDF 合并在浏览器本地完成，正常情况下不会上传到服务器。
      </p>

    </div>

  </div>

  <footer>
    © 2026 ZenTools. All Rights Reserved.
  </footer>

</div>

<script>

const languageSelect = document.getElementById("languageSelect");

let currentLang = "zh";

const translations = {

  zh:{
    pageTitle:"PDF 合并工具 - ZenTools",
    back:"← 返回首页",
    title:"PDF 合并工具",
    desc:"免费在线 PDF 合并工具。支持多个 PDF 文件合并。",
    ad:"广告位（Google AdSense）",
    mergeBtn:"开始合并",
    download:"下载 PDF",
    alertNoFile:"请选择 PDF 文件",
    guideTitle:"使用说明",
    guideText:"1. 选择多个 PDF 文件。\n2. 点击开始合并。\n3. 下载合并后的 PDF。",
    privacyTitle:"隐私说明",
    privacyText:"PDF 合并在浏览器本地完成，正常情况下不会上传到服务器。"
  },

  ja:{
    pageTitle:"PDF 結合ツール - ZenTools",
    back:"← ホームに戻る",
    title:"PDF 結合ツール",
    desc:"無料オンライン PDF 結合ツール。複数の PDF を結合できます。",
    ad:"広告スペース（Google AdSense）",
    mergeBtn:"PDF を結合",
    download:"PDF をダウンロード",
    alertNoFile:"PDF ファイルを選択してください",
    guideTitle:"使い方",
    guideText:"1. 複数の PDF を選択します。\n2. PDF を結合をクリックします。\n3. 結合後の PDF を保存します。",
    privacyTitle:"プライバシーについて",
    privacyText:"PDF 結合はブラウザ内で行われ、通常サーバーへアップロードされません。"
  },

  en:{
    pageTitle:"PDF Merger - ZenTools",
    back:"← Back to Home",
    title:"PDF Merger",
    desc:"Free online PDF merger tool. Merge multiple PDF files.",
    ad:"Ad Space（Google AdSense）",
    mergeBtn:"Merge PDF",
    download:"Download PDF",
    alertNoFile:"Please select PDF files",
    guideTitle:"How to Use",
    guideText:"1. Select multiple PDF files.\n2. Click Merge PDF.\n3. Download the merged PDF.",
    privacyTitle:"Privacy Notice",
    privacyText:"PDF merging is completed locally in your browser and is not uploaded to a server."
  },

  vi:{
    pageTitle:"Công cụ gộp PDF - ZenTools",
    back:"← Quay lại trang chủ",
    title:"Công cụ gộp PDF",
    desc:"Công cụ gộp PDF trực tuyến miễn phí. Hỗ trợ gộp nhiều file PDF.",
    ad:"Vị trí quảng cáo（Google AdSense）",
    mergeBtn:"Bắt đầu gộp",
    download:"Tải PDF",
    alertNoFile:"Vui lòng chọn file PDF",
    guideTitle:"Hướng dẫn sử dụng",
    guideText:"1. Chọn nhiều file PDF.\n2. Nhấn bắt đầu gộp.\n3. Tải file PDF sau khi gộp.",
    privacyTitle:"Thông tin quyền riêng tư",
    privacyText:"PDF được xử lý trực tiếp trong trình duyệt và không được tải lên máy chủ."
  }

};

function setLanguage(lang){

  currentLang = lang;

  const data = translations[lang] || translations.zh;

  document.documentElement.lang = lang;

  document.title = data.pageTitle;

  document.querySelectorAll("[data-i18n]").forEach(el=>{

    const key = el.getAttribute("data-i18n");

    if(data[key]){
      el.textContent = data[key];
    }

  });

  localStorage.setItem("siteLanguage", lang);

}

languageSelect.addEventListener("change", function(){

  setLanguage(this.value);

});

const savedLang = localStorage.getItem("siteLanguage") || "zh";

languageSelect.value = savedLang;

setLanguage(savedLang);

document.getElementById("pdfInput").addEventListener("change", function(){

  const list = document.getElementById("fileList");

  list.innerHTML = "";

  Array.from(this.files).forEach(file=>{

    const div = document.createElement("div");

    div.textContent = file.name;

    list.appendChild(div);

  });

});

async function mergePDFs(){

  const files = document.getElementById("pdfInput").files;

  if(files.length === 0){

    alert(translations[currentLang].alertNoFile);

    return;

  }

  const mergedPdf = await PDFLib.PDFDocument.create();

  for(const file of files){

    const bytes = await file.arrayBuffer();

    const pdf = await PDFLib.PDFDocument.load(bytes);

    const copiedPages = await mergedPdf.copyPages(pdf, pdf.getPageIndices());

    copiedPages.forEach(page=>mergedPdf.addPage(page));

  }

  const mergedBytes = await mergedPdf.save();

  const blob = new Blob([mergedBytes], {type:"application/pdf"});

  const url = URL.createObjectURL(blob);

  const downloadBtn = document.getElementById("downloadBtn");

  downloadBtn.href = url;

  downloadBtn.style.display = "inline-block";

}

<script>
const seoData = {
  title: "工具名称 - 免费在线工具 | ZenTools",
  description: "免费在线工具名称，支持手机与电脑，无需安装软件。",
  keywords: "工具名称,在线工具,免费工具,ZenTools",
  url: "https://www.zentools.xyz/tool.html",
  image: "https://www.zentools.xyz/logo.png"
};

function setMeta(name, content){
  let meta = document.querySelector(`meta[name="${name}"]`);
  if(!meta){
    meta = document.createElement("meta");
    meta.setAttribute("name", name);
    document.head.appendChild(meta);
  }
  meta.setAttribute("content", content);
}

function setProperty(property, content){
  let meta = document.querySelector(`meta[property="${property}"]`);
  if(!meta){
    meta = document.createElement("meta");
    meta.setAttribute("property", property);
    document.head.appendChild(meta);
  }
  meta.setAttribute("content", content);
}

function setCanonical(url){
  let link = document.querySelector('link[rel="canonical"]');
  if(!link){
    link = document.createElement("link");
    link.setAttribute("rel", "canonical");
    document.head.appendChild(link);
  }
  link.setAttribute("href", url);
}

function applySEO(){
  document.title = seoData.title;

  setMeta("description", seoData.description);
  setMeta("keywords", seoData.keywords);
  setMeta("author", "ZenTools");

  setCanonical(seoData.url);

  setProperty("og:title", seoData.title);
  setProperty("og:description", seoData.description);
  setProperty("og:type", "website");
  setProperty("og:url", seoData.url);
  setProperty("og:image", seoData.image);

  setMeta("twitter:card", "summary_large_image");
  setMeta("twitter:title", seoData.title);
  setMeta("twitter:description", seoData.description);
}

applySEO();
</script>
<!-- ===== 你可能还需要 ===== -->
<div class="recommend-section" style="max-width:1200px;margin:40px auto 0;padding:0 24px;">
  <h3 style="font-size:18px;font-weight:700;margin-bottom:16px;">💡 你可能还需要</h3>
  <div id="recommendList" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px;">
    <div style="grid-column:1/-1;text-align:center;color:var(--muted);padding:20px;">加载推荐...</div>
  </div>
</div>

<script>
(function() {
  // 当前工具的分类 (从页面路径推断或手动设置)
  const currentCategory = 'PDF工具'; // 根据页面修改: PDF工具 / 图片工具 / 音频工具 等
  const currentUrl = window.location.pathname;

  fetch('/data/tools-data.json')
    .then(r => r.ok ? r.json() : Promise.reject())
    .then(data => {
      if (!data?.tools) return;
      // 筛选同分类下、且不是当前页面的工具
      const recs = data.tools.filter(t =>
        t.category === currentCategory &&
        t.url &&
        t.url !== currentUrl &&
        t.url !== '#'
      ).slice(0, 4);

      const container = document.getElementById('recommendList');
      if (!recs.length) {
        container.innerHTML = '<div style="grid-column:1/-1;text-align:center;color:var(--muted);padding:12px;">暂无更多工具</div>';
        return;
      }
      container.innerHTML = recs.map(t =>
        `<a href="${t.url}" style="background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;text-align:center;text-decoration:none;color:inherit;transition:all .2s;" onmouseover="this.style.transform='translateY(-4px)';this.style.borderColor='var(--border-hover)';" onmouseout="this.style.transform='';this.style.borderColor='';">
          <div style="font-size:28px;">${t.icon || '🔧'}</div>
          <div style="font-weight:600;font-size:14px;margin-top:6px;">${t.name}</div>
          <div style="font-size:12px;color:var(--muted);margin-top:4px;">${t.description || ''}</div>
        </a>`
      ).join('');
    })
    .catch(() => {
      document.getElementById('recommendList').innerHTML = '<div style="grid-column:1/-1;text-align:center;color:var(--muted);padding:12px;">推荐加载失败</div>';
    });
})();
</script>
</body>
</html>
