<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script><script src="../assets/js/tool-ui.min.js"></script><script>
let pdfBytes=null;
function addRow(){const t=document.getElementById('dataTable');const cols=t.rows[0]?.cells.length||3;const r=t.insertRow();for(let i=0;i<cols;i++){const c=r.insertCell();c.innerHTML='<input type="text" value=""/>';}}
function addCol(){const t=document.getElementById('dataTable');for(const r of t.rows){const c=r.insertCell();c.innerHTML='<input type="text" value=""/>';}}
async function generate(){const status=document.getElementById('status');const btn=document.getElementById('downloadBtn');if(!window.jspdf){status.textContent='⚠️ 组件加载中…';return;}
status.textContent='🔄 生成中……';btn.style.display='none';
try{const{jsPDF}=window.jspdf;const pdf=new jsPDF({orientation:'portrait',unit:'mm',format:'a4'});const t=document.getElementById('dataTable');const data=[];for(const r of t.rows){const row=[];for(const c of r.cells){row.push(c.querySelector('input')?.value||'');}data.push(row);}
if(!data.length){status.textContent='⚠️ 表格为空';btn.disabled=false;return;}
const cols=data[0].length;const pageW=190;const colW=pageW/cols;let y=20;const lineH=8;
for(const row of data){if(y>270){pdf.addPage();y=20;}
const maxH=Math.max(...row.map(t=>Math.ceil(t.length/15)*lineH+4));let x=10;row.forEach((cell,i)=>{pdf.rect(x,y,colW,maxH);pdf.setFontSize(9);const lines=cell.match(/.{1,15}/g)||[''];lines.forEach((l,li)=>{pdf.text(l,x+2,y+4+li*lineH);});x+=colW;});y+=maxH;}
pdfBytes=pdf.output('arraybuffer');status.textContent='✅ 生成完成！';btn.style.display='block';downloadResult();
}catch(err){console.error(err);status.textContent='❌ 生成失败';}}
function downloadResult(){if(!pdfBytes)return;const blob=new Blob([pdfBytes],{type:'application/pdf'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='表格数据.pdf';a.click();URL.revokeObjectURL(url);}
</script>
