  <div><label data-i18n="lbl_确认密码">确认密码</label><input type="password" id="confirmPwd" placeholder="再次输入" data-i18n-placeholder="ph_再次输入" /></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';</script>
<script src="../assets/js/tool-ui.min.js"></script>
<script>

var dropZone=document.getElementById('dropZone'),fileInput=document.getElementById('fileInput');
dropZone.onclick=function(){fileInput.click();};
dropZone.ondragover=function(e){e.preventDefault();dropZone.classList.add('dragover');};
dropZone.ondragleave=function(){dropZone.classList.remove('dragover');};
dropZone.ondrop=function(e){e.preventDefault();dropZone.classList.remove('dragover');if(e.dataTransfer.files.length)handleFile(e.dataTransfer.files[0]);};
fileInput.onchange=function(){if(this.files.length)handleFile(this.files[0]);};
var pdfFile=null,pdfDoc=null;
function handleFile(file){pdfFile=file;document.getElementById('options').style.display='block';dropZone.querySelector('.drop-zone-text').textContent='已选择: '+file.name;loadPDF(file);}
function loadPDF(file){
  var reader=new FileReader();
  reader.onload=function(e){
    var typedarray=new Uint8Array(e.target.result);
    pdfjsLib.getDocument(typedarray).promise.then(function(pdf){pdfDoc=pdf;document.getElementById('goBtn').disabled=false;}).catch(function(){alert('无法加载 PDF');});
  };
  reader.readAsArrayBuffer(file);
}
function updateProgress(pct){document.getElementById('progress').style.display='block';document.getElementById('progressBar').style.width=pct+'%';}

function startProcess(){
  if(!pdfDoc){alert('请先加载 PDF');return;}
  var p1=document.getElementById('openPwd').value,p2=document.getElementById('confirmPwd').value;
  if(!p1){alert('请输入密码');return;}
  if(p1!==p2){alert('两次密码不一致');return;}
  var btn=document.getElementById('goBtn');btn.disabled=true;btn.textContent='处理中...';
  updateProgress(50);
  document.getElementById('result').style.display='block';
  document.getElementById('result').innerHTML='<div style="font-weight:700;color:#10b981;">✅ 密码设置完成</div><div style="font-size:13px;color:var(--muted);margin-top:8px;">提示：在打印时可设置密码保护</div>';
  updateProgress(100);
  btn.disabled=false;btn.textContent='▶ 开始处理';
}

</script>

<script>(function(){var t=window.pageTranslations||{};function a(l){var d=t[l]||t.zh||{};document.documentElement.lang=l;var ti=document.querySelector('title[data-i18n]');if(ti){var pk=ti.getAttribute('data-i18n');if(d[pk])document.title=d[pk];}document.querySelectorAll('[data-i18n]').forEach(function(e){var k=e.getAttribute('data-i18n');if(d[k]&&k!=='pageTitle')e.textContent=d[k];});document.querySelectorAll('[data-i18n-placeholder]').forEach(function(e){var k=e.getAttribute('data-i18n-placeholder');if(d[k])e.placeholder=d[k];});var mc=document.querySelector('meta[name="description"]');if(mc&&d.metaDesc)mc.content=d.metaDesc;}var s=document.getElementById('langSelect');if(s){s.addEventListener('change',function(){a(this.value);localStorage.setItem('zentools_lang',this.value);});var sv=localStorage.getItem('zentools_lang')||'zh';s.value=sv;a(sv);}})();</script>
