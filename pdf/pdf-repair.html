    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        const uploadZone = document.getElementById('uploadZone');
        const fileInput = document.getElementById('fileInput');
        const resultArea = document.getElementById('resultArea');
        const resultStatus = document.getElementById('resultStatus');
        const resultInfo = document.getElementById('resultInfo');
        const downloadBtn = document.getElementById('downloadBtn');

        uploadZone.addEventListener('click', () => fileInput.click());
        uploadZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadZone.classList.add('drag-over');
        });
        uploadZone.addEventListener('dragleave', () => {
            uploadZone.classList.remove('drag-over');
        });
        uploadZone.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadZone.classList.remove('drag-over');
            const file = e.dataTransfer.files[0];
            if (file && file.type === 'application/pdf') {
                repairPdf(file);
            }
        });
        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) repairPdf(file);
        });

        async function repairPdf(file) {
            resultArea.style.display = 'block';
            resultStatus.className = 'result-status loading';
            resultStatus.textContent = '正在分析 PDF 文件结构...';
            resultInfo.innerHTML = '';
            downloadBtn.style.display = 'none';

            try {
                const arrayBuffer = await file.arrayBuffer();
                
                let pdfDoc;
                try {
                    pdfDoc = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
                } catch (e) {
                    resultStatus.textContent = '检测到 PDF 文件可能损坏，正在尝试修复...';
                    
                    const fixedBuffer = await attemptRepair(arrayBuffer);
                    
                    if (fixedBuffer) {
                        pdfDoc = await pdfjsLib.getDocument({ data: fixedBuffer }).promise;
                        
                        resultStatus.className = 'result-status success';
                        resultStatus.textContent = '✅ PDF 修复成功！';
                        resultInfo.innerHTML = `
                            <p>修复后文件包含 ${pdfDoc.numPages} 页</p>
                            <p>文件大小: ${(fixedBuffer.byteLength / 1024).toFixed(2)} KB</p>
                        `;
                        
                        const blob = new Blob([fixedBuffer], { type: 'application/pdf' });
                        const url = URL.createObjectURL(blob);
                        downloadBtn.onclick = () => {
                            const a = document.createElement('a');
                            a.href = url;
                            a.download = 'repaired_' + file.name;
                            a.click();
                        };
                        downloadBtn.style.display = 'inline-block';
                    } else {
                        resultStatus.className = 'result-status error';
                        resultStatus.textContent = '❌ 无法修复此 PDF 文件';
                        resultInfo.innerHTML = '<p>文件可能严重损坏，建议使用专业 PDF 修复工具。</p>';
                    }
                }

                if (pdfDoc) {
                    resultStatus.className = 'result-status success';
                    resultStatus.textContent = '✅ PDF 文件结构正常';
                    resultInfo.innerHTML = `
                        <p>页数: ${pdfDoc.numPages}</p>
                        <p>此 PDF 文件无需修复</p>
                    `;
                }
            } catch (error) {
                resultStatus.className = 'result-status error';
                resultStatus.textContent = '❌ 文件处理失败';
                resultInfo.innerHTML = `<p>错误信息: ${error.message}</p>`;
            }
        }

        async function attemptRepair(arrayBuffer) {
            try {
                const text = new TextDecoder().decode(arrayBuffer);
                
                if (!text.startsWith('%PDF')) {
                    const pdfHeaderIndex = text.indexOf('%PDF-');
                    if (pdfHeaderIndex > 0) {
                        const fixedText = text.substring(pdfHeaderIndex);
                        return new TextEncoder().encode(fixedText).buffer;
                    }
                }

                const pdfDoc = await PDFLib.PDFDocument.create();
                
                try {
                    const original = await PDFLib.PDFDocument.load(arrayBuffer);
                    const pageIndices = original.getPageIndices();
                    for (const idx of pageIndices) {
                        const [copiedPage] = await pdfDoc.copyPages(original, [idx]);
                        pdfDoc.addPage(copiedPage);
                    }
                    return await pdfDoc.save();
                } catch (e) {
                    console.log('Direct load failed, trying text extraction...');
                }

                return null;
            } catch (e) {
                console.error('Repair failed:', e);
                return null;
            }
        }

        i18n.init({ defaultLang: 'zh', supportedLangs: ['zh', 'en', 'ja', 'vi'] });
    </script>

<script>
// 暗黑模式切换
(function() {
  var savedTheme = localStorage.getItem('zentools_theme');
  if (savedTheme === 'dark') document.documentElement.classList.add('dark');
  var btn = document.getElementById('themeToggle');
  if (btn) {
    btn.textContent = document.documentElement.classList.contains('dark') ? '☀️' : '🌙';
    btn.addEventListener('click', function() {
      document.documentElement.classList.toggle('dark');
      var isDark = document.documentElement.classList.contains('dark');
      this.textContent = isDark ? '☀️' : '🌙';
      localStorage.setItem('zentools_theme', isDark ? 'dark' : 'light');
    });
  }
})();

// 移动端侧滑
(function() {
  var overlay = document.getElementById('mobileOverlay');
  var hamBtn = document.getElementById('hamburgerBtn');
  var closeBtn = document.getElementById('mobileClose');
  if (!hamBtn || !overlay) return;
  function closeMenu() { overlay.classList.remove('open'); hamBtn.textContent = '☰'; document.body.style.overflow = ''; }
  hamBtn.addEventListener('click', function(e) {
    e.stopPropagation();
    if (overlay.classList.contains('open')) { closeMenu(); } else {
      overlay.classList.add('open'); hamBtn.textContent = '✕'; document.body.style.overflow = 'hidden';
    }
  });
  if (closeBtn) closeBtn.addEventListener('click', closeMenu);
  overlay.addEventListener('click', function(e) {
    var drawer = document.getElementById('mobileDrawer');
    if (drawer && !drawer.contains(e.target)) closeMenu();
  });
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape' && overlay.classList.contains('open')) closeMenu();
  });
})();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', function() {
    navigator.serviceWorker.register('/sw.js').catch(function() {});
  });
}
</script>
