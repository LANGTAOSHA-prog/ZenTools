    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        const uploadZone = document.getElementById('uploadZone');
        const fileInput = document.getElementById('fileInput');
        const settingsPanel = document.getElementById('settingsPanel');
        const actionArea = document.getElementById('actionArea');
        const resultArea = document.getElementById('resultArea');
        const resultStatus = document.getElementById('resultStatus');
        const previewComparison = document.getElementById('previewComparison');
        const originalCanvas = document.getElementById('originalCanvas');
        const convertedCanvas = document.getElementById('convertedCanvas');
        const downloadBtn = document.getElementById('downloadBtn');
        const methodSelect = document.getElementById('methodSelect');
        const thresholdGroup = document.getElementById('thresholdGroup');
        const thresholdSlider = document.getElementById('thresholdSlider');
        const thresholdValue = document.getElementById('thresholdValue');

        let pdfDoc = null;
        let originalArrayBuffer = null;

        uploadZone.addEventListener('click', () => fileInput.click());
        uploadZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadZone.classList.add('drag-over');
        });
        uploadZone.addEventListener('dragleave', () => {
            uploadZone.classList.remove('drag-over');
        });
        uploadZone.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadZone.classList.remove('drag-over');
            const file = e.dataTransfer.files[0];
            if (file && file.type === 'application/pdf') {
                loadPdf(file);
            }
        });
        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) loadPdf(file);
        });

        methodSelect.addEventListener('change', () => {
            thresholdGroup.style.display = methodSelect.value === 'threshold' || methodSelect.value === 'dither' ? 'block' : 'none';
        });

        thresholdSlider.addEventListener('input', () => {
            thresholdValue.textContent = thresholdSlider.value;
        });

        async function loadPdf(file) {
            originalArrayBuffer = await file.arrayBuffer();
            pdfDoc = await pdfjsLib.getDocument({ data: originalArrayBuffer }).promise;
            settingsPanel.style.display = 'block';
            actionArea.style.display = 'block';
        }

        document.getElementById('convertBtn').addEventListener('click', async () => {
            resultArea.style.display = 'block';
            resultStatus.className = 'result-status loading';
            resultStatus.textContent = '正在转换...';
            previewComparison.style.display = 'none';

            try {
                const method = methodSelect.value;
                const threshold = parseInt(thresholdSlider.value);
                const preserveText = document.getElementById('preserveTextCheck').checked;
                const compress = document.getElementById('compressCheck').checked;

                const page = await pdfDoc.getPage(1);
                const viewport = page.getViewport({ scale: 0.5 });
                
                originalCanvas.width = viewport.width;
                originalCanvas.height = viewport.height;
                await page.render({ canvasContext: originalCanvas.getContext('2d'), viewport: viewport }).promise;

                const grayscaleData = convertToGrayscale(originalCanvas, method, threshold, preserveText);
                convertedCanvas.width = viewport.width;
                convertedCanvas.height = viewport.height;
                convertedCanvas.getContext('2d').putImageData(grayscaleData, 0, 0);

                previewComparison.style.display = 'grid';

                const pdfLibDoc = await PDFLib.PDFDocument.load(originalArrayBuffer);
                const pageCount = pdfLibDoc.getPages().length;

                for (let i = 0; i < pageCount; i++) {
                    const page = await pdfDoc.getPage(i + 1);
                    const fullViewport = page.getViewport({ scale: 1 });
                    
                    const fullCanvas = document.createElement('canvas');
                    fullCanvas.width = fullViewport.width;
                    fullCanvas.height = fullViewport.height;
                    await page.render({ canvasContext: fullCanvas.getContext('2d'), viewport: fullViewport }).promise;
                    
                    const grayscaleImageData = convertToGrayscale(fullCanvas, method, threshold, preserveText);
                    
                    const { width, height } = pdfLibDoc.getPages()[i].getSize();
                    const grayscalePage = pdfLibDoc.addPage([width, height]);
                    
                    const pngUrl = grayscaleImageDataToPng(grayscaleImageData);
                    const pngBytes = await fetch(pngUrl).then(r => r.arrayBuffer());
                    const image = await pdfLibDoc.embedPng(pngBytes);
                    
                    grayscalePage.drawImage(image, {
                        x: 0,
                        y: 0,
                        width: width,
                        height: height,
                    });
                }

                let modifiedPdf;
                if (compress) {
                    modifiedPdf = await pdfLibDoc.save({ useObjectStreams: true });
                } else {
                    modifiedPdf = await pdfLibDoc.save();
                }

                const blob = new Blob([modifiedPdf], { type: 'application/pdf' });
                const url = URL.createObjectURL(blob);

                resultStatus.className = 'result-status success';
                resultStatus.textContent = `✅ 转换完成！文件大小减少约 ${((1 - blob.size / originalArrayBuffer.byteLength) * 100).toFixed(1)}%`;
                
                downloadBtn.onclick = () => {
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = 'grayscale_' + (uploadZone.dataset.filename || 'document.pdf');
                    a.click();
                };
            } catch (error) {
                resultStatus.className = 'result-status error';
                resultStatus.textContent = `❌ 转换失败: ${error.message}`;
            }
        });

        function convertToGrayscale(canvas, method, threshold, preserveText) {
            const ctx = canvas.getContext('2d');
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imageData.data;

            for (let i = 0; i < data.length; i += 4) {
                const r = data[i];
                const g = data[i + 1];
                const b = data[i + 2];

                let gray;
                switch (method) {
                    case 'grayscale':
                        gray = 0.299 * r + 0.587 * g + 0.114 * b;
                        break;
                    case 'threshold':
                        gray = (0.299 * r + 0.587 * g + 0.114 * b) > threshold ? 255 : 0;
                        break;
                    case 'dither':
                        gray = 0.299 * r + 0.587 * g + 0.114 * b;
                        break;
                    default:
                        gray = 0.299 * r + 0.587 * g + 0.114 * b;
                }

                if (preserveText && method !== 'threshold') {
                    if (r < 100 && g < 100 && b < 100) {
                        gray = 0;
                    } else if (r > 200 && g > 200 && b > 200) {
                        gray = 255;
                    }
                }

                data[i] = gray;
                data[i + 1] = gray;
                data[i + 2] = gray;
            }

            return imageData;
        }

        function grayscaleImageDataToPng(imageData) {
            const canvas = document.createElement('canvas');
            canvas.width = imageData.width;
            canvas.height = imageData.height;
            canvas.getContext('2d').putImageData(imageData, 0, 0);
            return canvas.toDataURL('image/png');
        }

        i18n.init({ defaultLang: 'zh', supportedLangs: ['zh', 'en', 'ja', 'vi'] });
    </script>

<script>
// 暗黑模式切换
(function() {
  var savedTheme = localStorage.getItem('zentools_theme');
  if (savedTheme === 'dark') document.documentElement.classList.add('dark');
  var btn = document.getElementById('themeToggle');
  if (btn) {
    btn.textContent = document.documentElement.classList.contains('dark') ? '☀️' : '🌙';
    btn.addEventListener('click', function() {
      document.documentElement.classList.toggle('dark');
      var isDark = document.documentElement.classList.contains('dark');
      this.textContent = isDark ? '☀️' : '🌙';
      localStorage.setItem('zentools_theme', isDark ? 'dark' : 'light');
    });
  }
})();

// 移动端侧滑
(function() {
  var overlay = document.getElementById('mobileOverlay');
  var hamBtn = document.getElementById('hamburgerBtn');
  var closeBtn = document.getElementById('mobileClose');
  if (!hamBtn || !overlay) return;
  function closeMenu() { overlay.classList.remove('open'); hamBtn.textContent = '☰'; document.body.style.overflow = ''; }
  hamBtn.addEventListener('click', function(e) {
    e.stopPropagation();
    if (overlay.classList.contains('open')) { closeMenu(); } else {
      overlay.classList.add('open'); hamBtn.textContent = '✕'; document.body.style.overflow = 'hidden';
    }
  });
  if (closeBtn) closeBtn.addEventListener('click', closeMenu);
  overlay.addEventListener('click', function(e) {
    var drawer = document.getElementById('mobileDrawer');
    if (drawer && !drawer.contains(e.target)) closeMenu();
  });
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape' && overlay.classList.contains('open')) closeMenu();
  });
})();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', function() {
    navigator.serviceWorker.register('/sw.js').catch(function() {});
  });
}
</script>
