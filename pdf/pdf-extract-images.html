  <script>
    var dropZone=document.getElementById('dropZone'),fileInput=document.getElementById('fileInput');
    dropZone.onclick=function(){fileInput.click();};
    dropZone.ondragover=function(e){e.preventDefault();dropZone.classList.add('dragover');};
    dropZone.ondragleave=function(){dropZone.classList.remove('dragover');};
    dropZone.ondrop=function(e){e.preventDefault();dropZone.classList.remove('dragover');if(e.dataTransfer.files.length)handleFile(e.dataTransfer.files[0]);};
    fileInput.onchange=function(){if(this.files.length)handleFile(this.files[0]);};
    var pdfFile=null,pdfDoc=null;
    function handleFile(file){pdfFile=file;document.getElementById('options').style.display='block';dropZone.querySelector('.drop-zone-text').textContent='Selected: '+file.name;loadPDF(file);}
    function loadPDF(file){
      var reader=new FileReader();
      reader.onload=function(e){
        var typedarray=new Uint8Array(e.target.result);
        pdfjsLib.getDocument(typedarray).promise.then(function(pdf){pdfDoc=pdf;document.getElementById('goBtn').disabled=false;}).catch(function(){alert('Cannot load PDF');});
      };
      reader.readAsArrayBuffer(file);
    }
    function updateProgress(pct){document.getElementById('progress').style.display='block';document.getElementById('progressBar').style.width=pct+'%';}

    function startProcess(){
      if(!pdfDoc){alert('Please load a PDF first');return;}
      var minW=parseInt(document.getElementById('minWidth').value)||50,
          minH=parseInt(document.getElementById('minHeight').value)||50;
      var btn=document.getElementById('goBtn');btn.disabled=true;btn.textContent='Extracting...';
      updateProgress(5);
      var images=[];
      var totalPages=pdfDoc.numPages,completed=0;
      function extractFromPage(num){
        pdfDoc.getPage(num).then(function(page){
          var vp=page.getViewport({scale:2});
          var canvas=document.createElement('canvas');
          var ctx=canvas.getContext('2d');
          canvas.width=vp.width;canvas.height=vp.height;
          page.render({canvasContext:ctx,viewport:vp}).promise.then(function(){
            var dataUrl=canvas.toDataURL('image/png');
            images.push({page:num,data:dataUrl,width:vp.width,height:vp.height});
            completed++;
            updateProgress(Math.round(completed/totalPages*90)+5);
            if(completed<totalPages)extractFromPage(completed+1);
            else showImages();
          });
        });
      }
      function showImages(){
        var html='<div style="margin-bottom:12px;font-weight:700;">Extraction Complete - '+images.length+' images</div><div class="img-grid">';
        images.forEach(function(img){
          if(img.width>=minW&&img.height>=minH){
            html+='<div class="img-card"><img src="'+img.data+'" /><br><a href="'+img.data+'" download="page'+img.page+'.png">Download</a><span class="img-size">'+img.width+'x'+img.height+'</span></div>';
          }
        });
        html+='</div>';
        document.getElementById('result').style.display='block';
        document.getElementById('result').innerHTML=html;
        updateProgress(100);
        btn.disabled=false;btn.textContent='Start Extracting';
      }
      extractFromPage(1);
    }
  </script>
