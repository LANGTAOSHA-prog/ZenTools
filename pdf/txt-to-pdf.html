<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="../assets/js/tool-ui.js"></script>
<script>
let pdfBytes=null;
document.getElementById("txtFile").addEventListener("change",function(){
  if(!this.files[0])return;const r=new FileReader();
  r.onload=function(e){document.getElementById("txtContent").value=e.target.result;};
  r.readAsText(this.files[0]);
});
async function txtToPdf(){
  const text=document.getElementById("txtContent").value.trim();
  const status=document.getElementById("status");const btn=document.getElementById("downloadBtn");
  if(!text){status.textContent="⚠️ 请输入文本内容";return;}
  if(!window.jspdf){status.textContent="⚠️ 组件加载中，请稍候…";return;}
  status.textContent="🔄 正在生成 PDF……";btn.style.display="none";
  try{
    const{jsPDF}=window.jspdf;const pdf=new jsPDF({orientation:'portrait',unit:'mm',format:'a4'});
    const pageW=190;const margin=10;let y=margin;const lineH=6;
    const lines=text.split('\n');
    for(const line of lines){
      if(y>280){pdf.addPage();y=margin;}
      // Handle long lines by splitting
      const maxChars=Math.floor(pageW/3.5);
      for(let i=0;i<line.length;i+=maxChars){
        if(y>280){pdf.addPage();y=margin;}
        pdf.text(line.substring(i,i+maxChars),margin,y);
        y+=lineH;
      }
    }
    pdfBytes=pdf.output('arraybuffer');
    status.textContent="✅ PDF 已生成！";
    btn.style.display="block";downloadResult();
  }catch(err){console.error(err);status.textContent="❌ 生成失败";}
}
function downloadResult(){if(!pdfBytes)return;const blob=new Blob([pdfBytes],{type:"application/pdf"});const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download="ZenTools-文本转PDF.pdf";a.click();URL.revokeObjectURL(url);}
</script>
