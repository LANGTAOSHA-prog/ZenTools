<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><title>PDF转PPT - 免费在线工具 | ZenTools</title><meta name="description" content="将 PDF 页面导出为 PNG 图片，方便插入 PowerPoint，免费在线使用。"/><link rel="canonical" href="https://langtaosha-prog.github.io/ZenTools/pdf/pdf-to-ppt.html"/><link rel="stylesheet" href="../assets/css/tool-ui.css"/><style>.preview-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:16px}.preview-item{background:rgba(255,255,255,0.03);border:1px solid var(--border);border-radius:10px;padding:10px;text-align:center}.preview-item canvas{width:100%;height:auto;border-radius:6px}.preview-item .page-label{font-size:11px;color:var(--muted);margin-top:6px}.preview-item .dl-btn{display:block;margin-top:6px;padding:4px 10px;border-radius:6px;border:1px solid var(--border);background:var(--glass);color:var(--cyan);cursor:pointer;font-size:11px}.preview-item .dl-btn:hover{background:var(--glass-b)}.download-btn{display:none;margin-top:20px;padding:14px 32px;border-radius:12px;border:none;background:linear-gradient(135deg,var(--purple),var(--pink));color:#fff;font-size:16px;font-weight:700;cursor:pointer}.download-btn:hover{opacity:.9;transform:translateY(-2px)}</style></head><body>

<script>
window.ZT_PAGE={zh:{crumbCur:'PDF 转 PPT',eyebrow:'PDF 工具',h1Grad:'PDF 导出为图片',h1Sub:'转 PNG 插入 PPT',pageDesc:'将 PDF 的每一页转换为 PNG 图片，方便插入 PowerPoint 或其他文档。',toolTitle:'选择 PDF 文件',toolNote:'选择一个 PDF 文件，自动预览并下载每页图片。',exportBtn:'导出为图片',statusWorking:'🔄 导出中…',statusComplete:'✅ 导出完成！共 {n} 页',statusError:'❌ 导出失败',alertNoFile:'⚠️ 请先选择 PDF 文件',pageLabel:'第 {n} 页',dlLabel:'下载'},
en:{crumbCur:'PDF to PPT',h1Grad:'PDF to Images',h1Sub:'Export as PNG for PPT',pageDesc:'Convert each PDF page to PNG images for PowerPoint.',exportBtn:'Export as Images',statusWorking:'🔄 Exporting…',statusComplete:'✅ Done! {n} pages',alertNoFile:'⚠️ Select a PDF',pageLabel:'Page {n}',dlLabel:'Download'},

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
let pageCanvases=[];function getDict(){const l=localStorage.getItem('zentools_lang')||'zh';return(window.ZT_PAGE||{})[l]||window.ZT_PAGE.zh;}
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
async function exportPages(){const file=document.getElementById('pdfInput').files[0];const status=document.getElementById('status');const grid=document.getElementById('previewGrid');const dict=getDict();
if(!file){status.textContent=dict.alertNoFile;return;}
status.textContent=dict.statusWorking;grid.innerHTML='';pageCanvases=[];
try{const buffer=await file.arrayBuffer();const pdf=await pdfjsLib.getDocument({data:buffer}).promise;const total=pdf.numPages;const scale=1.5;
for(let i=1;i<=total;i++){const page=await pdf.getPage(i);const vp=page.getViewport({scale});const canvas=document.createElement('canvas');canvas.width=vp.width;canvas.height=vp.height;const ctx=canvas.getContext('2d');await page.render({canvasContext:ctx,viewport:vp}).promise;
pageCanvases.push(canvas);
const div=document.createElement('div');div.className='preview-item';const thumb=canvas.cloneNode(true);thumb.style.maxWidth='100%';const label=document.createElement('div');label.className='page-label';label.textContent=dict.pageLabel.replace('{n}',i);const dlBtn=document.createElement('button');dlBtn.className='dl-btn';dlBtn.textContent=dict.dlLabel;dlBtn.onclick=function(){const lnk=document.createElement('a');lnk.download=`page_${i}.png`;lnk.href=canvas.toDataURL('image/png');lnk.click();};
div.appendChild(thumb);div.appendChild(label);div.appendChild(dlBtn);grid.appendChild(div);status.textContent=dict.statusWorking+` ${i}/${total}`;}
status.textContent=dict.statusComplete.replace('{n}',total);
}catch(err){console.error(err);status.textContent=dict.statusError;}}
</script></body></html>
