window.ZT_PAGE={zh:{crumbCur:'Markdown 转 PDF',eyebrow:'PDF 工具',h1Grad:'Markdown 转 PDF',h1Sub:'MD 渲染为 PDF',pageDesc:'将 Markdown 格式文本渲染为 PDF 文档，支持标题、列表、代码块、引用等。',toolTitle:'输入 Markdown',toolNote:'粘贴 Markdown 内容，点击生成 PDF。',mdHint:'支持：标题 # / 粗体 ** / 斜体 * / 列表 - / 代码 ` / 引用 >',genBtn:'生成 PDF',downloadBtn:'📥 下载 PDF',statusWorking:'🔄 生成中……',statusComplete:'✅ 生成完成！',statusError:'❌ 生成失败',alertNoContent:'⚠️ 请输入 Markdown 内容'},
en:{crumbCur:'Markdown to PDF',h1Grad:'Markdown to PDF',h1Sub:'Render MD to PDF',pageDesc:'Convert Markdown text to a formatted PDF document.',toolTitle:'Enter Markdown',mdHint:'Supports: # headings / **bold** / *italic* / - lists / `code` / > quotes',genBtn:'Generate PDF',downloadBtn:'📥 Download PDF',statusWorking:'🔄 Generating…',statusComplete:'✅ Done!',alertNoContent:'⚠️ Enter Markdown content'},
ja:{crumbCur:'MarkdownからPDF',h1Grad:'Markdown→PDF',genBtn:'PDF生成',downloadBtn:'📥 PDFをダウンロード',statusWorking:'🔄 生成中…',statusComplete:'✅ 完了！'},
vi:{crumbCur:'Markdown sang PDF',h1Grad:'Markdown→PDF',genBtn:'Tạo PDF',downloadBtn:'📥 Tải PDF',statusWorking:'🔄 Đang tạo…',statusComplete:'✅ Hoàn tất!'}

</script><script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script><script src="../assets/js/tool-ui.js"></script><script>
let pdfBytes=null;function getDict(){const l=localStorage.getItem('zentools_lang')||'zh';return(window.ZT_PAGE||{})[l]||window.ZT_PAGE.zh;}
async function generate(){const text=document.getElementById('mdInput').value;const status=document.getElementById('status');const btn=document.getElementById('downloadBtn');const dict=getDict();if(!text.trim()){status.textContent=dict.alertNoContent;return;}
if(!window.jspdf){status.textContent='⚠️ 组件加载中…';return;}
status.textContent=dict.statusWorking;btn.style.display='none';
try{const{jsPDF}=window.jspdf;const pdf=new jsPDF({orientation:'portrait',unit:'mm',format:'a4'});const pw=190;let y=10;const lines=text.split('\n');
for(const line of lines){if(y>280){pdf.addPage();y=10;}
const trimmed=line.trim();if(trimmed.startsWith('### ')){pdf.setFontSize(13);pdf.setFont(undefined,'bold');pdf.text(trimmed.slice(4),10,y);y+=7;}
else if(trimmed.startsWith('## ')){pdf.setFontSize(16);pdf.setFont(undefined,'bold');pdf.text(trimmed.slice(3),10,y);y+=8;}
else if(trimmed.startsWith('# ')){pdf.setFontSize(20);pdf.setFont(undefined,'bold');pdf.text(trimmed.slice(2),10,y);y+=9;}
else if(trimmed.startsWith('> ')){pdf.setFontSize(11);pdf.setFont(undefined,'italic');pdf.setTextColor(100);pdf.text('│ '+trimmed.slice(2),10,y);y+=6;pdf.setTextColor(0);pdf.setFont(undefined,'normal');}
else if(trimmed.startsWith('- ')||trimmed.startsWith('* ')){pdf.setFontSize(11);pdf.text('• '+trimmed.slice(2),13,y);y+=6;}
else if(trimmed.startsWith('---')||trimmed.startsWith('***')){pdf.setDrawColor(100);pdf.line(10,y,pw,y);y+=5;}
else if(line.trim()===''){y+=4;}
else{pdf.setFontSize(11);pdf.setFont(undefined,'normal');// Handle inline formatting
let t=trimmed.replace(/\*\*(.+?)\*\*/g,'$1').replace(/\*(.+?)\*/g,'$1').replace(/`(.+?)`/g,'$1');pdf.text(t,10,y);y+=6;}}
pdfBytes=pdf.output('arraybuffer');status.textContent=dict.statusComplete;btn.style.display='block';downloadResult();
}catch(err){console.error(err);status.textContent=dict.statusError;}}
function downloadResult(){if(!pdfBytes)return;const blob=new Blob([pdfBytes],{type:'application/pdf'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='markdown-output.pdf';a.click();URL.revokeObjectURL(url);}
</script></body></html>
