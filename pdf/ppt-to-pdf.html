try{const{jsPDF}=window.jspdf;const pdf=new jsPDF({orientation:'landscape',unit:'mm',format:'a4'});const pw=277;const ph=180;let first=true;

pdf.setFontSize(13);let y=55;const maxChars=Math.floor((pw-40)/3.3);const lines=content.split('\n');for(const line of lines){if(y>ph-15){pdf.addPage();y=30;first=false;}
