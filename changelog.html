<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title data-i18n="pageTitle">更新日志 - ZenTools</title>
<meta name="description" content="ZenTools 版本更新历史，追踪功能更新、改进和修复。免费在线使用，浏览器本地运行，无需安装、无需上传文件，保护隐私安全。ZenTools 提供数百款实用在线工具。" data-i18n-placeholder="metaDesc" />
<link rel="canonical" href="https://zentools.xyz/changelog.html"/>
<link rel="manifest" href="/manifest.json" />
<meta name="theme-color" content="#0066FF" />
<link rel="stylesheet" href="assets/css/tool-ui.min.css">
<script src="assets/js/anti-crash.min.js" defer></script>
<style>
:root {
  --zen-primary: #0066FF;
  --zen-secondary: #00C2B8;
  --zen-gradient: linear-gradient(135deg, #0066FF, #00C2B8);
  --zen-text-main: #111827;
  --zen-text-sub: #4B5563;
  --zen-text-placeholder: #9CA3AF;
  --zen-bg-base: #F9FAFB;
  --zen-bg-card: #FFFFFF;
  --zen-border: #E5E7EB;
  --zen-radius-base: 12px;
  --zen-radius-card: 16px;
  --zen-radius-btn: 8px;
}
.dark {
  --zen-text-main: #F9FAFB;
  --zen-text-sub: #D1D5DB;
  --zen-text-placeholder: #64748B;
  --zen-bg-base: #0F172A;
  --zen-bg-card: #1E293B;
  --zen-border: #334155;
}

*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Inter,"Source Han Sans SC",PingFang SC,Microsoft YaHei,system-ui,sans-serif;background:var(--zen-bg-base);color:var(--zen-text-main);line-height:1.5;transition:background .35s,color .35s;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
.container{width:100%;max-width:1200px;margin:0 auto;padding:0 24px}

/* Nav */
.site-nav{position:fixed;top:0;left:0;width:100%;z-index:999;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);background:rgba(255,255,255,.75);border-bottom:1px solid var(--zen-border);transition:background .3s}
.dark .site-nav{background:rgba(15,23,42,.75)}
.nav-inner{height:70px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.brand-logo{display:flex;align-items:center;gap:8px;font-size:22px;font-weight:700;flex-shrink:0}
.logo-icon { width: 36px; height: 36px; border-radius: 50%; background: var(--zen-gradient); object-fit: contain; padding: 6px; box-sizing: border-box; }
.logo-text-blue{color:var(--zen-primary)}
.logo-text-teal{color:var(--zen-secondary)}
.logo-ver{font-size:11px;color:var(--zen-text-placeholder);font-weight:400;margin-left:2px}
.nav-links{display:flex;align-items:center;gap:6px;flex:1;justify-content:flex-end}
.nav-links a,.nav-trigger{padding:8px 14px;border-radius:var(--zen-radius-btn);font-size:14px;font-weight:500;color:var(--zen-text-sub);cursor:pointer;transition:color .2s,background .2s;background:0 0;border:none;font-family:inherit}
.nav-links a:hover,.nav-trigger:hover{color:var(--zen-text-main);background:rgba(0,0,0,.04)}
.dark .nav-links a:hover,.dark .nav-trigger:hover{background:rgba(255,255,255,.06)}
.nav-links a.active{color:var(--zen-primary);font-weight:600}
.hamburger,.theme-toggle,.lang-select{all:unset;display:inline-flex;align-items:center;justify-content:center;padding:8px 12px;border-radius:var(--zen-radius-btn);font-size:14px;font-weight:500;color:var(--zen-text-sub);cursor:pointer;transition:background .2s}
.hamburger:hover,.theme-toggle:hover{background:rgba(0,0,0,.04)}
.dark .hamburger:hover,.dark .theme-toggle:hover{background:rgba(255,255,255,.06)}
.lang-select{font-family:inherit;font-size:13px}
.hamburger{display:none}

/* Mobile drawer */
.mobile-overlay{position:fixed;inset:0;z-index:300;background:rgba(0,0,0,.7);backdrop-filter:blur(8px);opacity:0;visibility:hidden;transition:opacity .3s,visibility .3s}
.mobile-overlay.open{opacity:1;visibility:visible}
.mobile-drawer{position:fixed;top:0;right:0;bottom:0;width:300px;max-width:85vw;background:rgba(249,250,251,.97);border-left:1px solid var(--zen-border);padding:24px 20px;z-index:310;overflow-y:auto;transform:translateX(100%);transition:transform .3s;backdrop-filter:blur(24px)}
.dark .mobile-drawer{background:rgba(15,23,42,.97)}
.mobile-overlay.open .mobile-drawer{transform:translateX(0)}
.mobile-drawer .close-btn{display:flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:var(--zen-radius-btn);border:1px solid var(--zen-border);background:0 0;color:var(--zen-text-sub);cursor:pointer;font-size:18px;margin-bottom:20px;margin-left:auto}
.mobile-drawer .close-btn:hover{background:rgba(0,0,0,.04)}
.dark .mobile-drawer .close-btn:hover{background:rgba(255,255,255,.06)}
.mobile-drawer a{display:block;padding:12px 16px;border-radius:var(--zen-radius-btn);font-size:16px;font-weight:500;color:var(--zen-text-sub);transition:color .2s,background .2s}
.mobile-drawer a:hover{color:var(--zen-text-main);background:rgba(0,0,0,.04)}
.dark .mobile-drawer a:hover{background:rgba(255,255,255,.06)}

/* Hero */
.page-hero{padding-top:150px;padding-bottom:40px;text-align:center;position:relative;overflow:hidden}
.hero-bg{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 60% 50% at 30% 20%,rgba(0,102,255,.05) 0%,transparent 50%),radial-gradient(ellipse 50% 40% at 70% 70%,rgba(0,194,184,.04) 0%,transparent 50%)}
.hero-tag{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:600;color:var(--zen-text-placeholder);letter-spacing:2px;margin-bottom:24px}
.tag-dot{width:6px;height:6px;background:var(--zen-primary);border-radius:50%}
.page-hero h1{font-size:clamp(36px,6vw,56px);font-weight:800;letter-spacing:-2px;line-height:1.1;margin-bottom:16px}
.hero-gradient-text{background:var(--zen-gradient);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero-sub{font-size:17px;color:var(--zen-text-sub);line-height:1.7;max-width:560px;margin:0 auto 28px}

/* Content */
.page-content{max-width:800px;margin:0 auto;padding:0 24px 80px}
.page-content .subtitle{color:var(--zen-text-sub);font-size:14px;margin-bottom:32px;text-align:center}
.ver-block{border:1px solid var(--zen-border);border-radius:var(--zen-radius-card);padding:28px;margin-bottom:20px;background:var(--zen-bg-card)}
.ver-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.ver-head .tag{font-size:20px;font-weight:800;color:var(--zen-primary)}
.ver-head .date{font-size:13px;color:var(--zen-text-placeholder)}
.ver-head .badge{font-size:11px;background:rgba(0,102,255,.1);color:var(--zen-primary);padding:2px 10px;border-radius:20px;font-weight:600}
.ver-desc{font-size:14px;color:var(--zen-text-sub);margin-bottom:12px;line-height:1.7}
.ver-items{padding-left:20px;margin:0}
.ver-items li{color:var(--zen-text-sub);line-height:1.8;margin-bottom:4px;font-size:14px}
.ver-items li::marker{color:var(--zen-primary)}
.current-badge{display:inline-block;background:var(--zen-gradient);color:#fff;padding:3px 12px;border-radius:20px;font-size:11px;font-weight:700}

/* Footer */
footer{border-top:1px solid var(--zen-border);padding:36px 0;text-align:center}
.footer-inner{max-width:1200px;margin:0 auto;padding:0 24px}
.footer-logo{font-size:18px;font-weight:700;margin-bottom:12px;background:var(--zen-gradient);-webkit-background-clip:text;background-clip:text;color:transparent}
.footer-links{display:flex;justify-content:center;gap:20px;flex-wrap:wrap;margin-bottom:14px;font-size:13px}
.footer-links a{color:var(--zen-text-sub);transition:color .2s}
.footer-links a:hover{color:var(--zen-primary)}
.footer-copy{font-size:13px;color:var(--zen-text-placeholder)}

@media(max-width:768px){
  .nav-links a:not(.hamburger):not(.theme-toggle):not(.lang-select){display:none}
  .hamburger{display:inline-flex}
  .page-hero{padding-top:120px}
  .page-hero h1{font-size:clamp(30px,7vw,40px)}
  .ver-block{padding:20px}
}
@media(max-width:480px){
  .container{padding:0 16px}
  .nav-inner{height:60px;gap:8px}
  .brand-logo{font-size:18px;gap:6px}
  .logo-icon { width: 30px; height: 30px; object-fit: contain; padding: 5px; box-sizing: border-box; }
  .logo-ver{font-size:10px}
  .page-hero{padding-top:100px}
}
</style>
</head>
<body>

<div class="z-wrap">

  <nav class="site-nav">
    <div class="container nav-inner">
      <div class="brand-logo">
        <img src="/favicon.svg" class="logo-icon" alt="ZenTools">
        <div><span class="logo-text-blue">Zen</span><span class="logo-text-teal">Tools</span><span class="logo-ver">3.2</span></div>
      </div>
      <div class="nav-links">
        <a href="/" data-i18n="navHome">首页</a>
        <a href="/tools.html" data-i18n="navTools">工具箱</a>
        <a href="/tutorials/" data-i18n="navArticles">教程中心</a>
        <a href="/guides/" data-i18n="navGuides">深度指南</a>
        <a href="/professions.html" data-i18n="navProfessions">职业工具</a>
        <a href="/my.html" data-i18n="navMy">用户中心</a>
        <a href="/about.html" data-i18n="navAbout">关于</a>
        <button class="theme-toggle" id="themeToggle" title="切换主题">🌙</button>
        <select class="lang-select" id="langSelect">
          <option value="zh">中文</option>
          <option value="en">English</option>
          <option value="ja">日本語</option>
          <option value="vi">Tiếng Việt</option>
        </select>
        <button class="hamburger" id="hamburgerBtn">☰</button>
      </div>
    </div>
  </nav>

  <div class="mobile-overlay" id="mobileOverlay">
    <div class="mobile-drawer" id="mobileDrawer">
      <button class="close-btn" id="mobileClose">✕</button>
      <a href="/" data-i18n="navHome">首页</a>
      <a href="/tools.html" data-i18n="navTools">工具箱</a>
      <a href="/tutorials/" data-i18n="navArticles">教程中心</a>
      <a href="/guides/" data-i18n="navGuides">深度指南</a>
      <a href="/professions.html" data-i18n="navProfessions">职业工具</a>
      <a href="/my.html" data-i18n="navMy">用户中心</a>
      <a href="/about.html" data-i18n="navAbout">关于</a>
    </div>
  </div>

  <section class="page-hero">
    <div class="hero-bg"></div>
    <div class="container">
      <div class="hero-tag"><span class="tag-dot"></span>Changelog</div>
      <h1><span class="hero-gradient-text" data-i18n="h1">更新日志</span></h1>
      <p class="hero-sub" data-i18n="subtitle">记录 ZenTools 的版本变迁和功能更新</p>
    </div>
  </section>

  <div class="page-content">
    <div id="changelogContainer"></div>
  </div>

  <footer>
    <div class="footer-inner">
      <div class="footer-logo">ZenTools</div>
      <div class="footer-links">
        <a href="/">首页</a>
        <a href="/about.html">关于</a>
        <a href="/tools.html">工具箱</a>
        <a href="/privacy.html">隐私政策</a>
      </div>
      <p class="footer-copy" data-i18n="footerCopy">© 2026 ZenTools · https://zentools.xyz · All rights reserved</p>
    </div>
  </footer>

</div>

<script src="assets/js/tool-ui.min.js"></script>
<script>
// i18n data
var pageTranslations = {
  zh: {
    pageTitle: "更新日志 - ZenTools", metaDesc: "ZenTools 版本更新历史，追踪功能更新、改进和修复。",
    h1: "更新日志", subtitle: "记录 ZenTools 的版本变迁和功能更新",
    current: "当前版本", old: "历史版本",
    footerCopy: "© 2026 ZenTools · https://zentools.xyz · All rights reserved",
    navHome: "首页", navTools: "工具箱", navArticles: "教程中心", navGuides: "深度指南",
    navProfessions: "职业工具", navMy: "用户中心", navAbout: "关于", navSection: "导航"
  },
  en: {
    pageTitle: "Changelog - ZenTools", metaDesc: "ZenTools version history: track feature updates, improvements and bug fixes.",
    h1: "Changelog", subtitle: "Track ZenTools version history and feature updates",
    current: "Current", old: "Previous Versions",
    footerCopy: "© 2026 ZenTools · https://zentools.xyz · All rights reserved",
    navHome: "Home", navTools: "Tools", navArticles: "Guides", navGuides: "Deep Guides",
    navProfessions: "By Profession", navMy: "My Space", navAbout: "About", navSection: "Nav"
  },
  ja: {
    pageTitle: "更新履歴 - ZenTools", metaDesc: "ZenTools バージョン更新履歴：機能更新・改善・修正を追跡。",
    h1: "更新履歴", subtitle: "ZenTools のバージョン履歴と機能アップデート",
    current: "現在のバージョン", old: "過去のバージョン",
    footerCopy: "© 2026 ZenTools · https://zentools.xyz · All rights reserved",
    navHome: "ホーム", navTools: "ツール", navArticles: "ガイド", navGuides: "深層ガイド",
    navProfessions: "職業別ツール", navMy: "マイスペース", navAbout: "概要", navSection: "メニュー"
  },
  vi: {
    pageTitle: "Lịch sử cập nhật - ZenTools", metaDesc: "Lịch sử phiên bản ZenTools: theo dõi cập nhật tính năng, cải tiến và sửa lỗi.",
    h1: "Nhật ký cập nhật", subtitle: "Theo dõi lịch sử phiên bản và cập nhật tính năng ZenTools",
    current: "Hiện tại", old: "Phiên bản trước",
    footerCopy: "© 2026 ZenTools · https://zentools.xyz · All rights reserved",
    navHome: "Trang chủ", navTools: "Công cụ", navArticles: "Hướng dẫn", navGuides: "Hướng dẫn chuyên sâu",
    navProfessions: "Theo Nghề", navMy: "Trang cá nhân", navAbout: "Giới thiệu", navSection: "Menu"
  }
};

function applyPageLang(l) {
  var d = pageTranslations[l] || pageTranslations.zh;
  document.documentElement.lang = l === 'zh' ? 'zh-CN' : l;
  document.title = d.pageTitle || document.title;
  document.querySelectorAll('[data-i18n]').forEach(function(el) {
    var k = el.getAttribute('data-i18n');
    if (d[k]) el.textContent = d[k];
  });
  document.querySelectorAll('[data-i18n-placeholder]').forEach(function(el) {
    var k = el.getAttribute('data-i18n-placeholder');
    if (d[k] && el.tagName === 'META') el.content = d[k];
  });
  localStorage.setItem('zentools_lang', l);
  // Re-render changelog
  fetchChangelog(l);
}

var savedLang = localStorage.getItem('zentools_lang') || 'zh';
document.getElementById('langSelect').value = savedLang;
document.getElementById('langSelect').addEventListener('change', function() { applyPageLang(this.value); });
applyPageLang(savedLang);

// Load changelog from site-info.json
function fetchChangelog(lang) {
  fetch('data/site-info.json')
    .then(function(r) { return r.json(); })
    .then(function(data) { renderChangelog(data, lang); })
    .catch(function() {
      document.getElementById('changelogContainer').innerHTML = '<p style="text-align:center;color:var(--zen-text-placeholder);padding:40px">加载失败</p>';
    });
}

function renderChangelog(data, lang) {
  var c = document.getElementById('changelogContainer');
  if (!data.changelog || !data.changelog.length) {
    c.innerHTML = '<p style="text-align:center;color:var(--zen-text-placeholder);padding:40px">No data</p>';
    return;
  }
  var d = pageTranslations[lang] || pageTranslations.zh;
  var html = '<p style="text-align:center;margin-bottom:32px;font-size:14px;color:var(--zen-text-sub)">v' + data.version + ' <span class="current-badge">' + d.current + '</span></p>';
  data.changelog.forEach(function(v, i) {
    var items = v.items;
    var itemList = items[lang] || items.en || items.zh || [];
    var isCurrent = i === 0;
    var desc = v[lang] || v.en || v.zh || '';
    html += '<div class="ver-block" id="v' + v.version + '"><div class="ver-head"><span class="tag">v' + v.version + '</span><span class="date">' + v.date + '</span>' + (isCurrent ? '<span class="badge current-badge">' + d.current + '</span>' : '<span class="badge">' + d.old + '</span>') + '</div>' + (desc ? '<p class="ver-desc">' + desc + '</p>' : '') + '<ul class="ver-items">';
    itemList.forEach(function(item) { html += '<li>' + item + '</li>'; });
    html += '</ul></div>';
  });
  c.innerHTML = html;
}

// Theme toggle
(function() {
  var savedTheme = localStorage.getItem('zentools_theme');
  if (savedTheme === 'dark') document.documentElement.classList.add('dark');
  var btn = document.getElementById('themeToggle');
  if (btn) {
    btn.textContent = document.documentElement.classList.contains('dark') ? '☀️' : '🌙';
    btn.addEventListener('click', function() {
      document.documentElement.classList.toggle('dark');
      var isDark = document.documentElement.classList.contains('dark');
      this.textContent = isDark ? '☀️' : '🌙';
      localStorage.setItem('zentools_theme', isDark ? 'dark' : 'light');
    });
  }
})();

// Mobile drawer
(function() {
  var overlay = document.getElementById('mobileOverlay');
  var hamBtn = document.getElementById('hamburgerBtn');
  var closeBtn = document.getElementById('mobileClose');
  if (!hamBtn || !overlay) return;
  function closeMenu() { overlay.classList.remove('open'); hamBtn.textContent = '☰'; document.body.style.overflow = ''; }
  hamBtn.addEventListener('click', function(e) {
    e.stopPropagation();
    if (overlay.classList.contains('open')) { closeMenu(); } else {
      overlay.classList.add('open'); hamBtn.textContent = '✕'; document.body.style.overflow = 'hidden';
    }
  });
  if (closeBtn) closeBtn.addEventListener('click', closeMenu);
  overlay.addEventListener('click', function(e) {
    var drawer = document.getElementById('mobileDrawer');
    if (drawer && !drawer.contains(e.target)) closeMenu();
  });
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape' && overlay.classList.contains('open')) closeMenu();
  });
})();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', function() {
    navigator.serviceWorker.register('/sw.js').catch(function() {});
  });
}
</script>
</body>
</html>
