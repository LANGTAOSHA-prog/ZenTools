<script>
(function() {
  var compareTools = [
    { slug: 'image-compare', icon: '🖼️', zh: { title: '图片对比', desc: '并排对比两张图片差异，支持滑动、叠加、差异高亮三种模式，适合设计稿对比、前后效果对比。', tag: '图片工具' }, en: { title: 'Image Compare', desc: 'Compare two images side by side with slider, overlay, and difference highlight modes. Perfect for design comparison.', tag: 'Image' }, ja: { title: '画像比較', desc: '2枚の画像の違いを並べて比較。スライダー、オーバーレイ、差分ハイライトの3モード対応。', tag: '画像' }, vi: { title: 'So sánh Ảnh', desc: 'So sánh hai ảnh cạnh nhau với chế độ thanh trượt, phủ và tô sáng khác biệt. Lý tưởng cho so sánh thiết kế.', tag: 'Ảnh' }, url: '../image/image-compare.html' },

    { slug: 'json-diff', icon: '📊', zh: { title: 'JSON 对比', desc: '结构化对比两个 JSON 数据，清晰展示新增、删除、修改的键值对。适合 API 响应对比、配置变更追踪。', tag: '开发工具' }, en: { title: 'JSON Diff', desc: 'Structurally compare two JSON objects, clearly showing added, removed, and modified key-value pairs.', tag: 'Dev' }, ja: { title: 'JSON 比較', desc: '2つのJSONデータを構造的に比較し、追加・削除・変更されたキーと値を明確に表示。APIレスポンスの比較に。', tag: '開発' }, vi: { title: 'So sánh JSON', desc: 'So sánh cấu trúc hai đối tượng JSON, hiển thị rõ ràng các cặp khóa-giá trị được thêm, xóa, sửa đổi.', tag: 'Dev' }, url: '../dev/diff.html' },

  ];

  function renderFeatured(lang) {
    var grid = document.getElementById('featuredGrid');
    var html = '';
    compareTools.forEach(function(t) {
      var d = t[lang] || t.zh;
      html += '<a href="' + t.url + '" class="feat-card">';
      html += '<div class="fc-icon">' + t.icon + '</div>';
      html += '<div class="fc-title">' + d.title + '</div>';
      html += '<div class="fc-desc">' + d.desc + '</div>';
      html += '<span class="fc-tag">' + d.tag + '</span>';
      html += '</a>';
    });
    grid.innerHTML = html;
  }

  function applyI18n(lang) {
    var data = window.ZT_PAGE[lang] || window.ZT_PAGE.zh;
    document.title = data.pageTitle || document.title;
    document.querySelectorAll('[data-i18n]').forEach(function(el) {
      var key = el.getAttribute('data-i18n');
      if (data[key]) el.textContent = data[key];
    });
  }

  var savedLang = localStorage.getItem('zentools_lang') || navigator.language.slice(0, 2) || 'zh';
  renderFeatured(savedLang);
  applyI18n(savedLang);

  document.getElementById('langSwitcher').value = savedLang;

  window.addEventListener('zt-langchange', function(e) {
    var lang = e.detail.lang;
    renderFeatured(lang);
    applyI18n(lang);
  });

  window.switchLanguage = function(lang) {
    localStorage.setItem('zentools_lang', lang);
    renderFeatured(lang);
    applyI18n(lang);
    window.dispatchEvent(new CustomEvent('zt-setlang', { detail: { lang: lang } }));
  };
})();
