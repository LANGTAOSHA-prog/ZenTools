    <script>
        (function() {
            const urlInput = document.getElementById('urlInput');
            const colorGrid = document.getElementById('colorGrid');
            const radiusRange = document.getElementById('radiusRange');
            const radiusVal = document.getElementById('radiusVal');
            const logoInput = document.getElementById('logoInput');
            const logoPreview = document.getElementById('logoPreview');
            const logoUpload = document.getElementById('logoUpload');
            const generateBtn = document.getElementById('generateBtn');
            const downloadPngBtn = document.getElementById('downloadPngBtn');
            const downloadSvgBtn = document.getElementById('downloadSvgBtn');
            const qrContainer = document.getElementById('qrcode');
            let currentColors = ['#2563eb', '#7c3aed'];
            let currentRadius = 16;
            let logoDataURL = null;
            colorGrid.addEventListener('click', function(e) {
                const swatch = e.target.closest('.color-swatch');
                if (!swatch) return;
                document.querySelectorAll('.color-swatch').forEach(el => el.classList.remove('active'));
                swatch.classList.add('active');
                currentColors = swatch.dataset.colors.split(',');
                generateQR();
            });
            radiusRange.addEventListener('input', function() {
                currentRadius = parseInt(this.value);
                radiusVal.textContent = currentRadius;
                generateQR();
            });
            logoUpload.addEventListener('click', function(e) { if (e.target.closest('.preview')) return; logoInput.click(); });
            logoInput.addEventListener('change', function() {
                if (this.files && this.files[0]) {
                    const reader = new FileReader();
                    reader.onload = function(e) { logoDataURL = e.target.result; logoPreview.src = logoDataURL; logoPreview.classList.add('show'); logoUpload.querySelector('.hint').textContent = '✅ Logo已上传，点击更换'; generateQR(); };
                    reader.readAsDataURL(this.files[0]);
                }
                this.value = '';
            });
            logoPreview.addEventListener('dblclick', function() { logoDataURL = null; logoPreview.classList.remove('show'); logoPreview.src = ''; logoUpload.querySelector('.hint').textContent = '👆 点击上传 Logo'; generateQR(); });
            urlInput.addEventListener('input', generateQR);
            function generateQR() {
                const text = urlInput.value.trim() || 'https://zentools.xyz';
                qrContainer.innerHTML = '';
                const tempDiv = document.createElement('div');
                tempDiv.style.display = 'none';
                document.body.appendChild(tempDiv);
                const qr = new QRCode(tempDiv, { text: text, width: 300, height: 300, colorDark: '#000000', colorLight: '#ffffff', correctLevel: QRCode.CorrectLevel.H });
                const canvas = tempDiv.querySelector('canvas');
                if (!canvas) { document.body.removeChild(tempDiv); qrContainer.innerHTML = '<p style="color:#ef4444;">生成失败</p>'; return; }
                const size = 300;
                const newCanvas = document.createElement('canvas');
                newCanvas.width = size; newCanvas.height = size;
                const ctx = newCanvas.getContext('2d');
                const r = currentRadius;
                ctx.beginPath(); ctx.moveTo(r,0); ctx.arcTo(size,0,size,size,r); ctx.arcTo(size,size,0,size,r); ctx.arcTo(0,size,0,0,r); ctx.arcTo(0,0,size,0,r); ctx.closePath(); ctx.clip();
                ctx.fillStyle = '#ffffff'; ctx.fillRect(0,0,size,size);
                const srcCtx = canvas.getContext('2d');
                const imageData = srcCtx.getImageData(0,0,size,size);
                const data = imageData.data;
                function hexToRgb(hex) { const r=/^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex); return r?{r:parseInt(r[1],16),g:parseInt(r[2],16),b:parseInt(r[3],16)}:{r:0,g:0,b:0}; }
                const c1=hexToRgb(currentColors[0]),c2=hexToRgb(currentColors[1]);
                for(let y=0;y<size;y++) for(let x=0;x<size;x++){ const idx=(y*size+x)*4; if(data[idx]<128&&data[idx+1]<128&&data[idx+2]<128){ const t=(x+y)/(size*2); ctx.fillStyle=`rgb(${Math.round(c1.r+(c2.r-c1.r)*t)},${Math.round(c1.g+(c2.g-c1.g)*t)},${Math.round(c1.b+(c2.b-c1.b)*t)})`; ctx.fillRect(x,y,1,1); } }
                if (logoDataURL) { const ls=60,lx=(size-ls)/2,ly=(size-ls)/2; const li=new Image(); li.onload=function(){ ctx.beginPath(); ctx.arc(size/2,size/2,ls/2+4,0,Math.PI*2); ctx.fillStyle='rgba(255,255,255,0.92)'; ctx.fill(); ctx.save(); ctx.beginPath(); ctx.arc(size/2,size/2,ls/2,0,Math.PI*2); ctx.clip(); ctx.drawImage(li,lx,ly,ls,ls); ctx.restore(); }; li.src=logoDataURL; }
                document.body.removeChild(tempDiv);
                qrContainer.innerHTML=''; qrContainer.appendChild(newCanvas);
            }
            function downloadPNG(){ const c=qrContainer.querySelector('canvas'); if(!c)return; generateQR(); setTimeout(function(){ const cc=qrContainer.querySelector('canvas'); if(!cc)return; const a=document.createElement('a'); a.download='qrcode.png'; a.href=cc.toDataURL('image/png'); a.click(); },200); }
            function downloadSVG(){ const text=urlInput.value.trim()||'https://zentools.xyz'; const td=document.createElement('div'); td.style.display='none'; document.body.appendChild(td); const qr=new QRCode(td,{text:text,width:300,height:300,colorDark:currentColors[0],colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.H}); const c=td.querySelector('canvas'); if(c){ const ctx=c.getContext('2d'); const id=ctx.getImageData(0,0,300,300); const d=id.data; let svg='<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300"><rect width="300" height="300" fill="white"/>'; for(let y=0;y<300;y+=2) for(let x=0;x<300;x+=2){ const idx=(y*300+x)*4; if(d[idx]<128) svg+='<rect x="'+x+'" y="'+y+'" width="2" height="2" fill="'+currentColors[0]+'"/>'; } svg+='</svg>'; const b=new Blob([svg],{type:'image/svg+xml'}); const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download='qrcode.svg'; a.click(); URL.revokeObjectURL(a.href); } document.body.removeChild(td); }
            generateBtn.addEventListener('click',function(){generateBtn.textContent='✅ 已更新'; setTimeout(function(){generateBtn.textContent='🎨 生成并预览高清大图';},1200);});
            downloadPngBtn.addEventListener('click',downloadPNG);
            downloadSvgBtn.addEventListener('click',downloadSVG);
            setTimeout(generateQR,100);
        })();
    </script>
