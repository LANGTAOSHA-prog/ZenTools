<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>JSON 格式化工具 - ZenTools</title>
<meta name="description" content="ZenTools 免费在线 JSON 格式化、压缩、校验工具。">

<style>
:root{
  --bg:#0f172a;--card:#111827;--border:#1f2937;
  --text:#f3f4f6;--muted:#9ca3af;--blue:#2563eb;--green:#10b981;--red:#ef4444;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:Arial,sans-serif;line-height:1.7}
.container{max-width:1000px;margin:auto;padding:40px 20px}
a{color:#60a5fa;text-decoration:none}
.top-bar{display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap;margin-bottom:20px}
.lang-select{background:#0f172a;color:white;border:1px solid #334155;border-radius:10px;padding:10px 12px}
.card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:28px}
h1{margin-bottom:15px}
.desc{color:var(--muted);margin-bottom:25px}
.ad-box{margin:25px 0;height:110px;border:2px dashed #334155;border-radius:18px;display:flex;align-items:center;justify-content:center;color:#64748b}
textarea{width:100%;min-height:240px;padding:16px;border-radius:12px;border:1px solid #334155;background:#0f172a;color:white;font-size:15px;resize:vertical;font-family:Consolas,monospace}
.controls{display:flex;gap:12px;flex-wrap:wrap;margin:20px 0}
button{background:var(--blue);color:white;border:none;padding:13px 18px;border-radius:12px;cursor:pointer;font-size:15px;font-weight:bold}
.copy-btn{background:var(--green)}
.clear-btn{background:var(--red)}
.status{margin-top:15px;color:#cbd5e1}
.info{margin-top:35px}
.info h2{margin-top:25px}
.info p{color:#cbd5e1;white-space:pre-line}
footer{margin-top:50px;text-align:center;color:#94a3b8}
@media(max-width:768px){button,.lang-select{width:100%}}
</style>
</head>

<body>
<div class="container">

  <div class="top-bar">
    <a href="index.html" data-i18n="back">← 返回首页</a>
    <select id="languageSelect" class="lang-select">
      <option value="zh">中文</option>
      <option value="ja">日本語</option>
      <option value="en">English</option>
      <option value="vi">Tiếng Việt</option>
    </select>
  </div>

  <div class="card">
    <h1 data-i18n="title">JSON 格式化工具</h1>
    <p class="desc" data-i18n="desc">免费在线 JSON 格式化、压缩、校验工具。</p>

    <div class="ad-box" data-i18n="ad">广告位（Google AdSense）</div>

    <textarea id="jsonInput" placeholder='{"name":"ZenTools","type":"tools"}'></textarea>

    <div class="controls">
      <button onclick="formatJSON()" data-i18n="format">格式化 JSON</button>
      <button onclick="minifyJSON()" data-i18n="minify">压缩 JSON</button>
      <button class="copy-btn" onclick="copyJSON()" data-i18n="copy">复制结果</button>
      <button class="clear-btn" onclick="clearJSON()" data-i18n="clear">清空</button>
    </div>

    <div class="status" id="status"></div>

    <div class="info">
      <h2 data-i18n="guideTitle">使用说明</h2>
      <p data-i18n="guideText">1. 粘贴 JSON 内容。
2. 点击格式化或压缩。
3. 如果 JSON 有错误，会显示提示。
4. 点击复制结果。</p>

      <h2 data-i18n="privacyTitle">隐私说明</h2>
      <p data-i18n="privacyText">JSON 内容在浏览器本地处理，不会上传到服务器。</p>
    </div>
  </div>

  <footer>© 2026 ZenTools</footer>
</div>

<script>
const languageSelect = document.getElementById("languageSelect");
let currentLang = "zh";

const translations = {
  zh:{
    pageTitle:"JSON 格式化工具 - ZenTools",
    back:"← 返回首页",
    title:"JSON 格式化工具",
    desc:"免费在线 JSON 格式化、压缩、校验工具。",
    ad:"广告位（Google AdSense）",
    format:"格式化 JSON",
    minify:"压缩 JSON",
    copy:"复制结果",
    clear:"清空",
    valid:"JSON 正确",
    invalid:"JSON 错误：",
    copied:"已复制",
    empty:"请输入 JSON 内容",
    guideTitle:"使用说明",
    guideText:"1. 粘贴 JSON 内容。\n2. 点击格式化或压缩。\n3. 如果 JSON 有错误，会显示提示。\n4. 点击复制结果。",
    privacyTitle:"隐私说明",
    privacyText:"JSON 内容在浏览器本地处理，不会上传到服务器。"
  },
  ja:{
    pageTitle:"JSON 整形ツール - ZenTools",
    back:"← ホームに戻る",
    title:"JSON 整形ツール",
    desc:"無料オンライン JSON 整形・圧縮・検証ツール。",
    ad:"広告スペース",
    format:"JSON を整形",
    minify:"JSON を圧縮",
    copy:"結果をコピー",
    clear:"クリア",
    valid:"JSON は正しいです",
    invalid:"JSON エラー：",
    copied:"コピーしました",
    empty:"JSON を入力してください",
    guideTitle:"使い方",
    guideText:"1. JSON を貼り付けます。\n2. 整形または圧縮をクリックします。\n3. エラーがある場合は表示されます。\n4. 結果をコピーします。",
    privacyTitle:"プライバシーについて",
    privacyText:"JSON はブラウザ内で処理され、サーバーへ送信されません。"
  },
  en:{
    pageTitle:"JSON Formatter - ZenTools",
    back:"← Back to Home",
    title:"JSON Formatter",
    desc:"Free online JSON formatter, minifier, and validator.",
    ad:"Ad Space",
    format:"Format JSON",
    minify:"Minify JSON",
    copy:"Copy Result",
    clear:"Clear",
    valid:"JSON is valid",
    invalid:"JSON Error:",
    copied:"Copied",
    empty:"Please enter JSON content",
    guideTitle:"How to Use",
    guideText:"1. Paste JSON content.\n2. Click format or minify.\n3. Errors will be shown if JSON is invalid.\n4. Copy the result.",
    privacyTitle:"Privacy Notice",
    privacyText:"JSON content is processed locally in your browser and is not uploaded to a server."
  },
  vi:{
    pageTitle:"Công cụ định dạng JSON - ZenTools",
    back:"← Quay lại trang chủ",
    title:"Công cụ định dạng JSON",
    desc:"Công cụ định dạng, nén và kiểm tra JSON trực tuyến miễn phí.",
    ad:"Vị trí quảng cáo",
    format:"Định dạng JSON",
    minify:"Nén JSON",
    copy:"Sao chép kết quả",
    clear:"Xóa",
    valid:"JSON hợp lệ",
    invalid:"Lỗi JSON:",
    copied:"Đã sao chép",
    empty:"Vui lòng nhập nội dung JSON",
    guideTitle:"Hướng dẫn sử dụng",
    guideText:"1. Dán nội dung JSON.\n2. Nhấn định dạng hoặc nén.\n3. Nếu JSON có lỗi, thông báo sẽ hiển thị.\n4. Sao chép kết quả.",
    privacyTitle:"Thông tin quyền riêng tư",
    privacyText:"Nội dung JSON được xử lý trực tiếp trong trình duyệt và không tải lên máy chủ."
  }
};

function setLanguage(lang){
  currentLang = lang;
  const data = translations[lang] || translations.zh;
  document.documentElement.lang = lang;
  document.title = data.pageTitle;

  document.querySelectorAll("[data-i18n]").forEach(el=>{
    const key = el.getAttribute("data-i18n");
    if(data[key]) el.textContent = data[key];
  });

  localStorage.setItem("siteLanguage", lang);
}

languageSelect.addEventListener("change", e=>setLanguage(e.target.value));
const savedLang = localStorage.getItem("siteLanguage") || "zh";
languageSelect.value = savedLang;
setLanguage(savedLang);

function getJSONText(){
  const text = document.getElementById("jsonInput").value.trim();
  if(!text){
    document.getElementById("status").textContent = translations[currentLang].empty;
    return null;
  }
  return text;
}

function formatJSON(){
  const text = getJSONText();
  if(!text) return;

  try{
    const obj = JSON.parse(text);
    document.getElementById("jsonInput").value = JSON.stringify(obj,null,2);
    document.getElementById("status").textContent = translations[currentLang].valid;
  }catch(e){
    document.getElementById("status").textContent = translations[currentLang].invalid + " " + e.message;
  }
}

function minifyJSON(){
  const text = getJSONText();
  if(!text) return;

  try{
    const obj = JSON.parse(text);
    document.getElementById("jsonInput").value = JSON.stringify(obj);
    document.getElementById("status").textContent = translations[currentLang].valid;
  }catch(e){
    document.getElementById("status").textContent = translations[currentLang].invalid + " " + e.message;
  }
}

function copyJSON(){
  const textarea = document.getElementById("jsonInput");
  if(!textarea.value.trim()){
    document.getElementById("status").textContent = translations[currentLang].empty;
    return;
  }
  textarea.select();
  document.execCommand("copy");
  document.getElementById("status").textContent = translations[currentLang].copied;
}

function clearJSON(){
  document.getElementById("jsonInput").value = "";
  document.getElementById("status").textContent = "";
}
</script>

</body>
</html>
