<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>链接批量提取 - ZenTools</title>
<meta name="description" content="ZenTools 免费在线链接批量提取工具。">

<style>
:root{--bg:#0f172a;--card:#111827;--card2:#0b1220;--border:#1f2937;--text:#f3f4f6;--muted:#94a3b8;--blue:#2563eb;--green:#10b981;--red:#ef4444;--gold:#f59e0b}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:Arial,"Noto Sans SC","Noto Sans JP",sans-serif;line-height:1.7}
.container{max-width:1000px;margin:auto;padding:40px 20px}
a{color:#60a5fa;text-decoration:none}
.top-bar{display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap;margin-bottom:20px}
.lang-select{background:#111827;color:white;border:1px solid #334155;border-radius:10px;padding:10px 12px}
.card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:28px}
h1{margin-bottom:15px}.desc{color:var(--muted);margin-bottom:25px}
.ad-box{margin:25px 0;height:110px;border:2px dashed #334155;border-radius:18px;display:flex;align-items:center;justify-content:center;color:#64748b}
input,select,textarea{width:100%;margin:10px 0;padding:14px;border-radius:12px;border:1px solid #334155;background:#0f172a;color:white;font-size:16px}
textarea{min-height:190px;resize:vertical}
button{background:var(--blue);color:white;border:none;padding:13px 18px;border-radius:12px;cursor:pointer;font-size:15px;font-weight:bold;margin:6px 6px 6px 0}
.copy-btn,.download-btn{background:var(--green)}.clear-btn{background:var(--red)}
.result,.info{margin-top:28px}.info h2{margin-top:25px}.info p,.result{color:#cbd5e1;white-space:pre-line}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:15px}
.box{background:#0b1220;border:1px solid #334155;border-radius:16px;padding:18px;margin-top:15px}
.big{font-size:28px;font-weight:900}
.preview img,.preview video{max-width:100%;border-radius:14px;border:1px solid #334155;margin-top:15px}
.download-link{display:inline-block;margin-top:15px;background:var(--green);color:white;padding:12px 18px;border-radius:12px}
footer{margin-top:50px;text-align:center;color:#94a3b8}
@media(max-width:768px){button,.lang-select{width:100%}.top-bar{align-items:stretch}}
</style>

</head>
<body>
<div class="container">
  <div class="top-bar">
    <a href="index.html" data-i18n="back">← 返回首页</a>
    <select id="languageSelect" class="lang-select">
      <option value="zh">中文</option>
      <option value="ja">日本語</option>
      <option value="en">English</option>
      <option value="vi">Tiếng Việt</option>
    </select>
  </div>
  <div class="card">

<h1 data-i18n="title">链接批量提取</h1>
<p class="desc" data-i18n="desc">从文本中自动提取 URL 链接。</p>
<div class="ad-box" data-i18n="ad">广告位（Google AdSense）</div>
<textarea id="text" data-i18n-placeholder="placeholder" placeholder="粘贴包含链接的文本..."></textarea>
<button onclick="extractLinks()" data-i18n="run">提取链接</button>
<button onclick="copyResult()" class="copy-btn" data-i18n="copy">复制结果</button>
<button onclick="clearAll()" class="clear-btn" data-i18n="clear">清空</button>
<textarea id="output" readonly data-i18n-placeholder="resultPlaceholder" placeholder="提取结果..."></textarea>
<div class="result" id="count"></div>

  </div>
  <footer>© 2026 ZenTools</footer>
</div>
<script>

const translations={
 zh:{pageTitle:"链接批量提取 - ZenTools",back:"← 返回首页",title:"链接批量提取",desc:"从文本中自动提取 URL 链接。",ad:"广告位（Google AdSense）",placeholder:"粘贴包含链接的文本...",resultPlaceholder:"提取结果...",run:"提取链接",copy:"复制结果",clear:"清空",found:"找到链接："},
 ja:{pageTitle:"リンク抽出 - ZenTools",back:"← ホームに戻る",title:"リンク抽出",desc:"テキストからURLを自動抽出。",ad:"広告スペース",placeholder:"リンクを含むテキストを貼り付け...",resultPlaceholder:"抽出結果...",run:"リンク抽出",copy:"結果をコピー",clear:"クリア",found:"リンク数："},
 en:{pageTitle:"Link Extractor - ZenTools",back:"← Back to Home",title:"Link Extractor",desc:"Extract URLs from text automatically.",ad:"Ad Space",placeholder:"Paste text containing links...",resultPlaceholder:"Extracted links...",run:"Extract Links",copy:"Copy Result",clear:"Clear",found:"Links found: "},
 vi:{pageTitle:"Trích xuất liên kết - ZenTools",back:"← Quay lại trang chủ",title:"Trích xuất liên kết",desc:"Tự động trích xuất URL từ văn bản.",ad:"Vị trí quảng cáo",placeholder:"Dán văn bản có chứa liên kết...",resultPlaceholder:"Kết quả...",run:"Trích xuất",copy:"Sao chép",clear:"Xóa",found:"Số liên kết: "}
};

const languageSelect=document.getElementById("languageSelect");
let currentLang="zh";
function setLanguage(lang){
 currentLang=lang;
 const data=translations[lang]||translations.zh;
 document.documentElement.lang=lang;
 document.title=data.pageTitle||document.title;
 document.querySelectorAll("[data-i18n]").forEach(el=>{const k=el.getAttribute("data-i18n"); if(data[k]) el.textContent=data[k];});
 document.querySelectorAll("[data-i18n-placeholder]").forEach(el=>{const k=el.getAttribute("data-i18n-placeholder"); if(data[k]) el.placeholder=data[k];});
 localStorage.setItem("siteLanguage",lang);
}
languageSelect.addEventListener("change",e=>setLanguage(e.target.value));
const savedLang=localStorage.getItem("siteLanguage")||"zh";
languageSelect.value=savedLang;

setLanguage(savedLang);
function extractLinks(){const text=document.getElementById("text").value;const re=/https?:\/\/[^\s<>"']+/g;const links=[...new Set(text.match(re)||[])];document.getElementById("output").value=links.join("\n");document.getElementById("count").textContent=(translations[currentLang]||translations.zh).found+links.length;}
function copyResult(){const el=document.getElementById("output");el.select();document.execCommand("copy");}
function clearAll(){document.getElementById("text").value="";document.getElementById("output").value="";document.getElementById("count").textContent="";}

</script>
</body>
</html>
