    // LZW encode
    var lzwMin=palSize<2?2:palSize, clear=1<<lzwMin, eoi=clear+1;
    var table={}, codeSize=lzwMin+1, nextCode=eoi+1, curCode=-1;
    function addToStream(code,bits){
      for(var b=0;b<bits;b++){header=(header>>1)|(((code>>b)&1)<<15);index++;if(index===8){stream.push(header&0xFF);header>>=8;index=0;}}
    }
    // Map pixels to palette indices
    var indices=[];
    for(var y=0;y<h;y++)for(var x=0;x<w;x++){
      var idx2=(y*w+x)*4, r=pixels[idx2], g=pixels[idx2+1], b=pixels[idx2+2], best=0,bd=9999999;
      for(var p=0;p<pal.length;p++){var dr=r-pal[p][0],dg=g-pal[p][1],db=b-pal[p][2],d=dr*dr+dg*dg+db*db;if(d<bd){bd=d;best=p;}}
      indices.push(best);
    }
    addToStream(clear,codeSize);
    curCode=indices[0];
    for(var i=1;i<indices.length;i++){
      var nxt=indices[i], key=curCode+","+nxt;
      if(table[key]!==undefined){curCode=table[key];}
      else{
        addToStream(curCode,codeSize);
        table[key]=nextCode++;
        curCode=nxt;
        if(nextCode>=(1<<codeSize)&&codeSize<12)codeSize++;
        if(nextCode>4095){addToStream(clear,codeSize);table={};nextCode=eoi+1;codeSize=lzwMin+1;}
      }
    }
    addToStream(curCode,codeSize);addToStream(eoi,codeSize);
    if(index>0)stream.push(header&0xFF);
    writeByte(0x00); // Block terminator
  }
  exports.setSize=function(w,h){width=w;height=h;};
  exports.setDelay=function(ms){delay=ms;};
  exports.setRepeat=function(r){repeat=r;};
  exports.addFrame=function(ctx){
    var imgData=ctx.getImageData(0,0,width,height);
    if(index===0){
      // Header + LSD + Global color table + Netscape extension
      writeString("GIF89a");
      writeBytes([width&0xFF,(width>>8)&0xFF,height&0xFF,(height>>8)&0xFF]);
      writeByte(0xF7); // GCT flag + size
      writeByte(0x00); // Background
      writeByte(0x00); // Aspect
      // Dummy GCT (will be filled per frame)
      var tempPal=[];
      for(var i=0;i<256;i++)tempPal.push([0,0,0]);
      writeColorTable(tempPal);
      // Netscape loop extension
      writeByte(0x21);writeByte(0xFF);writeByte(0x0B);
      writeString("NETSCAPE2.0");writeByte(0x03);writeByte(0x01);
      writeBytes([repeat&0xFF,(repeat>>8)&0xFF]);writeByte(0x00);
    }
    // GCE
    writeByte(0x21);writeByte(0xF9);writeByte(0x04);
    writeByte(0x04); // Disposal
    writeBytes([delay&0xFF,(delay>>8)&0xFF]);writeByte(0x00);writeByte(0x00);
    encodeImage(imgData.data,width,height);
    index++;
  };
  exports.finish=function(){
    writeByte(0x3B); // Trailer
    return new Blob([new Uint8Array(stream)],{type:"image/gif"});
  };
  return exports;
};

var dropZone=document.getElementById('dropZone'), fileInput=document.getElementById('fileInput');
dropZone.onclick=function(){fileInput.click();};
dropZone.ondragover=function(e){e.preventDefault();dropZone.classList.add('dragover');};
dropZone.ondragleave=function(){dropZone.classList.remove('dragover');};
dropZone.ondrop=function(e){e.preventDefault();dropZone.classList.remove('dragover');if(e.dataTransfer.files.length)handleFile(e.dataTransfer.files[0]);};
fileInput.onchange=function(){if(this.files.length)handleFile(this.files[0]);};

var videoFile=null;
function handleFile(file){videoFile=file;document.getElementById('options').style.display='block';dropZone.querySelector('.drop-zone-text').textContent='已选择: '+file.name;}

function startConvert(){
  if(!videoFile){alert('请选择文件');return;}
  var btn=document.getElementById('convertBtn');btn.disabled=true;btn.textContent='转换中...';
  document.getElementById('progress').style.display='block';
  document.getElementById('result').style.display='none';
  var quality=parseInt(document.getElementById('quality').value);
  var fps=parseInt(document.getElementById('fps').value);
  var maxW=parseInt(document.getElementById('width').value);
  
  var url=URL.createObjectURL(videoFile);
  var video=document.getElementById('vidPlayer');
  video.src=url;video.muted=true;video.playsInline=true;
  video.onloadedmetadata=function(){
    var w=video.videoWidth, h=video.videoHeight;
    if(maxW>0&&w>maxW){h=Math.round(h*maxW/w);w=maxW;}
    var encoder=GIFEncoder();
    encoder.setSize(w,h);
    encoder.setDelay(Math.round(1000/fps));
    encoder.setRepeat(0);
    
    var canvas=document.getElementById('canvas');
    canvas.width=w;canvas.height=h;
    var ctx=canvas.getContext('2d');
    var duration=Math.min(video.duration,10); // Max 10 seconds
    var totalFrames=Math.ceil(duration*fps);
    var frameIdx=0;
    
    function captureFrame(){
      if(frameIdx>=totalFrames||video.ended||video.paused){
        video.pause();
        encoder.addFrame(ctx);
        var blob=encoder.finish();
        var durl=URL.createObjectURL(blob);
        document.getElementById('result').style.display='block';
        document.getElementById('result').innerHTML='<div style="margin-bottom:12px;font-weight:700;">✅ 转换完成</div><a class="btn" href="'+durl+'" download="output.gif">⬇ 下载 GIF</a><br><div style="margin-top:8px;font-size:12px;color:var(--zen-text-sub);">'+(blob.size/1024).toFixed(1)+' KB | '+totalFrames+' 帧</div>';
        document.getElementById('progress').style.display='none';
        btn.disabled=false;btn.textContent='▶ 开始转换';
        URL.revokeObjectURL(url);
        return;
      }
      video.currentTime=frameIdx/fps;
      video.onseeked=function(){
        ctx.drawImage(video,0,0,w,h);
        if(frameIdx===0||frameIdx%Math.max(1,Math.floor(totalFrames/quality*2))===0){
          var pct=Math.round(frameIdx/totalFrames*100);
          document.getElementById('progressBar').style.width=pct+'%';
        }
        frameIdx++;
        captureFrame();
      };
    }
    video.currentTime=0;
    video.play().then(function(){
      setTimeout(captureFrame,200);
    }).catch(function(e){
      // Direct frame capture fallback
      captureFrame();
    });
  };
}

</script>

// 暗黑模式切换
(function() {
  var savedTheme = localStorage.getItem('zentools_theme');
  if (savedTheme === 'dark') document.documentElement.classList.add('dark');
  var btn = document.getElementById('themeToggle');
  if (btn) {
    btn.textContent = document.documentElement.classList.contains('dark') ? '☀️' : '🌙';
    btn.addEventListener('click', function() {
      document.documentElement.classList.toggle('dark');
      var isDark = document.documentElement.classList.contains('dark');
      this.textContent = isDark ? '☀️' : '🌙';
      localStorage.setItem('zentools_theme', isDark ? 'dark' : 'light');
    });
  }
})();

// 移动端侧滑
(function() {
  var overlay = document.getElementById('mobileOverlay');
  var hamBtn = document.getElementById('hamburgerBtn');
  var closeBtn = document.getElementById('mobileClose');
  if (!hamBtn || !overlay) return;
  function closeMenu() { overlay.classList.remove('open'); hamBtn.textContent = '☰'; document.body.style.overflow = ''; }
  hamBtn.addEventListener('click', function(e) {
    e.stopPropagation();
    if (overlay.classList.contains('open')) { closeMenu(); } else {
      overlay.classList.add('open'); hamBtn.textContent = '✕'; document.body.style.overflow = 'hidden';
    }
  });
  if (closeBtn) closeBtn.addEventListener('click', closeMenu);
  overlay.addEventListener('click', function(e) {
    var drawer = document.getElementById('mobileDrawer');
    if (drawer && !drawer.contains(e.target)) closeMenu();
  });
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape' && overlay.classList.contains('open')) closeMenu();
  });
})();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', function() {
    navigator.serviceWorker.register('/sw.js').catch(function() {});
  });
}
</script>
