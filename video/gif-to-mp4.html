  </div>
  <div class="tool-box">
    <div class="drop-zone" id="dropZone">
      <div class="drop-zone-icon">\U0001f3ac</div>
      <div class="drop-zone-text">点击上传或拖拽 GIF 文件到此区域</div>
      <input type="file" id="fileInput" accept="image/gif" style="display:none" />
    </div>
    <div id="options" style="display:none;">
      <div class="row">
        <div><label data-i18n="lbl_质量">质量</label><select id="quality"><option value="10">最高</option><option value="8" selected>高</option><option value="5">中</option><option value="3">低</option></select></div>

        <div><label data-i18n="lbl_宽度">宽度</label><select id="width"><option value="0">原始尺寸</option><option value="320">320px</option><option value="480">480px</option><option value="640" selected>640px</option><option value="800">800px</option></select></div>
      </div>

<script>

var dropZone=document.getElementById('dropZone'), fileInput=document.getElementById('fileInput');
dropZone.onclick=function(){fileInput.click();};
dropZone.ondragover=function(e){e.preventDefault();dropZone.classList.add('dragover');};
dropZone.ondragleave=function(){dropZone.classList.remove('dragover');};
dropZone.ondrop=function(e){e.preventDefault();dropZone.classList.remove('dragover');if(e.dataTransfer.files.length)handleFile(e.dataTransfer.files[0]);};
fileInput.onchange=function(){if(this.files.length)handleFile(this.files[0]);};

var gifFile=null;
function handleFile(file){gifFile=file;document.getElementById('options').style.display='block';dropZone.querySelector('.drop-zone-text').textContent='已选择: '+file.name;}

function startConvert(){
  if(!gifFile){alert('请选择文件');return;}
  var btn=document.getElementById('convertBtn');btn.disabled=true;btn.textContent='转换中...';
  document.getElementById('progress').style.display='block';
  document.getElementById('result').style.display='none';
  
  var url=URL.createObjectURL(gifFile);
  var img=new Image();
  img.onload=function(){
    var canvas=document.getElementById('canvas');
    var ctx=canvas.getContext('2d');
    canvas.width=img.width;canvas.height=img.height;
    ctx.drawImage(img,0,0);
    
    // Use MediaRecorder to create video from canvas stream
    var stream=canvas.captureStream(parseInt(document.getElementById('fps').value)||10);
    var chunks=[];
    var recorder=new MediaRecorder(stream,{mimeType:'video/webm'});
    recorder.ondataavailable=function(e){if(e.data.size)chunks.push(e.data);};
    recorder.onstop=function(){
      var blob=new Blob(chunks,{type:'video/webm'});
      var ext='.webm'; var mime='video/webm';
      // Try MP4
      if(MediaRecorder.isTypeSupported('video/mp4')){ext='.mp4';mime='video/mp4';}
      var durl=URL.createObjectURL(blob);
      document.getElementById('result').style.display='block';
      document.getElementById('result').innerHTML='<div style="margin-bottom:12px;font-weight:700;">✅ 转换完成</div><a class="btn" href="'+durl+'" download="output'+ext+'">⬇ 下载 '+ext+'</a><br><div style="margin-top:8px;font-size:12px;color:var(--muted);">'+(blob.size/1024).toFixed(1)+' KB</div>';
      document.getElementById('progress').style.display='none';
      btn.disabled=false;btn.textContent='▶ 开始转换';
      URL.revokeObjectURL(url);
    };
    recorder.start();
    document.getElementById('progressBar').style.width='50%';
    setTimeout(function(){recorder.stop();document.getElementById('progressBar').style.width='100%';},1000);
  };
  img.onerror=function(){alert('无法加载 GIF 文件');btn.disabled=false;btn.textContent='▶ 开始转换';};
  img.src=url;
}

</script>
