</head><body><div class="container"><div class="top-bar"><a href="index.html" data-i18n="back">← 返回首页</a><select id="languageSelect" class="lang-select"><option value="zh">中文</option><option value="en">English</option></select></div><div class="card"><h1 data-i18n="title">视频合并</h1><p class="desc" data-i18n="desc">将多个视频依次拼接为一个视频文件。</p><div class="ad-box" data-i18n="ad">广告位（Google AdSense）</div><input type="file" id="videoInput" accept="video/*" multiple><div class="file-list" id="fileList"></div><button onclick="mergeVideos()" class="green" data-i18n="merge">开始合并</button><video id="preview" controls></video><button onclick="downloadMerged()" data-i18n="download">下载合并视频</button></div><footer>© 2026 ZenTools</footer></div><script>
const translations={zh:{back:"← 返回首页",title:"视频合并",desc:"将多个视频依次拼接为一个视频文件。",ad:"广告位（Google AdSense）",merge:"开始合并",download:"下载合并视频",choose:"请选择至少2个视频",nosupport:"Canvas capture not supported for merged output, please try a different browser"},en:{back:"← Back to Home",title:"Video Merger",desc:"Merge multiple videos into one file.",ad:"Ad Space",merge:"Start Merge",download:"Download",choose:"Select at least 2 videos",nosupport:"Canvas capture not supported for merged output, please try a different browser"}};
let currentLang="zh",videoFiles=[];const fl=document.getElementById("fileList"),v=document.getElementById("preview");let mergedBlob=null;
document.getElementById("videoInput").addEventListener("change",function(e){const fs=Array.from(e.target.files||[]);videoFiles=videoFiles.concat(fs);renderList();});
function renderList(){fl.innerHTML=videoFiles.map(function(f,i){return '<div class=\"file-item\"><span class=\"name\">'+(i+1)+'. '+f.name+'</span><span class=\"del\" onclick=\"removeFile('+i+')\">✕</span></div>';}).join('');}
function removeFile(i){videoFiles.splice(i,1);renderList();}
function mergeVideos(){if(videoFiles.length<2){alert(translations[currentLang].choose);return;}playNext(0);}
let playIdx=0,chunks=[];let mediaRecorder=null;function playNext(idx){if(idx>=videoFiles.length){if(mediaRecorder&&mediaRecorder.state!=='inactive'){mediaRecorder.stop();}return;}playIdx=idx;const f=videoFiles[idx];const u=URL.createObjectURL(f);v.src=u;v.onloadedmetadata=function(){if(idx===0){const c=document.createElement("canvas");c.width=v.videoWidth;c.height=v.videoHeight;const ctx=c.getContext("2d");const s=c.captureStream(30);mediaRecorder=new MediaRecorder(s,{mimeType:'video/webm'});chunks=[];mediaRecorder.ondataavailable=function(e){if(e.data.size>0)chunks.push(e.data);};mediaRecorder.onstop=function(){mergedBlob=new Blob(chunks,{type:'video/webm'});};mediaRecorder.start();}v.play();var drawFrame=function(){if(!v.paused&&!v.ended){const c=document.createElement("canvas");c.width=v.videoWidth;c.height=v.videoHeight;c.getContext("2d").drawImage(v,0,0);}requestAnimationFrame(drawFrame);};drawFrame();};v.onended=function(){if(mediaRecorder){setTimeout(function(){playNext(playIdx+1);},100);}};}
function downloadMerged(){if(!mergedBlob){alert('Please merge first');return;}const a=document.createElement("a");a.href=URL.createObjectURL(mergedBlob);a.download='merged-video.webm';a.click();}
const ls=document.getElementById("languageSelect");ls.addEventListener("change",function(){currentLang=this.value;const d=translations[currentLang]||translations.zh;document.title=d.title;document.querySelectorAll("[data-i18n]").forEach(el=>{const k=el.getAttribute("data-i18n");if(d[k])el.textContent=d[k];});});
</script></body></html>
