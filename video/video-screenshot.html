<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>视频截图 - ZenTools</title><meta name="description" content="ZenTools 免费在线视频截图工具，从视频中截取帧图片。"><style>:root{--bg:#0f172a;--card:#111827;--border:#1f2937;--text:#f3f4f6;--muted:#94a3b8;--blue:#2563eb;--green:#10b981}*{margin:0;padding:0;box-sizing:border-box}body{background:var(--bg);color:var(--text);font-family:Arial,"Noto Sans SC","Noto Sans JP",sans-serif;line-height:1.7}.container{max-width:1000px;margin:auto;padding:40px 20px}a{color:#60a5fa;text-decoration:none}.top-bar{display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap;margin-bottom:20px}.lang-select{background:#111827;color:white;border:1px solid #334155;border-radius:10px;padding:10px 12px}.card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:28px}h1{margin-bottom:15px}.desc{color:var(--muted);margin-bottom:25px}.ad-box{margin:25px 0;height:110px;border:2px dashed #334155;border-radius:18px;display:flex;align-items:center;justify-content:center;color:#64748b}input{width:100%;margin:10px 0;padding:14px;border-radius:12px;border:1px solid #334155;background:#0f172a;color:white;font-size:16px}button{background:var(--blue);color:white;border:none;padding:13px 18px;border-radius:12px;cursor:pointer;font-size:15px;font-weight:bold;margin:6px 6px 6px 0}.green{background:var(--green)}video{max-width:100%;border-radius:14px;border:1px solid #334155;margin:15px 0}img{max-width:100%;border-radius:14px;border:1px solid var(--border);margin:10px 0}.row{display:flex;gap:15px;flex-wrap:wrap}.row>*{flex:1;min-width:150px}footer{margin-top:50px;text-align:center;color:#94a3b8}@media(max-width:768px){button,.lang-select{width:100%}}</style></head><body><div class="container"><div class="top-bar"><a href="index.html" data-i18n="back">← 返回首页</a><select id="languageSelect" class="lang-select"><option value="zh">中文</option><option value="en">English</option></select></div><div class="card"><h1 data-i18n="title">视频截图</h1><p class="desc" data-i18n="desc">从视频中截取指定时间点的帧图片。</p><div class="ad-box" data-i18n="ad">广告位（Google AdSense）</div><input type="file" id="videoInput" accept="video/*"><div class="row"><div><label data-i18n="time">截取时间（秒）</label><input type="number" id="captureTime" value="1" min="0" step="0.5"></div></div><video id="preview" controls></video><button onclick="captureFrame()" data-i18n="capture">截图</button><div id="result"></div></div><footer>© 2026 ZenTools</footer></div><script>
const translations={zh:{back:"← 返回首页",title:"视频截图",desc:"从视频中截取指定时间点的帧图片。",ad:"广告位（Google AdSense）",time:"截取时间（秒）",capture:"截图",choose:"请先选择视频文件"},en:{back:"← Back to Home",title:"Video Screenshot",desc:"Capture frames from video at specific time.",ad:"Ad Space",time:"Capture at (seconds)",capture:"Capture",choose:"Please select a video first"}};
let currentLang="zh",videoFile=null;const v=document.getElementById("preview");
document.getElementById("videoInput").addEventListener("change",function(e){const f=e.target.files[0];if(!f)return;videoFile=f;v.src=URL.createObjectURL(f);});
function captureFrame(){if(!videoFile){alert(translations[currentLang].choose);return;}const t=parseFloat(document.getElementById("captureTime").value)||0;v.currentTime=t;v.play();setTimeout(function(){v.pause();const c=document.createElement("canvas");c.width=v.videoWidth;c.height=v.videoHeight;c.getContext("2d").drawImage(v,0,0);const d=c.toDataURL("image/png");const r=document.getElementById("result");r.innerHTML='<img src=\"'+d+'\" id=\"capturedImg\"><br><button onclick=\"downloadFrame()\" class=\"green\" data-i18n=\"download\">下载截图</button>';window._frameData=d;},500);}
function downloadFrame(){if(!window._frameData)return;const a=document.createElement("a");a.href=window._frameData;a.download='screenshot-'+(videoFile?videoFile.name.replace(/\.[^.]+$/,'.png'):'frame.png');a.click();}
const ls=document.getElementById("languageSelect");ls.addEventListener("change",function(){currentLang=this.value;const d=translations[currentLang]||translations.zh;document.title=d.title;document.querySelectorAll("[data-i18n]").forEach(el=>{const k=el.getAttribute("data-i18n");if(d[k])el.textContent=d[k];});});
</script></body></html>
