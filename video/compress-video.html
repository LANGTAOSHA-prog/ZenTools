let ffmpegInstance=null;
async function getFFmpeg(){
  if(ffmpegInstance) return ffmpegInstance;
  if(!window.FFmpeg){ throw new Error("FFmpeg library not loaded"); }
  const { FFmpeg } = window.FFmpeg;
  const ffmpeg = new FFmpeg();
  ffmpeg.on("progress", ({progress})=>{
    const bar=document.getElementById("bar");
    if(bar) bar.style.width=Math.max(1,Math.min(100,Math.round(progress*100)))+"%";
  });
  ffmpeg.on("log", ({message})=>{
    const log=document.getElementById("log");
    if(log) log.textContent=message;
  });
  await ffmpeg.load({coreURL:"https://unpkg.com/@ffmpeg/core@0.12.6/dist/umd/ffmpeg-core.js"});
  ffmpegInstance=ffmpeg;
  return ffmpeg;
}
function blobDownload(name,type,data){
  const blob=new Blob([data.buffer],{type});
  const url=URL.createObjectURL(blob);
  const a=document.getElementById("downloadLink");
  a.href=url;
  a.download=name;
  a.style.display="inline-block";
}
async function writeInputFile(ffmpeg,file,name){
  const data=new Uint8Array(await file.arrayBuffer());
  await ffmpeg.writeFile(name,data);
}

async function compressVideo(){
 const data=translations[currentLang]||translations.zh;
 const file=document.getElementById("videoFile").files[0];
 if(!file){alert(data.empty);return;}
 document.getElementById("log").textContent=data.working;
 document.getElementById("downloadLink").style.display="none";
 document.getElementById("bar").style.width="1%";
 try{
   const ffmpeg=await getFFmpeg();
   await writeInputFile(ffmpeg,file,"input.mp4");
   const args=["-i","input.mp4","-vcodec","libx264","-crf",document.getElementById("quality").value,"-preset","veryfast","-acodec","aac","output"];
   await ffmpeg.exec(args);
   const out=await ffmpeg.readFile("output");
   blobDownload("zentools-compressed.mp4","video/mp4",out);
   document.getElementById("bar").style.width="100%";
   document.getElementById("log").textContent=data.done;
 }catch(e){
   document.getElementById("log").textContent=e.message;
 }
}
