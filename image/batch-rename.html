<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><link rel="manifest" href="/manifest.json" />
  <title>批量改后缀 - ZenTools</title>
  <meta property="og:title" content="图片批量改后缀名" />
  <meta property="og:description" content="批量将图片转换为 JPG、PNG、WebP 等格式" />
  <meta name="description" content="批量将图片转换为 JPG、PNG、WebP 等格式" />
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    :root { --bg: #070b18; --surface: rgba(14,22,41,0.8); --surface2: rgba(20,31,55,0.9); --border: rgba(255,255,255,0.06); --text: #f0f4ff; --muted: #8899bb; --accent: #3b82f6; --accent2: #8b5cf6; --radius: 14px; --radius-pill: 999px; }
    [data-theme="light"] { --bg: #f2f5f9; --surface: rgba(255,255,255,0.85); --surface2: rgba(240,244,254,0.9); --border: rgba(0,0,0,0.06); --text: #0b111e; --muted: #4a5a7a; }
    body { font-family: 'Inter', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .container { max-width: 600px; width: 100%; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 32px; text-align: center; }
    .card h1 { font-size: 20px; margin-bottom: 24px; }
    .drop-zone { border: 2px dashed var(--border); border-radius: var(--radius); padding: 40px 20px; cursor: pointer; transition: all .3s; margin-bottom: 20px; }
    .drop-zone:hover, .drop-zone.dragover { border-color: var(--accent); background: rgba(59,130,246,0.05); }
    .drop-zone .icon { font-size: 48px; margin-bottom: 12px; }
    .drop-zone p { color: var(--muted); font-size: 14px; }
    .controls { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-bottom: 20px; }
    select, button { padding: 10px 20px; border-radius: var(--radius-pill); border: 1px solid var(--border); background: var(--surface2); color: var(--text); font-size: 14px; cursor: pointer; }
    button { background: linear-gradient(135deg, var(--accent), var(--accent2)); border: none; font-weight: 600; }
    button:hover { opacity: .9; }
    button:disabled { opacity: .5; cursor: not-allowed; }
    .file-list { text-align: left; margin-top: 20px; }
    .file-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; background: var(--surface2); border-radius: 8px; margin-bottom: 8px; font-size: 13px; }
    .file-item .status { font-size: 12px; color: var(--muted); }
    .file-item .status.success { color: #22c55e; }
    .file-item .status.error { color: #ef4444; }
    .footer { margin-top: 30px; text-align: center; font-size: 12px; color: var(--muted); }
  </style>
</head><body>
<div class="container">
  <div class="card">
    <h1>🔄 图片批量改后缀名</h1>
    <div class="drop-zone" id="dropZone">
      <div class="icon">📁</div>
      <p>拖拽图片到此处，或点击选择文件</p>
      <input type="file" id="fileInput" multiple accept="image/*" style="display:none">
    </div>
    <div class="controls">
      <select id="formatSelect">
        <option value="jpg">JPG</option>
        <option value="png">PNG</option>
        <option value="webp">WebP</option>
        <option value="bmp">BMP</option>
        <option value="gif">GIF</option>
      </select>
      <button id="convertBtn" disabled>开始转换</button>
      <button id="downloadBtn" disabled>下载全部</button>
    </div>
    <div class="file-list" id="fileList"></div>
  </div>
  <div class="footer">
    © 2026 <a href="/" style="color:var(--accent);">江湖小站-ZenTools</a> · 所有处理均在浏览器本地完成
  </div>
</div>
<script>
const dropZone = document.getElementById('dropZone');
const fileInput = document.getElementById('fileInput');
const convertBtn = document.getElementById('convertBtn');
const downloadBtn = document.getElementById('downloadBtn');
const formatSelect = document.getElementById('formatSelect');
const fileList = document.getElementById('fileList');
let files = [];
let convertedBlobs = [];

dropZone.addEventListener('click', () => fileInput.click());
dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('dragover'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
dropZone.addEventListener('drop', (e) => {
  e.preventDefault();
  dropZone.classList.remove('dragover');
  handleFiles(e.dataTransfer.files);
});
fileInput.addEventListener('change', (e) => handleFiles(e.target.files));

function handleFiles(selectedFiles) {
  files = Array.from(selectedFiles).filter(f => f.type.startsWith('image/'));
  if (!files.length) return;
  renderFileList();
  convertBtn.disabled = false;
  convertedBlobs = [];
}

function renderFileList() {
  fileList.innerHTML = files.map((f, i) => `<div class="file-item" data-index="${i}"><span>${f.name}</span><span class="status">等待转换</span></div>`).join('');
}

convertBtn.addEventListener('click', async () => {
  convertBtn.disabled = true;
  convertedBlobs = [];
  for (let i = 0; i < files.length; i++) {
    const item = fileList.querySelector(`[data-index="${i}"] .status`);
    const format = formatSelect.value;
    try {
      const img = await loadImage(files[i]);
      const canvas = document.createElement('canvas');
      canvas.width = img.width;
      canvas.height = img.height;
      const ctx = canvas.getContext('2d');
      if (format === 'jpg') ctx.fillStyle = '#fff';
      else ctx.fillStyle = 'transparent';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(img, 0, 0);
      const blob = await new Promise(r => canvas.toBlob(r, 'image/' + format, 0.9));
      convertedBlobs.push({ blob, name: files[i].name.replace(/\.[^.]+$/, '') + '.' + format });
      item.textContent = '✓ 转换成功';
      item.classList.add('success');
    } catch (e) {
      item.textContent = '✗ 转换失败';
      item.classList.add('error');
    }
  }
  downloadBtn.disabled = convertedBlobs.length === 0;
  convertBtn.disabled = false;
});

function loadImage(file) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = reject;
    img.src = URL.createObjectURL(file);
  });
}

downloadBtn.addEventListener('click', () => {
  if (!convertedBlobs.length) return;
  if (convertedBlobs.length === 1) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(convertedBlobs[0].blob);
    a.download = convertedBlobs[0].name;
    a.click();
  } else {
    import('https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js').then(JSZip => {
      const zip = new JSZip.default();
      convertedBlobs.forEach(b => zip.file(b.name, b.blob));
      zip.generateAsync({ type: 'blob' }).then(content => {
        const a = document.createElement('a');
        a.href = URL.createObjectURL(content);
        a.download = 'converted-images.zip';
        a.click();
      });
    });
  }
});
</script>
</body></html>
