<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>图片旋转 - ZenTools</title><meta name="description" content="ZenTools 免费在线图片旋转工具，任意角度旋转和翻转图片。"><style>:root{--bg:#0f172a;--card:#111827;--border:#1f2937;--text:#f3f4f6;--muted:#94a3b8;--blue:#2563eb;--green:#10b981}*{margin:0;padding:0;box-sizing:border-box}body{background:var(--bg);color:var(--text);font-family:Arial,"Noto Sans SC","Noto Sans JP",sans-serif;line-height:1.7}.container{max-width:1000px;margin:auto;padding:40px 20px}a{color:#60a5fa;text-decoration:none}.top-bar{display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap;margin-bottom:20px}.lang-select{background:#111827;color:white;border:1px solid #334155;border-radius:10px;padding:10px 12px}.card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:28px}h1{margin-bottom:15px}.desc{color:var(--muted);margin-bottom:25px}.ad-box{margin:25px 0;height:110px;border:2px dashed #334155;border-radius:18px;display:flex;align-items:center;justify-content:center;color:#64748b}input,select{width:100%;margin:10px 0;padding:14px;border-radius:12px;border:1px solid #334155;background:#0f172a;color:white;font-size:16px}button{background:var(--blue);color:white;border:none;padding:13px 18px;border-radius:12px;cursor:pointer;font-size:15px;font-weight:bold;margin:6px 6px 6px 0}.green{background:var(--green)}canvas{max-width:100%;border-radius:14px;border:1px solid #334155;display:block;margin:15px auto}.btn-group{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}footer{margin-top:50px;text-align:center;color:#94a3b8}@media(max-width:768px){button,.lang-select{width:100%}}</style><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1955887568822472"
     crossorigin="anonymous"></script>
</head><body><div class="container"><div class="top-bar"><a href="index.html" data-i18n="back">← 返回首页</a><select id="languageSelect" class="lang-select"><option value="zh">中文</option><option value="en">English</option></select></div><div class="card"><h1 data-i18n="title">图片旋转与翻转</h1><p class="desc" data-i18n="desc">旋转图片角度或水平/垂直翻转。</p><div class="ad-box" data-i18n="ad">广告位（Google AdSense）</div><input type="file" id="imageInput" accept="image/*"><div class="btn-group"><button onclick="rotate(-90)">↺ 左旋90°</button><button onclick="rotate(90)">↻ 右旋90°</button><button onclick="flip('h')">↔ 水平翻转</button><button onclick="flip('v')">↕ 垂直翻转</button></div><div class="btn-group"><input type="range" id="angleSlider" min="0" max="360" value="0" style="width:200px"><span id="angleLabel">0°</span><button onclick="rotateCustom()" data-i18n="apply">应用角度</button></div><canvas id="canvas"></canvas><button onclick="downloadImage()" class="green" data-i18n="download">下载图片</button></div><footer>© 2026 ZenTools</footer></div><script>
const translations={zh:{back:"← 返回首页",title:"图片旋转与翻转",desc:"旋转图片角度或水平/垂直翻转。",ad:"广告位（Google AdSense）",apply:"应用角度",download:"下载图片",choose:"请先选择一张图片"},en:{back:"← Back to Home",title:"Image Rotate & Flip",desc:"Rotate or flip images horizontally/vertically.",ad:"Ad Space",apply:"Apply",download:"Download",choose:"Please select an image first"}};
let currentLang="zh",imgFile=null,angle=0,flipH=false,flipV=false;
const cs=document.getElementById("canvas"),ctx=cs.getContext("2d");
document.getElementById("imageInput").addEventListener("change",function(e){const f=e.target.files[0];if(!f)return;imgFile=f;const r=new FileReader();r.onload=function(ev){const img=new Image();img.onload=function(){angle=0;flipH=false;flipV=false;document.getElementById("angleSlider").value=0;document.getElementById("angleLabel").textContent="0°";drawCanvas(img);};img.src=ev.target.result;};r.readAsDataURL(f);});
function drawCanvas(img){const maxW=800,maxH=600;let w=img.width,h=img.height;if(w>maxW){h=h*maxW/w;w=maxW;}if(h>maxH){w=w*maxH/h;h=maxH;}cs.width=w;cs.height=h;ctx.clearRect(0,0,w,h);ctx.save();if(flipH){ctx.translate(w,0);ctx.scale(-1,1);}if(flipV){ctx.translate(0,h);ctx.scale(1,-1);}ctx.drawImage(img,0,0,w,h);ctx.restore();}
function rotate(deg){if(!imgFile){alert(translations[currentLang].choose);return;}angle=(angle+deg+360)%360;document.getElementById("angleSlider").value=angle;document.getElementById("angleLabel").textContent=angle+"°";applyTransform();}
function flip(dir){if(!imgFile){alert(translations[currentLang].choose);return;}if(dir==='h')flipH=!flipH;else flipV=!flipV;applyTransform();}
function rotateCustom(){if(!imgFile){alert(translations[currentLang].choose);return;}angle=parseInt(document.getElementById("angleSlider").value);document.getElementById("angleLabel").textContent=angle+"°";applyTransform();}
function applyTransform(){const r=new FileReader();r.onload=function(ev){const img=new Image();img.onload=function(){const rad=angle*Math.PI/180;const cos=Math.abs(Math.cos(rad)),sin=Math.abs(Math.sin(rad));let w=img.width,h=img.height;cs.width=Math.ceil(w*cos+h*sin);cs.height=Math.ceil(w*sin+h*cos);ctx.clearRect(0,0,cs.width,cs.height);ctx.save();ctx.translate(cs.width/2,cs.height/2);ctx.rotate(rad);if(flipH)ctx.scale(-1,1);if(flipV)ctx.scale(1,-1);ctx.drawImage(img,-w/2,-h/2,w,h);ctx.restore();};img.src=ev.target.result;};r.readAsDataURL(imgFile);}
document.getElementById("angleSlider").addEventListener("input",function(){document.getElementById("angleLabel").textContent=this.value+"°";});
function downloadImage(){if(!imgFile){alert(translations[currentLang].choose);return;}const link=document.createElement("a");link.download="rotated-"+imgFile.name;link.href=cs.toDataURL("image/png");link.click();}
const ls=document.getElementById("languageSelect");ls.addEventListener("change",function(){currentLang=this.value;const d=translations[currentLang]||translations.zh;document.title=d.title;document.querySelectorAll("[data-i18n]").forEach(e=>{const k=e.getAttribute("data-i18n");if(d[k])e.textContent=d[k];});});
</script></body></html>
