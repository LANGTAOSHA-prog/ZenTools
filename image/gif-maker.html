<h1><span class="icon">🎞️</span> GIF 制作</h1>
    <p class="desc">将多张图片合成为 GIF 动图，可调整帧率和延迟</p>
    
    <div class="tool-area">
      <div class="upload-zone" id="dropZone">
        <div class="icon-big">📁</div>
        <p>点击上传多张图片生成 GIF</p>
        <p class="hint">选择多张图片，按顺序合成为动图 (支持 Ctrl/Shift 多选)</p>
        <input type="file" id="fileInput" accept="image/*" multiple />
      </div>
      <div class="controls">
        <label data-i18n="lbl_帧延迟_ms">帧延迟 (ms):</label>
        <input type="number" id="delay" value="200" min="20" max="5000" step="10" />
        <label data-i18n="lbl_循环">循环:</label>
        <input type="number" id="repeat" value="0" min="0" max="100" /> (0=无限)
      </div>
      <div id="frameList" style="display:flex;flex-wrap:wrap;gap:6px;margin:12px 0;min-height:60px;background:#0a0e1a;border:1px solid var(--border);border-radius:10px;padding:12px;"></div>
      <div class="flex-row">
        <button class="btn" id="generateBtn" disabled data-i18n="btn_生成_gif">生成 GIF</button>
      </div>
      <div class="result-area" id="resultArea" style="display:none">
        <img id="gifPreview" style="max-width:100%;max-height:350px;border-radius:10px;" />
        <br/>
        <a class="download-btn" id="downloadLink" download="animation.gif">下载 GIF</a>
      </div>

<button class="bookmark-float" onclick="prompt('复制链接收藏本站','https://zentools.xyz')" data-i18n="btn_收藏本站">⭐ 收藏本站</button>
<script>

    const fileInput = document.getElementById('fileInput');
    const dropZone = document.getElementById('dropZone');
    const generateBtn = document.getElementById('generateBtn');
    const resultArea = document.getElementById('resultArea');
    const gifPreview = document.getElementById('gifPreview');
    const downloadLink = document.getElementById('downloadLink');
    const frameList = document.getElementById('frameList');
    const delayInput = document.getElementById('delay');
    const repeatInput = document.getElementById('repeat');
    const frames = [];

    dropZone.addEventListener('click', () => fileInput.click());
    dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.style.borderColor = '#3b82f6'; });
    dropZone.addEventListener('dragleave', () => { dropZone.style.borderColor = ''; });
    dropZone.addEventListener('drop', e => { e.preventDefault(); dropZone.style.borderColor = ''; if(e.dataTransfer.files.length) handleFiles(e.dataTransfer.files); });
    fileInput.addEventListener('change', e => { if(e.target.files.length) handleFiles(e.target.files); });

    function handleFiles(files) {
      frames.length = 0;
      frameList.innerHTML = '';
      Array.from(files).forEach((file, idx) => {
        const reader = new FileReader();
        reader.onload = function(e) {
          frames.push(e.target.result);
          const thumb = document.createElement('div');
          thumb.style.cssText = 'width:60px;height:60px;border-radius:6px;overflow:hidden;border:1px solid var(--border);position:relative;';
          thumb.innerHTML = '<img src="' + e.target.result + '" style="width:100%;height:100%;object-fit:cover;" /><span style="position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,0.6);color:#fff;font-size:10px;text-align:center;">' + (idx+1) + '</span>';
          frameList.appendChild(thumb);
          generateBtn.disabled = frames.length < 2;
        };
        reader.readAsDataURL(file);
      });
      if(files.length > 0) {
        dropZone.classList.add('has-image');
        dropZone.querySelector('p').textContent = files.length + ' 张图片已选择';
      }
    }

    // Load gif.js from CDN
    function loadGifJS() {
      return new Promise((resolve) => {
        if(typeof GIF !== 'undefined') { resolve(); return; }
        const script = document.createElement('script');
        script.src = 'https://cdn.jsdelivr.net/npm/gif.js@0.2.0/dist/gif.min.js';
        script.onload = resolve;
        document.head.appendChild(script);
      });
    }

    generateBtn.addEventListener('click', async function() {
      if(frames.length < 2) return;
      generateBtn.disabled = true;
      generateBtn.textContent = '生成中...';

      await loadGifJS();

      const gif = new GIF({
        workers: 2,
        quality: 10,
        width: 300,
        height: 200,
        workerScript: 'https://cdn.jsdelivr.net/npm/gif.js@0.2.0/dist/gif.worker.js'
      });

      let loadedCount = 0;
      const delay = parseInt(delayInput.value) || 200;
      const repeat = parseInt(repeatInput.value) || 0;

      frames.forEach((dataUrl) => {
        const img = new Image();
        img.onload = function() {
          // Use the actual image dimensions
          gif.options.width = Math.max(gif.options.width, img.width);
          gif.options.height = Math.max(gif.options.height, img.height);
          gif.addFrame(img, {copy: true, delay: delay});
          loadedCount++;
          if(loadedCount === frames.length) {
            gif.on('finished', function(blob) {
              const url = URL.createObjectURL(blob);
              gifPreview.src = url;
              downloadLink.href = url;
              resultArea.style.display = 'block';
              generateBtn.disabled = false;
              generateBtn.textContent = '生成 GIF';
            });
            gif.render();
          }
        };
        // Need to re-create img for each frame
        const frameImg = new Image();
        frameImg.onload = function() {
          if(!gif.options.width || !gif.options.height) {
            gif.options.width = frameImg.width;
            gif.options.height = frameImg.height;
          }
          gif.addFrame(frameImg, {copy: true, delay: delay});
          loadedCount++;
          if(loadedCount === frames.length) {
            gif.on('finished', function(blob) {
              const url = URL.createObjectURL(blob);
              gifPreview.src = url;
              downloadLink.href = url;
              resultArea.style.display = 'block';
              generateBtn.disabled = false;
              generateBtn.textContent = '生成 GIF';
            });
            gif.render();
          }
        };
        frameImg.src = dataUrl;
      });
    });
    
</script>
