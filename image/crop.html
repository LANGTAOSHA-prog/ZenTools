  en:{

        tutorialEyebrow: 'HOW TO USE',

  vi:{

    desc:"Công cụ cắt ảnh trực tuyến miễn phí.",
    button:"Bắt đầu cắt",

        tutorialStep2: 'Xử lý',
        tutorialStep3: 'Tải xuống'}

};

const languageSelect = document.getElementById("languageSelect");

function setLanguage(lang){

  const data = translations[lang];

  document.getElementById("title").textContent = data.title;

  document.getElementById("desc").textContent = data.desc;

  document.getElementById("btnText").textContent = data.button;

  localStorage.setItem("zentools_lang", lang);

}

languageSelect.addEventListener("change", e=>{

  setLanguage(e.target.value);

});

const savedLang = localStorage.getItem("zentools_lang") || "zh";

languageSelect.value = savedLang;

setLanguage(savedLang);

function cropImage(){

  const file = document.getElementById("imageInput").files[0];

  if(!file) return;

  const x = parseInt(document.getElementById("cropX").value) || 0;

  const y = parseInt(document.getElementById("cropY").value) || 0;

  const width = parseInt(document.getElementById("cropWidth").value) || 200;

  const height = parseInt(document.getElementById("cropHeight").value) || 200;

  const reader = new FileReader();

  reader.onload = function(e){

    const img = new Image();

    img.src = e.target.result;

    img.onload = function(){

      const canvas = document.createElement("canvas");

      const ctx = canvas.getContext("2d");

      canvas.width = width;

      canvas.height = height;

      ctx.drawImage(

        img,
        x,
        y,
        width,
        height,
        0,
        0,
        width,
        height

      );

      const result = canvas.toDataURL("image/png");

      showPreview(result);

    };

  };

  reader.readAsDataURL(file);

}

function showPreview(url){

  const lang = localStorage.getItem("zentools_lang") || "zh";

  const data = translations[lang];

  document.getElementById("preview").innerHTML = `

    <img src="${url}">

    <br>

    <a
      class="download-btn"
      href="${url}"
      download="crop.png"
    >
      ${data.download}
    </a>

  `;

}

</script>

function setMeta(name, content){
  let meta = document.querySelector(`meta[name="${name}"]`);
  if(!meta){
    meta = document.createElement("meta");
    meta.setAttribute("name", name);
    document.head.appendChild(meta);
  }
  meta.setAttribute("content", content);
}

function setProperty(property, content){
  let meta = document.querySelector(`meta[property="${property}"]`);
  if(!meta){
    meta = document.createElement("meta");
    meta.setAttribute("property", property);
    document.head.appendChild(meta);
  }
  meta.setAttribute("content", content);
}

function setCanonical(url){
  let link = document.querySelector('link[rel="canonical"]');
  if(!link){
    link = document.createElement("link");
    link.setAttribute("rel", "canonical");
    document.head.appendChild(link);
  }
  link.setAttribute("href", url);
}

function applySEO(){
  document.title = seoData.title;

  setMeta("description", seoData.description);
  setMeta("keywords", seoData.keywords);
  setMeta("author", "ZenTools");

  setCanonical(seoData.url);

  setProperty("og:description", seoData.description);
  setProperty("og:type", "website");

  setMeta("twitter:card", "summary_large_image");

}

</script>
