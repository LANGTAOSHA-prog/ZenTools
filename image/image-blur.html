<script>

    const fileInput = document.getElementById('fileInput');
    const dropZone = document.getElementById('dropZone');
    const processBtn = document.getElementById('processBtn');
    const resultArea = document.getElementById('resultArea');
    const resultCanvas = document.getElementById('resultCanvas');
    const downloadLink = document.getElementById('downloadLink');
    const radiusInput = document.getElementById('blurRadius');
    const radiusVal = document.getElementById('radiusVal');

    let imgDataUrl = null;

    radiusInput.addEventListener('input', () => { radiusVal.textContent = radiusInput.value; });

    dropZone.addEventListener('click', () => fileInput.click());
    dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.style.borderColor = '#3b82f6'; });
    dropZone.addEventListener('dragleave', () => { dropZone.style.borderColor = ''; });
    dropZone.addEventListener('drop', e => { e.preventDefault(); dropZone.style.borderColor = ''; if(e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]); });
    fileInput.addEventListener('change', e => { if(e.target.files.length) handleFile(e.target.files[0]); });

    function handleFile(file) {
      const reader = new FileReader();
      reader.onload = function(e) {
        imgDataUrl = e.target.result;
        dropZone.classList.add('has-image');
        dropZone.querySelector('p').textContent = file.name;
        processBtn.disabled = false;
      };
      reader.readAsDataURL(file);
    }

    function boxBlur(imageData, radius) {
      const w = imageData.width, h = imageData.height;
      const data = new Uint8ClampedArray(imageData.data);
      const out = new Uint8ClampedArray(data);
      const len = radius * 2 + 1;

      function blurPass(src, dst, horizontal) {
        for(let y = 0; y < h; y++) {
          for(let x = 0; x < w; x++) {
            let r = 0, g = 0, b = 0, a = 0, count = 0;
            for(let k = -radius; k <= radius; k++) {
              const px = horizontal ? x + k : x;
              const py = horizontal ? y : y + k;
              if(px < 0 || px >= w || py < 0 || py >= h) continue;
              const idx = (py * w + px) * 4;
              r += src[idx]; g += src[idx+1]; b += src[idx+2]; a += src[idx+3];
              count++;
            }
            if(count === 0) count = 1;
            const idx = (y * w + x) * 4;
            dst[idx] = r/count; dst[idx+1] = g/count; dst[idx+2] = b/count; dst[idx+3] = a/count;
          }
        }
      }

      // Two passes for performance
      const tmp = new Uint8ClampedArray(data);
      blurPass(data, tmp, true);
      blurPass(tmp, out, false);
      return new ImageData(out, w, h);
    }

    processBtn.addEventListener('click', function() {
      if(!imgDataUrl) return;
      const img = new Image();
      img.onload = function() {
        resultCanvas.width = img.width;
        resultCanvas.height = img.height;
        const ctx = resultCanvas.getContext('2d');
        ctx.drawImage(img, 0, 0);
        const imageData = ctx.getImageData(0, 0, img.width, img.height);
        const radius = parseInt(radiusInput.value);
        const blurred = boxBlur(imageData, radius);
        ctx.putImageData(blurred, 0, 0);
        resultArea.style.display = 'block';
        downloadLink.href = resultCanvas.toDataURL('image/png');
      };
      img.src = imgDataUrl;
    });
    
</script>
