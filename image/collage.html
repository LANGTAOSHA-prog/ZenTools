const languageSelect = document.getElementById("langSelect");

function setLanguage(lang){

const t = translations[lang];

document.getElementById("title").innerText = t.title;
document.getElementById("desc").innerText = t.desc;
document.getElementById("createBtn").innerText = t.create;
document.getElementById("downloadBtn").innerText = t.download;
document.getElementById("guideTitle").innerText = t.guideTitle;
document.getElementById("guideText").innerText = t.guideText;
document.getElementById("backBtn").innerText = t.back;
document.getElementById("adText").innerText = t.ad;

localStorage.setItem("zentools_lang",lang);
}

languageSelect.addEventListener("change",(e)=>{
setLanguage(e.target.value);
});

const savedLang = localStorage.getItem("zentools_lang") || "zh";
languageSelect.value = savedLang;
setLanguage(savedLang);

const imageInput = document.getElementById("imageInput");
const previewGrid = document.getElementById("previewGrid");

let images = [];

imageInput.addEventListener("change", async (e)=>{

images = [];
previewGrid.innerHTML = "";

const files = [...e.target.files];

for(const file of files){

const img = new Image();

img.src = URL.createObjectURL(file);

await new Promise(resolve=>{
img.onload = resolve;
});

images.push(img);

const preview = document.createElement("img");
preview.src = img.src;
previewGrid.appendChild(preview);

}

});

function createCollage(){

if(images.length === 0){
alert("请选择图片");
return;
}

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const layout = document.getElementById("layoutType").value;
const gap = parseInt(document.getElementById("gapSize").value);
const bg = document.getElementById("bgColor").value;

if(layout === "horizontal"){

let width = gap;
let height = 0;

images.forEach(img=>{
width += img.width + gap;
height = Math.max(height,img.height);
});

canvas.width = width;
canvas.height = height + gap*2;

ctx.fillStyle = bg;
ctx.fillRect(0,0,canvas.width,canvas.height);

let x = gap;

images.forEach(img=>{
ctx.drawImage(img,x,gap);
x += img.width + gap;
});

}

else if(layout === "vertical"){

let width = 0;
let height = gap;

images.forEach(img=>{
width = Math.max(width,img.width);
height += img.height + gap;
});

canvas.width = width + gap*2;
canvas.height = height;

ctx.fillStyle = bg;
ctx.fillRect(0,0,canvas.width,canvas.height);

let y = gap;

images.forEach(img=>{
ctx.drawImage(img,gap,y);
y += img.height + gap;
});

}

else{

const cols = Math.ceil(Math.sqrt(images.length));

const size = 300;

const rows = Math.ceil(images.length / cols);

canvas.width = cols * (size + gap) + gap;
canvas.height = rows * (size + gap) + gap;

ctx.fillStyle = bg;
ctx.fillRect(0,0,canvas.width,canvas.height);

images.forEach((img,index)=>{

const col = index % cols;
const row = Math.floor(index / cols);

const x = gap + col * (size + gap);
const y = gap + row * (size + gap);

ctx.drawImage(img,x,y,size,size);

});

}

}

function downloadImage(){

const canvas = document.getElementById("canvas");

const link = document.createElement("a");

link.download = "zentools-collage.png";

link.href = canvas.toDataURL();

link.click();

}
