<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图片压缩工具 - ����Сվ-ZenTools</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            min-height: 100vh;
            padding: 40px 20px;
            color: #f1f5f9;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* 返回按钮 */
        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(59, 130, 246, 0.2);
            border: 1px solid rgba(59, 130, 246, 0.4);
            color: #60a5fa;
            padding: 10px 20px;
            border-radius: 40px;
            text-decoration: none;
            font-weight: 500;
            margin-bottom: 30px;
            transition: all 0.2s;
        }

        .back-btn:hover {
            background: rgba(59, 130, 246, 0.4);
            transform: translateX(-4px);
        }

        /* 头部 */
        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 2.5rem;
            background: linear-gradient(135deg, #fff, #60a5fa);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 12px;
        }

        .header p {
            color: #94a3b8;
            font-size: 1rem;
        }

        /* 主区域两栏布局 */
        .main-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
        }

        /* 卡片样式 */
        .card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 28px;
            transition: all 0.3s;
        }

        .card:hover {
            border-color: rgba(96, 165, 250, 0.5);
            box-shadow: 0 20px 35px -15px rgba(0, 0, 0, 0.4);
        }

        .card-title {
            font-size: 1.3rem;
            font-weight: 600;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            border-left: 3px solid #3b82f6;
            padding-left: 15px;
        }

        /* 上传区域 */
        .upload-area {
            border: 2px dashed rgba(96, 165, 250, 0.4);
            border-radius: 20px;
            padding: 50px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            background: rgba(15, 23, 42, 0.5);
        }

        .upload-area:hover {
            border-color: #3b82f6;
            background: rgba(59, 130, 246, 0.1);
        }

        .upload-icon {
            font-size: 48px;
            margin-bottom: 15px;
        }

        .upload-area p {
            color: #94a3b8;
            margin-top: 10px;
            font-size: 0.85rem;
        }

        input[type="file"] {
            display: none;
        }

        /* 预览�?*/
        .preview-img {
            max-width: 100%;
            max-height: 250px;
            border-radius: 16px;
            margin-top: 20px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        }

        .img-info {
            margin-top: 15px;
            font-size: 0.85rem;
            color: #94a3b8;
            word-break: break-all;
        }

        /* 滑块 */
        .quality-control {
            margin: 20px 0;
        }

        .quality-label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 0.9rem;
        }

        input[type="range"] {
            width: 100%;
            height: 5px;
            -webkit-appearance: none;
            background: #334155;
            border-radius: 5px;
            outline: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            background: #3b82f6;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 8px #3b82f6;
        }

        .quality-value {
            color: #3b82f6;
            font-weight: 600;
        }

        /* 按钮 */
        .btn {
            width: 100%;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            border: none;
            color: white;
            padding: 14px 24px;
            border-radius: 40px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 20px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px -5px rgba(59, 130, 246, 0.4);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn-download {
            background: linear-gradient(135deg, #10b981, #059669);
        }

        /* 文件大小显示 */
        .size-badge {
            display: inline-block;
            background: rgba(59, 130, 246, 0.2);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            margin-top: 10px;
        }

        .size-badge .original {
            color: #f87171;
        }

        .size-badge .compressed {
            color: #4ade80;
        }

        .saved-rate {
            background: #10b981;
            color: white;
            padding: 2px 8px;
            border-radius: 20px;
            font-size: 0.7rem;
            margin-left: 8px;
        }

        /* 响应�?*/
        @media (max-width: 768px) {
            .main-grid {
                grid-template-columns: 1fr;
                gap: 20px;
            }
            .header h1 {
                font-size: 1.8rem;
            }
            .card {
                padding: 20px;
            }
        }

        footer {
            text-align: center;
            margin-top: 50px;
            padding-top: 25px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            color: #64748b;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>
<div class="container">
    <a href="/" class="back-btn">�?返回首页</a>

    <div class="header">
        <h1>📦 图片压缩工具</h1>
        <p>压缩 JPG、PNG、WebP 图片体积，完全在浏览器本地处理，不上传服务器</p>
    </div>

    <div class="main-grid">
        <!-- 左侧：上传区�?-->
        <div class="card">
            <div class="card-title">
                <span>📤</span> 1. 选择图片
            </div>
            <div class="upload-area" id="uploadArea">
                <div class="upload-icon">🖼�?/div>
                <strong>点击或拖拽图片到此处</strong>
                <p>支持 JPG、PNG、WebP、GIF（GIF 压缩效果有限�?/p>
                <input type="file" id="fileInput" accept="image/jpeg,image/png,image/webp,image/gif">
            </div>
            <div id="previewContainer" style="text-align: center;"></div>
            <div id="originalInfo" class="img-info"></div>
        </div>

        <!-- 右侧：压缩设�?& 结果 -->
        <div class="card">
            <div class="card-title">
                <span>⚙️</span> 2. 压缩设置
            </div>
            <div class="quality-control">
                <div class="quality-label">
                    <span>压缩质量</span>
                    <span class="quality-value" id="qualityValue">80</span><span>%</span>
                </div>
                <input type="range" id="qualitySlider" min="10" max="100" value="80">
                <div style="font-size: 0.7rem; color: #64748b; margin-top: 5px;">
                    �?较低质量 = 更小体积 | 推荐 75-85%
                </div>
            </div>

            <div class="card-title" style="margin-top: 20px;">
                <span>📊</span> 3. 压缩结果
            </div>
            <div id="resultInfo">
                <p style="color: #94a3b8; text-align: center;">等待压缩...</p>
            </div>

            <button class="btn btn-download" id="downloadBtn" disabled>⬇️ 下载压缩后图�?/button>
        </div>
    </div>
    <footer>
        �?纯本地压�?| 图片不会上传到任何服务器，请放心使用
    </footer>
</div>

<script>
    // DOM 元素
    const fileInput = document.getElementById('fileInput');
    const uploadArea = document.getElementById('uploadArea');
    const qualitySlider = document.getElementById('qualitySlider');
    const qualityValue = document.getElementById('qualityValue');
    const downloadBtn = document.getElementById('downloadBtn');
    const previewContainer = document.getElementById('previewContainer');
    const originalInfo = document.getElementById('originalInfo');
    const resultInfo = document.getElementById('resultInfo');

    let currentFile = null;        // 当前选择的原始文�?
    let currentCompressedBlob = null;  // 压缩后的 Blob
    let currentCompressedUrl = null;    // 用于预览�?URL

    // 更新质量显示
    qualitySlider.addEventListener('input', function() {
        qualityValue.textContent = this.value;
        if (currentFile) {
            compressImage(currentFile, this.value / 100);
        }
    });

    // 点击上传区域触发文件选择
    uploadArea.addEventListener('click', () => fileInput.click());
    
    // 拖拽上传
    uploadArea.addEventListener('dragover', (e) => {
        e.preventDefault();
        uploadArea.style.borderColor = '#3b82f6';
        uploadArea.style.background = 'rgba(59, 130, 246, 0.15)';
    });
    uploadArea.addEventListener('dragleave', () => {
        uploadArea.style.borderColor = 'rgba(96, 165, 250, 0.4)';
        uploadArea.style.background = 'rgba(15, 23, 42, 0.5)';
    });
    uploadArea.addEventListener('drop', (e) => {
        e.preventDefault();
        uploadArea.style.borderColor = 'rgba(96, 165, 250, 0.4)';
        uploadArea.style.background = 'rgba(15, 23, 42, 0.5)';
        const files = e.dataTransfer.files;
        if (files.length > 0) {
            handleFile(files[0]);
        }
    });

    // 文件选择
    fileInput.addEventListener('change', (e) => {
        if (e.target.files.length > 0) {
            handleFile(e.target.files[0]);
        }
    });

    // 处理文件
    function handleFile(file) {
        if (!file.type.startsWith('image/')) {
            alert('请选择图片文件 (JPG, PNG, WebP, GIF)');
            return;
        }
        currentFile = file;
        
        // 显示原始图片预览
        const reader = new FileReader();
        reader.onload = function(e) {
            previewContainer.innerHTML = `<img src="${e.target.result}" class="preview-img" alt="预览">`;
            // 显示原始文件大小
            const sizeMB = (file.size / 1024).toFixed(2);
            originalInfo.innerHTML = `<span class="size-badge">📁 原始大小: <span class="original">${sizeMB} KB</span> | 格式: ${file.type.split('/')[1].toUpperCase()}</span>`;
        };
        reader.readAsDataURL(file);
        
        // 执行压缩 (默认质量 0.8)
        compressImage(file, qualitySlider.value / 100);
    }

    // 核心压缩函数
    function compressImage(file, quality) {
        const img = new Image();
        const objectUrl = URL.createObjectURL(file);
        
        img.onload = function() {
            URL.revokeObjectURL(objectUrl);
            
            // 创建 canvas
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            
            // 保持原始尺寸（不改变分辨率）
            canvas.width = img.width;
            canvas.height = img.height;
            
            // 绘制图片
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            
            // 根据原始类型确定输出格式
            let outputType = 'image/jpeg';
            if (file.type === 'image/png') {
                outputType = 'image/png';
            } else if (file.type === 'image/webp') {
                outputType = 'image/webp';
            } else if (file.type === 'image/gif') {
                outputType = 'image/gif';
            } else {
                outputType = 'image/jpeg';
            }
            
            // PNG 格式�?quality 参数无效，但为了保持体验，如果是 PNG �?quality < 0.9，转�?JPEG 可以大幅减小体积（注意透明背景会变白）
            let finalQuality = quality;
            let finalType = outputType;
            
            if (outputType === 'image/png' && quality < 0.9) {
                // 可选：如果用户主动压缩 PNG，转�?JPEG（不保留透明背景�?
                // 为了更好的体验，让用户知晓：这里自动转为 JPEG 格式
                finalType = 'image/jpeg';
            }
            
            canvas.toBlob(function(blob) {
                if (!blob) {
                    resultInfo.innerHTML = '<p style="color:#f87171;">压缩失败，请重试</p>';
                    return;
                }
                
                currentCompressedBlob = blob;
                const compressedSizeKB = (blob.size / 1024).toFixed(2);
                const originalSizeKB = (file.size / 1024).toFixed(2);
                const savedPercent = ((1 - blob.size / file.size) * 100).toFixed(1);
                
                // 显示压缩结果
                let formatNote = '';
                if (finalType !== file.type) {
                    formatNote = `<div style="margin-top: 8px; font-size: 0.75rem; background: #334155; padding: 6px 12px; border-radius: 12px;">⚠️ 为获得更好压缩效果，格式�?${file.type.split('/')[1].toUpperCase()} 转为 ${finalType.split('/')[1].toUpperCase()}</div>`;
                }
                
                resultInfo.innerHTML = `
                    <div style="background: #1e293b; border-radius: 16px; padding: 16px;">
                        <div>📦 压缩后大�? <strong style="color: #4ade80; font-size: 1.2rem;">${compressedSizeKB} KB</strong></div>
                        <div>📁 原始大小: <span style="color: #f87171;">${originalSizeKB} KB</span></div>
                        <div>�?体积减小: <span style="color: #60a5fa;">${savedPercent}%</span></div>
                        ${formatNote}
                        <div class="size-badge" style="margin-top: 12px;">🖼�?分辨�? ${img.width} x ${img.height}</div>
                    </div>
                `;
                
                // 启用下载按钮
                downloadBtn.disabled = false;
                
                // 预览压缩后效果（可选）
                if (currentCompressedUrl) {
                    URL.revokeObjectURL(currentCompressedUrl);
                }
                currentCompressedUrl = URL.createObjectURL(blob);
                // 在右侧区域添加一个小小的压缩后预览？
                // 也可以在 preview 区域旁边增加对比，为了简洁，暂时不重�?
            }, finalType, finalQuality);
        };
        
        img.onerror = function() {
            resultInfo.innerHTML = '<p style="color:#f87171;">图片加载失败，请重试</p>';
            URL.revokeObjectURL(objectUrl);
        };
        
        img.src = objectUrl;
    }

    // 下载压缩后的图片
    downloadBtn.addEventListener('click', () => {
        if (!currentCompressedBlob) return;
        
        // 获取原始文件名和扩展�?
        let originalName = currentFile.name;
        let lastDot = originalName.lastIndexOf('.');
        let baseName = lastDot > 0 ? originalName.substring(0, lastDot) : 'compressed_image';
        
        let ext = '.jpg';
        if (currentCompressedBlob.type === 'image/png') ext = '.png';
        else if (currentCompressedBlob.type === 'image/webp') ext = '.webp';
        else if (currentCompressedBlob.type === 'image/gif') ext = '.gif';
        else ext = '.jpg';
        
        const downloadUrl = URL.createObjectURL(currentCompressedBlob);
        const a = document.createElement('a');
        a.href = downloadUrl;
        a.download = `${baseName}_compressed${ext}`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(downloadUrl);
    });
</script>
</body>
</html>
