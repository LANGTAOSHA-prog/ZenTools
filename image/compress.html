footer{margin-top:50px;text-align:center;color:#94a3b8}

<body>

      <option value="ja">日本語</option>
      <option value="en">English</option>

  </div>

  <div class="card">

      <option value="0.75" selected>推荐压缩 75%</option>

    <button onclick="downloadImage()" class="download-btn" data-i18n="download">下载图片</button>
    <button onclick="clearAll()" class="clear-btn" data-i18n="clear">清空</button>

    <div class="result" id="result"></div>

    <div class="preview">

    <div class="info">

2. 选择压缩质量。
3. 点击开始压缩。
4. 点击下载图片保存结果。</p>

      <h2 data-i18n="privacyTitle">隐私说明</h2>

  </div>

</div>

<script>

  vi:{

  }

const languageSelect=document.getElementById("languageSelect");
let currentLang="zh";
let compressedDataUrl="";
let outputFileName="zentools-compressed.jpg";

function setLanguage(lang){
  currentLang=lang;
  const data=translations[lang]||translations.zh;
  document.documentElement.lang=lang;
  document.title=data.pageTitle;

  document.querySelectorAll("[data-i18n]").forEach(el=>{
    const key=el.getAttribute("data-i18n");
    if(data[key]) el.textContent=data[key];
  });

  localStorage.setItem("siteLanguage",lang);
}

languageSelect.addEventListener("change",e=>setLanguage(e.target.value));
const savedLang=localStorage.getItem("siteLanguage")||"zh";
languageSelect.value=savedLang;
setLanguage(savedLang);

function formatSize(bytes){
  if(bytes<1024) return bytes+" B";
  if(bytes<1024*1024) return (bytes/1024).toFixed(2)+" KB";
  return (bytes/1024/1024).toFixed(2)+" MB";
}

function compressImage(){
  const data=translations[currentLang]||translations.zh;
  const file=document.getElementById("imageInput").files[0];

  if(!file){
    alert(data.empty);
    return;
  }

  const quality=parseFloat(document.getElementById("quality").value);
  const img=new Image();
  const reader=new FileReader();

  reader.onload=function(e){
    img.onload=function(){
      const canvas=document.getElementById("canvas");
      const ctx=canvas.getContext("2d");

      let width=img.width;
      let height=img.height;

      const maxSize=2200;
      if(width>maxSize || height>maxSize){
        const ratio=Math.min(maxSize/width,maxSize/height);
        width=Math.round(width*ratio);
        height=Math.round(height*ratio);
      }

      canvas.width=width;
      canvas.height=height;

      ctx.clearRect(0,0,width,height);
      ctx.drawImage(img,0,0,width,height);

      compressedDataUrl=canvas.toDataURL("image/jpeg",quality);

      const preview=document.getElementById("previewImage");
      preview.src=compressedDataUrl;
      preview.style.display="block";

      const compressedBytes=Math.round((compressedDataUrl.length*3)/4);

      outputFileName=file.name.replace(/\.[^.]+$/,"") + "-compressed.jpg";

      document.getElementById("result").textContent=
        data.done + "\\n" +
        data.original + formatSize(file.size) + "\\n" +
        data.compressed + formatSize(compressedBytes);
    };

    img.src=e.target.result;
  };

  reader.readAsDataURL(file);
}

function downloadImage(){
  if(!compressedDataUrl){
    compressImage();
    setTimeout(downloadImage,600);
    return;
  }

  const a=document.createElement("a");
  a.href=compressedDataUrl;
  a.download=outputFileName;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}

function clearAll(){
  document.getElementById("imageInput").value="";
  document.getElementById("previewImage").style.display="none";
  document.getElementById("previewImage").src="";
  document.getElementById("result").textContent="";
  compressedDataUrl="";
}
</script>

</body>
