const languageSelect=document.getElementById("langSelect");
let currentLang="zh";
let compressedDataUrl="";
let outputFileName="zentools-compressed.jpg";

function setLanguage(lang){
  currentLang=lang;
  const data=translations[lang]||translations.zh;
  document.documentElement.lang=lang;
  document.title=data.pageTitle;

  document.querySelectorAll("[data-i18n]").forEach(el=>{
    const key=el.getAttribute("data-i18n");
    if(data[key]) el.textContent=data[key];
  });

  localStorage.setItem("zentools_lang",lang);
}

languageSelect.addEventListener("change",e=>setLanguage(e.target.value));
const savedLang=localStorage.getItem("zentools_lang")||"zh";
languageSelect.value=savedLang;
setLanguage(savedLang);

function formatSize(bytes){
  if(bytes<1024) return bytes+" B";
  if(bytes<1024*1024) return (bytes/1024).toFixed(2)+" KB";
  return (bytes/1024/1024).toFixed(2)+" MB";
}

function compressImage(){
  const data=translations[currentLang]||translations.zh;
  const file=document.getElementById("imageInput").files[0];

  if(!file){
    alert(data.empty);
    return;
  }

  const quality=parseFloat(document.getElementById("quality").value);
  const img=new Image();
  const reader=new FileReader();

  reader.onload=function(e){
    img.onload=function(){
      const canvas=document.getElementById("canvas");
      const ctx=canvas.getContext("2d");

      let width=img.width;
      let height=img.height;

      const maxSize=2200;
      if(width>maxSize || height>maxSize){
        const ratio=Math.min(maxSize/width,maxSize/height);
        width=Math.round(width*ratio);
        height=Math.round(height*ratio);
      }

      canvas.width=width;
      canvas.height=height;

      ctx.clearRect(0,0,width,height);
      ctx.drawImage(img,0,0,width,height);

      compressedDataUrl=canvas.toDataURL("image/jpeg",quality);

      const preview=document.getElementById("previewImage");
      preview.src=compressedDataUrl;
      preview.style.display="block";

      const compressedBytes=Math.round((compressedDataUrl.length*3)/4);

      outputFileName=file.name.replace(/\.[^.]+$/,"") + "-compressed.jpg";

      document.getElementById("result").textContent=
        data.done + "\\n" +
        data.original + formatSize(file.size) + "\\n" +
        data.compressed + formatSize(compressedBytes);
    };

    img.src=e.target.result;
  };

  reader.readAsDataURL(file);
}

function downloadImage(){
  if(!compressedDataUrl){
    compressImage();
    setTimeout(downloadImage,600);
    return;
  }

  const a=document.createElement("a");
  a.href=compressedDataUrl;
  a.download=outputFileName;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}

function clearAll(){
  document.getElementById("imageInput").value="";
  document.getElementById("previewImage").style.display="none";
  document.getElementById("previewImage").src="";
  document.getElementById("result").textContent="";
  compressedDataUrl="";
}
</script>
