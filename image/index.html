      html += `<a class="${cs}" href="${h}" target="_blank"><span class="emoji">${t.icon || '🔧'}</span><span class="name">${t.name}</span><span class="desc">${t.description || ''}</span><span class="tag">${t.category || '工具'}</span></a>`;
    }
