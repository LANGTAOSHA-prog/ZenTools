<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>图片工具箱 - 江湖小站-ZenTools</title>
  <meta name="description" content="在线图片处理工具集合，支持压缩、格式转换、裁剪、加水印等操作" />
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    :root { --bg: #070b18; --surface: rgba(14,22,41,0.8); --surface2: rgba(20,31,55,0.9); --border: rgba(255,255,255,0.06); --text: #f0f4ff; --muted: #8899bb; --accent: #3b82f6; --accent2: #8b5cf6; --accent-glow: rgba(59,130,246,0.2); --radius: 14px; --radius-pill: 999px; --glass-border: rgba(255,255,255,0.08); }
    [data-theme="light"] { --bg: #f2f5f9; --surface: rgba(255,255,255,0.85); --surface2: rgba(240,244,254,0.9); --border: rgba(0,0,0,0.06); --text: #0b111e; --muted: #4a5a7a; --accent-glow: rgba(59,130,246,0.1); --glass-border: rgba(0,0,0,0.06); }
    body { font-family: 'Inter', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
    a { text-decoration: none; color: inherit; }
    .container { max-width: 1080px; margin: 0 auto; padding: 30px 24px 60px; }
    .nav-bar { display: flex; align-items: center; justify-content: space-between; padding: 12px 24px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; margin-bottom: 40px; flex-wrap: wrap; gap: 12px; }
    .nav-bar .logo { font-weight: 800; font-size: 18px; display: flex; align-items: center; gap: 10px; }
    .nav-bar .logo .mark { width: 30px; height: 30px; border-radius: 9px; background: linear-gradient(135deg, var(--accent), var(--accent2)); display: flex; align-items: center; justify-content: center; font-size: 14px; color: #fff; }
    .nav-bar .links { display: flex; gap: 6px; flex-wrap: wrap; }
    .nav-bar .links a { font-size: 13px; font-weight: 500; color: var(--muted); padding: 6px 14px; border-radius: var(--radius-pill); }
    .nav-bar .links a:hover { color: var(--text); background: rgba(255,255,255,0.04); }
    .nav-bar .links a.active { color: var(--accent); background: var(--accent-glow); }
    .page-header { margin-bottom: 32px; }
    .page-header h1 { font-size: 28px; font-weight: 800; }
    .page-header h1 .hl { background: linear-gradient(135deg, var(--accent), var(--accent2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .page-header p { color: var(--muted); margin-top: 6px; font-size: 15px; }
    .tools-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
    .tool-card { background: var(--surface); border: 1px solid var(--glass-border); border-radius: var(--radius); padding: 20px 16px; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 8px; transition: all .3s; backdrop-filter: blur(4px); }
    .tool-card:hover { transform: translateY(-4px); border-color: var(--accent-glow); box-shadow: 0 8px 24px rgba(59,130,246,0.1); }
    .tool-card .emoji { font-size: 32px; }
    .tool-card .name { font-size: 14px; font-weight: 600; }
    .tool-card .desc { font-size: 12px; color: var(--muted); line-height: 1.5; flex: 1; }
    .tool-card .tag { font-size: 10px; font-weight: 700; color: var(--accent); background: var(--accent-glow); border-radius: 8px; padding: 4px 12px; }
    .empty-state { grid-column: 1/-1; text-align: center; padding: 50px 20px; color: var(--muted); }
    .back-home { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 14px; font-weight: 500; margin-bottom: 20px; }
    .back-home:hover { color: var(--accent); }
    .footer { margin-top: 50px; padding-top: 20px; border-top: 1px solid var(--border); font-size: 12px; color: var(--muted); text-align: center; }
    @media (max-width: 640px) { .nav-bar { flex-direction: column; } .tools-grid { grid-template-columns: 1fr 1fr; } }
  </style>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1955887568822472"
     crossorigin="anonymous"></script>
</head>
<body>
<div class="container">
  <nav class="nav-bar">
    <div class="logo"><span class="mark">⛵</span>江湖小站-ZenTools</div>
    <div class="links">
      <a href="/">首页</a>
      <a href="#" class="active">图片工具</a>
      <a href="/plugins-preview.html">全部工具</a>
    </div>
  </nav>
  <a href="/" class="back-home">← 返回首页</a>
  <div class="page-header">
    <h1><span class="hl">图片</span> 工具箱</h1>
    <p>在线图片处理工具集合，支持压缩、格式转换、裁剪、加水印等操作</p>
  </div>
  <div class="tools-grid" id="toolsGrid"><div class="empty-state">⏳ 加载工具中...</div></div>
  <div class="footer">© 2026 <a href="/" style="color:var(--accent);">江湖小站-ZenTools</a> · 数据驱动分类架构</div>
</div>
<script>
  const CATEGORY_KEY = '图片工具';
  const PAGE_TITLE = '图片';
  const PAGE_DESC = '在线图片处理工具集合，支持压缩、格式转换、裁剪、加水印等操作';
  const fallbackTools = [
    { name: '图片压缩', url: '/image/compress.html', icon: '📦', description: '压缩 JPG、PNG、WebP 图片体积', category: '图片工具' },
    { name: '图片格式转换', url: '/image/convert.html', icon: '🔄', description: 'JPG、PNG、WebP、BMP 等格式互转', category: '图片工具' },
    { name: '图片尺寸修改', url: '/image/resize.html', icon: '📐', description: '自定义调整图片宽度和高度', category: '图片工具' },
    { name: '图片裁剪', url: '/image/crop.html', icon: '✂️', description: '自由裁剪图片区域', category: '图片工具' },
    { name: '图片加水印', url: '/image/watermark.html', icon: '💧', description: '添加文字或图片水印', category: '图片工具' }
  ];
  function renderTools(tools) {
    const c = document.getElementById('toolsGrid'); if (!c) return;
    const f = tools.filter(t => t.category === CATEGORY_KEY);
    if (!f.length) { c.innerHTML = '<div class="empty-state">📭 该分类下暂无工具，敬请期待</div>'; return; }
    let html = '';
    for (const t of f) {
      const cs = (!t.url || t.url === '#') ? 'tool-card' : 'tool-card';
      const h = (!t.url || t.url === '#') ? '#' : t.url;
      html += `<a class="${cs}" href="${h}" target="_blank"><span class="emoji">${t.icon || '🔧'}</span><span class="name">${t.name}</span><span class="desc">${t.description || ''}</span><span class="tag">${t.category || '工具'}</span></a>`;
    }
    c.innerHTML = html;
  }
  function load() {
    document.querySelector('.page-header h1').innerHTML = `<span class="hl">${PAGE_TITLE}</span> 工具箱`;
    document.querySelector('.page-header p').textContent = PAGE_DESC;
    fetch('/data/tools-data.json').then(r => r.ok ? r.json() : Promise.reject()).then(d => { if (d?.tools?.length) renderTools(d.tools); else renderTools(fallbackTools); }).catch(() => renderTools(fallbackTools));
  }
  document.addEventListener('DOMContentLoaded', load);
</script>
</body>
</html>
