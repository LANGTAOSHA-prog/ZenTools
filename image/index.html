<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>鍥剧墖宸ュ叿绠?- 江湖小站-ZenTools</title>
  <meta name="description" content="鍦ㄧ嚎鍥剧墖澶勭悊宸ュ叿闆嗗悎锛屾敮鎸佸浘鐗囧帇缂┿€佹牸寮忚浆鎹€佽鍓€佸姞姘村嵃绛夋搷浣溿€? />
  <style>
    /* ===== 澶嶇敤棣栭〉鏍峰紡 ===== */
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #070b18;
      --surface: #0e1629;
      --surface2: #141f37;
      --border: rgba(255,255,255,0.06);
      --border-hover: rgba(255,255,255,0.12);
      --text: #f0f4ff;
      --muted: #8899bb;
      --accent: #3b82f6;
      --accent-glow: rgba(59, 130, 246, 0.2);
      --radius: 12px;
      --radius-pill: 999px;
      --shadow: 0 8px 24px rgba(0,0,0,0.4);
    }
    [data-theme="light"] {
      --bg: #f2f5f9;
      --surface: #ffffff;
      --surface2: #f0f4fe;
      --border: rgba(0,0,0,0.06);
      --border-hover: rgba(0,0,0,0.14);
      --text: #0b111e;
      --muted: #4a5a7a;
      --shadow: 0 8px 24px rgba(0,0,0,0.06);
    }
    body { font-family: 'Inter', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; transition: background .3s; }
    a { text-decoration: none; color: inherit; }
    .container { max-width: 1080px; margin: 0 auto; padding: 30px 24px 60px; }

    /* 瀵艰埅鏍忥紙缁熶竴椋庢牸锛?*/
    .nav-bar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 24px; background: var(--surface); border: 1px solid var(--border);
      border-radius: 12px; margin-bottom: 40px; flex-wrap: wrap; gap: 12px;
    }
    .nav-bar .logo { font-weight: 800; font-size: 18px; color: var(--text); display: flex; align-items: center; gap: 10px; }
    .nav-bar .logo .mark { width: 30px; height: 30px; border-radius: 9px; background: linear-gradient(135deg, var(--accent), #8b5cf6); display: flex; align-items: center; justify-content: center; font-size: 14px; color: #fff; }
    .nav-bar .links { display: flex; gap: 6px; flex-wrap: wrap; }
    .nav-bar .links a { font-size: 13px; font-weight: 500; color: var(--muted); padding: 6px 14px; border-radius: var(--radius-pill); transition: .2s; }
    .nav-bar .links a:hover { color: var(--text); background: rgba(255,255,255,0.04); }
    .nav-bar .links a.active { color: var(--accent); background: var(--accent-glow); }

    /* 椤甸潰澶撮儴 */
    .page-header { margin-bottom: 32px; }
    .page-header h1 { font-size: 28px; font-weight: 800; letter-spacing: -.5px; }
    .page-header h1 .hl { background: linear-gradient(135deg, var(--accent), #8b5cf6); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .page-header p { color: var(--muted); margin-top: 6px; font-size: 15px; }

    /* 宸ュ叿缃戞牸 */
    .tools-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px;
    }
    .tool-card {
      background: var(--surface);
      border: 1px solid var(--border); border-radius: var(--radius); padding: 20px 16px;
      display: flex; flex-direction: column; align-items: center; text-align: center; gap: 8px;
      transition: all .2s; position: relative; overflow: hidden;
      text-decoration: none; color: inherit;
    }
    .tool-card:hover { transform: translateY(-4px); border-color: var(--border-hover); box-shadow: var(--shadow); }
    .tool-card .emoji { font-size: 32px; }
    .tool-card .name { font-size: 14px; font-weight: 600; color: var(--text); }
    .tool-card .desc { font-size: 12px; color: var(--muted); line-height: 1.5; flex: 1; }
    .tool-card .tag { font-size: 10px; font-weight: 700; color: var(--accent); background: var(--accent-glow); border-radius: 8px; padding: 4px 12px; }
    .tool-card .tag.new { color: #10b981; background: rgba(16,185,129,.08); }
    .tool-card.coming-soon { opacity: 0.5; cursor: not-allowed; pointer-events: none; }
    .tool-card.coming-soon .tag { color: var(--muted); background: rgba(122,132,153,.12); }

    /* 绌虹姸鎬?*/
    .empty-state { grid-column: 1/-1; text-align: center; padding: 50px 20px; color: var(--muted); }

    /* 杩斿洖棣栭〉 */
    .back-home { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 14px; font-weight: 500; margin-bottom: 20px; transition: .2s; }
    .back-home:hover { color: var(--accent); }

    /* Footer */
    .footer { margin-top: 50px; padding-top: 20px; border-top: 1px solid var(--border); font-size: 12px; color: var(--muted); text-align: center; }

    @media (max-width: 640px) {
      .nav-bar { flex-direction: column; align-items: stretch; text-align: center; }
      .nav-bar .links { justify-content: center; }
      .tools-grid { grid-template-columns: 1fr 1fr; gap: 12px; }
      .page-header h1 { font-size: 22px; }
    }
    @media (max-width: 400px) { .tools-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>

<div class="container">

  <!-- ===== 瀵艰埅鏍?===== -->
  <nav class="nav-bar">
    <div class="logo">
      <span class="mark">鉀?/span>
      江湖小站-ZenTools
    </div>
    <div class="links">
      <a href="/">棣栭〉</a>
      <a href="#" class="active">鍥剧墖宸ュ叿</a>
      <a href="/plugins-preview.html">鍏ㄩ儴宸ュ叿</a>
    </div>
  </nav>

  <!-- ===== 杩斿洖棣栭〉 ===== -->
  <a href="/" class="back-home">鈫?杩斿洖棣栭〉</a>

  <!-- ===== 椤甸潰澶撮儴 ===== -->
  <div class="page-header">
    <h1><span class="hl">鍥剧墖</span> 宸ュ叿绠?/h1>
    <p>鍦ㄧ嚎鍥剧墖澶勭悊宸ュ叿闆嗗悎锛屾敮鎸佸浘鐗囧帇缂┿€佹牸寮忚浆鎹㈢瓑鎿嶄綔</p>
  </div>

  <!-- ===== 宸ュ叿缃戞牸 ===== -->
  <div class="tools-grid" id="toolsGrid">
    <div class="empty-state">鈴?鍔犺浇宸ュ叿涓?..</div>
  </div>

  <!-- ===== Footer ===== -->
  <div class="footer">
    漏 2026 <a href="/" style="color:var(--accent);">江湖小站-ZenTools</a> 路 鏁版嵁椹卞姩鍒嗙被鏋舵瀯
  </div>

</div>

<script>
  // ============================================================
  // 鍒嗙被椤甸厤缃?
  // ============================================================
  const CATEGORY_KEY = '鍥剧墖宸ュ叿';   // 蹇呴』鍜?tools-data.json 涓殑 category 瀹屽叏涓€鑷?
  const PAGE_TITLE = '鍥剧墖';
  const PAGE_DESC = '鍦ㄧ嚎鍥剧墖澶勭悊宸ュ叿闆嗗悎锛屾敮鎸佸浘鐗囧帇缂┿€佹牸寮忚浆鎹㈢瓑鎿嶄綔';

  // ============================================================
  // 澶囩敤鏁版嵁锛圝SON 鍔犺浇澶辫触鏃朵娇鐢級
  // ============================================================
  const fallbackTools = [
    { name: '鍥剧墖鍘嬬缉', url: '/image/compress.html', icon: '馃摝', description: '鍘嬬缉 JPG銆丳NG銆乄ebP 鍥剧墖浣撶Н', category: '鍥剧墖宸ュ叿' },
    { name: '鍥剧墖鏍煎紡杞崲', url: '/image/convert.html', icon: '馃攧', description: 'JPG銆丳NG銆乄ebP銆丅MP 绛夋牸寮忎簰杞?, category: '鍥剧墖宸ュ叿' },
    { name: '鍥剧墖灏哄淇敼', url: '/image/resize.html', icon: '馃搻', description: '鑷畾涔夎皟鏁村浘鐗囧搴﹀拰楂樺害', category: '鍥剧墖宸ュ叿' },
    { name: '鍥剧墖瑁佸壀', url: '/image/crop.html', icon: '鉁傦笍', description: '鑷敱瑁佸壀鍥剧墖鍖哄煙', category: '鍥剧墖宸ュ叿' },
    { name: '鍥剧墖鍔犳按鍗?, url: '/image/watermark.html', icon: '馃挧', description: '娣诲姞鏂囧瓧鎴栧浘鐗囨按鍗?, category: '鍥剧墖宸ュ叿' },
    { name: '鍥剧墖杞?Base64', url: '/image/imagebase64.html', icon: '馃敘', description: '灏嗗浘鐗囪浆鎹负 Base64 缂栫爜', category: '鍥剧墖宸ュ叿' }
  ];

  // ============================================================
  // 娓叉煋鍑芥暟
  // ============================================================
  function renderTools(tools) {
    const container = document.getElementById('toolsGrid');
    if (!container) return;

    const filtered = tools.filter(t => t.category === CATEGORY_KEY);

    if (filtered.length === 0) {
      container.innerHTML = `<div class="empty-state">馃摥 璇ュ垎绫讳笅鏆傛棤宸ュ叿锛屾暚璇锋湡寰?/div>`;
      return;
    }

    let html = '';
    for (const tool of filtered) {
      const isComingSoon = tool.url === '#' || !tool.url || tool.url === '';
      const cardClass = isComingSoon ? 'tool-card coming-soon' : 'tool-card';
      const href = isComingSoon ? '#' : tool.url;
      const tagText = tool.new ? 'NEW' : (tool.category || '宸ュ叿');
      const tagClass = tool.new ? 'new' : '';

      html += `
        <a class="${cardClass}" href="${href}" target="${isComingSoon ? '' : '_blank'}" title="${tool.description || tool.name}">
          <span class="emoji">${tool.icon || '馃敡'}</span>
          <span class="name">${tool.name}</span>
          <span class="desc">${tool.description || '鐐瑰嚮浣跨敤宸ュ叿'}</span>
          <span class="tag ${tagClass}">${tagText}</span>
        </a>
      `;
    }

    container.innerHTML = html;
    console.log(`鉁?ZT-DCA: 鍥剧墖鍒嗙被椤靛姞杞藉畬鎴愶紝鍏?${filtered.length} 涓伐鍏穈);
  }

  // ============================================================
  // 鍔犺浇鏁版嵁
  // ============================================================
  function loadTools() {
    document.querySelector('.page-header h1').innerHTML = `<span class="hl">${PAGE_TITLE}</span> 宸ュ叿绠盽;
    document.querySelector('.page-header p').textContent = PAGE_DESC;

    fetch('/data/tools-data.json')
      .then(response => {
        if (!response.ok) throw new Error('HTTP ' + response.status);
        return response.json();
      })
      .then(data => {
        if (data && data.tools && data.tools.length > 0) {
          renderTools(data.tools);
        } else {
          throw new Error('宸ュ叿鏁版嵁涓虹┖');
        }
      })
      .catch(error => {
        console.warn('鈿狅笍 ZT-DCA: 鍥剧墖鍒嗙被椤靛姞杞藉け璐ワ紝浣跨敤澶囩敤鏁版嵁', error);
        renderTools(fallbackTools);
      });
  }

  document.addEventListener('DOMContentLoaded', loadTools);
</script>

</body>
</html>
