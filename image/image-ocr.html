<script>
function getMsg(k){const l=localStorage.getItem('zentools_lang')||'zh';return((window.ZT_PAGE||{})[l]||window.ZT_PAGE.zh)[k]||k;}
const upload=document.getElementById('uploadArea'),fileInput=document.getElementById('fileInput');
upload.onclick=()=>fileInput.click();
upload.addEventListener('dragover',e=>{e.preventDefault();upload.classList.add('dragover');});
upload.addEventListener('dragleave',()=>upload.classList.remove('dragover'));
upload.addEventListener('drop',e=>{e.preventDefault();upload.classList.remove('dragover');if(e.dataTransfer.files.length)handleFile(e.dataTransfer.files[0]);});
fileInput.onchange=e=>{if(e.target.files.length)handleFile(e.target.files[0]);};
let currentFile=null;
function handleFile(f){if(!f.type.startsWith('image/')){showMsg('请上传图片','error');return;}if(f.size>10*1024*1024){showMsg('图片最大10MB','error');return;}currentFile=f;const url=URL.createObjectURL(f);document.getElementById('uploadArea').innerHTML='<img class="preview-img" src="'+url+'"><input type="file" id="fileInput2" accept="image/*" style="display:none"><button onclick="location.reload()" style="margin-top:12px;padding:8px 16px;border-radius:8px;border:1px solid var(--border);background:var(--glass);color:var(--text);cursor:pointer">更换图片</button>';document.getElementById('fileInput2').onchange=e=>{if(e.target.files.length)handleFile(e.target.files[0]);};}
function processOCR(){if(!currentFile){showMsg(getMsg('msgNoFile'),'error');return;}document.getElementById('loading').classList.add('active');document.getElementById('resultArea').style.display='none';setTimeout(()=>{const mockText='[OCR识别结果]\n\n由于浏览器本地OCR功能限制，此工具演示OCR识别效果。\n\n实际使用时，建议使用Google Cloud Vision、Azure OCR或百度OCR等云服务。\n\n识别文字示例：\n这是从图片中提取的文本内容示例。\n包含多行文字和段落。\n支持中文、英文、日文等多种语言。';document.getElementById('resultText').value=mockText;document.getElementById('resultArea').style.display='block';document.getElementById('loading').classList.remove('active');showMsg('','');},1500);}
function showMsg(m,t){const e=document.getElementById('errorMsg');e.textContent=m;e.className='tool-msg'+(t?' '+t:'');}
function clearAll(){location.reload();}
function copyText(){const t=document.getElementById('resultText');t.select();document.execCommand('copy');}
</script>
<script>(function(){var s=document.createElement('script');s.src='/data/tools-data.json';s.type='application/json';s.id='toolsDataLoader';document.head.appendChild(s);
