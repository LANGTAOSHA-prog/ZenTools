<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="manifest" href="/manifest.json" />
  <title>EXIF 删除 - 江湖小站-ZenTools</title>
  <meta name="description" content="清除图片 EXIF 信息，保护隐私，减小文件体积" />
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    :root { --bg: #070b18; --surface: rgba(14,22,41,0.8); --surface2: rgba(20,31,55,0.9); --border: rgba(255,255,255,0.06); --text: #f0f4ff; --muted: #8899bb; --accent: #3b82f6; --accent2: #8b5cf6; --accent-glow: rgba(59,130,246,0.2); --radius: 14px; --radius-pill: 999px; }
    [data-theme="light"] { --bg: #f2f5f9; --surface: rgba(255,255,255,0.85); --surface2: rgba(240,244,254,0.9); --border: rgba(0,0,0,0.06); --text: #0b111e; --muted: #4a5a7a; }
    body { font-family: 'Inter', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .container { max-width: 800px; width: 100%; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 40px; text-align: center; }
    .card h1 { font-size: 24px; margin-bottom: 12px; }
    .card .icon { font-size: 64px; margin-bottom: 20px; }
    .card p { color: var(--muted); margin-bottom: 30px; line-height: 1.6; }
    .placeholder { background: var(--surface2); border: 2px dashed var(--border); border-radius: var(--radius); padding: 60px 20px; margin-bottom: 30px; }
    .placeholder .emoji { font-size: 48px; margin-bottom: 16px; }
    .placeholder h2 { font-size: 18px; margin-bottom: 8px; color: var(--text); }
    .placeholder p { font-size: 14px; }
    .btn { display: inline-block; padding: 12px 28px; background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff; border-radius: var(--radius-pill); text-decoration: none; font-weight: 600; margin: 8px; transition: all .3s; }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(59,130,246,0.4); }
    .btn-secondary { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
    .footer { margin-top: 40px; text-align: center; font-size: 12px; color: var(--muted); }
    .bookmark-float{position:fixed;bottom:24px;right:24px;z-index:999;display:flex;align-items:center;gap:8px;background:linear-gradient(135deg,#2563eb,#7c3aed);color:#fff;border:none;padding:14px 22px;border-radius:50px;font-size:15px;font-weight:600;cursor:pointer;box-shadow:0 6px 24px rgba(37,99,235,0.35);transition:transform 0.2s,box-shadow 0.2s;text-decoration:none}.bookmark-float:hover{transform:translateY(-3px);box-shadow:0 10px 32px rgba(37,99,235,0.45)}.bookmark-float:active{transform:scale(0.96)}
  </style>
</head>
<body>
<div class="container">
  <div class="card">
    <div class="icon">🧹</div>
    <h1>EXIF 删除</h1>
    <p>清除图片 EXIF 信息，保护隐私，减小文件体积</p>
    <div class="placeholder">
      <div class="emoji">🚧</div>
      <h2>开发中</h2>
      <p>此工具正在开发中，敬请期待！</p>
    </div>
    <div>
      <a href="/" class="btn btn-secondary">返回首页</a>
      <a href="/plugins-preview.html" class="btn">浏览其他工具</a>
    </div>
  </div>
  <div class="footer">
    © 2026 <a href="/" style="color:var(--accent);">江湖小站-ZenTools</a> · 数据驱动分类架构
  </div>
</div>
<button class="bookmark-float" onclick="prompt('复制链接收藏本站','https://zentools.xyz')">⭐ 收藏本站</button>
</body>
</html>
