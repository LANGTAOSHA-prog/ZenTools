<div class="container">

<h1><span class="icon">✨</span> AI 抠图</h1>
    <p class="desc">AI 智能抠图，自动识别主体并去除背景</p>
    
    <div class="tool-area">
      <div class="upload-zone" id="dropZone">
        <div class="icon-big">📁</div>
        <p>点击或拖拽上传图片</p>
        <p class="hint">基于颜色和边缘检测的智能抠图</p>

<button class="bookmark-float" onclick="prompt('复制链接收藏本站','https://zentools.xyz')" data-i18n="btn_收藏本站">⭐ 收藏本站</button>
<script>

    const fileInput = document.getElementById('fileInput');
    const dropZone = document.getElementById('dropZone');
    const processBtn = document.getElementById('processBtn');
    const resultArea = document.getElementById('resultArea');
    const resultCanvas = document.getElementById('resultCanvas');
    const downloadLink = document.getElementById('downloadLink');
    const srcImg = document.getElementById('srcImg');
    const toleranceInput = document.getElementById('tolerance');
    const toleranceVal = document.getElementById('toleranceVal');
    const bgColorInput = document.getElementById('bgColor');
    const pickBtn = document.getElementById('pickBtn');
    let dataUrl = null, origFile = null;

    toleranceInput.addEventListener('input', () => { toleranceVal.textContent = toleranceInput.value; });

    dropZone.addEventListener('click', () => fileInput.click());
    dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.style.borderColor = '#3b82f6'; });
    dropZone.addEventListener('dragleave', () => { dropZone.style.borderColor = ''; });
    dropZone.addEventListener('drop', e => { e.preventDefault(); dropZone.style.borderColor = ''; if(e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]); });
    fileInput.addEventListener('change', e => { if(e.target.files.length) handleFile(e.target.files[0]); });

    function handleFile(file) {
      origFile = file;
      const reader = new FileReader();
      reader.onload = function(e) {
        dataUrl = e.target.result;
        srcImg.src = dataUrl;
        dropZone.classList.add('has-image');
        dropZone.querySelector('p').textContent = file.name;
        processBtn.disabled = false;
      };
      reader.readAsDataURL(file);
    }

    function colorDist(c1, c2) {
      return Math.sqrt(
        (c1[0]-c2[0])**2 + (c1[1]-c2[1])**2 + (c1[2]-c2[2])**2
      );
    }

    function floodFill(ctx, w, h, startX, startY, targetColor, tolerance, replaceColor) {
      const imageData = ctx.getImageData(0, 0, w, h);
      const data = imageData.data;
      if(targetColor[3] === 0) return; // already transparent

      const visited = new Uint8Array(w * h);
      const stack = [[startX, startY]];
      const tr = targetColor[0], tg = targetColor[1], tb = targetColor[2];

      while(stack.length > 0) {
        const [x, y] = stack.pop();
        if(x < 0 || x >= w || y < 0 || y >= h) continue;
        const idx = y * w + x;
        if(visited[idx]) continue;
        visited[idx] = 1;
        const pi = idx * 4;
        const dist = Math.sqrt(
          (data[pi]-tr)**2 + (data[pi+1]-tg)**2 + (data[pi+2]-tb)**2
        );
        if(dist > tolerance) continue;
        data[pi] = replaceColor[0];
        data[pi+1] = replaceColor[1];
        data[pi+2] = replaceColor[2];
        data[pi+3] = replaceColor[3];
        stack.push([x+1, y], [x-1, y], [x, y+1], [x, y-1]);
      }
      ctx.putImageData(imageData, 0, 0);
    }

    pickBtn.addEventListener('click', function() {
      // Will sample the average color from the canvas (after processing)
    });

    processBtn.addEventListener('click', function() {
      if(!dataUrl) return;
      const img = new Image();
      img.onload = function() {
        resultCanvas.width = img.width;
        resultCanvas.height = img.height;
        const ctx = resultCanvas.getContext('2d');
        ctx.drawImage(img, 0, 0);

        const tol = parseInt(toleranceInput.value);
        const bgHex = bgColorInput.value;
        const bgR = parseInt(bgHex.slice(1,3), 16);
        const bgG = parseInt(bgHex.slice(3,5), 16);
        const bgB = parseInt(bgHex.slice(5,7), 16);

        // Method: Sample corners as background, remove similar colors
        const w = img.width, h = img.height;
        const imageData = ctx.getImageData(0, 0, w, h);
        const data = imageData.data;

        // Sample background colors from corners
        const samples = [];
        const samplePoints = [
          [0, 0], [w-1, 0], [0, h-1], [w-1, h-1],
          [Math.floor(w/2), 0], [Math.floor(w/2), h-1],
          [0, Math.floor(h/2)], [w-1, Math.floor(h/2)]
        ];
        samplePoints.forEach(([sx, sy]) => {
          const si = (sy * w + sx) * 4;
          samples.push([data[si], data[si+1], data[si+2]]);
        });

        for(let i = 0; i < data.length; i += 4) {
          for(const sample of samples) {
            const d = Math.sqrt(
              (data[i]-sample[0])**2 + (data[i+1]-sample[1])**2 + (data[i+2]-sample[2])**2
            );
            if(d < tol) {
              data[i+3] = 0; // make transparent
              break;
            }
          }
        }
        ctx.putImageData(imageData, 0, 0);
        resultArea.style.display = 'block';
        downloadLink.href = resultCanvas.toDataURL('image/png');
      };
      img.src = dataUrl;
    });
    
</script>
