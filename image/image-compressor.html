<h1 data-i18n="h_拖进来_体积秒降">📦 拖进来，体积秒降70%，画质几乎不变</h1>
        <div class="sub">
            <span class="badge">📎 支持批量拖拽</span>
            <span class="badge">📦 压缩后自动打包ZIP下载</span>
        </div>
    </div>

    <div class="upload-zone" id="uploadZone">
        <div class="icon">🖼️</div>
        <div class="hint">点击上传或拖拽图片到此处</div>
        <div class="sub-hint">支持 JPG / PNG / WebP，单张最大 20MB，多张自动打包</div>
        <input type="file" id="fileInput" accept="image/jpeg,image/png,image/webp" multiple />
    </div>

    <div class="controls">
        <label>压缩质量 <input type="range" id="qualityRange" min="10" max="90" value="60" /> <span class="val" id="qualityLabel">60%</span></label>
        <label><input type="checkbox" id="resizeCheck" /> 限制最大宽度</label>
        <label id="resizeLabel" style="display:none;"><input type="number" id="maxWidth" value="1920" style="width:70px;padding:6px 8px;border:1px solid #d0d7de;border-radius:8px;" /> px</label>
        <button class="btn-primary" id="compressAllBtn" data-i18n="btn_立即压图_省">🚀 立即压图，省出3倍空间</button>
    </div>

    <div id="summary" class="summary" style="display:none;">
        <div class="stat"><div class="num" id="totalCount">0</div><div class="lbl">已压缩</div></div>
        <div class="stat"><div class="num" id="origSize">0 KB</div><div class="lbl">原始大小</div></div>
        <div class="stat"><div class="num" id="compSize">0 KB</div><div class="lbl">压缩后体积</div></div>
        <div class="stat"><div class="num" id="savePercent">0%</div><div class="lbl">节省空间</div></div>
    </div>

    <div id="progressSection" style="display:none;margin:16px 0;">
        <div style="display:flex;justify-content:space-between;font-size:13px;color:#6b7280;margin-bottom:4px;">
            <span id="progressLabel">压缩进度</span>
            <span id="progressPercent">0%</span>
        </div>
        <div class="progress-bar-wrap"><div class="fill" id="progressFill"></div></div>
    </div>

    <div class="empty-state show" id="emptyState">📭 请上传需要压缩的图片</div>

    <div class="footer-tip">🛡️ 隐私承诺：所有图片仅在浏览器本地处理，<strong>绝不</strong>上传到任何服务器。</div>

<script>
(function() {
    const uploadZone = document.getElementById('uploadZone');
    const fileInput = document.getElementById('fileInput');
    const imageGrid = document.getElementById('imageGrid');
    const emptyState = document.getElementById('emptyState');
    const qualityRange = document.getElementById('qualityRange');
    const qualityLabel = document.getElementById('qualityLabel');
    const compressAllBtn = document.getElementById('compressAllBtn');
    const summary = document.getElementById('summary');
    const totalCount = document.getElementById('totalCount');
    const origSize = document.getElementById('origSize');
    const compSize = document.getElementById('compSize');
    const savePercent = document.getElementById('savePercent');
    const resizeCheck = document.getElementById('resizeCheck');
    const resizeLabel = document.getElementById('resizeLabel');
    const maxWidth = document.getElementById('maxWidth');
    const progressSection = document.getElementById('progressSection');
    const progressFill = document.getElementById('progressFill');
    const progressPercent = document.getElementById('progressPercent');
    const progressLabel = document.getElementById('progressLabel');
    let images = [];
    let compressedCount = 0;

    resizeCheck.addEventListener('change', function() { resizeLabel.style.display = this.checked ? 'inline' : 'none'; });
    qualityRange.addEventListener('input', function() { qualityLabel.textContent = this.value + '%'; });
    uploadZone.addEventListener('click', function() { fileInput.click(); });
    uploadZone.addEventListener('dragover', function(e) { e.preventDefault(); this.classList.add('dragover'); });
    uploadZone.addEventListener('dragleave', function() { this.classList.remove('dragover'); });
    uploadZone.addEventListener('drop', function(e) { e.preventDefault(); this.classList.remove('dragover'); if (e.dataTransfer.files.length) handleFiles(e.dataTransfer.files); });
    fileInput.addEventListener('change', function() { if (this.files.length) handleFiles(this.files); this.value = ''; });

    function handleFiles(files) {
        for (var i = 0; i < files.length; i++) {
            var f = files[i];
            if (!f.type.match(/image\/(jpeg|png|webp)/)) continue;
            if (f.size > 20 * 1024 * 1024) continue;
            var reader = new FileReader();
            reader.onload = (function(file) { return function(e) { var img = new Image(); img.onload = function() { images.push({ file: file, dataURL: e.target.result, img: img, compressed: null, compressedSize: 0 }); renderGrid(); }; img.src = e.target.result; }; })(f);
            reader.readAsDataURL(f);
        }
    }

    function renderGrid() {
        imageGrid.innerHTML = '';
        images.forEach(function(item, idx) {
            var card = document.createElement('div');
            card.className = 'image-card';
            var origKB = (item.file.size / 1024).toFixed(1);
            var compKB = item.compressed ? (item.compressedSize / 1024).toFixed(1) : '-';
            var saved = item.compressed ? ((1 - item.compressedSize / item.file.size) * 100).toFixed(0) : 0;
            card.innerHTML = '<button class="remove-btn" data-idx="' + idx + '">✕</button>' +
                '<div class="img-wrap"><img src="' + item.dataURL + '" alt="' + item.file.name + '"/></div>' +
                '<div class="info">' +
                '<div class="row"><span class="label">文件名</span><span>' + item.file.name.substring(0, 20) + '</span></div>' +
                '<div class="row"><span class="label">原始大小</span><span style="color:#6b7280;">' + origKB + ' KB</span></div>' +
                (item.compressed ? '<div class="row"><span class="label">压缩后体积</span><span class="saved">' + compKB + ' KB</span></div>' : '<div class="row"><span class="label">压缩后体积</span><span style="color:#9ca3af;">⏳ 待压缩</span></div>') +
                (item.compressed ? '<div class="progress-bar-wrap"><div class="fill complete" style="width:' + saved + '%"></div></div><div style="text-align:right;font-size:12px;color:#059669;font-weight:600;margin-top:4px;">节省 ' + saved + '%</div>' : '');
            imageGrid.appendChild(card);
            card.querySelector('.remove-btn').addEventListener('click', function() { images.splice(idx, 1); renderGrid(); updateSummary(); });
        });
        emptyState.classList.toggle('show', images.length === 0);
        updateSummary();
    }

    compressAllBtn.addEventListener('click', function() {
        if (images.length === 0) { alert('请先上传图片'); return; }
        compressedCount = 0;
        compressAllBtn.disabled = true;
        compressAllBtn.innerHTML = '<span class="loader"></span> 压缩中...';
        progressSection.style.display = 'block';
        progressFill.style.width = '0%';
        progressPercent.textContent = '0%';
        progressLabel.textContent = '压缩进度 0/' + images.length;
        images.forEach(function(item, idx) {
            compressImage(item, function() {
                compressedCount++;
                var pct = Math.round(compressedCount / images.length * 100);
                progressFill.style.width = pct + '%';
                progressPercent.textContent = pct + '%';
                progressLabel.textContent = '压缩进度 ' + compressedCount + '/' + images.length;
                renderGrid();
                updateSummary();
                if (compressedCount === images.length) {
                    progressFill.classList.add('complete');
                    progressLabel.textContent = '✅ 压缩完成！';
                    compressAllBtn.disabled = false;
                    compressAllBtn.innerHTML = '🚀 再次压缩';
                    // Add download button
                    if (!document.getElementById('downloadAllBtn')) {
                        var dlBtn = document.createElement('button');
                        dlBtn.id = 'downloadAllBtn';
                        dlBtn.className = 'btn-primary btn-success';
                        dlBtn.textContent = '📎 下载全部 ZIP';
                        dlBtn.style.marginTop = '10px';
                        dlBtn.addEventListener('click', function() {
                            images.forEach(function(item) {
                                if (!item.compressed) return;
                                var a = document.createElement('a');
                                a.download = item.file.name.replace(/\.[^.]+$/, '') + '-compressed.jpg';
                                a.href = item.compressed; a.click();
                            });
                        });
                        compressAllBtn.parentNode.appendChild(dlBtn);
                    }
                }
            });
        });
    });

    function compressImage(item, callback) {
        var img = item.img;
        var canvas = document.createElement('canvas');
        var ctx = canvas.getContext('2d');
        var w = img.width, h = img.height;
        if (resizeCheck.checked) { var maxW = parseInt(maxWidth.value) || 1920; if (w > maxW) { h = h * maxW / w; w = maxW; } }
        canvas.width = w; canvas.height = h;
        ctx.drawImage(img, 0, 0, w, h);
        var quality = parseInt(qualityRange.value) / 100;
        var type = item.file.type === 'image/png' ? 'image/jpeg' : item.file.type;
        var dataURL = canvas.toDataURL(type, quality);
        var bin = atob(dataURL.split(',')[1]);
        item.compressed = dataURL;
        item.compressedSize = bin.length;
        callback();
    }

    function updateSummary() {
        if (images.length === 0 || !images.some(function(i) { return i.compressed; })) { summary.style.display = 'none'; return; }
        summary.style.display = 'flex';
        var total = images.length, orig = 0, comp = 0;
        images.forEach(function(i) { orig += i.file.size; if (i.compressed) comp += i.compressedSize; });
        totalCount.textContent = total;
        origSize.textContent = (orig / 1024).toFixed(0) + ' KB';
        compSize.textContent = (comp / 1024).toFixed(0) + ' KB';
        savePercent.textContent = orig > 0 ? ((1 - comp / orig) * 100).toFixed(0) + '%' : '0%';
    }
})();
</script>

<script>

<script>
// 暗黑模式切换
(function() {
  var savedTheme = localStorage.getItem('zentools_theme');
  if (savedTheme === 'dark') document.documentElement.classList.add('dark');
  var btn = document.getElementById('themeToggle');
  if (btn) {
    btn.textContent = document.documentElement.classList.contains('dark') ? '☀️' : '🌙';
    btn.addEventListener('click', function() {
      document.documentElement.classList.toggle('dark');
      var isDark = document.documentElement.classList.contains('dark');
      this.textContent = isDark ? '☀️' : '🌙';
      localStorage.setItem('zentools_theme', isDark ? 'dark' : 'light');
    });
  }
})();

// 移动端侧滑
(function() {
  var overlay = document.getElementById('mobileOverlay');
  var hamBtn = document.getElementById('hamburgerBtn');
  var closeBtn = document.getElementById('mobileClose');
  if (!hamBtn || !overlay) return;
  function closeMenu() { overlay.classList.remove('open'); hamBtn.textContent = '☰'; document.body.style.overflow = ''; }
  hamBtn.addEventListener('click', function(e) {
    e.stopPropagation();
    if (overlay.classList.contains('open')) { closeMenu(); } else {
      overlay.classList.add('open'); hamBtn.textContent = '✕'; document.body.style.overflow = 'hidden';
    }
  });
  if (closeBtn) closeBtn.addEventListener('click', closeMenu);
  overlay.addEventListener('click', function(e) {
    var drawer = document.getElementById('mobileDrawer');
    if (drawer && !drawer.contains(e.target)) closeMenu();
  });
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape' && overlay.classList.contains('open')) closeMenu();
  });
})();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', function() {
    navigator.serviceWorker.register('/sw.js').catch(function() {});
  });
}
</script>
