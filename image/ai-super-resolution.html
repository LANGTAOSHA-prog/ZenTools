    <div class="tool-area">
      <div class="upload-zone" id="dropZone">

<script>

    const fileInput = document.getElementById('fileInput');
    const dropZone = document.getElementById('dropZone');
    const processBtn = document.getElementById('processBtn');
    const resultArea = document.getElementById('resultArea');
    const resultCanvas = document.getElementById('resultCanvas');
    const downloadLink = document.getElementById('downloadLink');
    const scaleSelect = document.getElementById('scale');
    const sharpenInput = document.getElementById('sharpen');
    const sharpenVal = document.getElementById('sharpenVal');
    let dataUrl = null;

    sharpenInput.addEventListener('input', () => { sharpenVal.textContent = sharpenInput.value; });

    dropZone.addEventListener('click', () => fileInput.click());
    dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.style.borderColor = '#3b82f6'; });
    dropZone.addEventListener('dragleave', () => { dropZone.style.borderColor = ''; });
    dropZone.addEventListener('drop', e => { e.preventDefault(); dropZone.style.borderColor = ''; if(e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]); });
    fileInput.addEventListener('change', e => { if(e.target.files.length) handleFile(e.target.files[0]); });

    function handleFile(file) {
      const reader = new FileReader();
      reader.onload = function(e) {
        dataUrl = e.target.result;
        dropZone.classList.add('has-image');
        dropZone.querySelector('p').textContent = file.name;
        processBtn.disabled = false;
      };
      reader.readAsDataURL(file);
    }

    function sharpenFilter(ctx, w, h, amount) {
      const imageData = ctx.getImageData(0, 0, w, h);
      const data = imageData.data;
      const src = new Float32Array(data);
      const kernel = [
        -amount, -amount, -amount,
        -amount, 1 + 8*amount, -amount,
        -amount, -amount, -amount
      ];
      for(let y = 1; y < h-1; y++) {
        for(let x = 1; x < w-1; x++) {
          let r = 0, g = 0, b = 0;
          for(let ky = -1; ky <= 1; ky++) {
            for(let kx = -1; kx <= 1; kx++) {
              const idx = ((y+ky) * w + (x+kx)) * 4;
              const ki = (ky+1) * 3 + (kx+1);
              r += src[idx] * kernel[ki];
              g += src[idx+1] * kernel[ki];
              b += src[idx+2] * kernel[ki];
            }
          }
          const idx = (y * w + x) * 4;
          data[idx] = Math.max(0, Math.min(255, r));
          data[idx+1] = Math.max(0, Math.min(255, g));
          data[idx+2] = Math.max(0, Math.min(255, b));
        }
      }
      ctx.putImageData(imageData, 0, 0);
    }

    processBtn.addEventListener('click', function() {
      if(!dataUrl) return;
      const img = new Image();
      img.onload = function() {
        const scale = parseInt(scaleSelect.value);
        const w = img.width * scale;
        const h = img.height * scale;
        resultCanvas.width = w;
        resultCanvas.height = h;
        const ctx = resultCanvas.getContext('2d');
        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = 'high';
        ctx.drawImage(img, 0, 0, w, h);

        const sharpenAmt = parseFloat(sharpenInput.value);
        if(sharpenAmt > 0) {
          sharpenFilter(ctx, w, h, sharpenAmt);
        }
        resultArea.style.display = 'block';
        downloadLink.href = resultCanvas.toDataURL('image/png');
      };
      img.src = dataUrl;
    });
    
</script>
