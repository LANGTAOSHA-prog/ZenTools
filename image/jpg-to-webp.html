<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="manifest" href="/manifest.json" />
  <title>JPG 转 WebP - 江湖小站-ZenTools</title>
  <meta name="description" content="将 JPG 图片转换为 WebP 格式，减小文件体积" />
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #070b18; --surface: rgba(14,22,41,0.8); --surface2: rgba(20,31,55,0.9);
      --border: rgba(255,255,255,0.06); --text: #f0f4ff; --muted: #8899bb;
      --accent: #3b82f6; --accent2: #8b5cf6; --accent-glow: rgba(59,130,246,0.2);
      --radius: 14px; --radius-pill: 999px;
    }
    body {
      font-family: 'Inter', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
      background: var(--bg); color: var(--text); min-height: 100vh; padding: 20px;
    }
    .container { max-width: 960px; width: 100%; margin: 0 auto; }
    .card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 40px;
    }
    .card h1 { font-size: 24px; margin-bottom: 8px; display: flex; align-items: center; gap: 12px; }
    .card .icon { font-size: 36px; }
    .card .desc { color: var(--muted); margin-bottom: 24px; line-height: 1.6; }
    .tool-area { background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; margin-bottom: 20px; }
    .upload-zone {
      border: 2px dashed var(--border); border-radius: var(--radius); padding: 40px;
      text-align: center; cursor: pointer; transition: all .3s;
    }
    .upload-zone:hover { border-color: var(--accent); background: rgba(59,130,246,0.05); }
    .upload-zone.has-image { border-style: solid; border-color: var(--accent); padding: 16px; }
    .upload-zone .icon-big { font-size: 48px; margin-bottom: 12px; }
    .upload-zone .hint { color: var(--muted); font-size: 14px; }
    .upload-zone input[type="file"] { display: none; }
    .preview-area { margin-top: 16px; text-align: center; }
    .preview-area img, .preview-area canvas {
      max-width: 100%; max-height: 450px; border-radius: 10px; background: #0a0e1a;
    }
    .controls { display: flex; flex-wrap: wrap; gap: 12px; margin: 16px 0; align-items: center; }
    .controls label { font-size: 13px; color: var(--muted); min-width: 60px; }
    .controls input, .controls select {
      background: #0a0e1a; border: 1px solid var(--border); color: var(--text);
      padding: 8px 12px; border-radius: 8px; font-size: 14px;
    }
    .controls input[type="number"] { width: 80px; }
    .controls input[type="range"] { width: 140px; }
    .btn {
      display: inline-flex; align-items: center; gap: 6px; padding: 10px 24px;
      background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff;
      border: none; border-radius: var(--radius-pill); font-size: 14px; font-weight: 600;
      cursor: pointer; transition: all .3s;
    }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(59,130,246,0.4); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    .btn-secondary { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
    .btn-sm { padding: 6px 16px; font-size: 12px; }
    .result-area { margin-top: 16px; text-align: center; }
    .result-area a.download-btn {
      display: inline-block; margin-top: 12px; padding: 12px 28px;
      background: linear-gradient(135deg, #10b981, #059669); color: #fff;
      border-radius: var(--radius-pill); text-decoration: none; font-weight: 600;
    }
    .result-area a.download-btn:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(16,185,129,0.4); }
    .footer { margin-top: 40px; text-align: center; font-size: 12px; color: var(--muted); }
    .bookmark-float{
      position:fixed;bottom:24px;right:24px;z-index:999;display:flex;align-items:center;gap:8px;
      background:linear-gradient(135deg,#2563eb,#7c3aed);color:#fff;border:none;padding:14px 22px;
      border-radius:50px;font-size:15px;font-weight:600;cursor:pointer;
      box-shadow:0 6px 24px rgba(37,99,235,0.35);transition:transform 0.2s,box-shadow 0.2s;
      text-decoration:none;
    }
    .bookmark-float:hover{transform:translateY(-3px);box-shadow:0 10px 32px rgba(37,99,235,0.45)}
    .flex-row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
    .info-grid { display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; font-size: 13px; }
    .info-grid dt { color: var(--muted); }
    .info-grid dd { color: var(--text); }
    @media(max-width:640px){.bookmark-float{bottom:16px;right:16px;padding:12px 18px;font-size:13px}}
  </style>
</head>
<body>
<div class="container">
  <div class="card">
    <h1><span class="icon">🔄</span> JPG 转 WebP</h1>
    <p class="desc">将 JPG 图片转换为 WebP 格式，减小文件体积</p>
    
    <div class="tool-area">
      <div class="upload-zone" id="dropZone">
        <div class="icon-big">📁</div>
        <p>点击或拖拽上传图片</p>
        <p class="hint">支持 jpg 格式</p>
        <input type="file" id="fileInput" accept="image/jpg" />
      </div>
      <div class="controls">
        <label>质量:</label>
        <input type="range" id="quality" min="0.1" max="1" step="0.05" value="0.92" />
        <span id="qualityVal">92%</span>
      </div>
      <div class="flex-row">
        <button class="btn" id="convertBtn" disabled>转换并下载</button>
      </div>
      <div class="preview-area" id="previewArea" style="display:none">
        <img id="previewImg" />
      </div>
    </div>
    
  </div>
  <div class="footer">
    © 2026 <a href="/" style="color:var(--accent);">江湖小站-ZenTools</a> · 所有处理在浏览器本地完成
  </div>
</div>
<button class="bookmark-float" onclick="prompt('复制链接收藏本站','https://zentools.xyz')">⭐ 收藏本站</button>
<script>

    const fileInput = document.getElementById('fileInput');
    const dropZone = document.getElementById('dropZone');
    const convertBtn = document.getElementById('convertBtn');
    const previewArea = document.getElementById('previewArea');
    const previewImg = document.getElementById('previewImg');
    const qualityInput = document.getElementById('quality');
    const qualityVal = document.getElementById('qualityVal');

    let currentFile = null;
    let imgDataUrl = null;

    qualityInput.addEventListener('input', () => {
      qualityVal.textContent = Math.round(qualityInput.value * 100) + '%';
    });

    dropZone.addEventListener('click', () => fileInput.click());
    dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.style.borderColor = '#3b82f6'; });
    dropZone.addEventListener('dragleave', () => { dropZone.style.borderColor = ''; });
    dropZone.addEventListener('drop', e => { e.preventDefault(); dropZone.style.borderColor = ''; if(e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]); });
    fileInput.addEventListener('change', e => { if(e.target.files.length) handleFile(e.target.files[0]); });

    function handleFile(file) {
      currentFile = file;
      const reader = new FileReader();
      reader.onload = function(e) {
        imgDataUrl = e.target.result;
        previewArea.style.display = 'block';
        previewImg.src = imgDataUrl;
        convertBtn.disabled = false;
        dropZone.classList.add('has-image');
        dropZone.querySelector('p').textContent = file.name;
      };
      reader.readAsDataURL(file);
    }

    convertBtn.addEventListener('click', function() {
      if(!imgDataUrl) return;
      const img = new Image();
      img.onload = function() {
        const canvas = document.createElement('canvas');
        canvas.width = img.width;
        canvas.height = img.height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0);
        const ext = 'webp';
        const mime = 'image/webp';
        const quality = parseFloat(qualityInput.value);
        let dataUrl;
        if(mime === 'image/jpeg') {
          dataUrl = canvas.toDataURL(mime, quality);
        } else {
          dataUrl = canvas.toDataURL(mime);
        }
        const link = document.createElement('a');
        link.download = 'converted.' + ext;
        link.href = dataUrl;
        link.click();
      };
      img.src = imgDataUrl;
    });
    
</script>
</body>
</html>
