document.getElementById("imageInput").addEventListener("change",function(e){const f=e.target.files[0];if(!f)return;imgFile=f;const r=new FileReader();r.onload=function(ev){const img=new Image();img.onload=function(){originalImg=img;cs.width=Math.min(img.width,800);cs.height=img.height*(cs.width/img.width);applyAll();};img.src=ev.target.result;};r.readAsDataURL(f);});

function applyAll(){if(!originalImg)return;ctx.clearRect(0,0,cs.width,cs.height);ctx.drawImage(originalImg,0,0,cs.width,cs.height);const b=parseInt(document.getElementById('brightness').value);const c=parseInt(document.getElementById('contrast').value);const s=parseInt(document.getElementById('saturation').value);if(b===0&&c===0&&s===0)return;const imgData=ctx.getImageData(0,0,cs.width,cs.height);const d=imgData.data;const cf=(259*(c+255))/(255*(259-c));for(let i=0;i<d.length;i+=4){d[i]=Math.max(0,Math.min(255,cf*(d[i]-128)+128+b));d[i+1]=Math.max(0,Math.min(255,cf*(d[i+1]-128)+128+b));d[i+2]=Math.max(0,Math.min(255,cf*(d[i+2]-128)+128+b));if(s!==0){const gray=0.299*d[i]+0.587*d[i+1]+0.114*d[i+2];const factor=1+s/100;d[i]=Math.max(0,Math.min(255,gray+factor*(d[i]-gray)));d[i+1]=Math.max(0,Math.min(255,gray+factor*(d[i+1]-gray)));d[i+2]=Math.max(0,Math.min(255,gray+factor*(d[i+2]-gray)));}}ctx.putImageData(imgData,0,0);}
function resetSliders(){['brightness','contrast','saturation'].forEach(function(id){document.getElementById(id).value=0;document.getElementById(id+'Val').textContent='0';});if(originalImg)applyAll();}
