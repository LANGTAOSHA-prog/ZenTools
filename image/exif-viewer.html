<script>

    const fileInput = document.getElementById('fileInput');
    const dropZone = document.getElementById('dropZone');
    const resultArea = document.getElementById('resultArea');
    const exifInfo = document.getElementById('exifInfo');
    const previewImg = document.getElementById('previewImg');

    dropZone.addEventListener('click', () => fileInput.click());
    dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.style.borderColor = '#3b82f6'; });
    dropZone.addEventListener('dragleave', () => { dropZone.style.borderColor = ''; });
    dropZone.addEventListener('drop', e => { e.preventDefault(); dropZone.style.borderColor = ''; if(e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]); });
    fileInput.addEventListener('change', e => { if(e.target.files.length) handleFile(e.target.files[0]); });

    function handleFile(file) {
      const reader = new FileReader();
      reader.onload = function(e) {
        const dataUrl = e.target.result;
        previewImg.src = dataUrl;
        dropZone.classList.add('has-image');
        dropZone.querySelector('p').textContent = file.name;
        resultArea.style.display = 'block';

        // Parse EXIF from binary
        const binary = atob(dataUrl.split(',')[1]);
        const buf = new ArrayBuffer(binary.length);
        const view = new Uint8Array(buf);
        for(let i = 0; i < binary.length; i++) view[i] = binary.charCodeAt(i);
        const dv = new DataView(buf);

        let html = '<dl class="info-grid">';
        html += '<dt>文件名</dt><dd>' + file.name + '</dd>';
        html += '<dt>文件大小</dt><dd>' + (file.size / 1024).toFixed(1) + ' KB</dd>';
        html += '<dt>类型</dt><dd>' + file.type + '</dd>';

        // Check for JPEG SOI marker
        if(view[0] === 0xFF && view[1] === 0xD8) {
          let off = 2;
          while(off < view.length) {
            if(view[off] !== 0xFF) break;
            const marker = view[off + 1];
            if(marker === 0xD9) break; // EOI
            const segLen = (view[off + 2] << 8) | view[off + 3];
            if(marker === 0xE1 && segLen >= 8) {
              // APP1 - EXIF
              const exifOff = off + 4;
              const exifId = String.fromCharCode(view[exifOff], view[exifOff+1], view[exifOff+2], view[exifOff+3], view[exifOff+4], view[exifOff+5]);
              if(exifId === 'Exif\0\0') {
                html += '<dt>EXIF</dt><dd>已找到</dd>';
                // Parse TIFF header
                const tiffOff = exifOff + 6;
                const endian = String.fromCharCode(view[tiffOff], view[tiffOff+1]);
                const littleEndian = endian === 'II';
                const magic = littleEndian ?
                  (view[tiffOff+2] | (view[tiffOff+3] << 8)) :
                  (view[tiffOff+3] | (view[tiffOff+2] << 8));
                html += '<dt>字节序</dt><dd>' + (littleEndian ? 'Little Endian' : 'Big Endian') + '</dd>';
                if(magic === 0x002A) {
                  const ifdOff = littleEndian ?
                    (view[tiffOff+4] | (view[tiffOff+5] << 8) | (view[tiffOff+6] << 16) | (view[tiffOff+7] << 24)) :
                    (view[tiffOff+7] | (view[tiffOff+6] << 8) | (view[tiffOff+5] << 16) | (view[tiffOff+4] << 24));
                  const entries = littleEndian ?
                    (view[tiffOff+ifdOff] | (view[tiffOff+ifdOff+1] << 8)) :
                    (view[tiffOff+ifdOff+1] | (view[tiffOff+ifdOff] << 8));

                  const exifTags = {
                    0x010F: '相机品牌', 0x0110: '相机型号', 0x0112: '方向',
                    0x011A: 'X分辨率', 0x011B: 'Y分辨率', 0x0128: '分辨率单位',
                    0x0132: '修改时间', 0x0213: 'YCbCr定位',
                    0x8769: 'EXIF IFD', 0x8825: 'GPS IFD',
                    0x829A: '曝光时间', 0x829D: 'F值',
                    0x8827: 'ISO感光度', 0x9003: '拍摄日期',
                    0x9004: '数字化日期', 0x920A: '焦距',
                    0xA002: '像素X尺寸', 0xA003: '像素Y尺寸',
                  };
                  const tagNames = {};
                  Object.keys(exifTags).forEach(k => { tagNames[parseInt(k)] = exifTags[k]; });

                  function readIFD(offset, depth) {
                    if(depth > 3) return;
                    if(offset >= view.length - 2) return;
                    const numEntries = littleEndian ?
                      (view[tiffOff+offset] | (view[tiffOff+offset+1] << 8)) :
                      (view[tiffOff+offset+1] | (view[tiffOff+offset] << 8));
                    for(let i = 0; i < numEntries; i++) {
                      const entryOff = tiffOff + offset + 2 + i * 12;
                      if(entryOff + 12 > view.length) break;
                      const tag = littleEndian ?
                        (view[entryOff] | (view[entryOff+1] << 8)) :
                        (view[entryOff+1] | (view[entryOff] << 8));
                      const type = littleEndian ?
                        (view[entryOff+2] | (view[entryOff+3] << 8)) :
                        (view[entryOff+3] | (view[entryOff+2] << 8));
                      const count = littleEndian ?
                        (view[entryOff+4] | (view[entryOff+5] << 8) | (view[entryOff+6] << 16) | (view[entryOff+7] << 24)) :
                        (view[entryOff+7] | (view[entryOff+6] << 8) | (view[entryOff+5] << 16) | (view[entryOff+4] << 24));

                      const valOff = littleEndian ?
                        (view[entryOff+8] | (view[entryOff+9] << 8) | (view[entryOff+10] << 16) | (view[entryOff+11] << 24)) :
                        (view[entryOff+11] | (view[entryOff+10] << 8) | (view[entryOff+9] << 16) | (view[entryOff+8] << 24));

                      if(tag === 0x8769 && type === 4) {
                        html += '<dt>EXIF子IFD</dt><dd>偏移: ' + valOff + '</dd>';
                        readIFD(valOff, depth + 1);
                        continue;
                      }

                      const name = tagNames[tag] || ('0x' + tag.toString(16).toUpperCase());
                      let val = '';

                      if(type === 2) {
                        // ASCII string
                        const strOff = count > 4 ? tiffOff + valOff : entryOff + 8;
                        const bytes = [];
                        for(let j = 0; j < Math.min(count, 64); j++) {
                          if(strOff + j >= view.length) break;
                          const c = view[strOff + j];
                          if(c === 0) break;
                          bytes.push(c);
                        }
                        val = String.fromCharCode.apply(null, bytes);
                      } else if(type === 3 && count === 1) {
                        val = littleEndian ? (view[entryOff+8] | (view[entryOff+9] << 8)) : (view[entryOff+9] | (view[entryOff+8] << 8));
                      } else if(type === 4 && count === 1) {
                        val = valOff;
                      } else if(type === 5 && count === 1) {
                        // Rational
                        const numOff = tiffOff + valOff;
                        const num = littleEndian ?
                          (view[numOff] | (view[numOff+1] << 8) | (view[numOff+2] << 16) | (view[numOff+3] << 24)) :
                          (view[numOff+3] | (view[numOff+2] << 8) | (view[numOff+1] << 16) | (view[numOff] << 24));
                        const den = littleEndian ?
                          (view[numOff+4] | (view[numOff+5] << 8) | (view[numOff+6] << 16) | (view[numOff+7] << 24)) :
                          (view[numOff+7] | (view[numOff+6] << 8) | (view[numOff+5] << 16) | (view[numOff+4] << 24));
                        if(den !== 0) val = (num/den).toFixed(2);
                      } else if(type === 7) {
                        val = '二进制数据 (' + count + ' bytes)';
                      } else if(type === 9 && count === 1) {
                        val = valOff;
                      } else if(count > 0 && type > 0) {
                        val = '[' + count + ' 值]';
                      } else {
                        val = String(valOff);
                      }

                      if(name && val) {
                        html += '<dt>' + name + '</dt><dd>' + val + '</dd>';
                      }
                    }
                  }
                  readIFD(ifdOff, 0);
                }
              }
              break;
            }
            off += 2 + segLen;
          }
        } else {
          html += '<dt>EXIF</dt><dd>该格式不支持 EXIF 或未包含 EXIF 数据</dd>';
        }
        // Common basic info
        html += '<dt>文件大小</dt><dd>' + (file.size / 1024).toFixed(1) + ' KB</dd>';
        html += '<dt>最后修改</dt><dd>' + new Date(file.lastModified).toLocaleString() + '</dd>';
        html += '</dl>';
        exifInfo.innerHTML = html;
      };
      reader.readAsDataURL(file);
    }
    
</script>
