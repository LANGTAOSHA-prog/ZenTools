const languageSelect=document.getElementById("languageSelect");
let currentLang="zh";
function setLanguage(lang){
 currentLang=lang;
 const data=translations[lang]||translations.zh;
 document.documentElement.lang=lang;
 document.title=data.pageTitle;
 document.querySelectorAll("[data-i18n]").forEach(el=>{const k=el.getAttribute("data-i18n");if(data[k])el.textContent=data[k];});

 localStorage.setItem("siteLanguage",lang);
}
languageSelect.addEventListener("change",e=>setLanguage(e.target.value));
const savedLang=localStorage.getItem("siteLanguage")||"zh";

setLanguage(savedLang);

let currentUrl=null;
const video=document.getElementById("video");
function loadVideo(){
 const data=translations[currentLang]||translations.zh;
 const file=document.getElementById("videoFile").files[0];
 if(!file){alert(data.empty);return;}
 if(currentUrl) URL.revokeObjectURL(currentUrl);
 currentUrl=URL.createObjectURL(file);
 video.src=currentUrl;
 video.style.display="block";
 document.getElementById("status").textContent=data.loaded;
 document.getElementById("downloadLink").style.display="none";
}
function captureFrame(){
 const data=translations[currentLang]||translations.zh;
 if(!video.src){alert(data.empty);return;}
 const t=parseFloat(document.getElementById("captureTime").value)||0;
 video.currentTime=Math.min(Math.max(t,0), video.duration || t);
 video.onseeked=()=>{
   const canvas=document.getElementById("canvas");
   canvas.width=video.videoWidth;
   canvas.height=video.videoHeight;
   const ctx=canvas.getContext("2d");
   ctx.drawImage(video,0,0,canvas.width,canvas.height);
   canvas.style.display="block";
   const url=canvas.toDataURL("image/png");
   const a=document.getElementById("downloadLink");
   a.href=url;
   a.download="zentools-thumbnail.png";
   a.style.display="inline-block";
   document.getElementById("status").textContent=data.done;
 };
}
