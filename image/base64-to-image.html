<script>

    const base64Input = document.getElementById('base64Input');
    const decodeBtn = document.getElementById('decodeBtn');
    const resultArea = document.getElementById('resultArea');
    const resultImg = document.getElementById('resultImg');
    const downloadLink = document.getElementById('downloadLink');
    const fileInput = document.getElementById('fileInput');

    fileInput.addEventListener('change', function(e) {
      if(!e.target.files.length) return;
      const reader = new FileReader();
      reader.onload = function(ev) {
        base64Input.value = ev.target.result;
      };
      reader.readAsDataURL(e.target.files[0]);
    });

    decodeBtn.addEventListener('click', function() {
      let data = base64Input.value.trim();
      if(!data) return;
      // If it doesn't have the data: prefix, add PNG prefix
      if(!data.startsWith('data:')) {
        data = 'data:image/png;base64,' + data;
      }
      resultImg.src = data;
      resultArea.style.display = 'block';
      downloadLink.href = data;
      // Try to determine proper extension
      const match = data.match(/^data:image\/(\w+);/);
      if(match) {
        const ext = match[1] === 'jpeg' ? 'jpg' : match[1];
        downloadLink.download = 'decoded-image.' + ext;
      }
      resultImg.onerror = function() {
        alert('无效的 Base64 图片数据，请检查输入是否正确。');
        resultArea.style.display = 'none';
      };
    });
    
</script>
