<script>

const translations = {

  zh:{
    title:"图片加水印工具",
    desc:"免费在线图片加文字水印工具。",
    button:"添加水印",
    placeholder:"输入水印文字",
    download:"下载图片"
  },

  ja:{
    title:"画像ウォーターマークツール",
    desc:"無料オンライン画像ウォーターマークツール。",
    button:"ウォーターマーク追加",
    placeholder:"文字を入力",
    download:"画像をダウンロード"
  },

  en:{
    title:"Image Watermark Tool",
    desc:"Free online image watermark tool.",
    button:"Add Watermark",
    placeholder:"Enter watermark text",
    download:"Download Image"
  },

  vi:{
    title:"Công cụ chèn watermark",
    desc:"Công cụ thêm watermark miễn phí.",
    button:"Thêm watermark",
    placeholder:"Nhập nội dung watermark",
    download:"Tải ảnh"
  }

};

const languageSelect = document.getElementById("languageSelect");

function setLanguage(lang){

  const data = translations[lang];

  document.getElementById("title").textContent = data.title;

  document.getElementById("desc").textContent = data.desc;

  document.getElementById("btnText").textContent = data.button;

  document.getElementById("watermarkText").placeholder = data.placeholder;

  localStorage.setItem("siteLanguage", lang);

}

languageSelect.addEventListener("change", e=>{

  setLanguage(e.target.value);

});

const savedLang = localStorage.getItem("siteLanguage") || "zh";

languageSelect.value = savedLang;

setLanguage(savedLang);

function addWatermark(){

  const file = document.getElementById("imageInput").files[0];

  if(!file) return;

  const text = document.getElementById("watermarkText").value;

  const reader = new FileReader();

  reader.onload = function(e){

    const img = new Image();

    img.src = e.target.result;

    img.onload = function(){

      const canvas = document.createElement("canvas");

      const ctx = canvas.getContext("2d");

      canvas.width = img.width;

      canvas.height = img.height;

      ctx.drawImage(img,0,0);

      ctx.font = "40px Arial";

      ctx.fillStyle = "rgba(255,255,255,0.5)";

      ctx.fillText(text,50,80);

      const result = canvas.toDataURL("image/png");

      showPreview(result);

    };

  };

  reader.readAsDataURL(file);

}

function showPreview(url){

  const lang = localStorage.getItem("siteLanguage") || "zh";

  const data = translations[lang];

  document.getElementById("preview").innerHTML = `

    <img src="${url}">

    <br>

    <a
      class="download-btn"
      href="${url}"
      download="watermark.png"
    >
      ${data.download}
    </a>

  `;

}

<script>

};

function setMeta(name, content){
  let meta = document.querySelector(`meta[name="${name}"]`);
  if(!meta){
    meta = document.createElement("meta");
    meta.setAttribute("name", name);
    document.head.appendChild(meta);
  }
  meta.setAttribute("content", content);
}

function setProperty(property, content){
  let meta = document.querySelector(`meta[property="${property}"]`);
  if(!meta){
    meta = document.createElement("meta");
    meta.setAttribute("property", property);
    document.head.appendChild(meta);
  }
  meta.setAttribute("content", content);
}

function setCanonical(url){
  let link = document.querySelector('link[rel="canonical"]');
  if(!link){
    link = document.createElement("link");
    link.setAttribute("rel", "canonical");
    document.head.appendChild(link);
  }
  link.setAttribute("href", url);
}

function applySEO(){
  document.title = seoData.title;

  setMeta("description", seoData.description);
  setMeta("keywords", seoData.keywords);
  setMeta("author", "ZenTools");

  setCanonical(seoData.url);

  setProperty("og:title", seoData.title);
  setProperty("og:description", seoData.description);
  setProperty("og:type", "website");
  setProperty("og:url", seoData.url);
  setProperty("og:image", seoData.image);

  setMeta("twitter:card", "summary_large_image");
  setMeta("twitter:title", seoData.title);
  setMeta("twitter:description", seoData.description);
}

applySEO();
</script>
