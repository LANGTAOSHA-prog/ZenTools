<script>

    const fileInput1 = document.getElementById('fileInput1');
    const fileInput2 = document.getElementById('fileInput2');
    const compareBtn = document.getElementById('compareBtn');
    const resultArea = document.getElementById('resultArea');
    const img1 = document.getElementById('img1');
    const img2 = document.getElementById('img2');
    const similarityResult = document.getElementById('similarityResult');
    let dataUrl1 = null, dataUrl2 = null;

    fileInput1.addEventListener('change', e => { if(e.target.files.length) { const r = new FileReader(); r.onload = ev => { dataUrl1 = ev.target.result; img1.src = dataUrl1; checkReady(); }; r.readAsDataURL(e.target.files[0]); }});
    fileInput2.addEventListener('change', e => { if(e.target.files.length) { const r = new FileReader(); r.onload = ev => { dataUrl2 = ev.target.result; img2.src = dataUrl2; checkReady(); }; r.readAsDataURL(e.target.files[0]); }});

    function checkReady() {
      compareBtn.disabled = !(dataUrl1 && dataUrl2);
    }

    function averageHash(img, size) {
      size = size || 8;
      const canvas = document.createElement('canvas');
      canvas.width = size;
      canvas.height = size;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, size, size);
      const data = ctx.getImageData(0, 0, size, size).data;
      let sum = 0;
      for(let i = 0; i < data.length; i += 4) {
        sum += data[i] * 0.299 + data[i+1] * 0.587 + data[i+2] * 0.114;
      }
      const avg = sum / (size * size);
      let hash = '';
      for(let i = 0; i < data.length; i += 4) {
        const gray = data[i] * 0.299 + data[i+1] * 0.587 + data[i+2] * 0.114;
        hash += gray > avg ? '1' : '0';
      }
      return hash;
    }

    function hammingDistance(h1, h2) {
      let dist = 0;
      for(let i = 0; i < h1.length; i++) {
        if(h1[i] !== h2[i]) dist++;
      }
      return dist;
    }

    compareBtn.addEventListener('click', function() {
      if(!dataUrl1 || !dataUrl2) return;
      const imgA = new Image();
      const imgB = new Image();
      let loaded = 0;
      imgA.onload = imgB.onload = function() {
        loaded++;
        if(loaded === 2) {
          const h1 = averageHash(imgA);
          const h2 = averageHash(imgB);
          const dist = hammingDistance(h1, h2);
          const maxDist = 64;
          const similarity = Math.max(0, Math.round((1 - dist/maxDist) * 100));
          let resultText = '相似度: ' + similarity + '%';
          let color = '#ef4444';
          if(similarity > 80) { resultText += ' ⚠️ 非常相似!'; color = '#ef4444'; }
          else if(similarity > 50) { resultText += ' 🔍 部分相似'; color = '#f59e0b'; }
          else { resultText += ' ✅ 不相似'; color = '#10b981'; }
          similarityResult.textContent = resultText;
          similarityResult.style.color = color;
          resultArea.style.display = 'block';
        }
      };
      imgA.src = dataUrl1;
      imgB.src = dataUrl2;
    });
    
</script>
