<script>

    const fileInput = document.getElementById('fileInput');
    const dropZone = document.getElementById('dropZone');
    const processBtn = document.getElementById('processBtn');
    const resetBtn = document.getElementById('resetBtn');
    const editCanvas = document.getElementById('editCanvas');
    const downloadLink = document.getElementById('downloadLink');
    const resultRow = document.getElementById('resultRow');
    const brushInput = document.getElementById('brushSize');
    const brushVal = document.getElementById('brushVal');
    let imgDataUrl = null;
    let isDrawing = false;

    brushInput.addEventListener('input', () => { brushVal.textContent = brushInput.value; });

    dropZone.addEventListener('click', () => fileInput.click());
    dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.style.borderColor = '#3b82f6'; });
    dropZone.addEventListener('dragleave', () => { dropZone.style.borderColor = ''; });
    dropZone.addEventListener('drop', e => { e.preventDefault(); dropZone.style.borderColor = ''; if(e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]); });
    fileInput.addEventListener('change', e => { if(e.target.files.length) handleFile(e.target.files[0]); });

    function handleFile(file) {
      const reader = new FileReader();
      reader.onload = function(e) {
        imgDataUrl = e.target.result;
        dropZone.classList.add('has-image');
        dropZone.querySelector('p').textContent = file.name;
        const img = new Image();
        img.onload = function() {
          editCanvas.width = img.width;
          editCanvas.height = img.height;
          const ctx = editCanvas.getContext('2d');
          ctx.drawImage(img, 0, 0);
          processBtn.disabled = false;
          resetBtn.disabled = false;
          initDrawing();
        };
        img.src = imgDataUrl;
      };
      reader.readAsDataURL(file);
    }

    function initDrawing() {
      const ctx = editCanvas.getContext('2d');
      let lastX, lastY;

      function getPos(e) {
        const rect = editCanvas.getBoundingClientRect();
        const scaleX = editCanvas.width / rect.width;
        const scaleY = editCanvas.height / rect.height;
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        return {
          x: (clientX - rect.left) * scaleX,
          y: (clientY - rect.top) * scaleY
        };
      }

      function heal(x, y, r) {
        const w = editCanvas.width, h = editCanvas.height;
        const imageData = ctx.getImageData(Math.max(0,x-r), Math.max(0,y-r), Math.min(w,x+r)-Math.max(0,x-r), Math.min(h,y+r)-Math.max(0,y-r));
        const data = imageData.data;
        // Sample nearby pixels and average
        const samples = [];
        for(let i = 0; i < 8; i++) {
          const angle = (i / 8) * Math.PI * 2;
          const sx = Math.round(x + Math.cos(angle) * r * 2);
          const sy = Math.round(y + Math.sin(angle) * r * 2);
          if(sx >= 0 && sx < w && sy >= 0 && sy < h) {
            const idx = (sy * w + sx) * 4;
            samples.push([data[idx], data[idx+1], data[idx+2], data[idx+3]]);
          }
        }
        if(samples.length === 0) return;
        const avgR = samples.reduce((s, p) => s + p[0], 0) / samples.length;
        const avgG = samples.reduce((s, p) => s + p[1], 0) / samples.length;
        const avgB = samples.reduce((s, p) => s + p[2], 0) / samples.length;
        const avgA = samples.reduce((s, p) => s + p[3], 0) / samples.length;

        ctx.globalCompositeOperation = 'source-over';
        ctx.fillStyle = 'rgba(' + Math.round(avgR) + ',' + Math.round(avgG) + ',' + Math.round(avgB) + ',' + (avgA/255) + ')';
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.fill();
      }

      function draw(e) {
        if(!isDrawing) return;
        e.preventDefault();
        const pos = getPos(e);
        const r = parseInt(brushInput.value);
        heal(pos.x, pos.y, r);
        lastX = pos.x;
        lastY = pos.y;
      }

      editCanvas.addEventListener('mousedown', e => { isDrawing = true; const pos = getPos(e); heal(pos.x, pos.y, parseInt(brushInput.value)); });
      editCanvas.addEventListener('mousemove', draw);
      editCanvas.addEventListener('mouseup', () => { isDrawing = false; });
      editCanvas.addEventListener('mouseleave', () => { isDrawing = false; });

      editCanvas.addEventListener('touchstart', e => { e.preventDefault(); isDrawing = true; const pos = getPos(e); heal(pos.x, pos.y, parseInt(brushInput.value)); });
      editCanvas.addEventListener('touchmove', draw);
      editCanvas.addEventListener('touchend', () => { isDrawing = false; });
    }

    processBtn.addEventListener('click', function() {
      downloadLink.href = editCanvas.toDataURL('image/png');
      resultRow.style.display = 'block';
    });

    resetBtn.addEventListener('click', function() {
      if(!imgDataUrl) return;
      const img = new Image();
      img.onload = function() {
        const ctx = editCanvas.getContext('2d');
        ctx.drawImage(img, 0, 0);
        resultRow.style.display = 'none';
      };
      img.src = imgDataUrl;
    });
    
</script>
