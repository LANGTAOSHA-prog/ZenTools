<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>图片滤镜 - ZenTools</title>
<meta name="description" content="ZenTools 免费在线图片滤镜工具，为图片添加多种滤镜效果。">
<style>
:root{--bg:#0f172a;--card:#111827;--border:#1f2937;--text:#f3f4f6;--muted:#94a3b8;--blue:#2563eb;--green:#10b981;--red:#ef4444}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:Arial,"Noto Sans SC","Noto Sans JP",sans-serif;line-height:1.7}
.container{max-width:1000px;margin:auto;padding:40px 20px}
a{color:#60a5fa;text-decoration:none}
.top-bar{display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap;margin-bottom:20px}
.lang-select{background:#111827;color:white;border:1px solid #334155;border-radius:10px;padding:10px 12px}
.card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:28px}
h1{margin-bottom:15px}.desc{color:var(--muted);margin-bottom:25px}
.ad-box{margin:25px 0;height:110px;border:2px dashed #334155;border-radius:18px;display:flex;align-items:center;justify-content:center;color:#64748b}
input,select{width:100%;margin:10px 0;padding:14px;border-radius:12px;border:1px solid #334155;background:#0f172a;color:white;font-size:16px}
button{background:var(--blue);color:white;border:none;padding:13px 18px;border-radius:12px;cursor:pointer;font-size:15px;font-weight:bold;margin:6px 6px 6px 0}.download-btn{background:var(--green)}
.preview{max-width:100%;margin-top:15px;border-radius:14px;border:1px solid #334155}
.canvas-wrap{text-align:center;margin-top:15px}
canvas{max-width:100%;border-radius:14px;border:1px solid #334155}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin:15px 0}
.filter-btn{background:var(--card);border:1px solid var(--border);padding:10px 16px;border-radius:10px;color:var(--text);cursor:pointer;font-size:14px;transition:all 0.2s}
.filter-btn:hover,.filter-btn.active{border-color:var(--blue);background:rgba(37,99,235,0.15)}
footer{margin-top:50px;text-align:center;color:#94a3b8}
@media(max-width:768px){button,.lang-select{width:100%}}
</style>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1955887568822472"
     crossorigin="anonymous"></script>
</head>
<body>
<div class="container">
<div class="top-bar">
<a href="index.html" data-i18n="back">← 返回首页</a>
<select id="languageSelect" class="lang-select"><option value="zh">中文</option><option value="en">English</option></select>
</div>
<div class="card">
<h1 data-i18n="title">图片滤镜</h1>
<p class="desc" data-i18n="desc">为图片添加多种滤镜效果，所有处理在浏览器本地完成。</p>
<div class="ad-box" data-i18n="ad">广告位（Google AdSense）</div>
<input type="file" id="imageInput" accept="image/*">
<div class="filters" id="filterBtns">
<button class="filter-btn active" data-filter="none" data-i18n="original">原图</button>
<button class="filter-btn" data-filter="grayscale">灰度</button>
<button class="filter-btn" data-filter="sepia">怀旧</button>
<button class="filter-btn" data-filter="invert">反色</button>
<button class="filter-btn" data-filter="blur">模糊</button>
<button class="filter-btn" data-filter="bright">明亮</button>
<button class="filter-btn" data-filter="contrast">高对比</button>
<button class="filter-btn" data-filter="saturate">高饱和</button>
</div>
<div class="canvas-wrap"><canvas id="canvas"></canvas></div>
<button onclick="downloadImage()" class="download-btn" data-i18n="download">下载图片</button>
</div>
<footer>© 2026 ZenTools</footer>
</div>
<script>
const translations={zh:{back:"← 返回首页",title:"图片滤镜",desc:"为图片添加多种滤镜效果，所有处理在浏览器本地完成。",ad:"广告位（Google AdSense）",download:"下载图片",original:"原图",choose:"请先选择一张图片"},en:{back:"← Back to Home",title:"Image Filters",desc:"Apply filters to images, all processing is done locally.",ad:"Ad Space",download:"Download",original:"Original",choose:"Please select an image first"}};
let currentLang="zh",currentFilter="none",imgFile=null;
const cs=document.getElementById("canvas"),ctx=cs.getContext("2d");
document.getElementById("imageInput").addEventListener("change",function(e){const f=e.target.files[0];if(!f)return;imgFile=f;const r=new FileReader();r.onload=function(ev){const img=new Image();img.onload=function(){cs.width=Math.min(img.width,800);cs.height=img.height*(cs.width/img.width);applyFilter();};img.src=ev.target.result;};r.readAsDataURL(f);});
document.querySelectorAll(".filter-btn").forEach(b=>{b.addEventListener("click",function(){document.querySelectorAll(".filter-btn").forEach(x=>x.classList.remove("active"));this.classList.add("active");currentFilter=this.dataset.filter;if(imgFile)applyFilter();});});
function applyFilter(){const img=new Image();const r=new FileReader();r.onload=function(ev){img.onload=function(){ctx.clearRect(0,0,cs.width,cs.height);ctx.drawImage(img,0,0,cs.width,cs.height);const d=currentFilter;if(d==="grayscale"){const i=ctx.getImageData(0,0,cs.width,cs.height);for(let p=0;p<i.data.length;p+=4){const g=i.data[p]*.299+i.data[p+1]*.587+i.data[p+2]*.114;i.data[p]=i.data[p+1]=i.data[p+2]=g;}ctx.putImageData(i,0,0);}else if(d==="sepia"){const i=ctx.getImageData(0,0,cs.width,cs.height);for(let p=0;p<i.data.length;p+=4){const r=i.data[p],g=i.data[p+1],b=i.data[p+2];i.data[p]=Math.min(255,r*.393+g*.769+b*.189);i.data[p+1]=Math.min(255,r*.349+g*.686+b*.168);i.data[p+2]=Math.min(255,r*.272+g*.534+b*.131);}ctx.putImageData(i,0,0);}else if(d==="invert"){const i=ctx.getImageData(0,0,cs.width,cs.height);for(let p=0;p<i.data.length;p+=4){i.data[p]=255-i.data[p];i.data[p+1]=255-i.data[p+1];i.data[p+2]=255-i.data[p+2];}ctx.putImageData(i,0,0);}else if(d==="blur"){ctx.filter="blur(5px)";ctx.drawImage(img,0,0,cs.width,cs.height);ctx.filter="none";}else if(d==="bright"){ctx.filter="brightness(1.4)";ctx.drawImage(img,0,0,cs.width,cs.height);ctx.filter="none";}else if(d==="contrast"){ctx.filter="contrast(1.8)";ctx.drawImage(img,0,0,cs.width,cs.height);ctx.filter="none";}else if(d==="saturate"){ctx.filter="saturate(2)";ctx.drawImage(img,0,0,cs.width,cs.height);ctx.filter="none";}else{ctx.drawImage(img,0,0,cs.width,cs.height);}};img.src=ev.target.result;};r.readAsDataURL(imgFile);}
function downloadImage(){if(!imgFile){alert(translations[currentLang].choose);return;}const link=document.createElement("a");link.download="filtered-"+imgFile.name;link.href=cs.toDataURL("image/png");link.click();}
const ls=document.getElementById("languageSelect");ls.addEventListener("change",function(){currentLang=this.value;const d=translations[currentLang]||translations.zh;document.title=d.title;document.querySelectorAll("[data-i18n]").forEach(e=>{const k=e.getAttribute("data-i18n");if(d[k])e.textContent=d[k];});});
</script>
</body>
</html>
