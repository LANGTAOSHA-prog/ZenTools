    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #070b18; --surface: rgba(14,22,41,0.8); --surface2: rgba(20,31,55,0.9);
      --border: rgba(255,255,255,0.06); --text: #f0f4ff; --muted: #8899bb;

    .card h1 { font-size: 24px; margin-bottom: 8px; display: flex; align-items: center; gap: 12px; }
    .card .icon { font-size: 36px; }
    .card .desc { color: var(--muted); margin-bottom: 24px; line-height: 1.6; }
    .tool-area { background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; margin-bottom: 20px; }
    .upload-zone {
      border: 2px dashed var(--border); border-radius: var(--radius); padding: 40px;
      text-align: center; cursor: pointer; transition: all .3s;
    }
    .upload-zone:hover { border-color: var(--accent); background: rgba(59,130,246,0.05); }
    .upload-zone.has-image { border-style: solid; border-color: var(--accent); padding: 16px; }
    .upload-zone .icon-big { font-size: 48px; margin-bottom: 12px; }
    .upload-zone .hint { color: var(--muted); font-size: 14px; }

    .preview-area { margin-top: 16px; text-align: center; }

    .controls { display: flex; flex-wrap: wrap; gap: 12px; margin: 16px 0; align-items: center; }

    .controls input[type="range"] { width: 140px; }

      cursor: pointer; transition: all .3s;

    .btn:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(59,130,246,0.4); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    .btn-secondary { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
    .btn-sm { padding: 6px 16px; font-size: 12px; }
    .result-area { margin-top: 16px; text-align: center; }
    .result-area a.download-btn {
      display: inline-block; margin-top: 12px; padding: 12px 28px;
      background: linear-gradient(135deg, #10b981, #059669); color: #fff;
      border-radius: var(--radius-pill); text-decoration: none; font-weight: 600;
    }
    .result-area a.download-btn:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(16,185,129,0.4); }
    .footer { margin-top: 40px; text-align: center; font-size: 12px; color: var(--muted); }

      background:linear-gradient(135deg,#2563eb,#7c3aed);color:#fff;border:none;padding:14px 22px;
      border-radius:50px;font-size:15px;font-weight:600;cursor:pointer;
      box-shadow:0 6px 24px rgba(37,99,235,0.35);transition:transform 0.2s,box-shadow 0.2s;
      text-decoration:none;
    }
    .bookmark-float:hover{transform:translateY(-3px);box-shadow:0 10px 32px rgba(37,99,235,0.45)}
    .flex-row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
    .info-grid { display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; font-size: 13px; }

<body>
<div class="container">
  <div class="card">
    <div class="top-bar" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:15px;margin-bottom:20px"><select id="langSelect" class="lang-select"><option value="zh">中文</option><option value="ja">日本語</option><option value="en">English</option><option value="vi">Tiếng Việt</option></select></div>
<h1><span class="icon">🖼️</span> ICO 生成器</h1>
    <p class="desc">将图片转换为 ICO 图标格式，支持多尺寸图标</p>
    
    <div class="tool-area">
      <div class="upload-zone" id="dropZone">
        <div class="icon-big">📁</div>
        <p>点击或拖拽上传图片</p>
        <p class="hint">支持 JPG、PNG、WebP 等格式，推荐使用透明背景</p>
        <input type="file" id="fileInput" accept="image/*" />
      </div>
      <div class="controls">
        <label data-i18n="lbl_尺寸">尺寸:</label>
        <select id="icoSize">
          <option value="16">16x16</option>
          <option value="32" selected>32x32</option>
          <option value="48">48x48</option>
          <option value="64">64x64</option>
          <option value="128">128x128</option>
          <option value="256">256x256</option>
        </select>
      </div>
      <div class="flex-row">
        <button class="btn" id="processBtn" disabled data-i18n="btn_生成_ico">生成 ICO</button>
      </div>
      <div class="result-area" id="resultArea" style="display:none">
        <canvas id="resultCanvas" style="background:#fff;border:1px solid var(--border);"></canvas>
        <br/>
        <a class="download-btn" id="downloadLink" download="icon.ico">下载 ICO</a>
        <p class="hint" style="margin-top:8px;">ICO 格式兼容 Windows/macOS 图标</p>
      </div>
    </div>
    
  </div>
  <div class="footer">

  </div>
</div>
<button class="bookmark-float" onclick="prompt('复制链接收藏本站','https://zentools.xyz')" data-i18n="btn_收藏本站">⭐ 收藏本站</button>
<script>

    const fileInput = document.getElementById('fileInput');
    const dropZone = document.getElementById('dropZone');
    const processBtn = document.getElementById('processBtn');
    const resultArea = document.getElementById('resultArea');
    const resultCanvas = document.getElementById('resultCanvas');
    const downloadLink = document.getElementById('downloadLink');
    const sizeSelect = document.getElementById('icoSize');
    let imgDataUrl = null;

    dropZone.addEventListener('click', () => fileInput.click());
    dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.style.borderColor = '#3b82f6'; });
    dropZone.addEventListener('dragleave', () => { dropZone.style.borderColor = ''; });
    dropZone.addEventListener('drop', e => { e.preventDefault(); dropZone.style.borderColor = ''; if(e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]); });
    fileInput.addEventListener('change', e => { if(e.target.files.length) handleFile(e.target.files[0]); });

    function handleFile(file) {
      const reader = new FileReader();
      reader.onload = function(e) {
        imgDataUrl = e.target.result;
        dropZone.classList.add('has-image');
        dropZone.querySelector('p').textContent = file.name;
        processBtn.disabled = false;
      };
      reader.readAsDataURL(file);
    }

    processBtn.addEventListener('click', function() {
      if(!imgDataUrl) return;
      const img = new Image();
      img.onload = function() {
        const size = parseInt(sizeSelect.value);
        resultCanvas.width = size;
        resultCanvas.height = size;
        const ctx = resultCanvas.getContext('2d');
        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = 'high';
        ctx.drawImage(img, 0, 0, size, size);
        const pngData = resultCanvas.toDataURL('image/png');
        // Convert PNG to ICO format
        const binary = atob(pngData.split(',')[1]);
        const buf = new ArrayBuffer(binary.length);
        const view = new Uint8Array(buf);
        for(let i = 0; i < binary.length; i++) view[i] = binary.charCodeAt(i);
        // ICO header + PNG data as ICO entry
        const fileSize = 6 + 16 + view.length;
        const ico = new ArrayBuffer(fileSize);
        const icoView = new Uint8Array(ico);
        let off = 0;
        // ICO header
        icoView[off++] = 0; icoView[off++] = 0; // reserved
        icoView[off++] = 1; icoView[off++] = 0; // type=1 ICO
        icoView[off++] = 1; icoView[off++] = 0; // count=1
        // Directory entry
        icoView[off++] = size >= 256 ? 0 : size;
        icoView[off++] = size >= 256 ? 0 : size;
        icoView[off++] = 0; // colors
        icoView[off++] = 0; // reserved
        // icon data offset (little endian) = 22
        icoView[off++] = 0x16; icoView[off++] = 0; icoView[off++] = 0; icoView[off++] = 0;
        // icon data size
        const sz = view.length;
        icoView[off++] = sz & 0xFF; icoView[off++] = (sz >> 8) & 0xFF;
        icoView[off++] = (sz >> 16) & 0xFF; icoView[off++] = (sz >> 24) & 0xFF;
        // PNG data
        for(let i = 0; i < view.length; i++) icoView[off + i] = view[i];
        const blob = new Blob([ico], {type: 'image/x-icon'});
        downloadLink.href = URL.createObjectURL(blob);
        downloadLink.download = 'icon.ico';
        resultArea.style.display = 'block';
      };
      img.src = imgDataUrl;
    });
    
</script>
