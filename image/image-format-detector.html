<script>

    const fileInput = document.getElementById('fileInput');
    const dropZone = document.getElementById('dropZone');
    const resultArea = document.getElementById('resultArea');
    const detectInfo = document.getElementById('detectInfo');
    const previewImg = document.getElementById('previewImg');

    dropZone.addEventListener('click', () => fileInput.click());
    dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.style.borderColor = '#3b82f6'; });
    dropZone.addEventListener('dragleave', () => { dropZone.style.borderColor = ''; });
    dropZone.addEventListener('drop', e => { e.preventDefault(); dropZone.style.borderColor = ''; if(e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]); });
    fileInput.addEventListener('change', e => { if(e.target.files.length) handleFile(e.target.files[0]); });

    const signatures = {
      'FF D8 FF': 'JPEG',
      '89 50 4E 47 0D 0A 1A 0A': 'PNG',
      '47 49 46 38 39 61': 'GIF (89a)',
      '47 49 46 38 37 61': 'GIF (87a)',
      '52 49 46 46': 'WebP (RIFF)',
      '42 4D': 'BMP',
      '3C 73 76 67': 'SVG',
      '49 49 2A 00': 'TIFF (LE)',
      '4D 4D 00 2A': 'TIFF (BE)',
      '00 00 01 00': 'ICO',
    };

    function handleFile(file) {
      const reader = new FileReader();
      reader.onload = function(e) {
        const dataUrl = e.target.result;
        previewImg.src = dataUrl;
        dropZone.classList.add('has-image');
        dropZone.querySelector('p').textContent = file.name;
        resultArea.style.display = 'block';

        const binary = atob(dataUrl.split(',')[1]);
        const buf = new ArrayBuffer(binary.length);
        const view = new Uint8Array(buf);
        for(let i = 0; i < binary.length; i++) view[i] = binary.charCodeAt(i);

        const hex = Array.from(view.slice(0, 16)).map(b => b.toString(16).toUpperCase().padStart(2, '0')).join(' ');
        let detected = '未知格式';
        for(const [sig, name] of Object.entries(signatures)) {
          const sigHex = sig.split(' ').join(' ');
          if(hex.startsWith(sigHex)) {
            detected = name;
            break;
          }
        }

        // WebP needs extra check
        if(detected === 'WebP (RIFF)' && hex.includes('57 45 42 50')) {
          detected = 'WebP';
        }
        // SVG check
        if(!detected.startsWith('SVG') && hex.startsWith('3C')) {
          const str = String.fromCharCode.apply(null, view.slice(0, 256));
          if(str.includes('<svg') || str.includes('<SVG') || str.includes('<?xml')) {
            detected = 'SVG';
          }
        }

        let html = '<dl class="info-grid">';
        html += '<dt>文件名</dt><dd>' + file.name + '</dd>';
        html += '<dt>文件扩展名</dt><dd>.' + file.name.split('.').pop() + '</dd>';
        html += '<dt>检测到的格式</dt><dd><strong>' + detected + '</strong></dd>';
        html += '<dt>文件大小</dt><dd>' + (file.size / 1024).toFixed(1) + ' KB</dd>';
        html += '<dt>MIME类型</dt><dd>' + (file.type || '未知') + '</dd>';
        html += '<dt>文件头(Hex)</dt><dd style="font-family:monospace;font-size:12px;word-break:break-all;">' + hex + '</dd>';
        if(detected !== file.type.split('/')[1] && file.type) {
          html += '<dt>⚠️ 警告</dt><dd style="color:#f59e0b;">扩展名与实际格式不匹配！</dd>';
        }
        html += '</dl>';
        detectInfo.innerHTML = html;
      };
      reader.readAsDataURL(file);
    }
    
</script>
