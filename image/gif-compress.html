    <p class="desc">压缩 GIF 动图体积，减少颜色数或降低帧率</p>
    
    <div class="tool-area">
      <div class="upload-zone" id="dropZone">
        <div class="icon-big">📁</div>

<script>

    const fileInput = document.getElementById('fileInput');
    const dropZone = document.getElementById('dropZone');
    const processBtn = document.getElementById('processBtn');
    const resultArea = document.getElementById('resultArea');
    const previewImg = document.getElementById('previewImg');
    const downloadLink = document.getElementById('downloadLink');
    const origSize = document.getElementById('origSize');
    const newSize = document.getElementById('newSize');
    const ratio = document.getElementById('ratio');
    const qualityInput = document.getElementById('quality');
    const qualityVal = document.getElementById('qualityVal');
    const scaleSelect = document.getElementById('scale');
    let currentFile = null, dataUrl = null;

    qualityInput.addEventListener('input', () => { qualityVal.textContent = qualityInput.value + ' 色'; });

    dropZone.addEventListener('click', () => fileInput.click());
    dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.style.borderColor = '#3b82f6'; });
    dropZone.addEventListener('dragleave', () => { dropZone.style.borderColor = ''; });
    dropZone.addEventListener('drop', e => { e.preventDefault(); dropZone.style.borderColor = ''; if(e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]); });
    fileInput.addEventListener('change', e => { if(e.target.files.length) handleFile(e.target.files[0]); });

    function handleFile(file) {
      currentFile = file;
      const reader = new FileReader();
      reader.onload = function(e) {
        dataUrl = e.target.result;
        dropZone.classList.add('has-image');
        dropZone.querySelector('p').textContent = file.name;
        processBtn.disabled = false;
      };
      reader.readAsDataURL(file);
    }

    function loadGifJS() {
      return new Promise((resolve) => {
        if(typeof GIF !== 'undefined') { resolve(); return; }
        const script = document.createElement('script');
        script.src = 'https://cdn.jsdelivr.net/npm/gif.js@0.2.0/dist/gif.min.js';
        script.onload = resolve;
        document.head.appendChild(script);
      });
    }

    // Simple GIF frame capture via canvas
    processBtn.addEventListener('click', async function() {
      if(!dataUrl) return;
      processBtn.disabled = true;
      processBtn.textContent = '压缩中...';
      origSize.textContent = (currentFile.size / 1024).toFixed(1) + ' KB';

      await loadGifJS();

      const img = new Image();
      img.onload = function() {
        const scale = parseFloat(scaleSelect.value);
        const w = Math.round(img.width * scale);
        const h = Math.round(img.height * scale);
        const colors = parseInt(qualityInput.value);

        const canvas = document.createElement('canvas');
        canvas.width = w;
        canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);

        // Use canvas.toBlob for GIF-like compression by reducing colors/quality
        // Since true GIF recompression requires parsing frames, we do a simplified version:
        // reduce quality and save as optimized GIF using gif.js
        const gif = new GIF({
          workers: 2,
          quality: 10,
          width: w,
          height: h,
          workerScript: 'https://cdn.jsdelivr.net/npm/gif.js@0.2.0/dist/gif.worker.js'
        });

        // Quantize colors by drawing with reduced palette
        const imageData = ctx.getImageData(0, 0, w, h);
        const data = imageData.data;

        // Simple color quantization
        const step = Math.max(1, Math.floor(256 / Math.sqrt(colors)));
        for(let i = 0; i < data.length; i += 4) {
          data[i] = Math.round(data[i] / step) * step;
          data[i+1] = Math.round(data[i+1] / step) * step;
          data[i+2] = Math.round(data[i+2] / step) * step;
        }
        ctx.putImageData(imageData, 0, 0);

        const tempImg = new Image();
        tempImg.onload = function() {
          gif.addFrame(tempImg, {copy: true, delay: 100});
          gif.on('finished', function(blob) {
            const url = URL.createObjectURL(blob);
            newSize.textContent = (blob.size / 1024).toFixed(1) + ' KB';
            ratio.textContent = currentFile.size > 0 ? Math.round((1 - blob.size / currentFile.size) * 100) + '%' : '-';
            previewImg.src = url;
            downloadLink.href = url;
            resultArea.style.display = 'block';
            processBtn.disabled = false;
            processBtn.textContent = '压缩 GIF';
          });
          gif.render();
        };
        tempImg.src = canvas.toDataURL('image/png');
      };
      img.src = dataUrl;
    });
    
</script>
