<script>
const translations={"zh": {"back": "← 返回首页", "ad": "广告位（Google AdSense）", "run": "开始生成", "copy": "复制结果", "clear": "清空", "copied": "已复制", "inputPlaceholder": "请输入内容...", "outputPlaceholder": "结果会显示在这里...", "guideTitle": "使用说明", "privacyTitle": "隐私说明", "privacyText": "本工具为浏览器本地处理，不会上传内容到服务器。", "empty": "请输入内容", "pageTitle": "AI润色 - 免费在线工具 | ZenTools", "title": "AI润色", "desc": "优化文本表达，使内容更自然清晰。", "guideText": "输入原文，选择风格后点击生成。", "clearStyle": "清晰", "formalStyle": "正式", "shortStyle": "简洁"}, "ja": {"back": "← ホームに戻る", "ad": "広告スペース", "run": "生成開始", "copy": "結果をコピー", "clear": "クリア", "copied": "コピーしました", "inputPlaceholder": "内容を入力してください...", "outputPlaceholder": "結果がここに表示されます...", "guideTitle": "使い方", "privacyTitle": "プライバシーについて", "privacyText": "このツールはブラウザ内で処理され、内容はサーバーへ送信されません。", "empty": "内容を入力してください", "pageTitle": "AI文章校正 - Free Online Tool | ZenTools", "title": "AI文章校正", "desc": "文章表現をより自然で明確に整えます。", "guideText": "原文を入力し、スタイルを選んで生成します。", "clearStyle": "明確", "formalStyle": "フォーマル", "shortStyle": "簡潔"}, "en": {"back": "← Back to Home", "ad": "Ad Space", "run": "Generate", "copy": "Copy Result", "clear": "Clear", "copied": "Copied", "inputPlaceholder": "Enter content...", "outputPlaceholder": "Result will appear here...", "guideTitle": "How to Use", "privacyTitle": "Privacy Notice", "privacyText": "This tool runs locally in your browser and does not upload content to a server.", "empty": "Please enter content", "pageTitle": "AI Text Polisher - Free Online Tool | ZenTools", "title": "AI Text Polisher", "desc": "Polish text to make it clearer and more natural.", "guideText": "Enter text, choose a style, and generate a polished version.", "clearStyle": "Clear", "formalStyle": "Formal", "shortStyle": "Concise"}, "vi": {"back": "← Quay lại trang chủ", "ad": "Vị trí quảng cáo", "run": "Tạo kết quả", "copy": "Sao chép", "clear": "Xóa", "copied": "Đã sao chép", "inputPlaceholder": "Nhập nội dung...", "outputPlaceholder": "Kết quả sẽ hiển thị ở đây...", "guideTitle": "Hướng dẫn", const languageSelect=document.getElementById("languageSelect");
let currentLang="zh";
function setLanguage(lang){
 currentLang=lang;
 const data=translations[lang]||translations.zh;
 document.documentElement.lang=lang; document.title=data.pageTitle;
 document.querySelectorAll("[data-i18n]").forEach(el=>{const k=el.getAttribute("data-i18n"); if(data[k]) el.textContent=data[k];});
 document.querySelectorAll("[data-i18n-placeholder]").forEach(el=>{const k=el.getAttribute("data-i18n-placeholder"); if(data[k]) el.placeholder=data[k];});
 localStorage.setItem("siteLanguage",lang);
}
languageSelect.addEventListener("change",e=>setLanguage(e.target.value));
const savedLang=localStorage.getItem("siteLanguage")||"zh"; languageSelect.value=savedLang; setLanguage(savedLang);
function val(id){return (document.getElementById(id)?.value || '').trim();}
function setOut(t){document.getElementById('outputText').value=t;}
function copyResult(){const el=document.getElementById('outputText');el.select();document.execCommand('copy');alert((translations[currentLang]||translations.zh).copied);}
function clearTool(){document.querySelectorAll('input,textarea').forEach(el=>{if(el.id!=='outputText')el.value='';});document.getElementById('outputText').value='';}
function sentences(text){return text.replace(/\n+/g,' ').split(/(?<=[。！？.!?])\s*/).map(s=>s.trim()).filter(Boolean);}

function runTool(){const d=translations[currentLang]||translations.zh;let t=val('inputText');if(!t){alert(d.empty);return;}const s=val('style');t=t.replace(/非常/g,'').replace(/真的/g,'').replace(/\s+/g,' ').trim();if(s==='formal')t='建议采用以下表述：'+t;if(s==='short')t=sentences(t).slice(0,3).join(' ');setOut(t);}
