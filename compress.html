<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>图片压缩工具 - ZenTools</title>

<meta name="description" content="ZenTools 免费在线图片压缩工具，支持 JPG、PNG、WEBP 图片压缩，支持手机与电脑。">

<style>
:root{
  --bg:#0f172a;
  --card:#111827;
  --border:#1f2937;
  --text:#f3f4f6;
  --muted:#9ca3af;
  --blue:#2563eb;
  --green:#10b981;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:var(--bg);
  color:var(--text);
  font-family:Arial,"Noto Sans SC","Noto Sans JP",sans-serif;
  line-height:1.7;
}

.container{
  max-width:1000px;
  margin:auto;
  padding:40px 20px;
}

.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:20px;
  padding:28px;
}

a{
  color:#60a5fa;
  text-decoration:none;
}

.top-bar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  margin-bottom:20px;
  flex-wrap:wrap;
}

.lang-select{
  background:#0f172a;
  color:white;
  border:1px solid #334155;
  border-radius:10px;
  padding:10px 12px;
}

h1{
  margin-bottom:15px;
}

.desc{
  color:var(--muted);
  margin-bottom:25px;
}

.ad-box{
  margin:25px 0;
  height:110px;
  border:2px dashed #334155;
  border-radius:18px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#64748b;
}

.upload-box{
  margin-top:25px;
}

input[type="file"]{
  width:100%;
  margin:20px 0;
}

.range-box{
  margin-top:20px;
}

input[type="range"]{
  width:100%;
}

button{
  margin-top:20px;
  background:var(--blue);
  color:white;
  border:none;
  padding:14px 20px;
  border-radius:12px;
  cursor:pointer;
  font-size:16px;
  font-weight:bold;
  transition:.3s;
}

button:hover{
  transform:translateY(-2px);
}

.preview{
  margin-top:35px;
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:20px;
}

.preview img{
  width:100%;
  border-radius:14px;
  border:1px solid #334155;
}

.info{
  margin-top:40px;
}

.info h2{
  margin-top:30px;
  margin-bottom:10px;
}

.info p{
  color:#cbd5e1;
  white-space:pre-line;
}

.download-btn{
  display:inline-block;
  margin-top:12px;
  background:var(--green);
  color:white;
  padding:10px 15px;
  border-radius:10px;
}

footer{
  margin-top:50px;
  text-align:center;
  color:#94a3b8;
}

@media(max-width:768px){
  .container{
    padding:25px 15px;
  }

  h1{
    font-size:30px;
  }

  button{
    width:100%;
  }

  .lang-select{
    width:100%;
  }
}
</style>
</head>

<body>

<div class="container">

  <div class="top-bar">
    <a href="index.html" data-i18n="back">← 返回首页</a>

    <select id="languageSelect" class="lang-select">
      <option value="zh">中文</option>
      <option value="ja">日本語</option>
      <option value="en">English</option>
      <option value="vi">Tiếng Việt</option>
    </select>
  </div>

  <div class="card">

    <h1 data-i18n="title">图片压缩工具</h1>

    <p class="desc" data-i18n="desc">
      免费在线图片压缩工具。支持 JPG、PNG、WEBP 图片压缩，支持手机与电脑浏览器。
    </p>

    <div class="ad-box" data-i18n="ad">
      广告位（Google AdSense）
    </div>

    <div class="upload-box">

      <input type="file" id="imageInput" accept="image/*">

      <div class="range-box">
        <p>
          <span data-i18n="quality">压缩质量：</span>
          <span id="qualityValue">0.7</span>
        </p>

        <input
          type="range"
          id="qualityRange"
          min="0.1"
          max="1"
          step="0.1"
          value="0.7"
        >
      </div>

      <button onclick="compressImage()" data-i18n="start">
        开始压缩
      </button>

    </div>

    <div class="preview" id="preview"></div>

    <div class="info">

      <h2 data-i18n="guideTitle">使用说明</h2>

      <p data-i18n="guideText">1. 上传图片。
2. 调节压缩质量。
3. 点击开始压缩。
4. 下载压缩后的图片。</p>

      <h2 data-i18n="compatTitle">兼容性</h2>

      <p data-i18n="compatText">本工具支持 Chrome、Safari、Edge 等现代浏览器。所有处理均在浏览器本地完成。</p>

      <h2 data-i18n="privacyTitle">隐私说明</h2>

      <p data-i18n="privacyText">图片处理在浏览器本地完成，正常情况下不会上传到服务器。</p>

    </div>

  </div>

  <footer>
    © 2026 ZenTools. All Rights Reserved.
  </footer>

</div>

<script>
const qualityRange = document.getElementById("qualityRange");
const qualityValue = document.getElementById("qualityValue");
const languageSelect = document.getElementById("languageSelect");

let currentLang = "zh";

const translations = {
  zh:{
    pageTitle:"图片压缩工具 - ZenTools",
    back:"← 返回首页",
    title:"图片压缩工具",
    desc:"免费在线图片压缩工具。支持 JPG、PNG、WEBP 图片压缩，支持手机与电脑浏览器。",
    ad:"广告位（Google AdSense）",
    quality:"压缩质量：",
    start:"开始压缩",
    original:"原图",
    compressed:"压缩后",
    download:"下载图片",
    alertNoFile:"请选择图片",
    guideTitle:"使用说明",
    guideText:"1. 上传图片。\n2. 调节压缩质量。\n3. 点击开始压缩。\n4. 下载压缩后的图片。",
    compatTitle:"兼容性",
    compatText:"本工具支持 Chrome、Safari、Edge 等现代浏览器。所有处理均在浏览器本地完成。",
    privacyTitle:"隐私说明",
    privacyText:"图片处理在浏览器本地完成，正常情况下不会上传到服务器。"
  },

  ja:{
    pageTitle:"画像圧縮ツール - ZenTools",
    back:"← ホームに戻る",
    title:"画像圧縮ツール",
    desc:"無料オンライン画像圧縮ツールです。JPG、PNG、WEBP に対応し、スマホとPCで利用できます。",
    ad:"広告スペース（Google AdSense）",
    quality:"圧縮品質：",
    start:"圧縮開始",
    original:"元画像",
    compressed:"圧縮後",
    download:"画像をダウンロード",
    alertNoFile:"画像を選択してください",
    guideTitle:"使い方",
    guideText:"1. 画像をアップロードします。\n2. 圧縮品質を調整します。\n3. 圧縮開始をクリックします。\n4. 圧縮後の画像を保存します。",
    compatTitle:"互換性",
    compatText:"Chrome、Safari、Edge などの最新ブラウザに対応しています。処理はブラウザ内で行われます。",
    privacyTitle:"プライバシーについて",
    privacyText:"画像処理は通常ブラウザ内で行われ、サーバーへアップロードされません。"
  },

  en:{
    pageTitle:"Image Compression Tool - ZenTools",
    back:"← Back to Home",
    title:"Image Compression Tool",
    desc:"Free online image compression tool. Supports JPG, PNG, and WEBP images on mobile and desktop browsers.",
    ad:"Ad Space（Google AdSense）",
    quality:"Compression Quality:",
    start:"Start Compression",
    original:"Original Image",
    compressed:"Compressed Image",
    download:"Download Image",
    alertNoFile:"Please select an image",
    guideTitle:"How to Use",
    guideText:"1. Upload an image.\n2. Adjust the compression quality.\n3. Click start compression.\n4. Download the compressed image.",
    compatTitle:"Compatibility",
    compatText:"This tool supports modern browsers such as Chrome, Safari, and Edge. All processing is done locally in your browser.",
    privacyTitle:"Privacy Notice",
    privacyText:"Image processing is normally completed locally in your browser and is not uploaded to a server."
  },

  vi:{
    pageTitle:"Công cụ nén ảnh - ZenTools",
    back:"← Quay lại trang chủ",
    title:"Công cụ nén ảnh",
    desc:"Công cụ nén ảnh trực tuyến miễn phí, hỗ trợ JPG, PNG, WEBP trên điện thoại và máy tính.",
    ad:"Vị trí quảng cáo（Google AdSense）",
    quality:"Chất lượng nén:",
    start:"Bắt đầu nén",
    original:"Ảnh gốc",
    compressed:"Ảnh sau khi nén",
    download:"Tải ảnh xuống",
    alertNoFile:"Vui lòng chọn ảnh",
    guideTitle:"Hướng dẫn sử dụng",
    guideText:"1. Tải ảnh lên.\n2. Điều chỉnh chất lượng nén.\n3. Nhấn bắt đầu nén.\n4. Tải ảnh đã nén xuống.",
    compatTitle:"Khả năng tương thích",
    compatText:"Công cụ hỗ trợ Chrome, Safari, Edge và các trình duyệt hiện đại. Tất cả xử lý được thực hiện trong trình duyệt.",
    privacyTitle:"Thông tin quyền riêng tư",
    privacyText:"Hình ảnh thường được xử lý trực tiếp trong trình duyệt và không được tải lên máy chủ."
  }
};

qualityRange.addEventListener("input", function(){
  qualityValue.textContent = this.value;
});

function setLanguage(lang){
  currentLang = lang;
  const data = translations[lang] || translations.zh;

  document.documentElement.lang = lang;
  document.title = data.pageTitle;

  document.querySelectorAll("[data-i18n]").forEach(el=>{
    const key = el.getAttribute("data-i18n");
    if(data[key]){
      el.innerText = data[key];
    }
  });

  localStorage.setItem("siteLanguage", lang);
}

languageSelect.addEventListener("change", function(){
  setLanguage(this.value);
});

const savedLang = localStorage.getItem("siteLanguage") || "zh";
languageSelect.value = savedLang;
setLanguage(savedLang);

function compressImage(){
  const file = document.getElementById("imageInput").files[0];

  if(!file){
    alert(translations[currentLang].alertNoFile);
    return;
  }

  const quality = parseFloat(qualityRange.value);
  const reader = new FileReader();

  reader.onload = function(e){
    const img = new Image();
    img.src = e.target.result;

    img.onload = function(){
      const canvas = document.createElement("canvas");
      const ctx = canvas.getContext("2d");

      canvas.width = img.width;
      canvas.height = img.height;

      ctx.drawImage(img, 0, 0);

      const compressedData = canvas.toDataURL("image/jpeg", quality);

      showPreview(e.target.result, compressedData);
    };
  };

  reader.readAsDataURL(file);
}

function showPreview(original, compressed){
  const data = translations[currentLang] || translations.zh;
  const preview = document.getElementById("preview");

  preview.innerHTML = `
    <div>
      <h3>${data.original}</h3>
      <img src="${original}">
    </div>

    <div>
      <h3>${data.compressed}</h3>
      <img src="${compressed}">
      <br>
      <a
        class="download-btn"
        href="${compressed}"
        download="compressed.jpg"
      >
        ${data.download}
      </a>
    </div>
  `;
}
<script>
const seoData = {
  title: "工具名称 - 免费在线工具 | ZenTools",
  description: "免费在线工具名称，支持手机与电脑，无需安装软件。",
  keywords: "工具名称,在线工具,免费工具,ZenTools",
  url: "https://www.zentools.xyz/tool.html",
  image: "https://www.zentools.xyz/logo.png"
};

function setMeta(name, content){
  let meta = document.querySelector(`meta[name="${name}"]`);
  if(!meta){
    meta = document.createElement("meta");
    meta.setAttribute("name", name);
    document.head.appendChild(meta);
  }
  meta.setAttribute("content", content);
}

function setProperty(property, content){
  let meta = document.querySelector(`meta[property="${property}"]`);
  if(!meta){
    meta = document.createElement("meta");
    meta.setAttribute("property", property);
    document.head.appendChild(meta);
  }
  meta.setAttribute("content", content);
}

function setCanonical(url){
  let link = document.querySelector('link[rel="canonical"]');
  if(!link){
    link = document.createElement("link");
    link.setAttribute("rel", "canonical");
    document.head.appendChild(link);
  }
  link.setAttribute("href", url);
}

function applySEO(){
  document.title = seoData.title;

  setMeta("description", seoData.description);
  setMeta("keywords", seoData.keywords);
  setMeta("author", "ZenTools");

  setCanonical(seoData.url);

  setProperty("og:title", seoData.title);
  setProperty("og:description", seoData.description);
  setProperty("og:type", "website");
  setProperty("og:url", seoData.url);
  setProperty("og:image", seoData.image);

  setMeta("twitter:card", "summary_large_image");
  setMeta("twitter:title", seoData.title);
  setMeta("twitter:description", seoData.description);
}

applySEO();
</script>

</body>
</html>
