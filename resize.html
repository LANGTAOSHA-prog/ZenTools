<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>图片尺寸修改工具 - ZenTools</title>

<meta name="description" content="ZenTools 免费在线图片尺寸修改工具，支持 JPG、PNG、WEBP 图片调整大小。">

<style>
:root{
  --bg:#0f172a;
  --card:#111827;
  --border:#1f2937;
  --text:#f3f4f6;
  --muted:#9ca3af;
  --blue:#2563eb;
  --green:#10b981;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:var(--bg);
  color:var(--text);
  font-family:Arial,"Noto Sans SC","Noto Sans JP",sans-serif;
  line-height:1.7;
}

.container{
  max-width:1000px;
  margin:auto;
  padding:40px 20px;
}

a{
  color:#60a5fa;
  text-decoration:none;
}

.top-bar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  flex-wrap:wrap;
  gap:15px;
  margin-bottom:20px;
}

.lang-select{
  background:#0f172a;
  color:white;
  border:1px solid #334155;
  border-radius:10px;
  padding:10px 12px;
}

.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:20px;
  padding:28px;
}

h1{
  margin-bottom:15px;
}

.desc{
  color:var(--muted);
  margin-bottom:25px;
}

.ad-box{
  margin:25px 0;
  height:110px;
  border:2px dashed #334155;
  border-radius:18px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#64748b;
}

input[type="file"],
input[type="number"]{
  width:100%;
  margin:15px 0;
  padding:14px;
  border-radius:12px;
  border:1px solid #334155;
  background:#0f172a;
  color:white;
}

.checkbox{
  margin-top:10px;
}

button{
  margin-top:20px;
  background:var(--blue);
  color:white;
  border:none;
  padding:14px 20px;
  border-radius:12px;
  cursor:pointer;
  font-size:16px;
  font-weight:bold;
}

.preview{
  margin-top:35px;
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:20px;
}

.preview img{
  width:100%;
  border-radius:14px;
  border:1px solid #334155;
}

.download-btn{
  display:inline-block;
  margin-top:12px;
  background:var(--green);
  color:white;
  padding:10px 15px;
  border-radius:10px;
}

.info{
  margin-top:40px;
}

.info h2{
  margin-top:30px;
  margin-bottom:10px;
}

.info p{
  color:#cbd5e1;
  white-space:pre-line;
}

footer{
  margin-top:50px;
  text-align:center;
  color:#94a3b8;
}

@media(max-width:768px){

  .container{
    padding:25px 15px;
  }

  button,
  .lang-select{
    width:100%;
  }

}
</style>
</head>

<body>

<div class="container">

  <div class="top-bar">

    <a href="index.html" data-i18n="back">
      ← 返回首页
    </a>

    <select id="languageSelect" class="lang-select">
      <option value="zh">中文</option>
      <option value="ja">日本語</option>
      <option value="en">English</option>
      <option value="vi">Tiếng Việt</option>
    </select>

  </div>

  <div class="card">

    <h1 data-i18n="title">
      图片尺寸修改工具
    </h1>

    <p class="desc" data-i18n="desc">
      免费在线图片尺寸修改工具。支持 JPG、PNG、WEBP 图片调整大小。
    </p>

    <div class="ad-box" data-i18n="ad">
      广告位（Google AdSense）
    </div>

    <input type="file" id="imageInput" accept="image/*">

    <input type="number" id="widthInput" placeholder="Width">

    <input type="number" id="heightInput" placeholder="Height">

    <div class="checkbox">
      <label>
        <input type="checkbox" id="keepRatio" checked>
        <span data-i18n="keepRatio">
          保持比例
        </span>
      </label>
    </div>

    <button onclick="resizeImage()" data-i18n="resizeBtn">
      开始修改
    </button>

    <div class="preview" id="preview"></div>

    <div class="info">

      <h2 data-i18n="guideTitle">
        使用说明
      </h2>

      <p data-i18n="guideText">
1. 上传图片。
2. 输入宽度与高度。
3. 点击开始修改。
4. 下载新图片。
      </p>

      <h2 data-i18n="privacyTitle">
        隐私说明
      </h2>

      <p data-i18n="privacyText">
图片处理在浏览器本地完成，正常情况下不会上传到服务器。
      </p>

    </div>

  </div>

  <footer>
    © 2026 ZenTools. All Rights Reserved.
  </footer>

</div>

<script>

const languageSelect = document.getElementById("languageSelect");

let currentLang = "zh";

const translations = {

  zh:{
    pageTitle:"图片尺寸修改工具 - ZenTools",
    back:"← 返回首页",
    title:"图片尺寸修改工具",
    desc:"免费在线图片尺寸修改工具。支持 JPG、PNG、WEBP 图片调整大小。",
    ad:"广告位（Google AdSense）",
    keepRatio:"保持比例",
    resizeBtn:"开始修改",
    original:"原图",
    resized:"修改后",
    download:"下载图片",
    alertNoFile:"请选择图片",
    guideTitle:"使用说明",
    guideText:"1. 上传图片。\n2. 输入宽度与高度。\n3. 点击开始修改。\n4. 下载新图片。",
    privacyTitle:"隐私说明",
    privacyText:"图片处理在浏览器本地完成，正常情况下不会上传到服务器。"
  },

  ja:{
    pageTitle:"画像サイズ変更ツール - ZenTools",
    back:"← ホームに戻る",
    title:"画像サイズ変更ツール",
    desc:"無料オンライン画像サイズ変更ツール。JPG、PNG、WEBP に対応。",
    ad:"広告スペース（Google AdSense）",
    keepRatio:"縦横比を保持",
    resizeBtn:"サイズ変更開始",
    original:"元画像",
    resized:"変更後",
    download:"画像をダウンロード",
    alertNoFile:"画像を選択してください",
    guideTitle:"使い方",
    guideText:"1. 画像をアップロードします。\n2. 幅と高さを入力します。\n3. サイズ変更開始をクリックします。\n4. 新しい画像を保存します。",
    privacyTitle:"プライバシーについて",
    privacyText:"画像処理はブラウザ内で行われ、通常サーバーへアップロードされません。"
  },

  en:{
    pageTitle:"Image Resizer - ZenTools",
    back:"← Back to Home",
    title:"Image Resizer",
    desc:"Free online image resizer. Supports JPG, PNG, and WEBP images.",
    ad:"Ad Space（Google AdSense）",
    keepRatio:"Keep Aspect Ratio",
    resizeBtn:"Resize Image",
    original:"Original Image",
    resized:"Resized Image",
    download:"Download Image",
    alertNoFile:"Please select an image",
    guideTitle:"How to Use",
    guideText:"1. Upload an image.\n2. Enter width and height.\n3. Click Resize Image.\n4. Download the resized image.",
    privacyTitle:"Privacy Notice",
    privacyText:"Image processing is completed locally in your browser and is not uploaded to a server."
  },

  vi:{
    pageTitle:"Công cụ thay đổi kích thước ảnh - ZenTools",
    back:"← Quay lại trang chủ",
    title:"Công cụ thay đổi kích thước ảnh",
    desc:"Công cụ thay đổi kích thước ảnh miễn phí hỗ trợ JPG, PNG và WEBP.",
    ad:"Vị trí quảng cáo（Google AdSense）",
    keepRatio:"Giữ tỷ lệ",
    resizeBtn:"Bắt đầu thay đổi",
    original:"Ảnh gốc",
    resized:"Ảnh sau thay đổi",
    download:"Tải ảnh xuống",
    alertNoFile:"Vui lòng chọn ảnh",
    guideTitle:"Hướng dẫn sử dụng",
    guideText:"1. Tải ảnh lên.\n2. Nhập chiều rộng và chiều cao.\n3. Nhấn bắt đầu thay đổi.\n4. Tải ảnh mới.",
    privacyTitle:"Thông tin quyền riêng tư",
    privacyText:"Ảnh được xử lý trực tiếp trong trình duyệt và không được tải lên máy chủ."
  }

};

function setLanguage(lang){

  currentLang = lang;

  const data = translations[lang] || translations.zh;

  document.documentElement.lang = lang;

  document.title = data.pageTitle;

  document.querySelectorAll("[data-i18n]").forEach(el=>{

    const key = el.getAttribute("data-i18n");

    if(data[key]){
      el.textContent = data[key];
    }

  });

  localStorage.setItem("siteLanguage", lang);

}

languageSelect.addEventListener("change", function(){

  setLanguage(this.value);

});

const savedLang = localStorage.getItem("siteLanguage") || "zh";

languageSelect.value = savedLang;

setLanguage(savedLang);

function resizeImage(){

  const file = document.getElementById("imageInput").files[0];

  if(!file){

    alert(translations[currentLang].alertNoFile);

    return;

  }

  const width = parseInt(document.getElementById("widthInput").value);

  const height = parseInt(document.getElementById("heightInput").value);

  const keepRatio = document.getElementById("keepRatio").checked;

  const reader = new FileReader();

  reader.onload = function(e){

    const img = new Image();

    img.src = e.target.result;

    img.onload = function(){

      let newWidth = width || img.width;

      let newHeight = height || img.height;

      if(keepRatio){

        const ratio = img.width / img.height;

        if(width && !height){
          newHeight = width / ratio;
        }

        if(height && !width){
          newWidth = height * ratio;
        }

      }

      const canvas = document.createElement("canvas");

      const ctx = canvas.getContext("2d");

      canvas.width = newWidth;

      canvas.height = newHeight;

      ctx.drawImage(img, 0, 0, newWidth, newHeight);

      const resizedData = canvas.toDataURL("image/jpeg");

      showPreview(e.target.result, resizedData);

    };

  };

  reader.readAsDataURL(file);

}

function showPreview(original, resized){

  const data = translations[currentLang] || translations.zh;

  const preview = document.getElementById("preview");

  preview.innerHTML = `

    <div>

      <h3>${data.original}</h3>

      <img src="${original}">

    </div>

    <div>

      <h3>${data.resized}</h3>

      <img src="${resized}">

      <br>

      <a
        class="download-btn"
        href="${resized}"
        download="resized.jpg"
      >
        ${data.download}
      </a>

    </div>

  `;

}

</script>

</body>
</html>
