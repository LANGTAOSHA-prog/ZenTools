  <textarea id="readText" rows="8" placeholder="粘贴文章内容..."></textarea>

    <button class="btn" onclick="analyzeReadability()">分析</button>

<script>

function analyzeReadability() {
  const text = document.getElementById('readText').value.trim();
  if (!text) { alert('请输入文本'); return; }
  const chars = text.length;
  const sentences = text.split(/[。！？.!?\n]+/).filter(Boolean).length || 1;
  const paragraphs = text.split(/\n\s*\n/).filter(Boolean).length || 1;
  const chineseChars = (text.match(/[\u4e00-\u9fff]/g) || []).length;
  const words = text.match(/[\u4e00-\u9fff\w]+/g) || [];
  const avgSentLen = Math.round(chars / sentences);
  const avgParaLen = Math.round(chars / paragraphs);
  let result = '📊 内容分析结果\n' + '='.repeat(30) + '\n\n';
  result += '总字符数: ' + chars + '\n';
  result += '中文字数: ' + chineseChars + '\n';
  result += '句子数: ' + sentences + '\n';
  result += '段落数: ' + paragraphs + '\n';
  result += '平均句长: ' + avgSentLen + ' 字符' + (avgSentLen > 100 ? ' ⚠️ 偏长' : avgSentLen > 50 ? ' 适中' : ' 良好') + '\n';
  result += '平均段长: ' + avgParaLen + ' 字符' + (avgParaLen > 500 ? ' ⚠️ 偏长，建议分段' : ' 良好') + '\n\n';
  result += '--- 建议 ---\n';
  if (chineseChars < 300) result += '🔸 内容偏短，建议补充至 300 字以上\n';
  if (sentences < 3) result += '🔸 句子数量较少，建议分段\n';
  if (avgSentLen > 80) result += '🔸 句子偏长，建议拆分长句\n';
  if (paragraphs < 3 && chars > 200) result += '🔸 段落数偏少，建议分段提高可读性\n';
  if (chineseChars >= 300 && avgSentLen <= 80 && paragraphs >= 3) result += '✅ 内容结构良好！';
  const el = document.getElementById('readResult');
  el.style.display = 'block';
  el.textContent = result;
}
</script>
