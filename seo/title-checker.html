<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>SEO标题检查器 - ZenTools</title><meta name="description" content="检查网页标题长度，模拟搜索引擎搜索结果预览。"><link rel="stylesheet" href="../assets/css/style.css"><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1955887568822472" crossorigin="anonymous"></script><style>:root{--bg:#0f172a;--card:#111827;--border:#1f2937;--text:#f3f4f6;--muted:#94a3b8;--blue:#2563eb;--green:#10b981;--orange:#f59e0b;--red:#ef4444}*{margin:0;padding:0;box-sizing:border-box}body{background:var(--bg);color:var(--text);font-family:Arial,"Noto Sans SC",sans-serif}.container{max-width:800px;margin:auto;padding:40px 20px}a{color:#60a5fa}.top-bar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;margin-bottom:20px;gap:10px}.lang-select{background:#111827;color:#fff;border:1px solid #334155;border-radius:10px;padding:10px 12px;font-size:13px}.card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:28px}h1{margin-bottom:15px}.desc{color:var(--muted);margin-bottom:25px}.ad-box{margin:25px 0;height:110px;border:2px dashed #334155;border-radius:18px;display:flex;align-items:center;justify-content:center;color:#64748b}label{display:block;color:var(--muted);font-size:13px;margin:12px 0 4px}input,textarea{width:100%;padding:14px;border-radius:12px;border:1px solid #334155;background:#0f172a;color:#fff;font-size:15px;margin:6px 0}textarea{min-height:120px;resize:vertical}.serp-preview{background:#0f172a;border:1px solid #334155;border-radius:14px;padding:20px;margin:20px 0;font-family:Arial,sans-serif}.serp-preview .url{font-size:14px;color:#8ab4f8;margin-bottom:2px}.serp-preview .title{font-size:20px;color:#8ab4f8;text-decoration:none;display:block;margin-bottom:4px;line-height:1.3}.serp-preview .title.long{color:var(--orange)}.serp-preview .title.too-long{color:var(--red)}.serp-preview .descTxt{font-size:13px;color:#bdc1c6;line-height:1.5}.stats{display:flex;gap:15px;flex-wrap:wrap;margin:15px 0}.stat-box{flex:1;min-width:120px;background:rgba(255,255,255,0.03);border:1px solid var(--border);border-radius:12px;padding:14px;text-align:center}.stat-box .v{font-size:24px;font-weight:bold}.stat-box .l{font-size:11px;color:var(--muted);margin-top:4px}.green{color:var(--green)}.orange{color:var(--orange)}.red{color:var(--red)}button{background:var(--blue);color:#fff;border:none;padding:13px 18px;border-radius:12px;cursor:pointer;font-weight:bold;margin:6px 0;font-size:15px}footer{margin-top:50px;text-align:center;color:#94a3b8}@media(max-width:768px){button,.lang-select{width:100%}}</style></head><body><div class="container"><div class="top-bar"><a href="../index.html">← 返回首页</a><select id="langSelect" class="lang-select"><option value="zh">中文</option><option value="en">English</option></select></div><div class="card"><h1>SEO标题检查器</h1><p class="desc" id="pageDesc">检查网页标题和描述的 SEO 优化情况，模拟搜索引擎搜索结果预览。</p><div class="ad-box">广告位（Google AdSense）</div><label>网页标题</label><input type="text" id="titleInput" placeholder="输入网页标题..." oninput="updatePreview()"><label>Meta 描述</label><textarea id="descInput" placeholder="输入 meta description..." oninput="updatePreview()"></textarea><div class="stats"><div class="stat-box"><div class="v" id="titleLen">0</div><div class="l">标题字符数</div></div><div class="stat-box"><div class="v" id="titleStatus" style="font-size:16px">-</div><div class="l">标题状态</div></div><div class="stat-box"><div class="v" id="descLen">0</div><div class="l">描述字符数</div></div><div class="stat-box"><div class="v" id="descStatus" style="font-size:16px">-</div><div class="l">描述状态</div></div></div><div class="serp-preview"><div class="url" id="previewUrl">https://example.com/page</div><div class="title" id="previewTitle">页面标题显示在这里</div><div class="descTxt" id="previewDesc">页面描述显示在这里...</div></div><button onclick="clearAll()">清空</button></div><footer>© 2026 ZenTools</footer></div><script>function updatePreview(){const t=document.getElementById('titleInput').value;const d=document.getElementById('descInput').value;const tl=document.getElementById('titleLen');const ts=document.getElementById('titleStatus');const dl=document.getElementById('descLen');const ds=document.getElementById('descStatus');const pt=document.getElementById('previewTitle');const pd=document.getElementById('previewDesc');tl.textContent=t.length;if(t.length===0){ts.textContent='-';ts.className='v';pt.textContent='页面标题显示在这里';pt.className='title';}else if(t.length<=60){ts.textContent='✅ 良好';ts.className='v green';pt.className='title';pt.textContent=t;}else if(t.length<=80){ts.textContent='⚠️ 偏长';ts.className='v orange';pt.className='title long';pt.textContent=t;}else{ts.textContent='❌ 过长';ts.className='v red';pt.className='title too-long';pt.textContent=t;}dl.textContent=d.length;if(d.length===0){ds.textContent='-';ds.className='v';pd.textContent='页面描述显示在这里...';}else if(d.length<=160){ds.textContent='✅ 良好';ds.className='v green';pd.textContent=d;}else{ds.textContent='❌ 过长';ds.className='v red';pd.textContent=d.substring(0,160)+'...';}}function clearAll(){document.getElementById('titleInput').value='';document.getElementById('descInput').value='';updatePreview();}</script></body></html>
