<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meta 标签生成器 - SEO 工具 | ZenTools</title>
<meta name="description" content="快速生成网页 Meta 标签 HTML 代码，支持 SEO 优化。">
<meta name="keywords" content="meta标签,meta生成器,seo标签,网页描述,SEO优化">
<link rel="manifest" href="/manifest.json" />
  <link rel="stylesheet" href="../assets/css/tool-ui.css">
<style>
  .tool-box { padding: 24px; background: var(--surface); border-radius: var(--r); border:1px solid var(--border); }
  label { display:block; margin:12px 0 4px; font-size:13px; font-weight:600; color:var(--muted); }
  textarea, input[type="text"], input[type="number"] { width:100%; padding:10px 12px; border-radius:8px; border:1px solid var(--border); background:var(--bg); color:var(--text); font-size:14px; resize:vertical; font-family:inherit; }
  textarea:focus, input:focus { outline:none; border-color:var(--cyan); }
  .btn { padding:10px 24px; border-radius:8px; border:none; background:linear-gradient(135deg,var(--cyan),var(--purple)); color:#fff; font-size:14px; font-weight:600; cursor:pointer; transition:opacity .2s; }
  .btn:hover { opacity:.85; }
  .btn-secondary { background:var(--glass-b); color:var(--text); }
  .result { margin-top:16px; padding:16px; border-radius:8px; background:var(--glass); border:1px solid var(--border); white-space:pre-wrap; font-size:13px; line-height:1.6; }
  .stat { display:inline-block; padding:4px 12px; border-radius:6px; background:var(--glass); margin:4px; font-size:13px; }
</style>
</head>
<body>
<div class="container">
  <nav class="nav-bar">
    <div class="logo"><span class="mark">⛵</span>江湖小站-ZenTools</div>
    <div class="links">
      <a href="/">首页</a>
      <a href="#" class="active">SEO 工具</a>
      <a href="/plugins-preview.html">全部工具</a>
    </div>
  </nav>
  <a href="/" class="back-home">← 返回首页</a>
  <div class="page-header">
    <h1><span class="hl">Meta 标签生成器</span></h1>
    <p>快速生成网页 Meta 标签 HTML 代码，支持 SEO 优化。</p>
  </div>
  <div class="tool-box">
    
  <label>页面标题 (Title)</label>
  <input type="text" id="seoTitle" placeholder="例如: 免费在线PDF工具 | ZenTools" />
  <label>Meta 描述 (Description)</label>
  <textarea id="seoDesc" rows="3" placeholder="例如: 提供PDF合并、压缩、转换等免费在线工具，纯本地处理保护隐私。"></textarea>
  <label>Meta 关键词 (Keywords - 可选)</label>
  <input type="text" id="seoKeywords" placeholder="例如: PDF工具,在线PDF,免费工具" />
  <label>规范链接 (Canonical URL - 可选)</label>
  <input type="text" id="seoUrl" placeholder="https://zentools.xyz/pdf/pdf-merge.html" />
  <div style="display:flex;gap:10px;margin-top:16px;">
    <button class="btn" onclick="generateMeta()">生成代码</button>
    <button class="btn btn-secondary" onclick="copyResult()">复制代码</button>
  </div>
  <div class="result" id="metaResult" style="display:none;"></div>
  <div style="margin-top:16px;padding:12px;border-radius:8px;background:var(--glass);font-size:12px;color:var(--muted);">
    <strong>💡 小提示：</strong>Title 建议 30-60 字符，Description 建议 120-155 字符。
  </div>
  </div>
</div>
<script src="../assets/js/tool-ui.js"></script>
<script>

function generateMeta() {
  const title = document.getElementById('seoTitle').value.trim();
  const desc = document.getElementById('seoDesc').value.trim();
  const kw = document.getElementById('seoKeywords').value.trim();
  const url = document.getElementById('seoUrl').value.trim();
  let html = '';
  if (title) html += '<title>' + esc(title) + '</title>\n';
  if (desc) html += '<meta name="description" content="' + esc(desc) + '" />\n';
  if (kw) html += '<meta name="keywords" content="' + esc(kw) + '" />\n';
  if (url) html += '<link rel="canonical" href="' + esc(url) + '" />\n';
  html += '\n<!-- Open Graph -->\n';
  if (title) html += '<meta property="og:title" content="' + esc(title) + '" />\n';
  if (desc) html += '<meta property="og:description" content="' + esc(desc) + '" />\n';
  if (url) html += '<meta property="og:url" content="' + esc(url) + '" />\n';
  const el = document.getElementById('metaResult');
  el.style.display = 'block';
  el.textContent = html || '请至少填写标题或描述';
}
function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function copyResult() {
  const el = document.getElementById('metaResult');
  if (!el.textContent) return;
  navigator.clipboard.writeText(el.textContent).then(() => { el.textContent += '\n\n✅ 已复制!'; });
}
</script>
<button class="bookmark-float" onclick="prompt('复制链接收藏本站','https://zentools.xyz')">⭐ 收藏本站</button>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/service-worker.js').catch(() => {});
  });
}
</script>
</body>
</html>
