<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>关键词密度分析 - ZenTools</title><meta name="description" content="分析文本中关键词的出现频率和密度，优化 SEO 内容。"><link rel="stylesheet" href="../assets/css/style.css"><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1955887568822472" crossorigin="anonymous"></script><style>:root{--bg:#0f172a;--card:#111827;--border:#1f2937;--text:#f3f4f6;--muted:#94a3b8;--blue:#2563eb;--green:#10b981}*{margin:0;padding:0;box-sizing:border-box}body{background:var(--bg);color:var(--text);font-family:Arial,"Noto Sans SC",sans-serif}.container{max-width:800px;margin:auto;padding:40px 20px}a{color:#60a5fa}.top-bar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;margin-bottom:20px;gap:10px}.lang-select{background:#111827;color:#fff;border:1px solid #334155;border-radius:10px;padding:10px 12px;font-size:13px}.card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:28px}h1{margin-bottom:15px}.desc{color:var(--muted);margin-bottom:25px}.ad-box{margin:25px 0;height:110px;border:2px dashed #334155;border-radius:18px;display:flex;align-items:center;justify-content:center;color:#64748b}textarea{width:100%;padding:14px;border-radius:12px;border:1px solid #334155;background:#0f172a;color:#fff;font-size:15px;min-height:180px;margin:10px 0;resize:vertical}button{background:var(--blue);color:#fff;border:none;padding:13px 18px;border-radius:12px;cursor:pointer;font-weight:bold;margin:6px 0;font-size:15px}.green{background:var(--green)}.stats-row{display:flex;gap:15px;flex-wrap:wrap;margin:15px 0}.stat-box{flex:1;min-width:100px;background:rgba(255,255,255,0.03);border:1px solid var(--border);border-radius:12px;padding:14px;text-align:center}.stat-box .v{font-size:22px;font-weight:bold;color:var(--blue)}.stat-box .l{font-size:11px;color:var(--muted);margin-top:4px}table{width:100%;border-collapse:collapse;margin:15px 0;font-size:14px}th,td{padding:10px 12px;text-align:right;border-bottom:1px solid var(--border)}th{color:var(--muted);font-weight:normal;text-align:left}td{color:var(--text)}td:first-child{text-align:left}.keyword-tags{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}.tag{background:rgba(37,99,235,0.12);border:1px solid rgba(37,99,235,0.3);border-radius:8px;padding:6px 14px;font-size:13px;display:flex;gap:6px;align-items:center}.tag .count{color:var(--muted);font-size:11px}footer{margin-top:50px;text-align:center;color:#94a3b8}@media(max-width:768px){button,.lang-select{width:100%}}</style></head><body><div class="container"><div class="top-bar"><a href="../index.html">← 返回首页</a><select id="langSelect" class="lang-select"><option value="zh">中文</option><option value="en">English</option></select></div><div class="card"><h1>关键词密度分析</h1><p class="desc">分析文本中关键词的出现频率和密度。</p><div class="ad-box">广告位（Google AdSense）</div><textarea id="textInput" placeholder="在此粘贴要分析的文本内容..."></textarea><div><button onclick="analyzeKeywords()">开始分析</button><button onclick="clearText()" style="background:var(--muted)">清空</button></div><div id="results" style="display:none"><div class="stats-row"><div class="stat-box"><div class="v" id="totalWords">0</div><div class="l">总词数</div></div><div class="stat-box"><div class="v" id="uniqueWords">0</div><div class="l">不同词数</div></div><div class="stat-box"><div class="v" id="stopWords">0</div><div class="l">停用词数</div></div></div><h3 style="margin-top:20px;color:var(--muted)">关键词密度排名</h3><div class="keyword-tags" id="keywordTags"></div><table id="keywordTable"><tr><th>关键词</th><th>出现次数</th><th>密度 (%)</th></tr></table></div></div><footer>© 2026 ZenTools</footer></div><script>function analyzeKeywords(){const t=document.getElementById('textInput').value.trim();if(!t){alert('请输入要分析的文本');return;}const words=t.toLowerCase().split(/[\s,，。．.、；;：:！!？?""''【】《》（）()\[\]{}「」]+/).filter(w=>w.length>0);const stopWords=new Set(['的','了','在','是','我','有','和','就','不','人','都','一','一个','上','也','很','到','说','要','去','你','会','着','没有','看','好','自己','这','他','她','它','们','那','些','a','the','and','to','of','in','for','on','is','it','with','as','at','by','an','or','be','was','but','not','this','are','from','that','have','has','we','you','they','will','can','all','each','its','their','them','his','her','about','would','which']);let total=0,stopCount=0,wordCount={};words.forEach(function(w){total++;if(stopWords.has(w)){stopCount++;return;}wordCount[w]=(wordCount[w]||0)+1;});const sorted=Object.entries(wordCount).sort(function(a,b){return b[1]-a[1];}).slice(0,50);const nonStopTotal=total-stopCount;document.getElementById('results').style.display='block';document.getElementById('totalWords').textContent=total;document.getElementById('uniqueWords').textContent=sorted.length;document.getElementById('stopWords').textContent=stopCount;const tags=document.getElementById('keywordTags');tags.innerHTML=sorted.slice(0,15).map(function(kv){return '<span class=\"tag\">'+kv[0]+' <span class=\"count\">×'+kv[1]+' ('+(kv[1]/nonStopTotal*100).toFixed(1)+'%)</span></span>';}).join('');const table=document.getElementById('keywordTable');table.innerHTML='<tr><th>关键词</th><th>出现次数</th><th>密度 (%)</th></tr>'+sorted.map(function(kv){return '<tr><td>'+kv[0]+'</td><td>'+kv[1]+'</td><td>'+(kv[1]/nonStopTotal*100).toFixed(2)+'</td></tr>';}).join('');}function clearText(){document.getElementById('textInput').value='';document.getElementById('results').style.display='none';}</script></body></html>
