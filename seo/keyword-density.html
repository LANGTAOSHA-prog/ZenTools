    <footer>© 2026 ZenTools</footer></div><script>function analyzeKeywords(){const t=document.getElementById('textInput').value.trim();if(!t){alert('请输入要分析的文本');return;}const words=t.toLowerCase().split(/[\s,，。．.、；;：:！!？?""''【】《》（）()\[\]{}「」]+/).filter(w=>w.length>0);const stopWords=new Set(['的','了','在','是','我','有','和','就','不','人','都','一','一个','上','也','很','到','说','要','去','你','会','着','没有','看','好','自己','这','他','她','它','们','那','些','a','the','and','to','of','in','for','on','is','it','with','as','at','by','an','or','be','was','but','not','this','are','from','that','have','has','we','you','they','will','can','all','each','its','their','them','his','her','about','would','which']);let total=0,stopCount=0,wordCount={};words.forEach(function(w){total++;if(stopWords.has(w)){stopCount++;return;}wordCount[w]=(wordCount[w]||0)+1;});const sorted=Object.entries(wordCount).sort(function(a,b){return b[1]-a[1];}).slice(0,50);const nonStopTotal=total-stopCount;document.getElementById('results').style.display='block';document.getElementById('totalWords').textContent=total;document.getElementById('uniqueWords').textContent=sorted.length;document.getElementById('stopWords').textContent=stopCount;const tags=document.getElementById('keywordTags');tags.innerHTML=sorted.slice(0,15).map(function(kv){return '<span class=\"tag\">'+kv[0]+' <span class=\"count\">×'+kv[1]+' ('+(kv[1]/nonStopTotal*100).toFixed(1)+'%)</span></span>';}).join('');const table=document.getElementById('keywordTable');table.innerHTML='<tr><th>关键词</th><th>出现次数</th><th>密度 (%)</th></tr>'+sorted.map(function(kv){return '<tr><td>'+kv[0]+'</td><td>'+kv[1]+'</td><td>'+(kv[1]/nonStopTotal*100).toFixed(2)+'</td></tr>';}).join('');}function clearText(){document.getElementById('textInput').value='';document.getElementById('results').style.display='none';}</script>
