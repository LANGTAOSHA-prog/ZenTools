    <h1><span class="hl">H 标题提取器</span></h1>
    <p>从 HTML 中提取 H1-H6 标题结构，检查页面标题层级是否合理。</p>
  </div>
  <div class="tool-box">
    
  <label>粘贴 HTML 代码</label>
  <textarea id="htmlInput" rows="8" placeholder="粘贴网页 HTML 代码..."></textarea>
  <div style="display:flex;gap:10px;margin-top:16px;">
    <button class="btn" onclick="extractHeadings()">提取标题</button>
    <button class="btn btn-secondary" onclick="document.getElementById('htmlInput').value='';document.getElementById('headingResult').style.display='none';">清除</button>
  </div>
  <div class="result" id="headingResult" style="display:none;"></div>
  <div id="headingStats" style="display:none;margin-top:12px;display:flex;gap:8px;flex-wrap:wrap;"></div>
  </div>
</div>
<script src="../assets/js/tool-ui.js"></script>
<script>

function extractHeadings() {
  const html = document.getElementById('htmlInput').value;
  if (!html.trim()) { alert('请粘贴 HTML 代码'); return; }
  const tags = ['h1','h2','h3','h4','h5','h6'];
  let result = '';
  const counts = {};
  tags.forEach(t => counts[t] = 0);
  const regex = /<(h[1-6])[^>]*>([\s\S]*?)<\/\1>/gi;
  let match;
  while ((match = regex.exec(html)) !== null) {
    const tag = match[1].toLowerCase();
    const text = match[2].replace(/<[^>]*>/g,'').trim();
    if (text) {
      counts[tag]++;
      result += tag.toUpperCase() + ': ' + text + '\n';
    }
  }
  const el = document.getElementById('headingResult');
  el.style.display = 'block';
  if (!result) {
    el.textContent = '未找到任何 H1-H6 标题标签';
    return;
  }
  el.textContent = result;
  // Stats
  const stats = document.getElementById('headingStats');
  stats.style.display = 'flex';
  let html = '';
  tags.forEach(t => {
    if (counts[t] > 0) html += '<span class="stat">' + t.toUpperCase() + ': ' + counts[t] + '</span>';
  });
  // Validation
  if (counts['h1'] === 0) html += '<span class="stat" style="color:#f43f5e;">⚠️ 缺少 H1</span>';
  if (counts['h1'] > 1) html += '<span class="stat" style="color:#f59e0b;">⚠️ 多个 H1 (' + counts['h1'] + '个)</span>';
  stats.innerHTML = html;
}
</script>
