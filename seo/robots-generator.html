<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Robots.txt 生成器 - ZenTools</title><meta name="description" content="在线生成 robots.txt 文件，控制搜索引擎爬虫访问规则。"><link rel="stylesheet" href="../assets/css/style.css"><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1955887568822472" crossorigin="anonymous"></script><style>:root{--bg:#0f172a;--card:#111827;--border:#1f2937;--text:#f3f4f6;--muted:#94a3b8;--blue:#2563eb;--green:#10b981}*{margin:0;padding:0;box-sizing:border-box}body{background:var(--bg);color:var(--text);font-family:Arial,"Noto Sans SC",sans-serif}.container{max-width:800px;margin:auto;padding:40px 20px}a{color:#60a5fa}.top-bar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;margin-bottom:20px;gap:10px}.lang-select{background:#111827;color:#fff;border:1px solid #334155;border-radius:10px;padding:10px 12px;font-size:13px}.card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:28px}h1{margin-bottom:15px}.desc{color:var(--muted);margin-bottom:25px}.ad-box{margin:25px 0;height:110px;border:2px dashed #334155;border-radius:18px;display:flex;align-items:center;justify-content:center;color:#64748b}input,textarea{width:100%;padding:14px;border-radius:12px;border:1px solid #334155;background:#0f172a;color:#fff;font-size:15px;margin:6px 0}input[type=text]{font-size:14px}textarea{min-height:250px;font-family:'Courier New',monospace;font-size:13px;resize:vertical}button{background:var(--blue);color:#fff;border:none;padding:13px 18px;border-radius:12px;cursor:pointer;font-weight:bold;margin:6px 6px 6px 0;font-size:15px}.green{background:var(--green)}.section{border:1px solid var(--border);border-radius:14px;padding:20px;margin:15px 0;background:rgba(255,255,255,0.02)}.section h3{font-size:15px;color:var(--muted);margin-bottom:10px}.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1;min-width:120px}.actions{display:flex;gap:10px;flex-wrap:wrap}footer{margin-top:50px;text-align:center;color:#94a3b8}@media(max-width:768px){button,.lang-select{width:100%}}</style></head><body><div class="container"><div class="top-bar"><a href="../index.html">← 返回首页</a><select id="langSelect" class="lang-select"><option value="zh">中文</option><option value="en">English</option></select></div><div class="card"><h1>Robots.txt 生成器</h1><p class="desc">在线生成 robots.txt 文件，控制搜索引擎爬虫访问规则。</p><div class="ad-box">广告位（Google AdSense）</div><div class="section"><h3>基本设置</h3><div class="row"><div><label>网站域名</label><input type="text" id="siteUrl" value="https://example.com" placeholder="https://example.com"></div><div><label>Sitemap 路径（可选）</label><input type="text" id="sitemapUrl" value="/sitemap.xml" placeholder="/sitemap.xml"></div></div></div><div class="section"><h3>爬虫行为（每行一个规则）</h3><label>允许的路径</label><input type="text" id="allowPaths" value="/, /public/" placeholder="用逗号分隔"><label>禁止的路径</label><input type="text" id="disallowPaths" value="/admin/, /private/, /temp/" placeholder="用逗号分隔"><label>爬虫延迟（秒）</label><input type="number" id="crawlDelay" value="5" min="0"></div><div class="actions"><button onclick="generateRobots()">生成 robots.txt</button><button onclick="copyResult()" class="green">复制</button><button onclick="downloadResult()">下载</button></div><textarea id="resultBox" readonly placeholder="生成的 robots.txt 内容将显示在这里..."></textarea></div><footer>© 2026 ZenTools</footer></div><script>function generateRobots(){const url=document.getElementById('siteUrl').value.trim();const sitemap=document.getElementById('sitemapUrl').value.trim();const allow=document.getElementById('allowPaths').value.split(',').map(function(s){return s.trim();}).filter(function(s){return s;});const disallow=document.getElementById('disallowPaths').value.split(',').map(function(s){return s.trim();}).filter(function(s){return s;});const delay=parseFloat(document.getElementById('crawlDelay').value)||0;let output='# robots.txt for '+url+'\n# Generated by ZenTools\n\nUser-agent: *\n';allow.forEach(function(p){if(p)output+='Allow: '+p+'\n';});disallow.forEach(function(p){if(p)output+='Disallow: '+p+'\n';});if(delay>0)output+='Crawl-delay: '+delay+'\n';if(sitemap)output+='\nSitemap: '+url.replace(/\/+$/,'')+'/'+sitemap.replace(/^\//,'')+'\n';document.getElementById('resultBox').value=output;}function copyResult(){const t=document.getElementById('resultBox');t.select();document.execCommand('copy');alert('已复制到剪贴板');}function downloadResult(){const t=document.getElementById('resultBox').value;if(!t){alert('请先生成 robots.txt');return;}const b=new Blob([t],{type:'text/plain'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='robots.txt';a.click();}</script></body></html>
