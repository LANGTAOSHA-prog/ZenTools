llow: '+p+'\n';});if(delay>0)output+='Crawl-delay: '+delay+'\n';if(sitemap)output+='\nSitemap: '+url.replace(/\/+$/,'')+'/'+sitemap.replace(/^\//,'')+'\n';document.getElementById('resultBox').value=output;}function copyResult(){const t=document.getElementById('resultBox');t.select();document.execCommand('copy');alert('已复制到剪贴板');}function downloadResult(){const t=document.getElementById('resultBox').value;if(!t){alert('请先生成 robots.txt');return;}const b=new Blob([t],{type:'text/plain'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='robots.txt';a.click();}</script>
