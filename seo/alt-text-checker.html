<script>

function checkAlt() {
  const html = document.getElementById('altHtml').value;
  if (!html.trim()) { alert('请粘贴 HTML 代码'); return; }
  const imgRegex = /<img[^>]*>/gi;
  const imgs = [];
  let match;
  while ((match = imgRegex.exec(html)) !== null) imgs.push(match[0]);
  if (imgs.length === 0) {
    document.getElementById('altResult').style.display = 'block';
    document.getElementById('altResult').textContent = '未找到任何 <img> 标签';
    return;
  }
  let hasAlt = 0, missingAlt = 0, emptyAlt = 0, result = '';
  imgs.forEach((img, i) => {
    const altMatch = img.match(/alt=["']([^"']*)["']/i);
    const srcMatch = img.match(/src=["']([^"']*)["']/i);
    const src = srcMatch ? srcMatch[1] : '(无 src)';
    if (altMatch) {
      if (altMatch[1].trim()) {
        hasAlt++;
        result += '✅ 图' + (i+1) + ': alt="' + altMatch[1] + '"\t(src: ' + src + ')\n';
      } else {
        emptyAlt++;
        result += '⚠️ 图' + (i+1) + ': alt 为空!\t(src: ' + src + ')\n';
      }
    } else {
      missingAlt++;
      result += '❌ 图' + (i+1) + ': 缺少 alt!\t(src: ' + src + ')\n';
    }
  });
  result += '\n--- 统计 ---\n';
  result += '✅ 有 Alt: ' + hasAlt + ' | ⚠️ 空 Alt: ' + emptyAlt + ' | ❌ 缺少 Alt: ' + missingAlt + '\n';
  result += '总计 ' + imgs.length + ' 张图片';
  const el = document.getElementById('altResult');
  el.style.display = 'block';
  el.textContent = result;
}
</script>
