<script>
function getMsg(k){const l=localStorage.getItem('zentools_lang')||'zh';return((window.ZT_PAGE||{})[l]||window.ZT_PAGE.zh)[k]||k;}
const KW_DATABASE={
zh:['在线工具','PDF转换器','图片压缩','视频编辑','格式转换','文件压缩','文本处理','图片编辑','音频转换','二维码生成','OCR识别','视频转GIF','JSON格式化','密码生成','单位换算','计算器在线','截图工具','屏幕录制','文件分割','批量重命名'],
en:['online tools','PDF converter','image compressor','video editor','format converter','file compressor','text processor','image editor','audio converter','QR code generator','OCR tool','video to GIF','JSON formatter','password generator','unit converter','online calculator','screenshot tool','screen recorder','file splitter','batch rename'],
ja:['オンラインツール','PDF変換','画像圧縮','動画編集','形式変換','ファイル圧縮','テキスト処理','画像編集','音声変換','QRコード生成','OCRツール','動画からGIF','JSONフォーマット','パスワード生成','単位変換','オンライン計算機','スクリーンショット','画面録画','ファイル分割','一括名前変更'],
vi:['công cụ trực tuyến','chuyển đổi PDF','nén ảnh','chỉnh sửa video','chuyển đổi định dạng','nén file','xử lý văn bản','chỉnh sửa ảnh','chuyển đổi âm thanh','tạo mã QR','công cụ OCR','video sang GIF','định dạng JSON','tạo mật khẩu','chuyển đổi đơn vị','máy tính trực tuyến','chụp màn hình','ghi màn hình','tách file','đổi tên hàng loạt']
};
function genKeywords(seed){const lang=localStorage.getItem('zentools_lang')||'zh';const base=KW_DATABASE[lang]||KW_DATABASE.zh;const results=[];for(let i=0;i<base.length;i++){const kw=base[i];if(kw===seed)continue;const vol=Math.floor(Math.random()*50000)+100;const diff=Math.floor(Math.random()*100);const trend=Math.floor(Math.random()*100);results.push({keyword:seed+' '+kw,volume:vol,difficulty:diff,trend:trend});}return results.slice(0,20);}
function getDiffClass(d){if(d<30)return'diff-low';if(d<60)return'diff-med';return'diff-high';}
function getDiffLabel(d){const l=localStorage.getItem('zentools_lang')||'zh';if(d<30)return l==='zh'?'容易':l==='en'?'Easy':l==='ja'?'簡単':'Dễ';if(d<60)return l==='zh'?'中等':l==='en'?'Medium':l==='ja'?'普通':'Trung bình';return l==='zh'?'困难':l==='en'?'Hard':l==='ja'?'難しい':'Khó';}
function renderResults(kws){const body=document.getElementById('resultBody');let html='';kws.forEach(k=>{html+=`<tr><td>${k.keyword}</td><td>${k.volume.toLocaleString()}</td><td><span class="difficulty ${getDiffClass(k.difficulty)}">${k.difficulty}</span></td><td>${k.trend}%</td></tr>`;});body.innerHTML=html;const avg=kws.reduce((s,k)=>s+k.volume,0)/kws.length;document.getElementById('avgVolume').textContent=getMsg('avgVol')+': '+Math.round(avg).toLocaleString();document.getElementById('resultArea').style.display='block';document.querySelector('[data-i18n="resultCount"]').textContent=getMsg('resultCount')+': '+kws.length;}
function researchKeywords(){const seed=document.getElementById('seedInput').value.trim();if(!seed){showMsg(getMsg('msgEmpty'),'error');return;}const kws=genKeywords(seed);if(kws.length===0){showMsg(getMsg('msgNoResult'),'error');return;}renderResults(kws);showMsg('','');}
function showMsg(m,type){const e=document.getElementById('errorMsg');e.textContent=m;e.className='tool-msg'+(type?' '+type:'');}
function clearAll(){document.getElementById('seedInput').value='';document.getElementById('resultArea').style.display='none';showMsg('','');}
function exportCSV(){const rows=[['Keyword','Volume','Difficulty','Trend']];document.querySelectorAll('#resultBody tr').forEach(r=>{const cells=r.querySelectorAll('td');rows.push([cells[0].textContent,cells[1].textContent,cells[2].textContent,cells[3].textContent]);});const csv=rows.map(r=>r.map(c=>'"'+c.replace(/"/g,'""')+'"').join(',')).join('\n');const blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='keywords.csv';a.click();}
</script>

var x=new XMLHttpRequest();x.open('GET','/data/tools-data.json?'+Date.now());x.onload=function(){try{var d=JSON.parse(x.responseText);var cat=d.categories||[];var path=window.location.pathname.replace(/\/+$/,'');var curr=d.tools.find(function(t){return t.url===path||t.url===path+'.html';});if(!curr)return;var same=d.tools.filter(function(t){return t.category===curr.category&&t.url!==curr.url;}).slice(0,6);if(same.length===0)return;var lang=localStorage.getItem('zentools_lang')||'zh';var tn=function(t,l){if(l==='zh')return t.name;return t['name__'+l]||t['name__en']||t.name;};var catName=curr.category;cat.forEach(function(c,i){if(c===curr.category){var maps={en:d.categories__en,ja:d.categories__ja,vi:d.categories__vi};if(maps[lang]&&maps[lang][i])catName=maps[lang][i];}});var html='<div style="max-width:1000px;margin:30px auto;padding:0 20px"><h3 style="color:#6b7a9f;font-size:14px;font-weight:700;margin-bottom:14px;letter-spacing:0.5px">📌 相关'+(catName||'')+'工具</h3><div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px">';same.forEach(function(t){var name=tn(t,lang);var icon=t.icon||'🔧';html+='<a href="'+t.url+'" style="display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:12px;border:1px solid rgba(255,255,255,0.06);background:rgba(255,255,255,0.03);color:#f0f4ff;text-decoration:none;font-size:13px;font-weight:500;transition:background 0.2s" onmouseover="this.style.background=\'rgba(255,255,255,0.08)\'" onmouseout="this.style.background=\'rgba(255,255,255,0.03)\'"><span style="font-size:16px">'+icon+'</span><span>'+name+'</span></a>';});html+='</div></div>';var footer=document.querySelector('footer');if(footer)footer.insertAdjacentHTML('beforebegin',html);else document.body.insertAdjacentHTML('beforeend',html);}catch(e){}};x.send();})();
