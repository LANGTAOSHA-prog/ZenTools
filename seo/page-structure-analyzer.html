<script>

function analyzeStructure() {
  const html = document.getElementById('structHtml').value;
  if (!html.trim()) { alert('请粘贴 HTML 代码'); return; }
  const checks = {
    'DOCTYPE': /<!DOCTYPE/i.test(html),
    'html lang': /html[^>]+lang=/i.test(html),
    'charset': /charset/i.test(html),
    'viewport': /viewport/i.test(html),
    'title': /<title>[\s\S]*?<\/title>/i.test(html),
    'meta description': /<meta[^>]*name=["']description["']/i.test(html),
    'canonical': /rel=["']canonical["']/i.test(html),
    'favicon': /favicon/i.test(html),
    'H1 标题': /<h1[^>]*>/i.test(html),
    '结构化数据': /application\/ld\+json/i.test(html),
    'Open Graph': /og:title/i.test(html),
    'sitemap 引用': /sitemap/i.test(html.toLowerCase()),
    'CSS 文件': /<link[^>]*rel=["']stylesheet["']/i.test(html),
    'JS 文件': /<script[^>]*src=/i.test(html)
  };
  let score = 0, total = Object.keys(checks).length;
  let result = '📋 SEO 结构检查结果\n' + '='.repeat(30) + '\n\n';
  Object.entries(checks).forEach(([name, ok]) => {
    result += (ok ? '✅' : '❌') + ' ' + name + '\n';
    if (ok) score++;
  });
  const pct = Math.round(score/total*100);
  result += '\n---\n得分: ' + score + '/' + total + ' (' + pct + '%)\n';
  if (pct >= 90) result += '🌟 SEO 基础结构优秀！';
  else if (pct >= 70) result += '👍 SEO 结构良好，可补充缺失项';
  else result += '🔧 建议补充缺失的 SEO 元素';
  const el = document.getElementById('structResult');
  el.style.display = 'block';
  el.textContent = result;
}
</script>
