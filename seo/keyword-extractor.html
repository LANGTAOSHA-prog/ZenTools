<script>

function extractKeywords() {
  const text = document.getElementById('kwText').value.trim();
  if (!text) { alert('请输入文本'); return; }
  const stopRaw = document.getElementById('stopWords').value;
  const stops = stopRaw ? stopRaw.split(/[,，\s]+/).map(s => s.trim()).filter(Boolean) : [];
  const defaultStops = ['的','了','在','是','我','有','和','就','不','人','都','一','一个','上','也','很','到','说','要','去','你','会','着','没有','看','好','自己','这','他','她','它','们','那','又','但','而','或','与','被','把','对','从','以','及','之','将','为','能','做','等'];
  const allStops = [...new Set([...stops, ...defaultStops])];
  const words = text.match(/[\u4e00-\u9fff\w]+/g) || [];
  const freq = {};
  words.forEach(w => {
    if (w.length < 2 || allStops.includes(w)) return;
    if (/^\d+$/.test(w)) return;
    freq[w] = (freq[w] || 0) + 1;
  });
  const sorted = Object.entries(freq).sort((a,b) => b[1]-a[1]);
  const topN = parseInt(document.getElementById('topN').value) || 20;
  const top = sorted.slice(0, topN);
  const total = words.filter(w => w.length >= 2 && !allStops.includes(w)).length;
  let html = '总词数: ' + words.length + ' | 有效关键词数: ' + total + '\n\n';
  html += '排名\t关键词\t频次\t密度\n';
  html += '----\t----\t----\t----\n';
  top.forEach(([w, c], i) => {
    const pct = total > 0 ? (c/total*100).toFixed(2) + '%' : '0%';
    html += (i+1) + '\t' + w + '\t' + c + '\t' + pct + '\n';
  });
  const el = document.getElementById('kwResult');
  el.style.display = 'block';
  el.textContent = html;
}
function clearKW() {
  document.getElementById('kwText').value = '';
  document.getElementById('kwResult').style.display = 'none';
}
</script>
