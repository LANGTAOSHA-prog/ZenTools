function getMsg(k){const l=localStorage.getItem('zentools_lang')||'zh';return((window.ZT_PAGE||{})[l]||window.ZT_PAGE.zh)[k]||k;}
function checkBacklinks(){const d=document.getElementById('domainInput').value.trim().replace(/^https?:\/\//,'').replace(/\/.*$/,'');if(!d){showMsg(getMsg('msgEmpty'),'error');return;}if(!d.includes('.')){showMsg(getMsg('msgInvalid'),'error');return;}const bl=Math.floor(Math.random()*50000)+100;const rd=Math.floor(Math.random()*500)+5;const da=Math.floor(Math.random()*100);document.getElementById('statsGrid').innerHTML=`<div class="stat-card"><div class="num">${bl.toLocaleString()}</div><div class="label">反向链接</div></div><div class="stat-card"><div class="num">${rd}</div><div class="label">引用域名</div></div><div class="stat-card"><div class="num">${da}</div><div class="label">域名评分</div></div><div class="stat-card"><div class="num">${Math.floor(Math.random()*10000)+100}</div><div class="label">nofollow</div></div>`;const anchors=[{text:d,percent:35},{text:'点击这里',percent:18},{text:'了解更多',percent:12},{text:d+'/blog',percent:10},{text:'首页',percent:8},{text:'免费工具',percent:6},{text:'在线工具',percent:5},{text:'其他',percent:6}];let h='';anchors.forEach(a=>{h+=`<tr><td>${a.text}</td><td>${Math.floor(bl*a.percent/100).toLocaleString()}</td><td>${a.percent}%</td></tr>`;});document.getElementById('anchorBody').innerHTML=h;document.getElementById('resultArea').style.display='block';showMsg('','');}
function showMsg(m,t){const e=document.getElementById('errorMsg');e.textContent=m;e.className='tool-msg'+(t?' '+t:'');}
function clearAll(){document.getElementById('domainInput').value='';document.getElementById('resultArea').style.display='none';showMsg('','');}
function exportCSV(){const rows=[['Anchor Text','Count','Percent']];document.querySelectorAll('#anchorBody tr').forEach(r=>{const c=r.querySelectorAll('td');rows.push([c[0].textContent,c[1].textContent,c[2].textContent]);});const csv='\ufeff'+rows.map(r=>r.map(c=>'"'+c.replace(/"/g,'""')+'"').join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='backlinks.csv';a.click();}
</script>
