<script>
function getMsg(k){const l=localStorage.getItem('zentools_lang')||'zh';return((window.ZT_PAGE||{})[l]||window.ZT_PAGE.zh)[k]||k;}
let currentXml='';
function generateSitemap(){const raw=document.getElementById('urlInput').value.trim();if(!raw){showMsg(getMsg('msgEmpty'),'error');return;}const urls=raw.split('\n').map(u=>u.trim()).filter(u=>u.length>0&&/^https?:\/\//.test(u));if(urls.length===0){showMsg(getMsg('msgInvalid'),'error');return;}const now=new Date().toISOString().split('T')[0];let xml='<?xml version="1.0" encoding="UTF-8"?>\n<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">\n';urls.forEach(u=>{xml+='  <url>\n    <loc>'+u+'</loc>\n    <lastmod>'+now+'</lastmod>\n    <changefreq>weekly</changefreq>\n    <priority>0.8</priority>\n  </url>\n';});xml+='</urlset>';currentXml=xml;document.getElementById('urlCount').textContent=urls.length+' URL(s)';document.getElementById('xmlOutput').textContent=xml;document.getElementById('resultArea').style.display='block';showMsg('','');}
function showMsg(m,t){const e=document.getElementById('errorMsg');e.textContent=m;e.className='tool-msg'+(t?' '+t:'');}
function clearAll(){document.getElementById('urlInput').value='';document.getElementById('resultArea').style.display='none';showMsg('','');currentXml='';}
function downloadSitemap(){if(!currentXml){showMsg('先生成Sitemap','error');return;}const blob=new Blob(['\ufeff'+currentXml],{type:'text/xml;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='sitemap.xml';a.click();}
</script>
<script>(function(){var s=document.createElement('script');s.src='/data/tools-data.json';s.type='application/json';s.id='toolsDataLoader';document.head.appendChild(s);

</script>
