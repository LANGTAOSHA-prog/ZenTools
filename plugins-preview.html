    // 初始�?
    function init() {
      renderPlugins('all');
      setupFilters();
    }

    // 渲染插件卡片
    function renderPlugins(filter = 'all') {
      const container = document.getElementById('pluginsContainer');
      let filtered = pluginsData;

      if (filter !== 'all') {
        filtered = pluginsData.filter(p => p.category === filter);
      }

      container.innerHTML = filtered.map(plugin => `
        <div class="plugin-card" data-category="${plugin.category}">
          <div class="plugin-header">
            <div class="plugin-icon">${plugin.icon}</div>
            <div class="plugin-title-wrap">
              <h3>${plugin.name}</h3>
              <span class="plugin-category">${plugin.category.toUpperCase()}</span>
            </div>
          </div>
          <div class="plugin-body">
            <p class="plugin-description">${plugin.description}</p>
            <div class="plugin-features">
              ${plugin.features.map(f => `<div class="plugin-feature">${f}</div>`).join('')}
            </div>
          </div>
          <div class="plugin-footer">
            <a href="${plugin.url}" target="_blank">打开工具</a>
          </div>
        </div>
      `).join('');
    }

    // 设置筛选按�?
    function setupFilters() {
      const filterBtns = document.querySelectorAll('.filter-btn');
      filterBtns.forEach(btn => {
        btn.addEventListener('click', function() {
          filterBtns.forEach(b => b.classList.remove('active'));
          this.classList.add('active');
          renderPlugins(this.dataset.filter);
        });
      });
    }

    // 页面加载完成后初始化
    document.addEventListener('DOMContentLoaded', init);
  </script>
